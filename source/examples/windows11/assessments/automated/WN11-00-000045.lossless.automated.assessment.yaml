# Stage-1 lossless conversion of the source OVAL behavior.
# Root OVAL definition: oval:navy.navwar.niwcatlantic.scc.windows:def:253264
assessment:
  id: windows11.WN11-00-000045.lossless
  mode: automated

  collect:
    antivirus_products:
      capability: windows.cmdlet
      select:
        module_name:
          equals: CimCmdlets
        module_id: null
        module_version: null
        verb:
          equals: Get
        noun:
          equals: CimInstance
        parameters:
          classname: antivirusproduct
          namespace: 'root\securitycenter2'
        properties:
          - displayname
          - productstate
      fields:
        - displayname
        - productstate
      # Source OVAL test: oval:navy.navwar.niwcatlantic.scc.windows:tst:25326401
      # Source OVAL object: oval:navy.navwar.niwcatlantic.scc.windows:obj:25326401

  assert:
    source: antivirus_products
    existence: at_least_one_exists
    check: all
    condition:
      record:
        entity_check: at_least_one
        fields:
          productstate:
            datatype: integer
            operation: bitwise_and
            value: 4096
    # Source OVAL state: oval:navy.navwar.niwcatlantic.scc.windows:ste:25326401

  results:
    failure_examples:
      maximum: 10
      fields: [displayname, productstate]
      include_reason: true
