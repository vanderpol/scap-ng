# Stage-1 lossless conversion of the CPE applicability condition
# xccdf_navy.navwar.niwcatlantic.scc_platform_camerainstallation.
# Root OVAL definition: oval:navy.navwar.niwcatlantic.scc.windows:def:201
assessment:
  id: windows.camera-installed
  mode: automated

  collect:
    camera_devices:
      capability: independent.shellcommand
      select:
        shell:
          equals: powershell
        command:
          equals: '(Get-PnpDevice -class camera -status OK).class'
      filter:
        include:
          field: stdout_line
          operation: case_insensitive_equals
          value: Camera
      fields:
        - stdout_line
      # Source OVAL test: oval:navy.navwar.niwcatlantic.scc.windows:tst:201
      # Source OVAL object: oval:navy.navwar.niwcatlantic.scc.windows:obj:201
      # Source OVAL filter state: oval:navy.navwar.niwcatlantic.scc.windows:ste:201

  assert:
    source: camera_devices
    existence: at_least_one_exists
    check: all
