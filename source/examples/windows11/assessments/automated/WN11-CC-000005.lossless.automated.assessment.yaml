# Stage-1 lossless conversion of the source OVAL behavior.
# Root OVAL definition: oval:navy.navwar.niwcatlantic.scc.windows:def:253350
assessment:
  id: windows11.WN11-CC-000005.lossless
  mode: automated

  collect:
    lock_screen_camera_policy:
      capability: windows.registry
      select:
        hive:
          equals: HKEY_LOCAL_MACHINE
        key:
          equals: 'SOFTWARE\Policies\Microsoft\Windows\Personalization'
        name:
          equals: NoLockScreenCamera
      fields:
        - hive
        - key
        - name
        - value
      # Source OVAL test: oval:navy.navwar.niwcatlantic.scc.windows:tst:25335001
      # Source OVAL object: oval:navy.navwar.niwcatlantic.scc.windows:obj:25335001

  assert:
    source: lock_screen_camera_policy
    existence: at_least_one_exists
    check: only_one
    condition:
      field: value
      equals: 1
    # Source OVAL state: oval:navy.navwar.niwcatlantic.scc.windows:ste:25335001

  results:
    failure_examples:
      maximum: 3
      fields: [hive, key, name, value]
      include_reason: true
