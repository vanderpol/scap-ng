# Stage-1 lossless conversion of the source OVAL behavior.
# Root OVAL definition: oval:mil.disa.stig.windows11:def:253284
assessment:
  id: windows11.WN11-00-000150.lossless
  mode: automated

  collect:
    sehop_registry_value:
      capability: windows.registry
      select:
        hive:
          equals: HKEY_LOCAL_MACHINE
        key:
          equals: 'SYSTEM\CurrentControlSet\Control\Session Manager\kernel'
        name:
          equals: DisableExceptionChainValidation
      fields:
        - hive
        - key
        - name
        - type
        - value
      # Source OVAL test: oval:mil.disa.stig.win:tst:25328400
      # Source OVAL object: oval:mil.disa.stig.win:obj:25328400

  assert:
    source: sehop_registry_value
    existence: all_exist
    check: all
    condition:
      all_of:
        - field: type
          equals: reg_dword
        - field: value
          datatype: integer
          equals: 0
    # Source OVAL state: oval:mil.disa.stig.win:ste:20000000

  results:
    failure_examples:
      maximum: 3
      fields: [hive, key, name, type, value]
      include_reason: true
