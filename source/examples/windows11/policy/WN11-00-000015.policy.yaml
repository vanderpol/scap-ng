# Source: Windows 11 STIG V2R10, Rule xccdf_mil.disa.stig_rule_SV-253256r1210280_rule
rule:
  id: WN11-00-000015
  title: Windows 11 systems must have Unified Extensible Firmware Interface (UEFI) firmware and be configured to run in UEFI mode, not Legacy BIOS.
  severity: medium
  revision: 1210280
  identifiers:
    - scheme: disa-vuln-id
      value: V-253256
    - scheme: disa-rule-id
      value: SV-253256r1210280_rule
    - scheme: cci
      value: CCI-002421

  discussion: |-
    UEFI provides additional security features in comparison to legacy BIOS firmware, including Secure Boot. UEFI is required to support additional security features in Windows 11, including virtualization-based Security and Credential Guard. Systems with UEFI that are operating in Legacy BIOS mode will not support these security features.

  remediation: |-
    Configure UEFI firmware to run in UEFI mode, not Legacy BIOS mode.

  assessments:
    - ../assessments/manual/WN11-00-000015.manual.assessment.yaml
    - ../assessments/automated/WN11-00-000015.lossless.automated.assessment.yaml
