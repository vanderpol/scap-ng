# Source: Windows 11 STIG V2R10, Rule xccdf_mil.disa.stig_rule_SV-268318r1210288_rule
rule:
  id: WN11-CC-000063
  title: Windows 11 systems must use either Group Policy or an approved Mobile Device Management (MDM) product to enforce STIG compliance.
  severity: medium
  revision: 1210288
  identifiers:
    - scheme: disa-vuln-id
      value: V-268318
    - scheme: disa-rule-id
      value: SV-268318r1210288_rule
    - scheme: cci
      value: CCI-000366

  discussion: |-
    Without Windows 11 systems being managed, devices could be rogue and become targets of an attacker.

  remediation: |-
    Configure the Windows 11 system to use either Group Policy or an approved MDM product to enforce STIG compliance.

  when: windows.member-workstation

  assessments:
    - ../assessments/manual/WN11-CC-000063.manual.assessment.yaml
    - ../assessments/automated/WN11-CC-000063.lossless.automated.assessment.yaml
