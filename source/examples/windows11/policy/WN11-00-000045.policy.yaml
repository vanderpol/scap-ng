# Source: Windows 11 STIG V2R10.
# XCCDF Rule: xccdf_mil.disa.stig_rule_SV-253264r1186372_rule
rule:
  id: WN11-00-000045
  title: The Windows 11 system must use an antivirus program.
  severity: high

  identifiers:
    - scheme: disa-vuln-id
      value: V-253264
    - scheme: disa-rule-id
      value: SV-253264r1186372_rule
    - scheme: cci
      value: CCI-000366

  discussion: |-
    Malicious software can establish a base on individual desktops and servers. Employing an automated mechanism to detect this type of software will aid in elimination of the software from the operating system.

  remediation: |-
    Install Microsoft Defender Antivirus or a third-party antivirus solution.

  assessments:
    - ../assessments/manual/WN11-00-000045.manual.assessment.yaml
    - ../assessments/automated/WN11-00-000045.lossless.automated.assessment.yaml
