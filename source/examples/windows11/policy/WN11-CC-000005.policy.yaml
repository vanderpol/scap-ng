# Source: Windows 11 STIG V2R10, Rule xccdf_mil.disa.stig_rule_SV-253350r958478_rule
rule:
  id: WN11-CC-000005
  title: Camera access from the lock screen must be disabled.
  severity: medium
  revision: 958478
  identifiers:
    - scheme: disa-vuln-id
      value: V-253350
    - scheme: disa-rule-id
      value: SV-253350r958478_rule
    - scheme: cci
      value: CCI-000381

  discussion: |-
    Enabling camera access from the lock screen could allow for unauthorized use. Requiring logon will ensure the device is only used by authorized personnel.

  remediation: |-
    If the device does not have a camera, this is NA.
    
    Configure the policy value for Computer Configuration >> Administrative Templates >> Control Panel >> Personalization >> "Prevent enabling lock screen camera" to "Enabled".

  when:
    - windows.camera-installed

  assessments:
    - ../assessments/manual/WN11-CC-000005.manual.assessment.yaml
    - ../assessments/automated/WN11-CC-000005.lossless.automated.assessment.yaml
