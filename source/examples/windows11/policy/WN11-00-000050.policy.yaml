# Source: Windows 11 STIG V2R10, Rule xccdf_mil.disa.stig_rule_SV-253265r1137691_rule
rule:
  id: WN11-00-000050
  title: Local volumes must be formatted using NTFS.
  severity: high
  revision: 1137691
  identifiers:
    - scheme: disa-vuln-id
      value: V-253265
    - scheme: disa-rule-id
      value: SV-253265r1137691_rule
    - scheme: cci
      value: CCI-000213

  discussion: |-
    The ability to set access permissions and auditing is critical to maintaining the security and proper access controls of a system. To support this, volumes must be formatted using the NTFS file system.

  remediation: |-
    Format all local volumes to use NTFS.

  assessments:
    - ../assessments/manual/WN11-00-000050.manual.assessment.yaml
    - ../assessments/automated/WN11-00-000050.lossless.automated.assessment.yaml
