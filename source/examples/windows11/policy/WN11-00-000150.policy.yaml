# Source: Windows 11 STIG V2R10.
# XCCDF Rule: xccdf_mil.disa.stig_rule_SV-253284r958928_rule
rule:
  id: WN11-00-000150
  title: Structured Exception Handling Overwrite Protection (SEHOP) must be enabled.
  severity: high

  identifiers:
    - scheme: disa-vuln-id
      value: V-253284
    - scheme: disa-rule-id
      value: SV-253284r958928_rule
    - scheme: cci
      value: CCI-002824

  discussion: |-
    Attackers are constantly looking for vulnerabilities in systems and applications. Structured Exception Handling Overwrite Protection (SEHOP) blocks exploits that use the Structured Exception Handling overwrite technique, a common buffer overflow attack.

  remediation: |-
    Configure the policy value for Computer Configuration >> Administrative Templates >> MS Security Guide >> "Enable Structured Exception Handling Overwrite Protection (SEHOP)" to "Enabled".

    This policy setting requires the installation of the SecGuide custom templates included with the STIG package. "SecGuide.admx" and "SecGuide.adml" must be copied to the \Windows\PolicyDefinitions and \Windows\PolicyDefinitions\en-US directories respectively.

  assessments:
    - ../assessments/manual/WN11-00-000150.manual.assessment.yaml
    - ../assessments/automated/WN11-00-000150.lossless.automated.assessment.yaml
