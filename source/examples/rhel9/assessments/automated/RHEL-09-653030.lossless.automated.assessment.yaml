# Stage-1 lossless conversion of the source OVAL behavior.
# Root OVAL definition: oval:mil.disa.stig.rhel9os:def:258155
# Unlike the native design candidate, this preserves the OVAL arithmetic
# block_size * total_space rather than replacing it with a total_bytes field.
assessment:
  id: rhel9.RHEL-09-653030.lossless
  mode: automated

  collect:
    audit_log_setting:
      capability: independent.textfilecontent54
      select:
        filepath:
          equals: /etc/audit/auditd.conf
        pattern:
          operation: pattern_match
          value: '^\s*log_file\s*=\s*(\S+)/\S+\s*$'
        instance:
          datatype: integer
          operation: greater_than_or_equal
          value: 1
        behaviors:
          ignore_case: true
      fields:
        - filepath
        - text
        - subexpression
        - instance
      # Source OVAL object: oval:mil.disa.stig.ind:obj:23029402

    audit_partition:
      capability: linux.partition
      select:
        mount_point:
          from: audit_log_directories
          var_check: at_least_one
      fields:
        - mount_point
        - block_size
        - total_space
      # Source OVAL object: oval:mil.disa.stig.linux:obj:23029400

  derive:
    audit_log_directories:
      source: audit_log_setting
      field: subexpression
      values: all
      # Source OVAL variable: oval:mil.disa.stig.defs:var:23029400

    audit_partition_total_bytes:
      source: audit_partition
      for_each_item:
        arithmetic:
          operation: multiply
          operands:
            - field: block_size
            - field: total_space
      datatype: integer
      # Source OVAL variable: oval:mil.disa.stig.defs:var:25815500

  assert:
    all_of:
      - source: audit_partition
        existence: all_exist
        check: all
        # Source OVAL test: oval:mil.disa.stig.linux:tst:23029400

      - source: audit_partition_total_bytes
        existence: all_exist
        check: all
        condition:
          datatype: integer
          greater_than_or_equal: 10737418240
        # Source OVAL test: oval:mil.disa.stig.ind:tst:25815500
        # Source OVAL state: oval:mil.disa.stig.ind:ste:25815500

  results:
    failure_examples:
      maximum: 5
      fields: [mount_point, block_size, total_space]
      include_reason: true
