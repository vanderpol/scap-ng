# Stage-1 lossless conversion of the AlmaLinux 9 CPE inventory definition.
# CPE: cpe:/o:almalinux:almalinux:9
# Root OVAL definition: oval:navy.navwar.niwcatlantic.scc.almalinux9:def:301
assessment:
  id: almalinux.9
  mode: automated

  collect:
    os_release_cpe_name:
      capability: independent.textfilecontent54
      select:
        filepath:
          equals: /etc/os-release
        pattern:
          operation: pattern_match
          value: '^CPE_NAME="(.+)"'
        instance:
          datatype: integer
          operation: greater_than_or_equal
          value: 1
      fields:
        - subexpression
      # Source OVAL test: oval:navy.navwar.niwcatlantic.scc.almalinux9:tst:301

  assert:
    source: os_release_cpe_name
    existence: all_exist
    check: all
    condition:
      field: subexpression
      operation: pattern_match
      value: 'almalinux:almalinux:9'
