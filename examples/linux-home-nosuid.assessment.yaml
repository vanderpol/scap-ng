assessment:
  id: linux-home-mount-nosuid-assessment
  version: 1
  assessment_title: Home filesystem has the nosuid mount option
  mode: automated
  class: compliance
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    home-is-mounted-with-the-nosuid-option-test:
      test_title: /home is mounted with the nosuid option.
      capability: linux.partition
      object:
        mount_point: {matches_regex: '.*\/home'}
      require:
        items_found: one_or_more
        items_satisfying: every
        fields:
          mount_options: {equals: nosuid}
        field_requirement: {values_found: one_or_more, values_matching: one_or_more}
      reported_elements: all
  evaluate:
    test: home-is-mounted-with-the-nosuid-option-test
