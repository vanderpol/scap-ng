assessment:
  id: windows-server-2025-shows-on-lock-screen-sv-278080-assessment
  version: 1
  assessment_title: Windows Server 2025 must prevent the display of slide shows on the lock screen.
  mode: automated
  class: compliance
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    verifies-prevent-enabling-screen-slide-show-is-set-enabled-test:
      test_title: Verifies 'Prevent enabling lock screen slide show' is set to 'Enabled'
      capability: windows.registry
      object: {hive: {equals: local_machine}, key: {equals: 'SOFTWARE\Policies\Microsoft\Windows\Personalization'}, name: {equals: NoLockScreenSlideshow}}
      require:
        item_requirement: {items_found: one_or_more, items_satisfying: every}
        field_requirement: {values_found: one_or_more, values_matching: every}
        fields: {type: {equals: dword}, value: {equals: 1}}
      reported_elements: all
  evaluate:
    test: verifies-prevent-enabling-screen-slide-show-is-set-enabled-test
