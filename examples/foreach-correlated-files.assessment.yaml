assessment:
  id: foreach-correlated-files-assessment
  version: 1
  assessment_title: Inspect one file for each source Item
  mode: automated
  class: inventory
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  shared_objects:
    source-files-object:
      object_title: Source file paths
      capability: unix.file
      filepath: {equals: /etc/passwd}
  tests:
    correlated-file-test:
      test_title: Resolve a dependent file once for each source Item.
      capability: unix.file
      object:
        for_each: {item: source, in: source-files-object}
        filepath: {from: source.full_path}
      require:
        item_requirement: {items_found: one_or_more, items_satisfying: every}
        field_requirement: {values_found: one_or_more, values_matching: one_or_more}
        fields: {full_path: {equals: /etc/passwd}}
      reported_elements: all
  evaluate:
    test: correlated-file-test
