assessment:
  id: windows-server-2025-control-permissions-sv-278139-assessment
  version: 1
  assessment_title: Windows Server 2025 Active Directory SYSVOL directory must have the proper access control permissions.
  mode: automated
  class: compliance
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  variables:
    icacls-and-path-to-sysvol-directory-variable:
      kind: local
      expression:
        concat:
        - literal: {datatype: string, value: 'icacls '}
        - regex_capture:
            pattern: '(^[a-zA-Z]:\\.+)\\sysvol'
            value:
              values:
                object: {capability: windows.registry, hive: {equals: local_machine}, key: {equals: 'SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'}, name: {equals: SysVol}}
                field: value
  tests:
    permissions-must-conform-to-minimum-requirements-test:
      test_title: Permissions must conform to minimum requirements.
      capability: independent.shellcommand
      object:
        shell: cmd
        command:
          variable: icacls-and-path-to-sysvol-directory-variable
        pattern: ':'
        error_if_exit_status_not_0: false
        error_if_stderr_exists: false
      require:
        item_requirement: {items_found: one_or_more, items_satisfying: every}
        field_requirement: {values_found: one_or_more, values_matching: every}
        fields:
          exit_status: {equals: 0}
          stdout_line:
            matches_regex:
            - '(?i)NT AUTHORITY\\Authenticated Users:\(RX\)'
            - '(?i)NT AUTHORITY\\Authenticated Users:\(OI\)\(CI\)\(IO\)\(GR,GE\)'
            - '(?i)BUILTIN\\Server Operators:\(RX\)'
            - '(?i)BUILTIN\\Server Operators:\(OI\)\(CI\)\(IO\)\(GR,GE\)'
            - '(?i)BUILTIN\\Administrators:\(M,WDAC,WO\)'
            - '(?i)BUILTIN\\Administrators:\(OI\)\(CI\)\(IO\)\(F\)'
            - '(?i)NT AUTHORITY\\SYSTEM:\(F\)'
            - '(?i)NT AUTHORITY\\SYSTEM:\(OI\)\(CI\)\(IO\)\(F\)'
            - '(?i)CREATOR OWNER:\(OI\)\(CI\)\(IO\)\(F\)'
            value_match: one_or_more
          stderr_line: {values_found: none}
      reported_elements: all
  evaluate:
    test: permissions-must-conform-to-minimum-requirements-test
