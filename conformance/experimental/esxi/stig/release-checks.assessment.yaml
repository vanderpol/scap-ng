assessment:
  id: conformance-experimental-esxi-stig-v2r5
  version: 1
  assessment_title: Experimental ESXi 8.0 account checks
  mode: automated
  class: miscellaneous
  specification: {id: scap-ng.pre-alpha.assessment, version: 0.4.1}
  evaluate:
    and:
      - test: account-lock-threshold-test
      - test: password-history-test
      - test: dcui-shell-access-test
  tests:
    account-lock-threshold-test:
      test_title: The configured account lock threshold equals three
      capability: esx.host_advancedsetting
      object:
        advanced_setting_name: {equals: Security.AccountLockFailures}
      require:
        item_requirement: {items_found: exactly_one, items_satisfying: every}
        field_requirement: {values_found: one_or_more, values_matching: every}
        fields:
          advanced_setting_value: {datatype: integer, equals: 3}
      reported_elements: all
    password-history-test:
      test_title: The password history retains at least five generations
      capability: esx.host_advancedsetting
      object:
        advanced_setting_name: {equals: Security.PasswordHistory}
      require:
        item_requirement: {items_found: exactly_one, items_satisfying: every}
        field_requirement: {values_found: one_or_more, values_matching: every}
        fields:
          advanced_setting_value: {datatype: integer, greater_than_or_equal: 5}
      reported_elements: all
    dcui-shell-access-test:
      test_title: The dcui account has shell access disabled
      capability: esx.host_account
      object:
        account_name: {equals: dcui}
      require:
        item_requirement: {items_found: exactly_one, items_satisfying: every}
        field_requirement: {values_found: one_or_more, values_matching: every}
        fields:
          shell_access_enabled: {datatype: boolean, equals: false}
      reported_elements: all
