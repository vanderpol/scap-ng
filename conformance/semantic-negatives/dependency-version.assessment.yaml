assessment:
  id: conformance-dependency-version
  version: 1
  assessment_title: Dependency expects a different Assessment version
  mode: automated
  class: miscellaneous
  specification: {id: scap-ng.pre-alpha.assessment, version: 0.4.1}
  dependencies:
    scope:
      assessment: conformance-organization-scope
      expected_version: 2
      purpose: applicability
  applicability: {assessment: scope}
  evaluate: {test: local-test}
  tests:
    local-test:
      test_title: This local Test cannot repair the dependency binding
      capability: variable.value
      variable: local-variable
      require:
        item_requirement: {items_found: exactly_one, items_satisfying: every}
        field_requirement: {values_found: one_or_more, values_matching: every}
        fields:
          value: {datatype: integer, equals: 3}
      reported_elements: all
  variables:
    local-variable: {kind: constant, expression: {literal: 3}}
