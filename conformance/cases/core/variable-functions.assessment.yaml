assessment:
  id: conformance-core-variable-functions
  version: 1
  assessment_title: SCAP-NG 0.4.1 Variable function semantics
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  inputs:
    function-value-input:
      datatype: integer
      cardinality: exactly_one
      required: true
      description: Deterministic supplied value for the native input expression witness.
  shared_objects:
    function-family-object:
      object_title: Deterministic family source
      capability: independent.family
  variables:
    source-values-variable:
      kind: constant
      expression:
        literal:
          datatype: string
          value:
          - a
          - a
          - b
    unique-values-variable:
      kind: local
      expression:
        unique:
          variable: source-values-variable
    count-values-variable:
      kind: local
      expression:
        count:
          variable: source-values-variable
    concat-values-variable:
      kind: local
      expression:
        concat:
        - literal: prefix-
        - variable: unique-values-variable
    merge-values-variable:
      kind: local
      expression:
        merge:
          delimiter: ','
          sort: lexical
          order: ascending
          values:
            variable: unique-values-variable
    split-values-variable:
      kind: local
      expression:
        split:
          delimiter: ','
          value:
            literal: a,,b
    regex-capture-values-variable:
      kind: local
      expression:
        regex_capture:
          pattern: ^https://([^/]+)/
          value:
            literal:
            - https://one.example/path
            - https://two.example/
    substring-values-variable:
      kind: local
      expression:
        substring:
          substring_start: 1
          substring_length: 3
          value:
            literal:
            - abcdef
            - xyz
    time-difference-values-variable:
      kind: local
      expression:
        time_difference:
          values:
          - literal: '2026-01-02'
          - literal: '2026-01-01'
          format_1: year_month_day
          format_2: year_month_day
    arithmetic-values-variable:
      kind: local
      expression:
        arithmetic:
          arithmetic_operation: add
          values:
          - literal: 2
          - literal:
            - 3
            - 4
    to-integer-values-variable:
      kind: local
      expression:
        to_integer:
          literal:
          - '007'
          - '-12'
    begin-values-variable:
      kind: local
      expression:
        begin:
          character: /
          value:
            literal:
            - etc
            - /var
    end-values-variable:
      kind: local
      expression:
        end:
          character: /
          value:
            literal:
            - etc
            - var/
    input-values-variable:
      kind: local
      expression:
        input: function-value-input
    collected-values-variable:
      kind: local
      expression:
        values:
          object:
            object_ref: function-family-object
          field: family
    expected-unique-variable:
      kind: constant
      expression:
        literal:
          datatype: string
          value:
          - a
          - b
    expected-count-variable:
      kind: constant
      expression:
        literal:
          datatype: integer
          value: 3
    expected-concat-variable:
      kind: constant
      expression:
        literal:
          datatype: string
          value:
          - prefix-a
          - prefix-b
    expected-merge-variable:
      kind: constant
      expression:
        literal:
          datatype: string
          value: a,b
    expected-split-variable:
      kind: constant
      expression:
        literal:
          datatype: string
          value:
          - a
          - ''
          - b
    expected-regex-capture-variable:
      kind: constant
      expression:
        literal:
          datatype: string
          value:
          - one.example
          - two.example
    expected-substring-variable:
      kind: constant
      expression:
        literal:
          datatype: string
          value:
          - abc
          - xyz
    expected-time-difference-variable:
      kind: constant
      expression:
        literal:
          datatype: integer
          value: 86400
    expected-arithmetic-variable:
      kind: constant
      expression:
        literal:
          datatype: integer
          value:
          - 5
          - 6
    expected-to-integer-variable:
      kind: constant
      expression:
        literal:
          datatype: integer
          value:
          - 7
          - -12
    expected-begin-variable:
      kind: constant
      expression:
        literal:
          datatype: string
          value:
          - /etc
          - /var
    expected-end-variable:
      kind: constant
      expression:
        literal:
          datatype: string
          value:
          - etc/
          - var/
    expected-input-variable:
      kind: constant
      expression:
        literal:
          datatype: integer
          value: 7
    expected-collected-variable:
      kind: constant
      expression:
        literal:
          datatype: string
          value:
          - unix
          - windows
    function-unique-ordered-variable:
      kind: local
      expression:
        merge:
          delimiter: '|'
          sort: document
          order: ascending
          values:
            variable: unique-values-variable
    function-concat-ordered-variable:
      kind: local
      expression:
        merge:
          delimiter: '|'
          sort: document
          order: ascending
          values:
            variable: concat-values-variable
    function-split-ordered-variable:
      kind: local
      expression:
        merge:
          delimiter: '|'
          sort: document
          order: ascending
          values:
            variable: split-values-variable
    function-regex-capture-ordered-variable:
      kind: local
      expression:
        merge:
          delimiter: '|'
          sort: document
          order: ascending
          values:
            variable: regex-capture-values-variable
    function-substring-ordered-variable:
      kind: local
      expression:
        merge:
          delimiter: '|'
          sort: document
          order: ascending
          values:
            variable: substring-values-variable
    function-arithmetic-ordered-variable:
      kind: local
      expression:
        merge:
          delimiter: '|'
          sort: document
          order: ascending
          values:
            variable: arithmetic-values-variable
    function-to-integer-ordered-variable:
      kind: local
      expression:
        merge:
          delimiter: '|'
          sort: document
          order: ascending
          values:
            variable: to-integer-values-variable
    function-begin-ordered-variable:
      kind: local
      expression:
        merge:
          delimiter: '|'
          sort: document
          order: ascending
          values:
            variable: begin-values-variable
    function-end-ordered-variable:
      kind: local
      expression:
        merge:
          delimiter: '|'
          sort: document
          order: ascending
          values:
            variable: end-values-variable
    function-values-ordered-variable:
      kind: local
      expression:
        merge:
          delimiter: '|'
          sort: document
          order: ascending
          values:
            variable: collected-values-variable
  tests:
    function-unique-test:
      test_title: Unique removes duplicate values preserving first occurrence
      capability: variable.value
      reported_elements: all
      variable: unique-values-variable
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          value:
            value_match: exactly_one
            values_found: one_or_more
            values_matching: every
            equals:
              variable: expected-unique-variable
    function-count-test:
      test_title: Count counts duplicate values
      capability: variable.value
      reported_elements: all
      variable: count-values-variable
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          value:
            value_match: every
            values_found: one_or_more
            values_matching: every
            equals:
              variable: expected-count-variable
    function-concat-test:
      test_title: Concat preserves ordered Cartesian values
      capability: variable.value
      reported_elements: all
      variable: concat-values-variable
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          value:
            value_match: exactly_one
            values_found: one_or_more
            values_matching: every
            equals:
              variable: expected-concat-variable
    function-merge-test:
      test_title: Merge sorts and joins values
      capability: variable.value
      reported_elements: all
      variable: merge-values-variable
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          value:
            value_match: every
            values_found: one_or_more
            values_matching: every
            equals:
              variable: expected-merge-variable
    function-split-test:
      test_title: Split preserves adjacent empty parts
      capability: variable.value
      reported_elements: all
      variable: split-values-variable
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          value:
            value_match: exactly_one
            values_found: one_or_more
            values_matching: every
            equals:
              variable: expected-split-variable
    function-regex-capture-test:
      test_title: Regex capture returns the first group per value
      capability: variable.value
      reported_elements: all
      variable: regex-capture-values-variable
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          value:
            value_match: exactly_one
            values_found: one_or_more
            values_matching: every
            equals:
              variable: expected-regex-capture-variable
    function-substring-test:
      test_title: Substring uses the explicit one-based source boundary
      capability: variable.value
      reported_elements: all
      variable: substring-values-variable
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          value:
            value_match: exactly_one
            values_found: one_or_more
            values_matching: every
            equals:
              variable: expected-substring-variable
    function-time-difference-test:
      test_title: Time difference returns UTC seconds
      capability: variable.value
      reported_elements: all
      variable: time-difference-values-variable
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          value:
            value_match: every
            values_found: one_or_more
            values_matching: every
            equals:
              variable: expected-time-difference-variable
    function-arithmetic-test:
      test_title: Arithmetic preserves Cartesian multiplicity
      capability: variable.value
      reported_elements: all
      variable: arithmetic-values-variable
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          value:
            value_match: exactly_one
            values_found: one_or_more
            values_matching: every
            equals:
              variable: expected-arithmetic-variable
    function-to-integer-test:
      test_title: To-integer converts signed decimal strings elementwise
      capability: variable.value
      reported_elements: all
      variable: to-integer-values-variable
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          value:
            value_match: exactly_one
            values_found: one_or_more
            values_matching: every
            equals:
              variable: expected-to-integer-variable
    function-begin-test:
      test_title: Begin adds a missing leading boundary and preserves an existing
        one
      capability: variable.value
      reported_elements: all
      variable: begin-values-variable
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          value:
            value_match: exactly_one
            values_found: one_or_more
            values_matching: every
            equals:
              variable: expected-begin-variable
    function-end-test:
      test_title: End adds a missing trailing boundary and preserves an existing one
      capability: variable.value
      reported_elements: all
      variable: end-values-variable
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          value:
            value_match: exactly_one
            values_found: one_or_more
            values_matching: every
            equals:
              variable: expected-end-variable
    function-input-test:
      test_title: Input expression retains the supplied typed binding
      capability: variable.value
      reported_elements: all
      variable: input-values-variable
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          value:
            value_match: every
            values_found: one_or_more
            values_matching: every
            equals:
              variable: expected-input-variable
    function-values-test:
      test_title: Values projects the selected field from collected Items
      capability: variable.value
      reported_elements: all
      variable: collected-values-variable
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          value:
            value_match: exactly_one
            values_found: one_or_more
            values_matching: every
            equals:
              variable: expected-collected-variable
    function-unique-ordered-test:
      test_title: Unique removes duplicate values preserving first occurrence in exact
        document order
      capability: variable.value
      reported_elements: all
      variable: function-unique-ordered-variable
      require:
        item_requirement:
          items_found: exactly_one
          items_satisfying: every
        field_requirement:
          values_found: exactly_one
          values_matching: every
        fields:
          value:
            equals: a|b
    function-concat-ordered-test:
      test_title: Concat preserves ordered Cartesian values in exact document order
      capability: variable.value
      reported_elements: all
      variable: function-concat-ordered-variable
      require:
        item_requirement:
          items_found: exactly_one
          items_satisfying: every
        field_requirement:
          values_found: exactly_one
          values_matching: every
        fields:
          value:
            equals: prefix-a|prefix-b
    function-split-ordered-test:
      test_title: Split preserves adjacent empty parts in exact document order
      capability: variable.value
      reported_elements: all
      variable: function-split-ordered-variable
      require:
        item_requirement:
          items_found: exactly_one
          items_satisfying: every
        field_requirement:
          values_found: exactly_one
          values_matching: every
        fields:
          value:
            equals: a||b
    function-regex-capture-ordered-test:
      test_title: Regex capture returns the first group per value in exact document
        order
      capability: variable.value
      reported_elements: all
      variable: function-regex-capture-ordered-variable
      require:
        item_requirement:
          items_found: exactly_one
          items_satisfying: every
        field_requirement:
          values_found: exactly_one
          values_matching: every
        fields:
          value:
            equals: one.example|two.example
    function-substring-ordered-test:
      test_title: Substring uses the explicit one-based source boundary in exact document
        order
      capability: variable.value
      reported_elements: all
      variable: function-substring-ordered-variable
      require:
        item_requirement:
          items_found: exactly_one
          items_satisfying: every
        field_requirement:
          values_found: exactly_one
          values_matching: every
        fields:
          value:
            equals: abc|xyz
    function-arithmetic-ordered-test:
      test_title: Arithmetic preserves Cartesian multiplicity in exact document order
      capability: variable.value
      reported_elements: all
      variable: function-arithmetic-ordered-variable
      require:
        item_requirement:
          items_found: exactly_one
          items_satisfying: every
        field_requirement:
          values_found: exactly_one
          values_matching: every
        fields:
          value:
            equals: 5|6
    function-to-integer-ordered-test:
      test_title: To-integer converts signed decimal strings elementwise in exact
        document order
      capability: variable.value
      reported_elements: all
      variable: function-to-integer-ordered-variable
      require:
        item_requirement:
          items_found: exactly_one
          items_satisfying: every
        field_requirement:
          values_found: exactly_one
          values_matching: every
        fields:
          value:
            equals: 7|-12
    function-begin-ordered-test:
      test_title: Begin adds a missing leading boundary and preserves an existing
        one in exact document order
      capability: variable.value
      reported_elements: all
      variable: function-begin-ordered-variable
      require:
        item_requirement:
          items_found: exactly_one
          items_satisfying: every
        field_requirement:
          values_found: exactly_one
          values_matching: every
        fields:
          value:
            equals: /etc|/var
    function-end-ordered-test:
      test_title: End adds a missing trailing boundary and preserves an existing one
        in exact document order
      capability: variable.value
      reported_elements: all
      variable: function-end-ordered-variable
      require:
        item_requirement:
          items_found: exactly_one
          items_satisfying: every
        field_requirement:
          values_found: exactly_one
          values_matching: every
        fields:
          value:
            equals: etc/|var/
    function-values-ordered-test:
      test_title: Values projects the selected field from collected Items in exact
        document order
      capability: variable.value
      reported_elements: all
      variable: function-values-ordered-variable
      require:
        item_requirement:
          items_found: exactly_one
          items_satisfying: every
        field_requirement:
          values_found: exactly_one
          values_matching: every
        fields:
          value:
            equals: unix|windows
  evaluate:
    and:
    - test: function-unique-test
    - test: function-count-test
    - test: function-concat-test
    - test: function-merge-test
    - test: function-split-test
    - test: function-regex-capture-test
    - test: function-substring-test
    - test: function-time-difference-test
    - test: function-arithmetic-test
    - test: function-to-integer-test
    - test: function-begin-test
    - test: function-end-test
    - test: function-input-test
    - test: function-values-test
    - test: function-unique-ordered-test
    - test: function-concat-ordered-test
    - test: function-split-ordered-test
    - test: function-regex-capture-ordered-test
    - test: function-substring-ordered-test
    - test: function-arithmetic-ordered-test
    - test: function-to-integer-ordered-test
    - test: function-begin-ordered-test
    - test: function-end-ordered-test
    - test: function-values-ordered-test
