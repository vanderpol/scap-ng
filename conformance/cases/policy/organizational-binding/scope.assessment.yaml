assessment:
  id: conformance-organization-scope
  version: 1
  assessment_title: Shared applicability condition
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  evaluate:
    test: in-scope-test
  tests:
    in-scope-test:
      test_title: The fixture target is in scope
      capability: variable.value
      variable: scope-variable
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          value:
            equals: selected
      reported_elements: compared
  variables:
    scope-variable:
      kind: constant
      expression:
        literal: selected
