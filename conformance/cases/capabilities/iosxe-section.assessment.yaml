assessment:
  id: conformance-iosxe-section
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: iosxe.section positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    iosxe-section-test:
      test_title: Collect and match every declared iosxe.section field
      capability: iosxe.section
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          section_command:
            equals: fixture-value
          section_config_lines:
            equals: fixture-value
          config_line:
            equals: fixture-value
      reported_elements: all
      object:
        capability: iosxe.section
        section_command:
          equals: fixture-value
  evaluate:
    test: iosxe-section-test
