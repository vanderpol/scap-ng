assessment:
  id: conformance-ios-version55
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: ios.version55 positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    ios-version55-test:
      test_title: Collect and match every declared ios.version55 field
      capability: ios.version55
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          major_version:
            equals: 7
          minor_version:
            equals: 7
          release:
            equals: 7
          train_identifier:
            equals: fixture-value
          rebuild:
            equals: 7
          subrebuild:
            equals: fixture-value
          mainline_rebuild:
            equals: fixture-value
          version_string:
            equals: fixture-value
      reported_elements: all
  evaluate:
    test: ios-version55-test
