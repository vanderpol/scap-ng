assessment:
  id: conformance-windows-cmdlet
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: windows.cmdlet positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    windows-cmdlet-test:
      test_title: Collect and match every declared windows.cmdlet field
      capability: windows.cmdlet
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          module_name:
            equals: fixture-value
          module_id:
            equals: fixture-value
          module_version:
            equals: 1.2.3
          verb:
            equals: fixture-value
          noun:
            equals: fixture-value
          parameters:
            record:
              records_found: one_or_more
              records_matching: every
              fields:
                fixture_field:
                  values_found: one_or_more
                  values_matching: every
                  equals: fixture-value
          select:
            record:
              records_found: one_or_more
              records_matching: every
              fields:
                fixture_field:
                  values_found: one_or_more
                  values_matching: every
                  equals: fixture-value
          value:
            record:
              records_found: one_or_more
              records_matching: every
              fields:
                fixture_field:
                  values_found: one_or_more
                  values_matching: every
                  equals: fixture-value
      reported_elements: all
      object:
        capability: windows.cmdlet
  evaluate:
    test: windows-cmdlet-test
