assessment:
  id: conformance-linux-apparmorstatus
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: linux.apparmorstatus positive and
    status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    linux-apparmorstatus-test:
      test_title: Collect and match every declared linux.apparmorstatus field
      capability: linux.apparmorstatus
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          loaded_profiles_count:
            equals: 7
          enforce_mode_profiles_count:
            equals: 7
          complain_mode_profiles_count:
            equals: 7
          processes_with_profiles_count:
            equals: 7
          enforce_mode_processes_count:
            equals: 7
          complain_mode_processes_count:
            equals: 7
          unconfined_processes_with_profiles_count:
            equals: 7
      reported_elements: all
  evaluate:
    test: linux-apparmorstatus-test
