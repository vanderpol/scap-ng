assessment:
  id: conformance-linux-dpkginfo
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: linux.dpkginfo positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    linux-dpkginfo-test:
      test_title: Collect and match every declared linux.dpkginfo field
      capability: linux.dpkginfo
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          name:
            equals: fixture-value
          arch:
            equals: fixture-value
          epoch:
            equals: fixture-value
          release:
            equals: fixture-value
          version:
            equals: fixture-value
          evr:
            equals: 1:1.2.3-7
      reported_elements: all
      object:
        capability: linux.dpkginfo
        name:
          equals: fixture-value
  evaluate:
    test: linux-dpkginfo-test
