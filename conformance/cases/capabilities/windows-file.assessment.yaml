assessment:
  id: conformance-windows-file
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: windows.file positive and status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    windows-file-test:
      test_title: Collect and match every declared windows.file field
      capability: windows.file
      object:
        capability: windows.file
        filepath:
          equals: fixture-value
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          filepath:
            equals: fixture-value
          path:
            equals: fixture-value
          filename:
            equals: fixture-value
          owner:
            equals: fixture-value
          size:
            equals: 7
          a_time:
            equals: fixture-value
          c_time:
            equals: fixture-value
          m_time:
            equals: fixture-value
          ms_checksum:
            equals: fixture-value
          version:
            equals: 1.2.3
          type:
            equals: fixture-value
          attribute:
            equals: fixture-value
          development_class:
            equals: fixture-value
          company:
            equals: fixture-value
          internal_name:
            equals: fixture-value
          language:
            equals: fixture-value
          original_filename:
            equals: fixture-value
          product_name:
            equals: fixture-value
          product_version:
            equals: fixture-value
      reported_elements: all
  evaluate:
    test: windows-file-test
