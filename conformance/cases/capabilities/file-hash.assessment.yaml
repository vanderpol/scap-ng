assessment:
  id: conformance-file-hash
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: file.hash positive and status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    file-hash-test:
      test_title: Collect and match every declared file.hash field
      capability: file.hash
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          filepath:
            equals: fixture-value
          path:
            equals: fixture-value
          filename:
            equals: fixture-value
          hash_type:
            equals: fixture-value
          hash:
            equals: fixture-value
      reported_elements: all
      object:
        capability: file.hash
        full_path:
          equals: fixture-value
        algorithm:
          equals: fixture-value
  evaluate:
    test: file-hash-test
