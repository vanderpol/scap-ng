assessment:
  id: conformance-iosxe-version
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: iosxe.version positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    iosxe-version-test:
      test_title: Collect and match every declared iosxe.version field
      capability: iosxe.version
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          version_string:
            equals: fixture-value
          major_release:
            equals: 7
          release:
            equals: 7
          rebuild:
            equals: 7
          train:
            equals: fixture-value
      reported_elements: all
  evaluate:
    test: iosxe-version-test
