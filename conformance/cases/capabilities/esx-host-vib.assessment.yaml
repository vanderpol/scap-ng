assessment:
  id: conformance-esx-host-vib
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: esx.host_vib positive and status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    esx-host-vib-test:
      test_title: Collect and match every declared esx.host_vib field
      capability: esx.host_vib
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          vib_name:
            equals: fixture-value
          acceptance_level:
            equals: fixture-value
          creation_date:
            equals: fixture-value
          vendor:
            equals: fixture-value
          version:
            equals: fixture-value
      reported_elements: all
      object:
        capability: esx.host_vib
        vib_name:
          equals: fixture-value
  evaluate:
    test: esx-host-vib-test
