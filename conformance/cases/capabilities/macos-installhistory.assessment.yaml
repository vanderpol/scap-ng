assessment:
  id: conformance-macos-installhistory
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: macos.installhistory positive and
    status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    macos-installhistory-test:
      test_title: Collect and match every declared macos.installhistory field
      capability: macos.installhistory
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          name:
            equals: fixture-value
          install_version:
            equals: 1.2.3
          install_date:
            equals: 7
          package_source:
            equals: fixture-value
      reported_elements: all
      object:
        capability: macos.installhistory
        name:
          equals: fixture-value
  evaluate:
    test: macos-installhistory-test
