assessment:
  id: conformance-windows-group-sid
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: windows.group_sid positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    windows-group-sid-test:
      test_title: Collect and match every declared windows.group_sid field
      capability: windows.group_sid
      object:
        capability: windows.group_sid
        group_sid:
          equals: fixture-value
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          group_sid:
            equals: fixture-value
          user_sid:
            equals: fixture-value
          subgroup_sid:
            equals: fixture-value
          group:
            equals: fixture-value
          user:
            equals: fixture-value
          subgroup:
            equals: fixture-value
      reported_elements: all
  evaluate:
    test: windows-group-sid-test
