assessment:
  id: conformance-asa-version
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: asa.version positive and status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    asa-version-test:
      test_title: Collect and match every declared asa.version field
      capability: asa.version
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          asa_release:
            equals: fixture-value
          asa_major_release:
            equals: 1.2.3
          asa_minor_release:
            equals: 1.2.3
          asa_build:
            equals: 7
      reported_elements: all
  evaluate:
    test: asa-version-test
