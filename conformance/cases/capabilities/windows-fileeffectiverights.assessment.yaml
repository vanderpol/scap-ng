assessment:
  id: conformance-windows-fileeffectiverights
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: windows.fileeffectiverights positive
    and status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    windows-fileeffectiverights-test:
      test_title: Collect and match every declared windows.fileeffectiverights field
      capability: windows.fileeffectiverights
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          filepath:
            equals: fixture-value
          path:
            equals: fixture-value
          filename:
            equals: fixture-value
          trustee_sid:
            equals: fixture-value
          trustee_name:
            equals: fixture-value
          standard_delete:
            equals: true
          standard_read_control:
            equals: true
          standard_write_dac:
            equals: true
          standard_write_owner:
            equals: true
          standard_synchronize:
            equals: true
          access_system_security:
            equals: true
          generic_read:
            equals: true
          generic_write:
            equals: true
          generic_execute:
            equals: true
          generic_all:
            equals: true
          file_read_data:
            equals: true
          file_write_data:
            equals: true
          file_append_data:
            equals: true
          file_read_ea:
            equals: true
          file_write_ea:
            equals: true
          file_execute:
            equals: true
          file_delete_child:
            equals: true
          file_read_attributes:
            equals: true
          file_write_attributes:
            equals: true
      reported_elements: all
      object:
        capability: windows.fileeffectiverights
        filepath:
          equals: fixture-value
        trustee_sid:
          equals: fixture-value
  evaluate:
    test: windows-fileeffectiverights-test
