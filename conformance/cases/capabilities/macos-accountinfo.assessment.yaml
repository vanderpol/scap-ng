assessment:
  id: conformance-macos-accountinfo
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: macos.accountinfo positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    macos-accountinfo-test:
      test_title: Collect and match every declared macos.accountinfo field
      capability: macos.accountinfo
      object:
        capability: macos.accountinfo
        username:
          equals: fixture-value
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          username:
            equals: fixture-value
          password:
            equals: fixture-value
          uid:
            equals: 7
          gid:
            equals: 7
          realname:
            equals: fixture-value
          home_dir:
            equals: fixture-value
          login_shell:
            equals: fixture-value
          generated_uid:
            equals: fixture-value
      reported_elements: all
  evaluate:
    test: macos-accountinfo-test
