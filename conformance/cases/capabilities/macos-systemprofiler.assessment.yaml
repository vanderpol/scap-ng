assessment:
  id: conformance-macos-systemprofiler
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: macos.systemprofiler positive and
    status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    macos-systemprofiler-test:
      test_title: Collect and match every declared macos.systemprofiler field
      capability: macos.systemprofiler
      object:
        capability: macos.systemprofiler
        data_type:
          equals: fixture-value
        xpath:
          equals: fixture-value
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          data_type:
            equals: fixture-value
          xpath:
            equals: fixture-value
          value_of:
            equals: fixture-value
      reported_elements: all
  evaluate:
    test: macos-systemprofiler-test
