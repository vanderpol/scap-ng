assessment:
  id: conformance-unix-shadow
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: unix.shadow positive and status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    unix-shadow-test:
      test_title: Collect and match every declared unix.shadow field
      capability: unix.shadow
      object:
        capability: unix.shadow
        username:
          equals: fixture-value
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          username:
            equals: fixture-value
          password:
            equals: fixture-value
          chg_lst:
            equals: fixture-value
          chg_allow:
            equals: fixture-value
          chg_req:
            equals: fixture-value
          exp_warn:
            equals: fixture-value
          exp_inact:
            equals: fixture-value
          exp_date:
            equals: fixture-value
          flag:
            equals: fixture-value
          encrypt_method:
            equals: fixture-value
      reported_elements: all
  evaluate:
    test: unix-shadow-test
