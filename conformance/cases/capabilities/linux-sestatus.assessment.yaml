assessment:
  id: conformance-linux-sestatus
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: linux.sestatus positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    linux-sestatus-test:
      test_title: Collect and match every declared linux.sestatus field
      capability: linux.sestatus
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          selinux_status:
            equals: fixture-value
          current_mode:
            equals: fixture-value
          mode_from_config_file:
            equals: fixture-value
          loaded_policy_name:
            equals: fixture-value
          policy_from_config_file:
            equals: fixture-value
      reported_elements: all
  evaluate:
    test: linux-sestatus-test
