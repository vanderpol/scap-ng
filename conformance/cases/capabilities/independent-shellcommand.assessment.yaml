assessment:
  id: conformance-independent-shellcommand
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: independent.shellcommand positive
    and status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    independent-shellcommand-test:
      test_title: Collect and match every declared independent.shellcommand field
      capability: independent.shellcommand
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          shell:
            equals: fixture-value
          command:
            equals: fixture-value
          pattern:
            equals: fixture-value
          exit_status:
            equals: 7
          stdout_line:
            equals: fixture-value
          subexpression:
            equals: fixture-value
          stderr_line:
            equals: fixture-value
      reported_elements: all
      object:
        capability: independent.shellcommand
  evaluate:
    test: independent-shellcommand-test
