assessment:
  id: conformance-macos-pwpolicy
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: macos.pwpolicy positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    macos-pwpolicy-test:
      test_title: Collect and match every declared macos.pwpolicy field
      capability: macos.pwpolicy
      object:
        capability: macos.pwpolicy
        username:
          equals: fixture-value
        authenticator:
          equals: fixture-value
        authenticator_password:
          equals: fixture-value
        directory_node:
          equals: fixture-value
        xpath:
          equals: fixture-value
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          username:
            equals: fixture-value
          authenticator:
            equals: fixture-value
          authenticator_password:
            equals: fixture-value
          directory_node:
            equals: fixture-value
          xpath:
            equals: fixture-value
          value_of:
            equals: fixture-value
      reported_elements: all
  evaluate:
    test: macos-pwpolicy-test
