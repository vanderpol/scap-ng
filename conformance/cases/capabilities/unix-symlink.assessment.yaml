assessment:
  id: conformance-unix-symlink
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: unix.symlink positive and status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    unix-symlink-test:
      test_title: Collect and match every declared unix.symlink field
      capability: unix.symlink
      object:
        capability: unix.symlink
        full_path:
          equals: fixture-value
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          filepath:
            equals: fixture-value
          canonical_path:
            equals: fixture-value
      reported_elements: all
  evaluate:
    test: unix-symlink-test
