assessment:
  id: conformance-unix-interface
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: unix.interface positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    unix-interface-test:
      test_title: Collect and match every declared unix.interface field
      capability: unix.interface
      object:
        capability: unix.interface
        name:
          equals: fixture-value
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          name:
            equals: fixture-value
          type:
            equals: fixture-value
          hardware_addr:
            equals: fixture-value
          inet_addr:
            equals: fixture-value
          broadcast_addr:
            equals: fixture-value
          netmask:
            equals: fixture-value
          flag:
            equals: fixture-value
      reported_elements: all
  evaluate:
    test: unix-interface-test
