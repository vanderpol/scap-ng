assessment:
  id: conformance-windows-sid-sid
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: windows.sid_sid positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    windows-sid-sid-test:
      test_title: Collect and match every declared windows.sid_sid field
      capability: windows.sid_sid
      object:
        capability: windows.sid_sid
        trustee_sid:
          equals: fixture-value
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          trustee_sid:
            equals: fixture-value
          trustee_name:
            equals: fixture-value
          trustee_domain:
            equals: fixture-value
      reported_elements: all
  evaluate:
    test: windows-sid-sid-test
