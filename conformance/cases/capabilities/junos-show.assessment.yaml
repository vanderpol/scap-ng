assessment:
  id: conformance-junos-show
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: junos.show positive and status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    junos-show-test:
      test_title: Collect and match every declared junos.show field
      capability: junos.show
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          subcommand:
            equals: fixture-value
          value:
            equals: fixture-value
      reported_elements: all
      object:
        capability: junos.show
        subcommand:
          equals: fixture-value
  evaluate:
    test: junos-show-test
