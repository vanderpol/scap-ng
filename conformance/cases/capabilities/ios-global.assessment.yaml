assessment:
  id: conformance-ios-global
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: ios.global positive and status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    ios-global-test:
      test_title: Collect and match every declared ios.global field
      capability: ios.global
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          global_command:
            equals: fixture-value
      reported_elements: all
      object:
        capability: ios.global
        global_command:
          equals: fixture-value
  evaluate:
    test: ios-global-test
