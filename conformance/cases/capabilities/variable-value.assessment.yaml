assessment:
  id: conformance-variable-value
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: variable.value positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    variable-value-test:
      test_title: Collect and match every declared variable.value field
      capability: variable.value
      variable: variable-value-variable
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          value:
            equals: fixture-value
      reported_elements: all
  evaluate:
    test: variable-value-test
  variables:
    variable-value-variable:
      kind: constant
      expression:
        literal:
          datatype: string
          value: fixture-value
