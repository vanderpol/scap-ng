assessment:
  id: conformance-aix-fix
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: aix.fix positive and status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    aix-fix-test:
      test_title: Collect and match every declared aix.fix field
      capability: aix.fix
      object:
        capability: aix.fix
        apar_number:
          equals: fixture-value
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          apar_number:
            equals: fixture-value
          abstract:
            equals: fixture-value
          symptom:
            equals: fixture-value
          installation_status:
            equals: fixture-value
      reported_elements: all
  evaluate:
    test: aix-fix-test
