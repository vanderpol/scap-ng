assessment:
  id: conformance-ios-bgpneighbor
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: ios.bgpneighbor positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    ios-bgpneighbor-test:
      test_title: Collect and match every declared ios.bgpneighbor field
      capability: ios.bgpneighbor
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          neighbor:
            equals: fixture-value
          password:
            equals: fixture-value
      reported_elements: all
      object:
        capability: ios.bgpneighbor
        neighbor:
          equals: fixture-value
  evaluate:
    test: ios-bgpneighbor-test
