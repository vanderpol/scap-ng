assessment:
  id: conformance-ios-snmpuser
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: ios.snmpuser positive and status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    ios-snmpuser-test:
      test_title: Collect and match every declared ios.snmpuser field
      capability: ios.snmpuser
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          name:
            equals: fixture-value
          group:
            equals: fixture-value
          version:
            equals: fixture-value
          ipv4_acl:
            equals: fixture-value
          ipv6_acl:
            equals: fixture-value
          priv:
            equals: fixture-value
          auth:
            equals: fixture-value
      reported_elements: all
      object:
        capability: ios.snmpuser
        name:
          equals: fixture-value
  evaluate:
    test: ios-snmpuser-test
