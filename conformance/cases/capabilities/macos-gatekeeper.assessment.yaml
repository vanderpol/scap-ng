assessment:
  id: conformance-macos-gatekeeper
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: macos.gatekeeper positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    macos-gatekeeper-test:
      test_title: Collect and match every declared macos.gatekeeper field
      capability: macos.gatekeeper
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          enabled:
            equals: true
          require_developer_id:
            equals: true
          unlabeled:
            equals: fixture-value
      reported_elements: all
  evaluate:
    test: macos-gatekeeper-test
