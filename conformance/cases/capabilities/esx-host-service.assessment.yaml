assessment:
  id: conformance-esx-host-service
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: esx.host_service positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    esx-host-service-test:
      test_title: Collect and match every declared esx.host_service field
      capability: esx.host_service
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          service_name:
            equals: fixture-value
          service_label:
            equals: fixture-value
          service_policy:
            equals: fixture-value
          service_running:
            equals: true
          service_required:
            equals: true
      reported_elements: all
      object:
        capability: esx.host_service
        service_name:
          equals: fixture-value
  evaluate:
    test: esx-host-service-test
