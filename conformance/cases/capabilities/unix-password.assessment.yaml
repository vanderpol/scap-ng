assessment:
  id: conformance-unix-password
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: unix.password positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    unix-password-test:
      test_title: Collect and match every declared unix.password field
      capability: unix.password
      object:
        capability: unix.password
        username:
          equals: fixture-value
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          username:
            equals: fixture-value
          password:
            equals: fixture-value
          user_id:
            equals: fixture-value
          group_id:
            equals: fixture-value
          gcos:
            equals: fixture-value
          home_dir:
            equals: fixture-value
          login_shell:
            equals: fixture-value
          last_login:
            equals: 7
      reported_elements: all
  evaluate:
    test: unix-password-test
