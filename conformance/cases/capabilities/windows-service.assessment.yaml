assessment:
  id: conformance-windows-service
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: windows.service positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    windows-service-test:
      test_title: Collect and match every declared windows.service field
      capability: windows.service
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          service_name:
            equals: fixture-value
          display_name:
            equals: fixture-value
          description:
            equals: fixture-value
          service_type:
            equals: fixture-value
          start_type:
            equals: fixture-value
          current_state:
            equals: fixture-value
          controls_accepted:
            equals: fixture-value
          start_name:
            equals: fixture-value
          path:
            equals: fixture-value
          pid:
            equals: 7
          service_flag:
            equals: true
          dependencies:
            equals: fixture-value
      reported_elements: all
      object:
        capability: windows.service
        service_name:
          equals: fixture-value
  evaluate:
    test: windows-service-test
