assessment:
  id: conformance-unix-uname
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: unix.uname positive and status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    unix-uname-test:
      test_title: Collect and match every declared unix.uname field
      capability: unix.uname
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          machine_class:
            equals: fixture-value
          node_name:
            equals: fixture-value
          os_name:
            equals: fixture-value
          os_release:
            equals: fixture-value
          os_version:
            equals: fixture-value
          processor_type:
            equals: fixture-value
      reported_elements: all
  evaluate:
    test: unix-uname-test
