assessment:
  id: conformance-linux-selinuxsecuritycontext
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: linux.selinuxsecuritycontext positive
    and status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    linux-selinuxsecuritycontext-test:
      test_title: Collect and match every declared linux.selinuxsecuritycontext field
      capability: linux.selinuxsecuritycontext
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          filepath:
            equals: fixture-value
          path:
            equals: fixture-value
          filename:
            equals: fixture-value
          pid:
            equals: 7
          user:
            equals: fixture-value
          role:
            equals: fixture-value
          type:
            equals: fixture-value
          low_sensitivity:
            equals: fixture-value
          low_category:
            equals: fixture-value
          high_sensitivity:
            equals: fixture-value
          high_category:
            equals: fixture-value
          rawlow_sensitivity:
            equals: fixture-value
          rawlow_category:
            equals: fixture-value
          rawhigh_sensitivity:
            equals: fixture-value
          rawhigh_category:
            equals: fixture-value
      reported_elements: all
      object:
        capability: linux.selinuxsecuritycontext
        full_path:
          equals: fixture-value
  evaluate:
    test: linux-selinuxsecuritycontext-test
