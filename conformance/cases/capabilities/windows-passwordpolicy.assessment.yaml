assessment:
  id: conformance-windows-passwordpolicy
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: windows.passwordpolicy positive and
    status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    windows-passwordpolicy-test:
      test_title: Collect and match every declared windows.passwordpolicy field
      capability: windows.passwordpolicy
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          max_passwd_age:
            equals: 7
          min_passwd_age:
            equals: 7
          min_passwd_len:
            equals: 7
          password_hist_len:
            equals: 7
          password_complexity:
            equals: true
          reversible_encryption:
            equals: true
          anonymous_name_lookup:
            equals: true
      reported_elements: all
  evaluate:
    test: windows-passwordpolicy-test
