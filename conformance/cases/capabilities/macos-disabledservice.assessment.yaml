assessment:
  id: conformance-macos-disabledservice
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: macos.disabledservice positive and
    status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    macos-disabledservice-test:
      test_title: Collect and match every declared macos.disabledservice field
      capability: macos.disabledservice
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          label:
            equals: fixture-value
          disabled:
            equals: true
      reported_elements: all
  evaluate:
    test: macos-disabledservice-test
