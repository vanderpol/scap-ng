assessment:
  id: conformance-windows-lockoutpolicy
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: windows.lockoutpolicy positive and
    status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    windows-lockoutpolicy-test:
      test_title: Collect and match every declared windows.lockoutpolicy field
      capability: windows.lockoutpolicy
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          force_logoff:
            equals: 7
          lockout_duration:
            equals: 7
          lockout_observation_window:
            equals: 7
          lockout_threshold:
            equals: 7
      reported_elements: all
  evaluate:
    test: windows-lockoutpolicy-test
