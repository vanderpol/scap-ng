assessment:
  id: conformance-linux-partition
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: linux.partition positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    linux-partition-test:
      test_title: Collect and match every declared linux.partition field
      capability: linux.partition
      object:
        capability: linux.partition
        mount_point:
          equals: fixture-value
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          mount_point:
            equals: fixture-value
          device:
            equals: fixture-value
          uuid:
            equals: fixture-value
          fs_type:
            equals: fixture-value
          mount_options:
            equals: fixture-value
          total_space:
            equals: 7
          space_used:
            equals: 7
          space_left:
            equals: 7
          space_left_for_unprivileged_users:
            equals: 7
          block_size:
            equals: 7
      reported_elements: all
  evaluate:
    test: linux-partition-test
