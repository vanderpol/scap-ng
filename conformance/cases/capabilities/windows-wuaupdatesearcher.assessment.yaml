assessment:
  id: conformance-windows-wuaupdatesearcher
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: windows.wuaupdatesearcher positive
    and status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    windows-wuaupdatesearcher-test:
      test_title: Collect and match every declared windows.wuaupdatesearcher field
      capability: windows.wuaupdatesearcher
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          search_criteria:
            equals: fixture-value
          update_id:
            equals: fixture-value
          title:
            equals: fixture-value
          support_url:
            equals: fixture-value
          is_installed:
            equals: true
          is_hidden:
            equals: true
          msrc_severity:
            equals: fixture-value
          last_deployment_change_time:
            equals: fixture-value
          source:
            equals: fixture-value
          days_since_source_modified:
            equals: 7
      reported_elements: all
      object:
        capability: windows.wuaupdatesearcher
        search_criteria:
          equals: fixture-value
  evaluate:
    test: windows-wuaupdatesearcher-test
