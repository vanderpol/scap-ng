assessment:
  id: conformance-windows-appcmd
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: windows.appcmd positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    windows-appcmd-test:
      test_title: Collect and match every declared windows.appcmd field
      capability: windows.appcmd
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          identifier_type:
            equals: fixture-value
          identifier:
            equals: fixture-value
          parameter:
            equals: fixture-value
          result:
            equals: fixture-value
      reported_elements: all
      object:
        capability: windows.appcmd
        identifier_type:
          equals: fixture-value
        identifier:
          equals: fixture-value
        parameter:
          equals: fixture-value
  evaluate:
    test: windows-appcmd-test
