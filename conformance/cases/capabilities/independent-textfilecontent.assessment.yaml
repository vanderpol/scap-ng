assessment:
  id: conformance-independent-textfilecontent
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: independent.textfilecontent positive
    and status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    independent-textfilecontent-test:
      test_title: Collect and match every declared independent.textfilecontent field
      capability: independent.textfilecontent
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          filepath:
            equals: fixture-value
          path:
            equals: fixture-value
          filename:
            equals: fixture-value
          pattern:
            equals: fixture-value
          instance:
            equals: 7
          text:
            equals: fixture-value
          subexpression:
            equals: fixture-value
      reported_elements: all
      object:
        capability: independent.textfilecontent
        full_path:
          equals: fixture-value
        pattern:
          equals: fixture-value
        instance:
          equals: 7
  evaluate:
    test: independent-textfilecontent-test
