assessment:
  id: conformance-independent-sql
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: independent.sql positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    independent-sql-test:
      test_title: Collect and match every declared independent.sql field
      capability: independent.sql
      object:
        capability: independent.sql
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          engine:
            equals: fixture-value
          version:
            equals: fixture-value
          instance:
            equals: fixture-value
          database:
            equals: fixture-value
          sql:
            equals: fixture-value
          result:
            record:
              records_found: one_or_more
              records_matching: every
              fields:
                fixture_field:
                  values_found: one_or_more
                  values_matching: every
                  equals: fixture-value
      reported_elements: all
  evaluate:
    test: independent-sql-test
