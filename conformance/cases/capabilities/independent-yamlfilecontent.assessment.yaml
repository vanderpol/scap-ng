assessment:
  id: conformance-independent-yamlfilecontent
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: independent.yamlfilecontent positive
    and status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    independent-yamlfilecontent-test:
      test_title: Collect and match every declared independent.yamlfilecontent field
      capability: independent.yamlfilecontent
      object:
        capability: independent.yamlfilecontent
        full_path:
          equals: fixture-value
        yamlpath:
          equals: fixture-value
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          filepath:
            equals: fixture-value
          path:
            equals: fixture-value
          filename:
            equals: fixture-value
          content:
            equals: fixture-value
          yamlpath:
            equals: fixture-value
          value:
            record:
              records_found: one_or_more
              records_matching: every
              fields:
                fixture_field:
                  values_found: one_or_more
                  values_matching: every
                  equals: fixture-value
      reported_elements: all
  evaluate:
    test: independent-yamlfilecontent-test
