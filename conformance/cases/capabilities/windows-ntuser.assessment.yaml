assessment:
  id: conformance-windows-ntuser
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: windows.ntuser positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    windows-ntuser-test:
      test_title: Collect and match every declared windows.ntuser field
      capability: windows.ntuser
      object:
        capability: windows.ntuser
        key:
          equals: fixture-value
        name:
          equals: fixture-value
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          key:
            equals: fixture-value
          name:
            equals: fixture-value
          sid:
            equals: fixture-value
          username:
            equals: fixture-value
          account_type:
            equals: fixture-value
          logged_on:
            equals: true
          days_since_last_logon:
            equals: 7
          user_has_signed_into_explorer:
            equals: true
          enabled:
            equals: true
          date_modified:
            equals: 7
          days_since_modified:
            equals: 7
          filepath:
            equals: fixture-value
          last_write_time:
            equals: 7
          type:
            equals: fixture-value
          value:
            equals: fixture-value
      reported_elements: all
  evaluate:
    test: windows-ntuser-test
