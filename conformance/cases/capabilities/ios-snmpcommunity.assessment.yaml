assessment:
  id: conformance-ios-snmpcommunity
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: ios.snmpcommunity positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    ios-snmpcommunity-test:
      test_title: Collect and match every declared ios.snmpcommunity field
      capability: ios.snmpcommunity
      object:
        capability: ios.snmpcommunity
        name:
          equals: fixture-value
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          name:
            equals: fixture-value
          view:
            equals: fixture-value
          mode:
            equals: fixture-value
          ipv4_acl:
            equals: fixture-value
          ipv6_acl:
            equals: fixture-value
      reported_elements: all
  evaluate:
    test: ios-snmpcommunity-test
