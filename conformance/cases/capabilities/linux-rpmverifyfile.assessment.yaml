assessment:
  id: conformance-linux-rpmverifyfile
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: linux.rpmverifyfile positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    linux-rpmverifyfile-test:
      test_title: Collect and match every declared linux.rpmverifyfile field
      capability: linux.rpmverifyfile
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          name:
            equals: fixture-value
          epoch:
            equals: fixture-value
          version:
            equals: fixture-value
          release:
            equals: fixture-value
          arch:
            equals: fixture-value
          filepath:
            equals: fixture-value
          extended_name:
            equals: fixture-value
          size_differs:
            equals: fixture-value
          mode_differs:
            equals: fixture-value
          filedigest_differs:
            equals: fixture-value
          device_differs:
            equals: fixture-value
          link_mismatch:
            equals: fixture-value
          ownership_differs:
            equals: fixture-value
          group_differs:
            equals: fixture-value
          mtime_differs:
            equals: fixture-value
          capabilities_differ:
            equals: fixture-value
          configuration_file:
            equals: true
          documentation_file:
            equals: true
          ghost_file:
            equals: true
          license_file:
            equals: true
          readme_file:
            equals: true
      reported_elements: all
      object:
        capability: linux.rpmverifyfile
        name:
          equals: fixture-value
        epoch:
          equals: fixture-value
        version:
          equals: fixture-value
        release:
          equals: fixture-value
        arch:
          equals: fixture-value
        filepath:
          equals: fixture-value
  evaluate:
    test: linux-rpmverifyfile-test
