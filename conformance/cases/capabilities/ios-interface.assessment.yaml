assessment:
  id: conformance-ios-interface
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: ios.interface positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    ios-interface-test:
      test_title: Collect and match every declared ios.interface field
      capability: ios.interface
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          name:
            equals: fixture-value
          ip_directed_broadcast_command:
            equals: fixture-value
          proxy_arp_command:
            equals: fixture-value
          shutdown_command:
            equals: fixture-value
          hardware_addr:
            equals: fixture-value
          ipv4_address:
            equals: fixture-value
          ipv6_address:
            equals: fixture-value
          ipv4_access_list:
            equals: fixture-value
          ipv6_access_list:
            equals: fixture-value
          crypto_map:
            equals: fixture-value
          ipv4_urpf_command:
            equals: fixture-value
          ipv6_urpf_command:
            equals: fixture-value
          switchport_trunk_encapsulation:
            equals: fixture-value
          switchport_mode:
            equals: fixture-value
          switchport_native_vlan:
            equals: fixture-value
          switchport_access_vlan:
            equals: fixture-value
          switchport_trunked_vlans:
            equals: fixture-value
          switchport_pruned_vlans:
            equals: fixture-value
          switchport_port_security:
            equals: fixture-value
      reported_elements: all
      object:
        capability: ios.interface
        name:
          equals: fixture-value
  evaluate:
    test: ios-interface-test
