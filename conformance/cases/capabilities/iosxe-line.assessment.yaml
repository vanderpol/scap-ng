assessment:
  id: conformance-iosxe-line
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: iosxe.line positive and status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    iosxe-line-test:
      test_title: Collect and match every declared iosxe.line field
      capability: iosxe.line
      object:
        capability: iosxe.line
        show_subcommand:
          equals: fixture-value
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          show_subcommand:
            equals: fixture-value
          config_line:
            equals: fixture-value
      reported_elements: all
  evaluate:
    test: iosxe-line-test
