assessment:
  id: conformance-windows-registry
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: windows.registry positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    windows-registry-test:
      test_title: Collect and match every declared windows.registry field
      capability: windows.registry
      object:
        capability: windows.registry
        hive:
          equals: classes_root
        key:
          equals: fixture-value
        name:
          equals: fixture-value
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          hive:
            equals: classes_root
          key:
            equals: fixture-value
          name:
            equals: fixture-value
          last_write_time:
            equals: 7
          type:
            equals: fixture-value
          value:
            equals: fixture-value
          expanded_value:
            equals: fixture-value
      reported_elements: all
  evaluate:
    test: windows-registry-test
