assessment:
  id: conformance-unix-file
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: unix.file positive and status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    unix-file-test:
      test_title: Collect and match every declared unix.file field
      capability: unix.file
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          filepath:
            equals: fixture-value
          path:
            equals: fixture-value
          filename:
            equals: fixture-value
          type:
            equals: fixture-value
          group_id:
            equals: fixture-value
          user_id:
            equals: fixture-value
          a_time:
            equals: fixture-value
          c_time:
            equals: fixture-value
          m_time:
            equals: fixture-value
          size:
            equals: 7
          suid:
            equals: fixture-value
          sgid:
            equals: fixture-value
          sticky:
            equals: true
          uread:
            equals: fixture-value
          uwrite:
            equals: fixture-value
          uexec:
            equals: fixture-value
          gread:
            equals: fixture-value
          gwrite:
            equals: fixture-value
          gexec:
            equals: fixture-value
          oread:
            equals: fixture-value
          owrite:
            equals: fixture-value
          oexec:
            equals: fixture-value
          has_extended_acl:
            equals: true
      reported_elements: all
      object:
        capability: unix.file
        filepath:
          equals: fixture-value
  evaluate:
    test: unix-file-test
