assessment:
  id: conformance-aix-fileset
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: aix.fileset positive and status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    aix-fileset-test:
      test_title: Collect and match every declared aix.fileset field
      capability: aix.fileset
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          flstinst:
            equals: fixture-value
          level:
            equals: 1.2.3
          state:
            equals: fixture-value
          description:
            equals: fixture-value
      reported_elements: all
      object:
        capability: aix.fileset
        flstinst:
          equals: fixture-value
  evaluate:
    test: aix-fileset-test
