assessment:
  id: conformance-macos-diskinfo
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: macos.diskinfo positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    macos-diskinfo-test:
      test_title: Collect and match every declared macos.diskinfo field
      capability: macos.diskinfo
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          device_identifier:
            equals: fixture-value
          volume_name:
            equals: fixture-value
          file_system_personality:
            equals: fixture-value
          removable_media:
            equals: fixture-value
          device_location:
            equals: fixture-value
          solid_state:
            equals: true
          read_only:
            equals: true
          file_vault:
            equals: true
          mount_point:
            equals: fixture-value
          smart_status:
            equals: fixture-value
          encrypted:
            equals: true
          apfs_uid:
            equals: fixture-value
      reported_elements: all
      object:
        capability: macos.diskinfo
        device_identifier:
          equals: fixture-value
  evaluate:
    test: macos-diskinfo-test
