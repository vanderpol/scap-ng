assessment:
  id: conformance-esx-host-advancedsetting
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: esx.host_advancedsetting positive
    and status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    esx-host-advancedsetting-test:
      test_title: Collect and match every declared esx.host_advancedsetting field
      capability: esx.host_advancedsetting
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          advanced_setting_name:
            equals: fixture-value
          advanced_setting_value:
            equals: fixture-value
      reported_elements: all
      object:
        capability: esx.host_advancedsetting
        advanced_setting_name:
          equals: fixture-value
  evaluate:
    test: esx-host-advancedsetting-test
