assessment:
  id: conformance-panos-version
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: panos.version positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    panos-version-test:
      test_title: Collect and match every declared panos.version field
      capability: panos.version
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          major_version:
            equals: 7
          minor_version:
            equals: 7
          release:
            equals: 7
          hotfix:
            equals: 7
          version_string:
            equals: fixture-value
          model_name:
            equals: fixture-value
      reported_elements: all
  evaluate:
    test: panos-version-test
