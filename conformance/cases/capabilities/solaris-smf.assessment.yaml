assessment:
  id: conformance-solaris-smf
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: solaris.smf positive and status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    solaris-smf-test:
      test_title: Collect and match every declared solaris.smf field
      capability: solaris.smf
      object:
        capability: solaris.smf
        fmri:
          equals: fixture-value
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          fmri:
            equals: fixture-value
          service_name:
            equals: fixture-value
          service_state:
            equals: fixture-value
          protocol:
            equals: fixture-value
          server_executable:
            equals: fixture-value
          server_arguements:
            equals: fixture-value
          exec_as_user:
            equals: fixture-value
      reported_elements: all
  evaluate:
    test: solaris-smf-test
