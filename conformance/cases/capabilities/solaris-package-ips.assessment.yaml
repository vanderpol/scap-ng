assessment:
  id: conformance-solaris-package-ips
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: solaris.package.ips positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    solaris-package-ips-test:
      test_title: Collect and match every declared solaris.package.ips field
      capability: solaris.package.ips
      object:
        capability: solaris.package.ips
        publisher:
          equals: fixture-value
        name:
          equals: fixture-value
        version:
          equals: 1.2.3
        timestamp:
          equals: fixture-value
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          publisher:
            equals: fixture-value
          name:
            equals: fixture-value
          version:
            equals: 1.2.3
          timestamp:
            equals: fixture-value
          fmri:
            equals: fixture-value
          summary:
            equals: fixture-value
          description:
            equals: fixture-value
          category:
            equals: fixture-value
          updates_available:
            equals: true
      reported_elements: all
  evaluate:
    test: solaris-package-ips-test
