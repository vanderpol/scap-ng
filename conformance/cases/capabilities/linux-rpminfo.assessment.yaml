assessment:
  id: conformance-linux-rpminfo
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: linux.rpminfo positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    linux-rpminfo-test:
      test_title: Collect and match every declared linux.rpminfo field
      capability: linux.rpminfo
      object:
        capability: linux.rpminfo
        package_name:
          equals: fixture-value
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          name:
            equals: fixture-value
          arch:
            equals: fixture-value
          epoch:
            equals: fixture-value
          release:
            equals: fixture-value
          version:
            equals: fixture-value
          evr:
            equals: 1:1.2.3-7
          signature_keyid:
            equals: fixture-value
          extended_name:
            equals: fixture-value
          filepath:
            equals: fixture-value
      reported_elements: all
  evaluate:
    test: linux-rpminfo-test
