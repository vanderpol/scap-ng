assessment:
  id: conformance-windows-userright
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: windows.userright positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    windows-userright-test:
      test_title: Collect and match every declared windows.userright field
      capability: windows.userright
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          userright:
            equals: fixture-value
          trustee_name:
            equals: fixture-value
          trustee_sid:
            equals: fixture-value
      reported_elements: all
      object:
        capability: windows.userright
        userright:
          equals: fixture-value
  evaluate:
    test: windows-userright-test
