assessment:
  id: conformance-macos-profiles
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: macos.profiles positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    macos-profiles-test:
      test_title: Collect and match every declared macos.profiles field
      capability: macos.profiles
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          mdm_enrolled:
            equals: true
          dep_enrolled:
            equals: true
      reported_elements: all
  evaluate:
    test: macos-profiles-test
