assessment:
  id: conformance-unix-process
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: unix.process positive and status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    unix-process-test:
      test_title: Collect and match every declared unix.process field
      capability: unix.process
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          command_line:
            equals: fixture-value
          exec_time:
            equals: fixture-value
          pid:
            equals: 7
          ppid:
            equals: 7
          priority:
            equals: 7
          ruid:
            equals: 7
          scheduling_class:
            equals: fixture-value
          start_time:
            equals: fixture-value
          tty:
            equals: fixture-value
          user_id:
            equals: 7
          exec_shield:
            equals: true
          loginuid:
            equals: 7
          posix_capability:
            equals: fixture-value
          selinux_domain_label:
            equals: fixture-value
          session_id:
            equals: 7
      reported_elements: all
      object:
        capability: unix.process
        command_line:
          equals: fixture-value
  evaluate:
    test: unix-process-test
