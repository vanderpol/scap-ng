assessment:
  id: conformance-ios-snmphost
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: ios.snmphost positive and status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    ios-snmphost-test:
      test_title: Collect and match every declared ios.snmphost field
      capability: ios.snmphost
      object:
        capability: ios.snmphost
        host:
          equals: fixture-value
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          host:
            equals: fixture-value
          community_or_user:
            equals: fixture-value
          version:
            equals: fixture-value
          snmpv3_sec_level:
            equals: fixture-value
          traps:
            equals: fixture-value
      reported_elements: all
  evaluate:
    test: ios-snmphost-test
