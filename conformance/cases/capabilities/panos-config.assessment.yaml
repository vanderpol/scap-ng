assessment:
  id: conformance-panos-config
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: panos.config positive and status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    panos-config-test:
      test_title: Collect and match every declared panos.config field
      capability: panos.config
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          xpath:
            equals: fixture-value
          value_of:
            equals: fixture-value
      reported_elements: all
      object:
        capability: panos.config
        xpath:
          equals: fixture-value
  evaluate:
    test: panos-config-test
