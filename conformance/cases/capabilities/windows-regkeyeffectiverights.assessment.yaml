assessment:
  id: conformance-windows-regkeyeffectiverights
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: windows.regkeyeffectiverights positive
    and status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    windows-regkeyeffectiverights-test:
      test_title: Collect and match every declared windows.regkeyeffectiverights field
      capability: windows.regkeyeffectiverights
      object:
        capability: windows.regkeyeffectiverights
        hive:
          equals: classes_root
        key:
          equals: fixture-value
        trustee_sid:
          equals: fixture-value
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          hive:
            equals: classes_root
          key:
            equals: fixture-value
          trustee_sid:
            equals: fixture-value
          trustee_name:
            equals: fixture-value
          standard_delete:
            equals: true
          standard_read_control:
            equals: true
          standard_write_dac:
            equals: true
          standard_write_owner:
            equals: true
          access_system_security:
            equals: true
          generic_read:
            equals: true
          generic_write:
            equals: true
          generic_execute:
            equals: true
          generic_all:
            equals: true
          key_query_value:
            equals: true
          key_set_value:
            equals: true
          key_create_sub_key:
            equals: true
          key_enumerate_sub_keys:
            equals: true
          key_notify:
            equals: true
          key_create_link:
            equals: true
          key_wow64_64key:
            equals: true
          key_wow64_32key:
            equals: true
          key_wow64_res:
            equals: true
      reported_elements: all
  evaluate:
    test: windows-regkeyeffectiverights-test
