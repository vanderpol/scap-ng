assessment:
  id: conformance-macos-systemsetup
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: macos.systemsetup positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    macos-systemsetup-test:
      test_title: Collect and match every declared macos.systemsetup field
      capability: macos.systemsetup
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          timezone:
            equals: fixture-value
          usingnetworktime:
            equals: true
          networktimeserver:
            equals: fixture-value
          computersleep:
            equals: 7
          displaysleep:
            equals: 7
          harddisksleep:
            equals: 7
          wakeonmodem:
            equals: true
          wakeonnetworkaccess:
            equals: true
          restartfreeze:
            equals: true
          allowpowerbuttontosleepcomputer:
            equals: true
          restartpowerfailure:
            equals: true
          remotelogin:
            equals: true
          remoteappleevents:
            equals: true
          computername:
            equals: fixture-value
          localsubnetname:
            equals: fixture-value
          startupdisk:
            equals: fixture-value
          waitforstartupafterpowerfailure:
            equals: 7
          disablekeyboardwhenenclosurelockisengaged:
            equals: true
          kernelbootarchitecturesetting:
            equals: fixture-value
      reported_elements: all
  evaluate:
    test: macos-systemsetup-test
