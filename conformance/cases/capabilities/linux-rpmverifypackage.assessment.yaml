assessment:
  id: conformance-linux-rpmverifypackage
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: linux.rpmverifypackage positive and
    status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    linux-rpmverifypackage-test:
      test_title: Collect and match every declared linux.rpmverifypackage field
      capability: linux.rpmverifypackage
      object:
        capability: linux.rpmverifypackage
        name:
          equals: fixture-value
        epoch:
          equals: fixture-value
        version:
          equals: fixture-value
        release:
          equals: fixture-value
        arch:
          equals: fixture-value
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          name:
            equals: fixture-value
          epoch:
            equals: fixture-value
          version:
            equals: fixture-value
          release:
            equals: fixture-value
          arch:
            equals: fixture-value
          extended_name:
            equals: fixture-value
          dependency_check_passed:
            equals: true
          verification_script_successful:
            equals: true
      reported_elements: all
  evaluate:
    test: linux-rpmverifypackage-test
