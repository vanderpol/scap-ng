assessment:
  id: conformance-independent-environmentvariable
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: independent.environmentvariable positive
    and status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    independent-environmentvariable-test:
      test_title: Collect and match every declared independent.environmentvariable
        field
      capability: independent.environmentvariable
      object:
        capability: independent.environmentvariable
        pid:
          equals: 7
        name:
          equals: fixture-value
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          pid:
            equals: 7
          name:
            equals: fixture-value
          value:
            equals: fixture-value
      reported_elements: all
  evaluate:
    test: independent-environmentvariable-test
