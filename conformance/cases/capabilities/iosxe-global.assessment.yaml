assessment:
  id: conformance-iosxe-global
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: iosxe.global positive and status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    iosxe-global-test:
      test_title: Collect and match every declared iosxe.global field
      capability: iosxe.global
      object:
        capability: iosxe.global
        global_command:
          equals: fixture-value
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          global_command:
            equals: fixture-value
      reported_elements: all
  evaluate:
    test: iosxe-global-test
