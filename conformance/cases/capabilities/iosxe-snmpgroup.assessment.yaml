assessment:
  id: conformance-iosxe-snmpgroup
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: iosxe.snmpgroup positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    iosxe-snmpgroup-test:
      test_title: Collect and match every declared iosxe.snmpgroup field
      capability: iosxe.snmpgroup
      object:
        capability: iosxe.snmpgroup
        name:
          equals: fixture-value
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          name:
            equals: fixture-value
          version:
            equals: fixture-value
          snmpv3_sec_level:
            equals: fixture-value
          ipv4_acl:
            equals: fixture-value
          ipv6_acl:
            equals: fixture-value
          read_view:
            equals: fixture-value
          write_view:
            equals: fixture-value
          notify_view:
            equals: fixture-value
      reported_elements: all
  evaluate:
    test: iosxe-snmpgroup-test
