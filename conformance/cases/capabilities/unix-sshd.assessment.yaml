assessment:
  id: conformance-unix-sshd
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: unix.sshd positive and status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    unix-sshd-test:
      test_title: Collect and match every declared unix.sshd field
      capability: unix.sshd
      object:
        capability: unix.sshd
        filepath:
          equals: fixture-value
        name:
          equals: fixture-value
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          filepath:
            equals: fixture-value
          name:
            equals: fixture-value
          value:
            equals: fixture-value
      reported_elements: all
  evaluate:
    test: unix-sshd-test
