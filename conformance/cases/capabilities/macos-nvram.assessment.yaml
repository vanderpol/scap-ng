assessment:
  id: conformance-macos-nvram
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: macos.nvram positive and status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    macos-nvram-test:
      test_title: Collect and match every declared macos.nvram field
      capability: macos.nvram
      object:
        capability: macos.nvram
        variable:
          equals: fixture-value
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          variable:
            equals: fixture-value
          value:
            equals: ZmFjdHVyZQ==
      reported_elements: all
  evaluate:
    test: macos-nvram-test
