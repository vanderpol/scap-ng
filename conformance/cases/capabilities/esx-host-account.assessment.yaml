assessment:
  id: conformance-esx-host-account
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: esx.host_account positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    esx-host-account-test:
      test_title: Collect and match every declared esx.host_account field
      capability: esx.host_account
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          account_name:
            equals: fixture-value
          domain:
            equals: fixture-value
          description:
            equals: fixture-value
          shell_access_enabled:
            equals: true
          role:
            equals: fixture-value
      reported_elements: all
      object:
        capability: esx.host_account
        account_name:
          equals: fixture-value
  evaluate:
    test: esx-host-account-test
