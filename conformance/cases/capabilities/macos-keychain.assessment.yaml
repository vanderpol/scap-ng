assessment:
  id: conformance-macos-keychain
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: macos.keychain positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    macos-keychain-test:
      test_title: Collect and match every declared macos.keychain field
      capability: macos.keychain
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          filepath:
            equals: fixture-value
          lock_on_sleep:
            equals: true
          timeout:
            equals: 7
      reported_elements: all
      object:
        capability: macos.keychain
        filepath:
          equals: fixture-value
  evaluate:
    test: macos-keychain-test
