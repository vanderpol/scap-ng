assessment:
  id: conformance-solaris-package
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: solaris.package positive and status
    vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    solaris-package-test:
      test_title: Collect and match every declared solaris.package field
      capability: solaris.package
      object:
        capability: solaris.package
        pkginst:
          equals: fixture-value
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          pkginst:
            equals: fixture-value
          name:
            equals: fixture-value
          category:
            equals: fixture-value
          version:
            equals: fixture-value
          vendor:
            equals: fixture-value
          description:
            equals: fixture-value
      reported_elements: all
  evaluate:
    test: solaris-package-test
