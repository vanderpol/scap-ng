assessment:
  id: conformance-ios-section
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: ios.section positive and status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    ios-section-test:
      test_title: Collect and match every declared ios.section field
      capability: ios.section
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          section_command:
            equals: fixture-value
          section_config_lines:
            equals: fixture-value
          config_line:
            equals: fixture-value
      reported_elements: all
      object:
        capability: ios.section
        section_command:
          equals: fixture-value
  evaluate:
    test: ios-section-test
