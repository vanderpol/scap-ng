assessment:
  id: conformance-windows-sid
  version: 1
  assessment_title: 'SCAP-NG 0.4.1 conformance: windows.sid positive and status vectors'
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  tests:
    windows-sid-test:
      test_title: Collect and match every declared windows.sid field
      capability: windows.sid
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          trustee_name:
            equals: fixture-value
          trustee_sid:
            equals: fixture-value
          trustee_domain:
            equals: fixture-value
      reported_elements: all
      object:
        capability: windows.sid
        trustee_name:
          equals: fixture-value
  evaluate:
    test: windows-sid-test
