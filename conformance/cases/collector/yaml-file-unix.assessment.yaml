assessment:
  id: conformance-yaml-file-unix
  version: 1
  assessment_title: YAML file content on unix
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.1
  evaluate:
    and:
    - test: typed-key-test
    - not:
        test: field-mismatch-test
    - test: sequence-test
    - test: inline-test
    - test: variable-inline-test
    - not:
        test: missing-file-test
    - test: depth-one-test
    - test: scalar-test
    - test: filtered-set-test
  shared_objects:
    settings-file-object:
      object_title: Settings file
      capability: independent.yamlfilecontent
      full_path:
        equals: /tmp/scap-ng-issue87/settings.yaml
      yamlpath:
        equals: $.settings
      filesystem: all
    other-file-object:
      object_title: Other file
      capability: independent.yamlfilecontent
      full_path:
        equals: /tmp/scap-ng-issue87/other.yaml
      yamlpath:
        equals: $.settings
      filesystem: all
  tests:
    typed-key-test:
      test_title: Read a typed YAML mapping and preserve its key spelling
      capability: independent.yamlfilecontent
      object:
        full_path:
          equals: /tmp/scap-ng-issue87/settings.yaml
        yamlpath:
          equals: $.settings
        filesystem: all
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          value:
            record:
              records_found: one_or_more
              records_matching: every
              fields:
                myCamelCase^Key: &id001
                  equals: amber
                Limit:
                  datatype: integer
                  equals: 7
                Enabled:
                  datatype: boolean
                  equals: true
                ratio:
                  datatype: float
                  equals: 1.25
      reported_elements: compared
    field-mismatch-test:
      test_title: Compare the same selected field with blue
      capability: independent.yamlfilecontent
      object:
        full_path:
          equals: /tmp/scap-ng-issue87/settings.yaml
        yamlpath:
          equals: $.settings
        filesystem: all
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          value:
            record:
              records_found: one_or_more
              records_matching: every
              fields:
                myCamelCase^Key:
                  equals: blue
      reported_elements: compared
    sequence-test:
      test_title: Match at least one of the three scalar values
      capability: independent.yamlfilecontent
      object:
        directory:
          equals: /tmp/scap-ng-issue87
        name:
          equals: settings.yaml
        yamlpath:
          equals: $.sequence
        filesystem: all
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: one_or_more
        fields:
          value:
            record:
              records_found: one_or_more
              records_matching: every
              fields:
                '#':
                  equals: amber
      reported_elements: compared
    inline-test:
      test_title: Read inline content
      capability: independent.yamlfilecontent
      object:
        content:
          equals: 'settings: {myCamelCase^Key: amber}'
        yamlpath:
          equals: $.settings
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          value:
            record:
              records_found: one_or_more
              records_matching: every
              fields: &id002
                myCamelCase^Key: *id001
      reported_elements: compared
    variable-inline-test:
      test_title: Read content from a constant Variable
      capability: independent.yamlfilecontent
      object:
        content:
          equals:
            variable: inline-yaml-variable
          datatype: string
          value_match: every
        yamlpath:
          equals: $.settings
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          value:
            record:
              records_found: one_or_more
              records_matching: every
              fields: *id002
      reported_elements: compared
    missing-file-test:
      test_title: Require a file that is absent
      capability: independent.yamlfilecontent
      object:
        full_path:
          equals: /tmp/scap-ng-issue87/does-not-exist.yaml
        yamlpath:
          equals: $.settings
        filesystem: all
      require:
        item_requirement:
          items_found: one_or_more
      reported_elements: compared
    depth-one-test:
      test_title: Select recursive.yaml only through depth one
      capability: independent.yamlfilecontent
      object:
        directory:
          equals: /tmp/scap-ng-issue87
        name:
          equals: recursive.yaml
        yamlpath:
          equals: $.settings
        filesystem: all
        traversal:
          max_depth: 1
          recurse: directories
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          value:
            record:
              records_found: one_or_more
              records_matching: every
              fields: *id002
      reported_elements: compared
    scalar-test:
      test_title: Read one unkeyed scalar
      capability: independent.yamlfilecontent
      object:
        full_path:
          equals: /tmp/scap-ng-issue87/settings.yaml
        yamlpath:
          equals: $.single
        filesystem: all
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          value:
            record:
              records_found: one_or_more
              records_matching: every
              fields:
                '#':
                  equals: amber
      reported_elements: compared
    filtered-set-test:
      test_title: Select the amber record from two named Objects
      capability: independent.yamlfilecontent
      object:
        set:
          operator: union
          operands:
          - object: settings-file-object
            filters:
            - include:
                value:
                  record:
                    records_found: one_or_more
                    records_matching: every
                    fields:
                      myCamelCase^Key:
                        equals: amber
                        values_found: one_or_more
                        values_matching: every
          - object: other-file-object
            filters:
            - include:
                value:
                  record:
                    records_found: one_or_more
                    records_matching: every
                    fields:
                      myCamelCase^Key:
                        equals: amber
                        values_found: one_or_more
                        values_matching: every
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          value:
            record:
              records_found: one_or_more
              records_matching: every
              fields: *id002
      reported_elements: compared
  variables:
    inline-yaml-variable:
      kind: constant
      expression:
        literal: 'settings: {myCamelCase^Key: amber}'
