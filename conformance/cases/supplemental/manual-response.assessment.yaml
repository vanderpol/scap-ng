assessment:
  id: conformance-manual-response
  version: 1
  assessment_title: Manual approval record review
  mode: manual
  class: compliance
  procedure: Inspect the authorization record and select the applicable determination.
  response:
    type: approval-record-review
    choices:
      - {value: signed, label: Approval is documented, outcome: 'true'}
      - {value: refused, label: Approval was denied, outcome: 'false'}
      - {value: unreadable, label: Record inspection failed, outcome: error}
      - {value: uncertain, label: Evidence is insufficient, outcome: unknown}
      - {value: pending, label: Review has not taken place, outcome: not_evaluated}
      - {value: outside-scope, label: Approval is not required, outcome: not_applicable}
    allow_comment: true
    allow_evidence: true
  evidence_guidance: Record the fixture evidence identifier and a concise finding.
