assessment:
  assessment_title: Linux must audit all uses of the setxattr, fsetxattr, lsetxattr,
    removexattr, fremovexattr, and lremovexattr system calls.
  class: compliance
  evaluate:
    all:
    - all:
      - test: audit-32-bit-invocations-fsetxattr-syscall-auid-1000-test
      - test: audit-64-bit-invocations-fsetxattr-syscall-auid-1000-test
      - test: audit-32-bit-invocations-fsetxattr-syscall-auid-0-test
      - test: audit-64-bit-invocations-fsetxattr-syscall-auid-0-test
    - all:
      - test: audit-32-bit-invocations-lsetxattr-system-call-test
      - test: audit-64-bit-invocations-lsetxattr-system-call-test
      - test: audit-32-bit-invocations-lsetxattr-system-call-by-root-user-test
      - test: audit-64-bit-invocations-lsetxattr-system-call-by-root-user-test
    - all:
      - test: audit-32-bit-invocations-fremovexattr-syscall-test
      - test: audit-64-bit-invocations-fremovexattr-syscall-test
      - test: audit-32-bit-invocations-fremovexattr-syscall-by-root-test
      - test: audit-64-bit-invocations-fremovexattr-syscall-by-root-test
    - all:
      - test: audit-32-bit-invocations-lremovexattr-syscall-test
      - test: audit-64-bit-invocations-lremovexattr-syscall-test
      - test: audit-32-bit-invocations-lremovexattr-syscall-by-root-test
      - test: audit-64-bit-invocations-lremovexattr-syscall-by-root-test
    - all:
      - test: audit-32-bit-invocations-removexattr-system-call-test
      - test: audit-64-bit-invocations-removexattr-system-call-test
      - test: audit-32-bit-invocations-removexattr-system-call-by-root-user-test
      - test: audit-64-bit-invocations-removexattr-system-call-by-root-user-test
    - test: audit-32-bit-invocations-setxattr-syscall-auid-1000-test
    - test: audit-64-bit-invocations-setxattr-syscall-auid-1000-test
    - test: audit-32-bit-invocations-setxattr-syscall-auid-0-test
    - test: audit-64-bit-invocations-setxattr-syscall-auid-0-test
  id: ng.shared.linux-must-audit-all-uses-of-the-setxattr-fsetxattr-lsetxattr-removexatt
  mode: automated
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.3.0
  tests:
    audit-32-bit-invocations-fremovexattr-syscall-by-root-test:
      capability: independent.textfilecontent54
      existence: all
      match: all
      object:
        capability: independent.textfilecontent54
        collect:
          ignore_case: false
          item_creation: all_object_elements_fullfilled
          multiline: true
          singleline: false
        filesystem: all
        object_title: null
        select:
          full_path:
            operation: equals
            value: /etc/audit/audit.rules
          instance:
            operation: greater_than_or_equal
            value: 1
          pattern:
            operation: pattern_match
            value: ^\s*-a\s+(always,exit|exit,always)\s+-F\s+arch=b32\s+(?:.*(-S\s+fremovexattr\s+|(\s+|,)fremovexattr(\s+|,))).*-F\s+auid=0(\s+(-k\s+|-F\s+key=)[-\w]+)*\s*$
      reported_elements: all
      test_title: Audit 32-bit invocations of fremovexattr syscall by root
    audit-32-bit-invocations-fremovexattr-syscall-test:
      capability: independent.textfilecontent54
      existence: all
      match: all
      object:
        capability: independent.textfilecontent54
        collect:
          ignore_case: false
          item_creation: all_object_elements_fullfilled
          multiline: true
          singleline: false
        filesystem: all
        object_title: null
        select:
          full_path:
            operation: equals
            value: /etc/audit/audit.rules
          instance:
            operation: greater_than_or_equal
            value: 1
          pattern:
            operation: pattern_match
            value: ^\s*-a\s+(always,exit|exit,always)\s+-F\s+arch=b32\s+(?:.*(-S\s+fremovexattr\s+|(\s+|,)fremovexattr(\s+|,))).*-F\s+auid>=1000\s+-F\s+auid!=(4294967295|-1|unset)(\s+(-k\s+|-F\s+key=)[-\w]+)*\s*$
      reported_elements: all
      test_title: Audit 32-bit invocations of fremovexattr syscall
