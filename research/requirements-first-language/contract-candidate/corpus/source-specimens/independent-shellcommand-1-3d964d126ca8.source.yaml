assessment:
  assessment_title: Cookies exchanged between the Apache web server and the client,
    such as session cookies, must have cookie properties set to prohibit client-side
    scripts from reading the cookie data.
  class: compliance
  evaluate:
    all:
    - test: verify-session-directive-exists-configured-on-all-httpd-conf-apache2-test
    - test: if-session-directive-exists-in-other-loaded-configuration-files-verify-test
    - test: verify-that-sessioncookiename-directive-exists-configured-httponly-secure-in-httpd-test
    - test: if-sessioncookiename-directive-exists-in-other-loaded-configuration-files-verify-test
    - test: apache-session-cookie-module-enabled-test
  id: SV-214268.automated
  mode: automated
  purpose: assessment
  shared_objects:
    gather-unique-apache-http-installation-paths-object:
      capability: independent.shellcommand
      collect:
        command: ps -e -o command --no-headers | grep -e httpd -e apache2 | sort |
          uniq
        error_if_exit_status_not_0: false
        error_if_stderr_exists: false
        pattern: ^\/\S+(\/httpd|\/apache2)\s*
        shell: bash
      object_title: Gather unique apache http installation paths
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.3.0
  tests:
    apache-session-cookie-module-enabled-test:
      capability: independent.shellcommand
      existence: one_or_more
      match: all
      object:
        capability: independent.shellcommand
        collect:
          command:
            variable: command-gather-httpd-apache2-modules-variable
          error_if_exit_status_not_0: false
          error_if_stderr_exists: false
          pattern: session_cookie_module
          shell: bash
        object_title: Gather all installed modules and filter on session_cookie_module
      reported_elements: all
      states:
      - existence: one_or_more
        field: stdout_line
        match: one_or_more
        operation: pattern_match
        value: session_cookie_module
      test_title: Apache session_cookie_module must be enabled
    if-session-directive-exists-in-other-loaded-configuration-files-verify-test:
      capability: independent.shellcommand
      existence: one_or_more
      match: all
      object:
        capability: independent.shellcommand
        collect:
          command:
            variable: shell-command-check-session-in-all-loaded-conf-files-variable
          error_if_exit_status_not_0: false
          error_if_stderr_exists: false
          pattern: .+
          shell: bash
        object_title: Gather all Session data from all loaded conf files
      reported_elements: all
      states:
      - existence: optional
        field: stdout_line
        match: all
        operation: pattern_match
        value: (?i)Session On
      test_title: If the Session directive exists in other loaded configuration files,
        verify is is configured to On
    if-sessioncookiename-directive-exists-in-other-loaded-configuration-files-verify-test:
      capability: independent.shellcommand
      existence: one_or_more
      match: all
      object:
        capability: independent.shellcommand
        collect:
          command:
            variable: shell-command-check-sessioncookiename-in-all-loaded-conf-files-variable
          error_if_exit_status_not_0: false
          error_if_stderr_exists: false
          pattern: SessionCookieName .+
          shell: bash
        object_title: Gather all SessionCookieName data from all loaded conf files
      reported_elements: all
      states:
      - existence: optional
        field: stdout_line
        match: all
        operation: pattern_match
        value: (?i)HttpOnly
      - existence: optional
        field: stdout_line
        match: all
        operation: pattern_match
        value: (?i)Secure
      states_match: all
      test_title: If the SessionCookieName directive exists in other loaded configuration
        files, verify it is configured with HttpOnly
    verify-session-directive-exists-configured-on-all-httpd-conf-apache2-test:
      capability: independent.shellcommand
      existence: one_or_more
      match: all
      object:
        capability: independent.shellcommand
        collect:
          command:
            variable: shell-command-check-session-in-httpd-conf-all-include-conf-variable
          error_if_exit_status_not_0: false
          error_if_stderr_exists: false
          pattern: .+
          shell: bash
        object_title: Gather all Session data from httpd and all Include conf files
      reported_elements: all
      states:
      - existence: one_or_more
        field: stdout_line
        match: all
        operation: pattern_match
        value: (?i)Session On
      test_title: Verify the Session directive exists and is configured to On for
        all httpd.conf/apache2.conf or included conf files
    verify-that-sessioncookiename-directive-exists-configured-httponly-secure-in-httpd-test:
      capability: independent.shellcommand
      existence: one_or_more
      match: all
      object:
        capability: independent.shellcommand
        collect:
          command:
            variable: shell-command-check-sessioncookiename-in-httpd-conf-all-include-conf-variable
          error_if_exit_status_not_0: false
          error_if_stderr_exists: false
          pattern: SessionCookieName .+
          shell: bash
        object_title: Gather all SessionCookieName data from httpd and all Include
          conf files
      reported_elements: all
      states:
      - existence: one_or_more
        field: stdout_line
        match: all
        operation: pattern_match
        value: (?i)HttpOnly
      - existence: one_or_more
        field: stdout_line
        match: all
        operation: pattern_match
        value: (?i)Secure
      states_match: all
      test_title: Verify that SessionCookieName directive exists and is configured
        with HttpOnly and Secure in httpd.conf/apache2.conf or included conf files
  variables:
    all-included-conf-files-from-include-refernces-in-httd-conf-variable:
      datatype: string
      expression:
        concat:
        - variable: filepath-httpd-root-variable
        - literal:
            datatype: string
            value: /
        - regex_capture:
            pattern: \S+\s+(\S+)\s*
            value:
              values:
                field: stdout_line
                object:
                  capability: independent.shellcommand
                  collect:
                    command:
                      variable: shell-command-check-all-include-include-optional-files-variable
                    error_if_exit_status_not_0: false
                    error_if_stderr_exists: false
                    pattern: \S+
                    shell: bash
                  object_title: Gather Include statements from httpd.conf
      kind: local
      title: All included conf files from Include refernces in httd.conf
    all-loaded-configuration-filepaths-variable:
      datatype: string
      expression:
        unique:
          regex_capture:
            pattern: \(.*\) (/.*)
            value:
              values:
                field: stdout_line
                object:
                  capability: independent.shellcommand
                  collect:
                    command:
                      variable: command-gather-httpd-apache2-list-all-loaded-configuration-files-variable
                    error_if_exit_status_not_0: false
                    error_if_stderr_exists: false
                    pattern: ' \('
                    shell: bash
                  object_title: Gather all loaded config files
      kind: local
      title: All loaded configuration filepaths
    apache-base-install-directories-unix-variable:
      datatype: string
      expression:
        regex_capture:
          pattern: (^\/.+\/)httpd|(^\/.+/)apache2
          value:
            values:
              field: stdout_line
              object: gather-unique-apache-http-installation-paths-object
      kind: local
      title: Apache base install directories (unix)
    apache-path-httpd-or-apache2-variable:
      datatype: string
      expression:
        regex_capture:
          pattern: '(^\/.+\/httpd|^\/.+\/apache2) '
          value:
            values:
              field: stdout_line
              object: gather-unique-apache-http-installation-paths-object
      kind: local
      title: Apache path to httpd or apache2
    command-gather-httpd-apache2-list-all-loaded-configuration-files-variable:
      datatype: string
      expression:
        concat:
        - variable: apache-path-httpd-or-apache2-variable
        - literal:
            datatype: string
            value: ' -t -D DUMP_INCLUDES'
      kind: local
      title: command to gather httpd/apache2 list of all loaded configuration files
    command-gather-httpd-apache2-modules-variable:
      datatype: string
      expression:
        concat:
        - variable: apache-path-httpd-or-apache2-variable
        - literal:
            datatype: string
            value: ' -M'
      kind: local
      title: command to gather httpd/apache2 modules
    filepath-http-conf-file-variable:
      datatype: string
      expression:
        concat:
        - variable: filepath-httpd-root-variable
        - literal:
            datatype: string
            value: /
        - variable: relative-server-config-file-variable
      kind: local
      title: Filepath to http conf file
    filepath-httpd-root-variable:
      datatype: string
      expression:
        regex_capture:
          pattern: ' -D HTTPD_ROOT="(.+)"'
          value:
            values:
              field: stdout_line
              object:
                capability: independent.shellcommand
                collect:
                  command:
                    variable: httpd-root-apachectl-v-variable
                  error_if_exit_status_not_0: false
                  error_if_stderr_exists: false
                  pattern: HTTPD_ROOT
                  shell: bash
                object_title: Gather HTTPD_ROOT files via apachectl
      kind: local
      title: Filepath to HTTPD_ROOT
    httpd-conf-merged-included-conf-files-from-include-refernces-in-variable:
      datatype: string
      expression:
        concat:
        - variable: filepath-http-conf-file-variable
        - literal:
            datatype: string
            value: ' '
        - variable: merged-included-conf-files-from-include-refernces-in-httd-conf-variable
      kind: local
      title: httpd.conf and merged included conf files from Include refernces in httd.conf
    httpd-root-apachectl-v-variable:
      datatype: string
      expression:
        concat:
        - variable: apache-base-install-directories-unix-variable
        - literal:
            datatype: string
            value: apachectl -V | grep -i 'httpd_root'
      kind: local
      title: httpd_root to apachectl -V
    merged-included-conf-files-from-include-refernces-in-httd-conf-variable:
      datatype: string
      expression:
        merge:
          delimiter: ' '
          order: ascending
          sort: document
          values:
            variable: all-included-conf-files-from-include-refernces-in-httd-conf-variable
      kind: local
      title: merged included conf files from Include refernces in httd.conf
    merged-list-all-loaded-config-files-variable:
      datatype: string
      expression:
        merge:
          delimiter: ' '
          order: ascending
          sort: document
          values:
            variable: all-loaded-configuration-filepaths-variable
      kind: local
      title: Merged list of all loaded config files
    relative-server-config-file-variable:
      datatype: string
      expression:
        regex_capture:
          pattern: ' -D SERVER_CONFIG_FILE="(.+)"'
          value:
            values:
              field: stdout_line
              object:
                capability: independent.shellcommand
                collect:
                  command:
                    variable: server-config-file-apachectl-v-variable
                  error_if_exit_status_not_0: false
                  error_if_stderr_exists: false
                  pattern: SERVER_CONFIG_FILE
                  shell: bash
                object_title: Gather SERVER_CONFIG_FILE files via apachectl
      kind: local
      title: relative to SERVER_CONFIG_FILE
    server-config-file-apachectl-v-variable:
      datatype: string
      expression:
        concat:
        - variable: apache-base-install-directories-unix-variable
        - literal:
            datatype: string
            value: apachectl -V | grep -i 'server_config_file'
      kind: local
      title: server_config_file to apachectl -V
    shell-command-check-all-include-include-optional-files-variable:
      datatype: string
      expression:
        concat:
        - literal:
            datatype: string
            value: 'grep -iEHn ''^\s*Include\s+|^\s*IncludeOptional\s+'' '
        - variable: filepath-http-conf-file-variable
      kind: local
      title: shell command to check for all Include and Include Optional files
    shell-command-check-session-in-all-loaded-conf-files-variable:
      datatype: string
      expression:
        concat:
        - literal:
            datatype: string
            value: 'grep -iHn ''^\s*Session '' '
        - variable: merged-list-all-loaded-config-files-variable
      kind: local
      title: shell command to check Session in all loaded conf files
    shell-command-check-session-in-httpd-conf-all-include-conf-variable:
      datatype: string
      expression:
        concat:
        - literal:
            datatype: string
            value: 'grep -iHn ''^\s*Session '' '
        - variable: httpd-conf-merged-included-conf-files-from-include-refernces-in-variable
      kind: local
      title: shell command to check Session in httpd.conf and all Include conf files
    shell-command-check-sessioncookiename-in-all-loaded-conf-files-variable:
      datatype: string
      expression:
        concat:
        - literal:
            datatype: string
            value: 'grep -iHn ''^\s*SessionCookieName'' '
        - variable: merged-list-all-loaded-config-files-variable
      kind: local
      title: shell command to check SessionCookieName in all loaded conf files
    shell-command-check-sessioncookiename-in-httpd-conf-all-include-conf-variable:
      datatype: string
      expression:
        concat:
        - literal:
            datatype: string
            value: 'grep -iHn ''^\s*SessionCookieName'' '
        - variable: httpd-conf-merged-included-conf-files-from-include-refernces-in-variable
      kind: local
      title: shell command to check SessionCookieName in httpd.conf and all Include
        conf files
  version: 2
