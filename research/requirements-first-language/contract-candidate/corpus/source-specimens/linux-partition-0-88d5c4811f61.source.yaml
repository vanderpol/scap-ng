assessment:
  assessment_title: Linux must use a separate file system for /var/tmp.
  class: compliance
  evaluate:
    test: var-tmp-mounted-test
  id: ng.shared.var-tmp-is-mounted
  mode: automated
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.3.0
  tests:
    var-tmp-mounted-test:
      capability: linux.partition
      existence: one_or_more
      match: all
      object:
        capability: linux.partition
        object_title: /var/tmp
        select:
          mount_point:
            operation: equals
            value: /var/tmp
      reported_elements: all
      test_title: /var/tmp is mounted
  version: 1
