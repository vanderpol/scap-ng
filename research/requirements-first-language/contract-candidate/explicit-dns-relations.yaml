id: native-dns-zone-and-key-signing
title: Every forward DNS zone must be signed with both key kinds in validity range
target: windows.dns.zones
filter:
  direction: {equals: forward}
constraints:
  min_count: 1
  fields:
    signed: {equals: true}
sub_resources:
  - target: zone_signing_keys
    relationship: zone_id
    constraints:
      min_count: 1
      all:
        validity_hours: {between: [48, 168]}
  - target: key_signing_keys
    relationship: zone_id
    constraints:
      min_count: 1
      all:
        validity_hours: {between: [48, 168]}