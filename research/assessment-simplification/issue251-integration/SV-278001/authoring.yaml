assessment:
  id: source-sv-278001-assessment
  version: 1
  assessment_title: Windows Server 2025 default permissions for the HKEY_LOCAL_MACHINE registry hive must be maintained.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  variables:
    required-permissions-hkey-local-machine-security-variable:
      title: Required Permissions for HKEY_LOCAL_MACHINE\Security
      kind: constant
      datatype: string
      expression:
        literal:
        - '^Identity:NT AUTHORITY\\SYSTEM, Rights: FullControl, Access: Allow, IsInherited: False, InheritanceFlags: (ContainerInherit|None), PropagationFlags: None$'
        - '^Identity:BUILTIN\\Administrators, Rights: ReadPermissions, ChangePermissions, Access: Allow, IsInherited: False, InheritanceFlags: (ContainerInherit|None),
          PropagationFlags: None$'
    required-permissions-non-domain-controllers-hkey-local-machine-system-hkey-variable:
      title: Required Permissions for Non-Domain Controllers HKEY_LOCAL_MACHINE\System and for HKEY_LOCAL_MACHINE\Software on all servers
      kind: constant
      datatype: string
      expression:
        literal:
        - '^Identity:BUILTIN\\Users, Rights: ReadKey, Access: Allow, IsInherited: False, InheritanceFlags: (ContainerInherit|None), PropagationFlags: None$'
        - '^Identity:BUILTIN\\Administrators, Rights: FullControl, Access: Allow, IsInherited: False, InheritanceFlags: (ContainerInherit|None), PropagationFlags:
          None$'
        - '^Identity:NT AUTHORITY\\SYSTEM, Rights: FullControl, Access: Allow, IsInherited: False, InheritanceFlags: (ContainerInherit|None), PropagationFlags: None$'
        - '^Identity:CREATOR OWNER, Rights: FullControl, Access: Allow, IsInherited: False, InheritanceFlags: (ContainerInherit|None), PropagationFlags: (None|InheritOnly)$'
        - '^Identity:APPLICATION PACKAGE AUTHORITY\\ALL APPLICATION PACKAGES, Rights: ReadKey, Access: Allow, IsInherited: False, InheritanceFlags: (ContainerInherit|None),
          PropagationFlags: None$'
        - '^Identity:S-1-15-3-1024-1065365936-1281604716-3511738428-1654721687-432734479-3232135806-4053264122-3456934681, Rights: ReadKey, Access: Allow, IsInherited:
          False, InheritanceFlags: (ContainerInherit|None), PropagationFlags: None$'
    required-permissions-domain-controllers-hkey-local-machine-system-variable:
      title: Required Permissions for Domain Controllers HKEY_LOCAL_MACHINE\System
      kind: constant
      datatype: string
      expression:
        literal:
        - '^Identity:NT AUTHORITY\\Authenticated Users, Rights: ReadKey, Access: Allow, IsInherited: False, InheritanceFlags: (ContainerInherit|None), PropagationFlags:
          None$'
        - '^Identity:BUILTIN\\Administrators, Rights: FullControl, Access: Allow, IsInherited: False, InheritanceFlags: (ContainerInherit|None), PropagationFlags:
          None$'
        - '^Identity:NT AUTHORITY\\SYSTEM, Rights: FullControl, Access: Allow, IsInherited: False, InheritanceFlags: (ContainerInherit|None), PropagationFlags: None$'
        - '^Identity:CREATOR OWNER, Rights: FullControl, Access: Allow, IsInherited: False, InheritanceFlags: (ContainerInherit|None), PropagationFlags: (None|InheritOnly)$'
        - '^Identity:APPLICATION PACKAGE AUTHORITY\\ALL APPLICATION PACKAGES, Rights: ReadKey, Access: Allow, IsInherited: False, InheritanceFlags: (ContainerInherit|None),
          PropagationFlags: None$'
        - '^Identity:BUILTIN\\Server Operators, Rights: ReadKey, Access: Allow, IsInherited: False, InheritanceFlags: (ContainerInherit|None), PropagationFlags: None$'
        - '^Identity:S-1-15-3-1024-1065365936-1281604716-3511738428-1654721687-432734479-3232135806-4053264122-3456934681, Rights: ReadKey, Access: Allow, IsInherited:
          False, InheritanceFlags: (ContainerInherit|None), PropagationFlags: None$'
        - ''
  tests:
    default-permissions-hkey-local-machine-security-registry-key-maintained-test:
      test_title: Default permissions for the HKEY_LOCAL_MACHINE\SECURITY registry key must be maintained.
      capability: independent.shellcommand
      object: gather-permissions-hkey-local-machine-security-registry-object
      reported_elements: all
      require:
        items_found: one_or_more
        items_satisfying: every
        fields:
          stdout_line:
            datatype: string
            value_match: one_or_more
            matches_regex:
              variable: required-permissions-hkey-local-machine-security-variable
            values_found: one_or_more
            values_matching: every
    default-non-domain-controller-permissions-hkey-local-machine-software-registry-test:
      test_title: Default Non-Domain Controller permissions for the HKEY_LOCAL_MACHINE\SOFTWARE registry key must be maintained.
      capability: independent.shellcommand
      object: gather-permissions-hkey-local-machine-software-registry-object
      reported_elements: all
      require:
        items_found: one_or_more
        items_satisfying: every
        fields:
          stdout_line:
            datatype: string
            value_match: one_or_more
            matches_regex:
              variable: required-permissions-non-domain-controllers-hkey-local-machine-system-hkey-variable
            values_found: one_or_more
            values_matching: every
    system-windows-domain-controller-test:
      test_title: The system is a Windows Domain Controller
      capability: windows.wmi.query
      object: windows-wmi57-object
      reported_elements: all
      require:
        items_found: one_or_more
        items_satisfying: every
        or:
        - fields:
            result:
              record:
                fields:
                  domainrole:
                    datatype: string
                    equals: '4'
                    values_found: one_or_more
                    values_matching: every
                records_found: one_or_more
                records_matching: every
        - fields:
            result:
              record:
                fields:
                  domainrole:
                    datatype: string
                    equals: '5'
                    values_found: one_or_more
                    values_matching: every
                records_found: one_or_more
                records_matching: every
    default-domain-controller-permissions-hkey-local-machine-system-registry-key-test:
      test_title: Default Domain Controller permissions for the HKEY_LOCAL_MACHINE\SYSTEM registry key must be maintained.
      capability: independent.shellcommand
      object: gather-permissions-hkey-local-machine-software-registry-object-2-object
      reported_elements: all
      require:
        items_found: one_or_more
        items_satisfying: every
        fields:
          stdout_line:
            datatype: string
            value_match: one_or_more
            matches_regex:
              variable: required-permissions-domain-controllers-hkey-local-machine-system-variable
            values_found: one_or_more
            values_matching: every
    default-non-domain-controller-permissions-hkey-local-machine-system-registry-test:
      test_title: Default Non-Domain Controller permissions for the HKEY_LOCAL_MACHINE\SYSTEM registry key must be maintained.
      capability: independent.shellcommand
      object: gather-permissions-hkey-local-machine-software-registry-object-2-object
      reported_elements: all
      require:
        items_found: one_or_more
        items_satisfying: every
        fields:
          stdout_line:
            datatype: string
            value_match: one_or_more
            matches_regex:
              variable: required-permissions-non-domain-controllers-hkey-local-machine-system-hkey-variable
            values_found: one_or_more
            values_matching: every
  evaluate:
    and:
    - test: default-permissions-hkey-local-machine-security-registry-key-maintained-test
    - test: default-non-domain-controller-permissions-hkey-local-machine-software-registry-test
    - or:
      - and:
        - test: system-windows-domain-controller-test
        - test: default-domain-controller-permissions-hkey-local-machine-system-registry-key-test
      - and:
        - not:
            test: system-windows-domain-controller-test
        - test: default-non-domain-controller-permissions-hkey-local-machine-system-registry-test
  shared_objects:
    gather-permissions-hkey-local-machine-security-registry-object:
      capability: independent.shellcommand
      object_title: Gather permissions for the HKEY_LOCAL_MACHINE\SECURITY registry
      shell: powershell
      command: '([Microsoft.Win32.Registry]::LocalMachine.OpenSubKey("Security", [System.Security.AccessControl.RegistryRights]::ReadPermissions)).GetAccessControl().Access
        |  Where-Object { $_.RegistryRights -notmatch ''\d+'' } | ForEach-Object { "Identity:$($_.IdentityReference), Rights: $($_.RegistryRights), Access: $($_.AccessControlType),
        IsInherited: $($_.IsInherited), InheritanceFlags: $($_.InheritanceFlags), PropagationFlags: $($_.PropagationFlags)" }'
      error_if_exit_status_not_0: false
      error_if_stderr_exists: false
    gather-permissions-hkey-local-machine-software-registry-object:
      capability: independent.shellcommand
      object_title: Gather permissions for the HKEY_LOCAL_MACHINE\SOFTWARE registry
      shell: powershell
      command: '([Microsoft.Win32.Registry]::LocalMachine.OpenSubKey("Software", [System.Security.AccessControl.RegistryRights]::ReadPermissions)).GetAccessControl().Access
        | Where-Object { $_.RegistryRights -notmatch ''\d+'' } | ForEach-Object { "Identity:$($_.IdentityReference), Rights: $($_.RegistryRights), Access: $($_.AccessControlType),
        IsInherited: $($_.IsInherited), InheritanceFlags: $($_.InheritanceFlags), PropagationFlags: $($_.PropagationFlags)" }'
      error_if_exit_status_not_0: false
      error_if_stderr_exists: false
    windows-wmi57-object:
      capability: windows.wmi.query
      object_title: null
      namespace: root\cimv2
      query: SELECT DomainRole FROM win32_computersystem
    gather-permissions-hkey-local-machine-software-registry-object-2-object:
      capability: independent.shellcommand
      object_title: Gather permissions for the HKEY_LOCAL_MACHINE\SOFTWARE registry
      shell: powershell
      command: '([Microsoft.Win32.Registry]::LocalMachine.OpenSubKey("System", [System.Security.AccessControl.RegistryRights]::ReadPermissions)).GetAccessControl().Access
        | Where-Object { $_.RegistryRights -notmatch ''\d+'' } | ForEach-Object { "Identity:$($_.IdentityReference), Rights: $($_.RegistryRights), Access: $($_.AccessControlType),
        IsInherited: $($_.IsInherited), InheritanceFlags: $($_.InheritanceFlags), PropagationFlags: $($_.PropagationFlags)" }'
      error_if_exit_status_not_0: false
      error_if_stderr_exists: false
