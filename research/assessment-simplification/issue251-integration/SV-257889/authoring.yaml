assessment:
  id: source-sv-257889-assessment
  version: 1
  assessment_title: All the operating system local initialization files must have mode 0740 or less permissive.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  variables:
    home-directories-non-system-users-variable:
      title: The home directories of non-system users.
      kind: local
      datatype: string
      expression:
        values:
          object: only-non-system-users-uid-999-home-dirs-excluding-root-object
          field: home_dir
    home-directory-root-user-variable:
      title: The home directory of the root user.
      kind: local
      datatype: string
      expression:
        values:
          object: only-root-users-uid-0-home-dirs-excluding-root-directory-object
          field: home_dir
  tests:
    local-initialization-files-non-system-users-have-mode-0740-or-test:
      test_title: Local initialization files for non-system users have mode 0740 or less permissive.
      capability: unix.file
      object: local-initialization-files-non-system-users-object
      reported_elements: all
      require:
        items_found: may_be_absent
        items_satisfying: every
        and:
        - fields:
            setuid:
              datatype: boolean
              equals: false
              values_found: one_or_more
              values_matching: every
        - fields:
            setgid:
              datatype: boolean
              equals: false
              values_found: one_or_more
              values_matching: every
        - fields:
            sticky:
              datatype: boolean
              equals: false
              values_found: one_or_more
              values_matching: every
        - fields:
            group_write:
              datatype: boolean
              equals: false
              values_found: one_or_more
              values_matching: every
        - fields:
            group_execute:
              datatype: boolean
              equals: false
              values_found: one_or_more
              values_matching: every
        - fields:
            other_read:
              datatype: boolean
              equals: false
              values_found: one_or_more
              values_matching: every
        - fields:
            other_write:
              datatype: boolean
              equals: false
              values_found: one_or_more
              values_matching: every
        - fields:
            other_execute:
              datatype: boolean
              equals: false
              values_found: one_or_more
              values_matching: every
    local-initialization-files-root-have-mode-0740-or-less-permissive-test:
      test_title: Local initialization files for root have mode 0740 or less permissive.
      capability: unix.file
      object: local-initialization-files-root-user-object
      reported_elements: all
      require:
        items_found: one_or_more
        items_satisfying: every
        and:
        - fields:
            setuid:
              datatype: boolean
              equals: false
              values_found: one_or_more
              values_matching: every
        - fields:
            setgid:
              datatype: boolean
              equals: false
              values_found: one_or_more
              values_matching: every
        - fields:
            sticky:
              datatype: boolean
              equals: false
              values_found: one_or_more
              values_matching: every
        - fields:
            group_write:
              datatype: boolean
              equals: false
              values_found: one_or_more
              values_matching: every
        - fields:
            group_execute:
              datatype: boolean
              equals: false
              values_found: one_or_more
              values_matching: every
        - fields:
            other_read:
              datatype: boolean
              equals: false
              values_found: one_or_more
              values_matching: every
        - fields:
            other_write:
              datatype: boolean
              equals: false
              values_found: one_or_more
              values_matching: every
        - fields:
            other_execute:
              datatype: boolean
              equals: false
              values_found: one_or_more
              values_matching: every
  evaluate:
    and:
    - test: local-initialization-files-non-system-users-have-mode-0740-or-test
    - test: local-initialization-files-root-have-mode-0740-or-less-permissive-test
  shared_objects:
    users-username-object:
      capability: unix.password
      object_title: Users with an username
      username:
        datatype: string
        matches_regex: '[\w]+'
    only-non-system-users-uid-999-home-dirs-excluding-root-object:
      capability: unix.password
      set:
        operator: difference
        operands:
        - object: users-username-object
          filters:
          - exclude:
              user_id:
                datatype: integer
                values_found: one_or_more
                values_matching: every
                less_than: 1000
          - exclude:
              home_dir:
                datatype: string
                values_found: one_or_more
                values_matching: every
                equals: /
      object_title: only non-system users (uid>999) home-dirs excluding root directory
    local-initialization-files-non-system-users-object:
      capability: unix.file
      object_title: local initialization files of non-system users.
      set:
        operator: union
        operands:
        - object:
            capability: unix.file
            object_title: local initialization files of non-system users.
            filesystem: all
            traversal:
              max_depth: 1
              recurse: symlinks
            directory:
              datatype: string
              value_match: one_or_more
              equals:
                variable: home-directories-non-system-users-variable
            name:
              datatype: string
              matches_regex: ^\.[^\s\.]+
          filters:
          - exclude:
              type:
                datatype: string
                values_found: one_or_more
                values_matching: every
                equals: directory
    only-root-users-uid-0-home-dirs-excluding-root-directory-object:
      capability: unix.password
      set:
        operator: difference
        operands:
        - object: users-username-object
          filters:
          - exclude:
              user_id:
                datatype: integer
                values_found: one_or_more
                values_matching: every
                greater_than: 0
          - exclude:
              home_dir:
                datatype: string
                values_found: one_or_more
                values_matching: every
                equals: /
      object_title: only root users (uid=0) home-dirs excluding root directory
    local-initialization-files-root-user-object:
      capability: unix.file
      object_title: local initialization files of root user.
      set:
        operator: union
        operands:
        - object:
            capability: unix.file
            object_title: local initialization files of root user.
            filesystem: all
            traversal:
              max_depth: 1
              recurse: symlinks
            directory:
              datatype: string
              value_match: one_or_more
              equals:
                variable: home-directory-root-user-variable
            name:
              datatype: string
              matches_regex: ^\.[^\s\.]+
          filters:
          - exclude:
              type:
                datatype: string
                values_found: one_or_more
                values_matching: every
                equals: directory
