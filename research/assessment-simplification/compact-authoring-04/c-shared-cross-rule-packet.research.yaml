catalog:
  'shared/windows/password_policy@2026-10':
    from:
      windows.passwordpolicy: {}
assessments:
  - id: c-research-password-history
    observations:
      host_password_policy:
        use: 'shared/windows/password_policy@2026-10'
        sha256: 86874bfbf9ab94c780a3fdd64a7db6cbd8fff6b78b7de4e6ea7529e27fdb14ad
    checks:
      history_24:
        observation: host_password_policy
        must:
