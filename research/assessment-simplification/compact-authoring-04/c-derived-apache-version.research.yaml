# C research-only authored example. Not normative; source OVAL runtime parity unproven.
assessment_id: SV-214273.automated
observations: {}
steps:
  - name: apache_executable_paths
    source_id: apache-path-httpd-or-apache2-variable
    title: Apache path to httpd or apache2
    kind: local
    datatype: string
    derive:
      extract:
        pattern: '(^\/.+\/httpd|^\/.+\/apache2) '
        value:
          read_field:
            field: stdout_line
            observation:
              description: Gather unique apache http installation paths
              from:
                independent.shellcommand:
                  collect:
                    command: >-
                      ps -e -o command --no-headers | grep -e httpd -e apache2 | sort | uniq
                    shell: bash
                    pattern: '^\/\S+(\/httpd|\/apache2)\s*'
                    error_if_exit_status_not_0: false
                    error_if_stderr_exists: false
  - name: apache_version_command
    source_id: command-gather-apache-version-variable
    title: command to gather apache version
    kind: local
    datatype: string
    derive:
      combine:
        - use: apache_executable_paths
        - constant:
            datatype: string
            value: ' -V'
