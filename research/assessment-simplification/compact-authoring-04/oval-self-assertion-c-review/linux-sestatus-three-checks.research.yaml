# 0.4-C research; original OVAL 5.12.3 source compatibility projection, NOT scanner parity.
# Source revision: OVAL-Community/SCAP-Self-Assertion@e3538595c5083b9c34d937a81d319234df9bbfaa
# Original: linux/linux-def_sestatus_test.xml
# Definition: oval:org.cisecurity.test:def:1
# Original Tests: Test current_mode; Test mode_from_config_file; Test loaded_policy_name
id: roundtrip.oval-org-cisecurity-test-def-1
observations:
  system_status:
    from:
      linux.sestatus: {}
checks:
  test_current_mode:
    observation: system_status
    source_test: test-test-current-mode
    must:
      every_item:
        selinux_status: enabled
        current_mode: enforcing
  test_loaded_policy_name:
    observation: system_status
    source_test: test-test-loaded-policy-name
    must:
      every_item:
        selinux_status: enabled
        loaded_policy_name: targeted
  test_mode_from_config_file:
    observation: system_status
    source_test: test-test-mode-from-config-file
    must:
      every_item:
        selinux_status: enabled
        mode_from_config_file: enforcing
require:
  every:
  - check: test_current_mode
  - check: test_mode_from_config_file
  - check: test_loaded_policy_name
