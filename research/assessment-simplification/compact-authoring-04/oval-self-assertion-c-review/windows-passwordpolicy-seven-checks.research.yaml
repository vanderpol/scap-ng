# 0.4-C research only. Exact A Test projection, NOT scanner parity.
# Source revision: OVAL-Community/SCAP-Self-Assertion@e3538595c5083b9c34d937a81d319234df9bbfaa
# Original: windows/win-def_passwordpolicy_test.xml
# Definition: oval:org.mitre.oval.test:def:998
# Original test family: Windows password-policy seven complementary fields
id: roundtrip.oval-org-mitre-oval-test-def-998
observations:
  system_status:
    from:
      windows.passwordpolicy: {}
checks:
  anonymous_name_lookup:
    observation: system_status
    source_test: test-test-if-passwordpolicy-test-supported-anonymous-name-lookup
    must:
      every_item:
        anonymous_name_lookup: false
  max_passwd_age:
    observation: system_status
    source_test: test-test-if-passwordpolicy-test-supported-max-passwd-age
    must:
      every_item:
        max_passwd_age:
          greater_than_or_equal: -1
  min_passwd_age:
    observation: system_status
    source_test: test-test-if-passwordpolicy-test-supported-min-passwd-age
    must:
      every_item:
        min_passwd_age:
          greater_than_or_equal: 0
  min_passwd_len:
    observation: system_status
    source_test: test-test-if-passwordpolicy-test-supported-min-passwd-len
    must:
      every_item:
        min_passwd_len:
          greater_than_or_equal: 0
  password_complexity:
    observation: system_status
    source_test: test-test-if-passwordpolicy-test-supported-password-complexity
    must:
      every_item:
        password_complexity: true
  password_hist_len:
    observation: system_status
    source_test: test-test-if-passwordpolicy-test-supported-password-hist-len
    must:
      every_item:
        password_hist_len:
          greater_than_or_equal: 0
  reversible_encryption:
    observation: system_status
    source_test: test-test-if-passwordpolicy-test-supported-reversible-encryption
    must:
      every_item:
        reversible_encryption: false
require:
  every:
  - check: max_passwd_age
  - check: min_passwd_age
  - check: min_passwd_len
  - check: password_hist_len
  - check: password_complexity
  - check: reversible_encryption
  - check: anonymous_name_lookup
