id: research-c-windows-wdigest-disabled
require:
  each: windows.registry
  where:
    hive: local_machine
    key:
      equals: 'SYSTEM\CurrentControlSet\Control\SecurityProviders\Wdigest'
    name:
      equals: UseLogonCredential
  registry_view: unspecified_requires_xml_parity
  collected_items:
    exists: one_or_more
    match: all
  on_same_item:
    all:
      - type:
          equals: dword
          field_exists: one_or_more
          field_match: all
      - value:
          equals: 0
          field_exists: one_or_more
          field_match: all
