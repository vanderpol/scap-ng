# Research #245: new C permission macro on a simple synthetic file target.
# The mode comparator is independently verified against *real* RHEL9
# SV-257889's eight source permission booleans. This file selector is
# demonstrative and is NOT the SV-257889 account-home traversal.
from:
  unix.file:
    full_path: /etc/passwd
must:
  every_item:
    permission_bits:
      no_more_permissive_than: '0740'
