# EXPERIMENTAL semantic event-coverage Test, not templates or OVAL expansion.
# This file is consumed by audit_coverage.py, not requirements.py.
source: loaded
architectures: [b32, b64]
syscalls: [setxattr, fsetxattr, lsetxattr, removexattr, fremovexattr, lremovexattr]
actors: [root-logins, user-logins]
