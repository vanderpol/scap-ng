# EXPERIMENTAL research notation; not accepted v0.1.0 grammar.
assessment:
  id: research.SV-278138
  version: 1
  assessment_title: Experimental SV-278138
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    database-log-files-path-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: case insensitive equals
          datatype: string
          value: System\CurrentControlSet\Services\NTDS\Parameters
        name:
          operation: case insensitive equals
          datatype: string
          value: Database log files path
      object_title: Database log files path
    database-log-files-system-permissions-object:
      capability: windows.fileeffectiverights53
      select:
        directory:
          value:
            variable: database-log-files-path-variable
          operation: equal
          datatype: string
          variable_match: all
        name:
          value: ^(.*)$
          operation: match
          datatype: string
        trustee_sid:
          value: S-1-5-18
          operation: equal
          datatype: string
      object_title: Database log files - SYSTEM permissions
      filesystem: any
    database-log-files-administrators-permissions-object:
      capability: windows.fileeffectiverights53
      select:
        directory:
          value:
            variable: database-log-files-path-variable
          operation: equal
