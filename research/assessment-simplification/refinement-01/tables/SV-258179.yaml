# EXPERIMENTAL finite publisher-owned table; not runtime NG grammar.
kind: audit_patterns
id: research.refinement.SV-258179
defaults:
  full_path: /etc/audit/audit.rules
  existence: all
  match: all
  instance:
    value: '1'
    operation: greater_or_equal
    datatype: integer
  collect:
    ignore_case: false
    multiline: true
    singleline: false
    item_creation: all_object_elements_fullfilled
  filesystem: any
templates:
  pattern-template-1: ^\s*-a\s+(always,exit|exit,always)\s+-F\s+arch=${arch}\s+(?:.*(-S\s+${syscall}\s+|(\s+|,)${syscall}(\s+|,))).*-F\s+auid>=1000\s+-F\s+auid!=(4294967295|-1|unset)(\s+(-k\s+|-F\s+key=)[-\w]+)*\s*$
