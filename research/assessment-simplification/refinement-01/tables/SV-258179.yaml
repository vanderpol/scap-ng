  pattern-template-4: ^\s*-a\s+(?:always,exit|exit,always)\s+-F\s+arch=${arch}\s+(?:-S\s+[,\w]+\s+)*-S\s+[,\w]*\b${syscall}\b[,\w]*\s+(?:-S\s+[,\w]+\s+)*-F\s+auid=0(?:\s+(?:-k\s+|-F\s+key=)[-\w]+)*\s*$
