assessment:
  id: niwc.rhel_9.condition.kernel-dumps-enabled.assessment
  version: 3
  assessment_title: Kernel dumps are enabled
  mode: automated
  class: compliance
  purpose: applicability
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-sysctl-object:
      capability: unix.sysctl
      select:
        name:
          value: kernel.core_pattern
          operation: equal
          datatype: string
      object_title: null
  states:
    state-unix-sysctl:
      state_title: null
      capability: unix.sysctl
      state:
        field: value
        value: '|/bin/false'
        operation: equal
        datatype: string
        match: all
        existence: some
  tests:
    test-kernel-core-pattern-setting-in-kernel-set-bin-false:
      test_title: kernel.core_pattern setting in kernel is set to |/bin/false
      capability: unix.sysctl
      object: unix-sysctl-object
      states:
      - state-unix-sysctl
      existence: all
      match: all
  evaluate:
    not:
      test: test-kernel-core-pattern-setting-in-kernel-set-bin-false
