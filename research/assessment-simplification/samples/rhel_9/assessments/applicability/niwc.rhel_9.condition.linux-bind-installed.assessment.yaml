assessment:
  id: niwc.rhel_9.condition.linux-bind-installed.assessment
  version: 1
  assessment_title: Linux with BIND installed
  mode: automated
  class: inventory
  purpose: applicability
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    bind-object:
      capability: linux.rpminfo
      select:
        package_name:
          value: bind
          operation: equal
          datatype: string
      object_title: bind
  states: {}
  tests:
    test-bind-installed:
      test_title: BIND installed
      capability: linux.rpminfo
      object: bind-object
      existence: some
      match: all
  evaluate:
    test: test-bind-installed
