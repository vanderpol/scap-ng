assessment:
  id: niwc.rhel_9.condition.linux-autofs-installed.assessment
  version: 1
  assessment_title: Linux with autofs installed
  mode: automated
  class: inventory
  purpose: applicability
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-rpminfo-object:
      capability: linux.rpminfo
      select:
        package_name:
          value: autofs
          operation: equal
          datatype: string
      object_title: null
  states: {}
  tests:
    test-autofs-package-installed:
      test_title: The autofs package is installed.
      capability: linux.rpminfo
      object: linux-rpminfo-object
      existence: some
      match: all
  evaluate:
    test: test-autofs-package-installed
