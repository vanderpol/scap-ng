assessment:
  id: niwc.rhel_9.condition.gnome-shell-package.assessment
  version: 2
  assessment_title: Gnome-shell Package
  mode: automated
  class: inventory
  purpose: applicability
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-rpminfo-object:
      capability: linux.rpminfo
      select:
        package_name:
          value: gnome-shell
          operation: equal
          datatype: string
      object_title: null
    linux-dpkginfo-object:
      capability: linux.dpkginfo
      select:
        name:
          value: gnome-shell
          operation: equal
          datatype: string
      object_title: null
  states: {}
  tests:
    test-gnome-installed:
      test_title: Gnome is installed
      capability: linux.rpminfo
      object: linux-rpminfo-object
      existence: all
      match: all
    test-gnome-installed-2:
      test_title: Gnome is installed
      capability: linux.dpkginfo
      object: linux-dpkginfo-object
      existence: all
      match: all
  evaluate:
    any:
    - test: test-gnome-installed
    - test: test-gnome-installed-2
