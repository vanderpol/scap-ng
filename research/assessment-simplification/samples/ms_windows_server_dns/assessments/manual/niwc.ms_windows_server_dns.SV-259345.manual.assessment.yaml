assessment:
  id: niwc.ms_windows_server_dns.SV-259345.manual
  version: 1
  assessment_title: The validity period for the Resource Record Signatures (RRSIGs) covering a zone's DNSKEY RRSet
    must be no less than two days and no more than one week.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: This check is not applicable for Windows DNS Servers that host only Active Directory-integrated
    zones or Windows DNS Servers on a classified network. Log on to the DNS server using the account designated
    as Administrator or DNS Administrator. Press the Windows key + R and execute "dnsmgmt.msc". On the opened DNS
    Manager snap-in from the left pane, expand the server name for the DNS server and then expand "Forward Lookup
    Zones". From the expanded list, click to select the zone. Right-click the zone and select DNSSEC >> Properties.
    Select the "KSK" tab. Verify the "DNSKEY signature validity period (hours):" is set to at least 48 hours and
    no more than 168 hours. Select the "ZSK" tab. Verify the "DNSKEY signature validity period (hours):" is set
    to at least 48 hours and no more than 168 hours. If either the "KSK" or "ZSK" tab "DNSKEY signature validity
    period (hours):" values are set to less than 48 hours or more than 168 hours, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
