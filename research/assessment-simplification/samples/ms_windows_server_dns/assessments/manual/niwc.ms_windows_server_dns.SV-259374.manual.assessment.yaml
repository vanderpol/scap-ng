assessment:
  id: niwc.ms_windows_server_dns.SV-259374.manual
  version: 1
  assessment_title: The Windows DNS Server's IP address must be statically defined and configured locally on the
    server.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Log on to the DNS server using the Domain Admin or Enterprise Admin account or Local Administrator
    account. Use "ipconfig /all" to identify all network adapters. or Locate the "Network Internet Access" icon,
    right-click on it, and select "Open Network & Sharing Center". Click "Change adapter settings". Right-click
    on the Ethernet and click "Properties". Select "Internet Protocol Version 4 (TCP/IPv4)" and click "Properties".
    Verify the "Use the following IP address" is selected, with an IP address, subnet mask, and default gateway
    assigned. If the "Use the following IP address" is not selected with a configured IP address, subnet mask, and
    default gateway, this is a finding.
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
