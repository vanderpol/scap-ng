assessment:
  id: niwc.ms_windows_server_dns.SV-259350.manual
  version: 1
  assessment_title: The Windows DNS Server must be configured to enable DNSSEC Resource Records (RRs).
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: This check is not applicable for Windows DNS Servers that host only Active Directory-integrated
    zones or for Windows DNS Servers on a classified network. Log on to the DNS server using the Domain Admin or
    Enterprise Admin account or Local Administrator account. Press the Windows key + R and execute "dnsmgmt.msc".
    On the opened DNS Manager snap-in from the left pane, expand the server name for the DNS server and then expand
    "Forward Lookup Zones". From the expanded list, click to select each zone. Review the RRs for each zone and
    verify all of the DNSSEC record types are included for the zone. Note: The DS (Delegation Signer) record should
    also exist but the requirement for it is validated under WDNS-22-000054. RRSIG (Resource Read Signature) DNSKEY
    (Public Key) NSEC3 (Next Secure 3) If the zone does not show all the DNSSEC record types, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
