rule:
  id: SV-259374
  version: r1156950
  title: The Windows DNS Server's IP address must be statically defined and configured locally on the server.
  severity: medium
  role: full
  weight: 10.0
  discussion: The major threat associated with DNS forged responses or failures is the integrity of the DNS data
    returned in the response. The principle of DNSSEC is to mitigate this threat by providing data origin authentication,
    establishing trust in the source. By requiring remote clients to obtain origin authentication and integrity
    verification assurances for the host/service name to network address resolution information obtained through
    the service, data origin is validated. Ensuring all name servers have static IP addresses makes it possible
    to configure restricted DNS communication, such as with DNSSEC, between the name servers.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
