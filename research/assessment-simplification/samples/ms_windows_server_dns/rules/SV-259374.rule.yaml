  parameters: {}
  remediation:
    guidance: Log on to the DNS server using the Domain Admin or Enterprise Admin account or Local Administrator
      account. Use "ipconfig /all" to identify all network adapters. or Locate the "Network Internet Access" icon,
      right-click on it, and select "Open Network & Sharing Center". Click "Change adapter settings". Right-click
      on the Ethernet and click "Properties". Select "Internet Protocol Version 4 (TCP/IPv4)" and click "Properties".
      Select "Use the following IP address" and populate with an IP address, subnet mask, and default gateway.
