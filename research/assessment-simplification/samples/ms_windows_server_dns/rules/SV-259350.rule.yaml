rule:
  id: SV-259350
  version: r1156954
  title: The Windows DNS Server must be configured to enable DNSSEC Resource Records (RRs).
  severity: high
  role: full
  weight: 10.0
  discussion: 'The specification for a digital signature mechanism in the context of the DNS infrastructure is in
    the Internet Engineering Task Force''s (IETF''s) DNSSEC standard. In DNSSEC, trust in the public key (for signature
    verification) of the source is established not by going to a third party or a chain of third parties (as in
    public key infrastructure [PKI] chaining), but by starting from a trusted zone (such as the root zone) and establishing
    the chain of trust down to the current source of response through successive verifications of signature of the
    public key of a child by its parent. The public key of the trusted zone is called the trust anchor. After authenticating
    the source, the next process DNSSEC calls for is to authenticate the response. DNSSEC mechanisms involve two
    main processes: sign and serve and verify signature. Before a DNSSEC-signed zone can be deployed, a name server
    must be configured to enable DNSSEC processing.'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
