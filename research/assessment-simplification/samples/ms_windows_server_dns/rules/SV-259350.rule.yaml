  parameters: {}
  remediation:
    guidance: Sign or re-sign the hosted zone(s) on the DNS server being validated. Log on to the DNS server using
      the Domain Admin or Enterprise Admin account or Local Administrator account. Press the Windows key + R and
      execute "dnsmgmt.msc". On the opened DNS Manager snap-in from the left pane, expand the server name for the
      DNS server and then expand "Forward Lookup Zones". From the expanded list, right-click to select the zone
      (repeat for each hosted zone), point to DNSSEC, and then click "Sign the Zone", using either approved saved
      parameters or approved custom parameters.
