rule:
  id: SV-214228
  version: r960735
  title: The Apache web server must limit the number of allowed simultaneous session requests.
  severity: medium
  role: full
  weight: 10.0
  discussion: Apache web server management includes the ability to control the number of users and user sessions
    that utilize an Apache web server. Limiting the number of allowed users and sessions per user is helpful in
    limiting risks related to several types of denial-of-service (DOS) attacks. Although there is some latitude
    concerning the settings, they should follow DoD-recommended values and be configurable to allow for future DoD
    direction. While the DoD will specify recommended values, the values can be adjusted to accommodate the operational
    requirements of a given system.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: AS24-U1-000010
  - scheme: vulnerability
    value: V-214228
  - scheme: cci
    value: CCI-000054
  references:
  - title: DPMS Target Apache Server 2.4 UNIX Server
    publisher: DISA
    type: DPMS Target
    subject: Apache Server 2.4 UNIX Server
    identifier: '3996'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Determine the location of the "HTTPD_ROOT" directory and the "httpd.conf" file: # apachectl -V |
      egrep -i ''httpd_root|server_config_file'' -D HTTPD_ROOT="/etc/httpd" -D SERVER_CONFIG_FILE="conf/httpd.conf"
      Note: The apachectl front end is the preferred method for locating the Apache httpd file. For some Linux distributions,
      "apache2ctl -V" or "httpd -V" can also be used. Set the "KeepAlive" directive to a value of "on"; add the
      directive if it does not exist. Set the "MaxKeepAliveRequests" directive to a value of "100" or greater; add
      the directive if it does not exist. Restart Apache: apachectl restart'
