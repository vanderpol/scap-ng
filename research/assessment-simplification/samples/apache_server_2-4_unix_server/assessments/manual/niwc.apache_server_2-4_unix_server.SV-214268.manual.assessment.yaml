assessment:
  id: niwc.apache_server_2-4_unix_server.SV-214268.manual
  version: 1
  assessment_title: Cookies exchanged between the Apache web server and the client, such as session cookies, must
    have cookie properties set to prohibit client-side scripts from reading the cookie data.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the session cookie module is loaded # httpd -M | grep -i session_cookie_module Output should
    look similar to: session_cookie_module (shared) Determine the location of the "HTTPD_ROOT" directory and the
    "httpd.conf" file: # apachectl -V | egrep -i ''httpd_root|server_config_file'' -D HTTPD_ROOT="/etc/httpd" -D
    SERVER_CONFIG_FILE="conf/httpd.conf" Note: The apachectl front end is the preferred method for locating the
    Apache httpd file. For some Linux distributions, "apache2ctl -V" or "httpd -V" can also be used. Search for
    the directive "Session" in the "httpd.conf" file: # cat httpd.conf | grep -i "Session" Output should be similar
    to: Session on SessionCookieName httpOnly Secure SessionCryptoCipher aes256 SessionMaxAge 600 Note: SSL directives
    can also be located in /etc/httpd/conf.d/ssl.conf. If the "Session" and "SessionCookieName" directives are not
    present, this is a finding. If "Session" is not set to "on" and "SessionCookieName" does not contain "httpOnly"
    and "secure", this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
