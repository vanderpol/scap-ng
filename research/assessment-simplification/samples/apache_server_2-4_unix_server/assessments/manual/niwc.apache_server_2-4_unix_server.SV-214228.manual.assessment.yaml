assessment:
  id: niwc.apache_server_2-4_unix_server.SV-214228.manual
  version: 1
  assessment_title: The Apache web server must limit the number of allowed simultaneous session requests.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Determine the location of the "HTTPD_ROOT" directory and the "httpd.conf" file: # apachectl -V | egrep
    -i ''httpd_root|server_config_file'' -D HTTPD_ROOT="/etc/httpd" -D SERVER_CONFIG_FILE="conf/httpd.conf" Note:
    The apachectl front end is the preferred method for locating the Apache httpd file. For some Linux distributions,
    "apache2ctl -V" or "httpd -V" can also be used. Search for the directives "KeepAlive" and "MaxKeepAliveRequests"
    in the "httpd.conf" file: # cat /<path_to_file>/httpd.conf | grep -i "keepalive" KeepAlive On MaxKeepAliveRequests
    100 If the value of "KeepAlive" is set to "off" or does not exist, this is a finding. If the value of "MaxKeepAliveRequests"
    is set to a value less than "100" or does not exist, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
