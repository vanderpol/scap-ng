assessment:
  id: niwc.apache_server_2-4_unix_site.SV-214292.manual
  version: 1
  assessment_title: The Apache web server must display a default hosted application web page, not a directory listing,
    when a requested web page cannot be found.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'View the "DocumentRoot" value by entering the following command: awk ''{print $1,$2,$3}'' <''INSTALL
    PATH''>/conf/httpd.conf|grep -i DocumentRoot|grep -v ''^#'' Note each location following the "DocumentRoot"
    string. This is the configured path(s) to the document root directory(s). To view a list of the directories
    and subdirectories and the file "index.html", from each stated "DocumentRoot" location enter the following commands:
    find . -type d find . -type f -name index.html Review the results for each document root directory and its subdirectories.
    If a directory does not contain an "index.html" or equivalent default document, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
