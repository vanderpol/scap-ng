rule:
  id: SV-214292
  version: r961167
  title: The Apache web server must display a default hosted application web page, not a directory listing, when
    a requested web page cannot be found.
  severity: medium
  role: full
  weight: 10.0
  discussion: The goal is to completely control the web user's experience in navigating any portion of the web document
    root directories. Ensuring all web content directories have at least the equivalent of an index.html file is
    a significant factor to accomplish this end. Enumeration techniques, such as URL parameter manipulation, rely
    upon being able to obtain information about the Apache web server's directory structure by locating directories
    without default pages. In the scenario, the Apache web server will display to the user a listing of the files
    in the directory being accessed. By having a default hosted application web page, the anonymous web user will
    not obtain directory browsing information or an error message that reveals the server type and version.
  rationale: null
  extensions:
