rule:
  id: SV-278138
  version: r1182081
  title: Windows Server 2025 permissions on the Active Directory data files must only allow system administrators
    (SAs) access.
  severity: high
  role: full
  weight: 10.0
  discussion: 'Improper access permissions for directory data-related files could allow unauthorized users to read,
    modify, or delete directory data or audit trails. Satisfies: SRG-OS-000324-GPOS-00125, SRG-OS-000206-GPOS-00084'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN25-DC-000070
  - scheme: vulnerability
    value: V-278138
  - scheme: cci
    value: CCI-002235
  - scheme: cci
    value: CCI-001314
  references:
  - title: DPMS Target Microsoft Windows Server 2025
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows Server 2025
    identifier: '5719'
  requires: []
  conflicts: []
  applicability:
  - niwc.ms_windows_server_2025.condition.windows-domain-controller
  parameters: {}
  remediation:
    guidance: 'Maintain the permissions on NTDS database and log files as follows: NT AUTHORITY\SYSTEM:(I)(F) BUILTIN\Administrators:(I)(F)
      (I) - permission inherited from parent container (F) - full access'
  organizational_input_requirements: {}
