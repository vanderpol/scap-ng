rule:
  id: SV-278028
  version: r1182265
  title: Windows Server 2025 FTP servers must be configured to prevent access to the system drive.
  severity: medium
  role: full
  weight: 10.0
  discussion: The FTP service allows remote users to access shared files and directories that could provide access
    to system resources and compromise the system, especially if the user can gain access to the root directory
    of the boot drive.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN25-00-000430
  - scheme: vulnerability
    value: V-278028
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows Server 2025
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows Server 2025
    identifier: '5719'
  requires: []
  conflicts: []
  applicability:
  - niwc.ms_windows_server_2025.condition.ftp-installed
  parameters: {}
  remediation:
    guidance: Configure the FTP sites to allow access only to specific FTP shared resources. Do not allow access
      to other areas of the system.
  organizational_input_requirements: {}
