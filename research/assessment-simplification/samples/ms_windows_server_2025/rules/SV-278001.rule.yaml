rule:
  id: SV-278001
  version: r1211143
  title: Windows Server 2025 default permissions for the HKEY_LOCAL_MACHINE registry hive must be maintained.
  severity: medium
  role: full
  weight: 10.0
  discussion: The registry is integral to the function, security, and stability of the Windows system. Changing
    the system's registry permissions allows the possibility of unauthorized and anonymous modification to the operating
    system.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN25-00-000170
  - scheme: vulnerability
    value: V-278001
  - scheme: cci
    value: CCI-002235
  references:
  - title: DPMS Target Microsoft Windows Server 2025
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows Server 2025
    identifier: '5719'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Maintain the default permissions for the HKEY_LOCAL_MACHINE registry hive. The default permissions
      of the higher-level keys are noted below: Note: “Authenticated Users” is default on Domain Controllers, and
      “Users” is default on member servers and stand-alone servers. Revise expected response based on system context.
      HKEY_LOCAL_MACHINE\SECURITY Type - "Allow" for all Inherited from - "None" for all Principal - Access - Applies
      to SYSTEM - Full Control - This key and subkeys Administrators - Special - This key and subkeys HKEY_LOCAL_MACHINE\SOFTWARE
      Type - "Allow" for all Inherited from - "None" for all Principal - Access - Applies to Users - Read - This
      key and subkeys Administrators - Full Control - This key and subkeys SYSTEM - Full Control - This key and
      subkeys CREATOR OWNER - Full Control - This key and subkeys ALL APPLICATION PACKAGES - Read - This key and
      subkeys HKEY_LOCAL_MACHINE\SYSTEM Type - "Allow" for all Inherited from - "None" for all Principal - Access
      - Applies to Authenticated Users - Read - This key and subkeys Administrators - Full Control - This key and
      subkeys SYSTEM - Full Control - This key and subkeys CREATOR OWNER - Full Control - This key and subkeys ALL
      APPLICATION PACKAGES - Read - This key and subkeys Server Operators - Read - This Key and subkeys (Domain
      controllers only) Microsoft has given Read permission to the SOFTWARE and SYSTEM registry keys in Windows
      Server 2025 to the following SID: S-1-15-3-1024-1065365936-1281604716-3511738428-1654721687-432734479-3232135806-4053264122-3456934681'
  organizational_input_requirements: {}
