assessment:
  id: niwc.ms_windows_server_2025.platform.cpe-o-microsoft-windows-server-2025-x64.assessment
  version: 1
  assessment_title: Microsoft Windows Server 2025
  mode: automated
  class: inventory
  purpose: applicability
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    productname-registry-entry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SOFTWARE\Microsoft\Windows NT\CurrentVersion
        name:
          operation: equals
          datatype: string
          value: ProductName
      object_title: ProductName registry entry
  states:
    state-microsoft-windows-family:
      state_title: Microsoft Windows family
      capability: independent.family
      state:
        field: family
        value: windows
        operation: equal
        datatype: string
        match: all
        existence: some
    state-windows-server-2025:
      state_title: Windows Server 2025
      capability: windows.registry
      state:
        field: value
        value: ^(?i)Windows Server 2025.*$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-installed-operating-system-belongs-microsoft-windows-family:
      test_title: The installed operating system belongs to the Microsoft Windows family
      capability: independent.family
      states:
      - state-microsoft-windows-family
      existence: some
      match: all
    test-installed-operating-system-windows-server-2025:
      test_title: The installed operating system is Windows Server 2025
      capability: windows.registry
      object: productname-registry-entry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-server-2025
  evaluate:
    all:
    - test: test-installed-operating-system-belongs-microsoft-windows-family
    - test: test-installed-operating-system-windows-server-2025
