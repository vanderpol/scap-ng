assessment:
  id: niwc.ms_windows_server_2025.condition.windows-not-server-core-installation.assessment
  version: 2
  assessment_title: Windows Not Server Core Installation
  mode: automated
  class: inventory
  purpose: applicability
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SOFTWARE\Microsoft\Windows NT\CurrentVersion
        name:
          operation: equals
          datatype: string
          value: InstallationType
      object_title: null
  states:
    state-server-core:
      state_title: Server Core
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_sz
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: Server Core
          operation: case insensitive not equal
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-system-windows-server-core-installation:
      test_title: The system is a Windows Server Core Installation
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-server-core
  evaluate:
    test: test-system-windows-server-core-installation
