assessment:
  id: niwc.ms_windows_server_2025.SV-278028.manual
  version: 1
  assessment_title: Windows Server 2025 FTP servers must be configured to prevent access to the system drive.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: If FTP is not installed on the system, this is not applicable. Open Internet Information Services (IIS)
    Manager. Select "Sites" under the server name. For any sites with a Binding that lists FTP, right-click the
    site and select "Explore". If the site is not defined to a specific folder for shared FTP resources, this is
    a finding. If the site includes any system areas such as root of the drive, Program Files, or Windows directories,
    this is a finding.
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
