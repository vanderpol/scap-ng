# Source: Windows 11 STIG V2R10, Rule xccdf_mil.disa.stig_rule_SV-253257r1210281_rule
rule:
  id: WN11-00-000020
  title: Secure Boot must be enabled on Windows 11 systems.
  severity: medium
  revision: 1210281
  identifiers:
    - scheme: disa-vuln-id
      value: V-253257
    - scheme: disa-rule-id
      value: SV-253257r1210281_rule
    - scheme: cci
      value: CCI-002421

  discussion: |-
    Secure Boot is a standard that ensures systems boot only to a trusted operating system. Secure Boot is required to support additional security features in Windows 11, including virtualization-based Security and Credential Guard. If Secure Boot is turned off, these security features will not function.

  remediation: |-
    Enable Secure Boot in the system firmware.

  assessments:
    - ../assessments/manual/WN11-00-000020.manual.assessment.yaml
    - ../assessments/automated/WN11-00-000020.lossless.automated.assessment.yaml
