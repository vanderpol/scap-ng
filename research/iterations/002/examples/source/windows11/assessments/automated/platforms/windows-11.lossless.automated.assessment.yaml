# Stage-1 lossless conversion of the Windows 11 CPE inventory definition.
# CPE: cpe:/o:microsoft:windows_11
# Root OVAL definition: oval:mil.disa.stig.windows11:def:1
assessment:
  id: windows.11
  mode: automated

  collect:
    os_family:
      capability: independent.family
      fields:
        - family
      # Source OVAL test: oval:mil.disa.stig.ind:tst:10000000
      # Source OVAL object: oval:mil.disa.stig.ind:obj:10000000

    product_name:
      capability: windows.registry
      select:
        hive:
          equals: HKEY_LOCAL_MACHINE
        key:
          equals: 'SOFTWARE\Microsoft\Windows NT\CurrentVersion'
        name:
          equals: ProductName
      fields:
        - value
      # Source OVAL test: oval:mil.disa.stig.win:tst:10000000
      # Source OVAL object: oval:mil.disa.stig.win:obj:10000000

    current_build_number:
      capability: windows.registry
      select:
        hive:
          equals: HKEY_LOCAL_MACHINE
        key:
          equals: 'SOFTWARE\Microsoft\Windows NT\CurrentVersion'
        name:
          equals: CurrentBuildNumber
      fields:
        - value
      # Source OVAL test: oval:mil.disa.stig.win:tst:10000001
      # Source OVAL object: oval:mil.disa.stig.win:obj:10000001

  assert:
    # Source OVAL criteria omitted operator; OVAL default is AND.
    all_of:
      - source: os_family
        existence: at_least_one_exists
        check: all
        condition:
          field: family
          equals: windows

      - source: product_name
        existence: at_least_one_exists
        check: all
        condition:
          field: value
          operation: pattern_match
          value: '^[Ww][Ii][Nn][Dd][Oo][Ww][Ss] 1[01].*$'

      - source: current_build_number
        existence: at_least_one_exists
        check: all
        condition:
          field: value
          datatype: integer
          greater_than_or_equal: 22000
