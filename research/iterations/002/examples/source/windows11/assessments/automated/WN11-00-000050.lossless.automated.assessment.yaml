# Stage-1 lossless conversion of the source OVAL behavior.
# Root OVAL definition: oval:mil.disa.stig.windows11:def:253265
# The source WMI query selects violating local disks, then requires none.
assessment:
  id: windows11.WN11-00-000050.lossless
  mode: automated

  collect:
    non_ntfs_local_disks:
      capability: windows.wmi57
      select:
        namespace:
          equals: 'root\cimv2'
        wql:
          equals: 'SELECT deviceid FROM win32_logicaldisk WHERE drivetype=3 AND filesystem!="NTFS"'
      fields:
        - result
      # Source OVAL test: oval:mil.disa.stig.win:tst:25326500
      # Source OVAL object: oval:mil.disa.stig.win:obj:25326500

  assert:
    source: non_ntfs_local_disks
    existence: none_exist
    check: all

  results:
    failure_examples:
      maximum: 10
      fields: [result]
      include_reason: true
