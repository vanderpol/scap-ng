# Stage-1 lossless conversion of the source OVAL behavior.
# Root OVAL definition: oval:navy.navwar.niwcatlantic.scc.windows:def:253256
assessment:
  id: windows11.WN11-00-000015.lossless
  mode: automated

  collect:
    bios_firmware_type:
      capability: windows.cmdlet
      select:
        module_name:
          equals: Microsoft.Powershell.Management
        module_id: null
        module_version: null
        verb:
          equals: Get
        noun:
          equals: ComputerInfo
        parameters: null
        properties:
          - biosfirmwaretype
      fields:
        - value
      # Source OVAL test: oval:navy.navwar.niwcatlantic.scc.windows:tst:25325601
      # Source OVAL object: oval:navy.navwar.niwcatlantic.scc.windows:obj:25325601

  assert:
    source: bios_firmware_type
    existence: at_least_one_exists
    check: at_least_one
    condition:
      field: value.biosfirmwaretype
      operation: case_insensitive_equals
      value: UEFI
    # Source OVAL state: oval:navy.navwar.niwcatlantic.scc.windows:ste:25325601

  results:
    failure_examples:
      maximum: 3
      fields: [value]
      include_reason: true
