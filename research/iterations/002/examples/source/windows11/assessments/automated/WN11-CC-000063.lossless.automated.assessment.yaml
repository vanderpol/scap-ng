# Stage-1 lossless conversion of the source OVAL behavior.
# Root OVAL definition: oval:navy.navwar.niwcatlantic.scc.windows:def:268318
# The source definition uses OR: either the GPO cmdlet test or the MDM
# shell-command test may satisfy the definition.
assessment:
  id: windows11.WN11-CC-000063.lossless
  mode: automated

  collect:
    applied_gpo_links:
      capability: windows.cmdlet
      select:
        module_name:
          equals: CimCmdlets
        module_id: null
        module_version: null
        verb:
          equals: Get
        noun:
          equals: CimInstance
        parameters:
          classname: RSOP_GPLink
          namespace: 'ROOT\RSOP\Computer'
        properties:
          - appliedOrder
          - enabled
          - GPO
          - SOM
      fields:
        - value
      # Source OVAL test: oval:navy.navwar.niwcatlantic.scc.windows:tst:26831801
      # Source OVAL object: oval:navy.navwar.niwcatlantic.scc.windows:obj:26831801

    intune_management_extension:
      capability: independent.shellcommand
      select:
        shell:
          equals: powershell
        command:
          equals: Get-Service -name IntuneManagementExtension
        pattern:
          equals: IntuneManagementExtension
      fields:
        - stdout_line
      # Source OVAL test: oval:navy.navwar.niwcatlantic.scc.windows:tst:26831802
      # Source OVAL object: oval:navy.navwar.niwcatlantic.scc.windows:obj:26831802

  assert:
    any_of:
      - source: applied_gpo_links
        existence: at_least_one_exists
        check: all
        condition:
          field: value
          datatype: record
          entity_check: at_least_one
          fields:
            enabled:
              equals: 'True'
        # Source OVAL state: oval:navy.navwar.niwcatlantic.scc.windows:ste:26831801

      - source: intune_management_extension
        existence: at_least_one_exists
        check: all
        condition:
          field: stdout_line
          operation: pattern_match
          value: Running
        # Source OVAL state: oval:navy.navwar.niwcatlantic.scc.windows:ste:26831802

  results:
    failure_examples:
      maximum: 5
      fields: [value, stdout_line]
      include_reason: true
