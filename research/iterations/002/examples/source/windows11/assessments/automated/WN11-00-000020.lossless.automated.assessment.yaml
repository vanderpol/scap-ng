# Stage-1 lossless conversion of the source OVAL behavior.
# Root OVAL definition: oval:navy.navwar.niwcatlantic.scc.windows:def:253257
assessment:
  id: windows11.WN11-00-000020.lossless
  mode: automated

  collect:
    secure_boot_state:
      capability: independent.shellcommand
      select:
        shell:
          equals: powershell
        command:
          equals: Confirm-SecureBootUEFI
        pattern:
          equals: ''
      fields:
        - stdout_line
      # Source OVAL test: oval:navy.navwar.niwcatlantic.scc.windows:tst:25325701
      # Source OVAL object: oval:navy.navwar.niwcatlantic.scc.windows:obj:25325701

  assert:
    source: secure_boot_state
    existence: at_least_one_exists
    check: all
    condition:
      field: stdout_line
      equals: 'True'
    # Source OVAL state: oval:navy.navwar.niwcatlantic.scc.windows:ste:25325701

  results:
    failure_examples:
      maximum: 3
      fields: [stdout_line]
      include_reason: true
