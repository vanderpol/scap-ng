# Source: RHEL 9 STIG V2R9, Rule xccdf_mil.disa.stig_rule_SV-257969r1155623_rule
rule:
  id: RHEL-09-253070
  title: RHEL 9 must not allow interfaces to perform Internet Control Message Protocol (ICMP) redirects by default.
  severity: medium
  identifiers:
    - scheme: disa-vuln-id
      value: V-257969
    - scheme: disa-rule-id
      value: SV-257969r1155623_rule
    - scheme: cci
      value: CCI-000366

  discussion: |-
    ICMP redirect messages are used by routers to inform hosts that a more direct route exists for a particular destination. These messages contain information from the system's route table possibly revealing portions of the network topology. The ability to send ICMP redirects is only appropriate for systems acting as routers.

    The sysctl --system command will load settings from all system configuration files. All configuration files are sorted by their filename in lexicographical order, regardless of the directories in which they reside. If multiple files specify the same option, the entry in the file with the lexicographically latest name will take precedence. Files are read from directories in the following list from top to bottom. Once a file of a given filename is loaded, any file of the same name in subsequent directories is ignored.

    /etc/sysctl.d/*.conf
    /run/sysctl.d/*.conf
    /usr/local/lib/sysctl.d/*.conf
    /usr/lib/sysctl.d/*.conf
    /lib/sysctl.d/*.conf
    /etc/sysctl.conf

  remediation: |-
    Configure RHEL 9 to not allow interfaces to perform Internet Protocol version 4 (IPv4) ICMP redirects by default.

    Create a configuration file if it does not already exist:

    $ sudo vi /etc/sysctl.d/ipv4_send_redirect.conf

    Add the following line to the file:
    net.ipv4.conf.default.send_redirects = 0

    Load settings from all system configuration files with the following command:

    $ sudo sysctl --system

  assessments:
    - ../assessments/manual/RHEL-09-253070.manual.assessment.yaml
    - ../assessments/automated/RHEL-09-253070.lossless.automated.assessment.yaml
