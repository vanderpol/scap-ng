# Source: RHEL 9 STIG V2R9, Rule xccdf_mil.disa.stig_rule_SV-257827r1044892_rule
rule:
  id: RHEL-09-215020
  title: RHEL 9 must not have the sendmail package installed.
  severity: medium
  identifiers:
    - scheme: disa-vuln-id
      value: V-257827
    - scheme: disa-rule-id
      value: SV-257827r1044892_rule
    - scheme: cci
      value: CCI-000381

  discussion: |-
    The sendmail software was not developed with security in mind, and its design prevents it from being effectively contained by SELinux. Postfix must be used instead.

    Satisfies: SRG-OS-000480-GPOS-00227, SRG-OS-000095-GPOS-00049

  remediation: |-
    Remove the sendmail package with the following command:

    $ sudo dnf remove sendmail

  assessments:
    - ../assessments/manual/RHEL-09-215020.manual.assessment.yaml
    - ../assessments/automated/RHEL-09-215020.lossless.automated.assessment.yaml
