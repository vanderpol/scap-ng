# Stage-1 lossless conversion of the Rocky Linux 9 CPE inventory definition.
# CPE: cpe:/o:rocky:rocky:9
# Root OVAL definition: oval:navy.navwar.niwcatlantic.scc.rocky9:def:201
assessment:
  id: rocky-linux.9
  mode: automated

  collect:
    os_release_cpe_name:
      capability: independent.textfilecontent54
      select:
        filepath:
          equals: /etc/os-release
        pattern:
          operation: pattern_match
          value: '^CPE_NAME="(.+)"'
        instance:
          datatype: integer
          operation: greater_than_or_equal
          value: 1
      fields:
        - subexpression
      # Source OVAL test: oval:navy.navwar.niwcatlantic.scc.rocky9:tst:201

  assert:
    source: os_release_cpe_name
    existence: all_exist
    check: all
    condition:
      field: subexpression
      operation: pattern_match
      value: 'rocky:rocky:9'
