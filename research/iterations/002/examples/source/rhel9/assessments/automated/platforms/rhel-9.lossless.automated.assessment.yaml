# Stage-1 lossless conversion of the RHEL 9 CPE inventory definition.
# CPE: cpe:/o:redhat:enterprise_linux:9.0
# Root OVAL definition: oval:mil.disa.stig.rhel9os:def:101
assessment:
  id: rhel.9
  mode: automated

  collect:
    redhat_release:
      capability: linux.rpminfo
      select:
        name:
          equals: redhat-release
      fields:
        - name
        - version
      # Source OVAL test: oval:mil.disa.stig.linux:tst:110000006

    toss_release:
      capability: linux.rpminfo
      select:
        name:
          equals: toss-release
      fields:
        - name
        - version
      # Source OVAL test: oval:mil.disa.stig.linux:tst:110000009

    oraclelinux_release:
      capability: linux.rpminfo
      select:
        name:
          equals: oraclelinux-release
      fields:
        - name
        - version
      # Source OVAL test: oval:mil.disa.stig.linux:tst:110000010

  assert:
    # Source OVAL criteria omitted operator; OVAL default is AND.
    all_of:
      - source: redhat_release
        existence: all_exist
        check: all
        condition:
          field: version
          operation: pattern_match
          value: '^9\.\d+$'

      - source: toss_release
        existence: none_exist
        check: all

      - source: oraclelinux_release
        existence: none_exist
        check: all
