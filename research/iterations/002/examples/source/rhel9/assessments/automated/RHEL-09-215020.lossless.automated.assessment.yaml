# Stage-1 lossless conversion of the source OVAL behavior.
# Root OVAL definition: oval:mil.disa.stig.rhel9os:def:257827
assessment:
  id: rhel9.RHEL-09-215020.lossless
  mode: automated

  collect:
    sendmail_package:
      capability: linux.rpminfo
      select:
        name:
          equals: sendmail
      fields:
        - name
        - epoch
        - version
        - release
        - architecture
      # Source OVAL test: oval:mil.disa.stig.linux:tst:23048900
      # Source OVAL object: oval:mil.disa.stig.linux:obj:23048900

  assert:
    source: sendmail_package
    existence: none_exist
    check: all

  results:
    failure_examples:
      maximum: 3
      fields: [name, version, release, architecture]
      include_reason: true
