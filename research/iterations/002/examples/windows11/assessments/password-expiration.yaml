# Review prototype — native SCAP-NG source.
# Provenance (informational only): Windows 11 STIG V2R10, SV-253273r1051040.

assessment:
  id: local-accounts-require-password-expiration

  collect:
    nonexpiring_accounts:
      windows.cmdlet:
        module: CimCmdlets
        command: Get-CimInstance
        parameters:
          class: Win32_UserAccount
          filter: PasswordExpires=False and LocalAccount=True and Disabled=False
        select:
          - Name
          - PasswordExpires
          - Disabled
          - LocalAccount

  assert:
    nonexpiring_accounts:
      exists: false
