scap_ng: 0.1-prototype
example: cpe-target-inventory
description: >
  Illustrative target inventory emitted by successful Platform Assessments.
  Product inventory is descriptive output and does not alter applicability,
  Rule selection, or compliance truth.

target:
  identifiers:
    - type: smbios_uuid
      value: 01234567-89ab-cdef-0123-456789abcdef

  inventory:
    operating_system:
      kind: operating_system
      name: Red Hat Enterprise Linux 9
      identifiers:
        - scheme: cpe
          binding: uri
          value: cpe:/o:redhat:enterprise_linux:9.0
      provenance:
        source_role: platform_assessment
        assessment: rhel.9
        source_definition: oval:mil.disa.stig.rhel9os:def:101
        emitted_when: platform_true

    applications:
      - kind: application
        name: Example Application
        version: "1"
        identifiers:
          - scheme: cpe
            binding: formatted_string
            value: cpe:2.3:a:example:application:1:*:*:*:*:*:*:*
        provenance:
          source_role: platform_assessment
          assessment: example.application.present
          emitted_when: platform_true

semantic_constraints:
  inventory_is_descriptive: true
  affects_benchmark_platform_truth: false
  affects_rule_selection: false
  affects_rule_applicability: false
  affects_compliance_truth: false
