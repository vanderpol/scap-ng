#   RHEL 9 STIG V2R9: RHEL-09-212030 / SV-257791r991589
#   Oracle Linux 9 STIG V1R4: OL09-00-002531 / SV-271793r1092605

assessment:
  id: grub-config-owned-by-root

  collect:
    grub_config:
      unix.file:
        filepath: /boot/grub2/grub.cfg

  assert:
    grub_config:
      exists: true
      user_id: 0
