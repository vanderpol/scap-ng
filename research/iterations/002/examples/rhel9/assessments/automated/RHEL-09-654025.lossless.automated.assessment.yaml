# Stage-1 lossless SCAP-NG design sample.
# Derived directly from RHEL 9 V2R9 / RHEL-09-654025.
# This file intentionally preserves the source OVAL behavior, including
# duplicated b32 root patterns that appear likely to have been intended as b64.
# It is NOT the cleaner native audit-rule model.

