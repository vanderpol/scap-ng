  source_anomalies:
    - id: lsetxattr-root-b64-duplicates-b32
      preserved: true
      description: >-
        OVAL test 25303503 is described as the 64-bit root case, but its
        source variable uses the b32 architecture fragment. Stage 1 preserves
        the resulting b32 regex exactly.
    - id: removexattr-root-b64-duplicates-b32
      preserved: true
      description: >-
        OVAL test 25303803 is described as the 64-bit root case, but its
        source variable uses the b32 architecture fragment. Stage 1 preserves
        the resulting b32 regex exactly.

  collect:
    fsetxattr_b32_interactive_user:
      capability: independent.textfilecontent54
      select:
        filepath:
          equals: /etc/audit/audit.rules
        pattern:
          operation: pattern_match
          value: '^\s*-a\s+(always,exit|exit,always)\s+-F\s+arch=b32\s+(?:.*(-S\s+fsetxattr\s+|(\s+|,)fsetxattr(\s+|,))).*-F\s+auid>=1000\s+-F\s+auid!=(4294967295|-1|unset)(\s+(-k\s+|-F\s+key=)[-\w]+)*\s*$'
        instance:
          datatype: integer
          operation: greater_than_or_equal
          value: 1
      fields:
