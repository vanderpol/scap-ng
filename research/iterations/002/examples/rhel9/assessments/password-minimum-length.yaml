assessment:
  id: password-minimum-length

  inputs:
    expected_minimum:
      type: integer
      role: expected_state

  collect:
    configured_minimum:
      unix.file:
        filepath: /etc/security/pwquality.conf
        # Prototype collector syntax; exact parsing syntax remains under review.
        property: minlen

  assert:
    configured_minimum:
      greater_than_or_equal:
        input: expected_minimum
