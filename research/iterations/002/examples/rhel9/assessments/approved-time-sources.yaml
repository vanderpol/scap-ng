assessment:
  id: approved-time-sources

  inputs:
    expected_sources:
      type: set<string>
      role: expected_state
      required: true

  collect:
    configured_sources:
      # Prototype capability name and parse syntax remain under review.
      unix.file:
        filepath: /etc/chrony.conf
        property: time_sources

  assert:
    configured_sources:
      subset_of:
        input: expected_sources

# Security invariant:
# expected_sources may change only the expected-state operand. It cannot
# parameterize filepath, collector, property, operator, or any executable/query
# behavior.
