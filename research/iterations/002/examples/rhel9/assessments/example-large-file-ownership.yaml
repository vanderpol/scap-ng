# Illustrative SCAP-NG automated Assessment.
# Purpose: exercise large-population evaluation and bounded failure evidence.
# This is design-review content, not yet final schema.

assessment:
  id: example.unix.files-owned-by-root
  mode: automated

  collect:
    files:
      capability: unix.file

      select:
        path:
          under: /opt/example
          recursive: true

      fields:
        - path
        - owner

  assert:
    source: files

    # Explicit: every collected file must satisfy the condition.
    quantifier: all

    # Explicit: no hidden behavior if collection returns no items.
    if_no_items: not_applicable

    condition:
      field: owner
      equals: root

  results:
    failure_examples:
      # Diagnostic/evidence target only. This is NOT a compliance threshold.
      target: 20

      # Concrete fields retained for each failure example.
      fields:
        - path
        - owner

      include_reason: true

    # Scanner/runtime MAY impose a stricter safety cap, but SHALL report it.
    allow_runtime_cap: true
