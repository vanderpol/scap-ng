# Illustrative policy-feature rule. This is intentionally not represented as
# an actual DISA STIG rule; it exists to demonstrate publisher-defined values
# and Tailoring.

rule:
  id: example.password-minimum-length
  revision: 1
  title: The configured minimum password length must meet the required value.
  severity: medium
  applies_to: rhel.9

  assessment:
    method: password-minimum-length
    bindings:
      expected_minimum:
        parameter: password_minimum_length
