# Illustrative policy-feature rule. This demonstrates an unresolved
# organization-defined value without requiring Tailoring.

rule:
  id: example.approved-time-sources
  revision: 1
  title: Configured time sources must be approved by the organization.
  severity: medium
  applies_to: rhel.9

  assessment:
    method: approved-time-sources
    bindings:
      expected_sources:
        parameter: approved_time_sources
