      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:86701
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify that OL 9 does not allow interfaces to perform Internet Protocol version 4 (IPv4) ICMP redirects by
            default.


            Check the value of the "default send_redirects" variables with the following command:


            $ sysctl net.ipv4.conf.default.send_redirects

            net.ipv4.conf.default.send_redirects=0


            If "net.ipv4.conf.default.send_redirects" is not set to "0" and is not documented with the information system
            security officer (ISSO) as an operational requirement or is missing, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
