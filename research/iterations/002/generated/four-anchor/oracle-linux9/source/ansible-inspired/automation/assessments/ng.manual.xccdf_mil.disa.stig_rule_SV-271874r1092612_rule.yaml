        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:86301
      exports: []
      inline_content: 'Verify that OL 9 limits the number of bogus ICMP response errors logs. The runtime status of the net.ipv4.icmp_ignore_bogus_error_responses
        kernel parameter can be queried by running the following command: $ sysctl net.ipv4.icmp_ignore_bogus_error_responses
        net.ipv4.icmp_ignore_bogus_error_responses = 1 If "net.ipv4.icmp_ignore_bogus_error_responses" is not set to "1",
        this is a finding.'
      multi_check: null
