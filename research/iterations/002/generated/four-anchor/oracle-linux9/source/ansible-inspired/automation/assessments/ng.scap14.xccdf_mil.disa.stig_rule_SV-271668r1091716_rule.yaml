        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:46301
      exports: []
      inline_content: 'Verify that OL 9 is configured to mount /home with the nodexec option. Verify "/home" is mounted with
        the "noexec" option with the following command: Note: If a separate file system has not been created for the user
        home directories (user home directories are mounted under "/"), this is automatically a finding, as the "noexec" option
        cannot be used on the "/" system. $ mount | grep /home tmpfs on /home type xfs (rw,nodev,nosuid,noexec,seclabel) If
        the "/home" file system is mounted without the "noexec" option, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:46301
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify that OL 9 is configured to mount /home with the nodexec option.


            Verify "/home" is mounted with the "noexec" option with the following command:


            Note: If a separate file system has not been created for the user home directories (user home directories are
            mounted under "/"), this is automatically a finding, as the "noexec" option cannot be used on the "/" system.


            $ mount | grep /home

            tmpfs on /home type xfs (rw,nodev,nosuid,noexec,seclabel)


            If the "/home" file system is mounted without the "noexec" option, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
