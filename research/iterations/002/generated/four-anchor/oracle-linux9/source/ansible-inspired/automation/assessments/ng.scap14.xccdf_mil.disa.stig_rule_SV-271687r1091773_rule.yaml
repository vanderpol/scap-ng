        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:49901
      exports: []
      inline_content: 'This requirement assumes the use of the OL 9 default graphical user interface—the GNOME desktop environment.
        If the system does not have any graphical user interface installed, this requirement is Not Applicable. Verify that
        OL 9 users cannot enable the Ctrl-Alt-Del sequence in the GNOME desktop with the following command: $ grep logout
        /etc/dconf/db/local.d/locks/* /org/gnome/settings-daemon/plugins/media-keys/logout If the output is not "/org/gnome/settings-daemon/plugins/media-keys/logout",
        the line is commented out, or the line is missing, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:49901
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "This requirement assumes the use of the OL 9 default graphical user interface—the GNOME desktop environment.\
            \ If the system does not have any graphical user interface installed, this requirement is Not Applicable.\n\n\
            Verify that OL 9 users cannot enable the Ctrl-Alt-Del sequence in the GNOME desktop with the following command:\n\
            \n$ grep logout /etc/dconf/db/local.d/locks/* \n/org/gnome/settings-daemon/plugins/media-keys/logout\n\nIf the\
            \ output is not \"/org/gnome/settings-daemon/plugins/media-keys/logout\", the line is commented out, or the line\
            \ is missing, this is a finding."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
