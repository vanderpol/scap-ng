rule:
  abstract: false
  check: 'Verify that OL 9 is configured so that the sssd.service is enabled and active with the following commands: $ sudo
    systemctl is-enabled sssd enabled $ sudo systemctl is-active sssd active If sssd.service is not active or enabled, this
    is a finding.'
