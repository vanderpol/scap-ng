  check: 'Verify that OL 9 is configured to flush audit records to disk after every 100 records with the following command:
    $ sudo grep freq /etc/audit/auditd.conf freq = 100 If "freq" isn''t set to a value of "100" or greater, the value is missing,
    or the line is commented out, this is a finding.'
