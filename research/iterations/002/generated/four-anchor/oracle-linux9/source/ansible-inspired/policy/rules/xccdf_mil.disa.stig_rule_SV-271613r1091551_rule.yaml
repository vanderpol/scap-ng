scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 enforces password complexity by requiring at least one uppercase character. Check the value for
    "ucredit" with the following command: $ grep ucredit /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    ucredit = -1 If the value of "ucredit" is a positive number or is commented out, this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271613r1091551_rule
    assessment_version: 1
    selector: default
    source_selector: ''
