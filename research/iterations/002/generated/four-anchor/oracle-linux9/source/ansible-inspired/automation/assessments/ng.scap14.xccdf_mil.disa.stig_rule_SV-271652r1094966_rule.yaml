        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:43101
      exports: []
      inline_content: 'Verify that OL 9 is configured to mount /dev/shm with the nosuid option. Verify "/dev/shm" is mounted
        with the "nosuid" option with the following command: $ mount | grep /dev/shm tmpfs on /dev/shm type tmpfs (rw,nodev,nosuid,noexec,seclabel)
        If the /dev/shm file system is mounted without the "nosuid" option, this is a finding.'
