      exports: []
      inline_content: 'Verify that OL 9 generates audit records for all account creations, modifications, disabling, and termination
        events that affect "/etc/passwd" with the following command: $ sudo auditctl -l | egrep ''(/usr/bin/passwd)'' -a always,exit
        -F path=/usr/bin/passwd -F perm=x -F auid>=1000 -F auid!=unset -k privileged-passwd If the command does not return
        a line or the line is commented out, this is a finding.'
