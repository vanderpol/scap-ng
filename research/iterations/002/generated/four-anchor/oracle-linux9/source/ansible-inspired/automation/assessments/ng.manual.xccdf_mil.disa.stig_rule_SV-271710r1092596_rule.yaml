        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:54301
      exports: []
      inline_content: 'Verify that OL 9 is configured so that all network connections associated with SSH traffic are terminated
        after 10 minutes of becoming unresponsive. Verify that the "ClientAliveInterval" variable is set to a value of "600"
        or less by performing the following command: $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d
        ''\r'' | tr ''\n'' '' '' | xargs sudo grep -iH ''^\s*clientaliveinterval'' ClientAliveInterval 600 If "ClientAliveInterval"
        does not exist, does not have a value of "600" or less in "/etc/ssh/sshd_config", or is commented out, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:54301
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify that OL 9 is configured so that all network connections associated with SSH traffic are terminated
            after 10 minutes of becoming unresponsive.


            Verify that the "ClientAliveInterval" variable is set to a value of "600" or less by performing the following
            command:


            $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo grep
            -iH ''^\s*clientaliveinterval''

            ClientAliveInterval 600


            If "ClientAliveInterval" does not exist, does not have a value of "600" or less in "/etc/ssh/sshd_config", or
            is commented out, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
