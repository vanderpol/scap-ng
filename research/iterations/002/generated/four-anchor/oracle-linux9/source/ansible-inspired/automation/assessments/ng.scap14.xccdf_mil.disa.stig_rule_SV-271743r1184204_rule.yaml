      exports: []
      inline_content: 'Note: If the IPsec service is not installed, this requirement is Not Applicable. Verify the IPsec service
        uses the systemwide cryptographic policy with the following command: $ grep include /etc/ipsec.conf /etc/ipsec.d/*.conf
        /etc/ipsec.conf:include /etc/crypto-policies/back-ends/libreswan.config If the IPsec configuration file does not contain
        "include /etc/crypto-policies/back-ends/libreswan.config", this is a finding.'
