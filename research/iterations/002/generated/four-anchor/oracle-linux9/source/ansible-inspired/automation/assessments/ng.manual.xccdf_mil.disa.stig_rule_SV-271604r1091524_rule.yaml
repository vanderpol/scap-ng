          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify that OL 9 for PKI-based authentication has valid certificates by constructing a certification path\
            \ (which includes status information) to an accepted trust anchor.\n\nCheck that the system has a valid DOD root\
            \ CA installed with the following command:\n\n$ sudo openssl x509 -text -in /etc/sssd/pki/sssd_auth_ca_db.pem\n\
            \nExample output:\n\nCertificate:\n    Data:\n        Version: 3 (0x2)\n        Serial Number: 1 (0x1)\n     \
            \   Signature Algorithm: sha256WithRSAEncryption\n        Issuer: C = US, O = U.S. Government, OU = DOD, OU =\
            \ PKI, CN = DOD Root CA 3\n        Validity\n        Not Before: Mar 20 18:46:41 2012 GMT\n        Not After:\
            \ Dec 30 18:46:41 2029 GMT\n        Subject: C = US, O = U.S. Government, OU = DOD, OU = PKI, CN = DOD Root CA\
            \ 3\n        Subject Public Key Info:\n            Public Key Algorithm: rsaEncryption\n\nIf the root CA file\
            \ is not a DOD-issued certificate with a valid date and installed in the \"/etc/sssd/pki/sssd_auth_ca_db.pem\"\
            \ location, this is a finding."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
