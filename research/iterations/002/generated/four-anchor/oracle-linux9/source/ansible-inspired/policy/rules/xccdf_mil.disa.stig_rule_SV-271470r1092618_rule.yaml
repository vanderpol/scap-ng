rule:
  abstract: false
  check: 'Verify that OL 9 firewalld is active with the following command: $ systemctl is-active firewalld active If the firewalld
    service is not active, this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271470r1092618_rule
    assessment_version: 1
    selector: default
