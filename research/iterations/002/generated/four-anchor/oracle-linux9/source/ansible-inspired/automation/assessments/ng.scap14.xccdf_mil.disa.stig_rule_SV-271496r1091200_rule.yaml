          text: "Verify that OL 9 has the package installed with the following command:\n\n$ dnf list --installed aide\nInstalled\
            \ Packages\naide.x86_64                                         0.16-100.el9                                 \
            \         @ol9_appstream\n\nIf AIDE is not installed, ask the system administrator (SA) how file integrity checks\
            \ are performed on the system. \n\nIf there is no application installed to perform integrity checks, this is a\
            \ finding.\n\nIf AIDE is installed, check if it has been initialized with the following command:\n\n$ sudo /usr/sbin/aide\
            \ --check\n\nIf the output is \"Couldn't open file /var/lib/aide/aide.db.gz for reading\", this is a finding."
