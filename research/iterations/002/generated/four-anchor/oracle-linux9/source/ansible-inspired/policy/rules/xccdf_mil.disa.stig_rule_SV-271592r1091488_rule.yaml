scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 allocates a sufficient audit_backlog_limit to capture processes that start prior to the audit daemon
    with the following command: $ sudo grubby --info=ALL | grep args | grep -v ''audit_backlog_limit=8192'' If the command
    returns any outputs, and audit_backlog_limit is less than "8192", this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271592r1091488_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271592r1091488_rule
    assessment_version: 1
