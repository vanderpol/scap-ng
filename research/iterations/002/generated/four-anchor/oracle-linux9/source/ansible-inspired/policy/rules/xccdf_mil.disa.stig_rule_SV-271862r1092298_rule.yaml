    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>Network interfaces in promiscuous mode allow for the capture of all network traffic visible
    to the system. If unauthorized individuals can access these applications, it may allow them to collect information such
    as logon IDs, passwords, and key exchanges between systems. If the system is being used to perform a network troubleshooting
    function, the use of these tools must be documented with the information systems security officer (ISSO) and restricted
    to only authorized personnel.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
