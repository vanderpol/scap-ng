rule:
  abstract: false
  check: 'Verify that OL 9 configures network interfaces to not operate in promiscuous mode with the following command: $
    ip link | grep -i promisc If network interfaces are found on the system in promiscuous mode and their use has not been
    approved by the ISSO and documented, this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271862r1092298_rule
