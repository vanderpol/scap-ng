        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:41101
      exports: []
      inline_content: 'If no NFS mounts are configured, this requirement is Not Applicable. Verify that OL 9 has the "noexec"
        option configured for all NFS mounts with the following command: $ cat /etc/fstab | grep nfs 192.168.22.2:/mnt/export
        /data nfs4 rw,nosuid,nodev,noexec,sync,soft,sec=krb5:krb5i:krb5p If the system is mounting file systems via NFS and
        the "noexec" option is missing, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:41101
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'If no NFS mounts are configured, this requirement is Not Applicable.


            Verify that OL 9 has the "noexec" option configured for all NFS mounts with the following command:


            $ cat /etc/fstab | grep nfs

            192.168.22.2:/mnt/export /data nfs4 rw,nosuid,nodev,noexec,sync,soft,sec=krb5:krb5i:krb5p


            If the system is mounting file systems via NFS and the "noexec" option is missing, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
