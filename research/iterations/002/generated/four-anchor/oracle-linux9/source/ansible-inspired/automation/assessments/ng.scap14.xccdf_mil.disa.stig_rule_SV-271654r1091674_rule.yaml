      exports: []
      inline_content: 'Verify that OL 9 is configured to mount /tmp with the noexec option. Verify "/tmp" is mounted with
        the "noexec" option: $ mount | grep /tmp /dev/mapper/ol-tmp on /tmp type xfs (rw,nodev,nosuid,noexec,seclabel) If
        the "/tmp" file system is mounted without the "noexec" option, this is a finding.'
      multi_check: null
