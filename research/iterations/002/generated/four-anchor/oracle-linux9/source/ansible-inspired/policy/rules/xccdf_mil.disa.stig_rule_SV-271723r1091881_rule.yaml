rule:
  abstract: false
  check: 'Verify that OL 9 requires uses to be members of the "wheel" group with the following command: $ grep pam_wheel /etc/pam.d/su
    auth required pam_wheel.so use_uid If a line for "pam_wheel.so" does not exist, or is commented out, this is a finding.'
