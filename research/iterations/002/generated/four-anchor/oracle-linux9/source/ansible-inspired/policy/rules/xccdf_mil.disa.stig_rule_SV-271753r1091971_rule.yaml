scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 limits the number of concurrent sessions to "10" for all accounts and/or account types with the
    following command: $ grep -r -s maxlogins /etc/security/limits.conf /etc/security/limits.d/*.conf /etc/security/limits.conf:*
    hard maxlogins 10 This can be set as a global domain (with the * wildcard) but may be set differently for multiple domains.
    If the "maxlogins" item is missing, commented out, or the value is set greater than "10" and is not documented with the
    information system security officer (ISSO) as an operational requirement for all domains that have the "maxlogins" item
    assigned, this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271753r1091971_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271753r1091971_rule
    assessment_version: 1
    selector: automated
    source_selector: automated
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-271753r1091971_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>Operating system management includes the ability to control the number of users and user sessions
    that use an operating system. Limiting the number of allowed users and sessions per user is helpful in reducing the risks
    related to denial-of-service (DoS) attacks. This requirement addresses concurrent sessions for information system accounts
    and does not address concurrent sessions by single users via multiple system accounts. The maximum number of concurrent
    sessions must be defined based on mission needs and the operational environment for each system.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
