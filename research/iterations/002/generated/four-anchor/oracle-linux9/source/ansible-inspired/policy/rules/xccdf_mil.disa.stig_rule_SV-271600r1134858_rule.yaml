scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 notifies the SA and ISSO (at a minimum) when allocated audit record storage volume reaches 75 percent
    of the repository maximum audit record storage capacity with the following command: $ sudo grep -w space_left_action /etc/audit/auditd.conf
    space_left_action = email If the value of the "space_left_action" is not set to "email", or if the line is commented out,
    ask the SA to indicate how the system is providing real-time alerts to the SA and ISSO. If there is no evidence that real-time
    alerts are configured on the system, this is a finding.'
  checks:
