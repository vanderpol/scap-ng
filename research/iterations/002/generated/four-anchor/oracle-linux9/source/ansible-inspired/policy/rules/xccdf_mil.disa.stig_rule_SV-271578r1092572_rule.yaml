scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 Audit Daemon is configured to label all offloaded audit logs, with the following command: $ sudo
    grep name_format /etc/audit/auditd.conf name_format = hostname If the "name_format" option is not "hostname", "fqd", or
    "numeric", or the line is commented out, this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271578r1092572_rule
    assessment_version: 1
    selector: default
    source_selector: ''
