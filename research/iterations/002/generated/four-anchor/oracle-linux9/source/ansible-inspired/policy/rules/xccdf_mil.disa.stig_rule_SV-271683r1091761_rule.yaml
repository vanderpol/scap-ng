    platform_id: xccdf_mil.disa.stig_platform_LinuxGnome
    ref: '#xccdf_mil.disa.stig_platform_LinuxGnome'
  extends: null
  fix: 'Configure OL 9 to prevent a user from overriding settings for graphical user interfaces. Create a database to contain
    the system-wide screensaver settings (if it does not already exist) with the following command: Note: The example below
    is using the database "local" for the system, so if the system is using another database in "/etc/dconf/profile/user",
    the file should be created under the appropriate subdirectory. $ sudo touch /etc/dconf/db/local.d/locks/session Add the
    following setting to prevent nonprivileged users from modifying it: /org/gnome/desktop/screensaver/lock-delay Update the
    system databases: $ sudo dconf update'
