        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:50701
      exports: []
      inline_content: 'This requirement assumes the use of the OL 9 default graphical user interface—the GNOME desktop environment.
        If the system does not have any graphical user interface installed, this requirement is Not Applicable. Verify that
        OL 9 does not allow an unattended or automatic logon to the system via a graphical user interface. Check for the value
        of the "AutomaticLoginEnable" in the "/etc/gdm/custom.conf" file with the following command: $ grep -i automaticlogin
        /etc/gdm/custom.conf [daemon] AutomaticLoginEnable=false If the value of "AutomaticLoginEnable" is not set to "false",
        this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:50701
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'This requirement assumes the use of the OL 9 default graphical user interface—the GNOME desktop environment.
            If the system does not have any graphical user interface installed, this requirement is Not Applicable.


            Verify that OL 9 does not allow an unattended or automatic logon to the system via a graphical user interface.


            Check for the value of the "AutomaticLoginEnable" in the "/etc/gdm/custom.conf" file with the following command:


            $  grep -i automaticlogin /etc/gdm/custom.conf

            [daemon]

            AutomaticLoginEnable=false


            If the value of "AutomaticLoginEnable" is not set to "false", this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
