scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 GRUB 2 is configured to enable poisoning of SLUB/SLAB objects to mitigate use-after-free vulnerabilities
    with the following commands: Check that the current GRUB 2 configuration has poisoning of SLUB/SLAB objects enabled: $
    sudo grubby --info=ALL | grep args | grep -v ''slub_debug=P'' If any output is returned, this is a finding. Check that
    poisoning of SLUB/SLAB objects is enabled by default to persist in kernel updates: $ sudo grep slub_debug /etc/default/grub
    GRUB_CMDLINE_LINUX="slub_debug=P" If "slub_debug" is not set to "P", is missing or commented out, this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271734r1091914_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271734r1091914_rule
    assessment_version: 1
    selector: automated
    source_selector: automated
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-271734r1091914_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: '<VulnDiscussion>Some adversaries launch attacks with the intent of executing code in nonexecutable regions
    of memory or in memory locations that are prohibited. Security safeguards employed to protect memory include, for example,
    data execution prevention and address space layout randomization. Data execution prevention safeguards can be either hardware-enforced
    or software-enforced with hardware providing the greater strength of mechanism. Poisoning writes an arbitrary value to
    freed pages, so any modification or reference to that page after being freed or before being initialized will be detected
    and prevented. This prevents many types of use-after-free vulnerabilities at little performance cost. Also prevents leak
    of data and detection of corrupted memory. SLAB objects are blocks of physically contiguous memory. SLUB is the unqueued
    SLAB allocator. Satisfies: SRG-OS-000433-GPOS-00192, SRG-OS-000134-GPOS-00068</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
