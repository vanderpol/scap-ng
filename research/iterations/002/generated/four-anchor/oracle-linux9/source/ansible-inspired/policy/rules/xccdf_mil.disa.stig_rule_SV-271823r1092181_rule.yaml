rule:
  abstract: false
  check: 'Verify that OL 9 configures the "/var/log/messages" file to have a mode of "0640" or less permissive with the following
    command: $ ls -la /var/log/messages rw-------. 1 root root 564223 July 11 11:34 /var/log/messages If "/var/log/messages"
    does not have a mode of "0640" or less permissive, this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271823r1092181_rule
