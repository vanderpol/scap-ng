scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Note: If IPv6 is disabled on the system, this requirement is Not Applicable. Verify that OL 9 will not accept IPv6
    ICMP redirect messages. Check the value of the default "accept_redirects" variables with the following command: $ sysctl
    net.ipv6.conf.default.accept_redirects net.ipv6.conf.default.accept_redirects = 0 If the returned line does not have a
    value of "0", a line is not returned, or the line is commented out, this is a finding.'
