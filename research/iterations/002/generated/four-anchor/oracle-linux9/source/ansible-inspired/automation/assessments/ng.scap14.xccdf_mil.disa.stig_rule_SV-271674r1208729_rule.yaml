        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:47501
      exports: []
      inline_content: 'This requirement assumes the use of the OL 9 default graphical user interface—the GNOME desktop environment.
        If the system does not have any graphical user interface installed, this requirement is Not Applicable. Verify OL
        9 initiates a session lock after a 10-minute period of inactivity for graphical user interfaces with the following
        command: $ gsettings get org.gnome.desktop.session idle-delay uint32 600 If "idle-delay" is set to "0" or a value
        greater than "600", this is a finding.'
      multi_check: null
