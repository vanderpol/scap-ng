        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:36701
      exports: []
      inline_content: 'Verify that OL 9 requires the maximum number of repeating characters be limited to three when passwords
        are changed. Verify the value of the "maxrepeat" option in "/etc/security/pwquality.conf" with the following command:
        $ grep maxrepeat /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf maxrepeat = 3 If the value of
        "maxrepeat" is set to more than "3", or is commented out, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:36701
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify that OL 9 requires the maximum number of repeating characters be limited to three when passwords are\
            \ changed.\n\nVerify the value of the \"maxrepeat\" option in \"/etc/security/pwquality.conf\" with the following\
            \ command:\n\n$ grep maxrepeat /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf \nmaxrepeat\
            \ = 3\n\nIf the value of \"maxrepeat\" is set to more than \"3\", or is commented out, this is a finding."
        name: check
