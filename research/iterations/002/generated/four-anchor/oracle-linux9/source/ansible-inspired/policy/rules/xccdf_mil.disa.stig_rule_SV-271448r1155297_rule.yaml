scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify OL 9 disables the ability to load the cramfs kernel module with the following command: $ grep -irs cramfs
    /etc/modprobe.conf /etc/modprobe.d/* /etc/modprobe.d/blacklist.conf:install cramfs /bin/false /etc/modprobe.d/blacklist.conf:blacklist
    cramfs If the command does not return any output, or the line is commented out, and use of the cramfs protocol is not
    documented with the information system security officer (ISSO) as an operational requirement, this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271448r1155297_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271448r1155297_rule
    assessment_version: 1
    selector: automated
    source_selector: automated
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-271448r1155297_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>It is detrimental for operating systems to provide, or install by default, functionality exceeding
    requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore may
    remain unsecured. They increase the risk to the platform by providing additional attack vectors. Removing support for
    unneeded filesystem types reduces the local attack surface of the server. Compressed ROM/RAM file system (or cramfs) is
    a read-only file system designed for simplicity and space-efficiency. It is mainly used in embedded and small-footprint
    systems.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
