scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 is configured to employ a deny-all, allow-by-exception policy for allowing connections to other
    systems with the following commands: $ sudo firewall-cmd --state running $ sudo firewall-cmd --get-active-zones public
    interfaces: ens33 $ sudo firewall-cmd --info-zone=public | grep target target: DROP $ sudo firewall-cmd --permanent --info-zone=public
    | grep target target: DROP If no zones are active on the OL 9 interfaces or if runtime and permanent targets are set to
    a different option other than "DROP", this is a finding.'
  checks:
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-271473r1091131_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-271473r1091131_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>Failure to restrict network connectivity only to authorized systems permits inbound connections
    from malicious systems. It also permits outbound connections that may facilitate exfiltration of DOD data. OL 9 incorporates
    the "firewalld" daemon, which allows for many different configurations. One of these configurations is zones. Zones can
    be used to a deny-all, allow-by-exception approach. The default "drop" zone will drop all incoming network packets unless
    it is explicitly allowed by the configuration file or is related to an outgoing network connection.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
