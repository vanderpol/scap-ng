scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 disables virtual system calls. Check the current GRUB 2 configuration with the following command:
    $ sudo grubby --info=ALL | grep args | grep -v ''vsyscall=none'' If any output is returned, this is a finding. Check that
    virtual system calls are disabled by default to persist in kernel updates with the following command: $ grep vsyscall
    /etc/default/grub GRUB_CMDLINE_LINUX="vsyscall=none" If "vsyscall" is not set to "none", is missing or commented out,
    and is not documented with the information system security officer (ISSO) as an operational requirement, this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271737r1094967_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271737r1094967_rule
    assessment_version: 1
    selector: automated
    source_selector: automated
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-271737r1094967_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>System calls are special routines in the Linux kernel, which userspace applications ask to
    do privileged tasks. Invoking a system call is an expensive operation because the processor must interrupt the currently
    executing task and switch context to kernel mode and then back to userspace after the system call completes. Virtual system
    calls map into user space a page that contains some variables and the implementation of some system calls. This allows
    the system calls to be executed in userspace to alleviate the context switching expense. Virtual system calls provide
    an opportunity of attack for a user who has control of the return instruction pointer. Disabling virtual system calls
    help to prevent return-oriented programming (ROP) attacks via buffer overflows and overruns. If the system intends to
    run containers based on OL 6 components, virtual system calls will have to be enabled so the components function properly.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
