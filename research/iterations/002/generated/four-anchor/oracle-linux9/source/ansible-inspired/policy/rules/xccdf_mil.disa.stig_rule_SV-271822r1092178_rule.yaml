rule:
  abstract: false
  check: 'Verify that OL 9 configures the "/var/log/messages" file to be owned by root with the following command: $ ls -la
    /var/log/messages rw-------. 1 root root 564223 July 11 11:34 /var/log/messages If "/var/log/messages" does not have an
    owner of "root", this is a finding.'
