      exports: []
      inline_content: 'Verify that OL 9 is configured to mount /boot with the nodev option. Verify that the "/boot" mount
        point has the "nodev" option is with the following command: $ mount | grep ''\s/boot\s'' /dev/sda1 on /boot type xfs
        (rw,nodev,relatime,seclabel,attr2) If the "/boot" file system does not have the "nodev" option set, this is a finding.'
