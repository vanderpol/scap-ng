scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: Verify that OL 9 is configured to audit the execution of any system call made by cron as root or as any privileged
    user. $ sudo auditctl -l | grep /etc/cron.d -w /etc/cron.d -p wa -k cronjobs $ sudo auditctl -l | grep /var/spool/cron
    -w /var/spool/cron -p wa -k cronjobs If either of these commands do not return the expected output, or the lines are commented
    out, this is a finding.
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-278952r1135407_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-278952r1135407_rule
    assessment_version: 1
    selector: automated
    source_selector: automated
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-278952r1135407_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>Any script or executable called by cron as root or by any privileged user must be owned by
    that user, must have the permissions 0755 or more restrictive, and should have no extended rights that allow any nonprivileged
    user to modify the script or executable.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
