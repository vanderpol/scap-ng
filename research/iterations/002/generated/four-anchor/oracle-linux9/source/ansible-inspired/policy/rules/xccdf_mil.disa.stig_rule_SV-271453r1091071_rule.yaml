rule:
  abstract: false
  check: 'Verify that OL 9 enables the SELinux targeted policy with the following command: $ sestatus | grep policy Loaded
    policy name: targeted If the loaded policy name is not "targeted", this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271453r1091071_rule
    assessment_version: 1
