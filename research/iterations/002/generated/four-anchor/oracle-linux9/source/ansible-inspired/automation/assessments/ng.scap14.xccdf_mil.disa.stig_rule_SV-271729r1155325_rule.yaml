        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:57901
      exports: []
      inline_content: 'Note: If kernel dumps are disabled in accordance with OL09-00-002380, this requirement is not applicable.
        Verify OL 9 disables core dump backtraces by issuing the following command: $ grep -i process /etc/systemd/coredump.conf
        ProcessSizeMax=0 If the "ProcessSizeMax" item is missing, commented out, or the value is anything other than "0" and
        the need for core dumps is not documented with the information system security officer (ISSO) as an operational requirement
        for all domains that have the "core" item assigned, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:57901
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Note: If kernel dumps are disabled in accordance with OL09-00-002380, this requirement is not applicable.


            Verify OL 9 disables core dump backtraces by issuing the following command:


            $ grep -i process /etc/systemd/coredump.conf

            ProcessSizeMax=0


            If the "ProcessSizeMax" item is missing, commented out, or the value is anything other than "0" and the need for
            core dumps is not documented with the information system security officer (ISSO) as an operational requirement
            for all domains that have the "core" item assigned, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
