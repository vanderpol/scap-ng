rule:
  abstract: false
  check: 'Verify that OL 9 audit system is configured to resolve audit information before writing to disk, with the following
    command: $ sudo grep log_format /etc/audit/auditd.conf log_format = ENRICHED If the "log_format" option is not "ENRICHED",
    or the line is commented out, this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271593r1092580_rule
