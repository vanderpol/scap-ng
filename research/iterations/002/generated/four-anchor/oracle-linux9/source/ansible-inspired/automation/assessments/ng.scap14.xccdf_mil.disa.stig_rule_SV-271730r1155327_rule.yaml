        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:58101
      exports: []
      inline_content: 'Note: If kernel dumps are disabled in accordance with OL09-00-002380, this requirement is not applicable.
        Verify OL 9 disables storing core dumps for all users by issuing the following command: $ grep -i storage /etc/systemd/coredump.conf
        Storage=none If the "Storage" item is missing, commented out, or the value is anything other than "none" and the need
        for core dumps is not documented with the information system security officer (ISSO) as an operational requirement
        for all domains that have the "core" item assigned, this is a finding.'
      multi_check: null
      negate: null
