            text: OL09-00-001120 - OL 9 must enforce password complexity by requiring that at least one special character
              be used.
          - attributes:
              family: unix
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Oracle Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: Use of a complex password helps to increase the time and resources required to compromise the password.
              Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing
              and brute-force attacks. Password complexity is one factor of several that determines how long it takes to crack
              a password. The more complex the password, the greater the number of possible combinations that need to be tested
              before the password is compromised. OL 9 uses "pwquality" as a mechanism to enforce password complexity. Note
              that to require special characters without degrading the "minlen" value, the credit value must be expressed
              as a negative number in "/etc/security/pwquality.conf".
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
        source_definition_id: oval:mil.disa.stig.ol9os:def:271636
        version: '1'
