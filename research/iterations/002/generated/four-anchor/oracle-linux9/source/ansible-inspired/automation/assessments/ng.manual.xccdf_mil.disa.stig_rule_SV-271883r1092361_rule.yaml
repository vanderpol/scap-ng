        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:88101
      exports: []
      inline_content: 'Note: If IPv6 is disabled on the system, this requirement is Not Applicable. Verify that OL 9 does
        not accept IPv6 source-routed packets by default. Check the value of the accept source route variable with the following
        command: $ sysctl net.ipv6.conf.default.accept_source_route net.ipv6.conf.default.accept_source_route = 0 If the returned
        line does not have a value of "0", a line is not returned, or the line is commented out, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
