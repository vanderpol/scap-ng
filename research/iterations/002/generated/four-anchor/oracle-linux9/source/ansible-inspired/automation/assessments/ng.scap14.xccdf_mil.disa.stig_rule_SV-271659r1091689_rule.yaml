      exports: []
      inline_content: 'Verify that OL 9 is configured to mount /var/log with the nosuid option. Verify "/var/log" is mounted
        with the "nosuid" option: $ mount | grep /var/log /dev/mapper/ol-var-log on /var/log type xfs (rw,nodev,nosuid,noexec,seclabel)
        If the "/var/log" file system is mounted without the "nosuid" option, this is a finding.'
