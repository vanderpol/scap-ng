rule:
  abstract: false
  check: 'Verify that OL 9 ExecShield is enabled on 64-bit systems with the following command: $ sudo dmesg | grep ''[NX|DX]*protection''
    [ 0.000000] NX (Execute Disable) protection: active If "dmesg" does not show "NX (Execute Disable) protection" active,
    this is a finding.'
  checks:
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-271760r1091992_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-271760r1091992_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>ExecShield uses the segmentation feature on all x86 systems to prevent execution in memory
    higher than a certain address. It writes an address as a limit in the code segment descriptor, to control where code can
    be executed, on a per-process basis. When the kernel places a process's memory regions such as the stack and heap higher
    than this address, the hardware prevents execution in that address range. This is enabled by default on the latest Oracle
    systems if supported by the hardware.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
