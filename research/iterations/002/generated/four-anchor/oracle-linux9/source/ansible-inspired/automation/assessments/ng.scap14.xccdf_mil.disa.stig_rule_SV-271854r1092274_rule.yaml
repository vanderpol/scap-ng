          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify that OL 9 authenticates the remote logging server for off-loading audit logs with the following command:\n\
            \n$ grep -i '$ActionSendStreamDriverAuthMode' /etc/rsyslog.conf /etc/rsyslog.d/*.conf \n /etc/rsyslog.conf:$ActionSendStreamDriverAuthMode\
            \ x509/name \n\nIf the value of the \"$ActionSendStreamDriverAuthMode\" option is not set to \"x509/name\" or\
            \ the line is commented out, ask the system administrator (SA) to indicate how the audit logs are offloaded to\
            \ a different system or media. \n\nIf there is no evidence that the transfer of the audit logs being offloaded\
            \ to another system or media is encrypted, this is a finding."
