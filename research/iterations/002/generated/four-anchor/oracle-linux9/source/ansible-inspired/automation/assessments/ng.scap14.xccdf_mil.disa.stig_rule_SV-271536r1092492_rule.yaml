          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify that OL 9 is configured to audit the execution of the setxattr, fsetxattr, lsetxattr, removexattr,
            fremovexattr, and lremovexattr system calls with the following command:


            $ sudo auditctl -l | grep xattr

            -a always,exit -F arch=b32 -S setxattr,fsetxattr,lsetxattr,removexattr,fremovexattr,lremovexattr -F auid>=1000
            -F auid!=unset -k perm_mod

            -a always,exit -F arch=b64 -S setxattr,fsetxattr,lsetxattr,removexattr,fremovexattr,lremovexattr -F auid>=1000
            -F auid!=unset -k perm_mod


            -a always,exit -F arch=b32 -S setxattr,fsetxattr,lsetxattr,removexattr,fremovexattr,lremovexattr -F auid=0 -k
            perm_mod

            -a always,exit -F arch=b64 -S setxattr,fsetxattr,lsetxattr,removexattr,fremovexattr,lremovexattr -F auid=0 -k
            perm_mod


            If both the "b32" and "b64" audit rules are not defined for the setxattr, fsetxattr, lsetxattr, removexattr, fremovexattr,
            and lremovexattr system calls, or any of the lines returned are commented out, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
