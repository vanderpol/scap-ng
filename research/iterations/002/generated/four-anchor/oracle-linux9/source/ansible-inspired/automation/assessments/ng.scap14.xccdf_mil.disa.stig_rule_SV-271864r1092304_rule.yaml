        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify that OL 9 will not accept IPv4 ICMP redirect messages.


            Check the value of all "accept_redirects" variables with the following command:


            $ sysctl net.ipv4.conf.all.accept_redirects

            net.ipv4.conf.all.accept_redirects = 0


            If the returned line does not have a value of "0", a line is not returned, or the line is commented out, this
            is a finding.'
        name: check
