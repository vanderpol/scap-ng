        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:32901
      exports: []
      inline_content: 'Verify that OL 9 notifies the SA and ISSO (at a minimum) when allocated audit record storage volume
        reaches 75 percent of the repository maximum audit record storage capacity with the following command: $ sudo grep
        -w space_left_action /etc/audit/auditd.conf space_left_action = email If the value of the "space_left_action" is not
        set to "email", or if the line is commented out, ask the SA to indicate how the system is providing real-time alerts
        to the SA and ISSO. If there is no evidence that real-time alerts are configured on the system, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:32901
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify that OL 9 notifies the SA and ISSO (at a minimum) when allocated audit record storage volume reaches
            75 percent of the repository maximum audit record storage capacity with the following command:


            $ sudo grep -w space_left_action /etc/audit/auditd.conf

            space_left_action = email


            If the value of the "space_left_action" is not set to "email", or if the line is commented out, ask the SA to
            indicate how the system is providing real-time alerts to the SA and ISSO.


            If there is no evidence that real-time alerts are configured on the system, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
