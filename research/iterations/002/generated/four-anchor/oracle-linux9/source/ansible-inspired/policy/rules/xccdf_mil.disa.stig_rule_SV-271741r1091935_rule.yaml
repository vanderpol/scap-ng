scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 is configured to enable DAC on symlinks. Check the status of the fs.protected_symlinks kernel parameter
    with the following command: $ sudo sysctl fs.protected_symlinks fs.protected_symlinks = 1 If "fs.protected_symlinks "
    is not set to "1" or is missing, this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271741r1091935_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271741r1091935_rule
    assessment_version: 1
    selector: automated
    source_selector: automated
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-271741r1091935_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: '<VulnDiscussion>By enabling the fs.protected_symlinks kernel parameter, symbolic links are permitted to be
    followed only when outside a sticky world-writable directory, or when the user identifier (UID) of the link and follower
    match, or when the directory owner matches the symlink''s owner. Disallowing such symlinks helps mitigate vulnerabilities
    based on insecure file system accessed by privileged programs, avoiding an exploitation vector exploiting unsafe use of
    open() or creat(). Satisfies: SRG-OS-000312-GPOS-00123, SRG-OS-000324-GPOS-00125</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
