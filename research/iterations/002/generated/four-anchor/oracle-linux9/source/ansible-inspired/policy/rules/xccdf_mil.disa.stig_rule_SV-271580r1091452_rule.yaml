    name: cpe:/o:oracle:linux:9:-
    ref: cpe:/o:oracle:linux:9:-
  extends: null
  fix: 'Configure OL 9 to shut down by default upon audit failure (unless availability is an overriding concern). Add or update
    the following line (depending on configuration "disk_full_action" can be set to "SYSLOG" or "SINGLE" depending on configuration)
    in "/etc/audit/auditd.conf" file: disk_full_action = HALT If availability has been determined to be more important, and
    this decision is documented with the information system security officer (ISSO), configure the operating system to notify
    SA staff and ISSO staff in the event of an audit processing failure by setting the "disk_full_action" to "SYSLOG".'
