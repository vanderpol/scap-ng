scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 takes the appropriate action when the audit storage volume is full. Check that OL 9 takes the appropriate
    action when the audit storage volume is full with the following command: $ sudo grep disk_full_action /etc/audit/auditd.conf
    disk_full_action = HALT If the value of the "disk_full_action" option is not "SYSLOG", "SINGLE", or "HALT", or the line
    is commented out, ask the system administrator (SA) to indicate how the system takes appropriate action when an audit
    storage volume is full. If there is no evidence of appropriate action, this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271580r1091452_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271580r1091452_rule
    assessment_version: 1
    selector: automated
    source_selector: automated
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-271580r1091452_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>It is critical that when the operating system is at risk of failing to process audit logs as
    required, it takes action to mitigate the failure. Audit processing failures include software/hardware errors; failures
    in the audit capturing mechanisms; and audit storage capacity being reached or exceeded. Responses to audit failure depend
    upon the nature of the failure mode.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
