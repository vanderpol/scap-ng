        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:34701
      exports: []
      inline_content: 'Note: If smart card authentication is not being used on the system, this requirement is Not Applicable.
        Verify that OL 9''s System Security Services Daemon (SSSD) prohibits the use of cached authentications after one day.
        Check that SSSD allows cached authentications with the following command: $ sudo grep cache_credentials /etc/sssd/sssd.conf
        cache_credentials = true If "cache_credentials" is set to "false" or missing from the configuration file, this is
        not a finding and no further checks are required. If "cache_credentials" is set to "true", check that SSSD prohibits
        the use of cached authentications after one day with the following command: $ sudo grep offline_credentials_expiration
        /etc/sssd/sssd.conf offline_credentials_expiration = 1 If "offline_credentials_expiration" is not set to a value of
        "1", this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:34701
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Note: If smart card authentication is not being used on the system, this requirement is Not Applicable.


            Verify that OL 9''s System Security Services Daemon (SSSD) prohibits the use of cached authentications after one
            day.


            Check that SSSD allows cached authentications with the following command:


            $ sudo grep cache_credentials /etc/sssd/sssd.conf

            cache_credentials = true


            If "cache_credentials" is set to "false" or missing from the configuration file, this is not a finding and no
            further checks are required.


            If "cache_credentials" is set to "true", check that SSSD prohibits the use of cached authentications after one
            day with the following command:


            $ sudo grep offline_credentials_expiration  /etc/sssd/sssd.conf

            offline_credentials_expiration = 1


            If "offline_credentials_expiration" is not set to a value of "1", this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
