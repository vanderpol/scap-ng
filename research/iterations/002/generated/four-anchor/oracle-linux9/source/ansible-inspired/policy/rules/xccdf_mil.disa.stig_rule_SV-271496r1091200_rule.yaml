scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 has the package installed with the following command: $ dnf list --installed aide Installed Packages
    aide.x86_64 0.16-100.el9 @ol9_appstream If AIDE is not installed, ask the system administrator (SA) how file integrity
    checks are performed on the system. If there is no application installed to perform integrity checks, this is a finding.
    If AIDE is installed, check if it has been initialized with the following command: $ sudo /usr/sbin/aide --check If the
    output is "Couldn''t open file /var/lib/aide/aide.db.gz for reading", this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271496r1091200_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271496r1091200_rule
    assessment_version: 1
    selector: automated
    source_selector: automated
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-271496r1091200_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: '<VulnDiscussion>Without verification of the security functions, security functions may not operate correctly,
    and the failure may go unnoticed. Security function is defined as the hardware, software, and/or firmware of the information
    system responsible for enforcing the system security policy and supporting the isolation of code and data on which the
    protection is based. Security functionality includes, but is not limited to, establishing system accounts, configuring
    access authorizations (i.e., permissions, privileges), setting events to be audited, and setting intrusion detection parameters.
    Satisfies: SRG-OS-000363-GPOS-00150, SRG-OS-000445-GPOS-00199</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
