        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:3301
      exports: []
      inline_content: 'Verify OL 9 disables the ability to load the tipc kernel module with the following command: $ grep
        -irs tipc /etc/modprobe.conf /etc/modprobe.d/* /etc/modprobe.d/tipc.conf:install tipc /bin/false /etc/modprobe.d/tipc.conf:blacklist
        tipc If the command does not return any output, or the line is commented out, and use of TIPC is not documented with
        the information system security officer (ISSO) as an operational requirement, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:3301
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify OL 9 disables the ability to load the tipc kernel module with the following command:


            $ grep -irs tipc /etc/modprobe.conf /etc/modprobe.d/*

            /etc/modprobe.d/tipc.conf:install tipc /bin/false

            /etc/modprobe.d/tipc.conf:blacklist tipc


            If the command does not return any output, or the line is commented out, and use of TIPC is not documented with
            the information system security officer (ISSO) as an operational requirement, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
