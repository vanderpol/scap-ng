            text: OL09-00-000044 - OL 9 must disable the Transparent Inter Process Communication (TIPC) kernel module.
          - attributes:
              family: unix
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Oracle Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements\
              \ or mission objectives. These unnecessary capabilities or services are often overlooked and therefore may remain\
              \ unsecured. They increase the risk to the platform by providing additional attack vectors.\n\n\tFailing to\
              \ disconnect unused protocols can result in a system compromise.\n\n\tThe TIPC is a protocol that is specially\
              \ designed for intra-cluster communication. It can be configured to transmit messages either on UDP or directly\
              \ across Ethernet. Message delivery is sequence guaranteed, loss free, and flow controlled. Disabling TIPC protects\
              \ the system against exploitation of any flaws in its implementation."
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
        source_definition_id: oval:mil.disa.stig.ol9os:def:271447
        version: '1'
