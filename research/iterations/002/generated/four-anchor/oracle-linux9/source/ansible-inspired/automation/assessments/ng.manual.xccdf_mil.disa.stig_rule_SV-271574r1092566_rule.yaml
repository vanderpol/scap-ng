      exports: []
      inline_content: 'Verify that OL 9 is configured to audit the execution of the poweroff command with the following command:
        $ sudo auditctl -l | grep poweroff -a always,exit -F path=/usr/sbin/poweroff -F perm=x -F auid>=1000 -F auid!=unset
