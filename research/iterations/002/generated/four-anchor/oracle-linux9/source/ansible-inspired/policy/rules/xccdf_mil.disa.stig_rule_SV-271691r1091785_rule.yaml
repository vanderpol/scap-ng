scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'This requirement assumes the use of the OL 9 default graphical user interface—the GNOME desktop environment. If
    the system does not have any graphical user interface installed, this requirement is Not Applicable. Verify that OL 9
    does not allow an unattended or automatic logon to the system via a graphical user interface. Check for the value of the
    "AutomaticLoginEnable" in the "/etc/gdm/custom.conf" file with the following command: $ grep -i automaticlogin /etc/gdm/custom.conf
    [daemon] AutomaticLoginEnable=false If the value of "AutomaticLoginEnable" is not set to "false", this is a finding.'
  checks:
