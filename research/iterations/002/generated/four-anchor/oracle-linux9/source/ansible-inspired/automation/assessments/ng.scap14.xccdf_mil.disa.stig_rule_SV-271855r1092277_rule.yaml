            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "Information stored in one location is vulnerable to accidental or incidental deletion or alteration.\n\n\
              \tOffloading is a common process in information systems with limited audit storage capacity.\n\n\tOL 9 installation\
              \ media provides \"rsyslogd\", a system utility providing support for message logging. Support for both internet\
              \ and Unix domain sockets enables this utility to support both local and remote logging. Coupling this utility\
              \ with \"gnutls\" (a secure communications library implementing the SSL, TLS, and DTLS protocols) creates a\
              \ method to securely encrypt and offload auditing.\n\n\t\"Rsyslog\" supported authentication modes include:\n\
              \tanon - anonymous authentication\n\tx509/fingerprint - certificate fingerprint authentication\n\tx509/certvalid\
              \ - certificate validation only\n\tx509/name - certificate validation and subject name authentication\n\n\t\
              Satisfies: SRG-OS-000342-GPOS-00133, SRG-OS-000479-GPOS-00224"
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
        source_definition_id: oval:mil.disa.stig.ol9os:def:271855
        version: '2'
