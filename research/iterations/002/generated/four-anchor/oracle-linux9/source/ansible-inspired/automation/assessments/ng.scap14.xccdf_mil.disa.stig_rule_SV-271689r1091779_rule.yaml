        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:50301
      exports: []
      inline_content: 'This requirement assumes the use of the OL 9 default graphical user interface—the GNOME desktop environment.
        If the system does not have any graphical user interface installed, this requirement is Not Applicable. Verify that
        OL 9 displays the Standard Mandatory DOD Notice and Consent Banner before granting access to the operating system
        via a graphical user logon. Check that the operating system displays the exact Standard Mandatory DOD Notice and Consent
        Banner text with the command: $ gsettings get org.gnome.login-screen banner-message-text banner-message-text= ''You
        are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only.\nBy using
        this IS (which includes any device attached to this IS), you consent to the following conditions:\n-The USG routinely
        intercepts and monitors communications on this IS for purposes including, but not limited to, penetration testing,
        COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence
        (CI) investigations.\n-At any time, the USG may inspect and seize data stored on this IS.\n-Communications using,
        or data stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be
        disclosed or used for any USG-authorized purpose.\n-This IS includes security measures (e.g., authentication and access
        controls) to protect USG interests--not for your personal benefit or privacy.\n-Notwithstanding the above, using this
        IS does not constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged
        communications, or work product, related to personal representation or services by attorneys, psychotherapists, or
        clergy, and their assistants. Such communications and work product are private and confidential. See User Agreement
        for details.'' Note: The "\n " characters are for formatting only. They will not be displayed on the graphical interface.
        If the banner does not match the Standard Mandatory DOD Notice and Consent Banner exactly, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
