scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'This requirement assumes the use of the OL 9 default graphical user interface—the GNOME desktop environment. If
    the system does not have any graphical user interface installed, this requirement is Not Applicable. Verify that OL 9
    disables ability of the user to override the smart card removal action setting. Determine which profile the system database
    is using with the following command: $ grep system-db /etc/dconf/profile/user system-db:local Check that the removal action
    setting is locked from nonprivileged user modification with the following command: Note: The example below is using the
    database "local" for the system, so the path is "/etc/dconf/db/local.d". This path must be modified if a database other
    than "local" is being used. $ grep ''removal-action'' /etc/dconf/db/local.d/locks/* /org/gnome/settings-daemon/peripherals/smartcard/removal-action
    If the command does not return at least the example result, this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271684r1091764_rule
    assessment_version: 1
    selector: default
    source_selector: ''
