    kind: cpe_name
    name: cpe:/o:oracle:linux:9:-
    ref: cpe:/o:oracle:linux:9:-
  extends: null
  fix: 'Install Oracle package-signing keys on the system and verify their fingerprints match vendor values. To verify Oracle
    Linux Downloads, users need: -A checksum file corresponding to the downloaded ISO. -The public GPG key to verify the Oracle
    key used to sign the checksum file. The checksum file contains a list of files that are part of a download package with
    the corresponding checksums as well as a GPG signature. The GPG signature enables anyone to verify that checksum file
    was published by Oracle. The steps below describe how to verify they checksum file itself and then verify the contents
    of the Oracle Linux download by checking against the checksum file. Import the Oracle Linux GPG key corresponding to the
    Oracle Linux release: $ curl https://yum.oracle.com/RPM-GPG-KEY-oracle-ol9 | gpg --import Note: No "sudo" for curl command
    Download the appropriate checksum file and place it in the same directory as the Oracle Linux ISO download: $ curl https://linux.oracle.com/security/gpg/checksum/OracleLinux-R9-U3-Server-x86_64.checksum
    > OracleLinux-R9-U3-Server-x86_64.checksum Download GPG Key: $ curl https://yum.oracle.com/RPM-GPG-KEY-oracle-ol9 -o RPM-GPG-KEY-oracle
    Note: No "sudo" for curl command To verify the checksum file: $ gpg --verify-files OracleLinux-R9-U3-Server-x86_64.checksum
    gpg: Signature made Wed 15 Nov 2023 07:22:32 AM EST gpg: using RSA key 3E6D826D3FBAB389C2F38E34BC4D06A08D8B756F gpg: issuer
    "secalert_us@oracle.com" gpg: Good signature from "Oracle Linux (release key 1) <secalert_us@oracle.com>" [unknown] gpg:
    WARNING: The key''s User ID is not certified with a trusted signature! gpg: There is no indication that the signature
    belongs to the owner. Primary key fingerprint: 3E6D 826D 3FBA B389 C2F3 8E34 BC4D 06A0 8D8B 756F Verify the ISO download
    as follows: $ grep OracleLinux-R9-U3-x86_64-boot.iso OracleLinux-R9-U3-Server-x86_64.checksum | sha256sum -c OracleLinux-R9-U3-x86_64-boot.iso:
    OK'
