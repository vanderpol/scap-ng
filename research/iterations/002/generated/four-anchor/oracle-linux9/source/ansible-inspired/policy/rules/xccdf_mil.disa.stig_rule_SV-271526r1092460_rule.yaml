scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 ensures cryptographic verification of vendor software packages by confirming that Oracle package-signing
    keys are installed on the system, and verify their fingerprints match vendor values. Note: For OL 9 software packages,
    Oracle uses GPG keys labeled "release key 1" and "auxiliary key 1". The keys are defined in key file "/etc/pki/rpm-gpg/RPM-GPG-KEY-oracle"
    by default. List Oracle GPG keys installed on the system: $ sudo rpm -q --queryformat "%{SUMMARY}\n" gpg-pubkey | grep
    -i "oracle" Oracle Linux (release key 1) <secalert_us@oracle.com> public key Oracle Linux (backup key 1) <secalert_us@oracle.com>
    public key If Oracle GPG keys "release key 1" and "backup key 1" are not installed, this is a finding. List key fingerprints
    of installed Oracle GPG keys: $ sudo gpg -q --keyid-format short --with-fingerprint /etc/pki/rpm-gpg/RPM-GPG-KEY-oracle
    If key file "/etc/pki/rpm-gpg/RPM-GPG-KEY-oracle" is missing, this is a finding. pub rsa4096/8D8B756F 2022-01-19 [SC]
    [expires: 2042-01-14] Key fingerprint = 3E6D 826D 3FBA B389 C2F3 8E34 BC4D 06A0 8D8B 756F uid Oracle Linux (release key
    1) <secalert_us@oracle.com> sub rsa4096/2E708C25 2022-01-19 [E] [expires: 2041-06-01] pub rsa4096/8B4EFBE6 2022-01-19
    [SC] [expires: 2042-01-14] Key fingerprint = 9822 3175 9C74 6706 5D0C E9B2 A7DD 0708 8B4E FBE6 uid Oracle Linux (backup
    key 1) <secalert_us@oracle.com> sub rsa4096/DA900791 2022-01-19 [E] [expires: 2041-06-02] Compare key fingerprints of
    installed Oracle GPG keys with fingerprints listed for OL 9 on Oracle verification webpage at https://linux.oracle.com/security/gpg/#gpg.
    If key fingerprints do not match, this is a finding.'
  checks:
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-271526r1092460_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-271526r1092460_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>Cryptographic verification of vendor software packages ensures that all software packages are
    obtained from a valid source and protects against spoofing that could lead to installation of malware on the system. Oracle
    cryptographically signs all software packages, which includes updates, with a GPG key to verify that they are valid.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
