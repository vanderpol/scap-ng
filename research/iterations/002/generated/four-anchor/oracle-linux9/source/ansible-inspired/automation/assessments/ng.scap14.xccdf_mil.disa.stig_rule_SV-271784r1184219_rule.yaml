      exports: []
      inline_content: 'Verify OL 9 configures assigned home directories of all local interactive users to have a mode of "0750"
        or less permissive with the following command: Note: This may miss interactive users that have been assigned a privileged
        user identifier (UID). Evidence of interactive use may be obtained from a number of log files containing system logon
        information. $ sudo ls -ld $(awk -F: ''($3>=1000)&&($7 !~ /nologin/){print $6}'' /etc/passwd) drwxr-x--- 2 disauser
        admin 4096 Jun 5 12:41 disauser If home directories referenced in "/etc/passwd" do not have a mode of "0750" or less
        permissive, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
