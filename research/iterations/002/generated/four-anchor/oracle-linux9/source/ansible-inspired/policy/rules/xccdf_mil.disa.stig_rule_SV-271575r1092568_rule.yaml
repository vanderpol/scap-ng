  extends: null
  fix: 'Configure the audit system to generate an audit event for any successful/unsuccessful uses of the reboot command by
    adding or updating the following rule in the "/etc/audit/rules.d/audit.rules" file: -a always,exit -F path=/usr/sbin/reboot
    -F perm=x -F auid>=1000 -F auid!=unset -k privileged-reboot The audit daemon must be restarted for the changes to take
    effect. Restart auditd: $ sudo service auditd restart'
