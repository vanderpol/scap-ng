rule:
  abstract: false
  check: 'Verify that OL 9 is configured to audit the execution of the reboot command with the following command: $ sudo auditctl
    -l | grep reboot -a always,exit -F path=/usr/sbin/reboot -F perm=x -F auid>=1000 -F auid!=unset -k privileged-reboot If
    the command does not return a line or the line is commented out, this is a finding.'
