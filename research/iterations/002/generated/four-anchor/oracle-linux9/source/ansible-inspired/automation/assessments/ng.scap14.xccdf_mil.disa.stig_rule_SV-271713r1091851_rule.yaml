            text: OL09-00-002350 - OL 9 SSH daemon must disable remote X connections for interactive users.
          - attributes:
              family: unix
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Oracle Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: When X11 forwarding is enabled, there may be additional exposure to the server and client displays if the
              SSHD proxy display is configured to listen on the wildcard address. By default, SSHD binds the forwarding server
              to the loopback address and sets the hostname part of the DISPLAY environment variable to localhost. This prevents
              remote hosts from connecting to the proxy display.
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
