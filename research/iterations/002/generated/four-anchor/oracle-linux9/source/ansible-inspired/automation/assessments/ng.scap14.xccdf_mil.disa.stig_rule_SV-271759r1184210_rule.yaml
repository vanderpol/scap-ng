        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Note: If the \"bind\" package is not installed, this requirement is Not Applicable.\n\nVerify OL 9 BIND uses\
            \ the system crypto policy with the following command:\n\n$ sudo grep include /etc/named.conf \ninclude \"/etc/crypto-policies/back-ends/bind.config\"\
            ;' \n\nIf BIND is installed and the BIND config file does not include the \"/etc/crypto-policies/back-ends/bind.config\"\
            \ directive, or the line is commented out, this is a finding."
