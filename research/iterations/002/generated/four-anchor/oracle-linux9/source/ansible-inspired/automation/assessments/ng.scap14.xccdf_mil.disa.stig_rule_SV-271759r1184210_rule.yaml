          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "Without cryptographic integrity protections, information can be altered by unauthorized users without detection.\n\
              \n\tCryptographic mechanisms used for protecting the integrity of information include, for example, signed hash\
              \ functions using asymmetric cryptography enabling distribution of the public key to verify the hash information\
              \ while maintaining the confidentiality of the secret key used to generate the hash.\n\n\tOL 9 incorporates\
              \ system-wide crypto policies by default. The employed algorithms can be viewed in the /etc/crypto-policies/back-ends/\
              \ directory.\n\n\tSatisfies: SRG-OS-000423-GPOS-00187, SRG-OS-000426-GPOS-00190"
          name: metadata
