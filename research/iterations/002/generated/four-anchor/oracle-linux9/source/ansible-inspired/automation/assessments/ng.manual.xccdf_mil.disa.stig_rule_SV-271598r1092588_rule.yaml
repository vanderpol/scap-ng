            \ the \"overflow_action\" option is not set to \"syslog\", \"single\", \"halt\" or the line is commented out,\
            \ ask the system administrator (SA) to indicate how the audit logs are offloaded to a different system or media.\n\
            \nIf there is no evidence that the transfer of the audit logs being offloaded to another system or media takes\
            \ appropriate action if the internal event queue becomes full, this is a finding."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
