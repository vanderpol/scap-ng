scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify OL 9 configures assigned home directories of all local interactive users to be group-owned by that user''s
    primary GID with the following command: Note: This may miss local interactive users that have been assigned a privileged
    user identifier (UID). Evidence of interactive use may be obtained from a number of log files containing system logon
    information. The returned directory "/home/disauser" is used as an example. $ sudo ls -ld $(awk -F: ''($3>=1000)&&($7
    !~ /nologin/){print $6}'' /etc/passwd) drwxr-x--- 2 disauser admin 4096 Jun 5 12:41 disauser Check the user''s primary
    group with the following command: $ sudo grep $(grep disauser /etc/passwd | awk -F: ''{print $4}'') /etc/group admin:x:250:disauser,doduser,nsauser
    If the user home directory referenced in "/etc/passwd" is not group-owned by that user''s primary GID, this is a finding.'
  checks:
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-271783r1184216_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-271783r1184216_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>If the Group Identifier (GID) of a local interactive user's home directory is not the same
    as the primary GID of the user, this would allow unauthorized access to the user's files, and users that share the same
    group may not be able to access files that they legitimately should.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
