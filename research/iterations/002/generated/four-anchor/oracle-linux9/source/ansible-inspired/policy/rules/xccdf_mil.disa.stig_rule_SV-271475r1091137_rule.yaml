scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 is configured to enforce the sudoers security policy to use the invoking user''s password for privilege
    escalation with the following command: $ sudo egrep -i ''(!rootpw|!targetpw|!runaspw)'' /etc/sudoers /etc/sudoers.d/*
    | grep -v ''#'' /etc/sudoers:Defaults !targetpw /etc/sudoers:Defaults !rootpw /etc/sudoers:Defaults !runaspw If no results
    are returned, this is a finding. If results are returned from more than one file location, this is a finding. If "Defaults
    !targetpw" is not defined, this is a finding. If "Defaults !rootpw" is not defined, this is a finding. If "Defaults !runaspw"
    is not defined, this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271475r1091137_rule
    assessment_version: 1
    selector: default
    source_selector: ''
