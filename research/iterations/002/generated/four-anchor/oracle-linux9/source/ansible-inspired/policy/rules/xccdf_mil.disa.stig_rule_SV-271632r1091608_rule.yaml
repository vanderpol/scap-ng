scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 user account passwords have a 60-day maximum password lifetime restriction with the following commands:
    $ sudo awk -F: ''$5 > 60 {print $1 "" "" $5}'' /etc/shadow $ sudo awk -F: ''$5 <= 0 {print $1 "" "" $5}'' /etc/shadow
    If any results are returned that are not associated with a system account, this is a finding.'
