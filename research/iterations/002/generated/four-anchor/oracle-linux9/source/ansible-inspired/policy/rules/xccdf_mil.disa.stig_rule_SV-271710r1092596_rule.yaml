    the SSH server to terminate a user session automatically after the SSH client has been unresponsive for 10 minutes. Modify
    or append the following lines in the "/etc/ssh/sshd_config" or in a file in "/etc/ssh/sshd_config.d": ClientAliveInterval
    600 In order for the changes to take effect, the SSH daemon must be restarted. $ sudo systemctl restart sshd.service'
