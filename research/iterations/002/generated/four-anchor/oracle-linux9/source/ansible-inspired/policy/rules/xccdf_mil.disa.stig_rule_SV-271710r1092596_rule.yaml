    - name: description
      namespace: http://checklists.nist.gov/xccdf/1.2
      text: '<VulnDiscussion>Terminating an unresponsive SSH session within a short time period reduces the window of opportunity
        for unauthorized personnel to take control of a management session enabled on the console or console port that has
        been left unattended. In addition, quickly terminating an idle SSH session will also free up resources committed by
        the managed network element.


        Terminating network connections associated with communications sessions includes, for example, deallocating associated
        TCP/IP address/port pairs at the operating system level and deallocating networking assignments at the application
        level if multiple application sessions are using a single operating system-level network connection. This does not
        mean the operating system terminates all sessions or network access; it only ends the unresponsive session and releases
        the resources associated with that session.


        OL 9 uses /etc/ssh/sshd_config for configurations of OpenSSH. Within the sshd_config, the product of the values of
        "ClientAliveInterval" and "ClientAliveCountMax" are used to establish the inactivity threshold. The "ClientAliveInterval"
