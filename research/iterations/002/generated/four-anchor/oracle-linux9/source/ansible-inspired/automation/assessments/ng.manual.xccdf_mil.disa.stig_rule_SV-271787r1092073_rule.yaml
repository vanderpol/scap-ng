      exports: []
      inline_content: 'Verify that OL 9 system-wide shared library directories are owned by "root" with the following command:
        $ sudo find /lib /lib64 /usr/lib /usr/lib64 ! -user root -type d -exec stat -c "%n %U" ''{}'' \; If any system-wide
        shared library directory is not owned by root, this is a finding.'
