scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 is configured so that AIDE is verifying ACLs with the following command: $ sudo grep acl /etc/aide.conf
    All= p+i+n+u+g+s+m+S+sha512+acl+xattrs+selinux If the "acl" rule is not being used on all uncommented selection lines
    in the "/etc/aide.conf" file, or ACLs are not being checked by another file integrity tool, this is a finding.'
  checks:
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-271499r1091209_rule
    assessment_version: 1
    selector: default
    source_selector: ''
