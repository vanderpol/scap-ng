            \ the following:\n$ sudo grep -rq 'type=\"omfwd\"' /etc/rsyslog.conf /etc/rsyslog.d/\n\nIf a remote server is\
            \ not configured, or the line is commented out, ask the system administrator (SA) to indicate how the audit logs\
            \ are offloaded to a different system or media. \n\nIf there is no evidence that the audit logs are being offloaded\
            \ to another system or media, this is a finding."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
