          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify that OL 9 GRUB 2 is configured to enable poisoning of SLUB/SLAB objects to mitigate use-after-free\
            \ vulnerabilities with the following commands:\n\nCheck that the current GRUB 2 configuration has poisoning of\
            \ SLUB/SLAB objects enabled:\n\n$ sudo grubby --info=ALL | grep args | grep -v 'slub_debug=P' \nIf any output\
            \ is returned, this is a finding.\n\nCheck that poisoning of SLUB/SLAB objects is enabled by default to persist\
            \ in kernel updates: \n\n$ sudo grep slub_debug /etc/default/grub\nGRUB_CMDLINE_LINUX=\"slub_debug=P\"\n\nIf \"\
            slub_debug\" is not set to \"P\", is missing or commented out, this is a finding."
