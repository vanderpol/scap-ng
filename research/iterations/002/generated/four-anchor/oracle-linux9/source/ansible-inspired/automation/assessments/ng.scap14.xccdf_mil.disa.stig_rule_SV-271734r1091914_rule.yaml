            text: OL09-00-002390 - OL 9 must clear SLUB/SLAB objects to prevent use-after-free attacks.
          - attributes:
              family: unix
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Oracle Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "Some adversaries launch attacks with the intent of executing code in nonexecutable regions of memory or\
              \ in memory locations that are prohibited. Security safeguards employed to protect memory include, for example,\
              \ data execution prevention and address space layout randomization. Data execution prevention safeguards can\
              \ be either hardware-enforced or software-enforced with hardware providing the greater strength of mechanism.\n\
              \n\tPoisoning writes an arbitrary value to freed pages, so any modification or reference to that page after\
              \ being freed or before being initialized will be detected and prevented. This prevents many types of use-after-free\
              \ vulnerabilities at little performance cost. Also prevents leak of data and detection of corrupted memory.\n\
              \n\tSLAB objects are blocks of physically contiguous memory. SLUB is the unqueued SLAB allocator.\n\n\tSatisfies:\
              \ SRG-OS-000433-GPOS-00192, SRG-OS-000134-GPOS-00068"
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
        source_definition_id: oval:mil.disa.stig.ol9os:def:271734
        version: '1'
