        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:89101
      exports: []
      inline_content: Verify that OL 9 is configured to audit the execution of any system call made by cron as root or as
        any privileged user. $ sudo auditctl -l | grep /etc/cron.d -w /etc/cron.d -p wa -k cronjobs $ sudo auditctl -l | grep
        /var/spool/cron -w /var/spool/cron -p wa -k cronjobs If either of these commands do not return the expected output,
        or the lines are commented out, this is a finding.
      multi_check: null
