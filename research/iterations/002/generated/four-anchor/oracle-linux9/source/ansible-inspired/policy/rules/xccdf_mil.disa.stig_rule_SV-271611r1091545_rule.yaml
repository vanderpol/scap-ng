rule:
  abstract: false
  check: 'Verify that OL 9 uses "pwquality" to enforce the password complexity rules in the system-auth file with the following
    command: $ cat /etc/pam.d/system-auth | grep pam_pwquality password required pam_pwquality.so If the command does not
    return a line containing the value "pam_pwquality.so", or the line is commented out, this is a finding.'
