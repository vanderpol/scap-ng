scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 logs IPv4 martian packets by default. Check the value of the accept source route variable with
    the following command: $ sysctl net.ipv4.conf.default.log_martians net.ipv4.conf.default.log_martians = 1 If the returned
    line does not have a value of "1", a line is not returned, or the line is commented out, this is a finding.'
