        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify that OL 9 dnf package manager always checks the GPG signature of locally installed software packages\
            \ before installation:\n\n$ grep localpkg_gpgcheck /etc/dnf/dnf.conf \nlocalpkg_gpgcheck=1 \n\nIf \"localpkg_gpgcheck\"\
            \ is not set to \"1\", or if the option is missing or commented out, ask the system administrator how the GPG\
            \ signatures of local software packages are being verified.\n\nIf there is no process to verify GPG signatures\
            \ that is approved by the organization, this is a finding."
