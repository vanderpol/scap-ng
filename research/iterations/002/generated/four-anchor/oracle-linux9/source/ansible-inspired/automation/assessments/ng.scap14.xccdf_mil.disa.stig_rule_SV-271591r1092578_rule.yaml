            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "It is critical for the appropriate personnel to be aware if a system is at risk of failing to process audit\
              \ logs as required. Without this notification, the security personnel may be unaware of an impending failure\
              \ of the audit capability, and system operation may be adversely affected.\n\n\tAudit processing failures include\
              \ software/hardware errors, failures in the audit capturing mechanisms, and audit storage capacity being reached\
              \ or exceeded.\n\n\tThis requirement applies to each audit data storage repository (i.e., distinct information\
              \ system component where audit records are stored), the centralized audit storage capacity of organizations\
              \ (i.e., all audit data storage repositories combined), or both.\n\n\tSatisfies: SRG-OS-000046-GPOS-00022, SRG-OS-000343-GPOS-00134"
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
