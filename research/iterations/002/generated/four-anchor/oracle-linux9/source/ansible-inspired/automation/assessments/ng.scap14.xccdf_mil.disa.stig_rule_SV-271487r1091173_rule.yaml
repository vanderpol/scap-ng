      exports: []
      inline_content: 'Verify that OL 9 displays the Standard Mandatory DOD Notice and Consent Banner before granting access
        to the system via SSH connections. Check for the location of the banner file currently being used with the following
        command: $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo
        grep -iH ''^\s*banner'' banner /etc/issue If the line is commented out or if the file is missing, this is a finding.'
