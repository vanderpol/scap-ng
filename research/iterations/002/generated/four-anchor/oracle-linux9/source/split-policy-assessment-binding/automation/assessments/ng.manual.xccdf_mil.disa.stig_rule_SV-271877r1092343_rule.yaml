assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271877r1092343_rule
  version: 1
  description: OL 9 must not accept router advertisements on all IPv6 interfaces.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:86901
    exports: []
    inline_content: 'Note: If IPv6 is disabled on the system, this requirement is Not Applicable. Verify that OL 9 does not
      accept router advertisements on all IPv6 interfaces, unless the system is a router. Determine if router advertisements
      are not accepted by using the following command: $ sysctl net.ipv6.conf.all.accept_ra net.ipv6.conf.all.accept_ra =
      0 If the "accept_ra" value is not "0" and is not documented with the information system security officer (ISSO) as an
      operational requirement, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
      children:
      - attributes:
          href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
          name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:86901
        name: check-content-ref
        namespace: http://checklists.nist.gov/xccdf/1.2
      - name: check-content
        namespace: http://checklists.nist.gov/xccdf/1.2
        text: 'Note: If IPv6 is disabled on the system, this requirement is Not Applicable.


          Verify that OL 9 does not accept router advertisements on all IPv6 interfaces, unless the system is a router.


          Determine if router advertisements are not accepted by using the following command:


          $ sysctl net.ipv6.conf.all.accept_ra

          net.ipv6.conf.all.accept_ra = 0


          If the "accept_ra" value is not "0" and is not documented with the information system security officer (ISSO) as
          an operational requirement, this is a finding.'
      name: check
      namespace: http://checklists.nist.gov/xccdf/1.2
    system: http://scap.nist.gov/schema/ocil/2
