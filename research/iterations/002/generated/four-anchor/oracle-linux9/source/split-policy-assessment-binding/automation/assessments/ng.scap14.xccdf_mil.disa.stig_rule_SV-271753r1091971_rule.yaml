        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:62701
      exports: []
      inline_content: 'Verify that OL 9 limits the number of concurrent sessions to "10" for all accounts and/or account types
        with the following command: $ grep -r -s maxlogins /etc/security/limits.conf /etc/security/limits.d/*.conf /etc/security/limits.conf:*
        hard maxlogins 10 This can be set as a global domain (with the * wildcard) but may be set differently for multiple
        domains. If the "maxlogins" item is missing, commented out, or the value is set greater than "10" and is not documented
        with the information system security officer (ISSO) as an operational requirement for all domains that have the "maxlogins"
        item assigned, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:62701
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify that OL 9 limits the number of concurrent sessions to "10" for all accounts and/or account types with
            the following command:


            $ grep -r -s maxlogins /etc/security/limits.conf /etc/security/limits.d/*.conf

            /etc/security/limits.conf:* hard maxlogins 10


            This can be set as a global domain (with the * wildcard) but may be set differently for multiple domains.


            If the "maxlogins" item is missing, commented out, or the value is set greater than "10" and is not documented
            with the information system security officer (ISSO) as an operational requirement for all domains that have the
            "maxlogins" item assigned, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
