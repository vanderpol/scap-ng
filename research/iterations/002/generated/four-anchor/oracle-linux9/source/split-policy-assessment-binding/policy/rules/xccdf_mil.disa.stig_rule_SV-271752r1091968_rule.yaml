rule:
  id: xccdf_mil.disa.stig_rule_SV-271752r1091968_rule
  title: OL 9 must be configured so that the x86 Ctrl-Alt-Delete key sequence is disabled.
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
