        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:26901
      exports: []
      inline_content: 'Verify that OL 9 is configured to audit the execution of the execve system call with the following
        command: $ sudo auditctl -l | grep execve -a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -k execpriv
        -a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -k execpriv -a always,exit -F arch=b32 -S execve -C gid!=egid
        -F egid=0 -k execpriv -a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -k execpriv If the command does
        not return all lines or the lines are commented out, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:26901
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify that OL 9 is configured to audit the execution of the execve system call with the following command:\n\
            \n$ sudo auditctl -l | grep execve\n-a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -k execpriv \n\
            -a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -k execpriv\n-a always,exit -F arch=b32 -S execve\
            \ -C gid!=egid -F egid=0 -k execpriv \n-a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -k execpriv\n\
            \nIf the command does not return all lines or the lines are commented out, this is a finding."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
