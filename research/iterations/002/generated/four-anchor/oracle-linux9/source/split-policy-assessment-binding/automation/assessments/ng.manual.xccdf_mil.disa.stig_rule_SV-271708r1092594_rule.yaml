assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271708r1092594_rule
  version: 1
  description: OL 9 must not permit direct logons to the root account using remote access via SSH.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:53901
    exports: []
    inline_content: 'Verify that OL 9 remote access using SSH prevents users from logging on directly as "root" with the following
      command: $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo
      grep -iH ''^\s*permitrootlogin'' PermitRootLogin no If the "PermitRootLogin" keyword is set to "yes", is missing, or
      is commented out, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
