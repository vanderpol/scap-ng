        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:30701
      exports: []
      inline_content: Verify that OL 9 administrators are notified in the event of an audit processing failure. Check that
        the "/etc/aliases" file has a defined value for "root". $ grep "postmaster:\s*root$" /etc/aliases If the command does
        not return a line, or the line is commented out, ask the system administrator to indicate how they and the information
        systems security officer (ISSO) are notified of an audit process failure. If there is no evidence of the proper personnel
        being notified of an audit processing failure, this is a finding.
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:30701
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify that OL 9 administrators are notified in the event of an audit processing failure.


            Check that the "/etc/aliases" file has a defined value for "root".


            $ grep "postmaster:\s*root$" /etc/aliases


            If the command does not return a line, or the line is commented out, ask the system administrator to indicate
            how they and the information systems security officer (ISSO) are notified of an audit process failure. If there
            is no evidence of the proper personnel being notified of an audit processing failure, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
