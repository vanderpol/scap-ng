          - attributes:
              family: unix
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Oracle Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "Use of a complex password helps to increase the time and resources required to compromise the password.\
              \ Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at\
              \ guessing and brute-force attacks. \"pwquality\" enforces complex password construction configuration and has\
              \ the ability to limit brute-force attacks on the system.\n\n\tOL 9 uses \"pwquality\" as a mechanism to enforce\
              \ password complexity. This is set in both:\n\t/etc/pam.d/password-auth\n\t/etc/pam.d/system-auth\n\n\tBy limiting\
              \ the number of attempts to meet the pwquality module complexity requirements before returning with an error,\
              \ the system will audit abnormal attempts at password changes."
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
