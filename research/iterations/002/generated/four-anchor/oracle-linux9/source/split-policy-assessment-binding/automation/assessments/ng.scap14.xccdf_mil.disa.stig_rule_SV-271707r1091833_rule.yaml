      inline_content: 'Verify that OL 9 SSHD is configured to allow for the UsePAM interface with the following command: $
        sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo grep -iH
        ''^\s*usepam'' UsePAM yes If the "UsePAM" keyword is set to "no", is missing, or is commented out, this is a finding.'
      multi_check: null
