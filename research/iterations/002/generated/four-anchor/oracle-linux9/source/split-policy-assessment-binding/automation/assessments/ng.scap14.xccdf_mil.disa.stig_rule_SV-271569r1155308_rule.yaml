        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:26701
      exports: []
      inline_content: 'Verify OL 9 uses cryptographic mechanisms to protect the integrity of the audit tools with the following
        command: $ sudo cat /etc/aide.conf | grep /usr/sbin/au /usr/sbin/auditctl p+i+n+u+g+s+b+acl+xattrs+sha512 /usr/sbin/auditd
        p+i+n+u+g+s+b+acl+xattrs+sha512 /usr/sbin/ausearch p+i+n+u+g+s+b+acl+xattrs+sha512 /usr/sbin/aureport p+i+n+u+g+s+b+acl+xattrs+sha512
        /usr/sbin/autrace p+i+n+u+g+s+b+acl+xattrs+sha512 /usr/sbin/augenrules p+i+n+u+g+s+b+acl+xattrs+sha512 If AIDE is
        not installed, ask the system administrator (SA) how file integrity checks are performed on the system. If any of
        the audit tools listed above do not have a corresponding line, ask the SA to indicate what cryptographic mechanisms
        are being used to protect the integrity of the audit tools. If there is no evidence of integrity protection, this
        is a finding.'
      multi_check: null
      negate: null
