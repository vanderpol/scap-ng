      inline_content: 'Verify that OL 9 logs out sessions that are idle for 10 minutes with the following command: $ sudo
        grep -i ^StopIdleSessionSec /etc/systemd/logind.conf StopIdleSessionSec=600 If "StopIdleSessionSec" is not configured
        to "600" seconds, this is a finding.'
