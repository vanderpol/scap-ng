rule:
  id: xccdf_mil.disa.stig_rule_SV-271849r1092259_rule
  title: OL 9 must disable account identifiers (individuals, groups, roles, and devices) after 35 days of inactivity.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
