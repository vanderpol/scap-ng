    exports: []
    inline_content: 'Verify that OL 9 enforces password complexity by requiring at least one lowercase character. Check the
      value for "lcredit" with the following command: $ grep lcredit /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
      /etc/security/pwquality.conf:lcredit = -1 If the value of "lcredit" is a positive number or is commented out, this is
      a finding.'
