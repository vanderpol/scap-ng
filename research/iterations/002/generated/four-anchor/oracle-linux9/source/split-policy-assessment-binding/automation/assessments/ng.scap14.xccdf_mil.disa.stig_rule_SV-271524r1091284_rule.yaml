        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:17701
      exports: []
      inline_content: 'Verify that OL 9 dnf package manager always checks the GPG signature of software packages originating
        from external software repositories before installation: $ grep gpgcheck /etc/dnf/dnf.conf gpgcheck=1 If "gpgcheck"
        is not set to "1", or if the option is missing or commented out, ask the system administrator how the GPG signatures
        of software packages are being verified. If there is no process to verify GPG signatures that is approved by the organization,
        this is a finding.'
      multi_check: null
      negate: null
