assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271786r1092070_rule
  version: 1
  description: OL 9 library directories must be group-owned by root or a system account.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:68701
    exports: []
    inline_content: 'Verify that OL 9 system-wide shared library directories are group-owned by "root" with the following
      command: $ sudo find /lib /lib64 /usr/lib /usr/lib64 ! -group root -type d -exec stat -c "%n %G" ''{}'' \; If any system-wide
      shared library directory is returned and is not group-owned by a required system account, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
