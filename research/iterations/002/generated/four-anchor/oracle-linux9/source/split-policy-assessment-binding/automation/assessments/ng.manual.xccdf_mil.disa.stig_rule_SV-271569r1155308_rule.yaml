        namespace: http://checklists.nist.gov/xccdf/1.2
        text: "Verify OL 9 uses cryptographic mechanisms to protect the integrity of the audit tools with the following command:\n\
          \n$ sudo cat /etc/aide.conf | grep /usr/sbin/au\n/usr/sbin/auditctl p+i+n+u+g+s+b+acl+xattrs+sha512\n/usr/sbin/auditd\
          \ p+i+n+u+g+s+b+acl+xattrs+sha512\n/usr/sbin/ausearch p+i+n+u+g+s+b+acl+xattrs+sha512\n/usr/sbin/aureport p+i+n+u+g+s+b+acl+xattrs+sha512\n\
          /usr/sbin/autrace p+i+n+u+g+s+b+acl+xattrs+sha512\n/usr/sbin/augenrules p+i+n+u+g+s+b+acl+xattrs+sha512\n \nIf AIDE\
          \ is not installed, ask the system administrator (SA) how file integrity checks are performed on the system.\n\n\
          If any of the audit tools listed above do not have a corresponding line, ask the SA to indicate what cryptographic\
          \ mechanisms are being used to protect the integrity of the audit tools. If there is no evidence of integrity protection,\
          \ this is a finding."
      name: check
      namespace: http://checklists.nist.gov/xccdf/1.2
