        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:3701
      exports: []
      inline_content: 'Verify that OL 9 disables the ability to load the Bluetooth kernel module with the following command:
        $ grep -r bluetooth /etc/modprobe.conf /etc/modprobe.d/* install bluetooth /bin/false blacklist bluetooth If the command
        does not return any output, or the line is commented out, and use of Bluetooth is not documented with the information
        system security officer (ISSO) as an operational requirement, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:3701
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify that OL 9 disables the ability to load the Bluetooth kernel module with the following command:\n\n\
            $ grep -r bluetooth /etc/modprobe.conf /etc/modprobe.d/* \ninstall bluetooth /bin/false\nblacklist bluetooth\n\
            \nIf the command does not return any output, or the line is commented out, and use of Bluetooth is not documented\
            \ with the information system security officer (ISSO) as an operational requirement, this is a finding."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
