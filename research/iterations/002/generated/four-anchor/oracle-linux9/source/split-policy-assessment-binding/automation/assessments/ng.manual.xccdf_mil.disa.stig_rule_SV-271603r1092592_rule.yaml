assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271603r1092592_rule
  version: 1
  description: OL 9 must act when allocated audit record storage volume reaches 95 percent of the repository maximum audit
    record storage capacity.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:33501
    exports: []
    inline_content: 'Verify that OL 9 is configured to take action in the event of allocated audit record storage volume reaches
      95 percent of the repository maximum audit record storage capacity with the following command: $ sudo grep admin_space_left_action
      /etc/audit/auditd.conf admin_space_left_action = single If the value of the "admin_space_left_action" is not set to
      "single", or if the line is commented out, ask the system administrator (SA) to indicate how the system is providing
      real-time alerts to the SA and information system security officer (ISSO). If there is no evidence that real-time alerts
      are configured on the system, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
