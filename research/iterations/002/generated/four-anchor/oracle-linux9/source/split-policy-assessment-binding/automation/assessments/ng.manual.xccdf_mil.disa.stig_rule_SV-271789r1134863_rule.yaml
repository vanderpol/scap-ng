assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271789r1134863_rule
  version: 1
  description: OL 9 library files must be group owned by root or a system account.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:69301
    exports: []
    inline_content: 'Verify that OL 9 systemwide shared library files contained in the directories "/lib", "/lib64", "/usr/lib",
      and "/usr/lib64" are group owned by root with the following command: $ sudo find /lib /lib64 /usr/lib /usr/lib64 -type
      f -name ''*.so*'' ! -group root -exec stat -c "%n %G" {} + If any output is returned, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
