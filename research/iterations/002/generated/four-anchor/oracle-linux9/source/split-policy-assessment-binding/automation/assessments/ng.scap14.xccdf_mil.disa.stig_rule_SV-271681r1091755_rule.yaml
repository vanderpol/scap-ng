          text: "This requirement assumes the use of the OL 9 default graphical user interface—the GNOME desktop environment.\
            \ If the system does not have any graphical user interface installed, this requirement is Not Applicable.\n\n\
            Verify that OL 9 prevents a user from overriding settings for graphical user interfaces. \n\nDetermine which profile\
            \ the system database is using with the following command:\n\n$ grep system-db /etc/dconf/profile/user\nsystem-db:local\n\
            \nCheck that graphical settings are locked from nonprivileged user modification with the following command:\n\n\
            Note: The example below is using the database \"local\" for the system, so the path is \"/etc/dconf/db/local.d\"\
            . This path must be modified if a database other than \"local\" is being used.\n\n$ grep -i lock-enabled /etc/dconf/db/local.d/locks/*\n\
            /org/gnome/desktop/screensaver/lock-enabled\n\nIf the command does not return at least the example result, this\
            \ is a finding."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
