        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify OL 9 is configured to audit the execution of the "umount" command with the following command:


            $ sudo auditctl -l | grep umount

            -a always,exit -F arch=b32 -S umount -F auid>=1000 -F auid!=-1 -F key=privileged-umount


            If the command does not return an audit rule for "umount" or any of the lines returned are commented out, this
