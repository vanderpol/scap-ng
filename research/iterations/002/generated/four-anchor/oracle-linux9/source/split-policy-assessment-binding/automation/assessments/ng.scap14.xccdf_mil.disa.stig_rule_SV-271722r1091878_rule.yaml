        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:56501
      exports: []
      inline_content: 'Verify that OL 9 requires reauthentication when using the "sudo" command to elevate privileges with
        the following command: $ sudo grep -i ''timestamp_timeout'' /etc/sudoers /etc/sudoers.d/* /etc/sudoers:Defaults timestamp_timeout=0
        If results are returned from more than one file location, this is a finding. If "timestamp_timeout" is set to a negative
        number, is commented out, or no results are returned, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
