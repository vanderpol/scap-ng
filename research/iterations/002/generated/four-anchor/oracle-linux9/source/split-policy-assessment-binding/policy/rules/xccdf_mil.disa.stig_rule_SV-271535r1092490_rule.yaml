rule:
  id: xccdf_mil.disa.stig_rule_SV-271535r1092490_rule
  title: OL 9 must audit all uses of the su command.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
