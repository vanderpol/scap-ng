  check: 'Verify that OL 9 is configured to audit the execution of the su command with the following command: $ sudo auditctl
    -l | grep /usr/bin/su -a always,exit -F path=/usr/bin/su -F perm=x -F auid>=1000 -F auid!=unset -k privileged-priv_change
    If the command does not return a line or the line is commented out, this is a finding.'
