        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:69701
      exports: []
      inline_content: 'Verify that OL 9 systemwide shared library files contained in the directories "/lib", "/lib64", "/usr/lib",
        and "/usr/lib64" have mode 0755 or less permissive. Check that the systemwide shared library files have mode 0755
        or less permissive with the following command: $ sudo find /lib /lib64 /usr/lib /usr/lib64 -type f -name ''*.so*''
        -perm /022 -exec stat -c "%n %a" {} + If any output is returned, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
