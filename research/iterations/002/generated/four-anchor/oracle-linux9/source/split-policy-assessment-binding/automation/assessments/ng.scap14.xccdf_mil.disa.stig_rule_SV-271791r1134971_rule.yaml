        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify that OL 9 systemwide shared library files contained in the directories "/lib", "/lib64", "/usr/lib",
            and "/usr/lib64" have mode 0755 or less permissive.


            Check that the systemwide shared library files have mode 0755 or less permissive with the following command:


