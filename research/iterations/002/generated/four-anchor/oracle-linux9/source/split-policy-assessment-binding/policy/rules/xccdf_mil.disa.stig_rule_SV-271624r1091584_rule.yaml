rule:
  id: xccdf_mil.disa.stig_rule_SV-271624r1091584_rule
  title: OL 9 pam_unix.so module must be configured in the password-auth file to use a FIPS 140-3 approved cryptographic hashing
    algorithm for system authentication.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
