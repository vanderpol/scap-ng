      exports: []
      inline_content: 'Verify that OL 9 requires the maximum number of repeating characters of the same character class be
        limited to four when passwords are changed. Verify the value of the "maxclassrepeat" option in "/etc/security/pwquality.conf"
        with the following command: $ grep maxclassrepeat /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
        maxclassrepeat = 4 If the value of "maxclassrepeat" is set to "0", more than "4", or is commented out, this is a finding.'
