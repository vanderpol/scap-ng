assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271443r1092463_rule
  version: 1
  description: OL 9 must be configured to disable the Asynchronous Transfer Mode (ATM) kernel module.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:2501
    exports: []
    inline_content: 'Verify that OL 9 disables the ability to load the ATM kernel module with the following command: $ grep
      -r atm /etc/modprobe.conf /etc/modprobe.d/* install atm /bin/false blacklist atm If the command does not return any
      output, or the line is commented out, and use of ATM is not documented with the information system security officer
      (ISSO) as an operational requirement, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
