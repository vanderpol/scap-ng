        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:23701
      exports: []
      inline_content: 'Verify that OL 9 is configured to audit successful/unsuccessful attempts to use the truncate, ftruncate,
        creat, open, openat, and open_by_handle_at system calls with the following command: $ sudo auditctl -l | grep ''open\|truncate\|creat''
        -a always,exit -F arch=b32 -S truncate,ftruncate,creat,open,openat,open_by_handle_at -F exit=-EPERM -F auid>=1000
        -F auid!=unset -k perm_access -a always,exit -F arch=b64 -S truncate,ftruncate,creat,open,openat,open_by_handle_at
        -F exit=-EPERM -F auid>=1000 -F auid!=unset -k perm_access -a always,exit -F arch=b32 -S truncate,ftruncate,creat,open,openat,open_by_handle_at
        -F exit=-EACCES -F auid>=1000 -F auid!=unset -k perm_access -a always,exit -F arch=b64 -S truncate,ftruncate,creat,open,openat,open_by_handle_at
        -F exit=-EACCES -F auid>=1000 -F auid!=unset -k perm_access If the output does not produce rules containing "-F exit=-EPERM",
        this is a finding. If the output does not produce rules containing "-F exit=-EACCES", this is a finding. If the command
        does not return an audit rule for truncate, ftruncate, creat, open, openat, and open_by_handle_at or any of the lines
        returned are commented out, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:23701
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify that OL 9 is configured to audit successful/unsuccessful attempts to use the truncate, ftruncate,\
            \ creat, open, openat, and open_by_handle_at system calls with the following command:\n\n$ sudo auditctl -l |\
            \ grep 'open\\|truncate\\|creat' \n-a always,exit -F arch=b32 -S truncate,ftruncate,creat,open,openat,open_by_handle_at\
            \ -F exit=-EPERM -F auid>=1000 -F auid!=unset -k perm_access\n-a always,exit -F arch=b64 -S truncate,ftruncate,creat,open,openat,open_by_handle_at\
            \ -F exit=-EPERM -F auid>=1000 -F auid!=unset -k perm_access\n\n-a always,exit -F arch=b32 -S truncate,ftruncate,creat,open,openat,open_by_handle_at\
            \ -F exit=-EACCES -F auid>=1000 -F auid!=unset -k perm_access\n-a always,exit -F arch=b64 -S truncate,ftruncate,creat,open,openat,open_by_handle_at\
            \ -F exit=-EACCES -F auid>=1000 -F auid!=unset -k perm_access\n\nIf the output does not produce rules containing\
            \ \"-F exit=-EPERM\", this is a finding.\n\nIf the output does not produce rules containing \"-F exit=-EACCES\"\
            , this is a finding.\n\nIf the command does not return an audit rule for truncate, ftruncate, creat, open, openat,\
            \ and open_by_handle_at or any of the lines returned are commented out, this is a finding."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
