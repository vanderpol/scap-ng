assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271601r1091515_rule
  version: 1
  description: OL 9 must take action when allocated audit record storage volume reaches 95 percent of the audit record storage
    capacity.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:33101
    exports: []
    inline_content: 'Verify that OL 9 takes action when allocated audit record storage volume reaches 95 percent of the repository
      maximum audit record storage capacity with the following command: $ sudo grep -w admin_space_left /etc/audit/auditd.conf
      admin_space_left = 5% If the value of the "admin_space_left" keyword is not set to 5 percent of the storage volume allocated
      to audit logs, or if the line is commented out, ask the system administrator (SA) to indicate how the system is taking
      action if the allocated storage is about to reach capacity. If the "space_left" value is not configured to the correct
      value, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
