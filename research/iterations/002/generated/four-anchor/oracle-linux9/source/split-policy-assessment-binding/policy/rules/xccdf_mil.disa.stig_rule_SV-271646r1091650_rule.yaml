rule:
  id: xccdf_mil.disa.stig_rule_SV-271646r1091650_rule
  title: OL 9 must prevent files with the setuid and setgid bit set from being executed on file systems that are used with
    removable media.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
