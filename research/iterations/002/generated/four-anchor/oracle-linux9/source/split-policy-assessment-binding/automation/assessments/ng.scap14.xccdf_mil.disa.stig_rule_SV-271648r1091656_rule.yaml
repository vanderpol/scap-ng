      exports: []
      inline_content: 'Verify that OL 9 is configured to mount /boot with the nosuid option. Verify that the /boot directory
        is mounted with the "nosuid" option with the following command: $ mount | grep ''\s/boot\s'' /dev/sda1 on /boot type
