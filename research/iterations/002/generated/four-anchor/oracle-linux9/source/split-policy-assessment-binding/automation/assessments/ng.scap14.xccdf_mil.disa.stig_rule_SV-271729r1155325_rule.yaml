          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "A core dump includes a memory image taken at the time the operating system terminates an application. The\
              \ memory image could contain sensitive data and is generally useful only for developers or system operators\
              \ trying to debug problems.\n\n\tEnabling core dumps on production systems is not recommended; however, there\
              \ may be overriding operational requirements to enable advanced debugging. Permitting temporary enablement of\
              \ core dumps during such situations must be reviewed through local needs and policy."
