assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271856r1092280_rule
  version: 1
  description: OL 9 must encrypt via the gtls driver the transfer of audit records offloaded onto a different system or media
    from the system being audited via rsyslog.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:82701
    exports: []
    inline_content: 'Verify that OL 9 uses the gtls driver to encrypt audit records offloaded onto a different system or media
      from the system being audited with the following command: $ grep -i ''$DefaultNetstreamDriver'' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
      /etc/rsyslog.conf:$DefaultNetstreamDriver gtls If the value of the "$DefaultNetstreamDriver" option is not set to "gtls"
      or the line is commented out, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
