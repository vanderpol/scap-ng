assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271577r1091443_rule
  version: 1
  description: OL 9 must enable auditing of processes that start prior to the audit daemon.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:28301
    exports: []
    inline_content: 'Verify that OL 9 is configured to enable auditing of processes that start prior to the audit daemon.
      Check that the current GRUB 2 configuration enables auditing: $ sudo grubby --info=ALL | grep audit args="ro crashkernel=auto
      resume=/dev/mapper/ol-swap rd.lvm.lv=ol/root rd.lvm.lv=ol/swap rhgb quiet fips=1 audit=1 audit_backlog_limit=8192 pti=on
      If "audit" is not set to "1" or is missing, this is a finding. Check that auditing is enabled by default to persist
      through kernel updates: $ sudo grep audit /etc/default/grub GRUB_CMDLINE_LINUX="audit=1" If "audit" is not set to "1",
      is missing, or is commented out, this is a finding.'
