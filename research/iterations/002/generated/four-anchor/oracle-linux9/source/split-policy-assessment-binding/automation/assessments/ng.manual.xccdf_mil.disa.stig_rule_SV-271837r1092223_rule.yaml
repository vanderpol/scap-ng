  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271837r1092223_rule
  version: 1
  description: OL 9 must configure the use of the pam_faillock.so module in the /etc/pam.d/system-auth file.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:78901
    exports: []
    inline_content: 'Verify that OL 9 configures the pam_faillock.so module to exist in the "/etc/pam.d/system-auth" file
      with the following command: $ grep pam_faillock.so /etc/pam.d/system-auth auth required pam_faillock.so preauth auth
      required pam_faillock.so authfail account required pam_faillock.so If the pam_faillock.so module is not present in the
      "/etc/pam.d/system-auth" file with the "preauth" line listed before pam_unix.so, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
