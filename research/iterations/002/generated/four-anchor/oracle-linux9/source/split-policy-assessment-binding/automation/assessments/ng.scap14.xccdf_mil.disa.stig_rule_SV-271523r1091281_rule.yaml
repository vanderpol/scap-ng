        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:17501
      exports: []
      inline_content: 'Verify that OL 9 dnf package manager always checks the GPG signature of locally installed software
        packages before installation: $ grep localpkg_gpgcheck /etc/dnf/dnf.conf localpkg_gpgcheck=1 If "localpkg_gpgcheck"
        is not set to "1", or if the option is missing or commented out, ask the system administrator how the GPG signatures
        of local software packages are being verified. If there is no process to verify GPG signatures that is approved by
        the organization, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:17501
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify that OL 9 dnf package manager always checks the GPG signature of locally installed software packages\
            \ before installation:\n\n$ grep localpkg_gpgcheck /etc/dnf/dnf.conf \nlocalpkg_gpgcheck=1 \n\nIf \"localpkg_gpgcheck\"\
            \ is not set to \"1\", or if the option is missing or commented out, ask the system administrator how the GPG\
            \ signatures of local software packages are being verified.\n\nIf there is no process to verify GPG signatures\
            \ that is approved by the organization, this is a finding."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
