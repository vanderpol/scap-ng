rule:
  id: xccdf_mil.disa.stig_rule_SV-271779r1137695_rule
  title: OL 9 must be configured so that a sticky bit must be set on all public directories.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
