  fix: 'Configure all world-writable directories to have the sticky bit set to prevent unauthorized and unintended information
    transferred via shared system resources. Set the sticky bit on all world-writable directories using the command, replace
    "[World-Writable Directory]" with any directory path missing the sticky bit: $ sudo chmod a+t [World-Writable Directory]'
