        text: "Verify that OL 9 is configured to audit successful/unsuccessful attempts to use the truncate, ftruncate, creat,\
          \ open, openat, and open_by_handle_at system calls with the following command:\n\n$ sudo auditctl -l | grep 'open\\\
          |truncate\\|creat' \n-a always,exit -F arch=b32 -S truncate,ftruncate,creat,open,openat,open_by_handle_at -F exit=-EPERM\
          \ -F auid>=1000 -F auid!=unset -k perm_access\n-a always,exit -F arch=b64 -S truncate,ftruncate,creat,open,openat,open_by_handle_at\
          \ -F exit=-EPERM -F auid>=1000 -F auid!=unset -k perm_access\n\n-a always,exit -F arch=b32 -S truncate,ftruncate,creat,open,openat,open_by_handle_at\
          \ -F exit=-EACCES -F auid>=1000 -F auid!=unset -k perm_access\n-a always,exit -F arch=b64 -S truncate,ftruncate,creat,open,openat,open_by_handle_at\
          \ -F exit=-EACCES -F auid>=1000 -F auid!=unset -k perm_access\n\nIf the output does not produce rules containing\
          \ \"-F exit=-EPERM\", this is a finding.\n\nIf the output does not produce rules containing \"-F exit=-EACCES\"\
          , this is a finding.\n\nIf the command does not return an audit rule for truncate, ftruncate, creat, open, openat,\
          \ and open_by_handle_at or any of the lines returned are commented out, this is a finding."
