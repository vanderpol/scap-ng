assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271562r1092544_rule
  version: 1
  description: OL 9 must audit all uses of the usermod command.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:25301
    exports: []
    inline_content: 'Verify that OL 9 is configured to audit the execution of the usermod command with the following command:
      $ sudo auditctl -l | grep usermod -a always,exit -F path=/usr/sbin/usermod -F perm=x -F auid>=1000 -F auid!=unset -k
      privileged-usermod If the command does not return a line or the line is commented out, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
