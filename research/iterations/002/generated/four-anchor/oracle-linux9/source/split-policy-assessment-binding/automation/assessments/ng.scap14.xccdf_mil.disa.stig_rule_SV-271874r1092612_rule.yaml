          text: "Verify that OL 9 limits the number of bogus ICMP response errors logs.\n\nThe runtime status of the net.ipv4.icmp_ignore_bogus_error_responses\
            \ kernel parameter can be queried by running the following command:\n\n$ sysctl net.ipv4.icmp_ignore_bogus_error_responses\
