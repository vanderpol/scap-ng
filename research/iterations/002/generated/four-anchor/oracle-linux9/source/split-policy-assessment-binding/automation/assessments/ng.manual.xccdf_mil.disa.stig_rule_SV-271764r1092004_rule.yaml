          \                                       5.2-38.el9                                       @ol9_appstream\n\nNote:\
          \ If a TFTP server is not installed, this requirement is Not Applicable.\n\nIf a TFTP server is installed, check\
          \ for the server arguments with the following command: \n\n$ systemctl cat tftp | grep ExecStart\nExecStart=/usr/sbin/in.tftpd\
          \ -s /var/lib/tftpboot\n\nIf the \"ExecStart\" line does not have a \"-s\" option, and a subdirectory is not assigned,\
          \ this is a finding."
      name: check
