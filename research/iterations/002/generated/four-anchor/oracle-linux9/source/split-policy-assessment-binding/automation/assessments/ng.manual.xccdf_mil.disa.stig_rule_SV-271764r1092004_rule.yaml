      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:64701
    exports: []
    inline_content: 'Verify that OL 9 TFTP daemon is configured to operate in secure mode. Check if a TFTP server is installed
      with the following command: $ sudo dnf list --installed tftp-server Installed Packages tftp-server.x86_64 5.2-38.el9
      @ol9_appstream Note: If a TFTP server is not installed, this requirement is Not Applicable. If a TFTP server is installed,
      check for the server arguments with the following command: $ systemctl cat tftp | grep ExecStart ExecStart=/usr/sbin/in.tftpd
      -s /var/lib/tftpboot If the "ExecStart" line does not have a "-s" option, and a subdirectory is not assigned, this is
      a finding.'
