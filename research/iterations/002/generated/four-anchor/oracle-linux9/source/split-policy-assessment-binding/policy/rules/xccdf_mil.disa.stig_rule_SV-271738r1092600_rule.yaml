  check: 'Verify that OL 9 clears the page allocator to prevent use-after-free attacks. Verify that GRUB 2 is configured to
    enable page poisoning to mitigate use-after-free vulnerabilities. Check that the current GRUB 2 configuration has page
    poisoning enabled with the following command: $ sudo grubby --info=ALL | grep args | grep -v ''page_poison=1'' If any
    output is returned, this is a finding. Check that page poisoning is enabled by default to persist in kernel updates with
    the following command: $ grep page_poison /etc/default/grub GRUB_CMDLINE_LINUX="page_poison=1" If "page_poison" is not
    set to "1", is missing or commented out, this is a finding.'
