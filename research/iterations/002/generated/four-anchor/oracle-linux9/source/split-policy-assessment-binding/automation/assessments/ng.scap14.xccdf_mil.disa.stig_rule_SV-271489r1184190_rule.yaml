        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:11101
      exports: []
      inline_content: 'Verify OL 9 is configured so that the SSH client uses only ciphers employing FIPS 140-3 approved algorithms.
        To verify the ciphers in the systemwide SSH configuration file, use the following command: $ grep -i Ciphers /etc/crypto-policies/back-ends/openssh.config
        Ciphers aes256-gcm@openssh.com,aes256-ctr,aes128-gcm@openssh.com,aes128-ctr If the cipher entries in the "openssh.config"
        file have any ciphers other than "aes256-gcm@openssh.com,aes256-ctr,aes128-gcm@openssh.com,aes128-ctr", or they are
        missing or commented out, this is a finding.'
      multi_check: null
