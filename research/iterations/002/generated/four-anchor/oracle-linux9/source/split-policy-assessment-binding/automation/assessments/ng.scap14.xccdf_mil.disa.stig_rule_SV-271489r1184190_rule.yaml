          text: "Verify OL 9 is configured so that the SSH client uses only ciphers employing FIPS 140-3 approved algorithms.\n\
            \nTo verify the ciphers in the systemwide SSH configuration file, use the following command:\n\n$ grep -i Ciphers\
            \ /etc/crypto-policies/back-ends/openssh.config \nCiphers aes256-gcm@openssh.com,aes256-ctr,aes128-gcm@openssh.com,aes128-ctr\n\
            \nIf the cipher entries in the \"openssh.config\" file have any ciphers other than \"aes256-gcm@openssh.com,aes256-ctr,aes128-gcm@openssh.com,aes128-ctr\"\
            , or they are missing or commented out, this is a finding."
