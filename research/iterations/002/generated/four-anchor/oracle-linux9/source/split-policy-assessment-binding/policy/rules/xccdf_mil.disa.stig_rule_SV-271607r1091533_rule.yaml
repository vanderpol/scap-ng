  check: 'Verify that OL 9 has smart cards enabled in System Security Services Daemon (SSSD) if smart cards are used for MFA
    with the following command: $ sudo grep pam_cert_auth /etc/sssd/sssd.conf pam_cert_auth = True If "pam_cert_auth" is not
    set to "True", the line is commented out, or the line is missing, this is a finding.'
