  description: '<VulnDiscussion>A session time-out lock is a temporary action taken when a user stops work and moves away
    from the immediate physical vicinity of the information system but does not log out because of the temporary nature of
    the absence. Rather than relying on the user to manually lock their operating system session prior to vacating the vicinity,
    operating systems need to be able to identify when a user''s session has idled and take action to initiate the session
    lock. The session lock is implemented at the point where session activity can be determined and/or controlled. Implementing
    session settings will have little value if a user is able to manipulate these settings from the defaults prescribed in
    the other requirements of this implementation guide. Satisfies: SRG-OS-000028-GPOS-00009, SRG-OS-000030-GPOS-00011</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
