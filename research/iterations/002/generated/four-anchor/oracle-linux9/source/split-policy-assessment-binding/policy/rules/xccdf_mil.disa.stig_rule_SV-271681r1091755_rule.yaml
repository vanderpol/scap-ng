rule:
  id: xccdf_mil.disa.stig_rule_SV-271681r1091755_rule
  title: OL 9 must prevent a user from overriding the screensaver lock-enabled setting for the graphical user interface.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
