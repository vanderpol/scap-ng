          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify that OL 9 takes the appropriate action when the audit storage volume is full. \n\nCheck that OL 9\
            \ takes the appropriate action when the audit storage volume is full with the following command:\n\n$ sudo grep\
            \ disk_full_action /etc/audit/auditd.conf\ndisk_full_action = HALT\n\nIf the value of the \"disk_full_action\"\
            \ option is not \"SYSLOG\", \"SINGLE\", or \"HALT\", or the line is commented out, ask the system administrator\
            \ (SA) to indicate how the system takes appropriate action when an audit storage volume is full. If there is no\
            \ evidence of appropriate action, this is a finding."
