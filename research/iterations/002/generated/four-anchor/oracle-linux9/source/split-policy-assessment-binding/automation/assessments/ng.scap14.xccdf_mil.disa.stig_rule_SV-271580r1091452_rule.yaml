        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:28901
      exports: []
      inline_content: 'Verify that OL 9 takes the appropriate action when the audit storage volume is full. Check that OL
        9 takes the appropriate action when the audit storage volume is full with the following command: $ sudo grep disk_full_action
        /etc/audit/auditd.conf disk_full_action = HALT If the value of the "disk_full_action" option is not "SYSLOG", "SINGLE",
        or "HALT", or the line is commented out, ask the system administrator (SA) to indicate how the system takes appropriate
        action when an audit storage volume is full. If there is no evidence of appropriate action, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
