  version: 1
  description: OL 9 must ensure the password complexity module is enabled in the password-auth file.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:35701
    exports: []
    inline_content: 'Verify that OL 9 uses "pwquality" to enforce the password complexity rules in the password-auth file
      with the following command: $ grep pam_pwquality /etc/pam.d/password-auth | grep pam_pwquality password required pam_pwquality.so
      If the command does not return a line containing the value "pam_pwquality.so", or the line is commented out, this is
      a finding.'
