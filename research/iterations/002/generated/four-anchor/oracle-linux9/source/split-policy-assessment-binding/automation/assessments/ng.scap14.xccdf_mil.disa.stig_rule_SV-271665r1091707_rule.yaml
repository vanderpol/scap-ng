        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:45701
      exports: []
      inline_content: 'Verify that OL 9 is configured to mount /var/tmp with the nosuid option. Verify "/var/tmp" is mounted
        with the "nosuid" option: $ mount | grep /var/tmp /dev/mapper/ol-var-tmp on /var/tmp type xfs (rw,nodev,nosuid,noexec,seclabel)
        If the "/var/tmp" file system is mounted without the "nosuid" option, this is a finding.'
      multi_check: null
      negate: null
