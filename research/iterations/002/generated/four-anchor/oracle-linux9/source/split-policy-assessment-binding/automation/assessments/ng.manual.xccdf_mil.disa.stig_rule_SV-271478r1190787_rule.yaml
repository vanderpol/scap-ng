          \nVerify the current minimum crypto-policy configuration with the following commands:\n \n$ grep -E 'rsa_size|hash'\
          \ /etc/crypto-policies/state/CURRENT.pol\nhash = SHA2-256 SHA2-384 SHA2-512 SHA2-224 SHA3-256 SHA3-384 SHA3-512\
          \ SHAKE-256\nmin_rsa_size = 2048\n \nIf the \"hash\" values do not include at least the following FIPS 140-3-compliant\
          \ algorithms, \"SHA2-256 SHA2-384 SHA2-512 SHA2-224 SHA3-256 SHA3-384 SHA3-512 SHAKE-256\", this is a finding.\n\
          \nIf there are algorithms that include \"SHA1\" or a hash value less than \"256\", this is a finding.\n\nIf the\
          \ \"min_rsa_size\" is not set to a value of at least 2048, this is a finding.\n \nIf these commands do not return\
