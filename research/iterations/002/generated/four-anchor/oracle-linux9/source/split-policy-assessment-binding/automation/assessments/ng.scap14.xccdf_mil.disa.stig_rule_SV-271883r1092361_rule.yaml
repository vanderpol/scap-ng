          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "Source-routed packets allow the source of the packet to suggest that routers forward the packet along a\
              \ different path than configured on the router, which can be used to bypass network security measures. This\
              \ requirement applies only to the forwarding of source-routed traffic, such as when forwarding is enabled and\
              \ the system is functioning as a router.\n\n\tAccepting source-routed packets in the IPv6 protocol has few legitimate\
              \ uses. It must be disabled unless it is absolutely required."
