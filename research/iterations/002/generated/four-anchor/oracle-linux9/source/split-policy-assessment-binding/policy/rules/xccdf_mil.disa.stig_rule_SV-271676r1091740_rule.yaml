  check: 'This requirement assumes the use of the OL 9 default graphical user interface—the GNOME desktop environment. If
    the system does not have any graphical user interface installed, this requirement is Not Applicable. Verify that OL 9
    configures the screensaver to be blank with the following command: $ gsettings get org.gnome.desktop.screensaver picture-uri
    If properly configured, the output should be "''''". To ensure that users cannot set the screensaver background, run the
    following: $ grep picture-uri /etc/dconf/db/local.d/locks/* If properly configured, the output should be "/org/gnome/desktop/screensaver/picture-uri".
    If it is not set or configured properly, this is a finding.'
