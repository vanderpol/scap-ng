  fix: 'Configure OL 9 to conceal, via the session lock, information previously visible on the display with a publicly viewable
    image. The dconf settings can be edited in the /etc/dconf/db/* location. Add or update the [org/gnome/desktop/screensaver]
    section of the "/etc/dconf/db/local.d/00-security-settings" database file and add or update the following lines: [org/gnome/desktop/screensaver]
    picture-uri='''' Add the following line to "/etc/dconf/db/local.d/locks/00-security-settings-lock" to prevent user modification:
    /org/gnome/desktop/screensaver/picture-uri Update the dconf system databases: $ sudo dconf update'
