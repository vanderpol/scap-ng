  description: <VulnDiscussion>Untrusted certificate authorities (CA) can issue certificates, but they may be issued by organizations
    or individuals that seek to compromise DOD systems or by organizations with insufficient security controls. If the CA
    used for verifying the certificate is not a DOD-approved CA, trust of this CA has not been established. The DOD will only
    accept PKI-certificates obtained from a DOD-approved internal or external certificate authority. Reliance on CAs for the
    establishment of secure sessions includes, for example, the use of SSL/TLS certificates.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
