rule:
  id: xccdf_mil.disa.stig_rule_SV-271901r1092415_rule
  title: OL 9 must only allow the use of DOD PKI-established certificate authorities for authentication in the establishment
    of protected sessions to OL 9.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
