rule:
  id: xccdf_mil.disa.stig_rule_SV-271690r1092634_rule
  title: OL 9 must be able to directly initiate a session lock for all connection types using smart card when the smart card
    is removed.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
