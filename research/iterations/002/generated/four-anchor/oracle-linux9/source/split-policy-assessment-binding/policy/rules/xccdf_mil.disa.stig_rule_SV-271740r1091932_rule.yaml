  check: 'Verify that OL 9 is configured to enable DAC on hardlinks. Check the status of the fs.protected_hardlinks kernel
    parameter with the following command: $ sudo sysctl fs.protected_hardlinks fs.protected_hardlinks = 1 If "fs.protected_hardlinks"
    is not set to "1" or is missing, this is a finding.'
