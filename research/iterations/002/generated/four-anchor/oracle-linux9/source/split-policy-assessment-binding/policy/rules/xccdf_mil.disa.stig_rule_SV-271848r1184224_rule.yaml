rule:
  id: xccdf_mil.disa.stig_rule_SV-271848r1184224_rule
  title: OL 9 must set the umask value to 077 for all local interactive user accounts.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
