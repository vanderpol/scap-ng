  check: 'Verify OL 9 configures the default umask for all local interactive users to be "077". Identify the locations of
    all local interactive user home directories by looking at the "/etc/passwd" file. Check all local interactive user initialization
    files for interactive users with the following command: Note: The example is for a system that is configured to create
    users home directories in the "/home" directory. $ grep -ri umask /home/ /home/disauser/.bash_history:grep -i umask /etc/bashrc
    /etc/csh.cshrc /etc/profile /home/disauser/.bash_history:grep -i umask /etc/login.defs If any local interactive user initialization
    files are found to have a umask statement that sets a value less restrictive than "077", this is a finding.'
