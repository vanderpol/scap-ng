  fix: Remove the umask statement from all local interactive user's initialization files. If the account is for an application,
    the requirement for a umask less restrictive than "077" can be documented with the information system security officer,
    but the user agreement for access to the account must specify that the local interactive user must log on to their account
    first and then switch the user to the application account with the correct option to gain the account's environment variables.
