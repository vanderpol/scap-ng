  fix: 'Configure OL 9 to enable kernel page-table isolation with the following command: $ sudo grubby --update-kernel=ALL
    --args="pti=on" Add or modify the following line in "/etc/default/grub" to ensure the configuration survives kernel updates:
    GRUB_CMDLINE_LINUX="pti=on"'
