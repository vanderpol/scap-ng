assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271845r1092247_rule
  version: 1
  description: OL 9 system accounts must not have an interactive login shell.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:80501
    exports: []
    inline_content: 'Verify that OL 9 configures system accounts to not have an interactive login shell with the following
      command: $ awk -F: ''($3<1000){print $1 ":" $3 ":" $7}'' /etc/passwd root:0:/bin/bash bin:1:/sbin/nologin daemon:2:/sbin/nologin
      adm:3:/sbin/nologin lp:4:/sbin/nologin Identify the system accounts from this listing that do not have a nologin shell.
      If any system account (other than the root account) has a login shell and it is not documented with the information
      system security officer (ISSO), this is a finding.'
    multi_check: null
    negate: null
    selector: manual
