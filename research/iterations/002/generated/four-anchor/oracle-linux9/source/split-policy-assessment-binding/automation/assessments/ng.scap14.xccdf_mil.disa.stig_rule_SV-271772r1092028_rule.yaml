        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:65901
      exports: []
      inline_content: 'Verify that OL 9 SSH public host key files have a mode of "0644" or less permissive with the following
        command: Note: SSH public key files may be found in other directories on the system depending on the installation.
        $ sudo stat -c "%a %n" /etc/ssh/*.pub 644 /etc/ssh/ssh_host_dsa_key.pub 644 /etc/ssh/ssh_host_ecdsa_key.pub 644 /etc/ssh/ssh_host_ed25519_key.pub
        644 /etc/ssh/ssh_host_rsa_key.pub If any key.pub file has a mode more permissive than "0644", this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:65901
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify that OL 9 SSH public host key files have a mode of "0644" or less permissive with the following command:


            Note: SSH public key files may be found in other directories on the system depending on the installation.


            $ sudo stat -c "%a %n" /etc/ssh/*.pub

            644 /etc/ssh/ssh_host_dsa_key.pub

            644 /etc/ssh/ssh_host_ecdsa_key.pub

            644 /etc/ssh/ssh_host_ed25519_key.pub

            644 /etc/ssh/ssh_host_rsa_key.pub


            If any key.pub file has a mode more permissive than "0644", this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
