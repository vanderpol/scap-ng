        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:67301
      exports: []
      inline_content: 'Verify that OL 9 world-writable directories have the sticky bit set. Determine if all world-writable
        directories have the sticky bit set by running the following command: $ sudo find / -type d \( -perm -0002 -a ! -perm
        -1000 \) -print 2>/dev/null drwxrwxrwt 7 root root 4096 Jul 26 11:19 /tmp If any of the returned directories are world-writable
        and do not have the sticky bit set, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
