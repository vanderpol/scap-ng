      exports: []
      inline_content: 'Verify that OL 9 system commands contained in the following directories have mode "755" or less permissive
        with the following command: $ sudo find -L /bin /sbin /usr/bin /usr/sbin /usr/libexec /usr/local/bin /usr/local/sbin
        -perm /022 -exec ls -l {} \; If any system commands are found to be group-writable or world-writable, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
