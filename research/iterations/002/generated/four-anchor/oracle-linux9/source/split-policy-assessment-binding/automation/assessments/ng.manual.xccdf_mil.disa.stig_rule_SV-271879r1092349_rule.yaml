assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271879r1092349_rule
  version: 1
  description: OL 9 must not forward IPv6 source-routed packets.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:87301
    exports: []
    inline_content: 'Note: If IPv6 is disabled on the system, this requirement is Not Applicable. Verify that OL 9 does not
      accept IPv6 source-routed packets. Check the value of the accept source route variable with the following command: $
      sysctl net.ipv6.conf.all.accept_source_route net.ipv6.conf.all.accept_source_route = 0 If the returned line does not
      have a value of "0", a line is not returned, or the line is commented out, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
