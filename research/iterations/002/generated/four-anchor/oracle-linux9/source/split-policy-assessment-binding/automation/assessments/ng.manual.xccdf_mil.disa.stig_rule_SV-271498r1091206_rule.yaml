          \nIf the \"sha512\" rule is not being used on all uncommented selection lines in the \"/etc/aide.conf\" file, or\
          \ another file integrity tool is not using FIPS 140-3-approved cryptographic hashes for validating file contents\
          \ and directories, this is a finding."
      name: check
      namespace: http://checklists.nist.gov/xccdf/1.2
