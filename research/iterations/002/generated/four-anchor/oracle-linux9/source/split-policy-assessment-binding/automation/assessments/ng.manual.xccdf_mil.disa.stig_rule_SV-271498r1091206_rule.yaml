      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:12701
    exports: []
    inline_content: 'Verify that OL 9 uses a file integrity tool that is configured to use FIPS 140-3-approved cryptographic
      hashes for validating file contents and directories. Verify that AIDE is configured to use FIPS 140-3 file hashing with
      the following command: $ sudo grep sha512 /etc/aide.conf All=p+i+n+u+g+s+m+S+sha512+acl+xattrs+selinux If the "sha512"
      rule is not being used on all uncommented selection lines in the "/etc/aide.conf" file, or another file integrity tool
      is not using FIPS 140-3-approved cryptographic hashes for validating file contents and directories, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
