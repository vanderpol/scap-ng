assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271674r1208729_rule
  version: 1
  description: OL 9 must automatically lock graphical user sessions after 10 minutes of inactivity.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:47501
    exports: []
    inline_content: 'This requirement assumes the use of the OL 9 default graphical user interface—the GNOME desktop environment.
      If the system does not have any graphical user interface installed, this requirement is Not Applicable. Verify OL 9
      initiates a session lock after a 10-minute period of inactivity for graphical user interfaces with the following command:
      $ gsettings get org.gnome.desktop.session idle-delay uint32 600 If "idle-delay" is set to "0" or a value greater than
      "600", this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
      children:
