        name: check-content-ref
        namespace: http://checklists.nist.gov/xccdf/1.2
      - name: check-content
        namespace: http://checklists.nist.gov/xccdf/1.2
        text: 'This requirement assumes the use of the OL 9 default graphical user interface—the GNOME desktop environment.
          If the system does not have any graphical user interface installed, this requirement is Not Applicable.


          Verify OL 9 initiates a session lock after a 10-minute period of inactivity for graphical user interfaces with the
          following command:


          $ gsettings get org.gnome.desktop.session idle-delay

          uint32 600


          If "idle-delay" is set to "0" or a value greater than "600", this is a finding.'
      name: check
      namespace: http://checklists.nist.gov/xccdf/1.2
    system: http://scap.nist.gov/schema/ocil/2
