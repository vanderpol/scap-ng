  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271618r1091566_rule
  version: 1
  description: OL 9 must require the maximum number of repeating characters of the same character class be limited to four
    when passwords are changed.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:36501
    exports: []
    inline_content: 'Verify that OL 9 requires the maximum number of repeating characters of the same character class be limited
      to four when passwords are changed. Verify the value of the "maxclassrepeat" option in "/etc/security/pwquality.conf"
      with the following command: $ grep maxclassrepeat /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
      maxclassrepeat = 4 If the value of "maxclassrepeat" is set to "0", more than "4", or is commented out, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
