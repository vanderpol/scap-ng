  check: 'This requirement assumes the use of the OL 9 default graphical user interface—the GNOME desktop environment. If
    the system does not have any graphical user interface installed, this requirement is Not Applicable. Verify that OL 9
    prevents a user from overriding the disable-restart-buttons setting for graphical user interfaces. Determine which profile
    the system database is using with the following command: $ grep system-db /etc/dconf/profile/user system-db:local Check
    that graphical settings are locked from nonprivileged user modification with the following command: Note: The example
    below is using the database "local" for the system, so the path is "/etc/dconf/db/local.d". This path must be modified
    if a database other than "local" is being used. $ grep disable-restart-buttons /etc/dconf/db/local.d/locks/* /org/gnome/login-screen/disable-restart-buttons
    If the command does not return at least the example result, this is a finding.'
