  group_path:
  - xccdf_mil.disa.stig_group_V-271438
  description: '<VulnDiscussion>An operating system release is considered "supported" if the vendor continues to provide security
    patches for the product. With an unsupported release, it will not be possible to resolve security issues discovered in
    the system software. End Of Life dates for Oracle Linux 9 releases are as follows: Current end of Premier Support for
    Oracle Linux 9 is June 2032. Current end of Extended Support for Oracle Linux 9 is June 2035. Each minor version reaches
    end of life when the new version is released.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
