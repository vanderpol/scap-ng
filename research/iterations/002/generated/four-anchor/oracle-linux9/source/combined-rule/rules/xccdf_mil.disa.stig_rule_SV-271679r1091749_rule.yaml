          - name: check-content
            namespace: http://checklists.nist.gov/xccdf/1.2
            text: "This requirement assumes the use of the OL 9 default graphical user interface—the GNOME desktop environment.\
              \ If the system does not have any graphical user interface installed, this requirement is Not Applicable.\n\n\
              Verify that OL 9 disables ability of the user to override the graphical user interface autorun setting.\n\n\
              Determine which profile the system database is using with the following command:\n\n$ grep system-db /etc/dconf/profile/user\n\
              system-db:local\n\nCheck that the automount setting is locked from nonprivileged user modification with the\
              \ following command:\n\nNote: The example below is using the database \"local\" for the system, so the path\
              \ is \"/etc/dconf/db/local.d\". This path must be modified if a database other than \"local\" is being used.\n\
              \n$ grep 'autorun-never' /etc/dconf/db/local.d/locks/* \n/org/gnome/desktop/media-handling/autorun-never\n\n\
              If the command does not return at least the example result, this is a finding."
          name: check
          namespace: http://checklists.nist.gov/xccdf/1.2
        system: http://scap.nist.gov/schema/ocil/2
