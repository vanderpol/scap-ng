  description: <VulnDiscussion>Any password, no matter how complex, can eventually be cracked; therefore, passwords need to
    be changed periodically. If OL 9 does not limit the lifetime of passwords and force users to change their passwords, there
    is the risk that OL 9 passwords could be compromised.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
