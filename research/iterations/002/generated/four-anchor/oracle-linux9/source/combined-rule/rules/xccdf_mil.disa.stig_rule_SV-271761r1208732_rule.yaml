  fix: 'Configure OL 9 to implement ASLR to protect its memory from unauthorized code execution. Add the configuration item
    with the following command: $ echo ''kernel.randomize_va_space = 2'' | sudo tee /etc/sysctl.d/99-kernel_randomize_va_space.conf
    Remove any configurations that conflict with the above from the following locations: /run/sysctl.d/*.conf /usr/local/lib/sysctl.d/*.conf
    /usr/lib/sysctl.d/*.conf /lib/sysctl.d/*.conf /etc/sysctl.conf /etc/sysctl.d/*.conf Reload settings from all system configuration
    files with the following command: $ sudo sysctl --system'
