  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-271844
  description: <VulnDiscussion>If a local interactive user has a home directory defined that does not exist, the user may
    be given access to the / directory as the current working directory upon logon. This could create a denial of service
    because the user would not be able to access their logon configuration files, and it may give them visibility to system
    files they normally would not be able to access.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
