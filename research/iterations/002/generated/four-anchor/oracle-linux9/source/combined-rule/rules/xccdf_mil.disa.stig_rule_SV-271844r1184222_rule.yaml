rule:
  id: xccdf_mil.disa.stig_rule_SV-271844r1184222_rule
  title: OL 9 local interactive user home directories defined in the /etc/passwd file must exist.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
