rule:
  id: xccdf_mil.disa.stig_rule_SV-271578r1092572_rule
  title: OL 9 must label all offloaded audit logs before sending them to the central log server.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-271578
  description: '<VulnDiscussion>Enriched logging is needed to determine who, what, and when events occur on a system. Without
    this, determining root cause of an event will be much more difficult. When audit logs are not labeled before they are
    sent to a central log server, the audit data will not be able to be analyzed and tied back to the correct system. Satisfies:
    SRG-OS-000039-GPOS-00017, SRG-OS-000342-GPOS-00133, SRG-OS-000479-GPOS-00224</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
