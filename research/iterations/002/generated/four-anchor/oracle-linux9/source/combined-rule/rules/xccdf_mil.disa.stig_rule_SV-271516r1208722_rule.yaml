  description: <VulnDiscussion>The information system ensures that even if the information system is compromised, that compromise
    will not affect credentials stored on the authentication device. The daemon program for pcsc-lite and the MuscleCard framework
    is pcscd. It is a resource manager that coordinates communications with smart card readers and smart cards and cryptographic
    tokens that are connected to the system.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
