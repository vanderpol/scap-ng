      namespace: http://checklists.nist.gov/xccdf/1.2
      text: 'Configure OL 9 to disallow the user changing the Ctrl-Alt-Del sequence in the GNOME desktop.


        Create a database to container system-wide graphical user logon settings (if it does not already exist) with the following
        command:


        $ sudo touch /etc/dconf/db/local.d/locks/session


        Add the following line to the session locks file to prevent nonprivileged users from modifying the Ctrl-Alt-Del setting:


        /org/gnome/settings-daemon/plugins/media-keys/logout


        Run the following command to update the database:


        $ sudo dconf update'
