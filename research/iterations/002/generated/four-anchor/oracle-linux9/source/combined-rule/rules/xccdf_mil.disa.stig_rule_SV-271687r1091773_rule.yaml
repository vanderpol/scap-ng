  check: 'This requirement assumes the use of the OL 9 default graphical user interface—the GNOME desktop environment. If
    the system does not have any graphical user interface installed, this requirement is Not Applicable. Verify that OL 9
    users cannot enable the Ctrl-Alt-Del sequence in the GNOME desktop with the following command: $ grep logout /etc/dconf/db/local.d/locks/*
    /org/gnome/settings-daemon/plugins/media-keys/logout If the output is not "/org/gnome/settings-daemon/plugins/media-keys/logout",
    the line is commented out, or the line is missing, this is a finding.'
