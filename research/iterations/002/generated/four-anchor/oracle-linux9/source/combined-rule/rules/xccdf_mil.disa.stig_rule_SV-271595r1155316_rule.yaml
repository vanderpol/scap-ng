        exports: []
        inline_content: 'Verify OL 9 generates an audit record for all uses of the umount2 system call with the following
          commands: $ sudo auditctl -l | grep umount2 -a always,exit -F arch=b32 -S umount2 -F auid>=1000 -F auid!=-1 -F key=privileged-umount
          -a always,exit -F arch=b64 -S umount2 -F auid>=1000 -F auid!=-1 -F key=privileged-umount If the command does not
          return an audit rule for "umount2" or any of the lines returned are commented out, this is a finding.'
        multi_check: null
        negate: null
