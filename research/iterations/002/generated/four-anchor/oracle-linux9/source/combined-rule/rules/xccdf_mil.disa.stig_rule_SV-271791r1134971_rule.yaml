              text: OL09-00-002525 - OL 9 library files must have mode 755 or less permissive.
            - attributes:
                family: unix
              children:
              - name: platform
                namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
                text: Oracle Linux 9
              name: affected
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: "If OL 9 allowed any user to make changes to software libraries, then those changes might be implemented\
                \ without undergoing the appropriate testing and approvals that are part of a robust change management process.\n\
                \n\tThis requirement applies to OL 9 with software libraries that are accessible and configurable, as in the\
                \ case of interpreted languages. Software libraries also include privileged programs that execute with escalated\
                \ privileges."
            name: metadata
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
