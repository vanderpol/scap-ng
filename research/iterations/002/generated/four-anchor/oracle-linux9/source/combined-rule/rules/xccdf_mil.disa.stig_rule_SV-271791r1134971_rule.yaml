    "/usr/lib64" have mode 0755 or less permissive. Check that the systemwide shared library files have mode 0755 or less
    permissive with the following command: $ sudo find /lib /lib64 /usr/lib /usr/lib64 -type f -name ''*.so*'' -perm /022
    -exec stat -c "%n %a" {} + If any output is returned, this is a finding.'
