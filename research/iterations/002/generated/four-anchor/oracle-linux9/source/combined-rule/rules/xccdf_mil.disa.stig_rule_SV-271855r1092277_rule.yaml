      text: '<VulnDiscussion>Information stored in one location is vulnerable to accidental or incidental deletion or alteration.


        Offloading is a common process in information systems with limited audit storage capacity.


        OL 9 installation media provides "rsyslogd", a system utility providing support for message logging. Support for both
        internet and Unix domain sockets enables this utility to support both local and remote logging. Coupling this utility
        with "gnutls" (a secure communications library implementing the SSL, TLS, and DTLS protocols) creates a method to
        securely encrypt and offload auditing.


        "Rsyslog" supported authentication modes include:

        anon - anonymous authentication

        x509/fingerprint - certificate fingerprint authentication

        x509/certvalid - certificate validation only

        x509/name - certificate validation and subject name authentication


        Satisfies: SRG-OS-000342-GPOS-00133, SRG-OS-000479-GPOS-00224</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
