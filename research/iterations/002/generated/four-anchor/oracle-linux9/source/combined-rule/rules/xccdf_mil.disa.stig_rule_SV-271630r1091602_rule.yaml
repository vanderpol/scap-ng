              text: OL09-00-001090 - OL 9 passwords must have a 24-hour minimum password lifetime restriction in /etc/shadow.
            - attributes:
                family: unix
              children:
              - name: platform
                namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
                text: Oracle Linux 9
              name: affected
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Enforcing a minimum password lifetime helps to prevent repeated password changes to defeat the password
                reuse or history enforcement requirement. If users are allowed to immediately and continually change their
                password, the password could be repeatedly changed in a short period of time to defeat the organization's
                policy regarding password reuse.
            name: metadata
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
