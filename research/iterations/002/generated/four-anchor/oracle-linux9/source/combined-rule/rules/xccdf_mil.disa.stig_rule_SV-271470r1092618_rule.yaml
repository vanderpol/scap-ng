        through an external, nonorganization-controlled network. Remote access methods include, for example, dial-up, broadband,
        and wireless.


        OL 9 functionality (e.g., RDP) must be capable of taking enforcement action if the audit reveals unauthorized activity.
        Automated control of remote access sessions allows organizations to ensure ongoing compliance with remote access policies
        by enforcing connection rules of remote access applications on a variety of information system components (e.g., servers,
