rule:
  id: xccdf_mil.disa.stig_rule_SV-271826r1092190_rule
  title: OL 9 audit tools must have a mode of 0755 or less permissive.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-271826
  description: <VulnDiscussion>Protecting audit information also includes identifying and protecting the tools used to view
    and manipulate log data. Therefore, protecting audit tools is necessary to prevent unauthorized operation on audit information.
    OL 9 systems providing tools to interface with audit information will leverage user permissions and roles identifying
    the user accessing the tools, and the corresponding rights the user enjoys, to make access decisions regarding the access
    to audit tools. Audit tools include, but are not limited to, vendor-provided and open source audit tools needed to successfully
    view and manipulate audit information system activity and records. Audit tools include custom queries and report generators.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
