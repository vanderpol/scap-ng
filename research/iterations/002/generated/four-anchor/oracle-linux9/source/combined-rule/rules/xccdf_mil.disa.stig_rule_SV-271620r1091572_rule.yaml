  check: 'Verify that OL 9 requires the change of at least four character classes when passwords are changed. Verify the value
    of the "minclass" option in "/etc/security/pwquality.conf" with the following command: $ grep minclass /etc/security/pwquality.conf
    /etc/security/pwquality.conf.d/*.conf minclass = 4 If the value of "minclass" is set to less than "4", or is commented
    out, this is a finding.'
