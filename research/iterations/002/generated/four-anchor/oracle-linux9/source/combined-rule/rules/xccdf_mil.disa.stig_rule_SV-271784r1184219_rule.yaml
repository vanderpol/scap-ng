          system logon information. $ sudo ls -ld $(awk -F: ''($3>=1000)&&($7 !~ /nologin/){print $6}'' /etc/passwd) drwxr-x---
          2 disauser admin 4096 Jun 5 12:41 disauser If home directories referenced in "/etc/passwd" do not have a mode of
          "0750" or less permissive, this is a finding.'
