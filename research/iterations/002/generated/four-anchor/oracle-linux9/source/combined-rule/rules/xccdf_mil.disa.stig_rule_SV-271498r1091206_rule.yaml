  fix: Configure the file integrity tool to use FIPS 140-3 cryptographic hashes for validating file and directory contents.
    If AIDE is installed, ensure the "sha512" rule is present on all uncommented file and directory selection lists. Exclude
    any log files, or files expected to change frequently, to reduce unnecessary notifications.
