  fix: 'Configure OL 9 to elevate the SELinux context when an administrator calls the sudo command. Edit a file in the "/etc/sudoers.d"
    directory with the following command: # sudo visudo -f /etc/sudoers.d/ Use the following example to build the file in
    the "/etc/sudoers.d" directory to allow any administrator belonging to a designated sudoers admin group to elevate their
    SELinux context with the use of the sudo command: {%designated_group} or {user_name} ALL=(ALL) TYPE=sysadm_t ROLE=sysadm_r
    {commands} The following are valid examples of context configurations and can be used as a guide: %designated_group ALL=(ALL)
    TYPE=sysadm_t ROLE=sysadm_r ALL -- Allowing group to run ALL commands %designated_group ALL=(ALL) ROLE=sysadm_r TYPE=sysadm_t
    ALL -- Allowing group to run ALL commands, but order of SELinux entries is changed. %designated_group ALL=(ALL) TYPE=sysadm_t
    ROLE=sysadm_r ALL, !/bin/su -- Allowing ALL command except /bin/su. user_name ALL=(ALL) TYPE=sysadm_t ROLE=sysadm_r ALL
    -- Allowing user to run ALL commands user_name ALL=(ALL) TYPE=sysadm_t ROLE=sysadm_r /usr/bin/lsblk, /usr/sbin/alternatives
    -- Allowing user to only run /usr/bin/lsblk and /usr/sbin/alternatives Remove any configurations that conflict with the
    above from the following locations: /etc/sudoers /etc/sudoers.d/'
