              text: OL09-00-000066 - OL 9 must elevate the SELinux context when an administrator calls the sudo command.
            - attributes:
                family: unix
              children:
              - name: platform
                namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
                text: Oracle Linux 9
              name: affected
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: "Without verification of the security functions, they may not operate correctly and the failure may go\
                \ unnoticed. Security function is defined as the hardware, software, and/or firmware of the information system\
                \ responsible for enforcing the system security policy and supporting the isolation of code and data on which\
                \ the protection is based. \n\n\tSecurity functionality includes, but is not limited to, establishing system\
                \ accounts, configuring access authorizations (i.e., permissions, privileges), setting events to be audited,\
                \ and setting intrusion detection parameters.\n\n\tThis requirement applies to operating systems performing\
                \ security function verification/testing and/or systems and environments that require this functionality.\n\
                \n\tPreventing nonprivileged users from executing privileged functions mitigates the risk that unauthorized\
                \ individuals or processes may gain unnecessary access to information or privileges.\n\n\tPrivileged functions\
                \ include, for example, establishing accounts, performing system integrity checks, or administering cryptographic\
                \ key management activities. Nonprivileged users are individuals who do not possess appropriate authorizations.\
                \ Circumventing intrusion detection and prevention mechanisms or malicious code protection mechanisms are\
                \ examples of privileged functions that require protection from nonprivileged users.\n\n\tSudo reads from\
                \ \"/etc/sudoers\", then form files inside \"/etc/sudoers.d/\", and within that directory reads in lexicographical\
                \ order from low to high using a \"last match wins\" principle. Any options in the last matching rule will\
                \ override options from earlier matching rules."
            name: metadata
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
