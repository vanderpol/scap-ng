rule:
  id: xccdf_mil.disa.stig_rule_SV-271740r1091932_rule
  title: OL 9 must enable kernel parameters to enforce discretionary access control on hardlinks.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-271740
  description: '<VulnDiscussion>By enabling the fs.protected_hardlinks kernel parameter, users can no longer create soft or
    hard links to files they do not own. Disallowing such hardlinks mitigates vulnerabilities based on insecure file system
    accessed by privileged programs, avoiding an exploitation vector exploiting unsafe use of open() or creat(). Satisfies:
    SRG-OS-000312-GPOS-00123, SRG-OS-000324-GPOS-00125</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
