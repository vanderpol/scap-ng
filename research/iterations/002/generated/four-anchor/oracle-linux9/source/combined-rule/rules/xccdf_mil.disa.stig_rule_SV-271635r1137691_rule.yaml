            - attributes:
                family: unix
              children:
              - name: platform
                namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
                text: Oracle Linux 9
              name: affected
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: "To mitigate the risk of unauthorized access to sensitive information by entities that have been issued\
                \ certificates by DOD-approved PKIs, all DOD systems (e.g., web servers and web portals) must be properly\
                \ configured to incorporate access control methods that do not rely solely on the possession of a certificate\
                \ for access. Successful authentication must not automatically give an entity access to an asset or security\
                \ boundary. Authorization procedures and controls must be implemented to ensure each authenticated entity\
                \ also has a validated and current authorization. Authorization is the process of determining whether an entity,\
                \ once authenticated, is permitted to access a specific asset. Information systems use access control policies\
                \ and enforcement mechanisms to implement this requirement.\n\n\tPassword protection on the boot loader configuration\
                \ ensures users with physical access cannot trivially alter important bootloader settings. These include which\
                \ kernel to use, and whether to enter single-user mode."
            name: metadata
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
