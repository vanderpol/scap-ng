  check: 'Verify that OL 9 "umask" setting is configured correctly in the "/etc/bashrc" file with the following command: Note:
    If the value of the "umask" parameter is set to "000" "/etc/bashrc" file, the severity of this requirement is raised to
    a CAT I. $ grep umask /etc/bashrc umask 077 umask 077 If the value for the "umask" parameter is not "077", or the "umask"
    parameter is missing or is commented out, this is a finding.'
