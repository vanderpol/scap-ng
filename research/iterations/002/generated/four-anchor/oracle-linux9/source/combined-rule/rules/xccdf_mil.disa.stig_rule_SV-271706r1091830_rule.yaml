        inline_content: 'Verify that OL 9 remote access using SSH prevents logging on with a blank password with the following
          command: $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs
