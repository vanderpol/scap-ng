  check: 'Verify that OL 9 GRUB 2 is configured to enable poisoning of SLUB/SLAB objects to mitigate use-after-free vulnerabilities
    with the following commands: Check that the current GRUB 2 configuration has poisoning of SLUB/SLAB objects enabled: $
    sudo grubby --info=ALL | grep args | grep -v ''slub_debug=P'' If any output is returned, this is a finding. Check that
    poisoning of SLUB/SLAB objects is enabled by default to persist in kernel updates: $ sudo grep slub_debug /etc/default/grub
    GRUB_CMDLINE_LINUX="slub_debug=P" If "slub_debug" is not set to "P", is missing or commented out, this is a finding.'
