  check: 'Verify that OL 9 requires a unique username for the grub superuser account. Verify the boot loader superuser account
    has been set with the following command: $ sudo grep -A1 "superusers" /etc/grub2.cfg set superusers="<superusers-account>"
    export superusers password_pbkdf2 root ${GRUB2_PASSWORD} The <superusers-account> is the actual account name different
    from common names like root, admin, or administrator. If superusers contains easily guessable usernames, this is a finding.'
