  fix: 'Configure OL 9 to have a unique username for the grub superuser account. Edit the "/etc/grub.d/01_users" file and
    add or modify the following lines in the "### BEGIN /etc/grub.d/01_users ###" section: set superusers="superusers-account"
    export superusers Once the superuser account has been added, update the grub.cfg file by running: $ sudo grubby --update-kernel=ALL'''
