rule:
  id: xccdf_mil.disa.stig_rule_SV-271652r1094966_rule
  title: OL 9 must mount /dev/shm with the nosuid option.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
