rule:
  id: xccdf_mil.disa.stig_rule_SV-271489r1184190_rule
  title: OL 9 SSH client must be configured to use only DOD-approved encryption ciphers employing FIPS 140-3 validated cryptographic
    hash algorithms to protect the confidentiality of SSH client connections.
  severity: high
  weight: '10.0'
  role: null
