            namespace: http://checklists.nist.gov/xccdf/1.2
          - name: check-content
            namespace: http://checklists.nist.gov/xccdf/1.2
            text: "This requirement assumes the use of the OL 9 default graphical user interface—the GNOME desktop environment.\
              \ If the system does not have any graphical user interface installed, this requirement is Not Applicable.\n\n\
              Verify that OL 9 prevents a user from overriding settings for graphical user interfaces. \n\nDetermine which\
              \ profile the system database is using with the following command:\n\n$ grep system-db /etc/dconf/profile/user\n\
              system-db:local\n\nCheck that graphical settings are locked from nonprivileged user modification with the following\
              \ command:\n\nNote: The example below is using the database \"local\" for the system, so the path is \"/etc/dconf/db/local.d\"\
              . This path must be modified if a database other than \"local\" is being used.\n\n$ grep banner-message-enable\
              \ /etc/dconf/db/local.d/locks/* \n/org/gnome/login-screen/banner-message-enable\n\nIf the output is not \"/org/gnome/login-screen/banner-message-enable\"\
              , the line is commented out, or the line is missing, this is a finding."
          name: check
          namespace: http://checklists.nist.gov/xccdf/1.2
        system: http://scap.nist.gov/schema/ocil/2
