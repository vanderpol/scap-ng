  description: '<VulnDiscussion>Display of a standardized and approved use notification before granting access to the operating
    system ensures privacy and security notification verbiage used is consistent with applicable federal laws, Executive Orders,
    directives, policies, regulations, standards, and guidance. For U.S. government systems, system use notifications are
    required only for access via login interfaces with human users and are not required when such human interfaces do not
    exist. Satisfies: SRG-OS-000023-GPOS-00006, SRG-OS-000228-GPOS-00088</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
