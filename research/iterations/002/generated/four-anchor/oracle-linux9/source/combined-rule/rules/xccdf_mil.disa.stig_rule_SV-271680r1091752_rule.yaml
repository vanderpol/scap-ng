  fix: 'Configure OL 9 to prevent a user from overriding the banner setting for graphical user interfaces. Create a database
    to contain the system-wide graphical user logon settings (if it does not already exist) with the following command: $
    sudo touch /etc/dconf/db/local.d/locks/session Add the following setting to prevent nonprivileged users from modifying
    it: /org/gnome/login-screen/banner-message-enable Run the following command to update the database: $ sudo dconf update'
