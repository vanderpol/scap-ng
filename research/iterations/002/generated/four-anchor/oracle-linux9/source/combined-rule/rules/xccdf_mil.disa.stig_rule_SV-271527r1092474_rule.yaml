  description: '<VulnDiscussion>The actions taken by system administrators must be audited to keep a record of what was executed
    on the system, as well as for accountability purposes. Editing the sudoers file may be sign of an attacker trying to establish
    persistent methods to a system, auditing the editing of the sudoers files mitigates this risk. Satisfies: SRG-OS-000004-GPOS-00004,
    SRG-OS-000037-GPOS-00015, SRG-OS-000042-GPOS-00020, SRG-OS-000062-GPOS-00031, SRG-OS-000304-GPOS-00121, SRG-OS-000392-GPOS-00172,
