rule:
  id: xccdf_mil.disa.stig_rule_SV-271565r1092550_rule
  title: OL 9 must audit all uses of the init_module and finit_module system calls.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
