  fix: 'Configure OL 9 to generate an audit event for any successful/unsuccessful use of the init_module and finit_module
    system calls by adding or updating the following rules in the "/etc/audit/rules.d/audit.rules" file: -a always,exit -F
    arch=b32 -S init_module,finit_module -F auid>=1000 -F auid!=unset -k module_chng -a always,exit -F arch=b64 -S init_module,finit_module
    -F auid>=1000 -F auid!=unset -k module_chng The audit daemon must be restarted for the changes to take effect. Restart
    auditd: $ sudo service auditd restart'
