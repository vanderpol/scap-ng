          metadata:
            children:
            - name: title
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: OL09-00-000690 - OL 9 must audit all uses of the init_module and finit_module system calls.
            - attributes:
                family: unix
              children:
              - name: platform
                namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
                text: Oracle Linux 9
              name: affected
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: "Without generating audit records specific to the security and mission needs of the organization, it would\
                \ be difficult to establish, correlate, and investigate the events relating to an incident or identify those\
                \ responsible for one.\n\n\tAudit records can be generated from various components within the information\
                \ system (e.g., module or policy filter).\n\n\tWhen a user logs on, the auid is set to the uid of the account\
                \ being authenticated. Daemons are not user sessions and have the loginuid set to -1. The auid representation\
                \ is an unsigned 32-bit integer, which equals 4294967295. The audit system interprets -1, 4294967295, and\
                \ \"unset\" in the same way.\n\n\tThe system call rules are loaded into a matching engine that intercepts\
                \ each system call made by all programs on the system. Therefore, it is very important to use system call\
                \ rules only when absolutely necessary since these affect performance. The more rules, the bigger the performance\
                \ hit. The performance can be helped, however, by combining system calls into one rule whenever possible.\n\
                \n\tSatisfies: SRG-OS-000037-GPOS-00015, SRG-OS-000042-GPOS-00020, SRG-OS-000062-GPOS-00031, SRG-OS-000392-GPOS-00172,\
                \ SRG-OS-000462-GPOS-00206, SRG-OS-000471-GPOS-00215, SRG-OS-000471-GPOS-00216, SRG-OS-000477-GPOS-00222"
            name: metadata
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
