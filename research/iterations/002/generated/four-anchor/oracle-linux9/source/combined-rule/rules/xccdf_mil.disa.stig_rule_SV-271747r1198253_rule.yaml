  fix: 'Configure OL 9 to prevent the leak of kernel pointers to unprivileged users. Add or edit the following line in /etc/sysctl.d/99-sysctl.conf
    system configuration file: kernel.kptr_restrict = 1 Reload settings from all system configuration files with the following
    command: $ sudo sysctl --system'
