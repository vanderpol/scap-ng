  fix: 'Configure the SSH client to use only MACs employing FIPS 140-3 approved algorithms. Reinstall crypto-policies with
    the following command: $ sudo dnf -y reinstall crypto-policies Set the crypto-policy to FIPS with the following command:
    $ sudo update-crypto-policies --set FIPS Setting system policy to FIPS Note: Systemwide crypto policies are applied on
    application startup. It is recommended to restart the system for the change of policies to fully take place.'
