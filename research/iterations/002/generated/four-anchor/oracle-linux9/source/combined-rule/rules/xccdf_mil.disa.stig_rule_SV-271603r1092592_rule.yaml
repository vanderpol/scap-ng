  check: 'Verify that OL 9 is configured to take action in the event of allocated audit record storage volume reaches 95 percent
    of the repository maximum audit record storage capacity with the following command: $ sudo grep admin_space_left_action
    /etc/audit/auditd.conf admin_space_left_action = single If the value of the "admin_space_left_action" is not set to "single",
    or if the line is commented out, ask the system administrator (SA) to indicate how the system is providing real-time alerts
    to the SA and information system security officer (ISSO). If there is no evidence that real-time alerts are configured
    on the system, this is a finding.'
