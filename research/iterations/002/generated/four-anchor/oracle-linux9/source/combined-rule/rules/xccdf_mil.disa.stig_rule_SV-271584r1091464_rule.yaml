  check: 'Verify that OL 9 audit logs directory is owned by "root". First determine where the audit logs are stored with the
    following command: $ sudo grep -iw log_file /etc/audit/auditd.conf log_file = /var/log/audit/audit.log Then using the
    location of the audit log file, determine if the audit log directory is owned by "root" using the following command: $
    sudo ls -ld /var/log/audit drwx------ 2 root root 23 Jun 11 11:56 /var/log/audit If the audit log directory is not owned
    by "root", this is a finding.'
