rule:
  id: xccdf_mil.disa.stig_rule_SV-271566r1092552_rule
  title: OL 9 must audit all uses of the kmod command.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
