  fix: 'Configure OL 9 to generate audit records upon successful/unsuccessful attempts to use the kmod command by adding or
    updating the following rule in "/etc/audit/rules.d/audit.rules": -a always,exit -F path=/usr/bin/kmod -F perm=x -F auid>=1000
    -F auid!=unset -k modules The audit daemon must be restarted for the changes to take effect. Restart auditd: $ sudo service
    auditd restart'
