  fix: 'Configure OL 9 to enable a user''s session lock until that user reestablishes access using established identification
    and authentication procedures. Select or create an authselect profile and incorporate the "with-smartcard-lock-on-removal"
    feature with the following example: $ sudo authselect select sssd with-smartcard with-smartcard-lock-on-removal Alternatively,
    the dconf settings can be edited in the /etc/dconf/db/* location. Add or update the [org/gnome/settings-daemon/peripherals/smartcard]
    section of the /etc/dconf/db/local.d/00-security-settings" database file and add or update the following lines: [org/gnome/settings-daemon/peripherals/smartcard]
    removal-action=''lock-screen'' Update the dconf system databases: $ sudo dconf update'
