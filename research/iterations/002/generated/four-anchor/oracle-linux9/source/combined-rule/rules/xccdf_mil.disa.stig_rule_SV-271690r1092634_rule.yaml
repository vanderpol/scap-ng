            children:
            - name: title
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: OL09-00-002160 - OL 9 must be able to directly initiate a session lock for all connection types using
                smart card when the smart card is removed.
            - attributes:
                family: unix
              children:
              - name: platform
                namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
                text: Oracle Linux 9
              name: affected
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: "A session lock is a temporary action taken when a user stops work and moves away from the immediate physical\
                \ vicinity of the information system but does not want to log out because of the temporary nature of the absence.\n\
                \n\tThe session lock is implemented at the point where session activity can be determined. Rather than be\
                \ forced to wait for a period of time to expire before the user session can be locked, OL 9 needs to provide\
                \ users with the ability to manually invoke a session lock so users can secure their session if it is necessary\
                \ to temporarily vacate the immediate physical vicinity.\n\n\tSatisfies: SRG-OS-000028-GPOS-00009, SRG-OS-000030-GPOS-00011"
            name: metadata
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
