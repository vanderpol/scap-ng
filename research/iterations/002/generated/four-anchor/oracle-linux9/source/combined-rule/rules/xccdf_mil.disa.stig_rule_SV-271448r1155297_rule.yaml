              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: OL09-00-000045 - OL 9 must disable mounting of cramfs.
            - attributes:
                family: unix
              children:
              - name: platform
                namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
                text: Oracle Linux 9
              name: affected
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: "It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements\
                \ or mission objectives. These unnecessary capabilities or services are often overlooked and therefore may\
                \ remain unsecured. They increase the risk to the platform by providing additional attack vectors.\n\n\tRemoving\
                \ support for unneeded filesystem types reduces the local attack surface of the server.\n\n\tCompressed ROM/RAM\
                \ file system (or cramfs) is a read-only file system designed for simplicity and space-efficiency. It is mainly\
                \ used in embedded and small-footprint systems."
            name: metadata
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
