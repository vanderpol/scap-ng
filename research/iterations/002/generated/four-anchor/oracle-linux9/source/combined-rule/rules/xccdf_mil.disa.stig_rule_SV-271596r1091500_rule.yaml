              name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:32101
            name: check-content-ref
            namespace: http://checklists.nist.gov/xccdf/1.2
          - name: check-content
            namespace: http://checklists.nist.gov/xccdf/1.2
            text: "Verify that OL 9 allocates audit record storage capacity to store at least one week of audit records when\
              \ audit records are not immediately sent to a central audit record storage facility.\n\nNote: The partition\
              \ size needed to capture a week of audit records is based on the activity level of the system and the total\
              \ storage capacity available. Typically 10GB of storage space for audit records should be sufficient.\n\nDetermine\
              \ which partition the audit records are being written to with the following command:\n\n$ sudo grep log_file\
              \ /etc/audit/auditd.conf\nlog_file = /var/log/audit/audit.log \n\nCheck the size of the partition that audit\
              \ records are written to with the following command and verify whether it is sufficiently large:\n\n # df -h\
              \ /var/log/audit/\n/dev/sda2 24G 10.4G 13.6G 43% /var/log/audit \n\nIf the audit record partition is not allocated\
              \ for sufficient storage capacity, this is a finding."
          name: check
          namespace: http://checklists.nist.gov/xccdf/1.2
        system: http://scap.nist.gov/schema/ocil/2
