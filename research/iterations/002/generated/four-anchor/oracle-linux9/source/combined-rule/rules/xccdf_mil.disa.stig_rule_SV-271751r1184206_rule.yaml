rule:
  id: xccdf_mil.disa.stig_rule_SV-271751r1184206_rule
  title: OL 9 must be configured so that the systemd Ctrl-Alt-Delete burst key sequence is disabled.
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
