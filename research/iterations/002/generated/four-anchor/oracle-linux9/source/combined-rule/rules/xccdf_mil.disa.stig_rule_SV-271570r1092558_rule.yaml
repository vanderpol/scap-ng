  fix: 'Configure OL 9 to audit the execution of the execve system call. Add or update the following file system rules to
    "/etc/audit/rules.d/audit.rules": -a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -k execpriv -a always,exit
    -F arch=b64 -S execve -C uid!=euid -F euid=0 -k execpriv -a always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0 -k
    execpriv -a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -k execpriv The audit daemon must be restarted for
    the changes to take effect. Restart auditd: $ sudo service auditd restart Note: Users must reboot to view above results
    with command "auditctl -l | grep execve".'
