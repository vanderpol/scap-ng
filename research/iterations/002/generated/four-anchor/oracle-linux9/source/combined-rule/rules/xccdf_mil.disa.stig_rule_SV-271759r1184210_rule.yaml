      text: '<VulnDiscussion>Without cryptographic integrity protections, information can be altered by unauthorized users
        without detection.


        Cryptographic mechanisms used for protecting the integrity of information include, for example, signed hash functions
        using asymmetric cryptography enabling distribution of the public key to verify the hash information while maintaining
        the confidentiality of the secret key used to generate the hash.


        OL 9 incorporates system-wide crypto policies by default. The employed algorithms can be viewed in the /etc/crypto-policies/back-ends/
        directory.


        Satisfies: SRG-OS-000423-GPOS-00187, SRG-OS-000426-GPOS-00190</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
