rule:
  id: xccdf_mil.disa.stig_rule_SV-271759r1184210_rule
  title: OL 9 must implement DOD-approved encryption in the bind package.
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-271759
  description: '<VulnDiscussion>Without cryptographic integrity protections, information can be altered by unauthorized users
    without detection. Cryptographic mechanisms used for protecting the integrity of information include, for example, signed
    hash functions using asymmetric cryptography enabling distribution of the public key to verify the hash information while
    maintaining the confidentiality of the secret key used to generate the hash. OL 9 incorporates system-wide crypto policies
    by default. The employed algorithms can be viewed in the /etc/crypto-policies/back-ends/ directory. Satisfies: SRG-OS-000423-GPOS-00187,
    SRG-OS-000426-GPOS-00190</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
