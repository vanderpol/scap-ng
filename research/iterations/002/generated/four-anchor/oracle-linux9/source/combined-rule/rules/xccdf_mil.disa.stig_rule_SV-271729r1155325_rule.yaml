rule:
  id: xccdf_mil.disa.stig_rule_SV-271729r1155325_rule
  title: OL 9 must disable core dump backtraces.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-271729
  description: <VulnDiscussion>A core dump includes a memory image taken at the time the operating system terminates an application.
    The memory image could contain sensitive data and is generally useful only for developers or system operators trying to
    debug problems. Enabling core dumps on production systems is not recommended; however, there may be overriding operational
    requirements to enable advanced debugging. Permitting temporary enablement of core dumps during such situations must be
    reviewed through local needs and policy.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
