  group_path:
  - xccdf_mil.disa.stig_group_V-271520
  description: '<VulnDiscussion>Without establishing what type of events occurred, it would be difficult to establish, correlate,
    and investigate the events leading up to an outage or attack. Ensuring the "auditd" service is active ensures audit records
    generated by the kernel are appropriately recorded. Additionally, a properly configured audit subsystem ensures that actions
    of individual system users can be uniquely traced to those users so they can be held accountable for their actions. Satisfies:
    SRG-OS-000062-GPOS-00031, SRG-OS-000037-GPOS-00015, SRG-OS-000038-GPOS-00016, SRG-OS-000039-GPOS-00017, SRG-OS-000040-GPOS-00018,
