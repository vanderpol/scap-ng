            - name: title
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: OL09-00-000441 - OL 9 audit service must be enabled.
            - attributes:
                family: unix
              children:
              - name: platform
                namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
                text: Oracle Linux 9
              name: affected
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: "Without establishing what type of events occurred, it would be difficult to establish, correlate, and\
                \ investigate the events leading up to an outage or attack. Ensuring the \"auditd\" service is active ensures\
                \ audit records generated by the kernel are appropriately recorded.\n\n\tAdditionally, a properly configured\
                \ audit subsystem ensures that actions of individual system users can be uniquely traced to those users so\
                \ they can be held accountable for their actions.\n\n\tSatisfies: SRG-OS-000062-GPOS-00031, SRG-OS-000037-GPOS-00015,\
                \ SRG-OS-000038-GPOS-00016, SRG-OS-000039-GPOS-00017, SRG-OS-000040-GPOS-00018, SRG-OS-000041-GPOS-00019,\
