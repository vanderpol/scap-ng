rule:
  id: xccdf_mil.disa.stig_rule_SV-271555r1092530_rule
  title: OL 9 must audit all uses of the chmod, fchmod, and fchmodat system calls.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
