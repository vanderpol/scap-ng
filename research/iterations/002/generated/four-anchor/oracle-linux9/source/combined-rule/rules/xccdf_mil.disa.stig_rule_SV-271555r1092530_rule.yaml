        oval:mil.disa.stig.ol9os:def:271555:
          source_definition_id: oval:mil.disa.stig.ol9os:def:271555
          class: compliance
          version: '1'
          criteria:
            children:
            - comment: null
              definition_ref: oval:mil.disa.stig.defs:def:230456
