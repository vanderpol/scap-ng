          - name: check-content
            namespace: http://checklists.nist.gov/xccdf/1.2
            text: 'Verify that OL 9 is configured to audit the execution of the chmod, fchmod, and fchmodat system calls with
              the following command:


              $ sudo auditctl -l | grep chmod

              -a always,exit -F arch=b32 -S chmod,fchmod,fchmodat -F auid>=1000 -F auid!=unset -k perm_mod

              -a always,exit -F arch=b64 -S chmod,fchmod,fchmodat -F auid>=1000 -F auid!=unset -k perm_mod


              If both the "b32" and "b64" audit rules are not defined for the chmod, fchmod, and fchmodat system calls, this
              is a finding.'
          name: check
