              name: affected
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: "Only authorized personnel should be aware of errors and the details of the errors. Error messages are\
                \ an indicator of an organization's operational state or can identify the OL 9 system or platform. Additionally,\
                \ Personally Identifiable Information (PII) and operational information must not be revealed through error\
                \ messages to unauthorized personnel or their designated representatives.\n\n\tThe structure and content of\
                \ error messages must be carefully considered by the organization and development team. The extent to which\
                \ the information system is able to identify and handle error conditions is guided by organizational policy\
                \ and operational requirements.\n\n\tSatisfies: SRG-OS-000057-GPOS-00027, SRG-OS-000058-GPOS-00028, SRG-OS-000059-GPOS-00029,\
                \ SRG-OS-000206-GPOS-00084"
