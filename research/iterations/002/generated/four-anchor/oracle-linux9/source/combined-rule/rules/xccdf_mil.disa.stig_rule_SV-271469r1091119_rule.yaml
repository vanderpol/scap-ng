rule:
  id: xccdf_mil.disa.stig_rule_SV-271469r1091119_rule
  title: OL 9 must have the firewalld package installed.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
