  fix: 'Note: This setting must be applied in conjunction with ClientAliveInterval to function correctly. Configure the SSH
    server to terminate a user session automatically after the SSH client has become unresponsive. Modify or append the following
    lines in the "/etc/ssh/sshd_config" or in a file in "/etc/ssh/sshd_config.d": ClientAliveCountMax 1 In order for the changes
    to take effect, the SSH daemon must be restarted. $ sudo systemctl restart sshd.service'
