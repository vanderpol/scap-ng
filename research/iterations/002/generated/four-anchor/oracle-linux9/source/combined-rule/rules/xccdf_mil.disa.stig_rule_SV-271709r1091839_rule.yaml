          metadata:
            children:
            - name: title
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: OL09-00-002346 - OL 9 must be configured so that all network connections associated with SSH traffic terminate
                after becoming unresponsive.
            - attributes:
                family: unix
              children:
              - name: platform
                namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
                text: Oracle Linux 9
              name: affected
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: "Terminating an unresponsive SSH session within a short time period reduces the window of opportunity\
                \ for unauthorized personnel to take control of a management session enabled on the console or console port\
                \ that has been left unattended. In addition, quickly terminating an idle SSH session will also free up resources\
                \ committed by the managed network element.\n\n\tTerminating network connections associated with communications\
                \ sessions includes, for example, deallocating associated TCP/IP address/port pairs at the operating system\
                \ level and deallocating networking assignments at the application level if multiple application sessions\
                \ are using a single operating system-level network connection. This does not mean the operating system terminates\
                \ all sessions or network access; it only ends the unresponsive session and releases the resources associated\
                \ with that session.\n\n\tOL 9 uses /etc/ssh/sshd_config for configurations of OpenSSH. Within the sshd_config,\
                \ the product of the values of \"ClientAliveInterval\" and \"ClientAliveCountMax\" are used to establish the\
                \ inactivity threshold. The \"ClientAliveInterval\" is a timeout interval in seconds, after which if no data\
                \ has been received from the client, SSHD will send a message through the encrypted channel to request a response\
                \ from the client. The \"ClientAliveCountMax\" is the number of client alive messages that may be sent without\
                \ SSHD receiving any messages back from the client. If this threshold is met, sshd will disconnect the client.\
                \ For more information on these settings and others, refer to the sshd_config man pages.\n\n\tSatisfies: SRG-OS-000163-GPOS-00072,\
                \ SRG-OS-000279-GPOS-00109"
            name: metadata
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
        oval:mil.disa.stig.defs:def:271709:
          source_definition_id: oval:mil.disa.stig.defs:def:271709
          class: compliance
          version: '1'
          criteria:
            children:
            - comment: /etc/ssh/sshd_config:ClientAliveCountMax = 1
              kind: test_ref
              negate: false
              test_ref: oval:mil.disa.stig.ind:tst:27170900
            comment: null
            kind: boolean
            negate: false
            operator: AND
          metadata:
            children:
            - name: title
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: The operating system must be configured so that all network connections associated with SSH traffic are
                terminated at the end of the session or after 10 minutes of inactivity, except to fulfill documented and validated
                mission requirements.
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            name: metadata
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
