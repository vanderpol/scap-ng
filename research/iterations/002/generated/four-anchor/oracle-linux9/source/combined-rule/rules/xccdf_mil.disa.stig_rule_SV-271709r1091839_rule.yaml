rule:
  id: xccdf_mil.disa.stig_rule_SV-271709r1091839_rule
  title: OL 9 must be configured so that all network connections associated with SSH traffic terminate after becoming unresponsive.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-271709
  description: '<VulnDiscussion>Terminating an unresponsive SSH session within a short time period reduces the window of opportunity
    for unauthorized personnel to take control of a management session enabled on the console or console port that has been
    left unattended. In addition, quickly terminating an idle SSH session will also free up resources committed by the managed
    network element. Terminating network connections associated with communications sessions includes, for example, deallocating
    associated TCP/IP address/port pairs at the operating system level and deallocating networking assignments at the application
    level if multiple application sessions are using a single operating system-level network connection. This does not mean
    the operating system terminates all sessions or network access; it only ends the unresponsive session and releases the
    resources associated with that session. OL 9 uses /etc/ssh/sshd_config for configurations of OpenSSH. Within the sshd_config,
    the product of the values of "ClientAliveInterval" and "ClientAliveCountMax" are used to establish the inactivity threshold.
    The "ClientAliveInterval" is a timeout interval in seconds, after which if no data has been received from the client,
    SSHD will send a message through the encrypted channel to request a response from the client. The "ClientAliveCountMax"
    is the number of client alive messages that may be sent without SSHD receiving any messages back from the client. If this
    threshold is met, sshd will disconnect the client. For more information on these settings and others, refer to the sshd_config
    man pages. Satisfies: SRG-OS-000163-GPOS-00072, SRG-OS-000279-GPOS-00109</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
  discussion: null
