rule:
  id: xccdf_mil.disa.stig_rule_SV-271654r1091674_rule
  title: OL 9 must mount /tmp with the noexec option.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
