rule:
  id: xccdf_mil.disa.stig_rule_SV-271674r1208729_rule
  title: OL 9 must automatically lock graphical user sessions after 10 minutes of inactivity.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-271674
  description: '<VulnDiscussion>A session timeout lock is a temporary action taken when a user stops work and moves away from
    the immediate physical vicinity of the information system but does not logout because of the temporary nature of the absence.
    Rather than relying on the user to manually lock their operating system session prior to vacating the vicinity, the GNOME
    desktop can be configured to identify when a user''s session has idled and take action to initiate a session lock. Satisfies:
    SRG-OS-000029-GPOS-00010, SRG-OS-000031-GPOS-00012</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
