  description: <VulnDiscussion>If security personnel are not notified immediately when storage volume reaches a maximum of
    75 percent utilization, they are unable to plan for audit record storage capacity expansion. The notification can be set
    to trigger at lower utilization thresholds at the ISSO's discretion.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
