rule:
  id: xccdf_mil.disa.stig_rule_SV-271600r1134858_rule
  title: OL 9 must notify the system administrator (SA) and information system security officer (ISSO) (at a minimum) when
    allocated audit record storage volume reaches 75 percent utilization.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
