rule:
  id: xccdf_mil.disa.stig_rule_SV-271688r1091776_rule
  title: OL 9 must be configured to enable the display of the Standard Mandatory DOD Notice and Consent Banner before granting
    local or remote access to the system via a graphical user logon.
  severity: medium
  weight: '10.0'
  role: null
