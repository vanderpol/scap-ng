          name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:50101
        exports: []
        inline_content: 'This requirement assumes the use of the OL 9 default graphical user interface—the GNOME desktop environment.
          If the system does not have any graphical user interface installed, this requirement is Not Applicable. Verify that
          OL 9 displays a banner before granting access to the operating system via a graphical user logon. Determine if the
          operating system displays a banner at the logon screen with the following command: $ gsettings get org.gnome.login-screen
          banner-message-enable true If the result is "false", this is a finding.'
        multi_check: null
        negate: null
        selector: manual
        source_tree:
          attributes:
            selector: manual
            system: http://scap.nist.gov/schema/ocil/2
          children:
          - attributes:
