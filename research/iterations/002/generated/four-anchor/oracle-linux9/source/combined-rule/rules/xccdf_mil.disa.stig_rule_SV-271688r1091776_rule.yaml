  fix: 'Configure OL 9 to display the Standard Mandatory DOD Notice and Consent Banner before granting access to the system
    via a graphical user logon. Create a database to contain the system-wide graphical user logon settings (if it does not
    already exist) with the following command: $ sudo touch /etc/dconf/db/local.d/01-banner-message Add the following lines
    to the [org/gnome/login-screen] section of the "/etc/dconf/db/local.d/01-banner-message": [org/gnome/login-screen] banner-message-enable=true
    Run the following command to update the database: $ sudo dconf update'
