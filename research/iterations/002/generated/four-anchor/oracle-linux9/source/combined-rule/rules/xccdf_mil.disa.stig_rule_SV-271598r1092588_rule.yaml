rule:
  id: xccdf_mil.disa.stig_rule_SV-271598r1092588_rule
  title: OL 9 must take appropriate action when the internal event queue is full.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
