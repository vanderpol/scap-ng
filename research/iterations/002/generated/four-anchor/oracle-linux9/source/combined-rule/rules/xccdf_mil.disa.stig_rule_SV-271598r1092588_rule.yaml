  group_path:
  - xccdf_mil.disa.stig_group_V-271598
  description: '<VulnDiscussion>The audit system should have an action setup in the event the internal event queue becomes
    full so that no data is lost. Information stored in one location is vulnerable to accidental or incidental deletion or
    alteration. Offloading is a common process in information systems with limited audit storage capacity. Satisfies: SRG-OS-000342-GPOS-00133,
    SRG-OS-000479-GPOS-00224</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
