  fix: 'Configure OL 9 must prevent a user from overriding the disabling of the graphical user smart card removal action.
    Add the following line to "/etc/dconf/db/local.d/locks/00-security-settings-lock": /org/gnome/settings-daemon/peripherals/smartcard/removal-action
    Update the dconf system databases: $ sudo dconf update'
