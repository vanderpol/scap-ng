rule:
  id: xccdf_mil.disa.stig_rule_SV-271684r1091764_rule
  title: OL 9 must prevent a user from overriding the disabling of the graphical user smart card removal action.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-271684
  description: '<VulnDiscussion>A session lock is a temporary action taken when a user stops work and moves away from the
    immediate physical vicinity of the information system but does not want to log out because of the temporary nature of
    the absence. The session lock is implemented at the point where session activity can be determined. Rather than be forced
    to wait for a period of time to expire before the user session can be locked, OL 9 must provide users with the ability
    to manually invoke a session lock so users can secure their session if it is necessary to temporarily vacate the immediate
    physical vicinity. Satisfies: SRG-OS-000028-GPOS-00009, SRG-OS-000030-GPOS-00011</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
