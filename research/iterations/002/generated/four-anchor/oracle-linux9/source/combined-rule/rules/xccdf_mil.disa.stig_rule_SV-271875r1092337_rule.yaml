  check: 'Verify that OL 9 does not IPv4 ICMP redirect messages. Check the value of the "all send_redirects" variables with
    the following command: $ sysctl net.ipv4.conf.all.send_redirects net.ipv4.conf.all.send_redirects = 0 If "net.ipv4.conf.all.send_redirects"
    is not set to "0" and is not documented with the information system security officer (ISSO) as an operational requirement
    or is missing, this is a finding.'
