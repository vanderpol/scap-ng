  fix: 'Configure OL 9 to not allow interfaces to perform IPv4 ICMP redirects. Add or edit the following line in a single
    system configuration file in the "/etc/sysctl.d/" directory: net.ipv4.conf.all.send_redirects = 0 Load settings from all
    system configuration files with the following command: $ sudo sysctl --system'
