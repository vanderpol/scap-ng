rule:
  id: xccdf_mil.disa.stig_rule_SV-271738r1092600_rule
  title: OL 9 must clear the page allocator to prevent use-after-free attacks.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
