  group_path:
  - xccdf_mil.disa.stig_group_V-271695
  description: <VulnDiscussion>The umask controls the default access mode assigned to newly created files. A umask of 077
    limits new files to mode 600 or less permissive. Although umask can be represented as a four-digit number, the first digit
    representing special access modes is typically ignored or required to be "0". This requirement applies to the globally
    configured system defaults and the local interactive user defaults for each account on the system.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
