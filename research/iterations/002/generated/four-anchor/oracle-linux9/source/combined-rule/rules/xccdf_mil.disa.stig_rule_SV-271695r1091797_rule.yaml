rule:
  id: xccdf_mil.disa.stig_rule_SV-271695r1091797_rule
  title: OL 9 must define default permissions for the system default profile.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
