  check: 'Verify that OL 9 limits the number of concurrent sessions to "10" for all accounts and/or account types with the
    following command: $ grep -r -s maxlogins /etc/security/limits.conf /etc/security/limits.d/*.conf /etc/security/limits.conf:*
    hard maxlogins 10 This can be set as a global domain (with the * wildcard) but may be set differently for multiple domains.
    If the "maxlogins" item is missing, commented out, or the value is set greater than "10" and is not documented with the
    information system security officer (ISSO) as an operational requirement for all domains that have the "maxlogins" item
    assigned, this is a finding.'
