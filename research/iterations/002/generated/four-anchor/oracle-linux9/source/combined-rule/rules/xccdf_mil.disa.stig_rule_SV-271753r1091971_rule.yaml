              text: OL09-00-002415 - OL 9 must limit the number of concurrent sessions to ten for all accounts and/or account
                types.
            - attributes:
                family: unix
              children:
              - name: platform
                namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
                text: Oracle Linux 9
              name: affected
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: "Operating system management includes the ability to control the number of users and user sessions that\
                \ use an operating system. Limiting the number of allowed users and sessions per user is helpful in reducing\
                \ the risks related to denial-of-service (DoS) attacks.\n\n\tThis requirement addresses concurrent sessions\
                \ for information system accounts and does not address concurrent sessions by single users via multiple system\
                \ accounts. The maximum number of concurrent sessions must be defined based on mission needs and the operational\
                \ environment for each system."
            name: metadata
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
