            - name: title
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: OL09-00-000043 - OL 9 must disable the Stream Control Transmission Protocol (SCTP) kernel module.
            - attributes:
                family: unix
              children:
              - name: platform
                namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
                text: Oracle Linux 9
              name: affected
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: "It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements\
                \ or mission objectives. These unnecessary capabilities or services are often overlooked and therefore may\
                \ remain unsecured. They increase the risk to the platform by providing additional attack vectors.\n\n\tFailing\
                \ to disconnect unused protocols can result in a system compromise.\n\n\tThe SCTP is a transport layer protocol,\
                \ designed to support the idea of message-oriented communication, with several streams of messages within\
                \ one connection. Disabling SCTP protects the system against exploitation of any flaws in its implementation."
            name: metadata
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
