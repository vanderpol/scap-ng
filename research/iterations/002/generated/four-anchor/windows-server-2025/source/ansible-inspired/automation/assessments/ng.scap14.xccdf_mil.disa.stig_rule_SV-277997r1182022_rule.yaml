          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Open \"Computer Management\".\n\nSelect \"Disk Management\" under \"Storage\".\n\nFor each local volume,\
            \ if the file system does not indicate \"NTFS\", this is a finding.\n\n\"ReFS\" (Resilient File System) is also\
            \ acceptable and would not be a finding. \n\n\"CSVFS\" (Cluster Shared Volumes File Systems) is also acceptable\
            \ and would not be a finding. \n\nThis does not apply to system partitions such the Recovery and EFI System Partition."
