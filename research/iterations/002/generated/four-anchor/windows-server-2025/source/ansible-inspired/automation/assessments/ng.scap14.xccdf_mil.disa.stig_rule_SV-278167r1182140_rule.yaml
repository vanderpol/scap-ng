        name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:36501
      exports: []
      inline_content: 'This applies to domain controllers, it is not applicable for other systems. Verify the effective setting
        in Local Group Policy Editor. Run gpedit.msc. Navigate to Local Computer Policy >> Computer Configuration >> Windows
        Settings >> Security Settings >> Local Policies >> User Rights Assignment. If any accounts or groups other than the
        following are granted the "Allow log on through Remote Desktop Services" user right, this is a finding: - Administrators.
        For server core installations, run the following command: Secedit /Export /Areas User_Rights /cfg c:\path\filename.txt
        Review the text file. If any SIDs other than the following are granted the "SeRemoteInteractiveLogonRight" user right,
        this is a finding. S-1-5-32-544 (Administrators)'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:36501
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'This applies to domain controllers, it is not applicable for other systems.


            Verify the effective setting in Local Group Policy Editor.


            Run gpedit.msc.


            Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local
            Policies >> User Rights Assignment.


            If any accounts or groups other than the following are granted the "Allow log on through Remote Desktop Services"
            user right, this is a finding:

            - Administrators.


            For server core installations, run the following command:


            Secedit /Export /Areas User_Rights /cfg c:\path\filename.txt


            Review the text file.


            If any SIDs other than the following are granted the "SeRemoteInteractiveLogonRight" user right, this is a finding.


            S-1-5-32-544 (Administrators)'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
