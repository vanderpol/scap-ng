        name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:42101
      exports: []
      inline_content: 'This applies to member servers and stand-alone or nondomain-joined systems; it is not applicable for
        domain controllers. Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local
        Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> Security Options.
        If the value for "Accounts: Rename administrator account" is not set to a value other than "Administrator", this is
        a finding. For server core installations, run the following command: Secedit /Export /Areas SecurityPolicy /CFG C:\Path\FileName.Txt
        If "NewAdministratorName" is not something other than "Administrator" in the file, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:42101
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'This applies to member servers and stand-alone or nondomain-joined systems; it is not applicable for domain
            controllers.


            Verify the effective setting in Local Group Policy Editor.


            Run "gpedit.msc".


            Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local
            Policies >> Security Options.


            If the value for "Accounts: Rename administrator account" is not set to a value other than "Administrator", this
            is a finding.


            For server core installations, run the following command:


            Secedit /Export /Areas SecurityPolicy /CFG C:\Path\FileName.Txt


            If "NewAdministratorName" is not something other than "Administrator" in the file, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
