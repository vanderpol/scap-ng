            System\\\n\nValue Name: LegalNoticeText\n\nValue Type: REG_SZ\nValue: See message text below\n\nYou are accessing\
            \ a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only.\n\nBy using this\
            \ IS (which includes any device attached to this IS), you consent to the following conditions:\n\n-The USG routinely\
            \ intercepts and monitors communications on this IS for purposes including, but not limited to, penetration testing,\
            \ COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence\
