            \ and may be disclosed or used for any USG-authorized purpose.\n\n-This IS includes security measures (e.g., authentication\
            \ and access controls) to protect USG interests--not for your personal benefit or privacy.\n\n-Notwithstanding\
            \ the above, using this IS does not constitute consent to PM, LE or CI investigative searching or monitoring of\
            \ the content of privileged communications, or work product, related to personal representation or services by\
            \ attorneys, psychotherapists, or clergy, and their assistants. Such communications and work product are private\
            \ and confidential. See User Agreement for details."
