scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'If OpenSSH is not installed on the system, this requirement is not applicable. Verify any SSH connection to the
    system displays the Standard Mandatory DoW Notice and Consent Banner before granting access to the system. Check for the
    location of the banner file being used with the following command: C:\ > Get-Content "$env:ProgramData\ssh\sshd_config"
    | Select-String -Pattern ''^\s*Banner'' Banner C:\ProgramData\ssh\Banner.txt If "Banner" is set to "none", the line is
    commented out, or the line is missing, this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-285314r1256731_rule
    assessment_version: 1
    selector: default
