        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'If OpenSSH is not installed on the system, this requirement is NA.

            Verify the OpenSSH server is configured to force frequent session key renegotiation with the following command:


            C:\ > Get-Content "$env:ProgramData\ssh\sshd_config" | Select-String -Pattern ''^\s*RekeyLimit''


            RekeyLimit 1G 1h


            If "RekeyLimit" does not have a maximum data amount and maximum time defined, is missing, or is commented out,
            this is a finding.'
        name: check
