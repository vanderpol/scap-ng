    - name: title
      namespace: http://checklists.nist.gov/xccdf/1.2
      text: The Windows Server 2025 "Deny access to this computer from the network" user right on domain-joined member servers
        must be configured to prevent access from highly privileged domain accounts and local accounts and from unauthenticated
        access on all systems.
    - name: description
      namespace: http://checklists.nist.gov/xccdf/1.2
      text: '<VulnDiscussion>Inappropriately granting user rights provides system, administrative, and other high-level capabilities.


        The "Deny access to this computer from the network" user right defines the accounts that are prevented from logging
        on from the network.


        In an Active Directory Domain, denying logons to the Enterprise Admins and Domain Admins groups on lower-trust systems
        helps mitigate the risk of privilege escalation from credential theft attacks, which could lead to the compromise
        of an entire domain.


        Local accounts on domain-joined systems must also be assigned this right to decrease the risk of lateral movement
        resulting from credential theft attacks.


        The Guests group must be assigned this right to prevent unauthenticated access.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
