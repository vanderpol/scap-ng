  id: ng.manual.xccdf_mil.disa.stig_rule_SV-278187r1182301_rule
  version: 1
  description: The Windows Server 2025 "Deny log on locally" user right on domain-joined member servers must be configured
    to prevent access from highly privileged domain accounts and from unauthenticated access on all systems.
