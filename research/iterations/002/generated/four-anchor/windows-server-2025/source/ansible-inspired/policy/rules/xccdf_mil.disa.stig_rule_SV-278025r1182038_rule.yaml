  abstract: false
  check: 'Different methods are available to disable SMBv1 on Windows Server 2025, if WN25-00-000380 is configured, this is
    not applicable. If the following registry value is not configured as specified, this is a finding: Registry Hive: HKEY_LOCAL_MACHINE
    Registry Path: \SYSTEM\CurrentControlSet\Services\mrxsmb10\ Value Name: Start Type: REG_DWORD Value: 0x00000004 (4)'
