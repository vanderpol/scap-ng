  id: ng.manual.xccdf_mil.disa.stig_rule_SV-278090r1182274_rule
  version: 1
  description: Windows Server 2025 virtualization-based security must be enabled with the platform security level configured
    to Secure Boot or Secure Boot with DMA Protection.
  name: Windows Server 2025 virtualization-based security must be enabled with the platform security level configured to Secure
    Boot or Secure Boot with DMA Protection.
