    ref: '#xccdf_mil.disa.stig_platform_Windows_DomainController'
  extends: null
  fix: Configure the directory service to terminate LDAP-based network connections to the directory server after 5 minutes
    of inactivity. Open an elevated command prompt (run as administrator). Enter "ntdsutil". At the "ntdsutil:" prompt, enter
    "LDAP policies". At the "ldap policy:" prompt, enter "connections". At the "server connections:" prompt, enter "connect
    to server [host-name]" (where [host-name] is the computer name of the domain controller). At the "server connections:"
    prompt, enter "q". At the "ldap policy:" prompt, enter "Set MaxConnIdleTime to 300". Enter "Commit Changes" to save. Enter
    "Show values" to verify changes. Enter "q" at the "ldap policy:" and "ntdsutil:" prompts to exit.
