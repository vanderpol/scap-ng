        name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:5101
      exports: []
      inline_content: 'Note: If there is a documented and approved reason to omit data-at-rest encryption at the operating
        system level, such as encryption provided by a hypervisor or a disk storage array in a virtualized environment, this
        requirement is not applicable. Verify systems that require additional protections due to factors such as inadequate
        physical protection or sensitivity of the data employ encryption to protect the confidentiality and integrity of all
        information at rest. If there is no evidence that persistent user-generated data and operating system-specific configuration
        data are encrypted, this is a finding.'
      multi_check: null
      negate: null
