rule:
  abstract: false
  check: 'This applies to domain controllers. It is not applicable for other systems. Verify the following is configured in
    the Default Domain Policy: Open "Group Policy Management". Navigate to "Group Policy Objects" in the Domain being reviewed
    (Forest >> Domains >> Domain). Right-click the "Default Domain Policy". Select "Edit". Navigate to Computer Configuration
    >> Policies >> Windows Settings >> Security Settings >> Account Policies >> Kerberos Policy. If the "Maximum lifetime
    for user ticket renewal" is greater than "7" days, this is a finding.'
