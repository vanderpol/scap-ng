        name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:34701
      exports: []
      inline_content: 'This applies to domain controllers. It is not applicable for other systems. Security Option "Audit:
        Force audit policy subcategory settings (Windows 7 or later) to override audit policy category settings" must be set
        to "Enabled" (WN25-SO-000050) for the detailed auditing subcategories to be effective. Use the "AuditPol" tool to
        review the current Audit Policy configuration. Open PowerShell or a command prompt with elevated privileges ("Run
        as administrator"). Enter "AuditPol /get /category:*". Compare the "AuditPol" settings with the following. If the
        system does not audit the following, this is a finding: DS Access >> Directory Service Changes - Failure'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
