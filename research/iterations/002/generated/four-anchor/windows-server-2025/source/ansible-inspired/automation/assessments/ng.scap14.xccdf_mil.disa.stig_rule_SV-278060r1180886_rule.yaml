            text: WN25-AU-000200 - Windows Server 2025 must be configured to audit logon failures.
          - attributes:
              family: windows
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Microsoft Windows Server 2025
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "Maintaining an audit trail of system activity logs can help identify configuration errors, troubleshoot\
              \ service disruptions, and analyze compromises that have occurred, as well as detect attacks. Audit logs are\
              \ necessary to provide a trail of evidence in case the system or network is compromised. Collecting this data\
              \ is essential for analyzing the security of information assets and detecting signs of suspicious and unexpected\
              \ behavior.\n\n  Logon records user logons. If this is an interactive logon, it is recorded on the local system.\
              \ If it is to a network share, it is recorded on the system accessed.\n\n  Satisfies: SRG-OS-000032-GPOS-00013,\
              \ SRG-OS-000470-GPOS-00214, SRG-OS-000472-GPOS-00217, SRG-OS-000473-GPOS-00218, SRG-OS-000475-GPOS-00220"
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
        source_definition_id: oval:mil.disa.stig.windows2025:def:278060
