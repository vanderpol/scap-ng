        name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:56101
      exports: []
      inline_content: 'If OpenSSH is not installed on the system, this requirement is not applicable. Verify that "OpenSSH"
        is installed with the following command: C:\ > Get-WindowsCapability -Online | Where-Object Name -like ''OpenSSH*''
        Name : OpenSSH.Client~~~~0.0.1.0 State : Installed Name : OpenSSH.Server~~~~0.0.1.0 State : Installed If installed,
        verify the service is active with the following command: C:\ > Get-Service sshd Status Name DisplayName ----- -----
        ------------- Running sshd OpenSSH SSH Server If OpenSSH is installed and the "sshd" service is not "Running", this
        is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:56101
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'If OpenSSH is not installed on the system, this requirement is not applicable.


            Verify that "OpenSSH" is installed with the following command:


            C:\ > Get-WindowsCapability -Online | Where-Object Name -like ''OpenSSH*''


            Name : OpenSSH.Client~~~~0.0.1.0

            State   : Installed


            Name : OpenSSH.Server~~~~0.0.1.0

            State   : Installed


            If installed, verify the service is active with the following command:


            C:\ > Get-Service sshd


            Status       Name          DisplayName

            -----            -----              -------------

            Running   sshd            OpenSSH SSH Server


            If OpenSSH is installed and the "sshd" service is not "Running", this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
