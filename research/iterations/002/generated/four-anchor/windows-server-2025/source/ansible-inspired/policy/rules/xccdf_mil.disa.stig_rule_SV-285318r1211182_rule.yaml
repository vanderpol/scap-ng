rule:
  abstract: false
  check: 'If OpenSSH is not installed on the system, this requirement is not applicable. Verify the "ClientAliveCountMax"
    is set to "1" by performing the following command: C:\ > Get-Content "$env:ProgramData\ssh\sshd_config" | Select-String
    -Pattern ''^\s*ClientAliveCountMax'' ClientAliveCountMax 1 If "ClientAliveCountMax" does not exist, is not set to a value
    of "1", or is commented out, this is a finding.'
