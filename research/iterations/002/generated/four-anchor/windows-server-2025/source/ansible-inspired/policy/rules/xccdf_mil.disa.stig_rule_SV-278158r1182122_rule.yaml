scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'This applies to domain controllers. It is not applicable for other systems. Security Option "Audit: Force audit
    policy subcategory settings (Windows 7 or later) to override audit policy category settings" must be set to "Enabled"
    (WN25-SO-000050) for the detailed auditing subcategories to be effective. Use the "AuditPol" tool to review the current
    Audit Policy configuration. Open PowerShell or a command prompt with elevated privileges ("Run as administrator"). Enter
    "AuditPol /get /category:*". Compare the "AuditPol" settings with the following. If the system does not audit the following,
    this is a finding: DS Access >> Directory Service Changes - Failure'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-278158r1182122_rule
    assessment_version: 1
    selector: default
