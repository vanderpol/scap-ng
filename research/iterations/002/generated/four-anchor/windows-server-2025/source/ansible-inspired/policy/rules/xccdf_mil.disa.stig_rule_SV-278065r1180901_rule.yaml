scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Security Option "Audit: Force audit policy subcategory settings (Windows 7 or later) to override audit policy category
    settings" must be set to "Enabled" (WN25-SO-000050) for the detailed auditing subcategories to be effective. Use the "AuditPol"
    tool to review the current Audit Policy configuration. Open PowerShell or a command prompt with elevated privileges ("Run
    as administrator"). Enter "AuditPol /get /category:*" Compare the "AuditPol" settings with the following. If the system
    does not audit the following, this is a finding: Object Access >> Removable Storage - Failure Virtual machines or systems
    that use network attached storage may generate excessive audit events for secondary virtual drives or the network attached
    storage when this setting is enabled. This may be set to Not Configured in such cases and would not be a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-278065r1180901_rule
    assessment_version: 1
    selector: default
    source_selector: ''
