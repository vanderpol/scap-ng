scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Review the password never expires status for enabled user accounts. Open PowerShell. Domain Controllers: Enter "Search-ADAccount
    -PasswordNeverExpires -UsersOnly | FT Name, PasswordNeverExpires, Enabled". Exclude application accounts, disabled accounts
    (e.g., DefaultAccount, Guest), and the krbtgt account. If any enabled user accounts are returned with a "PasswordNeverExpires"
    status of "True", this is a finding. Member servers and stand-alone or nondomain-joined systems: Enter ''Get-CimInstance
    -Class Win32_Useraccount -Filter "PasswordExpires=False and LocalAccount=True" | FT Name, PasswordExpires, Disabled, LocalAccount''.
    Exclude application accounts and disabled accounts (e.g., DefaultAccount, Guest). If any enabled user accounts are returned
    with a "PasswordExpires" status of "False", this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-278005r1182259_rule
    assessment_version: 1
