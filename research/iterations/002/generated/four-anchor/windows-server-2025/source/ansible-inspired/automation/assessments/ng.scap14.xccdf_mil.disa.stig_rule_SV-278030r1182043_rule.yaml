        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Review the effective User Rights setting in Local Group Policy Editor.\n\nRun gpedit.msc.\n\nNavigate to\
            \ Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >>\
            \ User Rights Assignment.\n\nReview each User Right listed for any unresolved SIDs to determine whether they are\
            \ valid, such as due to being temporarily disconnected from the domain. (Unresolved SIDs have the format that\
            \ begins with \"*S-1-\".)\n\nIf any unresolved SIDs exist and are not for currently valid accounts or groups,\
            \ this is a finding.\n\nFor server core installations, run the following command:\n\nSecedit /export /areas USER_RIGHTS\
            \ /cfg c:\\path\\UserRights.txt\n\nThe results in the file identify user right assignments by SID instead of group\
            \ name. Review the SIDs to determine which are unidentified. A list of typical SIDs\\Groups is below; search Microsoft\
            \ for articles on well-known SIDs for others. \n\nIf any unresolved SIDs exist and are not for currently valid\
            \ accounts or groups, this is a finding.\n\nSID - Group\nS-1-5-11 - Authenticated Users\nS-1-5-113 - Local account\n\
            S-1-5-114 - Local account and member of Administrators group\nS-1-5-19 - Local Service\nS-1-5-20 - Network Service\n\
            S-1-5-32-544 - Administrators\nS-1-5-32-546 - Guests\nS-1-5-6 - Service\nS-1-5-9 - Enterprise Domain Controllers\n\
            S-1-5-domain-512 - Domain Admins\nS-1-5-root domain-519 - Enterprise Admins\nS-1-5-80-3139157870-2983391045-3678747466-658725712-1809340420\
            \ - NT Service\\WdiServiceHost"
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
