            text: WN25-SO-000370 - Windows Server 2025 default permissions of global system objects must be strengthened.
          - attributes:
              family: windows
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Microsoft Windows Server 2025
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: Windows systems maintain a global list of shared system resources such as DOS device names, mutexes, and
              semaphores. Each type of object is created with a default Discretionary Access Control List (DACL) that specifies
              who can access the objects with what permissions. When this policy is enabled, the default DACL is stronger,
              allowing nonadministrative users to read shared objects but not to modify shared objects they did not create.
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
        source_definition_id: oval:mil.disa.stig.windows2025:def:278231
