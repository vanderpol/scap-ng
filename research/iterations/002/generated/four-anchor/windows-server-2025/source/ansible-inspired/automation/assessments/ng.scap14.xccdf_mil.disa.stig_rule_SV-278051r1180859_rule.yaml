          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "Maintaining an audit trail of system activity logs can help identify configuration errors, troubleshoot\
              \ service disruptions, and analyze compromises that have occurred, as well as detect attacks. Audit logs are\
              \ necessary to provide a trail of evidence in case the system or network is compromised. Collecting this data\
              \ is essential for analyzing the security of information assets and detecting signs of suspicious and unexpected\
              \ behavior.\n\n  User Account Management records events such as creating, changing, deleting, renaming, disabling,\
              \ or enabling user accounts.\n\n  Satisfies: SRG-OS-000004-GPOS-00004, SRG-OS-000239-GPOS-00089, SRG-OS-000240-GPOS-00090,\
