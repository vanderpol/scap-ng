  conflicts: []
  default_check: default
  description: <VulnDiscussion>Credential Guard uses virtualization-based security to protect data that could be used in credential
    theft attacks if compromised. This authentication information, which was stored in the Local Security Authority (LSA)
    in previous versions of Windows, is isolated from the rest of operating system and can only be accessed by privileged
    system software.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
  effective_platform_refs:
  - '#xccdf_mil.disa.stig_platform_Windows_MemberServer'
  effective_platforms:
  - expression:
      children:
      - definition_binding:
          definition_id: oval:mil.disa.stig.win:def:100004
