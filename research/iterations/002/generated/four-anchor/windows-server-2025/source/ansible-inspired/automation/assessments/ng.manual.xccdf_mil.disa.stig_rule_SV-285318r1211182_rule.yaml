        name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:57101
      exports: []
      inline_content: 'If OpenSSH is not installed on the system, this requirement is not applicable. Verify the "ClientAliveCountMax"
        is set to "1" by performing the following command: C:\ > Get-Content "$env:ProgramData\ssh\sshd_config" | Select-String
        -Pattern ''^\s*ClientAliveCountMax'' ClientAliveCountMax 1 If "ClientAliveCountMax" does not exist, is not set to
        a value of "1", or is commented out, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:57101
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'If OpenSSH is not installed on the system, this requirement is not applicable.


            Verify the "ClientAliveCountMax" is set to "1" by performing the following command:


            C:\ > Get-Content "$env:ProgramData\ssh\sshd_config" | Select-String -Pattern ''^\s*ClientAliveCountMax''


            ClientAliveCountMax 1


            If "ClientAliveCountMax" does not exist, is not set to a value of "1", or is commented out, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
