scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'If the system is configured to write events directly to an audit server, this is not applicable. The registry configuration
    setting below must be set (at least) to a value equal to the size needed to contain one week''s worth of audit records
    in the security event log. The value used below is an example that assumes a typical week’s log size of 5GB. If a registry
    value does not exist or is not configured to hold one week of records, this is a finding: Note: The following registry
    entry is an example; the value must equal at least one week''s worth of records in the environment. Registry Hive: HKEY_LOCAL_MACHINE
    Registry Path: \SOFTWARE\Policies\Microsoft\Windows\EventLog\Security\ Value Name: MaxSize Type: REG_DWORD Value: 0x4E2000
    (5120000) (or greater)'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-278106r1211154_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-278106r1211154_rule
    assessment_version: 1
    selector: automated
    source_selector: automated
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-278106r1211154_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>Inadequate log size will cause the log to fill up quickly. This may prevent audit events from
    being recorded properly and require frequent attention by administrative personnel. System administrators (SAs) must monitor
    the volume of security event audit records and increase the registry value for the log size as needed.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
