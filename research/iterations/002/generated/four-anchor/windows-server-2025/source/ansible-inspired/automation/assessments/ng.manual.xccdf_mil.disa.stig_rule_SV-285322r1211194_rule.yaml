        name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:57901
      exports: []
      inline_content: 'If OpenSSH is not installed on the system, this requirement is not applicable. Verify the SSH public
        host key files permissions with the following command: C:\ > Get-ChildItem -Path "C:\ProgramData\ssh" -Filter "*key.pub"
        -File | ForEach-Object { icacls.exe $_.FullName } C:\ProgramData\ssh\ssh_host_ecdsa_key.pub BUILTIN\Administrators:(F)
        NT AUTHORITY\SYSTEM:(F) Successfully processed 1 files; Failed processing 0 files C:\ProgramData\ssh\ssh_host_ed25519_key.pub
        BUILTIN\Administrators:(F) NT AUTHORITY\SYSTEM:(F) Successfully processed 1 files; Failed processing 0 files C:\ProgramData\ssh\ssh_host_rsa_key.pub
        BUILTIN\Administrators:(F) NT AUTHORITY\SYSTEM:(F) Successfully processed 1 files; Failed processing 0 files If any
        public host key file does not have the default permission as in the example output, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:57901
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "If OpenSSH is not installed on the system, this requirement is not applicable.\n\nVerify the SSH public host\
            \ key files permissions with the following command:\n\nC:\\ > Get-ChildItem -Path \"C:\\ProgramData\\ssh\" -Filter\
            \ \"*key.pub\" -File | ForEach-Object { icacls.exe $_.FullName }\n\nC:\\ProgramData\\ssh\\ssh_host_ecdsa_key.pub\
            \ BUILTIN\\Administrators:(F)\n                                          NT AUTHORITY\\SYSTEM:(F)\n\nSuccessfully\
            \ processed 1 files; Failed processing 0 files\nC:\\ProgramData\\ssh\\ssh_host_ed25519_key.pub BUILTIN\\Administrators:(F)\n\
            \                                            NT AUTHORITY\\SYSTEM:(F)\n\nSuccessfully processed 1 files; Failed\
            \ processing 0 files\nC:\\ProgramData\\ssh\\ssh_host_rsa_key.pub BUILTIN\\Administrators:(F)\n               \
            \                         NT AUTHORITY\\SYSTEM:(F)\n\nSuccessfully processed 1 files; Failed processing 0 files\n\
            \nIf any public host key file does not have the default permission as in the example output, this is a finding."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
