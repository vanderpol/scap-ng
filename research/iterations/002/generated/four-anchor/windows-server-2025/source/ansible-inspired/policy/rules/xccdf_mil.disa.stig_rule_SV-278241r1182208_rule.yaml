rule:
  abstract: false
  check: 'Verify the effective setting in Local Group Policy Editor. Run gpedit.msc. Navigate to Local Computer Policy >>
    Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment. If any accounts
    or groups are granted the "Access Credential Manager as a trusted caller" user right, this is a finding. For server core
    installations, run the following command: Secedit /Export /Areas User_Rights /cfg c:\path\filename.txt Review the text
    file. If any SIDs are granted the "SeTrustedCredManAccessPrivilege" user right, this is a finding.'
