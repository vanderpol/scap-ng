  cluster_id: null
  conflicts: []
  default_check: default
  description: '<VulnDiscussion>The use of complex passwords increases their strength against attack. The built-in Windows
    password complexity policy requires passwords to contain at least three of the four types of characters (numbers, uppercase
    and lowercase letters, and special characters) and prevents the inclusion of user names or parts of user names. Satisfies:
    SRG-OS-000069-GPOS-00037, SRG-OS-000070-GPOS-00038, SRG-OS-000071-GPOS-00039, SRG-OS-000266-GPOS-00101</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
