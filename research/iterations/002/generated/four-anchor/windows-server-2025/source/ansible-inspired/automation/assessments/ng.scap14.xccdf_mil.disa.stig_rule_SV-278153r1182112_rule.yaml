          mask:
            origin: xsd_default
            value: 'false'
          operation:
            origin: xsd_default
            value: equals
        kind: element
        name: command
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
        value: '$path = ''AD:\CN=RID Manager$,CN=System,'' + (Get-ADDomain).DistinguishedName; $aud = (Get-Acl $path -Audit).Audit;
          $hasFail = [bool]($aud | Where-Object {$_.IdentityReference -match ''Everyone|S-1-1-0'' -and $_.AuditFlags -eq ''Failure''
          -and ($_.ActiveDirectoryRights -match ''GenericAll|FullControl|All'')}); $hasSucc = [bool]($aud | Where-Object {$_.IdentityReference
          -match ''Everyone|S-1-1-0'' -and $_.AuditFlags -eq ''Success'' -and ($_.ActiveDirectoryRights -match ''ExtendedRight|WriteProperty'')});
          . { if (-not $hasFail -or -not $hasSucc) { $reasons = @(); if (-not $hasFail) { $reasons += ''MISSING: Everyone
          -> Failure -> GenericAll/FullControl audit policy'' }; if (-not $hasSucc) { $reasons += ''MISSING: Everyone -> Success
          -> ExtendedRight/WriteProperty audit policy'' }; [PSCustomObject]@{ Target_Object = $path.Replace(''AD:\'','''');
          IdentityReference = ''Everyone (S-1-1-0)''; Status = ''FAIL''; Details = ($reasons -join '' | '') } } else { [PSCustomObject]@{
          Target_Object = $path.Replace(''AD:\'',''''); IdentityReference = ''Everyone (S-1-1-0)''; Status = ''PASS''; Details
          = ''All mandatory Failure and Success audit policies are correctly configured per the STIG.'' } } } | Format-Table
          -AutoSize | Out-String -Width 4096'
