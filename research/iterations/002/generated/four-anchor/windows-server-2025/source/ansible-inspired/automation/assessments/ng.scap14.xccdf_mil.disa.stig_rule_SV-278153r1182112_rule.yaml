  name: Windows Server 2025 Active Directory (AD) RID Manager$ object must be configured with proper audit settings.
  steps:
  - name: Collect oval:navy.navwar.niwcatlantic.scc.windows:obj:27815301
    collect:
      capability: scapng.collect.independent.shellcommand
      object_title: Query both Fail and Success auditing settings for RID Manager$
      query:
