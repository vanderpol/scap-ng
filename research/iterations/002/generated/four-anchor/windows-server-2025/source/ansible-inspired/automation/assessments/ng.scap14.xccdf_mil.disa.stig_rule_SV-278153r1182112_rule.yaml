        name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:33701
      exports: []
      inline_content: 'This applies to domain controllers. It is not applicable for other systems. Review the auditing configuration
        for the "RID Manager$" object. Open "Active Directory Users and Computers" (available from various menus or run "dsa.msc").
        Verify "Advanced Features" is selected in the "View" menu. Select "System" under the domain being reviewed in the
        left pane. Right-click the "RID Manager$" object in the right pane and select "Properties". Select the "Security"
        tab. Select "Advanced", and then select the "Auditing" tab. If the audit settings on the "RID Manager$" object are
        not at least as inclusive as those below, this is a finding: Type - Fail Principal - Everyone Access - Full Control
        Inherited from - None The success types listed below are defaults. Where Special is listed in the summary screens
        for Access, detailed Permissions are provided for reference. Various Properties selections may also exist by default.
        Type - Success Principal - Everyone Access - Special Inherited from - None (Access - Special = Write all properties,
        All extended rights, Change RID master) Two instances with the following summary information will be listed: Type
        - Success Principal - Everyone Access - (blank) Inherited from - (CN of domain)'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:33701
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "This applies to domain controllers. It is not applicable for other systems.\n\nReview the auditing configuration\
            \ for the \"RID Manager$\" object.\n\nOpen \"Active Directory Users and Computers\" (available from various menus\
            \ or run \"dsa.msc\").\n\nVerify \"Advanced Features\" is selected in the \"View\" menu.\n\nSelect \"System\"\
            \ under the domain being reviewed in the left pane.\n\nRight-click the \"RID Manager$\" object in the right pane\
            \ and select \"Properties\".\n\nSelect the \"Security\" tab.\n\nSelect \"Advanced\", and then select the \"Auditing\"\
            \ tab.\n\nIf the audit settings on the \"RID Manager$\" object are not at least as inclusive as those below, this\
            \ is a finding:\n\nType - Fail\nPrincipal - Everyone\nAccess - Full Control\nInherited from - None\n\nThe success\
            \ types listed below are defaults. Where Special is listed in the summary screens for Access, detailed Permissions\
            \ are provided for reference. Various Properties selections may also exist by default.\n\nType - Success\nPrincipal\
            \ - Everyone\nAccess - Special\nInherited from - None\n (Access - Special = Write all properties, All extended\
            \ rights, Change RID master)\n\nTwo instances with the following summary information will be listed:\n\nType -\
            \ Success\nPrincipal - Everyone\nAccess - (blank)\nInherited from - (CN of domain)"
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
