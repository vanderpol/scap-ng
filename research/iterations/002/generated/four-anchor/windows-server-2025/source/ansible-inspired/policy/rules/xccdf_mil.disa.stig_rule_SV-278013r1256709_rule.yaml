scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Review temporary user accounts for expiration dates. Determine if temporary user accounts are used and identify
    any that exist. If none exist, this is not applicable. Domain Controllers: Open PowerShell. Enter "Search-ADAccount -AccountExpiring
    | FT Name, AccountExpirationDate". If "AccountExpirationDate" has not been defined within 72 hours for any temporary user
    account, this is a finding. Member servers and stand-alone or nondomain-joined systems: Open command prompt. Run "Net
    user [username]", where [username] is the name of the temporary user account. If "Account expires" has not been defined
    within 72 hours for any temporary user account, this is a finding.'
  checks:
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-278013r1256709_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-278013r1256709_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>If temporary user accounts remain active when no longer needed or for an excessive period,
    these accounts may be used to gain unauthorized access. To mitigate this risk, automated termination of all temporary
    accounts must be set upon account creation. Temporary accounts are established as part of normal account activation procedures
    when there is a need for short-term accounts without the demand for immediacy in account activation. If temporary accounts
    are used, the operating system must be configured to automatically terminate these types of accounts after a DoW-defined
    time period of 72 hours. To address access requirements, many operating systems may be integrated with enterprise-level
    authentication/access mechanisms that meet or exceed access control policy requirements.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
