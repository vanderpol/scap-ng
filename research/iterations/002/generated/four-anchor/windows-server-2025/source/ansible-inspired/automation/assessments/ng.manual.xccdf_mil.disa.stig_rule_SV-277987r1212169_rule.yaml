        name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:901
      exports: []
      inline_content: 'Determine whether organization policy, at a minimum, prohibits administrative accounts from using applications
        that access the internet or other public-facing networks. These applications include web browsers or applications
        with potential internet sources, such as email, except as necessary for local service administration. The policy must
        define specific exceptions for local service administration. These exceptions may include HTTP(S)-based tools that
        are used for the administration of the local system, services, or attached devices. Determine whether the organization
        uses technical means, such as allow listing via AppLocker or Software Restriction Policies (SRPs), to prevent administrative
        accounts'' use of browsers and email applications. Note: Allow list tools facilitate defining rules that explicitly
        permit approved applications to run while blocking all others by default. Administrative accounts that do not have
        technical restrictions to applications that access public-facing networks must be documented and approved by the information
        system security officer (ISSO) or authorizing official (AO). If administrative access to applications that access
        public-facing networks is not blocked by technical means (except as approved by the AO), this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:901
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Determine whether organization policy, at a minimum, prohibits administrative accounts from using applications\
            \ that access the internet or other public-facing networks. These applications include web browsers or applications\
            \ with potential internet sources, such as email, except as necessary for local service administration.\n\nThe\
            \ policy must define specific exceptions for local service administration. These exceptions may include HTTP(S)-based\
            \ tools that are used for the administration of the local system, services, or attached devices.\n\nDetermine\
            \ whether the organization uses technical means, such as allow listing via AppLocker or Software Restriction Policies\
            \ (SRPs), to prevent administrative accounts' use of browsers and email applications. \n\nNote: Allow list tools\
            \ facilitate defining rules that explicitly permit approved applications to run while blocking all others by default.\n\
            \nAdministrative accounts that do not have technical restrictions to applications that access public-facing networks\
            \ must be documented and approved by the information system security officer (ISSO) or authorizing official (AO).\n\
            \nIf administrative access to applications that access public-facing networks is not blocked by technical means\
            \ (except as approved by the AO), this is a finding."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
