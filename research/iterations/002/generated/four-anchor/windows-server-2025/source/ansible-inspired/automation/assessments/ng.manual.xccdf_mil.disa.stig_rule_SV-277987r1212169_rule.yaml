  id: ng.manual.xccdf_mil.disa.stig_rule_SV-277987r1212169_rule
  version: 1
  description: Windows Server 2025 administrative accounts must not be used with applications that access the internet, such
    as web browsers, or with potential internet sources, such as email.
  name: Windows Server 2025 administrative accounts must not be used with applications that access the internet, such as web
    browsers, or with potential internet sources, such as email.
