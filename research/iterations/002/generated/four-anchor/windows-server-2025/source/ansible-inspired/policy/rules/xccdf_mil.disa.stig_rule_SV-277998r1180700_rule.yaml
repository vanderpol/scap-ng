scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'The default permissions are adequate when the Security Option "Network access: Let Everyone permissions apply to
    anonymous users" is set to "Disabled" (WN25-SO-000240). Review the permissions for the system drive''s root directory
    (usually C:\). Nonprivileged groups such as Users or Authenticated Users must not have greater than "Read & execute" permissions
    except where noted as defaults. Individual accounts must not be used to assign permissions. If permissions are not as
    restrictive as the default permissions listed below, this is a finding. Viewing in File Explorer: View the Properties
    of the system drive''s root directory. Select the "Security" tab, and then click "Advanced". Default permissions: C:\
    Type - "Allow" for all Inherited from - "None" for all Principal - Access - Applies to SYSTEM - Full control - This folder,
    subfolders, and files Administrators - Full control - This folder, subfolders, and files Users - Read & execute - This
    folder, subfolders, and files Users - Create folders/append data - This folder and subfolders Users - Create files/write
    data - Subfolders only CREATOR OWNER - Full Control - Subfolders and files only Alternately, use icacls: Open "command
    prompt (Admin)". Enter "icacls" followed by the directory: "icacls c:\" The following results must be displayed: c:\ NT
    AUTHORITY\SYSTEM:(OI)(CI)(F) BUILTIN\Administrators:(OI)(CI)(F) BUILTIN\Users:(OI)(CI)(RX) BUILTIN\Users:(CI)(AD) BUILTIN\Users:(CI)(IO)(WD)
    CREATOR OWNER:(OI)(CI)(IO)(F) Successfully processed 1 files; Failed processing 0 files'
  checks:
