authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'This applies to member servers and stand-alone or nondomain-joined systems. A separate version applies to domain
    controllers. Verify the effective setting in Local Group Policy Editor. Run gpedit.msc. Navigate to Local Computer Policy
    >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment. If the
    following accounts or groups are not defined for the "Deny log on as a service" user right on domain-joined systems, this
    is a finding: - Enterprise Admins Group. - Domain Admins Group. If any accounts or groups are defined for the "Deny log
    on as a service" user right on nondomain-joined systems, this is a finding. For server core installations, run the following
    command: Secedit /Export /Areas User_Rights /cfg c:\path\filename.txt Review the text file. If the following SIDs are
    not defined for the "SeDenyServiceLogonRight" user right on domain-joined systems, this is a finding: S-1-5-root domain-519
    (Enterprise Admins) S-1-5-domain-512 (Domain Admins) If any SIDs are defined for the user right on nondomain-joined systems,
    this is a finding.'
