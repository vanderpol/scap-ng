assessment:
  id: ng.scap14.xccdf_mil.disa.stig_rule_SV-278149r1182104_rule
  version: 1
  description: Windows Server 2025 Active Directory (AD) Domain object must be configured with proper audit settings.
  semantic_model: scap-ng-generic-assessment-graph-0.1
  name: Windows Server 2025 Active Directory (AD) Domain object must be configured with proper audit settings.
  steps:
  - name: Collect oval:navy.navwar.niwcatlantic.scc.windows:obj:27814901
    collect:
      capability: scapng.collect.independent.shellcommand
      object_title: Query both Fail and Success auditing settings for Domain Organizational Unit (OU)
      query:
      - attributes:
          error_if_stderr_exists: 'true'
        kind: element
        name: behaviors
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
      - kind: element
        name: shell
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
        value: powershell
      - kind: element
        name: command
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
        value: '$path = ''AD:\'' + (Get-ADDomain).DistinguishedName; $aud = (Get-Acl $path -Audit).Audit; $hasFail = [bool]($aud
          | Where-Object {$_.IdentityReference -match ''Everyone|S-1-1-0'' -and $_.AuditFlags -eq ''Failure'' -and ($_.ActiveDirectoryRights
          -match ''GenericAll|FullControl|All'')}); $hasSucc = [bool]($aud | Where-Object {$_.IdentityReference -match ''Everyone|S-1-1-0''
          -and $_.AuditFlags -eq ''Success'' -and ($_.ActiveDirectoryRights -match ''ExtendedRight|WriteProperty'')}); . {
          if (-not $hasFail -or -not $hasSucc) { $reasons = @(); if (-not $hasFail) { $reasons += ''MISSING: Everyone -> Failure
          -> GenericAll/FullControl audit policy'' }; if (-not $hasSucc) { $reasons += ''MISSING: Everyone -> Success -> ExtendedRight/WriteProperty
          audit policy'' }; [PSCustomObject]@{ Target_Object = $path.Replace(''AD:\'',''''); IdentityReference = ''Everyone
          (S-1-1-0)''; Status = ''FAIL''; Details = ($reasons -join '' | '') } } else { [PSCustomObject]@{ Target_Object =
          $path.Replace(''AD:\'',''''); IdentityReference = ''Everyone (S-1-1-0)''; Status = ''PASS''; Details = ''All mandatory
          Failure and Success audit policies are correctly configured per the STIG.'' } } } | Format-Table -AutoSize | Out-String
          -Width 4096'
      - kind: element
        name: pattern
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
        value: .+
      source_namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
      source_object_id: oval:navy.navwar.niwcatlantic.scc.windows:obj:27814901
