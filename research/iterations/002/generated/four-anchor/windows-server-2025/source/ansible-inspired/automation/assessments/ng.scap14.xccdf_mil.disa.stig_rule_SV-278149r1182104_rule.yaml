        name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:32901
      exports: []
      inline_content: 'This applies to domain controllers. It is not applicable for other systems. Review the auditing configuration
        for the Domain object. Open "Active Directory Users and Computers" (available from various menus or run "dsa.msc").
        Verify "Advanced Features" is selected in the "View" menu. Select the domain being reviewed in the left pane. Right-click
        the domain name, and then select "Properties". Select the "Security" tab. Select "Advanced", and then select the "Auditing"
        tab. If the audit settings on the Domain object are not at least as inclusive as those below, this is a finding: Type
        - Fail Principal - Everyone Access - Full Control Inherited from - None Applies to - This object only The success
        types listed below are defaults. Where Special is listed in the summary screens for Access, detailed Permissions are
        provided for reference. Various Properties selections may also exist by default. Two instances with the following
        summary information will be listed: Type - Success Principal - Everyone Access - (blank) Inherited from - None Applies
        to - Special Type - Success Principal - Domain Users Access - All extended rights Inherited from - None Applies to
        - This object only Type - Success Principal - Administrators Access - All extended rights Inherited from - None Applies
        to - This object only Type - Success Principal - Everyone Access - Special Inherited from - None Applies to - This
        object only (Access - Special = Permissions: Write all properties, Modify permissions, Modify owner)'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
