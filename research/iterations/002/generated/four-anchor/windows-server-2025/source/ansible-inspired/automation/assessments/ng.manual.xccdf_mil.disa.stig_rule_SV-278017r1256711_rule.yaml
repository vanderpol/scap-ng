          text: "Open PowerShell or a Command prompt.\n\nType \" ipconfig /all\".\n\nReview the resulting display for existence\
            \ of  a Wireless LAN or Wi-Fi connection.\n\nIf none are listed, issue the following command in PowerShell:\n\n\
