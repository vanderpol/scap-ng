        name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:6701
      exports: []
      inline_content: 'Open PowerShell or a Command prompt. Type " ipconfig /all". Review the resulting display for existence
        of a Wireless LAN or Wi-Fi connection. If none are listed, issue the following command in PowerShell: Get-NetAdapter
        | Where-Object PhysicalMediaType -eq "Native 802.11" Note: This command isolates the search to physical Wi-Fi adapters
        using the standard 802.11 wireless specification and does not rely on the adapter still having its default system
        name. If there is a Wi-Fi or Wireless LAN connection listed, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
