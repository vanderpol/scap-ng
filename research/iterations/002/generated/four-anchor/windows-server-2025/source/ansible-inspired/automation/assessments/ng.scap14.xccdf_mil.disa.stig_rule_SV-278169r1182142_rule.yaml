            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "Inappropriately granting user rights provides system, administrative, and other high-level capabilities.\n\
              \n  The \"Deny log on as a batch job\" user right defines accounts that are prevented from logging on to the\
              \ system as a batch job, such as Task Scheduler.\n\n  The Guests group must be assigned to prevent unauthenticated\
