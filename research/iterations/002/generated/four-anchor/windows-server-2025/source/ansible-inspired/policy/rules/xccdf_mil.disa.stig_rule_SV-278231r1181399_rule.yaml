  default_check: default
  description: <VulnDiscussion>Windows systems maintain a global list of shared system resources such as DOS device names,
    mutexes, and semaphores. Each type of object is created with a default Discretionary Access Control List (DACL) that specifies
    who can access the objects with what permissions. When this policy is enabled, the default DACL is stronger, allowing
    nonadministrative users to read shared objects but not to modify shared objects they did not create.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
