            text: WN25-CC-000230 - Windows Server 2025 AutoPlay must be disabled for all drives.
          - attributes:
              family: windows
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Microsoft Windows Server 2025
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: Allowing AutoPlay to execute may introduce malicious code to a system. AutoPlay begins reading from a drive
              as soon media is inserted into the drive. As a result, the setup file of programs or music on audio media may
              start. By default, AutoPlay is disabled on removable drives, such as the floppy disk drive (but not the CD-ROM
              drive) and on network drives. Enabling this policy disables AutoPlay on all drives.
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
