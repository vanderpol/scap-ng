        name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:4301
      exports: []
      inline_content: 'Review the password never expires status for enabled user accounts. Open PowerShell. Domain Controllers:
        Enter "Search-ADAccount -PasswordNeverExpires -UsersOnly | FT Name, PasswordNeverExpires, Enabled". Exclude application
        accounts, disabled accounts (e.g., DefaultAccount, Guest), and the krbtgt account. If any enabled user accounts are
        returned with a "PasswordNeverExpires" status of "True", this is a finding. Member servers and stand-alone or nondomain-joined
        systems: Enter ''Get-CimInstance -Class Win32_Useraccount -Filter "PasswordExpires=False and LocalAccount=True" |
        FT Name, PasswordExpires, Disabled, LocalAccount''. Exclude application accounts and disabled accounts (e.g., DefaultAccount,
        Guest). If any enabled user accounts are returned with a "PasswordExpires" status of "False", this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:4301
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Review the password never expires status for enabled user accounts.


            Open PowerShell.


            Domain Controllers:


            Enter "Search-ADAccount -PasswordNeverExpires -UsersOnly | FT Name, PasswordNeverExpires, Enabled".


            Exclude application accounts, disabled accounts (e.g., DefaultAccount, Guest), and the krbtgt account.


            If any enabled user accounts are returned with a "PasswordNeverExpires" status of "True", this is a finding.


            Member servers and stand-alone or nondomain-joined systems:


            Enter ''Get-CimInstance -Class Win32_Useraccount -Filter "PasswordExpires=False and LocalAccount=True" | FT Name,
            PasswordExpires, Disabled, LocalAccount''.


            Exclude application accounts and disabled accounts (e.g., DefaultAccount, Guest).


