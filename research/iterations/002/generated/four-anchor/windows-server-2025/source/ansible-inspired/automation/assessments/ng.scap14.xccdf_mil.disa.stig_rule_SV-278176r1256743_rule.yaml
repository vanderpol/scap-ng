        metadata:
          children:
          - name: title
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: The password for the krbtgt account on a domain must be reset at least every 180 days.
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'The krbtgt account acts as a service account for the Kerberos Key Distribution Center (KDC) service. The
              account and password are created when a domain is created and the password is typically not changed. If the
              krbtgt account is compromised, attackers can create valid Kerberos Ticket Granting Tickets (TGT).


              The password must be changed twice to effectively remove the password history. Changing once, waiting for replication
              to complete and the amount of time equal to or greater than the maximum Kerberos ticket lifetime, and changing
              again reduces the risk of issues.'
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
        source_definition_id: oval:navy.navwar.niwcatlantic.scc.windows:def:278176
        version: '1'
