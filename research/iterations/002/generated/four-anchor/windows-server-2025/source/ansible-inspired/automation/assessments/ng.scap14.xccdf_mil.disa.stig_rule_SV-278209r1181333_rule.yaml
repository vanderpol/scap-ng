          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "If the following registry value does not exist or is not configured as specified, this is a finding:\n\n\
            Registry Hive: HKEY_LOCAL_MACHINE \nRegistry Path: \\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon\\\
            \n \nValue Name: scremoveoption\n\nValue Type: REG_SZ\nValue: 1 (Lock Workstation) or 2 (Force Logoff)\n\nIf configuring\
            \ this on servers causes issues, such as terminating users' remote sessions, and the organization has a policy\
            \ in place that any other sessions on the servers, such as administrative console logons, are manually locked\
            \ or logged off when unattended or not in use, this would be acceptable. This must be documented with the information\
            \ system security officer (ISSO)."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
