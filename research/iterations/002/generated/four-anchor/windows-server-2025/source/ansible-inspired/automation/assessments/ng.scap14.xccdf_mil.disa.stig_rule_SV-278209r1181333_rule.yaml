      exports: []
      inline_content: 'If the following registry value does not exist or is not configured as specified, this is a finding:
        Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\ Value Name:
        scremoveoption Value Type: REG_SZ Value: 1 (Lock Workstation) or 2 (Force Logoff) If configuring this on servers causes
        issues, such as terminating users'' remote sessions, and the organization has a policy in place that any other sessions
        on the servers, such as administrative console logons, are manually locked or logged off when unattended or not in
        use, this would be acceptable. This must be documented with the information system security officer (ISSO).'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
