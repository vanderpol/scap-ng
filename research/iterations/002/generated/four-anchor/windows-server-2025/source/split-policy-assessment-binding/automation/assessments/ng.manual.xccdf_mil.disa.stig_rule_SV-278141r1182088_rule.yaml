assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-278141r1182088_rule
  version: 1
  description: Windows Server 2025 Active Directory Domain Controllers Organizational Unit (OU) object must have the proper
    access control permissions.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:31301
    exports: []
    inline_content: This applies to domain controllers. It is not applicable for other systems. Review the permissions on
      the Domain Controllers OU. Open "Active Directory Users and Computers" (available from various menus or run "dsa.msc").
      Select "Advanced Features" in the "View" menu if not previously selected. Select the "Domain Controllers" OU (folder
      in folder icon). Right-click and select "Properties". Select the "Security" tab. If the permissions on the Domain Controllers
      OU do not restrict changes to System, Domain Admins, Enterprise Admins and Administrators, this is a finding. The default
      permissions listed below satisfy this requirement. Domains supporting Microsoft Exchange will have additional Exchange
      related permissions on the Domain Controllers OU. These may include some change-related permissions and is not a finding.
      The permissions shown are at the summary level. To view more detailed permissions, select "Advanced", then select the
      desired Permission entry, then click "View" or "Edit". Except where noted otherwise, the special permissions may include
      a wide range of permissions and properties and are acceptable for this requirement. CREATOR OWNER - Special permissions
      SELF - Special permissions Authenticated Users - Read, Special permissions The special permissions for Authenticated
      Users are Read types. If detailed permissions include any Create, Delete, Modify, or Write Permissions or Properties,
      this is a finding. SYSTEM - Full Control Domain Admins - Read, Write, Create all child objects, Generate resultant set
      of policy (logging), Generate resultant set of policy (planning), Special permissions Enterprise Admins - Full Control
      Key Admins - Special permissions Enterprise Key Admins - Special permissions Administrators - Read, Write, Create all
      child objects, Generate resultant set of policy (logging), Generate resultant set of policy (planning), Special permissions
      Pre-Windows 2000 Compatible Access - Special permissions The Special permissions for Pre-Windows 2000 Compatible Access
      are Read types. If detailed permissions include any Create, Delete, Modify, or Write Permissions or Properties, this
      is a finding. ENTERPRISE DOMAIN CONTROLLERS - Read, Special permissions
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
      children:
      - attributes:
          href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
          name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:31301
        name: check-content-ref
        namespace: http://checklists.nist.gov/xccdf/1.2
      - name: check-content
        namespace: http://checklists.nist.gov/xccdf/1.2
        text: 'This applies to domain controllers. It is not applicable for other systems.


          Review the permissions on the Domain Controllers OU.


          Open "Active Directory Users and Computers" (available from various menus or run "dsa.msc").


          Select "Advanced Features" in the "View" menu if not previously selected.


          Select the "Domain Controllers" OU (folder in folder icon).


          Right-click and select "Properties".


          Select the "Security" tab.


          If the permissions on the Domain Controllers OU do not restrict changes to System, Domain Admins, Enterprise Admins
          and Administrators, this is a finding.


          The default permissions listed below satisfy this requirement.


          Domains supporting Microsoft Exchange will have additional Exchange related permissions on the Domain Controllers
          OU. These may include some change-related permissions and is not a finding.


          The permissions shown are at the summary level. To view more detailed permissions, select "Advanced", then select
          the desired Permission entry, then click "View" or "Edit".


          Except where noted otherwise, the special permissions may include a wide range of permissions and properties and
          are acceptable for this requirement.


          CREATOR OWNER - Special permissions


          SELF - Special permissions


          Authenticated Users - Read, Special permissions


          The special permissions for Authenticated Users are Read types.


          If detailed permissions include any Create, Delete, Modify, or Write Permissions or Properties, this is a finding.


          SYSTEM - Full Control


          Domain Admins - Read, Write, Create all child objects, Generate resultant set of policy (logging), Generate resultant
          set of policy (planning), Special permissions


          Enterprise Admins - Full Control


          Key Admins - Special permissions


          Enterprise Key Admins - Special permissions


          Administrators - Read, Write, Create all child objects, Generate resultant set of policy (logging), Generate resultant
          set of policy (planning), Special permissions


          Pre-Windows 2000 Compatible Access - Special permissions


          The Special permissions for Pre-Windows 2000 Compatible Access are Read types.


          If detailed permissions include any Create, Delete, Modify, or Write Permissions or Properties, this is a finding.


          ENTERPRISE DOMAIN CONTROLLERS - Read, Special permissions'
      name: check
      namespace: http://checklists.nist.gov/xccdf/1.2
    system: http://scap.nist.gov/schema/ocil/2
