rule:
  id: xccdf_mil.disa.stig_rule_SV-278246r1182213_rule
  title: The Windows Server 2025 "Create a token object" user right must not be assigned to any groups or accounts.
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
