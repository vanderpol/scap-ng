  fix: If no antivirus software is in use, install Microsoft Defender or third-party antivirus. Open PowerShell. Enter "Install-WindowsFeature
    -Name Windows-Defender". For third-party antivirus, install per antivirus instructions and disable Windows Defender. Open
    PowerShell. Enter "Uninstall-WindowsFeature -Name Windows-Defender".
