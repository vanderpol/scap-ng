assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-285315r1256733_rule
  version: 1
  description: Windows Server 2025 OpenSSH must accept public key authentication.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:56501
    exports: []
    inline_content: 'If OpenSSH is not installed on the system, this requirement is not applicable. If the system administrator
      demonstrates the use of an approved alternate multifactor authentication method, this requirement is not applicable.
      Verify the system accepts public key encryption with the following command: C:\ > Get-Content "$env:ProgramData\ssh\sshd_config"
      | Select-String -Pattern ''^\s*PubkeyAuthentication'' PubkeyAuthentication yes If "PubkeyAuthentication" is set to "no",
      the line is commented out, or the line is missing, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
