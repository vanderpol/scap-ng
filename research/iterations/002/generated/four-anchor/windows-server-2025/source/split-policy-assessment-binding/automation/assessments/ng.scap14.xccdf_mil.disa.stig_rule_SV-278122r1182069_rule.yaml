      exports: []
      inline_content: 'The default behavior is for Internet Explorer to warn users and select whether to allow or refuse installation
        when a web-based program attempts to install software on the system. If the registry value name below does not exist,
        this is not a finding. If it exists and is configured with a value of "0", this is not a finding. If it exists and
        is configured with a value of "1", this is a finding. Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows\Installer\
        Value Name: SafeForScripting Value Type: REG_DWORD Value: 0x00000000 (0) (or if the Value Name does not exist)'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
