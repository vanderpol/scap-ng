  description: <VulnDiscussion>Permitting passwords to be changed in immediate succession within the same day allows users
    to cycle passwords through their history database. This enables users to effectively negate the purpose of mandating periodic
    password changes.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
