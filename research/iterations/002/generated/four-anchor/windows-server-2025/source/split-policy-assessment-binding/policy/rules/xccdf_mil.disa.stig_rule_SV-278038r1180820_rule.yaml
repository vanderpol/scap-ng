  check: 'Verify the effective setting in Local Group Policy Editor. Run gpedit.msc. Navigate to Local Computer Policy >>
    Computer Configuration >> Windows Settings >> Security Settings >> Account Policies >> Password Policy. If the value for
    the "Minimum password age" is set to "0" days ("Password can be changed immediately"), this is a finding. For server core
    installations, run the following command: Secedit /Export /Areas SecurityPolicy /CFG C:\Path\FileName.Txt If "MinimumPasswordAge"
    equals "0" in the file, this is a finding.'
