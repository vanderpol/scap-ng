            text: "Certain encryption types are no longer considered secure. The DES and RC4 encryption suites must not be\
              \ used for Kerberos encryption.\n\n  Note: Organizations with domain controllers running earlier versions of\
              \ Windows where RC4 encryption is enabled, which select \"The other domain supports Kerberos AES Encryption\"\
