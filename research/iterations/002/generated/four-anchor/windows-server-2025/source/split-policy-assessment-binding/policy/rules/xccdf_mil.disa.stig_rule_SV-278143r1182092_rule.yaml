scap_ng: 0.1-prototype
prototype: true
rule:
  id: xccdf_mil.disa.stig_rule_SV-278143r1182092_rule
  title: Windows Server 2025 data files owned by users must be on a different logical partition from the directory server
    data files.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-278143
  description: <VulnDiscussion>When directory service data files, especially for directories used for identification, authentication,
    or authorization, reside on the same logical partition as user-owned files, the directory service data may be more vulnerable
    to unauthorized access or other availability compromises. Directory service and user-owned data files sharing a partition
    may be configured with less restrictive permissions to allow access to the user data. The directory service may be vulnerable
    to a denial-of-service (DoS) attack when user-owned files on a common partition are expanded to an extent preventing the
    directory service from acquiring more space for directory or audit data.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
