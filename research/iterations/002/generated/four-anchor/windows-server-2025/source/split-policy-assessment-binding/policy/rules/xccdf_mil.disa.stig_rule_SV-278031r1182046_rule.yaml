rule:
  id: xccdf_mil.disa.stig_rule_SV-278031r1182046_rule
  title: Windows Server 2025 systems must have Unified Extensible Firmware Interface (UEFI) firmware and be configured to
    run in UEFI mode, not Legacy BIOS.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
