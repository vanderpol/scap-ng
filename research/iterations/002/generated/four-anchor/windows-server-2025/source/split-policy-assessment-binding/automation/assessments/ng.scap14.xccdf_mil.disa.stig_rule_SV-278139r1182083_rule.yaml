        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "This applies to domain controllers. It is not applicable for other systems.\n\nOpen a command prompt.\n\n\
            Run \"net share\".\n\nMake note of the directory location of the SYSVOL share.\n\nBy default, this will be \\\
            Windows\\SYSVOL\\sysvol. For this requirement, permissions will be verified at the first SYSVOL directory level.\n\
            \nIf any standard user accounts or groups have greater than \"Read & execute\" permissions, this is a finding.\
            \ \n\nThe default permissions noted below meet this requirement:\n\nOpen command prompt.\n\nRun \"icacls c:\\\
            Windows\\SYSVOL\".\n\nThe following results must be displayed:\n\nNT AUTHORITY\\Authenticated Users:(RX)\nNT AUTHORITY\\\
            Authenticated Users:(OI)(CI)(IO)(GR,GE)\nBUILTIN\\Server Operators:(RX)\nBUILTIN\\Server Operators:(OI)(CI)(IO)(GR,GE)\n\
            BUILTIN\\Administrators:(M,WDAC,WO)\nBUILTIN\\Administrators:(OI)(CI)(IO)(F)\nNT AUTHORITY\\SYSTEM:(F)\nNT AUTHORITY\\\
            SYSTEM:(OI)(CI)(IO)(F)\nCREATOR OWNER:(OI)(CI)(IO)(F)\n\n(RX) - Read & execute \n\nRun \"icacls /help\" to view\
            \ definitions of other permission codes."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
