  fix: Configure the policy value for Computer Configuration >> Administrative Templates >> MS Security Guide >> Apply UAC
    restrictions to local accounts on network logons to "Enabled". This policy setting requires the installation of the SecGuide
    custom templates included with the STIG package. "SecGuide.admx" and " SecGuide.adml" must be copied to the \Windows\PolicyDefinitions
    and \Windows\PolicyDefinitions\en-US directories respectively.
