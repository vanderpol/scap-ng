        name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:41501
      exports: []
      inline_content: 'This is applicable to unclassified systems. It is not applicable for others. Open "PowerShell" as an
        administrator. Execute the following command: Get-ChildItem -Path Cert:Localmachine\disallowed | Where Issuer -Like
        "*CCEB Interoperability*" | FL Subject, NotAfter If valid (and unexpired) US DoW CCEB Interoperability Root CA certificates
        (such as those below) are not displayed, this is a finding. Note: The Common Names (CN) below are examples. Verify
        the "CN" displayed is a DoW CCEB Interoperability Root CA and is not expired. Subject: CN= US DoD CCEB Interoperability
        Root CA 2, OU=PKI, OU=DoD, O=U.S. Government, C=US NotAfter: 12/30/2030 Alternately, use the Certificates MMC snap-in:
        Run "MMC". Select "File", "Add/Remove Snap-in". Select "Certificates" and click "Add". Select "Computer account" and
        click "Next". Select "Local computer: (the computer this console is running on)" and click "Finish". Click "OK". Expand
        "Certificates" and navigate to Untrusted Certificates >> Certificates. For each US DoW CCEB Interoperability Root
        CA certificate displayed: Right-click the certificate and select "Open". Select the "Details" tab. Verify that the
        Expiration Date is a future date. Scroll to the bottom and select "Subject". If any of the certificates listed do
        not include "DoD Interoperability Root CA" in the Subject (CN) name or are expired, this is a finding. US DoD CCEB
        Interoperability Root CA 2 Note: Interoperability cross-certificates will have a different value (such as "...Root
        CA 6") in the ''Issued To'' field than in the ''Subject'' and ''Issuer'' fields.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:41501
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "This is applicable to unclassified systems. It is not applicable for others.\n\nOpen \"PowerShell\" as an\
            \ administrator.\n\nExecute the following command:\n\nGet-ChildItem -Path Cert:Localmachine\\disallowed | Where\
            \ Issuer -Like \"*CCEB Interoperability*\" | FL Subject, NotAfter\n\nIf valid (and unexpired) US DoW CCEB Interoperability\
            \ Root CA certificates (such as those below) are not displayed, this is a finding. \n\nNote: The Common Names\
            \ (CN) below are examples. Verify the \"CN\" displayed is a DoW CCEB Interoperability Root CA and is not expired.\n\
            \nSubject: CN= US DoD CCEB Interoperability Root CA 2, OU=PKI, OU=DoD, O=U.S. Government, C=US\nNotAfter: 12/30/2030\
            \ \n\nAlternately, use the Certificates MMC snap-in:\n\nRun \"MMC\".\n\nSelect \"File\", \"Add/Remove Snap-in\"\
            .\n\nSelect \"Certificates\" and click \"Add\".\n\nSelect \"Computer account\" and click \"Next\".\n\nSelect \"\
            Local computer: (the computer this console is running on)\" and click \"Finish\".\n\nClick \"OK\".\n\nExpand \"\
            Certificates\" and navigate to Untrusted Certificates >> Certificates.\n\nFor each US DoW CCEB Interoperability\
            \ Root CA certificate displayed:\n\nRight-click the certificate and select \"Open\".\n\nSelect the \"Details\"\
            \ tab.\n\nVerify that the Expiration Date is a future date.\n\nScroll to the bottom and select \"Subject\".\n\n\
            If any of the certificates listed do not include \"DoD Interoperability Root CA\" in the Subject (CN) name or\
            \ are expired, this is a finding.\n\nUS DoD CCEB Interoperability Root CA 2   \n\nNote: Interoperability cross-certificates\
            \ will have a different value (such as \"...Root CA 6\") in the 'Issued To'  field than in the 'Subject' and 'Issuer'\
            \ fields."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
