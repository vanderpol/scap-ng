assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-278040r1180826_rule
  version: 1
  description: Windows Server 2025 reversible password encryption must be disabled.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:11301
    exports: []
    inline_content: 'Verify the effective setting in Local Group Policy Editor. Run gpedit.msc. Navigate to Local Computer
      Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Account Policies >> Password Policy. If
      the value for "Store passwords using reversible encryption" is not set to "Disabled", this is a finding. For server
      core installations, run the following command: Secedit /Export /Areas SecurityPolicy /CFG C:\Path\FileName.Txt If "ClearTextPassword"
      equals "1" in the file, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
