        name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:3501
      exports: []
      inline_content: 'Review the registry permissions for the keys of the HKEY_LOCAL_MACHINE hive noted below. If any nonprivileged
        groups such as Everyone, Users, or Authenticated Users have greater than Read permission, this is a finding. If permissions
        are not as restrictive as the default permissions listed below, this is a finding. Note: “Authenticated Users” is
        default on Domain Controllers, and “Users” is default on member servers and stand-alone servers. Revise expected response
        based on system context. Run "Regedit". Right-click on the registry areas noted below. Select "Permissions" and then
        click "Advanced". HKEY_LOCAL_MACHINE\SECURITY Type - "Allow" for all Inherited from - "None" for all Principal - Access
        - Applies to SYSTEM - Full Control - This key and subkeys Administrators - Special - This key and subkeys HKEY_LOCAL_MACHINE\SOFTWARE
        Type - "Allow" for all Inherited from - "None" for all Principal - Access - Applies to Users - Read - This key and
        subkeys Administrators - Full Control - This key and subkeys SYSTEM - Full Control - This key and subkeys CREATOR
        OWNER - Full Control - This key and subkeys ALL APPLICATION PACKAGES - Read - This key and subkeys HKEY_LOCAL_MACHINE\SYSTEM
        Type - "Allow" for all Inherited from - "None" for all Principal - Access - Applies to Authenticated Users - Read
        - This key and subkeys Administrators - Full Control - This key and subkeys SYSTEM - Full Control - This key and subkeys
        CREATOR OWNER - Full Control - This key and Subkeys ALL APPLICATION PACKAGES - Read - This key and subkeys Server
        Operators - Read - This Key and subkeys (Domain controllers only) Other examples under the noted keys may also be
        sampled. In some instances, nonprivileged groups have greater than Read permission. Microsoft has given Read permission
        to the SOFTWARE and SYSTEM registry keys in Windows Server 2025 to the following SID. This is not a finding. S-1-15-3-1024-1065365936-1281604716-3511738428-1654721687-432734479-3232135806-4053264122-3456934681
        If the defaults have not been changed, this is not a finding.'
      multi_check: null
