assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-278106r1211154_rule
  version: 1
  description: Windows Server 2025 Security event log size must be configured to a value that holds at least one week of audit
    records.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:24301
    exports: []
    inline_content: 'If the system is configured to write events directly to an audit server, this is not applicable. The
      registry configuration setting below must be set (at least) to a value equal to the size needed to contain one week''s
      worth of audit records in the security event log. The value used below is an example that assumes a typical week’s log
      size of 5GB. If a registry value does not exist or is not configured to hold one week of records, this is a finding:
      Note: The following registry entry is an example; the value must equal at least one week''s worth of records in the
      environment. Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows\EventLog\Security\
      Value Name: MaxSize Type: REG_DWORD Value: 0x4E2000 (5120000) (or greater)'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
      children:
