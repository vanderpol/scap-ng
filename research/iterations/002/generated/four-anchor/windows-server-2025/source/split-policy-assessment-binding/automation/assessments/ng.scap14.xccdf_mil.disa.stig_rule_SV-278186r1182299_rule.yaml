            text: WN25-MS-000100 - The Windows Server 2025 "Deny log on as a service" user right on domain-joined member servers
              must be configured to prevent access from highly privileged domain accounts. No other groups or accounts must
              be assigned this right.
          - attributes:
              family: windows
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Microsoft Windows Server 2025
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "Inappropriately granting user rights provides system, administrative, and other high-level capabilities.\n\
              \n  The \"Deny log on as a service\" user right defines accounts that are denied logon as a service.\n\n  In\
              \ an Active Directory Domain, denying logons to the Enterprise Admins and Domain Admins groups on lower-trust\
              \ systems helps mitigate the risk of privilege escalation from credential theft attacks, which could lead to\
              \ the compromise of an entire domain.\n\n  Incorrect configurations could prevent services from starting and\
              \ result in a denial of service."
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
