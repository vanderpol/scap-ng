  id: ng.manual.xccdf_mil.disa.stig_rule_SV-278208r1181330_rule
  version: 1
  description: Windows Server 2025 title for legal banner dialog box must be configured with the appropriate text.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:44301
    exports: []
    inline_content: 'If the following registry value does not exist or is not configured as specified, this is a finding:
      Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\ Value Name:
      LegalNoticeCaption Value Type: REG_SZ Value: See message title options below "DOD Notice and Consent Banner", "US Department
      of Defense Warning Statement", or an organization-defined equivalent. If an organization-defined title is used, it can
      in no case contravene or modify the language of the banner text required in WN25-SO-000150. Automated tools may only
      search for the titles defined above. If an organization-defined title is used, a manual review will be required.'
