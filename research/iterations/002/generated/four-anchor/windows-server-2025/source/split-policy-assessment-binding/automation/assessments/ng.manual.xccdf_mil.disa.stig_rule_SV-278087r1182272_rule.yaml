        name: check-content-ref
        namespace: http://checklists.nist.gov/xccdf/1.2
      - name: check-content
        namespace: http://checklists.nist.gov/xccdf/1.2
        text: 'This requirement is applicable to domain-joined systems. For stand-alone or nondomain-joined systems, this
          is not applicable.


          If the following registry values do not exist or are not configured as specified, this is a finding:


          Registry Hive: HKEY_LOCAL_MACHINE

          Registry Path: \SOFTWARE\Policies\Microsoft\Windows\NetworkProvider\HardenedPaths\


          Value Name: \\*\NETLOGON

          Value Type: REG_SZ

          Value: RequireMutualAuthentication=1, RequireIntegrity=1


          Value Name: \\*\SYSVOL

          Value Type: REG_SZ

          Value: RequireMutualAuthentication=1, RequireIntegrity=1


          Additional entries would not be a finding.'
      name: check
      namespace: http://checklists.nist.gov/xccdf/1.2
    system: http://scap.nist.gov/schema/ocil/2
