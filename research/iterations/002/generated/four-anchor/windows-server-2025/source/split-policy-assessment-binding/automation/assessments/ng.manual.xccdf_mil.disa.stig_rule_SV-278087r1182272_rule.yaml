assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-278087r1182272_rule
  version: 1
  description: Windows Server 2025 hardened Universal Naming Convention (UNC) paths must be defined to require mutual authentication
    and integrity for at least the \\*\SYSVOL and \\*\NETLOGON shares.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:20501
    exports: []
    inline_content: 'This requirement is applicable to domain-joined systems. For stand-alone or nondomain-joined systems,
      this is not applicable. If the following registry values do not exist or are not configured as specified, this is a
      finding: Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows\NetworkProvider\HardenedPaths\
      Value Name: \\*\NETLOGON Value Type: REG_SZ Value: RequireMutualAuthentication=1, RequireIntegrity=1 Value Name: \\*\SYSVOL
      Value Type: REG_SZ Value: RequireMutualAuthentication=1, RequireIntegrity=1 Additional entries would not be a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
      children:
