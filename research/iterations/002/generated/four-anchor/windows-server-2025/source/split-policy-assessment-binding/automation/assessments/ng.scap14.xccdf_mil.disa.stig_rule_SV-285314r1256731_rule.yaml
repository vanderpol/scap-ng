        name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:56301
      exports: []
      inline_content: 'If OpenSSH is not installed on the system, this requirement is not applicable. Verify any SSH connection
        to the system displays the Standard Mandatory DoW Notice and Consent Banner before granting access to the system.
        Check for the location of the banner file being used with the following command: C:\ > Get-Content "$env:ProgramData\ssh\sshd_config"
        | Select-String -Pattern ''^\s*Banner'' Banner C:\ProgramData\ssh\Banner.txt If "Banner" is set to "none", the line
        is commented out, or the line is missing, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:56301
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'If OpenSSH is not installed on the system, this requirement is not applicable.


            Verify any SSH connection to the system displays the Standard Mandatory DoW Notice and Consent Banner before granting
            access to the system.


            Check for the location of the banner file being used with the following command:


            C:\ > Get-Content "$env:ProgramData\ssh\sshd_config" | Select-String -Pattern ''^\s*Banner''


            Banner C:\ProgramData\ssh\Banner.txt


            If "Banner" is set to "none", the line is commented out, or the line is missing, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
