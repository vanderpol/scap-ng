            text: WN25-AU-000040 - Windows Server 2025 permissions for the Security event log must prevent access by nonprivileged
              accounts.
          - attributes:
              family: windows
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Microsoft Windows Server 2025
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "Maintaining an audit trail of system activity logs can help identify configuration errors, troubleshoot\
              \ service disruptions, and analyze compromises that have occurred, as well as detect attacks. Audit logs are\
              \ necessary to provide a trail of evidence in case the system or network is compromised. The Security event\
              \ log may disclose sensitive information or be susceptible to tampering if proper permissions are not applied.\n\
              \n  Satisfies: SRG-OS-000057-GPOS-00027, SRG-OS-000058-GPOS-00028, SRG-OS-000059-GPOS-00029"
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
