        name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:12101
      exports: []
      inline_content: 'Navigate to the Security event log file. The default location is the "%SystemRoot%\System32\winevt\Logs"
        folder. However, the logs may have been moved to another folder. If the permissions for the "Security.evtx" file are
        not as restrictive as the default permissions listed below, this is a finding: Eventlog - Full Control SYSTEM - Full
        Control Administrators - Full Control'
