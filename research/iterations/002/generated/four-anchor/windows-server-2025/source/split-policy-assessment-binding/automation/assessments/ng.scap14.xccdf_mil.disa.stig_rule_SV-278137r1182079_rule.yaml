            text: WN25-DC-000060 - Windows Server 2025 computer clock synchronization tolerance must be limited to five minutes
              or less.
          - attributes:
              family: windows
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Microsoft Windows Server 2025
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "This setting determines the maximum time difference (in minutes) that Kerberos will tolerate between the\
              \ time on a client's clock and the time on a server's clock while still considering the two clocks synchronous.\
              \ To prevent replay attacks, Kerberos uses timestamps as part of its protocol definition. For timestamps to\
              \ work properly, the clocks of the client and the server must be in sync as much as possible.\n\n  Satisfies:\
              \ SRG-OS-000112-GPOS-00057, SRG-OS-000113-GPOS-00058"
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
