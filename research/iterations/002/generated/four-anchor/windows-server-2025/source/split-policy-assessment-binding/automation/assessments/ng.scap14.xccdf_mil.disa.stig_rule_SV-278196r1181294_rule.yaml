            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: An account without a password can allow unauthorized access to a system as only the username would be required.
              Password policies must prevent accounts with blank passwords from existing on a system. However, if a local
              account with a blank password does exist, enabling this setting will prevent network access, limiting the account
              to local console logon only.
