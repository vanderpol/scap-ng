assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-278138r1182081_rule
  version: 1
  description: Windows Server 2025 permissions on the Active Directory data files must only allow system administrators (SAs)
    access.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:30701
    exports: []
    inline_content: 'This applies to domain controllers. It is not applicable for other systems. Run "Regedit". Navigate to
      "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\NTDS\Parameters". Note the directory locations in the values for:
      Database log files path DSA Database file By default, they will be \Windows\NTDS. If the locations are different, run
      the following for each: Open "command prompt (Admin)". Navigate to the NTDS directory (\Windows\NTDS by default). Run
      "icacls *.*". If the permissions on each file are not as restrictive as the following, this is a finding: NT AUTHORITY\SYSTEM:(I)(F)
      BUILTIN\Administrators:(I)(F) (I) - permission inherited from parent container (F) - full access'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
