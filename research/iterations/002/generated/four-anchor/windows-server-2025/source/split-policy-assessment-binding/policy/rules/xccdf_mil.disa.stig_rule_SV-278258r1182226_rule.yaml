rule:
  id: xccdf_mil.disa.stig_rule_SV-278258r1182226_rule
  title: The Windows Server 2025 "Modify firmware environment values" user right must only be assigned to the Administrators
    group.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
