        name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:21301
      exports: []
      inline_content: 'The default behavior is for Early Launch Antimalware - Boot-Start Driver Initialization policy to enforce
        "Good, unknown and bad but critical" (preventing "bad"). If the registry value name below does not exist, this is
        not a finding. If it exists and is configured with a value of "0x00000007 (7)", this is a finding. Registry Hive:
        HKEY_LOCAL_MACHINE Registry Path: \SYSTEM\CurrentControlSet\Policies\EarlyLaunch\ Value Name: DriverLoadPolicy Value
        Type: REG_DWORD Value: 0x00000001 (1), 0x00000003 (3), or 0x00000008 (8) (or if the Value Name does not exist) Possible
        values for this setting are: 8 - Good only 1 - Good and unknown 3 - Good, unknown and bad but critical 7 - All (which
        includes "bad" and would be a finding)'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:21301
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'The default behavior is for Early Launch Antimalware - Boot-Start Driver Initialization policy to enforce
            "Good, unknown and bad but critical" (preventing "bad").


            If the registry value name below does not exist, this is not a finding.


            If it exists and is configured with a value of "0x00000007 (7)", this is a finding.


            Registry Hive: HKEY_LOCAL_MACHINE

            Registry Path: \SYSTEM\CurrentControlSet\Policies\EarlyLaunch\


            Value Name: DriverLoadPolicy


            Value Type: REG_DWORD

            Value: 0x00000001 (1), 0x00000003 (3), or 0x00000008 (8) (or if the Value Name does not exist)


            Possible values for this setting are:

            8 - Good only

            1 - Good and unknown

            3 - Good, unknown and bad but critical

            7 - All (which includes "bad" and would be a finding)'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
