          children:
          - name: title
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: WN25-PK-000010 - Windows Server 2025 must have the DoW Root Certificate Authority (CA) certificates installed
              in the Trusted Root Store.
          - attributes:
              family: windows
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Microsoft Windows Server 2025
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "To ensure secure DoW websites and DoW-signed code are properly validated, the system must trust the DoW\
              \ Root CAs. The DoW root certificates will ensure that the trust chain is established for server certificates\
              \ issued from the DoW CAs.\n\n  Satisfies: SRG-OS-000066-GPOS-00034, SRG-OS-000403-GPOS-00182, SRG-OS-000775-GPOS-00230"
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
