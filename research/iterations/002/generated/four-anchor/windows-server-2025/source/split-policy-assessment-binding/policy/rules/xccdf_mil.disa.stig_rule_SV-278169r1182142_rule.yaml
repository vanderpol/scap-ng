rule:
  id: xccdf_mil.disa.stig_rule_SV-278169r1182142_rule
  title: The Windows Server 2025 "Deny log on as a batch job" user right on domain controllers must be configured to prevent
    unauthenticated access.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
