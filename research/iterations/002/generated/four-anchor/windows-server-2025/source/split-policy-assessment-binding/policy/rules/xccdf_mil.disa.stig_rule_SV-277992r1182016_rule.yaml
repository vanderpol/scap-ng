  fix: 'Configure an application allowlisting program to employ a deny-all, permit-by-exception policy to allow the execution
    of authorized software programs. Configuration of allowlisting applications will vary by the program. AppLocker is a allowlisting
    application built in to Windows Server. If AppLocker is used, it is configured through group policy in Computer Configuration
    >> Windows Settings >> Security Settings >> Application Control Policies >> AppLocker. Implementation guidance for AppLocker
    is available in the NSA paper "Application Whitelisting using Microsoft AppLocker" at the following link: https://www.iad.gov/iad/library/ia-guidance/tech-briefs/application-whitelisting-using-microsoft-applocker.cfm'
