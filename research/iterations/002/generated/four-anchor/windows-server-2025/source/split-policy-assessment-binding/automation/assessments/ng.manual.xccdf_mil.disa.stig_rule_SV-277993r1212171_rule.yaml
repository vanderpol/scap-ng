          name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:2101
        name: check-content-ref
        namespace: http://checklists.nist.gov/xccdf/1.2
      - name: check-content
        namespace: http://checklists.nist.gov/xccdf/1.2
        text: 'Verify the system has a TPM and it is ready for use.


          Run "tpm.msc".


          Review the sections in the center pane.


          "Status" must indicate it has been configured with a message such as "The TPM is ready for use" or "The TPM is on
          and ownership has been taken".


          TPM Manufacturer Information - Specific Version = 2.0


          If a TPM is not found or is not ready for use, this is a finding.'
      name: check
      namespace: http://checklists.nist.gov/xccdf/1.2
    system: http://scap.nist.gov/schema/ocil/2
