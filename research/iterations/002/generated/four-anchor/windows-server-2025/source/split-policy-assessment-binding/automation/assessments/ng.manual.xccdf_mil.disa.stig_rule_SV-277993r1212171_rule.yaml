  id: ng.manual.xccdf_mil.disa.stig_rule_SV-277993r1212171_rule
  version: 1
  description: Windows Server 2025 systems must have a Trusted Platform Module (TPM) enabled and ready for use.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:2101
    exports: []
    inline_content: Verify the system has a TPM and it is ready for use. Run "tpm.msc". Review the sections in the center
      pane. "Status" must indicate it has been configured with a message such as "The TPM is ready for use" or "The TPM is
      on and ownership has been taken". TPM Manufacturer Information - Specific Version = 2.0 If a TPM is not found or is
      not ready for use, this is a finding.
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
      children:
