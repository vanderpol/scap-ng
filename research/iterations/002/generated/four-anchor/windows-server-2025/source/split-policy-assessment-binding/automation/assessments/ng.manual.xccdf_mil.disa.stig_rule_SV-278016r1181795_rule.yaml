assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-278016r1181795_rule
  version: 1
  description: Windows Server 2025 must not have the Microsoft FTP service installed unless required by the organization.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:6501
    exports: []
    inline_content: If the server has the role of an FTP server, this is not applicable. Open PowerShell. Enter "Get-WindowsFeature
      | Where Name -eq Web-Ftp-Service". If "Installed State" is "Installed", this is a finding. An Installed State of "Available"
      or "Removed" is not a finding. If the system has the role of an FTP server, this must be documented with the information
      system security officer (ISSO).
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
      children:
      - attributes:
          href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
          name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:6501
        name: check-content-ref
        namespace: http://checklists.nist.gov/xccdf/1.2
      - name: check-content
        namespace: http://checklists.nist.gov/xccdf/1.2
        text: 'If the server has the role of an FTP server, this is not applicable.


          Open PowerShell.


          Enter "Get-WindowsFeature | Where Name -eq Web-Ftp-Service".


          If "Installed State" is "Installed", this is a finding.


          An Installed State of "Available" or "Removed" is not a finding.


          If the system has the role of an FTP server, this must be documented with the information system security officer
          (ISSO).'
      name: check
      namespace: http://checklists.nist.gov/xccdf/1.2
    system: http://scap.nist.gov/schema/ocil/2
