  fix: Install valid and unexpired US DoW CCEB Interoperability Root CA cross-certificate on unclassified systems. The list
    below is not to be treated as exhaustive. The STIG should not be used as a definitive resource for the organizationally
    approved certificates for the systems. US DOD CCEB Interoperability Root CA 2 Administrators must run the Federal Bridge
    Certification Authority (FBCA) Cross-Certificate Removal Tool once as an administrator and once as the current user. The
    FBCA Cross-Certificate Remover Tool and User Guide are available on Cyber Exchange at https://cyber.mil/pki-pke/tools-configuration-files.
    Certificate bundles published by the PKI can be found at https://crl.gds.disa.mil/.
