  description: Windows Server 2025 directory data (outside the root DSE) of a nonpublic directory must be configured to prevent
    anonymous access.
  semantic_model: scap-ng-generic-assessment-graph-0.1
  collect:
    oval:navy.navwar.niwcatlantic.scc.windows:obj:27814602:
      capability: scapng.collect.independent.shellcommand
      source_object_id: oval:navy.navwar.niwcatlantic.scc.windows:obj:27814602
      source_type: shellcommand_object
      source_namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
      version: '1'
      object_title: Analyse permissions on Active Directory Users and Computers. Domain Security Permissions via PowerShell.
      query:
      - kind: element
        name: shell
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
        value: powershell
      - kind: element
        name: command
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
        value: 'if (([adsi]"LDAP://$((Get-ADDomain).DistinguishedName)").PSBase.ObjectSecurity.GetAccessRules($true, $true,
          [System.Security.Principal.SecurityIdentifier]) | Where-Object { $_.IdentityReference -eq ''S-1-5-7'' -and $_.AccessControlType
          -eq ''Allow'' }) { Write-Host "FAIL: ANONYMOUS LOGON is configured with ALLOW permissions." } else { Write-Host
          "PASS: ANONYMOUS LOGON is missing or does not have ALLOW permissions." }'
      - kind: element
        name: pattern
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
        value: .+
    oval:navy.navwar.niwcatlantic.scc.windows:obj:27814601:
      capability: scapng.collect.independent.shellcommand
      source_object_id: oval:navy.navwar.niwcatlantic.scc.windows:obj:27814601
      source_type: shellcommand_object
      source_namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
      version: '1'
      object_title: Analyze the dsHeuristics to check for annonymous access
      query:
      - attributes:
          error_if_stderr_exists: 'true'
        kind: element
        name: behaviors
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
      - kind: element
        name: shell
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
        value: powershell
      - kind: element
        name: command
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
        value: $( try { $obj=Get-ADObject -Filter "objectClass -eq 'nTDSService'" -Properties dsHeuristics -SearchBase "CN=Services,$((Get-ADRootDSE).configurationNamingContext)"
          -ErrorAction Stop; if ($null -eq $obj) { throw } $h=$obj.dsHeuristics; if ($null -eq $h) { [PSCustomObject]@{ Status='PASS';
          Detail='dsHeuristics attribute is not set (Defaults secure)' } } else { $isAnon=($h.Length -ge 7) -and ($h[6] -eq
          '2'); $stat=if($isAnon){'FAIL'}else{'PASS'}; $msg=if($isAnon){'Allows Anonymous Access'}else{'Secure'}; $c=if($h.Length
          -ge 7){$h[6]}else{'N/A'}; [PSCustomObject]@{ Status=$stat; Detail=("dsHeuristics value is [{0}]. Seventh char is
          '{1}' ({2})." -f $h,$c,$msg) } } } catch { [PSCustomObject]@{ Status='ERROR'; Detail="Directory Service object could
          not be located or read." } } ) | Out-String -Width 4096
      - kind: element
        name: pattern
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
        value: .+
