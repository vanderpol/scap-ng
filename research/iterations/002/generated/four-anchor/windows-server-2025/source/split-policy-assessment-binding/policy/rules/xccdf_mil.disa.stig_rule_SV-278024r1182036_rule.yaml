  fix: Configure the policy value for Computer Configuration >> Administrative Templates >> MS Security Guide >> Configure
    SMBv1 Server to "Disabled". Restart the system for the change to take effect. This policy setting requires the installation
    of the SecGuide custom templates included with the STIG package. "SecGuide.admx" and "SecGuide.adml" must be copied to
    the \Windows\PolicyDefinitions and \Windows\PolicyDefinitions\en-US directories respectively.
