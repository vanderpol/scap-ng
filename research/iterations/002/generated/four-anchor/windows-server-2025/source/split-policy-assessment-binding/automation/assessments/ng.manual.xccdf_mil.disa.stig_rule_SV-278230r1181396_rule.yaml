  id: ng.manual.xccdf_mil.disa.stig_rule_SV-278230r1181396_rule
  version: 1
  description: Windows Server 2025 must be configured to use FIPS-compliant algorithms for encryption, hashing, and signing.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:48501
    exports: []
    inline_content: 'If the following registry value does not exist or is not configured as specified, this is a finding:
      Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SYSTEM\CurrentControlSet\Control\Lsa\FIPSAlgorithmPolicy\ Value Name:
      Enabled Value Type: REG_DWORD Value: 0x00000001 (1) Clients with this setting enabled will not be able to communicate
      via digitally encrypted or signed protocols with servers that do not support these algorithms. Both the browser and
      web server must be configured to use TLS; otherwise, the browser will not be able to connect to a secure site.'
    multi_check: null
    negate: null
    selector: manual
