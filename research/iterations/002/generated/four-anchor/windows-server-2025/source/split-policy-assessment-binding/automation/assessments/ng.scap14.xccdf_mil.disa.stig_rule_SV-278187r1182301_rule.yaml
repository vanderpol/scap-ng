        metadata:
          children:
          - name: title
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: WN25-MS-000110 - The Windows Server 2025 "Deny log on locally" user right on domain-joined member servers
              must be configured to prevent access from highly privileged domain accounts and from unauthenticated access
              on all systems.
          - attributes:
              family: windows
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Microsoft Windows Server 2025
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "Inappropriately granting user rights provides system, administrative, and other high-level capabilities.\n\
              \n  The \"Deny log on locally\" user right defines accounts that are prevented from logging on interactively.\n\
              \n  In an Active Directory Domain, denying logons to the Enterprise Admins and Domain Admins groups on lower-trust\
              \ systems helps mitigate the risk of privilege escalation from credential theft attacks, which could lead to\
              \ the compromise of an entire domain.\n\n  The Guests group must be assigned this right to prevent unauthenticated\
              \ access."
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
