  fix: Configure the system to synchronize time with an appropriate DoW time source. Domain-joined systems use NT5DS to synchronize
    time from other systems in the domain by default. If needed, configure the system to point to an authorized time server
    by setting the policy value for Computer Configuration >> Administrative Templates >> System >> Windows Time Service >>
    Time Providers. Change "Configure Windows NTP Client" to "Enabled" and configure the "NtpServer" field to point to an
    appropriate DoW time server. The US Naval Observatory operates stratum one-time servers, identified at https://www.usno.navy.mil/USNO/time/ntp/DOD-customers.
    Time synchronization will occur through a hierarchy of time servers down to the local level. Clients and lower-level servers
    will synchronize with an authorized time server in the hierarchy.
