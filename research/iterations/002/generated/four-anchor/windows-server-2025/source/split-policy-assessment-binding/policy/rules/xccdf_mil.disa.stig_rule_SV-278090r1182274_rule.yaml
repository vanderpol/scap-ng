  fix: 'Configure the policy value for Computer Configuration >> Administrative Templates >> System >> Device Guard >> Turn
    On Virtualization Based Security to "Enabled" with Platform Security Level set to "Secure Boot" or "Secure Boot and DMA
    Protection" selected. A Microsoft TechNet article on Credential Guard, including system requirement details, can be found
    at the following link: https://technet.microsoft.com/itpro/windows/keep-secure/credential-guard'
