assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-278065r1180901_rule
  version: 1
  description: Windows Server 2025 must be configured to audit Object Access - Removable Storage failures.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:16301
    exports: []
    inline_content: 'Security Option "Audit: Force audit policy subcategory settings (Windows 7 or later) to override audit
      policy category settings" must be set to "Enabled" (WN25-SO-000050) for the detailed auditing subcategories to be effective.
      Use the "AuditPol" tool to review the current Audit Policy configuration. Open PowerShell or a command prompt with elevated
      privileges ("Run as administrator"). Enter "AuditPol /get /category:*" Compare the "AuditPol" settings with the following.
      If the system does not audit the following, this is a finding: Object Access >> Removable Storage - Failure Virtual
      machines or systems that use network attached storage may generate excessive audit events for secondary virtual drives
      or the network attached storage when this setting is enabled. This may be set to Not Configured in such cases and would
      not be a finding.'
    multi_check: null
    negate: null
