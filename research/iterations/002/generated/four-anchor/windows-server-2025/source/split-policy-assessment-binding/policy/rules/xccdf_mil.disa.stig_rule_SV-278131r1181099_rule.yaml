rule:
  id: xccdf_mil.disa.stig_rule_SV-278131r1181099_rule
  title: Windows Server 2025 must have PowerShell Transcription enabled.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
