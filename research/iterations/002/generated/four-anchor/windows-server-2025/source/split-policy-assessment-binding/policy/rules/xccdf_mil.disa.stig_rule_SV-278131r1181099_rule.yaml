  fix: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components >> Windows
    PowerShell >> "Turn on PowerShell Transcription" to "Enabled". Specify the Transcript output directory to point to a Central
    Log Server or another secure location to prevent user access.
