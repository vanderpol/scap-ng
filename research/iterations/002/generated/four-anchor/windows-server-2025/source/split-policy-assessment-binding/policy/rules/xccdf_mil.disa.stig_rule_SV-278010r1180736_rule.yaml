  description: '<VulnDiscussion>Information can be either unintentionally or maliciously disclosed or modified during preparation
    for transmission, for example, during aggregation, at protocol transformation points, and during packing/unpacking. These
    unauthorized disclosures or modifications compromise the confidentiality or integrity of the information. Ensuring the
    confidentiality of transmitted information requires the operating system to take measures in preparing information for
    transmission. This can be accomplished via access control and encryption. Use of this requirement will be limited to situations
    where the data owner has a strict requirement for ensuring data integrity and confidentiality is maintained at every step
    of the data transfer and handling process. When transmitting data, operating systems need to support transmission protection
    mechanisms such as TLS, encrypted VPNs, or IPsec. Satisfies: SRG-OS-000425-GPOS-00189, SRG-OS-000426-GPOS-00190</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
