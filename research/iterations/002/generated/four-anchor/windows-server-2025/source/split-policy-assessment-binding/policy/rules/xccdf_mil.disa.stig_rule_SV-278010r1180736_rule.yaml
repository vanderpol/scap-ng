rule:
  id: xccdf_mil.disa.stig_rule_SV-278010r1180736_rule
  title: Windows Server 2025 must implement protection methods such as TLS, encrypted VPNs, or IPsec if the data owner has
    a strict requirement for ensuring data integrity and confidentiality is maintained at every step of the data transfer
    and handling process.
  severity: medium
  weight: '10.0'
  role: null
