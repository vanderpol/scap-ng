  group_path:
  - xccdf_mil.disa.stig_group_V-278104
  description: <VulnDiscussion>Windows Update can obtain updates from additional sources instead of Microsoft. In addition
    to Microsoft, updates can be obtained from and sent to PCs on the local network as well as on the internet. This is part
    of the Windows Update trusted process; however, to minimize outside exposure, obtaining updates from or sending to systems
    on the internet must be prevented.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
