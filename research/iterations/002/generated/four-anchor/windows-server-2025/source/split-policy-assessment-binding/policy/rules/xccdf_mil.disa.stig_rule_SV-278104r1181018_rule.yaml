  fix: 'Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components >> Delivery
    Optimization >> Download Mode to "Enabled" with any option except "Internet" selected. Acceptable selections include:
    Bypass (100) Group (2) HTTP only (0) LAN (1) Simple (99)'
