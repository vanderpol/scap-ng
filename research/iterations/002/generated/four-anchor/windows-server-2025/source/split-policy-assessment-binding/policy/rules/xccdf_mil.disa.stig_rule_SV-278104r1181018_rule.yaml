rule:
  id: xccdf_mil.disa.stig_rule_SV-278104r1181018_rule
  title: Windows Server 2025 Windows Update must not obtain updates from other PCs on the internet.
  severity: low
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
