  description: <VulnDiscussion>A system faces an increased vulnerability threat if the built-in guest account is not disabled.
    This is a known account that exists on all Windows systems and cannot be deleted. This account is initialized during the
    installation of the operating system with no password assigned.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
