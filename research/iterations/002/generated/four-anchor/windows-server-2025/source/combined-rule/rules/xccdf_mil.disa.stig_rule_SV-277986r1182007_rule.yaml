rule:
  id: xccdf_mil.disa.stig_rule_SV-277986r1182007_rule
  title: Windows Server 2025 passwords for the built-in Administrator account must be changed at least every 60 days.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-277986
  description: <VulnDiscussion>The longer a password is in use, the greater the opportunity for someone to gain unauthorized
    knowledge of the password. The built-in Administrator account is not generally used and its password may not be changed
    as frequently as necessary. Changing the password for the built-in Administrator account on a regular basis will limit
    its exposure. It is highly recommended to use Microsoft's Local Administrator Password Solution (LAPS). Domain-joined
    systems can configure this to occur more frequently. LAPS will change the password every 30 days by default. The authorizing
    official (AO) still has the overall authority to use another equivalent capability to accomplish the check.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
