  - xccdf_mil.disa.stig_group_V-278046
  description: '<VulnDiscussion>Protecting audit information also includes identifying and protecting the tools used to view
    and manipulate log data. Therefore, protecting audit tools is necessary to prevent unauthorized operation on audit information.
    Operating systems providing tools to interface with audit information will leverage user permissions and roles identifying
    the user accessing the tools and the corresponding user rights to make access decisions regarding the modification or
    deletion of audit tools. Satisfies: SRG-OS-000257-GPOS-00098, SRG-OS-000258-GPOS-00099</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
