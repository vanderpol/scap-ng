  fix: 'Configure the permissions on the System event log file (System.evtx) to prevent access by nonprivileged accounts.
    The default permissions listed below satisfy this requirement: Eventlog - Full Control SYSTEM - Full Control Administrators
    - Full Control The default location is the "%SystemRoot%\System32\winevt\Logs" folder. If the location of the logs has
    been changed, when adding Eventlog to the permissions, it must be entered as "NT Service\Eventlog".'
