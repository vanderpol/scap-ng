rule:
  id: xccdf_mil.disa.stig_rule_SV-278030r1182043_rule
  title: Windows Server 2025 must have orphaned security identifiers (SIDs) removed from user rights.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-278030
  description: <VulnDiscussion>Accounts or groups given rights on a system may show up as unresolved SIDs for various reasons
    including deletion of the accounts or groups. If the account or group objects are reanimated, there is a potential they
    may still have rights no longer intended. Valid domain accounts or groups may also show up as unresolved SIDs if a connection
    to the domain cannot be established.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
