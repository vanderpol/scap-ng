  fix: Validate the site documentation to ensure the approval of use for Wi-Fi server connections. If the connection has not
    been approved, type "Services" in the Windows search bar. In the Services "Name " column, look for the "Bluetooth Support
    Service" and set this to "Disabled". Any Bluetooth devices listed or in use must be documented and approved by the information
    system security officer (ISSO) or authorizing official (AO).
