rule:
  id: xccdf_mil.disa.stig_rule_SV-278056r1180874_rule
  title: Windows Server 2025 must be configured to audit Logon/Logoff - Account Lockout failures.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
