    value: CCI-000381
  requires: []
  conflicts: []
  check: 'This applies to domain controllers, it is not applicable for other systems. Review the installed roles the domain
    controller is supporting. Start Server Manager. Select "AD DS" in the left pane then select the server name under "Servers"
    to the right. Select "Add (or Remove) Roles and Features" from "Tasks" in the "Roles and Features" section. (Cancel before
    any changes are made.) Determine if any additional server roles are installed. A basic domain controller setup will include
    the following: - Active Directory Domain Services. - DNS Server. - File and Storage Services. If any roles not requiring
    installation on a domain controller are installed, this is a finding. A Domain Name System (DNS) server integrated with
    the directory server (e.g., AD-integrated DNS) is an acceptable application. However, the DNS server must comply with
    the DNS STIG security requirements. Run "Programs and Features". Review installed applications. If any applications are
    installed that are not required for the domain controller, this is a finding.'
