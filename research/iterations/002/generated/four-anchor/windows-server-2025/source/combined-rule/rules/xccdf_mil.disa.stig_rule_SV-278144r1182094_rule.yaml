rule:
  id: xccdf_mil.disa.stig_rule_SV-278144r1182094_rule
  title: Windows Server 2025 domain controllers must run on a machine dedicated to that function.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-278144
  description: <VulnDiscussion>Executing application servers on the same host machine with a directory server may substantially
    weaken the security of the directory server. Web or database server applications usually require the addition of many
    programs and accounts, increasing the attack surface of the computer. Some applications require the addition of privileged
    accounts, providing potential sources of compromise. Some applications (such as Microsoft Exchange) may require the use
    of network ports or services conflicting with the directory server. In this case, nonstandard ports might be selected,
    and this could interfere with intrusion detection or prevention services.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
