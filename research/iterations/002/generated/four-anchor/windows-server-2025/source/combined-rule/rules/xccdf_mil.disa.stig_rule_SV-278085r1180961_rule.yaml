  - xccdf_mil.disa.stig_group_V-278085
  description: <VulnDiscussion>Configuring the system to ignore name release requests, except from WINS servers, prevents
    a denial-of-service (DoS) attack. The DoS consists of sending a NetBIOS name release request to the server for each entry
    in the server's cache, causing a response delay in the normal operation of the server's WINS resolution capability.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
