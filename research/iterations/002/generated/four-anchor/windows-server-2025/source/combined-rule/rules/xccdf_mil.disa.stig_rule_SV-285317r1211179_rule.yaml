rule:
  id: xccdf_mil.disa.stig_rule_SV-285317r1211179_rule
  title: Windows Server 2025 OpenSSH must force a frequent session key renegotiation for SSH connections to the server.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-285317
  description: '<VulnDiscussion>Without protection of the transmitted information, confidentiality and integrity may be compromised
    because unprotected communications can be intercepted and either read or altered. This requirement applies to both internal
    and external networks and all types of information system components from which information can be transmitted (e.g.,
    servers, mobile devices, notebook computers, printers, copiers, scanners, and facsimile machines). Communication paths
    outside the physical protection of a controlled boundary are exposed to the possibility of interception and modification.
    Protecting the confidentiality and integrity of organizational information can be accomplished by physical means (e.g.,
    employing physical distribution systems) or by logical means (e.g., employing cryptographic techniques). If physical means
    of protection are employed, then logical means (cryptography) do not have to be employed, and vice versa. Session key
    regeneration limits the chances of a session key becoming compromised. Satisfies: SRG-OS-000423-GPOS-00187, SRG-OS-000033-GPOS-00014,
    SRG-OS-000424-GPOS-00189</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
  discussion: null
