  check: 'This applies to domain controllers. It is not applicable for other systems. Run "Regedit". Navigate to "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\NTDS\Parameters".
    Note the directory locations in the values for: Database log files path DSA Database file By default, they will be \Windows\NTDS.
    If the locations are different, run the following for each: Open "command prompt (Admin)". Navigate to the NTDS directory
    (\Windows\NTDS by default). Run "icacls *.*". If the permissions on each file are not as restrictive as the following,
    this is a finding: NT AUTHORITY\SYSTEM:(I)(F) BUILTIN\Administrators:(I)(F) (I) - permission inherited from parent container
    (F) - full access'
