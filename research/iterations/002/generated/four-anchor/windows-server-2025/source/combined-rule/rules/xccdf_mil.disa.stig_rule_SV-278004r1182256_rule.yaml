              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Windows Server 2025 accounts must require passwords.
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: The lack of password protection enables anyone to gain access to the information system, which opens a
                backdoor opportunity for intruders to compromise the system as well as other resources. Accounts on a system
                must require passwords.
