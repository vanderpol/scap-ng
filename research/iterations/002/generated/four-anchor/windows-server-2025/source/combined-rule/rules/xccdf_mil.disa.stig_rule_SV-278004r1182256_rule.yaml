        exports: []
        inline_content: 'Review the password required status for enabled user accounts. Open PowerShell. Domain Controllers:
          Enter "Get-Aduser -Filter * -Properties Passwordnotrequired |FT Name, Passwordnotrequired, Enabled". Exclude disabled
          accounts (e.g., DefaultAccount, Guest) and Trusted Domain Objects (TDOs). If "Passwordnotrequired" is "True" or
          blank for any enabled user account, this is a finding. Member servers and stand-alone or nondomain-joined systems:
          Enter ''Get-CimInstance -Class Win32_Useraccount -Filter "PasswordRequired=False and LocalAccount=True" | FT Name,
          PasswordRequired, Disabled, LocalAccount''. Exclude disabled accounts (e.g., DefaultAccount, Guest). If any enabled
          user accounts are returned with a "PasswordRequired" status of "False", this is a finding.'
        multi_check: null
        negate: null
        selector: manual
        source_tree:
          attributes:
            selector: manual
            system: http://scap.nist.gov/schema/ocil/2
          children:
          - attributes:
              href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
