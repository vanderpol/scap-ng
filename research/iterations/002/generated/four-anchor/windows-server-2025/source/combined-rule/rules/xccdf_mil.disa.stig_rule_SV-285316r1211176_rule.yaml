rule:
  id: xccdf_mil.disa.stig_rule_SV-285316r1211176_rule
  title: Windows Server 2025 OpenSSH must not allow blank passwords.
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
