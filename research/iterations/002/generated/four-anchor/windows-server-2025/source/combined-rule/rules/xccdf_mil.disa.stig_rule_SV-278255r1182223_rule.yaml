rule:
  id: xccdf_mil.disa.stig_rule_SV-278255r1182223_rule
  title: The Windows Server 2025 "Load and unload device drivers" user right must only be assigned to the Administrators group.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
