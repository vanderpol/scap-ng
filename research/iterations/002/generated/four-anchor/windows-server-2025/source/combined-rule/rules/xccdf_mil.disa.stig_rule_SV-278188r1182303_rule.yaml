rule:
  id: xccdf_mil.disa.stig_rule_SV-278188r1182303_rule
  title: The Windows Server 2025 "Deny log on through Remote Desktop Services" user right on domain-joined member servers
    must be configured to prevent access from highly privileged domain accounts and all local accounts and from unauthenticated
    access on all systems.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-278188
  description: <VulnDiscussion>Inappropriately granting user rights provides system, administrative, and other high-level
    capabilities. The "Deny log on through Remote Desktop Services" user right defines the accounts that are prevented from
    logging on using Remote Desktop Services. In an Active Directory Domain, denying logons to the Enterprise Admins and Domain
    Admins groups on lower-trust systems helps mitigate the risk of privilege escalation from credential theft attacks, which
    could lead to the compromise of an entire domain. Local accounts on domain-joined systems must also be assigned this right
    to decrease the risk of lateral movement resulting from credential theft attacks. The Guests group must be assigned this
    right to prevent unauthenticated access.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
