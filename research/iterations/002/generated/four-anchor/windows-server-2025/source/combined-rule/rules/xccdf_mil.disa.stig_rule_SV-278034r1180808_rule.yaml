rule:
  id: xccdf_mil.disa.stig_rule_SV-278034r1180808_rule
  title: Windows Server 2025 must have the number of allowed bad logon attempts configured to three or less.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
