  group_path:
  - xccdf_mil.disa.stig_group_V-278034
  description: <VulnDiscussion>The account lockout feature, when enabled, prevents brute-force password attacks on the system.
    The higher this value is, the less effective the account lockout feature will be in protecting the local system. The number
    of bad logon attempts must be reasonably small to minimize the possibility of a successful password attack while allowing
    for honest errors made during normal user logon.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
