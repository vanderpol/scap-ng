        exports: []
        inline_content: 'This applies to domain controllers. It is not applicable for other systems. Review the auditing configuration
          for the Infrastructure object. Open "Active Directory Users and Computers" (available from various menus or run
          "dsa.msc"). Verify "Advanced Features" is selected in the "View" menu. Select the domain being reviewed in the left
          pane. Right-click the "Infrastructure" object in the right pane and select "Properties". Select the "Security" tab.
          Select "Advanced", and then select the "Auditing" tab. If the audit settings on the Infrastructure object are not
          at least as inclusive as those below, this is a finding: Type - Fail Principal - Everyone Access - Full Control
          Inherited from - None The success types listed below are defaults. Where Special is listed in the summary screens
          for Access, detailed Permissions are provided for reference. Various Properties selections may also exist by default.
          Type - Success Principal - Everyone Access - Special Inherited from - None (Access - Special = Permissions: Write
          all properties, All extended rights, Change infrastructure master) Two instances with the following summary information
          will be listed: Type - Success Principal - Everyone Access - (blank) Inherited from - (CN of domain) Note: If only
          one success instance is listed (matching the values above), it is permissible to enter a second (identical) audit
          entry for the Infrastructure object.'
        multi_check: null
        negate: null
        selector: manual
        source_tree:
          attributes:
            selector: manual
            system: http://scap.nist.gov/schema/ocil/2
          children:
          - attributes:
              href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
