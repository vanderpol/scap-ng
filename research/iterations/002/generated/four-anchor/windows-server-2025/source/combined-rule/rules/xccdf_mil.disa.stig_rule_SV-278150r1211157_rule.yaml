  assessment: &id001
    id: ng.scap14.xccdf_mil.disa.stig_rule_SV-278150r1211157_rule
    version: 1
    description: Windows Server 2025 Active Directory (AD) Infrastructure object must be configured with proper audit settings.
    semantic_model: scap-ng-generic-assessment-graph-0.1
    collect:
      oval:navy.navwar.niwcatlantic.scc.windows:obj:27815001:
        capability: scapng.collect.independent.shellcommand
        source_object_id: oval:navy.navwar.niwcatlantic.scc.windows:obj:27815001
        source_type: shellcommand_object
        source_namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
        version: '1'
        comment: Query both Fail and Success auditing settings for Infrastructure Organizational Unit (OU)
        query:
        - attributes:
            error_if_stderr_exists: 'true'
          kind: element
          name: behaviors
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
        - kind: element
          name: shell
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
          value: powershell
        - kind: element
          name: command
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
          value: '$path = ''AD:\CN=Infrastructure,'' + (Get-ADDomain).DistinguishedName; $aud = (Get-Acl $path -Audit).Audit;
            $hasFail = [bool]($aud | Where-Object {$_.IdentityReference -match ''Everyone|S-1-1-0'' -and $_.AuditFlags -eq
            ''Failure'' -and ($_.ActiveDirectoryRights -match ''GenericAll|FullControl|All'')}); $hasSucc = [bool]($aud |
            Where-Object {$_.IdentityReference -match ''Everyone|S-1-1-0'' -and $_.AuditFlags -eq ''Success'' -and ($_.ActiveDirectoryRights
            -match ''ExtendedRight|WriteProperty'')}); . { if (-not $hasFail -or -not $hasSucc) { $reasons = @(); if (-not
