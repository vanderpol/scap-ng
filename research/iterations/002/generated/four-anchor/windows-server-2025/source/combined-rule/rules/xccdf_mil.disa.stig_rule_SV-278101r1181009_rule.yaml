rule:
  id: xccdf_mil.disa.stig_rule_SV-278101r1181009_rule
  title: Windows Server 2025 AutoPlay must be disabled for all drives.
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-278101
  description: <VulnDiscussion>Allowing AutoPlay to execute may introduce malicious code to a system. AutoPlay begins reading
    from a drive as soon media is inserted into the drive. As a result, the setup file of programs or music on audio media
    may start. By default, AutoPlay is disabled on removable drives, such as the floppy disk drive (but not the CD-ROM drive)
    and on network drives. Enabling this policy disables AutoPlay on all drives.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
