    anonymous users" is set to "Disabled" (WN25-SO-000240). Review the permissions for the Windows installation directory
    (usually C:\Windows). Nonprivileged groups such as Users or Authenticated Users must not have greater than "Read & execute"
    permissions. Individual accounts must not be used to assign permissions. If permissions are not as restrictive as the
    default permissions listed below, this is a finding: Viewing in File Explorer: For each folder, view the Properties. Select
    the "Security" tab, and then click "Advanced". Default permissions: \Windows Type - "Allow" for all Inherited from - "None"
    for all Principal - Access - Applies to TrustedInstaller - Full control - This folder and subfolders SYSTEM - Modify -
