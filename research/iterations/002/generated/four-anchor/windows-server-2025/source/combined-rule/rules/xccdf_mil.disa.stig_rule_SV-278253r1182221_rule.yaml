      right, this is a finding: - Administrators. - Service. - Local Service. - Network Service. For server core installations,
      run the following command: Secedit /Export /Areas User_Rights /cfg c:\path\filename.txt Review the text file. If any
      SIDs other than the following are granted the "SeImpersonatePrivilege" user right, this is a finding: S-1-5-32-544 (Administrators)
      S-1-5-6 (Service) S-1-5-19 (Local Service) S-1-5-20 (Network Service) If an application requires this user right, this
