rule:
  id: xccdf_mil.disa.stig_rule_SV-278253r1182221_rule
  title: The Windows Server 2025 "Impersonate a client after authentication" user right must only be assigned to Administrators,
    Service, Local Service, and Network Service.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
