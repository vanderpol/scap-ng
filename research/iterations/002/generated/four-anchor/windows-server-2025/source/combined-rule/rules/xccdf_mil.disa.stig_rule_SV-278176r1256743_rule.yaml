rule:
  id: xccdf_mil.disa.stig_rule_SV-278176r1256743_rule
  title: The password for the krbtgt account on a domain must be reset at least every 180 days.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-278176
  description: <VulnDiscussion>The krbtgt account acts as a service account for the Kerberos Key Distribution Center (KDC)
    service. The account and password are created when a domain is created and the password is typically not changed. If the
    krbtgt account is compromised, attackers can create valid Kerberos Ticket Granting Tickets (TGT). The password must be
    changed twice to effectively remove the password history. Changing once, waiting for replication to complete and the amount
    of time equal to or greater than the maximum Kerberos ticket lifetime, and changing again reduces the risk of issues.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
