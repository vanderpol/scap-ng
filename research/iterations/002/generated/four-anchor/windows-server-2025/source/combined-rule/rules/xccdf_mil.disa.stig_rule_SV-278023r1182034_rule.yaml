        inline_content: Different methods are available to disable SMBv1 on Windows Server 2025. This is the preferred method,
          however if WN25-00-000390 and WN25-00-000400 are configured, this is not applicable. Open Windows PowerShell with
          elevated privileges (run as administrator). Enter "Get-WindowsFeature -Name FS-SMB1". If "Installed State" is "Installed",
          this is a finding. An Installed State of "Available" or "Removed" is not a finding.
