  group_path:
  - xccdf_mil.disa.stig_group_V-278219
  description: '<VulnDiscussion>Allowing anonymous access to named pipes or shares provides the potential for unauthorized
    system access. This setting restricts access to those defined in "Network access: Named Pipes that can be accessed anonymously"
    and "Network access: Shares that can be accessed anonymously", both of which must be blank under other requirements.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
