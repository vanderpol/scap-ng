  check: 'This applies to domain controllers. A separate version applies to other systems. Verify the effective setting in
    Local Group Policy Editor. Run gpedit.msc. Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings
    >> Security Settings >> Local Policies >> User Rights Assignment. If the following accounts or groups are not defined
    for the "Deny access to this computer from the network" user right, this is a finding: - Guests Group. For server core
    installations, run the following command: Secedit /Export /Areas User_Rights /cfg c:\path\filename.txt Review the text
    file. If the following SIDs are not defined for the "SeDenyNetworkLogonRight" user right, this is a finding. S-1-5-32-546
    (Guests)'
