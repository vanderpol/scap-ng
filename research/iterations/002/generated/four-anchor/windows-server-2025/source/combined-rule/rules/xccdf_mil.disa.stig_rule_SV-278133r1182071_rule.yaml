  description: '<VulnDiscussion>This policy setting determines whether the Kerberos Key Distribution Center (KDC) validates
    every request for a session ticket against the user rights policy of the target computer. The policy is enabled by default,
    which is the most secure setting for validating that access to target resources is not circumvented. Satisfies: SRG-OS-000112-GPOS-00057,
