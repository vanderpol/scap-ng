          password hash data) used by systems to determine access control, the severity is CAT I (e.g., OUs that include user
          accounts, including service/application accounts).


          If an OU with improper permissions does not include identification and authentication data used by systems to determine
          access control, the severity is CAT II (e.g., Workstation, Printer OUs).'
