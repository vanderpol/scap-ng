            text: 'This applies to domain controllers. It is not applicable for other systems.


              Review the permissions on domain-defined OUs.


              Open "Active Directory Users and Computers" (available from various menus or run "dsa.msc").


              Ensure "Advanced Features" is selected in the "View" menu.


              For each OU that is defined (folder in folder icon) excluding the Domain Controllers OU:


              Right-click the OU and select "Properties".


              Select the "Security" tab.


              If the Allow type permissions on the OU are not at least as restrictive as those below, this is a finding.


              The permissions shown are at the summary level. To view more detailed permissions, select "Advanced", then select
              the desired Permission entry, then click "View" or "Edit".


              Except where noted otherwise, the special permissions may include a wide range of permissions and properties
              and are acceptable for this requirement.


              CREATOR OWNER - Special permissions


              Self - Special permissions


              Authenticated Users - Read, Special permissions


              The Special permissions for Authenticated Users are Read type. If detailed permissions include any Create, Delete,
              Modify, or Write Permissions or Properties, this is a finding.


              SYSTEM - Full Control


              Domain Admins - Full Control


              Enterprise Admins - Full Control


              Key Admins - Special permissions


