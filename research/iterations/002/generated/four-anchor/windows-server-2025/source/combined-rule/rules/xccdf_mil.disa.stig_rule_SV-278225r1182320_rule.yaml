rule:
  id: xccdf_mil.disa.stig_rule_SV-278225r1182320_rule
  title: Windows Server 2025 LAN Manager authentication level must be configured to send NTLMv2 response only and to refuse
    LM and NTLM.
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
