  description: <VulnDiscussion>Inappropriately granting user rights provides system, administrative, and other high-level
    capabilities. Accounts with the "Access Credential Manager as a trusted caller" user right may be able to retrieve the
    credentials of other accounts from Credential Manager.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
