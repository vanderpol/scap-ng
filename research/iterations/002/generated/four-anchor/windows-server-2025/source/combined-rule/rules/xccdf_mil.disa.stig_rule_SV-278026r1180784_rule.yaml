  fix: Uninstall the Windows PowerShell 2.0 Engine. Start Server Manager. Select the server with the feature. Scroll down
    to "ROLES AND FEATURES" in the right pane. Select "Remove Roles and Features" from the drop-down "TASKS" list. Select
    the appropriate server on the "Server Selection" page and click "Next". Deselect "Windows PowerShell 2.0 Engine" under
    "Windows PowerShell" on the "Features" page. Click "Next" and "Remove" as prompted.
