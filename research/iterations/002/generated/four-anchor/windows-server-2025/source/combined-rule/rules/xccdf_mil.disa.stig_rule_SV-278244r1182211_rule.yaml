rule:
  id: xccdf_mil.disa.stig_rule_SV-278244r1182211_rule
  title: The Windows Server 2025 "Back up files and directories" user right must only be assigned to the Administrators group.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
