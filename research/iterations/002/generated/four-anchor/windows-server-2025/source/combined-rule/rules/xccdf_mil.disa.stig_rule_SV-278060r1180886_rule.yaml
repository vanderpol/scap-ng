rule:
  id: xccdf_mil.disa.stig_rule_SV-278060r1180886_rule
  title: Windows Server 2025 must be configured to audit logon failures.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
