  check: 'This applies to domain controllers, it is not applicable for other systems. Verify the effective setting in Local
    Group Policy Editor. Run gpedit.msc. Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >>
    Security Settings >> Local Policies >> User Rights Assignment. If any accounts or groups other than the following are
    granted the "Allow log on through Remote Desktop Services" user right, this is a finding: - Administrators. For server
    core installations, run the following command: Secedit /Export /Areas User_Rights /cfg c:\path\filename.txt Review the
    text file. If any SIDs other than the following are granted the "SeRemoteInteractiveLogonRight" user right, this is a
    finding. S-1-5-32-544 (Administrators)'
