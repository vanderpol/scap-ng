rule:
  id: xccdf_mil.disa.stig_rule_SV-278072r1180922_rule
  title: Windows Server 2025 must be configured to audit System - IPsec Driver successes.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
