rule:
  id: xccdf_mil.disa.stig_rule_SV-278260r1182228_rule
  title: The Windows Server 2025 "Profile single process" user right must only be assigned to the Administrators group.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
