  description: <VulnDiscussion>Inappropriately granting user rights provides system, administrative, and other high-level
    capabilities. Accounts with the "Profile single process" user right can monitor nonsystem processes performance. An attacker
    could use this to identify processes to attack.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
