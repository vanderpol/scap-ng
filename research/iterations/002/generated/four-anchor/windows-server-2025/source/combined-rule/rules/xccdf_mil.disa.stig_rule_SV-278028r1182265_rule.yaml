      definitions:
        oval:navy.navwar.niwcatlantic.scc.windows:def:278028:
          source_definition_id: oval:navy.navwar.niwcatlantic.scc.windows:def:278028
          class: compliance
          version: '1'
          criteria:
            children:
            - comment: FTP servers must be configured to prevent access to the system drive. If the site includes root of
                the drive this is a finding.
              kind: test_ref
              negate: false
              test_ref: oval:navy.navwar.niwcatlantic.scc.windows:tst:27802801
            - comment: FTP servers must be configured to prevent access to the system drive. If the site includes Program
                Files this is a finding.
              kind: test_ref
              negate: false
              test_ref: oval:navy.navwar.niwcatlantic.scc.windows:tst:27802802
            - comment: FTP servers must be configured to prevent access to the system drive. If the site includes Program
                Files(x86) this is a finding.
              kind: test_ref
              negate: false
              test_ref: oval:navy.navwar.niwcatlantic.scc.windows:tst:27802803
            - comment: FTP servers must be configured to prevent access to the system drive. If the site includes Windows
                Directory this is a finding.
              kind: test_ref
              negate: false
              test_ref: oval:navy.navwar.niwcatlantic.scc.windows:tst:27802804
            comment: null
            kind: boolean
            negate: false
            operator: AND
          metadata:
            children:
            - name: title
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Windows Server 2025 FTP servers must be configured to prevent access to the system drive.
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: 'If FTP is not installed on the system, this is NA.


                Open "Internet Information Services (IIS) Manager".


                Select "Sites" under the server name.


                For any sites with a Binding that lists FTP, right-click the site and select "Explore".


                If the site is not defined to a specific folder for shared FTP resources, this is a finding.


                If the site includes any system areas such as root of the drive, Program Files, or Windows directories, this
                is a finding.'
            name: metadata
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
