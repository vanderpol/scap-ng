  fix: Validate the site documentation to ensure the approval of use for Wi-Fi server connections. If the connection (s) have
    not been approved, go to "Settings" then "Network and Internet" and remove/disable the Wi-Fi adapter. Any Wi-Fi connections
    listed or in use must be documented and approved by the information system security officer (ISSO) or authorizing official
    (AO).
