  check: 'This applies to domain controllers. It is not applicable for other systems. Review the auditing configuration for
    the Domain Controller OU object. Open "Active Directory Users and Computers" (available from various menus or run "dsa.msc").
    Verify "Advanced Features" is selected in the "View" menu. Select the "Domain Controllers OU" under the domain being reviewed
    in the left pane. Right-click the "Domain Controllers OU" object and select "Properties". Select the "Security" tab. Select
    "Advanced", and then select the "Auditing" tab. If the audit settings on the Domain Controllers OU object are not at least
    as inclusive as those below, this is a finding: Type - Fail Principal - Everyone Access - Full Control Inherited from
    - None Applies to - This object and all descendant objects The success types listed below are defaults. Where Special
    is listed in the summary screens for Access, detailed Permissions are provided for reference. Various Properties selections
    may also exist by default. Type - Success Principal - Everyone Access - Special Inherited from - None Applies to - This
    object only (Access - Special = Permissions: all create, delete and modify permissions) Type - Success Principal - Everyone
    Access - Write all properties Inherited from - None Applies to - This object and all descendant objects Two instances
    with the following summary information will be listed: Type - Success Principal - Everyone Access - (blank) Inherited
    from - (CN of domain) Applies to - Descendant Organizational Unit objects'
