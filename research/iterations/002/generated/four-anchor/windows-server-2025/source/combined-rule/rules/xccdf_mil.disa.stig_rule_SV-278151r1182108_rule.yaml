rule:
  id: xccdf_mil.disa.stig_rule_SV-278151r1182108_rule
  title: Windows Server 2025 Active Directory (AD) Domain Controllers Organizational Unit (OU) object must be configured with
    proper audit settings.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-278151
  description: '<VulnDiscussion>When inappropriate audit settings are configured for directory service database objects, it
    may be possible for a user or process to update the data without generating any tracking data. The impact of missing audit
    data is related to the type of object. A failure to capture audit data for objects used by identification, authentication,
    or authorization functions could degrade or eliminate the ability to track changes to access policy for systems or data.
    For AD, there are a number of critical object types in the domain naming context of the AD database for which auditing
    is essential. This includes the Domain Controller OU object. Because changes to these objects can significantly impact
    access controls or the availability of systems, the absence of auditing data makes it impossible to identify the source
    of changes that impact the confidentiality, integrity, and availability of data and systems throughout an AD domain. The
    lack of proper auditing can result in insufficient forensic evidence needed to investigate an incident and prosecute the
    intruder. Satisfies: SRG-OS-000327-GPOS-00127, SRG-OS-000458-GPOS-00203, SRG-OS-000463-GPOS-00207, SRG-OS-000468-GPOS-00212</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
  discussion: null
