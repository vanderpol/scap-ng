rule:
  id: xccdf_mil.disa.stig_rule_SV-278146r1182098_rule
  title: Windows Server 2025 directory data (outside the root DSE) of a nonpublic directory must be configured to prevent
    anonymous access.
  severity: high
  weight: '10.0'
  role: null
