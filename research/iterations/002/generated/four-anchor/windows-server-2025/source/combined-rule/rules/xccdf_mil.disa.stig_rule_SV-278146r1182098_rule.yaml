  check: 'This applies to domain controllers. It is not applicable for other systems. Open command prompt (not elevated).
    Run "ldp.exe". From the "Connection menu", select "Bind". Clear the User, Password, and Domain fields. Select "Simple
    bind" for the Bind type, and then click "OK". Confirmation of anonymous access will be displayed at the end: res = ldap_simple_bind_s
    Authenticated as: ''NT AUTHORITY\ANONYMOUS LOGON'' From the "Browse" menu, select "Search". In the Search dialog, enter
    the DN of the domain naming context (e.g., "dc=disaost,dc=mil") in the Base DN field. Clear the Attributes field and select
    "Run". Error messages must display related to Bind and user not authenticated. If attribute data is displayed, anonymous
    access is enabled to the domain naming context and this is a finding. The following network controls allow the finding
    severity to be downgraded to a CAT II since these measures lower the risk associated with anonymous access. Network hardware
    ports at the site are subject to 802.1x authentication or MAC address restrictions. Premise firewall or host restrictions
    prevent access to ports 389, 636, 3268, and 3269 from client hosts not explicitly identified by domain (.mil) or IP address.'
