          name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:32501
        exports: []
        inline_content: 'This applies to domain controllers. It is not applicable for other systems. Open an elevated command
          prompt (run as administrator). Enter "ntdsutil". At the "ntdsutil:" prompt, enter "LDAP policies". At the "ldap
          policy:" prompt, enter "connections". At the "server connections:" prompt, enter "connect to server [host-name]"
          (where [host-name] is the computer name of the domain controller). At the "server connections:" prompt, enter "q".
          At the "ldap policy:" prompt, enter "show values". If the value for MaxConnIdleTime is greater than "300" (5 minutes)
          or is not specified, this is a finding. Enter "q" at the "ldap policy:" and "ntdsutil:" prompts to exit. Alternately,
          Dsquery can be used to display MaxConnIdleTime: Open "command prompt (Admin)". Enter the following command (on a
          single line). dsquery * "cn=Default Query Policy,cn=Query-Policies,cn=Directory Service, cn=Windows NT,cn=Services,cn=Configuration,dc=[forest-name]"
          -attr LDAPAdminLimits The quotes are required and dc=[forest-name] is the fully qualified LDAP name of the domain
          being reviewed (e.g., dc=disaost,dc=mil). If the results do not specify a "MaxConnIdleTime" or it has a value greater
          than "300" (5 minutes), this is a finding.'
        multi_check: null
        negate: null
        selector: manual
        source_tree:
          attributes:
            selector: manual
            system: http://scap.nist.gov/schema/ocil/2
          children:
          - attributes:
