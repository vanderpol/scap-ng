          name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:33901
        exports: []
        inline_content: 'This applies to domain controllers. It is not applicable for other systems. Security Option "Audit:
          Force audit policy subcategory settings (Windows 7 or later) to override audit policy category settings" must be
          set to "Enabled" (WN25-SO-000050) for the detailed auditing subcategories to be effective. Use the "AuditPol" tool
          to review the current Audit Policy configuration. Open PowerShell or a command prompt with elevated privileges ("Run
          as administrator"). Enter "AuditPol /get /category:*" Compare the "AuditPol" settings with the following. If the
          system does not audit the following, this is a finding: Account Management >> Computer Account Management - Success'
        multi_check: null
        negate: null
        selector: manual
        source_tree:
          attributes:
            selector: manual
            system: http://scap.nist.gov/schema/ocil/2
          children:
          - attributes:
              href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
              name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:33901
            name: check-content-ref
            namespace: http://checklists.nist.gov/xccdf/1.2
          - name: check-content
            namespace: http://checklists.nist.gov/xccdf/1.2
            text: "This applies to domain controllers. It is not applicable for other systems.\n\nSecurity Option \"Audit:\
              \ Force audit policy subcategory settings (Windows 7 or later) to override audit policy category settings\"\
              \ must be set to \"Enabled\" (WN25-SO-000050) for the detailed auditing subcategories to be effective. \n\n\
              Use the \"AuditPol\" tool to review the current Audit Policy configuration.\n\nOpen PowerShell or a command\
              \ prompt with elevated privileges (\"Run as administrator\").\n\nEnter \"AuditPol /get /category:*\"\n\nCompare\
              \ the \"AuditPol\" settings with the following.\n\nIf the system does not audit the following, this is a finding:\n\
              \nAccount Management >> Computer Account Management - Success"
          name: check
          namespace: http://checklists.nist.gov/xccdf/1.2
        system: http://scap.nist.gov/schema/ocil/2
      kind: check_candidates
