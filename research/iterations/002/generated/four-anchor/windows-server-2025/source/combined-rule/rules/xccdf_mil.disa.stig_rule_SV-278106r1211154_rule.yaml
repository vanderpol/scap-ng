rule:
  id: xccdf_mil.disa.stig_rule_SV-278106r1211154_rule
  title: Windows Server 2025 Security event log size must be configured to a value that holds at least one week of audit records.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
