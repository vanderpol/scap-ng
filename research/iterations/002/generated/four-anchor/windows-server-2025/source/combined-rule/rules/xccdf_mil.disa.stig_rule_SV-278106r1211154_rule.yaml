  fix: 'Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components >> Event Log
    Service >> Security >> Specify the maximum log file size (KB) to "Enabled" with a "Maximum Log Size (KB)" of a value that
    will contain one week of audit records or greater. Note: The registry entry value in the Check is an example; the value
    must equal at least one week''s worth of records in the environment.'
