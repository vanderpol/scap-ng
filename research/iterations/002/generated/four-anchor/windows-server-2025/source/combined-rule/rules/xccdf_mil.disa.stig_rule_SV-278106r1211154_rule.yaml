            name: check-content-ref
            namespace: http://checklists.nist.gov/xccdf/1.2
          - name: check-content
            namespace: http://checklists.nist.gov/xccdf/1.2
            text: "If the system is configured to write events directly to an audit server, this is not applicable.\n\nThe\
              \ registry configuration setting below must be set (at least) to a value equal to the size needed to contain\
              \ one week's worth of audit records in the security event log. \n\nThe value used below is an example that assumes\
              \ a typical week’s log size of 5GB.\n\nIf a registry value does not exist or is not configured to hold one week\
              \ of records, this is a finding:\n\nNote: The following registry entry is an example; the value must equal at\
              \ least one week's worth of records in the environment.\n\nRegistry Hive: HKEY_LOCAL_MACHINE\nRegistry Path:\
              \ \\SOFTWARE\\Policies\\Microsoft\\Windows\\EventLog\\Security\\\n\nValue Name: MaxSize\n\nType: REG_DWORD\n\
              Value: 0x4E2000 (5120000) (or greater)"
          name: check
          namespace: http://checklists.nist.gov/xccdf/1.2
        system: http://scap.nist.gov/schema/ocil/2
