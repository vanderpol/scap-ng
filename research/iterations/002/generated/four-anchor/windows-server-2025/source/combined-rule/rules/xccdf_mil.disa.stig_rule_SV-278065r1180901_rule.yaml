        exports: []
        inline_content: 'Security Option "Audit: Force audit policy subcategory settings (Windows 7 or later) to override
          audit policy category settings" must be set to "Enabled" (WN25-SO-000050) for the detailed auditing subcategories
          to be effective. Use the "AuditPol" tool to review the current Audit Policy configuration. Open PowerShell or a
          command prompt with elevated privileges ("Run as administrator"). Enter "AuditPol /get /category:*" Compare the
          "AuditPol" settings with the following. If the system does not audit the following, this is a finding: Object Access
          >> Removable Storage - Failure Virtual machines or systems that use network attached storage may generate excessive
          audit events for secondary virtual drives or the network attached storage when this setting is enabled. This may
          be set to Not Configured in such cases and would not be a finding.'
        multi_check: null
        negate: null
        selector: manual
        source_tree:
