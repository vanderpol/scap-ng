              \ or a command prompt with elevated privileges (\"Run as administrator\").\n\nEnter \"AuditPol /get /category:*\"\
              \n\nCompare the \"AuditPol\" settings with the following.\n\nIf the system does not audit the following, this\
              \ is a finding:\n\nObject Access >> Removable Storage - Failure\n\nVirtual machines or systems that use network\
              \ attached storage may generate excessive audit events for secondary virtual drives or the network attached\
              \ storage when this setting is enabled. This may be set to Not Configured in such cases and would not be a finding."
