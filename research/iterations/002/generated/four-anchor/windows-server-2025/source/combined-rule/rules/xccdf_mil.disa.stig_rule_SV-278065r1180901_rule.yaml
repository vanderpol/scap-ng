  description: <VulnDiscussion>Maintaining an audit trail of system activity logs can help identify configuration errors,
    troubleshoot service disruptions, and analyze compromises that have occurred, as well as detect attacks. Audit logs are
    necessary to provide a trail of evidence in case the system or network is compromised. Collecting this data is essential
    for analyzing the security of information assets and detecting signs of suspicious and unexpected behavior. Removable
    Storage auditing under Object Access records events related to access attempts on file system objects on removable storage
    devices.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
