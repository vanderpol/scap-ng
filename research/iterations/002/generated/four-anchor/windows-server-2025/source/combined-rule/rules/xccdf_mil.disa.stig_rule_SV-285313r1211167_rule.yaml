  check: 'If OpenSSH is not installed on the system, this requirement is not applicable. Verify that "OpenSSH" is installed
    with the following command: C:\ > Get-WindowsCapability -Online | Where-Object Name -like ''OpenSSH*'' Name : OpenSSH.Client~~~~0.0.1.0
    State : Installed Name : OpenSSH.Server~~~~0.0.1.0 State : Installed If installed, verify the service is active with the
    following command: C:\ > Get-Service sshd Status Name DisplayName ----- ----- ------------- Running sshd OpenSSH SSH Server
    If OpenSSH is installed and the "sshd" service is not "Running", this is a finding.'
