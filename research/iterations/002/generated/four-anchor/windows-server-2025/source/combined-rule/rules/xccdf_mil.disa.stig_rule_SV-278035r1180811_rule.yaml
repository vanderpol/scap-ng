rule:
  id: xccdf_mil.disa.stig_rule_SV-278035r1180811_rule
  title: Windows Server 2025 must have the period of time before the bad logon counter is reset configured to 15 minutes or
    greater.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
