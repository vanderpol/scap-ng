  fix: Remove emergency administrator accounts after a crisis has been resolved or configure the accounts to automatically
    expire within 72 hours. Domain accounts can be configured with an account expiration date, under "Account" properties.
    Local accounts can be configured to expire with the command "Net user [username] /expires:[mm/dd/yyyy]", where [username]
    is the name of the temporary user account.
