rule:
  id: xccdf_mil.disa.stig_rule_SV-278014r1182263_rule
  title: Windows Server 2025 must automatically remove or disable emergency accounts after the crisis is resolved or within
    72 hours.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-278014
  description: <VulnDiscussion>Emergency administrator accounts are privileged accounts established in response to crisis
    situations where the need for rapid account activation is required. Therefore, emergency account activation may bypass
    normal account authorization processes. If these accounts are automatically disabled, system maintenance during emergencies
    may not be possible, thus adversely affecting system availability. Emergency administrator accounts are different from
    infrequently used accounts (i.e., local logon accounts used by system administrators when network or normal logon/access
    is not available). Infrequently used accounts are not subject to automatic termination dates. Emergency accounts are accounts
    created in response to crisis situations, usually for use by maintenance personnel. The automatic expiration or disabling
    time period may be extended as needed until the crisis is resolved; however, it must not be extended indefinitely. A permanent
    account must be established for privileged users who need long-term maintenance accounts. To address access requirements,
    many operating systems can be integrated with enterprise-level authentication/access mechanisms that meet or exceed access
    control policy requirements.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
  platforms: []
