            name: check-content-ref
            namespace: http://checklists.nist.gov/xccdf/1.2
          - name: check-content
            namespace: http://checklists.nist.gov/xccdf/1.2
            text: "Verify the DoW Root CA certificates are installed as Trusted Root Certification Authorities.\n\nThe certificates\
              \ referenced below apply to unclassified systems. Refer to the PKE documentation for other networks.\n\nOpen\
              \ PowerShell as an administrator.\n\nExecute the following command:\n\nGet-ChildItem -Path Cert:Localmachine\\\
              root | Where Subject -Like \"*DOD*\" | FL Subject, NotAfter\n\nIf valid (and unexpired) DoW Root CA certificates\
              \ (such as those below) are not listed, this is a finding.\n\nNote: The Common Names (CN) below are examples.\
              \ Verify that the \"CN\" displayed is a DoW Root CA and is not expired. \n\nSubject: CN=DOD Root CA 3, OU=PKI,\
              \ OU=DOD, O=U.S. Government, C=US\nNotAfter: 12/30/2029\n\nSubject: CN=DOD Root CA 5, OU=PKI, OU=DOD, O=U.S.\
              \ Government, C=US\nNotAfter: 6/14/2041\n\nSubject: CN=DOD Root CA 6, OU=PKI, OU=DOD, O=U.S. Government, C=US\n\
              NotAfter: 1/24/2053\n\nAlternately, use the Certificates MMC snap-in:\n\nRun \"MMC\".\n\nSelect \"File\", \"\
              Add/Remove Snap-in\".\n\nSelect \"Certificates\" and click \"Add\".\n\nSelect \"Computer account\" and click\
              \ \"Next\".\n\nSelect \"Local computer: (the computer this console is running on)\" and click \"Finish\".\n\n\
              Click \"OK\".\n\nExpand \"Certificates\" and navigate to \"Trusted Root Certification Authorities >> Certificates\"\
              .\n\nFor each of the DoW Root CA certificates noted below:\n\nRight-click the certificate and select \"Open\"\
              .\n\nSelect the \"Details\" tab.\n\nVerify that expiration date is in the future.\n\nIf valid (unexpired) DoW\
              \ Root CA certificates (such as those below) are not listed, this is a finding.\n\nDOD Root CA 3\nDOD Root CA\
              \ 5\nDOD Root CA 6"
          name: check
          namespace: http://checklists.nist.gov/xccdf/1.2
        system: http://scap.nist.gov/schema/ocil/2
      kind: check_candidates
