          \ Certificates MMC snap-in:\n\nRun \"MMC\".\n\nSelect \"File\", \"Add/Remove Snap-in\".\n\nSelect \"Certificates\"\
          \ and click \"Add\".\n\nSelect \"Computer account\" and click \"Next\".\n\nSelect \"Local computer: (the computer\
          \ this console is running on)\" and click \"Finish\".\n\nClick \"OK\".\n\nExpand \"Certificates\" and navigate to\
          \ \"Trusted Root Certification Authorities >> Certificates\".\n\nFor each of the DoW Root CA certificates noted\
          \ below:\n\nRight-click the certificate and select \"Open\".\n\nSelect the \"Details\" tab.\n\nVerify that expiration\
          \ date is in the future.\n\nIf valid (unexpired) DoW Root CA certificates (such as those below) are not listed,\
          \ this is a finding.\n\nDOD Root CA 3\nDOD Root CA 5\nDOD Root CA 6"
