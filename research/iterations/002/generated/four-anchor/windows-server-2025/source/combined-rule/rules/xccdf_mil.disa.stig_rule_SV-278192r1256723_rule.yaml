rule:
  id: xccdf_mil.disa.stig_rule_SV-278192r1256723_rule
  title: Windows Server 2025 must have the DoW Root Certificate Authority (CA) certificates installed in the Trusted Root
    Store.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
