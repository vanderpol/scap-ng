  check: 'Verify the effective setting in Local Group Policy Editor. Run gpedit.msc. Navigate to Local Computer Policy >>
    Computer Configuration >> Windows Settings >> Security Settings >> Account Policies >> Password Policy. If the value for
    "Store passwords using reversible encryption" is not set to "Disabled", this is a finding. For server core installations,
    run the following command: Secedit /Export /Areas SecurityPolicy /CFG C:\Path\FileName.Txt If "ClearTextPassword" equals
    "1" in the file, this is a finding.'
