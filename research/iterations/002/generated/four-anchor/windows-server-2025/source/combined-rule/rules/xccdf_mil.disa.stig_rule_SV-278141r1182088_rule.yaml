rule:
  id: xccdf_mil.disa.stig_rule_SV-278141r1182088_rule
  title: Windows Server 2025 Active Directory Domain Controllers Organizational Unit (OU) object must have the proper access
    control permissions.
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-278141
  description: <VulnDiscussion>When Active Directory objects do not have appropriate access control permissions, it may be
    possible for malicious users to create, read, update, or delete the objects and degrade or destroy the integrity of the
    data. When the directory service is used for identification, authentication, or authorization functions, a compromise
    of the database objects could lead to a compromise of all systems that rely on the directory service. The Domain Controllers
    OU object requires special attention as the Domain Controllers are central to the configuration and management of the
    domain. Inappropriate access permissions defined for the Domain Controllers OU could allow an intruder or unauthorized
    personnel to make changes that could lead to the compromise of the domain.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
