rule:
  id: xccdf_mil.disa.stig_rule_SV-278159r1182124_rule
  title: Windows Server 2025 domain controllers must have a PKI server certificate.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
