rule:
  id: xccdf_mil.disa.stig_rule_SV-253367r958422_rule
  title: Command line data must be included in process creation events.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
