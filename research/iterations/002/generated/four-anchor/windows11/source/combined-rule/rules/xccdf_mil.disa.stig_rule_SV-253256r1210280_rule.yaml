rule:
  id: xccdf_mil.disa.stig_rule_SV-253256r1210280_rule
  title: Windows 11 systems must have Unified Extensible Firmware Interface (UEFI) firmware and be configured to run in UEFI
    mode, not Legacy BIOS.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
