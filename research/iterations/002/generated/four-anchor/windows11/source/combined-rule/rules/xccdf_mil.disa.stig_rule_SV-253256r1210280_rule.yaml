  group_path:
  - xccdf_mil.disa.stig_group_V-253256
  description: <VulnDiscussion>UEFI provides additional security features in comparison to legacy BIOS firmware, including
    Secure Boot. UEFI is required to support additional security features in Windows 11, including virtualization-based Security
    and Credential Guard. Systems with UEFI that are operating in Legacy BIOS mode will not support these security features.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
