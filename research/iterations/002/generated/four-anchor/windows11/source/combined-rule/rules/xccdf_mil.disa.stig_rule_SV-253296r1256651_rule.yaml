  description: <VulnDiscussion>The Windows Time Service controls time synchronization settings. Time synchronization is essential
    for authentication and auditing purposes. If the Windows Time Service is used, it must synchronize with a secure, authorized
    time source. Domain-joined systems are automatically configured to synchronize with domain controllers. If an NTP server
    is configured, it must synchronize with a secure, authorized time source.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
