rule:
  id: xccdf_mil.disa.stig_rule_SV-253267r1137695_rule
  title: Non-system-created file shares on a system must limit access to groups that require it.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
