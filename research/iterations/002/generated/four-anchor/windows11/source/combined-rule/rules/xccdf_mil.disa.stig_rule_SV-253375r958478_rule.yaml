  description: <VulnDiscussion>Some features may communicate with the vendor, sending system information or downloading data
    or components for the feature. Turning off this capability will prevent potentially sensitive information from being sent
    outside the enterprise and uncontrolled updates to the system. This setting prevents Windows from downloading a list of
    providers for the Web publishing and online ordering wizards.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
