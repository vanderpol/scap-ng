rule:
  id: xccdf_mil.disa.stig_rule_SV-253290r991589_rule
  title: Orphaned security identifiers (SIDs) must be removed from user rights on Windows 11.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
