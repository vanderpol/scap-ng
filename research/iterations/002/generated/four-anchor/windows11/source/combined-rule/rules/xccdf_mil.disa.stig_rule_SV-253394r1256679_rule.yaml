            children:
            - name: title
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: WN11-CC-000206 - Windows Update must not obtain updates from other PCs on the internet.
            - attributes:
                family: windows
              children:
              - name: platform
                namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
                text: Microsoft Windows 11
              name: affected
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Windows 11 allows Windows Update to obtain updates from additional sources instead of Microsoft. In addition
                to Microsoft, updates can be obtained from and sent to PCs on the local network as well as on the Internet.
                This is part of the Windows Update trusted process, however to minimize outside exposure, obtaining updates
                from or sending to systems on the internet must be prevented.
            name: metadata
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
