rule:
  id: xccdf_mil.disa.stig_rule_SV-253255r1210279_rule
  title: Windows 11 systems must have a Trusted Platform Module (TPM) enabled.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
