  check: Verify the system has a TPM and is ready for use. Run "tpm.msc". Review the sections in the center pane. "Status"
    must indicate it has been configured with a message such as "The TPM is ready for use" or "The TPM is on and ownership
    has been taken". TPM Manufacturer Information - Specific Version = 2.0 If a TPM is not found or is not ready for use,
