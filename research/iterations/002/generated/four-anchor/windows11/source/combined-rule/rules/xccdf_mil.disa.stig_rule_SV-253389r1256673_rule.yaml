  fix: 'For GPO-managed systems: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows
    Components >> Biometrics >> Facial Features >> "Configure enhanced anti-spoofing" to "Enabled". For Intune-managed systems:
    Revise the Intune policy to enable enhanced anti-spoofing for Facial Features.'
