rule:
  id: xccdf_mil.disa.stig_rule_SV-253447r991589_rule
  title: Caching of logon credentials must be limited.
  severity: low
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-253447
  description: <VulnDiscussion>The default Windows configuration caches the last logon credentials for users who log on interactively
    to a system. This feature is provided for system availability reasons, such as the user's machine being disconnected from
    the network or domain controllers being unavailable. Even though the credential cache is well-protected, if a system is
    attacked, an unauthorized individual may isolate the password to a domain user account using a password-cracking program
    and gain access to the domain.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
