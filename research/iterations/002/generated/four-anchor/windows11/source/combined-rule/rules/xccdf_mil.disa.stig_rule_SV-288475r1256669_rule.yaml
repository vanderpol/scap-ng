  fix: 'Remove existing Wi-Fi Direct adapters from the system. Open PowerShell with elevated privileges (run as administrator).
    Enter the following command: Get-NetAdapter -InterfaceDescription "Microsoft Wi-Fi Direct*" -IncludeHidden | Disable-NetAdapter
    -Confirm:$false".'
