rule:
  id: xccdf_mil.disa.stig_rule_SV-253285r1153425_rule
  title: The Windows PowerShell 2.0 feature must be disabled on the system.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
