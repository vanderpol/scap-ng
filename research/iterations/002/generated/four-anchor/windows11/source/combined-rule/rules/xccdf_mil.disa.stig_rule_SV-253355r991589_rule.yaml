  fix: 'Configure the policy value for Computer Configuration >> Administrative Templates >> MSS (Legacy) >> "MSS: (EnableICMPRedirect)
    Allow ICMP redirects to override OSPF generated routes" to "Disabled". This policy setting requires the installation of
    the MSS-Legacy custom templates included with the STIG package. "MSS-Legacy.admx" and "MSS-Legacy.adml" must be copied
    to the \Windows\PolicyDefinitions and \Windows\PolicyDefinitions\en-US directories respectively.'
