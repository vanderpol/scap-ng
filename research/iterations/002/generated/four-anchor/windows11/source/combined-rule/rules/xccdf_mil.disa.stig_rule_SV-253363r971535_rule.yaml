rule:
  id: xccdf_mil.disa.stig_rule_SV-253363r971535_rule
  title: Windows 11 must be configured to prioritize ECC Curves with longer key lengths first.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
