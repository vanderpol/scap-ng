rule:
  id: xccdf_mil.disa.stig_rule_SV-253494r1137691_rule
  title: The "Deny log on locally" user right on workstations must be configured to prevent access from highly privileged
    domain accounts on domain systems and unauthenticated access on all systems.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-253494
  description: <VulnDiscussion>Inappropriate granting of user rights can provide system, administrative, and other high-level
    capabilities. The "Deny log on locally" right defines accounts that are prevented from logging on interactively. In an
    Active Directory Domain, denying logons to the Enterprise Admins and Domain Admins groups on lower trust systems helps
    mitigate the risk of privilege escalation from credential theft attacks, which could lead to the compromise of an entire
    domain. The Guests group must be assigned this right to prevent unauthenticated access.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
