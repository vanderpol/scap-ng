rule:
  id: xccdf_mil.disa.stig_rule_SV-253357r958518_rule
  title: Local administrator accounts must have their privileged token filtered to prevent elevated privileges from being
    used over the network on domain systems.
  severity: medium
  weight: '10.0'
  role: null
