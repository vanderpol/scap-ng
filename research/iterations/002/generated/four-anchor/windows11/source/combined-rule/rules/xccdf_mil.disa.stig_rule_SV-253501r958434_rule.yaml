rule:
  id: xccdf_mil.disa.stig_rule_SV-253501r958434_rule
  title: The "Manage auditing and security log" user right must only be assigned to the Administrators group.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-253501
  description: '<VulnDiscussion>Inappropriate granting of user rights can provide system, administrative, and other high-level
    capabilities. Accounts with the "Manage auditing and security log" user right can manage the security log and change auditing
    configurations. This could be used to clear evidence of tampering. Satisfies: SRG-OS-000057-GPOS-00027, SRG-OS-000063-GPOS-00032</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
