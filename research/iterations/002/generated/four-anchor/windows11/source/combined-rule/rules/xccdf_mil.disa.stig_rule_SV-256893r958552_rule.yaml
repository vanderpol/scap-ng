  fix: 'For Windows 11 semi-annual channel, remove or disable the IE11 application. To disable IE11 as a standalone browser:
    Set the policy value for "Computer Configuration/Administrative Templates/Windows Components/Internet Explorer/Disable
    Internet Explorer 11 as a standalone browser" to "Enabled" with the option value set to "Never".'
