              text: WN11-PK-000010 - The External Root CA certificates must be installed in the Trusted Root Store on unclassified
                systems.
            - attributes:
                family: windows
              children:
              - name: platform
                namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
                text: Microsoft Windows 11
              name: affected
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: To ensure secure websites protected with External Certificate Authority (ECA) server certificates are
                properly validated, the system must trust the ECA Root CAs. The ECA root certificates will ensure the trust
                chain is established for server certificates issued from the External CAs. This requirement only applies to
                unclassified systems.
            name: metadata
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
