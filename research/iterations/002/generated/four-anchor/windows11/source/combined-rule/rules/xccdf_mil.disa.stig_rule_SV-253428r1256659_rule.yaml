          text: "Verify the ECA Root CA certificates are installed on unclassified systems as Trusted Root Certification Authorities.\n\
            \nRun \"PowerShell\" as an administrator.\n\nExecute the following command:\n\nGet-ChildItem -Path Cert:Localmachine\\\
            root | Where Subject -Like \"*ECA*\" | FL Subject, NotAfter\n\nIf valid ECA Root CA certificates (such as those\
            \ below) are not displayed, this is a finding. \n\nNote: The Common Names (CN) below are examples. Verify the\
            \ \"CN\" displayed (ECA Root CA) is not expired. As of this writing, ECA Root CA 4 and ECA Root 5 are valid (among\
            \ others).\n\nSubject: CN=ECA Root CA 4, OU=ECA, O=U.S. Government, C=US\nSubject: CN=ECA Root CA 5, OU=ECA, O=U.S.\
            \ Government, C=US\n\nAlternately, use the Certificates MMC snap-in:\n\nRun \"MMC\".\n\nSelect \"File\" and \"\
            Add/Remove Snap-in\".\n\nSelect \"Certificates\" and click \"Add\".\n\nSelect \"Computer account\" and click \"\
            Next\".\n\nSelect \"Local computer: (the computer this console is running on)\" and click \"Finish\".\n\nClick\
            \ \"OK\".\n\nExpand \"Certificates\" and navigate to Trusted Root Certification Authorities >> Certificates.\n\
            \nFor each ECA Root CA certificate displayed:\n\nRight-click on the certificate and select \"Open\".\n\nSelect\
            \ the \"Details\" tab.\n\nVerify the Expiration Date is a future date.\n\nScroll to the bottom and select \"Subject\"\
            .\n\nIf any of the certificates listed do not include \"ECA Root CA\" in the name or are expired, this is a finding.\n\
            \nNote: This should not be relied upon as a complete list of possible ECA Root CA certificates.\n\nECA Root CA\
            \ 4\nECA Root CA 5"
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
