rule:
  id: xccdf_mil.disa.stig_rule_SV-253428r1256659_rule
  title: The External Root CA certificates must be installed in the Trusted Root Store on unclassified systems.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
