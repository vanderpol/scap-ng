  group_path:
  - xccdf_mil.disa.stig_group_V-253428
  description: <VulnDiscussion>To ensure secure websites protected with External Certificate Authority (ECA) server certificates
    are properly validated, the system must trust the ECA Root CAs. The ECA root certificates will ensure the trust chain
    is established for server certificates issued from the External CAs. This requirement applies only to unclassified systems.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
