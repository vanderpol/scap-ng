  fix: 'Change the enabled local Administrator account password at least every 60 days. Windows LAPS must be used to change
    the built-in Administrator account password. Domain-joined and nondomain-joined systems can configure this to occur more
    frequently. LAPS will change the password every 30 days by default. Operational limitations preventing the use of LAPS
    must be approved by the AO. More information is available at: https://techcommunity.microsoft.com/t5/windows-it-pro-blog/by-popular-demand-windows-laps-available-now/ba-p/3788747
    https://learn.microsoft.com/en-us/windows-server/identity/laps/laps-overview#windows-laps-supported-platforms-and-azure-ad-laps-preview-status'
