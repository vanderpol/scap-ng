  description: <VulnDiscussion>The longer a password is in use, the greater the opportunity for someone to gain unauthorized
    knowledge of the password. A local Administrator account is not generally used and its password may not be changed as
    frequently as necessary. Changing the password for enabled Administrator accounts on a regular basis will limit their
    exposure. Windows LAPS must be used to change the built-in Administrator account password. Operational limitations preventing
    the use of Windows Local Administrator Password Solution (LAPS) must be approved by the authorizing official (AO).</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
