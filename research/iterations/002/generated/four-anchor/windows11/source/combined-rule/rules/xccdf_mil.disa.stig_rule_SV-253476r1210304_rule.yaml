rule:
  id: xccdf_mil.disa.stig_rule_SV-253476r1210304_rule
  title: Passwords for enabled local Administrator accounts must be changed at least every 60 days.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
