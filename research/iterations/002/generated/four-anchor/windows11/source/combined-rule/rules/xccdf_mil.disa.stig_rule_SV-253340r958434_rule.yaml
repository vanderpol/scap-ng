  fix: Ensure the permissions on the Application event log (Application.evtx) are configured to prevent standard user accounts
    or groups from having access. The default permissions listed below satisfy this requirement. Eventlog - Full Control SYSTEM
    - Full Control Administrators - Full Control The default location is the "%SystemRoot%\SYSTEM32\WINEVT\LOGS" directory.
    If the location of the logs has been changed, when adding Eventlog to the permissions, it must be entered as "NT Service\Eventlog".
