  fix: 'For GPO-managed systems: Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings
    >> Local Policies >> Security Options >> "System cryptography: Use FIPS compliant algorithms for encryption, hashing,
    and signing" to "Enabled". For Intune-managed systems: Set the Intune System Cryptography Policy to use FIPS-compliant
    algorithms for encryption, hashing, and signing.'
