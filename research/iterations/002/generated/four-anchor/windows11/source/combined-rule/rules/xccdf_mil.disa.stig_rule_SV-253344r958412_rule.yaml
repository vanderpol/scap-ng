rule:
  id: xccdf_mil.disa.stig_rule_SV-253344r958412_rule
  title: Windows 11 must be configured to audit Other Policy Change Events Failures.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-253344
  description: <VulnDiscussion>Maintaining an audit trail of system activity logs can help identify configuration errors,
    troubleshoot service disruptions, and analyze compromises that have occurred, as well as detect attacks. Audit logs are
    necessary to provide a trail of evidence in case the system or network is compromised. Collecting this data is essential
    for analyzing the security of information assets and detecting signs of suspicious and unexpected behavior. Audit Other
    Policy Change Events contains events about EFS Data Recovery Agent policy changes, changes in Windows Filtering Platform
    filter, status on Security policy settings updates for local Group Policy settings, Central Access Policy changes, and
    detailed troubleshooting events for Cryptographic Next Generation (CNG) operations.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
