rule:
  id: xccdf_mil.disa.stig_rule_SV-253429r1256662_rule
  title: The DoW Interoperability Root CA cross-certificates must be installed in the Untrusted Certificates Store on unclassified
    systems.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
