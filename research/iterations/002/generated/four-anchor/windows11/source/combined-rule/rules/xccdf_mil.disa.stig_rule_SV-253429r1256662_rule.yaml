  fix: Install valid (unexpired) DoW Interoperability Root CA cross-certificates on unclassified systems. The list below is
    not to be treated as exhaustive. The STIG should not be used as a definitive resource for the organizationally approved
    certificates for the systems. DoD Interoperability Root CA 2 The certificates can be installed using the InstallRoot tool.
    The tool and user guide are available on Cyber Exchange at https://cyber.mil/pki-pke/tools-configuration-files. Certificate
    bundles published by the PKI can be found at https://crl.gds.disa.mil/.
