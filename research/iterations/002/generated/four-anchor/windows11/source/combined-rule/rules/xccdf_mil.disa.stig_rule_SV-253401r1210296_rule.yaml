              text: WN11-CC-000260 - Windows 11 must be configured to require a minimum PIN length of six characters or greater
            - attributes:
                family: windows
              children:
              - name: platform
                namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
                text: Microsoft Windows 11
              name: affected
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: 'Windows allows the use of PINs and biometrics for authentication without sending a password to a network
                or website where it could be compromised. Longer minimum PIN lengths increase the available combinations an
                attacker would have to attempt. Shorter minimum length significantly reduces the strength.


                Note: A different registry location is needed when systems are managed by Intune versus GPO.'
            name: metadata
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
