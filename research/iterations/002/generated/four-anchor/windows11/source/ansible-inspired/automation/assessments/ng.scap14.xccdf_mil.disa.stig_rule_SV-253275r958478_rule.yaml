      exports: []
      inline_content: Verify it has not been installed on the system. Run "Programs and Features". Select "Turn Windows features
        on or off". If the entries for "Internet Information Services" or "Internet Information Services Hostable Web Core"
        are selected, this is a finding. If an application requires IIS or a subset to be installed to function, this needs
        be documented with the ISSO. In addition, any applicable requirements from the IIS STIG must be addressed.
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:4101
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify it has not been installed on the system.


            Run "Programs and Features".

            Select "Turn Windows features on or off".


            If the entries for "Internet Information Services" or "Internet Information Services Hostable Web Core" are selected,
            this is a finding.


            If an application requires IIS or a subset to be installed to function, this needs be documented with the ISSO.
            In addition, any applicable requirements from the IIS STIG must be addressed.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
