  id: ng.manual.xccdf_mil.disa.stig_rule_SV-253429r1256662_rule
  version: 1
  description: The DoW Interoperability Root CA cross-certificates must be installed in the Untrusted Certificates Store on
    unclassified systems.
  name: The DoW Interoperability Root CA cross-certificates must be installed in the Untrusted Certificates Store on unclassified
    systems.
