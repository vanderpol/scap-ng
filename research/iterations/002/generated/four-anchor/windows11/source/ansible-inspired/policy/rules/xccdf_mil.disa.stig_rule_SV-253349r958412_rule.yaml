  check: 'Use the AuditPol tool to review the current Audit Policy configuration: Open a Command Prompt with elevated privileges
    ("Run as Administrator"). Enter "AuditPol /get /category:*". Compare the AuditPol settings with the following. If the
    system does not audit the following, this is a finding: Policy Change >> MPSSVC Rule-Level Policy Change - Failure'
