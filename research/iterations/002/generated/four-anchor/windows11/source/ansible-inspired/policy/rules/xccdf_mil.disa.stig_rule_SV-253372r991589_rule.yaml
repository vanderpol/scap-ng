scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'The default behavior is for Early Launch Antimalware - Boot-Start Driver Initialization policy is to enforce "Good,
    unknown and bad but critical" (preventing "bad"). If the registry value name below does not exist, this is a finding.
    If it exists and is configured with a value of "7", this is a finding. Registry Hive: HKEY_LOCAL_MACHINE Registry Path:
    \SYSTEM\CurrentControlSet\Policies\EarlyLaunch\ Value Name: DriverLoadPolicy Value Type: REG_DWORD Value: 1, 3, or 8 Possible
    values for this setting are: 8 - Good only 1 - Good and unknown 3 - Good, unknown and bad but critical 7 - All (which
    includes "Bad" and would be a finding)'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-253372r991589_rule
