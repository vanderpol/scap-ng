    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: '<VulnDiscussion>Windows allows the use of PINs and biometrics for authentication without sending a password
    to a network or website where it could be compromised. Longer minimum PIN lengths increase the available combinations
    an attacker would have to attempt. Shorter minimum length significantly reduces the strength. Note: A different registry
    location is needed when systems are managed by Intune versus GPO.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
