rule:
  abstract: false
  check: Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy >>
    Computer Configuration >> Windows Settings >> Security Settings >> Account Policies >> Password Policy. If the value for
    "Password must meet complexity requirements" is not set to "Enabled", this is a finding. If the site is using a password
    filter that requires this setting be set to "Disabled" for the filter to be used, this would not be considered a finding.
