        name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:6101
      exports: []
      inline_content: 'Different methods are available to disable SMBv1 on Windows 11. This is the preferred method, however
        if WN11-00-000165 and WN11-00-000170 are configured, this is NA. Run "Windows PowerShell" with elevated privileges
        (run as administrator). Enter the following: Get-WindowsOptionalFeature -Online | Where FeatureName -eq SMB1Protocol
        If "State : Enabled" is returned, this is a finding. Alternately: Search for "Features". Select "Turn Windows features
        on or off". If "SMB 1.0/CIFS File Sharing Support" is selected, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:6101
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Different methods are available to disable SMBv1 on Windows 11. This is the preferred method, however if
            WN11-00-000165 and WN11-00-000170 are configured, this is NA.


            Run "Windows PowerShell" with elevated privileges (run as administrator).


            Enter the following:

            Get-WindowsOptionalFeature -Online | Where FeatureName -eq SMB1Protocol


            If "State : Enabled" is returned, this is a finding.


            Alternately:

            Search for "Features".


            Select "Turn Windows features on or off".


            If "SMB 1.0/CIFS File Sharing Support" is selected, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
