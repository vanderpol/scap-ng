    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>Accounts or groups given rights on a system may show up as unresolved SIDs for various reasons
    including deletion of the accounts or groups. If the account or group objects are reanimated, there is a potential they
    may still have rights no longer intended. Valid domain accounts or groups may also show up as unresolved SIDs if a connection
    to the domain cannot be established for some reason.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
