scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: If a hosted hypervisor (Hyper-V, VMware Workstation, etc.) is installed on the system, verify only authorized user
    accounts are allowed to run virtual machines. For Hyper-V, run "Computer Management". Navigate to System Tools >> Local
    Users and Groups >> Groups. Double click on "Hyper-V Administrators". If any unauthorized groups or user accounts are
    listed in "Members:", this is a finding. For hosted hypervisors other than Hyper-V, verify only authorized user accounts
    have access to run the virtual machines. Restrictions may be enforced by access to the physical system, software restriction
    policies, or access restrictions built into the application. If any unauthorized groups or user accounts have access to
    create or run virtual machines, this is a finding. All users authorized to create or run virtual machines must be documented
    with the ISSM/ISSO. Accounts nested within group accounts must be documented as individual accounts and not the group
    accounts.
  checks:
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-253271r958702_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-253271r958702_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>Allowing other operating systems to run on a secure system may allow users to circumvent security.
    For Hyper-V, preventing unauthorized users from being assigned to the Hyper-V Administrators group will prevent them from
    accessing or creating virtual machines on the system. The Hyper-V Hypervisor is used by virtualization-based Security
    features such as Credential Guard on Windows 11; however, it is not the full Hyper-V installation.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
