            text: Enhanced diagnostic data must be limited to the minimum required to support Windows Analytics.
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: Some features may communicate with the vendor, sending system information or downloading data or components
              for the feature. Limiting this capability will prevent potentially sensitive information from being sent outside
              the enterprise. The "Enhanced" level for telemetry includes additional information beyond "Security" and "Basic"
              on how Windows and apps are used and advanced reliability data. Windows Analytics can use a "limited enhanced"
              level to provide information such as health data for devices.
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
