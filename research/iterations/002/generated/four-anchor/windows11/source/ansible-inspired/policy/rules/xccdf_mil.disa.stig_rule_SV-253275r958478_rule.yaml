rule:
  abstract: false
  check: Verify it has not been installed on the system. Run "Programs and Features". Select "Turn Windows features on or
    off". If the entries for "Internet Information Services" or "Internet Information Services Hostable Web Core" are selected,
    this is a finding. If an application requires IIS or a subset to be installed to function, this needs be documented with
    the ISSO. In addition, any applicable requirements from the IIS STIG must be addressed.
