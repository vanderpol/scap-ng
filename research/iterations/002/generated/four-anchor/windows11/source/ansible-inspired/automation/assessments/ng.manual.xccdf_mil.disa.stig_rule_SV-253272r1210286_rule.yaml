          text: "Run \"Computer Management\".\n\nNavigate to System Tools >> Local Users and Groups >> Users.\n\nIf local\
            \ users other than the accounts listed below exist on a workstation in a domain, this is a finding. \n\nThe accounts\
            \ listed assumes a system is joined to a domain and thus (per best practice), the local default accounts have\
            \ been disabled.\n\nFor standalone or nondomain-joined systems, this is Not Applicable.\n\nBuilt-in administrator\
            \ account (Disabled, SID ending in 500)\nBuilt-in guest account (Disabled, SID ending in 501)\nBuilt-in DefaultAccount\
            \ (Disabled, SID ending in 503)\nBuilt-in defaultuser0 (Disabled, *SID unique per workstation)\nBuilt-in WDAGUtilityAccount\
            \ (Disabled, SID ending in 504)\nLocal administrator account(s)\n* Note that the SID for defaultuser0 is machine-specific\
            \ and immutable (cannot be changed). It will differ per Windows installation.\n\nAll of the built-in accounts\
            \ may not exist on a system, depending on the Windows 11 version."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
