      exports: []
      inline_content: 'This requirement is applicable to domain-joined systems, for standalone systems this is NA. Verify
        the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy >> Computer
        Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment. If the following
        groups or accounts are not defined for the "Deny log on as a service" right , this is a finding: Domain Systems Only:
        Enterprise Admins Group Domain Admins Group'
      multi_check: null
      negate: null
