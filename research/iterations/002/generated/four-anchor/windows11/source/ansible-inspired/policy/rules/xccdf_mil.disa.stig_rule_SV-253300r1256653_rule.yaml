    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>A system is more vulnerable to unauthorized access when system users recycle the same password
    several times without being required to change a password to a unique password on a regularly scheduled basis. This enables
    users to effectively negate the purpose of mandating periodic password changes. The default value is 24 for Windows domain
    systems. DoW has determined this is the appropriate value for all Windows systems.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
