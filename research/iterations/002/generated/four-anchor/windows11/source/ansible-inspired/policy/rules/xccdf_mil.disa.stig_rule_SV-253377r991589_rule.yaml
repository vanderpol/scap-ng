  check: 'This requirement is applicable to domain-joined systems, for standalone systems this is NA. The default behavior
    for "Support device authentication using certificate" is "Automatic". If it exists and is configured with a value of "0",
    this is a finding. Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Kerberos\Parameters\
    Value Name: DevicePKInitEnabled Value Type: REG_DWORD Value: 1 (or if the Value Name does not exist)'
