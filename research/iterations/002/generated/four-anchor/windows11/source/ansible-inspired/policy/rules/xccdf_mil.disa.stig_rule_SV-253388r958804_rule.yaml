authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'If the following registry value does not exist or is not configured as specified, this is a finding: Registry Hive:
    HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Microsoft\Windows\CurrentVersion\policies\Explorer\ Value Name: NoDriveTypeAutoRun
    Value Type: REG_DWORD Value: 0x000000ff (255) Note: If the value for NoDriveTypeAutorun is entered manually, it must be
    entered as "ff" when Hexadecimal is selected, or "255" with Decimal selected. Using the policy value specified in the
    Fix section will enter it correctly.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-253388r958804_rule
