      exports: []
      inline_content: 'If the following registry value does not exist or is not configured as specified, this is a finding:
        Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\ Value
        Name: LegalNoticeCaption Value Type: REG_SZ Value: See message title above "DoD Notice and Consent Banner", "US Department
        of Defense Warning Statement" or a site-defined equivalent, this is a finding. If a site-defined title is used, it
        can in no case contravene or modify the language of the banner text required in WN11-SO-000075.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:36901
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'If the following registry value does not exist or is not configured as specified, this is a finding:


            Registry Hive: HKEY_LOCAL_MACHINE

            Registry Path: \SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\


            Value Name: LegalNoticeCaption


