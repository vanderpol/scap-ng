          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: A system is more vulnerable to unauthorized access when system users recycle the same password several times
              without being required to change a password to a unique password on a regularly scheduled basis. This enables
              users to effectively negate the purpose of mandating periodic password changes. The default value is 24 for
              Windows domain systems. DoW has decided this is the appropriate value for all Windows systems.
