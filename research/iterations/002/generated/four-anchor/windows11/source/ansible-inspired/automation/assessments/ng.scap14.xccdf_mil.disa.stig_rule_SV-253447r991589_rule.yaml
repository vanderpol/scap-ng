            text: WN11-SO-000085 - Caching of logon credentials must be limited.
          - attributes:
              family: windows
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Microsoft Windows 11
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: The default Windows configuration caches the last logon credentials for users who log on interactively to
              a system. This feature is provided for system availability reasons, such as the user's machine being disconnected
              from the network or domain controllers being unavailable. Even though the credential cache is well-protected,
              if a system is attacked, an unauthorized individual may isolate the password to a domain user account using
              a password-cracking program and gain access to the domain.
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
        source_definition_id: oval:mil.disa.stig.windows11:def:253447
