            text: WN11-UR-000075 - The "Deny log on as a batch job" user right on domain-joined workstations must be configured
              to prevent access from highly privileged domain accounts.
          - attributes:
              family: windows
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Microsoft Windows 11
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'Inappropriate granting of user rights can provide system, administrative, and other high-level capabilities.


              The "Deny log on as a batch job" right defines accounts that are prevented from logging on to the system as
              a batch job, such as Task Scheduler.


              In an Active Directory Domain, denying logons to the Enterprise Admins and Domain Admins groups on lower trust
              systems helps mitigate the risk of privilege escalation from credential theft attacks which could lead to the
              compromise of an entire domain.'
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
        source_definition_id: oval:mil.disa.stig.windows11:def:253492
