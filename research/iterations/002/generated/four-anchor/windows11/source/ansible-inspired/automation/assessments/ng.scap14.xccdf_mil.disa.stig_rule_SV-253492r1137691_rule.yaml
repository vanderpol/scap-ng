        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'This requirement is applicable to domain-joined systems, for standalone systems this is NA.


            Verify the effective setting in Local Group Policy Editor.

            Run "gpedit.msc".


            Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local
            Policies >> User Rights Assignment.


            If the following groups or accounts are not defined for the "Deny log on as a batch job" right, this is a finding:


            Domain Systems Only:

            Enterprise Admin Group

            Domain Admin Group'
        name: check
