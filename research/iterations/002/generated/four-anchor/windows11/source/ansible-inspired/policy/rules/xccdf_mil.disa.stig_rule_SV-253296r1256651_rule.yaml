rule:
  abstract: false
  check: 'Review the Windows time service configuration. Open an elevated "Command Prompt" (run as administrator). Enter "W32tm
    /query /configuration". Domain-joined systems (excluding the domain controller with the PDC emulator role): If the value
    for "Type" under "NTP Client" is not "NT5DS", this is a finding.'
  checks:
