    kind: cpe_name
    name: cpe:/o:microsoft:windows_11
    ref: cpe:/o:microsoft:windows_11
  extends: null
  fix: Configure the policy value for Computer Configuration >> Administrative Templates >> System >> Device Guard >> "Turn
    On virtualization-based Security" to "Enabled" with "Enabled with UEFI lock" or "Enabled without lock" selected for "virtualization-based
    Protection of Code Integrity:". "Enabled with UEFI lock" is preferred as more secure; however, it cannot be turned off
    remotely through a group policy change if there is an issue. "Enabled without lock" will allow this to be turned off remotely
    while testing for issues.
