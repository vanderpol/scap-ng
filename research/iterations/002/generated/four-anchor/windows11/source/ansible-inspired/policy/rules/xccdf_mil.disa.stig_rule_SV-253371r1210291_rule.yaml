  default_check: default
  description: <VulnDiscussion>Virtualization-based protection of code integrity enforces kernel mode memory protections as
    well as protecting Code Integrity validation paths. This isolates the processes from the rest of the operating system
    and can only be accessed by privileged system software.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
