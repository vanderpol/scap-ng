        name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:43701
      exports: []
      inline_content: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer
        Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment.
        If any groups or accounts other than the following are granted the "Access this computer from the network" user right,
        this is a finding: Administrators Remote Desktop Users If a domain application account such as for a management tool
        requires this user right, this would not be a finding. Vendor documentation must support the requirement for having
        the user right. The requirement must be documented with the ISSO. The application account, managed at the domain level,
        must meet requirements for application account passwords, such as length and frequency of changes as defined in the
        Windows Server STIGs.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:43701
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify the effective setting in Local Group Policy Editor.

            Run "gpedit.msc".


            Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local
            Policies >> User Rights Assignment.


            If any groups or accounts other than the following are granted the "Access this computer from the network" user
            right, this is a finding:


            Administrators

            Remote Desktop Users


            If a domain application account such as for a management tool requires this user right, this would not be a finding.


            Vendor documentation must support the requirement for having the user right.


            The requirement must be documented with the ISSO.


            The application account, managed at the domain level, must meet requirements for application account passwords,
            such as length and frequency of changes as defined in the Windows Server STIGs.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
