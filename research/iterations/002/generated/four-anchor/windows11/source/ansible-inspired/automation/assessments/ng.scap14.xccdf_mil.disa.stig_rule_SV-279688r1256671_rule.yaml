              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Microsoft Windows 11
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements\
              \ or mission objectives. These unnecessary capabilities or services are often overlooked and therefore, may\
              \ remain unsecured. They increase the risk to the platform by providing additional attack vectors.\n\n\tOperating\
              \ systems are capable of providing a wide variety of functions and services. Some of the functions and services,\
              \ provided by default, may not be necessary to support essential organizational operations (e.g., key missions,\
              \ functions).\n\n\tThe Copilot Rewrite functionality within Notepad and Image Generation within Paint is dependent\
              \ upon the use of AI credits from a Microsoft 365 Personal or Family subscription. Organizational users must\
              \ not use personal accounts to login to applications on enterprise machines."
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
