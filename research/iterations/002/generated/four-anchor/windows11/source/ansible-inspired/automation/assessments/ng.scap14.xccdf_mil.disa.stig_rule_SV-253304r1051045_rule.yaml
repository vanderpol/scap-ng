        name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:9301
      exports: []
      inline_content: Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer
        Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Account Policies >> Password Policy.
        If the value for "Password must meet complexity requirements" is not set to "Enabled", this is a finding. If the site
        is using a password filter that requires this setting be set to "Disabled" for the filter to be used, this would not
        be considered a finding.
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:9301
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify the effective setting in Local Group Policy Editor.

            Run "gpedit.msc".


            Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Account
            Policies >> Password Policy.


            If the value for "Password must meet complexity requirements" is not set to "Enabled", this is a finding.


            If the site is using a password filter that requires this setting be set to "Disabled" for the filter to be used,
            this would not be considered a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
