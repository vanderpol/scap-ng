          \ permissions for the sample directories below. Non-privileged groups such as Users or Authenticated Users must\
          \ not have greater than read & execute permissions except where noted as defaults. (Individual accounts must not\
          \ be used to assign permissions.)\n\nSelect the \"Security\" tab, and the \"Advanced\" button.\n\nC:\\\nType - \"\
          Allow\" for all\nInherited from - \"None\" for all\nPrincipal - Access - Applies to\nAdministrators - Full control\
