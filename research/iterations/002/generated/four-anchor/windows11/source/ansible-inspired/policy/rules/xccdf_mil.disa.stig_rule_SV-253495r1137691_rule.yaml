scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy >>
    Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment. If the following
    groups or accounts are not defined for the "Deny log on through Remote Desktop Services" right, this is a finding: If
    Remote Desktop Services is not used by the organization, the "Everyone" group can replace all of the groups listed below.
    Domain Systems Only: Enterprise Admins group Domain Admins group Local account (see Note below) All Systems: Guests group
    Privileged Access Workstations (PAWs) dedicated to the management of Active Directory are exempt from denying the Enterprise
    Admins and Domain Admins groups. (See the Windows Privileged Access Workstation STIG for PAW requirements.) Note: "Local
    account" is a built-in security group used to assign user rights and permissions to all local accounts.'
  checks:
