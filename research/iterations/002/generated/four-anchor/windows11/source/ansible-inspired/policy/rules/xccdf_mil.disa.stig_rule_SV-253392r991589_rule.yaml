rule:
  abstract: false
  check: 'If "Enhanced" level is enabled for telemetry, this must be configured. If "Security" or "Basic" are configured,
    this is NA. (See WN11-CC-000205). If the following registry value does not exist or is not configured as specified, this
    is a finding: Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows\DataCollection\ Value
    Name: LimitEnhancedDiagnosticDataWindowsAnalytics Type: REG_DWORD Value: 0x00000001 (1)'
