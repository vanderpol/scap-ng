  fix: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components >> BitLocker
    Drive Encryption >> Operating System Drives "Require additional authentication at startup" to "Enabled" with "Configure
    TPM Startup PIN:" set to "Require startup PIN with TPM" or with "Configure TPM startup key and PIN:" set to "Require startup
    key and PIN with TPM". If Network Unlock is active, select "Configure TPM startup PIN:" and set to "Require startup PIN
    with TPM". If Network Unlock is not active, select "Configure TPM startup key and PIN:" and set to "Require startup key
    and PIN with TPM".
