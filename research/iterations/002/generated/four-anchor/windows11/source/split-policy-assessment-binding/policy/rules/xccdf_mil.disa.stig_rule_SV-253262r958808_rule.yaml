  fix: 'Configure an application allowlisting program to employ a deny-all, permit-by-exception policy to allow the execution
    of authorized software programs. Configuration of allowlisting applications will vary by the program. AppLocker is an
    allowlisting application built into Windows 11 Enterprise. If AppLocker is used, it is configured through group policy
    in Computer Configuration >> Windows Settings >> Security Settings >> Application Control Policies >> AppLocker. Implementation
    guidance for AppLocker is available in the NSA paper "Application allowlisting using Microsoft AppLocker" at the following
    link: https://docs.microsoft.com/en-us/windows/security/threat-protection/windows-defender-application-control/applocker/applocker-policies-deployment-guide'
