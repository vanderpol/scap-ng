            text: WN11-CC-000190 - Autoplay must be disabled for all drives.
          - attributes:
              family: windows
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Microsoft Windows 11
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: Allowing autoplay to execute may introduce malicious code to a system. Autoplay begins reading from a drive
              as soon as media is inserted in the drive. As a result, the setup file of programs or music on audio media may
              start. By default, autoplay is disabled on removable drives, such as the floppy disk drive (but not the CD-ROM
              drive) and on network drives. If this policy is enabled, autoplay can be disabled on all drives.
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
