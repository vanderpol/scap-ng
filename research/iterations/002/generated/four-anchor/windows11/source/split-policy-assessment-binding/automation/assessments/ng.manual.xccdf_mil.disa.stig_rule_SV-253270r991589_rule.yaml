    inline_content: Run "Computer Management". Navigate to System Tools >> Local Users and Groups >> Groups. Review the members
      of the Backup Operators group. If the group contains no accounts, this is not a finding. If the group contains any accounts,
      the accounts must be specifically for backup functions. If the group contains any standard user accounts used for performing
      normal user tasks, this is a finding.
