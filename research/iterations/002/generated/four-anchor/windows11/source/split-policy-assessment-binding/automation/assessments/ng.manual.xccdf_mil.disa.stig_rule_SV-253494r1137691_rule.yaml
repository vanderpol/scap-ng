assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-253494r1137691_rule
  version: 1
  description: The "Deny log on locally" user right on workstations must be configured to prevent access from highly privileged
    domain accounts on domain systems and unauthenticated access on all systems.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:46501
    exports: []
    inline_content: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer
      Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment.
      If the following groups or accounts are not defined for the "Deny log on locally" right, this is a finding. Domain Systems
      Only: Enterprise Admins Group Domain Admins Group Privileged Access Workstations (PAWs) dedicated to the management
      of Active Directory are exempt from denying the Enterprise Admins and Domain Admins groups. (See the Windows Privileged
      Access Workstation STIG for PAW requirements.) All Systems: Guests Group'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
      children:
      - attributes:
          href: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-ocil.xml
          name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:46501
        name: check-content-ref
        namespace: http://checklists.nist.gov/xccdf/1.2
      - name: check-content
        namespace: http://checklists.nist.gov/xccdf/1.2
        text: 'Verify the effective setting in Local Group Policy Editor.


          Run "gpedit.msc".


          Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies
          >> User Rights Assignment.


          If the following groups or accounts are not defined for the "Deny log on locally" right, this is a finding.


          Domain Systems Only:

          Enterprise Admins Group

          Domain Admins Group


          Privileged Access Workstations (PAWs) dedicated to the management of Active Directory are exempt from denying the
          Enterprise Admins and Domain Admins groups. (See the Windows Privileged Access Workstation STIG for PAW requirements.)


          All Systems:

          Guests Group'
      name: check
      namespace: http://checklists.nist.gov/xccdf/1.2
    system: http://scap.nist.gov/schema/ocil/2
