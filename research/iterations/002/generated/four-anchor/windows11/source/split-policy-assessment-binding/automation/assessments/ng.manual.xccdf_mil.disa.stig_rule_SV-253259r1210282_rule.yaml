assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-253259r1210282_rule
  version: 1
  description: Windows 11 information systems must use BitLocker to encrypt all disks to protect the confidentiality and integrity
    of all information at rest.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:901
    exports: []
    inline_content: 'For AVD implementations with no data at rest, this is NA. Verify all Windows 11 information systems (including
      SIPRNet) employ BitLocker for full disk encryption. If full disk encryption using BitLocker is not implemented, this
      is a finding. Verify BitLocker is turned on for the operating system drive and any fixed data drives. Open "BitLocker
      Drive Encryption" from the Control Panel. If the operating system drive or any fixed data drives have "Turn on BitLocker",
      this is a finding. Note: An alternate encryption application may be used in lieu of BitLocker providing it is configured
      for full disk encryption and satisfies the pre-boot authentication requirements (WN11-00-000031 and WN11-00-000032).'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
