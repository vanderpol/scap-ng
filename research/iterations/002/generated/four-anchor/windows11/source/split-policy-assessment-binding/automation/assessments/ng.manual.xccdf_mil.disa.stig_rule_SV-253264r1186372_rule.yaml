    exports: []
    inline_content: 'Verify an organizationally approved antivirus solution (Microsoft Defender Antivirus, for example) is
      installed on the system and in use. Verify if Microsoft Defender Antivirus is in use or enabled: Open PowerShell. Enter
      "get-service | where {$_.DisplayName -Like "*Defender*"} | Select Status,DisplayName" Verify third-party antivirus is
      in use or enabled: Open PowerShell. Enter "get-service | where {$_.DisplayName -Like "*mcafee*"} | Select Status,DisplayName"
      Enter "get-service | where {$_.DisplayName -Like "*symantec*"} | Select Status,DisplayName" If there is no antivirus
      solution installed on the system, this is a finding.'
