            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: The account lockout feature, when enabled, prevents brute-force password attacks on the system. The higher
              this value is, the less effective the account lockout feature will be in protecting the local system. The number
              of bad logon attempts must be reasonably small to minimize the possibility of a successful password attack,
