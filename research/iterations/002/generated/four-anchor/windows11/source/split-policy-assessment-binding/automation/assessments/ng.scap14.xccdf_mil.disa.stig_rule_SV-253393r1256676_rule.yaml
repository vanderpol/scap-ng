            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: WN11-CC-000205 - Windows Telemetry must not be configured to Full.
          - attributes:
              family: windows
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Microsoft Windows 11
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: Some features may communicate with the vendor, sending system information or downloading data or components
              for the feature. Limiting this capability will prevent potentially sensitive information from being sent outside
              the enterprise. The "Security" option for Telemetry configures the lowest amount of data, effectively none outside
              of the Malicious Software Removal Tool (MSRT), Defender and telemetry client settings. "Basic" sends basic diagnostic
              and usage data and may be required to support some Microsoft services. "Enhanced" includes additional information
              on how Windows and apps are used and advanced reliability data. Windows Analytics can use a "limited enhanced"
              level to provide information such as health data for devices.
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
