  description: <VulnDiscussion>Enabling this setting and then selecting the "Process even if the Group Policy objects have
    not changed" option ensures that the policies will be reprocessed even if none have been changed. This way, any unauthorized
    changes are forced to match the domain-based group policy settings again.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
