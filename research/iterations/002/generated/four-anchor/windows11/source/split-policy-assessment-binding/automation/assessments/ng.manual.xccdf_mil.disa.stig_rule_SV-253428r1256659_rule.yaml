assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-253428r1256659_rule
  version: 1
  description: The External Root CA certificates must be installed in the Trusted Root Store on unclassified systems.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:33501
    exports: []
    inline_content: 'Verify the ECA Root CA certificates are installed on unclassified systems as Trusted Root Certification
      Authorities. Run "PowerShell" as an administrator. Execute the following command: Get-ChildItem -Path Cert:Localmachine\root
      | Where Subject -Like "*ECA*" | FL Subject, NotAfter If valid ECA Root CA certificates (such as those below) are not
      displayed, this is a finding. Note: The Common Names (CN) below are examples. Verify the "CN" displayed (ECA Root CA)
      is not expired. As of this writing, ECA Root CA 4 and ECA Root 5 are valid (among others). Subject: CN=ECA Root CA 4,
      OU=ECA, O=U.S. Government, C=US Subject: CN=ECA Root CA 5, OU=ECA, O=U.S. Government, C=US Alternately, use the Certificates
      MMC snap-in: Run "MMC". Select "File" and "Add/Remove Snap-in". Select "Certificates" and click "Add". Select "Computer
      account" and click "Next". Select "Local computer: (the computer this console is running on)" and click "Finish". Click
      "OK". Expand "Certificates" and navigate to Trusted Root Certification Authorities >> Certificates. For each ECA Root
      CA certificate displayed: Right-click on the certificate and select "Open". Select the "Details" tab. Verify the Expiration
      Date is a future date. Scroll to the bottom and select "Subject". If any of the certificates listed do not include "ECA
      Root CA" in the name or are expired, this is a finding. Note: This should not be relied upon as a complete list of possible
      ECA Root CA certificates. ECA Root CA 4 ECA Root CA 5'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
      children:
      - attributes:
          href: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-ocil.xml
          name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:33501
        name: check-content-ref
        namespace: http://checklists.nist.gov/xccdf/1.2
      - name: check-content
        namespace: http://checklists.nist.gov/xccdf/1.2
        text: "Verify the ECA Root CA certificates are installed on unclassified systems as Trusted Root Certification Authorities.\n\
          \nRun \"PowerShell\" as an administrator.\n\nExecute the following command:\n\nGet-ChildItem -Path Cert:Localmachine\\\
          root | Where Subject -Like \"*ECA*\" | FL Subject, NotAfter\n\nIf valid ECA Root CA certificates (such as those\
          \ below) are not displayed, this is a finding. \n\nNote: The Common Names (CN) below are examples. Verify the \"\
          CN\" displayed (ECA Root CA) is not expired. As of this writing, ECA Root CA 4 and ECA Root 5 are valid (among others).\n\
          \nSubject: CN=ECA Root CA 4, OU=ECA, O=U.S. Government, C=US\nSubject: CN=ECA Root CA 5, OU=ECA, O=U.S. Government,\
          \ C=US\n\nAlternately, use the Certificates MMC snap-in:\n\nRun \"MMC\".\n\nSelect \"File\" and \"Add/Remove Snap-in\"\
          .\n\nSelect \"Certificates\" and click \"Add\".\n\nSelect \"Computer account\" and click \"Next\".\n\nSelect \"\
          Local computer: (the computer this console is running on)\" and click \"Finish\".\n\nClick \"OK\".\n\nExpand \"\
          Certificates\" and navigate to Trusted Root Certification Authorities >> Certificates.\n\nFor each ECA Root CA certificate\
          \ displayed:\n\nRight-click on the certificate and select \"Open\".\n\nSelect the \"Details\" tab.\n\nVerify the\
          \ Expiration Date is a future date.\n\nScroll to the bottom and select \"Subject\".\n\nIf any of the certificates\
          \ listed do not include \"ECA Root CA\" in the name or are expired, this is a finding.\n\nNote: This should not\
          \ be relied upon as a complete list of possible ECA Root CA certificates.\n\nECA Root CA 4\nECA Root CA 5"
      name: check
      namespace: http://checklists.nist.gov/xccdf/1.2
    system: http://scap.nist.gov/schema/ocil/2
