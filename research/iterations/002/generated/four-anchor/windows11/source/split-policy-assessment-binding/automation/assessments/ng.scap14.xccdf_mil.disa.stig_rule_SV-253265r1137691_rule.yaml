      inline_content: Run "Computer Management". Navigate to Storage >> Disk Management. If the "File System" column does
        not indicate "NTFS" for each volume assigned a drive letter, this is a finding. This does not apply to system partitions
        such the Recovery and EFI System Partition.
      multi_check: null
