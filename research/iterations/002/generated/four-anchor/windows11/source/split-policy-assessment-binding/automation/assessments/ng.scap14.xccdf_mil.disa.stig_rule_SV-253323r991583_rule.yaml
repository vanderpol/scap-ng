        name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:13101
      exports: []
      inline_content: 'Security Option "Audit: Force audit policy subcategory settings to override audit policy category settings"
        must be set to "Enabled" (WN11-SO-000030) for the detailed auditing subcategories to be effective. Use the AuditPol
        tool to review the current Audit Policy configuration: Open a Command Prompt with elevated privileges ("Run as Administrator").
        Enter "AuditPol /get /category:*" Compare the AuditPol settings with the following. If the system does not audit the
        following, this is a finding: Object Access >> Removable Storage - Failure Some virtual machines may generate excessive
        audit events for access to the virtual hard disk itself when this setting is enabled. This may be set to Not Configured
        in such cases and would not be a finding. This must be documented with the ISSO to include mitigations such as monitoring
        or restricting any actual removable storage connected to the VM.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:13101
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Security Option "Audit: Force audit policy subcategory settings to override audit policy category settings"
            must be set to "Enabled" (WN11-SO-000030) for the detailed auditing subcategories to be effective.


            Use the AuditPol tool to review the current Audit Policy configuration:

            Open a Command Prompt with elevated privileges ("Run as Administrator").

            Enter "AuditPol /get /category:*"


            Compare the AuditPol settings with the following. If the system does not audit the following, this is a finding:


            Object Access >> Removable Storage - Failure


            Some virtual machines may generate excessive audit events for access to the virtual hard disk itself when this
            setting is enabled. This may be set to Not Configured in such cases and would not be a finding. This must be documented
            with the ISSO to include mitigations such as monitoring or restricting any actual removable storage connected
            to the VM.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
