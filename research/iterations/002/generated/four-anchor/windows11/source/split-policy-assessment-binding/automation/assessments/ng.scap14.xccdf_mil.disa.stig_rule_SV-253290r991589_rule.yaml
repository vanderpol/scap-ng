        name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:6901
      exports: []
      inline_content: Review the effective User Rights setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to
        Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User
        Rights Assignment. Review each User Right listed for any unresolved SIDs to determine whether they are valid, such
        as due to being temporarily disconnected from the domain. (Unresolved SIDs have the format of "*S-1-..".) If any unresolved
        SIDs exist and are not for currently valid accounts or groups, this is a finding.
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
