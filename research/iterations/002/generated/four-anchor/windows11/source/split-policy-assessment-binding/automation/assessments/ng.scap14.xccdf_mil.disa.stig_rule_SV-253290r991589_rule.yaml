          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:6901
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Review the effective User Rights setting in Local Group Policy Editor.

            Run "gpedit.msc".


            Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local
            Policies >> User Rights Assignment.


            Review each User Right listed for any unresolved SIDs to determine whether they are valid, such as due to being
            temporarily disconnected from the domain. (Unresolved SIDs have the format of "*S-1-..".)


            If any unresolved SIDs exist and are not for currently valid accounts or groups, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
