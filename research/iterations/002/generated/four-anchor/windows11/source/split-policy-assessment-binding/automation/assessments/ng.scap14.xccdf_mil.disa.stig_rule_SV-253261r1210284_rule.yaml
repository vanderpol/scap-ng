          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: If data at rest is unencrypted, it is vulnerable to disclosure. Even if the operating system enforces permissions
              on data access, an adversary can remove non-volatile memory and read it directly, thereby circumventing operating
              system controls. Encrypting the data ensures that confidentiality is protected even when the operating system
              is not running. Pre-boot authentication prevents unauthorized users from accessing encrypted drives. Increasing
              the pin length requires a greater number of guesses for an attacker.
