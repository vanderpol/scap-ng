assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-253342r958434_rule
  version: 1
  description: Windows 11 permissions for the System event log must prevent access by non-privileged accounts.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:16901
    exports: []
    inline_content: 'Verify the permissions on the System event log (System.evtx). Standard user accounts or groups must not
      have access. The default permissions listed below satisfy this requirement. Eventlog - Full Control SYSTEM - Full Control
      Administrators - Full Control The default location is the "%SystemRoot%\SYSTEM32\WINEVT\LOGS" directory. They may have
      been moved to another folder. If the permissions for these files are not as restrictive as the ACLs listed, this is
      a finding. Note: If "APPLICATION PACKAGE AUTHORITY\ALL APPLICATION PACKAGES" has Special Permissions, this would not
      be a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
