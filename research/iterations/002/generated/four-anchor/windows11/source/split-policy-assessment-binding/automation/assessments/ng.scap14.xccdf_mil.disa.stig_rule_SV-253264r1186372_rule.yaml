          text: "Verify an organizationally approved antivirus solution (Microsoft Defender Antivirus, for example) is installed\
            \ on the system and in use. \n\nVerify if Microsoft Defender Antivirus is in use or enabled:\n\nOpen PowerShell.\n\
            \nEnter \"get-service | where {$_.DisplayName -Like \"*Defender*\"} | Select Status,DisplayName\"\n\nVerify third-party\
            \ antivirus is in use or enabled:\n\nOpen PowerShell.\n\nEnter \"get-service | where {$_.DisplayName -Like \"\
