      exports: []
      inline_content: 'Verify the permissions on the System event log (System.evtx). Standard user accounts or groups must
        not have access. The default permissions listed below satisfy this requirement. Eventlog - Full Control SYSTEM - Full
        Control Administrators - Full Control The default location is the "%SystemRoot%\SYSTEM32\WINEVT\LOGS" directory. They
        may have been moved to another folder. If the permissions for these files are not as restrictive as the ACLs listed,
        this is a finding. Note: If "APPLICATION PACKAGE AUTHORITY\ALL APPLICATION PACKAGES" has Special Permissions, this
        would not be a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
