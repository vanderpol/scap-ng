            text: WN11-AU-000525 - Windows 11 permissions for the System event log must prevent access by non-privileged accounts.
          - attributes:
              family: windows
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Microsoft Windows 11
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: Maintaining an audit trail of system activity logs can help identify configuration errors, troubleshoot
              service disruptions, and analyze compromises that have occurred, as well as detect attacks. Audit logs are necessary
              to provide a trail of evidence in case the system or network is compromised. The System event log may be susceptible
              to tampering if proper permissions are not applied.
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
