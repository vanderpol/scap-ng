  id: ng.manual.xccdf_mil.disa.stig_rule_SV-253493r1137691_rule
  version: 1
  description: The "Deny log on as a service" user right on Windows 11 domain-joined workstations must be configured to prevent
    access from highly privileged domain accounts.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:46301
    exports: []
    inline_content: 'This requirement is applicable to domain-joined systems, for standalone systems this is NA. Verify the
      effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy >> Computer Configuration
      >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment. If the following groups or accounts
      are not defined for the "Deny log on as a service" right , this is a finding: Domain Systems Only: Enterprise Admins
      Group Domain Admins Group'
    multi_check: null
    negate: null
    selector: manual
