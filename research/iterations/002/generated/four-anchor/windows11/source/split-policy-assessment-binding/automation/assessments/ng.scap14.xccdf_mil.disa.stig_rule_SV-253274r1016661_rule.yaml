      exports: []
      inline_content: 'The default file system permissions are adequate when the Security Option "Network access: Let Everyone
        permissions apply to anonymous users" is set to "Disabled" (WN11-SO-000160). If the default file system permissions
        are maintained and the referenced option is set to "Disabled", this is not a finding. Verify the default permissions
        for the sample directories below. Non-privileged groups such as Users or Authenticated Users must not have greater
        than read & execute permissions except where noted as defaults. (Individual accounts must not be used to assign permissions.)
        Select the "Security" tab, and the "Advanced" button. C:\ Type - "Allow" for all Inherited from - "None" for all Principal
        - Access - Applies to Administrators - Full control - This folder, subfolders, and files SYSTEM - Full control - This
        folder, subfolders, and files Users - Read & execute - This folder, subfolders, and files Authenticated Users - Modify
        - Subfolders and files only Authenticated Users - Create folders / append data - This folder only \Program Files Type
        - "Allow" for all Inherited from - "None" for all Principal - Access - Applies to TrustedInstaller - Full control
        - This folder and subfolders SYSTEM - Modify - This folder only SYSTEM - Full control - Subfolders and files only
        Administrators - Modify - This folder only Administrators - Full control - Subfolders and files only Users - Read
        & execute - This folder, subfolders, and files CREATOR OWNER - Full control - Subfolders and files only ALL APPLICATION
        PACKAGES - Read & execute - This folder, subfolders, and files ALL RESTRICTED APPLICATION PACKAGES - Read & execute
        - This folder, subfolders, and files \Windows Type - "Allow" for all Inherited from - "None" for all Principal - Access
