      exports: []
      inline_content: 'If the following registry value does not exist or is not configured as specified, this is a finding:
        Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SYSTEM\CurrentControlSet\Control\Lsa\FIPSAlgorithmPolicy\ (For GPO-managed
        systems) Or Registry Path: \SOFTWARE\Microsoft\PolicyManager\current\device\Cryptography!AllowFipsAlgorithmPolicy_ProviderSet
        (For Intune-managed systems) Value Name: Enabled Value Type: REG_DWORD Value: 1 Warning: Clients with this setting
        enabled will not be able to communicate via digitally encrypted or signed protocols with servers that do not support
        these algorithms.'
      multi_check: null
      negate: null
