            Registry Hive: HKEY_LOCAL_MACHINE\nRegistry Path: \\SYSTEM\\CurrentControlSet\\Control\\Lsa\\FIPSAlgorithmPolicy\\\
            \  (For GPO-managed systems)\nOr\nRegistry Path: \\SOFTWARE\\Microsoft\\PolicyManager\\current\\device\\Cryptography!AllowFipsAlgorithmPolicy_ProviderSet\
