        metadata:
          children:
          - name: title
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: WN11-SO-000251 - Windows 11 must use multifactor authentication for local and network access to privileged
              and non-privileged accounts.
          - attributes:
              family: windows
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Microsoft Windows 11
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "Without the use of multifactor authentication, the ease of access to privileged and non-privileged functions\
              \ is greatly increased. \n\nAll domain accounts must be enabled for multifactor authentication with the exception\
              \ of local emergency accounts. \n\nMultifactor authentication requires using two or more factors to achieve\
              \ authentication.\n\nFactors include: \n\n1) Something a user knows (e.g., password/PIN);\n\n2) Something a\
              \ user has (e.g., cryptographic identification device, token); and\n\n3) Something a user is (e.g., biometric).\n\
              \nA privileged account is defined as an information system account with authorizations of a privileged user.\n\
              \nNetwork access is defined as access to an information system by a user (or a process acting on behalf of a\
              \ user) communicating through a network (e.g., local area network, wide area network, or the Internet).\n\n\
              Local access is defined as access to an organizational information system by a user (or process acting on behalf\
              \ of a user) communicating through a direct connection without the use of a network.\n\nThe DoW CAC with DoW-approved\
              \ PKI is an example of multifactor authentication.\n\nSatisfies: SRG-OS-000106-GPOS-00053, SRG-OS-000107-GPOS-00054,\
              \ SRG-OS-000108-GPOS-00055"
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
