      exports: []
      inline_content: 'Verify RHEL 9 does not IPv4 ICMP redirect messages. Check the value of the "all send_redirects" variables
        with the following command: $ sudo sysctl net.ipv4.conf.all.send_redirects net.ipv4.conf.all.send_redirects = 0 If
        "net.ipv4.conf.all.send_redirects" is not set to "0" and is not documented with the information system security officer
        (ISSO) as an operational requirement or is missing, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:37301
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify RHEL 9 does not IPv4 ICMP redirect messages.


            Check the value of the "all send_redirects" variables with the following command:


            $ sudo sysctl net.ipv4.conf.all.send_redirects

            net.ipv4.conf.all.send_redirects = 0


            If "net.ipv4.conf.all.send_redirects" is not set to "0" and is not documented with the information system security
            officer (ISSO) as an operational requirement or is missing, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
