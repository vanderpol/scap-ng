      exports: []
      inline_content: 'Verify RHEL 9 ignores IPv6 ICMP redirect messages. Note: If IPv6 is disabled on the system, this requirement
        is Not Applicable. Check the value of the "accept_redirects" variable with the following command: $ sysctl net.ipv6.conf.all.accept_redirects
        net.ipv6.conf.all.accept_redirects = 0 If "net.ipv6.conf.all.accept_redirects" is not set to "0" or is missing, this
