rule:
  abstract: false
  check: 'Verify the number of rounds for the password hashing algorithm is configured with the following command: $ sudo
    grep rounds /etc/pam.d/system-auth password sufficient pam_unix.so sha512 rounds=100000 If a matching line is not returned
    or "rounds" is less than 100000, this a finding.'
