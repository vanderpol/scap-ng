        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:37901
      exports: []
      inline_content: 'Verify RHEL 9 does not accept router advertisements on all IPv6 interfaces, unless the system is a
        router. Note: If IPv6 is disabled on the system, this requirement is Not Applicable. Check that "net.ipv6.conf.all.accept_ra"
        is set to not accept router advertisements by using the following command: $ sudo sysctl net.ipv6.conf.all.accept_ra
        net.ipv6.conf.all.accept_ra = 0 If "net.ipv6.conf.all.accept_ra" is not set to "0" or is missing, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:37901
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify RHEL 9 does not accept router advertisements on all IPv6 interfaces, unless the system is a router.


            Note: If IPv6 is disabled on the system, this requirement is Not Applicable.


            Check that "net.ipv6.conf.all.accept_ra" is set to not accept router advertisements by using the following command:


            $ sudo sysctl net.ipv6.conf.all.accept_ra

            net.ipv6.conf.all.accept_ra = 0


            If "net.ipv6.conf.all.accept_ra" is not set to "0" or is missing, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
