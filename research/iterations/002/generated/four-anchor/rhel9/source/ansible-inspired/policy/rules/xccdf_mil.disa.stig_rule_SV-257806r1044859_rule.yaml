scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that RHEL 9 disables the ability to load the firewire-core kernel module with the following command: $ grep
    -r firewire-core /etc/modprobe.conf /etc/modprobe.d/* install firewire-core /bin/false blacklist firewire-core If the
    command does not return any output, or the lines are commented out, and use of firewire-core is not documented with the
    information system security officer (ISSO) as an operational requirement, this is a finding.'
