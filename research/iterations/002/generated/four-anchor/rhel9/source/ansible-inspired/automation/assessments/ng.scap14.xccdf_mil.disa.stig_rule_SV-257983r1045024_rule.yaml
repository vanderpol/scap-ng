      exports: []
      inline_content: 'Note: If the system administrator demonstrates the use of an approved alternate multifactor authentication
        method, this requirement is Not Applicable. Verify that RHEL 9 SSH daemon accepts public key encryption with the following
        command: $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo
        grep -iH ''^\s*pubkeyauthentication'' PubkeyAuthentication yes If "PubkeyAuthentication" is set to no, the line is
        commented out, or the line is missing, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:40301
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Note: If the system administrator demonstrates the use of an approved alternate multifactor authentication\
            \ method, this requirement is Not Applicable.\n\nVerify that RHEL 9 SSH daemon accepts public key encryption with\
            \ the following command:\n \n$ sudo /usr/sbin/sshd -dd 2>&1 | awk '/filename/ {print $4}' | tr -d '\\r' | tr '\\\
            n' ' ' | xargs sudo grep -iH '^\\s*pubkeyauthentication'\n\nPubkeyAuthentication yes\n \nIf \"PubkeyAuthentication\"\
            \ is set to no, the line is commented out, or the line is missing, this is a finding."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
