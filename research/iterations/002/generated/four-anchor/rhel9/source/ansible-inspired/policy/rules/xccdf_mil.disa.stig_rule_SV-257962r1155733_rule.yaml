rule:
  abstract: false
  check: 'Verify RHEL 9 uses reverse path filtering on all IPv4 interfaces. Check the value of the "rp_filter" variable with
    the following command: $ sudo sysctl net.ipv4.conf.all.rp_filter net.ipv4.conf.all.rp_filter = 1 If "net.ipv4.conf.all.rp_filter"
    is not set to "1" or is missing, this is a finding.'
  checks:
