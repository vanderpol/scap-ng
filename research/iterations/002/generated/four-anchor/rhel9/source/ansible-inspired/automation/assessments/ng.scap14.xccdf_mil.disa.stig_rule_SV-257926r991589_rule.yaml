          text: 'Verify the ownership of all cron configuration files with the command:


            $ stat -c "%U %n" /etc/cron*


            root /etc/cron.d

            root /etc/cron.daily

            root /etc/cron.deny

            root /etc/cron.hourly

            root /etc/cron.monthly

