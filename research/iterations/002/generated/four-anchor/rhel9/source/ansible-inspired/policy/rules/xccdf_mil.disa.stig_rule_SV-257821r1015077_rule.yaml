scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that dnf always checks the GPG signature of locally installed software packages before installation: $ grep
    localpkg_gpgcheck /etc/dnf/dnf.conf localpkg_gpgcheck=1 If "localpkg_gpgcheck" is not set to "1", or if the option is
    missing or commented out, ask the system administrator how the GPG signatures of local software packages are being verified.
    If there is no process to verify GPG signatures that is approved by the organization, this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-257821r1015077_rule
    assessment_version: 1
    selector: default
    source_selector: ''
