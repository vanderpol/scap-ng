        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:40101
      exports: []
      inline_content: 'Verify that RHEL 9 logs SSH connection attempts and failures to the server. Check what the SSH daemon''s
        "LogLevel" option is set to with the following command: $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}''
        | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo grep -iH ''^\s*loglevel'' LogLevel VERBOSE If a value of "VERBOSE" is
        not returned or the line is commented out or missing, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
