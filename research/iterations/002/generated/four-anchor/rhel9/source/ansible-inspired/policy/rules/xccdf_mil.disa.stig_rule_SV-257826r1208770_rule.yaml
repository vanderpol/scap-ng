rule:
  abstract: false
  check: 'Verify RHEL 9 does not have an FTP server package installed with the following command: $ sudo dnf list --installed
    | grep vsftpd If the "vsftpd" package is installed, this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-257826r1208770_rule
    assessment_version: 1
    selector: default
