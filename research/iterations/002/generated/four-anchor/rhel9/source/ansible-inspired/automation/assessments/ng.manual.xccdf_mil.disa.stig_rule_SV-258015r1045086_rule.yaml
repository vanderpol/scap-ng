    - content_refs:
      - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:45701
      exports: []
      inline_content: 'Note: This requirement assumes the use of the RHEL 9 default graphical user interface, the GNOME desktop
        environment. If the system does not have any graphical user interface installed, this requirement is Not Applicable.
        Verify RHEL 9 disables the ability of the user to override the graphical user interface automount setting. Determine
        which profile the system database is using with the following command: $ sudo grep system-db /etc/dconf/profile/user
        system-db:local Check that the automount setting is locked from nonprivileged user modification with the following
        command: Note: The example below is using the database "local" for the system, so the path is "/etc/dconf/db/local.d".
        This path must be modified if a database other than "local" is being used. $ grep ''automount-open'' /etc/dconf/db/local.d/locks/*
        /org/gnome/desktop/media-handling/automount-open If the command does not return at least the example result, this
        is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:45701
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Note: This requirement assumes the use of the RHEL 9 default graphical user interface, the GNOME desktop\
            \ environment. If the system does not have any graphical user interface installed, this requirement is Not Applicable.\n\
            \nVerify RHEL 9 disables the ability of the user to override the graphical user interface automount setting.\n\
            \nDetermine which profile the system database is using with the following command:\n\n$ sudo grep system-db /etc/dconf/profile/user\n\
            \nsystem-db:local\n\nCheck that the automount setting is locked from nonprivileged user modification with the\
            \ following command:\n\nNote: The example below is using the database \"local\" for the system, so the path is\
            \ \"/etc/dconf/db/local.d\". This path must be modified if a database other than \"local\" is being used.\n\n\
            $ grep 'automount-open' /etc/dconf/db/local.d/locks/* \n\n/org/gnome/desktop/media-handling/automount-open\n\n\
            If the command does not return at least the example result, this is a finding."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
