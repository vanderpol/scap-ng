        metadata:
          children:
          - name: title
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: RHEL-09-651025 - RHEL 9 must use cryptographic mechanisms to protect the integrity of audit tools.
          - attributes:
              family: unix
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Red Hat Enterprise Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'Protecting the integrity of the tools used for auditing purposes is a critical step toward ensuring the
              integrity of audit information. Audit information includes all information (e.g., audit records, audit settings,
              and audit reports) needed to successfully audit information system activity.


              Audit tools include, but are not limited to, vendor-provided and open-source audit tools needed to successfully
              view and manipulate audit information system activity and records. Audit tools include custom queries and report
              generators.


              It is not uncommon for attackers to replace the audit tools or inject code into the existing tools to provide
              the capability to hide or erase system activity from the audit logs.


              To address this risk, audit tools must be cryptographically signed to provide the capability to identify when
              the audit tools have been modified, manipulated, or replaced. An example is a checksum hash of the file or files.


              Satisfies: SRG-OS-000256-GPOS-00097, SRG-OS-000257-GPOS-00098, SRG-OS-000258-GPOS-00099, SRG-OS-000278-GPOS-00108'
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
        source_definition_id: oval:mil.disa.stig.rhel9os:def:258137
        version: '1'
