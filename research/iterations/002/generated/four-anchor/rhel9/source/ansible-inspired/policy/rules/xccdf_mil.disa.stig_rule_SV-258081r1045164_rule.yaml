rule:
  abstract: false
  check: 'Verify RHEL 9 has the policycoreutils package installed with the following command: $ dnf list --installed policycoreutils
    Example output: policycoreutils.x86_64 3.3-6.el9_0 If the "policycoreutils" package is not installed, this is a finding.'
