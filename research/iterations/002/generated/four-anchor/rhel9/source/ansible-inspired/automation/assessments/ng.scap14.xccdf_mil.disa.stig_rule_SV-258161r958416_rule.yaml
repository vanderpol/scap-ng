          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'Enriched logging is needed to determine who, what, and when events occur on a system. Without this, determining
              root cause of an event will be much more difficult.


              When audit logs are not labeled before they are sent to a central log server, the audit data will not be able
              to be analyzed and tied back to the correct system.


              Satisfies: SRG-OS-000039-GPOS-00017, SRG-OS-000342-GPOS-00133, SRG-OS-000479-GPOS-00224'
          name: metadata
