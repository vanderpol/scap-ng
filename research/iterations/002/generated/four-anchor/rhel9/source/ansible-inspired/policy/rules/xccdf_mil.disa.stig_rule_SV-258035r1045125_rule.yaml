    boot and then start it with the following commands: $ sudo systemctl enable usbguard $ sudo systemctl start usbguard Verify
    the status of the service with the following command: $ sudo systemctl status usbguard Note: usbguard will need to be
    configured to allow authorized devices once it is enabled on RHEL 9.'
