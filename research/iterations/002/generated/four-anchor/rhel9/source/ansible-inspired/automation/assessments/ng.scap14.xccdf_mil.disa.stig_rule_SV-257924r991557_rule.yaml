          - name: title
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: RHEL-09-232220 - RHEL 9 audit tools must be owned by root.
          - attributes:
              family: unix
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Red Hat Enterprise Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'Protecting audit information also includes identifying and protecting the tools used to view and manipulate
              log data. Therefore, protecting audit tools is necessary to prevent unauthorized operation on audit information.


              RHEL 9 systems providing tools to interface with audit information will leverage user permissions and roles
              identifying the user accessing the tools, and the corresponding rights the user enjoys, to make access decisions
              regarding the access to audit tools.


              Audit tools include, but are not limited to, vendor-provided and open source audit tools needed to successfully
              view and manipulate audit information system activity and records. Audit tools include custom queries and report
              generators.'
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
        source_definition_id: oval:mil.disa.stig.rhel9os:def:257924
