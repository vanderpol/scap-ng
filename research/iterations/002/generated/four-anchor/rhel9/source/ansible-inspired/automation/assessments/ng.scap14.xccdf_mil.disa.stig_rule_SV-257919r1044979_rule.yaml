        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify the system commands contained in the following directories are group-owned by "root", or a required
            system account, with the following command:


            $ sudo find -L /bin /sbin /usr/bin /usr/sbin /usr/libexec /usr/local/bin /usr/local/sbin ! -group root -exec stat
