            \ the location of the audit log file, determine the mode of each audit log with the following command:\n\n$ sudo\
            \ find /var/log/audit/ -type f -exec stat -c '%a %n' {} \\;\n\n600 /var/log/audit/audit.log\n\nIf the audit logs\
            \ have a mode more permissive than \"0600\", this is a finding."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
