    kind: cpe_name
    name: cpe:/o:redhat:enterprise_linux:9.0
    ref: cpe:/o:redhat:enterprise_linux:9.0
  extends: null
  fix: 'Configure RHEL 9 to include the use of the pam_faillock.so module in the /etc/pam.d/password-auth file. If PAM is
    managed with authselect, enable the feature with the following command: $ sudo authselect enable-feature with-faillock
    Otherwise, add/modify the appropriate sections of the "/etc/pam.d/password-auth" file to match the following lines: Note:
    The "preauth" line must be listed before pam_unix.so. auth required pam_faillock.so preauth auth required pam_faillock.so
    authfail account required pam_faillock.so'
