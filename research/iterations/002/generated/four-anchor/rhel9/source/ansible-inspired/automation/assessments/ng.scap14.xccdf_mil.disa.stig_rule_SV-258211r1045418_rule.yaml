      exports: []
      inline_content: 'Verify that RHEL 9 is configured to audit the execution of the "init" command with the following command:
        $ sudo auditctl -l | grep /usr/sbin/init -a always,exit -S all -F path=/usr/sbin/init -F perm=x -F auid>=1000 -F auid!=-1
        -F key=privileged-init If the command does not return a line, or the line is commented out, this is a finding.'
