  extends: null
  fix: 'Configure RHEL 9 to elevate the SELinux context when an administrator calls the sudo command. Edit a file in the "/etc/sudoers.d"
    directory with the following command: $ sudo visudo -f /etc/sudoers.d/<customfile> Use the following example to build
    the <customfile> in the /etc/sudoers.d directory to allow any administrator belonging to a designated sudoers admin group
    to elevate their SELinux context with the use of the sudo command: %{designated_group_or_user_name} ALL=(ALL) TYPE=sysadm_t
    ROLE=sysadm_r ALL Remove any configurations that conflict with the above from the following locations: /etc/sudoers /etc/sudoers.d/'
