  fix: 'Configure RHEL 9 to log out idle sessions. Create the directory if necessary: $ mkdir -p /etc/systemd/logind.conf.d/
    Create a *.conf file in /etc/systemd/logind.conf.d/ with the following content: [Login] StopIdleSessionSec=600 KillUserProcesses=no
    Restart systemd-logind: $ systemctl restart systemd-logind'
