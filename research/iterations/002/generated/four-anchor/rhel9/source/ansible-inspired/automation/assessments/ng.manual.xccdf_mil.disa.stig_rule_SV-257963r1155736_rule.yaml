      exports: []
      inline_content: 'Verify RHEL 9 will not accept IPv4 ICMP redirect messages. Check the value of the default "accept_redirects"
        variable with the following command: $ sudo sysctl net.ipv4.conf.default.accept_redirects net.ipv4.conf.default.accept_redirects
        = 0 If "net.ipv4.conf.default.accept_redirects" is not set to "0" or is missing, this is a finding.'
