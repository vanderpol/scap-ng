scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify RHEL 9 disables storing core dumps. Check the status of the "kernel.core_pattern" kernel parameter with the
    following command: $ sudo sysctl kernel.core_pattern kernel.core_pattern = |/bin/false If "kernel.core_pattern" is not
    set to "|/bin/false", or a line is not returned and the need for core dumps is not documented with the information system
    security officer (ISSO) as an operational requirement, this is a finding.'
  checks:
