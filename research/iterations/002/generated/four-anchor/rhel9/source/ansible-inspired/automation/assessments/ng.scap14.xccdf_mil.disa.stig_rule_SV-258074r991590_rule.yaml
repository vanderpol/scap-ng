        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify RHEL 9 defines default permissions for all authenticated users in such a way that the user can only
            read and modify their own files with the following command:


            Note: If the value of the "UMASK" parameter is set to "000" in "/etc/login.defs" file, the Severity is raised
            to a CAT I.


            # grep -i umask /etc/login.defs


            UMASK 077


            If the value for the "UMASK" parameter is not "077", or the "UMASK" parameter is missing or is commented out,
            this is a finding.'
