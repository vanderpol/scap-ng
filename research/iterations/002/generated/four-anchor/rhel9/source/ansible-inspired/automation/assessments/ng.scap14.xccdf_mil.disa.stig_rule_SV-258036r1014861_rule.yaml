              text: Red Hat Enterprise Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'The USBguard-daemon is the main component of the USBGuard software framework. It runs as a service in the
              background and enforces the USB device authorization policy for all USB devices. The policy is defined by a
              set of rules using a rule language described in the usbguard-rules.conf file. The policy and the authorization
              state of USB devices can be modified during runtime using the usbguard tool.


              The system administrator (SA) must work with the site information system security officer (ISSO) to determine
              a list of authorized peripherals and establish rules within the USBGuard software framework to allow only authorized
              devices.'
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
