scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify the user and group account administration utilities are configured to store only encrypted representations
    of passwords with the following command: $ grep crypt_style /etc/libuser.conf crypt_style = sha512 If the "crypt_style"
    variable is not set to "sha512", is not in the defaults section, is commented out, or does not exist, this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-258116r1045240_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-258116r1045240_rule
    assessment_version: 1
    selector: automated
    source_selector: automated
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-258116r1045240_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>Passwords need to be protected at all times, and encryption is the standard method for protecting
    passwords. If passwords are not encrypted, they can be plainly read (i.e., clear text) and easily compromised. Passwords
    that are encrypted with a weak algorithm are no more protected than if they are kept in plain text. This setting ensures
    user and group account administration utilities are configured to store only encrypted representations of passwords. Additionally,
    the "crypt_style" configuration option ensures the use of a strong hashing algorithm that makes password cracking attacks
    more difficult.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
