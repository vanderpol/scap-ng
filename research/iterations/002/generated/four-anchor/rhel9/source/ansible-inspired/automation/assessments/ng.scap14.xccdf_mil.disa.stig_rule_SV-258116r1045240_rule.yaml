          children:
          - name: title
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: RHEL-09-611135 - RHEL 9 must be configured so that user and group account administration utilities are configured
              to store only encrypted representations of passwords.
          - attributes:
              family: unix
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Red Hat Enterprise Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'Passwords need to be protected at all times, and encryption is the standard method for protecting passwords.
              If passwords are not encrypted, they can be plainly read (i.e., clear text) and easily compromised. Passwords
              that are encrypted with a weak algorithm are no more protected than if they are kept in plain text.


              This setting ensures user and group account administration utilities are configured to store only encrypted
              representations of passwords. Additionally, the "crypt_style" configuration option ensures the use of a strong
              hashing algorithm that makes password cracking attacks more difficult.'
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
        source_definition_id: oval:mil.disa.stig.rhel9os:def:258116
