      exports: []
      inline_content: 'Verify RHEL 9 generates audit records for all account creations, modifications, disabling, and termination
        events that affect "/etc/group" with the following command: $ sudo auditctl -l | egrep ''(/etc/group)'' -a always,exit
        -F arch=b32 -F path=/etc/group -F perm=wa -k identity -a always,exit -F arch=b64 -F path=/etc/group -F perm=wa -k
        identity If the command does not return a line, or the line is commented out, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:83701
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify RHEL 9 generates audit records for all account creations, modifications, disabling, and termination\
            \ events that affect \"/etc/group\" with the following command:\n\n$ sudo auditctl -l | egrep '(/etc/group)' \
            \ \n-a always,exit -F arch=b32 -F path=/etc/group -F perm=wa -k identity\n-a always,exit -F arch=b64 -F path=/etc/group\
            \ -F perm=wa -k identity\n\nIf the command does not return a line, or the line is commented out, this is a finding."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
