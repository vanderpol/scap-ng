      exports: []
      inline_content: 'Verify the system commands contained in the following directories are owned by "root" with the following
        command: $ sudo find -L /bin /sbin /usr/bin /usr/sbin /usr/libexec /usr/local/bin /usr/local/sbin ! -user root -exec
        stat -L -c "%U %n" {} \; If any system commands are found to not be owned by root, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
