scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify any SSH connection to RHEL 9 displays the Standard Mandatory DOD Notice and Consent Banner before granting
    access to the system. Check for the location of the banner file being used with the following command: $ sudo /usr/sbin/sshd
    -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo grep -iH ''^\s*banner'' /etc/ssh/sshd_config.d/80-bannerPointer.conf:Banner
    /etc/issue This command will return the banner keyword and the name of the file that contains the SSH banner (in this
    case "/etc/issue"). If the line is commented out, this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-257981r1101970_rule
    assessment_version: 1
    selector: default
    source_selector: ''
