  extends: null
  fix: 'Configure RHEL 9 to display the Standard Mandatory DOD Notice and Consent Banner before granting access to the system
    via ssh. Edit the "etc/ssh/sshd_config" file or a file in "/etc/ssh/sshd_config.d" to uncomment the banner keyword and
    configure it to point to a file that will contain the logon banner (this file may be named differently or be in a different
    location if using a version of SSH that is provided by a third-party vendor). An example configuration line is: Banner
    /etc/issue'
