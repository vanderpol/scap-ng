        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:39901
      exports: []
      inline_content: 'Verify any SSH connection to RHEL 9 displays the Standard Mandatory DOD Notice and Consent Banner before
        granting access to the system. Check for the location of the banner file being used with the following command: $
        sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo grep -iH
        ''^\s*banner'' /etc/ssh/sshd_config.d/80-bannerPointer.conf:Banner /etc/issue This command will return the banner
        keyword and the name of the file that contains the SSH banner (in this case "/etc/issue"). If the line is commented
        out, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:39901
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify any SSH connection to RHEL 9 displays the Standard Mandatory DOD Notice and Consent Banner before
            granting access to the system.


            Check for the location of the banner file being used with the following command:


            $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo grep
            -iH ''^\s*banner''

            /etc/ssh/sshd_config.d/80-bannerPointer.conf:Banner /etc/issue


            This command will return the banner keyword and the name of the file that contains the SSH banner (in this case
            "/etc/issue").


            If the line is commented out, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
