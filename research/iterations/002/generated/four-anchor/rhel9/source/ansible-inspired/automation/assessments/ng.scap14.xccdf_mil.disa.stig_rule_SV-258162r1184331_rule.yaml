        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:72501
      exports: []
      inline_content: 'Verify that RHEL 9 audit system is configured to take an appropriate action when the internal event
        queue is full: $ sudo grep -i overflow_action /etc/audit/auditd.conf overflow_action = syslog If the value of the
        "overflow_action" option is not set to "syslog", "single", "halt" or the line is commented out, ask the system administrator
        (SA) to indicate how the audit logs are offloaded to a different system or media. If there is no evidence that the
        audit system is configured to off-load the audit logs to another system or media and if the overflow action is not
        set to take appropriate action if the internal event queue becomes full, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:72501
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify that RHEL 9 audit system is configured to take an appropriate action when the internal event queue\
            \ is full:\n\n$ sudo grep -i overflow_action /etc/audit/auditd.conf \n\noverflow_action = syslog\n\nIf the value\
            \ of the \"overflow_action\" option is not set to \"syslog\", \"single\", \"halt\" or the line is commented out,\
            \ ask the system administrator (SA) to indicate how the audit logs are offloaded to a different system or media.\n\
            \nIf there is no evidence that the audit system is configured to off-load the audit logs to another system or\
            \ media and if the overflow action is not set to take appropriate action if the internal event queue becomes full,\
            \ this is a finding."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
