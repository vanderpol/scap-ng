  name: RHEL 9 must prevent a user from overriding the session idle-delay setting for the graphical user interface.
  steps:
  - name: Collect oval:mil.disa.stig.ind:obj:24453801
    collect:
      capability: scapng.collect.independent.textfilecontent54
      object_title: Check that the idle-delay setting is locked from nonprivileged user modification
      query:
      - kind: element
        name: path
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
        value: /etc/dconf/db/local.d/locks
      - attributes:
          operation: pattern match
        kind: element
        name: filename
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
        value: ^.*$
      - attributes:
          datatype: string
          operation: pattern match
        kind: element
        name: pattern
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
        value: ^\s*\/org\/gnome\/desktop\/session\/idle-delay$
      - attributes:
          datatype: int
          operation: greater than or equal
        kind: element
        name: instance
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
        value: '1'
      source_namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
      source_object_id: oval:mil.disa.stig.ind:obj:24453801
