  - name: Collect oval:mil.disa.stig.ind:obj:25801700
    collect:
      capability: scapng.collect.independent.textfilecontent54
      object_title: check that /etc/dconf/profile/user:system-db is at minimum set to local
      query:
      - kind: element
        name: filepath
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
        value: /etc/dconf/profile/user
      - attributes:
          operation: pattern match
        kind: element
        name: pattern
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
        value: ^\s*system-db\s*:\s*local\s*$
      - attributes:
          datatype: int
          operation: greater than or equal
        kind: element
        name: instance
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
