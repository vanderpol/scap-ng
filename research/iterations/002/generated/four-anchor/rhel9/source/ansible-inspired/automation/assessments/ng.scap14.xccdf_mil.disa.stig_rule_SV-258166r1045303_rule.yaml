        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:73301
      exports: []
      inline_content: 'Verify the audit logs directory is owned by "root". Determine where the audit logs are stored with
        the following command: $ sudo grep -iw log_file /etc/audit/auditd.conf log_file = /var/log/audit/audit.log Using the
        location of the audit log file, determine if the audit log directory is owned by "root" using the following command:
        $ sudo stat -c ''%U %n'' /var/log/audit root /var/log/audit If the audit log directory is not owned by "root", this
        is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:73301
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify the audit logs directory is owned by \"root\". \n\nDetermine where the audit logs are stored with\
            \ the following command:\n\n$ sudo grep -iw log_file /etc/audit/auditd.conf\n\nlog_file = /var/log/audit/audit.log\n\
            \nUsing the location of the audit log file, determine if the audit log directory is owned by \"root\" using the\
            \ following command:\n\n$ sudo stat -c '%U %n' /var/log/audit\n\nroot /var/log/audit\n\nIf the audit log directory\
            \ is not owned by \"root\", this is a finding."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
