          children:
          - name: title
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: RHEL-09-291025 - RHEL 9 must enable Linux audit logging for the USBGuard daemon.
          - attributes:
              family: unix
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Red Hat Enterprise Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "Without the capability to generate audit records, it would be difficult to establish, correlate, and investigate\
              \ the events relating to an incident or identify those responsible for one.\n\nIf auditing is enabled late in\
              \ the startup process, the actions of some startup processes may not be audited. Some audit systems also maintain\
              \ state information only available if auditing is enabled before a given process is created.\n\nAudit records\
              \ can be generated from various components within the information system (e.g., module or policy filter).\n\n\
              The list of audited events is the set of events for which audits are to be generated. This set of events is\
              \ typically a subset of the list of all events for which the system is capable of generating audit records.\n\
              \nDOD has defined the list of events for which RHEL 9 will provide an audit record generation capability as\
              \ the following:\n\n1) Successful and unsuccessful attempts to access, modify, or delete privileges, security\
              \ objects, security levels, or categories of information (e.g., classification levels);\n\n2) Access actions,\
              \ such as successful and unsuccessful logon attempts, privileged activities or other system-level access, starting\
              \ and ending time for user access to the system, concurrent logons from different workstations, successful and\
              \ unsuccessful accesses to objects, all program initiations, and all direct access to the information system;\n\
              \n3) All account creations, modifications, disabling, and terminations; and \n\n4) All kernel module load, unload,\
              \ and restart actions."
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
        source_definition_id: oval:mil.disa.stig.rhel9os:def:258037
        version: '1'
