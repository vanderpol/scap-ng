scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify the audit logs have a mode of "0600". Determine where the audit logs are stored with the following command:
    $ sudo grep "^log_file" /etc/audit/auditd.conf log_file = /var/log/audit/audit.log Using the location of the audit log
    file, determine the mode of each audit log with the following command: $ sudo find /var/log/audit/ -type f -exec stat
    -c ''%a %n'' {} \; 600 /var/log/audit/audit.log If the audit logs have a mode more permissive than "0600", this is a finding.'
  checks:
