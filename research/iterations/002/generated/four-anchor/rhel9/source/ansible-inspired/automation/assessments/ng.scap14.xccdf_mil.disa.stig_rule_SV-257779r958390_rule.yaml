      - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:501
      exports: []
      inline_content: 'Verify RHEL 9 displays the Standard Mandatory DOD Notice and Consent Banner before granting access
        to the operating system via a command line user logon. Check that a banner is displayed at the command line login
        screen with the following command: $ sudo cat /etc/issue If the banner is set correctly it will return the following
        text: "You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only.
        By using this IS (which includes any device attached to this IS), you consent to the following conditions: -The USG
        routinely intercepts and monitors communications on this IS for purposes including, but not limited to, penetration
        testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence
        (CI) investigations. -At any time, the USG may inspect and seize data stored on this IS. -Communications using, or
        data stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed
        or used for any USG-authorized purpose. -This IS includes security measures (e.g., authentication and access controls)
        to protect USG interests--not for your personal benefit or privacy. -Notwithstanding the above, using this IS does
        not constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications,
        or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their
        assistants. Such communications and work product are private and confidential. See User Agreement for details." If
        the banner text does not match the Standard Mandatory DOD Notice and Consent Banner exactly, or the line is commented
        out, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:501
