  extends: null
  fix: 'Configure RHEL 9 to employ a deny-all, permit-by-exception application allow listing policy with "fapolicyd". With
    the "fapolicyd" installed and enabled, configure the daemon to function in permissive mode until the allow list is built
    correctly to avoid system lockout. Do this by editing the "/etc/fapolicyd/fapolicyd.conf" file with the following line:
    permissive = 1 Build the allow list in a file within the "/etc/fapolicyd/rules.d" directory, ensuring the last rule implements
    a deny-all policy, such as "deny perm=any all : all". Once it is determined the allow list is built correctly, set the
    "fapolicyd" to enforcing mode by editing the "permissive" line in the /etc/fapolicyd/fapolicyd.conf file. permissive =
    0'
