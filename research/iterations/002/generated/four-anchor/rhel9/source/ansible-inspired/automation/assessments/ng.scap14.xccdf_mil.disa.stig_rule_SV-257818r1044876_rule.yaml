        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:8101
      exports: []
      inline_content: 'Verify that the kdump service is disabled in system boot configuration with the following command:
        $ sudo systemctl is-enabled kdump disabled Verify that the kdump service is not active (i.e., not running) through
        current runtime configuration with the following command: $ sudo systemctl is-active kdump masked Verify that the
        kdump service is masked with the following command: $ sudo systemctl show kdump | grep "LoadState\|UnitFileState"
        LoadState=masked UnitFileState=masked If the "kdump" service is loaded or active, and is not masked, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:8101
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify that the kdump service is disabled in system boot configuration with the following command:\n\n$ sudo\
            \ systemctl is-enabled  kdump  \n\ndisabled \n\nVerify that the kdump service is not active (i.e., not running)\
            \ through current runtime configuration with the following command:\n\n$ sudo systemctl is-active kdump \n\nmasked\
            \ \n\nVerify that the kdump service is masked with the following command:\n\n$ sudo systemctl show  kdump  | grep\
            \ \"LoadState\\|UnitFileState\" \n\nLoadState=masked \nUnitFileState=masked \n\nIf the \"kdump\" service is loaded\
            \ or active, and is not masked, this is a finding."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
