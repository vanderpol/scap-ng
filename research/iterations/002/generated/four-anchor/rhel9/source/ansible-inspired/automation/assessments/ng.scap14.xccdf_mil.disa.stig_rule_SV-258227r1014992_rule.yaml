          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify the audit service is configured to panic on a critical error with the following command:\n\n$ sudo\
            \ grep \"\\-f\" /etc/audit/audit.rules \n\n-f 2\n\nIf the value for \"-f\" is not \"2\", and availability is not\
            \ documented as an overriding concern, this is a finding."
