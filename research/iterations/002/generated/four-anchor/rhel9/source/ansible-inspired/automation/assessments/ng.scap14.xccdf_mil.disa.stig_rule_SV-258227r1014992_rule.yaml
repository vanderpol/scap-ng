          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'It is critical for the appropriate personnel to be aware if a system is at risk of failing to process audit
              logs as required. Without this notification, the security personnel may be unaware of an impending failure of
              the audit capability, and system operation may be adversely affected.


              Audit processing failures include software/hardware errors, failures in the audit capturing mechanisms, and
              audit storage capacity being reached or exceeded.


              Satisfies: SRG-OS-000046-GPOS-00022, SRG-OS-000047-GPOS-00023'
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
