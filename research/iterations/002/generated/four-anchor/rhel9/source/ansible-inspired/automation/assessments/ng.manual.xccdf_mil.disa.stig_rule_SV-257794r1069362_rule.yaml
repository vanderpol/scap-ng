        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:3301
      exports: []
      inline_content: 'Verify that GRUB2 is configured to mitigate use-after-free vulnerabilities by employing memory poisoning.
        Inspect the "GRUB_CMDLINE_LINUX" entry of /etc/default/grub as follows: $ sudo grep -i grub_cmdline_linux /etc/default/grub
        GRUB_CMDLINE_LINUX="... init_on_free=1" If "init_on_free=1" is missing or commented out, this is a finding.'
      multi_check: null
      negate: null
