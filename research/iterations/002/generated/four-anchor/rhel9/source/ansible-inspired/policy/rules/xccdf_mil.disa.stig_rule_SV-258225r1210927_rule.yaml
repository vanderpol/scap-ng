scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify RHEL 9 generates audit records for all account creations, modifications, disabling, and termination events
    that affect "/var/log/lastlog" with the following command: $ sudo auditctl -l | grep /var/log/lastlog -a always,exit -F
    arch=b32 -F path=/var/log/lastlog -F perm=wa -F auid>=1000 -F auid!=unset -k logins -a always,exit -F arch=b64 -F path=/var/log/lastlog
    -F perm=wa -F auid>=1000 -F auid!=unset -k logins If the command does not return a line, or the line is commented out,
    this is a finding.'
  checks:
