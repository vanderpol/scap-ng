            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'Without establishing what type of events occurred, the source of events, where events occurred, and the
              outcome of events, it would be difficult to establish, correlate, and investigate the events leading up to an
              outage or attack.


              Audit record content that may be necessary to satisfy this requirement includes, for example, time stamps, source
              and destination addresses, user/process identifiers, event descriptions, success/fail indications, filenames
              involved, and access control or flow control rules invoked.


              Enriched logging aids in making sense of who, what, and when events occur on a system. Without this, determining
              root cause of an event will be much more difficult.


              Satisfies: SRG-OS-000255-GPOS-00096, SRG-OS-000480-GPOS-00227'
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
