scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify RHEL 9 takes the appropriate action when the audit storage volume is full. Check that RHEL 9 takes the appropriate
    action when the audit storage volume is full with the following command: $ sudo grep disk_full_action /etc/audit/auditd.conf
    disk_full_action = HALT If the value of the "disk_full_action" option is not "SYSLOG", "SINGLE", or "HALT", or the line
    is commented out, ask the system administrator (SA) to indicate how the system takes appropriate action when an audit
    storage volume is full. If there is no evidence of appropriate action, this is a finding.'
  checks:
