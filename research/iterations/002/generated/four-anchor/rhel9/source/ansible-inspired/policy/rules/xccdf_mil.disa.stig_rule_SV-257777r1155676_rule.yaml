  abstract: false
  check: 'Verify the version or RHEL 9 is vendor supported with the following command: $ cat /etc/redhat-release Red Hat Enterprise
    Linux release 9.6 (Plow) If the installed version of RHEL 9 is not supported, this is a finding.'
