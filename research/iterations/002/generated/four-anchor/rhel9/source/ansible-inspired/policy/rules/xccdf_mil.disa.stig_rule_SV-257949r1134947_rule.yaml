scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that RHEL 9 has a DNS mode configured in Network Manager. $ NetworkManager --print-config [main] dns=none
    If the dns key under main does not exist or is not set to "default", "none", or "systemd-resolved", this is a finding.
    Note: If RHEL 9 is configured to use a DNS resolver other than Network Manager, the configuration must be documented and
    approved by the information system security officer (ISSO).'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-257949r1134947_rule
    assessment_version: 1
