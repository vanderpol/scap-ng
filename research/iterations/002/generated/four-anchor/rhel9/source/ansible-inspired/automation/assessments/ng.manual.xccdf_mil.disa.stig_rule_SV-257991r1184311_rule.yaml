        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:41301
      exports: []
      inline_content: 'Verify the SSH server is configured to use only MACs employing FIPS 140-3 approved algorithms. To verify
        the MACs in the systemwide SSH configuration file, use the following command: $ sudo grep -i MACs /etc/crypto-policies/back-ends/opensshserver.config
        MACs hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,hmac-sha2-256,hmac-sha2-512 If the MACs entries in
        the "opensshserver.config" file have any hashes other than "hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,hmac-sha2-256,hmac-sha2-512",
        or they are missing or commented out, this is a finding.'
      multi_check: null
      negate: null
