      exports: []
      inline_content: 'Verify the SSH private host key files have a mode of "0600" or less permissive with the following command:
        $ stat -c "%a %n" /etc/ssh/*_key 600 /etc/ssh/ssh_host_dsa_key 600 /etc/ssh/ssh_host_ecdsa_key 600 /etc/ssh/ssh_host_ed25519_key
        600 /etc/ssh/ssh_host_rsa_key If any private host key file has a mode more permissive than "0600", this is a finding.'
      multi_check: null
