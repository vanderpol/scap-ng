        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:13901
      exports: []
      inline_content: 'Verify that a separate file system/partition has been created for the system audit data path with the
        following command: Note: /var/log/audit is used as the example as it is a common location. $ mount | grep /var/log/audit
        /dev/mapper/rootvg-varlogaudit on /var/log/audit type xfs (rw,relatime,seclabel,attr2,inode64,logbufs=8,logbsize=32k,noquota)
        Note: Options displayed for mount may differ. If no line is returned, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
