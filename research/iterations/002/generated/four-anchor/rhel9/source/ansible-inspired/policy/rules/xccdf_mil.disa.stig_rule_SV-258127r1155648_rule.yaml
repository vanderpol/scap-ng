scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Note: If the system administrator demonstrates the use of an approved alternate multifactor authentication method,
    this requirement is not applicable. Verify the SSH private key files have a passcode. For each private key stored on the
    system, use the following command: $ sudo ssh-keygen -y -f /path/to/file The expected output is a password prompt: "Enter
    passphrase:" If the password prompt is not displayed, and the contents of the key are displayed, this is a finding.'
  checks:
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-258127r1155648_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-258127r1155648_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>If the private key is discovered, an attacker can use the key to authenticate as an authorized
    user and gain access to the network infrastructure. The cornerstone of the PKI is the private key used to encrypt or digitally
    sign information. If the private key is stolen, this will lead to the compromise of the authentication and nonrepudiation
    gained through PKI because the attacker can use the private key to digitally sign documents and pretend to be the authorized
    user. Both the holders of a digital certificate and the issuing authority must protect the computers, storage devices,
    or whatever they use to keep the private keys.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
