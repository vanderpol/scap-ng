        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:7101
      exports: []
      inline_content: 'Note: If kernel dumps are disabled in accordance with RHEL-09-213040, this requirement is not applicable.
        Verify RHEL 9 disables storing core dumps for all users by issuing the following command: $ grep -i storage /etc/systemd/coredump.conf
        Storage=none If the "Storage" item is missing or commented out, or the value is anything other than "none", and the
        need for core dumps is not documented with the information system security officer (ISSO) as an operational requirement
        for all domains that have the "core" item assigned, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:7101
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Note: If kernel dumps are disabled in accordance with RHEL-09-213040, this requirement is not applicable.


            Verify RHEL 9 disables storing core dumps for all users by issuing the following command:


            $ grep -i storage /etc/systemd/coredump.conf


            Storage=none


            If the "Storage" item is missing or commented out, or the value is anything other than "none", and the need for
            core dumps is not documented with the information system security officer (ISSO) as an operational requirement
            for all domains that have the "core" item assigned, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
