      inline_content: 'Ensure that RHEL 9 verifies correct operation of security functions through the use of SELinux with
        the following command: $ getenforce Enforcing If SELINUX is not set to "Enforcing", this is a finding. Verify that
        SELinux is configured to be enforcing at boot. grep "SELINUX=" /etc/selinux/config # SELINUX= can take one of these
        three values: # NOTE: In earlier Fedora kernel builds, SELINUX=disabled would also SELINUX=enforcing If SELINUX line
