  conflicts: []
  default_check: default
  description: '<VulnDiscussion>rsyslogd is a system utility providing support for message logging. Support for both internet
    and Unix domain sockets enables this utility to support both local and remote logging. Couple this utility with "gnutls"
    (which is a secure communications library implementing the SSL, TLS, and DTLS protocols), to create a method to securely
    encrypt and offload auditing. Satisfies: SRG-OS-000479-GPOS-00224, SRG-OS-000051-GPOS-00024, SRG-OS-000480-GPOS-00227</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
