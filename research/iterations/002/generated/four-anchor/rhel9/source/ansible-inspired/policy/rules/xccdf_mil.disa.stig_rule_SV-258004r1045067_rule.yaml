scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify the SSH daemon does not allow Kerberos authentication with the following command: $ sudo /usr/sbin/sshd -dd
    2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo grep -iH ''^\s*kerberosauthentication''
    KerberosAuthentication no If the value is returned as "yes", the returned line is commented out, no output is returned,
    and the use of Kerberos authentication has not been documented with the information system security officer (ISSO), this
    is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-258004r1045067_rule
    assessment_version: 1
    selector: default
    source_selector: ''
