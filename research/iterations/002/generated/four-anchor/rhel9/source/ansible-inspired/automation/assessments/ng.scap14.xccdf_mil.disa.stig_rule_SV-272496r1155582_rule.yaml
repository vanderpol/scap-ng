          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'Without verification of the security functions, security functions may not operate correctly and the failure
              may go unnoticed. Security function is defined as the hardware, software, and/or firmware of the information
              system responsible for enforcing the system security policy and supporting the isolation of code and data on
              which the protection is based. Security functionality includes, but is not limited to, establishing system accounts,
              configuring access authorizations (i.e., permissions, privileges), setting events to be audited, and setting
              intrusion detection parameters.


              This requirement applies to operating systems performing security function verification/testing and/or systems
              and environments that require this functionality.


              Preventing nonprivileged users from executing privileged functions mitigates the risk that unauthorized individuals
              or processes may gain unnecessary access to information or privileges.


              Privileged functions include, for example, establishing accounts, performing system integrity checks, or administering
              cryptographic key management activities. Nonprivileged users are individuals who do not possess appropriate
              authorizations. Circumventing intrusion detection and prevention mechanisms or malicious code protection mechanisms
              are examples of privileged functions that require protection from nonprivileged users.'
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
