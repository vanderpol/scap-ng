      exports: []
      inline_content: 'Verify RHEL 9 elevates the SELinux context when an administrator calls the sudo command with the following
        command: This command must be run as root: # grep -r sysadm_r /etc/sudoers /etc/sudoers.d %{designated_group_or_user_name}
        ALL=(ALL) TYPE=sysadm_t ROLE=sysadm_r ALL If a designated sudoers administrator group or account(s) is not configured
        to elevate the SELinux type and role to "sysadm_t" and "sysadm_r" with the use of the sudo command, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:88701
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify RHEL 9 elevates the SELinux context when an administrator calls the sudo command with the following
            command:


            This command must be run as root:


            # grep -r sysadm_r /etc/sudoers /etc/sudoers.d

            %{designated_group_or_user_name} ALL=(ALL) TYPE=sysadm_t ROLE=sysadm_r ALL


            If a designated sudoers administrator group or account(s) is not configured to elevate the SELinux type and role
            to "sysadm_t" and "sysadm_r" with the use of the sudo command, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
