  extends: null
  fix: 'Configure "auditd" service to take action in the event of allocated audit record storage volume reaches 95 percent
    of the repository maximum audit record storage capacity. Edit the following line in "/etc/audit/auditd.conf" to ensure
    that the system is forced into single user mode in the event the audit record storage volume is about to reach maximum
    capacity: admin_space_left_action = single The audit daemon must be restarted for changes to take effect.'
