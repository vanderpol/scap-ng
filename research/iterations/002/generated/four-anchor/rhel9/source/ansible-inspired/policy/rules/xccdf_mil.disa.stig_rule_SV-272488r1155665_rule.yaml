rule:
  abstract: false
  check: 'Note: If the admin can demonstrate that there is another system/service to send audit failure notifications to the
    administrator/ISSO, this control is not applicable. Verify RHEL 9 has the Postfix package installed with the following
    command: $ sudo dnf list --installed postfix Example output: postfix.x86_64 2:3.5.25-1.el9 If the "postfix" package is
    not installed, this is a finding.'
