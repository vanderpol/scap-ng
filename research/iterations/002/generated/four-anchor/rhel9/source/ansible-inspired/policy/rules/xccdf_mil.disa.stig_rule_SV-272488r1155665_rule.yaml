  conflicts: []
  default_check: default
  description: '<VulnDiscussion>Postfix is a free, open-source mail transfer agent (MTA) that sends and receives emails. It
    is a server-side application that can be used to set up a local mail server, create a null-client mail relay, use a Postfix
    server as a destination for multiple domains, or choose an LDAP directory instead of files for lookups. Postfix supports
    protocols such as LDAP, SMTP AUTH (SASL), and TLS. It uses the Simple Mail Transfer Protocol (SMTP) to transfer emails
    between servers. Satisfies: SRG-OS-000304-GPOS-00121, SRG-OS-000343-GPOS-00134, SRG-OS-000363-GPOS-00150, SRG-OS-000447-GPOS-00201</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
