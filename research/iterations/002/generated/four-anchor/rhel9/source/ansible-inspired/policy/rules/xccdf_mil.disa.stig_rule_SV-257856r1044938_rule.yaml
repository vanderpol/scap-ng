scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Note: If no NFS mounts are configured, this requirement is Not Applicable. Verify RHEL 9 has the "nosuid" option
    configured for all NFS mounts with the following command: $ grep nfs /etc/fstab 192.168.22.2:/mnt/export /data nfs4 rw,nosuid,nodev,noexec,sync,soft,sec=krb5:krb5i:krb5p
    If the system is mounting file systems via NFS and the "nosuid" option is missing, this is a finding.'
