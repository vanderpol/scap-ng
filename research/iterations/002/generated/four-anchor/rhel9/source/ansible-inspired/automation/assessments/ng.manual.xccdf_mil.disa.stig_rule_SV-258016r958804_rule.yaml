        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:45901
      exports: []
      inline_content: 'Verify RHEL 9 disables the graphical user interface autorun function with the following command: Note:
        This requirement assumes the use of the RHEL 9 default graphical user interface, the GNOME desktop environment. If
        the system does not have any graphical user interface installed, this requirement is Not Applicable. $ gsettings get
        org.gnome.desktop.media-handling autorun-never true If "autorun-never" is set to "false", and is not documented with
        the information system security officer (ISSO) as an operational requirement, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:45901
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify RHEL 9 disables the graphical user interface autorun function with the following command:\n\nNote:\
            \ This requirement assumes the use of the RHEL 9 default graphical user interface, the GNOME desktop environment.\
            \ If the system does not have any graphical user interface installed, this requirement is Not Applicable.\n\n\
            $ gsettings get org.gnome.desktop.media-handling autorun-never \n\ntrue\n\nIf \"autorun-never\" is set to \"false\"\
            , and is not documented with the information system security officer (ISSO) as an operational requirement, this\
            \ is a finding."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
