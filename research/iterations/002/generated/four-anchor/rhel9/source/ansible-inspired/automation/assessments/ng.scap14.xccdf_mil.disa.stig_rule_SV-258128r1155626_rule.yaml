      exports: []
      inline_content: 'Verify RHEL 9 requires authentication for emergency mode with the following command: $ grep sulogin
        /usr/lib/systemd/system/emergency.service ExecStart=-/usr/lib/systemd/systemd-sulogin-shell emergency If the line
        is not returned from the default systemd file, use the following command to look for modifications to the emergency.service:
        $ grep sulogin /etc/systemd/system/emergency.service.d/*.conf If the line is not returned from either location this
        is a finding. Note: The configuration setting can only be in either the default location, or in the drop in file,
        not both locations.'
