            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: RHEL-09-671025 - RHEL 9 pam_unix.so module must be configured in the password-auth file to use a FIPS 140-3
              approved cryptographic hashing algorithm for system authentication.
          - attributes:
              family: unix
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Red Hat Enterprise Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "Unapproved mechanisms that are used for authentication to the cryptographic module are not verified and;\
              \ therefore, cannot be relied upon to provide confidentiality or integrity, and DOD data may be compromised.\n\
              \nRHEL 9 systems utilizing encryption are required to use FIPS-compliant mechanisms for authenticating to cryptographic\
              \ modules. \n\nFIPS 140-3 is the current standard for validating that mechanisms used to access cryptographic\
              \ modules utilize authentication that meets DOD requirements. This allows for Security Levels 1, 2, 3, or 4\
              \ for use on a general-purpose computing system."
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
        source_definition_id: oval:mil.disa.stig.rhel9os:def:258233
