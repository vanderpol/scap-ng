scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify the RHEL 9 boot loader superuser account has been set with the following command: $ sudo grep -A1 "superusers"
    /etc/grub2.cfg set superusers="<accountname>" export superusers password_pbkdf2 <accountname> ${GRUB2_PASSWORD} Verify
    <accountname> is not a common name such as root, admin, or administrator. If superusers contains easily guessable usernames,
    this is a finding.'
