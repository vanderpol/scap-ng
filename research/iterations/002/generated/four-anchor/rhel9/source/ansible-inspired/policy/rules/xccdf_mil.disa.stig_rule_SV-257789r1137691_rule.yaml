  extends: null
  fix: 'Configure RHEL 9 to have a unique username for the grub superuser account. Edit the "/etc/grub.d/01_users" file and
    add or modify the following lines with a nondefault username for the superuser account: set superusers="<accountname>"
    export superusers Once the superuser account has been added, update the grub.cfg file by running: In RHEL 9.0, 9.1 and
    9.2: sudo grub2-mkconfig -o /boot/grub2/grub.cfg In RHEL 9.3 and later: sudo grub2-mkconfig -o /boot/grub2/grub.cfg --update-bls-cmdline'
