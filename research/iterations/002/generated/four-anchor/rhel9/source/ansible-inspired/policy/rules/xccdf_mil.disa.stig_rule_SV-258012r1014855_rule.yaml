authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify RHEL 9 displays the Standard Mandatory DOD Notice and Consent Banner before granting access to the operating
    system via a graphical user logon. Note: This requirement assumes the use of the RHEL 9 default graphical user interface,
    the GNOME desktop environment. If the system does not have any graphical user interface installed, this requirement is
    Not Applicable. Determine if the operating system displays a banner at the logon screen with the following command: $
    gsettings get org.gnome.login-screen banner-message-enable true If the result is "false", this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-258012r1014855_rule
    assessment_version: 1
    selector: default
    source_selector: ''
