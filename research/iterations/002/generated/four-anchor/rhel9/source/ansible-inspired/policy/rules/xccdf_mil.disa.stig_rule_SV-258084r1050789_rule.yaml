scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify RHEL 9 requires reauthentication when using the "sudo" command to elevate privileges with the following command:
    $ sudo grep -ir ''timestamp_timeout'' /etc/sudoers /etc/sudoers.d/ /etc/sudoers:Defaults timestamp_timeout=0 If results
    are returned from more than one file location, this is a finding. If "timestamp_timeout" is set to a negative number,
    is commented out, or no results are returned, this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-258084r1050789_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-258084r1050789_rule
    assessment_version: 1
    selector: automated
    source_selector: automated
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-258084r1050789_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>Without reauthentication, users may access resources or perform tasks for which they do not
    have authorization. When operating systems provide the capability to escalate a functional capability, it is critical
    the organization requires the user to reauthenticate when using the "sudo" command. If the value is set to an integer
    less than "0", the user's time stamp will not expire and the user will not have to reauthenticate for privileged actions
    until the user's session is terminated.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
