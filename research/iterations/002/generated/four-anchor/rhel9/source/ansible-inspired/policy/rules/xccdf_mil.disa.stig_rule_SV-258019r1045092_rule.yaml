    - name: description
      namespace: http://checklists.nist.gov/xccdf/1.2
      text: '<VulnDiscussion>A session lock is a temporary action taken when a user stops work and moves away from the immediate
        physical vicinity of the information system but does not want to log out because of the temporary nature of the absence.


        The session lock is implemented at the point where session activity can be determined. Rather than be forced to wait
