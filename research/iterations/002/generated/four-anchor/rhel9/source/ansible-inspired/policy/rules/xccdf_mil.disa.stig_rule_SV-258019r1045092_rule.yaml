rule:
  abstract: false
  check: 'Note: This requirement assumes the use of the RHEL 9 default graphical user interface, the GNOME desktop environment.
    If the system does not have any graphical user interface installed, this requirement is Not Applicable. Verify RHEL 9
    enables a user''s session lock until that user reestablishes access using established identification and authentication
    procedures with the following command: $ gsettings get org.gnome.settings-daemon.peripherals.smartcard removal-action
    ''lock-screen'' If the result is not ''lock-screen'', this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-258019r1045092_rule
    assessment_version: 1
