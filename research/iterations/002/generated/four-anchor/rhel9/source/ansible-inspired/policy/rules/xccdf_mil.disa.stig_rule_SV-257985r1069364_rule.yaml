  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-257985r1069364_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: '<VulnDiscussion>Even though the communications channel may be encrypted, an additional layer of security is
    gained by extending the policy of not logging directly on as root. In addition, logging in with a user-specific account
    provides individual accountability of actions performed on the system and also helps to minimize direct attack attempts
    on root''s password. Satisfies: SRG-OS-000109-GPOS-00056, SRG-OS-000480-GPOS-00227</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
