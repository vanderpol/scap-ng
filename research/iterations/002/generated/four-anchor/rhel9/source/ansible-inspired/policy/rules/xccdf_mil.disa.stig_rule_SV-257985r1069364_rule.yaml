scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify RHEL 9 remote access using SSH prevents users from logging on directly as "root" with the following command:
    $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo grep -iH
    ''^\s*permitrootlogin'' PermitRootLogin no If the "PermitRootLogin" keyword is set to any value other than "no", is missing,
    or is commented out, this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-257985r1069364_rule
    assessment_version: 1
