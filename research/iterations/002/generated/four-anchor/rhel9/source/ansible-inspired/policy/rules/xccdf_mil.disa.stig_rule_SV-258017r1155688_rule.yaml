  fix: 'Configure the GNOME desktop to not allow a user to change the setting that disables autorun on removable media. Add
    the following line to "/etc/dconf/db/local.d/locks/00-security-settings-lock" to prevent user modification: /org/gnome/desktop/media-handling/autorun-never
    Then update the dconf system databases: $ sudo dconf update'
