        metadata:
          children:
          - name: title
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: RHEL-09-652055 - RHEL 9 must be configured to forward audit records via TCP to a different system or media
              from the system being audited via rsyslog.
          - attributes:
              family: unix
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Red Hat Enterprise Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'Information stored in one location is vulnerable to accidental or incidental deletion or alteration.


              Offloading is a common process in information systems with limited audit storage capacity.


              RHEL 9 installation media provides "rsyslogd", a system utility providing support for message logging. Support
              for both internet and Unix domain sockets enables this utility to support both local and remote logging. Coupling
              this utility with "gnutls" (a secure communications library implementing the SSL, TLS and DTLS protocols) creates
              a method to securely encrypt and offload auditing.


              Rsyslog provides three ways to forward message: the traditional UDP transport, which is extremely lossy but
              standard; the plain TCP based transport, which loses messages only during certain situations but is widely available;
              and the RELP transport, which does not lose messages but is currently available only as part of the rsyslogd
              3.15.0 and above.


              Examples of each configuration:

              UDP *.* @remotesystemname

              TCP *.* @@remotesystemname

              RELP *.* :omrelp:remotesystemname:2514

              Note that a port number was given as there is no standard port for RELP.


              Satisfies: SRG-OS-000479-GPOS-00224, SRG-OS-000480-GPOS-00227, SRG-OS-000342-GPOS-00133'
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
        source_definition_id: oval:mil.disa.stig.rhel9os:def:258149
        version: '2'
