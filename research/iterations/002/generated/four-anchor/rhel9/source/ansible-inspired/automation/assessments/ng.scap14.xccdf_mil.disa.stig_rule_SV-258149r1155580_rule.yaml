            \ audited via rsyslog using TCP with the following commands:\n\nTo check for legacy configuration syntax, perform\
            \ the following:\n$ sudo grep -ir '@@' /etc/rsyslog.conf /etc/rsyslog.d/\n\nTo check for Rainer script syntax,\
            \ perform the following:\n$ sudo grep -rq 'type=\"omfwd\"' /etc/rsyslog.conf /etc/rsyslog.d/\n\nIf a remote server\
            \ is not configured, or the line is commented out, ask the system administrator (SA) to indicate how the audit\
            \ logs are off-loaded to a different system or media. \n\nIf there is no evidence that the audit logs are being\
            \ off-loaded to another system or media, this is a finding."
