        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:51901
      exports: []
      inline_content: 'Verify that system accounts must not have an interactive login shell with the following command: $
        awk -F: ''($3<1000){print $1 ":" $3 ":" $7}'' /etc/passwd root:0:/bin/bash bin:1:/sbin/nologin daemon:2:/sbin/nologin
        adm:3:/sbin/nologin lp:4:/sbin/nologin Identify the system accounts from this listing that do not have a nologin shell.
        If any system account (other than the root account) has a login shell and it is not documented with the information
        system security officer (ISSO), this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:51901
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify that system accounts must not have an interactive login shell with the following command:


            $ awk -F: ''($3<1000){print $1 ":" $3 ":" $7}'' /etc/passwd


            root:0:/bin/bash

            bin:1:/sbin/nologin

            daemon:2:/sbin/nologin

            adm:3:/sbin/nologin

            lp:4:/sbin/nologin


            Identify the system accounts from this listing that do not have a nologin shell.


            If any system account (other than the root account) has a login shell and it is not documented with the information
            system security officer (ISSO), this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
