rule:
  abstract: false
  check: 'Verify the SELINUX on RHEL 9 is using the targeted policy with the following command: $ sestatus | grep "policy
    name" Loaded policy name: targeted If the loaded policy name is not "targeted", this is a finding.'
  checks:
