  cluster_id: null
  conflicts: []
  default_check: default
  description: '<VulnDiscussion>Setting the SELinux policy to "targeted" or a more specialized policy ensures the system will
    confine processes that are likely to be targeted for exploitation, such as network or system services. Note: During the
    development or debugging of SELinux modules, it is common to temporarily place nonproduction systems in "permissive" mode.
    In such temporary cases, SELinux policies should be developed, and once work is completed, the system should be reconfigured
    to "targeted".</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
