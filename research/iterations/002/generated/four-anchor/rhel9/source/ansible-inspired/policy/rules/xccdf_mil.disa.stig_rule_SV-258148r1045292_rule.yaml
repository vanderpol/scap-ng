scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify RHEL 9 uses the gtls driver to encrypt audit records offloaded onto a different system or media from the
    system being audited with the following command: $ grep -Ei ''DefaultNetStreamDriver\b|StreamDriver.Name'' /etc/rsyslog.conf
    /etc/rsyslog.d/*.conf /etc/rsyslog.conf:$DefaultNetstreamDriver gtls If the value of the "$DefaultNetstreamDriver or StreamDriver"
    option is not set to "gtls" or the line is commented out, this is a finding. If the variable name "StreamDriver" is present
    in an omfwd statement block, this is not a finding. However, if the "StreamDriver" variable is in a module block, this
    is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-258148r1045292_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-258148r1045292_rule
    assessment_version: 1
    selector: automated
    source_selector: automated
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-258148r1045292_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: '<VulnDiscussion>Information stored in one location is vulnerable to accidental or incidental deletion or alteration.
    Offloading is a common process in information systems with limited audit storage capacity. RHEL 9 installation media provides
    "rsyslogd", a system utility providing support for message logging. Support for both internet and Unix domain sockets
    enables this utility to support both local and remote logging. Coupling this utility with "gnutls" (a secure communications
    library implementing the SSL, TLS and DTLS protocols) creates a method to securely encrypt and offload auditing. Satisfies:
    SRG-OS-000342-GPOS-00133, SRG-OS-000479-GPOS-00224</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
