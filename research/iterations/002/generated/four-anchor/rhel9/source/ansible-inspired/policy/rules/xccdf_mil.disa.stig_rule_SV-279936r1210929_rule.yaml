  default_check: default
  description: <VulnDiscussion>Any script or executable called by cron as root or by any privileged user must be owned by
    that user. It must also have the permissions 755 or more restrictive and should have no extended rights that allow any
    nonprivileged user to modify the script or executable.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
