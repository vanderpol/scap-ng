    update the following file system rules to "/etc/audit/rules.d/audit.rules": -a always,exit -F arch=b64 -S execve -F subj_type=crond_t
    -F euid=0 -k cron_exec -a always,exit -F arch=b32 -S execve -F subj_type=crond_t -F euid=0 -k cron_exec -a always,exit
    -F arch=b64 -S execve -F subj_type=crond_t -F auid>=1000 -F auid!=unset -k cron_exec -a always,exit -F arch=b32 -S execve
    -F subj_type=crond_t -F auid>=1000 -F auid!=unset -k cron_exec To load the rules to the kernel immediately, use the following
    command: $ sudo augenrules --load'
