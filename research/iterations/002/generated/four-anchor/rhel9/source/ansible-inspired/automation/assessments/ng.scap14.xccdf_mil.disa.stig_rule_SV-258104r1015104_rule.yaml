          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'Enforcing a minimum password lifetime helps to prevent repeated password changes to defeat the password
              reuse or history enforcement requirement. If users are allowed to immediately and continually change their password,
              then the password could be repeatedly changed in a short period of time to defeat the organization''s policy
              regarding password reuse.


              Setting the minimum password age protects against users cycling back to a favorite password after satisfying
              the password reuse requirement.'
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
        source_definition_id: oval:mil.disa.stig.rhel9os:def:258104
