scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify the assigned home directories of all interactive users on the system exist with the following command: $
    sudo pwck -r The output should not return any interactive (human) users. Ask the system administrator (SA) if any users
    found without home directories are local interactive users. If the SA is unable to provide a response, check for users
    with a user identifier (UID) of 1000 or greater with the following command: $ awk -F: ''($3>=1000)&&($1!="nobody"){print
    $1 ":" $3}'' /etc/passwd If any interactive users do not have a home directory assigned, this is a finding.'
  checks:
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-258052r1184315_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-258052r1184315_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>If a local interactive user has a home directory defined that does not exist, the user may
    be given access to the / directory as the current working directory upon logon. This could create a denial of service
    because the user would not be able to access their logon configuration files, and it may give them visibility to system
    files they normally would not be able to access.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
