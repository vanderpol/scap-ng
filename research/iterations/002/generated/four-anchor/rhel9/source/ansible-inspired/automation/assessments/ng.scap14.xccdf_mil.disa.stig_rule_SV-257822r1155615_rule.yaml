            text: RHEL-09-214025 - RHEL 9 must have GPG signature verification enabled for all software repositories.
          - attributes:
              family: unix
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Red Hat Enterprise Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'Changes to any software components can have significant effects on the overall security of the operating
              system. This requirement ensures the software has not been tampered with and that it has been provided by a
              trusted vendor.


              All software packages must be signed with a cryptographic key recognized and approved by the organization.


              Verifying the authenticity of software prior to installation validates the integrity of the software package
              received from a vendor. This verifies the software has not been tampered with and that it has been provided
              by a trusted vendor.'
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
