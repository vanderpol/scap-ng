        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:6101
      exports: []
      inline_content: 'Verify that RHEL 9 disables the ability to load the tipc kernel module with the following command:
        $ grep -r tipc /etc/modprobe.conf /etc/modprobe.d/* install tipc /bin/false blacklist tipc If the command does not
        return any output, or the lines are commented out, and use of tipc is not documented with the information system security
        officer (ISSO) as an operational requirement, this is a finding.'
