scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify the systemwide shared library directories are owned by "root" with the following command: $ sudo find /lib
    /lib64 /usr/lib /usr/lib64 ! -user root -type d -exec stat -c "%U %n" {} \; If any systemwide shared library directory
    is not owned by "root", this is a finding.'
  checks:
