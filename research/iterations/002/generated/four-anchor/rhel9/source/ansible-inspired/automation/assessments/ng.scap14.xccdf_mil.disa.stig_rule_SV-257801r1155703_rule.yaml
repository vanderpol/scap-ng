          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'By enabling the fs.protected_hardlinks kernel parameter, users can no longer create soft or hard links
              to files they do not own. Disallowing such hardlinks mitigates vulnerabilities based on insecure file system
