  description: '<VulnDiscussion>Without the use of multifactor authentication, the ease of access to privileged functions
    is greatly increased. Multifactor authentication requires using two or more factors to achieve authentication. A privileged
    account is defined as an information system account with authorizations of a privileged user. The DOD Common Access Card
    (CAC) with DOD-approved PKI is an example of multifactor authentication. Satisfies: SRG-OS-000375-GPOS-00160, SRG-OS-000105-GPOS-00052</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
