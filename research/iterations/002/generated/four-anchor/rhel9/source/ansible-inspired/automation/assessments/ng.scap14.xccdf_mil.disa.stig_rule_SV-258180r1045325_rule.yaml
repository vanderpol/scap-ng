      exports: []
      inline_content: 'Verify that RHEL 9 is configured to audit the execution of the "umount" command with the following
        command: $ sudo auditctl -l | grep /usr/bin/umount -a always,exit -S all -F path=/usr/bin/umount -F perm=x -F auid>=1000
        -F auid!=-1 -F key=privileged-mount If the command does not return an audit rule for "umount" or any of the lines
        returned are commented out, this is a finding.'
