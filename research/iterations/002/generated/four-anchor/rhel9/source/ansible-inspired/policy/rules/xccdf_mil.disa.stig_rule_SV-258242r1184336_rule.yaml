rule:
  abstract: false
  check: 'Verify that BIND uses the system crypto policy with the following command: Note: If the "bind" package is not installed,
    this requirement is Not Applicable. $ sudo grep include /etc/named.conf include "/etc/crypto-policies/back-ends/bind.config";''
    If BIND is installed and the BIND config file doesn''t contain the include "/etc/crypto-policies/back-ends/bind.config"
    directive, or the line is commented out, this is a finding.'
  checks:
