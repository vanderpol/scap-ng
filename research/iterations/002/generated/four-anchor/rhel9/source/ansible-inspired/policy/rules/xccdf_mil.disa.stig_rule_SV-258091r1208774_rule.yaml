scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify RHEL 9 is configured to limit the "pwquality" retry option to "3". Check for the use of the retry option
    in the security directory with the following command: $ grep -w retry /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    retry = 3 If the value of "retry" is set to "0" or greater than "3", or is missing, this is a finding.'
  checks:
