      text: '<VulnDiscussion>Information stored in one location is vulnerable to accidental or incidental deletion or alteration.


        Offloading is a common process in information systems with limited audit storage capacity.


        RHEL 9 installation media provides "rsyslogd", a system utility providing support for message logging. Support for
        both internet and Unix domain sockets enables this utility to support both local and remote logging. Coupling this
