        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:46101
      exports: []
      inline_content: 'Note: This requirement assumes the use of the RHEL 9 default graphical user interface, the GNOME desktop
        environment. If the system does not have any graphical user interface installed, this requirement is Not Applicable.
        Verify RHEL 9 disables ability of the user to override the graphical user interface autorun setting. Check that the
        autorun setting is set to prevent user modification with the following command: $ gsettings writable org.gnome.desktop.media-handling
        autorun-never false If "autorun-never" is writable, the result is "true". If this is not documented with the information
        system security officer (ISSO) as an operational requirement, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:46101
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Note: This requirement assumes the use of the RHEL 9 default graphical user interface, the GNOME desktop\
            \ environment. If the system does not have any graphical user interface installed, this requirement is Not Applicable.\n\
            \nVerify RHEL 9 disables ability of the user to override the graphical user interface autorun setting.\n\nCheck\
            \ that the autorun setting is set to prevent user modification with the following command:\n\n$ gsettings writable\
            \ org.gnome.desktop.media-handling autorun-never\n \nfalse\n \nIf \"autorun-never\" is writable, the result is\
            \ \"true\". If this is not documented with the information system security officer (ISSO) as an operational requirement,\
            \ this is a finding."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
