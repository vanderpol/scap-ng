        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:69701
      exports: []
      inline_content: 'Verify RHEL 9 uses the gtls driver to encrypt audit records offloaded onto a different system or media
        from the system being audited with the following command: $ grep -Ei ''DefaultNetStreamDriver\b|StreamDriver.Name''
        /etc/rsyslog.conf /etc/rsyslog.d/*.conf /etc/rsyslog.conf:$DefaultNetstreamDriver gtls If the value of the "$DefaultNetstreamDriver
        or StreamDriver" option is not set to "gtls" or the line is commented out, this is a finding. If the variable name
        "StreamDriver" is present in an omfwd statement block, this is not a finding. However, if the "StreamDriver" variable
        is in a module block, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
