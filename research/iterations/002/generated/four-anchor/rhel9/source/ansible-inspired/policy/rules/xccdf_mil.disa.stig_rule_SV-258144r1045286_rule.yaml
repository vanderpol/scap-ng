scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that RHEL 9 monitors all remote access methods. Check that remote access methods are being logged by running
    the following command: $ grep -rE ''(auth.\*|authpriv.\*|daemon.\*)'' /etc/rsyslog.conf /etc/rsyslog.d/ /etc/rsyslog.conf:authpriv.*
    If "auth.*", "authpriv.*" or "daemon.*" are not configured to be logged, this is a finding.'
  checks:
