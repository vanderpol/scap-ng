rule:
  abstract: false
  check: 'Verify RHEL 9 logs IPv4 martian packets. Check the value of the "log_martians" variable with the following command:
    $ sudo sysctl net.ipv4.conf.all.log_martians net.ipv4.conf.all.log_martians = 1 If "net.ipv4.conf.all.log_martians" is
    not set to "1" or is missing, this is a finding.'
