        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify that dnf always checks the GPG signature of software packages originating from external software repositories
            before installation:


            $ grep -w gpgcheck /etc/dnf/dnf.conf


            gpgcheck=1


            If "gpgcheck" is not set to "1", or if the option is missing or commented out, ask the system administrator how
