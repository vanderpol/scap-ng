        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:7501
      exports: []
      inline_content: 'Note: If kernel dumps are disabled in accordance with RHEL-09-213040, this requirement is not applicable.
        Verify RHEL 9 is not configured to acquire, save, or process core dumps with the following command: $ sudo systemctl
        status systemd-coredump.socket systemd-coredump.socket Loaded: masked (Reason: Unit systemd-coredump.socket is masked.)
        Active: inactive (dead) If the "systemd-coredump.socket" is loaded and not masked, and the need for core dumps is
        not documented with the information system security officer (ISSO) as an operational requirement, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:7501
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Note: If kernel dumps are disabled in accordance with RHEL-09-213040, this requirement is not applicable.


            Verify RHEL 9 is not configured to acquire, save, or process core dumps with the following command:


            $ sudo systemctl status systemd-coredump.socket


            systemd-coredump.socket

            Loaded: masked (Reason: Unit systemd-coredump.socket is masked.)

            Active: inactive (dead)


            If the "systemd-coredump.socket" is loaded and not masked, and the need for core dumps is not documented with
            the information system security officer (ISSO) as an operational requirement, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
