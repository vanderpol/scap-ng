      inline_content: 'Verify RHEL 9 is configured to exit interactive command shell user sessions after 10 minutes of inactivity
        or less with the following command: $ sudo grep -i tmout /etc/profile /etc/profile.d/*.sh /etc/profile.d/tmout.sh:declare
