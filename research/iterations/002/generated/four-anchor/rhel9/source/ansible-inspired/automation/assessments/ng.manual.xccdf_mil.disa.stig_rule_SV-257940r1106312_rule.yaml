  description: RHEL 9 must be configured to prohibit or restrict the use of functions, ports, protocols, and/or services,
    as defined in the Ports, Protocols, and Services Management (PPSM) Category Assignments List (CAL) and vulnerability assessments.
  name: RHEL 9 must be configured to prohibit or restrict the use of functions, ports, protocols, and/or services, as defined
