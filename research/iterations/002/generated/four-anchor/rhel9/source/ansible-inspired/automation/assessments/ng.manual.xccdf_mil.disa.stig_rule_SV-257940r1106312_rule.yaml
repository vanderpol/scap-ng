            \ are currently active with the following command:\n\n$ sudo firewall-cmd --list-all-zones | grep -e \"active\"\
            \ -e \"services\"\n\nAsk the system administrator for the site or program Ports, Protocols, and Services Management\
            \ Component Local Service Assessment (PPSM CLSA). Verify the services allowed by the firewall match the PPSM CLSA.\
            \ \n\nIf there are additional ports, protocols, or services that are not in the PPSM CLSA, or there are ports,\
            \ protocols, or services that are prohibited by the PPSM CAL, this is a finding."
