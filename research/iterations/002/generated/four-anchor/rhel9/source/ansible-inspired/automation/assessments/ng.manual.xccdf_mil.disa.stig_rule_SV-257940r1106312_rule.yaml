        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:31901
      exports: []
      inline_content: 'Inspect the firewall configuration and running services to verify it is configured to prohibit or restrict
        the use of functions, ports, protocols, and/or services that are unnecessary or prohibited. Check which services are
        currently active with the following command: $ sudo firewall-cmd --list-all-zones | grep -e "active" -e "services"
        Ask the system administrator for the site or program Ports, Protocols, and Services Management Component Local Service
        Assessment (PPSM CLSA). Verify the services allowed by the firewall match the PPSM CLSA. If there are additional ports,
        protocols, or services that are not in the PPSM CLSA, or there are ports, protocols, or services that are prohibited
        by the PPSM CAL, this is a finding.'
      multi_check: null
      negate: null
