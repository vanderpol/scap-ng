  extends: null
  fix: 'Configure RHEL 9 to generate audit records upon successful/unsuccessful attempts to use the "postdrop" command by
    adding or updating the following rule in "/etc/audit/rules.d/audit.rules": -a always,exit -F path=/usr/sbin/postdrop -F
    perm=x -F auid>=1000 -F auid!=unset -k privileged-unix-update To load the rules to the kernel immediately, use the following
    command: $ sudo augenrules --load'
