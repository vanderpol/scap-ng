        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:74701
      exports: []
      inline_content: 'Verify that RHEL 9 is configured to notify the appropriate interactive users in the event of an audit
        processing failure. Find the alias maps that are being used with the following command: $ postconf alias_maps alias_maps
        = hash:/etc/aliases Query the Postfix alias maps for an alias for the root user with the following command: $ postmap
        -q root hash:/etc/aliases isso If an alias is not set, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:74701
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify that RHEL 9 is configured to notify the appropriate interactive users in the event of an audit processing\
            \ failure.\n\nFind the alias maps that are being used with the following command:\n\n$ postconf alias_maps \n\n\
            alias_maps = hash:/etc/aliases\n\nQuery the Postfix alias maps for an alias for the root user with the following\
            \ command:\n\n$ postmap -q root hash:/etc/aliases\nisso\n\nIf an alias is not set, this is a finding."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
