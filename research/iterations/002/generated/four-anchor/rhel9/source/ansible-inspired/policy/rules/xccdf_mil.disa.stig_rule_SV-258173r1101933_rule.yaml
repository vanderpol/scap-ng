    assessment_version: 1
    selector: automated
    source_selector: automated
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-258173r1101933_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: '<VulnDiscussion>Without the capability to generate audit records, it would be difficult to establish, correlate,
    and investigate the events relating to an incident or identify those responsible for one. If auditing is enabled late
    in the startup process, the actions of some startup processes may not be audited. Some audit systems also maintain state
    information only available if auditing is enabled before a given process is created. Audit records can be generated from
    various components within the information system (e.g., module or policy filter). Allocating an audit_backlog_limit of
    sufficient size is critical in maintaining a stable boot process. With an insufficient limit allocated, the system is
    susceptible to boot failures and crashes. Satisfies: SRG-OS-000254-GPOS-00095, SRG-OS-000341-GPOS-00132</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
