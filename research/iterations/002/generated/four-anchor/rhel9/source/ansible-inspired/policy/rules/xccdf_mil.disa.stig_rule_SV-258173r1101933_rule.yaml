rule:
  abstract: false
  check: 'Verify RHEL 9 allocates a sufficient audit_backlog_limit to capture processes that start prior to the audit daemon
    with the following command: $ sudo grubby --info=ALL | grep args | grep ''audit_backlog_limit'' If the command returns
    any outputs, and audit_backlog_limit is less than "8192", this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-258173r1101933_rule
    assessment_version: 1
    selector: default
    source_selector: ''
