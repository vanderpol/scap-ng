    - content_refs:
      - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:88301
      exports: []
      inline_content: 'Verify the RHEL 9 "fapolicyd" employs a deny-all, permit-by-exception policy. Verify "fapolicyd" is
        in enforcement mode with the following command: $ sudo grep permissive /etc/fapolicyd/fapolicyd.conf permissive =
        0 If "fapolicyd" is not running in enforcement mode, this is a finding. Check that "fapolicyd" employs a deny-all
        policy on system mounts with the following commands: $ sudo tail /etc/fapolicyd/compiled.rules allow exe=/usr/bin/python3.7
        : ftype=text/x-python deny_audit perm=any pattern=ld_so : all deny perm=any all : all If "fapolicyd" is not running
        with a deny-all, permit-by-exception policy, this is a finding. Note: "deny_log" or "deny_audit" options meet the
        security requirements. These options will generate higher volumes of logs.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:88301
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify the RHEL 9 "fapolicyd" employs a deny-all, permit-by-exception policy.


            Verify "fapolicyd" is in enforcement mode with the following command:


            $ sudo grep permissive /etc/fapolicyd/fapolicyd.conf


            permissive = 0


            If "fapolicyd" is not running in enforcement mode, this is a finding.


            Check that "fapolicyd" employs a deny-all policy on system mounts with the following commands:


            $ sudo tail /etc/fapolicyd/compiled.rules


            allow exe=/usr/bin/python3.7 : ftype=text/x-python

            deny_audit perm=any pattern=ld_so : all

            deny perm=any all : all


            If "fapolicyd" is not running with a deny-all, permit-by-exception policy, this is a finding.


            Note: "deny_log" or "deny_audit" options meet the security requirements.  These options will generate higher volumes
            of logs.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
