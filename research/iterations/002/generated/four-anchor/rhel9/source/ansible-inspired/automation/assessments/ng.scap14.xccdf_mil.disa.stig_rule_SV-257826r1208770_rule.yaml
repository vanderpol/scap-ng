            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'The FTP service provides an unencrypted remote access that does not provide for the confidentiality and
              integrity of user passwords or the remote session. If a privileged user were to log on using this service, the
              privileged user password could be compromised. SSH or other encrypted file transfer methods must be used in
              place of this service.


              Removing the "vsftpd" package decreases the risk of accidental activation.


              Satisfies: SRG-OS-000074-GPOS-00042, SRG-OS-000095-GPOS-00049, SRG-OS-000480-GPOS-00227'
