        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify "/tmp" is mounted with the "nodev" option:


            $ mount | grep /tmp


            /dev/mapper/rhel-tmp on /tmp type xfs (rw,nodev,nosuid,noexec,seclabel)


