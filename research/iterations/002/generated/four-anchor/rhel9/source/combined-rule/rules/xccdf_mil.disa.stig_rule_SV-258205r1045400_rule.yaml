  fix: 'Configure RHEL 9 to generate audit records upon successful/unsuccessful attempts to use the "sudoedit" command by
    adding or updating the following rule in "/etc/audit/rules.d/audit.rules": -a always,exit -F path=/usr/bin/sudoedit -F
    perm=x -F auid>=1000 -F auid!=unset -k priv_cmd To load the rules to the kernel immediately, use the following command:
    $ sudo augenrules --load'
