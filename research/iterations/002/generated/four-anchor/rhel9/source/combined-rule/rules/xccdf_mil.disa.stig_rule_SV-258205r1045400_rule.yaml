rule:
  id: xccdf_mil.disa.stig_rule_SV-258205r1045400_rule
  title: RHEL 9 must audit all uses of the sudoedit command.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
