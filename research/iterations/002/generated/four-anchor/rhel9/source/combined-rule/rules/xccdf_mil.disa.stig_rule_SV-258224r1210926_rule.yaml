  fix: 'Configure RHEL 9 to generate audit records for all account creations, modifications, disabling, and termination events
    that affect "/var/log/faillock". Add or update the following file system rule to "/etc/audit/rules.d/audit.rules": -a
    always,exit -F arch=b32 -F path=/var/log/faillock -F perm=wa -F auid>=1000 -F auid!=unset -k logins -a always,exit -F
    arch=b64 -F path=/var/log/faillock -F perm=wa -F auid>=1000 -F auid!=unset -k logins To load the rules to the kernel immediately,
    use the following command: $ sudo augenrules --load'
