      - name: check-content
        namespace: http://checklists.nist.gov/xccdf/1.2
        text: 'Verify RHEL 9 is configured to audit successful/unsuccessful attempts to use the "truncate", "ftruncate", "creat",
          "open", "openat", and "open_by_handle_at" system calls with the following command:


          $ sudo auditctl -l | grep ''open\b\|openat\|open_by_handle_at\|truncate\|creat''


          -a always,exit -F arch=b32 -S open,creat,truncate,ftruncate,openat,open_by_handle_at -F exit=-EPERM -F auid>=1000
          -F auid!=-1 -F key=perm_access

          -a always,exit -F arch=b64 -S open,truncate,ftruncate,creat,openat,open_by_handle_at -F exit=-EPERM -F auid>=1000
          -F auid!=-1 -F key=perm_access

          -a always,exit -F arch=b32 -S open,creat,truncate,ftruncate,openat,open_by_handle_at -F exit=-EACCES -F auid>=1000
          -F auid!=-1 -F key=perm_access

          -a always,exit -F arch=b64 -S open,truncate,ftruncate,creat,openat,open_by_handle_at -F exit=-EACCES -F auid>=1000
          -F auid!=-1 -F key=perm_access


          If the output does not produce rules containing "-F exit=-EPERM", this is a finding.


          If the output does not produce rules containing "-F exit=-EACCES", this is a finding.


          If the command does not return an audit rule for "truncate", "ftruncate", "creat", "open", "openat", and "open_by_handle_at"
          or any of the lines returned are commented out, this is a finding.'
      name: check
      namespace: http://checklists.nist.gov/xccdf/1.2
