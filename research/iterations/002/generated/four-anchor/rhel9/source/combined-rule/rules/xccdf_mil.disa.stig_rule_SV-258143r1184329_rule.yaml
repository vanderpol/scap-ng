            operator: AND
          metadata:
            children:
            - name: title
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: RHEL-09-652025 - RHEL 9 must be configured so that the rsyslog daemon does not accept log messages from
                other servers unless the server is being used for log aggregation.
            - attributes:
                family: unix
              children:
              - name: platform
                namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
                text: Red Hat Enterprise Linux 9
              name: affected
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: 'Unintentionally running a rsyslog server accepting remote messages puts the system at increased risk.
                Malicious rsyslog messages sent to the server could exploit vulnerabilities in the server software itself,
                could introduce misleading information into the system''s logs, or could fill the system''s storage leading
                to a denial of service.


                If the system is intended to be a log aggregation server, its use must be documented with the information
                system security officer (ISSO).'
            name: metadata
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
