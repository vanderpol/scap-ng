  group_path:
  - xccdf_mil.disa.stig_group_V-257959
  description: <VulnDiscussion>Source-routed packets allow the source of the packet to suggest that routers forward the packet
    along a different path than configured on the router, which can be used to bypass network security measures. This requirement
    applies only to the forwarding of source-routed traffic, such as when forwarding is enabled and the system is functioning
    as a router. The sysctl --system command will load settings from all system configuration files. All configuration files
    are sorted by their filename in lexicographical order, regardless of which of the directories in which they reside. If
    multiple files specify the same option, the entry in the file with the lexicographically latest name will take precedence.
    Files are read from directories in the following list from top to bottom. Once a file of a given filename is loaded, any
    file of the same name in subsequent directories is ignored. /etc/sysctl.d/*.conf /run/sysctl.d/*.conf /usr/local/lib/sysctl.d/*.conf
    /usr/lib/sysctl.d/*.conf /lib/sysctl.d/*.conf /etc/sysctl.conf</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
