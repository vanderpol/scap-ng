  fix: 'Configure RHEL 9 to prevent a user from overriding settings for graphical user interfaces. Create a database to contain
    the systemwide screensaver settings (if it does not already exist) with the following command: Note: The example below
    is using the database "local" for the system. If the system is using another database in "/etc/dconf/profile/user", the
    file should be created under the appropriate subdirectory. $ sudo touch /etc/dconf/db/local.d/locks/session Add the following
    setting to prevent nonprivileged users from modifying it: /org/gnome/desktop/screensaver/lock-delay Run the following
    command to update the database: $ sudo dconf update'
