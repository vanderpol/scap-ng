  check: 'Verify RHEL 9 takes action when allocated audit record storage volume reaches 95 percent of the repository maximum
    audit record storage capacity with the following command: $ sudo grep -w admin_space_left /etc/audit/auditd.conf admin_space_left
    = 5% If the value of the "admin_space_left" keyword is not set to 5 percent of the storage volume allocated to audit logs,
    or if the line is commented out, ask the system administrator (SA) to indicate how the system is taking action if the
    allocated storage is about to reach capacity. If the "space_left" value is not configured to the correct value, this is
    a finding.'
