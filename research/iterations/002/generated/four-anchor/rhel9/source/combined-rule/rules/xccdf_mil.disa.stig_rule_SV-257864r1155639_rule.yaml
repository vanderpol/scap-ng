  fix: 'Configure "/dev/shm" to mount with the "noexec" option. Modify "/etc/fstab" to use the "noexec" option on the "/dev/shm"
    file system. To reload all implicit mount units and update the dependency graph so that new options will apply correctly
    at next remount, run the following command: $ sudo systemctl daemon-reload Use the following command to apply the changes
    immediately without a reboot: $ sudo mount -o remount /dev/shm'
