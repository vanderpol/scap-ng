  fix: 'Configure the audit system to generate an audit event for any successful/unsuccessful use of the "umount2" system
    call by adding or updating the following rules in a file in "/etc/audit/rules.d". -a always,exit -F arch=b32 -S umount2
    -F auid>=1000 -F auid!=unset -k privileged-umount -a always,exit -F arch=b64 -S umount2 -F auid>=1000 -F auid!=unset -k
    privileged-umount To load the rules to the kernel immediately, use the following command: $ sudo augenrules --load'
