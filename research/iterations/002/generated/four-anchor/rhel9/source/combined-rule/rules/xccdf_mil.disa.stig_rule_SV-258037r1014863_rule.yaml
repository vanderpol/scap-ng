rule:
  id: xccdf_mil.disa.stig_rule_SV-258037r1014863_rule
  title: RHEL 9 must enable Linux audit logging for the USBGuard daemon.
  severity: low
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
