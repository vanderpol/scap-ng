  fix: 'Configure RHEL 9 to prevent privilege escalation through the kernel by disabling access to the bpf system call. Create
    the drop-in file if it does not already exist: $ sudo vi /etc/sysctl.d/99-kernel_unprivileged_bpf_disabled.conf Add the
    following line to the file: kernel.unprivileged_bpf_disabled = 1 Reload settings from all system configuration files with
    the following command: $ sudo sysctl --system'
