  fix: Configure RHEL 9 to not allow users to execute privileged actions without authenticating with a password. Remove any
    occurrence of "NOPASSWD" found in "/etc/sudoers" file or files in the "/etc/sudoers.d" directory. $ sudo find /etc/sudoers
    /etc/sudoers.d -type f -exec sed -i '/NOPASSWD/ s/^/# /g' {} \;
