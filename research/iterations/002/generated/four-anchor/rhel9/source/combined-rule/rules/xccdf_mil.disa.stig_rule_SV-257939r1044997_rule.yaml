rule:
  id: xccdf_mil.disa.stig_rule_SV-257939r1044997_rule
  title: RHEL 9 must protect against or limit the effects of denial-of-service (DoS) attacks by ensuring rate-limiting measures
    on impacted network interfaces are implemented.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-257939
  description: <VulnDiscussion>DoS is a condition when a resource is not available for legitimate users. When this occurs,
    the organization either cannot accomplish its mission or must operate at degraded capacity. This requirement addresses
    the configuration of RHEL 9 to mitigate the impact of DoS attacks that have occurred or are ongoing on system availability.
    For each system, known and potential DoS attacks must be identified and solutions for each type implemented. A variety
    of technologies exists to limit or, in some cases, eliminate the effects of DoS attacks (e.g., limiting processes or establishing
    memory partitions). Employing increased capacity and bandwidth, combined with service redundancy, may reduce the susceptibility
    to some DoS attacks.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
