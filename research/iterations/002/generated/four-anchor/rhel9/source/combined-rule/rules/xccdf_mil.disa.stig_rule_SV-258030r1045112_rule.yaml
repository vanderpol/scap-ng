  fix: 'Configure RHEL 9 to prevent a user from overriding the disable-restart-buttons setting for graphical user interfaces.
    Create a database to contain the systemwide graphical user logon settings (if it does not already exist) with the following
    command: $ sudo touch /etc/dconf/db/local.d/locks/session Add the following line to prevent nonprivileged users from modifying
    it: /org/gnome/login-screen/disable-restart-buttons Run the following command to update the database: $ sudo dconf update'
