rule:
  id: xccdf_mil.disa.stig_rule_SV-258038r1045128_rule
  title: RHEL 9 must block unauthorized peripherals before establishing a connection.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
