rule:
  id: xccdf_mil.disa.stig_rule_SV-257881r1184299_rule
  title: RHEL 9 must prevent special devices on non-root local partitions.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
