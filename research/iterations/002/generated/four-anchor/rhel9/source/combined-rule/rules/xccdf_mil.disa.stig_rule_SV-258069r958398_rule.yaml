rule:
  id: xccdf_mil.disa.stig_rule_SV-258069r958398_rule
  title: RHEL 9 must limit the number of concurrent sessions to ten for all accounts and/or account types.
  severity: low
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
