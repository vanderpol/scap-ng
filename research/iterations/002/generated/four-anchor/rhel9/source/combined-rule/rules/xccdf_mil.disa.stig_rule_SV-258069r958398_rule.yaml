              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: RHEL-09-412040 - RHEL 9 must limit the number of concurrent sessions to ten for all accounts and/or account
                types.
            - attributes:
                family: unix
              children:
              - name: platform
                namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
                text: Red Hat Enterprise Linux 9
              name: affected
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: 'Operating system management includes the ability to control the number of users and user sessions that
                utilize an operating system. Limiting the number of allowed users and sessions per user is helpful in reducing
                the risks related to denial-of-service (DoS) attacks.


                This requirement addresses concurrent sessions for information system accounts and does not address concurrent
                sessions by single users via multiple system accounts. The maximum number of concurrent sessions must be defined
                based on mission needs and the operational environment for each system.'
            name: metadata
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
