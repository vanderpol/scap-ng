  check: 'Verify RHEL 9 is configured to ignore the Ctrl-Alt-Del sequence in the GNOME desktop with the following command:
    Note: This requirement assumes the use of the RHEL 9 default graphical user interface, the GNOME desktop environment.
    If the system does not have any graphical user interface installed, this requirement is not applicable. $ gsettings get
    org.gnome.settings-daemon.plugins.media-keys logout [''''] If the GNOME desktop is configured to shut down when Ctrl-Alt-Del
    is pressed, this is a finding.'
