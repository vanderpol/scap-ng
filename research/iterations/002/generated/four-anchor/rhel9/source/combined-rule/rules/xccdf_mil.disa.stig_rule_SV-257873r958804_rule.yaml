  description: <VulnDiscussion>The "nodev" mount option causes the system to not interpret character or block special devices.
    Executing character or block special devices from untrusted file systems increases the opportunity for nonprivileged users
    to attain unauthorized administrative access. The only legitimate location for device files is the "/dev" directory located
    on the root partition, with the exception of chroot jails if implemented.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
