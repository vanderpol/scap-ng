              text: RHEL-09-255035 - RHEL 9 SSHD must accept public key authentication.
            - attributes:
                family: unix
              children:
              - name: platform
                namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
                text: Red Hat Enterprise Linux 9
              name: affected
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: 'Without the use of multifactor authentication, the ease of access to privileged functions is greatly
                increased. Multifactor authentication requires using two or more factors to achieve authentication. A privileged
                account is defined as an information system account with authorizations of a privileged user. A DOD CAC with
                DOD-approved PKI is an example of multifactor authentication.


                Satisfies: SRG-OS-000105-GPOS-00052, SRG-OS-000106-GPOS-00053, SRG-OS-000107-GPOS-00054, SRG-OS-000108-GPOS-00055'
            name: metadata
