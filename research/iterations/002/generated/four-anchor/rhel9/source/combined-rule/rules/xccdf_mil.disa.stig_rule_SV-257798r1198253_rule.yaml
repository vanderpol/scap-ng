  fix: 'Configure RHEL 9 to prevent kernel profiling by nonprivileged users. Create a drop-in if it does not already exist:
    $ sudo vi /etc/sysctl.d/99-kernel_perf_event_paranoid.conf Add the following to the file: kernel.perf_event_paranoid =
    2 Reload settings from all system configuration files with the following command: $ sudo sysctl --system'
