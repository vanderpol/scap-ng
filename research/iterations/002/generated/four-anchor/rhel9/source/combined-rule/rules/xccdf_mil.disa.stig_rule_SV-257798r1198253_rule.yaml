      text: '<VulnDiscussion>Preventing unauthorized information transfers mitigates the risk of information, including encrypted
        representations of information, produced by the actions of prior users/roles (or the actions of processes acting on
        behalf of prior users/roles) from being available to any current users/roles (or current processes) that obtain access
        to shared system resources (e.g., registers, main memory, hard disks) after those resources have been released back
        to information systems. The control of information in shared resources is also commonly referred to as object reuse
        and residual information protection.


        This requirement generally applies to the design of an information technology product, but it can also apply to the
        configuration of particular information system components that are, or use, such products. This can be verified by
        acceptance/validation processes in DOD or other government agencies.


        There may be shared resources with configurable protections (e.g., files in storage) that may be assessed on specific
        information system components.


        Setting the kernel.perf_event_paranoid kernel parameter to "2" prevents attackers from gaining additional system information
        as a nonprivileged user.


        The sysctl --system command will load settings from all system configuration files. All configuration files are sorted
        by their filename in lexicographical order, regardless of the directories in which they reside. If multiple files
        specify the same option, the entry in the file with the lexicographically latest name will take precedence. Files
        are read from directories in the following list from top to bottom. Once a file of a given filename is loaded, any
        file of the same name in subsequent directories is ignored.


        /etc/sysctl.d/*.conf

        /run/sysctl.d/*.conf

        /usr/local/lib/sysctl.d/*.conf

        /usr/lib/sysctl.d/*.conf

        /lib/sysctl.d/*.conf

        /etc/sysctl.conf


        Satisfies: SRG-OS-000132-GPOS-00067, SRG-OS-000138-GPOS-00069</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
