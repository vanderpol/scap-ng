        exports: []
        inline_content: 'Note: This requirement assumes the use of the RHEL 9 default graphical user interface, Gnome Shell.
          If the system does not have any graphical user interface installed, this requirement is Not Applicable. Verify RHEL
          9 disables a user''s ability to restart the system with the following command: $ gsettings get org.gnome.login-screen
          disable-restart-buttons true If "disable-restart-buttons" is "false", this is a finding.'
