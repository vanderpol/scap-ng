rule:
  id: xccdf_mil.disa.stig_rule_SV-258102r1045207_rule
  title: RHEL 9 must enforce password complexity by requiring that at least one lowercase character be used.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
