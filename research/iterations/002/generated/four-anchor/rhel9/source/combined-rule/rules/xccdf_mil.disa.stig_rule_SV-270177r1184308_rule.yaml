                namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
                text: Red Hat Enterprise Linux 9
              name: affected
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: "Without cryptographic integrity protections, information can be altered by unauthorized users without\
                \ detection. \n\nRemote access (e.g., RDP) is access to DOD nonpublic information systems by an authorized\
                \ user (or an information system) communicating through an external, nonorganization-controlled network. Remote\
                \ access methods include, for example, dial-up, broadband, and wireless. \n\nCryptographic mechanisms used\
                \ for protecting the integrity of information include, for example, signed hash functions using asymmetric\
                \ cryptography, enabling distribution of the public key to verify the hash information while maintaining the\
                \ confidentiality of the secret key used to generate the hash. \n\nRHEL 9 incorporates systemwide crypto policies\
                \ by default. The SSH configuration file has no effect on the ciphers, MACs, or algorithms unless specifically\
                \ defined in the /etc/sysconfig/sshd file. The employed algorithms can be viewed in the /etc/crypto-policies/back-ends/openssh.config\
                \ file."
            name: metadata
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
