rule:
  id: xccdf_mil.disa.stig_rule_SV-270177r1184308_rule
  title: The RHEL 9 SSH client must be configured to use only DOD-approved encryption ciphers employing FIPS 140-3 validated
    cryptographic hash algorithms to protect the confidentiality of SSH client connections.
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
