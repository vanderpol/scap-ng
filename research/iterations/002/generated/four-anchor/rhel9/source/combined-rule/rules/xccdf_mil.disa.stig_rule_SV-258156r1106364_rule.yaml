    audit record storage capacity with the following command: $ sudo grep -w space_left /etc/audit/auditd.conf space_left
    = 25% If the value of the "space_left" keyword is not set to 25 percent or greater of the storage volume allocated to
    audit logs, or if the line is commented out, ask the system administrator (SA) to indicate how the system is providing
