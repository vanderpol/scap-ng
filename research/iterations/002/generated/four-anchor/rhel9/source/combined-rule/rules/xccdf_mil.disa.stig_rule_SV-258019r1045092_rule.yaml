      text: '<VulnDiscussion>A session lock is a temporary action taken when a user stops work and moves away from the immediate
        physical vicinity of the information system but does not want to log out because of the temporary nature of the absence.


        The session lock is implemented at the point where session activity can be determined. Rather than be forced to wait
        for a period of time to expire before the user session can be locked, RHEL 9 needs to provide users with the ability
        to manually invoke a session lock so users can secure their session if it is necessary to temporarily vacate the immediate
        physical vicinity.


        Satisfies: SRG-OS-000028-GPOS-00009, SRG-OS-000030-GPOS-00011</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
