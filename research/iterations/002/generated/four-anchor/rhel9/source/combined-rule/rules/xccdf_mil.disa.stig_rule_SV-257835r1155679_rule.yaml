  group_path:
  - xccdf_mil.disa.stig_group_V-257835
  description: <VulnDiscussion>Removing the "tftp-server" package decreases the risk of the accidental (or intentional) activation
    of tftp services. If TFTP is required for operational support (such as transmission of router configurations), its use
    must be documented with the information systems security manager (ISSM), restricted to only authorized personnel, and
    have access control rules established. Restricting TFTP to a specific directory prevents remote users from copying, transferring,
    or overwriting system files.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
