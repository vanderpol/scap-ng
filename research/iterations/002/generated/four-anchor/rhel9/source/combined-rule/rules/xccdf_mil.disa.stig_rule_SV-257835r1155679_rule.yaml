  fix: 'Configure RHEL 9 so that TFTP operates in secure mode if installed. If TFTP server is not required, remove it with
    the following command: $ sudo dnf -y remove tftp-server Configure the TFTP daemon to operate in secure mode with the following
    command: $ sudo systemctl edit tftp.service In the editor, enter: [Service] ExecStart=/usr/sbin/in.tftpd -s /var/lib/tftpboot
    After making changes, reload the systemd daemon and restart the TFTP service as follows: $ sudo systemctl daemon-reload
    $ sudo systemctl restart tftp.service If the "-s" option is not present in the "ExecStart" line or if the line is missing,
    this is a finding.'
