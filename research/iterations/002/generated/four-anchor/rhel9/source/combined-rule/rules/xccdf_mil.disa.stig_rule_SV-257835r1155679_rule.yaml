rule:
  id: xccdf_mil.disa.stig_rule_SV-257835r1155679_rule
  title: The Trivial File Transfer Protocol (TFTP) server must not be installed unless it is required, and if required, the
    RHEL 9 TFTP daemon must be configured to operate in secure mode.
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
