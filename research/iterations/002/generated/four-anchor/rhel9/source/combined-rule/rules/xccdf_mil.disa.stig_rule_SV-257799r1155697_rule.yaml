rule:
  id: xccdf_mil.disa.stig_rule_SV-257799r1155697_rule
  title: RHEL 9 must prevent the loading of a new kernel for later execution.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
