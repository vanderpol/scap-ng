rule:
  id: xccdf_mil.disa.stig_rule_SV-258035r1045125_rule
  title: RHEL 9 must have the USBGuard package installed.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
