  check: 'Verify "/home" is mounted with the "nodev" option with the following command: Note: If a separate file system has
    not been created for the user home directories (user home directories are mounted under "/"), this is automatically a
    finding, as the "nodev" option cannot be used on the "/" system. $ mount | grep /home tmpfs on /home type xfs (rw,nodev,nosuid,noexec,seclabel)
    If the "/home" file system is mounted without the "nodev" option, this is a finding.'
