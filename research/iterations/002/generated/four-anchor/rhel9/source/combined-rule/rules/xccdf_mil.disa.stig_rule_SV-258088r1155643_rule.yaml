  fix: 'Configure RHEL 9 to require users to be in the "wheel" group to run "su" command. In file "/etc/pam.d/su", uncomment
    the following line: "#auth required pam_wheel.so use_uid" $ sed ''/^[[:space:]]*#[[:space:]]*auth[[:space:]]\+required[[:space:]]\+pam_wheel\.so[[:space:]]\+use_uid$/s/^[[:space:]]*#//''
    -i /etc/pam.d/su If necessary, create a "wheel" group and add administrative users to the group.'
