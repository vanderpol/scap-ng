  description: '<VulnDiscussion>Kerberos authentication for SSH is often implemented using Generic Security Service Application
    Program Interface (GSSAPI). If Kerberos is enabled through SSH, the SSH daemon provides a means of access to the system''s
    Kerberos implementation. Vulnerabilities in the system''s Kerberos implementations may be subject to exploitation. Satisfies:
    SRG-OS-000364-GPOS-00151, SRG-OS-000480-GPOS-00227</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
