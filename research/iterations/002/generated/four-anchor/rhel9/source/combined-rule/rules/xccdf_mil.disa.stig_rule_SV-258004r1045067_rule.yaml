              text: RHEL-09-255140 - RHEL 9 SSH daemon must not allow Kerberos authentication.
            - attributes:
                family: unix
              children:
              - name: platform
                namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
                text: Red Hat Enterprise Linux 9
              name: affected
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: 'Kerberos authentication for SSH is often implemented using Generic Security Service Application Program
                Interface (GSSAPI). If Kerberos is enabled through SSH, the SSH daemon provides a means of access to the system''s
                Kerberos implementation. Vulnerabilities in the system''s Kerberos implementations may be subject to exploitation.


                Satisfies: SRG-OS-000364-GPOS-00151, SRG-OS-000480-GPOS-00227'
            name: metadata
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
