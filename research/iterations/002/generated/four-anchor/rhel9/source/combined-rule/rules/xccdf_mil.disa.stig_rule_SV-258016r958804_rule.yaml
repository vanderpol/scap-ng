  fix: 'Configure the GNOME desktop to disable the autorun function on removable media. The dconf settings can be edited in
    the /etc/dconf/db/* location. Update the [org/gnome/desktop/media-handling] section of the "/etc/dconf/db/local.d/00-security-settings"
    database file and add or update the following lines: [org/gnome/desktop/media-handling] autorun-never=true Then update
    the dconf system databases: $ sudo dconf update'
