  fix: 'Configure RHEL 9 to disable storing core dumps. Create a drop-in if it does not already exist: $ sudo vi /etc/sysctl.d/99-kernel_core_pattern.conf
    Add the following to the file: kernel.core_pattern = |/bin/false Reload settings from all system configuration files with
    the following command: $ sudo sysctl --system'
