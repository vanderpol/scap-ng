  fix: 'Change the group of the directory of "/var/log/audit" to be owned by a correct group. Identify the group that is configured
    to own audit log: $ sudo grep -P ''^[ ]*log_group[ ]+=.*$'' /etc/audit/auditd.conf Change the ownership to that group:
    $ sudo chgrp ${GROUP} /var/log/audit'
