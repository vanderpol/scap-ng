          name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:73101
        exports: []
        inline_content: 'Verify the audit logs are group-owned by "root" or a restricted logging group. First determine if
          a group other than "root" has been assigned to the audit logs with the following command: $ sudo grep log_group
          /etc/audit/auditd.conf Then determine where the audit logs are stored with the following command: $ sudo grep -iw
          log_file /etc/audit/auditd.conf log_file = /var/log/audit/audit.log Then using the location of the audit log file,
          determine if the audit log is group-owned by "root" using the following command: $ sudo stat -c "%G %n" /var/log/audit/audit.log
          root /var/log/audit/audit.log If the audit log is not group-owned by "root" or the configured alternative logging
          group, this is a finding.'
        multi_check: null
        negate: null
        selector: manual
        source_tree:
          attributes:
            selector: manual
            system: http://scap.nist.gov/schema/ocil/2
          children:
          - attributes:
              href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
              name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:73101
            name: check-content-ref
            namespace: http://checklists.nist.gov/xccdf/1.2
          - name: check-content
            namespace: http://checklists.nist.gov/xccdf/1.2
            text: "Verify the audit logs are group-owned by \"root\" or a restricted logging group. \n\nFirst determine if\
              \ a group other than \"root\" has been assigned to the audit logs with the following command:\n\n$ sudo grep\
              \ log_group /etc/audit/auditd.conf\n\nThen determine where the audit logs are stored with the following command:\n\
              \n$ sudo grep -iw log_file /etc/audit/auditd.conf\n\nlog_file = /var/log/audit/audit.log\n\nThen using the location\
              \ of the audit log file, determine if the audit log is group-owned by \"root\" using the following command:\n\
              \n$ sudo stat -c \"%G %n\" /var/log/audit/audit.log\n\nroot /var/log/audit/audit.log\n\nIf the audit log is\
              \ not group-owned by \"root\" or the configured alternative logging group, this is a finding."
          name: check
          namespace: http://checklists.nist.gov/xccdf/1.2
        system: http://scap.nist.gov/schema/ocil/2
