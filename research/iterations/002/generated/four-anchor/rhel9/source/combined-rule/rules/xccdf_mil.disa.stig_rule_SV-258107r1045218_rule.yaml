rule:
  id: xccdf_mil.disa.stig_rule_SV-258107r1045218_rule
  title: RHEL 9 passwords must be created with a minimum of 15 characters.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-258107
  description: <VulnDiscussion>The shorter the password, the lower the number of possible combinations that need to be tested
    before the password is compromised. Password complexity, or strength, is a measure of the effectiveness of a password
    in resisting attempts at guessing and brute-force attacks. Password length is one factor of several that helps to determine
    strength and how long it takes to crack a password. Use of more characters in a password helps to increase exponentially
    the time and/or resources required to compromise the password. RHEL 9 uses "pwquality" as a mechanism to enforce password
    complexity. Configurations are set in the "etc/security/pwquality.conf" file. The "minlen", sometimes noted as minimum
    length, acts as a "score" of complexity based on the credit components of the "pwquality" module. By setting the credit
    components to a negative value, not only will those components be required, but they will not count toward the total "score"
    of "minlen". This will enable "minlen" to require a 15-character minimum. The DOD minimum password requirement is 15 characters.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
