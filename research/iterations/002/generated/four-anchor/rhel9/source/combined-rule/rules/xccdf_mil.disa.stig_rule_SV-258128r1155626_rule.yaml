rule:
  id: xccdf_mil.disa.stig_rule_SV-258128r1155626_rule
  title: RHEL 9 must require authentication to access emergency mode.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
