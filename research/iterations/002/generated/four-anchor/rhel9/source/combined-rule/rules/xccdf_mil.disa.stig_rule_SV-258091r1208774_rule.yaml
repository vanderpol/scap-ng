rule:
  id: xccdf_mil.disa.stig_rule_SV-258091r1208774_rule
  title: RHEL 9 must ensure the password complexity module in the system-auth file is configured for three retries or less.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
