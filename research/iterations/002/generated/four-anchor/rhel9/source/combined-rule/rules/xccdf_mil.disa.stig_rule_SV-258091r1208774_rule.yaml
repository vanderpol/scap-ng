  group_path:
  - xccdf_mil.disa.stig_group_V-258091
  description: <VulnDiscussion>Use of a complex password helps to increase the time and resources required to compromise the
    password. Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing
    and brute-force attacks. "pwquality" enforces complex password construction configuration and has the ability to limit
    brute-force attacks on the system. By limiting the number of attempts to meet the pwquality module complexity requirements
    before returning with an error, the system will audit abnormal attempts at password changes.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
