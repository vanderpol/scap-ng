rule:
  id: xccdf_mil.disa.stig_rule_SV-258078r958944_rule
  title: RHEL 9 must use a Linux Security Module configured to enforce limits on system services.
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
