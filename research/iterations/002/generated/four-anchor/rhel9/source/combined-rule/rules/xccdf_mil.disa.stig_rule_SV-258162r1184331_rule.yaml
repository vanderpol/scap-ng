  check: 'Verify that RHEL 9 audit system is configured to take an appropriate action when the internal event queue is full:
    $ sudo grep -i overflow_action /etc/audit/auditd.conf overflow_action = syslog If the value of the "overflow_action" option
    is not set to "syslog", "single", "halt" or the line is commented out, ask the system administrator (SA) to indicate how
    the audit logs are offloaded to a different system or media. If there is no evidence that the audit system is configured
    to off-load the audit logs to another system or media and if the overflow action is not set to take appropriate action
    if the internal event queue becomes full, this is a finding.'
