rule:
  id: xccdf_mil.disa.stig_rule_SV-257793r1044843_rule
  title: RHEL 9 must clear the page allocator to prevent use-after-free attacks.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
