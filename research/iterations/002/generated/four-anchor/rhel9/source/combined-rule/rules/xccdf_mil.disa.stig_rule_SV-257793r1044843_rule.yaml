  group_path:
  - xccdf_mil.disa.stig_group_V-257793
  description: '<VulnDiscussion>Poisoning writes an arbitrary value to freed pages, so any modification or reference to that
    page after being freed or before being initialized will be detected and prevented. This prevents many types of use-after-free
    vulnerabilities at little performance cost. Also prevents leak of data and detection of corrupted memory. Satisfies: SRG-OS-000480-GPOS-00227,
    SRG-OS-000134-GPOS-00068</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
