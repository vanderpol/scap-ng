              text: RHEL-09-212040 - RHEL 9 must clear the page allocator to prevent use-after-free attacks.
            - attributes:
                family: unix
              children:
              - name: platform
                namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
                text: Red Hat Enterprise Linux 9
              name: affected
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: 'Poisoning writes an arbitrary value to freed pages, so any modification or reference to that page after
                being freed or before being initialized will be detected and prevented. This prevents many types of use-after-free
                vulnerabilities at little performance cost. Also prevents leak of data and detection of corrupted memory.


                Satisfies: SRG-OS-000480-GPOS-00227, SRG-OS-000134-GPOS-00068'
            name: metadata
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
