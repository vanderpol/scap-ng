rule:
  id: xccdf_mil.disa.stig_rule_SV-257851r1044932_rule
  title: RHEL 9 must prevent files with the setuid and setgid bit set from being executed on file systems that contain user
    home directories.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
