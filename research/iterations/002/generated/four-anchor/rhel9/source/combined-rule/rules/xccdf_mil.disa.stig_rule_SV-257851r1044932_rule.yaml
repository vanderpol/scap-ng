          name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:14701
        exports: []
        inline_content: 'Verify "/home" is mounted with the "nosuid" option with the following command: Note: If a separate
          file system has not been created for the user home directories (user home directories are mounted under "/"), this
          is automatically a finding, as the "nosuid" option cannot be used on the "/" system. $ mount | grep /home tmpfs
          on /home type xfs (rw,nodev,nosuid,noexec,seclabel) If the "/home" file system is mounted without the "nosuid" option,
          this is a finding.'
        multi_check: null
        negate: null
        selector: manual
        source_tree:
          attributes:
            selector: manual
            system: http://scap.nist.gov/schema/ocil/2
          children:
