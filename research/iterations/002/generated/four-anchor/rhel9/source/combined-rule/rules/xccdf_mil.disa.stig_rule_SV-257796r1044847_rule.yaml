rule:
  id: xccdf_mil.disa.stig_rule_SV-257796r1044847_rule
  title: RHEL 9 must enable auditing of processes that start prior to the audit daemon.
  severity: low
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
