  description: '<VulnDiscussion>Without the capability to generate audit records, it would be difficult to establish, correlate,
    and investigate the events relating to an incident or identify those responsible for one. If auditing is enabled late
    in the startup process, the actions of some startup processes may not be audited. Some audit systems also maintain state
    information only available if auditing is enabled before a given process is created. Satisfies: SRG-OS-000037-GPOS-00015,
    SRG-OS-000042-GPOS-00020, SRG-OS-000062-GPOS-00031, SRG-OS-000392-GPOS-00172, SRG-OS-000462-GPOS-00206, SRG-OS-000471-GPOS-00215,
    SRG-OS-000473-GPOS-00218, SRG-OS-000254-GPOS-00095</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
