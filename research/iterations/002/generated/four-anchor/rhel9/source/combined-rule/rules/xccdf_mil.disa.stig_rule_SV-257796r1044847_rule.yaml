  check: 'Verify that GRUB 2 is configured to enable auditing of processes that start prior to the audit daemon with the following
    commands: Check that the current GRUB 2 configuration enables auditing: $ sudo grubby --info=ALL | grep args | grep -v
    ''audit=1'' If any output is returned, this is a finding. Check that auditing is enabled by default to persist in kernel
    updates: $ grep audit /etc/default/grub GRUB_CMDLINE_LINUX="audit=1" If "audit" is not set to "1", is missing, or is commented
    out, this is a finding.'
