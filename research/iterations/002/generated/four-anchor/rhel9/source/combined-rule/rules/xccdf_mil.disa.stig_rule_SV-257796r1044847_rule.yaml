              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: RHEL-09-212055 - RHEL 9 must enable auditing of processes that start prior to the audit daemon.
            - attributes:
                family: unix
              children:
              - name: platform
                namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
                text: Red Hat Enterprise Linux 9
              name: affected
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: 'Without the capability to generate audit records, it would be difficult to establish, correlate, and
                investigate the events relating to an incident or identify those responsible for one.


                If auditing is enabled late in the startup process, the actions of some startup processes may not be audited.
                Some audit systems also maintain state information only available if auditing is enabled before a given process
                is created.


                Satisfies: SRG-OS-000037-GPOS-00015, SRG-OS-000042-GPOS-00020, SRG-OS-000062-GPOS-00031, SRG-OS-000392-GPOS-00172,
                SRG-OS-000462-GPOS-00206, SRG-OS-000471-GPOS-00215, SRG-OS-000473-GPOS-00218, SRG-OS-000254-GPOS-00095'
            name: metadata
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
