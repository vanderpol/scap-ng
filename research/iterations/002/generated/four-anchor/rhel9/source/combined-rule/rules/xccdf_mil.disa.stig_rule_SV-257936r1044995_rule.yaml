rule:
  id: xccdf_mil.disa.stig_rule_SV-257936r1044995_rule
  title: The firewalld service on RHEL 9 must be active.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
