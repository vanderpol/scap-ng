rule:
  id: xccdf_mil.disa.stig_rule_SV-257787r1184288_rule
  title: RHEL 9 must require a boot loader superuser password.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-257787
  description: <VulnDiscussion>To mitigate the risk of unauthorized access to sensitive information by entities that have
    been issued certificates by DOD-approved PKIs, all DOD systems (e.g., web servers and web portals) must be properly configured
    to incorporate access control methods that do not rely solely on the possession of a certificate for access. Successful
    authentication must not automatically give an entity access to an asset or security boundary. Authorization procedures
    and controls must be implemented to ensure each authenticated entity also has a validated and current authorization. Authorization
    is the process of determining whether an entity, once authenticated, is permitted to access a specific asset. Information
    systems use access control policies and enforcement mechanisms to implement this requirement. Password protection on the
    boot loader configuration ensures users with physical access cannot trivially alter important bootloader settings. These
    include which kernel to use, and whether to enter single-user mode.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
