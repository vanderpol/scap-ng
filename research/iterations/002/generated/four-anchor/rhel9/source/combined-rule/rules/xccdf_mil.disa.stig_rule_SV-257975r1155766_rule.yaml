rule:
  id: xccdf_mil.disa.stig_rule_SV-257975r1155766_rule
  title: RHEL 9 must not accept router advertisements on all IPv6 interfaces by default.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-257975
  description: <VulnDiscussion>Routing protocol daemons are typically used on routers to exchange network topology information
    with other routers. If this software is used when not required, system network information may be unnecessarily transmitted
    across the network. An illicit router advertisement message could result in a man-in-the-middle attack. The sysctl --system
    command will load settings from all system configuration files. All configuration files are sorted by their filename in
    lexicographical order, regardless of the directories in which they reside. If multiple files specify the same option,
    the entry in the file with the lexicographically latest name will take precedence. Files are read from directories in
    the following list from top to bottom. Once a file of a given filename is loaded, any file of the same name in subsequent
    directories is ignored. /etc/sysctl.d/*.conf /run/sysctl.d/*.conf /usr/local/lib/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf
    /lib/sysctl.d/*.conf /etc/sysctl.conf</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
