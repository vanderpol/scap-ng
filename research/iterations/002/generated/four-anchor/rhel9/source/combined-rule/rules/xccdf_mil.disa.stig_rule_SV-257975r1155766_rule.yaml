  fix: 'Configure RHEL 9 to not accept router advertisements on all IPv6 interfaces by default unless the system is a router.
    Create a configuration file if it does not already exist: $ sudo vi /etc/sysctl.d/ipv6_accept_ra.conf Add the following
    line to the file: net.ipv6.conf.default.accept_ra = 0 Reload settings from all system configuration files with the following
    command: $ sudo sysctl --system'
