              text: RHEL-09-411015 - RHEL 9 user account passwords must have a 60-day maximum password lifetime restriction.
            - attributes:
                family: unix
              children:
              - name: platform
                namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
                text: Red Hat Enterprise Linux 9
              name: affected
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Any password, no matter how complex, can eventually be cracked; therefore, passwords need to be changed
                periodically. If RHEL 9 does not limit the lifetime of passwords and force users to change their passwords,
                there is the risk that RHEL 9 passwords could be compromised.
            name: metadata
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
