                by default on the latest Red Hat and Fedora systems if supported by the hardware.


                Checking dmesg will return a false-positive if the system has generated enough kernel messages that the "(Execute
                Disable) protection: active" line is no longer present in the output from dmesg(1). A better way to ensure
                that ExecShield is enabled is to first ensure all processors support the NX feature, and then to check that
                noexec was not passed to the kernel command line.'
            name: metadata
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
