              text: RHEL-09-432015 - RHEL 9 must require reauthentication when using the "sudo" command.
            - attributes:
                family: unix
              children:
              - name: platform
                namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
                text: Red Hat Enterprise Linux 9
              name: affected
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: "Without reauthentication, users may access resources or perform tasks for which they do not have authorization.\
                \ \n\nWhen operating systems provide the capability to escalate a functional capability, it is critical the\
                \ organization requires the user to reauthenticate when using the \"sudo\" command.\n\nIf the value is set\
                \ to an integer less than \"0\", the user's time stamp will not expire and the user will not have to reauthenticate\
                \ for privileged actions until the user's session is terminated."
            name: metadata
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
