  check: 'Verify RHEL 9 encrypts audit records offloaded onto a different system or media from the system being audited via
    rsyslog with the following command: $ grep -i ''StreamDriver[\.]*Mode'' /etc/rsyslog.conf /etc/rsyslog.d/*.conf /etc/rsyslog.conf:$ActionSendStreamDriverMode
    1 If the value of the "$ActionSendStreamDriverMode or StreamDriver.Mode" option is not set to "1" or the line is commented
    out, this is a finding. If the variable name "StreamDriverAuthMode" is present in an omfwd statement block, this is not
    a finding. However, if the "StreamDriverAuthMode" variable is in a module block, this is a finding.'
