rule:
  id: xccdf_mil.disa.stig_rule_SV-258147r1045290_rule
  title: RHEL 9 must encrypt the transfer of audit records offloaded onto a different system or media from the system being
    audited via rsyslog.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
