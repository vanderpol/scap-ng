          metadata:
            children:
            - name: title
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: RHEL-09-652045 - RHEL 9 must encrypt the transfer of audit records offloaded onto a different system or
                media from the system being audited via rsyslog.
            - attributes:
                family: unix
              children:
              - name: platform
                namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
                text: Red Hat Enterprise Linux 9
              name: affected
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: 'Information stored in one location is vulnerable to accidental or incidental deletion or alteration.


                Offloading is a common process in information systems with limited audit storage capacity.


                RHEL 9 installation media provides "rsyslogd", a system utility providing support for message logging. Support
                for both internet and Unix domain sockets enables this utility to support both local and remote logging. Coupling
                this utility with "gnutls" (a secure communications library implementing the SSL, TLS and DTLS protocols)
                creates a method to securely encrypt and offload auditing.


                "Rsyslog" supported authentication modes include:

                anon - anonymous authentication

                x509/fingerprint - certificate fingerprint authentication

                x509/certvalid - certificate validation only

                x509/name - certificate validation and subject name authentication


                Satisfies: SRG-OS-000342-GPOS-00133, SRG-OS-000479-GPOS-00224'
            name: metadata
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
