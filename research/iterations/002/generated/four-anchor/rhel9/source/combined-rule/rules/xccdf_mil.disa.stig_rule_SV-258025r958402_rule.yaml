  fix: 'Configure RHEL 9 to initiate a session lock for graphical user interfaces when a screensaver is activated. Create
    a database to contain the system-wide screensaver settings (if it does not already exist) with the following command:
    Note: The example below is using the database "local" for the system, so if the system is using another database in "/etc/dconf/profile/user",
    the file should be created under the appropriate subdirectory. $ sudo touch /etc/dconf/db/local.d/00-screensaver [org/gnome/desktop/screensaver]
    lock-delay=uint32 5 The "uint32" must be included along with the integer key values as shown. Update the system databases:
    $ sudo dconf update'
