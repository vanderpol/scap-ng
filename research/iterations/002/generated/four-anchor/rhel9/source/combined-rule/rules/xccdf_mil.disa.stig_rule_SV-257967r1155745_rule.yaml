      text: '<VulnDiscussion>Some routers will send responses to broadcast frames that violate RFC-1122, which fills up a
        log file system with many useless error messages. An attacker may take advantage of this and attempt to flood the
        logs with bogus error logs. Ignoring bogus ICMP error responses reduces log size, although some activity would not
        be logged.


        The sysctl --system command will load settings from all system configuration files. All configuration files are sorted
