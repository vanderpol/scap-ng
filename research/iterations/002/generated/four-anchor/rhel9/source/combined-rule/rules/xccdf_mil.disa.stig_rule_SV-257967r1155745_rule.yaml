  group_path:
  - xccdf_mil.disa.stig_group_V-257967
  description: <VulnDiscussion>Some routers will send responses to broadcast frames that violate RFC-1122, which fills up
    a log file system with many useless error messages. An attacker may take advantage of this and attempt to flood the logs
    with bogus error logs. Ignoring bogus ICMP error responses reduces log size, although some activity would not be logged.
    The sysctl --system command will load settings from all system configuration files. All configuration files are sorted
    by their filename in lexicographical order, regardless of the directories in which they reside. If multiple files specify
    the same option, the entry in the file with the lexicographically latest name will take precedence. Files are read from
    directories in the following list from top to bottom. Once a file of a given filename is loaded, any file of the same
    name in subsequent directories is ignored. /etc/sysctl.d/*.conf /run/sysctl.d/*.conf /usr/local/lib/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf
    /lib/sysctl.d/*.conf /etc/sysctl.conf</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
