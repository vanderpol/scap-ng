rule:
  id: xccdf_mil.disa.stig_rule_SV-257967r1155745_rule
  title: RHEL 9 must limit the number of bogus Internet Control Message Protocol (ICMP) response errors logs.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
