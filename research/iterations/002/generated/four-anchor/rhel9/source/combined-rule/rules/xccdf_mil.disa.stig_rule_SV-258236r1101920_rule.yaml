            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: 'Centralized cryptographic policies simplify applying secure ciphers across an operating system and the
                applications that run on that operating system. Use of weak or untested encryption algorithms undermines the
                purposes of utilizing encryption to protect data.


