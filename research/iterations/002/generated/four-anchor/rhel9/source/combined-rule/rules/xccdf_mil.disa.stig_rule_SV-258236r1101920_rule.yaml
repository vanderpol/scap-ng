    - attributes:
        fixref: F-61901r1051252_fix
      name: fixtext
      namespace: http://checklists.nist.gov/xccdf/1.2
      text: 'Configure RHEL 9 to correctly implement the systemwide cryptographic policies by reinstalling the crypto-policies
        package contents.


        Reinstall crypto-policies with the following command:


        $ sudo dnf -y reinstall crypto-policies


        Set the crypto-policy to FIPS with the following command:


        $ sudo update-crypto-policies --set FIPS


        Setting system policy to FIPS


        Note: Systemwide crypto policies are applied on application startup. It is recommended to restart the system for the
        change of policies to fully take place.'
