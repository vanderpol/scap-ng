          name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:86701
        name: check-content-ref
        namespace: http://checklists.nist.gov/xccdf/1.2
      - name: check-content
        namespace: http://checklists.nist.gov/xccdf/1.2
        text: "Verify that RHEL 9 cryptographic policies are not overridden.\n\nVerify that the configured policy matches\
          \ the generated policy with the following command:\n\n$ sudo update-crypto-policies --check\n\nThe configured policy\
          \ matches the generated policy\n\nIf the returned message does not match the above, but instead matches the following,\
          \ this is a finding:\n\nThe configured policy does NOT match the generated policy\n\nList all of the crypto backends\
          \ configured on the system with the following command:\n\n$ ls -l /etc/crypto-policies/back-ends/ \n\nlrwxrwxrwx.\
          \ 1 root root  40 Nov 13 16:29 bind.config -> /usr/share/crypto-policies/FIPS/bind.txt\nlrwxrwxrwx. 1 root root\
          \  42 Nov 13 16:29 gnutls.config -> /usr/share/crypto-policies/FIPS/gnutls.txt\nlrwxrwxrwx. 1 root root  40 Nov\
          \ 13 16:29 java.config -> /usr/share/crypto-policies/FIPS/java.txt\nlrwxrwxrwx. 1 root root  46 Nov 13 16:29 javasystem.config\
          \ -> /usr/share/crypto-policies/FIPS/javasystem.txt\nlrwxrwxrwx. 1 root root  40 Nov 13 16:29 krb5.config -> /usr/share/crypto-policies/FIPS/krb5.txt\n\
          lrwxrwxrwx. 1 root root  45 Nov 13 16:29 libreswan.config -> /usr/share/crypto-policies/FIPS/libreswan.txt\nlrwxrwxrwx.\
          \ 1 root root  42 Nov 13 16:29 libssh.config -> /usr/share/crypto-policies/FIPS/libssh.txt\n-rw-r--r--. 1 root root\
          \ 398 Nov 13 16:29 nss.config\nlrwxrwxrwx. 1 root root  43 Nov 13 16:29 openssh.config -> /usr/share/crypto-policies/FIPS/openssh.txt\n\
          lrwxrwxrwx. 1 root root  49 Nov 13 16:29 opensshserver.config -> /usr/share/crypto-policies/FIPS/opensshserver.txt\n\
          lrwxrwxrwx. 1 root root  46 Nov 13 16:29 opensslcnf.config -> /usr/share/crypto-policies/FIPS/opensslcnf.txt\nlrwxrwxrwx.\
          \ 1 root root  43 Nov 13 16:29 openssl.config -> /usr/share/crypto-policies/FIPS/openssl.txt\nlrwxrwxrwx. 1 root\
          \ root  48 Nov 13 16:29 openssl_fips.config -> /usr/share/crypto-policies/FIPS/openssl_fips.txt\n\nIf the paths\
          \ do not point to the respective files under /usr/share/crypto-policies/FIPS path, this is a finding.\n\nNote: nss.config\
          \ should not be symlinked.\n\nNote: If there is an operational need to use a subpolicy that causes the links to\
          \ the crypto backends to break, this is a finding, and exceptions will need to be made by the authorizing official\
          \ (AO) and documented with the information system security officer (ISSO)."
      name: check
      namespace: http://checklists.nist.gov/xccdf/1.2
