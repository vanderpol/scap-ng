  fix: 'Configure RHEL 9 so that all noninteractive accounts on the system do not have an interactive shell assigned to them.
    If the system account needs a shell assigned for mission operations, document the need with the information system security
    officer (ISSO). Run the following command to disable the interactive shell for a specific noninteractive user account:
    Replace <user> with the user that has a login shell. $ sudo usermod --shell /sbin/nologin <user> Do not perform the steps
    in this section on the root account. Doing so will cause the system to become inaccessible.'
