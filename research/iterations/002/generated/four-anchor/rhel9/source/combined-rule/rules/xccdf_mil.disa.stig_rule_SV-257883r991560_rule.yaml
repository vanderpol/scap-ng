  fix: Configure the system-wide shared library directories (/lib, /lib64, /usr/lib and /usr/lib64) to be protected from unauthorized
    access. Run the following command, replacing "[DIRECTORY]" with any library directory with a mode more permissive than
    755. $ sudo chmod 755 [DIRECTORY]
