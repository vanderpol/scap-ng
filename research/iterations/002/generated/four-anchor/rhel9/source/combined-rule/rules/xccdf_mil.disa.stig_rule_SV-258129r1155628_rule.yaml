rule:
  id: xccdf_mil.disa.stig_rule_SV-258129r1155628_rule
  title: RHEL 9 must require authentication to access single-user mode.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
