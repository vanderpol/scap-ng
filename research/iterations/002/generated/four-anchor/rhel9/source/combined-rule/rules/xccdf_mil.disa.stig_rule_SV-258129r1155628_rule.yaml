  check: 'Verify RHEL 9 requires authentication for single-user mode with the following command: $ grep sulogin /usr/lib/systemd/system/rescue.service
    ExecStart=-/usr/lib/systemd/systemd-sulogin-shell rescue If the line is not returned from the default systemd file, use
    the following command to look for modifications to the rescue.service: $ grep sulogin /etc/systemd/system/rescue.service.d/*.conf
    If the line is not returned from either location this is a finding. Note: The configuration setting can only be in either
    the default location, or in the drop in file, not both locations.'
