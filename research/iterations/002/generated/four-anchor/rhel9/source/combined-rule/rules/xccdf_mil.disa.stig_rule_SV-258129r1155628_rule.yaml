  group_path:
  - xccdf_mil.disa.stig_group_V-258129
  description: '<VulnDiscussion>To mitigate the risk of unauthorized access to sensitive information by entities that have
    been issued certificates by DOD-approved PKIs, all DOD systems (e.g., web servers and web portals) must be properly configured
    to incorporate access control methods that do not rely solely on the possession of a certificate for access. Successful
    authentication must not automatically give an entity access to an asset or security boundary. Authorization procedures
    and controls must be implemented to ensure each authenticated entity also has a validated and current authorization. Authorization
    is the process of determining whether an entity, once authenticated, is permitted to access a specific asset. Information
    systems use access control policies and enforcement mechanisms to implement this requirement. This requirement prevents
    attackers with physical access from trivially bypassing security on the machine and gaining root access. Such accesses
    are further prevented by configuring the bootloader password. To modify properties, such as dependencies or timeouts,
    of a service that is handled by a SysV initscript, do not modify the initscript itself. Instead, create a systemd drop-in
    configuration file for the service. Then manage this service in the same way as a normal systemd service. For example,
    to extend the configuration of the network service, do not modify the /etc/rc.d/init.d/network initscript file. Instead,
    create new directory /etc/systemd/system/network.service.d/ and a systemd drop-in file /etc/systemd/system/network.service.d/my_config.conf.
    Then, put the modified values into the drop-in file. Note: systemd knows the network service as network.service, which
    is why the created directory must be called "network.service.d".</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
