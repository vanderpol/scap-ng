              name: affected
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: 'Without establishing what type of events occurred, it would be difficult to establish, correlate, and
                investigate the events leading up to an outage or attack. Ensuring the "auditd" service is active ensures
                audit records generated by the kernel are appropriately recorded.


                Additionally, a properly configured audit subsystem ensures that actions of individual system users can be
                uniquely traced to those users so they can be held accountable for their actions.


