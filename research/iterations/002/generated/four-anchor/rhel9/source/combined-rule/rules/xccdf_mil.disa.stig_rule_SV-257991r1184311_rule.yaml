              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: RHEL-09-255075 - RHEL 9 SSH server must be configured to use only Message Authentication Codes (MACs)
                employing FIPS 140-3 validated cryptographic hash algorithms.
            - attributes:
                family: unix
              children:
              - name: platform
                namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
                text: Red Hat Enterprise Linux 9
              name: affected
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: 'Without cryptographic integrity protections, information can be altered by unauthorized users without
                detection.


                Remote access (e.g., RDP) is access to DOD nonpublic information systems by an authorized user (or an information
                system) communicating through an external, nonorganization-controlled network. Remote access methods include,
                for example, dial-up, broadband, and wireless.


                Cryptographic mechanisms used for protecting the integrity of information include, for example, signed hash
                functions using asymmetric cryptography enabling distribution of the public key to verify the hash information
                while maintaining the confidentiality of the secret key used to generate the hash.


                RHEL 9 incorporates system-wide crypto policies by default. The SSH configuration file has no effect on the
                ciphers, MACs, or algorithms unless specifically defined in the /etc/sysconfig/sshd file. The employed algorithms
                can be viewed in the /etc/crypto-policies/back-ends/opensshserver.config file.'
            name: metadata
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
