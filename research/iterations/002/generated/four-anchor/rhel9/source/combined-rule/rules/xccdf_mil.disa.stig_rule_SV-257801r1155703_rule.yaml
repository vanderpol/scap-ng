rule:
  id: xccdf_mil.disa.stig_rule_SV-257801r1155703_rule
  title: RHEL 9 must enable kernel parameters to enforce discretionary access control (DAC) on hardlinks.
  severity: medium
  weight: '10.0'
  role: null
