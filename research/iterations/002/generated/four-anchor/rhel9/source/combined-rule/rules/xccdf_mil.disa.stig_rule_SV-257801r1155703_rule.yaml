    - name: title
      namespace: http://checklists.nist.gov/xccdf/1.2
      text: RHEL 9 must enable kernel parameters to enforce discretionary access control (DAC) on hardlinks.
    - name: description
      namespace: http://checklists.nist.gov/xccdf/1.2
      text: '<VulnDiscussion>DAC is based on the notion that individual users are "owners" of objects and therefore have discretion
        over who should be authorized to access the object and in which mode (e.g., read or write). Ownership is usually acquired
        as a consequence of creating the object or via specified ownership assignment. DAC allows the owner to determine who
        will have access to objects they control. An example of DAC includes user-controlled file permissions.


        When discretionary access control policies are implemented, subjects are not constrained with regard to what actions
        they can take with information for which they have already been granted access. Thus, subjects that have been granted
        access to information are not prevented from passing (i.e., the subjects have the discretion to pass) the information
        to other subjects or objects. A subject that is constrained in its operation by Mandatory Access Control policies
        is still able to operate under the less rigorous constraints of this requirement. Thus, while Mandatory Access Control
        imposes constraints preventing a subject from passing information to another subject operating at a different sensitivity
        level, this requirement permits the subject to pass the information to any subject at the same sensitivity level.
        The policy is bounded by the information system boundary. Once the information is passed outside the control of the
        information system, additional means may be required to ensure the constraints remain in effect. While the older,
        more traditional definitions of discretionary access control require identity-based access control, that limitation
        is not required for this use of discretionary access control.


        By enabling the fs.protected_hardlinks kernel parameter, users can no longer create soft or hard links to files they
        do not own. Disallowing such hardlinks mitigate vulnerabilities based on insecure file system accessed by privileged
        programs, avoiding an exploitation vector exploiting unsafe use of open() or creat().


        The sysctl --system command will load settings from all system configuration files. All configuration files are sorted
        by their filename in lexicographical order, regardless of the directories in which they reside. If multiple files
        specify the same option, the entry in the file with the lexicographically latest name will take precedence. Files
        are read from directories in the following list from top to bottom. Once a file of a given filename is loaded, any
        file of the same name in subsequent directories is ignored.


        /etc/sysctl.d/*.conf

        /run/sysctl.d/*.conf

        /usr/local/lib/sysctl.d/*.conf

        /usr/lib/sysctl.d/*.conf

        /lib/sysctl.d/*.conf

        /etc/sysctl.conf


        Satisfies: SRG-OS-000312-GPOS-00122, SRG-OS-000312-GPOS-00123, SRG-OS-000312-GPOS-00124, SRG-OS-000324-GPOS-00125</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
