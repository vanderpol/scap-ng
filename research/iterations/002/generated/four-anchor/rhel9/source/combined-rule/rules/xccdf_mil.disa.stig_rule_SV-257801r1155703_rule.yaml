                namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
                text: Red Hat Enterprise Linux 9
              name: affected
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: 'By enabling the fs.protected_hardlinks kernel parameter, users can no longer create soft or hard links
                to files they do not own. Disallowing such hardlinks mitigates vulnerabilities based on insecure file system
                accessed by privileged programs, avoiding an exploitation vector exploiting unsafe use of open() or creat().


                Satisfies: SRG-OS-000312-GPOS-00123, SRG-OS-000324-GPOS-00125'
            name: metadata
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
