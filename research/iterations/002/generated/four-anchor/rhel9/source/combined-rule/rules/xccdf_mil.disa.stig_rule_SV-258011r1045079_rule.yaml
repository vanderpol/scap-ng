              text: RHEL-09-255175 - RHEL 9 SSH daemon must prevent remote hosts from connecting to the proxy display.
            - attributes:
                family: unix
              children:
              - name: platform
                namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
                text: Red Hat Enterprise Linux 9
              name: affected
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: When X11 forwarding is enabled, there may be additional exposure to the server and client displays if
                the sshd proxy display is configured to listen on the wildcard address. By default, sshd binds the forwarding
                server to the loopback address and sets the hostname part of the "DISPLAY" environment variable to localhost.
                This prevents remote hosts from connecting to the proxy display.
            name: metadata
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
