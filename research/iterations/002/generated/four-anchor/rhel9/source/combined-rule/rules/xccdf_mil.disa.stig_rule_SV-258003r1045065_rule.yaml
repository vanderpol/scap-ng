        inline_content: 'Verify the SSH daemon does not allow GSSAPI authentication with the following command: $ sudo /usr/sbin/sshd
          -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo grep -iH ''^\s*gssapiauthentication''
