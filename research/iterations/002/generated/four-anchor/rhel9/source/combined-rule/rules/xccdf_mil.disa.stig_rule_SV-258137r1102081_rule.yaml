        oval:mil.disa.stig.rhel9os:def:258137:
          source_definition_id: oval:mil.disa.stig.rhel9os:def:258137
          class: compliance
          version: '1'
          criteria:
            children:
            - comment: null
              definition_ref: oval:mil.disa.stig.defs:def:230475
