rule:
  id: xccdf_mil.disa.stig_rule_SV-258137r1102081_rule
  title: RHEL 9 must use cryptographic mechanisms to protect the integrity of audit tools.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-258137
  description: '<VulnDiscussion>Protecting the integrity of the tools used for auditing purposes is a critical step toward
    ensuring the integrity of audit information. Audit information includes all information (e.g., audit records, audit settings,
    and audit reports) needed to successfully audit information system activity. Audit tools include, but are not limited
    to, vendor-provided and open-source audit tools needed to successfully view and manipulate audit information system activity
    and records. Audit tools include custom queries and report generators. It is not uncommon for attackers to replace the
    audit tools or inject code into the existing tools to provide the capability to hide or erase system activity from the
    audit logs. To address this risk, audit tools must be cryptographically signed to provide the capability to identify when
    the audit tools have been modified, manipulated, or replaced. An example is a checksum hash of the file or files. Satisfies:
    SRG-OS-000256-GPOS-00097, SRG-OS-000257-GPOS-00098, SRG-OS-000258-GPOS-00099, SRG-OS-000278-GPOS-00108</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
  discussion: null
