rule:
  id: xccdf_mil.disa.stig_rule_SV-257785r1044833_rule
  title: The x86 Ctrl-Alt-Delete key sequence must be disabled on RHEL 9.
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
