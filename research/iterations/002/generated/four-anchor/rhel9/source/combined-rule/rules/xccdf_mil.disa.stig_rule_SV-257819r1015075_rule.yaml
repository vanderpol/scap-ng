  fix: 'Install Red Hat package-signing keys on the system and verify their fingerprints match vendor values. Insert RHEL
    9 installation disc or attach RHEL 9 installation image to the system. Mount the disc or image to make the contents accessible
    inside the system. Assuming the mounted location is "/media/cdrom", use the following command to copy Red Hat GPG key
    file onto the system: $ sudo cp /media/cdrom/RPM-GPG-KEY-redhat-release /etc/pki/rpm-gpg/ Import Red Hat GPG keys from
    key file into system keyring: $ sudo rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release Using the steps listed in
    the Check Text, confirm the newly imported keys show as installed on the system and verify their fingerprints match vendor
    values.'
