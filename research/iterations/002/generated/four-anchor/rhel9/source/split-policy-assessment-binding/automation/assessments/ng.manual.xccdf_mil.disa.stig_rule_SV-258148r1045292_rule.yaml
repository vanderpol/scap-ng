          If the value of the "$DefaultNetstreamDriver or StreamDriver" option is not set to "gtls" or the line is commented
          out, this is a finding.


          If the variable name "StreamDriver" is present in an omfwd statement block, this is not a finding. However, if the
          "StreamDriver" variable is in a module block, this is a finding.'
      name: check
      namespace: http://checklists.nist.gov/xccdf/1.2
