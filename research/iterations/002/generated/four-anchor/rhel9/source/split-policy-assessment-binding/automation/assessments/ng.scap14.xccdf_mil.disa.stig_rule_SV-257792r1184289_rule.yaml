        metadata:
          children:
          - name: title
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: RHEL-09-212035 - RHEL 9 must disable virtual system calls.
          - attributes:
              family: unix
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Red Hat Enterprise Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'System calls are special routines in the Linux kernel, which userspace applications ask to do privileged
              tasks. Invoking a system call is an expensive operation because the processor must interrupt the currently executing
              task and switch context to kernel mode and then back to userspace after the system call completes. Virtual system
              calls map into user space a page that contains some variables and the implementation of some system calls. This
              allows the system calls to be executed in userspace to alleviate the context switching expense.


              Virtual system calls provide an opportunity of attack for a user who has control of the return instruction pointer.
              Disabling virtual system calls help to prevent return oriented programming (ROP) attacks via buffer overflows
              and overruns. If the system intends to run containers based on RHEL 6 components, then virtual system calls
              will need enabled so the components function properly.


              Satisfies: SRG-OS-000480-GPOS-00227, SRG-OS-000134-GPOS-00068'
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
