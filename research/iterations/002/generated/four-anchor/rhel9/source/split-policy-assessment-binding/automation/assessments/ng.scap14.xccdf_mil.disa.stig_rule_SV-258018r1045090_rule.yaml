        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:46301
      exports: []
      inline_content: 'Note: This requirement assumes the use of the RHEL 9 default graphical user interface, the GNOME desktop
        environment. If the system does not have any graphical user interface installed, this requirement is Not Applicable.
        Verify RHEL 9 does not allow an unattended or automatic logon to the system via a graphical user interface. Check
        for the value of the "AutomaticLoginEnable" in the "/etc/gdm/custom.conf" file with the following command: $ grep
        -i automaticlogin /etc/gdm/custom.conf AutomaticLoginEnable=false If the value of "AutomaticLoginEnable" is not set
        to "false", this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:46301
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Note: This requirement assumes the use of the RHEL 9 default graphical user interface, the GNOME desktop
            environment. If the system does not have any graphical user interface installed, this requirement is Not Applicable.


            Verify RHEL 9 does not allow an unattended or automatic logon to the system via a graphical user interface.


            Check for the value of the "AutomaticLoginEnable" in the "/etc/gdm/custom.conf" file with the following command:


            $  grep -i automaticlogin /etc/gdm/custom.conf


            AutomaticLoginEnable=false


            If the value of "AutomaticLoginEnable" is not set to "false", this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
