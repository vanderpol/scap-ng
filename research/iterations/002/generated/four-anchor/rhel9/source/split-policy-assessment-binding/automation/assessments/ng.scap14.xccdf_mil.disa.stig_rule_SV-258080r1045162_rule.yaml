        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:57301
      exports: []
      inline_content: 'Verify the location of the nondefault tally directory for the pam_faillock module with the following
        command: Note: If the system does not have SELinux enabled and enforcing a targeted policy, or if the pam_faillock
        module is not configured for use, this requirement is Not Applicable. $ sudo grep -w dir /etc/security/faillock.conf
        dir = /var/log/faillock Check the security context type of the nondefault tally directory with the following command:
        $ ls -Zd /var/log/faillock unconfined_u:object_r:faillog_t:s0 /var/log/faillock If the security context type of the
        nondefault tally directory is not "faillog_t", this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:57301
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify the location of the nondefault tally directory for the pam_faillock module with the following command:


            Note: If the system does not have SELinux enabled and enforcing a targeted policy, or if the pam_faillock module
            is not configured for use, this requirement is Not Applicable.


            $ sudo grep -w dir /etc/security/faillock.conf


            dir = /var/log/faillock


            Check the security context type of the nondefault tally directory with the following command:


            $ ls -Zd /var/log/faillock


            unconfined_u:object_r:faillog_t:s0 /var/log/faillock


            If the security context type of the nondefault tally directory is not "faillog_t", this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
