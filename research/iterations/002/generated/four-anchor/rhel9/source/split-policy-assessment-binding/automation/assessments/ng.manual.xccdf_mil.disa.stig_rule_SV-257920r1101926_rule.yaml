  id: ng.manual.xccdf_mil.disa.stig_rule_SV-257920r1101926_rule
  version: 1
  description: RHEL 9 library files must be owned by root.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:28301
    exports: []
    inline_content: 'Verify the systemwide shared library files contained in the directories "/lib", "/lib64", "/usr/lib",
      and "/usr/lib64" are owned by root with the following command: $ sudo find /lib /lib64 /usr/lib /usr/lib64 -type f -name
      ''*.so*'' ! -user root -exec stat -c "%n %U" {} + If any output is returned, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
