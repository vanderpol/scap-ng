        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:48701
      exports: []
      inline_content: 'Note: This requirement assumes the use of the RHEL 9 default graphical user interface, the GNOME desktop
        environment. If the system does not have any graphical user interface installed, this requirement is Not Applicable.
        Verify RHEL 9 prevents a user from overriding the disable-restart-buttons setting for graphical user interfaces. $
        gsettings writable org.gnome.login-screen disable-restart-buttons false If "disable-restart-buttons" is writable and
        the result is "true", this is a finding.'
      multi_check: null
      negate: null
