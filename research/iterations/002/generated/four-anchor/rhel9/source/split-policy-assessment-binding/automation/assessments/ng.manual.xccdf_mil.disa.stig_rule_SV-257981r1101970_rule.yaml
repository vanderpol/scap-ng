assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-257981r1101970_rule
  version: 1
  description: RHEL 9 must display the Standard Mandatory DOD Notice and Consent Banner before granting local or remote access
    to the system via a SSH logon.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:39901
    exports: []
    inline_content: 'Verify any SSH connection to RHEL 9 displays the Standard Mandatory DOD Notice and Consent Banner before
      granting access to the system. Check for the location of the banner file being used with the following command: $ sudo
      /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo grep -iH ''^\s*banner''
      /etc/ssh/sshd_config.d/80-bannerPointer.conf:Banner /etc/issue This command will return the banner keyword and the name
      of the file that contains the SSH banner (in this case "/etc/issue"). If the line is commented out, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
      children:
