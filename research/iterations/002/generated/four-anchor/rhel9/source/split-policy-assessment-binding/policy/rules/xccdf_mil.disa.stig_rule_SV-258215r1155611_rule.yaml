  check: 'Verify RHEL 9 generates an audit record for all uses of the "umount" and system call with the following command:
    $ sudo auditctl -l | grep b32 | grep ''umount\b'' -a always,exit -F arch=b32 -S umount -F auid>=1000 -F auid!=-1 -F key=privileged-umount
    If the command does not return a line, or the line is commented out, this is a finding.'
