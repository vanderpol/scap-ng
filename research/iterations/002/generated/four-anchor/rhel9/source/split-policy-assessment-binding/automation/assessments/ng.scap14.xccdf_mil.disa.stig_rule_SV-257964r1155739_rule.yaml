            text: RHEL-09-253045 - RHEL 9 must not forward IPv4 source-routed packets by default.
          - attributes:
              family: unix
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Red Hat Enterprise Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'Source-routed packets allow the source of the packet to suggest routers forward the packet along a different
              path than configured on the router, which can be used to bypass network security measures.


              Accepting source-routed packets in the IPv4 protocol has few legitimate uses. It must be disabled unless it
              is absolutely required, such as when IPv4 forwarding is enabled and the system is legitimately functioning as
              a router.'
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
