assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258033r1045120_rule
  version: 1
  description: RHEL 9 must disable the user list at logon for graphical user interfaces.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:49301
    exports: []
    inline_content: 'Note: This requirement assumes the use of the RHEL 9 default graphical user interface, the GNOME desktop
      environment. If the system does not have any graphical user interface installed, this requirement is Not Applicable.
      Verify that RHEL 9 disables the user logon list for graphical user interfaces with the following command: $ gsettings
      get org.gnome.login-screen disable-user-list true If the setting is "false", this is a finding.'
    multi_check: null
    negate: null
