      inline_content: 'Verify that "/etc/sudoers" has no occurrences of "NOPASSWD" with the following command: $ sudo grep
        -iR ''NOPASSWD'' /etc/sudoers /etc/sudoers.d/ If any occurrences of "NOPASSWD" are returned from the command and have
