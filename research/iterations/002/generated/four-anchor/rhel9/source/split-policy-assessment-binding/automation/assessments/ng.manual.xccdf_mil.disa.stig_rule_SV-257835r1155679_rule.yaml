assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-257835r1155679_rule
  version: 1
  description: The Trivial File Transfer Protocol (TFTP) server must not be installed unless it is required, and if required,
    the RHEL 9 TFTP daemon must be configured to operate in secure mode.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:11501
    exports: []
    inline_content: 'Verify if TFTP is installed, it is configured to operate in secure mode. Note: If TFTP is not required,
      it must not be installed. If TFTP is not installed, this rule is not applicable. Check to see if TFTP server is installed
      with the following command: $ sudo dnf list --installed tftp-server Updating Subscription Management repositories. Installed
      Packages tftp-server.x86_64 5.2-38.el9 @rhel-9-for-x86_64-appstream-rpms Verify the TFTP daemon, if tftp.server is installed,
      is configured to operate in secure mode with the following command: $ grep -i execstart /usr/lib/systemd/system/tftp.service
      ExecStart=/usr/sbin/in.tftpd -s /var/lib/tftpboot Note: The "-s" option ensures the TFTP server only serves files from
      the specified directory, which is a security measure to prevent unauthorized access to other parts of the file system.'
    multi_check: null
    negate: null
    selector: manual
