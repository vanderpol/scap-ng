        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:69501
      exports: []
      inline_content: 'Verify RHEL 9 encrypts audit records offloaded onto a different system or media from the system being
        audited via rsyslog with the following command: $ grep -i ''StreamDriver[\.]*Mode'' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
        /etc/rsyslog.conf:$ActionSendStreamDriverMode 1 If the value of the "$ActionSendStreamDriverMode or StreamDriver.Mode"
        option is not set to "1" or the line is commented out, this is a finding. If the variable name "StreamDriverAuthMode"
        is present in an omfwd statement block, this is not a finding. However, if the "StreamDriverAuthMode" variable is
        in a module block, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:69501
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify RHEL 9 encrypts audit records offloaded onto a different system or media from the system being audited\
            \ via rsyslog with the following command:\n\n$ grep -i 'StreamDriver[\\.]*Mode' /etc/rsyslog.conf /etc/rsyslog.d/*.conf\n\
            \n/etc/rsyslog.conf:$ActionSendStreamDriverMode 1 \n\nIf the value of the \"$ActionSendStreamDriverMode or StreamDriver.Mode\"\
            \ option is not set to \"1\" or the line is commented out, this is a finding.\n\nIf the variable name \"StreamDriverAuthMode\"\
            \ is present in an omfwd statement block, this is not a finding. However, if the \"StreamDriverAuthMode\" variable\
            \ is in a module block, this is a finding."
