  - xccdf_mil.disa.stig_group_V-258069
  description: <VulnDiscussion>Operating system management includes the ability to control the number of users and user sessions
    that utilize an operating system. Limiting the number of allowed users and sessions per user is helpful in reducing the
    risks related to denial-of-service (DoS) attacks. This requirement addresses concurrent sessions for information system
    accounts and does not address concurrent sessions by single users via multiple system accounts. The maximum number of
    concurrent sessions must be defined based on mission needs and the operational environment for each system.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
