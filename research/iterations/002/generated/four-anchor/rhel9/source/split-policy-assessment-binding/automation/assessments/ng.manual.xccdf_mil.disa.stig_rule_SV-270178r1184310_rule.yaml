assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-270178r1184310_rule
  version: 1
  description: The RHEL 9 SSH client must be configured to use only DOD-approved Message Authentication Codes (MACs) employing
    FIPS 140-3 validated cryptographic hash algorithms to protect the confidentiality of SSH client connections.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:88101
    exports: []
    inline_content: 'Verify the SSH client is configured to use only MACs employing FIPS 140-3 approved algorithms. To verify
      the MACs in the systemwide SSH configuration file, use the following command: $ grep -i MACs /etc/crypto-policies/back-ends/openssh.config
      MACs hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,hmac-sha2-256,hmac-sha2-512 If the MACs entries in
      the "openssh.config" file have any hashes other than "hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,hmac-sha2-256,hmac-sha2-512",
      or they are missing or commented out, this is a finding.'
    multi_check: null
    negate: null
