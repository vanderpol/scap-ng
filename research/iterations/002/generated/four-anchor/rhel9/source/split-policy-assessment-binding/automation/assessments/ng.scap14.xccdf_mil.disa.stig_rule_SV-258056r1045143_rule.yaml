        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Note: If the system administrator demonstrates the use of an approved centralized account management method\
            \ that locks an account after three unsuccessful logon attempts within a period of 15 minutes, this requirement\
            \ is Not Applicable.\n\nVerify RHEL 9 locks an account after three unsuccessful logon attempts within a period\
            \ of 15 minutes with the following command:\n\n$ sudo grep fail_interval /etc/security/faillock.conf \n\nfail_interval\
            \ = 900\n\nIf the \"fail_interval\" option is not set to \"900\" or less (but not \"0\"), the line is commented\
            \ out, or the line is missing, this is a finding."
