          text: "If postfix is not installed, this is Not Applicable.\n\nVerify RHEL 9 is configured to prevent unrestricted\
            \ mail relaying with the following command:\n\n$ postconf -n smtpd_client_restrictions \n\nsmtpd_client_restrictions\
            \ = permit_mynetworks,reject \n\nIf the \"smtpd_client_restrictions\" parameter contains any entries other than\
