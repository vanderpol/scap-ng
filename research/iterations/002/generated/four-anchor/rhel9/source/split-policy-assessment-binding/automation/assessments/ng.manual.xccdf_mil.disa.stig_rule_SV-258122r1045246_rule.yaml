assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258122r1045246_rule
  version: 1
  description: RHEL 9 must enable certificate based smart card authentication.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:64901
    exports: []
    inline_content: 'Note: If the system administrator (SA) demonstrates the use of an approved alternate multifactor authentication
      method, this requirement is Not Applicable. To verify that RHEL 9 has smart cards enabled in System Security Services
      Daemon (SSSD), run the following command: $ sudo grep -ir pam_cert_auth /etc/sssd/sssd.conf /etc/sssd/conf.d/ pam_cert_auth
      = True If "pam_cert_auth" is not set to "True", the line is commented out, or the line is missing, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
