assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-257856r1044938_rule
  version: 1
  description: RHEL 9 must prevent files with the setuid and setgid bit set from being executed on file systems that are imported
    via Network File System (NFS).
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:15501
    exports: []
    inline_content: 'Note: If no NFS mounts are configured, this requirement is Not Applicable. Verify RHEL 9 has the "nosuid"
      option configured for all NFS mounts with the following command: $ grep nfs /etc/fstab 192.168.22.2:/mnt/export /data
      nfs4 rw,nosuid,nodev,noexec,sync,soft,sec=krb5:krb5i:krb5p If the system is mounting file systems via NFS and the "nosuid"
      option is missing, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
