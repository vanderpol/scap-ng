  version: 1
  description: RHEL 9 must not allow users to override SSH environment variables.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:41701
    exports: []
    inline_content: 'Verify that unattended or automatic logon via SSH is disabled with the following command: $ sudo /usr/sbin/sshd
      -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo grep -iH ''^\s*permituserenvironment''
      PermitUserEnvironment no If "PermitUserEnvironment" is set to "yes", is missing completely, or is commented out, this
      is a finding. If the required value is not set, this is a finding.'
