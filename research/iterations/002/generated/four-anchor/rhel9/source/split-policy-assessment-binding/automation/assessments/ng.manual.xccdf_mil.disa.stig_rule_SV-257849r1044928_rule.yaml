  id: ng.manual.xccdf_mil.disa.stig_rule_SV-257849r1044928_rule
  version: 1
  description: RHEL 9 file system automount function must be disabled unless required.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:14301
    exports: []
    inline_content: 'Note: If the autofs service is not installed, this requirement is Not Applicable. Verify that the RHEL
      9 file system automount function has been disabled with the following command: $ systemctl is-enabled autofs masked
      If the returned value is not "masked", "disabled", or "Failed to get unit file state for autofs.service for autofs"
      and is not documented as an operational requirement with the information system security officer (ISSO), this is a finding.'
    multi_check: null
    negate: null
