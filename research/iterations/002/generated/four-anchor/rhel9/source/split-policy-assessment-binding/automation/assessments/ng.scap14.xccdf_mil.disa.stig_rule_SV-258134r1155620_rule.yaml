        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:67101
      exports: []
      inline_content: 'Verify the file integrity tool is configured to verify ACLs. Note: AIDE is highly configurable at install
        time. This requirement assumes the "aide.conf" file is under the "/etc" directory. Verify AIDE is installed with the
        following command: $ sudo dnf list installed aide Updating Subscription Management repositories. Installed Packages
        aide.x86_64 0.16-103.el9 @rhel-9-for-x86_64-appstream-rpms Use the following command to determine if the file is in
        a location other than "/etc/aide/aide.conf": $ sudo find / -name aide.conf If AIDE is not installed, ask the system
        administrator (SA) how file integrity checks are performed on the system.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:67101
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify the file integrity tool is configured to verify ACLs.


            Note: AIDE is highly configurable at install time. This requirement assumes the "aide.conf" file is under the
            "/etc" directory.


            Verify AIDE is installed with the following command:


            $ sudo dnf list installed aide


            Updating Subscription Management repositories.

            Installed Packages

            aide.x86_64                                0.16-103.el9                                @rhel-9-for-x86_64-appstream-rpms


            Use the following command to determine if the file is in a location other than "/etc/aide/aide.conf":


            $ sudo find / -name aide.conf


            If AIDE is not installed, ask the system administrator (SA) how file integrity checks are performed on the system.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
