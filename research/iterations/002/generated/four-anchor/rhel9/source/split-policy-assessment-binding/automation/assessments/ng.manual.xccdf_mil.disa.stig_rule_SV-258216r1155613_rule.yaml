  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258216r1155613_rule
  version: 1
  description: Successful/unsuccessful uses of the umount2 system call in RHEL 9 must generate an audit record.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:83101
    exports: []
    inline_content: 'To determine if the system is configured to audit calls to the umount2 system call, run the following
      command: $ sudo auditctl -l | grep umount2 -a always,exit -F arch=b64 -S umount2 -F auid>=1000 -F auid!=-1 -F key=privileged-umount
      -a always,exit -F arch=b32 -S umount2 -F auid>=1000 -F auid!=-1 -F key=privileged-umount If no line is returned, this
      is a finding.'
    multi_check: null
    negate: null
    selector: manual
