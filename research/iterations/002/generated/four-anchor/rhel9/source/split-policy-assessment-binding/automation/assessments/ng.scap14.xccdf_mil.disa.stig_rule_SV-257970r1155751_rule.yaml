      exports: []
      inline_content: 'Verify RHEL 9 is not performing IPv4 packet forwarding unless the system is a router. Check that "net.ipv4.conf.all.forwarding"
        is disabled using the following command: $ sudo sysctl net.ipv4.conf.all.forwarding net.ipv4.conf.all.forwarding =
        0 If "net.ipv4.conf.all.forwarding" is not set to "0" and is not documented with the information system security officer
        (ISSO) as an operational requirement or is missing, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:37701
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify RHEL 9 is not performing IPv4 packet forwarding unless the system is a router.


            Check that "net.ipv4.conf.all.forwarding" is disabled using the following command:


            $ sudo sysctl net.ipv4.conf.all.forwarding

            net.ipv4.conf.all.forwarding = 0


            If "net.ipv4.conf.all.forwarding" is not set to "0" and is not documented with the information system security
            officer (ISSO) as an operational requirement or is missing, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
