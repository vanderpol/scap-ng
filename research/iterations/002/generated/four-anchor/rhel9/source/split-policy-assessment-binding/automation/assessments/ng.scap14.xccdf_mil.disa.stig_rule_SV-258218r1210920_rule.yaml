          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'The actions taken by system administrators must be audited to keep a record of what was executed on the
              system, as well as for accountability purposes. Editing the sudoers file may be sign of an attacker trying to
              establish persistent methods to a system, auditing the editing of the sudoers files mitigates this risk.


