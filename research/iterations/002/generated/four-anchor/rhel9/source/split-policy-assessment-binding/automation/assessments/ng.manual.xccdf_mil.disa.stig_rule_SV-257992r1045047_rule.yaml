  id: ng.manual.xccdf_mil.disa.stig_rule_SV-257992r1045047_rule
  version: 1
  description: RHEL 9 must not allow a noncertificate trusted host SSH logon to the system.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:41501
    exports: []
    inline_content: 'Verify the operating system does not allow a noncertificate trusted host SSH logon to the system with
      the following command: $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' ''
      '' | xargs sudo grep -iH ''^\s*hostbasedauthentication'' HostbasedAuthentication no If the "HostbasedAuthentication"
      keyword is not set to "no", is missing, or is commented out, this is a finding. If the required value is not set, this
      is a finding.'
