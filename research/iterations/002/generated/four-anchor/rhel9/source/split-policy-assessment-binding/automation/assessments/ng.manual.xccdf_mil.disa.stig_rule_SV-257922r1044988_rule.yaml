  id: ng.manual.xccdf_mil.disa.stig_rule_SV-257922r1044988_rule
  version: 1
  description: RHEL 9 library directories must be owned by root.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:28701
    exports: []
    inline_content: 'Verify the systemwide shared library directories are owned by "root" with the following command: $ sudo
      find /lib /lib64 /usr/lib /usr/lib64 ! -user root -type d -exec stat -c "%U %n" {} \; If any systemwide shared library
      directory is not owned by "root", this is a finding.'
