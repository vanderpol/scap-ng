        metadata:
          children:
          - name: title
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: RHEL 9 library directories must be group-owned by root or a system account.
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'If the operating system were to allow any user to make changes to software libraries, then those changes
              might be implemented without undergoing the appropriate testing and approvals that are part of a robust change
              management process.


              This requirement applies to the operating system with software libraries that are accessible and configurable,
              as in the case of interpreted languages. Software libraries also include privileged programs that execute with
              escalated privileges. Only qualified and authorized individuals will be allowed to obtain access to information
              system components for purposes of initiating changes, including upgrades and modifications.'
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
