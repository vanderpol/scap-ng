assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-279936r1210929_rule
  version: 1
  description: RHEL 9 must audit any script or executable called by cron as root or by any privileged user.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:88901
    exports: []
    inline_content: 'Verify RHEL 9 is configured to audit the execution of any system call made by cron as root or by any
      privileged user with the following command: $ sudo auditctl -l | grep crond_t -a always,exit -F arch=b64 -S execve -F
      subj_type=crond_t -F euid=0 -k cron_exec -a always,exit -F arch=b32 -S execve -F subj_type=crond_t -F euid=0 -k cron_exec
      -a always,exit -F arch=b64 -S execve -F subj_type=crond_t -F auid>=1000 -F auid!=unset -k cron_exec -a always,exit -F
      arch=b32 -S execve -F subj_type=crond_t -F auid>=1000 -F auid!=unset -k cron_exec If this command does not return the
      expected output, or the lines are commented out, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
