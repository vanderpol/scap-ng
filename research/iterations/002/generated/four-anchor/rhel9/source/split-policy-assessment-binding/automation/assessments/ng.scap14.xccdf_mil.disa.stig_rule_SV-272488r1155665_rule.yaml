            text: 'Postfix is a free, open-source mail transfer agent (MTA) that sends and receives emails. It is a server-side
              application that can be used to set up a local mail server, create a null-client mail relay, use a Postfix server
              as a destination for multiple domains, or choose an LDAP directory instead of files for lookups. Postfix supports
