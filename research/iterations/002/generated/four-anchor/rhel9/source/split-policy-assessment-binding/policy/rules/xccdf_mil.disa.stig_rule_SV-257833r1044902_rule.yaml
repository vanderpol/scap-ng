  description: '<VulnDiscussion>It is detrimental for operating systems to provide, or install by default, functionality exceeding
    requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore may
    remain unsecured. They increase the risk to the platform by providing additional attack vectors. Operating systems are
    capable of providing a wide variety of functions and services. Some of the functions and services, provided by default,
    may not be necessary to support essential organizational operations (e.g., key missions, functions). The iprutils package
    provides a suite of utilities to manage and configure SCSI devices supported by the ipr SCSI storage device driver. Satisfies:
    SRG-OS-000095-GPOS-00049, SRG-OS-000480-GPOS-00227</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
