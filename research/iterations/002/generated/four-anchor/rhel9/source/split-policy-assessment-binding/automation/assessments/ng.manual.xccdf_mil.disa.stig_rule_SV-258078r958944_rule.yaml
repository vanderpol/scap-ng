assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258078r958944_rule
  version: 1
  description: RHEL 9 must use a Linux Security Module configured to enforce limits on system services.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:56901
    exports: []
    inline_content: 'Ensure that RHEL 9 verifies correct operation of security functions through the use of SELinux with the
      following command: $ getenforce Enforcing If SELINUX is not set to "Enforcing", this is a finding. Verify that SELinux
      is configured to be enforcing at boot. grep "SELINUX=" /etc/selinux/config # SELINUX= can take one of these three values:
      # NOTE: In earlier Fedora kernel builds, SELINUX=disabled would also SELINUX=enforcing If SELINUX line is missing, commented
      out, or not set to "enforcing", this is a finding.'
