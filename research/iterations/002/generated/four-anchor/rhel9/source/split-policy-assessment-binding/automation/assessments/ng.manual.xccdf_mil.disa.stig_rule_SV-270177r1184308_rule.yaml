assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-270177r1184308_rule
  version: 1
  description: The RHEL 9 SSH client must be configured to use only DOD-approved encryption ciphers employing FIPS 140-3 validated
    cryptographic hash algorithms to protect the confidentiality of SSH client connections.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:87901
    exports: []
    inline_content: 'Verify the SSH client is configured to use only ciphers employing FIPS 140-3 approved algorithms. To
      verify the ciphers in the systemwide SSH configuration file, use the following command: $ grep -i Ciphers /etc/crypto-policies/back-ends/openssh.config
      Ciphers aes256-gcm@openssh.com,aes256-ctr,aes128-gcm@openssh.com,aes128-ctr If the cipher entries in the "openssh.config"
      file have any ciphers other than "aes256-gcm@openssh.com,aes256-ctr,aes128-gcm@openssh.com,aes128-ctr", or they are
      missing or commented out, this is a finding.'
    multi_check: null
    negate: null
