assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258013r1045082_rule
  version: 1
  description: RHEL 9 must prevent a user from overriding the banner-message-enable setting for the graphical user interface.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:45301
    exports: []
    inline_content: 'Note: This requirement assumes the use of the RHEL 9 default graphical user interface, the GNOME desktop
      environment. If the system does not have any graphical user interface installed, this requirement is Not Applicable.
      Verify RHEL 9 prevents a user from overriding settings for graphical user interfaces. Determine if the org.gnome.login-screen
      banner-message-enable key is writable with the following command: $ gsettings writable org.gnome.login-screen banner-message-enable
      false If "banner-message-enable" is writable or the result is "true", this is a finding.'
    multi_check: null
    negate: null
