assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-257862r1184295_rule
  version: 1
  description: RHEL 9 must prevent files with the setuid and setgid bit set from being executed on the /boot/efi directory.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:16701
    exports: []
    inline_content: 'Note: For systems that use BIOS, this is not applicable. Verify the /boot/efi directory is mounted with
      the "nosuid" option with the following command: $ mount | grep ''\s/boot/efi\s'' /dev/sda1 on /boot/efi type vfat (rw,nosuid,relatime,fmask=0077,dmask=0077,codepage=437,iocharset=ascii,shortname=winnt,errors=remount-ro)
      If the /boot/efi file system does not have the "nosuid" option set, this is a finding. Note: This control is not applicable
      to vfat file systems.'
    multi_check: null
    negate: null
    selector: manual
