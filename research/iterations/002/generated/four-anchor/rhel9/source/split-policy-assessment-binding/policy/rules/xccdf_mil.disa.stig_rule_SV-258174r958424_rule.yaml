rule:
  id: xccdf_mil.disa.stig_rule_SV-258174r958424_rule
  title: RHEL 9 must have mail aliases to notify the information system security officer (ISSO) and system administrator (SA)
    (at a minimum) in the event of an audit processing failure.
  severity: medium
  weight: '10.0'
  role: null
