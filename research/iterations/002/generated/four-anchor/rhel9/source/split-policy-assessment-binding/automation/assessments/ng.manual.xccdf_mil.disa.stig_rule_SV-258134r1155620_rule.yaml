    exports: []
    inline_content: 'Verify the file integrity tool is configured to verify ACLs. Note: AIDE is highly configurable at install
      time. This requirement assumes the "aide.conf" file is under the "/etc" directory. Verify AIDE is installed with the
      following command: $ sudo dnf list installed aide Updating Subscription Management repositories. Installed Packages
      aide.x86_64 0.16-103.el9 @rhel-9-for-x86_64-appstream-rpms Use the following command to determine if the file is in
      a location other than "/etc/aide/aide.conf": $ sudo find / -name aide.conf If AIDE is not installed, ask the system
      administrator (SA) how file integrity checks are performed on the system.'
