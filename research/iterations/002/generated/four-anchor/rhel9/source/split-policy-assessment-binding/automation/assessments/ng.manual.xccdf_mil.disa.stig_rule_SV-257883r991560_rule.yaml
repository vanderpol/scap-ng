  version: 1
  description: RHEL 9 library directories must have mode 755 or less permissive.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:20901
    exports: []
    inline_content: 'Verify the system-wide shared library directories have mode "755" or less permissive with the following
      command: $ sudo find -L /lib /lib64 /usr/lib /usr/lib64 -perm /022 -type d -exec ls -l {} \; If any system-wide shared
      library file is found to be group-writable or world-writable, this is a finding.'
