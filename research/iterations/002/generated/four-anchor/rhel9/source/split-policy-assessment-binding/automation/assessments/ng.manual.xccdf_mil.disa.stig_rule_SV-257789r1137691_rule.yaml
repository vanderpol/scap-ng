assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-257789r1137691_rule
  version: 1
  description: RHEL 9 must require a unique superusers name upon booting into single-user and maintenance modes.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:2301
    exports: []
    inline_content: 'Verify the RHEL 9 boot loader superuser account has been set with the following command: $ sudo grep
      -A1 "superusers" /etc/grub2.cfg set superusers="<accountname>" export superusers password_pbkdf2 <accountname> ${GRUB2_PASSWORD}
      Verify <accountname> is not a common name such as root, admin, or administrator. If superusers contains easily guessable
      usernames, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
