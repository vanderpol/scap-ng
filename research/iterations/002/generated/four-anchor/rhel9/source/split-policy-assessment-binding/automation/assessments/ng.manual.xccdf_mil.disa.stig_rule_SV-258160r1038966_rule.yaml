assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258160r1038966_rule
  version: 1
  description: RHEL 9 audit system must take appropriate action when the audit files have reached maximum size.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:72101
    exports: []
    inline_content: 'Verify that RHEL 9 takes the appropriate action when the audit files have reached maximum size with the
      following command: $ sudo grep max_log_file_action /etc/audit/auditd.conf max_log_file_action = ROTATE If the value
      of the "max_log_file_action" option is not "ROTATE", "SINGLE", or the line is commented out, ask the system administrator
      (SA)to indicate how the system takes appropriate action when an audit storage volume is full. If there is no evidence
      of appropriate action, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
