      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:59701
    exports: []
    inline_content: 'Verify that null passwords cannot be used with the following command: $ sudo grep -i nullok /etc/pam.d/system-auth
      /etc/pam.d/password-auth If output is produced, this is a finding. If the system administrator (SA) can demonstrate
      that the required configuration is contained in a PAM configuration file included or substacked from the system-auth
      file, this is not a finding.'
