        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:3701
      exports: []
      inline_content: 'Verify that GRUB 2 is configured to enable auditing of processes that start prior to the audit daemon
        with the following commands: Check that the current GRUB 2 configuration enables auditing: $ sudo grubby --info=ALL
        | grep args | grep -v ''audit=1'' If any output is returned, this is a finding. Check that auditing is enabled by
        default to persist in kernel updates: $ grep audit /etc/default/grub GRUB_CMDLINE_LINUX="audit=1" If "audit" is not
        set to "1", is missing, or is commented out, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:3701
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify that GRUB 2 is configured to enable auditing of processes that start prior to the audit daemon with\
            \ the following commands:\n\nCheck that the current GRUB 2 configuration enables auditing:\n\n$ sudo grubby --info=ALL\
            \ | grep args | grep -v 'audit=1'\n\nIf any output is returned, this is a finding.\n\nCheck that auditing is enabled\
            \ by default to persist in kernel updates: \n\n$ grep audit /etc/default/grub\n\nGRUB_CMDLINE_LINUX=\"audit=1\"\
            \n\nIf \"audit\" is not set to \"1\", is missing, or is commented out, this is a finding."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
