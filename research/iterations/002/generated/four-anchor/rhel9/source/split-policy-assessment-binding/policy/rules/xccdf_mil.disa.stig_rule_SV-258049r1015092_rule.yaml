  fix: 'Configure RHEL 9 to disable account identifiers after 35 days of inactivity after the password expiration. Run the
    following command to change the configuration for useradd: $ sudo useradd -D -f 35 The recommendation is 35 days, but
    a lower value is acceptable.'
