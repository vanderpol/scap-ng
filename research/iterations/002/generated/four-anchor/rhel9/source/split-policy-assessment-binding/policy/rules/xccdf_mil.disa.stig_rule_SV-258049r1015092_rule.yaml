  description: <VulnDiscussion>Inactive identifiers pose a risk to systems and applications because attackers may exploit
    an inactive identifier and potentially obtain undetected access to the system. Disabling inactive accounts ensures that
    accounts which may not have been responsibly removed are not available to attackers who may have compromised their credentials.
    Owners of inactive accounts will not notice if unauthorized access to their user account has been obtained.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
