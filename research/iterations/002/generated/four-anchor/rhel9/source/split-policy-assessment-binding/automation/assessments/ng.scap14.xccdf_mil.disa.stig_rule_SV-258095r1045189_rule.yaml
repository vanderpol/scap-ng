        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:59901
      exports: []
      inline_content: 'Verify the pam_faillock.so module is present in the "/etc/pam.d/system-auth" file: $ grep pam_faillock.so
        /etc/pam.d/system-auth auth required pam_faillock.so preauth auth required pam_faillock.so authfail account required
        pam_faillock.so If the pam_faillock.so module is not present in the "/etc/pam.d/system-auth" file with the "preauth"
        line listed before pam_unix.so, this is a finding. If the system administrator (SA) can demonstrate that the required
        configuration is contained in a PAM configuration file included or substacked from the system-auth file, this is not
        a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:59901
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify the pam_faillock.so module is present in the "/etc/pam.d/system-auth" file:


            $ grep pam_faillock.so /etc/pam.d/system-auth


            auth required pam_faillock.so preauth

            auth required pam_faillock.so authfail

            account required pam_faillock.so


            If the pam_faillock.so module is not present in the "/etc/pam.d/system-auth" file with the "preauth" line listed
            before pam_unix.so, this is a finding.


            If the system administrator (SA) can demonstrate that the required configuration is contained in a PAM configuration
            file included or substacked from the system-auth file, this is not a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
