      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:35101
    exports: []
    inline_content: 'Verify RHEL 9 is configured to use IPv4 TCP syncookies. Check the value of all "tcp_syncookies" variables
      with the following command: $ sudo sysctl net.ipv4.tcp_syncookies net.ipv4.tcp_syncookies = 1 If the network parameter
      "ipv4.tcp_syncookies" is not equal to "1" or nothing is returned, this is a finding.'
