  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258036r1014861_rule
  version: 1
  description: RHEL 9 must have the USBGuard package enabled.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:49901
    exports: []
    inline_content: 'Verify RHEL 9 has USBGuard enabled with the following command: $ systemctl is-active usbguard active
      If usbguard is not active, ask the SA to indicate how unauthorized peripherals are being blocked. If there is no evidence
      that unauthorized peripherals are being blocked before establishing a connection, this is a finding. If the system is
      virtual machine with no virtual or physical USB peripherals attached, this is not a finding.'
    multi_check: null
    negate: null
