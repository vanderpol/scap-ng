        metadata:
          children:
          - name: title
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: RHEL 9 must implement nonexecutable data to protect its memory from unauthorized code execution.
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'ExecShield uses the segmentation feature on all x86 systems to prevent execution in memory higher than
              a certain address. It writes an address as a limit in the code segment descriptor, to control where code can
              be executed, on a per-process basis. When the kernel places a process''s memory regions such as the stack and
              heap higher than this address, the hardware prevents execution in that address range. This is enabled by default
              on the latest Red Hat and Fedora systems if supported by the hardware.


              Checking dmesg will return a false-positive if the system has generated enough kernel messages that the "(Execute
              Disable) protection: active" line is no longer present in the output from dmesg(1). A better way to ensure that
              ExecShield is enabled is to first ensure all processors support the NX feature, and then to check that noexec
              was not passed to the kernel command line.'
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
