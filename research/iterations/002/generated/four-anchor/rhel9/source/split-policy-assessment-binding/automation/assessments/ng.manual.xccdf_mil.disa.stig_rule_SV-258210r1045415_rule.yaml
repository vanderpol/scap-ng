  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258210r1045415_rule
  version: 1
  description: RHEL 9 must audit all uses of the mount command.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:81901
    exports: []
    inline_content: 'Verify that RHEL 9 is configured to audit the execution of the "mount" command with the following command:
      $ sudo auditctl -l | grep /usr/bin/mount -a always,exit -S all -F path=/usr/bin/mount -F perm=x -F auid>=1000 -F auid!=-1
      -F key=privileged-mount If the command does not return a line, or the line is commented out, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
