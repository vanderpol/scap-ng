            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: RHEL-09-611010 - RHEL 9 must ensure the password complexity module in the system-auth file is configured
              for three retries or less.
          - attributes:
              family: unix
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Red Hat Enterprise Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'Use of a complex password helps to increase the time and resources required to compromise the password.
              Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing
              and brute-force attacks. "pwquality" enforces complex password construction configuration and has the ability
              to limit brute-force attacks on the system.


              RHEL 9 uses "pwquality" as a mechanism to enforce password complexity. This is set in both:

              /etc/pam.d/password-auth

              /etc/security/pwquality.conf


              By limiting the number of attempts to meet the pwquality module complexity requirements before returning with
              an error, the system will audit abnormal attempts at password changes.'
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
