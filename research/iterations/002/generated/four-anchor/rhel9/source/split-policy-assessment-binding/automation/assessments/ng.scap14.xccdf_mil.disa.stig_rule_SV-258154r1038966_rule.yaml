        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:70901
      exports: []
      inline_content: 'Verify RHEL 9 takes the appropriate action when the audit storage volume is full. Check that RHEL 9
        takes the appropriate action when the audit storage volume is full with the following command: $ sudo grep disk_full_action
        /etc/audit/auditd.conf disk_full_action = HALT If the value of the "disk_full_action" option is not "SYSLOG", "SINGLE",
        or "HALT", or the line is commented out, ask the system administrator (SA) to indicate how the system takes appropriate
        action when an audit storage volume is full. If there is no evidence of appropriate action, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:70901
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify RHEL 9 takes the appropriate action when the audit storage volume is full. \n\nCheck that RHEL 9 takes\
            \ the appropriate action when the audit storage volume is full with the following command:\n\n$ sudo grep disk_full_action\
            \ /etc/audit/auditd.conf\n\ndisk_full_action = HALT\n\nIf the value of the \"disk_full_action\" option is not\
            \ \"SYSLOG\", \"SINGLE\", or \"HALT\", or the line is commented out, ask the system administrator (SA) to indicate\
            \ how the system takes appropriate action when an audit storage volume is full. If there is no evidence of appropriate\
            \ action, this is a finding."
