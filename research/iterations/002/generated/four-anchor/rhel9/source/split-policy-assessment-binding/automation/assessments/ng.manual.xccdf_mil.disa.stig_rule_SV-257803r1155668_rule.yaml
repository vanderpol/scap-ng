  id: ng.manual.xccdf_mil.disa.stig_rule_SV-257803r1155668_rule
  version: 1
  description: RHEL 9 must disable the kernel.core_pattern.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:5101
    exports: []
    inline_content: 'Verify RHEL 9 disables storing core dumps. Check the status of the "kernel.core_pattern" kernel parameter
      with the following command: $ sudo sysctl kernel.core_pattern kernel.core_pattern = |/bin/false If "kernel.core_pattern"
      is not set to "|/bin/false", or a line is not returned and the need for core dumps is not documented with the information
      system security officer (ISSO) as an operational requirement, this is a finding.'
    multi_check: null
    negate: null
