  id: ng.manual.xccdf_mil.disa.stig_rule_SV-257951r1014843_rule
  version: 1
  description: RHEL 9 must be configured to prevent unrestricted mail relaying.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:34101
    exports: []
    inline_content: 'If postfix is not installed, this is Not Applicable. Verify RHEL 9 is configured to prevent unrestricted
      mail relaying with the following command: $ postconf -n smtpd_client_restrictions smtpd_client_restrictions = permit_mynetworks,reject
      If the "smtpd_client_restrictions" parameter contains any entries other than "permit_mynetworks" and "reject", and the
      additional entries have not been documented with the information system security officer (ISSO), this is a finding.'
    multi_check: null
    negate: null
    selector: manual
