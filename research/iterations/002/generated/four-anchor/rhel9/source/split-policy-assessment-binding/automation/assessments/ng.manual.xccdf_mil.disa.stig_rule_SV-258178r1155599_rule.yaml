assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258178r1155599_rule
  version: 1
  description: RHEL 9 must audit all uses of the chown, fchown, fchownat, and lchown system calls.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:75501
    exports: []
    inline_content: 'Verify RHEL 9 is configured to audit the execution of the "chown", "fchown", "fchownat", and "lchown"
      system calls with the following command: $ sudo auditctl -l | grep chown -a always,exit -F arch=b32 -S lchown,fchown,chown,fchownat
      -F auid>=1000 -F auid!=-1 -F key=perm_mod -a always,exit -F arch=b64 -S chown,fchown,lchown,fchownat -F auid>=1000 -F
      auid!=-1 -F key=perm_mod If both the "b32" and "b64" audit rules are not defined for the "chown", "fchown", "fchownat",
      and "lchown" system calls, this is a finding.'
    multi_check: null
    negate: null
