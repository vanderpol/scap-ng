  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258161r958416_rule
  version: 1
  description: RHEL 9 must label all offloaded audit logs before sending them to the central log server.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:72301
    exports: []
    inline_content: 'Verify that RHEL 9 Audit Daemon is configured to label all offloaded audit logs, with the following command:
      $ sudo grep name_format /etc/audit/auditd.conf name_format = hostname If the "name_format" option is not "hostname",
      "fqd", or "numeric", or the line is commented out, this is a finding.'
