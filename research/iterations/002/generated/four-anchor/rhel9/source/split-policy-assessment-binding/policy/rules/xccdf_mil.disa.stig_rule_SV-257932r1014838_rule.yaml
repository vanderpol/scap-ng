  fix: 'Restore the SELinux policy for the affected device file from the system policy database using the following command:
    $ sudo restorecon -v <device_path> Substitute "<device_path>" with the path to the affected device file (from the output
    of the previous commands). An example device file path would be "/dev/ttyUSB0". If the output of the above command does
    not indicate that the device was relabeled to a more specific SELinux type label, then the SELinux policy of the system
    must be updated with more specific policy for the device class specified. If a package was used to install support for
    a device class, that package could be reinstalled using the following command: $ sudo dnf reinstall <package_name> If
    a package was not used to install the SELinux policy for a given device class, then it must be generated manually and
    provide specific type labels.'
