        namespace: http://checklists.nist.gov/xccdf/1.2
      - name: check-content
        namespace: http://checklists.nist.gov/xccdf/1.2
        text: 'Verify RHEL 9 is set to use a FIPS 140-3-compliant systemwide cryptographic policy with the following command:


          $ update-crypto-policies --show


          FIPS


          If the systemwide crypto policy is not set to "FIPS", this is a finding.


          Note: If subpolicies have been configured, they could be listed in a colon-separated list starting with "FIPS" as
          follows FIPS:<SUBPOLICY-NAME>. This is not a finding.


          Note: Subpolicies like AD-SUPPORT must be configured according to the latest guidance from the operating system
          vendor.


          Verify the current minimum crypto-policy configuration with the following commands:


          $ grep -E ''rsa_size|hash'' /etc/crypto-policies/state/CURRENT.pol


          hash = SHA2-256 SHA2-384 SHA2-512 SHA2-224 SHA3-256 SHA3-384 SHA3-512 SHAKE-256

          min_rsa_size = 2048


          If the "hash" values do not include at least the following FIPS 140-3-compliant algorithms "SHA2-256 SHA2-384 SHA2-512
          SHA2-224 SHA3-256 SHA3-384 SHA3-512 SHAKE-256", this is a finding.


          If there are algorithms that include "SHA1" or a hash value less than "224" this is a finding.


          If the "min_rsa_size" is not set to a value of at least "2048", this is a finding.


          If these commands do not return any output, this is a finding.'
      name: check
      namespace: http://checklists.nist.gov/xccdf/1.2
    system: http://scap.nist.gov/schema/ocil/2
