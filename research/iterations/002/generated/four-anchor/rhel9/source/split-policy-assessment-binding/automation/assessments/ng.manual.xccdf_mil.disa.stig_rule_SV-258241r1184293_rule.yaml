assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258241r1184293_rule
  version: 1
  description: RHEL 9 must implement a FIPS 140-3-compliant systemwide cryptographic policy.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:86901
    exports: []
    inline_content: 'Verify RHEL 9 is set to use a FIPS 140-3-compliant systemwide cryptographic policy with the following
      command: $ update-crypto-policies --show FIPS If the systemwide crypto policy is not set to "FIPS", this is a finding.
      Note: If subpolicies have been configured, they could be listed in a colon-separated list starting with "FIPS" as follows
      FIPS:<SUBPOLICY-NAME>. This is not a finding. Note: Subpolicies like AD-SUPPORT must be configured according to the
      latest guidance from the operating system vendor. Verify the current minimum crypto-policy configuration with the following
      commands: $ grep -E ''rsa_size|hash'' /etc/crypto-policies/state/CURRENT.pol hash = SHA2-256 SHA2-384 SHA2-512 SHA2-224
      SHA3-256 SHA3-384 SHA3-512 SHAKE-256 min_rsa_size = 2048 If the "hash" values do not include at least the following
      FIPS 140-3-compliant algorithms "SHA2-256 SHA2-384 SHA2-512 SHA2-224 SHA3-256 SHA3-384 SHA3-512 SHAKE-256", this is
      a finding. If there are algorithms that include "SHA1" or a hash value less than "224" this is a finding. If the "min_rsa_size"
      is not set to a value of at least "2048", this is a finding. If these commands do not return any output, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
      children:
