  fix: 'Note: This setting must be applied in conjunction with RHEL-09-255095 to function correctly. Configure the SSH server
    to terminate a user session automatically after the SSH client has been unresponsive for 10 minutes. Modify or append
    the following lines in the "/etc/ssh/sshd_config" or in a file in "/etc/ssh/sshd_config.d": ClientAliveInterval 600 For
    the changes to take effect, the SSH daemon must be restarted. $ sudo systemctl restart sshd.service'
  source_xccdf_tree:
    attributes:
      id: xccdf_mil.disa.stig_rule_SV-257996r1134915_rule
      severity: medium
