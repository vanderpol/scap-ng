rule:
  id: xccdf_mil.disa.stig_rule_SV-257996r1134915_rule
  title: RHEL 9 must be configured so that all network connections associated with SSH traffic are terminated after 10 minutes
    of becoming unresponsive.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
