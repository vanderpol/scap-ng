          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify the group ownership of the "/etc/ssh/sshd_config" file and the contents of "/etc/ssh/sshd_config.d"
            with the following command:


            $ sudo find /etc/ssh/sshd_config /etc/ssh/sshd_config.d -exec stat -c "%G %n" {} \;


            root /etc/ssh/sshd_config

            root /etc/ssh/sshd_config.d

            root /etc/ssh/sshd_config.d/50-cloud-init.conf

            root /etc/ssh/sshd_config.d/50-redhat.conf


            If the "/etc/ssh/sshd_config" file or "/etc/ssh/sshd_config.d" or any files in the sshd_config.d directory do
            not have a group owner of "root", this is a finding.'
