            text: RHEL 9 system commands must have mode 755 or less permissive.
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'If RHEL 9 allowed any user to make changes to software libraries, then those changes might be implemented
              without undergoing the appropriate testing and approvals that are part of a robust change management process.


              This requirement applies to RHEL 9 with software libraries that are accessible and configurable, as in the case
              of interpreted languages. Software libraries also include privileged programs that execute with escalated privileges.'
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
