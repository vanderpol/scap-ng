              text: Red Hat Enterprise Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: Kernel core dumps may contain the full contents of system memory at the time of the crash. Kernel core dumps
              consume a considerable amount of disk space and may result in denial of service by exhausting the available
              space on the target file system partition. Unless the system is used for kernel development or testing, there
              is little need to run the kdump service.
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
