              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Red Hat Enterprise Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'Removing the "tftp-server" package decreases the risk of the accidental (or intentional) activation of
              tftp services.


              If TFTP is required for operational support (such as transmission of router configurations), its use must be
              documented with the information systems security manager (ISSM), restricted to only authorized personnel, and
              have access control rules established.


              Restricting TFTP to a specific directory prevents remote users from copying, transferring, or overwriting system
              files.'
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
