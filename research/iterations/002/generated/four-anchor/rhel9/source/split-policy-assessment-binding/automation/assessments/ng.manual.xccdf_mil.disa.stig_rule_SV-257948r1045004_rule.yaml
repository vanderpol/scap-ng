        namespace: http://checklists.nist.gov/xccdf/1.2
        text: 'Note: If the system is running in a cloud platform and the cloud provider gives a single, highly available
          IP address for DNS configuration, this control is Not Applicable.


          Verify the name servers used by the system with the following command:


          $ grep nameserver /etc/resolv.conf


          nameserver 192.168.1.2

          nameserver 192.168.1.3


          If fewer than two lines are returned that are not commented out, this is a finding.'
      name: check
      namespace: http://checklists.nist.gov/xccdf/1.2
    system: http://scap.nist.gov/schema/ocil/2
