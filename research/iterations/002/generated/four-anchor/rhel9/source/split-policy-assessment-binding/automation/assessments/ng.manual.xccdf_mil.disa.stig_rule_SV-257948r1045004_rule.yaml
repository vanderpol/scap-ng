assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-257948r1045004_rule
  version: 1
  description: RHEL 9 systems using Domain Name Servers (DNS) resolution must have at least two name servers configured.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:33501
    exports: []
    inline_content: 'Note: If the system is running in a cloud platform and the cloud provider gives a single, highly available
      IP address for DNS configuration, this control is Not Applicable. Verify the name servers used by the system with the
      following command: $ grep nameserver /etc/resolv.conf nameserver 192.168.1.2 nameserver 192.168.1.3 If fewer than two
      lines are returned that are not commented out, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
