scap_ng: 0.1-prototype
prototype: true
rule:
  id: xccdf_mil.disa.stig_rule_SV-258171r1208777_rule
  title: RHEL 9 must allow only the information system security manager (ISSM) (or individuals or roles appointed by the ISSM)
    to select which auditable events are to be audited.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
