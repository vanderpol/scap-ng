  check: 'Verify that the files in directory "/etc/audit/rules.d/" and "/etc/audit/auditd.conf" file have a mode of "0600"
    or less permissive with the following command: $ sudo find /etc/audit/rules.d/ /etc/audit/audit.rules /etc/audit/auditd.conf
    -type f -exec stat -c "%a %n" {} \; 600 /etc/audit/rules.d/audit.rules 600 /etc/audit/audit.rules 600 /etc/audit/auditd.conf
    If the audit configuration files have a mode more permissive than "0600", this is a finding.'
