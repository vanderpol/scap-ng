  description: '<VulnDiscussion>Use of weak or untested encryption algorithms undermines the purposes of using encryption
    to protect data. The operating system must implement cryptographic modules adhering to the higher standards approved by
    the federal government because this provides assurance they have been tested and validated. Satisfies: SRG-OS-000033-GPOS-00014,
    SRG-OS-000125-GPOS-00065, SRG-OS-000250-GPOS-00093, SRG-OS-000393-GPOS-00173, SRG-OS-000394-GPOS-00174, SRG-OS-000396-GPOS-00176,
    SRG-OS-000423-GPOS-00187, SRG-OS-000478-GPOS-00223</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
