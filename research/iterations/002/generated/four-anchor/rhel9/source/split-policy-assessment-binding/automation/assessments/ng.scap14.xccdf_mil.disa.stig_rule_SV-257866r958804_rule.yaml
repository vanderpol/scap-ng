      exports: []
      inline_content: 'Verify "/tmp" is mounted with the "nodev" option: $ mount | grep /tmp /dev/mapper/rhel-tmp on /tmp
        type xfs (rw,nodev,nosuid,noexec,seclabel) If the "/tmp" file system is mounted without the "nodev" option, this is
        a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
