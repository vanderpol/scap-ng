assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-257784r1208766_rule
  version: 1
  description: The systemd Ctrl-Alt-Delete burst key sequence in RHEL 9 must be disabled.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:1301
    exports: []
    inline_content: 'Verify RHEL 9 is configured to not reboot the system when Ctrl-Alt-Delete is pressed seven times within
      two seconds with the following command: $ sudo grep -iR CtrlAltDelBurstAction /etc/systemd/system* /etc/systemd/system.conf.d/55-CtrlAltDel-BurstAction.conf:CtrlAltDelBurstAction=none
      If the "CtrlAltDelBurstAction" is not set to "none", is commented out, or is missing, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
