  description: RHEL 9 must be configured so that the cryptographic hashes of system files match vendor values.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:9101
    exports: []
    inline_content: 'Verify RHEL 9 is configured so that the cryptographic hashes of system files match vendor values. List
      files on the system that have file hashes different from what is expected by the RPM database with the following command:
      $ sudo rpm -Va --noconfig | awk ''$1 ~ /..5/ && $2 != "c"'' If there is output, this is a finding.'
