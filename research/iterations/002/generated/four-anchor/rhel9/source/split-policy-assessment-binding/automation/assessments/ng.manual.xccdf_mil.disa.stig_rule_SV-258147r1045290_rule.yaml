assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258147r1045290_rule
  version: 1
  description: RHEL 9 must encrypt the transfer of audit records offloaded onto a different system or media from the system
    being audited via rsyslog.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:69501
    exports: []
    inline_content: 'Verify RHEL 9 encrypts audit records offloaded onto a different system or media from the system being
      audited via rsyslog with the following command: $ grep -i ''StreamDriver[\.]*Mode'' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
      /etc/rsyslog.conf:$ActionSendStreamDriverMode 1 If the value of the "$ActionSendStreamDriverMode or StreamDriver.Mode"
      option is not set to "1" or the line is commented out, this is a finding. If the variable name "StreamDriverAuthMode"
      is present in an omfwd statement block, this is not a finding. However, if the "StreamDriverAuthMode" variable is in
      a module block, this is a finding.'
