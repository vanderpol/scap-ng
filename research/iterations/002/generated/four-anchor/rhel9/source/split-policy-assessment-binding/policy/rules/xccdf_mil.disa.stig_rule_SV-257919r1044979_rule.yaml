rule:
  id: xccdf_mil.disa.stig_rule_SV-257919r1044979_rule
  title: RHEL 9 system commands must be group-owned by root or a system account.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
