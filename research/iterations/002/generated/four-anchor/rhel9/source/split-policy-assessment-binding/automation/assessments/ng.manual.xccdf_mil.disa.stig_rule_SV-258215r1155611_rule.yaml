assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258215r1155611_rule
  version: 1
  description: Successful/unsuccessful uses of the umount system call in RHEL 9 must generate an audit record.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:82901
    exports: []
    inline_content: 'Verify RHEL 9 generates an audit record for all uses of the "umount" and system call with the following
      command: $ sudo auditctl -l | grep b32 | grep ''umount\b'' -a always,exit -F arch=b32 -S umount -F auid>=1000 -F auid!=-1
      -F key=privileged-umount If the command does not return a line, or the line is commented out, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
      children:
