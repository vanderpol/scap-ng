        metadata:
          children:
          - name: title
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: RHEL 9 must enable a user session lock until that user re-establishes access using established identification
              and authentication procedures for graphical user sessions.
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'A session lock is a temporary action taken when a user stops work and moves away from the immediate physical
              vicinity of the information system but does not want to log out because of the temporary nature of the absence.


              The session lock is implemented at the point where session activity can be determined.


              Regardless of where the session lock is determined and implemented, once invoked, the session lock must remain
              in place until the user reauthenticates. No other activity aside from reauthentication must unlock the system.'
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
