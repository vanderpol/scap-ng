        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:37101
      exports: []
      inline_content: 'Verify RHEL 9 limits the number of bogus Internet Control Message Protocol (ICMP) response errors logs.
        Check the value of the "net.ipv4.icmp_ignore_bogus_error_response" variables with the following command: $ sudo sysctl
        net.ipv4.icmp_ignore_bogus_error_responses net.ipv4.icmp_ignore_bogus_error_responses = 1 If "net.ipv4.icmp_ignore_bogus_error_response"
        is not set to "1" or is missing, this is a finding.'
      multi_check: null
      negate: null
