              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Red Hat Enterprise Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: Some routers will send responses to broadcast frames that violate RFC-1122, which fills up a log file system
              with many useless error messages. An attacker may take advantage of this and attempt to flood the logs with
              bogus error logs. Ignoring bogus ICMP error responses reduces log size, although some activity would not be
              logged.
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
