assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258035r1045125_rule
  version: 1
  description: RHEL 9 must have the USBGuard package installed.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:49701
    exports: []
    inline_content: 'Verify USBGuard is installed on the operating system with the following command: $ sudo dnf list installed
      usbguard Example output: Installed Packages usbguard.x86_64 1.0.0-10.el9_1.2 @rhel-9-for-x86_64-appstream-rpms If the
      USBGuard package is not installed, ask the SA to indicate how unauthorized peripherals are being blocked. If there is
      no evidence that unauthorized peripherals are being blocked before establishing a connection, this is a finding. If
      the system is virtual machine with no virtual or physical USB peripherals attached, this is not a finding.'
    multi_check: null
    negate: null
