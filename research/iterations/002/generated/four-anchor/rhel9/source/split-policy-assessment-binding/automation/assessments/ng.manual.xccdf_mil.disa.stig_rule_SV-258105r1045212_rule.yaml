  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258105r1045212_rule
  version: 1
  description: RHEL 9 passwords must have a 24 hours minimum password lifetime restriction in /etc/shadow.
  method: manual_or_external_check
  source_checks:
  - content_refs:
