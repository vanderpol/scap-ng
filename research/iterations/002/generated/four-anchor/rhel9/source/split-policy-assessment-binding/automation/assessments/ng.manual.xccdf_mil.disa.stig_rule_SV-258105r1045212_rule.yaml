    exports: []
    inline_content: 'Verify that RHEL 9 has configured the minimum time period between password changes for each user account
      as one day or greater with the following command: $ sudo awk -F: ''$4 < 1 {printf "%s %d\n", $1, $4}'' /etc/shadow If
      any results are returned that are not associated with a system account, this is a finding.'
