  version: 1
  description: RHEL 9 must automatically lock the root account until the root account is released by an administrator when
    three unsuccessful logon attempts occur during a 15-minute time period.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
