    exports: []
    inline_content: 'Verify RHEL 9 is configured to lock the root account after three unsuccessful logon attempts with the
      command: $ sudo grep even_deny_root /etc/security/faillock.conf even_deny_root If the "even_deny_root" option is not
      set or is missing or commented out, this is a finding.'
