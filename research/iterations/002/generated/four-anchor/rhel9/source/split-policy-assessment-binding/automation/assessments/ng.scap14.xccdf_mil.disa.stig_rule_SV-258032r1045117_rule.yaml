          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Note: This requirement assumes the use of the RHEL 9 default graphical user interface, the GNOME desktop\
            \ environment. If the system does not have any graphical user interface installed, this requirement is Not Applicable.\n\
            \nVerify that users cannot enable the Ctrl-Alt-Del sequence in the GNOME desktop with the following command:\n\
            \n$ gsettings writable org.gnome.settings-daemon.plugins.media-keys logout\n \nfalse\n \nIf \"logout\" is writable\
            \ and the result is \"true\", this is a finding."
        name: check
