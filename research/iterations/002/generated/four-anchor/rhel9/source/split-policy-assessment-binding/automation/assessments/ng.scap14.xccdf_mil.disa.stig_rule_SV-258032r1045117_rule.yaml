        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:49101
      exports: []
      inline_content: 'Note: This requirement assumes the use of the RHEL 9 default graphical user interface, the GNOME desktop
        environment. If the system does not have any graphical user interface installed, this requirement is Not Applicable.
        Verify that users cannot enable the Ctrl-Alt-Del sequence in the GNOME desktop with the following command: $ gsettings
        writable org.gnome.settings-daemon.plugins.media-keys logout false If "logout" is writable and the result is "true",
        this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
