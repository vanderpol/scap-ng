              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Red Hat Enterprise Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'ICMP redirect messages are used by routers to inform hosts that a more direct route exists for a particular
              destination. These messages modify the host''s route table and are unauthenticated. An illicit ICMP redirect
              message could result in a man-in-the-middle attack.


              This feature of the IPv4 protocol has few legitimate uses. It must be disabled unless absolutely required.'
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
