        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:14501
      exports: []
      inline_content: 'Verify "/home" is mounted with the "nodev" option with the following command: Note: If a separate file
        system has not been created for the user home directories (user home directories are mounted under "/"), this is automatically
        a finding, as the "nodev" option cannot be used on the "/" system. $ mount | grep /home tmpfs on /home type xfs (rw,nodev,nosuid,noexec,seclabel)
        If the "/home" file system is mounted without the "nodev" option, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:14501
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify "/home" is mounted with the "nodev" option with the following command:


            Note: If a separate file system has not been created for the user home directories (user home directories are
            mounted under "/"), this is automatically a finding, as the "nodev" option cannot be used on the "/" system.


            $ mount | grep /home


            tmpfs on /home type xfs (rw,nodev,nosuid,noexec,seclabel)


            If the "/home" file system is mounted without the "nodev" option, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
