      exports: []
      inline_content: 'Verify that RHEL 9 disables the ability to load the CAN kernel module with the following command: $
        grep -r can /etc/modprobe.conf /etc/modprobe.d/* install can /bin/false blacklist can If the command does not return
        any output, or the lines are commented out, and use of CAN is not documented with the information system security
        officer (ISSO) as an operational requirement, this is a finding.'
      multi_check: null
