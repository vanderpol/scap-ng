        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify that RHEL 9 disables the ability to load the CAN kernel module with the following command:\n\n$ grep\
            \ -r can /etc/modprobe.conf /etc/modprobe.d/* \n\ninstall can /bin/false\nblacklist can\n\nIf the command does\
