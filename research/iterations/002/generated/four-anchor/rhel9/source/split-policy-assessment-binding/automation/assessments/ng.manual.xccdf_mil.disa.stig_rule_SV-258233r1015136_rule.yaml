assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258233r1015136_rule
  version: 1
  description: RHEL 9 pam_unix.so module must be configured in the password-auth file to use a FIPS 140-3 approved cryptographic
    hashing algorithm for system authentication.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:86301
    exports: []
    inline_content: 'Verify that the pam_unix.so module is configured to use sha512 in /etc/pam.d/password-auth with the following
      command: $ grep "^password.*pam_unix.so.*sha512" /etc/pam.d/password-auth password sufficient pam_unix.so sha512 If
      "sha512" is missing, or the line is commented out, this is a finding. If the system administrator (SA) can demonstrate
      that the required configuration is contained in a PAM configuration file included or substacked from the system-auth
      file, this is not a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
