          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'Responding to broadcast (ICMP) echoes facilitates network mapping and provides a vector for amplification
              attacks.


              Ignoring ICMP echo requests (pings) sent to broadcast or multicast addresses makes the system slightly more
              difficult to enumerate on the network.'
          name: metadata
