        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:8701
      exports: []
      inline_content: 'Verify that dnf always checks the GPG signature of locally installed software packages before installation:
        $ grep localpkg_gpgcheck /etc/dnf/dnf.conf localpkg_gpgcheck=1 If "localpkg_gpgcheck" is not set to "1", or if the
        option is missing or commented out, ask the system administrator how the GPG signatures of local software packages
        are being verified. If there is no process to verify GPG signatures that is approved by the organization, this is
        a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
