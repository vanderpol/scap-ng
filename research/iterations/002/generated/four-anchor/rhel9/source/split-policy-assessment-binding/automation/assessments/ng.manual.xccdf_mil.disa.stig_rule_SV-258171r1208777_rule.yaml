  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258171r1208777_rule
  version: 1
  description: RHEL 9 must allow only the information system security manager (ISSM) (or individuals or roles appointed by
    the ISSM) to select which auditable events are to be audited.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:74301
    exports: []
    inline_content: 'Verify that the files in directory "/etc/audit/rules.d/" and "/etc/audit/auditd.conf" file have a mode
      of "0600" or less permissive with the following command: $ sudo find /etc/audit/rules.d/ /etc/audit/audit.rules /etc/audit/auditd.conf
      -type f -exec stat -c "%a %n" {} \; 600 /etc/audit/rules.d/audit.rules 600 /etc/audit/audit.rules 600 /etc/audit/auditd.conf
      If the audit configuration files have a mode more permissive than "0600", this is a finding.'
