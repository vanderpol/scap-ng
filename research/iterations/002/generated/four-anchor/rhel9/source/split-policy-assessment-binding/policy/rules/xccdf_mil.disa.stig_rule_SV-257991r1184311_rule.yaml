rule:
  id: xccdf_mil.disa.stig_rule_SV-257991r1184311_rule
  title: The RHEL 9 SSH server must be configured to use only Message Authentication Codes (MACs) employing FIPS 140-3 validated
    cryptographic hash algorithms to protect the confidentiality of SSH server connections.
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
