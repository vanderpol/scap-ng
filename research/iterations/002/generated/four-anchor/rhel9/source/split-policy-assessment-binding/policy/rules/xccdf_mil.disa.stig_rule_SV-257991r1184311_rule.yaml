  group_path:
  - xccdf_mil.disa.stig_group_V-257991
  description: <VulnDiscussion>Without cryptographic integrity protections, information can be altered by unauthorized users
    without detection. Remote access (e.g., RDP) is access to DOD nonpublic information systems by an authorized user (or
    an information system) communicating through an external, nonorganization-controlled network. Remote access methods include,
    for example, dial-up, broadband, and wireless. Cryptographic mechanisms used for protecting the integrity of information
    include, for example, signed hash functions using asymmetric cryptography enabling distribution of the public key to verify
    the hash information while maintaining the confidentiality of the secret key used to generate the hash. RHEL 9 incorporates
    systemwide crypto policies by default. The SSH configuration file has no effect on the ciphers, MACs, or algorithms unless
    specifically defined in the /etc/sysconfig/sshd file. The employed algorithms can be viewed in the /etc/crypto-policies/back-ends/opensshserver.config
    file.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
