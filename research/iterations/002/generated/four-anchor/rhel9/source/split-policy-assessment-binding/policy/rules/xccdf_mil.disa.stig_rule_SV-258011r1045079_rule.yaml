  fix: 'Configure the SSH daemon to prevent remote hosts from connecting to the proxy display. Add the following line to "/etc/ssh/sshd_config"
    or to a file in "/etc/ssh/sshd_config.d", or uncomment the line and set the value to "yes": X11UseLocalhost yes The SSH
    service must be restarted for changes to take effect: $ sudo systemctl restart sshd.service'
