  check: 'Verify the SSH daemon prevents remote hosts from connecting to the proxy display with the following command: $ sudo
    /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo grep -iH ''^\s*x11uselocalhost''
    X11UseLocalhost yes If the "X11UseLocalhost" keyword is set to "no", is missing, or is commented out, this is a finding.'
