        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:72701
      exports: []
      inline_content: 'Verify that RHEL 9 is configured to notify the SA and/or ISSO (at a minimum) in the event of an audit
        processing failure with the following command: $ sudo grep action_mail_acct /etc/audit/auditd.conf action_mail_acct
        = root If the value of the "action_mail_acct" keyword is not set to "root" and/or other accounts for security personnel,
        the "action_mail_acct" keyword is missing, or the retuned line is commented out, ask the SA to indicate how they and
        the ISSO are notified of an audit process failure. If there is no evidence of the proper personnel being notified
        of an audit processing failure, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:72701
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify that RHEL 9 is configured to notify the SA and/or ISSO (at a minimum) in the event of an audit processing
            failure with the following command:


            $ sudo grep action_mail_acct /etc/audit/auditd.conf


            action_mail_acct = root


            If the value of the "action_mail_acct" keyword is not set to "root" and/or other accounts for security personnel,
            the "action_mail_acct" keyword is missing, or the retuned line is commented out, ask the SA to indicate how they
            and the ISSO are notified of an audit process failure. If there is no evidence of the proper personnel being notified
            of an audit processing failure, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
