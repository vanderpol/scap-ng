            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "This requirement applies to wireless peripheral technologies (e.g., wireless mice, keyboards, displays,\
              \ etc.) used with OL 9 systems. Wireless peripherals (e.g., Wi-Fi/Bluetooth/IR keyboards, mice and pointing\
              \ devices, and near field communications [NFC]) present a unique challenge by creating an open, unsecured port\
              \ on a computer. Wireless peripherals must meet DOD requirements for wireless data transmission and be approved\
              \ for use by the authorizing official (AO). Even though some wireless peripherals, such as mice and pointing\
              \ devices, do not ordinarily carry information that need to be protected, modification of communications with\
              \ these wireless peripherals may be used to compromise the OL 9 operating system.\n\n\tSatisfies: SRG-OS-000095-GPOS-00049,\
              \ SRG-OS-000300-GPOS-00118"
          name: metadata
