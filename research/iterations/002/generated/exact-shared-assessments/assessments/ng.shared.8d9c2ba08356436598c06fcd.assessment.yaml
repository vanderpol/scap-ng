            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "A session time-out lock is a temporary action taken when a user stops work and moves away from the immediate\
              \ physical vicinity of the information system but does not logout because of the temporary nature of the absence.\
              \ Rather than relying on the user to manually lock their operating system session prior to vacating the vicinity,\
              \ the GNOME desktop can be configured to identify when a user's session has idled and take action to initiate\
              \ the session lock. As such, users should not be allowed to change session settings.\n\n\tSatisfies: SRG-OS-000029-GPOS-00010,\
              \ SRG-OS-000031-GPOS-00012"
