              text: Oracle Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: SSH provides several logging levels with varying amounts of verbosity. "DEBUG" is specifically not recommended
              other than strictly for debugging SSH communications since it provides so much data that it is difficult to
              identify important security information. "INFO" or "VERBOSE" level is the basic level that only records login
              activity of SSH users. In many situations, such as Incident Response, it is important to determine when a particular
              user was active on a system. The logout record can eliminate those users who disconnected, which helps narrow
              the field.
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
