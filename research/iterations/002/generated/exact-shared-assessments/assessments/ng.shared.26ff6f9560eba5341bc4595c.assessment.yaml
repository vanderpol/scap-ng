          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: Some features may communicate with the vendor, sending system information or downloading data or components
              for the feature. Limiting this capability will prevent potentially sensitive information from being sent outside
              the enterprise. The "send required diagnostic data" option for Allow Diagnostic Data configures the lowest amount
              of data, effectively none outside of the Malicious Software Removal Tool (MSRT), Defender, and Diagnostic Data
              client settings. "Optional Diagnostic Data" sends basic diagnostic and usage data and may be required to support
              some Microsoft services.
