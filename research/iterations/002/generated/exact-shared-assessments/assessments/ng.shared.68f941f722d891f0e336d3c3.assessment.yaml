          - attributes:
              family: windows
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Microsoft Windows Server 2025
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: Registry entries for group policy settings can potentially be changed from the required configuration. This
              could occur as part of troubleshooting or by a malicious process on a compromised system. Enabling this setting
              and then selecting the "Process even if the Group Policy objects have not changed" option ensures the policies
              will be reprocessed even if none have been changed. This way, any unauthorized changes are forced to match the
              domain-based group policy settings again.
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
        source_definition_id: oval:mil.disa.stig.windows2025:def:278092
