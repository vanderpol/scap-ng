            text: OL09-00-000805 - OL 9 must allow only the information system security manager (ISSM) (or individuals or
              roles appointed by the ISSM) to select which auditable events are to be audited.
          - attributes:
              family: unix
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
