            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "Without establishing what type of events occurred, it would be difficult to establish, correlate, and investigate\
              \ the events leading up to an outage or attack. Ensuring the \"auditd\" service is active ensures audit records\
              \ generated by the kernel are appropriately recorded.\n\n\tAdditionally, a properly configured audit subsystem\
