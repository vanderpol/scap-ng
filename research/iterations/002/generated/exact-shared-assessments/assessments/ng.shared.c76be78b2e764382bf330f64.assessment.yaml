            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "Use of a complex password helps to increase the time and resources required to compromise the password.\
              \ Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at\
              \ guessing and brute-force attacks. \n\n\tPassword complexity is one factor of several that determines how long\
              \ it takes to crack a password. The more complex the password, the greater the number of possible combinations\
              \ that need to be tested before the password is compromised. Requiring a minimum number of lowercase characters\
              \ makes password guessing attacks more difficult by ensuring a larger search space."
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
