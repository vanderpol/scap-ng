        metadata:
          children:
          - name: title
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: OL09-00-002393 - OL 9 must disable virtual system calls.
          - attributes:
              family: unix
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Oracle Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "System calls are special routines in the Linux kernel, which userspace applications ask to do privileged\
              \ tasks. Invoking a system call is an expensive operation because the processor must interrupt the currently\
              \ executing task and switch context to kernel mode and then back to userspace after the system call completes.\
              \ Virtual system calls map into user space a page that contains some variables and the implementation of some\
              \ system calls. This allows the system calls to be executed in userspace to alleviate the context switching\
              \ expense.\n\n\tVirtual system calls provide an opportunity of attack for a user who has control of the return\
              \ instruction pointer. Disabling virtual system calls help to prevent return-oriented programming (ROP) attacks\
              \ via buffer overflows and overruns. If the system intends to run containers based on OL 6 components, virtual\
              \ system calls will have to be enabled so the components function properly."
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
        source_definition_id: oval:mil.disa.stig.ol9os:def:271737
        version: '1'
