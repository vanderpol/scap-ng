            text: "Unauthorized disclosure of audit records can reveal system and configuration data to attackers, thus compromising\
              \ its confidentiality.\n\n\tAudit information includes all information (e.g., audit records, audit settings,\
              \ audit reports) needed to successfully audit OL 9 system activity.\n\n\tIn immutable mode, unauthorized users\
              \ cannot execute changes to the audit system to potentially hide malicious activity and then put the audit rules\
              \ back. A system reboot would be noticeable, and a system administrator could then investigate the unauthorized\
              \ changes.\n\n\tSatisfies: SRG-OS-000057-GPOS-00027, SRG-OS-000058-GPOS-00028, SRG-OS-000059-GPOS-00029"
