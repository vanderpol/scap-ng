            text: OL09-00-002403 - OL 9 debug-shell systemd service must be disabled.
          - attributes:
              family: unix
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Oracle Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: The debug-shell requires no authentication and provides root privileges to anyone who has physical access
              to the machine. While this feature is disabled by default, masking it adds an additional layer of assurance
              that it will not be enabled via a dependency in systemd. This also prevents attackers with physical access from
              trivially bypassing security on the machine through valid troubleshooting configurations and gaining root access
              when the system is rebooted.
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
