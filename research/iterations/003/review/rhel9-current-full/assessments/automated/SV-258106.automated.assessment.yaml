assessment:
  id: SV-258106.automated
  version: 1
  assessment_title: RHEL-09-611085 - RHEL 9 must require users to provide a password for privilege escalation.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/sudoers
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(?!#).*\s+NOPASSWD.*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
    independent-textfilecontent54-collection-2:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/sudoers.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^.*$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(?!#).*\s+NOPASSWD.*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
        recurse_direction: down
  tests:
    test-nopasswd-does-not-exist-in-etc-sudoers:
      test_title: '''NOPASSWD'' does not exist in /etc/sudoers'
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
    test-nopasswd-does-not-exist-in-etc-sudoers-d:
      test_title: '''NOPASSWD'' does not exist in /etc/sudoers.d'
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection-2
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
  evaluate:
    all:
    - test: test-nopasswd-does-not-exist-in-etc-sudoers
    - test: test-nopasswd-does-not-exist-in-etc-sudoers-d
