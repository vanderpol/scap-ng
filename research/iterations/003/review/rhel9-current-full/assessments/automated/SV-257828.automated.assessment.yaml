assessment:
  id: SV-257828.automated
  version: 1
  assessment_title: RHEL-09-215025 - RHEL 9 must not have the nfs-utils package installed.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    linux-rpminfo-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: nfs-utils
      object_title: null
  states: {}
  tests:
    test-nfs-utils-package-installed:
      test_title: nfs-utils package is installed
      capability: linux.rpminfo
      object: linux-rpminfo-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    not:
      test: test-nfs-utils-package-installed
