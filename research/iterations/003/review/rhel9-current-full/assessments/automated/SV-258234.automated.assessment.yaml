assessment:
  id: SV-258234.automated
  version: 1
  assessment_title: RHEL-09-672010 - RHEL 9 must have the crypto-policies package installed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-rpminfo-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          value: crypto-policies
      object_title: null
  states: {}
  tests:
    test-crypto-policies-package-installed:
      test_title: crypto-policies package is installed
      capability: linux.rpminfo
      object: linux-rpminfo-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    test: test-crypto-policies-package-installed
