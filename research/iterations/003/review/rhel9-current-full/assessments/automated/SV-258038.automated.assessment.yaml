assessment:
  id: SV-258038.automated
  version: 13
  assessment_title: RHEL 9 must block unauthorized peripherals before establishing a connection.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    retrieve-usbguard-rules-list-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: usbguard list-rules
      object_title: Retrieve usbguard rules list.
  states:
    state-confirm-the-existence-of-usbguard-rules:
      state_title: Confirm the existence of usbguard rules.
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: ''
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-verify-usbguard-has-policy-configured:
      test_title: Verify the USBGuard has a policy configured.
      capability: independent.shellcommand
      object: retrieve-usbguard-rules-list-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-confirm-the-existence-of-usbguard-rules
  evaluate:
    test: test-verify-usbguard-has-policy-configured
