assessment:
  id: SV-257864.automated
  version: 1
  assessment_title: RHEL-09-231115 - RHEL 9 must mount /dev/shm with the noexec option.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-partition-collection:
      collection_title: null
      select:
        mount_point:
          operation: equals
          datatype: string
          mask: false
          value: /dev/shm
    independent-textfilecontent54-collection:
      collection_title: null
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/fstab
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*[^#\s]+\s+/dev/shm\s+\S+\s+(\S+)\s+\S+\s+\S+\s*$
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
  tests:
    test-if-dev-shm-mounted-it-mounted-noexec-option:
      test_title: If /dev/shm is mounted, it is mounted with the noexec option
      capability: linux.partition
      collection: linux-partition-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: null
        state:
          field: mount_options
          value: noexec
          operation: equals
          datatype: string
          mask: false
          entity_check: at least one
          entity_existence: at_least_one_exists
    test-if-dev-shm-configured-in-etc-fstab-it-configured-noexec:
      test_title: If /dev/shm is configured in /etc/fstab, it is configured with the noexec option
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: null
        state:
          field: subexpression
          value: (?:^noexec$|^noexec,|,noexec$|,noexec,)
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-if-dev-shm-mounted-it-mounted-noexec-option
    - test: test-if-dev-shm-configured-in-etc-fstab-it-configured-noexec
