assessment:
  id: SV-258232.automated
  version: 1
  assessment_title: RHEL-09-671020 - RHEL 9 IP tunnels must use FIPS 140-2/140-3 approved cryptographic algorithms.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    etc-ipsec-conf-includes-collection:
      collection_title: /etc/ipsec.conf includes
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ipsec.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*include\s+(.*)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    etc-ipsec-d-conf-includes-collection:
      collection_title: /etc/ipsec.d/*.conf includes
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ipsec.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^.*\.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*include\s+(.*)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-ipsec-conf-includes-crypto-policy:
      test_title: ipsec.conf includes crypto-policy
      capability: independent.textfilecontent54
      collection: etc-ipsec-conf-includes-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: /etc/crypto-policies/back-ends/libreswan.config
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-ipsec-conf-includes-etc-ipsec-d-conf:
      test_title: ipsec.conf includes /etc/ipsec.d/*.conf
      capability: independent.textfilecontent54
      collection: etc-ipsec-conf-includes-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: /etc/ipsec.d/*.conf
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-etc-ipsec-d-conf-includes-crypto-policy:
      test_title: /etc/ipsec.d/*.conf includes crypto-policy
      capability: independent.textfilecontent54
      collection: etc-ipsec-d-conf-includes-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: /etc/crypto-policies/back-ends/libreswan.config
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    any:
    - test: test-ipsec-conf-includes-crypto-policy
    - all:
      - test: test-ipsec-conf-includes-etc-ipsec-d-conf
      - test: test-etc-ipsec-d-conf-includes-crypto-policy
