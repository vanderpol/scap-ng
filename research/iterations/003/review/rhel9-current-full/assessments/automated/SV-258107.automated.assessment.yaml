  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection-2:
      collection_title: null
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/security/pwquality.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*minlen\s*=\s*(-?\d*)\s*(?:#.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-textfilecontent54-collection-3:
      collection_title: null
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/security/pwquality.conf.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: \.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*minlen\s*=\s*(-?\d*)\s*(?:#.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        recurse_direction: down
    independent-textfilecontent54-collection:
      collection_title: null
      set:
        operator: union
        members:
        - collection: independent-textfilecontent54-collection-2
        - collection: independent-textfilecontent54-collection-3
  tests:
