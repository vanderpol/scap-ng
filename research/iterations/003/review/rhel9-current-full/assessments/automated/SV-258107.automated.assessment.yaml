        state_title: null
        state:
          field: subexpression
          value: '15'
          operation: greater than or equal
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-passwords-have-minimum-15-characters
