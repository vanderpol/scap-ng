assessment:
  id: SV-257810.automated
  version: 2
  assessment_title: RHEL-09-213075 - RHEL 9 must disable access to network bpf system call from nonprivileged processes.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    unix-sysctl-object:
      capability: unix.sysctl
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: kernel.unprivileged_bpf_disabled
      object_title: null
  states:
    state-unix-sysctl:
      state_title: null
      capability: unix.sysctl
      state:
        field: value
        value: '1'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-kernel-unprivileged-bpf-disabled-setting-in-kernel-set-1:
      test_title: kernel.unprivileged_bpf_disabled setting in kernel is set to 1
      capability: unix.sysctl
      object: unix-sysctl-object
      check_existence: all_exist
      check: all
      states:
      - state-unix-sysctl
  evaluate:
    test: test-kernel-unprivileged-bpf-disabled-setting-in-kernel-set-1
