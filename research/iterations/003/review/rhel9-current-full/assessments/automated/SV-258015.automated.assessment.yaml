assessment:
  id: SV-258015.automated
  version: 1
  assessment_title: RHEL-09-271025 - RHEL 9 must prevent a user from overriding the disabling of the graphical user
    interface automount function.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    check-that-etc-dconf-profile-user-system-db-at-minimum-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/dconf/profile/user
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*system-db\s*:\s*local\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: check that /etc/dconf/profile/user:system-db is at minimum set to local
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/dconf/db/local.d/locks
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^/org/gnome/desktop/media-handling/automount-open$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: null
  states: {}
  tests:
    test-check-that-etc-dconf-profile-user-system-db-at-minimum:
      test_title: check that /etc/dconf/profile/user:system-db is at minimum set to local
      capability: independent.textfilecontent54
      object: check-that-etc-dconf-profile-user-system-db-at-minimum-object
      check_existence: at_least_one_exists
      check: all
    test-org-gnome-desktop-media-handling-automount-open-in-etc-dconf:
      test_title: /org/gnome/desktop/media-handling/automount-open in /etc/dconf/db/local.d/locks/*
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    all:
    - test: test-check-that-etc-dconf-profile-user-system-db-at-minimum
    - test: test-org-gnome-desktop-media-handling-automount-open-in-etc-dconf
