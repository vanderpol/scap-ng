assessment:
  id: SV-257812.automated
  version: 1
  assessment_title: RHEL-09-213085 - RHEL 9 must disable core dump backtraces.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/systemd/coredump.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*ProcessSizeMax\s*=\s*(\w*)\s*(?:#.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-core-dump-backtraces-disabled:
      test_title: core dump backtraces are disabled
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          field: subexpression
          value: '0'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-core-dump-backtraces-disabled
