assessment:
  id: SV-258091.automated
  version: 2
  assessment_title: RHEL-09-611010 - RHEL 9 must ensure the password complexity module in the system-auth file is
    configured for three retries or less.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    in-etc-security-pwquality-conf-check-pam-pwquality-so-retry-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/security/pwquality.conf
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*retry\s*=\s*(-?\d*)\s*(?:#.*)?$
        instance:
          operation: equals
          datatype: int
          value: '1'
      object_title: in /etc/security/pwquality.conf check for pam_pwquality.so retry equals value
    in-etc-security-pwquality-conf-check-pam-pwquality-so-retry-object-2:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/security/pwquality.conf.d
        filename:
          operation: pattern match
          datatype: string
          value: \.conf$
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*retry\s*=\s*(-?\d*)\s*(?:#.*)?$
        instance:
          operation: equals
          datatype: int
          value: '1'
      behaviors:
        recurse_direction: down
      object_title: in /etc/security/pwquality.conf check for pam_pwquality.so retry equals value
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - object: in-etc-security-pwquality-conf-check-pam-pwquality-so-retry-object
        - object: in-etc-security-pwquality-conf-check-pam-pwquality-so-retry-object-2
      object_title: null
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^[123]$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-etc-security-pwquality-conf-retry-not-greater-than-3-not:
      test_title: /etc/security/pwquality.conf:retry not greater than 3 and not 0
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    test: test-etc-security-pwquality-conf-retry-not-greater-than-3-not
