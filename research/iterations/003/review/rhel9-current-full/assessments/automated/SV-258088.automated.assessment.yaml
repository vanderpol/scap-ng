assessment:
  id: SV-258088.automated
  version: 1
  assessment_title: RHEL-09-432035 - RHEL 9 must restrict the use of the "su" command.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/pam.d/su
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*auth\s+(?:required|requisite)\s+pam_wheel\.so(?:\s|$)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-users-members-wheel-group-run-su-command:
      test_title: Users must be members of the wheel group to run the su command.
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    test: test-users-members-wheel-group-run-su-command
