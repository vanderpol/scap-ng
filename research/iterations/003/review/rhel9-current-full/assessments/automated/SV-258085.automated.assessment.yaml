assessment:
  id: SV-258085.automated
  version: 1
  assessment_title: RHEL-09-432020 - RHEL 9 must use the invoking user's password for privilege escalation when
    using "sudo".
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    etc-sudoers-defaults-targetpw-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/sudoers
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*Defaults\s+!targetpw\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: /etc/sudoers Defaults !targetpw
    etc-sudoers-defaults-rootpw-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/sudoers
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*Defaults\s+!rootpw\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: /etc/sudoers Defaults !rootpw
    etc-sudoers-defaults-runaspw-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/sudoers
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*Defaults\s+!runaspw\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: /etc/sudoers Defaults !runaspw
    etc-sudoers-includedir-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/sudoers
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*[#@]includedir\s+(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: /etc/sudoers includedir
    etc-sudoers-d-config-files-excluding-files-ending-or-containing-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/sudoers.d
        filename:
          operation: pattern match
          datatype: string
          value: ^[^.]*[^.~]$
      object_title: /etc/sudoers.d config files, excluding files ending with ~ or containing .
    etc-sudoers-d-defaults-targetpw-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          variable_check: at least one
          value:
            variable: sudoers-d-config-files-variable
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*Defaults\s+!targetpw\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: /etc/sudoers.d Defaults !targetpw
    etc-sudoers-d-defaults-rootpw-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          variable_check: at least one
          value:
            variable: sudoers-d-config-files-variable
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*Defaults\s+!rootpw\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: /etc/sudoers.d Defaults !rootpw
    etc-sudoers-d-defaults-runaspw-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          variable_check: at least one
          value:
            variable: sudoers-d-config-files-variable
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*Defaults\s+!runaspw\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: /etc/sudoers.d Defaults !runaspw
  variables:
    sudoers-d-config-files-variable:
      title: sudoers.d config files
      kind: local
      datatype: string
      expression:
        values:
          object: etc-sudoers-d-config-files-excluding-files-ending-or-containing-object
          field: filepath
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: /etc/sudoers.d
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-defaults-targetpw-in-etc-sudoers:
      test_title: Defaults !targetpw in /etc/sudoers
      capability: independent.textfilecontent54
      object: etc-sudoers-defaults-targetpw-object
      check_existence: at_least_one_exists
      check: all
    test-defaults-rootpw-in-etc-sudoers:
      test_title: Defaults !rootpw in /etc/sudoers
      capability: independent.textfilecontent54
      object: etc-sudoers-defaults-rootpw-object
      check_existence: at_least_one_exists
      check: all
    test-defaults-runaspw-in-etc-sudoers:
      test_title: Defaults !runaspw in /etc/sudoers
      capability: independent.textfilecontent54
      object: etc-sudoers-defaults-runaspw-object
      check_existence: at_least_one_exists
      check: all
    test-etc-sudoers-d-included-in-etc-sudoers:
      test_title: /etc/sudoers.d included in /etc/sudoers
      capability: independent.textfilecontent54
      object: etc-sudoers-includedir-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-independent-textfilecontent54
    test-defaults-targetpw-in-etc-sudoers-d:
      test_title: Defaults !targetpw in /etc/sudoers.d
      capability: independent.textfilecontent54
      object: etc-sudoers-d-defaults-targetpw-object
      check_existence: at_least_one_exists
      check: all
    test-defaults-rootpw-in-etc-sudoers-d:
      test_title: Defaults !rootpw in /etc/sudoers.d
      capability: independent.textfilecontent54
      object: etc-sudoers-d-defaults-rootpw-object
      check_existence: at_least_one_exists
      check: all
    test-defaults-runaspw-in-etc-sudoers-d:
      test_title: Defaults !runaspw in /etc/sudoers.d
      capability: independent.textfilecontent54
      object: etc-sudoers-d-defaults-runaspw-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    any:
    - all:
      - test: test-defaults-targetpw-in-etc-sudoers
      - test: test-defaults-rootpw-in-etc-sudoers
      - test: test-defaults-runaspw-in-etc-sudoers
    - all:
      - test: test-etc-sudoers-d-included-in-etc-sudoers
      - test: test-defaults-targetpw-in-etc-sudoers-d
      - test: test-defaults-rootpw-in-etc-sudoers-d
      - test: test-defaults-runaspw-in-etc-sudoers-d
