      test_title: For the global domain, core is set to 0.
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          field: subexpression
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-if-core-set-any-specific-domains-it-set-0:
      test_title: If core is set for any specific domains, it is set to 0.
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection-4
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: null
        state:
          field: subexpression
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
