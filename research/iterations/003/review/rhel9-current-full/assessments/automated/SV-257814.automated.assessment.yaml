assessment:
  id: SV-257814.automated
  version: 3
  assessment_title: RHEL-09-213095 - RHEL 9 must disable core dumps for all users.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection-2:
      collection_title: null
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/security/limits.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[ \t]*\*[ \t]+(?:hard|soft|-)[ \t]+core[ \t]+(\d+)[ \t]*(?:#.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-textfilecontent54-collection-3:
      collection_title: null
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/security/limits.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: \.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[ \t]*\*[ \t]+(?:hard|soft|-)[ \t]+core[ \t]+(\d+)[ \t]*(?:#.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-textfilecontent54-collection:
      collection_title: null
      set:
        operator: union
        members:
        - collection: independent-textfilecontent54-collection-2
        - collection: independent-textfilecontent54-collection-3
    independent-textfilecontent54-collection-5:
      collection_title: null
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/security/limits.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[ \t]*[^#*\s]+[ \t]+(?:hard|soft|-)[ \t]+core[ \t]+(\d+)[ \t]*(?:#.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-textfilecontent54-collection-6:
      collection_title: null
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/security/limits.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: \.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[ \t]*[^#*\s]+[ \t]+(?:hard|soft|-)[ \t]+core[ \t]+(\d+)[ \t]*(?:#.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-textfilecontent54-collection-4:
      collection_title: null
