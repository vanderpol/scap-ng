assessment:
  id: SV-257942.automated
  version: 2
  assessment_title: RHEL-09-251045 - RHEL 9 must enable hardening for the Berkeley Packet Filter just-in-time compiler.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    unix-sysctl-object:
      capability: unix.sysctl
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: net.core.bpf_jit_harden
      object_title: null
  states:
    state-unix-sysctl:
      state_title: null
      capability: unix.sysctl
      state:
        field: value
        value: '2'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-net-core-bpf-jit-harden-set-2-in-kernel:
      test_title: net.core.bpf_jit_harden is set to 2 in kernel
      capability: unix.sysctl
      object: unix-sysctl-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-unix-sysctl
  evaluate:
    test: test-net-core-bpf-jit-harden-set-2-in-kernel
