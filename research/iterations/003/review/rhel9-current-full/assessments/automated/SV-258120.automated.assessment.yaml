assessment:
  id: SV-258120.automated
  version: 1
  assessment_title: RHEL-09-611155 - RHEL 9 must not have accounts configured with blank or null passwords.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/shadow
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: '^[^:]+::[^:]*:[^:]*:'
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: null
  states: {}
  tests:
    test-there-no-accounts-in-etc-shadow-that-have-blank-password:
      test_title: There are no accounts in /etc/shadow that have blank password fields.
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: none_exist
      check: all
  evaluate:
    test: test-there-no-accounts-in-etc-shadow-that-have-blank-password
