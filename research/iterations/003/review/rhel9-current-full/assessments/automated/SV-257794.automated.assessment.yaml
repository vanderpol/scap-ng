assessment:
  id: SV-257794.automated
  version: 2
  assessment_title: RHEL-09-212045 - RHEL 9 must clear memory when it is freed to prevent use-after-free attacks.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    bls-options-collection:
      collection_title: BLS options
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /boot/loader/entries
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^.*\.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^options\s+(.*)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    etc-default-grub-grub-cmdline-linux-collection:
      collection_title: /etc/default/grub GRUB_CMDLINE_LINUX
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/default/grub
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^GRUB_CMDLINE_LINUX="(.*)"
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-bls-options-contain-init-on-free-1:
      test_title: BLS options contain init_on_free=1
      capability: independent.textfilecontent54
      collection: bls-options-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          field: subexpression
          value: (^|\s)init_on_free=1(\s|$)
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-grub-cmdline-linux-arguments-in-etc-default-grub-contain-init:
      test_title: The GRUB_CMDLINE_LINUX arguments in /etc/default/grub contain init_on_free=1
      capability: independent.textfilecontent54
      collection: etc-default-grub-grub-cmdline-linux-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          field: subexpression
          value: (^|\s)init_on_free=1(\s|$)
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-bls-options-contain-init-on-free-1
    - test: test-grub-cmdline-linux-arguments-in-etc-default-grub-contain-init
