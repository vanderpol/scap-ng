assessment:
  id: SV-270180.automated
  version: 1
  assessment_title: RHEL-09-433016 - The RHEL 9 fapolicy module must be configured to employ a deny-all, permit-by-exception
    policy to allow the execution of authorized software programs.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/fapolicyd/fapolicyd.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*permissive\s*=\s*(\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: null
    last-non-whitespace-line-etc-fapolicyd-compiled-rules-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/fapolicyd/compiled.rules
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: (.*\S.*)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        multiline: 'false'
      object_title: The last non-whitespace line of /etc/fapolicyd/compiled.rules
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '0'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54-2:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: (?:^|\n)(?:deny|deny_log|deny_audit)[ \t]+perm=any[ \t]+all[ \t]+:[ \t]+all(?:$|\n)
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-etc-fapolicyd-fapolicyd-conf-permissive-0:
      test_title: '/etc/fapolicyd/fapolicyd.conf: permissive = 0'
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
    test-etc-fapolicyd-compiled-rules-deny-all:
      test_title: '/etc/fapolicyd/compiled.rules: deny all'
      capability: independent.textfilecontent54
      object: last-non-whitespace-line-etc-fapolicyd-compiled-rules-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54-2
  evaluate:
    all:
    - test: test-etc-fapolicyd-fapolicyd-conf-permissive-0
    - test: test-etc-fapolicyd-compiled-rules-deny-all
