assessment:
  id: SV-258029.automated
  version: 1
  assessment_title: RHEL-09-271095 - RHEL 9 must disable the ability of a user to restart the system from the login
    screen.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    dconf-database-directories-collection:
      collection_title: dconf database directories
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/dconf/db
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
      filters:
      - action: include
        match:
          field: path
          value: ^/etc/dconf/db/.*\.d$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: dconf database directories
        capability: unix.file
      behaviors:
        max_depth: '1'
        recurse_direction: down
    dconf-org-gnome-login-screen-sections-collection:
      collection_title: dconf org/gnome/login-screen sections
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: dconf-database-directories-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\[org/gnome/login-screen](?:\r?\n(?:[^[\r\n].*)?)*
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  variables:
    dconf-database-directories-variable:
      title: dconf database directories
      kind: local
      datatype: string
      expression:
        values:
          collection: dconf-database-directories-collection
          field: path
  tests:
    test-dconf-disable-restart-buttons-true:
      test_title: dconf disable-restart-buttons true
      capability: independent.textfilecontent54
      collection: dconf-org-gnome-login-screen-sections-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: text
          value: \ndisable-restart-buttons=(true|'true')\s*(\n|$)
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-dconf-disable-restart-buttons-true
