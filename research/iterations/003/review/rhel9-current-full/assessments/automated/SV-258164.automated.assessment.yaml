assessment:
  id: SV-258164.automated
  version: 1
  assessment_title: RHEL-09-653075 - RHEL 9 audit system must audit local events.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/auditd.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: (?i)^\s*local_events\s*=\s*(\w+)\s*(?:#.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: null
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: (?i)^yes$
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-etc-audit-auditd-conf-local-events-yes:
      test_title: '/etc/audit/auditd.conf: local_events = yes'
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    test: test-etc-audit-auditd-conf-local-events-yes
