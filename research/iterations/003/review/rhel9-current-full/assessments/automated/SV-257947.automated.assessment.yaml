assessment:
  id: SV-257947.automated
  version: 1
  assessment_title: RHEL-09-252030 - RHEL 9 must disable network management of the chrony daemon.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/chrony.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[ \t]*cmdport[ \t]+0[ \t]*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: null
  states: {}
  tests:
    test-etc-chrony-conf-cmdport-option-set-0:
      test_title: '/etc/chrony.conf: cmdport option is set to 0'
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    test: test-etc-chrony-conf-cmdport-option-set-0
