assessment:
  id: SV-257947.automated
  version: 1
  assessment_title: RHEL-09-252030 - RHEL 9 must disable network management of the chrony daemon.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/chrony.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[ \t]*cmdport[ \t]+0[ \t]*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-etc-chrony-conf-cmdport-option-set-0:
      test_title: '/etc/chrony.conf: cmdport option is set to 0'
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    test: test-etc-chrony-conf-cmdport-option-set-0
