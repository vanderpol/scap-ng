assessment:
  id: SV-257899.automated
  version: 1
  assessment_title: RHEL-09-232095 - RHEL 9 /etc/group file must be group-owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    unix-file-object:
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/group
      object_title: null
  states:
    state-group-owned-by-root:
      state_title: group-owned by root
      capability: unix.file
      state:
        field: group_id
        value: '0'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-etc-group-file-owned-by-root:
      test_title: /etc/group file is owned by root
      capability: unix.file
      object: unix-file-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-group-owned-by-root
  evaluate:
    test: test-etc-group-file-owned-by-root
