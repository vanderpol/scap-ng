assessment:
  id: SV-258222.automated
  version: 2
  assessment_title: RHEL-09-654240 - RHEL 9 must generate audit records for all account creations, modifications,
    disabling, and termination events that affect /etc/passwd.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/audit/audit.rules
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*-a\s+(always,exit|exit,always)\s+-F\s+arch=b32?\s+-F\s+path=/etc/passwd\s+-F\s*perm=([rx]*w[rx]*a[rx]*|[rx]*a[rx]*w[rx]*)(\s+(-k\s+|-F\s+key=)\S+)?\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
    independent-textfilecontent54-object-2:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/audit/audit.rules
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*-a\s+(always,exit|exit,always)\s+-F\s+arch=b64?\s+-F\s+path=/etc/passwd\s+-F\s*perm=([rx]*w[rx]*a[rx]*|[rx]*a[rx]*w[rx]*)(\s+(-k\s+|-F\s+key=)\S+)?\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states: {}
  tests:
    test-audit-32-bit-invocations-etc-passwd:
      test_title: Audit 32-bit invocations of /etc/passwd
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: all_exist
      check: all
    test-audit-64-bit-invocations-etc-passwd:
      test_title: Audit 64-bit invocations of /etc/passwd
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-2
      check_existence: all_exist
      check: all
  evaluate:
    all:
    - test: test-audit-32-bit-invocations-etc-passwd
    - test: test-audit-64-bit-invocations-etc-passwd
