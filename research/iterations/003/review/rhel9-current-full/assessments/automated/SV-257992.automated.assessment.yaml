assessment:
  id: SV-257992.automated
  version: 1
  assessment_title: RHEL-09-255080 - RHEL 9 must not allow a noncertificate trusted host SSH logon to the system.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection-2:
      collection_title: null
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(?i)\s*HostbasedAuthentication\s+(\w+)$
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
    independent-textfilecontent54-collection-3:
      collection_title: null
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^.+\.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(?i)\s*HostbasedAuthentication\s+(\w+)$
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
      behaviors:
        max_depth: '-1'
        recurse_direction: down
    independent-textfilecontent54-collection:
      collection_title: null
      set:
        operator: union
        members:
        - collection: independent-textfilecontent54-collection-2
        - collection: independent-textfilecontent54-collection-3
  tests:
    test-hostbasedauthentication-option-not-set-yes-in-etc-ssh-sshd-config:
      test_title: HostbasedAuthentication option is not set to yes in /etc/ssh/sshd_config and /etc/ssh/sshd_config.d/*.conf.
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          field: subexpression
          value: ^(no|"no")$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-hostbasedauthentication-option-not-set-yes-in-etc-ssh-sshd-config
