assessment:
  id: SV-258165.automated
  version: 1
  assessment_title: RHEL-09-653080 - RHEL 9 audit logs must be group-owned by root or by a restricted logging group
    to prevent unauthorized read access.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/auditd.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*log_file\s*=\s*(\S+)\s*(?:#.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    audit-log-file-location-collection:
      collection_title: Audit log file location
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: audit-data-directory-from-etc-audit-auditd-conf-variable
  variables:
    audit-data-directory-from-etc-audit-auditd-conf-variable:
      title: audit data directory from /etc/audit/auditd.conf
      kind: local
      datatype: string
      expression:
        values:
          collection: independent-textfilecontent54-collection
          field: subexpression
  tests:
    test-audit-logs-group-owned-by-root:
      test_title: audit logs are group-owned by root
      capability: unix.file
      collection: audit-log-file-location-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: group-owned by root
        state_capability: unix.file
        state:
          field: group_id
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-audit-logs-group-owned-by-root
