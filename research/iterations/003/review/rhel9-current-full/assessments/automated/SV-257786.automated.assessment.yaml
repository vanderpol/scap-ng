assessment:
  id: SV-257786.automated
  version: 1
  assessment_title: RHEL-09-211055 - RHEL 9 debug-shell systemd service must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-systemdunitproperty-collection:
      collection_title: null
      select:
        unit:
          operation: equals
          datatype: string
          mask: false
          value: debug-shell.service
        property:
          operation: equals
          datatype: string
          mask: false
          value: LoadState
    linux-systemdunitproperty-collection-2:
      collection_title: null
      select:
        unit:
          operation: equals
          datatype: string
          mask: false
          value: debug-shell.service
        property:
          operation: equals
          datatype: string
          mask: false
          value: UnitFileState
  tests:
    test-debug-shell-service-loadstate-masked-if-it-exists:
      test_title: debug-shell.service LoadState is masked if it exists.
      capability: linux.systemdunitproperty
      collection: linux-systemdunitproperty-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: null
        state:
          field: value
          value: masked
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-debug-shell-service-unitfilestate-masked-if-it-exists:
      test_title: debug-shell.service UnitFileState is masked if it exists.
      capability: linux.systemdunitproperty
      collection: linux-systemdunitproperty-collection-2
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: null
        state:
          field: value
          value: masked
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-debug-shell-service-loadstate-masked-if-it-exists
    - test: test-debug-shell-service-unitfilestate-masked-if-it-exists
