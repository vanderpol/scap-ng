assessment:
  id: SV-257786.automated
  version: 1
  assessment_title: RHEL-09-211055 - RHEL 9 debug-shell systemd service must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    linux-systemdunitproperty-object:
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          mask: false
          value: debug-shell.service
        property:
          operation: equals
          datatype: string
          mask: false
          value: LoadState
      object_title: null
    linux-systemdunitproperty-object-2:
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          mask: false
          value: debug-shell.service
        property:
          operation: equals
          datatype: string
          mask: false
          value: UnitFileState
      object_title: null
  states:
    state-linux-systemdunitproperty:
      state_title: null
      capability: linux.systemdunitproperty
      state:
        field: value
        value: masked
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-debug-shell-service-loadstate-masked-if-it-exists:
      test_title: debug-shell.service LoadState is masked if it exists.
      capability: linux.systemdunitproperty
      object: linux-systemdunitproperty-object
      check_existence: any_exist
      check: all
      states:
      - state-linux-systemdunitproperty
    test-debug-shell-service-unitfilestate-masked-if-it-exists:
      test_title: debug-shell.service UnitFileState is masked if it exists.
      capability: linux.systemdunitproperty
      object: linux-systemdunitproperty-object-2
      check_existence: any_exist
      check: all
      states:
      - state-linux-systemdunitproperty
  evaluate:
    all:
    - test: test-debug-shell-service-loadstate-masked-if-it-exists
    - test: test-debug-shell-service-unitfilestate-masked-if-it-exists
