assessment:
  id: SV-258143.automated
  version: 2
  assessment_title: RHEL-09-652025 - RHEL 9 must be configured so that the rsyslog daemon does not accept log messages
    from other servers unless the server is being used for log aggregation.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    rsyslog-conf-remote-log-acceptance-config-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/rsyslog.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: patterns-remote-log-acceptance-config-variable
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
      object_title: 'rsyslog.conf: remote log acceptance config'
    rsyslog-d-conf-remote-log-acceptance-config-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/rsyslog.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^.*\.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: patterns-remote-log-acceptance-config-variable
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
      object_title: 'rsyslog.d/*.conf: remote log acceptance config'
    remote-log-acceptance-config-object:
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - object: rsyslog-conf-remote-log-acceptance-config-object
        - object: rsyslog-d-conf-remote-log-acceptance-config-object
      object_title: remote log acceptance config
  variables:
    patterns-remote-log-acceptance-config-variable:
      title: Patterns for remote log acceptance config
      kind: constant
      datatype: string
      expression:
        literal:
        - ^[^#]*InputTCPServerRun
        - ^[^#]*UDPServerRun
        - ^[^#]*RELPServerRun
        - ^[^#]*module\s*\(.*\bload\s*=\s*"imtcp".*\)
        - ^[^#]*module\s*\(.*\bload\s*=\s*"imudp".*\)
        - ^[^#]*module\s*\(.*\bload\s*=\s*"imrelp".*\)
        - ^[^#]*input\s*\(.*\btype\b\s*=\s*"imtcp"\s*\bport\b\s*=\s*"514".*\)
        - ^[^#]*input\s*\(.*\btype\b\s*=\s*"imudp"\s*\bport\b\s*=\s*"514".*\)
        - ^[^#]*input\s*\(.*\btype\b\s*=\s*"imrelp"\s*\bport\b\s*=\s*"514".*\)
  states: {}
  tests:
    test-no-remote-log-acceptance:
      test_title: no remote log acceptance
      capability: independent.textfilecontent54
      object: remote-log-acceptance-config-object
      check_existence: none_exist
      check: all
  evaluate:
    test: test-no-remote-log-acceptance
