assessment:
  id: SV-270175.automated
  version: 1
  assessment_title: RHEL-09-232103 - RHEL 9 "/etc/audit/" must be owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    etc-audit-directory-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
      object_title: /etc/audit directory
  states:
    state-owned-by-root:
      state_title: owned by root
      capability: unix.file
      state:
        field: user_id
        value: '0'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-etc-audit-directory-owned-by-root:
      test_title: /etc/audit directory is owned by root
      capability: unix.file
      object: etc-audit-directory-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-owned-by-root
  evaluate:
    test: test-etc-audit-directory-owned-by-root
