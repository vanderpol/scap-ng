assessment:
  id: SV-270175.automated
  version: 1
  assessment_title: RHEL-09-232103 - RHEL 9 "/etc/audit/" must be owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    etc-audit-directory-collection:
      collection_title: /etc/audit directory
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
  tests:
    test-etc-audit-directory-owned-by-root:
      test_title: /etc/audit directory is owned by root
      capability: unix.file
      collection: etc-audit-directory-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: owned by root
        state:
          field: user_id
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-etc-audit-directory-owned-by-root
