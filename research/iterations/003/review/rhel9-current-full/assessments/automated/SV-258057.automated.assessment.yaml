assessment:
  id: SV-258057.automated
  version: 1
  assessment_title: RHEL-09-411090 - RHEL 9 must maintain an account lock until the locked account is released by
    an administrator.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/security/faillock.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*unlock_time\s*=\s*([\d]+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: null
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '0'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-unlock-time-set-0-in-etc-security-faillock-conf:
      test_title: unlock_time is set to 0 in /etc/security/faillock.conf
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: all_exist
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    test: test-unlock-time-set-0-in-etc-security-faillock-conf
