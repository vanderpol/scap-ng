assessment:
  id: SV-258057.automated
  version: 1
  assessment_title: RHEL-09-411090 - RHEL 9 must maintain an account lock until the locked account is released by
    an administrator.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/security/faillock.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*unlock_time\s*=\s*([\d]+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-unlock-time-set-0-in-etc-security-faillock-conf:
      test_title: unlock_time is set to 0 in /etc/security/faillock.conf
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: null
        state:
          field: subexpression
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-unlock-time-set-0-in-etc-security-faillock-conf
