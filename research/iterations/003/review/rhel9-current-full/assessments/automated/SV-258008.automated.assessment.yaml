assessment:
  id: SV-258008.automated
  version: 1
  assessment_title: RHEL-09-255160 - RHEL 9 SSH daemon must perform strict mode checking of home directory configuration
    files.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection-2:
      collection_title: null
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*(?i)StrictModes(?-i)[ \t]+([\w\"]+)[\s]*(?:|(?:#.*))?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-textfilecontent54-collection-3:
      collection_title: null
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .+
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*(?i)StrictModes(?-i)[ \t]+([\w\"]+)[\s]*(?:|(?:#.*))?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-textfilecontent54-collection:
      collection_title: null
      set:
        operator: union
        members:
        - collection: independent-textfilecontent54-collection-2
        - collection: independent-textfilecontent54-collection-3
  tests:
    test-etc-ssh-sshd-config-or-etc-ssh-sshd-config-d:
      test_title: /etc/ssh/sshd_config or /etc/ssh/sshd_config.d/*:StrictModes == yes
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          field: subexpression
          value: ^(yes|"yes")$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-etc-ssh-sshd-config-or-etc-ssh-sshd-config-d
