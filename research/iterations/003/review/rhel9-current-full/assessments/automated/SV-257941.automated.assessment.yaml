assessment:
  id: SV-257941.automated
  version: 1
  assessment_title: RHEL-09-251040 - RHEL 9 network interfaces must not be in promiscuous mode.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    all-interfaces-object:
      capability: unix.interface
      select:
        name:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
      object_title: All Interfaces
  states:
    state-interface-is-not-in-promisc-mode:
      state_title: Interface is not in PROMISC mode
      capability: unix.interface
      state:
        field: flag
        value: (^|\s)PROMISC(\s|$)
        operation: pattern match
        datatype: string
        mask: false
        entity_check: none satisfy
        entity_existence: at_least_one_exists
  tests:
    test-no-network-interfaces-in-promiscuous-mode:
      test_title: no network interfaces are in promiscuous mode
      capability: unix.interface
      object: all-interfaces-object
      check_existence: any_exist
      check: all
      states:
      - state-interface-is-not-in-promisc-mode
  evaluate:
    test: test-no-network-interfaces-in-promiscuous-mode
