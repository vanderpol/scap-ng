assessment:
  id: SV-258178.automated
  version: 1
  assessment_title: RHEL-09-654020 - RHEL 9 must audit all uses of the chown, fchown, fchownat, and lchown system
    calls.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    32-bit-chown-syscall-collection:
      collection_title: 32-bit chown syscall
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/audit.rules
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*-a\s+(always,exit|exit,always)\s+-F\s+arch=b32\s+(?:.*(-S\s+chown\s+|(\s+|,)chown(\s+|,))).*-F\s+auid>=1000\s+-F\s+auid!=(4294967295|-1|unset)(\s+(-k\s+|-F\s+key=)[-\w]+)*\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
