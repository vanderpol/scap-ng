assessment:
  id: SV-257809.automated
  version: 2
  assessment_title: RHEL-09-213070 - RHEL 9 must implement address space layout randomization (ASLR) to protect
    its memory from unauthorized code execution.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    unix-sysctl-collection:
      collection_title: null
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: kernel.randomize_va_space
  tests:
    test-kernel-randomize-va-space-setting-in-kernel-set-2:
      test_title: kernel.randomize_va_space setting in kernel is set to 2
      capability: unix.sysctl
      collection: unix-sysctl-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: null
        state:
          field: value
          value: '2'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-kernel-randomize-va-space-setting-in-kernel-set-2
