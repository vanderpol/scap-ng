assessment:
  id: SV-257999.automated
  version: 13
  assessment_title: RHEL 9 SSH server configuration files' permissions must not be modified.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    verify-permissions-etc-ssh-sshd-config-file-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: rpm --verify openssh-server | awk '! ($2 == "c" && $1 ~ /^.\..\.\.\.\..\./) {print $0}'
        pattern:
          operation: pattern match
          datatype: string
          value: .+
      object_title: Verify the permissions of the /etc/ssh/sshd_config file
  states:
    state-if-the-command-returns-any-output-this-is-a-finding:
      state_title: If the command returns any output, this is a finding.
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: ''
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: none_exist
  tests:
    test-ssh-server-configuration-files-permissions-not-modified:
      test_title: SSH server configuration files' permissions must not be modified.
      capability: independent.shellcommand
      object: verify-permissions-etc-ssh-sshd-config-file-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-if-the-command-returns-any-output-this-is-a-finding
  evaluate:
    test: test-ssh-server-configuration-files-permissions-not-modified
