assessment:
  id: SV-257852.automated
  version: 2
  assessment_title: RHEL-09-231055 - RHEL 9 must prevent code from being executed on file systems that contain user
    home directories.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    home-object:
      capability: linux.partition
      select:
        mount_point:
          operation: pattern match
          datatype: string
          mask: false
          value: .*\/home
      object_title: /home
  states:
    state-linux-partition:
      state_title: null
      capability: linux.partition
      state:
        field: mount_options
        value: noexec
        operation: equals
        datatype: string
        mask: false
        entity_check: at least one
        entity_existence: at_least_one_exists
  tests:
    test-home-has-noexec-option:
      test_title: /home has noexec option
      capability: linux.partition
      object: home-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-linux-partition
  evaluate:
    test: test-home-has-noexec-option
