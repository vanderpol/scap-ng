assessment:
  id: SV-257991.automated
  version: 1
  assessment_title: RHEL-09-255075 - RHEL 9 SSH server must be configured to use only Message Authentication Codes
    (MACs) employing FIPS 140-3 validated cryptographic hash algorithms.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/crypto-policies/back-ends/opensshserver.config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*MACs\s+(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: null
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,hmac-sha2-256,hmac-sha2-512
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54-2:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '"hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,hmac-sha2-256,hmac-sha2-512"'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-etc-crypto-policies-back-ends-openssh-config-macs-use-fips:
      test_title: '/etc/crypto-policies/back-ends/openssh.config: MACs use FIPS 140-3 validated cryptographic hash
        algorithms'
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-independent-textfilecontent54
      - state-independent-textfilecontent54-2
  evaluate:
    test: test-etc-crypto-policies-back-ends-openssh-config-macs-use-fips
