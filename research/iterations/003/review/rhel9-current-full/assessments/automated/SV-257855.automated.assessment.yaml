assessment:
  id: SV-257855.automated
  version: 1
  assessment_title: RHEL-09-231070 - RHEL 9 must prevent code from being executed on file systems that are imported
    via Network File System (NFS).
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/fstab
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*[^#\s][^\s]*\s+[^\s]+\s+nfs[^\s]*\s+([^\s]+)
        instance:
          operation: not equal
          datatype: int
          mask: false
          value: '0'
      object_title: null
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: (^|,)noexec(,|$)
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-all-nfs-entries-in-etc-fstab-have-noexec:
      test_title: all nfs entries in /etc/fstab have noexec
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: any_exist
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    test: test-all-nfs-entries-in-etc-fstab-have-noexec
