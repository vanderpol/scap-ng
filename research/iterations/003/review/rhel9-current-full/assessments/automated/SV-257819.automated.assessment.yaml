assessment:
  id: SV-257819.automated
  version: 13
  assessment_title: RHEL 9 must ensure cryptographic verification of vendor software packages.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    retrieve-package-signing-release-key-name-collection:
      collection_title: Retrieve package-signing release key name.
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: rpm -q --queryformat "%{SUMMARY}\n" gpg-pubkey | grep -i "red hat"
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: release key
    retrieve-package-signing-auxillary-key-name-collection:
      collection_title: Retrieve package-signing auxillary key name.
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: rpm -q --queryformat "%{SUMMARY}\n" gpg-pubkey | grep -i "red hat"
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: auxiliary key
    retrieve-package-signing-release-key-fingerprint-collection:
      collection_title: Retrieve package-signing 'release' key fingerprint.
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: gpg -q --keyid-format short --with-fingerprint /etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release | grep
            -P 'release key' -B 1
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: Key fingerprint\s*=\s*(.*)
    retrieve-package-signing-auxiliary-key-fingerprint-collection:
      collection_title: Retrieve package-signing 'auxiliary' key fingerprint.
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: gpg -q --keyid-format short --with-fingerprint /etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release | grep
            -P 'auxiliary key' -B 1
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: Key fingerprint\s*=\s*(.*)
  tests:
    test-confirm-red-hat-package-signing-key-release-installed-on-system:
      test_title: Confirm Red Hat package-signing key (release) is installed on the system.
      capability: independent.shellcommand
      collection: retrieve-package-signing-release-key-name-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: Confirm correct release key.
        state:
          field: stdout_line
          value: release key 2
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-confirm-red-hat-package-signing-key-auxillary-installed-on-system:
      test_title: Confirm Red Hat package-signing key (auxillary) is installed on the system.
      capability: independent.shellcommand
      collection: retrieve-package-signing-auxillary-key-name-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: Confirm correct auxilary key.
        state:
          field: stdout_line
          value: auxiliary key 3
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-confirm-red-hat-package-signing-release-key-fingerprint-matches-vendor:
      test_title: Confirm Red Hat package-signing 'release' key fingerprint matches vendor values.
      capability: independent.shellcommand
      collection: retrieve-package-signing-release-key-fingerprint-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: Confirm 'release' key finger print.
        state:
          field: subexpression
          value: ^567E\s+347A\s+D004\s+4ADE\s+55BA\s+8A5F\s+199E\s+2F91\s+FD43\s+1D51$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-confirm-red-hat-package-signing-auxiliary-key-fingerprint-matches-vendor:
      test_title: Confirm Red Hat package-signing 'auxiliary' key fingerprint matches vendor values.
      capability: independent.shellcommand
      collection: retrieve-package-signing-auxiliary-key-fingerprint-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: Confirm 'auxiliary' key fingerprint.
        state:
          field: subexpression
          value: ^7E46\s+2425\s+8C40\s+6535\s+D56D\s+6F13\s+5054\s+E4A4\s+5A63\s+40B3$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-confirm-red-hat-package-signing-key-release-installed-on-system
    - test: test-confirm-red-hat-package-signing-key-auxillary-installed-on-system
    - test: test-confirm-red-hat-package-signing-release-key-fingerprint-matches-vendor
    - test: test-confirm-red-hat-package-signing-auxiliary-key-fingerprint-matches-vendor
