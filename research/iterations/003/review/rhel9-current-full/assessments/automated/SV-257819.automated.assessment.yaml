assessment:
  id: SV-257819.automated
  version: 13
  assessment_title: RHEL 9 must ensure cryptographic verification of vendor software packages.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    retrieve-package-signing-release-key-name-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: rpm -q --queryformat "%{SUMMARY}\n" gpg-pubkey | grep -i "red hat"
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: release key
      object_title: Retrieve package-signing release key name.
    retrieve-package-signing-auxillary-key-name-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: rpm -q --queryformat "%{SUMMARY}\n" gpg-pubkey | grep -i "red hat"
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: auxiliary key
      object_title: Retrieve package-signing auxillary key name.
    retrieve-package-signing-release-key-fingerprint-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: gpg -q --keyid-format short --with-fingerprint /etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release | grep
            -P 'release key' -B 1
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: Key fingerprint\s*=\s*(.*)
      object_title: Retrieve package-signing 'release' key fingerprint.
    retrieve-package-signing-auxiliary-key-fingerprint-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: gpg -q --keyid-format short --with-fingerprint /etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release | grep
            -P 'auxiliary key' -B 1
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: Key fingerprint\s*=\s*(.*)
      object_title: Retrieve package-signing 'auxiliary' key fingerprint.
  states:
    state-confirm-correct-release-key:
      state_title: Confirm correct release key.
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: release key 2
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-confirm-correct-auxilary-key:
      state_title: Confirm correct auxilary key.
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: auxiliary key 3
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-confirm-release-key-finger-print:
      state_title: Confirm 'release' key finger print.
      capability: independent.shellcommand
      state:
        field: subexpression
        value: ^567E\s+347A\s+D004\s+4ADE\s+55BA\s+8A5F\s+199E\s+2F91\s+FD43\s+1D51$
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-confirm-auxiliary-key-fingerprint:
      state_title: Confirm 'auxiliary' key fingerprint.
      capability: independent.shellcommand
      state:
        field: subexpression
        value: ^7E46\s+2425\s+8C40\s+6535\s+D56D\s+6F13\s+5054\s+E4A4\s+5A63\s+40B3$
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-confirm-red-hat-package-signing-key-release-installed-on-system:
      test_title: Confirm Red Hat package-signing key (release) is installed on the system.
      capability: independent.shellcommand
      object: retrieve-package-signing-release-key-name-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-confirm-correct-release-key
    test-confirm-red-hat-package-signing-key-auxillary-installed-on-system:
      test_title: Confirm Red Hat package-signing key (auxillary) is installed on the system.
      capability: independent.shellcommand
      object: retrieve-package-signing-auxillary-key-name-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-confirm-correct-auxilary-key
    test-confirm-red-hat-package-signing-release-key-fingerprint-matches-vendor:
      test_title: Confirm Red Hat package-signing 'release' key fingerprint matches vendor values.
      capability: independent.shellcommand
      object: retrieve-package-signing-release-key-fingerprint-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-confirm-release-key-finger-print
    test-confirm-red-hat-package-signing-auxiliary-key-fingerprint-matches-vendor:
      test_title: Confirm Red Hat package-signing 'auxiliary' key fingerprint matches vendor values.
      capability: independent.shellcommand
      object: retrieve-package-signing-auxiliary-key-fingerprint-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-confirm-auxiliary-key-fingerprint
  evaluate:
    all:
    - test: test-confirm-red-hat-package-signing-key-release-installed-on-system
    - test: test-confirm-red-hat-package-signing-key-auxillary-installed-on-system
    - test: test-confirm-red-hat-package-signing-release-key-fingerprint-matches-vendor
    - test: test-confirm-red-hat-package-signing-auxiliary-key-fingerprint-matches-vendor
