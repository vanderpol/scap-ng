assessment:
  id: SV-257972.automated
  version: 2
  assessment_title: RHEL-09-254015 - RHEL 9 must ignore IPv6 Internet Control Message Protocol (ICMP) redirect messages.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    unix-sysctl-collection:
      collection_title: null
      capability: unix.sysctl
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: net.ipv6.conf.all.accept_redirects
  tests:
    test-net-ipv6-conf-all-accept-redirects-setting-in-kernel-set:
      test_title: net.ipv6.conf.all.accept_redirects setting in kernel is set to 0
      capability: unix.sysctl
      collection: unix-sysctl-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: null
        state_capability: unix.sysctl
        state:
          field: value
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-net-ipv6-conf-all-accept-redirects-setting-in-kernel-set
