assessment:
  id: SV-257967.automated
  version: 2
  assessment_title: RHEL-09-253060 - RHEL 9 must limit the number of bogus Internet Control Message Protocol (ICMP)
    response errors logs.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-sysctl-object:
      capability: unix.sysctl
      select:
        name:
          operation: equals
          datatype: string
          value: net.ipv4.icmp_ignore_bogus_error_responses
      object_title: null
  states:
    state-unix-sysctl:
      state_title: null
      capability: unix.sysctl
      state:
        field: value
        value: '1'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-net-ipv4-icmp-ignore-bogus-error-responses-setting-in-kernel:
      test_title: net.ipv4.icmp_ignore_bogus_error_responses setting in kernel is set to 1
      capability: unix.sysctl
      object: unix-sysctl-object
      check_existence: all_exist
      check: all
      states:
      - state-unix-sysctl
  evaluate:
    test: test-net-ipv4-icmp-ignore-bogus-error-responses-setting-in-kernel
