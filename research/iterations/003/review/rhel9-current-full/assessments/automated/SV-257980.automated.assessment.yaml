assessment:
  id: SV-257980.automated
  version: 1
  assessment_title: RHEL-09-255020 - RHEL 9 must have the openssh-clients package installed.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    linux-rpminfo-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: openssh-clients
      object_title: null
  states: {}
  tests:
    test-openssh-clients-package-installed:
      test_title: openssh-clients package is installed
      capability: linux.rpminfo
      object: linux-rpminfo-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    test: test-openssh-clients-package-installed
