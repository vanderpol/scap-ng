assessment:
  id: SV-258171.automated
  version: 1
  assessment_title: RHEL-09-653110 - RHEL 9 must allow only the information system security manager (ISSM) (or individuals
    or roles appointed by the ISSM) to select which auditable events are to be audited.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-file-object:
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/audit/auditd.conf
      object_title: null
    unix-file-object-2:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/audit/rules.d
        filename:
          operation: pattern match
          datatype: string
          value: .rules$
      object_title: null
    unix-file-object-3:
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/audit/audit.rules
      object_title: null
  states:
    state-mode-0600-or-less-permissive:
      state_title: Mode 0600 or less permissive
      capability: unix.file
      state:
        all:
        - field: suid
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: sgid
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: sticky
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: uexec
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: gread
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: gwrite
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: gexec
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: oread
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: owrite
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: oexec
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-etc-audit-auditd-conf-has-mode-0600-or-less-permissive:
      test_title: /etc/audit/auditd.conf has mode 0600 or less permissive
      capability: unix.file
      object: unix-file-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-mode-0600-or-less-permissive
    test-rules-files-in-etc-audit-rules-d-have-mode-0600:
      test_title: .rules files in /etc/audit/rules.d have mode 0600 or less permissive
      capability: unix.file
      object: unix-file-object-2
      check_existence: at_least_one_exists
      check: all
      states:
      - state-mode-0600-or-less-permissive
    test-etc-audit-audit-rules-has-mode-0600-or-less-permissive:
      test_title: /etc/audit/audit.rules has mode 0600 or less permissive
      capability: unix.file
      object: unix-file-object-3
      check_existence: at_least_one_exists
      check: all
      states:
      - state-mode-0600-or-less-permissive
  evaluate:
    all:
    - test: test-etc-audit-auditd-conf-has-mode-0600-or-less-permissive
    - test: test-rules-files-in-etc-audit-rules-d-have-mode-0600
    - test: test-etc-audit-audit-rules-has-mode-0600-or-less-permissive
