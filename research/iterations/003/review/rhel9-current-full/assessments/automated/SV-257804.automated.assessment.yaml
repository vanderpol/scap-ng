assessment:
  id: SV-257804.automated
  version: 2
  assessment_title: RHEL-09-213045 - RHEL 9 must be configured to disable the Asynchronous Transfer Mode kernel
    module.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/modprobe.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[ \t]*install[ \t]+atm[ \t]+/bin/false[ \t]*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: null
