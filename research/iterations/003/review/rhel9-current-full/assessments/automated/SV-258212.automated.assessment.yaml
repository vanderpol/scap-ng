assessment:
  id: SV-258212.automated
  version: 1
  assessment_title: RHEL-09-654190 - Successful/unsuccessful uses of the poweroff command in RHEL 9 must generate
    an audit record.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/audit.rules
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*-a\s+(always,exit|exit,always)(?:\s+-S\s+all)?\s+-F\s+path=/usr/sbin/poweroff\s+(-F\s+perm=([rwa]*x[rwa]*)\s+)?-F\s+auid>=1000\s+-F\s+auid!=(4294967295|-1|unset)(\s+(-k\s+|-F\s+key=)\S+)?\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: null
  states: {}
  tests:
    test-audit-invocations-usr-sbin-poweroff:
      test_title: Audit invocations of /usr/sbin/poweroff
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    test: test-audit-invocations-usr-sbin-poweroff
