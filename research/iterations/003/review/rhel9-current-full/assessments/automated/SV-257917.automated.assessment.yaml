assessment:
  id: SV-257917.automated
  version: 1
  assessment_title: RHEL-09-232185 - RHEL 9 /var/log/messages file must be group-owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    unix-file-collection:
      collection_title: null
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /var/log/messages
  tests:
    test-var-log-messages-file-owned-by-root:
      test_title: /var/log/messages file is owned by root
      capability: unix.file
      collection: unix-file-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: group-owned by root
        state:
          field: group_id
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-var-log-messages-file-owned-by-root
