assessment:
  id: SV-257968.automated
  version: 2
  assessment_title: RHEL-09-253065 - RHEL 9 must not send Internet Control Message Protocol (ICMP) redirects.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    unix-sysctl-object:
      capability: unix.sysctl
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: net.ipv4.conf.all.send_redirects
      object_title: null
  states:
    state-unix-sysctl:
      state_title: null
      capability: unix.sysctl
      state:
        field: value
        value: '0'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-net-ipv4-conf-all-send-redirects-setting-in-kernel-set:
      test_title: net.ipv4.conf.all.send_redirects setting in kernel is set to 0
      capability: unix.sysctl
      object: unix-sysctl-object
      check_existence: all_exist
      check: all
      states:
      - state-unix-sysctl
  evaluate:
    test: test-net-ipv4-conf-all-send-redirects-setting-in-kernel-set
