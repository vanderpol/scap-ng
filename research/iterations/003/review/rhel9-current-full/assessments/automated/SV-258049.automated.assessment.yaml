assessment:
  id: SV-258049.automated
  version: 1
  assessment_title: RHEL-09-411050 - RHEL 9 must disable account identifiers (individuals, groups, roles, and devices)
    after 35 days of inactivity.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/default/useradd
        pattern:
          operation: pattern match
          datatype: string
          value: (?i)^\s*INACTIVE\s*=\s*(-?\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '0'
        operation: greater than or equal
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54-2:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '35'
        operation: less than or equal
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-etc-default-useradd-inactive-set-35-or-less-but-not:
      test_title: '/etc/default/useradd: INACTIVE is set to 35 or less, but not -1'
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
      state_operator: AND
      states:
      - state-independent-textfilecontent54
      - state-independent-textfilecontent54-2
  evaluate:
    test: test-etc-default-useradd-inactive-set-35-or-less-but-not
