assessment:
  id: SV-257943.automated
  version: 1
  assessment_title: RHEL-09-252010 - RHEL 9 must have the chrony package installed.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-rpminfo-collection:
      collection_title: null
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: chrony
  tests:
    test-chrony-package-installed:
      test_title: The chrony package is installed
      capability: linux.rpminfo
      collection: linux-rpminfo-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    test: test-chrony-package-installed
