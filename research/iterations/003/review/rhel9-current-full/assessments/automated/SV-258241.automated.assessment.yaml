assessment:
  id: SV-258241.automated
  version: 13
  assessment_title: RHEL 9 must implement a FIPS 140-3-compliant systemwide cryptographic policy.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    retrieve-system-wide-crypto-policy-ies-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: update-crypto-policies --show
      object_title: Retrieve system wide crypto policy(ies).
    retrieve-current-minimum-crypto-policy-configuration-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/crypto-policies/state/CURRENT.pol
        pattern:
          operation: pattern match
          datatype: string
          value: ^hash\s*=\s*.*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: Retrieve the current minimum crypto-policy configuration.
    retrieve-current-minimum-crypto-policy-configuration-hash-values-subexpression-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/crypto-policies/state/CURRENT.pol
        pattern:
          operation: pattern match
          datatype: string
          value: ^hash\s*=\s*([^#\n]+)$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: Retrieve the current minimum crypto-policy configuration with hash values subexpression.
    retrieve-current-minimum-rsa-size-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/crypto-policies/state/CURRENT.pol
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*min_rsa_size\s*=\s*(\d+)
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: Retrieve the current minimum rsa size.
  variables:
    allowed-fips-algorithms-variable:
      title: Allowed FIPS algorithms.
      kind: constant
      datatype: string
      expression:
        literal:
        - SHA2-256
        - SHA2-384
        - SHA2-512
        - SHA2-224
        - SHA3-256
        - SHA3-384
        - SHA3-384
        - SHA3-512
        - SHAKE-256
  states:
    state-confirm-system-wide-crypto-policy-ies-are-correct:
      state_title: Confirm system wide crypto policy(ies) are correct.
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: ^FIPS:*
          operation: pattern match
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
    state-confirm-correct-algorithms:
      state_title: Confirm correct algorithms.
      capability: independent.textfilecontent54
      state:
        field: text
        value:
          variable: allowed-fips-algorithms-variable
        operation: pattern match
        datatype: string
        variable_check: all
        entity_check: all
        entity_existence: at_least_one_exists
    state-check-for-existence-of-sha1-algorithms-negated-at-criter:
      state_title: Check for existence of SHA1 algorithms (negated at criterion level).
      capability: independent.textfilecontent54
      state:
        field: text
        value: SHA1-\d
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-confirm-minimum-hash-values-of-224:
      state_title: Confirm minimum hash values of 224.
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: \b[A-Z]+\d*-((\d{1,2}\b)|(1\d\d\b)|(21\d\b)|(22[1-3]\b))
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-confirm-minimum-rsa-size-of-2048:
      state_title: Confirm minimum rsa size of 2048.
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '2048'
        operation: greater than or equal
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-verify-rhel-9-set-use-fips-140-3-compliant-systemwide:
      test_title: Verify RHEL 9 is set to use a FIPS 140-3-compliant systemwide cryptographic policy.
      capability: independent.shellcommand
      object: retrieve-system-wide-crypto-policy-ies-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-confirm-system-wide-crypto-policy-ies-are-correct
    test-verify-current-minimum-crypto-policy-configuration:
      test_title: Verify the current minimum crypto-policy configuration.
      capability: independent.textfilecontent54
      object: retrieve-current-minimum-crypto-policy-configuration-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-confirm-correct-algorithms
    test-verify-no-sha1-algorithms-employed:
      test_title: Verify no SHA1 algorithms are employed.
      capability: independent.textfilecontent54
      object: retrieve-current-minimum-crypto-policy-configuration-object
      check_existence: any_exist
      check: all
      states:
      - state-check-for-existence-of-sha1-algorithms-negated-at-criter
    test-verify-minimum-hash-values-224:
      test_title: Verify minimum hash values of 224.
      capability: independent.textfilecontent54
      object: retrieve-current-minimum-crypto-policy-configuration-hash-values-subexpression-object
      check_existence: any_exist
      check: all
      states:
      - state-confirm-minimum-hash-values-of-224
    test-verify-minimum-rsa-size-2048:
      test_title: Verify minimum rsa size of 2048.
      capability: independent.textfilecontent54
      object: retrieve-current-minimum-rsa-size-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-confirm-minimum-rsa-size-of-2048
  evaluate:
    all:
    - test: test-verify-rhel-9-set-use-fips-140-3-compliant-systemwide
    - test: test-verify-current-minimum-crypto-policy-configuration
    - not:
        test: test-verify-no-sha1-algorithms-employed
    - not:
        test: test-verify-minimum-hash-values-224
    - test: test-verify-minimum-rsa-size-2048
