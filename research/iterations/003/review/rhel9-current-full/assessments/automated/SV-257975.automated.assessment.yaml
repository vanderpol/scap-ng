assessment:
  id: SV-257975.automated
  version: 2
  assessment_title: RHEL-09-254030 - RHEL 9 must not accept router advertisements on all IPv6 interfaces by default.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-sysctl-object:
      capability: unix.sysctl
      select:
        name:
          operation: equals
          datatype: string
          value: net.ipv6.conf.default.accept_ra
      object_title: null
  states:
    state-unix-sysctl:
      state_title: null
      capability: unix.sysctl
      state:
        field: value
        value: '0'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-net-ipv6-conf-default-accept-ra-setting-in-kernel-set:
      test_title: net.ipv6.conf.default.accept_ra setting in kernel is set to 0
      capability: unix.sysctl
      object: unix-sysctl-object
      check_existence: all_exist
      check: all
      states:
      - state-unix-sysctl
  evaluate:
    test: test-net-ipv6-conf-default-accept-ra-setting-in-kernel-set
