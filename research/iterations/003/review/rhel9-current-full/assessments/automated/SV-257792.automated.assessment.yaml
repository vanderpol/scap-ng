assessment:
  id: SV-257792.automated
  version: 1
  assessment_title: RHEL-09-212035 - RHEL 9 must disable virtual system calls.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    bls-options-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /boot/loader/entries
        filename:
          operation: pattern match
          datatype: string
          value: ^.*\.conf$
        pattern:
          operation: pattern match
          datatype: string
          value: ^options\s+(.*)$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: BLS options
    etc-default-grub-grub-cmdline-linux-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/default/grub
        pattern:
          operation: pattern match
          datatype: string
          value: ^GRUB_CMDLINE_LINUX="(.*)"
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: /etc/default/grub GRUB_CMDLINE_LINUX
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: (^|\s)vsyscall=none(\s|$)
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-bls-options-contain-vsyscall-none:
      test_title: BLS options contain vsyscall=none
      capability: independent.textfilecontent54
      object: bls-options-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
    test-grub-cmdline-linux-arguments-in-etc-default-grub-contain-vsyscall:
      test_title: The GRUB_CMDLINE_LINUX arguments in /etc/default/grub contain vsyscall=none
      capability: independent.textfilecontent54
      object: etc-default-grub-grub-cmdline-linux-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    all:
    - test: test-bls-options-contain-vsyscall-none
    - test: test-grub-cmdline-linux-arguments-in-etc-default-grub-contain-vsyscall
