assessment:
  id: SV-279936.automated
  version: 13
  assessment_title: RHEL 9 must audit any script or executable called by cron as root or by any privileged user.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    retrieve-relevant-rules-via-auditctl-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: auditctl -l
        pattern:
          operation: pattern match
          datatype: string
          value: subj_type=crond_t
      object_title: Retrieve relevant rules via auditctl
  variables:
    required-rule-strings-variable:
      title: Required rule strings.
      kind: constant
      datatype: string
      expression:
        literal:
        - -a\s+always,exit\s+-F\s+arch=b64\s+-S\s+execve\s+-F\s+subj_type=crond_t\s+-F\s+euid=0\s+(-k\s+cron_exec|-F\s+key=cron_exec)
        - -a\s+always,exit\s+-F\s+arch=b32\s+-S\s+execve\s+-F\s+subj_type=crond_t\s+-F\s+euid=0\s+(-k\s+cron_exec|-F\s+key=cron_exec)
        - -a\s+always,exit\s+-F\s+arch=b64\s+-S\s+execve\s+-F\s+subj_type=crond_t\s+-F\s+auid>=1000\s+-F\s+auid!=unset\s+(-k\s+cron_exec|-F\s+key=cron_exec)
        - -a\s+always,exit\s+-F\s+arch=b32\s+-S\s+execve\s+-F\s+subj_type=crond_t\s+-F\s+auid>=1000\s+-F\s+auid!=unset\s+(-k\s+cron_exec|-F\s+key=cron_exec)
  states:
    state-generic-placeholder-comment:
      state_title: Generic Placeholder Comment
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value:
            variable: required-rule-strings-variable
          operation: pattern match
          datatype: string
          variable_check: all
          entity_check: at least one
          entity_existence: at_least_one_exists
  tests:
    test-generic-placeholder-comment:
      test_title: Generic Placeholder Comment
      capability: independent.shellcommand
      object: retrieve-relevant-rules-via-auditctl-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-generic-placeholder-comment
  evaluate:
    test: test-generic-placeholder-comment
