assessment:
  id: SV-258156.automated
  version: 1
  assessment_title: RHEL-09-653035 - RHEL 9 must take action when allocated audit record storage volume reaches
    75 percent of the repository maximum audit record storage capacity.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/auditd.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: (?i)^\s*space_left\s*=\s*([\d]+)%\s*(?:#.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-etc-audit-auditd-conf-space-left-greater-than-or-equal:
      test_title: '/etc/audit/auditd.conf: space_left greater than or equal to 25%'
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          field: subexpression
          value: '25'
          operation: greater than or equal
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-etc-audit-auditd-conf-space-left-less-than-100:
      test_title: '/etc/audit/auditd.conf: space_left less than 100%'
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          field: subexpression
          value: '100'
          operation: less than
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-etc-audit-auditd-conf-space-left-greater-than-or-equal
    - test: test-etc-audit-auditd-conf-space-left-less-than-100
