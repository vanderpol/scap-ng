assessment:
  id: SV-257787.automated
  version: 1
  assessment_title: RHEL-09-212010 - RHEL 9 must require a boot loader superuser password.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    etc-grub2-cfg-superusers-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/grub2.cfg
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*set\s+superusers\s*=\s*"(\S+)"\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: /etc/grub2.cfg:superusers
    boot-grub2-grubenv-kernelopts-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /boot/grub2/user.cfg
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*GRUB2_PASSWORD=(\S+)\b
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: /boot/grub2/grubenv:kernelopts
  states:
    state-grub-superuser-name:
      state_title: GRUB superuser name
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^\S+$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-grub-superuser-password:
      state_title: GRUB superuser password
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^grub\.pbkdf2\.sha512\.
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-etc-grub2-cfg-superusers-exists-has-name:
      test_title: /etc/grub2.cfg:superusers exists and has a name.
      capability: independent.textfilecontent54
      object: etc-grub2-cfg-superusers-object
      check_existence: all_exist
      check: all
      states:
      - state-grub-superuser-name
    test-boot-grub2-user-cfg-grub2-password-exists-has-pbkdf2-sha512:
      test_title: /boot/grub2/user.cfg:GRUB2_PASSWORD exists and has a PBKDF2/SHA512 password assigned.
      capability: independent.textfilecontent54
      object: boot-grub2-grubenv-kernelopts-object
      check_existence: all_exist
      check: all
      states:
      - state-grub-superuser-password
  evaluate:
    all:
    - test: test-etc-grub2-cfg-superusers-exists-has-name
    - test: test-boot-grub2-user-cfg-grub2-password-exists-has-pbkdf2-sha512
