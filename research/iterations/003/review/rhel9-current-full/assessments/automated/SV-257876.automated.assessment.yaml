assessment:
  id: SV-257876.automated
  version: 1
  assessment_title: RHEL-09-231175 - RHEL 9 must mount /var/tmp with the nodev option.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    linux-partition-object:
      capability: linux.partition
      select:
        mount_point:
          operation: equals
          datatype: string
          mask: false
          value: /var/tmp
      object_title: null
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/fstab
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*[^#\s]+\s+/var/tmp\s+\S+\s+(\S+)\s+\S+\s+\S+\s*$
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
      object_title: null
  states:
    state-linux-partition:
      state_title: null
      capability: linux.partition
      state:
        field: mount_options
        value: nodev
        operation: equals
        datatype: string
        mask: false
        entity_check: at least one
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: (?:^nodev$|^nodev,|,nodev$|,nodev,)
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-if-var-tmp-mounted-it-mounted-nodev-option:
      test_title: If /var/tmp is mounted, it is mounted with the nodev option
      capability: linux.partition
      object: linux-partition-object
      check_existence: any_exist
      check: all
      states:
      - state-linux-partition
    test-if-var-tmp-configured-in-etc-fstab-it-configured-nodev:
      test_title: If /var/tmp is configured in /etc/fstab, it is configured with the nodev option
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: any_exist
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    all:
    - test: test-if-var-tmp-mounted-it-mounted-nodev-option
    - test: test-if-var-tmp-configured-in-etc-fstab-it-configured-nodev
