assessment:
  id: SV-257876.automated
  version: 1
  assessment_title: RHEL-09-231175 - RHEL 9 must mount /var/tmp with the nodev option.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-partition-collection:
      collection_title: null
      select:
        mount_point:
          operation: equals
          datatype: string
          mask: false
          value: /var/tmp
    independent-textfilecontent54-collection:
      collection_title: null
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/fstab
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*[^#\s]+\s+/var/tmp\s+\S+\s+(\S+)\s+\S+\s+\S+\s*$
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
  tests:
    test-if-var-tmp-mounted-it-mounted-nodev-option:
      test_title: If /var/tmp is mounted, it is mounted with the nodev option
      capability: linux.partition
      collection: linux-partition-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: null
        state:
          field: mount_options
          value: nodev
          operation: equals
          datatype: string
          mask: false
          entity_check: at least one
          entity_existence: at_least_one_exists
    test-if-var-tmp-configured-in-etc-fstab-it-configured-nodev:
      test_title: If /var/tmp is configured in /etc/fstab, it is configured with the nodev option
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: null
        state:
          field: subexpression
          value: (?:^nodev$|^nodev,|,nodev$|,nodev,)
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-if-var-tmp-mounted-it-mounted-nodev-option
    - test: test-if-var-tmp-configured-in-etc-fstab-it-configured-nodev
