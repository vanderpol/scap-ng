assessment:
  id: SV-258030.automated
  version: 1
  assessment_title: RHEL-09-271100 - RHEL 9 must prevent a user from overriding the disable-restart-buttons setting
    for the graphical user interface.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    check-that-etc-dconf-profile-user-system-db-at-minimum-collection:
      collection_title: check that /etc/dconf/profile/user:system-db is at minimum set to local
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/dconf/profile/user
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*system-db\s*:\s*local\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    check-that-disable-restart-button-setting-locked-from-nonprivileged-user-collection:
      collection_title: Check that the disable-restart-button setting is locked from nonprivileged user modification
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/dconf/db/local.d/locks
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^.*$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*\/org\/gnome\/login-screen\/disable-restart-buttons$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-check-that-etc-dconf-profile-user-system-db-at-minimum:
      test_title: check that /etc/dconf/profile/user:system-db is at minimum set to local
      capability: independent.textfilecontent54
      collection: check-that-etc-dconf-profile-user-system-db-at-minimum-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
    test-check-that-disable-restart-button-setting-locked-from-nonprivileged-user:
      test_title: Check that the disable-restart-button setting is locked from nonprivileged user modification
      capability: independent.textfilecontent54
      collection: check-that-disable-restart-button-setting-locked-from-nonprivileged-user-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    all:
    - test: test-check-that-etc-dconf-profile-user-system-db-at-minimum
    - test: test-check-that-disable-restart-button-setting-locked-from-nonprivileged-user
