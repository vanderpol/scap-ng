assessment:
  id: SV-258099.automated
  version: 1
  assessment_title: RHEL-09-611050 - RHEL 9 password-auth must be configured to use a sufficient number of hashing
    rounds.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/pam.d/password-auth
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*password\s+sufficient\s+pam_unix\.so\s+[^#\n]*\brounds=(\d+)\b
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-pam-unix-module-included-in-password-auth-configured-100000-or:
      test_title: The pam_unix module is included in password-auth and configured for 100000 or more rounds.
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: '100000'
          operation: greater than or equal
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-pam-unix-module-included-in-password-auth-configured-100000-or
