assessment:
  id: SV-258003.automated
  version: 1
  assessment_title: RHEL-09-255135 - RHEL 9 SSH daemon must not allow GSSAPI authentication.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    sshd-config-includes-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*include\s+(.*)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
      object_title: sshd_config includes
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^.+\.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*(?i)GSSAPIAuthentication(?-i)[ \t]+([\w\"]+)[\s]*(?:|(?:#.*))?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
      object_title: null
    independent-textfilecontent54-object-2:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*(?i)GSSAPIAuthentication(?-i)[ \t]+([\w\"]+)[\s]*(?:|(?:#.*))?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
      object_title: null
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: /etc/ssh/sshd_config.d/*.conf
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54-2:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^(no|"no")$
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-sshd-config-includes-sshd-config-d:
      test_title: sshd_config includes sshd_config.d
      capability: independent.textfilecontent54
      object: sshd-config-includes-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-independent-textfilecontent54
    test-etc-ssh-sshd-config-d-gssapiauthentication-set-no:
      test_title: '/etc/ssh/sshd_config.d: GSSAPIAuthentication is set to no'
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54-2
    test-etc-ssh-sshd-config-gssapiauthentication-set-no:
      test_title: '/etc/ssh/sshd_config: GSSAPIAuthentication is set to no'
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-2
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54-2
  evaluate:
    any:
    - all:
      - test: test-sshd-config-includes-sshd-config-d
      - test: test-etc-ssh-sshd-config-d-gssapiauthentication-set-no
    - test: test-etc-ssh-sshd-config-gssapiauthentication-set-no
