assessment:
  id: SV-257921.automated
  version: 13
  assessment_title: RHEL 9 library files must be group-owned by root or a system account.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    all-system-library-files-not-owned-by-root-group-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: only one
          value:
            variable: system-wide-shared-library-files-directories-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
      filters:
      - action: exclude
        state: state-owned-by-root-group
      - action: exclude
        state: state-symbolic-links
      - action: exclude
        state: state-unix-file
      behaviors:
        recurse_direction: down
      object_title: All system-library files not owned by root-group
  variables:
    system-wide-shared-library-files-directories-variable:
      title: system-wide shared library files directories
      kind: constant
      datatype: string
      expression:
        literal:
        - /lib
        - /lib64
        - /usr/lib
        - /usr/lib64
  states:
    state-owned-by-root-group:
      state_title: owned by root-group
      capability: unix.file
      state:
        field: group_id
        value: '0'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-symbolic-links:
      state_title: symbolic links
      capability: unix.file
      state:
        field: type
        value: symbolic link
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-unix-file:
      state_title: null
      capability: unix.file
      state:
        field: type
        value: directory
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-library-files-owned-by-root-group:
      test_title: System Library files are owned by root group
      capability: unix.file
      object: all-system-library-files-not-owned-by-root-group-object
      check_existence: none_exist
      check: all
  evaluate:
    test: test-system-library-files-owned-by-root-group
