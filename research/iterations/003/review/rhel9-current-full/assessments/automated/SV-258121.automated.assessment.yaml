assessment:
  id: SV-258121.automated
  version: 1
  assessment_title: RHEL-09-611160 - RHEL 9 must use the CAC smart card driver.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/opensc.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: (?i)^\s*card_drivers\s*=(.*);
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-etc-opensc-conf-card-drivers-cac:
      test_title: '/etc/opensc.conf: card_drivers = cac'
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          field: subexpression
          value: (?i)\bcac\b
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-etc-opensc-conf-card-drivers-cac
