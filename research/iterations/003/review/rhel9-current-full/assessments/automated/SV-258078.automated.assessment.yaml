assessment:
  id: SV-258078.automated
  version: 1
  assessment_title: RHEL-09-431010 - RHEL 9 must use a Linux Security Module configured to enforce limits on system
    services.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    sys-fs-selinux-object:
      capability: linux.partition
      select:
        mount_point:
          operation: equals
          datatype: string
          mask: false
          value: /sys/fs/selinux
      object_title: /sys/fs/selinux
    sys-fs-selinux-enforce-value-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /sys/fs/selinux/enforce
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(\d+)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: /sys/fs/selinux/enforce value
    etc-selinux-config-selinux-value-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/selinux/config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^SELINUX=(.*)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: /etc/selinux/config:SELINUX value
  states:
    state-linux-partition:
      state_title: null
      capability: linux.partition
      state:
        field: fs_type
        value: selinuxfs
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-sys-fs-selinux-enforce-0:
      state_title: /sys/fs/selinux/enforce != 0
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '0'
        operation: not equal
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-etc-selinux-config-selinux-enforcing:
      state_title: /etc/selinux/config:SELINUX=enforcing
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: enforcing
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-selinux-active:
      test_title: selinux is active
      capability: linux.partition
      object: sys-fs-selinux-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-linux-partition
    test-selinux-enforcing:
      test_title: selinux is enforcing
      capability: independent.textfilecontent54
      object: sys-fs-selinux-enforce-value-object
      check_existence: only_one_exists
      check: all
      states:
      - state-sys-fs-selinux-enforce-0
    test-etc-selinux-config-selinux-enforcing:
      test_title: /etc/selinux/config:SELINUX=enforcing
      capability: independent.textfilecontent54
      object: etc-selinux-config-selinux-value-object
      check_existence: only_one_exists
      check: all
      states:
      - state-etc-selinux-config-selinux-enforcing
  evaluate:
    all:
    - test: test-selinux-active
    - test: test-selinux-enforcing
    - test: test-etc-selinux-config-selinux-enforcing
