assessment:
  id: SV-257949.automated
  version: 1
  assessment_title: RHEL-09-252040 - RHEL 9 must configure a DNS processing mode set be Network Manager.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    networkmanager-conf-dns-setting-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/NetworkManager/NetworkManager.conf
        pattern:
          operation: pattern match
          datatype: string
          value: ^dns=(\S*)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: NetworkManager.conf dns setting
    networkmanager-conf-main-section-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/NetworkManager/NetworkManager.conf
        pattern:
          operation: pattern match
          datatype: string
          value: ^\[main\]((?:\r?\n(?:[^[\r\n].*)?)*)
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: NetworkManager.conf main section
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: none
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54-2:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: default
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54-3:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: systemd-resolved
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54-4:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: \ndns=
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-dns-setting-exists-in-networkmanager-conf-default-none-or-systemd:
      test_title: DNS setting exists in NetworkManager.conf and is default, none or systemd-resolved
      capability: independent.textfilecontent54
      object: networkmanager-conf-dns-setting-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-independent-textfilecontent54
      - state-independent-textfilecontent54-2
      - state-independent-textfilecontent54-3
    test-dns-setting-exists-in-networkmanager-conf-main-section:
      test_title: DNS setting exists in NetworkManager.conf main section
      capability: independent.textfilecontent54
      object: networkmanager-conf-main-section-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54-4
  evaluate:
    all:
    - test: test-dns-setting-exists-in-networkmanager-conf-default-none-or-systemd
    - test: test-dns-setting-exists-in-networkmanager-conf-main-section
