assessment:
  id: SV-258069.automated
  version: 1
  assessment_title: RHEL-09-412040 - RHEL 9 must limit the number of concurrent sessions to ten for all accounts
    and/or account types.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    default-maxlogins-in-etc-security-limits-conf-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/security/limits.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*\*\s+(?:(?:hard)|(?:-))\s+maxlogins\s+(\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: default maxlogins in /etc/security/limits.conf
    default-maxlogins-in-etc-security-limits-d-conf-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/security/limits.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .*\.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*\*\s+(?:(?:hard)|(?:-))\s+maxlogins\s+(\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: default maxlogins in /etc/security/limits.d/*.conf
    all-default-maxlogins-settings-in-etc-security-limits-conf-etc-object:
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - object: default-maxlogins-in-etc-security-limits-conf-object
        - object: default-maxlogins-in-etc-security-limits-d-conf-object
      object_title: all default maxlogins settings in /etc/security/limits.conf and /etc/security/limits.d/*.conf
    non-default-maxlogins-in-etc-security-limits-conf-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/security/limits.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*[^#*\s]+\s+(?:(?:hard)|(?:-))\s+maxlogins\s+(\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: non-default maxlogins in /etc/security/limits.conf
    non-default-maxlogins-in-etc-security-limits-d-conf-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/security/limits.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .*\.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*[^#*\s]+\s+(?:(?:hard)|(?:-))\s+maxlogins\s+(\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: non-default maxlogins in /etc/security/limits.d/*.conf
    all-non-default-maxlogins-settings-in-etc-security-limits-conf-object:
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - object: non-default-maxlogins-in-etc-security-limits-conf-object
        - object: non-default-maxlogins-in-etc-security-limits-d-conf-object
      object_title: all non-default maxlogins settings in /etc/security/limits.conf and /etc/security/limits.d/*.conf
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '10'
        operation: less than or equal
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-limits-conf-limits-d-conf-maxlogins-set-10-or-less:
      test_title: limits.conf and limits.d/*.conf:maxlogins is set to 10 or less by default
      capability: independent.textfilecontent54
      object: all-default-maxlogins-settings-in-etc-security-limits-conf-etc-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
    test-limits-conf-limits-d-conf-maxlogins-set-10-or-less-2:
      test_title: limits.conf and limits.d/*.conf:maxlogins is set to 10 or less for non-default domains
      capability: independent.textfilecontent54
      object: all-non-default-maxlogins-settings-in-etc-security-limits-conf-object
      check_existence: any_exist
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    all:
    - test: test-limits-conf-limits-d-conf-maxlogins-set-10-or-less
    - test: test-limits-conf-limits-d-conf-maxlogins-set-10-or-less-2
