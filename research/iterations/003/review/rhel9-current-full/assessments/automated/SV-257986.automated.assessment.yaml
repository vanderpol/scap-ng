assessment:
  id: SV-257986.automated
  version: 1
  assessment_title: RHEL-09-255050 - RHEL 9 must enable the Pluggable Authentication Module (PAM) interface for
    SSHD.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*UsePAM\s+(\w*)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-textfilecontent54-collection-2:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^.+\.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*UsePAM\s+(\w*)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    usepam-in-all-sshd-config-sshd-config-d-files-collection:
      collection_title: UsePAM in all sshd_config and sshd_config.d/* files
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - collection: independent-textfilecontent54-collection
        - collection: independent-textfilecontent54-collection-2
  tests:
    test-etc-ssh-sshd-config-or-etc-ssh-sshd-config-d:
      test_title: /etc/ssh/sshd_config or /etc/ssh/sshd_config.d/*:UsePAM == yes
      capability: independent.textfilecontent54
      collection: usepam-in-all-sshd-config-sshd-config-d-files-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: 'yes'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-etc-ssh-sshd-config-or-etc-ssh-sshd-config-d
