assessment:
  id: SV-257777.automated
  version: 1
  assessment_title: RHEL-09-211010 - RHEL 9 must be a vendor-supported release.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc
        filename:
          operation: equals
          datatype: string
          mask: false
          value: redhat-release
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*Red Hat Enterprise Linux release 9\.(\d+)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: null
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '7'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54-2:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '8'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54-3:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '9'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54-4:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '10'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-rhel-9-minor-version-supported:
      test_title: The RHEL 9 minor version is supported.
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-independent-textfilecontent54
      - state-independent-textfilecontent54-2
      - state-independent-textfilecontent54-3
      - state-independent-textfilecontent54-4
  evaluate:
    test: test-rhel-9-minor-version-supported
