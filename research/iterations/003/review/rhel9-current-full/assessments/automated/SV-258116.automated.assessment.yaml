assessment:
  id: SV-258116.automated
  version: 1
  assessment_title: RHEL-09-611135 - RHEL 9 must be configured so that user and group account administration utilities
    are configured to store only encrypted representations of passwords.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    etc-libuser-conf-defaults-section-crypt-style-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/libuser.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\[defaults]((?:\r?\n(?:[^[\r\n].*)?)*)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: /etc/libuser.conf defaults section with crypt_style
    etc-libuser-conf-defaults-section-crypt-style-object-2:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/libuser.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*crypt_style\s*=\s*(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: /etc/libuser.conf defaults section with crypt_style
  states:
    state-defaults-crypt-style:
      state_title: defaults/crypt_style
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: \n\s*crypt_style\s*=\s*(\S*)\s*(\n|$)
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-sha512:
      state_title: sha512
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: sha512
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-libuser-conf-defaults-crypt-style-exists:
      test_title: libuser.conf, defaults/crypt_style exists
      capability: independent.textfilecontent54
      object: etc-libuser-conf-defaults-section-crypt-style-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-defaults-crypt-style
    test-libuser-conf-crypt-style-sha512:
      test_title: libuser.conf, crypt_style = sha512
      capability: independent.textfilecontent54
      object: etc-libuser-conf-defaults-section-crypt-style-object-2
      check_existence: at_least_one_exists
      check: all
      states:
      - state-sha512
  evaluate:
    all:
    - test: test-libuser-conf-defaults-crypt-style-exists
    - test: test-libuser-conf-crypt-style-sha512
