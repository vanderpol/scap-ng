assessment:
  id: SV-257965.automated
  version: 2
  assessment_title: RHEL-09-253050 - RHEL 9 must use a reverse-path filter for IPv4 network traffic when possible
    by default.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-sysctl-object:
      capability: unix.sysctl
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: net.ipv4.conf.default.rp_filter
      object_title: null
  states:
    state-unix-sysctl:
      state_title: null
      capability: unix.sysctl
      state:
        field: value
        value: '1'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-net-ipv4-conf-default-rp-filter-setting-in-kernel-set:
      test_title: net.ipv4.conf.default.rp_filter setting in kernel is set to 1
      capability: unix.sysctl
      object: unix-sysctl-object
      check_existence: all_exist
      check: all
      states:
      - state-unix-sysctl
  evaluate:
    test: test-net-ipv4-conf-default-rp-filter-setting-in-kernel-set
