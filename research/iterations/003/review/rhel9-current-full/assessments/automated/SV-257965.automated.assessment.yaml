assessment:
  id: SV-257965.automated
  version: 2
  assessment_title: RHEL-09-253050 - RHEL 9 must use a reverse-path filter for IPv4 network traffic when possible
    by default.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    unix-sysctl-collection:
      collection_title: null
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: net.ipv4.conf.default.rp_filter
  tests:
    test-net-ipv4-conf-default-rp-filter-setting-in-kernel-set:
      test_title: net.ipv4.conf.default.rp_filter setting in kernel is set to 1
      capability: unix.sysctl
      collection: unix-sysctl-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: null
        state:
          field: value
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-net-ipv4-conf-default-rp-filter-setting-in-kernel-set
