assessment:
  id: SV-257911.automated
  version: 1
  assessment_title: RHEL-09-232155 - RHEL 9 /etc/shadow file must be group-owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    unix-file-collection:
      collection_title: null
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/shadow
  tests:
    test-etc-shadow-file-owned-by-root:
      test_title: /etc/shadow file is owned by root
      capability: unix.file
      collection: unix-file-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: group-owned by root
        state_capability: unix.file
        state:
          field: group_id
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-etc-shadow-file-owned-by-root
