assessment:
  id: SV-258148.automated
  version: 1
  assessment_title: RHEL-09-652050 - RHEL 9 must encrypt via the gtls driver the transfer of audit records offloaded
    onto a different system or media from the system being audited via rsyslog.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    rsyslog-conf-defaultnetstreamdriver-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/rsyslog.conf
        pattern:
          operation: pattern match
          datatype: string
          value: ^\$DefaultNetstreamDriver\s+(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      behaviors:
        ignore_case: 'true'
      object_title: 'rsyslog.conf: DefaultNetstreamDriver'
    rsyslog-d-conf-defaultnetstreamdriver-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/rsyslog.d
        filename:
          operation: pattern match
          datatype: string
          value: ^.*\.conf$
        pattern:
          operation: pattern match
          datatype: string
          value: ^\$DefaultNetstreamDriver\s+(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      behaviors:
        ignore_case: 'true'
      object_title: 'rsyslog.d/*.conf: DefaultNetstreamDriver'
    defaultnetstreamdriver-object:
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - object: rsyslog-conf-defaultnetstreamdriver-object
        - object: rsyslog-d-conf-defaultnetstreamdriver-object
      object_title: DefaultNetstreamDriver
    rsyslog-conf-action-all-messages-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/rsyslog.conf
        pattern:
          operation: pattern match
          datatype: string
          value: ^\*\.\*\s+action\((\s*(?:[^#\)]*(?:#.*$)?\n)*[^#\)]*)\)
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      behaviors:
        ignore_case: 'true'
      object_title: 'rsyslog.conf: action for all messages'
    rsyslog-d-conf-action-all-messages-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/rsyslog.d
        filename:
          operation: pattern match
          datatype: string
          value: ^.*\.conf$
        pattern:
          operation: pattern match
          datatype: string
          value: ^\*\.\*\s+action\((\s*(?:[^#\)]*(?:#.*$)?\n)*[^#\)]*)\)
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      behaviors:
        ignore_case: 'true'
      object_title: 'rsyslog.d/*.conf: action for all messages'
    rsyslog-action-all-messages-object:
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - object: rsyslog-conf-action-all-messages-object
        - object: rsyslog-d-conf-action-all-messages-object
      object_title: 'rsyslog: action for all messages'
    rsyslog-conf-module-blocks-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/rsyslog.conf
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*module\((\s*(?:[^#\)]*(?:#.*$)?\n)*[^#\)]*)\)
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      behaviors:
        ignore_case: 'true'
      object_title: 'rsyslog.conf: module blocks'
    rsyslog-d-conf-module-blocks-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/rsyslog.d
        filename:
          operation: pattern match
          datatype: string
          value: ^.*\.conf$
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*module\((\s*(?:[^#\)]*(?:#.*$)?\n)*[^#\)]*)\)
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      behaviors:
        ignore_case: 'true'
      object_title: 'rsyslog.d/*.conf: module blocks'
    rsyslog-module-blocks-object:
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - object: rsyslog-conf-module-blocks-object
        - object: rsyslog-d-conf-module-blocks-object
      object_title: 'rsyslog: module blocks'
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: gtls
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54-2:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: (?i)(?:^|\n)[^#]*\btype\s*=\s*"omfwd"
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54-3:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: (?i)(?:^|\n)[^#]*\bStreamDriver(?:\.Name)?\s*=\s*"gtls"
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54-4:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: (?i)(?:^|\n)[^#]*\bStreamDriver(?:\.Name)?\b
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-defaultnetstreamdriver-gtls:
      test_title: DefaultNetstreamDriver == gtls
      capability: independent.textfilecontent54
      object: defaultnetstreamdriver-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
    test-streamdriver-gtls-advanced-syntax:
      test_title: StreamDriver == gtls (advanced syntax)
      capability: independent.textfilecontent54
      object: rsyslog-action-all-messages-object
      check_existence: at_least_one_exists
      check: at least one
      state_operator: AND
      states:
      - state-independent-textfilecontent54-2
      - state-independent-textfilecontent54-3
    test-streamdriver-not-set-in-module-block-advanced-syntax:
      test_title: StreamDriver is not set in a module block (advanced syntax)
      capability: independent.textfilecontent54
      object: rsyslog-module-blocks-object
      check_existence: any_exist
      check: none satisfy
      states:
      - state-independent-textfilecontent54-4
  evaluate:
    all:
    - any:
      - test: test-defaultnetstreamdriver-gtls
      - test: test-streamdriver-gtls-advanced-syntax
    - test: test-streamdriver-not-set-in-module-block-advanced-syntax
