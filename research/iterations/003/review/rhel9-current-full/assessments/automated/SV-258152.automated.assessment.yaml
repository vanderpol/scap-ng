assessment:
  id: SV-258152.automated
  version: 2
  assessment_title: RHEL-09-653015 - RHEL 9 audit service must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-systemdunitproperty-collection:
      collection_title: null
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          mask: false
          value: auditd.service
        property:
          operation: equals
          datatype: string
          mask: false
          value: ActiveState
    linux-systemdunitproperty-collection-2:
      collection_title: null
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          mask: false
          value: auditd.service
        property:
          operation: equals
          datatype: string
          mask: false
          value: SubState
  tests:
    test-auditd-service-active:
      test_title: auditd.service is active
      capability: linux.systemdunitproperty
      collection: linux-systemdunitproperty-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: linux.systemdunitproperty
        state:
          field: value
          value: active
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-auditd-service-running:
      test_title: auditd.service is running
      capability: linux.systemdunitproperty
      collection: linux-systemdunitproperty-collection-2
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: linux.systemdunitproperty
        state:
          field: value
          value: running
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-auditd-service-active
    - test: test-auditd-service-running
