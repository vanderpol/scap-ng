assessment:
  id: SV-258152.automated
  version: 2
  assessment_title: RHEL-09-653015 - RHEL 9 audit service must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    linux-systemdunitproperty-object:
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          mask: false
          value: auditd.service
        property:
          operation: equals
          datatype: string
          mask: false
          value: ActiveState
      object_title: null
    linux-systemdunitproperty-object-2:
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          mask: false
          value: auditd.service
        property:
          operation: equals
          datatype: string
          mask: false
          value: SubState
      object_title: null
  states:
    state-linux-systemdunitproperty:
      state_title: null
      capability: linux.systemdunitproperty
      state:
        field: value
        value: active
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-linux-systemdunitproperty-2:
      state_title: null
      capability: linux.systemdunitproperty
      state:
        field: value
        value: running
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-auditd-service-active:
      test_title: auditd.service is active
      capability: linux.systemdunitproperty
      object: linux-systemdunitproperty-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-linux-systemdunitproperty
    test-auditd-service-running:
      test_title: auditd.service is running
      capability: linux.systemdunitproperty
      object: linux-systemdunitproperty-object-2
      check_existence: at_least_one_exists
      check: all
      states:
      - state-linux-systemdunitproperty-2
  evaluate:
    all:
    - test: test-auditd-service-active
    - test: test-auditd-service-running
