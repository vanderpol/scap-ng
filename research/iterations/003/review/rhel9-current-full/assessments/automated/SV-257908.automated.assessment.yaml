assessment:
  id: SV-257908.automated
  version: 1
  assessment_title: RHEL-09-232140 - RHEL 9 /etc/passwd- file must be owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    unix-file-object:
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/passwd-
      object_title: null
  states:
    state-owned-by-root:
      state_title: owned by root
      capability: unix.file
      state:
        field: user_id
        value: '0'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-etc-passwd-file-owned-by-root:
      test_title: /etc/passwd- file is owned by root
      capability: unix.file
      object: unix-file-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-owned-by-root
  evaluate:
    test: test-etc-passwd-file-owned-by-root
