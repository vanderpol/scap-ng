assessment:
  id: SV-257818.automated
  version: 1
  assessment_title: RHEL-09-213115 - The kdump service on RHEL 9 must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-systemdunitproperty-collection:
      collection_title: null
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          mask: false
          value: kdump.service
        property:
          operation: equals
          datatype: string
          mask: false
          value: LoadState
    linux-systemdunitproperty-collection-2:
      collection_title: null
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          mask: false
          value: kdump.service
        property:
          operation: equals
          datatype: string
          mask: false
          value: UnitFileState
    linux-systemdunitproperty-collection-3:
      collection_title: null
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          mask: false
          value: kdump.service
        property:
          operation: equals
          datatype: string
          mask: false
          value: ActiveState
  tests:
    test-kdump-service-loadstate-masked-if-it-exists:
      test_title: kdump.service LoadState is masked if it exists.
      capability: linux.systemdunitproperty
      collection: linux-systemdunitproperty-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: null
        state_capability: linux.systemdunitproperty
        state:
          field: value
          value: masked
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-kdump-service-unitfilestate-masked-if-it-exists:
      test_title: kdump.service UnitFileState is masked if it exists.
      capability: linux.systemdunitproperty
      collection: linux-systemdunitproperty-collection-2
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: null
        state_capability: linux.systemdunitproperty
        state:
          field: value
          value: masked
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-kdump-service-activestate-inactive-if-it-exists:
      test_title: kdump.service ActiveState is inactive if it exists.
      capability: linux.systemdunitproperty
      collection: linux-systemdunitproperty-collection-3
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: null
        state_capability: linux.systemdunitproperty
        state:
          field: value
          value: inactive
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-kdump-service-loadstate-masked-if-it-exists
    - test: test-kdump-service-unitfilestate-masked-if-it-exists
    - test: test-kdump-service-activestate-inactive-if-it-exists
