assessment:
  id: SV-258021.automated
  version: 13
  assessment_title: RHEL 9 must enable a user session lock until that user re-establishes access using established
    identification and authentication procedures for graphical user sessions.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    retrieve-org-gnome-desktop-screensaver-lock-enabled-setting-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: gsettings get org.gnome.desktop.screensaver lock-enabled
      object_title: Retrieve org.gnome.desktop.screensaver lock-enabled setting.
  states:
    state-check-value-of-org-gnome-desktop-screensaver-lock-enable:
      state_title: Check value of org.gnome.desktop.screensaver lock-enabled setting.
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: 'true'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-verify-operating-system-enables-user-s-session-lock-until-that:
      test_title: Verify the operating system enables a user's session lock until that user re-establishes access
        using established identification and authentication procedures.
      capability: independent.shellcommand
      object: retrieve-org-gnome-desktop-screensaver-lock-enabled-setting-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-check-value-of-org-gnome-desktop-screensaver-lock-enable
  evaluate:
    test: test-verify-operating-system-enables-user-s-session-lock-until-that
