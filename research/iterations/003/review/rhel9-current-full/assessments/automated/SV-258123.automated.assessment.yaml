assessment:
  id: SV-258123.automated
  version: 2
  assessment_title: RHEL-09-611170 - RHEL 9 must implement certificate status checking for multifactor authentication.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    sssd-conf-certificate-verification-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/sssd/sssd.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*certificate_verification\s*=\s*(.*)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: 'sssd.conf: certificate_verification'
    etc-sssd-conf-d-conf-certificate-verification-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/sssd/conf.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[^.].*\.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*certificate_verification\s*=\s*(.*)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: '/etc/sssd/conf.d/*.conf: certificate_verification'
    sssd-config-certificate-verification-object:
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - object: sssd-conf-certificate-verification-object
        - object: etc-sssd-conf-d-conf-certificate-verification-object
      object_title: 'sssd config: certificate_verification'
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: (?i)(^|,)ocsp_dgst=sha512(,|$)
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-sssd-config-certificate-verification-ocsp-dgst-sha512:
      test_title: 'sssd config: certificate_verification: ocsp_dgst=sha512'
      capability: independent.textfilecontent54
      object: sssd-config-certificate-verification-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    test: test-sssd-config-certificate-verification-ocsp-dgst-sha512
