assessment:
  id: SV-258123.automated
  version: 2
  assessment_title: RHEL-09-611170 - RHEL 9 must implement certificate status checking for multifactor authentication.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    sssd-conf-certificate-verification-collection:
      collection_title: 'sssd.conf: certificate_verification'
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/sssd/sssd.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*certificate_verification\s*=\s*(.*)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    etc-sssd-conf-d-conf-certificate-verification-collection:
      collection_title: '/etc/sssd/conf.d/*.conf: certificate_verification'
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/sssd/conf.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[^.].*\.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*certificate_verification\s*=\s*(.*)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    sssd-config-certificate-verification-collection:
      collection_title: 'sssd config: certificate_verification'
      set:
        operator: union
        members:
        - collection: sssd-conf-certificate-verification-collection
        - collection: etc-sssd-conf-d-conf-certificate-verification-collection
  tests:
    test-sssd-config-certificate-verification-ocsp-dgst-sha512:
      test_title: 'sssd config: certificate_verification: ocsp_dgst=sha512'
      capability: independent.textfilecontent54
      collection: sssd-config-certificate-verification-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          field: subexpression
          value: (?i)(^|,)ocsp_dgst=sha512(,|$)
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-sssd-config-certificate-verification-ocsp-dgst-sha512
