assessment:
  id: SV-258105.automated
  version: 1
  assessment_title: RHEL-09-611080 - RHEL 9 passwords must have a 24 hours minimum password lifetime restriction
    in /etc/shadow.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/shadow
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: '^root:[^:]*:[^:]*:0*:'
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: null
    independent-textfilecontent54-object-2:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/shadow
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: '^([^:]*):[^:]*:[^:]*:0*:'
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: null
    independent-textfilecontent54-object-3:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/passwd
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: '^nobody:[^:]*:([0-9]+):'
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
      object_title: null
    users-password-age-zero-minus-system-users-object:
      capability: unix.password
      select:
        username:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: usernames-users-minimum-password-age-0-or-blank-variable
      filters:
      - action: exclude
        state: state-unix-password
      - action: exclude
        state: state-unix-password-2
      object_title: Users with a password age of zero minus system users
  variables:
    usernames-users-minimum-password-age-0-or-blank-variable:
      title: Usernames of users with a minimum password age of 0 or blank
      kind: local
      datatype: string
      expression:
        values:
          object: independent-textfilecontent54-object-2
          field: subexpression
    uid-user-nobody-variable:
      title: UID for user nobody
      kind: local
      datatype: int
      expression:
        values:
          object: independent-textfilecontent54-object-3
          field: subexpression
  states:
    state-unix-password:
      state_title: null
      capability: unix.password
      state:
        field: user_id
        value: '1000'
        operation: less than
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-unix-password-2:
      state_title: null
      capability: unix.password
      state:
        field: user_id
        value:
          variable: uid-user-nobody-variable
        operation: equals
        datatype: int
        mask: false
        variable_check: all
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-root-does-not-have-minimum-password-age-0-or-blank:
      test_title: Root does not have a minimum password age of 0 or blank
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: none_exist
      check: all
    test-non-system-users-do-not-have-minimum-password-age-0:
      test_title: Non-system users do not have a minimum password age of 0 or blank
      capability: unix.password
      object: users-password-age-zero-minus-system-users-object
      check_existence: none_exist
      check: all
  evaluate:
    all:
    - test: test-root-does-not-have-minimum-password-age-0-or-blank
    - test: test-non-system-users-do-not-have-minimum-password-age-0
