assessment:
  id: SV-257923.automated
  version: 13
  assessment_title: RHEL 9 library directories must be group-owned by root or a system account.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    all-system-wide-library-directories-not-owned-by-root-group-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          variable_check: only one
          value:
            variable: system-wide-shared-library-files-directories-variable
        filename:
          operation: equals
          datatype: string
          nil: true
          value: ''
      filters:
      - action: exclude
        state: state-group-owned-by-root-or-system-group-gid-less-than-1000
      - action: exclude
        state: state-unix-file
      - action: exclude
        state: state-symbolic-links
      behaviors:
        recurse_direction: down
      object_title: All system-wide Library directories not owned by root-group
  variables:
    system-wide-shared-library-files-directories-variable:
      title: system-wide shared library files directories
      kind: constant
      datatype: string
      expression:
        literal:
        - /lib
        - /lib64
        - /usr/lib
        - /usr/lib64
  states:
    state-group-owned-by-root-or-system-group-gid-less-than-1000:
      state_title: Group Owned by root or System group (gid less than 1000)
      capability: unix.file
      state:
        field: group_id
        value: '1000'
        operation: less than
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
    state-unix-file:
      state_title: null
      capability: unix.file
      state:
        field: type
        value: file
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-symbolic-links:
      state_title: symbolic links
      capability: unix.file
      state:
        field: type
        value: symbolic link
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-library-directories-group-by-root-group:
      test_title: System Library directories are group by root group.
      capability: unix.file
      object: all-system-wide-library-directories-not-owned-by-root-group-object
      check_existence: none_exist
      check: all
  evaluate:
    test: test-system-library-directories-group-by-root-group
