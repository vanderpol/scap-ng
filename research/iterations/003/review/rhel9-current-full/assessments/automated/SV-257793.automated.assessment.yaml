assessment:
  id: SV-257793.automated
  version: 1
  assessment_title: RHEL-09-212040 - RHEL 9 must clear the page allocator to prevent use-after-free attacks.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    bls-options-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /boot/loader/entries
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^.*\.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^options\s+(.*)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: BLS options
    etc-default-grub-grub-cmdline-linux-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/default/grub
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^GRUB_CMDLINE_LINUX="(.*)"
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: /etc/default/grub GRUB_CMDLINE_LINUX
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: (^|\s)page_poison=1(\s|$)
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-bls-options-contain-page-poison-1:
      test_title: BLS options contain page_poison=1
      capability: independent.textfilecontent54
      object: bls-options-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
    test-etc-default-grub-page-poison-1:
      test_title: /etc/default/grub page_poison=1
      capability: independent.textfilecontent54
      object: etc-default-grub-grub-cmdline-linux-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    all:
    - test: test-bls-options-contain-page-poison-1
    - test: test-etc-default-grub-page-poison-1
