assessment:
  id: SV-258167.automated
  version: 1
  assessment_title: RHEL-09-653090 - RHEL 9 audit logs file must have mode 0600 or less permissive to prevent unauthorized
    access to the audit log.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    audit-log-file-collection:
      collection_title: Audit log file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/auditd.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*log_file\s*=\s*(\S+)\s*(?:#.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    audit-log-file-location-collection:
      collection_title: Audit log file location
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: audit-log-location-from-etc-audit-auditd-conf-variable
  variables:
    audit-log-location-from-etc-audit-auditd-conf-variable:
      title: Audit log location from /etc/audit/auditd.conf
      kind: local
      datatype: string
      expression:
        values:
          collection: audit-log-file-collection
          field: subexpression
      collection_capabilities:
        audit-log-file-collection: independent.textfilecontent54
  tests:
    test-audit-log-mode-0600-or-less-permissive:
      test_title: Audit log is mode 0600 or less permissive
      capability: unix.file
      collection: audit-log-file-location-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Mode 0600 or less permissive
        state:
          all:
          - field: suid
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: sgid
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: sticky
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: uexec
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: gread
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: gwrite
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: gexec
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: oread
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: owrite
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: oexec
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-audit-log-mode-0600-or-less-permissive
