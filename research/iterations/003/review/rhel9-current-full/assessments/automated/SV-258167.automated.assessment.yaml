assessment:
  id: SV-258167.automated
  version: 1
  assessment_title: RHEL-09-653090 - RHEL 9 audit logs file must have mode 0600 or less permissive to prevent unauthorized
    access to the audit log.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    audit-log-file-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/audit/auditd.conf
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*log_file\s*=\s*(\S+)\s*(?:#.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: Audit log file
    audit-log-file-location-object:
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          variable_check: all
          value:
            variable: audit-log-location-from-etc-audit-auditd-conf-variable
      object_title: Audit log file location
  variables:
    audit-log-location-from-etc-audit-auditd-conf-variable:
      title: Audit log location from /etc/audit/auditd.conf
      kind: local
      datatype: string
      expression:
        values:
          object: audit-log-file-object
          field: subexpression
  states:
    state-mode-0600-or-less-permissive:
      state_title: Mode 0600 or less permissive
      capability: unix.file
      state:
        all:
        - field: suid
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: sgid
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: sticky
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: uexec
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: gread
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: gwrite
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: gexec
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: oread
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: owrite
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: oexec
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-audit-log-mode-0600-or-less-permissive:
      test_title: Audit log is mode 0600 or less permissive
      capability: unix.file
      object: audit-log-file-location-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-mode-0600-or-less-permissive
  evaluate:
    test: test-audit-log-mode-0600-or-less-permissive
