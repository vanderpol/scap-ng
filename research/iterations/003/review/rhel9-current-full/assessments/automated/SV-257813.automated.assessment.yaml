assessment:
  id: SV-257813.automated
  version: 1
  assessment_title: RHEL-09-213090 - RHEL 9 must disable storing core dumps.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/systemd/coredump.conf
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*Storage\s*=\s*(\w*)\s*(?:#.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: none
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-usr-systemd-coredump-conf-storage-set-none:
      test_title: /usr/systemd/coredump.conf:Storage is set to none.
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    test: test-usr-systemd-coredump-conf-storage-set-none
