assessment:
  id: SV-257813.automated
  version: 1
  assessment_title: RHEL-09-213090 - RHEL 9 must disable storing core dumps.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/systemd/coredump.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*Storage\s*=\s*(\w*)\s*(?:#.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-usr-systemd-coredump-conf-storage-set-none:
      test_title: /usr/systemd/coredump.conf:Storage is set to none.
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: none
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-usr-systemd-coredump-conf-storage-set-none
