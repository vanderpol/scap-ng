assessment:
  id: SV-258036.automated
  version: 1
  assessment_title: RHEL-09-291020 - RHEL 9 must have the USBGuard package enabled.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    usbguard-service-activestate-object:
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          mask: false
          value: usbguard.service
        property:
          operation: equals
          datatype: string
          mask: false
          value: ActiveState
      object_title: usbguard.service ActiveState
  states:
    state-usbguard-service-active:
      state_title: usbguard.service active
      capability: linux.systemdunitproperty
      state:
        field: value
        value: active
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-usbguard-service-active:
      test_title: usbguard.service is active
      capability: linux.systemdunitproperty
      object: usbguard-service-activestate-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-usbguard-service-active
  evaluate:
    test: test-usbguard-service-active
