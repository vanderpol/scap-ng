assessment:
  id: SV-257840.automated
  version: 1
  assessment_title: RHEL-09-215085 - RHEL 9 must have the nss-tools package installed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-rpminfo-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: nss-tools
      object_title: null
  states: {}
  tests:
    test-package-nss-tools-installed:
      test_title: package nss-tools is installed
      capability: linux.rpminfo
      object: linux-rpminfo-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    test: test-package-nss-tools-installed
