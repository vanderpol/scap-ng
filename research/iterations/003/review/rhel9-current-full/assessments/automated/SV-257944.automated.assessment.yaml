assessment:
  id: SV-257944.automated
  version: 1
  assessment_title: RHEL-09-252015 - RHEL 9 chronyd service must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-systemdunitproperty-object:
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          value: chronyd.service
        property:
          operation: equals
          datatype: string
          value: ActiveState
      object_title: null
  states:
    state-linux-systemdunitproperty:
      state_title: null
      capability: linux.systemdunitproperty
      state:
        field: value
        value: active
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-chronyd-service-active:
      test_title: chronyd service is active
      capability: linux.systemdunitproperty
      object: linux-systemdunitproperty-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-linux-systemdunitproperty
  evaluate:
    test: test-chronyd-service-active
