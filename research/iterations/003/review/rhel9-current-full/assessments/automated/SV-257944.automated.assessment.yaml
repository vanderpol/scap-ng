assessment:
  id: SV-257944.automated
  version: 1
  assessment_title: RHEL-09-252015 - RHEL 9 chronyd service must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-systemdunitproperty-collection:
      collection_title: null
      select:
        unit:
          operation: equals
          datatype: string
          mask: false
          value: chronyd.service
        property:
          operation: equals
          datatype: string
          mask: false
          value: ActiveState
  tests:
    test-chronyd-service-active:
      test_title: chronyd service is active
      capability: linux.systemdunitproperty
      collection: linux-systemdunitproperty-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          field: value
          value: active
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-chronyd-service-active
