assessment:
  id: SV-258146.automated
  version: 2
  assessment_title: RHEL-09-652040 - RHEL 9 must authenticate the remote logging server for offloading audit logs
    via rsyslog.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    rsyslog-conf-actionsendstreamdriverauthmode-collection:
      collection_title: 'rsyslog.conf: ActionSendStreamDriverAuthMode'
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/rsyslog.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\$ActionSendStreamDriverAuthMode\s+(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
    rsyslog-d-conf-actionsendstreamdriverauthmode-collection:
      collection_title: 'rsyslog.d/*.conf: ActionSendStreamDriverAuthMode'
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/rsyslog.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^.*\.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\$ActionSendStreamDriverAuthMode\s+(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
    actionsendstreamdriverauthmode-collection:
      collection_title: ActionSendStreamDriverAuthMode
      set:
        operator: union
        members:
        - collection: rsyslog-conf-actionsendstreamdriverauthmode-collection
        - collection: rsyslog-d-conf-actionsendstreamdriverauthmode-collection
    rsyslog-conf-action-all-messages-collection:
      collection_title: 'rsyslog.conf: action for all messages'
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/rsyslog.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\*\.\*\s+action\((\s*(?:[^#\)]*(?:#.*$)?\n)*[^#\)]*)\)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
    rsyslog-d-conf-action-all-messages-collection:
      collection_title: 'rsyslog.d/*.conf: action for all messages'
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/rsyslog.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^.*\.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\*\.\*\s+action\((\s*(?:[^#\)]*(?:#.*$)?\n)*[^#\)]*)\)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
    rsyslog-action-all-messages-collection:
      collection_title: 'rsyslog: action for all messages'
      set:
        operator: union
        members:
        - collection: rsyslog-conf-action-all-messages-collection
        - collection: rsyslog-d-conf-action-all-messages-collection
    rsyslog-conf-module-blocks-collection:
      collection_title: 'rsyslog.conf: module blocks'
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/rsyslog.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*module\((\s*(?:[^#\)]*(?:#.*$)?\n)*[^#\)]*)\)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
    rsyslog-d-conf-module-blocks-collection:
      collection_title: 'rsyslog.d/*.conf: module blocks'
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/rsyslog.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^.*\.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*module\((\s*(?:[^#\)]*(?:#.*$)?\n)*[^#\)]*)\)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
    rsyslog-module-blocks-collection:
      collection_title: 'rsyslog: module blocks'
      set:
        operator: union
        members:
        - collection: rsyslog-conf-module-blocks-collection
        - collection: rsyslog-d-conf-module-blocks-collection
  tests:
    test-actionsendstreamdriverauthmode-x509-name:
      test_title: ActionSendStreamDriverAuthMode == x509/name
      capability: independent.textfilecontent54
      collection: actionsendstreamdriverauthmode-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          field: subexpression
          value: x509/name
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-streamdriverauthmode-set-x509-name-advanced-syntax:
      test_title: StreamDriverAuthMode is set to x509/name (advanced syntax)
      capability: independent.textfilecontent54
      collection: rsyslog-action-all-messages-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_operator: AND
        states:
        - state_title: null
          state:
            field: subexpression
            value: (?i)(?:^|\n)[^#]*\btype\s*=\s*"omfwd"
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          state:
            field: subexpression
            value: (?i)(?:^|\n)[^#]*\bStreamDriver\.?AuthMode\s*=\s*"x509/name"
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-streamdriverauthmode-not-set-in-module-block-advanced-syntax:
      test_title: StreamDriverAuthMode is not set in a module block (advanced syntax)
      capability: independent.textfilecontent54
      collection: rsyslog-module-blocks-collection
      assertion:
        existence: any_exist
        item_quantifier: none satisfy
        state_title: null
        state:
          field: subexpression
          value: (?i)(?:^|\n)[^#]*\bStreamDriver\.?AuthMode\b
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - any:
      - test: test-actionsendstreamdriverauthmode-x509-name
      - test: test-streamdriverauthmode-set-x509-name-advanced-syntax
    - test: test-streamdriverauthmode-not-set-in-module-block-advanced-syntax
