assessment:
  id: SV-257803.automated
  version: 1
  assessment_title: RHEL-09-213040 - RHEL 9 must disable the kernel.core_pattern.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    unix-sysctl-object:
      capability: unix.sysctl
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: kernel.core_pattern
      object_title: null
  states:
    state-unix-sysctl:
      state_title: null
      capability: unix.sysctl
      state:
        field: value
        value: '|/bin/false'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-kernel-core-pattern-setting-in-kernel-set-bin-false:
      test_title: kernel.core_pattern setting in kernel is set to |/bin/false
      capability: unix.sysctl
      object: unix-sysctl-object
      check_existence: all_exist
      check: all
      states:
      - state-unix-sysctl
  evaluate:
    test: test-kernel-core-pattern-setting-in-kernel-set-bin-false
