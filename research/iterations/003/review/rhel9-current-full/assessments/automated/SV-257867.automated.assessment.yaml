assessment:
  id: SV-257867.automated
  version: 2
  assessment_title: RHEL-09-231130 - RHEL 9 must mount /tmp with the noexec option.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    linux-partition-object:
      capability: linux.partition
      select:
        mount_point:
          operation: equals
          datatype: string
          mask: false
          value: /tmp
      object_title: null
  states:
    state-linux-partition:
      state_title: null
      capability: linux.partition
      state:
        field: mount_options
        value: noexec
        operation: equals
        datatype: string
        mask: false
        entity_check: at least one
        entity_existence: at_least_one_exists
  tests:
    test-tmp-mounted-noexec-option:
      test_title: /tmp is mounted with the noexec option
      capability: linux.partition
      object: linux-partition-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-linux-partition
  evaluate:
    test: test-tmp-mounted-noexec-option
