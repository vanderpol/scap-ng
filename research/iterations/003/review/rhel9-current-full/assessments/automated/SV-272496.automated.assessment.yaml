assessment:
  id: SV-272496.automated
  version: 1
  assessment_title: RHEL-09-431016 - RHEL 9 must elevate the SELinux context when an administrator calls the sudo
    command.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    independent-textfilecontent54-object-2:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/sudoers
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(.*\bsysadm_r\b.*)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: null
    independent-textfilecontent54-object-3:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/sudoers.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(.*\bsysadm_r\b.*)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
        max_depth: '-1'
        recurse_direction: down
      object_title: null
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - object: independent-textfilecontent54-object-2
        - object: independent-textfilecontent54-object-3
      object_title: null
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^[ \t]*%[a-zA-Z0-9_-]+[ \t]+ALL=\(ALL\)[ \t]+TYPE=sysadm_t[ \t]+ROLE=sysadm_r[ \t]+ALL[ \t]*$
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-elevate-selinux-context-when-administrator-calls-sudo-command:
      test_title: elevate the SELinux context when an administrator calls the sudo command
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    test: test-elevate-selinux-context-when-administrator-calls-sudo-command
