assessment:
  id: SV-272496.automated
  version: 1
  assessment_title: RHEL-09-431016 - RHEL 9 must elevate the SELinux context when an administrator calls the sudo
    command.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection-2:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/sudoers
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(.*\bsysadm_r\b.*)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-textfilecontent54-collection-3:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/sudoers.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(.*\bsysadm_r\b.*)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
        max_depth: '-1'
        recurse_direction: down
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - collection: independent-textfilecontent54-collection-2
        - collection: independent-textfilecontent54-collection-3
  tests:
    test-elevate-selinux-context-when-administrator-calls-sudo-command:
      test_title: elevate the SELinux context when an administrator calls the sudo command
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^[ \t]*%[a-zA-Z0-9_-]+[ \t]+ALL=\(ALL\)[ \t]+TYPE=sysadm_t[ \t]+ROLE=sysadm_r[ \t]+ALL[ \t]*$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-elevate-selinux-context-when-administrator-calls-sudo-command
