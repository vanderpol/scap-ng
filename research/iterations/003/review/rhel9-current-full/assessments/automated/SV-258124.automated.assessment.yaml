  version: 1
  assessment_title: RHEL-09-611175 - RHEL 9 must have the pcsc-lite package installed.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-rpminfo-collection:
      collection_title: null
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
