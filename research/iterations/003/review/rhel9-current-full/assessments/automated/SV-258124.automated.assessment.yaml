  tests:
    test-package-pcsc-lite-installed:
      test_title: package pcsc-lite is installed
      capability: linux.rpminfo
      collection: linux-rpminfo-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    test: test-package-pcsc-lite-installed
