assessment:
  id: SV-257785.automated
  version: 1
  assessment_title: RHEL-09-211050 - The x86 Ctrl-Alt-Delete key sequence must be disabled on RHEL 9.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-symlink-object:
      capability: unix.symlink
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/systemd/system/ctrl-alt-del.target
      object_title: null
  states:
    state-unix-symlink:
      state_title: null
      capability: unix.symlink
      state:
        field: canonical_path
        value: /dev/null
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-ctrl-alt-del-target-unit-masked:
      test_title: The ctrl-alt-del.target unit is masked.
      capability: unix.symlink
      object: unix-symlink-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-unix-symlink
  evaluate:
    test: test-ctrl-alt-del-target-unit-masked
