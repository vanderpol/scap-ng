assessment:
  id: SV-258141.automated
  version: 1
  assessment_title: RHEL-09-652015 - RHEL 9 must have the packages required for encrypting offloaded audit logs
    installed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-rpminfo-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          value: rsyslog-gnutls
      object_title: null
  states: {}
  tests:
    test-package-rsyslog-gnutls-installed:
      test_title: package rsyslog-gnutls is installed
      capability: linux.rpminfo
      object: linux-rpminfo-object
      check_existence: all_exist
      check: all
  evaluate:
    test: test-package-rsyslog-gnutls-installed
