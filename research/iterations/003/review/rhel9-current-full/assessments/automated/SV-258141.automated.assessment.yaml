assessment:
  id: SV-258141.automated
  version: 1
  assessment_title: RHEL-09-652015 - RHEL 9 must have the packages required for encrypting offloaded audit logs
    installed.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-rpminfo-collection:
      collection_title: null
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: rsyslog-gnutls
  tests:
    test-package-rsyslog-gnutls-installed:
      test_title: package rsyslog-gnutls is installed
      capability: linux.rpminfo
      collection: linux-rpminfo-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state: null
  evaluate:
    test: test-package-rsyslog-gnutls-installed
