assessment:
  id: SV-258174.automated
  version: 13
  assessment_title: RHEL 9 must have mail aliases to notify the information system security officer (ISSO) and system
    administrator (SA) (at a minimum) in the event of an audit processing failure.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    retrive-location-alias-maps-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: postconf alias_maps
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*alias_maps\s+=\s+(hash:.*)$
      object_title: Retrive location of alias maps.
    confirm-postfix-alias-map-s-exist-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          variable_check: all
          value:
            variable: retrieve-location-alias-map-construct-postmap-query-variable
      object_title: Confirm postfix alias map(s) exist.
  variables:
    retrieve-location-alias-map-construct-postmap-query-variable:
      title: Retrieve location of alias map and construct postmap query.
      kind: local
      datatype: string
      expression:
        concat:
        - literal:
            value: 'postmap -q root '
            datatype: string
        - values:
            object: retrive-location-alias-maps-object
            field: subexpression
  states:
    state-confirm-an-alias-is-returned-by-the-postconf-query:
      state_title: Confirm an alias is returned by the postconf query.
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: \w+
          operation: pattern match
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-confirm-postfix-configured-notify-in-event-audit-processing-failure:
      test_title: Confirm postfix is configured to notify in the event of an audit processing failure.
      capability: independent.shellcommand
      object: confirm-postfix-alias-map-s-exist-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-confirm-an-alias-is-returned-by-the-postconf-query
  evaluate:
    test: test-confirm-postfix-configured-notify-in-event-audit-processing-failure
