assessment:
  id: SV-257835.automated
  version: 2
  assessment_title: RHEL-09-215060 - The Trivial File Transfer Protocol (TFTP) server must not be installed unless
    it is required, and if required, the RHEL 9 TFTP daemon must be configured to operate in secure mode.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /usr/lib/systemd/system/tftp.service
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^ExecStart[ \t]*=[ \t]*\/usr\/sbin\/in\.tftpd[ \t]*-s[ \t]+/\S+[ \t]*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: null
  states: {}
  tests:
    test-usr-lib-systemd-system-tftp-service-execstart-has-s-option:
      test_title: '/usr/lib/systemd/system/tftp.service: ExecStart has a -s option with a subdirectory assigned'
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    test: test-usr-lib-systemd-system-tftp-service-execstart-has-s-option
