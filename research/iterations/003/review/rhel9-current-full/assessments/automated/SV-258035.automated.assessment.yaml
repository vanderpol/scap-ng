assessment:
  id: SV-258035.automated
  version: 2
  assessment_title: RHEL-09-291015 - RHEL 9 must have the USBGuard package installed.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-rpminfo-collection:
      collection_title: null
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: usbguard
  tests:
    test-usbguard-package-installed:
      test_title: usbguard package is installed
      capability: linux.rpminfo
      collection: linux-rpminfo-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    test: test-usbguard-package-installed
