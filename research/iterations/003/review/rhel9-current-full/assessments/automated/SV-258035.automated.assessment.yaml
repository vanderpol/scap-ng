assessment:
  id: SV-258035.automated
  version: 2
  assessment_title: RHEL-09-291015 - RHEL 9 must have the USBGuard package installed.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    linux-rpminfo-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: usbguard
      object_title: null
  states: {}
  tests:
    test-usbguard-package-installed:
      test_title: usbguard package is installed
      capability: linux.rpminfo
      object: linux-rpminfo-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    test: test-usbguard-package-installed
