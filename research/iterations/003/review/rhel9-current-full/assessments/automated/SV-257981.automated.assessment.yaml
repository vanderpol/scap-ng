assessment:
  id: SV-257981.automated
  version: 2
  assessment_title: RHEL-09-255025 - RHEL 9 must display the Standard Mandatory DOD Notice and Consent Banner before
    granting local or remote access to the system via a SSH logon.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    pull-value-etc-ssh-sshd-config-banner-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*(?i)banner(?-i)[ \t\"]+([\w\/]+)[\"\s]*(?:|(?:#.*))?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: Pull value of /etc/ssh/sshd_config:banner
    pull-value-etc-ssh-sshd-config-d-banner-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .+
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*(?i)banner(?-i)[ \t\"]+([\w\/]+)[\"\s]*(?:|(?:#.*))?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: Pull value of /etc/ssh/sshd_config.d:banner
    all-sshd-config-sshd-config-d-files-object:
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - object: pull-value-etc-ssh-sshd-config-banner-object
        - object: pull-value-etc-ssh-sshd-config-d-banner-object
      object_title: all sshd_config and sshd_config.d/* files
    pull-value-etc-ssh-sshd-config-banner-object-2:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*(?i)banner(?-i)[ \t]*(?:none[\s]*|(?:#.*))?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: Pull value of /etc/ssh/sshd_config:banner
    pull-value-etc-ssh-sshd-config-d-banner-object-2:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .+
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*(?i)banner(?-i)[ \t]*(?:none[\s]*|(?:#.*))?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: Pull value of /etc/ssh/sshd_config.d:banner
    all-sshd-config-sshd-config-d-files-object-2:
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - object: pull-value-etc-ssh-sshd-config-banner-object-2
        - object: pull-value-etc-ssh-sshd-config-d-banner-object-2
      object_title: all sshd_config and sshd_config.d/* files
  states:
    state-banner-value-is-set-to-etc-issue:
      state_title: banner value is set to /etc/issue
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^\/.+$
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-etc-ssh-sshd-config-banner-etc-issue:
      test_title: /etc/ssh/sshd_config:banner == /etc/issue
      capability: independent.textfilecontent54
      object: all-sshd-config-sshd-config-d-files-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-banner-value-is-set-to-etc-issue
    test-etc-ssh-sshd-config-banner-none:
      test_title: /etc/ssh/sshd_config:banner == none
      capability: independent.textfilecontent54
      object: all-sshd-config-sshd-config-d-files-object-2
      check_existence: none_exist
      check: all
  evaluate:
    all:
    - test: test-etc-ssh-sshd-config-banner-etc-issue
    - test: test-etc-ssh-sshd-config-banner-none
