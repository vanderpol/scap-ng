assessment:
  id: SV-257959.automated
  version: 3
  assessment_title: RHEL-09-253020 - RHEL 9 must not forward Internet Protocol version 4 (IPv4) source-routed packets.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    unix-sysctl-collection:
      collection_title: null
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: net.ipv4.conf.all.accept_source_route
  tests:
    test-net-ipv4-conf-all-accept-source-routesetting-in-kernel-set:
      test_title: net.ipv4.conf.all.accept_source_routesetting in kernel is set to 0
      capability: unix.sysctl
      collection: unix-sysctl-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: null
        state:
          field: value
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-net-ipv4-conf-all-accept-source-routesetting-in-kernel-set
