assessment:
  id: SV-257919.automated
  version: 13
  assessment_title: RHEL 9 system commands must be group-owned by root or a system account.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    all-system-command-files-not-owned-by-root-group-or-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          variable_check: only one
          value:
            variable: system-command-directories-variable
        filename:
          operation: pattern match
          datatype: string
          value: .*
      filters:
      - action: exclude
        state: state-owned-by-root-group-or-system-group-gid-less-than-1000
      - action: exclude
        state: state-symbolic-links
      - action: exclude
        state: state-unix-file
      behaviors:
        recurse_direction: down
      object_title: All system-command files not owned by root-group or system-group (id less than 1000)
  variables:
    system-command-directories-variable:
      title: system command directories
      kind: constant
      datatype: string
      expression:
        literal:
        - /bin
        - /sbin
        - /usr/bin
        - /usr/libexec
        - /usr/sbin
        - /usr/local/bin
        - /usr/local/sbin
  states:
    state-owned-by-root-group-or-system-group-gid-less-than-1000:
      state_title: owned by root-group or system-group ( gid less than 1000)
      capability: unix.file
      state:
        field: group_id
        value: '1000'
        operation: less than
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
    state-symbolic-links:
      state_title: symbolic links
      capability: unix.file
      state:
        field: type
        value: symbolic link
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-unix-file:
      state_title: null
      capability: unix.file
      state:
        field: type
        value: directory
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-files-in-system-command-directories-owned-by-root-group-or:
      test_title: Files in System command directories are owned by root-group or a system group gid less than 1000.
      capability: unix.file
      object: all-system-command-files-not-owned-by-root-group-or-object
      check_existence: none_exist
      check: all
  evaluate:
    test: test-files-in-system-command-directories-owned-by-root-group-or
