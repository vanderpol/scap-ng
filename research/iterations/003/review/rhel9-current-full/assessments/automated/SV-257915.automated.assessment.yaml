assessment:
  id: SV-257915.automated
  version: 1
  assessment_title: RHEL-09-232175 - RHEL 9 /var/log directory must be group-owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    var-log-directory-collection:
      collection_title: /var/log directory
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /var/log
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
  tests:
    test-var-log-directory-group-owned-by-root:
      test_title: /var/log directory is group-owned by root.
      capability: unix.file
      collection: var-log-directory-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: group-owned by root
        state:
          field: group_id
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-var-log-directory-group-owned-by-root
