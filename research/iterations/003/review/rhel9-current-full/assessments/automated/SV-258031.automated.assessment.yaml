assessment:
  id: SV-258031.automated
  version: 13
  assessment_title: RHEL 9 must disable the ability of a user to accidentally press Ctrl-Alt-Del and cause a system
    to shut down or reboot.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    retrieve-gnome-desktop-logout-setting-collection:
      collection_title: Retrieve GNOME desktop logout setting.
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: gsettings get org.gnome.settings-daemon.plugins.media-keys logout
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
  tests:
    test-verify-rhel-9-configured-ignore-ctrl-alt-del-sequence-in:
      test_title: Verify RHEL 9 is configured to ignore the Ctrl-Alt-Del sequence in the GNOME desktop.
      capability: independent.shellcommand
      collection: retrieve-gnome-desktop-logout-setting-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Confirm GNOME desktop logout setting is [''].
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: '['''']'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-verify-rhel-9-configured-ignore-ctrl-alt-del-sequence-in
