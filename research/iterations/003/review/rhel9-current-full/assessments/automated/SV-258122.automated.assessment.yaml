assessment:
  id: SV-258122.automated
  version: 1
  assessment_title: RHEL-09-611165 - RHEL 9 must enable certificate based smart card authentication.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    sssd-conf-pam-cert-auth-collection:
      collection_title: 'sssd.conf: pam_cert_auth'
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/sssd/sssd.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*pam_cert_auth\s*=\s*(.*)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    etc-sssd-conf-d-pam-cert-auth-collection:
      collection_title: '/etc/sssd/conf.d: pam_cert_auth'
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/sssd/conf.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .+
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*pam_cert_auth\s*=\s*(.*)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        recurse_direction: down
    independent-textfilecontent54-collection:
      collection_title: null
      set:
        operator: union
        members:
        - collection: sssd-conf-pam-cert-auth-collection
        - collection: etc-sssd-conf-d-pam-cert-auth-collection
  tests:
    test-sssd-conf-pam-cert-auth-true:
      test_title: 'sssd.conf: pam_cert_auth = True'
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          field: subexpression
          value: 'true'
          operation: case insensitive equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-sssd-conf-pam-cert-auth-true
