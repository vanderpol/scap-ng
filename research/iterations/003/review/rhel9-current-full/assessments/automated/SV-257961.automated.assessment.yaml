assessment:
  id: SV-257961.automated
  version: 2
  assessment_title: RHEL-09-253030 - RHEL 9 must log IPv4 packets with impossible addresses by default.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    unix-sysctl-collection:
      collection_title: null
      capability: unix.sysctl
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: net.ipv4.conf.default.log_martians
  tests:
    test-net-ipv4-conf-default-log-martians-setting-in-kernel-set:
      test_title: net.ipv4.conf.default.log_martians setting in kernel is set to 1
      capability: unix.sysctl
      collection: unix-sysctl-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: null
        state_capability: unix.sysctl
        state:
          field: value
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-net-ipv4-conf-default-log-martians-setting-in-kernel-set
