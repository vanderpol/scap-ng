assessment:
  id: SV-258041.automated
  version: 1
  assessment_title: RHEL-09-411010 - RHEL 9 user account passwords for new users or password changes must have a
    60-day maximum password lifetime restriction in /etc/login.defs.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/login.defs
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*PASS_MAX_DAYS\s+(\d+)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-pass-max-days-less-than-or-equal-60-but-greater:
      test_title: PASS_MAX_DAYS is less than or equal to 60 but greater than 0.
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: AND
        states:
        - state_title: null
          state:
            field: subexpression
            value: '0'
            operation: greater than
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          state:
            field: subexpression
            value: '60'
            operation: less than or equal
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-pass-max-days-less-than-or-equal-60-but-greater
