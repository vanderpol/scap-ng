assessment:
  id: SV-257888.automated
  version: 13
  assessment_title: RHEL 9 permissions of cron configuration files and directories must not be modified from the
    operating system defaults.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    retrieve-cron-configuration-files-directories-which-do-not-match-operating-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: rpm --verify cronie crontabs | awk '! ($2 == "c" && $1 ~ /^.\..\.\.\.\..\./) {print $0}'
      object_title: Retrieve cron configuration files and directories which do not match the operating system defaults.
  states:
    state-confirm-no-non-compliant-files-are-identified:
      state_title: Confirm no non-compliant files are identified.
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: ''
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: none_exist
  tests:
    test-confirm-permissions-cron-configuration-files-directories-match-operating-system-defaults:
      test_title: Confirm permissions of cron configuration files and directories match the operating system defaults.
      capability: independent.shellcommand
      object: retrieve-cron-configuration-files-directories-which-do-not-match-operating-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-confirm-no-non-compliant-files-are-identified
  evaluate:
    test: test-confirm-permissions-cron-configuration-files-directories-match-operating-system-defaults
