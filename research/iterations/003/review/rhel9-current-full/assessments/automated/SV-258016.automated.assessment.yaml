assessment:
  id: SV-258016.automated
  version: 13
  assessment_title: RHEL 9 must disable the graphical user interface autorun function unless required.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    retrieve-gsettings-autorun-never-setting-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: gsettings get org.gnome.desktop.media-handling autorun-never
      object_title: Retrieve the gsettings autorun-never setting.
  states:
    state-confirm-value-is-true:
      state_title: Confirm value is 'true'.
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: 'true'
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-verify-rhel-9-disables-graphical-user-interface-autorun-function:
      test_title: Verify RHEL 9 disables the graphical user interface autorun function.
      capability: independent.shellcommand
      object: retrieve-gsettings-autorun-never-setting-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-confirm-value-is-true
  evaluate:
    test: test-verify-rhel-9-disables-graphical-user-interface-autorun-function
