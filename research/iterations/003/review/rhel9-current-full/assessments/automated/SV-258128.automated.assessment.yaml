assessment:
  id: SV-258128.automated
  version: 1
  assessment_title: RHEL-09-611195 - RHEL 9 must require authentication to access emergency mode.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    usr-lib-systemd-system-emergency-service-execstart-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /usr/lib/systemd/system/emergency.service
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^ExecStart=(.*)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: /usr/lib/systemd/system/emergency.service ExecStart
  states:
    state-emergency-service-execstart:
      state_title: emergency.service ExecStart
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: -/usr/lib/systemd/systemd-sulogin-shell emergency
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-emergency-service-config-correct:
      test_title: emergency.service config correct
      capability: independent.textfilecontent54
      object: usr-lib-systemd-system-emergency-service-execstart-object
      check_existence: all_exist
      check: all
      states:
      - state-emergency-service-execstart
  evaluate:
    test: test-emergency-service-config-correct
