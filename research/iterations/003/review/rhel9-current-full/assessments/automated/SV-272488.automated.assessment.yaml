assessment:
  id: SV-272488.automated
  version: 1
  assessment_title: RHEL-09-215101 - RHEL 9 must have the Postfix package installed.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-rpminfo-collection:
      collection_title: null
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: postfix
  tests:
    test-postfix-package-installed:
      test_title: The postfix package is installed
      capability: linux.rpminfo
      collection: linux-rpminfo-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    test: test-postfix-package-installed
