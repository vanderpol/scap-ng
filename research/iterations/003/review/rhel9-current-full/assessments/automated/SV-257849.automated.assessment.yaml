assessment:
  id: SV-257849.automated
  version: 1
  assessment_title: RHEL-09-231040 - RHEL 9 file system automount function must be disabled unless required.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-systemdunitproperty-collection:
      collection_title: null
      select:
        unit:
          operation: equals
          datatype: string
          mask: false
          value: autofs.service
        property:
          operation: equals
          datatype: string
          mask: false
          value: ActiveState
  tests:
    test-autofs-service-activestate-inactive-if-it-exists:
      test_title: autofs.service ActiveState is inactive if it exists.
      capability: linux.systemdunitproperty
      collection: linux-systemdunitproperty-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: null
        state:
          field: value
          value: inactive
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-autofs-service-activestate-inactive-if-it-exists
