assessment:
  id: SV-258236.automated
  version: 1
  assessment_title: RHEL-09-672020 - RHEL 9 crypto policy must not be overridden.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    bind-object:
      capability: unix.symlink
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/crypto-policies/back-ends/bind.config
      object_title: bind
    gnutls-object:
      capability: unix.symlink
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/crypto-policies/back-ends/gnutls.config
      object_title: gnutls
    java-object:
      capability: unix.symlink
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/crypto-policies/back-ends/java.config
      object_title: java
    javasystem-object:
      capability: unix.symlink
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/crypto-policies/back-ends/javasystem.config
      object_title: javasystem
    krb5-object:
      capability: unix.symlink
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/crypto-policies/back-ends/krb5.config
      object_title: krb5
    libreswan-object:
      capability: unix.symlink
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/crypto-policies/back-ends/libreswan.config
      object_title: libreswan
    libssh-object:
      capability: unix.symlink
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/crypto-policies/back-ends/libssh.config
      object_title: libssh
    nss-object:
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/crypto-policies/back-ends/nss.config
      object_title: nss
    openssh-object:
      capability: unix.symlink
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/crypto-policies/back-ends/openssh.config
      object_title: openssh
    opensshserver-object:
      capability: unix.symlink
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/crypto-policies/back-ends/opensshserver.config
      object_title: opensshserver
    opensslcnf-object:
      capability: unix.symlink
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/crypto-policies/back-ends/opensslcnf.config
      object_title: opensslcnf
    openssl-object:
      capability: unix.symlink
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/crypto-policies/back-ends/openssl.config
      object_title: openssl
  states:
    state-bind:
      state_title: bind
      capability: unix.symlink
      state:
        field: canonical_path
        value: /usr/share/crypto-policies/FIPS/bind.txt
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-gnutls:
      state_title: gnutls
      capability: unix.symlink
      state:
        field: canonical_path
        value: /usr/share/crypto-policies/FIPS/gnutls.txt
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-java:
      state_title: java
      capability: unix.symlink
      state:
        field: canonical_path
        value: /usr/share/crypto-policies/FIPS/java.txt
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-javasystem:
      state_title: javasystem
      capability: unix.symlink
      state:
        field: canonical_path
        value: /usr/share/crypto-policies/FIPS/javasystem.txt
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-krb5:
      state_title: krb5
      capability: unix.symlink
      state:
        field: canonical_path
        value: /usr/share/crypto-policies/FIPS/krb5.txt
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-libreswan:
      state_title: libreswan
      capability: unix.symlink
      state:
        field: canonical_path
        value: /usr/share/crypto-policies/FIPS/libreswan.txt
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-libssh:
      state_title: libssh
      capability: unix.symlink
      state:
        field: canonical_path
        value: /usr/share/crypto-policies/FIPS/libssh.txt
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-ensure-nss-is-a-regular-file:
      state_title: Ensure nss is a regular file
      capability: unix.file
      state:
        field: type
        value: regular
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-openssh:
      state_title: openssh
      capability: unix.symlink
      state:
        field: canonical_path
        value: /usr/share/crypto-policies/FIPS/openssh.txt
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-opensshserver:
      state_title: opensshserver
      capability: unix.symlink
      state:
        field: canonical_path
        value: /usr/share/crypto-policies/FIPS/opensshserver.txt
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-opensslcnf:
      state_title: opensslcnf
      capability: unix.symlink
      state:
        field: canonical_path
        value: /usr/share/crypto-policies/FIPS/opensslcnf.txt
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-openssl:
      state_title: openssl
      capability: unix.symlink
      state:
        field: canonical_path
        value: /usr/share/crypto-policies/FIPS/openssl.txt
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-bind:
      test_title: bind
      capability: unix.symlink
      object: bind-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-bind
    test-gnutls:
      test_title: gnutls
      capability: unix.symlink
      object: gnutls-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-gnutls
    test-java:
      test_title: java
      capability: unix.symlink
      object: java-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-java
    test-javasystem:
      test_title: javasystem
      capability: unix.symlink
      object: javasystem-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-javasystem
    test-krb5:
      test_title: krb5
      capability: unix.symlink
      object: krb5-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-krb5
    test-libreswan:
      test_title: libreswan
      capability: unix.symlink
      object: libreswan-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-libreswan
    test-libssh:
      test_title: libssh
      capability: unix.symlink
      object: libssh-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-libssh
    test-nss:
      test_title: nss
      capability: unix.file
      object: nss-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-ensure-nss-is-a-regular-file
    test-openssh:
      test_title: openssh
      capability: unix.symlink
      object: openssh-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-openssh
    test-opensshserver:
      test_title: opensshserver
      capability: unix.symlink
      object: opensshserver-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-opensshserver
    test-opensslcnf:
      test_title: opensslcnf
      capability: unix.symlink
      object: opensslcnf-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-opensslcnf
    test-openssl:
      test_title: openssl
      capability: unix.symlink
      object: openssl-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-openssl
  evaluate:
    all:
    - test: test-bind
    - test: test-gnutls
    - test: test-java
    - test: test-javasystem
    - test: test-krb5
    - test: test-libreswan
    - test: test-libssh
    - test: test-nss
    - test: test-openssh
    - test: test-opensshserver
    - test: test-opensslcnf
    - test: test-openssl
