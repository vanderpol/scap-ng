assessment:
  id: SV-258087.automated
  version: 2
  assessment_title: RHEL-09-432030 - RHEL 9 must restrict privilege elevation to authorized personnel.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/sudoers
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*ALL\s+ALL\=\(ALL(?:|\:ALL)\)\s+ALL\s*$
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
    independent-textfilecontent54-collection-2:
      collection_title: null
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/sudoers.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^.*$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*ALL\s+ALL\=\(ALL(?:|\:ALL)\)\s+ALL\s*$
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
        recurse_direction: down
  tests:
    test-all-does-not-exist-etc-sudoers:
      test_title: ALL does not exist /etc/sudoers
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
    test-all-does-not-exist-in-etc-sudoers-d:
      test_title: ALL does not exist in /etc/sudoers.d
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection-2
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
  evaluate:
    all:
    - test: test-all-does-not-exist-etc-sudoers
    - test: test-all-does-not-exist-in-etc-sudoers-d
