assessment:
  id: SV-257817.automated
  version: 13
  assessment_title: RHEL 9 must implement nonexecutable data to protect its memory from unauthorized code execution.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    check-flags-in-proc-cpuinfo-collection:
      collection_title: Check flags in /proc/cpuinfo.
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: grep ^flags /proc/cpuinfo | grep -Ev '([^[:alnum:]])(nx)([^[:alnum:]]|$)'
    verify-execshield-enabled-in-grub-collection:
      collection_title: Verify execshield is enabled in grub.
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: grubby --info=ALL | grep args | grep -E '([^[:alnum:]])(noexec)([^[:alnum:]])'
  tests:
    test-check-flags-in-proc-cpuinfo:
      test_title: Check flags in /proc/cpuinfo.
      capability: independent.shellcommand
      collection: check-flags-in-proc-cpuinfo-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Confirm no output produced by command.
        state:
          field: stdout_line
          value: ''
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: none_exist
    test-verify-execshield-enabled-in-grub:
      test_title: Verify execshield is enabled in grub.
      capability: independent.shellcommand
      collection: verify-execshield-enabled-in-grub-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Confirm no output produced by command.
        state:
          field: stdout_line
          value: ''
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: none_exist
  evaluate:
    all:
    - test: test-check-flags-in-proc-cpuinfo
    - test: test-verify-execshield-enabled-in-grub
