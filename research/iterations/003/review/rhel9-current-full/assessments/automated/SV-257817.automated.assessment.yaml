assessment:
  id: SV-257817.automated
  version: 13
  assessment_title: RHEL 9 must implement nonexecutable data to protect its memory from unauthorized code execution.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    check-flags-in-proc-cpuinfo-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: grep ^flags /proc/cpuinfo | grep -Ev '([^[:alnum:]])(nx)([^[:alnum:]]|$)'
      object_title: Check flags in /proc/cpuinfo.
    verify-execshield-enabled-in-grub-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: grubby --info=ALL | grep args | grep -E '([^[:alnum:]])(noexec)([^[:alnum:]])'
      object_title: Verify execshield is enabled in grub.
  states:
    state-confirm-no-output-produced-by-command:
      state_title: Confirm no output produced by command.
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: ''
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: none_exist
  tests:
    test-check-flags-in-proc-cpuinfo:
      test_title: Check flags in /proc/cpuinfo.
      capability: independent.shellcommand
      object: check-flags-in-proc-cpuinfo-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-confirm-no-output-produced-by-command
    test-verify-execshield-enabled-in-grub:
      test_title: Verify execshield is enabled in grub.
      capability: independent.shellcommand
      object: verify-execshield-enabled-in-grub-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-confirm-no-output-produced-by-command
  evaluate:
    all:
    - test: test-check-flags-in-proc-cpuinfo
    - test: test-verify-execshield-enabled-in-grub
