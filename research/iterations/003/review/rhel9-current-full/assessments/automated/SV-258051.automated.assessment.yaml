assessment:
  id: SV-258051.automated
  version: 2
  assessment_title: RHEL-09-411060 - All RHEL 9 local interactive users must have a home directory assigned in the
    /etc/passwd file.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    users-username-object:
      capability: unix.password
      select:
        username:
          operation: pattern match
          datatype: string
          mask: false
          value: '[\w]+'
      object_title: Users with an username
    only-non-system-users-uid-999-home-dirs-object:
      capability: unix.password
      set:
        operator: complement
        members:
        - object: users-username-object
        filters:
        - action: exclude
          state: state-only-uids-1000
      object_title: only non-system users (uid>999) home-dirs
    only-root-users-uid-0-home-dirs-object:
      capability: unix.password
      set:
        operator: complement
        members:
        - object: users-username-object
        filters:
        - action: exclude
          state: state-only-uids-0
      object_title: only root users (uid=0) home-dirs
  states:
    state-only-users-with-the-home-directory-defined:
      state_title: only users with the home directory defined
      capability: unix.password
      state:
        field: home_dir
        value: .+
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-only-uids-1000:
      state_title: only uids < 1000
      capability: unix.password
      state:
        field: user_id
        value: '1000'
        operation: less than
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-only-uids-0:
      state_title: only uids > 0
      capability: unix.password
      state:
        field: user_id
        value: '0'
        operation: greater than
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-check-users-without-home-directory-not-defined:
      test_title: check for users without a home directory not defined
      capability: unix.password
      object: only-non-system-users-uid-999-home-dirs-object
      check_existence: all_exist
      check: all
      states:
      - state-only-users-with-the-home-directory-defined
    test-check-if-root-s-home-directory-not-defined:
      test_title: check if root's home directory is not defined
      capability: unix.password
      object: only-root-users-uid-0-home-dirs-object
      check_existence: all_exist
      check: all
      states:
      - state-only-users-with-the-home-directory-defined
  evaluate:
    all:
    - test: test-check-users-without-home-directory-not-defined
    - test: test-check-if-root-s-home-directory-not-defined
