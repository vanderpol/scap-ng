assessment:
  id: SV-257958.automated
  version: 3
  assessment_title: RHEL-09-253015 - RHEL 9 must ignore Internet Protocol version 4 (IPv4) Internet Control Message
    Protocol (ICMP) redirect messages.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    unix-sysctl-collection:
      collection_title: null
      capability: unix.sysctl
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: net.ipv4.conf.all.accept_redirects
  tests:
    test-net-ipv4-conf-all-accept-redirects-set-0-in-kernel:
      test_title: net.ipv4.conf.all.accept_redirects is set to 0 in kernel
      capability: unix.sysctl
      collection: unix-sysctl-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: unix.sysctl
        state:
          field: value
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-net-ipv4-conf-all-accept-redirects-set-0-in-kernel
