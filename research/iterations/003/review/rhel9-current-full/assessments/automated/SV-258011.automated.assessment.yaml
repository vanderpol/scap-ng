assessment:
  id: SV-258011.automated
  version: 1
  assessment_title: RHEL-09-255175 - RHEL 9 SSH daemon must prevent remote hosts from connecting to the proxy display.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    sshd-config-x11uselocalhost-collection-2:
      collection_title: sshd_config X11UseLocalhost
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*(?i)X11useLocalhost(?-i)[ \t]+([\w\"]+)[\s]*(?:|(?:#.*))?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^.+\.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*(?i)X11useLocalhost(?-i)[ \t]+([\w\"]+)[\s]*(?:|(?:#.*))?$
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
      behaviors:
        max_depth: '-1'
        recurse_direction: down
    sshd-config-x11uselocalhost-collection:
      collection_title: sshd_config X11UseLocalhost
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - collection: sshd-config-x11uselocalhost-collection-2
        - collection: independent-textfilecontent54-collection
  tests:
    test-sshd-config-x11uselocalhost-set-yes:
      test_title: sshd_config X11UseLocalhost is set to yes.
      capability: independent.textfilecontent54
      collection: sshd-config-x11uselocalhost-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^(yes|"yes")$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-sshd-config-x11uselocalhost-set-yes
