assessment:
  id: SV-257977.automated
  version: 2
  assessment_title: RHEL-09-254040 - RHEL 9 must not forward IPv6 source-routed packets by default.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    unix-sysctl-object:
      capability: unix.sysctl
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: net.ipv6.conf.default.accept_source_route
      object_title: null
  states:
    state-unix-sysctl:
      state_title: null
      capability: unix.sysctl
      state:
        field: value
        value: '0'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-net-ipv6-conf-default-accept-source-route-setting-in-kernel:
      test_title: net.ipv6.conf.default.accept_source_route setting in kernel is set to 0
      capability: unix.sysctl
      object: unix-sysctl-object
      check_existence: all_exist
      check: all
      states:
      - state-unix-sysctl
  evaluate:
    test: test-net-ipv6-conf-default-accept-source-route-setting-in-kernel
