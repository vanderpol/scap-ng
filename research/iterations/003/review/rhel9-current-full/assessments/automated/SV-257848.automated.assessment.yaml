assessment:
  id: SV-257848.automated
  version: 1
  assessment_title: RHEL-09-231035 - RHEL 9 must use a separate file system for /var/tmp.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    var-tmp-object:
      capability: linux.partition
      select:
        mount_point:
          operation: equals
          datatype: string
          mask: false
          value: /var/tmp
      object_title: /var/tmp
  states: {}
  tests:
    test-var-tmp-mounted:
      test_title: /var/tmp is mounted
      capability: linux.partition
      object: var-tmp-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    test: test-var-tmp-mounted
