assessment:
  id: SV-257929.automated
  version: 13
  assessment_title: A sticky bit must be set on all RHEL 9 public directories.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    check-see-that-all-world-writable-directories-have-sticky-bit-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          value: /
        filename:
          operation: equals
          datatype: string
          nil: true
          value: ''
      filters:
      - action: exclude
        state: state-filter-exclude-directories-that-are-not-world-writable
      - action: exclude
        state: state-filter-exclude-any-with-sticky-bit
      behaviors:
        recurse_direction: down
        recurse: directories
        max_depth: '-1'
      object_title: Check to see that all world-writable directories have the sticky bit set. Gather world-writable
        directories.
  states:
    state-filter-exclude-directories-that-are-not-world-writable:
      state_title: Filter exclude directories that are not world writable.
      capability: unix.file
      state:
        field: owrite
        value: '0'
        operation: equals
        datatype: boolean
        entity_check: all
        entity_existence: at_least_one_exists
    state-filter-exclude-any-with-sticky-bit:
      state_title: Filter exclude any with sticky bit.
      capability: unix.file
      state:
        field: sticky
        value: '1'
        operation: equals
        datatype: boolean
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-check-that-all-world-writable-directories-have-sticky-bit-set:
      test_title: Check that all world-writable directories have the sticky bit set.
      capability: unix.file
      object: check-see-that-all-world-writable-directories-have-sticky-bit-object
      check_existence: none_exist
      check: all
  evaluate:
    test: test-check-that-all-world-writable-directories-have-sticky-bit-set
