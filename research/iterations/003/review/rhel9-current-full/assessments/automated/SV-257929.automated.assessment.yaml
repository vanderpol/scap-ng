assessment:
  id: SV-257929.automated
  version: 13
  assessment_title: A sticky bit must be set on all RHEL 9 public directories.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    check-see-that-all-world-writable-directories-have-sticky-bit-collection:
      collection_title: Check to see that all world-writable directories have the sticky bit set. Gather world-writable
        directories.
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
      filters:
      - action: exclude
        match:
          field: owrite
          value: '0'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: Filter exclude directories that are not world writable.
      - action: exclude
        match:
          field: sticky
          value: '1'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: Filter exclude any with sticky bit.
      behaviors:
        recurse_direction: down
        recurse: directories
        max_depth: '-1'
  tests:
    test-check-that-all-world-writable-directories-have-sticky-bit-set:
      test_title: Check that all world-writable directories have the sticky bit set.
      capability: unix.file
      collection: check-see-that-all-world-writable-directories-have-sticky-bit-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
  evaluate:
    test: test-check-that-all-world-writable-directories-have-sticky-bit-set
