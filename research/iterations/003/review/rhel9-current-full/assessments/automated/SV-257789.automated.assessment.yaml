assessment:
  id: SV-257789.automated
  version: 13
  assessment_title: RHEL 9 must require a unique superusers name upon booting into single-user and maintenance modes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    retrieve-any-configuration-lines-containing-root-admin-or-administrator-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/grub2.cfg
        pattern:
          operation: pattern match
          datatype: string
          value: ^\n*[\s#]*set\s+superusers="(root|admin|administrator)"
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: Retrieve any configuration lines containing root, admin, or administrator.
  states:
    state-include-filter-to-capture-non-compliant-configuration-li:
      state_title: Include filter to capture non-compliant configuration lines containing root, admin, or administrator.
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^(root|admin|administrator)$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-verify-boot-loader-password-not-set-root-admin-or-adminstrator:
      test_title: Verify the boot loader password is not set to root, admin, or adminstrator.
      capability: independent.textfilecontent54
      object: retrieve-any-configuration-lines-containing-root-admin-or-administrator-object
      check_existence: none_exist
      check: all
      states:
      - state-include-filter-to-capture-non-compliant-configuration-li
  evaluate:
    test: test-verify-boot-loader-password-not-set-root-admin-or-adminstrator
