assessment:
  id: SV-258023.automated
  version: 13
  assessment_title: RHEL 9 must automatically lock graphical user sessions after 10 minutes of inactivity.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    gather-gsettings-get-org-gnome-desktop-session-idle-delay-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: gsettings get org.gnome.desktop.session idle-delay
        pattern:
          operation: pattern match
          datatype: string
          value: uint32\s+(\d+)
      object_title: Gather gsettings get org.gnome.desktop.session idle-delay
  states:
    state-idle-delay-must-not-be-equal-to-zero:
      state_title: idle-delay must not be equal to zero
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: subexpression
          value: '0'
          operation: not equal
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
    state-idle-delay-must-be-less-than-or-equal-to-600:
      state_title: idle-delay must be less than or equal to 600
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: subexpression
          value: '600'
          operation: less than or equal
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-gnome-idle-delay-not-set-0-or-greater-than-600:
      test_title: Gnome idle-delay must not be set to 0 or greater than 600
      capability: independent.shellcommand
      object: gather-gsettings-get-org-gnome-desktop-session-idle-delay-object
      check_existence: at_least_one_exists
      check: all
      state_operator: AND
      states:
      - state-idle-delay-must-not-be-equal-to-zero
      - state-idle-delay-must-be-less-than-or-equal-to-600
  evaluate:
    test: test-gnome-idle-delay-not-set-0-or-greater-than-600
