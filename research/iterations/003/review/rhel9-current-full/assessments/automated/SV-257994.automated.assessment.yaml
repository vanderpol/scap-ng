assessment:
  id: SV-257994.automated
  version: 1
  assessment_title: RHEL-09-255090 - RHEL 9 must force a frequent session key renegotiation for SSH connections
    to the server.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*RekeyLimit\s+\d+[kmg]?\s+\d+[smdhw]?\s*
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
    sshd-config-includes-collection:
      collection_title: sshd_config includes
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*include\s+(.*)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
    independent-textfilecontent54-collection-2:
      collection_title: null
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^.+\.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*RekeyLimit\s+\d+[kmg]?\s+\d+[smdhw]?\s*
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
  tests:
    test-etc-ssh-sshd-config-rekeylimit-max-data-time-greater-than:
      test_title: /etc/ssh/sshd_config:RekeyLimit max data and time are greater than zero.
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: null
        state:
          field: text
          value: ^(?i)\s*RekeyLimit\s+[1-9][0-9]*[kmg]?\s+([1-9][0-9]*[smhdw]?)+\s*$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-sshd-config-includes-sshd-config-d:
      test_title: sshd_config includes sshd_config.d
      capability: independent.textfilecontent54
      collection: sshd-config-includes-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: null
        state:
          field: subexpression
          value: /etc/ssh/sshd_config.d/*.conf
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-etc-ssh-sshd-config-d-rekeylimit-max-data-time-greater:
      test_title: /etc/ssh/sshd_config.d:RekeyLimit max data and time are greater than zero.
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection-2
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: null
        state:
          field: text
          value: ^(?i)\s*RekeyLimit\s+[1-9][0-9]*[kmg]?\s+([1-9][0-9]*[smhdw]?)+\s*$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    any:
    - test: test-etc-ssh-sshd-config-rekeylimit-max-data-time-greater-than
    - all:
      - test: test-sshd-config-includes-sshd-config-d
      - test: test-etc-ssh-sshd-config-d-rekeylimit-max-data-time-greater
