assessment:
  id: SV-257801.automated
  version: 2
  assessment_title: RHEL-09-213030 - RHEL 9 must enable kernel parameters to enforce discretionary access control
    on hardlinks.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-sysctl-object:
      capability: unix.sysctl
      select:
        name:
          operation: equals
          datatype: string
          value: fs.protected_hardlinks
      object_title: null
  states:
    state-unix-sysctl:
      state_title: null
      capability: unix.sysctl
      state:
        field: value
        value: '1'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-fs-protected-hardlinks-setting-in-kernel-set-1:
      test_title: fs.protected_hardlinks setting in kernel is set to 1
      capability: unix.sysctl
      object: unix-sysctl-object
      check_existence: all_exist
      check: all
      states:
      - state-unix-sysctl
  evaluate:
    test: test-fs-protected-hardlinks-setting-in-kernel-set-1
