assessment:
  id: SV-258033.automated
  version: 2
  assessment_title: RHEL-09-271115 - RHEL 9 must disable the user list at logon for graphical user interfaces.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/dconf/db/local.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .+
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*\[org\/gnome\/login-screen]\s*\n+[^\[]*disable-user-list\s*=\s*(\w+)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-system-disables-gui-user-list-feature:
      test_title: The system disables the GUI user list feature.
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: 'true'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-system-disables-gui-user-list-feature
