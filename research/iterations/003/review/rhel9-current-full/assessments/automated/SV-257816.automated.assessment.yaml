assessment:
  id: SV-257816.automated
  version: 2
  assessment_title: RHEL-09-213105 - RHEL 9 must disable the use of user namespaces.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-sysctl-object:
      capability: unix.sysctl
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: user.max_user_namespaces
      object_title: null
  states:
    state-unix-sysctl:
      state_title: null
      capability: unix.sysctl
      state:
        field: value
        value: '0'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-user-max-user-namespaces-set-0-in-kernel:
      test_title: user.max_user_namespaces is set to 0 in kernel
      capability: unix.sysctl
      object: unix-sysctl-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-unix-sysctl
  evaluate:
    test: test-user-max-user-namespaces-set-0-in-kernel
