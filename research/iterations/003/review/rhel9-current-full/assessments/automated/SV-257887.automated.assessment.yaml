assessment:
  id: SV-257887.automated
  version: 1
  assessment_title: RHEL-09-232035 - RHEL 9 audit tools must have a mode of 0755 or less permissive.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    audit-tools-collection:
      collection_title: audit tools
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: audit-tools-variable
  variables:
    audit-tools-variable:
      title: audit tools
      kind: constant
      datatype: string
      expression:
        literal:
        - /sbin/auditctl
        - /sbin/aureport
        - /sbin/ausearch
        - /sbin/autrace
        - /sbin/auditd
        - /sbin/rsyslogd
        - /sbin/augenrules
  tests:
    test-audit-tools-have-mode-0755-or-less-permissive:
      test_title: audit tools have a mode of 0755 or less permissive.
      capability: unix.file
      collection: audit-tools-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: mode 0755 or less permissive
        state:
          all:
          - field: suid
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: sgid
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: sticky
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: gwrite
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: owrite
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-audit-tools-have-mode-0755-or-less-permissive
