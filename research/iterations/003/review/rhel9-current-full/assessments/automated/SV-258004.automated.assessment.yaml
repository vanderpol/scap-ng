assessment:
  id: SV-258004.automated
  version: 2
  assessment_title: RHEL-09-255140 - RHEL 9 SSH daemon must not allow Kerberos authentication.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*(?i)KerberosAuthentication(?-i)\s+("?\w+"?)\s*(?:|(?:#.*))?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: null
    sshd-config-includes-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*include\s+(.*)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
      object_title: sshd_config includes
    independent-textfilecontent54-object-3:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^.*\.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*(?i)KerberosAuthentication(?-i)\s+("?\w+"?)\s*(?:|(?:#.*))?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: null
    independent-textfilecontent54-object-2:
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - object: independent-textfilecontent54-object
        - object: independent-textfilecontent54-object-3
      object_title: null
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^(no|"no")$
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54-2:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: /etc/ssh/sshd_config.d/*.conf
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-etc-ssh-sshd-config-kerberosauthentication-no:
      test_title: /etc/ssh/sshd_config:KerberosAuthentication == no
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: all_exist
      check: all
      states:
      - state-independent-textfilecontent54
    test-sshd-config-includes-sshd-config-d:
      test_title: sshd_config includes sshd_config.d
      capability: independent.textfilecontent54
      object: sshd-config-includes-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-independent-textfilecontent54-2
    test-etc-ssh-sshd-config-sshd-config-d-kerberosauthentication-no:
      test_title: /etc/ssh/sshd_config + sshd_config.d:KerberosAuthentication == no
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-2
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    any:
    - all:
      - test: test-etc-ssh-sshd-config-kerberosauthentication-no
      - not:
          test: test-sshd-config-includes-sshd-config-d
    - all:
      - test: test-sshd-config-includes-sshd-config-d
      - test: test-etc-ssh-sshd-config-sshd-config-d-kerberosauthentication-no
