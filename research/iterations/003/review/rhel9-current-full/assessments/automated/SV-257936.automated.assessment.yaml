assessment:
  id: SV-257936.automated
  version: 2
  assessment_title: RHEL-09-251015 - The firewalld service on RHEL 9 must be active.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    firewalld-service-activestate-object:
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          mask: false
          value: firewalld.service
        property:
          operation: equals
          datatype: string
          mask: false
          value: ActiveState
      object_title: firewalld.service ActiveState
  states:
    state-linux-systemdunitproperty:
      state_title: null
      capability: linux.systemdunitproperty
      state:
        field: value
        value: active
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-check-if-firewalld-in-active-state:
      test_title: Check if firewalld is in 'active' state
      capability: linux.systemdunitproperty
      object: firewalld-service-activestate-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-linux-systemdunitproperty
  evaluate:
    test: test-check-if-firewalld-in-active-state
