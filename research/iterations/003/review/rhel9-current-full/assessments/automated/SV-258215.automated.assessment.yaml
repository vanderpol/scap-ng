assessment:
  id: SV-258215.automated
  version: 1
  assessment_title: RHEL-09-654205 - Successful/unsuccessful uses of the umount system call in RHEL 9 must generate
    an audit record.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    32-bit-umount-syscall-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/audit.rules
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*-a\s+(always,exit|exit,always)\s+-F\s+arch=b32\s+(?:.*(-S\s+umount\s+|(\s+|,)umount(\s+|,))).*-F\s+auid>=1000\s+-F\s+auid!=(4294967295|-1|unset)(\s+(-k\s+|-F\s+key=)[-\w]+)*\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: 32-bit umount syscall
  states: {}
  tests:
    test-audit-32-bit-invocations-umount-syscall:
      test_title: Audit 32-bit invocations of umount syscall
      capability: independent.textfilecontent54
      object: 32-bit-umount-syscall-object
      check_existence: all_exist
      check: all
  evaluate:
    test: test-audit-32-bit-invocations-umount-syscall
