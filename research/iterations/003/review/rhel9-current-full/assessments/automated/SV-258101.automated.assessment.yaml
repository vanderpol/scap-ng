assessment:
  id: SV-258101.automated
  version: 1
  assessment_title: RHEL-09-611060 - RHEL 9 must enforce password complexity rules for the root account.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object-2:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/security/pwquality.conf
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*enforce_for_root\s*(?:#.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
    independent-textfilecontent54-object-3:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/security/pwquality.conf.d
        filename:
          operation: pattern match
          datatype: string
          value: \.conf$
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*enforce_for_root\s*(?:#.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      behaviors:
        recurse_direction: down
      object_title: null
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - object: independent-textfilecontent54-object-2
        - object: independent-textfilecontent54-object-3
      object_title: null
  states: {}
  tests:
    test-password-complexity-rules-enforced-root-account:
      test_title: Password complexity rules are enforced for the root account
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    test: test-password-complexity-rules-enforced-root-account
