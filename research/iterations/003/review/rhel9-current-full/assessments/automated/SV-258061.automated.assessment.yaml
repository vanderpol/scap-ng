assessment:
  id: SV-258061.automated
  version: 1
  assessment_title: RHEL-09-411110 - RHEL 9 groups must have unique Group ID (GID).
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    etc-group-gids-collection:
      collection_title: /etc/group GIDs
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/group
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: '^[^:]*:[^:]*:([^:]+):'
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    count-group-entries-collection:
      collection_title: count of group entries
      capability: independent.variable
      select:
        var_ref:
          operation: equals
          datatype: string
          mask: false
          value:
            variable: count-group-entries-variable
  variables:
    count-group-entries-variable:
      title: count of group entries
      kind: local
      datatype: int
      expression:
        count:
          values:
            collection: etc-group-gids-collection
            field: subexpression
    count-unique-gids-variable:
      title: count of unique GIDs
      kind: local
      datatype: int
      expression:
        count:
          unique:
            values:
              collection: etc-group-gids-collection
              field: subexpression
  tests:
    test-gids-unique:
      test_title: GIDs are unique
      capability: independent.variable
      collection: count-group-entries-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: count of unique GIDs
        state_capability: independent.variable
        state:
          field: value
          value:
            variable: count-unique-gids-variable
          operation: equals
          datatype: int
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-gids-unique
