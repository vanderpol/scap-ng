assessment:
  id: SV-258061.automated
  version: 1
  assessment_title: RHEL-09-411110 - RHEL 9 groups must have unique Group ID (GID).
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    etc-group-gids-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/group
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: '^[^:]*:[^:]*:([^:]+):'
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: /etc/group GIDs
    count-group-entries-object:
      capability: independent.variable
      select:
        var_ref:
          operation: equals
          datatype: string
          mask: false
          value:
            variable: count-group-entries-variable
      object_title: count of group entries
  variables:
    count-group-entries-variable:
      title: count of group entries
      kind: local
      datatype: int
      expression:
        count:
          values:
            object: etc-group-gids-object
            field: subexpression
    count-unique-gids-variable:
      title: count of unique GIDs
      kind: local
      datatype: int
      expression:
        count:
          unique:
            values:
              object: etc-group-gids-object
              field: subexpression
  states:
    state-count-of-unique-gids:
      state_title: count of unique GIDs
      capability: independent.variable
      state:
        field: value
        value:
          variable: count-unique-gids-variable
        operation: equals
        datatype: int
        mask: false
        variable_check: all
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-gids-unique:
      test_title: GIDs are unique
      capability: independent.variable
      object: count-group-entries-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-count-of-unique-gids
  evaluate:
    test: test-gids-unique
