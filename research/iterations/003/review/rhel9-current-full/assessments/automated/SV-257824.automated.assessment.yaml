assessment:
  id: SV-257824.automated
  version: 1
  assessment_title: RHEL-09-214035 - RHEL 9 must remove all software components after updated versions have been
    installed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/dnf/dnf.conf
        pattern:
          operation: pattern match
          datatype: string
          value: ^[ \t]*clean_requirements_on_remove[ \t]*=[ \t]*(?:True|1|yes)[ \t]*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states: {}
  tests:
    test-etc-dnf-dnf-conf-clean-requirements-on-remove-set-true:
      test_title: '/etc/dnf/dnf.conf: clean_requirements_on_remove is set to True, 1 or yes'
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    test: test-etc-dnf-dnf-conf-clean-requirements-on-remove-set-true
