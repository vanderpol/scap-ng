assessment:
  id: SV-257825.automated
  version: 1
  assessment_title: RHEL-09-215010 - RHEL 9 subscription-manager package must be installed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-rpminfo-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          value: subscription-manager
      object_title: null
  states: {}
  tests:
    test-subscription-manager-package-installed:
      test_title: subscription-manager package is installed
      capability: linux.rpminfo
      object: linux-rpminfo-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    test: test-subscription-manager-package-installed
