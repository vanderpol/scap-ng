assessment:
  id: SV-257805.automated
  version: 2
  assessment_title: RHEL-09-213050 - RHEL 9 must be configured to disable the Controller Area Network kernel module.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/modprobe.d
        filename:
          operation: pattern match
          datatype: string
          value: .*
        pattern:
          operation: pattern match
          datatype: string
          value: ^[ \t]*blacklist[ \t]+can[ \t]*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states: {}
  tests:
    test-etc-modprobe-d-contains-file-that-contains-blacklist-can:
      test_title: /etc/modprobe.d contains a file that contains 'blacklist can'
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    test: test-etc-modprobe-d-contains-file-that-contains-blacklist-can
