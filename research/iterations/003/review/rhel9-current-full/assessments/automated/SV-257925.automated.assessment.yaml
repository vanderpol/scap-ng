assessment:
  id: SV-257925.automated
  version: 1
  assessment_title: RHEL-09-232225 - RHEL 9 audit tools must be group-owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    audit-tools-object:
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: audit-tools-variable
      object_title: audit tools
  variables:
    audit-tools-variable:
      title: audit tools
      kind: constant
      datatype: string
      expression:
        literal:
        - /sbin/auditctl
        - /sbin/aureport
        - /sbin/ausearch
        - /sbin/autrace
        - /sbin/auditd
        - /sbin/rsyslogd
        - /sbin/augenrules
  states:
    state-group-owned-by-root:
      state_title: group-owned by root
      capability: unix.file
      state:
        field: group_id
        value: '0'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-tools-group-owned-by-root:
      test_title: The audit tools are group-owned by root.
      capability: unix.file
      object: audit-tools-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-group-owned-by-root
  evaluate:
    test: test-audit-tools-group-owned-by-root
