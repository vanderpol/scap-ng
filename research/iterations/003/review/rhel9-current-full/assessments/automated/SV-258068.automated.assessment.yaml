assessment:
  id: SV-258068.automated
  version: 2
  assessment_title: RHEL-09-412035 - RHEL 9 must automatically exit interactive command shell user sessions after
    10 minutes of inactivity.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object-2:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/profile
        pattern:
          operation: pattern match
          datatype: string
          value: ^[^#]*\s*TMOUT=(\d+)\s*$
        instance:
          operation: equals
          datatype: int
          value: '1'
      object_title: null
    independent-textfilecontent54-object-3:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/profile.d
        filename:
          operation: pattern match
          datatype: string
          value: ^.+\.sh$
        pattern:
          operation: pattern match
          datatype: string
          value: ^[^#]*\s*TMOUT=(\d+)\s*$
        instance:
          operation: equals
          datatype: int
          value: '1'
      behaviors:
        max_depth: '-1'
        recurse_direction: down
      object_title: null
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - object: independent-textfilecontent54-object-2
        - object: independent-textfilecontent54-object-3
      object_title: null
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '600'
        operation: less than or equal
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-tmout-option-set-600-or-less-in-etc-profile-etc:
      test_title: TMOUT option is set to 600 or less in /etc/profile and /etc/profile.d/*.sh.
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    test: test-tmout-option-set-600-or-less-in-etc-profile-etc
