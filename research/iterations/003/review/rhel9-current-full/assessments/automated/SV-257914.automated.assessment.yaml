assessment:
  id: SV-257914.automated
  version: 1
  assessment_title: RHEL-09-232170 - RHEL 9 /var/log directory must be owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    unix-file-collection:
      collection_title: null
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /var/log
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
  tests:
    test-var-log-directory-owned-by-root:
      test_title: /var/log directory is owned by root
      capability: unix.file
      collection: unix-file-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: owned by root
        state_capability: unix.file
        state:
          field: user_id
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-var-log-directory-owned-by-root
