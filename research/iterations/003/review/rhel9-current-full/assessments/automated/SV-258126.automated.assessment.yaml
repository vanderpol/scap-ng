assessment:
  id: SV-258126.automated
  version: 1
  assessment_title: RHEL-09-611185 - RHEL 9 must have the opensc package installed.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    linux-rpminfo-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: opensc
      object_title: null
  states: {}
  tests:
    test-opensc-package-installed:
      test_title: opensc package is installed
      capability: linux.rpminfo
      object: linux-rpminfo-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    test: test-opensc-package-installed
