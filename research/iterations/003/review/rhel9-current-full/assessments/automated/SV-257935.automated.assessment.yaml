assessment:
  id: SV-257935.automated
  version: 1
  assessment_title: RHEL-09-251010 - RHEL 9 must have the firewalld package installed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-rpminfo-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          value: firewalld
      object_title: null
  states: {}
  tests:
    test-firewalld-package-installed:
      test_title: firewalld package is installed
      capability: linux.rpminfo
      object: linux-rpminfo-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    test: test-firewalld-package-installed
