assessment:
  id: SV-258059.automated
  version: 3
  assessment_title: RHEL-09-411100 - The root account must be the only account having unrestricted access to RHEL
    9 system.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    unix-password-collection:
      collection_title: null
      capability: unix.password
      select:
        username:
          operation: not equal
          datatype: string
          mask: false
          value: root
  tests:
    test-only-root-account-has-uid-zero:
      test_title: Only the root account has a UID of zero.
      capability: unix.password
      collection: unix-password-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: unix.password
        state:
          field: user_id
          value: '0'
          operation: not equal
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-only-root-account-has-uid-zero
