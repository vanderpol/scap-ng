assessment:
  id: SV-258018.automated
  version: 1
  assessment_title: RHEL-09-271040 - RHEL 9 must not allow unattended or automatic logon via the graphical user
    interface.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/gdm/custom.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*\[daemon\]\s+[#\s\w=]*^\s*AutomaticLoginEnable=(\w+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-automaticloginenable-set-false-in-etc-gdm-custom-conf:
      test_title: AutomaticLoginEnable is set to false in /etc/gdm/custom.conf.
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          field: subexpression
          value: 'false'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-automaticloginenable-set-false-in-etc-gdm-custom-conf
