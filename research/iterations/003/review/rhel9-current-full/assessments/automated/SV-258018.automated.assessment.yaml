assessment:
  id: SV-258018.automated
  version: 1
  assessment_title: RHEL-09-271040 - RHEL 9 must not allow unattended or automatic logon via the graphical user
    interface.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/gdm/custom.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*\[daemon\]\s+[#\s\w=]*^\s*AutomaticLoginEnable=(\w+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: null
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: 'false'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-automaticloginenable-set-false-in-etc-gdm-custom-conf:
      test_title: AutomaticLoginEnable is set to false in /etc/gdm/custom.conf.
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    test: test-automaticloginenable-set-false-in-etc-gdm-custom-conf
