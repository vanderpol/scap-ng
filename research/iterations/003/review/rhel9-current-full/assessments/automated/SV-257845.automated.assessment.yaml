assessment:
  id: SV-257845.automated
  version: 1
  assessment_title: RHEL-09-231020 - RHEL 9 must use a separate file system for /var.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-partition-object:
      capability: linux.partition
      select:
        mount_point:
          operation: equals
          datatype: string
          value: /var
      object_title: null
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/fstab
        pattern:
          operation: pattern match
          datatype: string
          value: ^[^# \t]+\s+/var\s+
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states: {}
  tests:
    test-there-separate-file-system-var:
      test_title: There is a separate file system for /var.
      capability: linux.partition
      object: linux-partition-object
      check_existence: all_exist
      check: all
    test-there-separate-file-system-configured-var:
      test_title: There is a separate file system configured for /var.
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: all_exist
      check: all
  evaluate:
    all:
    - test: test-there-separate-file-system-var
    - test: test-there-separate-file-system-configured-var
