assessment:
  id: SV-257960.automated
  version: 3
  assessment_title: RHEL-09-253025 - RHEL 9 must log IPv4 packets with impossible addresses.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    unix-sysctl-object:
      capability: unix.sysctl
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: net.ipv4.conf.all.log_martians
      object_title: null
  states:
    state-unix-sysctl:
      state_title: null
      capability: unix.sysctl
      state:
        field: value
        value: '1'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-net-ipv4-conf-all-log-martians-setting-in-kernel-set:
      test_title: net.ipv4.conf.all.log_martians setting in kernel is set to 1
      capability: unix.sysctl
      object: unix-sysctl-object
      check_existence: all_exist
      check: all
      states:
      - state-unix-sysctl
  evaluate:
    test: test-net-ipv4-conf-all-log-martians-setting-in-kernel-set
