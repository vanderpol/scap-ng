assessment:
  id: SV-258104.automated
  version: 1
  assessment_title: RHEL-09-611075 - RHEL 9 passwords for new users or password changes must have a 24 hours minimum
    password lifetime restriction in /etc/login.defs.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/login.defs
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*PASS_MIN_DAYS\s+(\d*)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: null
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '1'
        operation: greater than or equal
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-etc-login-defs-pass-min-days-1:
      test_title: /etc/login.defs:PASS_MIN_DAYS >= 1
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    test: test-etc-login-defs-pass-min-days-1
