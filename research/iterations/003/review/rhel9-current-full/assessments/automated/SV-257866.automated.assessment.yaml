assessment:
  id: SV-257866.automated
  version: 1
  assessment_title: RHEL-09-231125 - RHEL 9 must mount /tmp with the nodev option.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-partition-collection:
      collection_title: null
      select:
        mount_point:
          operation: equals
          datatype: string
          mask: false
          value: /tmp
    independent-textfilecontent54-collection:
      collection_title: null
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/fstab
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*[^#\s]+\s+/tmp\s+\S+\s+(\S+)\s+\S+\s+\S+\s*$
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
    independent-variable-collection:
      collection_title: null
      select:
        var_ref:
          operation: equals
          datatype: string
          mask: false
          value:
            variable: mount-options-tmp-in-etc-fstab-variable
  variables:
    mount-options-tmp-in-etc-fstab-variable:
      title: Mount options for /tmp in /etc/fstab
      kind: local
      datatype: string
      expression:
        split:
          value:
            values:
              collection: independent-textfilecontent54-collection
              field: subexpression
          delimiter: ','
  tests:
    test-tmp-mounted-nodev-option:
      test_title: /tmp is mounted with the nodev option
      capability: linux.partition
      collection: linux-partition-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          field: mount_options
          value: nodev
          operation: equals
          datatype: string
          mask: false
          entity_check: at least one
          entity_existence: at_least_one_exists
    test-tmp-configured-nodev-option-in-etc-fstab:
      test_title: /tmp is configured with the nodev option in /etc/fstab
      capability: independent.variable
      collection: independent-variable-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          field: value
          value: nodev
          operation: equals
          datatype: string
          mask: false
          entity_check: at least one
          entity_existence: at_least_one_exists
    test-tmp-configured-in-etc-fstab:
      test_title: /tmp is configured in /etc/fstab
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    all:
    - test: test-tmp-mounted-nodev-option
    - test: test-tmp-configured-nodev-option-in-etc-fstab
    - test: test-tmp-configured-in-etc-fstab
