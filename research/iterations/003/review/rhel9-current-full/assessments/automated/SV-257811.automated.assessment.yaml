  version: 2
  assessment_title: RHEL-09-213080 - RHEL 9 must restrict usage of ptrace to descendant processes.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    unix-sysctl-collection:
      collection_title: null
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: kernel.yama.ptrace_scope
