assessment:
  id: SV-257811.automated
  version: 2
  assessment_title: RHEL-09-213080 - RHEL 9 must restrict usage of ptrace to descendant processes.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    unix-sysctl-object:
      capability: unix.sysctl
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: kernel.yama.ptrace_scope
      object_title: null
  states:
    state-unix-sysctl:
      state_title: null
      capability: unix.sysctl
      state:
        field: value
        value: '1'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-kernel-yama-ptrace-scope-setting-in-kernel-set-1:
      test_title: kernel.yama.ptrace_scope setting in kernel is set to 1
      capability: unix.sysctl
      object: unix-sysctl-object
      check_existence: all_exist
      check: all
      states:
      - state-unix-sysctl
  evaluate:
    test: test-kernel-yama-ptrace-scope-setting-in-kernel-set-1
