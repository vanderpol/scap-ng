assessment:
  id: SV-257820.automated
  version: 1
  assessment_title: RHEL-09-214015 - RHEL 9 must check the GPG signature of software packages originating from external
    software repositories before installation.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    etc-dnf-dnf-conf-gpgcheck-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/dnf/dnf.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^gpgcheck=(.*)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: /etc/dnf/dnf.conf gpgcheck
  states:
    state-etc-dnf-dnf-conf-gpgcheck-1:
      state_title: /etc/dnf/dnf.conf gpgcheck=1
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '1'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-etc-dnf-dnf-conf-gpgcheck-1:
      test_title: /etc/dnf/dnf.conf gpgcheck=1
      capability: independent.textfilecontent54
      object: etc-dnf-dnf-conf-gpgcheck-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-etc-dnf-dnf-conf-gpgcheck-1
  evaluate:
    test: test-etc-dnf-dnf-conf-gpgcheck-1
