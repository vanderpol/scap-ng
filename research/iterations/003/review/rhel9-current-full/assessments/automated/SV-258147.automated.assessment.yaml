assessment:
  id: SV-258147.automated
  version: 1
  assessment_title: RHEL-09-652045 - RHEL 9 must encrypt the transfer of audit records offloaded onto a different
    system or media from the system being audited via rsyslog.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    rsyslog-conf-actionsendstreamdrivermode-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/rsyslog.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\$ActionSendStreamDriverMode\s+(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
      object_title: 'rsyslog.conf: ActionSendStreamDriverMode'
    rsyslog-d-conf-actionsendstreamdrivermode-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/rsyslog.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^.*\.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\$ActionSendStreamDriverMode\s+(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
      object_title: 'rsyslog.d/*.conf: ActionSendStreamDriverMode'
    actionsendstreamdrivermode-object:
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - object: rsyslog-conf-actionsendstreamdrivermode-object
        - object: rsyslog-d-conf-actionsendstreamdrivermode-object
      object_title: ActionSendStreamDriverMode
    rsyslog-conf-action-all-messages-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/rsyslog.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\*\.\*\s+action\((\s*(?:[^#\)]*(?:#.*$)?\n)*[^#\)]*)\)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
      object_title: 'rsyslog.conf: action for all messages'
    rsyslog-d-conf-action-all-messages-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/rsyslog.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^.*\.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\*\.\*\s+action\((\s*(?:[^#\)]*(?:#.*$)?\n)*[^#\)]*)\)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
      object_title: 'rsyslog.d/*.conf: action for all messages'
    rsyslog-action-all-messages-object:
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - object: rsyslog-conf-action-all-messages-object
        - object: rsyslog-d-conf-action-all-messages-object
      object_title: 'rsyslog: action for all messages'
    rsyslog-conf-module-blocks-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/rsyslog.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*module\((\s*(?:[^#\)]*(?:#.*$)?\n)*[^#\)]*)\)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
      object_title: 'rsyslog.conf: module blocks'
    rsyslog-d-conf-module-blocks-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/rsyslog.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^.*\.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*module\((\s*(?:[^#\)]*(?:#.*$)?\n)*[^#\)]*)\)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
      object_title: 'rsyslog.d/*.conf: module blocks'
    rsyslog-module-blocks-object:
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - object: rsyslog-conf-module-blocks-object
        - object: rsyslog-d-conf-module-blocks-object
      object_title: 'rsyslog: module blocks'
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '1'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54-2:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: (?i)(?:^|\n)[^#]*\btype\s*=\s*"omfwd"
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54-3:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: (?i)(?:^|\n)[^#]*\bStreamDriver\.?Mode\s*=\s*"1"
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54-4:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: (?i)(?:^|\n)[^#]*\bStreamDriver\.?Mode\b
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-actionsendstreamdrivermode-1:
      test_title: ActionSendStreamDriverMode == 1
      capability: independent.textfilecontent54
      object: actionsendstreamdrivermode-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
    test-streamdrivermode-1-advanced-syntax:
      test_title: StreamDriverMode == 1 (advanced syntax)
      capability: independent.textfilecontent54
      object: rsyslog-action-all-messages-object
      check_existence: at_least_one_exists
      check: at least one
      state_operator: AND
      states:
      - state-independent-textfilecontent54-2
      - state-independent-textfilecontent54-3
    test-streamdrivermode-not-set-in-module-block-advanced-syntax:
      test_title: StreamDriverMode is not set in a module block (advanced syntax)
      capability: independent.textfilecontent54
      object: rsyslog-module-blocks-object
      check_existence: any_exist
      check: none satisfy
      states:
      - state-independent-textfilecontent54-4
  evaluate:
    all:
    - any:
      - test: test-actionsendstreamdrivermode-1
      - test: test-streamdrivermode-1-advanced-syntax
    - test: test-streamdrivermode-not-set-in-module-block-advanced-syntax
