assessment:
  id: SV-258025.automated
  version: 13
  assessment_title: RHEL 9 must initiate a session lock for graphical user interfaces when the screensaver is activated.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    retrieve-gnome-screensaver-lock-delay-setting-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: gsettings get org.gnome.desktop.screensaver lock-delay
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: uint32\s(\d+)$
      object_title: Retrieve the gnome screensaver lock-delay setting.
  states:
    state-confirm-value-is-set-to-5-or-greater:
      state_title: Confirm value is set to 5 or greater.
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: subexpression
          value: '5'
          operation: less than or equal
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-verify-os-initiates-session-lock-graphical-user-interfaces-when-screensaver:
      test_title: Verify the OS initiates a session lock for graphical user interfaces when the screensaver is activated.
      capability: independent.shellcommand
      object: retrieve-gnome-screensaver-lock-delay-setting-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-confirm-value-is-set-to-5-or-greater
  evaluate:
    test: test-verify-os-initiates-session-lock-graphical-user-interfaces-when-screensaver
