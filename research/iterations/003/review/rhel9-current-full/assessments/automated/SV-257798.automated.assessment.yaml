assessment:
  id: SV-257798.automated
  version: 2
  assessment_title: RHEL-09-213015 - RHEL 9 must prevent kernel profiling by nonprivileged users.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-sysctl-object:
      capability: unix.sysctl
      select:
        name:
          operation: equals
          datatype: string
          value: kernel.perf_event_paranoid
      object_title: null
  states:
    state-unix-sysctl:
      state_title: null
      capability: unix.sysctl
      state:
        field: value
        value: '2'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-kernel-perf-event-paranoid-setting-in-kernel-set-2:
      test_title: kernel.perf_event_paranoid setting in kernel is set to 2
      capability: unix.sysctl
      object: unix-sysctl-object
      check_existence: all_exist
      check: all
      states:
      - state-unix-sysctl
  evaluate:
    test: test-kernel-perf-event-paranoid-setting-in-kernel-set-2
