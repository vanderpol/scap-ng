assessment:
  id: SV-258001.automated
  version: 1
  assessment_title: RHEL-09-255125 - RHEL 9 SSH public host key files must have mode 0644 or less permissive.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-file-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/ssh
        filename:
          operation: pattern match
          datatype: string
          value: ^.*\.pub$
      behaviors:
        max_depth: '-1'
        recurse_direction: down
      object_title: null
  states:
    state-file-permissions-is-644-or-more-restrictive:
      state_title: File permissions is 644 or more restrictive
      capability: unix.file
      state:
        all:
        - field: suid
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: sgid
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: sticky
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: uexec
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: gwrite
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: gexec
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: owrite
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: oexec
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-ssh-daemon-public-host-key-files-have-mode-0644-or:
      test_title: The SSH daemon public host key files have mode 0644 or less permissive
      capability: unix.file
      object: unix-file-object
      check_existence: any_exist
      check: all
      states:
      - state-file-permissions-is-644-or-more-restrictive
  evaluate:
    test: test-ssh-daemon-public-host-key-files-have-mode-0644-or
