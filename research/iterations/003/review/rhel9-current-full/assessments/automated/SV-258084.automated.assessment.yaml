assessment:
  id: SV-258084.automated
  version: 2
  assessment_title: RHEL-09-432015 - RHEL 9 must require reauthentication when using the "sudo" command.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection-2:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/sudoers
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*Defaults\s+timestamp_timeout\s*=\s*([-\d]+)\s*$
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
    independent-textfilecontent54-collection-3:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/sudoers.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^.*$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*Defaults\s+timestamp_timeout\s*=\s*([-\d]+)\s*$
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
        max_depth: '-1'
        recurse_direction: down
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - collection: independent-textfilecontent54-collection-2
        - collection: independent-textfilecontent54-collection-3
  tests:
    test-defaults-timestamp-timeout-configured-0-in-etc-sudoers-or-etc:
      test_title: Defaults timestamp_timeout is configured to 0 in /etc/sudoers or /etc/sudoers.d.
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: only_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-defaults-timestamp-timeout-configured-0-in-etc-sudoers-or-etc
