assessment:
  id: SV-258161.automated
  version: 1
  assessment_title: RHEL-09-653060 - RHEL 9 must label all offloaded audit logs before sending them to the central
    log server.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/auditd.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: (?i)^\s*name_format\s*=\s*(\w+)\s*(?:#.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-etc-audit-auditd-conf-name-format-hostname-fqd-or-numeric:
      test_title: '/etc/audit/auditd.conf: name_format = hostname, fqd or numeric'
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: null
          state:
            field: subexpression
            value: (?i)^hostname$
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          state:
            field: subexpression
            value: (?i)^fqd$
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          state:
            field: subexpression
            value: (?i)^numeric$
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-etc-audit-auditd-conf-name-format-hostname-fqd-or-numeric
