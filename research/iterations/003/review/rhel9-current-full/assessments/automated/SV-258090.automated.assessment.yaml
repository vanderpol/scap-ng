assessment:
  id: SV-258090.automated
  version: 1
  assessment_title: RHEL-09-433015 - RHEL 9 fapolicy module must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    fapolicyd-service-activestate-object:
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          mask: false
          value: fapolicyd.service
        property:
          operation: equals
          datatype: string
          mask: false
          value: ActiveState
      object_title: fapolicyd.service ActiveState
  states:
    state-linux-systemdunitproperty:
      state_title: null
      capability: linux.systemdunitproperty
      state:
        field: value
        value: active
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-fapolicyd-service-active:
      test_title: fapolicyd.service is active
      capability: linux.systemdunitproperty
      object: fapolicyd-service-activestate-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-linux-systemdunitproperty
  evaluate:
    test: test-fapolicyd-service-active
