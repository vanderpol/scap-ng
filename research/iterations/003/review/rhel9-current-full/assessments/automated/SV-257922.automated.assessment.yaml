assessment:
  id: SV-257922.automated
  version: 13
  assessment_title: RHEL 9 library directories must be owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    all-system-wide-library-directories-not-owned-by-root-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: only one
          value:
            variable: system-wide-shared-library-files-directories-variable
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
      filters:
      - action: exclude
        state: state-symbolic-links
      - action: exclude
        state: state-owned-by-root
      - action: exclude
        state: state-unix-file
      behaviors:
        recurse_direction: down
      object_title: All system-wide Library directories not owned by root
  variables:
    system-wide-shared-library-files-directories-variable:
      title: system-wide shared library files directories
      kind: constant
      datatype: string
      expression:
        literal:
        - /lib
        - /lib64
        - /usr/lib
        - /usr/lib64
  states:
    state-symbolic-links:
      state_title: symbolic links
      capability: unix.file
      state:
        field: type
        value: symbolic link
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-owned-by-root:
      state_title: owned by root
      capability: unix.file
      state:
        field: user_id
        value: '0'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-unix-file:
      state_title: null
      capability: unix.file
      state:
        field: type
        value: file
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-library-directories-owned-by-root:
      test_title: System Library directories are owned by root.
      capability: unix.file
      object: all-system-wide-library-directories-not-owned-by-root-object
      check_existence: none_exist
      check: all
  evaluate:
    test: test-system-library-directories-owned-by-root
