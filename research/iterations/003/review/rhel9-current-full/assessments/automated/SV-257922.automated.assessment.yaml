assessment:
  id: SV-257922.automated
  version: 13
  assessment_title: RHEL 9 library directories must be owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    all-system-wide-library-directories-not-owned-by-root-collection:
      collection_title: All system-wide Library directories not owned by root
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: only one
          value:
            variable: system-wide-shared-library-files-directories-variable
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
      filters:
      - action: exclude
        match:
          field: type
          value: symbolic link
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: symbolic links
      - action: exclude
        match:
          field: user_id
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: owned by root
      - action: exclude
        match:
          field: type
          value: file
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
      behaviors:
        recurse_direction: down
  variables:
    system-wide-shared-library-files-directories-variable:
      title: system-wide shared library files directories
      kind: constant
      datatype: string
      expression:
        literal:
        - /lib
        - /lib64
        - /usr/lib
        - /usr/lib64
  tests:
    test-system-library-directories-owned-by-root:
      test_title: System Library directories are owned by root.
      capability: unix.file
      collection: all-system-wide-library-directories-not-owned-by-root-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
  evaluate:
    test: test-system-library-directories-owned-by-root
