assessment:
  id: SV-258134.automated
  version: 13
  assessment_title: RHEL 9 must have the AIDE package installed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    confirm-aide-file-integrity-tool-package-installed-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: aide
      object_title: Confirm the aide file integrity tool package is installed.
    find-aide-conf-file-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /
        filename:
          operation: equals
          datatype: string
          mask: false
          value: aide.conf
      behaviors:
        recurse_direction: down
        recurse: directories
        max_depth: '-1'
        recurse_file_system: local
      object_title: Find the aide.conf file.
    retrieve-path-working-db-file-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: retrieve-location-aide-conf-file-variable
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\@\@define\s+DBDIR\s+(\S+)
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
      object_title: Retrieve path to the working DB file.
    retrieve-filename-working-db-file-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: retrieve-location-aide-conf-file-variable
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^database=file:\@\@\{DBDIR\}/(\S+)
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
      object_title: Retrieve filename of the working DB file.
    retrieve-details-working-db-file-object:
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: retrieve-location-working-aide-database-file-variable
      object_title: Retrieve details of the working DB file.
  variables:
    retrieve-location-aide-conf-file-variable:
      title: Retrieve location of the aide.conf file.
      kind: local
      datatype: string
      expression:
        values:
          object: find-aide-conf-file-object
          field: filepath
    retrieve-location-working-aide-database-file-variable:
      title: Retrieve location of the working aide database file.
      kind: local
      datatype: string
      expression:
        concat:
        - values:
            object: retrieve-path-working-db-file-object
            field: subexpression
        - literal:
            value: /
            datatype: string
        - values:
            object: retrieve-filename-working-db-file-object
            field: subexpression
  states:
    state-confirm-existence-of-db-file:
      state_title: Confirm existence of DB file.
      capability: unix.file
      state:
        field: filepath
        value: .*
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-confirm-aide-file-integrity-tool-package-installed:
      test_title: Confirm the aide file integrity tool package is installed.
      capability: linux.rpminfo
      object: confirm-aide-file-integrity-tool-package-installed-object
      check_existence: at_least_one_exists
      check: all
    test-verify-working-db-file-configured-in-aide-conf-file-exists:
      test_title: Verify the working DB file configured in the 'aide.conf file' exists.
      capability: unix.file
      object: retrieve-details-working-db-file-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-confirm-existence-of-db-file
  evaluate:
    all:
    - test: test-confirm-aide-file-integrity-tool-package-installed
    - test: test-verify-working-db-file-configured-in-aide-conf-file-exists
