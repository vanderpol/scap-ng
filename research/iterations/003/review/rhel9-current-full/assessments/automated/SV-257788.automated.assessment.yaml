assessment:
  id: SV-257788.automated
  version: 1
  assessment_title: RHEL-09-212015 - RHEL 9 must disable the ability of systemd to spawn an interactive boot process.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    bls-options-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /boot/loader/entries
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^.*\.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^options\s+(.*)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: BLS options
    etc-default-grub-grub-cmdline-linux-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/default/grub
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^GRUB_CMDLINE_LINUX="(.*)"
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: /etc/default/grub GRUB_CMDLINE_LINUX
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: (^|\s)systemd\.confirm_spawn(\s|$)
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-bls-options-contain-systemd-confirm-spawn:
      test_title: BLS options contain systemd.confirm_spawn
      capability: independent.textfilecontent54
      object: bls-options-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
    test-grub-cmdline-linux-arguments-in-etc-default-grub-contain-systemd:
      test_title: The GRUB_CMDLINE_LINUX arguments in /etc/default/grub contain systemd.confirm_spawn
      capability: independent.textfilecontent54
      object: etc-default-grub-grub-cmdline-linux-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    all:
    - not:
        test: test-bls-options-contain-systemd-confirm-spawn
    - not:
        test: test-grub-cmdline-linux-arguments-in-etc-default-grub-contain-systemd
