assessment:
  id: SV-257955.automated
  version: 1
  assessment_title: RHEL-09-252070 - There must be no shosts.equiv files on RHEL 9.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-file-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          value: /
        filename:
          operation: equals
          datatype: string
          value: shosts.equiv
      behaviors:
        max_depth: '-1'
        recurse: directories
        recurse_direction: down
        recurse_file_system: local
      object_title: null
  states: {}
  tests:
    test-there-no-shosts-equiv-files-on-system:
      test_title: There must be no shosts.equiv files on the system.
      capability: unix.file
      object: unix-file-object
      check_existence: none_exist
      check: all
  evaluate:
    test: test-there-no-shosts-equiv-files-on-system
