assessment:
  id: SV-258242.automated
  version: 1
  assessment_title: RHEL-09-672050 - RHEL 9 must implement DOD-approved encryption in the bind package.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    named-conf-includes-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/named.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*include\s+"(.*)"\s*;\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: named.conf includes
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: /etc/crypto-policies/back-ends/bind.config
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-named-conf-includes-crypto-policy:
      test_title: named.conf includes crypto-policy
      capability: independent.textfilecontent54
      object: named-conf-includes-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-independent-textfilecontent54
  evaluate:
    test: test-named-conf-includes-crypto-policy
