assessment:
  id: SV-258005.automated
  version: 2
  assessment_title: RHEL-09-255145 - RHEL 9 SSH daemon must not allow rhosts authentication.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    pull-value-etc-ssh-sshd-config-ignorerhosts-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*(?i)IgnoreRhosts(?-i)[ \t]+([\w\"]+)[\s]*(?:|(?:#.*))?$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: Pull value of /etc/ssh/sshd_config:IgnoreRhosts
    pull-value-etc-ssh-sshd-config-d-ignorerhosts-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/ssh/sshd_config.d
        filename:
          operation: pattern match
          datatype: string
          value: ^.*$
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*(?i)IgnoreRhosts(?-i)[ \t]+([\w\"]+)[\s]*(?:|(?:#.*))?$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: Pull value of /etc/ssh/sshd_config.d:IgnoreRhosts
    ignore-rhosts-set-yes-in-both-etc-ssh-sshd-config-object:
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - object: pull-value-etc-ssh-sshd-config-ignorerhosts-object
        - object: pull-value-etc-ssh-sshd-config-d-ignorerhosts-object
      object_title: Ignore Rhosts is set to 'yes' in both /etc/ssh/sshd_config and /etc/ssh/sshd_config.d/*
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^(yes|"yes")$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-etc-ssh-sshd-config-ignorerhosts-yes:
      test_title: /etc/ssh/sshd_config:IgnoreRhosts == yes
      capability: independent.textfilecontent54
      object: ignore-rhosts-set-yes-in-both-etc-ssh-sshd-config-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    test: test-etc-ssh-sshd-config-ignorerhosts-yes
