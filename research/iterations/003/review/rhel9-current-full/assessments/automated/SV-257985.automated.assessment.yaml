assessment:
  id: SV-257985.automated
  version: 1
  assessment_title: RHEL-09-255045 - RHEL 9 must not permit direct logons to the root account using remote access
    via SSH.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*(?i)PermitRootLogin(?-i)[ \t]+([\w\"]+)[\s]*(?:|(?:#.*))?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-textfilecontent54-collection-2:
      collection_title: null
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .+
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*(?i)PermitRootLogin(?-i)[ \t]+([\w\"]+)[\s]*(?:|(?:#.*))?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    all-sshd-config-sshd-config-d-files-collection:
      collection_title: all sshd_config and sshd_config.d/* files
      set:
        operator: union
        members:
        - collection: independent-textfilecontent54-collection
        - collection: independent-textfilecontent54-collection-2
  tests:
    test-etc-ssh-sshd-config-permitrootlogin-no:
      test_title: /etc/ssh/sshd_config:PermitRootLogin == no
      capability: independent.textfilecontent54
      collection: all-sshd-config-sshd-config-d-files-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          field: subexpression
          value: ^(no|"no")$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-etc-ssh-sshd-config-permitrootlogin-no
