assessment:
  id: SV-258225.automated
  version: 2
  assessment_title: RHEL-09-654255 - RHEL 9 must generate audit records for all account creations, modifications,
    disabling, and termination events that affect /var/log/lastlog.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/audit.rules
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*-a\s+(always,exit|exit,always)\s+-F\s+arch=b32\s+-F\s+path=\/var\/log\/lastlog\s+-F\s+perm=([rx]*w[rx]*a[rx]*|[rx]*a[rx]*w[rx]*)\s+-F\s+auid>=1000\s+-F\s+auid!=(4294967295|-1|unset)(\s+(-k\s+|-F\s+key=)[-\w]+)*\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: null
    independent-textfilecontent54-object-2:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/audit.rules
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*-a\s+(always,exit|exit,always)\s+-F\s+arch=b64\s+-F\s+path=\/var\/log\/lastlog\s+-F\s+perm=([rx]*w[rx]*a[rx]*|[rx]*a[rx]*w[rx]*)\s+-F\s+auid>=1000\s+-F\s+auid!=(4294967295|-1|unset)(\s+(-k\s+|-F\s+key=)[-\w]+)*\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: null
  states: {}
  tests:
    test-audit-32-bit-invocations-var-log-lastlog:
      test_title: Audit 32-bit invocations of /var/log/lastlog
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: all_exist
      check: all
    test-audit-64-bit-invocations-var-log-lastlog:
      test_title: Audit 64-bit invocations of /var/log/lastlog
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-2
      check_existence: all_exist
      check: all
  evaluate:
    all:
    - test: test-audit-32-bit-invocations-var-log-lastlog
    - test: test-audit-64-bit-invocations-var-log-lastlog
