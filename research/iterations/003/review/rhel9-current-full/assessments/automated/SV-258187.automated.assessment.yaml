assessment:
  id: SV-258187.automated
  version: 1
  assessment_title: RHEL-09-654065 - RHEL 9 must audit all uses of the rename, unlink, rmdir, renameat, and unlinkat
    system calls.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    32-bit-rename-command-collection:
      collection_title: 32-bit rename command
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/audit.rules
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*-a\s+(always,exit|exit,always)\s+-F\s+arch=b32\s+(?:.*(-S\s+rename\s+|(\s+|,)rename(\s+|,))).*-F\s+auid>=1000\s+-F\s+auid!=(4294967295|-1|unset)(\s+(-k\s+|-F\s+key=)[-\w]+)*\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
