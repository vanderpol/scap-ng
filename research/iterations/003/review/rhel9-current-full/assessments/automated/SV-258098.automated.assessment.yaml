assessment:
  id: SV-258098.automated
  version: 1
  assessment_title: RHEL-09-611045 - RHEL 9 must ensure the password complexity module is enabled in the system-auth
    file.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    system-auth-password-required-requisite-collection:
      collection_title: system-auth password required, requisite
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/pam.d/system-auth
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*password\s+(?:required|requisite)\s+(.*)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
  tests:
    test-system-auth-pam-pwquality:
      test_title: system-auth pam_pwquality
      capability: independent.textfilecontent54
      collection: system-auth-password-required-requisite-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: null
        state:
          field: subexpression
          value: ^pam_pwquality.so(\s|$)
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-system-auth-pam-pwquality
