assessment:
  id: SV-257869.automated
  version: 1
  assessment_title: RHEL-09-231140 - RHEL 9 must mount /var with the nodev option.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-partition-object:
      capability: linux.partition
      select:
        mount_point:
          operation: equals
          datatype: string
          value: /var
      object_title: null
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/fstab
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*[^#\s]+\s+/var\s+\S+\s+(\S+)\s+\S+\s+\S+\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states:
    state-linux-partition:
      state_title: null
      capability: linux.partition
      state:
        field: mount_options
        value: nodev
        operation: equals
        datatype: string
        entity_check: at least one
        entity_existence: at_least_one_exists
    state-nodev-option:
      state_title: nodev option
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: (^|,)nodev(,|$)
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-var-mounted-nodev-option:
      test_title: /var is mounted with the nodev option.
      capability: linux.partition
      object: linux-partition-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-linux-partition
    test-var-configured-in-etc-fstab-nodev-option:
      test_title: /var is configured in /etc/fstab with the nodev option.
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-nodev-option
  evaluate:
    all:
    - test: test-var-mounted-nodev-option
    - test: test-var-configured-in-etc-fstab-nodev-option
