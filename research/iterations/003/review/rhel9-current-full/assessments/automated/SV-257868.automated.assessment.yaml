assessment:
  id: SV-257868.automated
  version: 1
  assessment_title: RHEL-09-231135 - RHEL 9 must mount /tmp with the nosuid option.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-partition-object:
      capability: linux.partition
      select:
        mount_point:
          operation: equals
          datatype: string
          value: /tmp
      object_title: null
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/fstab
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*[^#\s]+\s+/tmp\s+\S+\s+(\S+)\s+\S+\s+\S+\s*$
        instance:
          operation: equals
          datatype: int
          value: '1'
      object_title: null
  states:
    state-linux-partition:
      state_title: null
      capability: linux.partition
      state:
        field: mount_options
        value: nosuid
        operation: equals
        datatype: string
        entity_check: at least one
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^.*nosuid.*$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-tmp-mounted-nosuid-option:
      test_title: /tmp is mounted with the nosuid option
      capability: linux.partition
      object: linux-partition-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-linux-partition
    test-tmp-configured-nosuid-option-in-etc-fstab:
      test_title: /tmp is configured with the nosuid option in /etc/fstab
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    all:
    - test: test-tmp-mounted-nosuid-option
    - test: test-tmp-configured-nosuid-option-in-etc-fstab
