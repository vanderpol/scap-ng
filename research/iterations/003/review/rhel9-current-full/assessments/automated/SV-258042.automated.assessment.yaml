assessment:
  id: SV-258042.automated
  version: 2
  assessment_title: RHEL-09-411015 - RHEL 9 user account passwords must have a 60-day maximum password lifetime
    restriction.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    interactive-non-anonymous-users-object:
      capability: unix.password
      select:
        username:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
      filters:
      - action: include
        state: state-unix-password
      - action: include
        state: state-anonymous-users
      object_title: interactive non-anonymous users
    etc-shadow-max-password-ages-non-system-users-object:
      capability: unix.shadow
      select:
        username:
          operation: pattern match
          datatype: string
          mask: false
          value: .+
      filters:
      - action: include
        state: state-lines-starting-with-usernames-of-system-users
      object_title: /etc/shadow max password ages for non-system users
    etc-shadow-max-password-age-root-object:
      capability: unix.shadow
      select:
        username:
          operation: equals
          datatype: string
          mask: false
          value: root
      object_title: /etc/shadow max password age for root
  variables:
    anonymous-uids-variable:
      title: anonymous UIDs
      kind: constant
      datatype: int
      expression:
        literal:
        - '65534'
        - '65535'
        - '4294967294'
        - '4294967295'
    pattern-match-lines-starting-usernames-system-users-variable:
      title: Pattern to match lines starting with usernames of system users
      kind: local
      datatype: string
      expression:
        concat:
        - literal:
            value: ^
            datatype: string
        - values:
            object: interactive-non-anonymous-users-object
            field: username
        - literal:
            value: $
            datatype: string
  states:
    state-greater-than-zero:
      state_title: greater than zero
      capability: unix.shadow
      state:
        field: chg_req
        value: '0'
        operation: greater than
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-less-than-or-equal-to-sixty:
      state_title: less than or equal to sixty
      capability: unix.shadow
      state:
        field: chg_req
        value: '60'
        operation: less than or equal
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-unix-password:
      state_title: null
      capability: unix.password
      state:
        field: user_id
        value: '1000'
        operation: greater than or equal
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-anonymous-users:
      state_title: anonymous users
      capability: unix.password
      state:
        field: user_id
        value:
          variable: anonymous-uids-variable
        operation: not equal
        datatype: int
        mask: false
        variable_check: all
        entity_check: all
        entity_existence: at_least_one_exists
    state-lines-starting-with-usernames-of-system-users:
      state_title: Lines starting with usernames of system users
      capability: unix.shadow
      state:
        field: username
        value:
          variable: pattern-match-lines-starting-usernames-system-users-variable
        operation: pattern match
        datatype: string
        mask: false
        variable_check: at least one
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-no-password-in-etc-shadow-has-maximum-password-age-0:
      test_title: No password in /etc/shadow has a maximum password age of 0 or greater than 60
      capability: unix.shadow
      object: etc-shadow-max-password-ages-non-system-users-object
      check_existence: any_exist
      check: all
      state_operator: AND
      states:
      - state-greater-than-zero
      - state-less-than-or-equal-to-sixty
    test-root-password-in-etc-shadow-does-not-have-maximum-password:
      test_title: Root password in /etc/shadow does not have a maximum password age of 0 or greater than 60
      capability: unix.shadow
      object: etc-shadow-max-password-age-root-object
      check_existence: all_exist
      check: all
      state_operator: AND
      states:
      - state-greater-than-zero
      - state-less-than-or-equal-to-sixty
  evaluate:
    all:
    - test: test-no-password-in-etc-shadow-has-maximum-password-age-0
    - test: test-root-password-in-etc-shadow-does-not-have-maximum-password
