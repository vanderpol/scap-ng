assessment:
  id: SV-258229.automated
  version: 1
  assessment_title: RHEL-09-654275 - RHEL 9 audit system must protect auditing rules from unauthorized change.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/audit.rules
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: \n[ \t]*-e[ \t]+2\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        multiline: 'false'
  tests:
    test-etc-audit-audit-rules-e-2-option-present-last-line:
      test_title: '/etc/audit/audit.rules: -e 2 option is present and is the last line in the file'
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    test: test-etc-audit-audit-rules-e-2-option-present-last-line
