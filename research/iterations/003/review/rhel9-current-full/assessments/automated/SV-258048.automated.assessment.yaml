assessment:
  id: SV-258048.automated
  version: 13
  assessment_title: All RHEL 9 interactive users must have a primary group that exists.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    return-any-user-who-does-not-have-valid-primary-group-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: pwck -r
        pattern:
          operation: pattern match
          datatype: string
          value: no group
      object_title: Return any user who does not have a valid primary group
  states:
    state-confirm-no-users-are-reported-that-have-an-invalid-prima:
      state_title: Confirm no users are reported that have an invalid primary group
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: ''
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: none_exist
  tests:
    test-interactive-users-have-primary-group-that-exists:
      test_title: Interactive users must have a primary group that exists.
      capability: independent.shellcommand
      object: return-any-user-who-does-not-have-valid-primary-group-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-confirm-no-users-are-reported-that-have-an-invalid-prima
  evaluate:
    test: test-interactive-users-have-primary-group-that-exists
