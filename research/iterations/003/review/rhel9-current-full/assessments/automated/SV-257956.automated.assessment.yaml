assessment:
  id: SV-257956.automated
  version: 1
  assessment_title: RHEL-09-252075 - There must be no .shosts files on RHEL 9.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    unix-file-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /
        filename:
          operation: equals
          datatype: string
          mask: false
          value: .shosts
      behaviors:
        max_depth: '-1'
        recurse: directories
        recurse_direction: down
        recurse_file_system: local
      object_title: null
  states: {}
  tests:
    test-there-no-shosts-files-on-system:
      test_title: There are no .shosts files on the system.
      capability: unix.file
      object: unix-file-object
      check_existence: none_exist
      check: all
  evaluate:
    test: test-there-no-shosts-files-on-system
