assessment:
  id: SV-258027.automated
  version: 13
  assessment_title: RHEL 9 must conceal, via the session lock, information previously visible on the display with
    a publicly viewable image.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    retrieve-picture-uri-writable-configuration-from-org-gnome-dekstop-screensaver-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: gsettings writable org.gnome.desktop.screensaver picture-uri
      object_title: Retrieve picture-uri 'writable' configuration from org.gnome.dekstop.screensaver.
  states:
    state-confirm-configuration-does-not-show-true-and-no-stderr-i:
      state_title: Confirm configuration does not show 'true' and no STDERR is produced.
      capability: independent.shellcommand
      state:
        all:
        - field: stdout_line
          value: 'true'
          operation: not equal
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stderr_line
          value: ''
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: none_exist
  tests:
    test-ensure-screensaver-configured-blank:
      test_title: Ensure the screensaver is configured to be blank.
      capability: independent.shellcommand
      object: retrieve-picture-uri-writable-configuration-from-org-gnome-dekstop-screensaver-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-confirm-configuration-does-not-show-true-and-no-stderr-i
  evaluate:
    test: test-ensure-screensaver-configured-blank
