assessment:
  id: SV-258027.automated
  version: 13
  assessment_title: RHEL 9 must conceal, via the session lock, information previously visible on the display with
    a publicly viewable image.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    retrieve-picture-uri-writable-configuration-from-org-gnome-dekstop-screensaver-collection:
      collection_title: Retrieve picture-uri 'writable' configuration from org.gnome.dekstop.screensaver.
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: gsettings writable org.gnome.desktop.screensaver picture-uri
  tests:
    test-ensure-screensaver-configured-blank:
      test_title: Ensure the screensaver is configured to be blank.
      capability: independent.shellcommand
      collection: retrieve-picture-uri-writable-configuration-from-org-gnome-dekstop-screensaver-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Confirm configuration does not show 'true' and no STDERR is produced.
        state_capability: independent.shellcommand
        state:
          all:
          - field: stdout_line
            value: 'true'
            operation: not equal
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stderr_line
            value: ''
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: none_exist
  evaluate:
    test: test-ensure-screensaver-configured-blank
