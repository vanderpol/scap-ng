assessment:
  id: SV-258022.automated
  version: 1
  assessment_title: RHEL-09-271060 - RHEL 9 must prevent a user from overriding the screensaver lock-enabled setting
    for the graphical user interface.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    check-that-etc-dconf-profile-user-system-db-at-minimum-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/dconf/profile/user
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*system-db\s*:\s*local\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: check that /etc/dconf/profile/user:system-db is at minimum set to local
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/dconf/db/local.d/locks
        filename:
          operation: pattern match
          datatype: string
          value: .*
        pattern:
          operation: pattern match
          datatype: string
          value: ^/org/gnome/desktop/screensaver/lock-enabled$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states: {}
  tests:
    test-check-that-etc-dconf-profile-user-system-db-at-minimum:
      test_title: check that /etc/dconf/profile/user:system-db is at minimum set to local
      capability: independent.textfilecontent54
      object: check-that-etc-dconf-profile-user-system-db-at-minimum-object
      check_existence: at_least_one_exists
      check: all
    test-org-gnome-desktop-screensaver-lock-enabled-in-etc-dconf-db:
      test_title: /org/gnome/desktop/screensaver/lock-enabled in /etc/dconf/db/local.d/locks/*
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    all:
    - test: test-check-that-etc-dconf-profile-user-system-db-at-minimum
    - test: test-org-gnome-desktop-screensaver-lock-enabled-in-etc-dconf-db
