assessment:
  id: SV-257834.automated
  version: 1
  assessment_title: RHEL-09-215055 - RHEL 9 must not have the tuned package installed.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    linux-rpminfo-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: tuned
      object_title: null
  states: {}
  tests:
    test-tuned-package-installed:
      test_title: tuned package is installed
      capability: linux.rpminfo
      object: linux-rpminfo-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    not:
      test: test-tuned-package-installed
