assessment:
  id: SV-258055.automated
  version: 1
  assessment_title: RHEL-09-411080 - RHEL 9 must automatically lock the root account until the root account is released
    by an administrator when three unsuccessful logon attempts occur during a 15-minute time period.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/security/faillock.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*even_deny_root\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-check-etc-security-faillock-conf-even-deny-root-setting:
      test_title: check /etc/security/faillock.conf for the even_deny_root setting
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state: null
  evaluate:
    test: test-check-etc-security-faillock-conf-even-deny-root-setting
