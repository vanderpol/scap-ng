assessment:
  id: SV-257867.manual
  version: 1
  assessment_title: RHEL 9 must mount /tmp with the noexec option.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify "/tmp" is mounted with the "noexec" option: $ mount | grep /tmp /dev/mapper/rhel-tmp on /tmp
    type xfs (rw,nodev,nosuid,noexec,seclabel) If the "/tmp" file system is mounted without the "noexec" option,
    this is a finding.'
  inputs: []
  evidence: []
