assessment:
  id: SV-257905.manual
  version: 1
  assessment_title: RHEL 9 /etc/gshadow- file must be group-owned by root.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the group ownership of the "/etc/gshadow-" file with the following command: $ sudo stat -c
    "%G %n" /etc/gshadow- root /etc/gshadow- If "/etc/gshadow-" file does not have a group owner of "root", this
    is a finding.'
  inputs: []
  evidence: []
