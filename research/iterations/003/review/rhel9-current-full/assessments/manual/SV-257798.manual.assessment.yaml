assessment:
  id: SV-257798.manual
  version: 1
  assessment_title: RHEL 9 must prevent kernel profiling by nonprivileged users.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify RHEL 9 is configured to prevent kernel profiling by nonprivileged users. Check the status of
    the "kernel.perf_event_paranoid" kernel parameter. $ sudo sysctl kernel.perf_event_paranoid kernel.perf_event_paranoid
    = 2 If "kernel.perf_event_paranoid" is not set to "2" or is missing, this is a finding.
  inputs: {}
  evidence: []
