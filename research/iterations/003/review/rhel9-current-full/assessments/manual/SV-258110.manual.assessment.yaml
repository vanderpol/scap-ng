assessment:
  id: SV-258110.manual
  version: 1
  assessment_title: RHEL 9 must prevent the use of dictionary words for passwords.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 prevents the use of dictionary words for passwords with the following command: $ grep
    dictcheck /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf /etc/security/pwquality.conf:dictcheck
    = 1 If "dictcheck" does not have a value other than "0", or is commented out, this is a finding.'
  inputs: {}
  evidence: []
