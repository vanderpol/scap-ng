assessment:
  id: SV-257790.manual
  version: 1
  assessment_title: RHEL 9 /boot/grub2/grub.cfg file must be group-owned by root.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the group ownership of the "/boot/grub2/grub.cfg" file with the following command: $ sudo stat
    -c "%G %n" /boot/grub2/grub.cfg root /boot/grub2/grub.cfg If "/boot/grub2/grub.cfg" file does not have a group
    owner of "root", this is a finding.'
  inputs: {}
  evidence: []
