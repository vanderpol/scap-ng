assessment:
  id: SV-258003.manual
  version: 1
  assessment_title: RHEL 9 SSH daemon must not allow GSSAPI authentication.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the SSH daemon does not allow GSSAPI authentication with the following command: $ sudo /usr/sbin/sshd
    -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo grep -iH ''^\s*gssapiauthentication''
    GSSAPIAuthentication no If the value is returned as "yes", the returned line is commented out, no output is
    returned, and the use of GSSAPI authentication has not been documented with the information system security
    officer (ISSO), this is a finding. If the required value is not set, this is a finding.'
  inputs: []
  evidence: []
