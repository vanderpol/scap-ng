assessment:
  id: SV-258109.manual
  version: 1
  assessment_title: RHEL 9 must enforce password complexity by requiring that at least one special character be
    used.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 enforces password complexity by requiring at least one special character with the
    following command: $ sudo grep ocredit /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf ocredit
    = -1 If the value of "ocredit" is a positive number or is commented out, this is a finding.'
  inputs: {}
  evidence: []
