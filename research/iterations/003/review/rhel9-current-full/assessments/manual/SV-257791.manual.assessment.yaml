assessment:
  id: SV-257791.manual
  version: 1
  assessment_title: RHEL 9 /boot/grub2/grub.cfg file must be owned by root.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the ownership of the "/boot/grub2/grub.cfg" file with the following command: $ sudo stat -c
    "%U %n" /boot/grub2/grub.cfg root /boot/grub2/grub.cfg If "/boot/grub2/grub.cfg" file does not have an owner
    of "root", this is a finding.'
  inputs: {}
  evidence: []
