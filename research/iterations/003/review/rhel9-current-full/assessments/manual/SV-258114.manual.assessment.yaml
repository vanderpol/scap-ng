assessment:
  id: SV-258114.manual
  version: 1
  assessment_title: RHEL 9 must require the maximum number of repeating characters be limited to three when passwords
    are changed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify that RHEL 9 requires that passwords can have a maximum of three of the same consecutive character.
    $ grep maxrepeat /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf maxrepeat = 3 If the value
    of "maxrepeat" is set to more than "3", or is commented out, this is a finding.
  inputs: []
  evidence: []
