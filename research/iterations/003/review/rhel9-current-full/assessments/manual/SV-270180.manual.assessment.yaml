assessment:
  id: SV-270180.manual
  version: 1
  assessment_title: The RHEL 9 fapolicy module must be configured to employ a deny-all, permit-by-exception policy
    to allow the execution of authorized software programs.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the RHEL 9 "fapolicyd" employs a deny-all, permit-by-exception policy. Verify "fapolicyd" is
    in enforcement mode with the following command: $ sudo grep permissive /etc/fapolicyd/fapolicyd.conf permissive
    = 0 If "fapolicyd" is not running in enforcement mode, this is a finding. Check that "fapolicyd" employs a deny-all
    policy on system mounts with the following commands: $ sudo tail /etc/fapolicyd/compiled.rules allow exe=/usr/bin/python3.7
    : ftype=text/x-python deny_audit perm=any pattern=ld_so : all deny perm=any all : all If "fapolicyd" is not
    running with a deny-all, permit-by-exception policy, this is a finding. Note: "deny_log" or "deny_audit" options
    meet the security requirements. These options will generate higher volumes of logs.'
  inputs: []
  evidence: []
