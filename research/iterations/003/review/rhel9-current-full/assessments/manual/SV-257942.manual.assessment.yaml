assessment:
  id: SV-257942.manual
  version: 1
  assessment_title: RHEL 9 must enable hardening for the Berkeley Packet Filter just-in-time compiler.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 enables hardening for the BPF JIT compiler. Check the status of the "net.core.bpf_jit_harden"
    parameter with the following command: $ sudo sysctl net.core.bpf_jit_harden net.core.bpf_jit_harden = 2 If "net.core.bpf_jit_harden"
    is not equal to "2" or is missing, this is a finding.'
  inputs: {}
  evidence: []
