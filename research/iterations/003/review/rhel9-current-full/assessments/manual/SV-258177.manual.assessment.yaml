assessment:
  id: SV-258177.manual
  version: 1
  assessment_title: RHEL 9 must audit all uses of the chmod, fchmod, and fchmodat system calls.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 is configured to audit the execution of the "chmod", "fchmod", and "fchmodat" system
    calls with the following command: $ sudo auditctl -l | grep chmod -a always,exit -F arch=b32 -S chmod,fchmod,fchmodat
    -F auid>=1000 -F auid!=-1 -F key=perm_mod -a always,exit -F arch=b64 -S chmod,fchmod,fchmodat -F auid>=1000
    -F auid!=-1 -F key=perm_mod If both the "b32" and "b64" audit rules are not defined for the "chmod", "fchmod",
    and "fchmodat" system calls, this is a finding.'
  inputs: {}
  evidence: []
