assessment:
  id: SV-257923.manual
  version: 1
  assessment_title: RHEL 9 library directories must be group-owned by root or a system account.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the systemwide shared library directories are group-owned by "root" with the following command:
    $ sudo find /lib /lib64 /usr/lib /usr/lib64 ! -group root -type d -exec stat -c "%G %n" {} \; If any systemwide
    shared library directory is returned and is not group-owned by a required system account, this is a finding.'
  inputs: {}
  evidence: []
