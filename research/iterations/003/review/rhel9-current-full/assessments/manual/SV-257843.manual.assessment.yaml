assessment:
  id: SV-257843.manual
  version: 1
  assessment_title: A separate RHEL 9 file system must be used for user home directories (such as /home or an equivalent).
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that a separate file system/partition has been created for "/home" with the following command:
    $ mount | grep /home UUID=fba5000f-2ffa-4417-90eb-8c54ae74a32f on /home type ext4 (rw,nodev,nosuid,noexec,seclabel)
    If a separate entry for "/home" is not in use, this is a finding.'
  inputs: {}
  evidence: []
