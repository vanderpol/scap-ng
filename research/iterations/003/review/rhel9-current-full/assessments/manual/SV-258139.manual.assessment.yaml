assessment:
  id: SV-258139.manual
  version: 1
  assessment_title: RHEL 9 must be configured so that the file integrity tool verifies extended attributes.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that AIDE is configured to verify extended attributes with the following command: $ sudo grep
    xattrs /etc/aide.conf All= p+i+n+u+g+s+m+S+sha512+acl+xattrs+selinux If the "xattrs" rule is not being used
    on all uncommented selection lines in the "/etc/aide.conf" file, or extended attributes are not being checked
    by another file integrity tool, this is a finding.'
  inputs: {}
  evidence: []
