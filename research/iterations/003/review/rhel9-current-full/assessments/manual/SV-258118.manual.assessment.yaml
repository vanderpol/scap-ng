assessment:
  id: SV-258118.manual
  version: 1
  assessment_title: RHEL 9 must not be configured to bypass password requirements for privilege escalation.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system is not configured to bypass password requirements for privilege escalation
    with the following command: $ sudo grep pam_succeed_if /etc/pam.d/sudo If any occurrences of "pam_succeed_if"
    are returned, this is a finding.'
