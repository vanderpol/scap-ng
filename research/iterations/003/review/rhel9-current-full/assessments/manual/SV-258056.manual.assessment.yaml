assessment:
  id: SV-258056.manual
  version: 1
  assessment_title: RHEL 9 must automatically lock an account when three unsuccessful logon attempts occur during
    a 15-minute time period.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: If the system administrator demonstrates the use of an approved centralized account management
    method that locks an account after three unsuccessful logon attempts within a period of 15 minutes, this requirement
    is Not Applicable. Verify RHEL 9 locks an account after three unsuccessful logon attempts within a period of
    15 minutes with the following command: $ sudo grep fail_interval /etc/security/faillock.conf fail_interval =
    900 If the "fail_interval" option is not set to "900" or less (but not "0"), the line is commented out, or the
    line is missing, this is a finding.'
  inputs: []
  evidence: []
