assessment:
  id: SV-258034.manual
  version: 1
  assessment_title: RHEL 9 must be configured to disable USB mass storage.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 disables the ability to load the USB Storage kernel module with the following command:
    $ grep -r usb-storage /etc/modprobe.conf /etc/modprobe.d/* install usb-storage /bin/false blacklist usb-storage
    If the command does not return any output, or either line is commented out, and use of USB Storage is not documented
    with the information system security officer (ISSO) as an operational requirement, this is a finding.'
  inputs: []
  evidence: []
