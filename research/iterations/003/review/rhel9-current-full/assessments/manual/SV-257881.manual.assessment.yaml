assessment:
  id: SV-257881.manual
  version: 1
  assessment_title: RHEL 9 must prevent special devices on non-root local partitions.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify all nonroot local partitions are mounted with the "nodev" option with the following command:
    $ sudo mount | grep ''^/dev\S* on /\S'' | grep --invert-match ''nodev'' If any output is produced, this is a
    finding.'
  inputs: {}
  evidence: []
