assessment:
  id: SV-258136.manual
  version: 1
  assessment_title: RHEL 9 must use a file integrity tool that is configured to use FIPS 140-3-approved cryptographic
    hashes for validating file contents and directories.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that AIDE is configured to use FIPS 140-3 file hashing with the following command: $ sudo grep
    sha512 /etc/aide.conf All=p+i+n+u+g+s+m+S+sha512+acl+xattrs+selinux If the "sha512" rule is not being used on
    all uncommented selection lines in the "/etc/aide.conf" file, or another file integrity tool is not using FIPS
    140-3-approved cryptographic hashes for validating file contents and directories, this is a finding.'
  inputs: []
  evidence: []
