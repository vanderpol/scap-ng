assessment:
  id: SV-257994.manual
  version: 1
  assessment_title: RHEL 9 must force a frequent session key renegotiation for SSH connections to the server.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the SSH server is configured to force frequent session key renegotiation with the following
    command: $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs
    sudo grep -iH ''^\s*rekeylimit'' RekeyLimit 1G 1h If "RekeyLimit" does not have a maximum data amount and maximum
    time defined, is missing, or is commented out, this is a finding.'
  inputs: []
  evidence: []
