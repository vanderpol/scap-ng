assessment:
  id: SV-258008.manual
  version: 1
  assessment_title: RHEL 9 SSH daemon must perform strict mode checking of home directory configuration files.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the SSH daemon performs strict mode checking of home directory configuration files with the
    following command: $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n''
    '' '' | xargs sudo grep -iH ''^\s*strictmodes'' StrictModes yes If the "StrictModes" keyword is set to "no",
    the returned line is commented out, or no output is returned, this is a finding.'
  inputs: []
  evidence: []
