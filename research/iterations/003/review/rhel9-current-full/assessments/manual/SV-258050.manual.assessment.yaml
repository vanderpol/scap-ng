assessment:
  id: SV-258050.manual
  version: 1
  assessment_title: Executable search paths within the initialization files of all local interactive RHEL 9 users
    must only contain paths that resolve to the system default or the users home directory.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that all local interactive user initialization file executable search path statements do not
    contain statements that will reference a working directory other than user home directories with the following
    commands: $ sudo find /home -maxdepth 2 -type f -name ".[^.]*" -exec grep -iH path= {} \; PATH="$HOME/.local/bin:$HOME/bin:$PATH"
    If any local interactive user initialization files have executable search path statements that include directories
    outside of their home directory, and this is not documented with the ISSO as an operational requirement, this
    is a finding.'
  inputs: {}
  evidence: []
