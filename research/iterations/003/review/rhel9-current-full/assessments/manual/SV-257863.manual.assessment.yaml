assessment:
  id: SV-257863.manual
  version: 1
  assessment_title: RHEL 9 must mount /dev/shm with the nodev option.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify "/dev/shm" is mounted with the "nodev" option with the following command: $ findmnt /dev/shm
    TARGET SOURCE FSTYPE OPTIONS /dev/shm tmpfs tmpfs rw,nodev,nosuid,noexec,seclabel If the mount options for /dev/shm
    does not include nodev, this is a finding.'
  inputs: []
  evidence: []
