assessment:
  id: SV-257970.manual
  version: 1
  assessment_title: RHEL 9 must not enable IPv4 packet forwarding unless the system is a router.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 is not performing IPv4 packet forwarding unless the system is a router. Check that "net.ipv4.conf.all.forwarding"
    is disabled using the following command: $ sudo sysctl net.ipv4.conf.all.forwarding net.ipv4.conf.all.forwarding
    = 0 If "net.ipv4.conf.all.forwarding" is not set to "0" and is not documented with the information system security
    officer (ISSO) as an operational requirement or is missing, this is a finding.'
  inputs: []
  evidence: []
