assessment:
  id: SV-258021.manual
  version: 1
  assessment_title: RHEL 9 must enable a user session lock until that user re-establishes access using established
    identification and authentication procedures for graphical user sessions.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 enables a user''s session lock until that user re-establishes access using established
    identification and authentication procedures with the following command: Note: This requirement assumes the
    use of the RHEL 9 default graphical user interface, the GNOME desktop environment. If the system does not have
    any graphical user interface installed, this requirement is Not Applicable. $ gsettings get org.gnome.desktop.screensaver
    lock-enabled true If the setting is "false", this is a finding.'
  inputs: {}
  evidence: []
