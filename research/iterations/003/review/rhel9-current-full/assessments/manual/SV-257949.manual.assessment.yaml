assessment:
  id: SV-257949.manual
  version: 1
  assessment_title: RHEL 9 must configure a DNS processing mode in Network Manager.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 has a DNS mode configured in Network Manager. $ NetworkManager --print-config [main]
    dns=none If the dns key under main does not exist or is not set to "default", "none", or "systemd-resolved",
    this is a finding. Note: If RHEL 9 is configured to use a DNS resolver other than Network Manager, the configuration
    must be documented and approved by the information system security officer (ISSO).'
  inputs: []
  evidence: []
