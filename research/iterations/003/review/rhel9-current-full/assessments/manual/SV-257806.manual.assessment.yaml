assessment:
  id: SV-257806.manual
  version: 1
  assessment_title: RHEL 9 must be configured to disable the FireWire kernel module.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 disables the ability to load the firewire-core kernel module with the following
    command: $ grep -r firewire-core /etc/modprobe.conf /etc/modprobe.d/* install firewire-core /bin/false blacklist
    firewire-core If the command does not return any output, or the lines are commented out, and use of firewire-core
    is not documented with the information system security officer (ISSO) as an operational requirement, this is
    a finding.'
  inputs: {}
  evidence: []
