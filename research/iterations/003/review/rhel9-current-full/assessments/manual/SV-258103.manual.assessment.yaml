assessment:
  id: SV-258103.manual
  version: 1
  assessment_title: RHEL 9 must enforce password complexity by requiring that at least one numeric character be
    used.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 enforces password complexity by requiring at least one numeric character. Check
    the value for "dcredit" with the following command: $ grep dcredit /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    /etc/security/pwquality.conf:dcredit = -1 If the value of "dcredit" is a positive number or is commented out,
    this is a finding.'
  inputs: {}
  evidence: []
