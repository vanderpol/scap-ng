assessment:
  id: SV-258154.manual
  version: 1
  assessment_title: RHEL 9 audit system must take appropriate action when the audit storage volume is full.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 takes the appropriate action when the audit storage volume is full. Check that RHEL
    9 takes the appropriate action when the audit storage volume is full with the following command: $ sudo grep
    disk_full_action /etc/audit/auditd.conf disk_full_action = HALT If the value of the "disk_full_action" option
    is not "SYSLOG", "SINGLE", or "HALT", or the line is commented out, ask the system administrator (SA) to indicate
    how the system takes appropriate action when an audit storage volume is full. If there is no evidence of appropriate
    action, this is a finding.'
  inputs: {}
  evidence: []
