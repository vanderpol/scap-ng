assessment:
  id: SV-257929.manual
  version: 1
  assessment_title: A sticky bit must be set on all RHEL 9 public directories.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that all world-writable directories have the sticky bit set. Determine if all world-writable
    directories have the sticky bit set by running the following command: $ sudo find / -type d \( -perm -0002 -a
    ! -perm -1000 \) -print 2>/dev/null drwxrwxrwt 7 root root 4096 Jul 26 11:19 /tmp If any of the returned directories
    are world-writable and do not have the sticky bit set, this is a finding.'
  inputs: []
  evidence: []
