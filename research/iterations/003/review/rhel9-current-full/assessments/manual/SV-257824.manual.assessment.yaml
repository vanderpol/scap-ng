assessment:
  id: SV-257824.manual
  version: 1
  assessment_title: RHEL 9 must remove all software components after updated versions have been installed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 removes all software components after updated versions have been installed with the
    following command: $ grep -i clean_requirements_on_remove /etc/dnf/dnf.conf clean_requirements_on_remove=True
    If "clean_requirements_on_remove" is not set to "True", this is a finding.'
  inputs: []
  evidence: []
