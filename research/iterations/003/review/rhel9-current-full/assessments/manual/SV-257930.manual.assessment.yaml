assessment:
  id: SV-257930.manual
  version: 1
  assessment_title: All RHEL 9 local files and directories must have a valid group owner.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify all local files and directories on RHEL 9 have a valid group with the following command: $
    df --local -P | awk {''if (NR!=1) print $6''} | sudo xargs -I ''{}'' find ''{}'' -xdev -nogroup If any files
    on the system do not have an assigned group, this is a finding.'
  inputs: {}
  evidence: []
