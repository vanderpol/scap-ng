assessment:
  id: SV-258019.manual
  version: 1
  assessment_title: RHEL 9 must be able to initiate directly a session lock for all connection types using smart
    card when the smart card is removed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: This requirement assumes the use of the RHEL 9 default graphical user interface, the GNOME desktop
    environment. If the system does not have any graphical user interface installed, this requirement is Not Applicable.
    Verify RHEL 9 enables a user''s session lock until that user reestablishes access using established identification
    and authentication procedures with the following command: $ gsettings get org.gnome.settings-daemon.peripherals.smartcard
    removal-action ''lock-screen'' If the result is not ''lock-screen'', this is a finding.'
  inputs: []
  evidence: []
