assessment:
  id: SV-258009.manual
  version: 1
  assessment_title: RHEL 9 SSH daemon must display the date and time of the last successful account logon upon an
    SSH logon.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the SSH daemon provides users with feedback on when account accesses last occurred with the
    following command: $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n''
    '' '' | xargs sudo grep -iH ''^\s*printlastlog'' PrintLastLog yes If the "PrintLastLog" keyword is set to "no",
    the returned line is commented out, or no output is returned, this is a finding.'
  inputs: {}
  evidence: []
