assessment:
  id: SV-258122.manual
  version: 1
  assessment_title: RHEL 9 must enable certificate based smart card authentication.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: If the system administrator (SA) demonstrates the use of an approved alternate multifactor authentication
    method, this requirement is Not Applicable. To verify that RHEL 9 has smart cards enabled in System Security
    Services Daemon (SSSD), run the following command: $ sudo grep -ir pam_cert_auth /etc/sssd/sssd.conf /etc/sssd/conf.d/
    pam_cert_auth = True If "pam_cert_auth" is not set to "True", the line is commented out, or the line is missing,
    this is a finding.'
  inputs: {}
  evidence: []
