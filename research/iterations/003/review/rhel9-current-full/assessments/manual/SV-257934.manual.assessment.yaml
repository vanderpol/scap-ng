assessment:
  id: SV-257934.manual
  version: 1
  assessment_title: RHEL 9 /etc/shadow file must have mode 0000 to prevent unauthorized access.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that the "/etc/shadow" file has mode "0000" with the following command: $ sudo stat -c "%a
    %n" /etc/shadow 0 /etc/shadow If a value of "0" is not returned, this is a finding.'
  inputs: []
  evidence: []
