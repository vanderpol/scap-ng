assessment:
  id: SV-257961.manual
  version: 1
  assessment_title: RHEL 9 must log IPv4 packets with impossible addresses by default.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 logs IPv4 martian packets by default. Check the value of the "default.log_martians"
    variable with the following command: $ sudo sysctl net.ipv4.conf.default.log_martians net.ipv4.conf.default.log_martians
    = 1 If "net.ipv4.conf.default.log_martians" is not set to "1" or is missing, this is a finding.'
  inputs: []
  evidence: []
