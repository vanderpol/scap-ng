assessment:
  id: SV-257861.manual
  version: 1
  assessment_title: RHEL 9 must prevent files with the setuid and setgid bit set from being executed on the /boot
    directory.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the /boot directory is mounted with the "nosuid" option with the following command: $ mount
    | grep ''\s/boot\s'' /dev/sda1 on /boot type xfs (rw,nosuid,relatime,seclabe,attr2,inode64,noquota) If the /boot
    file system does not have the "nosuid" option set, this is a finding.'
  inputs: {}
  evidence: []
