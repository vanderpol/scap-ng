assessment:
  id: SV-257984.manual
  version: 1
  assessment_title: RHEL 9 SSHD must not allow blank passwords.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 remote access using SSH prevents logging on with a blank password with the following
    command: $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs
    sudo grep -iH ''^\s*permitemptypasswords'' PermitEmptyPasswords no If the "PermitEmptyPasswords" keyword is
    set to "yes", is missing, or is commented out, this is a finding.'
  inputs: []
  evidence: []
