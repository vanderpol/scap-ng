assessment:
  id: SV-258099.manual
  version: 1
  assessment_title: RHEL 9 password-auth must be configured to use a sufficient number of hashing rounds.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the number of rounds for the password hashing algorithm is configured with the following command:
    $ grep rounds /etc/pam.d/password-auth password sufficient pam_unix.so sha512 rounds=100000 If a matching line
    is not returned or "rounds" is less than "100000", this a finding.'
  inputs: {}
  evidence: []
