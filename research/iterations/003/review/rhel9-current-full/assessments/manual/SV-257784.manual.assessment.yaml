assessment:
  id: SV-257784.manual
  version: 1
  assessment_title: The systemd Ctrl-Alt-Delete burst key sequence in RHEL 9 must be disabled.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 is configured to not reboot the system when Ctrl-Alt-Delete is pressed seven times within
    two seconds with the following command: $ sudo grep -iR CtrlAltDelBurstAction /etc/systemd/system* /etc/systemd/system.conf.d/55-CtrlAltDel-BurstAction.conf:CtrlAltDelBurstAction=none
    If the "CtrlAltDelBurstAction" is not set to "none", is commented out, or is missing, this is a finding.'
  inputs: {}
  evidence: []
