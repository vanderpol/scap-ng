assessment:
  id: SV-258131.manual
  version: 1
  assessment_title: RHEL 9, for PKI-based authentication, must validate certificates by constructing a certification
    path (which includes status information) to an accepted trust anchor.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: If the system administrator demonstrates the use of an approved alternate multifactor authentication
    method, this requirement is not applicable. Verify RHEL 9 for PKI-based authentication has valid certificates
    by constructing a certification path (which includes status information) to an accepted trust anchor. Check
    that the system has a valid DOD root CA installed with the following command: $ sudo openssl x509 -text -in
    /etc/sssd/pki/sssd_auth_ca_db.pem Example output: Certificate: Data: Version: 3 (0x2) Serial Number: 1 (0x1)
    Signature Algorithm: sha256WithRSAEncryption Issuer: C = US, O = U.S. Government, OU = DoD, OU = PKI, CN = DoD
    Root CA 3 Validity Not Before: Mar 20 18:46:41 2012 GMT Not After: Dec 30 18:46:41 2029 GMT Subject: C = US,
    O = U.S. Government, OU = DoD, OU = PKI, CN = DoD Root CA 3 Subject Public Key Info: Public Key Algorithm: rsaEncryption
    If the root CA file is not a DOD-issued certificate with a valid date and installed in the "/etc/sssd/pki/sssd_auth_ca_db.pem"
    location, this is a finding.'
  inputs: []
  evidence: []
