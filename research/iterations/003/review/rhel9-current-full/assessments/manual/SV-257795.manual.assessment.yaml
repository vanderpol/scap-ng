assessment:
  id: SV-257795.manual
  version: 1
  assessment_title: RHEL 9 must enable mitigations against processor-based vulnerabilities.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 enables kernel page-table isolation with the following command: $ sudo grubby --info=ALL
    | grep args | grep -v ''pti=on'' If any output is returned, this is a finding. Check that kernel page-table
    isolation is enabled by default to persist in kernel updates: $ grep pti /etc/default/grub GRUB_CMDLINE_LINUX="pti=on"
    If "pti" is not set to "on", is missing or commented out, this is a finding.'
  inputs: []
  evidence: []
