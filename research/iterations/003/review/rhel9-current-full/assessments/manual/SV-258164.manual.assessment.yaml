assessment:
  id: SV-258164.manual
  version: 1
  assessment_title: RHEL 9 audit system must audit local events.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that the RHEL 9 audit system is configured to audit local events with the following command:
    $ sudo grep local_events /etc/audit/auditd.conf local_events = yes If "local_events" isn''t set to "yes", if
    the command does not return a line, or the line is commented out, this is a finding.'
  inputs: []
  evidence: []
