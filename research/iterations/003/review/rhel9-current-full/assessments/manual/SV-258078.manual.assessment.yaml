assessment:
  id: SV-258078.manual
  version: 1
  assessment_title: RHEL 9 must use a Linux Security Module configured to enforce limits on system services.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Ensure that RHEL 9 verifies correct operation of security functions through the use of SELinux with
    the following command: $ getenforce Enforcing If SELINUX is not set to "Enforcing", this is a finding. Verify
    that SELinux is configured to be enforcing at boot. grep "SELINUX=" /etc/selinux/config # SELINUX= can take
    one of these three values: # NOTE: In earlier Fedora kernel builds, SELINUX=disabled would also SELINUX=enforcing
    If SELINUX line is missing, commented out, or not set to "enforcing", this is a finding.'
  inputs: {}
  evidence: []
