assessment:
  id: SV-257800.manual
  version: 1
  assessment_title: RHEL 9 must restrict exposed kernel pointer addresses access.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 is configured to restrict exposed kernel pointer address access. Verify the runtime
    status of the "kernel.kptr_restrict" kernel parameter with the following command: $ sudo sysctl kernel.kptr_restrict
    kernel.kptr_restrict = 1 If "kernel.kptr_restrict" is not set to "1" or is missing, this is a finding.'
  inputs: {}
  evidence: []
