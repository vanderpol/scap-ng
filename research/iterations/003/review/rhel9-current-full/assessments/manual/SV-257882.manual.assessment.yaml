assessment:
  id: SV-257882.manual
  version: 1
  assessment_title: RHEL 9 system commands must have mode 755 or less permissive.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the system commands contained in the following directories have mode "755" or less permissive
    with the following command: $ sudo find -L /bin /sbin /usr/bin /usr/sbin /usr/libexec /usr/local/bin /usr/local/sbin
    -perm /022 -exec ls -l {} \; If any system commands are found to be group-writable or world-writable, this is
    a finding.'
  inputs: {}
  evidence: []
