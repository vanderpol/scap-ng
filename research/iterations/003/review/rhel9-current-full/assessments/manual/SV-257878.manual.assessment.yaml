assessment:
  id: SV-257878.manual
  version: 1
  assessment_title: RHEL 9 must mount /var/tmp with the nosuid option.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify "/var/tmp" is mounted with the "nosuid" option: $ mount | grep /var/tmp /dev/mapper/rhel-var-tmp
    on /var/tmp type xfs (rw,nodev,nosuid,noexec,seclabel) If the "/var/tmp" file system is mounted without the
    "nosuid" option, this is a finding.'
  inputs: {}
  evidence: []
