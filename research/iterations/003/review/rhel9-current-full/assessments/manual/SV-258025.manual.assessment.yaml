assessment:
  id: SV-258025.manual
  version: 1
  assessment_title: RHEL 9 must initiate a session lock for graphical user interfaces when the screensaver is activated.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 initiates a session lock for graphical user interfaces when the screensaver is activated
    with the following command: Note: This requirement assumes the use of the RHEL 9 default graphical user interface,
    the GNOME desktop environment. If the system does not have any graphical user interface installed, this requirement
    is Not Applicable. $ gsettings get org.gnome.desktop.screensaver lock-delay uint32 5 If the "uint32" setting
    is not set to "5" or less, or is missing, this is a finding.'
  inputs: {}
  evidence: []
