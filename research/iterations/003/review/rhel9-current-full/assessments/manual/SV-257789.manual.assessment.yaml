assessment:
  id: SV-257789.manual
  version: 1
  assessment_title: RHEL 9 must require a unique superusers name upon booting into single-user and maintenance modes.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the RHEL 9 boot loader superuser account has been set with the following command: $ sudo grep
    -A1 "superusers" /etc/grub2.cfg set superusers="<accountname>" export superusers password_pbkdf2 <accountname>
    ${GRUB2_PASSWORD} Verify <accountname> is not a common name such as root, admin, or administrator. If superusers
    contains easily guessable usernames, this is a finding.'
  inputs: {}
  evidence: []
