assessment:
  id: SV-257851.manual
  version: 1
  assessment_title: RHEL 9 must prevent files with the setuid and setgid bit set from being executed on file systems
    that contain user home directories.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify "/home" is mounted with the "nosuid" option with the following command: Note: If a separate
    file system has not been created for the user home directories (user home directories are mounted under "/"),
    this is automatically a finding, as the "nosuid" option cannot be used on the "/" system. $ mount | grep /home
    tmpfs on /home type xfs (rw,nodev,nosuid,noexec,seclabel) If the "/home" file system is mounted without the
    "nosuid" option, this is a finding.'
  inputs: []
  evidence: []
