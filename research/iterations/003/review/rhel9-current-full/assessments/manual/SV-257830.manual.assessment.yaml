assessment:
  id: SV-257830.manual
  version: 1
  assessment_title: RHEL 9 must not install packages from the Extra Packages for Enterprise Linux (EPEL) repository.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 is not able to install packages from the EPEL with the following command: $ dnf
    repolist rhel-9-for-x86_64-appstream-rpms Red Hat Enterprise Linux 9 for x86_64 - AppStream (RPMs) rhel-9-for-x86_64-baseos-rpms
    Red Hat Enterprise Linux 9 for x86_64 - BaseOS (RPMs) If any repositories containing the word "epel" in the
    name exist, this is a finding.'
  inputs: []
  evidence: []
