assessment:
  id: SV-258107.manual
  version: 1
  assessment_title: RHEL 9 passwords must be created with a minimum of 15 characters.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 enforces a minimum 15-character password length with the following command: $ grep
    minlen /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf minlen = 15 If the command does not
    return a "minlen" value of "15" or greater, does not return a line, or the line is commented out, this is a
    finding.'
  inputs: {}
  evidence: []
