assessment:
  id: SV-258224.manual
  version: 1
  assessment_title: RHEL 9 must generate audit records for all account creations, modifications, disabling, and
    termination events that affect /var/log/faillock.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 generates audit records for all account creations, modifications, disabling, and termination
    events that affect "/var/log/faillock" with the following command: $ sudo auditctl -l | grep /var/log/faillock
    -a always,exit -F arch=b32 -F path=/var/log/faillock -F perm=wa -F auid>=1000 -F auid!=unset -k logins -a always,exit
    -F arch=b64 -F path=/var/log/faillock -F perm=wa -F auid>=1000 -F auid!=unset -k logins If the command does
    not return a line, or the line is commented out, this is a finding.'
  inputs: []
  evidence: []
