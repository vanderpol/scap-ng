assessment:
  id: SV-257786.manual
  version: 1
  assessment_title: RHEL 9 debug-shell systemd service must be disabled.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 is configured to mask the debug-shell systemd service with the following command: $
    sudo systemctl status debug-shell.service debug-shell.service Loaded: masked (Reason: Unit debug-shell.service
    is masked.) Active: inactive (dead) If the "debug-shell.service" is loaded and not masked, this is a finding.'
  inputs: []
  evidence: []
