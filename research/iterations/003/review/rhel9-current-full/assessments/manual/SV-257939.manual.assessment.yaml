assessment:
  id: SV-257939.manual
  version: 1
  assessment_title: RHEL 9 must protect against or limit the effects of denial-of-service (DoS) attacks by ensuring
    rate-limiting measures on impacted network interfaces are implemented.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify "nftables" is configured to allow rate limits on any connection to the system with the following
    command: $ sudo grep -i firewallbackend /etc/firewalld/firewalld.conf # FirewallBackend FirewallBackend=nftables
    If the "nftables" is not set as the "FirewallBackend" default, this is a finding.'
  inputs: {}
  evidence: []
