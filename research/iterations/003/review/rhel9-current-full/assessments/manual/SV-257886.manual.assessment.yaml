assessment:
  id: SV-257886.manual
  version: 1
  assessment_title: RHEL 9 /var/log/messages file must have mode 0640 or less permissive.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the "/var/log/messages" file has a mode of "0640" or less permissive with the following command:
    $ stat -c ''%a %n'' /var/log/messages 600 /var/log/messages If "/var/log/messages" does not have a mode of "0640"
    or less permissive, this is a finding.'
  inputs: []
  evidence: []
