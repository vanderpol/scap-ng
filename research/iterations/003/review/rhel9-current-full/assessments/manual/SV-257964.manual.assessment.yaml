assessment:
  id: SV-257964.manual
  version: 1
  assessment_title: RHEL 9 must not forward IPv4 source-routed packets by default.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 does not accept IPv4 source-routed packets by default. Check the value of the "accept
    source route" variable with the following command: $ sudo sysctl net.ipv4.conf.default.accept_source_route net.ipv4.conf.default.accept_source_route
    = 0 If "net.ipv4.conf.default.accept_source_route" is not set to "0" or is missing, this is a finding.'
  inputs: {}
  evidence: []
