assessment:
  id: SV-258141.manual
  version: 1
  assessment_title: RHEL 9 must have the packages required for encrypting offloaded audit logs installed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 has the rsyslog-gnutls package installed with the following command: $ dnf list
    --installed rsyslog-gnutls Example output: rsyslog-gnutls.x86_64 8.2102.0-101.el9_0.1 If the "rsyslog-gnutls"
    package is not installed, this is a finding.'
  inputs: {}
  evidence: []
