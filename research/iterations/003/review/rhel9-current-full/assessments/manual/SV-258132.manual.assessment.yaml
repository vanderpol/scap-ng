assessment:
  id: SV-258132.manual
  version: 1
  assessment_title: RHEL 9 must map the authenticated identity to the user or group account for PKI-based authentication.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: If the system administrator (SA) demonstrates the use of an approved alternate multifactor authentication
    method, this requirement is not applicable. Verify the certificate of the user or group is mapped to the corresponding
    user or group in the "sssd.conf" file with the following command: $ sudo find /etc/sssd/sssd.conf /etc/sssd/conf.d/
    -type f -exec cat {} \; [certmap/testing.test/rule_name] matchrule =<SAN>.*EDIPI@mil maprule = (userCertificate;binary={cert!bin})
    domains = testing.test If the certmap section does not exist, ask the SA to indicate how certificates are mapped
    to accounts. If there is no evidence of certificate mapping, this is a finding.'
  inputs: []
  evidence: []
