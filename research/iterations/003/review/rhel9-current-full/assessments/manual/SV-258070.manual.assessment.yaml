assessment:
  id: SV-258070.manual
  version: 1
  assessment_title: RHEL 9 must log username information when unsuccessful logon attempts occur.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the "/etc/security/faillock.conf" file is configured to log username information when unsuccessful
    logon attempts occur with the following command: $ sudo grep audit /etc/security/faillock.conf audit If the
    "audit" option is not set, is missing, or is commented out, this is a finding.'
  inputs: {}
  evidence: []
