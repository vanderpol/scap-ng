assessment:
  id: SV-257825.manual
  version: 1
  assessment_title: RHEL 9 subscription-manager package must be installed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: If the system is not an internet connected system, this requirement is not applicable. Verify
    that RHEL 9 subscription-manager package is installed with the following command: $ dnf list --installed subscription-manager
    Example output: subscription-manager.x86_64 1.29.26-3.el9_0 If the "subscription-manager" package is not installed,
    this is a finding.'
  inputs: {}
  evidence: []
