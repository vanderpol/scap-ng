assessment:
  id: SV-258232.manual
  version: 1
  assessment_title: RHEL 9 IP tunnels must use FIPS 140-3 approved cryptographic algorithms.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that the IPsec service uses the system crypto policy with the following command: Note: If the
    ipsec service is not installed, this requirement is Not Applicable. $ sudo grep include /etc/ipsec.conf /etc/ipsec.d/*.conf
    /etc/ipsec.conf:include /etc/crypto-policies/back-ends/libreswan.config If the ipsec configuration file does
    not contain "include /etc/crypto-policies/back-ends/libreswan.config", this is a finding.'
  inputs: []
  evidence: []
