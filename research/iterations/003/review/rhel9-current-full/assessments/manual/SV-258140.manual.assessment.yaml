  assessment_title: RHEL 9 must have the rsyslog package installed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 has the rsyslog package installed with the following command: $ dnf list --installed
    rsyslog Example output: rsyslog.x86_64 8.2102.0-101.el9_0.1 If the "rsyslog" package is not installed, this
    is a finding.'
