assessment:
  id: SV-257893.manual
  version: 1
  assessment_title: RHEL 9 /etc/gshadow file must have mode 0000 or less permissive to prevent unauthorized access.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that the "/etc/gshadow" file has mode "0000" with the following command: $ sudo stat -c "%a
    %n" /etc/gshadow 0 /etc/gshadow If a value of "0" is not returned, this is a finding.'
  inputs: []
  evidence: []
