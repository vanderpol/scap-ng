assessment:
  id: SV-257822.manual
  version: 1
  assessment_title: RHEL 9 must have GPG signature verification enabled for all software repositories.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify all software repositories defined in "/etc/yum.repos.d/" have been configured with "gpgcheck"
    enabled: $ grep -w gpgcheck /etc/yum.repos.d/*.repo | more /etc/yum.repos.d/redhat.repo:gpgcheck = 1 For all
    listed repos, if "gpgcheck" is not set to "1", or if the option is missing or commented out, ask the system
    administrator how the GPG signatures of local software packages are being verified. If there is no process to
    verify GPG signatures that is approved by the organization, this is a finding.'
  inputs: {}
  evidence: []
