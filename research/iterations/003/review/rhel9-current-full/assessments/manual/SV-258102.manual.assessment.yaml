assessment:
  id: SV-258102.manual
  version: 1
  assessment_title: RHEL 9 must enforce password complexity by requiring that at least one lowercase character be
    used.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 enforces password complexity by requiring at least one lowercase character. Check
    the value for "lcredit" with the following command: $ grep lcredit /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    /etc/security/pwquality.conf:lcredit = -1 If the value of "lcredit" is a positive number or is commented out,
    this is a finding.'
  inputs: {}
  evidence: []
