assessment:
  id: SV-258086.manual
  version: 1
  assessment_title: RHEL 9 must require users to reauthenticate for privilege escalation.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that "/etc/sudoers" has no occurrences of "!authenticate" with the following command: $ sudo
    egrep -iR ''!authenticate'' /etc/sudoers /etc/sudoers.d/ If any occurrences of "!authenticate" are returned,
    this is a finding.'
  inputs: []
  evidence: []
