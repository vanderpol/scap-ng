assessment:
  id: SV-257810.manual
  version: 1
  assessment_title: RHEL 9 must disable access to network bpf system call from nonprivileged processes.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 prevents privilege escalation through the kernel by disabling access to the bpf system
    call. Check the status of the "kernel.unprivileged_bpf_disabled" kernel parameter with the following command:
    $ sysctl kernel.unprivileged_bpf_disabled kernel.unprivileged_bpf_disabled = 1 If "kernel.unprivileged_bpf_disabled"
    is not set to "1", or is missing, this is a finding.'
  inputs: {}
  evidence: []
