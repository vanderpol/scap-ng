assessment:
  id: SV-258173.manual
  version: 1
  assessment_title: RHEL 9 must allocate an audit_backlog_limit of sufficient size to capture processes that start
    prior to the audit daemon.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 allocates a sufficient audit_backlog_limit to capture processes that start prior to
    the audit daemon with the following command: $ sudo grubby --info=ALL | grep args | grep ''audit_backlog_limit''
    If the command returns any outputs, and audit_backlog_limit is less than "8192", this is a finding.'
  inputs: {}
  evidence: []
