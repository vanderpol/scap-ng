assessment:
  id: SV-257969.manual
  version: 1
  assessment_title: RHEL 9 must not allow interfaces to perform Internet Control Message Protocol (ICMP) redirects
    by default.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Check the value of the "default send_redirects" variables with the following command: $ sudo sysctl
    net.ipv4.conf.default.send_redirects net.ipv4.conf.default.send_redirects=0 If "net.ipv4.conf.default.send_redirects"
    is not set to "0" and is not documented with the information system security officer (ISSO) as an operational
    requirement or is missing, this is a finding.'
  inputs: []
  evidence: []
