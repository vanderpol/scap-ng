assessment:
  id: SV-257937.manual
  version: 1
  assessment_title: The RHEL 9 firewall must employ a deny-all, allow-by-exception policy for allowing connections
    to other systems.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the RHEL 9 firewalld is configured to employ a deny-all, allow-by-exception policy for allowing
    connections to other systems with the following commands: Ensure firewalld is running: $ sudo firewall-cmd --state
    running Identify active zones: $ sudo firewall-cmd --get-active-zones drop interfaces: ens192 Check what rules
    are applied in that zone: $ sudo firewall-cmd --list-all --zone=$(firewall-cmd --get-default-zone) drop (active)
    target: DROP icmp-block-inversion: no interfaces: ens192 sources: services: ssh ports: protocols: forward: yes
    masquerade: no forward-ports: source-ports: icmp-blocks: rich rules: If no zones are active on the RHEL 9 interfaces
    or if runtime and permanent targets are set to a different option other than "DROP", this is a finding.'
  inputs: []
  evidence: []
