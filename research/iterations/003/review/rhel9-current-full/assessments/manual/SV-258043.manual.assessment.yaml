assessment:
  id: SV-258043.manual
  version: 1
  assessment_title: All RHEL 9 local interactive user accounts must be assigned a home directory upon creation.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify all local interactive users on RHEL 9 are assigned a home directory upon creation with the
    following command: $ grep -i create_home /etc/login.defs CREATE_HOME yes If the value for "CREATE_HOME" parameter
    is not set to "yes", the line is missing, or the line is commented out, this is a finding.'
  inputs: []
  evidence: []
