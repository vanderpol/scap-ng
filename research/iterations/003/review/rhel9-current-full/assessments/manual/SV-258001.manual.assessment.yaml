assessment:
  id: SV-258001.manual
  version: 1
  assessment_title: RHEL 9 SSH public host key files must have mode 0644 or less permissive.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the SSH public host key files have a mode of "0644" or less permissive with the following command:
    Note: SSH public key files may be found in other directories on the system depending on the installation. $
    sudo stat -c "%a %n" /etc/ssh/*.pub 644 /etc/ssh/ssh_host_dsa_key.pub 644 /etc/ssh/ssh_host_ecdsa_key.pub 644
    /etc/ssh/ssh_host_ed25519_key.pub 644 /etc/ssh/ssh_host_rsa_key.pub If any key.pub file has a mode more permissive
    than "0644", this is a finding.'
  inputs: []
  evidence: []
