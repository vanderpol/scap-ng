assessment:
  id: SV-258111.manual
  version: 1
  assessment_title: RHEL 9 must enforce password complexity by requiring that at least one uppercase character be
    used.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 enforces password complexity by requiring that at least one uppercase character
    be used. Check the value for "ucredit" with the following command: $ grep ucredit /etc/security/pwquality.conf
    /etc/security/pwquality.conf.d/*.conf ucredit = -1 If the value of "ucredit" is a positive number or is commented
    out, this is a finding.'
  inputs: {}
  evidence: []
