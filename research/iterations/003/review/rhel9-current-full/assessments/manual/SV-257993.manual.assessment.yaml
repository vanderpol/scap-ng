assessment:
  id: SV-257993.manual
  version: 1
  assessment_title: RHEL 9 must not allow users to override SSH environment variables.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that unattended or automatic logon via SSH is disabled with the following command: $ sudo /usr/sbin/sshd
    -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo grep -iH ''^\s*permituserenvironment''
    PermitUserEnvironment no If "PermitUserEnvironment" is set to "yes", is missing completely, or is commented
    out, this is a finding. If the required value is not set, this is a finding.'
  inputs: []
  evidence: []
