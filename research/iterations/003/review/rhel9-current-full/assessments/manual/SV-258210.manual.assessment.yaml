assessment:
  id: SV-258210.manual
  version: 1
  assessment_title: RHEL 9 must audit all uses of the mount command.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 is configured to audit the execution of the "mount" command with the following
    command: $ sudo auditctl -l | grep /usr/bin/mount -a always,exit -S all -F path=/usr/bin/mount -F perm=x -F
    auid>=1000 -F auid!=-1 -F key=privileged-mount If the command does not return a line, or the line is commented
    out, this is a finding.'
  inputs: {}
  evidence: []
