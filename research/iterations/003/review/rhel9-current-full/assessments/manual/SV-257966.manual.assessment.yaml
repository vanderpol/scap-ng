assessment:
  id: SV-257966.manual
  version: 1
  assessment_title: RHEL 9 must not respond to Internet Control Message Protocol (ICMP) echoes sent to a broadcast
    address.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 ignores ICMP echoes sent to a broadcast address. Check the value of the "icmp_echo_ignore_broadcasts"
    variable with the following command: $ sudo sysctl net.ipv4.icmp_echo_ignore_broadcasts net.ipv4.icmp_echo_ignore_broadcasts
    = 1 If "net.ipv4.icmp_echo_ignore_broadcasts" is not set to "1" or is missing, this is a finding.'
  inputs: []
  evidence: []
