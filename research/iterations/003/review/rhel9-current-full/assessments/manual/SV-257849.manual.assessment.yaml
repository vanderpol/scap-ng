assessment:
  id: SV-257849.manual
  version: 1
  assessment_title: RHEL 9 file system automount function must be disabled unless required.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: If the autofs service is not installed, this requirement is Not Applicable. Verify that the
    RHEL 9 file system automount function has been disabled with the following command: $ systemctl is-enabled autofs
    masked If the returned value is not "masked", "disabled", or "Failed to get unit file state for autofs.service
    for autofs" and is not documented as an operational requirement with the information system security officer
    (ISSO), this is a finding.'
  inputs: {}
  evidence: []
