assessment:
  id: SV-270175.manual
  version: 1
  assessment_title: RHEL 9 "/etc/audit/" must be owned by root.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the ownership of the "/etc/audit/" directory with the following command: $ sudo stat -c "%U
    %n" /etc/audit/ root /etc/audit/ If the "/etc/audit/" directory does not have an owner of "root", this is a
    finding.'
  inputs: {}
  evidence: []
