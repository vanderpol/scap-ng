assessment:
  id: SV-257848.manual
  version: 1
  assessment_title: RHEL 9 must use a separate file system for /var/tmp.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that a separate file system/partition has been created for "/var/tmp" with the following command:
    $ mount | grep /var/tmp /dev/mapper/rhel-tmp on /var/tmp type xfs (rw,nosuid,nodev,noexec,relatime,seclabel,attr2,inode64,logbufs=8,logbsize=32k)
    Note: Options displayed for mount may differ. If a separate entry for "/var/tmp" is not in use, this is a finding.'
  inputs: []
  evidence: []
