assessment:
  id: SV-258155.manual
  version: 1
  assessment_title: RHEL 9 must allocate audit record storage capacity to store at least one week's worth of audit
    records.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 allocates audit record storage capacity to store at least one week of audit records
    when audit records are not immediately sent to a central audit record storage facility. Note: The partition
    size needed to capture a week of audit records is based on the activity level of the system and the total storage
    capacity available. Typically 10.0GB of storage space for audit records should be sufficient. Determine which
    partition the audit records are being written to with the following command: $ sudo grep -w log_file /etc/audit/auditd.conf
    log_file = /var/log/audit/audit.log Check the size of the partition that audit records are written to with the
    following command and verify whether it is sufficiently large: # df -h /var/log/audit/ /dev/sda2 24G 10.4G 13.6G
    43% /var/log/audit If the audit record partition is not allocated for sufficient storage capacity, this is a
    finding.'
  inputs: []
  evidence: []
