assessment:
  id: SV-257858.manual
  version: 1
  assessment_title: RHEL 9 must prevent special devices on file systems that are used with removable media.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify file systems that are used for removable media are mounted with the "nodev" option with the
    following command: $ more /etc/fstab UUID=2bc871e4-e2a3-4f29-9ece-3be60c835222 /mnt/usbflash vfat noauto,owner,ro,nosuid,nodev,noexec
    0 0 If a file system found in "/etc/fstab" refers to removable media and it does not have the "nodev" option
    set, this is a finding.'
  inputs: []
  evidence: []
