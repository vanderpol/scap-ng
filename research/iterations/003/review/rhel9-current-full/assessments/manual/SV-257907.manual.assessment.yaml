assessment:
  id: SV-257907.manual
  version: 1
  assessment_title: RHEL 9 /etc/passwd file must be group-owned by root.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the group ownership of the "/etc/passwd" file with the following command: $ sudo stat -c "%G
    %n" /etc/passwd root /etc/passwd If "/etc/passwd" file does not have a group owner of "root", this is a finding.'
  inputs: {}
  evidence: []
