assessment:
  id: SV-257963.manual
  version: 1
  assessment_title: RHEL 9 must prevent IPv4 Internet Control Message Protocol (ICMP) redirect messages from being
    accepted.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 will not accept IPv4 ICMP redirect messages. Check the value of the default "accept_redirects"
    variable with the following command: $ sudo sysctl net.ipv4.conf.default.accept_redirects net.ipv4.conf.default.accept_redirects
    = 0 If "net.ipv4.conf.default.accept_redirects" is not set to "0" or is missing, this is a finding.'
  inputs: {}
  evidence: []
