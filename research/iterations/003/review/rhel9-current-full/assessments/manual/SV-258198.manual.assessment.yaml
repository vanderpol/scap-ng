assessment:
  id: SV-258198.manual
  version: 1
  assessment_title: RHEL 9 must audit all uses of the passwd command.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 generates audit records for all account creations, modifications, disabling, and termination
    events that affect "/etc/gshadow" with the following command: $ sudo auditctl -l | egrep ''(/usr/bin/passwd)''
    -a always,exit -S all -F path=/usr/bin/passwd -F perm=x -F auid>=1000 -F auid!=-1 -F key=privileged-passwd If
    the command does not return a line, or the line is commented out, this is a finding.'
  inputs: {}
  evidence: []
