assessment:
  id: SV-257977.manual
  version: 1
  assessment_title: RHEL 9 must not forward IPv6 source-routed packets by default.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 does not accept IPv6 source-routed packets by default. Note: If IPv6 is disabled on
    the system, this requirement is Not Applicable. Check the value of the "net.ipv6.conf.default.accept_source_route"
    variables with the following command: $ sudo sysctl net.ipv6.conf.default.accept_source_route net.ipv6.conf.default.accept_source_route
    = 0 If "net.ipv6.conf.default.accept_source_route" is not set to "0" or is missing, this is a finding.'
  inputs: []
  evidence: []
