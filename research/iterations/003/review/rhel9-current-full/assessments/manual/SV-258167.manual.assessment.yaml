assessment:
  id: SV-258167.manual
  version: 1
  assessment_title: RHEL 9 audit logs file must have mode 0600 or less permissive to prevent unauthorized access
    to the audit log.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the audit logs have a mode of "0600". Determine where the audit logs are stored with the following
    command: $ sudo grep "^log_file" /etc/audit/auditd.conf log_file = /var/log/audit/audit.log Using the location
    of the audit log file, determine the mode of each audit log with the following command: $ sudo find /var/log/audit/
    -type f -exec stat -c ''%a %n'' {} \; 600 /var/log/audit/audit.log If the audit logs have a mode more permissive
    than "0600", this is a finding.'
  inputs: []
  evidence: []
