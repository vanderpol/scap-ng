assessment:
  id: SV-258012.manual
  version: 1
  assessment_title: RHEL 9 must display the Standard Mandatory DOD Notice and Consent Banner before granting local
    or remote access to the system via a graphical user logon.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 displays the Standard Mandatory DOD Notice and Consent Banner before granting access
    to the operating system via a graphical user logon. Note: This requirement assumes the use of the RHEL 9 default
    graphical user interface, the GNOME desktop environment. If the system does not have any graphical user interface
    installed, this requirement is Not Applicable. Determine if the operating system displays a banner at the logon
    screen with the following command: $ gsettings get org.gnome.login-screen banner-message-enable true If the
    result is "false", this is a finding.'
  inputs: {}
  evidence: []
