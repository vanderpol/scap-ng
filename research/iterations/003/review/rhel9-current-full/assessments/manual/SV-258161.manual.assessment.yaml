assessment:
  id: SV-258161.manual
  version: 1
  assessment_title: RHEL 9 must label all offloaded audit logs before sending them to the central log server.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 Audit Daemon is configured to label all offloaded audit logs, with the following
    command: $ sudo grep name_format /etc/audit/auditd.conf name_format = hostname If the "name_format" option is
    not "hostname", "fqd", or "numeric", or the line is commented out, this is a finding.'
  inputs: []
  evidence: []
