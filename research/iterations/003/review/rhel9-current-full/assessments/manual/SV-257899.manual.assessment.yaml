assessment:
  id: SV-257899.manual
  version: 1
  assessment_title: RHEL 9 /etc/group file must be group-owned by root.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the group ownership of the "/etc/group" file with the following command: $ sudo stat -c "%G
    %n" /etc/group root /etc/group If "/etc/group" file does not have a group owner of "root", this is a finding.'
