assessment:
  id: SV-258027.manual
  version: 1
  assessment_title: RHEL 9 must conceal, via the session lock, information previously visible on the display with
    a publicly viewable image.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: This requirement assumes the use of the RHEL 9 default graphical user interface, the GNOME desktop
    environment. If the system does not have any graphical user interface installed, this requirement is Not Applicable.
    To ensure the screensaver is configured to be blank, run the following command: $ gsettings writable org.gnome.desktop.screensaver
    picture-uri false If "picture-uri" is writable and the result is "true", this is a finding.'
  inputs: {}
  evidence: []
