assessment:
  id: SV-270176.manual
  version: 1
  assessment_title: RHEL 9 "/etc/audit/" must be group-owned by root.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the group ownership of the "/etc/audit/" directory with the following command: $ sudo stat
    -c "%G %n" /etc/audit/ root /etc/audit/ If "/etc/audit/" does not have a group owner of "root", this is a finding.'
  inputs: []
  evidence: []
