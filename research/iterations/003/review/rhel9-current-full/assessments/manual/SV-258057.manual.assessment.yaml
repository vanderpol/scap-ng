assessment:
  id: SV-258057.manual
  version: 1
  assessment_title: RHEL 9 must maintain an account lock until the locked account is released by an administrator.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 is configured to lock an account until released by an administrator after three unsuccessful
    logon attempts with the command: $ sudo grep -w unlock_time /etc/security/faillock.conf unlock_time = 0 If the
    "unlock_time" option is not set to "0" or the line is missing or commented out, this is a finding.'
  inputs: {}
  evidence: []
