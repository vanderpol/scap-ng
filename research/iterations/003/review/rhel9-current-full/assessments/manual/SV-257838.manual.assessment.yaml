assessment:
  id: SV-257838.manual
  version: 1
  assessment_title: RHEL 9 must have the openssl-pkcs11 package installed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: If the system administrator demonstrates the use of an approved alternate multifactor authentication
    method, this requirement is Not Applicable. Verify that RHEL 9 has the openssl-pkcs11 package installed with
    the following command: $ dnf list --installed openssl-pkcs11 Example output: openssl-pkcs.i686 0.4.11-7.el9
    openssl-pkcs.x86_64 0.4.11-7.el9 If the "openssl-pkcs11" package is not installed, this is a finding.'
  inputs: []
  evidence: []
