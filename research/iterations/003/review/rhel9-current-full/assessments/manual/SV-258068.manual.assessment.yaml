assessment:
  id: SV-258068.manual
  version: 1
  assessment_title: RHEL 9 must automatically exit interactive command shell user sessions after 10 minutes of inactivity.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 is configured to exit interactive command shell user sessions after 10 minutes of inactivity
    or less with the following command: $ sudo grep -i tmout /etc/profile /etc/profile.d/*.sh /etc/profile.d/tmout.sh:declare
    -xr TMOUT=600 If "TMOUT" is not set to "600" or less in a script located in the "/etc/''profile.d/ directory,
    is missing or is commented out, this is a finding.'
  inputs: {}
  evidence: []
