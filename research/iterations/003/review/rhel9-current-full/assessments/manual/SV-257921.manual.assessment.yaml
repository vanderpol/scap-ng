assessment:
  id: SV-257921.manual
  version: 1
  assessment_title: RHEL 9 library files must be group-owned by root or a system account.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the systemwide shared library files contained in the directories "/lib", "/lib64", "/usr/lib",
    and "/usr/lib64" are group owned by root with the following command: $ sudo find /lib /lib64 /usr/lib /usr/lib64
    -type f -name ''*.so*'' ! -group root -exec stat -c "%n %G" {} + If any output is returned, this is a finding.'
  inputs: []
  evidence: []
