assessment:
  id: SV-258016.manual
  version: 1
  assessment_title: RHEL 9 must disable the graphical user interface autorun function unless required.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 disables the graphical user interface autorun function with the following command: Note:
    This requirement assumes the use of the RHEL 9 default graphical user interface, the GNOME desktop environment.
    If the system does not have any graphical user interface installed, this requirement is Not Applicable. $ gsettings
    get org.gnome.desktop.media-handling autorun-never true If "autorun-never" is set to "false", and is not documented
    with the information system security officer (ISSO) as an operational requirement, this is a finding.'
  inputs: {}
  evidence: []
