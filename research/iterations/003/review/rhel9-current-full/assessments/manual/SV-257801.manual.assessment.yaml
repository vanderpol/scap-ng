assessment:
  id: SV-257801.manual
  version: 1
  assessment_title: RHEL 9 must enable kernel parameters to enforce discretionary access control (DAC) on hardlinks.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 is configured to enable DAC on hardlinks. Check the status of the "fs.protected_hardlinks"
    kernel parameter with the following command: $ sudo sysctl fs.protected_hardlinks fs.protected_hardlinks = 1
    If "fs.protected_hardlinks" is not set to "1" or is missing, this is a finding.'
  inputs: {}
  evidence: []
