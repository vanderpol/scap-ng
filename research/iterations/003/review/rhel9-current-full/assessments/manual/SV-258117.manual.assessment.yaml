assessment:
  id: SV-258117.manual
  version: 1
  assessment_title: RHEL 9 must be configured to use the shadow file to store only encrypted representations of
    passwords.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the system''s shadow file is configured to store only encrypted representations of passwords
    with a hash value of SHA512 with the following command: # grep -i encrypt_method /etc/login.defs ENCRYPT_METHOD
    SHA512 If "ENCRYPT_METHOD" does not have a value of "SHA512", or the line is commented out, this is a finding.'
  inputs: []
  evidence: []
