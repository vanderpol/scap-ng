assessment:
  id: SV-257873.manual
  version: 1
  assessment_title: RHEL 9 must mount /var/log/audit with the nodev option.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify "/var/log/audit" is mounted with the "nodev" option: $ mount | grep /var/log/audit /dev/mapper/rhel-var-log-audit
    on /var/log/audit type xfs (rw,nodev,nosuid,noexec,seclabel) If the "/var/log/audit" file system is mounted
    without the "nodev" option, this is a finding.'
  inputs: []
  evidence: []
