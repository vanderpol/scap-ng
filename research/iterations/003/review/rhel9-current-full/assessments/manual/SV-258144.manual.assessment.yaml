assessment:
  id: SV-258144.manual
  version: 1
  assessment_title: All RHEL 9 remote access methods must be monitored.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 monitors all remote access methods. Check that remote access methods are being
    logged by running the following command: $ grep -rE ''(auth.\*|authpriv.\*|daemon.\*)'' /etc/rsyslog.conf /etc/rsyslog.d/
    /etc/rsyslog.conf:authpriv.* If "auth.*", "authpriv.*" or "daemon.*" are not configured to be logged, this is
    a finding.'
  inputs: []
  evidence: []
