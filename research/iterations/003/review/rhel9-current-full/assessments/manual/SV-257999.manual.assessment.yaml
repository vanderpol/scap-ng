assessment:
  id: SV-257999.manual
  version: 1
  assessment_title: RHEL 9 SSH server configuration files' permissions must not be modified.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the permissions of the "/etc/ssh/sshd_config" file with the following command: $ sudo rpm --verify
    openssh-server | awk ''! ($2 == "c" && $1 ~ /^.\..\.\.\.\..\./) {print $0}'' If the command returns any output,
    this is a finding.'
  inputs: []
  evidence: []
