assessment:
  id: SV-257978.manual
  version: 1
  assessment_title: All RHEL 9 networked systems must have SSH installed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 has the openssh-server package installed with the following command: $ dnf list
    --installed openssh-server Example output: openssh-server.x86_64 8.7p1-8.el9 If the "openssh-server" package
    is not installed, this is a finding.'
  inputs: []
  evidence: []
