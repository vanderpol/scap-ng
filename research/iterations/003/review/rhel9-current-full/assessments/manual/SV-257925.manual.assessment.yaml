assessment:
  id: SV-257925.manual
  version: 1
  assessment_title: RHEL 9 audit tools must be group-owned by root.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the audit tools are group owned by "root" with the following command: $ sudo stat -c "%G %n"
    /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /sbin/rsyslogd /sbin/augenrules root
    /sbin/auditctl root /sbin/aureport root /sbin/ausearch root /sbin/autrace root /sbin/auditd root /sbin/rsyslogd
    root /sbin/augenrules If any audit tools do not have a group owner of "root", this is a finding.'
  inputs: []
  evidence: []
