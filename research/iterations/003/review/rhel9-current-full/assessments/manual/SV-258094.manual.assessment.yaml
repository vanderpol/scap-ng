assessment:
  id: SV-258094.manual
  version: 1
  assessment_title: RHEL 9 must not allow blank or null passwords.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that null passwords cannot be used with the following command: $ sudo grep -i nullok /etc/pam.d/system-auth
    /etc/pam.d/password-auth If output is produced, this is a finding. If the system administrator (SA) can demonstrate
    that the required configuration is contained in a PAM configuration file included or substacked from the system-auth
    file, this is not a finding.'
  inputs: []
  evidence: []
