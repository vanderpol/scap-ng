assessment:
  id: SV-257812.manual
  version: 1
  assessment_title: RHEL 9 must disable core dump backtraces.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: If kernel dumps are disabled in accordance with RHEL-09-213040, this requirement is not applicable.
    Verify RHEL 9 disables core dump backtraces by issuing the following command: $ grep -i ProcessSizeMax /etc/systemd/coredump.conf
    ProcessSizeMax=0 If the "ProcessSizeMax" item is missing or commented out, or the value is anything other than
    "0", and the need for core dumps is not documented with the information system security officer (ISSO) as an
    operational requirement for all domains that have the "core" item assigned, this is a finding.'
  inputs: []
  evidence: []
