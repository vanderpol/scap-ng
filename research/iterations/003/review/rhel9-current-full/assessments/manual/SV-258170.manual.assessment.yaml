assessment:
  id: SV-258170.manual
  version: 1
  assessment_title: RHEL 9 must write audit records to disk.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that the audit system is configured to write logs to the disk with the following command: $
    sudo grep write_logs /etc/audit/auditd.conf write_logs = yes If "write_logs" does not have a value of "yes",
    the line is commented out, or the line is missing, this is a finding.'
  inputs: []
  evidence: []
