assessment:
  id: SV-257816.manual
  version: 1
  assessment_title: RHEL 9 must disable the use of user namespaces.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 disables the use of user namespaces. Check the status of the "user.max_user_namespaces"
    parameter with the following command: $ sudo sysctl user.max_user_namespaces user.max_user_namespaces = 0 If
    "user.max_user_namespaces" is not set to "0" or is missing, this is a finding. If the use of namespaces is operationally
    required and documented with the information system security manager (ISSM), it is not a finding.'
  inputs: []
  evidence: []
