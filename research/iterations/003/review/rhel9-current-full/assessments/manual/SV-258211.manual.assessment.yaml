assessment:
  id: SV-258211.manual
  version: 1
  assessment_title: Successful/unsuccessful uses of the init command in RHEL 9 must generate an audit record.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 is configured to audit the execution of the "init" command with the following command:
    $ sudo auditctl -l | grep /usr/sbin/init -a always,exit -S all -F path=/usr/sbin/init -F perm=x -F auid>=1000
    -F auid!=-1 -F key=privileged-init If the command does not return a line, or the line is commented out, this
    is a finding.'
  inputs: {}
  evidence: []
