assessment:
  id: SV-258059.manual
  version: 1
  assessment_title: The root account must be the only account having unrestricted access to RHEL 9 system.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that only the "root" account has a UID "0" assignment with the following command: $ awk -F:
    ''$3 == 0 {print $1}'' /etc/passwd root If any accounts other than "root" have a UID of "0", this is a finding.'
  inputs: []
  evidence: []
