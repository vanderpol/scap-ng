assessment:
  id: SV-258203.manual
  version: 1
  assessment_title: RHEL 9 must audit all uses of the su command.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 is configured to audit the execution of the "su" command with the following command:
    $ sudo auditctl -l | grep ''/usr/bin/su\b'' -a always,exit -S all -F path=/usr/bin/su -F perm=x -F auid>=1000
    -F auid!=-1 -F key=privileged-priv_change If the command does not return a line, or the line is commented out,
    this is a finding.'
  inputs: {}
  evidence: []
