assessment:
  id: SV-258031.manual
  version: 1
  assessment_title: RHEL 9 must disable the ability of a user to accidentally press Ctrl-Alt-Del and cause a system
    to shut down or reboot.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 is configured to ignore the Ctrl-Alt-Del sequence in the GNOME desktop with the following
    command: Note: This requirement assumes the use of the RHEL 9 default graphical user interface, the GNOME desktop
    environment. If the system does not have any graphical user interface installed, this requirement is not applicable.
    $ gsettings get org.gnome.settings-daemon.plugins.media-keys logout [''''] If the GNOME desktop is configured
    to shut down when Ctrl-Alt-Del is pressed, this is a finding.'
  inputs: []
  evidence: []
