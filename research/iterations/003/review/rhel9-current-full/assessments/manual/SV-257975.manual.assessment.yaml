assessment:
  id: SV-257975.manual
  version: 1
  assessment_title: RHEL 9 must not accept router advertisements on all IPv6 interfaces by default.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 does not accept router advertisements on all IPv6 interfaces by default, unless the
    system is a router. Note: If IPv6 is disabled on the system, this requirement is Not Applicable. Check the value
    of the "net.ipv6.conf.default.accept_ra" variable with the following command: $ sudo sysctl net.ipv6.conf.default.accept_ra
    net.ipv6.conf.default.accept_ra = 0 If "net.ipv6.conf.default.accept_ra" is not set to "0" or is missing, this
    is a finding.'
  inputs: {}
  evidence: []
