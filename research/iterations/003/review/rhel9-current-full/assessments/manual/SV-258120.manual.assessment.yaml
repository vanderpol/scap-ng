assessment:
  id: SV-258120.manual
  version: 1
  assessment_title: RHEL 9 must not have accounts configured with blank or null passwords.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that null or blank passwords cannot be used with the following command: $ sudo awk -F: ''!$2
    {print $1}'' /etc/shadow If the command returns any results, this is a finding.'
  inputs: []
  evidence: []
