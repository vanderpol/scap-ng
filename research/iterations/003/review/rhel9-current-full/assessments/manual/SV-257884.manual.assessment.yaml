assessment:
  id: SV-257884.manual
  version: 1
  assessment_title: RHEL 9 library files must have mode 755 or less permissive.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the systemwide shared library files contained in the directories "/lib", "/lib64", "/usr/lib",
    and "/usr/lib64" have mode 0755 or less permissive. Check that the systemwide shared library files have mode
    0755 or less permissive with the following command: $ sudo find /lib /lib64 /usr/lib /usr/lib64 -type f -name
    ''*.so*'' -perm /022 -exec stat -c "%n %a" {} + If any output is returned, this is a finding.'
  inputs: {}
  evidence: []
