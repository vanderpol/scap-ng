assessment:
  id: SV-258148.manual
  version: 1
  assessment_title: RHEL 9 must encrypt via the gtls driver the transfer of audit records offloaded onto a different
    system or media from the system being audited via rsyslog.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 uses the gtls driver to encrypt audit records offloaded onto a different system or media
    from the system being audited with the following command: $ grep -Ei ''DefaultNetStreamDriver\b|StreamDriver.Name''
    /etc/rsyslog.conf /etc/rsyslog.d/*.conf /etc/rsyslog.conf:$DefaultNetstreamDriver gtls If the value of the "$DefaultNetstreamDriver
    or StreamDriver" option is not set to "gtls" or the line is commented out, this is a finding. If the variable
    name "StreamDriver" is present in an omfwd statement block, this is not a finding. However, if the "StreamDriver"
    variable is in a module block, this is a finding.'
  inputs: {}
  evidence: []
