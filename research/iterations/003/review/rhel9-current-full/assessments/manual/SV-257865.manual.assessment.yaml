assessment:
  id: SV-257865.manual
  version: 1
  assessment_title: RHEL 9 must mount /dev/shm with the nosuid option.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify "/dev/shm" is mounted with the "nosuid" option with the following command: $ findmnt /dev/shm
    /dev/shm tmpfs tmpfs rw,nodev,nosuid,noexec,seclabel If the mount options for /dev/shm does not include nosuid,
    this is a finding.'
  inputs: {}
  evidence: []
