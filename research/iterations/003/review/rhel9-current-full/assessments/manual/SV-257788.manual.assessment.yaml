assessment:
  id: SV-257788.manual
  version: 1
  assessment_title: RHEL 9 must disable the ability of systemd to spawn an interactive boot process.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that GRUB 2 is configured to disable interactive boot. Check that the current GRUB 2 configuration
    disables the ability of systemd to spawn an interactive boot process with the following command: $ sudo grubby
    --info=ALL | grep args | grep ''systemd.confirm_spawn'' If any output is returned, this is a finding.'
  inputs: {}
  evidence: []
