assessment:
  id: SV-257785.manual
  version: 1
  assessment_title: The x86 Ctrl-Alt-Delete key sequence must be disabled on RHEL 9.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 is not configured to reboot the system when Ctrl-Alt-Delete is pressed with the following
    command: $ sudo systemctl status ctrl-alt-del.target ctrl-alt-del.target Loaded: masked (Reason: Unit ctrl-alt-del.target
    is masked.) Active: inactive (dead) If the "ctrl-alt-del.target" is loaded and not masked, this is a finding.'
  inputs: {}
  evidence: []
