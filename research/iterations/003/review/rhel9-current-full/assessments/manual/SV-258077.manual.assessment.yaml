assessment:
  id: SV-258077.manual
  version: 1
  assessment_title: RHEL 9 must terminate idle user sessions.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 logs out sessions that are idle for 10 minutes with the following command: $ systemd-analyze
    cat-config systemd/logind.conf | grep StopIdleSessionSec #StopIdleSessionSec=infinity StopIdleSessionSec=600
    If "StopIdleSessionSec" is not configured to "600" seconds, this is a finding.'
  inputs: []
  evidence: []
