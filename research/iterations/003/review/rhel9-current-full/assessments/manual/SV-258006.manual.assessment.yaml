assessment:
  id: SV-258006.manual
  version: 1
  assessment_title: RHEL 9 SSH daemon must not allow known hosts authentication.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the SSH daemon does not allow known hosts authentication with the following command: $ sudo
    /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo grep -iH
    ''^\s*ignoreuserknownhosts'' IgnoreUserKnownHosts yes If the value is returned as "no", the returned line is
    commented out, or no output is returned, this is a finding.'
  inputs: {}
  evidence: []
