assessment:
  id: SV-257992.manual
  version: 1
  assessment_title: RHEL 9 must not allow a noncertificate trusted host SSH logon to the system.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system does not allow a noncertificate trusted host SSH logon to the system with
    the following command: $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n''
    '' '' | xargs sudo grep -iH ''^\s*hostbasedauthentication'' HostbasedAuthentication no If the "HostbasedAuthentication"
    keyword is not set to "no", is missing, or is commented out, this is a finding. If the required value is not
    set, this is a finding.'
  inputs: []
  evidence: []
