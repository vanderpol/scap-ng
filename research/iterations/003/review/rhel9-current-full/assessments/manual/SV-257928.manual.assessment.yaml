assessment:
  id: SV-257928.manual
  version: 1
  assessment_title: All RHEL 9 world-writable directories must be owned by root, sys, bin, or an application user.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 world writable directories are owned by root, a system account, or an application account
    with the following command: $ sudo find / -xdev -type d -perm -0002 -uid +999 -exec stat -c "%U, %u, %A, %n"
    {} \; 2>/dev/null If there is output that indicates world-writable directories are owned by any account other
    than root or an approved system account, this is a finding.'
  inputs: {}
  evidence: []
