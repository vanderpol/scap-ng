assessment:
  id: SV-258121.manual
  version: 1
  assessment_title: RHEL 9 must use the common access card (CAC) smart card driver.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL loads the CAC driver with the following command: $ sudo opensc-tool --get-conf-entry app:default:card_drivers
    cac If "cac" is not listed as a card driver, or no line is returned for "card_drivers", this is a finding.'
