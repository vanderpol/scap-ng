assessment:
  id: SV-257916.manual
  version: 1
  assessment_title: RHEL 9 /var/log/messages file must be owned by root.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the "/var/log/messages" file is owned by root with the following command: $ stat -c "%U %n"
    /var/log/messages root /var/log/messages If "/var/log/messages" does not have an owner of "root", this is a
    finding.'
  inputs: []
  evidence: []
