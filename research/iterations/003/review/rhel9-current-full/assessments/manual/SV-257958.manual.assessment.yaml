assessment:
  id: SV-257958.manual
  version: 1
  assessment_title: RHEL 9 must ignore Internet Protocol version 4 (IPv4) Internet Control Message Protocol (ICMP)
    redirect messages.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 will not accept IPv4 ICMP redirect messages. Check the value of all "net.ipv4.conf.all.accept_redirects"
    variables with the following command: $ sudo sysctl net.ipv4.conf.all.accept_redirects net.ipv4.conf.all.accept_redirects
    = 0 If "net.ipv4.conf.all.accept_redirects" is not set to "0" or is missing, this is a finding.'
  inputs: []
  evidence: []
