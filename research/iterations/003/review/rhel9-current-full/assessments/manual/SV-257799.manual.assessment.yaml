assessment:
  id: SV-257799.manual
  version: 1
  assessment_title: RHEL 9 must prevent the loading of a new kernel for later execution.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 is configured to disable kernel image loading. Check the status of the "kernel.kexec_load_disabled"
    kernel parameter with the following command: $ sudo sysctl kernel.kexec_load_disabled kernel.kexec_load_disabled
    = 1 If "kernel.kexec_load_disabled" is not set to "1" or is missing, this is a finding.'
  inputs: {}
  evidence: []
