assessment:
  id: SV-257887.manual
  version: 1
  assessment_title: RHEL 9 audit tools must have a mode of 0755 or less permissive.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the audit tools have a mode of "0755" or less with the following command: $ stat -c "%a %n"
    /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /sbin/rsyslogd /sbin/augenrules 755
    /sbin/auditctl 755 /sbin/aureport 755 /sbin/ausearch 750 /sbin/autrace 755 /sbin/auditd 755 /sbin/rsyslogd 755
    /sbin/augenrules If any of the audit tool files have a mode more permissive than "0755", this is a finding.'
  inputs: []
  evidence: []
