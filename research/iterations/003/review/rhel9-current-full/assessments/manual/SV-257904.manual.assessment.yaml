assessment:
  id: SV-257904.manual
  version: 1
  assessment_title: RHEL 9 /etc/gshadow- file must be owned by root.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the ownership of the "/etc/gshadow-" file with the following command: $ sudo stat -c "%U %n"
    /etc/gshadow- root /etc/gshadow- If "/etc/gshadow-" file does not have an owner of "root", this is a finding.'
