assessment:
  id: SV-257917.manual
  version: 1
  assessment_title: RHEL 9 /var/log/messages file must be group-owned by root.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the "/var/log/messages" file is group-owned by root with the following command: $ stat -c "%G
    %n" /var/log/messages root /var/log/messages If "/var/log/messages" does not have a group owner of "root", this
    is a finding.'
  inputs: []
  evidence: []
