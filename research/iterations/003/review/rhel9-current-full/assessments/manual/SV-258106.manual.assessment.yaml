assessment:
  id: SV-258106.manual
  version: 1
  assessment_title: RHEL 9 must require users to provide a password for privilege escalation.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that "/etc/sudoers" has no occurrences of "NOPASSWD" with the following command: $ sudo grep
    -iR ''NOPASSWD'' /etc/sudoers /etc/sudoers.d/ If any occurrences of "NOPASSWD" are returned from the command
    and have not been documented with the information system security officer (ISSO) as an organizationally defined
    administrative group using multifactor authentication (MFA), this is a finding.'
  inputs: []
  evidence: []
