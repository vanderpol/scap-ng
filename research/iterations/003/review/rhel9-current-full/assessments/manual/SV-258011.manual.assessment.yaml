assessment:
  id: SV-258011.manual
  version: 1
  assessment_title: RHEL 9 SSH daemon must prevent remote hosts from connecting to the proxy display.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the SSH daemon prevents remote hosts from connecting to the proxy display with the following
    command: $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs
    sudo grep -iH ''^\s*x11uselocalhost'' X11UseLocalhost yes If the "X11UseLocalhost" keyword is set to "no", is
    missing, or is commented out, this is a finding.'
  inputs: []
  evidence: []
