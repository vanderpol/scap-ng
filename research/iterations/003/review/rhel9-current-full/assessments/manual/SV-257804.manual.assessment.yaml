assessment:
  id: SV-257804.manual
  version: 1
  assessment_title: RHEL 9 must be configured to disable the Asynchronous Transfer Mode kernel module.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 disables the ability to load the ATM kernel module with the following command:
    $ grep -r atm /etc/modprobe.conf /etc/modprobe.d/* install atm /bin/false blacklist atm If the command does
    not return any output, or the line is commented out, and use of ATM is not documented with the information system
    security officer (ISSO) as an operational requirement, this is a finding.'
  inputs: {}
  evidence: []
