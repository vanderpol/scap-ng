assessment:
  id: SV-258041.manual
  version: 1
  assessment_title: RHEL 9 user account passwords for new users or password changes must have a 60-day maximum password
    lifetime restriction in /etc/login.defs.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 enforces a 60-day maximum password lifetime for new user accounts by running the
    following command: $ grep -i pass_max_days /etc/login.defs PASS_MAX_DAYS 60 If the "PASS_MAX_DAYS" parameter
    value is greater than "60", or commented out, this is a finding.'
  inputs: []
  evidence: []
