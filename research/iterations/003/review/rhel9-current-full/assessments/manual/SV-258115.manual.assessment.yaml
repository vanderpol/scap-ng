assessment:
  id: SV-258115.manual
  version: 1
  assessment_title: RHEL 9 must require the change of at least four character classes when passwords are changed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify that RHEL 9 requires passwords to contain at least four character classes. $ grep minclass /etc/security/pwquality.conf
    /etc/security/pwquality.conf.d/*.conf minclass = 4 If the value of "minclass" is set to less than "4", or is
    commented out, this is a finding.
  inputs: {}
  evidence: []
