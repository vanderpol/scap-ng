assessment:
  id: SV-257895.manual
  version: 1
  assessment_title: RHEL 9 /etc/passwd file must have mode 0644 or less permissive to prevent unauthorized access.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that the "/etc/passwd" file has mode "0644" or less permissive with the following command:
    $ sudo stat -c "%a %n" /etc/passwd 644 /etc/passwd If a value of "0644" or less permissive is not returned,
    this is a finding.'
  inputs: {}
  evidence: []
