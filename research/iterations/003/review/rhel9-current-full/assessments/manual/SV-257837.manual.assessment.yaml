assessment:
  id: SV-257837.manual
  version: 1
  assessment_title: A graphical display manager must not be installed on RHEL 9 unless approved.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that a graphical user interface is not installed with the following command: $ dnf list --installed
    "xorg-x11-server-common" Error: No matching Packages to list If the "xorg-x11-server-common" package is installed,
    and the use of a graphical user interface has not been documented with the information system security officer
    (ISSO) as an operational requirement, this is a finding.'
  inputs: {}
  evidence: []
