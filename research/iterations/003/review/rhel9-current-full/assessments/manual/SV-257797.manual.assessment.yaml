assessment:
  id: SV-257797.manual
  version: 1
  assessment_title: RHEL 9 must restrict access to the kernel message buffer.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 is configured to restrict access to the kernel message buffer. Check the status of the
    "kernel.dmesg_restrict" kernel parameter with the following command: $ sudo sysctl kernel.dmesg_restrict kernel.dmesg_restrict
    = 1 If "kernel.dmesg_restrict" is not set to "1" or is missing, this is a finding.'
  inputs: []
  evidence: []
