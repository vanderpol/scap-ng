assessment:
  id: SV-258097.manual
  version: 1
  assessment_title: RHEL 9 must ensure the password complexity module is enabled in the password-auth file.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 uses "pwquality" to enforce the password complexity rules in the password-auth file
    with the following command: $ grep pam_pwquality /etc/pam.d/password-auth password required pam_pwquality.so
    If the command does not return a line containing the value "pam_pwquality.so", or the line is commented out,
    this is a finding. If the system administrator (SA) can demonstrate that the required configuration is contained
    in a PAM configuration file included or substacked from the system-auth file, this is not a finding.'
  inputs: []
  evidence: []
