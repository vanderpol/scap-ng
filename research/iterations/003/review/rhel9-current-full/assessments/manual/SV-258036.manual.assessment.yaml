assessment:
  id: SV-258036.manual
  version: 1
  assessment_title: RHEL 9 must have the USBGuard package enabled.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 has USBGuard enabled with the following command: $ systemctl is-active usbguard active
    If usbguard is not active, ask the SA to indicate how unauthorized peripherals are being blocked. If there is
    no evidence that unauthorized peripherals are being blocked before establishing a connection, this is a finding.
    If the system is virtual machine with no virtual or physical USB peripherals attached, this is not a finding.'
  inputs: {}
  evidence: []
