assessment:
  id: SV-258113.manual
  version: 1
  assessment_title: RHEL 9 must require the maximum number of repeating characters of the same character class be
    limited to four when passwords are changed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify that RHEL 9 requires that passwords can have a maximum of four repeating characters of the same
    character class. $ grep maxclassrepeat /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf maxclassrepeat
    = 4 If the value of "maxclassrepeat" is set to "0", more than "4", or is commented out, this is a finding.
  inputs: {}
  evidence: []
