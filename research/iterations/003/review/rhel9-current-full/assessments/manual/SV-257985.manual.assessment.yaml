assessment:
  id: SV-257985.manual
  version: 1
  assessment_title: RHEL 9 must not permit direct logons to the root account using remote access via SSH.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 remote access using SSH prevents users from logging on directly as "root" with the following
    command: $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs
    sudo grep -iH ''^\s*permitrootlogin'' PermitRootLogin no If the "PermitRootLogin" keyword is set to any value
    other than "no", is missing, or is commented out, this is a finding.'
  inputs: []
  evidence: []
