assessment:
  id: SV-257919.manual
  version: 1
  assessment_title: RHEL 9 system commands must be group-owned by root or a system account.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the system commands contained in the following directories are group-owned by "root", or a
    required system account, with the following command: $ sudo find -L /bin /sbin /usr/bin /usr/sbin /usr/libexec
    /usr/local/bin /usr/local/sbin ! -group root -exec stat -L -c "%G %n" {} \; If any system commands are returned
    and are not group-owned by a required system account, this is a finding.'
  inputs: {}
  evidence: []
