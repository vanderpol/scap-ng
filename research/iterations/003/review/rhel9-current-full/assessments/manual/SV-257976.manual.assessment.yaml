assessment:
  id: SV-257976.manual
  version: 1
  assessment_title: RHEL 9 must prevent IPv6 Internet Control Message Protocol (ICMP) redirect messages from being
    accepted.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 to prevent IPv6 ICMP redirect messages. Note: If IPv6 is disabled on the system, this
    requirement is Not Applicable. Check the value of the "net.ipv6.conf.default.accept_redirects" variables with
    the following command: $ sudo sysctl net.ipv6.conf.default.accept_redirects net.ipv6.conf.default.accept_redirects
    = 0 If "net.ipv6.conf.default.accept_redirects" is not set to "0" or is missing, this is a finding.'
  inputs: {}
  evidence: []
