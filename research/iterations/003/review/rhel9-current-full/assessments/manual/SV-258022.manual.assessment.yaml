assessment:
  id: SV-258022.manual
  version: 1
  assessment_title: RHEL 9 must prevent a user from overriding the screensaver lock-enabled setting for the graphical
    user interface.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: This requirement assumes the use of the RHEL 9 default graphical user interface, Gnome Shell.
    If the system does not have any graphical user interface installed, this requirement is Not Applicable. Verify
    RHEL 9 prevents a user from overriding settings for graphical user interfaces. $ gsettings writable org.gnome.desktop.screensaver
    lock-enabled false If "lock-enabled" is writable and the result is "true", this is a finding.'
  inputs: []
  evidence: []
