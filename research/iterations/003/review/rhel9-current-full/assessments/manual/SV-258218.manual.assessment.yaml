assessment:
  id: SV-258218.manual
  version: 1
  assessment_title: RHEL 9 must generate audit records for all account creations, modifications, disabling, and
    termination events that affect /etc/sudoers.d/directory.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 generates audit records for all account creations, modifications, disabling, and termination
    events that affect "/etc/sudoers.d/" with the following command: $ sudo auditctl -l | grep /etc/sudoers.d -a
    always,exit -F arch=b32 -F path=/etc/sudoers.d -F perm=wa -k identity -a always,exit -F arch=b64 -F path=/etc/sudoers.d
    -F perm=wa -k identity If the command does not return a line, or the line is commented out, this is a finding.'
  inputs: []
  evidence: []
