assessment:
  id: SV-258135.manual
  version: 1
  assessment_title: RHEL 9 must routinely check the baseline configuration for unauthorized changes and notify the
    system administrator when anomalies in the operation of any security functions are discovered.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 routinely executes a file integrity scan for changes to the system baseline. The
    command used in the example will use a daily occurrence. Check the cron directories for scripts controlling
    the execution and notification of results of the file integrity application. For example, if AIDE is installed
    on the system, use the following commands: $ sudo ls -al /etc/cron.* | grep aide -rwxr-xr-x 1 root root 29 Nov
    22 2015 aide $ sudo grep aide /etc/crontab /var/spool/cron/root /etc/crontab: 30 04 * * * root usr/sbin/aide
    /var/spool/cron/root: 30 04 * * * root usr/sbin/aide $ sudo more /etc/cron.daily/aide #!/bin/bash /usr/sbin/aide
    --check | /bin/mail -s "$HOSTNAME - Daily aide integrity check run" root@sysname.mil If the file integrity application
    does not exist, a script file controlling the execution of the file integrity application does not exist, or
    the file integrity application does not notify designated personnel of changes, this is a finding.'
  inputs: []
  evidence: []
