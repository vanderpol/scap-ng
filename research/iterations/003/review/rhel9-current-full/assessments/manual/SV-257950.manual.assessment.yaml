assessment:
  id: SV-257950.manual
  version: 1
  assessment_title: RHEL 9 must not have unauthorized IP tunnels configured.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 does not have unauthorized IP tunnels configured. Determine if the "IPsec" service
    is active with the following command: $ systemctl is-active ipsec Inactive If the "IPsec" service is active,
    check for configured IPsec connections ("conn"), with the following command: $ sudo grep -rni conn /etc/ipsec.conf
    /etc/ipsec.d/ Verify any returned results are documented with the ISSO. If the IPsec tunnels are active and
    not approved, this is a finding.'
  inputs: []
  evidence: []
