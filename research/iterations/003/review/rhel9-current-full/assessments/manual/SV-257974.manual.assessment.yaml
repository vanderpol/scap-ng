assessment:
  id: SV-257974.manual
  version: 1
  assessment_title: RHEL 9 must not enable IPv6 packet forwarding unless the system is a router.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 is not performing IPv6 packet forwarding, unless the system is a router. Note: If IPv6
    is disabled on the system, this requirement is Not Applicable. Check the value of the "net.ipv6.conf.all.forwarding"
    variable with the following command: $ sudo sysctl net.ipv6.conf.all.forwarding net.ipv6.conf.all.forwarding
    = 0 If "net.ipv6.conf.all.forwarding" is not set to "0" or is missing, this is a finding.'
  inputs: []
  evidence: []
