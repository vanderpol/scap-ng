assessment:
  id: SV-257968.manual
  version: 1
  assessment_title: RHEL 9 must not send Internet Control Message Protocol (ICMP) redirects.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 does not IPv4 ICMP redirect messages. Check the value of the "all send_redirects" variables
    with the following command: $ sudo sysctl net.ipv4.conf.all.send_redirects net.ipv4.conf.all.send_redirects
    = 0 If "net.ipv4.conf.all.send_redirects" is not set to "0" and is not documented with the information system
    security officer (ISSO) as an operational requirement or is missing, this is a finding.'
  inputs: []
  evidence: []
