assessment:
  id: SV-257808.manual
  version: 1
  assessment_title: RHEL 9 must disable the Transparent Inter Process Communication (TIPC) kernel module.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 disables the ability to load the tipc kernel module with the following command:
    $ grep -r tipc /etc/modprobe.conf /etc/modprobe.d/* install tipc /bin/false blacklist tipc If the command does
    not return any output, or the lines are commented out, and use of tipc is not documented with the information
    system security officer (ISSO) as an operational requirement, this is a finding.'
  inputs: []
  evidence: []
