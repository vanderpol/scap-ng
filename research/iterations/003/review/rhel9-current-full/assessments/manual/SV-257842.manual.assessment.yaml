assessment:
  id: SV-257842.manual
  version: 1
  assessment_title: RHEL 9 must have the s-nail package installed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 is configured to allow sending email notifications. Note: The "s-nail" package
    provides the "mail" command that is used to send email messages. Verify that the "s-nail" package is installed
    on the system: $ dnf list --installed s-nail s-nail.x86_64 14.9.22-6.el9 If "s-nail" package is not installed,
    this is a finding.'
  inputs: {}
  evidence: []
