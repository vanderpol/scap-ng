assessment:
  id: SV-258105.manual
  version: 1
  assessment_title: RHEL 9 passwords must have a 24 hours minimum password lifetime restriction in /etc/shadow.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 has configured the minimum time period between password changes for each user account
    as one day or greater with the following command: $ sudo awk -F: ''$4 < 1 {printf "%s %d\n", $1, $4}'' /etc/shadow
    If any results are returned that are not associated with a system account, this is a finding.'
  inputs: []
  evidence: []
