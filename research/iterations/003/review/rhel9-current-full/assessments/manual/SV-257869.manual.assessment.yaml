assessment:
  id: SV-257869.manual
  version: 1
  assessment_title: RHEL 9 must mount /var with the nodev option.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify "/var" is mounted with the "nodev" option: $ mount | grep /var /dev/mapper/rhel-var on /var
    type xfs (rw,nodev,nosuid,noexec,seclabel) If the "/var" file system is mounted without the "nodev" option,
    this is a finding.'
  inputs: {}
  evidence: []
