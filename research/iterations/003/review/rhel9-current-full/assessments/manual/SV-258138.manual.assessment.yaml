assessment:
  id: SV-258138.manual
  version: 1
  assessment_title: RHEL 9 must be configured so that the file integrity tool verifies Access Control Lists (ACLs).
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that AIDE is verifying ACLs with the following command: $ sudo grep acl /etc/aide.conf All=
    p+i+n+u+g+s+m+S+sha512+acl+xattrs+selinux If the "acl" rule is not being used on all uncommented selection lines
    in the "/etc/aide.conf" file, or ACLs are not being checked by another file integrity tool, this is a finding.'
  inputs: {}
  evidence: []
