assessment:
  id: SV-257845.manual
  version: 1
  assessment_title: RHEL 9 must use a separate file system for /var.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that a separate file system/partition has been created for "/var" with the following command:
    $ mount | grep /var /dev/mapper/rootvg-varlv on /var type xfs (rw,relatime,seclabel,attr2,inode64,logbufs=8,logbsize=32k,noquota)
    Note: Options displayed for mount may differ. If a separate entry for "/var" is not in use, this is a finding.'
  inputs: []
  evidence: []
