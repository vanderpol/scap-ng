assessment:
  id: SV-258157.manual
  version: 1
  assessment_title: RHEL 9 must notify the system administrator (SA) and information system security officer (ISSO)
    (at a minimum) when allocated audit record storage volume reaches 75 percent utilization.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 notifies the SA and ISSO (at a minimum) when allocated audit record storage volume reaches
    75 percent of the repository maximum audit record storage capacity with the following command: $ sudo grep -w
    space_left_action /etc/audit/auditd.conf space_left_action = email If the value of the "space_left_action" is
    not set to "email", or if the line is commented out, ask the SA to indicate how the system is providing real-time
    alerts to the SA and ISSO. If there is no evidence that real-time alerts are configured on the system, this
    is a finding.'
  inputs: {}
  evidence: []
