assessment:
  id: SV-279936.manual
  version: 1
  assessment_title: RHEL 9 must audit any script or executable called by cron as root or by any privileged user.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 is configured to audit the execution of any system call made by cron as root or by any
    privileged user with the following command: $ sudo auditctl -l | grep crond_t -a always,exit -F arch=b64 -S
    execve -F subj_type=crond_t -F euid=0 -k cron_exec -a always,exit -F arch=b32 -S execve -F subj_type=crond_t
    -F euid=0 -k cron_exec -a always,exit -F arch=b64 -S execve -F subj_type=crond_t -F auid>=1000 -F auid!=unset
    -k cron_exec -a always,exit -F arch=b32 -S execve -F subj_type=crond_t -F auid>=1000 -F auid!=unset -k cron_exec
    If this command does not return the expected output, or the lines are commented out, this is a finding.'
  inputs: {}
  evidence: []
