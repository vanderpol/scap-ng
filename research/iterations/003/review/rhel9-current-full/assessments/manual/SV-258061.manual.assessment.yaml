assessment:
  id: SV-258061.manual
  version: 1
  assessment_title: RHEL 9 groups must have unique Group ID (GID).
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 contains no duplicate GIDs for interactive users with the following command: $
    cut -d : -f 3 /etc/group | uniq -d If the system has duplicate GIDs, this is a finding.'
