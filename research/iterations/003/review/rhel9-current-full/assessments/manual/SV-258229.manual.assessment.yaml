assessment:
  id: SV-258229.manual
  version: 1
  assessment_title: RHEL 9 audit system must protect auditing rules from unauthorized change.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the audit system prevents unauthorized changes with the following command: $ sudo grep "^\s*[^#]"
    /etc/audit/audit.rules | tail -1 -e 2 If the audit system is not set to be immutable by adding the "-e 2" option
    to the end of "/etc/audit/audit.rules", this is a finding.'
  inputs: {}
  evidence: []
