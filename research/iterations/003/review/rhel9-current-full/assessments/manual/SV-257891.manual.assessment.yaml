assessment:
  id: SV-257891.manual
  version: 1
  assessment_title: RHEL 9 /etc/group file must have mode 0644 or less permissive to prevent unauthorized access.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that the "/etc/group" file has mode "0644" or less permissive with the following command: $
    sudo stat -c "%a %n" /etc/group 644 /etc/group If a value of "0644" or less permissive is not returned, this
    is a finding.'
  inputs: {}
  evidence: []
