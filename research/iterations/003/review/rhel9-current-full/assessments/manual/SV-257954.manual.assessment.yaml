assessment:
  id: SV-257954.manual
  version: 1
  assessment_title: RHEL 9 libreswan package must be installed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: If there is no operational need for Libreswan to be installed, this rule is not applicable.
    Verify that RHEL 9 libreswan service package is installed. Check that the libreswan service package is installed
    with the following command: $ dnf list --installed libreswan Example output: libreswan.x86_64 4.6-3.el9 If the
    "libreswan" package is not installed, this is a finding.'
  inputs: []
  evidence: []
