assessment:
  id: SV-258204.manual
  version: 1
  assessment_title: RHEL 9 must audit all uses of the sudo command.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 is configured to audit the execution of the "sudo" command with the following command:
    $ sudo auditctl -l | grep ''/usr/bin/sudo\b'' -a always,exit -S all -F path=/usr/bin/sudo -F perm=x -F auid>=1000
    -F auid!=-1 -F key=priv_cmd If the command does not return a line, or the line is commented out, this is a finding.'
  inputs: {}
  evidence: []
