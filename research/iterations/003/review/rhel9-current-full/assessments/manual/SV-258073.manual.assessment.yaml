assessment:
  id: SV-258073.manual
  version: 1
  assessment_title: RHEL 9 must define default permissions for the c shell.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the "umask" setting is configured correctly in the "/etc/csh.cshrc" file with the following
    command: Note: If the value of the "umask" parameter is set to "000" in the "/etc/csh.cshrc" file, the Severity
    is raised to a CAT I. $ grep umask /etc/csh.cshrc umask 077 If the value for the "umask" parameter is not "077",
    or the "umask" parameter is missing or is commented out, this is a finding.'
  inputs: {}
  evidence: []
