assessment:
  id: SV-258178.manual
  version: 1
  assessment_title: RHEL 9 must audit all uses of the chown, fchown, fchownat, and lchown system calls.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 is configured to audit the execution of the "chown", "fchown", "fchownat", and "lchown"
    system calls with the following command: $ sudo auditctl -l | grep chown -a always,exit -F arch=b32 -S lchown,fchown,chown,fchownat
    -F auid>=1000 -F auid!=-1 -F key=perm_mod -a always,exit -F arch=b64 -S chown,fchown,lchown,fchownat -F auid>=1000
    -F auid!=-1 -F key=perm_mod If both the "b32" and "b64" audit rules are not defined for the "chown", "fchown",
    "fchownat", and "lchown" system calls, this is a finding.'
  inputs: []
  evidence: []
