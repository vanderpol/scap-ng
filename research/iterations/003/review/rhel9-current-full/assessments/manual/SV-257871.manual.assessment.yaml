assessment:
  id: SV-257871.manual
  version: 1
  assessment_title: RHEL 9 must mount /var/log with the noexec option.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify "/var/log" is mounted with the "noexec" option: $ mount | grep /var/log /dev/mapper/rhel-var-log
    on /var/log type xfs (rw,nodev,nosuid,noexec,seclabel) If the "/var/log" file system is mounted without the
    "noexec" option, this is a finding.'
  inputs: {}
  evidence: []
