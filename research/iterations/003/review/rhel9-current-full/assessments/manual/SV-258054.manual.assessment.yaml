assessment:
  id: SV-258054.manual
  version: 1
  assessment_title: RHEL 9 must automatically lock an account when three unsuccessful logon attempts occur.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 is configured to lock an account after three unsuccessful logon attempts with the command:
    $ grep ''deny ='' /etc/security/faillock.conf deny = 3 If the "deny" option is not set to "3" or less (but not
    "0"), is missing or commented out, this is a finding.'
  inputs: {}
  evidence: []
