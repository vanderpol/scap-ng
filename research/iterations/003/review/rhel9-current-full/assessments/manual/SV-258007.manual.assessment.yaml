assessment:
  id: SV-258007.manual
  version: 1
  assessment_title: RHEL 9 SSH daemon must disable remote X connections for interactive users.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the SSH daemon does not allow X11Forwarding with the following command: $ sudo /usr/sbin/sshd
    -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo grep -iH ''^\s*x11forwarding''
    X11forwarding no If the value is returned as "yes", the returned line is commented out, or no output is returned,
    and X11 forwarding is not documented with the information system security officer (ISSO) as an operational requirement,
    this is a finding.'
  inputs: {}
  evidence: []
