assessment:
  id: SV-258197.manual
  version: 1
  assessment_title: RHEL 9 must audit all uses of the pam_timestamp_check command.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 is configured to audit the execution of the "pam_timestamp_check" command with
    the following command: $ sudo auditctl -l | grep timestamp -a always,exit -S all -F path=/usr/sbin/pam_timestamp_check
    -F perm=x -F auid>=1000 -F auid!=-1 -F key=privileged-pam_timestamp_check If the command does not return a line,
    or the line is commented out, this is a finding.'
  inputs: []
  evidence: []
