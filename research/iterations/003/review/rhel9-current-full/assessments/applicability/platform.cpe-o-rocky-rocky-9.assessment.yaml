assessment:
  id: platform.cpe-o-rocky-rocky-9.assessment
  version: 13
  assessment_title: Rocky Linux 9
  mode: automated
  class: inventory
  purpose: applicability
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    gather-cpe-name-attribute-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/os-release
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^CPE_NAME="(.+)"
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: gather the CPE_NAME attribute
  states:
    state-cpe-name-matches-rocky-rocky-9:
      state_title: CPE_NAME matches rocky:rocky:9
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: rocky:rocky:9
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-os-release-file-has-cpe-name-rocky-rocky-9:
      test_title: The os-release file has CPE_NAME of rocky:rocky:9
      capability: independent.textfilecontent54
      object: gather-cpe-name-attribute-object
      check_existence: all_exist
      check: all
      states:
      - state-cpe-name-matches-rocky-rocky-9
  evaluate:
    test: test-os-release-file-has-cpe-name-rocky-rocky-9
