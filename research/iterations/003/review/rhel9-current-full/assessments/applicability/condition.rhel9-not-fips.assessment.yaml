assessment:
  id: condition.rhel9-not-fips.assessment
  version: 4
  assessment_title: RHEL9 and Not FIPS
  mode: automated
  class: compliance
  purpose: applicability
  objects:
    proc-sys-crypto-fips-enabled-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /proc/sys/crypto/fips_enabled
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(\d+)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: /proc/sys/crypto/fips_enabled
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '1'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-fips-enabled-1:
      test_title: fips_enabled == 1
      capability: independent.textfilecontent54
      object: proc-sys-crypto-fips-enabled-object
      check_existence: all_exist
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    not:
      test: test-fips-enabled-1
