assessment:
  id: condition.linux-libreswan-installed.assessment
  version: 1
  assessment_title: Linux with Libreswan installed
  mode: automated
  class: inventory
  purpose: applicability
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-rpminfo-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: libreswan
      object_title: null
  states: {}
  tests:
    test-libreswan-package-installed:
      test_title: The libreswan package is installed.
      capability: linux.rpminfo
      object: linux-rpminfo-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    test: test-libreswan-package-installed
