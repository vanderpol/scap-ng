assessment:
  id: condition.linux-libreswan-installed.assessment
  version: 1
  assessment_title: Linux with Libreswan installed
  mode: automated
  class: inventory
  purpose: applicability
  collections:
    linux-rpminfo-collection:
      collection_title: null
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: libreswan
  tests:
    test-libreswan-package-installed:
      test_title: The libreswan package is installed.
      capability: linux.rpminfo
      collection: linux-rpminfo-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    test: test-libreswan-package-installed
