assessment:
  id: condition.linux-ipv6-enabled.assessment
  version: 1
  assessment_title: Linux IPv6 Enabled
  mode: automated
  class: inventory
  purpose: applicability
  collections:
    unix-sysctl-collection:
      collection_title: null
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: net.ipv6.conf.all.disable_ipv6
    etc-sysctl-conf-collection:
      collection_title: /etc/sysctl.conf
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/sysctl.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: (?:^|\.*\n)\s*net\.ipv6\.conf\.all\.disable_ipv6\s*=\s*(\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    other-sysctl-configuration-files-collection:
      collection_title: other sysctl configuration files
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: directories-containing-sysctl-configuration-files-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: \.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: (?:^|\.*\n)\s*net\.ipv6\.conf\.all\.disable_ipv6\s*=\s*(\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    all-sysctl-configuration-files-collection:
      collection_title: all sysctl configuration files
      set:
        operator: union
        members:
        - collection: etc-sysctl-conf-collection
        - collection: other-sysctl-configuration-files-collection
    proc-cmdline-contains-ipv6-disable-1-collection:
      collection_title: /proc/cmdline contains ipv6.disable=1
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /proc/cmdline
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: \bipv6\.disable=1\b
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  variables:
    directories-containing-sysctl-configuration-files-variable:
      title: Directories containing sysctl configuration files
      kind: constant
      datatype: string
      expression:
        literal:
        - /etc/sysctl.d
        - /run/sysctl.d
        - /lib/sysctl.d
        - /usr/lib/sysctl.d
        - /usr/local/lib/sysctl.d
  tests:
    test-net-ipv6-conf-all-disable-ipv6-setting-in-kernel-set:
      test_title: net.ipv6.conf.all.disable_ipv6 setting in kernel is set to 1
      capability: unix.sysctl
      collection: unix-sysctl-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: null
        state:
          field: value
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-net-ipv6-conf-all-disable-ipv6-setting-in-sysctl-configuration:
      test_title: net.ipv6.conf.all.disable_ipv6 setting in sysctl configuration files is set to 1, and nothing
        else
      capability: independent.textfilecontent54
      collection: all-sysctl-configuration-files-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          field: subexpression
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-ipv6-disable-1-in-kernel-cmdline:
      test_title: ipv6.disable=1 in the kernel cmdline
      capability: independent.textfilecontent54
      collection: proc-cmdline-contains-ipv6-disable-1-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    not:
      any:
      - all:
        - test: test-net-ipv6-conf-all-disable-ipv6-setting-in-kernel-set
        - test: test-net-ipv6-conf-all-disable-ipv6-setting-in-sysctl-configuration
      - test: test-ipv6-disable-1-in-kernel-cmdline
