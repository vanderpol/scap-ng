assessment:
  id: condition.linux-postfix-installed.assessment
  version: 1
  assessment_title: Linux with postfix installed
  mode: automated
  class: inventory
  purpose: applicability
  objects:
    linux-rpminfo-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: postfix
      object_title: null
  states: {}
  tests:
    test-postfix-package-installed:
      test_title: The postfix package is installed
      capability: linux.rpminfo
      object: linux-rpminfo-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    test: test-postfix-package-installed
