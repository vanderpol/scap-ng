assessment:
  id: condition.linux-bind-installed.assessment
  version: 1
  assessment_title: Linux with BIND installed
  mode: automated
  class: inventory
  purpose: applicability
  collections:
    bind-collection:
      collection_title: bind
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: bind
  tests:
    test-bind-installed:
      test_title: BIND installed
      capability: linux.rpminfo
      collection: bind-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    test: test-bind-installed
