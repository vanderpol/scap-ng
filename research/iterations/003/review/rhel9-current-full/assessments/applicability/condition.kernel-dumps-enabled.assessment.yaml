assessment:
  id: condition.kernel-dumps-enabled.assessment
  version: 3
  assessment_title: Kernel dumps are enabled
  mode: automated
  class: compliance
  purpose: applicability
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-sysctl-object:
      capability: unix.sysctl
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: kernel.core_pattern
      object_title: null
  states:
    state-unix-sysctl:
      state_title: null
      capability: unix.sysctl
      state:
        field: value
        value: '|/bin/false'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-kernel-core-pattern-setting-in-kernel-set-bin-false:
      test_title: kernel.core_pattern setting in kernel is set to |/bin/false
      capability: unix.sysctl
      object: unix-sysctl-object
      check_existence: all_exist
      check: all
      states:
      - state-unix-sysctl
  evaluate:
    not:
      test: test-kernel-core-pattern-setting-in-kernel-set-bin-false
