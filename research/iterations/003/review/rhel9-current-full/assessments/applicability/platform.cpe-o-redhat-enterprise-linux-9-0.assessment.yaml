assessment:
  id: platform.cpe-o-redhat-enterprise-linux-9-0.assessment
  version: 13
  assessment_title: Red Hat Enterprise Linux 9
  mode: automated
  class: inventory
  purpose: applicability
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-rpminfo-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: redhat-release
      object_title: null
    linux-rpminfo-object-2:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: toss-release
      object_title: null
    linux-rpminfo-object-3:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: oraclelinux-release
      object_title: null
  states:
    state-linux-rpminfo:
      state_title: null
      capability: linux.rpminfo
      state:
        field: version
        value: ^9\.\d+$
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-redhat-release-package-version-9:
      test_title: The redhat-release package is version 9.
      capability: linux.rpminfo
      object: linux-rpminfo-object
      check_existence: all_exist
      check: all
      states:
      - state-linux-rpminfo
    test-toss-package-not-installed:
      test_title: The TOSS Package is not Installed
      capability: linux.rpminfo
      object: linux-rpminfo-object-2
      check_existence: none_exist
      check: all
    test-oracle-linux-package-not-installed:
      test_title: The Oracle Linux Package is not Installed
      capability: linux.rpminfo
      object: linux-rpminfo-object-3
      check_existence: none_exist
      check: all
  evaluate:
    all:
    - test: test-redhat-release-package-version-9
    - test: test-toss-package-not-installed
    - test: test-oracle-linux-package-not-installed
