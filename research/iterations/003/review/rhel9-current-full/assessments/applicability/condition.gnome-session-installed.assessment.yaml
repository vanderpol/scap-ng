assessment:
  id: condition.gnome-session-installed.assessment
  version: 13
  assessment_title: Gnome Session is installed
  mode: automated
  class: inventory
  purpose: applicability
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-rpminfo-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          value: gnome-session
      object_title: null
    linux-dpkginfo-object:
      capability: linux.dpkginfo
      select:
        name:
          operation: equals
          datatype: string
          value: gnome-shell
      object_title: null
  states: {}
  tests:
    test-gnome-session-package-installed-rpm:
      test_title: The gnome-session package is installed. (RPM).
      capability: linux.rpminfo
      object: linux-rpminfo-object
      check_existence: at_least_one_exists
      check: all
    test-gnome-session-package-installed-deb:
      test_title: The gnome-session package is installed. (DEB)
      capability: linux.dpkginfo
      object: linux-dpkginfo-object
      check_existence: all_exist
      check: all
  evaluate:
    any:
    - test: test-gnome-session-package-installed-rpm
    - test: test-gnome-session-package-installed-deb
