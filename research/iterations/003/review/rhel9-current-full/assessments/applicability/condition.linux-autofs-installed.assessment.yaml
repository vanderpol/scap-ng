assessment:
  id: condition.linux-autofs-installed.assessment
  version: 1
  assessment_title: Linux with autofs installed
  mode: automated
  class: inventory
  purpose: applicability
  objects:
    linux-rpminfo-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: autofs
      object_title: null
  states: {}
  tests:
    test-autofs-package-installed:
      test_title: The autofs package is installed.
      capability: linux.rpminfo
      object: linux-rpminfo-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    test: test-autofs-package-installed
