assessment:
  id: condition.linux-tftp-installed.assessment
  version: 1
  assessment_title: Linux with TFTP installed
  mode: automated
  class: compliance
  purpose: applicability
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-rpminfo-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: tftp-server
      object_title: null
  states: {}
  tests:
    test-tftp-server-package-iinstalled:
      test_title: The tftp-server package is iinstalled.
      capability: linux.rpminfo
      object: linux-rpminfo-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    test: test-tftp-server-package-iinstalled
