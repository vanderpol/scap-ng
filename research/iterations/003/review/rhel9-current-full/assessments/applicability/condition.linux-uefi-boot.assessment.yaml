assessment:
  id: condition.linux-uefi-boot.assessment
  version: 6
  assessment_title: Linux UEFI Boot
  mode: automated
  class: inventory
  purpose: applicability
  collections:
    unix-file-collection:
      collection_title: null
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /sys/firmware/efi
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
  tests:
    test-sys-firmware-efi-exists:
      test_title: /sys/firmware/efi exists
      capability: unix.file
      collection: unix-file-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state: null
  evaluate:
    test: test-sys-firmware-efi-exists
