assessment:
  id: platform.rocky-linux-9.assessment
  version: 13
  assessment_title: Rocky Linux 9
  mode: automated
  class: inventory
  purpose: applicability
  collections:
    gather-cpe-name-attribute-collection:
      collection_title: gather the CPE_NAME attribute
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/os-release
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^CPE_NAME="(.+)"
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-os-release-file-has-cpe-name-rocky-rocky-9:
      test_title: The os-release file has CPE_NAME of rocky:rocky:9
      capability: independent.textfilecontent54
      collection: gather-cpe-name-attribute-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: CPE_NAME matches rocky:rocky:9
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: rocky:rocky:9
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-os-release-file-has-cpe-name-rocky-rocky-9
