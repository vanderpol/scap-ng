assessment:
  id: rhel9-stig-current-full.condition.linux-bind-installed.assessment
  version: 1
  assessment_title: Linux with BIND installed
  mode: automated
  class: inventory
  purpose: applicability
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    bind-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          value: bind
      object_title: bind
  states: {}
  tests:
    test-bind-installed:
      test_title: BIND installed
      capability: linux.rpminfo
      object: bind-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    test: test-bind-installed
