assessment:
  id: condition.gnome-shell-package.assessment
  version: 2
  assessment_title: Gnome-shell Package
  mode: automated
  class: inventory
  purpose: applicability
  objects:
    linux-rpminfo-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: gnome-shell
      object_title: null
    linux-dpkginfo-object:
      capability: linux.dpkginfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: gnome-shell
      object_title: null
  states: {}
  tests:
    test-gnome-installed:
      test_title: Gnome is installed
      capability: linux.rpminfo
      object: linux-rpminfo-object
      check_existence: all_exist
      check: all
    test-gnome-installed-2:
      test_title: Gnome is installed
      capability: linux.dpkginfo
      object: linux-dpkginfo-object
      check_existence: all_exist
      check: all
  evaluate:
    any:
    - test: test-gnome-installed
    - test: test-gnome-installed-2
