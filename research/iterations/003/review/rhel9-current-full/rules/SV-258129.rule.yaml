  remediation:
    guidance: 'Configure RHEL 9 to require authentication for single-user mode. Create a directory for supplementary
      configuration files: $ sudo mkdir /etc/systemd/system/rescue.service.d/ Copy the original file rescue.service
      file to the new directory with: $ sudo cp /usr/lib/systemd/system/rescue.service /etc/systemd/system/rescue.service.d/rescue.service.conf
      Open the new file: $ sudo vi etc/systemd/system/rescue.service.d/rescue.service.conf Add this line to the
      new file: ExecStart=-/usr/lib/systemd/systemd-sulogin-shell rescue Comment out or remove the ExecStart and
      ExecStartPre lines in /usr/lib/systemd/system/rescue.service as they can only exist in one location. Apply
      changes to unit files without rebooting the system: $ sudo systemctl daemon-reload'
