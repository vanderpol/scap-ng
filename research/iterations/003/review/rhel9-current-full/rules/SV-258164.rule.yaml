rule:
  id: SV-258164
  version: r1045301
  title: RHEL 9 audit system must audit local events.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'Without establishing what type of events occurred, the source of events, where events occurred, and
    the outcome of events, it would be difficult to establish, correlate, and investigate the events leading up
    to an outage or attack. If option "local_events" isn''t set to "yes" only events from network will be aggregated.
    Satisfies: SRG-OS-000062-GPOS-00031, SRG-OS-000480-GPOS-00227'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-653075
  - scheme: vulnerability
    value: V-258164
  - scheme: cci
    value: CCI-000169
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to generate audit records for local events by adding or updating the following line
      in "/etc/audit/auditd.conf": local_events = yes The audit daemon must be restarted for the changes to take
      effect.'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-258164.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-258164.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-258164.manual.assessment.yaml
  default_assessment_choice: default
