rule:
  id: SV-258082
  version: r1045166
  title: RHEL 9 policycoreutils-python-utils package must be installed.
  severity: medium
  role: full
  weight: 10.0
  discussion: The policycoreutils-python-utils package is required to operate and manage an SELinux environment
    and its policies. It provides utilities such as semanage, audit2allow, audit2why, chcat, and sandbox.
