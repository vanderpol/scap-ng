rule:
  id: SV-258009
  version: r1045077
  title: RHEL 9 SSH daemon must display the date and time of the last successful account logon upon an SSH logon.
  severity: medium
  role: full
  weight: 10.0
  discussion: Providing users feedback on when account accesses last occurred facilitates user recognition and reporting
    of unauthorized account use.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-255165
  - scheme: vulnerability
    value: V-258009
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the SSH daemon to provide users with feedback on when account accesses last occurred. Add
      the following line to "/etc/ssh/sshd_config" or to a file in "/etc/ssh/sshd_config.d", or uncomment the line
      and set the value to "yes": PrintLastLog yes The SSH service must be restarted for changes to take effect:
      $ sudo systemctl restart sshd.service'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-258009.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-258009.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-258009.manual.assessment.yaml
  default_assessment_choice: default
