rule:
  id: SV-258014
  version: r1045084
  title: RHEL 9 must disable the graphical user interface automount function unless required.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'Automatically mounting file systems permits easy introduction of unknown devices, thereby facilitating
    malicious activity. Satisfies: SRG-OS-000114-GPOS-00059, SRG-OS-000378-GPOS-00163, SRG-OS-000480-GPOS-00227'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-271020
  - scheme: vulnerability
    value: V-258014
  - scheme: cci
    value: CCI-000778
  - scheme: cci
    value: CCI-001958
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability:
  - rhel9-stig-current-full.condition.gnome-shell-package
  parameters: {}
  remediation:
    guidance: 'Configure the GNOME desktop to disable automated mounting of removable media. The dconf settings
      can be edited in the /etc/dconf/db/* location. Update the [org/gnome/desktop/media-handling] section of the
      "/etc/dconf/db/local.d/00-security-settings" database file and add or update the following lines: [org/gnome/desktop/media-handling]
      automount-open=false Then update the dconf system databases: $ sudo dconf update'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-258014.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-258014.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-258014.manual.assessment.yaml
  default_assessment_choice: default
