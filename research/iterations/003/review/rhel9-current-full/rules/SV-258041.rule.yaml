rule:
  id: SV-258041
  version: r1038967
  title: RHEL 9 user account passwords for new users or password changes must have a 60-day maximum password lifetime
    restriction in /etc/login.defs.
  severity: medium
  role: full
  weight: 10.0
  discussion: Any password, no matter how complex, can eventually be cracked; therefore, passwords need to be changed
    periodically. If the operating system does not limit the lifetime of passwords and force users to change their
    passwords, there is the risk that the operating system passwords could be compromised. Setting the password
    maximum age ensures users are required to periodically change their passwords. Requiring shorter password lifetimes
    increases the risk of users writing down the password in a convenient location subject to physical compromise.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-411010
  - scheme: vulnerability
    value: V-258041
  - scheme: cci
    value: CCI-004066
  - scheme: cci
    value: CCI-000199
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to enforce a 60-day maximum password lifetime. Add or modify the following line
      in the "/etc/login.defs" file: PASS_MAX_DAYS 60'
