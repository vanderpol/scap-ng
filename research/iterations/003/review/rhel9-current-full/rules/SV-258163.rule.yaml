rule:
  id: SV-258163
  version: r958424
  title: RHEL 9 System Administrator (SA) and/or information system security officer (ISSO) (at a minimum) must
    be alerted of an audit processing failure event.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'It is critical for the appropriate personnel to be aware if a system is at risk of failing to process
    audit logs as required. Without this notification, the security personnel may be unaware of an impending failure
    of the audit capability, and system operation may be adversely affected. Audit processing failures include software/hardware
    errors, failures in the audit capturing mechanisms, and audit storage capacity being reached or exceeded. This
    requirement applies to each audit data storage repository (i.e., distinct information system component where
    audit records are stored), the centralized audit storage capacity of organizations (i.e., all audit data storage
    repositories combined), or both. Satisfies: SRG-OS-000046-GPOS-00022, SRG-OS-000343-GPOS-00134'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-653070
  - scheme: vulnerability
    value: V-258163
  - scheme: cci
    value: CCI-000139
  - scheme: cci
    value: CCI-001855
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure "auditd" service to notify the SA and ISSO in the event of an audit processing failure.
      Edit the following line in "/etc/audit/auditd.conf" to ensure that administrators are notified via email for
      those situations: action_mail_acct = root The audit daemon must be restarted for changes to take effect.'
  assessment_choices:
