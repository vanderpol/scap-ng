rule:
  id: SV-258058
  version: r1045148
  title: RHEL 9 must not have unauthorized accounts.
  severity: medium
  role: full
  weight: 10.0
  discussion: Accounts providing no operational purpose provide additional opportunities for system compromise.
    Unnecessary accounts include user accounts for individuals not requiring access to the system and application
    accounts for applications not installed on the system.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-411095
  - scheme: vulnerability
    value: V-258058
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Remove unauthorized local interactive user accounts with the following command where <unauthorized_user>
      is the unauthorized account: $ sudo userdel <unauthorized_user>'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/manual/SV-258058.manual.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-258058.manual.assessment.yaml
  default_assessment_choice: default
