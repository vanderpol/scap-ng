rule:
  id: SV-258091
  version: r1208774
  title: RHEL 9 must ensure the password complexity module in the system-auth file is configured for three retries
    or less.
  severity: medium
  role: full
  weight: 10.0
  discussion: Use of a complex password helps to increase the time and resources required to compromise the password.
    Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing
    and brute-force attacks. "pwquality" enforces complex password construction configuration and has the ability
    to limit brute-force attacks on the system. By limiting the number of attempts to meet the pwquality module
    complexity requirements before returning with an error, the system will audit abnormal attempts at password
    changes.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-611010
  - scheme: vulnerability
    value: V-258091
  - scheme: cci
    value: CCI-004066
  - scheme: cci
    value: CCI-000192
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to limit the "pwquality" retry option to "3". Add or update the following line in
      the "/etc/security/pwquality.conf" file or a file in the "/etc/security/pwquality.conf.d/" directory to contain
      the "retry" parameter: retry = 3'
  assessment_choices:
