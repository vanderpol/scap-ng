rule:
  id: SV-257805
  version: r1044856
  title: RHEL 9 must be configured to disable the Controller Area Network kernel module.
  severity: medium
  role: full
  weight: 10.0
  discussion: Disabling Controller Area Network (CAN) protects the system against exploitation of any flaws in its
    implementation.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-213050
  - scheme: vulnerability
    value: V-257805
  - scheme: cci
    value: CCI-000381
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'To configure the system to prevent the can kernel module from being loaded, add the following lines
      to the file /etc/modprobe.d/can.conf (or create can.conf if it does not exist): install can /bin/false blacklist
      can'
