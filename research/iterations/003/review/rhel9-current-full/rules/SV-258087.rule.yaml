rule:
  id: SV-258087
  version: r1102071
  title: RHEL 9 must restrict privilege elevation to authorized personnel.
  severity: medium
  role: full
  weight: 10.0
  discussion: If the "sudoers" file is not configured correctly, any user defined on the system can initiate privileged
    actions on the target system.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-432030
  - scheme: vulnerability
    value: V-258087
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Remove the following entries from the /etc/sudoers file or configuration file under /etc/sudoers.d/:
      ALL ALL=(ALL) ALL ALL ALL=(ALL:ALL) ALL'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-258087.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-258087.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-258087.manual.assessment.yaml
  default_assessment_choice: default
