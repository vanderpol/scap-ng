rule:
  id: SV-258118
  version: r1050789
  title: RHEL 9 must not be configured to bypass password requirements for privilege escalation.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'Without reauthentication, users may access resources or perform tasks for which they do not have
    authorization. When operating systems provide the capability to escalate a functional capability, it is critical
    the user reauthenticate. Satisfies: SRG-OS-000373-GPOS-00156, SRG-OS-000373-GPOS-00157, SRG-OS-000373-GPOS-00158'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-611145
  - scheme: vulnerability
    value: V-258118
  - scheme: cci
    value: CCI-004895
  - scheme: cci
    value: CCI-002038
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the operating system to require users to supply a password for privilege escalation. Remove
      any occurrences of " pam_succeed_if " in the "/etc/pam.d/sudo" file.
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-258118.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-258118.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-258118.manual.assessment.yaml
  default_assessment_choice: default
