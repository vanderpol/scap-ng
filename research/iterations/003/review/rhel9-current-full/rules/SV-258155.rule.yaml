rule:
  id: SV-258155
  version: r1045300
  title: RHEL 9 must allocate audit record storage capacity to store at least one week's worth of audit records.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'To ensure RHEL 9 systems have a sufficient storage capacity in which to write the audit logs, RHEL
    9 needs to be able to allocate audit record storage capacity. The task of allocating audit record storage capacity
    is usually performed during initial installation of RHEL 9. Satisfies: SRG-OS-000341-GPOS-00132, SRG-OS-000342-GPOS-00133'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-653030
  - scheme: vulnerability
    value: V-258155
  - scheme: cci
    value: CCI-001849
  - scheme: cci
    value: CCI-001851
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Allocate enough storage capacity for at least one week of audit records when audit records are not
      immediately sent to a central audit record storage facility. If audit records are stored on a partition made
      specifically for audit records, resize the partition with sufficient space to contain one week of audit records.
      If audit records are not stored on a partition made specifically for audit records, a new partition with sufficient
      space will need be to be created.
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-258155.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-258155.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-258155.manual.assessment.yaml
  default_assessment_choice: default
