rule:
  id: SV-258171
  version: r1208777
  title: RHEL 9 must allow only the information system security manager (ISSM) (or individuals or roles appointed
    by the ISSM) to select which auditable events are to be audited.
  severity: medium
  role: full
  weight: 10.0
  discussion: Without the capability to restrict the roles and individuals that can select which events are audited,
    unauthorized personnel may be able to prevent the auditing of critical events. Misconfigured audits may degrade
    the system's performance by overwhelming the audit log. Misconfigured audits may also make it more difficult
    to establish, correlate, and investigate the events relating to an incident or identify those responsible for
    one.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-653110
  - scheme: vulnerability
    value: V-258171
  - scheme: cci
    value: CCI-000171
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the files in directory "/etc/audit/rules.d/" and the "/etc/audit/auditd.conf" file to have
      a mode of "0600" with the following commands: $ sudo chmod 0600 /etc/audit/rules.d/audit.rules $ sudo chmod
      0600 /etc/audit/rules.d/[customrulesfile].rules $ sudo chmod 0600 /etc/audit/auditd.conf'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-258171.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-258171.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-258171.manual.assessment.yaml
  default_assessment_choice: default
