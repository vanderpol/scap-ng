rule:
  id: SV-258031
  version: r1134920
  title: RHEL 9 must disable the ability of a user to accidentally press Ctrl-Alt-Del and cause a system to shut
    down or reboot.
  severity: medium
  role: full
  weight: 10.0
  discussion: A locally logged-in user who presses Ctrl-Alt-Del, when at the console, can reboot the system. If
    accidentally pressed, as could happen in the case of mixed OS environment, this can create the risk of short-term
    loss of availability of systems due to unintentional reboot.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-271105
  - scheme: vulnerability
    value: V-258031
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to ignore the Ctrl-Alt-Del sequence in the GNOME desktop. Run the following command
      to set the media-keys logout setting: $ gsettings set org.gnome.settings-daemon.plugins.media-keys logout
      "['''']" Run the following command to update the database: $ sudo dconf update'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-258031.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-258031.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-258031.manual.assessment.yaml
  default_assessment_choice: default
