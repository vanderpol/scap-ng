rule:
  id: SV-258006
  version: r1045071
  title: RHEL 9 SSH daemon must not allow known hosts authentication.
  severity: medium
  role: full
  weight: 10.0
  discussion: Configuring the IgnoreUserKnownHosts setting for the SSH daemon provides additional assurance that
    remote login via SSH will require a password, even in the event of misconfiguration elsewhere.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-255150
  - scheme: vulnerability
    value: V-258006
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the SSH daemon to not allow known hosts authentication. Add the following line to "/etc/ssh/sshd_config"
      or to a file in "/etc/ssh/sshd_config.d", or uncomment the line and set the value to "yes": IgnoreUserKnownHosts
      yes The SSH service must be restarted for changes to take effect: $ sudo systemctl restart sshd.service'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-258006.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-258006.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-258006.manual.assessment.yaml
  default_assessment_choice: default
