rule:
  id: SV-258043
  version: r991589
  title: All RHEL 9 local interactive user accounts must be assigned a home directory upon creation.
  severity: medium
  role: full
  weight: 10.0
  discussion: If local interactive users are not assigned a valid home directory, there is no place for the storage
    and control of files they should own.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-411020
  - scheme: vulnerability
    value: V-258043
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure RHEL 9 to assign home directories to all new local interactive users by setting the "CREATE_HOME"
      parameter in "/etc/login.defs" to "yes" as follows. CREATE_HOME yes
  organizational_input_requirements: {}
