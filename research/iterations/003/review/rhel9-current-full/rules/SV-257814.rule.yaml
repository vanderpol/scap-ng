rule:
  id: SV-257814
  version: r1156057
  title: RHEL 9 must disable core dumps for all users.
  severity: medium
  role: full
  weight: 10.0
  discussion: A core dump includes a memory image taken at the time the operating system terminates an application.
    The memory image could contain sensitive data and is generally useful only for developers trying to debug problems.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-213095
  - scheme: vulnerability
    value: V-257814
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability:
  - rhel9-stig-current-full.condition.kernel-dumps-enabled
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to disable core dumps for all users. Add the following line to the top of the /etc/security/limits.conf
      or in a single ".conf" file defined in /etc/security/limits.d/: * hard core 0 Remove or comment out any entries
      for users or groups with a value set to anything other than "0".'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-257814.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-257814.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-257814.manual.assessment.yaml
  default_assessment_choice: default
