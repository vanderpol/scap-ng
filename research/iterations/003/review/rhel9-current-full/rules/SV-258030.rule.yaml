rule:
  id: SV-258030
  version: r1045112
  title: RHEL 9 must prevent a user from overriding the disable-restart-buttons setting for the graphical user interface.
  severity: medium
  role: full
  weight: 10.0
  discussion: A user who is at the console can reboot the system at the login screen. If restart or shutdown buttons
    are pressed at the login screen, this can create the risk of short-term loss of availability of systems due
    to reboot.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-271100
  - scheme: vulnerability
    value: V-258030
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability:
  - condition.gnome-shell-package
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to prevent a user from overriding the disable-restart-buttons setting for graphical
      user interfaces. Create a database to contain the systemwide graphical user logon settings (if it does not
      already exist) with the following command: $ sudo touch /etc/dconf/db/local.d/locks/session Add the following
      line to prevent nonprivileged users from modifying it: /org/gnome/login-screen/disable-restart-buttons Run
      the following command to update the database: $ sudo dconf update'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-258030.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-258030.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-258030.manual.assessment.yaml
  default_assessment_choice: default
