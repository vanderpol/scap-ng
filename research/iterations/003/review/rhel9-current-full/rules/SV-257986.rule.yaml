rule:
  id: SV-257986
  version: r1045030
  title: RHEL 9 must enable the Pluggable Authentication Module (PAM) interface for SSHD.
  severity: high
  role: full
  weight: 10.0
  discussion: When UsePAM is set to "yes", PAM runs through account and session types properly. This is important
    when restricted access to services based off of IP, time, or other factors of the account is needed. Additionally,
    this ensures users can inherit certain environment variables on login or disallow access to the server.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-255050
  - scheme: vulnerability
    value: V-257986
  - scheme: cci
    value: CCI-000877
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the RHEL 9 SSHD to use the UsePAM interface by adding or modifying the following line in
      "/etc/ssh/sshd_config" or in a file in "/etc/ssh/sshd_config.d". UsePAM yes Restart the SSH daemon for the
      settings to take effect: $ sudo systemctl restart sshd.service'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-257986.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-257986.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-257986.manual.assessment.yaml
  default_assessment_choice: default
