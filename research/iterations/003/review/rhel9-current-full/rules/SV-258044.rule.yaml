rule:
  id: SV-258044
  version: r1184313
  title: RHEL 9 must set the umask value to 077 for all local interactive user accounts.
  severity: medium
  role: full
  weight: 10.0
  discussion: The umask controls the default access mode assigned to newly created files. A umask of 077 limits
    new files to mode 600 or less permissive. Although umask can be represented as a four-digit number, the first
    digit representing special access modes is typically ignored or required to be "0". This requirement applies
    to the globally configured system defaults and the local interactive user defaults for each account on the system.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-411025
  - scheme: vulnerability
    value: V-258044
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Remove the umask statement from all local interactive user's initialization files. If the account
      is for an application, the requirement for a umask less restrictive than "077" can be documented with the
      information system security officer, but the user agreement for access to the account must specify that the
      local interactive user must log on to their account first and then switch the user to the application account
      with the correct option to gain the account's environment variables.
  organizational_input_requirements: {}
