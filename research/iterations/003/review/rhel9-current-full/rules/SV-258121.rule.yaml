rule:
  id: SV-258121
  version: r1155682
  title: RHEL 9 must use the common access card (CAC) smart card driver.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'Smart card login provides two-factor authentication stronger than that provided by a username and
    password combination. Smart cards leverage public key infrastructure to provide and verify credentials. Configuring
    the smart card driver in use by the organization helps to prevent users from using unauthorized smart cards.
    Satisfies: SRG-OS-000104-GPOS-00051, SRG-OS-000106-GPOS-00053, SRG-OS-000107-GPOS-00054, SRG-OS-000109-GPOS-00056,
    SRG-OS-000108-GPOS-00055, SRG-OS-000112-GPOS-00057, SRG-OS-000113-GPOS-00058'
  rationale: null
