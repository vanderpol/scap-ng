rule:
  id: SV-258166
  version: r1045303
  title: RHEL 9 audit log directory must be owned by root to prevent unauthorized read access.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'Unauthorized disclosure of audit records can reveal system and configuration data to attackers, thus
    compromising its confidentiality. Satisfies: SRG-OS-000057-GPOS-00027, SRG-OS-000058-GPOS-00028, SRG-OS-000059-GPOS-00029,
    SRG-OS-000206-GPOS-00084'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
