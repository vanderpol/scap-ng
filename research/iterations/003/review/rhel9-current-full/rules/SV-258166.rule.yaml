  - scheme: vulnerability
    value: V-258166
  - scheme: cci
    value: CCI-000162
  - scheme: cci
    value: CCI-000163
  - scheme: cci
    value: CCI-000164
  - scheme: cci
    value: CCI-001314
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
