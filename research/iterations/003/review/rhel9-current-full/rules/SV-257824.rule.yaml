    value: RHEL-09-214035
  - scheme: vulnerability
    value: V-257824
  - scheme: cci
    value: CCI-002617
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to remove all software components after updated versions have been installed. Edit
      the file /etc/dnf/dnf.conf by adding or editing the following line: clean_requirements_on_remove=True'
