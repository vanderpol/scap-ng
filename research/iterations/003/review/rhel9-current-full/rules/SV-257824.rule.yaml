rule:
  id: SV-257824
  version: r1044886
  title: RHEL 9 must remove all software components after updated versions have been installed.
  severity: low
  role: full
  weight: 10.0
  discussion: Previous versions of software components that are not removed from the information system after updates
    have been installed may be exploited by some adversaries.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
