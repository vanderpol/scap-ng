  remediation:
    guidance: 'Configure RHEL 9, for PKI-based authentication, to validate certificates by constructing a certification
      path (which includes status information) to an accepted trust anchor. Obtain a valid copy of the DOD root
      CA file from the PKI CA certificate bundle from cyber.mil and copy the DoD_PKE_CA_chain.pem into the following
      file: /etc/sssd/pki/sssd_auth_ca_db.pem'
