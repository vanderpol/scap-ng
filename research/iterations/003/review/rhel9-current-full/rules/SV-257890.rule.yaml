rule:
  id: SV-257890
  version: r1184305
  title: All RHEL 9 local interactive user home directories must have mode 0750 or less permissive.
  severity: medium
  role: full
  weight: 10.0
  discussion: Excessive permissions on local interactive user home directories may allow unauthorized access to
    user files by other users.
  rationale: null
  extensions:
