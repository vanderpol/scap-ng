rule:
  id: SV-257798
  version: r1198253
  title: RHEL 9 must prevent kernel profiling by nonprivileged users.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'Preventing unauthorized information transfers mitigates the risk of information, including encrypted
    representations of information, produced by the actions of prior users/roles (or the actions of processes acting
    on behalf of prior users/roles) from being available to any current users/roles (or current processes) that
    obtain access to shared system resources (e.g., registers, main memory, hard disks) after those resources have
    been released back to information systems. The control of information in shared resources is also commonly referred
    to as object reuse and residual information protection. This requirement generally applies to the design of
    an information technology product, but it can also apply to the configuration of particular information system
    components that are, or use, such products. This can be verified by acceptance/validation processes in DOD or
    other government agencies. There may be shared resources with configurable protections (e.g., files in storage)
    that may be assessed on specific information system components. Setting the kernel.perf_event_paranoid kernel
    parameter to "2" prevents attackers from gaining additional system information as a nonprivileged user. The
    sysctl --system command will load settings from all system configuration files. All configuration files are
    sorted by their filename in lexicographical order, regardless of the directories in which they reside. If multiple
    files specify the same option, the entry in the file with the lexicographically latest name will take precedence.
    Files are read from directories in the following list from top to bottom. Once a file of a given filename is
    loaded, any file of the same name in subsequent directories is ignored. /etc/sysctl.d/*.conf /run/sysctl.d/*.conf
    /usr/local/lib/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf /lib/sysctl.d/*.conf /etc/sysctl.conf Satisfies: SRG-OS-000132-GPOS-00067,
    SRG-OS-000138-GPOS-00069'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-213015
  - scheme: vulnerability
    value: V-257798
  - scheme: cci
    value: CCI-001082
  - scheme: cci
    value: CCI-001090
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to prevent kernel profiling by nonprivileged users. Create a drop-in if it does
      not already exist: $ sudo vi /etc/sysctl.d/99-kernel_perf_event_paranoid.conf Add the following to the file:
      kernel.perf_event_paranoid = 2 Reload settings from all system configuration files with the following command:
      $ sudo sysctl --system'
  assessment_choices:
