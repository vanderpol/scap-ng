    value: RHEL-09-231085
  - scheme: vulnerability
    value: V-257858
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the "/etc/fstab" to use the "nodev" option on file systems that are associated with removable
      media.
  organizational_input_requirements: {}
