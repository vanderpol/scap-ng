rule:
  id: SV-257858
  version: r991589
  title: RHEL 9 must prevent special devices on file systems that are used with removable media.
  severity: medium
  role: full
  weight: 10.0
  discussion: The "nodev" mount option causes the system not to interpret character or block special devices. Executing
    character or blocking special devices from untrusted file systems increases the opportunity for nonprivileged
    users to attain unauthorized administrative access.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
