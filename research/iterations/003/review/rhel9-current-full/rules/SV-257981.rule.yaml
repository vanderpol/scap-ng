rule:
  id: SV-257981
  version: r1101970
  title: RHEL 9 must display the Standard Mandatory DOD Notice and Consent Banner before granting local or remote
    access to the system via a SSH logon.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'The warning message reinforces policy awareness during the logon process and facilitates possible
    legal action against attackers. Alternatively, systems whose ownership should not be obvious should ensure usage
    of a banner that does not provide easy attribution. Satisfies: SRG-OS-000023-GPOS-00006, SRG-OS-000228-GPOS-00088'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-255025
  - scheme: vulnerability
    value: V-257981
  - scheme: cci
    value: CCI-000048
  - scheme: cci
    value: CCI-001384
  - scheme: cci
    value: CCI-001385
  - scheme: cci
    value: CCI-001386
  - scheme: cci
    value: CCI-001387
  - scheme: cci
    value: CCI-001388
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to display the Standard Mandatory DOD Notice and Consent Banner before granting
      access to the system via ssh. Edit the "etc/ssh/sshd_config" file or a file in "/etc/ssh/sshd_config.d" to
      uncomment the banner keyword and configure it to point to a file that will contain the logon banner (this
      file may be named differently or be in a different location if using a version of SSH that is provided by
      a third-party vendor). An example configuration line is: Banner /etc/issue'
  organizational_input_requirements: {}
