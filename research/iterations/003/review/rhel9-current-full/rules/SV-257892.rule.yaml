rule:
  id: SV-257892
  version: r991589
  title: RHEL 9 /etc/group- file must have mode 0644 or less permissive to prevent unauthorized access.
  severity: medium
  role: full
  weight: 10.0
  discussion: The "/etc/group-" file is a backup file of "/etc/group", and as such, contains information regarding
    groups that are configured on the system. Protection of this file is important for system security.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-232060
  - scheme: vulnerability
    value: V-257892
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Change the mode of the file "/etc/group-" to "0644" by running the following command: $ sudo chmod
      0644 /etc/group-'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-257892.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-257892.automated.assessment.yaml
    manual:
