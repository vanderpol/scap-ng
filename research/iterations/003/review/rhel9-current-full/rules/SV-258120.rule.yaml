rule:
  id: SV-258120
  version: r991589
  title: RHEL 9 must not have accounts configured with blank or null passwords.
  severity: medium
  role: full
  weight: 10.0
  discussion: If an account has an empty password, anyone could log in and run commands with the privileges of that
    account. Accounts with empty passwords should never be used in operational environments.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-611155
  - scheme: vulnerability
    value: V-258120
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure all accounts on RHEL 9 to have a password or lock the account with the following commands:
      Perform a password reset: $ sudo passwd [username] To lock an account: $ sudo passwd -l [username]'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-258120.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-258120.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-258120.manual.assessment.yaml
  default_assessment_choice: default
