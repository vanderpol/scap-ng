rule:
  id: SV-257806
  version: r1044859
  title: RHEL 9 must be configured to disable the FireWire kernel module.
  severity: medium
  role: full
  weight: 10.0
  discussion: Disabling firewire protects the system against exploitation of any flaws in its implementation.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-213055
  - scheme: vulnerability
    value: V-257806
  - scheme: cci
    value: CCI-000381
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'To configure the system to prevent the firewire-core kernel module from being loaded, add the following
      lines to the file /etc/modprobe.d/firewire-core.conf (or create firewire-core.conf if it does not exist):
      install firewire-core /bin/false blacklist firewire-core'
  organizational_input_requirements: {}
