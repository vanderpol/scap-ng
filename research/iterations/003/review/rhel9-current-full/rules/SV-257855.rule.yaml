    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability:
  - rhel9-stig-current-full.condition.linux-nfs-mounts-configured
  parameters: {}
  remediation:
    guidance: Update each NFS mounted file system to use the "noexec" option on file systems that are being imported
      via NFS.
