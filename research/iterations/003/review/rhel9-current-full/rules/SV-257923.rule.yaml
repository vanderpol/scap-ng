rule:
  id: SV-257923
  version: r1044991
  title: RHEL 9 library directories must be group-owned by root or a system account.
  severity: medium
  role: full
  weight: 10.0
  discussion: If RHEL 9 allowed any user to make changes to software libraries, then those changes might be implemented
    without undergoing the appropriate testing and approvals that are part of a robust change management process.
    This requirement applies to RHEL 9 with software libraries that are accessible and configurable, as in the case
    of interpreted languages. Software libraries also include privileged programs that execute with escalated privileges.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-232215
  - scheme: vulnerability
    value: V-257923
  - scheme: cci
    value: CCI-001499
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the systemwide shared library directories (/lib, /lib64, /usr/lib and /usr/lib64) to be
      protected from unauthorized access. Run the following command, replacing "[DIRECTORY]" with any library directory
      not group-owned by "root". $ sudo chgrp root [DIRECTORY]
  organizational_input_requirements: {}
