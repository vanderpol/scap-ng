    default:
      assessment: ../assessments/automated/SV-257923.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-257923.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-257923.manual.assessment.yaml
  default_assessment_choice: default
