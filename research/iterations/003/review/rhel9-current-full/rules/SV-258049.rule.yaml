rule:
  id: SV-258049
  version: r1015092
  title: RHEL 9 must disable account identifiers (individuals, groups, roles, and devices) after 35 days of inactivity.
  severity: medium
  role: full
  weight: 10.0
  discussion: Inactive identifiers pose a risk to systems and applications because attackers may exploit an inactive
    identifier and potentially obtain undetected access to the system. Disabling inactive accounts ensures that
    accounts which may not have been responsibly removed are not available to attackers who may have compromised
    their credentials. Owners of inactive accounts will not notice if unauthorized access to their user account
    has been obtained.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-411050
  - scheme: vulnerability
    value: V-258049
  - scheme: cci
    value: CCI-003627
  - scheme: cci
    value: CCI-003628
  - scheme: cci
    value: CCI-000795
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to disable account identifiers after 35 days of inactivity after the password expiration.
      Run the following command to change the configuration for useradd: $ sudo useradd -D -f 35 The recommendation
      is 35 days, but a lower value is acceptable.'
  assessment_choices:
