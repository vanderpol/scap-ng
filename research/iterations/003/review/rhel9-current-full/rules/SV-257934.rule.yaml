rule:
  id: SV-257934
  version: r991589
  title: RHEL 9 /etc/shadow file must have mode 0000 to prevent unauthorized access.
  severity: medium
  role: full
  weight: 10.0
  discussion: The "/etc/shadow" file contains the list of local system accounts and stores password hashes. Protection
    of this file is critical for system security. Failure to give ownership of this file to root provides the designated
    owner with access to sensitive information, which could weaken the system security posture.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-232270
  - scheme: vulnerability
    value: V-257934
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Change the mode of the file "/etc/shadow" to "0000" by running the following command: $ sudo chmod
      0000 /etc/shadow'
