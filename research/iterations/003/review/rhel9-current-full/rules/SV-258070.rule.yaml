rule:
  id: SV-258070
  version: r1045153
  title: RHEL 9 must log username information when unsuccessful logon attempts occur.
  severity: medium
  role: full
  weight: 10.0
  discussion: Without auditing of these events, it may be harder or impossible to identify what an attacker did
    after an attack.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-412045
  - scheme: vulnerability
    value: V-258070
  - scheme: cci
    value: CCI-000044
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to log username information when unsuccessful logon attempts occur. Enable the feature
      using the following command: $ sudo authselect enable-feature with-faillock Add/modify the "/etc/security/faillock.conf"
      file to match the following line: audit'
  assessment_choices:
    default:
