rule:
  id: SV-258056
  version: r1045143
  title: RHEL 9 must automatically lock an account when three unsuccessful logon attempts occur during a 15-minute
    time period.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'By limiting the number of failed logon attempts the risk of unauthorized system access via user password
    guessing, otherwise known as brute-forcing, is reduced. Limits are imposed by locking the account. Satisfies:
    SRG-OS-000329-GPOS-00128, SRG-OS-000021-GPOS-00005'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-411085
  - scheme: vulnerability
    value: V-258056
  - scheme: cci
    value: CCI-000044
  - scheme: cci
    value: CCI-002238
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'To configure RHEL 9 to lock out the "root" account after a number of incorrect logon attempts within
      15 minutes using "pam_faillock.so", enable the feature using the following command: $ sudo authselect enable-feature
      with-faillock Then edit the "/etc/security/faillock.conf" file as follows: fail_interval = 900'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-258056.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-258056.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-258056.manual.assessment.yaml
  default_assessment_choice: default
