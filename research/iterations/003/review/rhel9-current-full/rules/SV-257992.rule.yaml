rule:
  id: SV-257992
  version: r1045047
  title: RHEL 9 must not allow a noncertificate trusted host SSH logon to the system.
  severity: medium
  role: full
  weight: 10.0
  discussion: SSH trust relationships mean a compromise on one host can allow an attacker to move trivially to other
    hosts.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-255080
  - scheme: vulnerability
    value: V-257992
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'To configure RHEL 9 to not allow a noncertificate trusted host SSH logon to the system, add or modify
      the following line in "/etc/ssh/sshd_config" or in a file in "/etc/ssh/sshd_config.d". HostbasedAuthentication
      no Restart the SSH daemon for the settings to take effect: $ sudo systemctl restart sshd.service'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-257992.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-257992.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-257992.manual.assessment.yaml
  default_assessment_choice: default
