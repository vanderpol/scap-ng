rule:
  id: SV-257822
  version: r1155615
  title: RHEL 9 must have GPG signature verification enabled for all software repositories.
  severity: high
  role: full
  weight: 10.0
  discussion: Changes to any software components can have significant effects on the overall security of the operating
    system. This requirement ensures the software has not been tampered with and that it has been provided by a
    trusted vendor. All software packages must be signed with a cryptographic key recognized and approved by the
    organization. Verifying the authenticity of software prior to installation validates the integrity of the software
    package received from a vendor. This verifies the software has not been tampered with and that it has been provided
    by a trusted vendor.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-214025
  - scheme: vulnerability
    value: V-257822
  - scheme: cci
    value: CCI-003992
  - scheme: cci
    value: CCI-001749
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure all software repositories defined in "/etc/yum.repos.d/" to have "gpgcheck" enabled: $
      sudo sed -i ''s/gpgcheck\s*=.*/gpgcheck=1/g'' /etc/yum.repos.d/*'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-257822.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-257822.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-257822.manual.assessment.yaml
  default_assessment_choice: default
