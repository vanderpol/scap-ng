rule:
  id: SV-257809
  version: r1208769
  title: RHEL 9 must implement address space layout randomization (ASLR) to protect its memory from unauthorized
    code execution.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'Some adversaries launch attacks with the intent of executing code in nonexecutable regions of memory
    or in memory locations that are prohibited. Security safeguards employed to protect memory include, for example,
    data execution prevention and address space layout randomization. Data execution prevention safeguards can be
    either hardware-enforced or software-enforced with hardware providing the greater strength of mechanism. Examples
    of attacks are buffer overflow attacks. The sysctl --system command will load settings from all system configuration
    files. All configuration files are sorted by their filename in lexicographical order, regardless of the directories
    in which they reside. If multiple files specify the same option, the entry in the file with the lexicographically
    latest name will take precedence. Files are read from directories in the following list from top to bottom.
    Once a file of a given filename is loaded, any file of the same name in subsequent directories is ignored. /etc/sysctl.d/*.conf
    /run/sysctl.d/*.conf /usr/local/lib/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf /lib/sysctl.d/*.conf /etc/sysctl.conf
    Satisfies: SRG-OS-000433-GPOS-00193, SRG-OS-000480-GPOS-00227'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-213070
  - scheme: vulnerability
    value: V-257809
  - scheme: cci
    value: CCI-002824
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to implement ASLR. $ echo ''kernel.randomize_va_space = 2'' | sudo tee /etc/sysctl.d/99-kernel_randomize_va_space.conf
      Remove any configurations that conflict with the above from the following locations: /run/sysctl.d/*.conf
      /usr/local/lib/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf /lib/sysctl.d/*.conf /etc/sysctl.conf /etc/sysctl.d/*.conf
      Issue the following command to make the changes take effect: $ sudo sysctl --system'
