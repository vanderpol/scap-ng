rule:
  id: SV-258169
  version: r991556
  title: RHEL 9 must produce audit records containing information to establish the identity of any individual or
    process associated with the event.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'Without establishing what type of events occurred, the source of events, where events occurred, and
    the outcome of events, it would be difficult to establish, correlate, and investigate the events leading up
    to an outage or attack. Audit record content that may be necessary to satisfy this requirement includes, for
    example, time stamps, source and destination addresses, user/process identifiers, event descriptions, success/fail
    indications, filenames involved, and access control or flow control rules invoked. Enriched logging aids in
    making sense of who, what, and when events occur on a system. Without this, determining root cause of an event
    will be much more difficult. Satisfies: SRG-OS-000255-GPOS-00096, SRG-OS-000480-GPOS-00227'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-653100
  - scheme: vulnerability
    value: V-258169
  - scheme: cci
    value: CCI-000366
  - scheme: cci
    value: CCI-001487
  references:
