  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Edit the /etc/audit/auditd.conf file and add or update the "log_format" option: log_format = ENRICHED
      The audit daemon must be restarted for changes to take effect.'
