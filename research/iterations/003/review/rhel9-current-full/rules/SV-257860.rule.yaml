rule:
  id: SV-257860
  version: r1044940
  title: RHEL 9 must mount /boot with the nodev option.
  severity: medium
  role: full
  weight: 10.0
  discussion: The only legitimate location for device files is the "/dev" directory located on the root partition.
    The only exception to this is chroot jails.
