rule:
  id: SV-258069
  version: r958398
  title: RHEL 9 must limit the number of concurrent sessions to ten for all accounts and/or account types.
  severity: low
  role: full
  weight: 10.0
  discussion: Operating system management includes the ability to control the number of users and user sessions
    that utilize an operating system. Limiting the number of allowed users and sessions per user is helpful in reducing
    the risks related to denial-of-service (DoS) attacks. This requirement addresses concurrent sessions for information
    system accounts and does not address concurrent sessions by single users via multiple system accounts. The maximum
    number of concurrent sessions must be defined based on mission needs and the operational environment for each
    system.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-412040
  - scheme: vulnerability
    value: V-258069
  - scheme: cci
    value: CCI-000054
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to limit the number of concurrent sessions to "10" for all accounts and/or account
      types. Add the following line to the top of the /etc/security/limits.conf or in a ".conf" file defined in
      /etc/security/limits.d/: * hard maxlogins 10'
  organizational_input_requirements: {}
