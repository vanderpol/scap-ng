rule:
  id: SV-258034
  version: r1051267
  title: RHEL 9 must be configured to disable USB mass storage.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'USB mass storage permits easy introduction of unknown devices, thereby facilitating malicious activity.
    Satisfies: SRG-OS-000114-GPOS-00059, SRG-OS-000378-GPOS-00163, SRG-OS-000480-GPOS-00227'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-291010
  - scheme: vulnerability
    value: V-258034
  - scheme: cci
    value: CCI-000778
  - scheme: cci
    value: CCI-001958
  - scheme: cci
    value: CCI-003959
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'To configure the system to prevent the usb-storage kernel module from being loaded, add the following
      lines to the file "/etc/modprobe.d/usb-storage.conf" (or create "usb-storage.conf" if it does not exist):
      install usb-storage /bin/false blacklist usb-storage'
  organizational_input_requirements: {}
