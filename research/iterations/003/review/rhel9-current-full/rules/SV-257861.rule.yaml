rule:
  id: SV-257861
  version: r1044941
  title: RHEL 9 must prevent files with the setuid and setgid bit set from being executed on the /boot directory.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'The "nosuid" mount option causes the system not to execute "setuid" and "setgid" files with owner
    privileges. This option must be used for mounting any file system not containing approved "setuid" and "setguid"
    files. Executing files from untrusted file systems increases the opportunity for nonprivileged users to attain
    unauthorized administrative access. Satisfies: SRG-OS-000368-GPOS-00154, SRG-OS-000480-GPOS-00227'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-231100
  - scheme: vulnerability
    value: V-257861
  - scheme: cci
    value: CCI-001764
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Modify "/etc/fstab" to use the "nosuid" option on the "/boot" directory.
