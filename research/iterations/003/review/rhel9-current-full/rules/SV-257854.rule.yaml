rule:
  id: SV-257854
  version: r1044934
  title: RHEL 9 must prevent special devices on file systems that are imported via Network File System (NFS).
  severity: medium
  role: full
  weight: 10.0
  discussion: The "nodev" mount option causes the system to not interpret character or block special devices. Executing
    character or block special devices from untrusted file systems increases the opportunity for nonprivileged users
    to attain unauthorized administrative access.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-231065
  - scheme: vulnerability
    value: V-257854
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability:
  - condition.linux-nfs-mounts-configured
  parameters: {}
  remediation:
    guidance: Update each NFS mounted file system to use the "nodev" option on file systems that are being imported
      via NFS.
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-257854.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-257854.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-257854.manual.assessment.yaml
  default_assessment_choice: default
