rule:
  id: SV-258139
  version: r1045276
  title: RHEL 9 must be configured so that the file integrity tool verifies extended attributes.
  severity: low
  role: full
  weight: 10.0
  discussion: RHEL 9 installation media ships with an optional file integrity tool called Advanced Intrusion Detection
    Environment (AIDE). AIDE is highly configurable at install time. This requirement assumes the "aide.conf" file
    is under the "/etc" directory. Extended attributes in file systems are used to contain arbitrary data and file
    metadata with security implications.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-651035
  - scheme: vulnerability
    value: V-258139
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the file integrity tool to check file and directory extended attributes. If AIDE is installed,
      ensure the "xattrs" rule is present on all uncommented file and directory selection lists.
  assessment_choices:
