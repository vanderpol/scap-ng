rule:
  id: SV-258173
  version: r1101933
  title: RHEL 9 must allocate an audit_backlog_limit of sufficient size to capture processes that start prior to
    the audit daemon.
  severity: low
  role: full
  weight: 10.0
  discussion: 'Without the capability to generate audit records, it would be difficult to establish, correlate,
    and investigate the events relating to an incident or identify those responsible for one. If auditing is enabled
    late in the startup process, the actions of some startup processes may not be audited. Some audit systems also
    maintain state information only available if auditing is enabled before a given process is created. Audit records
    can be generated from various components within the information system (e.g., module or policy filter). Allocating
    an audit_backlog_limit of sufficient size is critical in maintaining a stable boot process. With an insufficient
    limit allocated, the system is susceptible to boot failures and crashes. Satisfies: SRG-OS-000254-GPOS-00095,
    SRG-OS-000341-GPOS-00132'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-653120
  - scheme: vulnerability
    value: V-258173
  - scheme: cci
    value: CCI-001464
  - scheme: cci
    value: CCI-001849
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to allocate sufficient audit_backlog_limit to capture processes that start prior
      to the audit daemon with the following command: $ sudo grubby --update-kernel=ALL --args=audit_backlog_limit=8192'
  organizational_input_requirements: {}
