rule:
  id: SV-258038
  version: r1045128
  title: RHEL 9 must block unauthorized peripherals before establishing a connection.
  severity: medium
  role: full
  weight: 10.0
  discussion: The USBguard-daemon is the main component of the USBGuard software framework. It runs as a service
    in the background and enforces the USB device authorization policy for all USB devices. The policy is defined
    by a set of rules using a rule language described in the usbguard-rules.conf file. The policy and the authorization
    state of USB devices can be modified during runtime using the usbguard tool. The system administrator (SA) must
    work with the site information system security officer (ISSO) to determine a list of authorized peripherals
    and establish rules within the USBGuard software framework to allow only authorized devices.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-291030
  - scheme: vulnerability
    value: V-258038
  - scheme: cci
    value: CCI-001958
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability:
  - condition.host-appears-bare-metal-not-virtual
  parameters: {}
  remediation:
    guidance: 'Configure the operating system to enable the blocking of unauthorized peripherals with the following
      command: Note: This command must be run from a root shell and will create an allow list for any usb devices
      currently connected to the system. # usbguard generate-policy --no-hash > /etc/usbguard/rules.conf Note: Enabling
      and starting usbguard without properly configuring it for an individual system will immediately prevent any
      access over a usb device such as a keyboard or mouse.'
  organizational_input_requirements: {}
  assessment_choices:
