rule:
  id: SV-258021
  version: r1015088
  title: RHEL 9 must enable a user session lock until that user re-establishes access using established identification
    and authentication procedures for graphical user sessions.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'A session lock is a temporary action taken when a user stops work and moves away from the immediate
    physical vicinity of the information system but does not want to log out because of the temporary nature of
    the absence. The session lock is implemented at the point where session activity can be determined. Regardless
    of where the session lock is determined and implemented, once invoked, the session lock must remain in place
    until the user reauthenticates. No other activity aside from reauthentication must unlock the system. Satisfies:
    SRG-OS-000028-GPOS-00009, SRG-OS-000030-GPOS-00011'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-271055
  - scheme: vulnerability
    value: V-258021
  - scheme: cci
    value: CCI-000056
  - scheme: cci
    value: CCI-000057
  - scheme: cci
    value: CCI-000058
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to enable a user''s session lock until that user re-establishes access using established
      identification and authentication procedures. Create a database to contain the system-wide screensaver settings
      (if it does not already exist) with the following example: $ sudo vi /etc/dconf/db/local.d/00-screensaver
      Edit the "[org/gnome/desktop/screensaver]" section of the database file and add or update the following lines:
      # Set this to true to lock the screen when the screensaver activates lock-enabled=true Update the system databases:
      $ sudo dconf update'
  organizational_input_requirements: {}
