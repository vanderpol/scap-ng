rule:
  id: SV-258018
  version: r1045090
  title: RHEL 9 must not allow unattended or automatic logon via the graphical user interface.
  severity: high
  role: full
  weight: 10.0
  discussion: Failure to restrict system access to authenticated users negatively impacts operating system security.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-271040
  - scheme: vulnerability
    value: V-258018
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability:
  - condition.gnome-shell-package
  parameters: {}
  remediation:
    guidance: 'Configure the GNOME desktop display manager to disable automatic login. Set AutomaticLoginEnable
      to false in the [daemon] section in /etc/gdm/custom.conf. For example: [daemon] AutomaticLoginEnable=false'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-258018.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-258018.automated.assessment.yaml
