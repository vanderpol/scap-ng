rule:
  id: SV-258126
  version: r1045255
  title: RHEL 9 must have the opensc package installed.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'The use of PIV credentials facilitates standardization and reduces the risk of unauthorized access.
    The DOD has mandated the use of the common access card (CAC) to support identity management and personal authentication
    for systems covered under Homeland Security Presidential Directive (HSPD) 12, as well as making the CAC a primary
    component of layered protection for national security systems. Satisfies: SRG-OS-000375-GPOS-00160, SRG-OS-000376-GPOS-00161'
  rationale: null
