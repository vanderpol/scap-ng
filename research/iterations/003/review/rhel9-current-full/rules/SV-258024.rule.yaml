rule:
  id: SV-258024
  version: r1045100
  title: RHEL 9 must prevent a user from overriding the session idle-delay setting for the graphical user interface.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'A session time-out lock is a temporary action taken when a user stops work and moves away from the
    immediate physical vicinity of the information system but does not logout because of the temporary nature of
    the absence. Rather than relying on the user to manually lock their operating system session prior to vacating
    the vicinity, the GNOME desktop can be configured to identify when a user''s session has idled and take action
    to initiate the session lock. As such, users should not be allowed to change session settings. Satisfies: SRG-OS-000029-GPOS-00010,
    SRG-OS-000031-GPOS-00012'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-271070
  - scheme: vulnerability
    value: V-258024
  - scheme: cci
    value: CCI-000057
  - scheme: cci
    value: CCI-000060
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability:
  - rhel9-stig-current-full.condition.gnome-shell-package
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to prevent a user from overriding settings for graphical user interfaces. Create
      a database to contain the systemwide screensaver settings (if it does not already exist) with the following
      command: Note: The example below is using the database "local" for the system. If the system is using another
      database in "/etc/dconf/profile/user", the file should be created under the appropriate subdirectory. $ sudo
      touch /etc/dconf/db/local.d/locks/session Add the following setting to prevent nonprivileged users from modifying
      it: /org/gnome/desktop/session/idle-delay Run the following command to update the database: $ sudo dconf update'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-258024.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-258024.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-258024.manual.assessment.yaml
  default_assessment_choice: default
