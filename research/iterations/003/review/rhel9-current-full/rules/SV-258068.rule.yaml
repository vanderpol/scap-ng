rule:
  id: SV-258068
  version: r1101950
  title: RHEL 9 must automatically exit interactive command shell user sessions after 10 minutes of inactivity.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'Terminating an idle interactive command shell user session within a short time period reduces the
    window of opportunity for unauthorized personnel to take control of it when left unattended in a virtual terminal
    or physical console. Satisfies: SRG-OS-000163-GPOS-00072, SRG-OS-000029-GPOS-00010'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-412035
  - scheme: vulnerability
    value: V-258068
  - scheme: cci
    value: CCI-000057
  - scheme: cci
    value: CCI-001133
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to exit interactive command shell user sessions after 10 minutes of inactivity.
      Add or edit the following line in "/etc/profile.d/tmout.sh": #!/bin/bash declare -xr TMOUT=600'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-258068.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-258068.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-258068.manual.assessment.yaml
  default_assessment_choice: default
