rule:
  id: SV-257789
  version: r1137691
  title: RHEL 9 must require a unique superusers name upon booting into single-user and maintenance modes.
  severity: high
  role: full
  weight: 10.0
  discussion: Having a nondefault grub superuser username makes password-guessing attacks less effective.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-212020
  - scheme: vulnerability
    value: V-257789
  - scheme: cci
    value: CCI-000213
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to have a unique username for the grub superuser account. Edit the "/etc/grub.d/01_users"
      file and add or modify the following lines with a nondefault username for the superuser account: set superusers="<accountname>"
      export superusers Once the superuser account has been added, update the grub.cfg file by running: In RHEL
      9.0, 9.1 and 9.2: sudo grub2-mkconfig -o /boot/grub2/grub.cfg In RHEL 9.3 and later: sudo grub2-mkconfig -o
      /boot/grub2/grub.cfg --update-bls-cmdline'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-257789.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-257789.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-257789.manual.assessment.yaml
  default_assessment_choice: default
