rule:
  id: SV-257937
  version: r1106310
  title: The RHEL 9 firewall must employ a deny-all, allow-by-exception policy for allowing connections to other
    systems.
  severity: medium
  role: full
  weight: 10.0
  discussion: Failure to restrict network connectivity only to authorized systems permits inbound connections from
    malicious systems. It also permits outbound connections that may facilitate exfiltration of DOD data. RHEL 9
    incorporates the "firewalld" daemon, which allows for many different configurations. One of these configurations
    is zones. Zones can be utilized to a deny-all, allow-by-exception approach. The default "drop" zone will drop
    all incoming network packets unless it is explicitly allowed by the configuration file or is related to an outgoing
    network connection.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-251020
  - scheme: vulnerability
    value: V-257937
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the "firewalld" daemon to employ a deny-all, allow-by-exception policy with the following
      commands: Start by adding the exceptions that are required for mission functionality to the "drop" zone. If
      SSH access on port 22 is needed, for example, run the following: "sudo firewall-cmd --permanent --add-service=ssh
      --zone=drop" Reload the firewall rules to update the runtime configuration from the "--permanent" changes
      made above: $ sudo firewall-cmd --reload Set the default zone to the drop zone: $ sudo firewall-cmd --set-default-zone=drop
      Note: This is a runtime and permanent change. Add any interfaces to the newly modified "drop" zone: $ sudo
      firewall-cmd --permanent --zone=drop --change-interface=ens192 Reload the firewall rules for changes to take
      effect: $ sudo firewall-cmd --reload'
  assessment_choices:
    default:
      assessment: ../assessments/manual/SV-257937.manual.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-257937.manual.assessment.yaml
  default_assessment_choice: default
