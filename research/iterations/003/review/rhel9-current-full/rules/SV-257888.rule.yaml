rule:
  id: SV-257888
  version: r1208771
  title: RHEL 9 permissions of cron configuration files and directories must not be modified from the operating
    system defaults.
  severity: medium
  role: full
  weight: 10.0
  discussion: If the permissions of cron configuration files or directories are modified from the operating system
    defaults, it may be possible for individuals to insert unauthorized cron jobs that perform unauthorized actions,
    including potentially escalating privileges.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-232040
  - scheme: vulnerability
    value: V-257888
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Run the following commands to restore the permissions of cron configuration files and directories
      to the operating system defaults: $ sudo dnf reinstall cronie crontabs $ rpm --setugids cronie crontabs $
      rpm --setperms cronie crontabs'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-257888.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-257888.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-257888.manual.assessment.yaml
  default_assessment_choice: default
