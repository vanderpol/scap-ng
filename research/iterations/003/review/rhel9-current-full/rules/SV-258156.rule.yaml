rule:
  id: SV-258156
  version: r1106364
  title: RHEL 9 must take action when allocated audit record storage volume reaches 75 percent of the repository
    maximum audit record storage capacity.
  severity: medium
  role: full
  weight: 10.0
  discussion: If security personnel are not notified immediately when storage volume reaches a maximum of 75 percent
    utilization, they are unable to plan for audit record storage capacity expansion. The notification can be set
    to trigger at lower utilization thresholds at the information system security officer's (ISSO's) discretion.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-653035
  - scheme: vulnerability
    value: V-258156
  - scheme: cci
    value: CCI-001855
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure RHEL 9 to initiate an action to notify the SA and ISSO (at a minimum) when allocated audit
      record storage volume reaches (at most) 75 percent of the repository maximum audit record storage capacity
      by adding/modifying the following line in the /etc/audit/auditd.conf file. space_left = 25%
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-258156.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-258156.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-258156.manual.assessment.yaml
  default_assessment_choice: default
