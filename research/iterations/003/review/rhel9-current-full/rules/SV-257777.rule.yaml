rule:
  id: SV-257777
  version: r1155676
  title: RHEL 9 must be a vendor-supported release.
  severity: high
  role: full
  weight: 10.0
  discussion: 'An operating system release is considered "supported" if the vendor continues to provide security
    patches for the product. With an unsupported release, it will not be possible to resolve security issues discovered
    in the system software. End Of Life dates for Red Hat Linux 9 releases are as follows: Current end of Full Support
    for Red Hat Linux 9 is 31 May 2027. Current end of Maintenance Support for Red Hat Linux 9 is 31 May 3032. Current
    end of Extended Life Cycle Support (ELS) for Red Hat Linux 9 is 31 May 2035.'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
