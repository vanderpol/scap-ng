rule:
  id: SV-257856
  version: r1044938
  title: RHEL 9 must prevent files with the setuid and setgid bit set from being executed on file systems that are
    imported via Network File System (NFS).
  severity: medium
  role: full
  weight: 10.0
  discussion: The "nosuid" mount option causes the system not to execute "setuid" and "setgid" files with owner
    privileges. This option must be used for mounting any file system not containing approved "setuid" and "setguid"
    files. Executing files from untrusted file systems increases the opportunity for nonprivileged users to attain
    unauthorized administrative access.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-231075
  - scheme: vulnerability
    value: V-257856
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability:
  - condition.linux-nfs-mounts-configured
  parameters: {}
  remediation:
    guidance: Update each NFS mounted file system to use the "nosuid" option on file systems that are being imported
      via NFS.
