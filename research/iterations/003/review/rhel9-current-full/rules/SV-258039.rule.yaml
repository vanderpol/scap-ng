rule:
  id: SV-258039
  version: r1045131
  title: RHEL 9 Bluetooth must be disabled.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'This requirement applies to wireless peripheral technologies (e.g., wireless mice, keyboards, displays,
    etc.) used with RHEL 9 systems. Wireless peripherals (e.g., Wi-Fi/Bluetooth/IR keyboards, mice and pointing
    devices, and near field communications [NFC]) present a unique challenge by creating an open, unsecured port
    on a computer. Wireless peripherals must meet DOD requirements for wireless data transmission and be approved
    for use by the Authorizing Official (AO). Even though some wireless peripherals, such as mice and pointing devices,
    do not ordinarily carry information that need to be protected, modification of communications with these wireless
    peripherals may be used to compromise the RHEL 9 operating system. Satisfies: SRG-OS-000095-GPOS-00049, SRG-OS-000300-GPOS-00118'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-291035
  - scheme: vulnerability
    value: V-258039
  - scheme: cci
    value: CCI-000381
  - scheme: cci
    value: CCI-001443
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to disable the Bluetooth adapter when not in use. Create or modify the "/etc/modprobe.d/bluetooth.conf"
      file with the following lines: install bluetooth /bin/false blacklist bluetooth Reboot the system for the
      settings to take effect.'
