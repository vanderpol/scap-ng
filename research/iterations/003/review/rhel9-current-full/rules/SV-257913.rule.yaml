rule:
  id: SV-257913
  version: r991589
  title: RHEL 9 /etc/shadow- file must be group-owned by root.
  severity: medium
  role: full
  weight: 10.0
  discussion: The "/etc/shadow-" file is a backup file of "/etc/shadow", and as such, contains the list of local
    system accounts and password hashes. Protection of this file is critical for system security.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-232165
  - scheme: vulnerability
    value: V-257913
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Change the group of the file /etc/shadow- to root by running the following command: $ sudo chgrp
      root /etc/shadow-'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-257913.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-257913.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-257913.manual.assessment.yaml
  default_assessment_choice: default
