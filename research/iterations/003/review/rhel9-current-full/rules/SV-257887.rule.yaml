    value: RHEL-09-232035
  - scheme: vulnerability
    value: V-257887
  - scheme: cci
    value: CCI-001493
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the audit tools to have a mode of "0755" by running the following command: $ sudo chmod
      0755 [audit_tool] Replace "[audit_tool]" with each audit tool that has a more permissive mode than 0755.'
