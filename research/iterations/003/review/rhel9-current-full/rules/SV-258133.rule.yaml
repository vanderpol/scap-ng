rule:
  id: SV-258133
  version: r1045263
  title: RHEL 9 must prohibit the use of cached authenticators after one day.
  severity: medium
  role: full
  weight: 10.0
  discussion: If cached authentication information is out-of-date, the validity of the authentication information
    may be questionable.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-631020
  - scheme: vulnerability
    value: V-258133
  - scheme: cci
    value: CCI-002007
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the SSSD to prohibit the use of cached authentications after one day. Edit the file "/etc/sssd/sssd.conf"
      or a configuration file in "/etc/sssd/conf.d" and add or edit the following line just below the line [pam]:
      offline_credentials_expiration = 1'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-258133.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-258133.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-258133.manual.assessment.yaml
  default_assessment_choice: default
