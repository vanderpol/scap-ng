rule:
  id: SV-270174
  version: r1044831
  title: RHEL 9 must display the Standard Mandatory DOD Notice and Consent Banner before granting local or remote
    access to the system via a graphical user logon.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'Display of a standardized and approved use notification before granting access to the operating system
    ensures privacy and security notification verbiage used is consistent with applicable federal laws, Executive
    Orders, directives, policies, regulations, standards, and guidance. System use notifications are required only
    for access via logon interfaces with human users and are not required when such human interfaces do not exist.
    The banner must be formatted in accordance with applicable DOD policy. Use the following verbiage for operating
    systems that can accommodate banners of 1300 characters: "You are accessing a U.S. Government (USG) Information
    System (IS) that is provided for USG-authorized use only. By using this IS (which includes any device attached
    to this IS), you consent to the following conditions: -The USG routinely intercepts and monitors communications
    on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations
    and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations. -At
    any time, the USG may inspect and seize data stored on this IS. -Communications using, or data stored on, this
    IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used
    for any USG-authorized purpose. -This IS includes security measures (e.g., authentication and access controls)
    to protect USG interests--not for your personal benefit or privacy. -Notwithstanding the above, using this IS
    does not constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged
    communications, or work product, related to personal representation or services by attorneys, psychotherapists,
    or clergy, and their assistants. Such communications and work product are private and confidential. See User
    Agreement for details." Satisfies: SRG-OS-000023-GPOS-00006, SRG-OS-000228-GPOS-00088'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-171011
  - scheme: vulnerability
    value: V-270174
  - scheme: cci
    value: CCI-000048
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability:
  - condition.gnome-session-installed
  parameters: {}
  remediation:
    guidance: 'Configure the operating system to display the Standard Mandatory DOD Notice and Consent Banner before
      granting access to the system. Add the following lines to the [org/gnome/login-screen] section of the "/etc/dconf/db/local.d/01-banner-message":
      banner-message-text=''You are accessing a U.S. Government (USG) Information System (IS) that is provided for
      USG-authorized use only.\nBy using this IS (which includes any device attached to this IS), you consent to
      the following conditions:\n-The USG routinely intercepts and monitors communications on this IS for purposes
      including, but not limited to, penetration testing, COMSEC monitoring, network operations and defense, personnel
      misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations.\n-At any time, the USG
      may inspect and seize data stored on this IS.\n-Communications using, or data stored on, this IS are not private,
      are subject to routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized
      purpose.\n-This IS includes security measures (e.g., authentication and access controls) to protect USG interests--not
      for your personal benefit or privacy.\n-Notwithstanding the above, using this IS does not constitute consent
      to PM, LE or CI investigative searching or monitoring of the content of privileged communications, or work
      product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their
      assistants. Such communications and work product are private and confidential. See User Agreement for details.
      '' Note: The "\n " characters are for formatting only. They will not be displayed on the graphical interface.
      Run the following command to update the database: $ sudo dconf update'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-270174.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-270174.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-270174.manual.assessment.yaml
  default_assessment_choice: default
