rule:
  id: SV-257868
  version: r958804
  title: RHEL 9 must mount /tmp with the nosuid option.
  severity: medium
  role: full
  weight: 10.0
  discussion: The "nosuid" mount option causes the system to not execute "setuid" and "setgid" files with owner
    privileges. This option must be used for mounting any file system not containing approved "setuid" and "setguid"
    files. Executing files from untrusted file systems increases the opportunity for nonprivileged users to attain
    unauthorized administrative access.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
