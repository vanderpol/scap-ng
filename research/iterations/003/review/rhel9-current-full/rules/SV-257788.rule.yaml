rule:
  id: SV-257788
  version: r1044838
  title: RHEL 9 must disable the ability of systemd to spawn an interactive boot process.
  severity: medium
  role: full
  weight: 10.0
  discussion: Using interactive or recovery boot, the console user could disable auditing, firewalls, or other services,
    weakening system security.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-212015
  - scheme: vulnerability
    value: V-257788
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the current GRUB 2 configuration to disable the ability of systemd to spawn an interactive
      boot process with the following command: $ sudo grubby --update-kernel=ALL --remove-args="systemd.confirm_spawn"'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-257788.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-257788.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-257788.manual.assessment.yaml
  default_assessment_choice: default
