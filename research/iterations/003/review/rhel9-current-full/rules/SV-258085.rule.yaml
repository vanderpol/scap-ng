rule:
  id: SV-258085
  version: r1045173
  title: RHEL 9 must use the invoking user's password for privilege escalation when using "sudo".
  severity: medium
  role: full
  weight: 10.0
  discussion: If the rootpw, targetpw, or runaspw flags are defined and not disabled, by default the operating system
    will prompt the invoking user for the "root" user password.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-432020
  - scheme: vulnerability
    value: V-258085
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Define the following in the Defaults section of the /etc/sudoers file or a single configuration file
      in the /etc/sudoers.d/ directory: Defaults !targetpw Defaults !rootpw Defaults !runaspw'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-258085.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-258085.automated.assessment.yaml
    manual:
