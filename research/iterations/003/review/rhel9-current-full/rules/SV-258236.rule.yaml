rule:
  id: SV-258236
  version: r1101920
  title: RHEL 9 cryptographic policy must not be overridden.
  severity: high
  role: full
  weight: 10.0
  discussion: 'Centralized cryptographic policies simplify applying secure ciphers across an operating system and
    the applications that run on that operating system. Use of weak or untested encryption algorithms undermines
    the purposes of using encryption to protect data. Satisfies: SRG-OS-000396-GPOS-00176, SRG-OS-000393-GPOS-00173,
    SRG-OS-000394-GPOS-00174'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-672020
  - scheme: vulnerability
    value: V-258236
  - scheme: cci
    value: CCI-002450
  - scheme: cci
    value: CCI-002890
  - scheme: cci
    value: CCI-003123
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to correctly implement the systemwide cryptographic policies by reinstalling the
      crypto-policies package contents. Reinstall crypto-policies with the following command: $ sudo dnf -y reinstall
      crypto-policies Set the crypto-policy to FIPS with the following command: $ sudo update-crypto-policies --set
      FIPS Setting system policy to FIPS Note: Systemwide crypto policies are applied on application startup. It
      is recommended to restart the system for the change of policies to fully take place.'
  organizational_input_requirements: {}
