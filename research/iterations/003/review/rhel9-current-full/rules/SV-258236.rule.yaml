      assessment: ../assessments/automated/SV-258236.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-258236.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-258236.manual.assessment.yaml
  default_assessment_choice: default
