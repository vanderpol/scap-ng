rule:
  id: SV-258213
  version: r1045424
  title: Successful/unsuccessful uses of the reboot command in RHEL 9 must generate an audit record.
  severity: medium
  role: full
  weight: 10.0
  discussion: Misuse of the reboot command may cause availability issues for the system.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-654195
  - scheme: vulnerability
    value: V-258213
  - scheme: cci
    value: CCI-000172
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the audit system to generate an audit event for any successful/unsuccessful uses of the
      "reboot" command by adding or updating the following rule in the "/etc/audit/rules.d/audit.rules" file: -a
      always,exit -F path=/usr/sbin/reboot -F perm=x -F auid>=1000 -F auid!=unset -k privileged-reboot To load the
      rules to the kernel immediately, use the following command: $ sudo augenrules --load'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-258213.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-258213.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-258213.manual.assessment.yaml
  default_assessment_choice: default
