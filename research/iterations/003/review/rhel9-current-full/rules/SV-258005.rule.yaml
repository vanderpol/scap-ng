rule:
  id: SV-258005
  version: r1045069
  title: RHEL 9 SSH daemon must not allow rhosts authentication.
  severity: medium
  role: full
  weight: 10.0
  discussion: SSH trust relationships mean a compromise on one host can allow an attacker to move trivially to other
    hosts.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-255145
  - scheme: vulnerability
    value: V-258005
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the SSH daemon to not allow rhosts authentication. Add the following line to "/etc/ssh/sshd_config"
      or to a file in "/etc/ssh/sshd_config.d", or uncomment the line and set the value to "yes": IgnoreRhosts yes
      The SSH service must be restarted for changes to take effect: $ sudo systemctl restart sshd.service'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-258005.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-258005.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-258005.manual.assessment.yaml
  default_assessment_choice: default
