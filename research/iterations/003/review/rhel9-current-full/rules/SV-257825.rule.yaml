rule:
  id: SV-257825
  version: r1184291
  title: RHEL 9 subscription-manager package must be installed.
  severity: medium
  role: full
  weight: 10.0
  discussion: The Red Hat Subscription Manager application manages software subscriptions and software repositories
    for installed software products on the local system. It communicates with backend servers, such as the Red Hat
    Customer Portal or an on-premise instance of Subscription Asset Manager, to register the local system and grant
    access to software resources determined by the subscription entitlement.
  rationale: null
  extensions:
    disa_stig:
