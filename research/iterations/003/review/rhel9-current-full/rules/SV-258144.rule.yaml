rule:
  id: SV-258144
  version: r1045286
  title: All RHEL 9 remote access methods must be monitored.
  severity: medium
  role: full
  weight: 10.0
  discussion: Logging remote access methods can be used to trace the decrease in the risks associated with remote
    user access management. It can also be used to spot cyberattacks and ensure ongoing compliance with organizational
    policies surrounding the use of remote access methods.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-652030
  - scheme: vulnerability
    value: V-258144
  - scheme: cci
    value: CCI-000067
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Add or update the following lines to the "/etc/rsyslog.conf" file or a file in "/etc/rsyslog.d":
      auth.*;authpriv.*;daemon.* /var/log/secure The "rsyslog" service must be restarted for the changes to take
      effect with the following command: $ sudo systemctl restart rsyslog.service'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-258144.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-258144.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-258144.manual.assessment.yaml
  default_assessment_choice: default
