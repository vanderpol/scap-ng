rule:
  id: SV-258138
  version: r1045274
  title: RHEL 9 must be configured so that the file integrity tool verifies Access Control Lists (ACLs).
  severity: low
  role: full
  weight: 10.0
  discussion: RHEL 9 installation media ships with an optional file integrity tool called Advanced Intrusion Detection
    Environment (AIDE). AIDE is highly configurable at install time. This requirement assumes the "aide.conf" file
    is under the "/etc" directory. ACLs can provide permissions beyond those permitted through the file mode and
    must be verified by the file integrity tools.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-651030
  - scheme: vulnerability
    value: V-258138
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the file integrity tool to check file and directory ACLs. If AIDE is installed, ensure the
      "acl" rule is present on all uncommented file and directory selection lists.
  organizational_input_requirements: {}
