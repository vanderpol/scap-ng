rule:
  id: SV-270176
  version: r1137691
  title: RHEL 9 "/etc/audit/" must be group-owned by root.
  severity: medium
  role: full
  weight: 10.0
  discussion: The "/etc/audit/" directory contains files that ensure the proper auditing of command execution, privilege
    escalation, file manipulation, and more. Protection of this directory is critical for system security.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-232104
  - scheme: vulnerability
    value: V-270176
  - scheme: cci
    value: CCI-000162
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Change the group of the file "/etc/audit/" to "root" by running the following command: $ sudo chgrp
      root /etc/audit/'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-270176.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-270176.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-270176.manual.assessment.yaml
  default_assessment_choice: default
