  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to enable init_on_free with the following command: $ sudo grubby --update-kernel=ALL
      --args="init_on_free=1" Regenerate the GRUB configuration: $ sudo grub2-mkconfig -o /boot/grub2/grub.cfg Reboot
      the system: $ sudo reboot'
