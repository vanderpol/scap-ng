rule:
  id: SV-258170
  version: r991589
  title: RHEL 9 must write audit records to disk.
  severity: medium
  role: full
  weight: 10.0
  discussion: Audit data should be synchronously written to disk to ensure log integrity. This setting assures that
    all audit event data is written disk.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-653105
  - scheme: vulnerability
    value: V-258170
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the audit system to write log files to the disk. Edit the /etc/audit/auditd.conf file and
      add or update the "write_logs" option to "yes": write_logs = yes The audit daemon must be restarted for changes
      to take effect.'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-258170.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-258170.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-258170.manual.assessment.yaml
  default_assessment_choice: default
