rule:
  id: SV-258110
  version: r1045223
  title: RHEL 9 must prevent the use of dictionary words for passwords.
  severity: medium
  role: full
  weight: 10.0
  discussion: Use of a complex password helps to increase the time and resources required to compromise the password.
    Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing
    and brute-force attacks. If RHEL 9 allows the user to select passwords based on dictionary words, this increases
    the chances of password compromise by increasing the opportunity for successful guesses, and brute-force attacks.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-611105
  - scheme: vulnerability
    value: V-258110
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to prevent the use of dictionary words for passwords. Add or update the following
      line in the "/etc/security/pwquality.conf" file or a configuration file in the "/etc/security/pwquality.conf.d/"
      directory to contain the "dictcheck" parameter: dictcheck=1'
  assessment_choices:
