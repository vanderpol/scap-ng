rule:
  id: SV-257956
  version: r991589
  title: There must be no .shosts files on RHEL 9.
  severity: high
  role: full
  weight: 10.0
  discussion: The .shosts files are used to configure host-based authentication for individual users or the system
    via SSH. Host-based authentication is not sufficient for preventing unauthorized access to the system, as it
    does not require interactive identification and authentication of a connection request, or for the use of two-factor
    authentication.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-252075
  - scheme: vulnerability
    value: V-257956
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Remove any found ".shosts" files from the system. $ sudo rm /[path]/[to]/[file]/.shosts
  assessment_choices:
