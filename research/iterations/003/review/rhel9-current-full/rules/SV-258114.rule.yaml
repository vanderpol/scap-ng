rule:
  id: SV-258114
  version: r1045235
  title: RHEL 9 must require the maximum number of repeating characters be limited to three when passwords are changed.
  severity: medium
  role: full
  weight: 10.0
  discussion: Use of a complex password helps to increase the time and resources required to compromise the password.
    Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing
    and brute-force attacks. Password complexity is one factor of several that determines how long it takes to crack
    a password. The more complex a password, the greater the number of possible combinations that need to be tested
    before the password is compromised.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-611125
  - scheme: vulnerability
    value: V-258114
  - scheme: cci
    value: CCI-004066
  - scheme: cci
    value: CCI-000195
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to require the change of the number of repeating consecutive characters when passwords
      are changed by setting the "maxrepeat" option. Add or update the following line in the "/etc/security/pwquality.conf"
      file or a configuration file in the "/etc/security/pwquality.conf.d/" directory to contain the "maxrepeat"
      parameter: maxrepeat = 3'
  organizational_input_requirements: {}
