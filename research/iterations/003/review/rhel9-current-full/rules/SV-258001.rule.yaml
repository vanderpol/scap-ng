rule:
  id: SV-258001
  version: r991589
  title: RHEL 9 SSH public host key files must have mode 0644 or less permissive.
  severity: medium
  role: full
  weight: 10.0
  discussion: If a public host key file is modified by an unauthorized user, the SSH service may be compromised.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-255125
  - scheme: vulnerability
    value: V-258001
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Change the mode of public host key files under "/etc/ssh" to "0644" with the following command: $
      sudo chmod 0644 /etc/ssh/*key.pub Restart the SSH daemon for the changes to take effect: $ sudo systemctl
      restart sshd.service'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-258001.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-258001.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-258001.manual.assessment.yaml
  default_assessment_choice: default
