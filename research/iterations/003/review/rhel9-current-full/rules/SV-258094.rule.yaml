rule:
  id: SV-258094
  version: r1045187
  title: RHEL 9 must not allow blank or null passwords.
  severity: high
  role: full
  weight: 10.0
  discussion: If an account has an empty password, anyone could log in and run commands with the privileges of that
    account. Accounts with empty passwords should never be used in operational environments.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-611025
  - scheme: vulnerability
    value: V-258094
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'If PAM is managed with authselect, use the following command to remove instances of "nullok": $ sudo
      authselect enable-feature without-nullok Otherwise, remove any instances of the "nullok" option in the "/etc/pam.d/password-auth"
      and "/etc/pam.d/system-auth" files to prevent logons with empty passwords. Note: Manual changes to the listed
      file may be overwritten by the "authselect" program.'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-258094.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-258094.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-258094.manual.assessment.yaml
  default_assessment_choice: default
