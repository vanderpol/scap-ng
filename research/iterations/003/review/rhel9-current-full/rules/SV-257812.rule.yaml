rule:
  id: SV-257812
  version: r1134897
  title: RHEL 9 must disable core dump backtraces.
  severity: medium
  role: full
  weight: 10.0
  discussion: A core dump includes a memory image taken at the time the operating system terminates an application.
    The memory image could contain sensitive data and is generally useful only for developers or system operators
    trying to debug problems. Enabling core dumps on production systems is not recommended; however, there may be
    overriding operational requirements to enable advanced debugging. Permitting temporary enablement of core dumps
    during such situations must be reviewed through local needs and policy.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-213085
  - scheme: vulnerability
    value: V-257812
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability:
  - condition.kernel-dumps-enabled
  parameters: {}
  remediation:
    guidance: 'Configure the operating system to disable core dump backtraces. Add or modify the following line
      in /etc/systemd/coredump.conf: ProcessSizeMax=0'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-257812.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-257812.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-257812.manual.assessment.yaml
  default_assessment_choice: default
