rule:
  id: SV-257895
  version: r991589
  title: RHEL 9 /etc/passwd file must have mode 0644 or less permissive to prevent unauthorized access.
  severity: medium
  role: full
  weight: 10.0
  discussion: If the "/etc/passwd" file is writable by a group-owner or the world the risk of its compromise is
    increased. The file contains the list of accounts on the system and associated information, and protection of
    this file is critical for system security.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-232075
  - scheme: vulnerability
    value: V-257895
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Change the mode of the file "/etc/passwd" to "0644" by running the following command: $ sudo chmod
      0644 /etc/passwd'
