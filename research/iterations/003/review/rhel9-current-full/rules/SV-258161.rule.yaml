rule:
  id: SV-258161
  version: r958416
  title: RHEL 9 must label all offloaded audit logs before sending them to the central log server.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'Enriched logging is needed to determine who, what, and when events occur on a system. Without this,
    determining root cause of an event will be much more difficult. When audit logs are not labeled before they
    are sent to a central log server, the audit data will not be able to be analyzed and tied back to the correct
    system. Satisfies: SRG-OS-000039-GPOS-00017, SRG-OS-000342-GPOS-00133, SRG-OS-000479-GPOS-00224'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-653060
  - scheme: vulnerability
    value: V-258161
  - scheme: cci
    value: CCI-000132
  - scheme: cci
    value: CCI-001851
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Edit the /etc/audit/auditd.conf file and add or update the "name_format" option: name_format = hostname
      The audit daemon must be restarted for changes to take effect.'
