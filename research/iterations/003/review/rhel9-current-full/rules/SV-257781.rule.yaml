rule:
  id: SV-257781
  version: r991589
  title: The graphical display manager must not be the default target on RHEL 9 unless approved.
  severity: medium
  role: full
  weight: 10.0
  discussion: Unnecessary service packages must not be installed to decrease the attack surface of the system. Graphical
    display managers have a long history of security vulnerabilities and must not be used, unless approved and documented.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-211030
  - scheme: vulnerability
    value: V-257781
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Document the requirement for a graphical user interface with the ISSO or set the default target to
      multi-user with the following command: $ sudo systemctl set-default multi-user.target'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-257781.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-257781.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-257781.manual.assessment.yaml
  default_assessment_choice: default
