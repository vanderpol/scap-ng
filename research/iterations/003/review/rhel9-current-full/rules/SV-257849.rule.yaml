rule:
  id: SV-257849
  version: r1044928
  title: RHEL 9 file system automount function must be disabled unless required.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'An authentication process resists replay attacks if it is impractical to achieve a successful authentication
    by recording and replaying a previous authentication message. Satisfies: SRG-OS-000114-GPOS-00059, SRG-OS-000378-GPOS-00163,
    SRG-OS-000480-GPOS-00227'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-231040
  - scheme: vulnerability
    value: V-257849
  - scheme: cci
    value: CCI-000778
  - scheme: cci
    value: CCI-001958
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability:
  - condition.linux-autofs-installed
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to disable the ability to automount devices. The autofs service can be disabled
      with the following command: $ sudo systemctl mask --now autofs.service'
  organizational_input_requirements: {}
