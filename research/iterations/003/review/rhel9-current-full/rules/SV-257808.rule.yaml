rule:
  id: SV-257808
  version: r1044865
  title: RHEL 9 must disable the Transparent Inter Process Communication (TIPC) kernel module.
  severity: medium
  role: full
  weight: 10.0
  discussion: It is detrimental for operating systems to provide, or install by default, functionality exceeding
    requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore
    may remain unsecured. They increase the risk to the platform by providing additional attack vectors. Failing
    to disconnect unused protocols can result in a system compromise. The Transparent Inter Process Communication
    (TIPC) is a protocol that is specially designed for intra-cluster communication. It can be configured to transmit
    messages either on UDP or directly across Ethernet. Message delivery is sequence guaranteed, loss free and flow
    controlled. Disabling TIPC protects the system against exploitation of any flaws in its implementation.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-213065
  - scheme: vulnerability
    value: V-257808
  - scheme: cci
    value: CCI-000381
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'To configure the system to prevent the tipc kernel module from being loaded, add the following lines
      to the file /etc/modprobe.d/tipc.conf (or create tipc.conf if it does not exist): install tipc /bin/false
      blacklist tipc'
