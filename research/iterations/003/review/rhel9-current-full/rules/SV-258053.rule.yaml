rule:
  id: SV-258053
  version: r1208773
  title: All RHEL 9 local interactive user home directories must be group-owned by the home directory owner's primary
    group.
  severity: medium
  role: full
  weight: 10.0
  discussion: If the Group Identifier (GID) of a local interactive users home directory is not the same as the primary
    GID of the user, this would allow unauthorized access to the users files, and users that share the same group
    may not be able to access files that they legitimately should.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-411070
  - scheme: vulnerability
    value: V-258053
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Change the group owner of a local interactive user''s home directory to the group found in "/etc/passwd".
      To change the group owner of a local interactive user''s home directory, use the following command: Note:
      The example will be for the user "disauser", who has a home directory of "/home/disauser", and has a primary
      group of users. $ sudo chgrp users /home/disauser'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/manual/SV-258053.manual.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-258053.manual.assessment.yaml
  default_assessment_choice: default
