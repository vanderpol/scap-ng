rule:
  id: SV-258046
  version: r991589
  title: RHEL 9 system accounts must not have an interactive login shell.
  severity: medium
  role: full
  weight: 10.0
  discussion: Ensuring shells are not given to system accounts upon login makes it more difficult for attackers
    to make use of system accounts.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-411035
  - scheme: vulnerability
    value: V-258046
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 so that all noninteractive accounts on the system do not have an interactive shell
      assigned to them. If the system account needs a shell assigned for mission operations, document the need with
      the information system security officer (ISSO). Run the following command to disable the interactive shell
      for a specific noninteractive user account: Replace <user> with the user that has a login shell. $ sudo usermod
      --shell /sbin/nologin <user> Do not perform the steps in this section on the root account. Doing so will cause
      the system to become inaccessible.'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-258046.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-258046.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-258046.manual.assessment.yaml
  default_assessment_choice: default
