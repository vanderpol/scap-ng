rule:
  id: SV-258125
  version: r1208775
  title: The pcscd socket on RHEL 9 must be active.
  severity: medium
  role: full
  weight: 10.0
  discussion: The information system ensures that even if the information system is compromised, that compromise
    will not affect credentials stored on the authentication device. The daemon program for pcsc-lite and the MuscleCard
    framework is pcscd. It is a resource manager that coordinates communications with smart card readers and smart
    cards and cryptographic tokens that are connected to the system.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
