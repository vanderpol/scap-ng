    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'To enable the pcscd socket, run the following command: $ sudo systemctl enable --now pcscd.socket'
