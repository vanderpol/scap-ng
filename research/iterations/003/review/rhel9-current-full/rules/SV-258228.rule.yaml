rule:
  id: SV-258228
  version: r991572
  title: RHEL 9 audit system must protect logon UIDs from unauthorized change.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'If modification of login user identifiers (UIDs) is not prevented, they can be changed by nonprivileged
    users and make auditing complicated or impossible. Satisfies: SRG-OS-000462-GPOS-00206, SRG-OS-000475-GPOS-00220,
    SRG-OS-000057-GPOS-00027, SRG-OS-000058-GPOS-00028, SRG-OS-000059-GPOS-00029'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-654270
  - scheme: vulnerability
    value: V-258228
  - scheme: cci
    value: CCI-000162
  - scheme: cci
    value: CCI-000163
  - scheme: cci
    value: CCI-000164
  - scheme: cci
    value: CCI-000172
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 auditing to prevent modification of login UIDs once they are set by adding the following
      line to /etc/audit/rules.d/audit.rules: --loginuid-immutable The audit daemon must be restarted for the changes
      to take effect.'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-258228.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-258228.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-258228.manual.assessment.yaml
  default_assessment_choice: default
