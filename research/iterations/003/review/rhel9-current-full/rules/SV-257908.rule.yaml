rule:
  id: SV-257908
  version: r991589
  title: RHEL 9 /etc/passwd- file must be owned by root.
  severity: medium
  role: full
  weight: 10.0
  discussion: The "/etc/passwd-" file is a backup file of "/etc/passwd", and as such, contains information about
    the users that are configured on the system. Protection of this file is critical for system security.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-232140
  - scheme: vulnerability
    value: V-257908
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Change the owner of the file /etc/passwd- to root by running the following command: $ sudo chown
      root /etc/passwd-'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-257908.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-257908.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-257908.manual.assessment.yaml
  default_assessment_choice: default
