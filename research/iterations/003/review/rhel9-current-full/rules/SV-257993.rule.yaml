rule:
  id: SV-257993
  version: r1045049
  title: RHEL 9 must not allow users to override SSH environment variables.
  severity: medium
  role: full
  weight: 10.0
  discussion: SSH environment options potentially allow users to bypass access restriction in some configurations.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-255085
  - scheme: vulnerability
    value: V-257993
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the RHEL 9 SSH daemon to not allow unattended or automatic logon to the system by editing
      the following line in the "/etc/ssh/sshd_config" or in a file in "/etc/ssh/sshd_config.d": PermitUserEnvironment
      no Restart the SSH daemon for the setting to take effect: $ sudo systemctl restart sshd.service'
