rule:
  id: SV-258132
  version: r1134929
  title: RHEL 9 must map the authenticated identity to the user or group account for PKI-based authentication.
  severity: medium
  role: full
  weight: 10.0
  discussion: Without mapping the certificate used to authenticate to the user account, the ability to determine
    the identity of the individual user or group will not be available for forensic analysis.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-631015
  - scheme: vulnerability
    value: V-258132
  - scheme: cci
    value: CCI-000187
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to map the authenticated identity to the user or group account by adding or modifying
      the certmap section of the "/etc/sssd/sssd.conf" file based on the following example: [certmap/testing.test/rule_name]
      matchrule = .*EDIPI@mil maprule = (userCertificate;binary={cert!bin}) domains = testing.test The "sssd" service
      must be restarted for the changes to take effect. To restart the "sssd" service, run the following command:
      $ sudo systemctl restart sssd.service'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/manual/SV-258132.manual.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-258132.manual.assessment.yaml
  default_assessment_choice: default
