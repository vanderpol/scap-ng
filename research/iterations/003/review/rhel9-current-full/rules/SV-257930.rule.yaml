rule:
  id: SV-257930
  version: r991589
  title: All RHEL 9 local files and directories must have a valid group owner.
  severity: medium
  role: full
  weight: 10.0
  discussion: Files without a valid group owner may be unintentionally inherited if a group is assigned the same
    Group Identifier (GID) as the GID of the files without a valid group owner.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-232250
  - scheme: vulnerability
    value: V-257930
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Either remove all files and directories from RHEL 9 that do not have a valid group, or assign a valid
      group to all files and directories on the system with the "chgrp" command: $ sudo chgrp <group> <file>'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-257930.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-257930.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-257930.manual.assessment.yaml
  default_assessment_choice: default
