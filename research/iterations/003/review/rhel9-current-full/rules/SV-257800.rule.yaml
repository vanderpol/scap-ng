rule:
  id: SV-257800
  version: r1198253
  title: RHEL 9 must restrict exposed kernel pointer addresses access.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'It is detrimental for operating systems to provide, or install by default, functionality exceeding
    requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore
    may remain unsecured. They increase the risk to the platform by providing additional attack vectors. The sysctl
    --system command will load settings from all system configuration files. All configuration files are sorted
    by their filename in lexicographical order, regardless of the directories in which they reside. If multiple
    files specify the same option, the entry in the file with the lexicographically latest name will take precedence.
    Files are read from directories in the following list from top to bottom. Once a file of a given filename is
    loaded, any file of the same name in subsequent directories is ignored. /etc/sysctl.d/*.conf /run/sysctl.d/*.conf
    /usr/local/lib/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf /lib/sysctl.d/*.conf /etc/sysctl.conf Satisfies: SRG-OS-000132-GPOS-00067,
    SRG-OS-000433-GPOS-00192, SRG-OS-000480-GPOS-00227'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-213025
  - scheme: vulnerability
    value: V-257800
  - scheme: cci
    value: CCI-001082
  - scheme: cci
    value: CCI-002824
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to restrict exposed kernel pointer addresses access. Create a drop-in if it does
      not already exist: $ sudo vi /etc/sysctl.d/99-kernel_kptr_restrict.conf Add the following to the file: kernel.kptr_restrict
      = 1 Reload settings from all system configuration files with the following command: $ sudo sysctl --system'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-257800.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-257800.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-257800.manual.assessment.yaml
  default_assessment_choice: default
