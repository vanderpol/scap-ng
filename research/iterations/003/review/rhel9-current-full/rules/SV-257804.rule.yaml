rule:
  id: SV-257804
  version: r1044853
  title: RHEL 9 must be configured to disable the Asynchronous Transfer Mode kernel module.
  severity: medium
  role: full
  weight: 10.0
  discussion: Disabling Asynchronous Transfer Mode (ATM) protects the system against exploitation of any flaws in
    its implementation.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-213045
  - scheme: vulnerability
    value: V-257804
  - scheme: cci
    value: CCI-000381
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'To configure the system to prevent the atm kernel module from being loaded, add the following line
      to the file /etc/modprobe.d/atm.conf (or create atm.conf if it does not exist): install atm /bin/false blacklist
      atm'
  organizational_input_requirements: {}
