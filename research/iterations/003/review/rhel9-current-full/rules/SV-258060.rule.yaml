rule:
  id: SV-258060
  version: r1045150
  title: RHEL 9 must ensure account lockouts persist.
  severity: medium
  role: full
  weight: 10.0
  discussion: Having lockouts persist across reboots ensures that account is only unlocked by an administrator.
    If the lockouts did not persist across reboots, an attacker could simply reboot the system to continue brute
    force attacks against the accounts on the system.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-411105
  - scheme: vulnerability
    value: V-258060
  - scheme: cci
    value: CCI-000044
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 maintain the contents of the faillock directory after a reboot. Add/modify the "/etc/security/faillock.conf"
      file to match the following line: dir = /var/log/faillock'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-258060.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-258060.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-258060.manual.assessment.yaml
  default_assessment_choice: default
