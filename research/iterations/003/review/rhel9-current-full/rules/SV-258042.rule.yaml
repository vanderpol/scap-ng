rule:
  id: SV-258042
  version: r1045133
  title: RHEL 9 user account passwords must have a 60-day maximum password lifetime restriction.
  severity: medium
  role: full
  weight: 10.0
  discussion: Any password, no matter how complex, can eventually be cracked; therefore, passwords need to be changed
    periodically. If RHEL 9 does not limit the lifetime of passwords and force users to change their passwords,
    there is the risk that RHEL 9 passwords could be compromised.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-411015
  - scheme: vulnerability
    value: V-258042
  - scheme: cci
    value: CCI-004066
  - scheme: cci
    value: CCI-000199
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure noncompliant accounts to enforce a 60-day maximum password lifetime restriction. passwd
      -x 60 [user]
