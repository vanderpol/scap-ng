rule:
  id: SV-258057
  version: r1045146
  title: RHEL 9 must maintain an account lock until the locked account is released by an administrator.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'By limiting the number of failed logon attempts the risk of unauthorized system access via user password
    guessing, otherwise known as brute-forcing, is reduced. Limits are imposed by locking the account. Satisfies:
    SRG-OS-000329-GPOS-00128, SRG-OS-000021-GPOS-00005'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-411090
  - scheme: vulnerability
    value: V-258057
  - scheme: cci
    value: CCI-000044
  - scheme: cci
    value: CCI-002238
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to lock an account until released by an administrator after three unsuccessful logon
      attempts with the command: $ sudo authselect enable-feature with-faillock Edit the "/etc/security/faillock.conf"
      file as follows: unlock_time = 0'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-258057.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-258057.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-258057.manual.assessment.yaml
  default_assessment_choice: default
