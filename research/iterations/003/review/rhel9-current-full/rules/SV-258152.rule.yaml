rule:
  id: SV-258152
  version: r1015127
  title: RHEL 9 audit service must be enabled.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'Without establishing what type of events occurred, it would be difficult to establish, correlate,
    and investigate the events leading up to an outage or attack. Ensuring the "auditd" service is active ensures
    audit records generated by the kernel are appropriately recorded. Additionally, a properly configured audit
    subsystem ensures that actions of individual system users can be uniquely traced to those users so they can
    be held accountable for their actions. Satisfies: SRG-OS-000062-GPOS-00031, SRG-OS-000037-GPOS-00015, SRG-OS-000038-GPOS-00016,
    SRG-OS-000039-GPOS-00017, SRG-OS-000040-GPOS-00018, SRG-OS-000041-GPOS-00019, SRG-OS-000042-GPOS-00021, SRG-OS-000051-GPOS-00024,
    SRG-OS-000054-GPOS-00025, SRG-OS-000122-GPOS-00063, SRG-OS-000254-GPOS-00095, SRG-OS-000255-GPOS-00096, SRG-OS-000337-GPOS-00129,
    SRG-OS-000348-GPOS-00136, SRG-OS-000349-GPOS-00137, SRG-OS-000350-GPOS-00138, SRG-OS-000351-GPOS-00139, SRG-OS-000352-GPOS-00140,
    SRG-OS-000353-GPOS-00141, SRG-OS-000354-GPOS-00142, SRG-OS-000358-GPOS-00145, SRG-OS-000365-GPOS-00152, SRG-OS-000392-GPOS-00172,
    SRG-OS-000475-GPOS-00220'
