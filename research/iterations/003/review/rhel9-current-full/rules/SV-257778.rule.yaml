rule:
  id: SV-257778
  version: r1134892
  title: RHEL 9 vendor packaged system security patches and updates must be installed and up to date.
  severity: medium
  role: full
  weight: 10.0
  discussion: Installing software updates is a fundamental mitigation against the exploitation of publicly known
    vulnerabilities. If the most recent security patches and updates are not installed, unauthorized users may take
    advantage of weaknesses in the unpatched software. The lack of prompt attention to patching could result in
    a system compromise.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-211015
  - scheme: vulnerability
    value: V-257778
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Install RHEL 9 security patches and updates at the organizationally defined frequency. If system
      updates are installed via a centralized repository that is configured on the system, all updates can be installed
      with the following command: $ sudo dnf update'
  assessment_choices:
    default:
      assessment: ../assessments/manual/SV-257778.manual.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-257778.manual.assessment.yaml
  default_assessment_choice: default
