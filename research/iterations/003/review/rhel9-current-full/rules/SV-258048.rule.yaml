rule:
  id: SV-258048
  version: r1069380
  title: All RHEL 9 interactive users must have a primary group that exists.
  severity: medium
  role: full
  weight: 10.0
  discussion: If a user is assigned the Group Identifier (GID) of a group that does not exist on the system, and
    a group with the GID is subsequently created, the user may have unintended rights to any files associated with
    the group.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-411045
  - scheme: vulnerability
    value: V-258048
  - scheme: cci
    value: CCI-000764
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the system so that all GIDs are referenced in "/etc/passwd" are defined in "/etc/group".
      Edit the file "/etc/passwd" and ensure that every user's GID is a valid GID.
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-258048.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-258048.automated.assessment.yaml
    manual:
