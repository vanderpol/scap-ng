rule:
  id: SV-257997
  version: r1069370
  title: RHEL 9 SSH server configuration file must be group-owned by root.
  severity: medium
  role: full
  weight: 10.0
  discussion: Service configuration files enable or disable features of their respective services, which if configured
    incorrectly, can lead to insecure and vulnerable configurations. Therefore, service configuration files must
    be owned by the correct group to prevent unauthorized changes.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-255105
  - scheme: vulnerability
    value: V-257997
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the "/etc/ssh/sshd_config" file and the contents of "/etc/ssh/sshd_config.d" to be group-owned
      by root with the following command: $ sudo chgrp root /etc/ssh/sshd_config /etc/ssh/sshd_config.d'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-257997.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-257997.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-257997.manual.assessment.yaml
  default_assessment_choice: default
