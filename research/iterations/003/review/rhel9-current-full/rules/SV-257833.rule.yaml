rule:
  id: SV-257833
  version: r1044902
  title: RHEL 9 must not have the iprutils package installed.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'It is detrimental for operating systems to provide, or install by default, functionality exceeding
    requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore
    may remain unsecured. They increase the risk to the platform by providing additional attack vectors. Operating
    systems are capable of providing a wide variety of functions and services. Some of the functions and services,
    provided by default, may not be necessary to support essential organizational operations (e.g., key missions,
    functions). The iprutils package provides a suite of utilities to manage and configure SCSI devices supported
    by the ipr SCSI storage device driver. Satisfies: SRG-OS-000095-GPOS-00049, SRG-OS-000480-GPOS-00227'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-215050
  - scheme: vulnerability
    value: V-257833
  - scheme: cci
    value: CCI-000381
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Remove the iprutils package with the following command: $ sudo dnf remove iprutils'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-257833.automated.assessment.yaml
    automated:
