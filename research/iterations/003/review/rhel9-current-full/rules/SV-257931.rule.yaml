rule:
  id: SV-257931
  version: r991589
  title: All RHEL 9 local files and directories must have a valid owner.
  severity: medium
  role: full
  weight: 10.0
  discussion: Unowned files and directories may be unintentionally inherited if a user is assigned the same user
    identifier "UID" as the UID of the unowned files.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-232255
  - scheme: vulnerability
    value: V-257931
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Either remove all files and directories from the system that do not have a valid user, or assign
      a valid user to all unowned files and directories on RHEL 9 with the "chown" command: $ sudo chown <user>
      <file>'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-257931.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-257931.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-257931.manual.assessment.yaml
  default_assessment_choice: default
