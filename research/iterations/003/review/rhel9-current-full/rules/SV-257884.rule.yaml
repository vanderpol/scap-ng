rule:
  id: SV-257884
  version: r1106306
  title: RHEL 9 library files must have mode 755 or less permissive.
  severity: medium
  role: full
  weight: 10.0
  discussion: If RHEL 9 allowed any user to make changes to software libraries, then those changes might be implemented
    without undergoing the appropriate testing and approvals that are part of a robust change management process.
    This requirement applies to RHEL 9 with software libraries that are accessible and configurable, as in the case
    of interpreted languages. Software libraries also include privileged programs that execute with escalated privileges.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-232020
  - scheme: vulnerability
    value: V-257884
  - scheme: cci
    value: CCI-001499
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the systemwide shared library files contained in the directories "/lib", "/lib64", "/usr/lib",
      and "/usr/lib64" to have mode 0755 or less permissive with the following command. $ sudo find /lib /lib64
      /usr/lib /usr/lib64 -type f -name '*.so*' -perm /022 -exec chmod go-w {} +
  organizational_input_requirements: {}
