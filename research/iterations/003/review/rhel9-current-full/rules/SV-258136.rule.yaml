rule:
  id: SV-258136
  version: r1045270
  title: RHEL 9 must use a file integrity tool that is configured to use FIPS 140-3-approved cryptographic hashes
    for validating file contents and directories.
  severity: medium
  role: full
  weight: 10.0
  discussion: RHEL 9 installation media ships with an optional file integrity tool called Advanced Intrusion Detection
    Environment (AIDE). AIDE is highly configurable at install time. This requirement assumes the "aide.conf" file
    is under the "/etc" directory. File integrity tools use cryptographic hashes for verifying file contents and
    directories have not been altered. These hashes must be FIPS 140-3-approved cryptographic hashes.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-651020
  - scheme: vulnerability
    value: V-258136
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the file integrity tool to use FIPS 140-3 cryptographic hashes for validating file and directory
      contents. If AIDE is installed, ensure the "sha512" rule is present on all uncommented file and directory
      selection lists. Exclude any log files, or files expected to change frequently, to reduce unnecessary notifications.
  assessment_choices:
    default:
      assessment: ../assessments/manual/SV-258136.manual.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-258136.manual.assessment.yaml
  default_assessment_choice: default
