rule:
  id: SV-258154
  version: r1038966
  title: RHEL 9 audit system must take appropriate action when the audit storage volume is full.
  severity: medium
  role: full
  weight: 10.0
  discussion: It is critical that when the operating system is at risk of failing to process audit logs as required,
    it takes action to mitigate the failure. Audit processing failures include software/hardware errors; failures
    in the audit capturing mechanisms; and audit storage capacity being reached or exceeded. Responses to audit
    failure depend upon the nature of the failure mode.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-653025
  - scheme: vulnerability
    value: V-258154
  - scheme: cci
    value: CCI-000140
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to shut down by default upon audit failure (unless availability is an overriding
      concern). Add or update the following line (depending on configuration "disk_full_action" can be set to "SYSLOG"
      or "SINGLE" depending on configuration) in "/etc/audit/auditd.conf" file: disk_full_action = HALT If availability
      has been determined to be more important, and this decision is documented with the information system security
      officer (ISSO), configure the operating system to notify SA staff and ISSO staff in the event of an audit
      processing failure by setting the "disk_full_action" to "SYSLOG".'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-258154.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-258154.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-258154.manual.assessment.yaml
  default_assessment_choice: default
