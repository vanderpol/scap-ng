rule:
  id: SV-258227
  version: r1014992
  title: RHEL 9 must take appropriate action when a critical audit processing failure occurs.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'It is critical for the appropriate personnel to be aware if a system is at risk of failing to process
    audit logs as required. Without this notification, the security personnel may be unaware of an impending failure
    of the audit capability, and system operation may be adversely affected. Audit processing failures include software/hardware
    errors, failures in the audit capturing mechanisms, and audit storage capacity being reached or exceeded. Satisfies:
    SRG-OS-000046-GPOS-00022, SRG-OS-000047-GPOS-00023'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-654265
  - scheme: vulnerability
    value: V-258227
  - scheme: cci
    value: CCI-000139
  - scheme: cci
    value: CCI-000140
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to shut down when auditing failures occur. Add the following line to the bottom
      of the /etc/audit/rules.d/audit.rules file: -f 2'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-258227.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-258227.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-258227.manual.assessment.yaml
  default_assessment_choice: default
