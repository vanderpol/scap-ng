  version: 1
  assessment_title: Windows Server 2019 must have a host-based intrusion detection and prevention service installed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Determine if there is a HIDS and HIPS on each server. A HIDS device is not required on a system that has the
    role as the Network Intrusion Device (NID). However, this exception needs to be documented with the information system
    security officer (ISSO). If a HIDS and HIPS are not installed on the system, this is a finding.
  inputs: {}
