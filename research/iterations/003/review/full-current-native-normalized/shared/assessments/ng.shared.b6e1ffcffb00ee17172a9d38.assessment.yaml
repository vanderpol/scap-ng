assessment:
  id: ng.shared.b6e1ffcffb00ee17172a9d38
  version: 1
  assessment_title: WN19-SO-000260 - Windows Server 2019 services using Local System that use Negotiate when reverting to
    NTLM authentication must use the computer identity instead of authenticating anonymously.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Control\LSA
        name:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: UseMachineId
  tests:
    test-network-security-allow-local-system-use-computer-identity-ntlm-set:
      test_title: '''Network security: Allow Local System to use computer identity for NTLM'' is set to ''Enabled''.'
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-network-security-allow-local-system-use-computer-identity-ntlm-set
