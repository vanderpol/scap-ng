assessment:
  id: ng.shared.9aa3a49bb217b822dc93e90e
  version: 1
  assessment_title: WN19-DC-000401 - Windows Server 2019 must be configured for name-based strong mappings for certificates.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: Software\Microsoft\Windows\CurrentVersion\Policies\System\KDC\Parameters
        name:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: UseStrongNameMatches
  tests:
    test-usestrongnamematches-1:
      test_title: UseStrongNameMatches == 1
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-usestrongnamematches-1
