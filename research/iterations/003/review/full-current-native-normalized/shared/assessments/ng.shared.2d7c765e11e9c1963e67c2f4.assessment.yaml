assessment:
  id: ng.shared.2d7c765e11e9c1963e67c2f4
  version: 1
  assessment_title: AZLX-23-002065 - Amazon Linux 2023 must authenticate the remote logging server for off-loading audit logs
    via rsyslog.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    rsyslog-conf-actionsendstreamdriverauthmode-collection:
      collection_title: 'rsyslog.conf: ActionSendStreamDriverAuthMode'
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/rsyslog.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\$ActionSendStreamDriverAuthMode\s+(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
    rsyslog-d-conf-actionsendstreamdriverauthmode-collection:
      collection_title: 'rsyslog.d/*.conf: ActionSendStreamDriverAuthMode'
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/rsyslog.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^.*\.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\$ActionSendStreamDriverAuthMode\s+(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
    actionsendstreamdriverauthmode-collection:
      collection_title: ActionSendStreamDriverAuthMode
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - collection: rsyslog-conf-actionsendstreamdriverauthmode-collection
        - collection: rsyslog-d-conf-actionsendstreamdriverauthmode-collection
  tests:
    test-actionsendstreamdriverauthmode-x509-name:
      test_title: ActionSendStreamDriverAuthMode == x509/name
      capability: independent.textfilecontent54
      collection: actionsendstreamdriverauthmode-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: x509/name
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-actionsendstreamdriverauthmode-x509-name
