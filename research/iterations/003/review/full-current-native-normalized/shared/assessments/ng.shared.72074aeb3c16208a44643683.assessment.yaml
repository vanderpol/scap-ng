assessment:
  id: ng.shared.72074aeb3c16208a44643683
  version: 1
  assessment_title: WN10-CC-000145 - Users must be prompted for a password on resume from sleep (on battery).
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Power\PowerSettings\0e796bdb-100d-47d6-a2d5-f7d2daa51f51
        name:
          operation: equals
          datatype: string
          mask: false
          value: DCSettingIndex
  tests:
    test-require-password-when-computer-wakes-on-battery-set-enabled:
      test_title: '''Require a password when a computer wakes (on battery)'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-require-password-when-computer-wakes-on-battery-set-enabled
