assessment:
  id: ng.shared.9395298d45a9a2642a0c53cc
  version: 1
  assessment_title: The macOS system must be configured to disable Internet Sharing.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    system-settings-internet-sharing-disable-recommended-object-collection:
      collection_title: system_settings_internet_sharing_disable_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.MCX'')\

            .objectForKey(''forceInternetSharingOff'').js

            EOS'
  tests:
    test-system-settings-internet-sharing-disable-recommended-test:
      test_title: system_settings_internet_sharing_disable_recommended_test
      capability: independent.shellcommand
      collection: system-settings-internet-sharing-disable-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: system_settings_internet_sharing_disable_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: 'true'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-system-settings-internet-sharing-disable-recommended-test
