assessment:
  id: ng.shared.6b3d0f269bccd932c5c6254b
  version: 1
  assessment_title: Duplicate Group IDs (GIDs) must not exist for multiple groups.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The root role is required. Check that group IDs are unique. # getent group | cut -f3 -d":" | sort -n | uniq
    -c |\ while read x ; do [ -z "${x}" ] && break set - $x if [ $1 -gt 1 ]; then grps=`getent group | nawk -F: ''($3 == n)
    { print $1 }'' n=$2 | xargs` echo "Duplicate GID ($2): ${grps}" fi done If output is produced, this is a finding.'
  inputs: []
  evidence: []
