assessment:
  id: ng.shared.b3c9b01e9d8a3cefc184e940
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that all network connections associated with SSH
    traffic are terminated after 10 minutes of becoming unresponsive.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the SSH server automatically terminates a user session after the SSH client has been unresponsive for
    10 minutes. Check for the value of the "ClientAliveInterval" keyword with the following command: # grep -iw clientaliveinterval
    /etc/ssh/sshd_config ClientAliveInterval 600 If "ClientAliveInterval" is not configured, is commented out, or has a value
    of "0", this is a finding. If "ClientAliveInterval" has a value that is greater than "600" and is not documented with
    the information system security officer (ISSO) as an operational requirement, this is a finding.'
  inputs: []
  evidence: []
