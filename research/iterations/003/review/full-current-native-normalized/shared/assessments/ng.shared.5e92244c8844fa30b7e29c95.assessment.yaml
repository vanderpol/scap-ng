assessment:
  id: ng.shared.5e92244c8844fa30b7e29c95
  version: 1
  assessment_title: All OL 8 world-writable directories must be owned by root, sys, bin, or an application user.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    get-directories-on-local-partitions-that-world-writable-have-uid-collection:
      collection_title: Get directories on local partitions that are world writable and have UID greater than 1000
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
      filters:
      - action: exclude
        match:
          field: owrite
          value: '0'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: Used as filter to exclude owrite of '0'.
        capability: unix.file
      - action: exclude
        match:
          field: user_id
          value: '1000'
          operation: less than
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: Filter out files with UID less than 1000
        capability: unix.file
      behaviors:
        recurse_direction: down
        recurse_file_system: local
        recurse: directories
  tests:
    test-all-world-writable-directories-owned-by-root-sys-bin-or:
      test_title: All world-writable directories must be owned by root, sys, bin, or an application user.
      capability: unix.file
      collection: get-directories-on-local-partitions-that-world-writable-have-uid-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
  evaluate:
    test: test-all-world-writable-directories-owned-by-root-sys-bin-or
