assessment:
  id: ng.shared.10724185c533f8f884b7ea0a
  version: 1
  assessment_title: The macOS system must restrict maximum password lifetime to 60 days.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    pwpolicy-max-lifetime-enforce-stig-object-collection:
      collection_title: pwpolicy_max_lifetime_enforce_stig_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/bin/pwpolicy -getaccountpolicies | /usr/bin/tail +2 | /usr/bin/xmllint --xpath '//dict/key[text()="policyAttributeExpiresEveryNDays"]/following-sibling::*[1]/text()'
            -
  tests:
    test-pwpolicy-max-lifetime-enforce-stig-test:
      test_title: pwpolicy_max_lifetime_enforce_stig_test
      capability: independent.shellcommand
      collection: pwpolicy-max-lifetime-enforce-stig-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: pwpolicy_max_lifetime_enforce_stig_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: '60'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-pwpolicy-max-lifetime-enforce-stig-test
