assessment:
  id: ng.shared.7c5f025d23bf78d6f4ca2bed
  version: 1
  assessment_title: Firefox must be configured to block pop-up windows.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Type "about:policies" in the browser address bar. If "PopupBlocking" is not displayed under Policy Name or the
    Policy Value is not "Default" "true", this is a finding. If "PopupBlocking" is not displayed under Policy Name or the
    Policy Value is not "Locked" "true", this is a finding. "PopupBlocking" "Enabled" may be used to specify an allowlist
    of sites where pop-ups are desired, this is optional.
  inputs: []
  evidence: []
