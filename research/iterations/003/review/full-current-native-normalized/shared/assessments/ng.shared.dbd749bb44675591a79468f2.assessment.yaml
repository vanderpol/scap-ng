assessment:
  id: ng.shared.dbd749bb44675591a79468f2
  version: 1
  assessment_title: The Cisco router must be configured to use at least two authentication servers for the purpose of authenticating
    users prior to granting administrative access.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    iosxe-line-object:
      capability: iosxe.line
      select:
        show_subcommand:
          operation: equals
          datatype: string
          value: show running-config
      object_title: null
    aaa-authentication-login-login-authentication-object:
      capability: iosxe.global
      select:
        global_command:
          operation: pattern match
          datatype: string
          value: ^aaa authentication login LOGIN_AUTHENTICATION
      object_title: aaa authentication login LOGIN_AUTHENTICATION
    aaa-authentication-login-console-object:
      capability: iosxe.global
      select:
        global_command:
          operation: pattern match
          datatype: string
          value: ^aaa authentication login CONSOLE
      object_title: aaa authentication login CONSOLE
    aaa-group-server-name-object:
      capability: iosxe.global
      select:
        global_command:
          operation: pattern match
          datatype: string
          value: ^aaa group server radius
      object_title: aaa group server name
    ip-http-secure-server-disabled-object:
      capability: iosxe.global
      select:
        global_command:
          operation: pattern match
          datatype: string
          value: ^no ip http secure-server
      object_title: ip http secure-server is disabled
    ip-http-authentication-setting-object:
      capability: iosxe.global
      select:
        global_command:
          operation: pattern match
          datatype: string
          value: ^ip http authentication
      object_title: ip http authentication setting
    all-vty-lines-object:
      capability: iosxe.global
      select:
        global_command:
          operation: pattern match
          datatype: string
          value: ^line vty \d+
      object_title: all vty lines
  variables:
    radius-group-name-variable:
      title: Radius Group Name
      kind: local
      datatype: string
      expression:
        regex_capture:
          value:
            values:
              object: aaa-group-server-name-object
              field: global_command
          pattern: aaa group server radius (.+)
    login-authentication-regex-aaa-authentication-group-custom-radius-group-name-variable:
      title: LOGIN_AUTHENTICATION Regex to aaa authentication for group, custom radius group name and local
      kind: local
      datatype: string
      expression:
        concat:
        - literal:
            value: 'aaa authentication login LOGIN_AUTHENTICATION group '
            datatype: string
        - variable: radius-group-name-variable
        - literal:
            value: ' local'
            datatype: string
    console-regex-aaa-authentication-group-custom-radius-group-name-local-variable:
      title: CONSOLE Regex to aaa authentication for group, custom radius group name and local
      kind: local
      datatype: string
      expression:
        concat:
        - literal:
            value: 'aaa authentication login CONSOLE group '
            datatype: string
        - variable: radius-group-name-variable
        - literal:
            value: ' local'
            datatype: string
    number-vty-s-on-system-variable:
      title: Number of vty's on the system
      kind: local
      datatype: int
      expression:
        count:
          values:
            object: all-vty-lines-object
            field: global_command
    regex-match-all-vty-lines-login-authentication-variable:
      title: Regex to match all vty lines to login authentication
      kind: local
      datatype: string
      expression:
        concat:
        - literal:
            value: ((?s)\nline vty \d.+\n.*? login authentication LOGIN_AUTHENTICATION.+){
            datatype: string
        - variable: number-vty-s-on-system-variable
        - literal:
            value: ',}'
            datatype: string
  states:
    state-radius-server-command-in-two-seperate-config-lines-state:
      state_title: radius-server command in two seperate config lines state for IOS
      capability: iosxe.line
      state:
        all:
        - field: show_subcommand
          value: show running-config
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: config_line
          value: \nradius-server host .+\nradius-server host .+
          operation: pattern match
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
    state-verify-aaa-authentication-login-authentication-line-cont:
      state_title: verify aaa authentication LOGIN_AUTHENTICATION line contains group radius and then local
      capability: iosxe.global
      state:
        field: global_command
        value: aaa login-authentication LOGIN_AUTHENTICATION group radius local
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-iosxe-global:
      state_title: null
      capability: iosxe.global
      state:
        field: global_command
        value: aaa authentication CONSOLE group radius local
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-radius-server-command-in-two-separate-config-lines:
      state_title: radius server command in two separate config lines
      capability: iosxe.line
      state:
        all:
        - field: show_subcommand
          value: show running-config
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: config_line
          value: (\nradius server.+\n address.+ipv.+\n.*\n? key.+\n\!){2,}
          operation: pattern match
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
    state-aaa-group-server-radius-defines-a-custom-group-name:
      state_title: aaa group server radius defines a custom group name
      capability: iosxe.global
      state:
        field: global_command
        value: aaa group server radius .+
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-verify-two-server-name-are-defined:
      state_title: verify two 'server name' are defined
      capability: iosxe.line
      state:
        field: config_line
        value: \n\s*server name .+\n\s*server name .+
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-verify-aaa-authentication-line-contains-group-custom-gro:
      state_title: verify aaa authentication line contains group custom group name and then local
      capability: iosxe.global
      state:
        field: global_command
        value:
          variable: login-authentication-regex-aaa-authentication-group-custom-radius-group-name-variable
        operation: pattern match
        datatype: string
        variable_check: all
        entity_check: all
        entity_existence: at_least_one_exists
    state-verify-aaa-authentication-console-line-contains-group-cu:
      state_title: verify aaa authentication CONSOLE line contains group custom group name and then local
      capability: iosxe.global
      state:
        field: global_command
        value:
          variable: console-regex-aaa-authentication-group-custom-radius-group-name-local-variable
        operation: pattern match
        datatype: string
        variable_check: all
        entity_check: all
        entity_existence: at_least_one_exists
    state-tacacs-server-command-in-two-seperate-config-lines-state:
      state_title: tacacs-server command in two seperate config lines state for IOS
      capability: iosxe.line
      state:
        all:
        - field: show_subcommand
          value: show running-config
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: config_line
          value: '\ntacacs-server host .+\ntacacs-server '
          operation: pattern match
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
    state-iosxe-global-2:
      state_title: null
      capability: iosxe.global
      state:
        field: global_command
        value: aaa login-authentication LOGIN_AUTHENTICATION
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-console-port-is-configured-with-login-authentication-con:
      state_title: console port is configured with login authentication CONSOLE
      capability: iosxe.line
      state:
        all:
        - field: show_subcommand
          value: show running-config
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: config_line
          value: (?s)\nline con \d\n.*? login authentication CONSOLE
          operation: pattern match
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
    state-all-vty-lines-are-configured-with-login-authentication-l:
      state_title: all vty lines are configured with login authentication LOGIN_AUTHENTICATION
      capability: iosxe.line
      state:
        all:
        - field: show_subcommand
          value: show running-config
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: config_line
          value:
            variable: regex-match-all-vty-lines-login-authentication-variable
          operation: pattern match
          datatype: string
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-check-two-radius-server-hosts:
      test_title: Check for two radius-server hosts
      capability: iosxe.line
      object: iosxe-line-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-radius-server-command-in-two-seperate-config-lines-state
    test-aaa-authentication-login-login-authentication-enabled-configured-group-radius-local:
      test_title: aaa authentication login LOGIN_AUTHENTICATION is enabled and configured to 'group radius and local'
      capability: iosxe.global
      object: aaa-authentication-login-login-authentication-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-verify-aaa-authentication-login-authentication-line-cont
    test-aaa-authentication-login-login-authentication-group-radius-local-enabled:
      test_title: aaa authentication login LOGIN_AUTHENTICATION group radius local is enabled
      capability: iosxe.global
      object: aaa-authentication-login-console-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-iosxe-global
    test-check-two-radius-servers:
      test_title: Check for two radius servers
      capability: iosxe.line
      object: iosxe-line-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-radius-server-command-in-two-separate-config-lines
    test-aaa-group-server-radius-defined:
      test_title: aaa group server radius defined'
      capability: iosxe.global
      object: aaa-group-server-name-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-aaa-group-server-radius-defines-a-custom-group-name
    test-check-two-radius-group-server-name:
      test_title: Check for two radius group 'server name'
      capability: iosxe.line
      object: iosxe-line-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-verify-two-server-name-are-defined
    test-aaa-authentication-login-login-authentication-enabled-configured-group-custom-group:
      test_title: aaa authentication login LOGIN_AUTHENTICATION is enabled and configured to 'group <custom group name> local'
      capability: iosxe.global
      object: aaa-authentication-login-login-authentication-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-verify-aaa-authentication-line-contains-group-custom-gro
    test-aaa-authentication-login-login-authentication-group-custom-group-name-local:
      test_title: aaa authentication login LOGIN_AUTHENTICATION group <custom group name> local is enabled
      capability: iosxe.global
      object: aaa-authentication-login-console-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-verify-aaa-authentication-console-line-contains-group-cu
    test-check-two-tacacs-servers:
      test_title: Check for two tacacs-servers
      capability: iosxe.line
      object: iosxe-line-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-tacacs-server-command-in-two-seperate-config-lines-state
    test-ip-http-secure-server-disabled:
      test_title: ip http secure server is disabled
      capability: iosxe.global
      object: ip-http-secure-server-disabled-object
      check_existence: at_least_one_exists
      check: at least one
    test-http-requires-login-authentication-login-authentication:
      test_title: http requires login-authentication LOGIN_AUTHENTICATION
      capability: iosxe.global
      object: ip-http-authentication-setting-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-iosxe-global-2
    test-line-con-0-configured-use-login-authentication-console:
      test_title: line con 0 is configured to use login authentication CONSOLE
      capability: iosxe.line
      object: iosxe-line-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-console-port-is-configured-with-login-authentication-con
    test-all-vty-connections-have-login-authentication-login-authentication:
      test_title: all vty connections must have login authentication LOGIN_AUTHENTICATION
      capability: iosxe.line
      object: iosxe-line-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-all-vty-lines-are-configured-with-login-authentication-l
  evaluate:
    all:
    - any:
      - all:
        - test: test-check-two-radius-server-hosts
        - test: test-aaa-authentication-login-login-authentication-enabled-configured-group-radius-local
        - test: test-aaa-authentication-login-login-authentication-group-radius-local-enabled
      - all:
        - test: test-check-two-radius-servers
        - test: test-aaa-group-server-radius-defined
        - test: test-check-two-radius-group-server-name
        - test: test-aaa-authentication-login-login-authentication-enabled-configured-group-custom-group
        - test: test-aaa-authentication-login-login-authentication-group-custom-group-name-local
      - all:
        - test: test-check-two-tacacs-servers
        - test: test-check-two-tacacs-servers
    - any:
      - test: test-ip-http-secure-server-disabled
      - test: test-http-requires-login-authentication-login-authentication
    - test: test-line-con-0-configured-use-login-authentication-console
    - test: test-all-vty-connections-have-login-authentication-login-authentication
