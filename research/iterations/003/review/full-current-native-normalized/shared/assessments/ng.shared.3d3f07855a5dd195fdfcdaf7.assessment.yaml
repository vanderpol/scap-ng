  assessment_title: Windows Server 2019 domain controllers must be configured to allow reset of machine account passwords.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This applies to domain controllers. It is NA for other systems. If the following registry value does not exist
    or is not configured as specified, this is a finding: Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\
    Value Name: RefusePasswordChange Value Type: REG_DWORD Value: 0x00000000 (0)'
