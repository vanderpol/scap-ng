assessment:
  id: ng.shared.b70d3f98ba62ee7ee320c5ed
  version: 1
  assessment_title: UBTU-22-255025 - Ubuntu 22.04 LTS must not allow unattended or automatic login via SSH.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(?i)\s*PermitEmptyPasswords\s+(\w+)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-textfilecontent54-collection-2:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .+
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(?i)\s*PermitEmptyPasswords\s+(\w+)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    permitemptypasswords-in-all-sshd-config-sshd-config-d-files-collection:
      collection_title: PermitEmptyPasswords in all sshd_config and sshd_config.d/* files
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - collection: independent-textfilecontent54-collection
        - collection: independent-textfilecontent54-collection-2
    independent-textfilecontent54-collection-4:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(?i)\s*PermitUserEnvironment\s+(\w+)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-textfilecontent54-collection-5:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^.+\.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(?i)\s*PermitUserEnvironment\s+(\w+)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        max_depth: '-1'
        recurse_direction: down
    independent-textfilecontent54-collection-3:
      collection_title: null
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - collection: independent-textfilecontent54-collection-4
        - collection: independent-textfilecontent54-collection-5
  tests:
    test-etc-ssh-sshd-config-or-etc-ssh-sshd-config-d:
      test_title: /etc/ssh/sshd_config or /etc/ssh/sshd_config.d/*:PermitEmptyPasswords == no
      capability: independent.textfilecontent54
      collection: permitemptypasswords-in-all-sshd-config-sshd-config-d-files-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^(no|"no")$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-permituserenvironment-option-not-set-yes-in-etc-ssh-sshd-config:
      test_title: The PermitUserEnvironment option is not set to yes in /etc/ssh/sshd_config and /etc/ssh/sshd_config.d/*.conf.
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection-3
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^(no|"no")$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-etc-ssh-sshd-config-or-etc-ssh-sshd-config-d
    - test: test-permituserenvironment-option-not-set-yes-in-etc-ssh-sshd-config
