assessment:
  id: ng.shared.39153943255da523b12072a4
  version: 1
  assessment_title: User .netrc files must not exist.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    all-accounts-object:
      capability: unix.shadow
      select:
        username:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
      object_title: all accounts
    all-accounts-ps-status-object-2:
      capability: unix.shadow
      set:
        operator: union
        members:
        - object: all-accounts-object
        filters:
        - action: exclude
          state: state-locked-account
        - action: exclude
          state: state-login-account
        - action: exclude
          state: state-up-account-status
        - action: exclude
          state: state-no-password-account-status
      object_title: all accounts with PS status
    all-accounts-ps-status-object:
      capability: unix.password
      select:
        username:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: user-names-ps-status-accounts-variable
      object_title: all accounts with PS status
    netrc-files-in-account-home-directories-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: home-directories-ps-status-accounts-variable
        filename:
          operation: equals
          datatype: string
          mask: false
          value: .netrc
      object_title: .netrc files in account home directories
  variables:
    user-names-ps-status-accounts-variable:
      title: user names for PS status accounts
      kind: local
      datatype: string
      expression:
        values:
          object: all-accounts-ps-status-object-2
          field: username
    home-directories-ps-status-accounts-variable:
      title: home directories for PS status accounts
      kind: local
      datatype: string
      expression:
        values:
          object: all-accounts-ps-status-object
          field: home_dir
  states:
    state-locked-account:
      state_title: Locked account
      capability: unix.shadow
      state:
        field: password
        value: ^\*LK\*
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-login-account:
      state_title: Login account
      capability: unix.shadow
      state:
        field: password
        value: NP
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-up-account-status:
      state_title: UP account status
      capability: unix.shadow
      state:
        field: password
        value: UP
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-no-password-account-status:
      state_title: no password account status
      capability: unix.shadow
      state:
        field: password
        value: ^$
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-netrc-files-do-not-exist:
      test_title: .netrc files do not exist
      capability: unix.file
      object: netrc-files-in-account-home-directories-object
      check_existence: none_exist
      check: all
  evaluate:
    test: test-netrc-files-do-not-exist
