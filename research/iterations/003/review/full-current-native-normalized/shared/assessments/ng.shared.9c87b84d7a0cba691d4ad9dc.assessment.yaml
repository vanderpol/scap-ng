assessment:
  id: ng.shared.9c87b84d7a0cba691d4ad9dc
  version: 1
  assessment_title: The macOS system must audit the enforcement actions used to restrict access associated with changes to
    the system.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    audit-flags-fw-configure-recommended-object-collection:
      collection_title: audit_flags_fw_configure_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/bin/awk -F':' '/^flags/ { print $NF }' /etc/security/audit_control | /usr/bin/tr ',' '\n' | /usr/bin/grep
            -Ec '\-fw'
  tests:
    test-audit-flags-fw-configure-recommended-test:
      test_title: audit_flags_fw_configure_recommended_test
      capability: independent.shellcommand
      collection: audit-flags-fw-configure-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: audit_flags_fw_configure_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: '1'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-audit-flags-fw-configure-recommended-test
