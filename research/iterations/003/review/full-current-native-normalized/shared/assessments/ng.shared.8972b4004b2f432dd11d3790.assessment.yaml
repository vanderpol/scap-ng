assessment:
  id: ng.shared.8972b4004b2f432dd11d3790
  version: 1
  assessment_title: The SUSE operating system must employ FIPS 140-2-approved cryptographic hashing algorithms for all stored
    passwords.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the SUSE operating system requires the shadow password suite configuration be set to encrypt interactive
    user passwords using a strong cryptographic hash. Check that the interactive user account passwords are using a strong
    password hash with the following command: > sudo cut -d: -f2 /etc/shadow $6$kcOnRq/5$NUEYPuyL.wghQwWssXRcLRFiiru7f5JPV6GaJhNC2aK5F3PZpE/BCCtwrxRc/AInKMNX3CdMw11m9STiql12f/
    Password hashes "!" or "*" indicate inactive accounts not available for logon and are not evaluated. If any interactive
    user password hash does not begin with "$6", this is a finding.'
  inputs: {}
  evidence: []
