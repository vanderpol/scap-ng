assessment:
  id: ng.shared.a3efcab35903d2ed02a4f330
  version: 1
  assessment_title: The macOS system must disable sending diagnostic and usage data to Apple.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable sending diagnostic and usage data to Apple with the following
    command: /usr/bin/osascript -l JavaScript << EOS function run() { let pref1 = $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.SubmitDiagInfo'')\
    .objectForKey(''AutoSubmit'').js let pref2 = $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\
    .objectForKey(''allowDiagnosticSubmission'').js if ( pref1 == false && pref2 == false ){ return("true") } else { return("false")
    } } EOS If the result is not "true", this is a finding.'
  inputs: {}
  evidence: []
