assessment:
  id: ng.shared.0bac279ce0388dc090df8ae6
  version: 1
  assessment_title: Audit Backup and Restore Privileges
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\Currentcontrolset\Control\Lsa
        name:
          operation: equals
          datatype: string
          mask: false
          value: FullPrivilegeAuditing
      object_title: null
  variables:
    audit-audit-use-backup-restore-privilege-variable:
      title: 'Audit: Audit the use of Backup and Restore privilege'
      kind: external
      datatype: binary
      input:
        required: true
        cardinality: one_or_more
        parameter: audit_use_backup_restore_privilege_var
        validation:
          alternatives:
          - literal: '00'
            hint: disabled
          - literal: '01'
            hint: enabled
  states:
    state-reg-binary-type-and-value-equals-variable:
      state_title: Reg_Binary type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_binary
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: audit-audit-use-backup-restore-privilege-variable
          operation: equals
          datatype: binary
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-audit-audit-use-backup-restore-privilege-set-disabled:
      test_title: '''Audit: Audit the use of Backup and Restore privilege'' is set to ''Disabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-binary-type-and-value-equals-variable
  evaluate:
    test: test-audit-audit-use-backup-restore-privilege-set-disabled
