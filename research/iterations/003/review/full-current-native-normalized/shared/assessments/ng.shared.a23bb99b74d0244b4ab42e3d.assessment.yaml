assessment:
  id: ng.shared.a23bb99b74d0244b4ab42e3d
  version: 1
  assessment_title: Disable GDM Automatic Login
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-rpminfo-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          value: gdm
      object_title: null
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/gdm/custom.conf
        pattern:
          operation: pattern match
          datatype: string
          value: ^\[daemon]\n(?!([^\n]*\n+)*\[[^\n\]]*]([^\n]*\n+)*AutomaticLoginEnable[ ]?=[ ]?)([^\n]*\n+)*AutomaticLoginEnable[
            ]?=[ ]?
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
    independent-textfilecontent54-object-2:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/gdm/custom.conf
        pattern:
          operation: pattern match
          datatype: string
          value: ^[ ]*AutomaticLoginEnable[ ]?=[ ]?([^\W]*)[ ]*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states:
    state-gdm-automaticloginenable-false:
      state_title: GDM AutomaticLoginEnable = false
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^[Ff][Aa][Ll][Ss][Ee]$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-package-gdm-installed:
      test_title: package gdm is installed
      capability: linux.rpminfo
      object: linux-rpminfo-object
      check_existence: all_exist
      check: all
    test-automaticloginenable-present-in-daemon-section:
      test_title: AutomaticLoginEnable present in daemon section
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
    test-all-automaticloginenable-lines-set-correctly:
      test_title: All AutomaticLoginEnable lines are set correctly
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-2
      check_existence: at_least_one_exists
      check: all
      states:
      - state-gdm-automaticloginenable-false
  evaluate:
    any:
    - not:
        test: test-package-gdm-installed
    - all:
      - test: test-automaticloginenable-present-in-daemon-section
      - test: test-all-automaticloginenable-lines-set-correctly
