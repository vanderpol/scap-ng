assessment:
  id: ng.shared.22de9de36a2057309354553e
  version: 1
  assessment_title: SMB Client Packet Signing (Always)
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Services\LanmanWorkstation\Parameters
        name:
          operation: equals
          datatype: string
          mask: false
          value: RequireSecuritySignature
  variables:
    client-digitally-sign-communications-always-variable:
      title: Client Digitally Sign Communications (Always)
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: digitally_sign_communications_client_always_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-microsoft-network-client-digitally-sign-communications-always-set-enabled:
      test_title: '''Microsoft Network Client: Digitally sign communications (always)'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: client-digitally-sign-communications-always-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-microsoft-network-client-digitally-sign-communications-always-set-enabled
