assessment:
  id: ng.shared.504a79174dd37a48ef88231c
  version: 1
  assessment_title: The audit system must identify in which zone an event occurred.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    auditconfig-getpolicy-matching-active-collection:
      collection_title: auditconfig -getpolicy matching active
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: auditconfig -getpolicy
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: active
  tests:
    test-audit-system-identify-in-which-zone-event-occurred:
      test_title: The audit system must identify in which zone an event occurred.
      capability: independent.shellcommand
      collection: auditconfig-getpolicy-matching-active-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: zonename should be returned
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: zonename
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-audit-system-identify-in-which-zone-event-occurred
