assessment:
  id: ng.shared.91c1ca2face101f8030bbe0a
  version: 1
  assessment_title: Device Install - PnP Interface Remote Access
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: Software\Policies\Microsoft\Windows\DeviceInstall\Settings
        name:
          operation: equals
          datatype: string
          value: AllowRemoteRPC
      object_title: null
  variables:
    allow-remote-access-pnp-interface-variable:
      title: Allow remote access to the PnP interface
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: allow_remote_access_to_the_pnp_interface_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: allow-remote-access-pnp-interface-variable
          operation: equals
          datatype: int
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-allow-remote-access-plug-play-interface-set-disabled:
      test_title: '''Allow remote access to the Plug and Play interface'' is set to ''Disabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-allow-remote-access-plug-play-interface-set-disabled
