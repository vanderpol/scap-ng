assessment:
  id: ng.shared.04839afc2ef3c5491fbb1143
  version: 1
  assessment_title: Set Password Expiration Parameters
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/login.defs
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*PASS_MAX_DAYS\s+(\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: null
  variables:
    maximum-password-age-variable:
      title: Maximum password age
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: var_accounts_maximum_age_login_defs
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value:
          variable: maximum-password-age-variable
        operation: less than or equal
        datatype: int
        mask: false
        variable_check: at least one
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-value-pass-max-days-should-set-appropriately-in-etc-login:
      test_title: The value of PASS_MAX_DAYS should be set appropriately in /etc/login.defs
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    test: test-value-pass-max-days-should-set-appropriately-in-etc-login
