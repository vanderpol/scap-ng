assessment:
  id: ng.shared.88f45d1a2c74b55a50eed68e
  version: 1
  assessment_title: The macOS system must be configured to disable prompts to configure Unlock with Watch.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    os-skip-unlock-watch-enable-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: zsh
        command:
          operation: equals
          datatype: string
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.SetupAssistant.managed'')\

            .objectForKey(''SkipUnlockWithWatch'').js

            EOS'
      object_title: os_skip_unlock_with_watch_enable_recommended_object
  states:
    state-os-skip-unlock-with-watch-enable-recommended-state:
      state_title: os_skip_unlock_with_watch_enable_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: 'true'
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-os-skip-unlock-watch-enable-recommended-test:
      test_title: os_skip_unlock_with_watch_enable_recommended_test
      capability: independent.shellcommand
      object: os-skip-unlock-watch-enable-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-os-skip-unlock-with-watch-enable-recommended-state
  evaluate:
    test: test-os-skip-unlock-watch-enable-recommended-test
