assessment:
  id: ng.shared.121ac0ea5a3d9f75dd5b05f8
  version: 1
  assessment_title: The Deny access to this computer from the network user right on workstations must be configured to prevent
    access from highly privileged domain accounts and local accounts on domain systems and unauthenticated access on all systems.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy
    >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment. If the
    following groups or accounts are not defined for the "Deny access to this computer from the network" right, this is a
    finding: Domain Systems Only: Enterprise Admins group Domain Admins group Local account (see Note below) All Systems:
    Guests group Privileged Access Workstations (PAWs) dedicated to the management of Active Directory are exempt from denying
    the Enterprise Admins and Domain Admins groups. (See the Windows Privileged Access Workstation STIG for PAW requirements.)
    Note: "Local account" is a built-in security group used to assign user rights and permissions to all local accounts.'
  inputs: []
  evidence: []
