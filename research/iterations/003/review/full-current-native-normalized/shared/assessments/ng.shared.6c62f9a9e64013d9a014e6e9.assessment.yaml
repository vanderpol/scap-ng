assessment:
  id: ng.shared.6c62f9a9e64013d9a014e6e9
  version: 1
  assessment_title: The macOS system must authorize USB devices before allowing connection.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    system-settings-usb-restricted-mode-recommended-object-collection:
      collection_title: system_settings_usb_restricted_mode_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: "/usr/bin/osascript -l JavaScript << EOS\n  function run() {\n    let pref1 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.applicationaccess')\\\
            \n  .objectForKey('allowUSBRestrictedMode'))\n    if ( pref1 == false ) {\n      return(\"false\")\n    } else\
            \ {\n      return(\"true\")\n    }\n  }\nEOS"
  tests:
    test-system-settings-usb-restricted-mode-recommended-test:
      test_title: system_settings_usb_restricted_mode_recommended_test
      capability: independent.shellcommand
      collection: system-settings-usb-restricted-mode-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: system_settings_usb_restricted_mode_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: 'true'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-system-settings-usb-restricted-mode-recommended-test
