assessment:
  id: ng.shared.f17d9183dcb3f92f4ee0a44e
  version: 1
  assessment_title: The macOS system must configure system log files to be owned by root and group to wheel.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    os-newsyslog-files-owner-group-configure-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: zsh
        command:
          operation: equals
          datatype: string
          value: /usr/bin/stat -f '%Su:%Sg:%N' $(/usr/bin/grep -v '^#' /etc/newsyslog.conf|/usr/bin/awk '{ print $1 }')|/usr/bin/awk
            '!/^root:wheel:/{print $1}'
      object_title: os_newsyslog_files_owner_group_configure_recommended_object
  states:
    state-os-newsyslog-files-owner-group-configure-recommended-sta:
      state_title: os_newsyslog_files_owner_group_configure_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: ''
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: none_exist
  tests:
    test-os-newsyslog-files-owner-group-configure-recommended-test:
      test_title: os_newsyslog_files_owner_group_configure_recommended_test
      capability: independent.shellcommand
      object: os-newsyslog-files-owner-group-configure-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-os-newsyslog-files-owner-group-configure-recommended-sta
  evaluate:
    test: test-os-newsyslog-files-owner-group-configure-recommended-test
