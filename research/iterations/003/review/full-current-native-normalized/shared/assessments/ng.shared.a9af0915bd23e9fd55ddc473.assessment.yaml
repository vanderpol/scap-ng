assessment:
  id: ng.shared.a9af0915bd23e9fd55ddc473
  version: 1
  assessment_title: OL08-00-040023 - OL 8 must not have the stream control transmission protocol (SCTP) kernel module installed
    if not required for operational support.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/modprobe.d
        filename:
          operation: pattern match
          datatype: string
          value: .*
        pattern:
          operation: pattern match
          datatype: string
          value: ^[ \t]*install[ \t]+sctp[ \t]+/bin/false[ \t]*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
    independent-textfilecontent54-object-2:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/modprobe.d
        filename:
          operation: pattern match
          datatype: string
          value: .*
        pattern:
          operation: pattern match
          datatype: string
          value: ^[ \t]*blacklist[ \t]+sctp[ \t]*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states: {}
  tests:
    test-etc-modprobe-d-contains-file-that-contains-install-sctp-bin:
      test_title: /etc/modprobe.d contains a file that contains 'install sctp /bin/false'
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
    test-etc-modprobe-d-contains-file-that-contains-blacklist-sctp:
      test_title: /etc/modprobe.d contains a file that contains 'blacklist sctp'
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-2
      check_existence: at_least_one_exists
      check: all
  evaluate:
    all:
    - test: test-etc-modprobe-d-contains-file-that-contains-install-sctp-bin
    - test: test-etc-modprobe-d-contains-file-that-contains-blacklist-sctp
