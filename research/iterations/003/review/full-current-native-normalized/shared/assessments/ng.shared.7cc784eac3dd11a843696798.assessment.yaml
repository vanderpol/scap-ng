assessment:
  id: ng.shared.7cc784eac3dd11a843696798
  version: 1
  assessment_title: OL09-00-005005 - OL 9 must be configured to forward audit records via TCP to a different system or media
    from the system being audited via rsyslog.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    rsyslog-conf-remote-tcp-logging-collection:
      collection_title: 'rsyslog.conf: remote TCP logging'
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/rsyslog.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\*\.\*\s+@@(\S+)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
    rsyslog-d-conf-remote-tcp-logging-collection:
      collection_title: 'rsyslog.d/*.conf: remote TCP logging'
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/rsyslog.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^.*\.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\*\.\*\s+@@(\S+)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
    remote-tcp-logging-collection:
      collection_title: remote TCP logging
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - collection: rsyslog-conf-remote-tcp-logging-collection
        - collection: rsyslog-d-conf-remote-tcp-logging-collection
    rsyslog-conf-action-all-messages-collection:
      collection_title: 'rsyslog.conf: action for all messages'
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/rsyslog.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\*\.\*\s+action\((\s*(?:[^#\)]*(?:#.*$)?\n)*[^#\)]*)\)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
    rsyslog-d-conf-action-all-messages-collection:
      collection_title: 'rsyslog.d/*.conf: action for all messages'
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/rsyslog.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^.*\.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\*\.\*\s+action\((\s*(?:[^#\)]*(?:#.*$)?\n)*[^#\)]*)\)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
    rsyslog-action-all-messages-collection:
      collection_title: 'rsyslog: action for all messages'
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - collection: rsyslog-conf-action-all-messages-collection
        - collection: rsyslog-d-conf-action-all-messages-collection
  tests:
    test-remote-tcp-logging:
      test_title: remote TCP logging
      capability: independent.textfilecontent54
      collection: remote-tcp-logging-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^.+$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-remote-tcp-logging-advanced-syntax:
      test_title: remote TCP logging (advanced syntax)
      capability: independent.textfilecontent54
      collection: rsyslog-action-all-messages-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_operator: AND
        states:
        - state_title: null
          capability: independent.textfilecontent54
          state:
            field: subexpression
            value: (?i)(?:^|\n)[^#]*\btype\s*=\s*"omfwd"
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: independent.textfilecontent54
          state:
            field: subexpression
            value: (?i)(?:^|\n)[^#]*\bprotocol\s*=\s*"tcp"
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    any:
    - test: test-remote-tcp-logging
    - test: test-remote-tcp-logging-advanced-syntax
