assessment:
  id: ng.shared.4cb3e452d5a923eae4a44476
  version: 1
  assessment_title: Ensure Yum gpgcheck Globally Activated
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    gpgcheck-set-in-etc-yum-conf-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/yum.conf
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*gpgcheck\s*=\s*(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: gpgcheck set in /etc/yum.conf
  states:
    state-gpgcheck-enabled-in-etc-yum-conf:
      state_title: gpgcheck enabled in /etc/yum.conf
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '1'
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-check-value-gpgcheck-in-etc-yum-conf:
      test_title: check value of gpgcheck in /etc/yum.conf
      capability: independent.textfilecontent54
      object: gpgcheck-set-in-etc-yum-conf-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-gpgcheck-enabled-in-etc-yum-conf
  evaluate:
    test: test-check-value-gpgcheck-in-etc-yum-conf
