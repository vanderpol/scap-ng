assessment:
  id: ng.shared.35beb386bd0439f7675fe495
  version: 1
  assessment_title: The macOS system must be configured to audit all administrative action events.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to audit privileged access with the following command: /usr/bin/awk -F'':''
    ''/^flags/ { print $NF }'' /etc/security/audit_control | /usr/bin/tr '','' ''\n'' | /usr/bin/grep -Ec ''ad'' If the result
    is not "1", this is a finding.'
  inputs: {}
  evidence: []
