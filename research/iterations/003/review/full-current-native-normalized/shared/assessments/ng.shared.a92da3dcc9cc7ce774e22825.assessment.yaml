assessment:
  id: ng.shared.a92da3dcc9cc7ce774e22825
  version: 1
  assessment_title: Windows Installer - IE Security Prompt
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\Windows\Installer
        name:
          operation: equals
          datatype: string
          mask: false
          value: SafeForScripting
  tests:
    test-prevent-internet-explorer-security-prompt-windows-installer-scripts-set-disabled:
      test_title: '''Prevent Internet Explorer security prompt for Windows Installer scripts'' is set to ''Disabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals 0
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-prevent-internet-explorer-security-prompt-windows-installer-scripts-set-disabled
