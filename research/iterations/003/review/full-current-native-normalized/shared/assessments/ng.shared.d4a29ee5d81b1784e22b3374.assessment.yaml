assessment:
  id: ng.shared.d4a29ee5d81b1784e22b3374
  version: 1
  assessment_title: The macOS system must be configured to disable hot corners.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    system-settings-hot-corners-disable-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: zsh
        command:
          operation: equals
          datatype: string
          value: /usr/bin/profiles -P -o stdout | /usr/bin/grep -Ec '"wvous-bl-corner" = 0|"wvous-br-corner" = 0|"wvous-tl-corner"
            = 0|"wvous-tr-corner" = 0'
      object_title: system_settings_hot_corners_disable_recommended_object
  states:
    state-system-settings-hot-corners-disable-recommended-state:
      state_title: system_settings_hot_corners_disable_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: '4'
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-settings-hot-corners-disable-recommended-test:
      test_title: system_settings_hot_corners_disable_recommended_test
      capability: independent.shellcommand
      object: system-settings-hot-corners-disable-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-system-settings-hot-corners-disable-recommended-state
  evaluate:
    test: test-system-settings-hot-corners-disable-recommended-test
