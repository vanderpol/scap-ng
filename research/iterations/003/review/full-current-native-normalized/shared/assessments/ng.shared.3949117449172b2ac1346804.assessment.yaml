assessment:
  id: ng.shared.3949117449172b2ac1346804
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that the audit system takes appropriate action
    when there is an error sending audit records to a remote system.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the action the operating system takes if there is an error sending audit records to a remote system.
    Check the action that takes place if there is an error sending audit records to a remote system with the following command:
    # grep -i network_failure_action /etc/audisp/audisp-remote.conf network_failure_action = syslog If the value of the "network_failure_action"
    option is not "syslog", "single", or "halt", or the line is commented out, ask the System Administrator to indicate how
    the audit logs are off-loaded to a different system or storage media, and to indicate the action taken if there is an
    error sending audit records to the remote system. If there is no evidence that the system is configured to off-load audit
    logs to a different system or storage media, or if the configuration does not take appropriate action if there is an error
    sending audit records to the remote system, this is a finding.'
  inputs: []
  evidence: []
