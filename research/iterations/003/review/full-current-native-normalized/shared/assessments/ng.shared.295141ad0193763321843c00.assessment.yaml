assessment:
  id: ng.shared.295141ad0193763321843c00
  version: 1
  assessment_title: UBTU-22-255040 - Ubuntu 22.04 LTS must be configured so that remote X connections are disabled, unless
    to fulfill documented and validated mission requirements.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*(?i)X11Forwarding[ \t]+([^\s#]*)[ \t]*(?:|(?:#.*))?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-textfilecontent54-collection-2:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .+
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*(?i)X11Forwarding[ \t]+([^\s#]*)[ \t]*(?:|(?:#.*))?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    x11forwarding-in-etc-ssh-sshd-config-etc-ssh-sshd-config-collection:
      collection_title: X11Forwarding in /etc/ssh/sshd_config and /etc/ssh/sshd_config.d/*
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - collection: independent-textfilecontent54-collection
        - collection: independent-textfilecontent54-collection-2
  tests:
    test-etc-ssh-sshd-config-or-etc-ssh-sshd-config-d:
      test_title: /etc/ssh/sshd_config or /etc/ssh/sshd_config.d/*:X11Forwarding == no
      capability: independent.textfilecontent54
      collection: x11forwarding-in-etc-ssh-sshd-config-etc-ssh-sshd-config-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^(no|"no")$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-etc-ssh-sshd-config-or-etc-ssh-sshd-config-d
