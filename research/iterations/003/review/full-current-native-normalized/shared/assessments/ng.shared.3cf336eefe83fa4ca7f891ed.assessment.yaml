assessment:
  id: ng.shared.3cf336eefe83fa4ca7f891ed
  version: 1
  assessment_title: 'Windows Server 2012 / 2012 R2 must employ automated mechanisms to determine the state of system components
    with regard to flaw remediation using the following frequency: continuously, where ESS is used; 30 days, for any additional
    internal network scans n'
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify DoD-approved ESS software is installed and properly operating. Ask the site ISSM for documentation of
    the ESS software installation and configuration. If the ISSM is not able to provide a documented configuration for an
    installed ESS or if the ESS software is not properly maintained or used, this is a finding. Note: Example of documentation
    can be a copy of the site''s CCB approved Software Baseline with version of software noted or a memo from the ISSM stating
    current ESS software and version.'
  inputs: []
  evidence: []
