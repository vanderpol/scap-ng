assessment:
  id: ng.shared.edc4c722dea2ea79e1af8f5c
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that when passwords are changed or new passwords
    are assigned, the new password must contain at least one numeric character.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: The value to require a number of numeric characters to be set is expressed as a negative number in "/etc/security/pwquality.conf".
    Check the value for "dcredit" in "/etc/security/pwquality.conf" with the following command: # grep dcredit /etc/security/pwquality.conf
    dcredit = -1 If the value of "dcredit" is not set to a negative value, this is a finding.'
  inputs: {}
  evidence: []
