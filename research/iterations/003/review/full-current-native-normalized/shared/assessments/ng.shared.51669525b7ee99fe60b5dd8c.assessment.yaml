assessment:
  id: ng.shared.51669525b7ee99fe60b5dd8c
  version: 1
  assessment_title: Prevent device metadata retrieval from Internet
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows\Device Metadata
        name:
          operation: equals
          datatype: string
          mask: false
          value: PreventDeviceMetadataFromNetwork
  variables:
    prevent-device-metadata-retrieval-from-internet-variable:
      title: Prevent device metadata retrieval from the Internet
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: prevent_device_metadata_retrieval_from_the_internet_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-prevent-device-metadata-retrieval-from-internet-set-enabled:
      test_title: '''Prevent device metadata retrieval from the Internet'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: prevent-device-metadata-retrieval-from-internet-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-prevent-device-metadata-retrieval-from-internet-set-enabled
