assessment:
  id: ng.shared.2ee63adc878648fa5de03c4b
  version: 1
  assessment_title: The operating system must off-load audit records onto a different system or media from the system being
    audited.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    etc-audisp-audisp-remote-conf-remote-system-collection:
      collection_title: /etc/audisp/audisp-remote.conf remote_system
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audisp/audisp-remote.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[ ]*remote_server[ ]+=[ ]+(.*)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
        multiline: 'true'
  tests:
    test-etc-audisp-audisp-remote-conf-remote-system-not-empty:
      test_title: /etc/audisp/audisp-remote.conf remote_system is not empty
      capability: independent.textfilecontent54
      collection: etc-audisp-audisp-remote-conf-remote-system-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: remote_server is not empty
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^.+$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-etc-audisp-audisp-remote-conf-remote-system-not-empty
