assessment:
  id: ng.shared.7d4edc1f0a91ee0d7ae069cc
  version: 1
  assessment_title: The Oracle Linux operating system must audit all uses of the unix_chkpwd command.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system generates audit records when successful/unsuccessful attempts to use the "unix_chkpwd"
    command occur. Check the file system rule in "/etc/audit/audit.rules" with the following command: $ sudo grep -w "/usr/sbin/unix_chkpwd"
    /etc/audit/audit.rules -a always,exit -F path=/usr/sbin/unix_chkpwd -F perm=x -F auid>=1000 -F auid!=unset -k privileged-passwd
    If the command does not return any output, this is a finding.'
  inputs: {}
  evidence: []
