assessment:
  id: ng.shared.ed329c225b195e4eb6ffbbd5
  version: 1
  assessment_title: Windows Server 2019 passwords must be configured to expire.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Review the password never expires status for enabled user accounts. Open "PowerShell". Domain Controllers: Enter
    "Search-ADAccount -PasswordNeverExpires -UsersOnly | FT Name, PasswordNeverExpires, Enabled". Exclude application accounts,
    disabled accounts (e.g., DefaultAccount, Guest) and the krbtgt account. If any enabled user accounts are returned with
    a "PasswordNeverExpires" status of "True", this is a finding. Member servers and standalone or nondomain-joined systems:
    Enter ''Get-CimInstance -Class Win32_Useraccount -Filter "PasswordExpires=False and LocalAccount=True" | FT Name, PasswordExpires,
    Disabled, LocalAccount''. Exclude application accounts and disabled accounts (e.g., DefaultAccount, Guest). If any enabled
    user accounts are returned with a "PasswordExpires" status of "False", this is a finding.'
  inputs: []
  evidence: []
