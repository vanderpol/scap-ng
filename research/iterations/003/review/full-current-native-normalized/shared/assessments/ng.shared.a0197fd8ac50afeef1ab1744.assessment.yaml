assessment:
  id: ng.shared.a0197fd8ac50afeef1ab1744
  version: 1
  assessment_title: The Oracle Linux operating system must not allow interfaces to perform Internet Protocol version 4 (IPv4)
    Internet Control Message Protocol (ICMP) redirects by default.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the system does not allow interfaces to perform IPv4 ICMP redirects by default. # grep -r net.ipv4.conf.default.send_redirects
    /run/sysctl.d/* /etc/sysctl.d/* /usr/local/lib/sysctl.d/* /usr/lib/sysctl.d/* /lib/sysctl.d/* /etc/sysctl.conf 2> /dev/null
    If "net.ipv4.conf.default.send_redirects" is not configured in the "/etc/sysctl.conf" file or in any of the other sysctl.d
    directories, is commented out or does not have a value of "0", this is a finding. Check that the operating system implements
    the "default send_redirects" variables with the following command: # /sbin/sysctl -a | grep net.ipv4.conf.default.send_redirects
    net.ipv4.conf.default.send_redirects = 0 If the returned line does not have a value of "0", this is a finding. If conflicting
    results are returned, this is a finding.'
  inputs: []
  evidence: []
