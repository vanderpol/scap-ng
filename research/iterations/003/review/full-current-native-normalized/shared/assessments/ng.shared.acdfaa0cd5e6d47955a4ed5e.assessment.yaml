assessment:
  id: ng.shared.acdfaa0cd5e6d47955a4ed5e
  version: 1
  assessment_title: The Cisco router must be configured to limit the number of concurrent management sessions to an organization-defined
    number.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    ip-http-secure-server-disabled-object:
      capability: iosxe.global
      select:
        global_command:
          operation: pattern match
          datatype: string
          mask: false
          value: ^no ip http secure-server
      object_title: ip http secure-server is disabled
    ip-http-max-connections-object:
      capability: iosxe.global
      select:
        global_command:
          operation: pattern match
          datatype: string
          mask: false
          value: ^ip http max-connections \d
      object_title: ip http max-connections
    show-running-config-object:
      capability: iosxe.line
      select:
        show_subcommand:
          operation: equals
          datatype: string
          mask: false
          value: show running-config
      object_title: show running-config
    all-vty-lines-object:
      capability: iosxe.global
      select:
        global_command:
          operation: pattern match
          datatype: string
          mask: false
          value: ^line vty \d+
      object_title: all vty lines
  variables:
    number-vty-s-on-system-variable:
      title: Number of vty's on the system
      kind: local
      datatype: int
      expression:
        count:
          values:
            object: all-vty-lines-object
            field: global_command
    regex-match-all-vty-lines-session-limit-variable:
      title: Regex to match all vty lines to session-limit
      kind: local
      datatype: string
      expression:
        concat:
        - literal:
            value: ((?s)\nline vty \d.+\n.*?session\-limit \d){
            datatype: string
        - variable: number-vty-s-on-system-variable
        - literal:
            value: ',}'
            datatype: string
  states:
    state-vty-connections-are-limited-with-at-least-one-transport-:
      state_title: VTY connections are limited with at least one transport input none
      capability: iosxe.line
      state:
        all:
        - field: show_subcommand
          value: show running-config
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: config_line
          value: \n transport input none
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    state-vty-connections-are-limited-with-session-limit-if-availa:
      state_title: VTY connections are limited with session-limit (if available in the OS)
      capability: iosxe.line
      state:
        all:
        - field: show_subcommand
          value: show running-config
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: config_line
          value:
            variable: regex-match-all-vty-lines-session-limit-variable
          operation: pattern match
          datatype: string
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-ip-http-secure-server-disabled:
      test_title: ip http secure server is disabled
      capability: iosxe.global
      object: ip-http-secure-server-disabled-object
      check_existence: at_least_one_exists
      check: at least one
    test-ip-http-max-connections-defined:
      test_title: ip http max-connections is defined
      capability: iosxe.global
      object: ip-http-max-connections-object
      check_existence: at_least_one_exists
      check: at least one
    test-at-least-one-vty-line-disabled-transport-input-none-if:
      test_title: At least one vty line is disabled with transport input none (if session-limit is not supported)
      capability: iosxe.line
      object: show-running-config-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-vty-connections-are-limited-with-at-least-one-transport-
    test-vty-lines-configured-session-limit-if-supported:
      test_title: VTY lines are configured with session-limit (if supported)
      capability: iosxe.line
      object: show-running-config-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-vty-connections-are-limited-with-session-limit-if-availa
  evaluate:
    all:
    - any:
      - test: test-ip-http-secure-server-disabled
      - test: test-ip-http-max-connections-defined
    - any:
      - test: test-at-least-one-vty-line-disabled-transport-input-none-if
      - test: test-vty-lines-configured-session-limit-if-supported
