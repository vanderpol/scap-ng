assessment:
  id: ng.shared.638b487b0f9efbf59f2a1494
  version: 1
  assessment_title: The macOS system must be configured to disable the Cloud Setup services.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-appleid-prompt-disable-recommended-object-collection:
      collection_title: os_appleid_prompt_disable_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.SetupAssistant.managed'')\

            .objectForKey(''SkipCloudSetup'').js

            EOS'
  tests:
    test-os-appleid-prompt-disable-recommended-test:
      test_title: os_appleid_prompt_disable_recommended_test
      capability: independent.shellcommand
      collection: os-appleid-prompt-disable-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: os_appleid_prompt_disable_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: 'true'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-os-appleid-prompt-disable-recommended-test
