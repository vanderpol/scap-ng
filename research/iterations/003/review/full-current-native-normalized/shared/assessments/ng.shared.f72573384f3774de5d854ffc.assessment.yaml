assessment:
  id: ng.shared.f72573384f3774de5d854ffc
  version: 1
  assessment_title: Minimum Password Length
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    password-policy-collection:
      collection_title: Password policy
      capability: windows.passwordpolicy
  variables:
    minimum-password-length-variable:
      title: Minimum Password Length
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: password_minimum_length_var
        validation:
          alternatives:
          - literal: '8'
            hint: 8_characters
          - literal: '9'
            hint: 9_characters
          - literal: '12'
            hint: 12_characters
          - literal: '14'
            hint: 14_characters
          - literal: '15'
            hint: 15_characters
  tests:
    test-minimum-password-length-set-at-least-14-characters:
      test_title: '''Minimum password length'' is set to at least ''14'' characters'
      capability: windows.passwordpolicy
      collection: password-policy-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Minimum Password Length is greater than or equal to variable
        state_capability: windows.passwordpolicy
        state:
          field: min_passwd_len
          value:
            variable: minimum-password-length-variable
          operation: greater than or equal
          datatype: int
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-minimum-password-length-set-at-least-14-characters
