assessment:
  id: ng.shared.f77507b42ff2cf6d31b79af5
  version: 1
  assessment_title: The system must set strict multihoming.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    ipadm-show-prop-p-strict-dst-multihoming-co-current-ipv4-collection:
      collection_title: ipadm show-prop -p _strict_dst_multihoming -co current ipv4
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: ipadm show-prop -p _strict_dst_multihoming -co current ipv4
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
    ipadm-show-prop-p-send-redirects-co-current-ipv6-collection:
      collection_title: ipadm show-prop -p send_redirects -co current ipv6
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: ipadm show-prop -p _strict_dst_multihoming -co current ipv6
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
  tests:
    test-system-set-strict-multihoming:
      test_title: The system must set strict multihoming.
      capability: independent.shellcommand
      collection: ipadm-show-prop-p-strict-dst-multihoming-co-current-ipv4-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Check that line returns '1' with an exit status of 0
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: '1'
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-system-set-strict-multihoming-2:
      test_title: The system must set strict multihoming.
      capability: independent.shellcommand
      collection: ipadm-show-prop-p-send-redirects-co-current-ipv6-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Check that line returns '1' with an exit status of 0
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: '1'
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-system-set-strict-multihoming
    - test: test-system-set-strict-multihoming-2
