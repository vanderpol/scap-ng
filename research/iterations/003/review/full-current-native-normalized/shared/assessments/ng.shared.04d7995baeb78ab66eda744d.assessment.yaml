assessment:
  id: ng.shared.04d7995baeb78ab66eda744d
  version: 1
  assessment_title: The system must restrict the ability of users to assume excessive privileges to members of a defined group
    and prevent unauthorized users from accessing administrative tools.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    etc-user-attr-file-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/user_attr
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^root:[^:]*:[^:]*:[^:]*:([^:]*;)?type=role(;|\s|$)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: The (/etc/user_attr) file.
    etc-user-attr-file-object-2:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/user_attr
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[^:]+:[^:]*:[^:]*:[^:]*:[^:]*([^:]*;)?roles=([^:;\s]+,)?root(,|;|\s|$)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: The (/etc/user_attr) file.
  states: {}
  tests:
    test-root-configured-as-role:
      test_title: Root must be configured as a role.
      capability: independent.textfilecontent54
      object: etc-user-attr-file-object
      check_existence: at_least_one_exists
      check: all
    test-at-least-one-local-user-assigned-root-role:
      test_title: At least one local user must be assigned the root role.
      capability: independent.textfilecontent54
      object: etc-user-attr-file-object-2
      check_existence: at_least_one_exists
      check: all
  evaluate:
    all:
    - test: test-root-configured-as-role
    - test: test-at-least-one-local-user-assigned-root-role
