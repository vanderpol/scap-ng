assessment:
  id: ng.shared.499297b4367a5d51e105e0ad
  version: 1
  assessment_title: The operating system must be a supported release.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    os-information-object:
      capability: unix.uname
      object_title: OS information
  states:
    state-the-os-name:
      state_title: The OS name
      capability: unix.uname
      state:
        field: os_name
        value: SunOS
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-the-release-of-the-installed-os:
      state_title: The release of the installed OS
      capability: unix.uname
      state:
        field: os_release
        value: '5.11'
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-installed-operating-system-s-name-sunos:
      test_title: Installed operating system's name is SunOS
      capability: unix.uname
      object: os-information-object
      check_existence: all_exist
      check: all
      states:
      - state-the-os-name
    test-installed-operating-system-release-5-11:
      test_title: Installed operating system is release 5.11
      capability: unix.uname
      object: os-information-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-the-release-of-the-installed-os
  evaluate:
    all:
    - test: test-installed-operating-system-s-name-sunos
    - test: test-installed-operating-system-release-5-11
