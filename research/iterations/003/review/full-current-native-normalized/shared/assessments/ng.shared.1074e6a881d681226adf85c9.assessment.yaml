assessment:
  id: ng.shared.1074e6a881d681226adf85c9
  version: 1
  assessment_title: AZLX-23-000215 - Amazon Linux 2023 must disable access to network bpf system call from nonprivileged processes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-sysctl-object:
      capability: unix.sysctl
      select:
        name:
          operation: equals
          datatype: string
          value: kernel.unprivileged_bpf_disabled
      object_title: null
  states:
    state-unix-sysctl:
      state_title: null
      capability: unix.sysctl
      state:
        field: value
        value: '1'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-kernel-unprivileged-bpf-disabled-setting-in-kernel-set-1:
      test_title: kernel.unprivileged_bpf_disabled setting in kernel is set to 1
      capability: unix.sysctl
      object: unix-sysctl-object
      check_existence: all_exist
      check: all
      states:
      - state-unix-sysctl
  evaluate:
    test: test-kernel-unprivileged-bpf-disabled-setting-in-kernel-set-1
