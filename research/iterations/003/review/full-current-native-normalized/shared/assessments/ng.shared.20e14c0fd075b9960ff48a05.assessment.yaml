assessment:
  id: ng.shared.20e14c0fd075b9960ff48a05
  version: 1
  assessment_title: The Oracle Linux operating system must remove all software components after updated versions have been
    installed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system removes all software components after updated versions have been installed. Check
    if yum is configured to remove unneeded packages with the following command: # grep -i clean_requirements_on_remove /etc/yum.conf
    clean_requirements_on_remove=1 If "clean_requirements_on_remove" is not set to "1", "True", or "yes", or is not set in
    "/etc/yum.conf", this is a finding.'
  inputs: {}
  evidence: []
