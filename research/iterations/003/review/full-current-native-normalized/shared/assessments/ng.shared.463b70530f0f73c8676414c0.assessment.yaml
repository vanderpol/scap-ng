assessment:
  id: ng.shared.463b70530f0f73c8676414c0
  version: 1
  assessment_title: Set OpenSSH Idle Timeout Interval
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-rpminfo-collection:
      collection_title: null
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: openssh-server
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[\s]*(?i)ClientAliveInterval[\s]+(\d+)[\s]*(?:|(?:#.*))?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  variables:
    timeout-value-variable:
      title: timeout value
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: sshd_idle_timeout_value
  tests:
    test-package-openssh-server-removed:
      test_title: package openssh-server is removed
      capability: linux.rpminfo
      collection: linux-rpminfo-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
    test-timeout-configured:
      test_title: timeout is configured
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_operator: AND
        states:
        - state_title: upper bound of ClientAliveInterval in seconds
          capability: independent.textfilecontent54
          state:
            field: subexpression
            value:
              variable: timeout-value-variable
            operation: less than or equal
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: lower bound of ClientAliveInterval in seconds
          capability: independent.textfilecontent54
          state:
            field: subexpression
            value: '0'
            operation: greater than
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    any:
    - test: test-package-openssh-server-removed
    - test: test-timeout-configured
