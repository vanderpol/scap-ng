assessment:
  id: ng.shared.d6ec8b7049bd0122065e7d70
  version: 1
  assessment_title: Disable X11 Forwarding
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-rpminfo-collection:
      collection_title: null
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: openssh-server
    ssh-x11forwarding-collection:
      collection_title: SSH X11Forwarding
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[\s]*X11Forwarding[ \t]+([^\s#]*)[ \t]*(?:|(?:#.*))?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
        multiline: 'true'
  tests:
    test-package-openssh-server-removed:
      test_title: package openssh-server is removed
      capability: linux.rpminfo
      collection: linux-rpminfo-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
    test-tests-value-x11forwarding-setting-in-etc-ssh-sshd-config-file:
      test_title: tests the value of X11Forwarding setting in the /etc/ssh/sshd_config file
      capability: independent.textfilecontent54
      collection: ssh-x11forwarding-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: X11Forwarding = no
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^(no|"no")$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    any:
    - test: test-package-openssh-server-removed
    - test: test-tests-value-x11forwarding-setting-in-etc-ssh-sshd-config-file
