assessment:
  id: ng.shared.c9c0c56ee1448d0613f23621
  version: 1
  assessment_title: The macOS system must enforce auto logout after 86400 seconds of inactivity.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    system-settings-automatic-logout-enforce-stig-object-collection:
      collection_title: system_settings_automatic_logout_enforce_stig_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''.GlobalPreferences'')\

            .objectForKey(''com.apple.autologout.AutoLogOutDelay'').js

            EOS'
  tests:
    test-system-settings-automatic-logout-enforce-stig-test:
      test_title: system_settings_automatic_logout_enforce_stig_test
      capability: independent.shellcommand
      collection: system-settings-automatic-logout-enforce-stig-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: system_settings_automatic_logout_enforce_stig_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: '86400'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-system-settings-automatic-logout-enforce-stig-test
