assessment:
  id: ng.shared.61886c45142ef7246f380fcd
  version: 1
  assessment_title: The macOS system must be configured so that log folders do not contain access control lists (ACLs).
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    audit-acls-folders-configure-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /bin/ls -lde /var/audit | /usr/bin/awk '{print $1}' | /usr/bin/grep ":"
      object_title: audit_acls_folders_configure_recommended_object
  states:
    state-audit-acls-folders-configure-recommended-state:
      state_title: audit_acls_folders_configure_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: ''
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: none_exist
  tests:
    test-audit-acls-folders-configure-recommended-test:
      test_title: audit_acls_folders_configure_recommended_test
      capability: independent.shellcommand
      object: audit-acls-folders-configure-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-audit-acls-folders-configure-recommended-state
  evaluate:
    test: test-audit-acls-folders-configure-recommended-test
