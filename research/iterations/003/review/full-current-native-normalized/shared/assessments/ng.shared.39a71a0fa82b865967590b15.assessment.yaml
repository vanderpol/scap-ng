assessment:
  id: ng.shared.39a71a0fa82b865967590b15
  version: 1
  assessment_title: Unauthorized use of the at or cron capabilities must not be permitted.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Check that "at" and "cron" users are configured correctly. # ls /etc/cron.d/cron.deny If cron.deny exists, this
    is a finding. # ls /etc/cron.d/at.deny If at.deny exists, this is a finding. # cat /etc/cron.d/cron.allow cron.allow should
    have a single entry for "root", or the cron.allow file is removed if using RBAC. If any accounts other than root that
    are listed and they are not properly documented with the IA staff, this is a finding. # wc -l /etc/cron.d/at.allow | awk
    ''{ print $1 }'' If the output is non-zero, this is a finding, or the at.allow file is removed if using RBAC.'
  inputs: {}
  evidence: []
