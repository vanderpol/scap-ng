assessment:
  id: ng.shared.c163c021fa497b4cef8fb6a7
  version: 1
  assessment_title: Copilot must be disabled for Windows 10.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    get-appxpackage-collection:
      collection_title: Get-AppxPackage
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: Get-AppxPackage -AllUsers | Where-Object { $_.Name -like '*Copilot*' }
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: ''
  tests:
    test-run-powershell-command-determine-if-copilot-in-use-if-microsoft:
      test_title: Run a PowerShell command to determine if copilot is in use. If Microsoft.Copilot displays, this is a finding.
      capability: independent.shellcommand
      collection: get-appxpackage-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: stdout_line does not exist
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: ''
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: none_exist
  evaluate:
    test: test-run-powershell-command-determine-if-copilot-in-use-if-microsoft
