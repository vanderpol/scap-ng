assessment:
  id: ng.shared.1850902cbb89de9b8f1e5f44
  version: 1
  assessment_title: The SUSE operating system must not forward Internet Protocol version 6 (IPv6) source-routed packets by
    default.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the SUSE operating system does not accept IPv6 source-routed packets by default. Check the value of the
    default IPv6 accept source route variable with the following command: > sudo sysctl net.ipv6.conf.default.accept_source_route
    net.ipv6.conf.default.accept_source_route = 0 If the network parameter "ipv6.conf.default.accept_source_route" is not
    equal to "0" or nothing is returned, this is a finding.'
  inputs: {}
  evidence: []
