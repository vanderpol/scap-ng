assessment:
  id: ng.shared.c5f9bc4dec4f4f205ccccf95
  version: 1
  assessment_title: The macOS system must disable unattended or automatic login to the system.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable unattended or automatic login to the system with the following
    command: /usr/bin/osascript -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.loginwindow'')\
    .objectForKey(''com.apple.login.mcx.DisableAutoLoginClient'').js EOS If the result is not "true", this is a finding.'
  inputs: []
  evidence: []
