assessment:
  id: ng.shared.12f7cf15fea210dc1e3916ba
  version: 1
  assessment_title: WN11-CC-000037 - Local administrator accounts must have their privileged token filtered to prevent elevated
    privileges from being used over the network on domain systems.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: case insensitive equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: case insensitive equals
          datatype: string
          value: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        name:
          operation: case insensitive equals
          datatype: string
          value: LocalAccountTokenFilterPolicy
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-local-admin-accounts-filtered-token-policy-enabled:
      test_title: Local admin accounts filtered token policy is enabled
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-local-admin-accounts-filtered-token-policy-enabled
