  version: 1
  assessment_title: The macOS system must configure sudo to log events.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to log privilege escalation with the following command: /usr/bin/sudo
    /usr/bin/sudo -V | /usr/bin/grep -c "Log when a command is allowed by sudoers" If the result is not "1", this is a finding.'
  inputs: {}
  evidence: []
