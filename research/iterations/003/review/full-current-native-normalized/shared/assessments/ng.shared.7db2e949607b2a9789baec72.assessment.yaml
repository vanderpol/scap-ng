assessment:
  id: ng.shared.7db2e949607b2a9789baec72
  version: 1
  assessment_title: The operating system must protect against an individual falsely denying having performed a particular
    action. In order to do so the system must be configured to send audit records to a remote audit server.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-information-collection:
      collection_title: OS information
      capability: unix.uname
    etc-zones-index-collection:
      collection_title: /etc/zones/index
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/zones/index
    etc-zones-index-global-entry-collection:
      collection_title: /etc/zones/index global entry
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/zones/index
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: '^global:'
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    var-share-zones-index-json-collection:
      collection_title: /var/share/zones/index.json
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /var/share/zones/index.json
    var-share-zones-index-json-path-collection:
      collection_title: /var/share/zones/index.json 'path:/'
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /var/share/zones/index.json
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: '"path":\s+"/"'
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    audit-warn-entry-in-etc-mail-aliases-collection:
      collection_title: The audit_warn entry in /etc/mail/aliases.
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/mail/aliases
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^audit_warn:\s*\S+\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-solaris-less-than-11-4:
      test_title: Solaris (less than) 11.4
      capability: unix.uname
      collection: os-information-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: 11.3 or less.
        state_capability: unix.uname
        state:
          field: os_version
          value: ^11($|\.[0-3]\b)
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-etc-zones-index-does-not-exist:
      test_title: /etc/zones/index does not exist
      capability: unix.file
      collection: etc-zones-index-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
    test-etc-zones-index-contains-global:
      test_title: /etc/zones/index contains global
      capability: independent.textfilecontent54
      collection: etc-zones-index-global-entry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
    test-var-share-zones-index-json-does-not-exist:
      test_title: /var/share/zones/index.json does not exist
      capability: unix.file
      collection: var-share-zones-index-json-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
    test-var-share-zones-index-json-does-not-contain-path:
      test_title: /var/share/zones/index.json does not contain 'path:/'
      capability: independent.textfilecontent54
      collection: var-share-zones-index-json-path-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
    test-there-audit-warn-entry-listed-in-etc-mail-aliases:
      test_title: There must be an audit_warn entry listed in /etc/mail/aliases.
      capability: independent.textfilecontent54
      collection: audit-warn-entry-in-etc-mail-aliases-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    any:
    - not:
        all:
        - any:
          - not:
              test: test-solaris-less-than-11-4
          - any:
            - test: test-etc-zones-index-does-not-exist
            - test: test-etc-zones-index-contains-global
        - any:
          - test: test-solaris-less-than-11-4
          - any:
            - test: test-var-share-zones-index-json-does-not-exist
            - test: test-var-share-zones-index-json-does-not-contain-path
    - test: test-there-audit-warn-entry-listed-in-etc-mail-aliases
