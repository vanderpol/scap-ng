assessment:
  id: ng.shared.7743d1fb9db5da1fbc418602
  version: 1
  assessment_title: UAC - Application Elevations
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: Software\Microsoft\Windows\CurrentVersion\Policies\System
        name:
          operation: equals
          datatype: string
          value: ValidateAdminCodeSignatures
      object_title: null
  variables:
    only-elevate-executables-that-signed-validated-variable:
      title: Only elevate executables that are signed and validated
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: only_elevate_executables_signed_validated_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: only-elevate-executables-that-signed-validated-variable
          operation: equals
          datatype: int
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-user-account-control-only-elevate-executables-that-signed-validated-set:
      test_title: '''User Account Control: Only elevate executables that are signed and validated'' is set to ''Disabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-user-account-control-only-elevate-executables-that-signed-validated-set
