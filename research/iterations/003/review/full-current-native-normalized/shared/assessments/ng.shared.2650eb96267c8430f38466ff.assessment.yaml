assessment:
  id: ng.shared.2650eb96267c8430f38466ff
  version: 1
  assessment_title: System packages must be configured with the vendor-provided files, permissions, and ownerships.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    pkg-property-collection:
      collection_title: pkg property
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: pkg property
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: signature-policy
    pkg-verify-collection:
      collection_title: pkg verify
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: pkg verify
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: 'pkg://|file:|ERROR:'
  tests:
    test-determine-what-signature-policy-pkg-publishers:
      test_title: 'Determine what the signature policy is for pkg publishers:'
      capability: independent.shellcommand
      collection: pkg-property-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Check that line returns signature-policy               verify
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: signature-policy               verify
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-system-set-strict-multihoming:
      test_title: The system must set strict multihoming.
      capability: independent.shellcommand
      collection: pkg-verify-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Check that line returns '1' with an exit status of 0
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: ''
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: none_exist
  evaluate:
    all:
    - test: test-determine-what-signature-policy-pkg-publishers
    - test: test-system-set-strict-multihoming
