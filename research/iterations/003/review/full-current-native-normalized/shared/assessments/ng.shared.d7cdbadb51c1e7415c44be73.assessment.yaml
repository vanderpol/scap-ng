assessment:
  id: ng.shared.d7cdbadb51c1e7415c44be73
  version: 1
  assessment_title: UBTU-18-010311 - The Ubuntu operating system must be configured so that audit configuration files are
    not write-accessible by unauthorized users.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-file-object:
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/audit/auditd.conf
      object_title: null
    unix-file-object-2:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/audit/rules.d
        filename:
          operation: pattern match
          datatype: string
          value: .rules$
      object_title: null
    unix-file-object-3:
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/audit/audit.rules
      object_title: null
  states:
    state-mode-0640-or-less-permissive:
      state_title: mode 0640 or less permissive
      capability: unix.file
      state:
        all:
        - field: suid
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: sgid
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: sticky
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: uexec
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: gwrite
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: gexec
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: oread
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: owrite
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: oexec
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-etc-audit-auditd-conf-has-mode-0640-or-less-permissive:
      test_title: /etc/audit/auditd.conf has mode 0640 or less permissive
      capability: unix.file
      object: unix-file-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-mode-0640-or-less-permissive
    test-rules-files-in-etc-audit-rules-d-have-mode-0640:
      test_title: .rules files in /etc/audit/rules.d have mode 0640 or less permissive
      capability: unix.file
      object: unix-file-object-2
      check_existence: at_least_one_exists
      check: all
      states:
      - state-mode-0640-or-less-permissive
    test-etc-audit-audit-rules-has-mode-0640-or-less-permissive:
      test_title: /etc/audit/audit.rules has mode 0640 or less permissive
      capability: unix.file
      object: unix-file-object-3
      check_existence: at_least_one_exists
      check: all
      states:
      - state-mode-0640-or-less-permissive
  evaluate:
    all:
    - test: test-etc-audit-auditd-conf-has-mode-0640-or-less-permissive
    - test: test-rules-files-in-etc-audit-rules-d-have-mode-0640
    - test: test-etc-audit-audit-rules-has-mode-0640-or-less-permissive
