assessment:
  id: ng.shared.392b4c45594416f21a3a69c8
  version: 1
  assessment_title: UBTU-22-213020 - Ubuntu 22.04 LTS must implement address space layout randomization to protect its memory
    from unauthorized code execution.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-sysctl-object:
      capability: unix.sysctl
      select:
        name:
          operation: equals
          datatype: string
          value: kernel.randomize_va_space
      object_title: null
    admin-sysctl-configuration-files-kernel-randomize-va-space-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/sysctl.conf
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*kernel\.randomize_va_space\s*=\s*(\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: admin sysctl configuration files - kernel.randomize_va_space
    system-sysctl-configuration-files-kernel-randomize-va-space-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/sysctl.d
        filename:
          operation: pattern match
          datatype: string
          value: .*
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*kernel\.randomize_va_space\s*=\s*(\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: system sysctl configuration files - kernel.randomize_va_space
  states:
    state-unix-sysctl:
      state_title: null
      capability: unix.sysctl
      state:
        field: value
        value: '2'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '2'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-kernel-randomize-va-space-setting-in-kernel-set-2:
      test_title: kernel.randomize_va_space setting in kernel is set to 2
      capability: unix.sysctl
      object: unix-sysctl-object
      check_existence: all_exist
      check: all
      states:
      - state-unix-sysctl
    test-kernel-randomize-va-space-setting-in-etc-sysctl-conf-if:
      test_title: kernel.randomize_va_space setting in /etc/sysctl.conf, if set, is set to 2
      capability: independent.textfilecontent54
      object: admin-sysctl-configuration-files-kernel-randomize-va-space-object
      check_existence: any_exist
      check: all
      states:
      - state-independent-textfilecontent54
    test-kernel-randomize-va-space-setting-in-etc-sysctl-d-if:
      test_title: kernel.randomize_va_space setting in /etc/sysctl.d/*, if set, is set to 2
      capability: independent.textfilecontent54
      object: system-sysctl-configuration-files-kernel-randomize-va-space-object
      check_existence: any_exist
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    all:
    - test: test-kernel-randomize-va-space-setting-in-kernel-set-2
    - test: test-kernel-randomize-va-space-setting-in-etc-sysctl-conf-if
    - test: test-kernel-randomize-va-space-setting-in-etc-sysctl-d-if
