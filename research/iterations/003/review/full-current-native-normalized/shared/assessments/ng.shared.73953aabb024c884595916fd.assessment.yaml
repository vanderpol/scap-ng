assessment:
  id: ng.shared.73953aabb024c884595916fd
  version: 1
  assessment_title: The macOS system must be configured with audit log folders owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    audit-folder-owner-configure-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/bin/ls -dn $(/usr/bin/grep ''^dir'' /etc/security/audit_control | /usr/bin/awk -F: ''{print $2}'') | /usr/bin/awk
            ''{print $3}'''
      object_title: audit_folder_owner_configure_recommended_object
  states:
    state-audit-folder-owner-configure-recommended-state:
      state_title: audit_folder_owner_configure_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: '0'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-folder-owner-configure-recommended-test:
      test_title: audit_folder_owner_configure_recommended_test
      capability: independent.shellcommand
      object: audit-folder-owner-configure-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-audit-folder-owner-configure-recommended-state
  evaluate:
    test: test-audit-folder-owner-configure-recommended-test
