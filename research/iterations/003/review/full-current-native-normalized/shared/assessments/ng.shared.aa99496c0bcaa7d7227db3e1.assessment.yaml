assessment:
  id: ng.shared.aa99496c0bcaa7d7227db3e1
  version: 1
  assessment_title: The macOS system must disable the camera.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the device or operating system does not have a camera installed, this requirement is not applicable. This
    requirement is not applicable to mobile devices (smartphones and tablets), where the use of the camera is a local authorizing
    official (AO) decision. This requirement is not applicable to dedicated video teleconference (VTC) suites in approved
    VTC locations that are centrally managed. For an external camera, if there is not a method for the operator to manually
    disconnect camera at the end of collaborative computing sessions, this is a finding. For a built-in camera, the camera
    must be protected by a camera cover (e.g., laptop camera cover slide) when not in use. If the built-in camera is not protected
    with a camera cover or is not physically disabled, this is a finding. If the camera is not disconnected, covered, or physically
    disabled, verify the macOS system is configured to disable the camera with the following command: /usr/bin/osascript -l
    JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\ .objectForKey(''allowCamera'').js
    EOS If the result is not "false", this is a finding.'
  inputs: {}
  evidence: []
