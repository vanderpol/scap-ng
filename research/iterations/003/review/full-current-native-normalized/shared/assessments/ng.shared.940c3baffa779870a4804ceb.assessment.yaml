assessment:
  id: ng.shared.940c3baffa779870a4804ceb
  version: 1
  assessment_title: 'WN19-SO-000200 - Windows Server 2019 setting Microsoft network server: Digitally sign communications
    (if client agrees) must be configured to Enabled.'
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    check-registry-value-at-hkey-local-machine-system-currentcontrolset-services-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SYSTEM\CurrentControlSet\Services\LanManServer\Parameters
        name:
          operation: equals
          datatype: string
          value: EnableSecuritySignature
      object_title: Check the registry value at HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters\EnableSecuritySignature
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-microsoft-network-server-digitally-sign-communications-if-client-agrees-set:
      test_title: '''Microsoft network server: Digitally sign communications (if client agrees)'' is set to ''Enabled'''
      capability: windows.registry
      object: check-registry-value-at-hkey-local-machine-system-currentcontrolset-services-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-microsoft-network-server-digitally-sign-communications-if-client-agrees-set
