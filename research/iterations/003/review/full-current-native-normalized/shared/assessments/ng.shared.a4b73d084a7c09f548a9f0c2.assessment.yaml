assessment:
  id: ng.shared.a4b73d084a7c09f548a9f0c2
  version: 1
  assessment_title: The nobody access for RPC encryption key storage service must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    etc-default-keyserv-file-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/default/keyserv
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*ENABLE_NOBODY_KEYS=(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: The (/etc/default/keyserv) file.
  states:
    state-no-or-no-string:
      state_title: NO or no string.
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^[Nn][Oo]$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-check-see-that-nobody-keys-disabled:
      test_title: Check to see that nobody keys are disabled.
      capability: independent.textfilecontent54
      object: etc-default-keyserv-file-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-no-or-no-string
  evaluate:
    test: test-check-see-that-nobody-keys-disabled
