assessment:
  id: ng.shared.8d819d97d1745c679aebf9e9
  version: 1
  assessment_title: OL09-00-002070 - OL 9 must prevent device files from being interpreted on file systems that contain user
    home directories.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-partition-object:
      capability: linux.partition
      select:
        mount_point:
          operation: pattern match
          datatype: string
          mask: false
          value: .*\/home
      object_title: null
  states:
    state-linux-partition:
      state_title: null
      capability: linux.partition
      state:
        field: mount_options
        value: nodev
        operation: equals
        datatype: string
        mask: false
        entity_check: at least one
        entity_existence: at_least_one_exists
  tests:
    test-home-mounted-noexec-option:
      test_title: /home is mounted with the noexec option
      capability: linux.partition
      object: linux-partition-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-linux-partition
  evaluate:
    test: test-home-mounted-noexec-option
