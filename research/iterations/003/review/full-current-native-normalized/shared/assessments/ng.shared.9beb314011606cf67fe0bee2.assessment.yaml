assessment:
  id: ng.shared.9beb314011606cf67fe0bee2
  version: 1
  assessment_title: The macOS system must set smart card certificate trust to moderate.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to check the revocation status of user certificates with the following
    command: /usr/bin/osascript -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.security.smartcard'')\
    .objectForKey(''checkCertificateTrust'').js EOS If the result is not "2", this is a finding.'
  inputs: {}
  evidence: []
