assessment:
  id: ng.shared.4ddec741f59b8b107d86abe2
  version: 1
  assessment_title: OL08-00-010561 - OL 8 must have the rsyslog service enabled and active.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-systemdunitproperty-collection:
      collection_title: null
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          mask: false
          value: rsyslog.service
        property:
          operation: equals
          datatype: string
          mask: false
          value: UnitFileState
    linux-systemdunitproperty-collection-2:
      collection_title: null
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          mask: false
          value: rsyslog.service
        property:
          operation: equals
          datatype: string
          mask: false
          value: ActiveState
  tests:
    test-rsyslog-service-enabled:
      test_title: rsyslog.service is enabled
      capability: linux.systemdunitproperty
      collection: linux-systemdunitproperty-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: linux.systemdunitproperty
        state:
          field: value
          value: enabled
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-rsyslog-service-active:
      test_title: rsyslog.service is active
      capability: linux.systemdunitproperty
      collection: linux-systemdunitproperty-collection-2
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: linux.systemdunitproperty
        state:
          field: value
          value: active
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-rsyslog-service-enabled
    - test: test-rsyslog-service-active
