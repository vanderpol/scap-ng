assessment:
  id: ng.shared.47b624c70aea8d3c57448790
  version: 1
  assessment_title: The built-in guest account must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    return-renamed-guest-account-information-collection:
      collection_title: Return the renamed guest account information
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: $( if((Get-CimInstance Win32_OperatingSystem).ProductType -eq 2){ Get-ADUser -Filter * -Properties SID |
            Where-Object {$_.SID -match "^S-1-5-[0-9-]+-501$"} | Select-Object Name,Enabled -First 1 | Format-List } else
            { Get-Localuser | Where-Object {$_.SID -match '^S-1-5-[0-9-]+-501$'} } ) | Format-List
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: .+
  tests:
    test-windows-built-in-guest-account-disabled:
      test_title: Windows built-in guest account must be disabled.
      capability: independent.shellcommand
      collection: return-renamed-guest-account-information-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Guest account must not be enabled
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: Enabled\s+:\s+True
          operation: pattern match
          datatype: string
          mask: false
          entity_check: none satisfy
          entity_existence: at_least_one_exists
  evaluate:
    test: test-windows-built-in-guest-account-disabled
