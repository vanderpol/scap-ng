assessment:
  id: ng.shared.2eb281ce5b275093f4f3f7c4
  version: 1
  assessment_title: The macOS system must configure audit log folders to mode 700 or less permissive.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured with audit log folders set to mode 700 or less permissive with the following
    command: /usr/bin/stat -f %A $(/usr/bin/grep ''^dir'' /etc/security/audit_control | /usr/bin/awk -F: ''{print $2}'') If
    the result is not a mode of 700 or less permissive, this is a finding.'
  inputs: []
  evidence: []
