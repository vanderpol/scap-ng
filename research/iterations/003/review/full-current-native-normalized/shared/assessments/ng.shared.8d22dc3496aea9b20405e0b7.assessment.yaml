assessment:
  id: ng.shared.8d22dc3496aea9b20405e0b7
  version: 1
  assessment_title: OL 8 must prevent files with the setuid and setgid bit set from being executed on file systems that are
    imported via Network File System (NFS).
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: If no NFS mounts are configured, this requirement is Not Applicable. Verify file systems being imported
    via NFS are mounted with the "nosuid" option with the following command: $ sudo grep nfs /etc/fstab | grep nosuid UUID=e06097bb-cfcd-437b-9e4d-a691f5662a7d
    /store nfs rw,nosuid,nodev,noexec 0 0 If a file system found in "/etc/fstab" refers to NFS and it does not have the "nosuid"
    option set, this is a finding.'
  inputs: []
  evidence: []
