assessment:
  id: ng.shared.797fbc2c167035c0f7f4c039
  version: 1
  assessment_title: The macOS system must configure audit log files group to wheel.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured with audit log files group-owned by wheel with the following command:
    /bin/ls -n $(/usr/bin/grep ''^dir'' /etc/security/audit_control | /usr/bin/awk -F: ''{print $2}'') | /usr/bin/awk ''{s+=$4}
    END {print s}'' If the result is not "0", this is a finding.'
  inputs: {}
  evidence: []
