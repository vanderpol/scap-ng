assessment:
  id: ng.shared.c845faa02b9c2c1b5cf3a097
  version: 1
  assessment_title: The macOS system must be configured with a firmware password to prevent access to single user mode and
    booting from alternative media.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    os-firmware-password-require-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/sbin/firmwarepasswd -check | /usr/bin/grep "Password Enabled: Yes"'
      object_title: os_firmware_password_require_recommended_object
  states:
    state-os-firmware-password-require-recommended-state:
      state_title: os_firmware_password_require_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: .*
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-os-firmware-password-require-recommended-test:
      test_title: os_firmware_password_require_recommended_test
      capability: independent.shellcommand
      object: os-firmware-password-require-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-os-firmware-password-require-recommended-state
  evaluate:
    test: test-os-firmware-password-require-recommended-test
