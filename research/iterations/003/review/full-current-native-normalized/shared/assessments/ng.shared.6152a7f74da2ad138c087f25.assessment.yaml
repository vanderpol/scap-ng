assessment:
  id: ng.shared.6152a7f74da2ad138c087f25
  version: 1
  assessment_title: UAC - Admin Elevation Prompt
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Microsoft\Windows\CurrentVersion\Policies\System
        name:
          operation: equals
          datatype: string
          mask: false
          value: ConsentPromptBehaviorAdmin
  tests:
    test-user-account-control-behavior-elevation-prompt-administrators-in-admin-approval:
      test_title: '''User Account Control: Behavior of the elevation prompt for administrators in Admin Approval Mode'' is
        set to ''Prompt for consent'' or more secure options'
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals 4 or less than
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '4'
            operation: less than or equal
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-user-account-control-behavior-elevation-prompt-administrators-in-admin-approval-2:
      test_title: '''User Account Control: Behavior of the elevation prompt for administrators in Admin Approval Mode'' is
        not set to ''Elevate without prompting'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value is greater than 0
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '0'
            operation: greater than
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-user-account-control-behavior-elevation-prompt-administrators-in-admin-approval
    - test: test-user-account-control-behavior-elevation-prompt-administrators-in-admin-approval-2
