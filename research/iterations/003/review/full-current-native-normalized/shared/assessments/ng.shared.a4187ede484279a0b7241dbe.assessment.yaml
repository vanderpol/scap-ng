assessment:
  id: ng.shared.a4187ede484279a0b7241dbe
  version: 1
  assessment_title: WN12-CC-000139
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit
        name:
          operation: pattern match
          datatype: string
          mask: false
          value: ProcessCreationIncludeCmdLine_Enabled
      object_title: null
    windows-registry-object-2:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Microsoft\Windows NT\CurrentVersion
        name:
          operation: equals
          datatype: string
          mask: false
          value: CurrentVersion
      object_title: null
  states:
    state-reg-dword-type-and-value-equals-1:
      state_title: REG_DWORD type and value equals 1
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    state-reg-sz-type-and-value-is-equal-to-6-2:
      state_title: Reg_Sz type and value is equal to 6.2
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_sz
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '6.2'
          operation: equals
          datatype: version
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-include-command-line-in-process-creation-events-set-enabled:
      test_title: '''Include command line in process creation events'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: all_exist
      check: all
      states:
      - state-reg-dword-type-and-value-equals-1
    test-os-version-equal-6-2-windows-server-2012:
      test_title: The OS Version is equal to 6.2 (Windows Server 2012)
      capability: windows.registry
      object: windows-registry-object-2
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-sz-type-and-value-is-equal-to-6-2
  evaluate:
    any:
    - test: test-include-command-line-in-process-creation-events-set-enabled
    - test: test-os-version-equal-6-2-windows-server-2012
