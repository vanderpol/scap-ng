assessment:
  id: ng.shared.86056dfed37820f01c2cff8f
  version: 1
  assessment_title: Group Policy - Do Not Turn off Background Refresh (Windows 2012)
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Microsoft\Windows\CurrentVersion\Policies\system
        name:
          operation: equals
          datatype: string
          mask: false
          value: DisableBkGndGroupPolicy
  tests:
    test-verifies-turn-off-background-refresh-group-policy-set-disabled:
      test_title: Verifies 'Turn Off Background Refresh of Group Policy' is set to 'Disabled'
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
    test-verifies-disablebkgndgrouppolicy-registry-value-set-0:
      test_title: Verifies 'DisableBkGndGroupPolicy' registry value is set to '0'
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals 0
        state_capability: windows.registry
        state:
          field: value
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    any:
    - test: test-verifies-turn-off-background-refresh-group-policy-set-disabled
    - test: test-verifies-disablebkgndgrouppolicy-registry-value-set-0
