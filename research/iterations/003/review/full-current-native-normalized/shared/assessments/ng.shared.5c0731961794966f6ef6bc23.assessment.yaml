assessment:
  id: ng.shared.5c0731961794966f6ef6bc23
  version: 1
  assessment_title: WN19-AU-000320 - Windows Server 2019 must be configured to audit System - IPsec Driver successes.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-auditeventpolicysubcategories-collection:
      collection_title: null
      capability: windows.auditeventpolicysubcategories
  tests:
    test-audit-ipsec-driver-success-only:
      test_title: Audit - IPSec Driver - Success only
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: Audit - IPSec Driver - Success only
          capability: windows.auditeventpolicysubcategories
          state:
            field: ipsec_driver
            value: AUDIT_SUCCESS
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: Audit - IPSec Driver - Success and Failure
          capability: windows.auditeventpolicysubcategories
          state:
            field: ipsec_driver
            value: AUDIT_SUCCESS_FAILURE
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-audit-ipsec-driver-success-only
