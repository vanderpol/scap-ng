assessment:
  id: ng.shared.24d23375dfd7368dc8430207
  version: 1
  assessment_title: The system must be configured to store any process core dumps in a specific, centralized directory.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    coreadm-collection:
      collection_title: coreadm
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: coreadm
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: 'global core file pattern: (.*)'
  tests:
    test-system-configured-store-any-process-core-dumps-in-specific-centralized:
      test_title: The system must be configured to store any process core dumps in a specific, centralized directory.
      capability: independent.shellcommand
      collection: coreadm-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Check that the output starts with /' with an exit status of 0
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: subexpression
            value: ^\/.*
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-system-configured-store-any-process-core-dumps-in-specific-centralized
