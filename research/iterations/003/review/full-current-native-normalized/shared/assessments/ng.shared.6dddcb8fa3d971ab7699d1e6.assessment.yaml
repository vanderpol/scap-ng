assessment:
  id: ng.shared.6dddcb8fa3d971ab7699d1e6
  version: 1
  assessment_title: The Oracle Linux operating system must audit all executions of privileged functions.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system audits the execution of privileged functions using the following command: # grep
    -iw execve /etc/audit/audit.rules -a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -k setuid -a always,exit
    -F arch=b64 -S execve -C uid!=euid -F euid=0 -k setuid -a always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0 -k
    setgid -a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -k setgid If both the "b32" and "b64" audit rules for
    "SUID" files are not defined, this is a finding. If both the "b32" and "b64" audit rules for "SGID" files are not defined,
    this is a finding.'
  inputs: {}
  evidence: []
