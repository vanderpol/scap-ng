assessment:
  id: ng.shared.66526c6c79bebe02e5921ec4
  version: 1
  assessment_title: The macOS system must configure the SSH ServerAliveInterval to 900.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to set the SSH ServerAliveInterval to 900 with the following command:
    ret="pass" for u in $(/usr/bin/dscl . -list /Users UniqueID | /usr/bin/awk ''$2 > 500 {print $1}''); do sshCheck=$(/usr/bin/sudo
    -u $u /usr/bin/ssh -G . | /usr/bin/grep -c "^serveraliveinterval 900") if [[ "$sshCheck" == "0" ]]; then ret="fail" break
    fi done /bin/echo $ret If the result is not "pass", this is a finding.'
  inputs: {}
  evidence: []
