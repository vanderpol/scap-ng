assessment:
  id: ng.shared.32b793d5da2bd55aa491c4f9
  version: 1
  assessment_title: The SUSE operating system must be configured to allow sending email notifications of unauthorized configuration
    changes to designated personnel.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that the operating system is configured to allow sending email notifications. Note: The "mailx" package
    provides the "mail" command that is used to send email messages. Verify that the "mailx" package is installed on the system:
    > sudo zypper se mailx i | mailx | A MIME-Capable Implementation of the mailx Command | package If "mailx" package is
    not installed, this is a finding.'
  inputs: {}
  evidence: []
