assessment:
  id: ng.shared.a0503dbe858042967b8ba72b
  version: 1
  assessment_title: The Cisco router must be configured to enforce approved authorizations for controlling the flow of management
    information within the device based on control policies.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Review the Cisco router configuration to verify that it is compliant with this requirement. Step 1: Verify that
    the line vty has an ACL inbound applied as shown in the example below. line vty 0 1 access-class MANAGEMENT_NET in transport
    input ssh Step 2: Verify that the ACL permits only hosts from the management network to access the router. ip access-list
    extended MANAGEMENT_NET permit ip x.x.x.0 0.0.0.255 any deny ip any any log-input If the Cisco router is not configured
    to enforce approved authorizations for controlling the flow of management information within the device based on control
    policies, this is a finding.'
  inputs: {}
  evidence: []
