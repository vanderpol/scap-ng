assessment:
  id: ng.shared.3c6ea2c7501b2880f60e982c
  version: 1
  assessment_title: All home directories must be owned by the respective user assigned to it in /etc/passwd.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The root role is required. Check that home directories are owned by the correct user. # export IFS=":"; logins
    -uxo | while read user uid group gid gecos home rest; do result=$(find ${home} -type d -prune \! -user $user -print 2>/dev/null);
    if [ ! -z "${result}" ]; then echo "User: ${user}\tOwner: $(ls -ld $home | awk ''{ print $3 }'')"; fi; done If any output
    is produced, this is a finding.'
  inputs: []
  evidence: []
