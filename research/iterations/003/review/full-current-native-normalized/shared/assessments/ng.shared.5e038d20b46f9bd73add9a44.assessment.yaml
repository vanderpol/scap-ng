assessment:
  id: ng.shared.5e038d20b46f9bd73add9a44
  version: 1
  assessment_title: The Ubuntu operating system must configure the uncomplicated firewall to rate-limit impacted network interfaces.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    ubuntu-configure-uncomplicated-firewall-ufw-rate-limit-impacted-network-interfaces-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: ss -l46utn
        pattern:
          operation: pattern match
          datatype: string
          value: ^\S+\s+(?:LISTEN)(?:\s+\S+\s+){2}\[:+\d*\]:(\S+)\s+
      object_title: Ubuntu must configure the Uncomplicated Firewall (ufw) to rate-limit impacted network interfaces. All
        network ports in 'LISTEN' state.
    ubuntu-configure-uncomplicated-firewall-ufw-rate-limit-impacted-network-interfaces-object-2:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: ufw status
        pattern:
          operation: pattern match
          datatype: string
          value: ^(\d+)(?:\/|\s).*(?:LIMIT|DENY)\s+
      object_title: Ubuntu must configure the Uncomplicated Firewall (ufw) to rate-limit impacted network interfaces.
  variables:
    ufw-rules-ports-that-either-limit-or-deny-variable:
      title: ufw rules ports that are either LIMIT or DENY
      kind: local
      datatype: string
      expression:
        unique:
          values:
            object: ubuntu-configure-uncomplicated-firewall-ufw-rate-limit-impacted-network-interfaces-object-2
            field: subexpression
  states:
    state-ubuntu-must-configure-the-uncomplicated-firewall-ufw-to-:
      state_title: Ubuntu must configure the Uncomplicated Firewall (ufw) to rate-limit impacted network interfaces. Firewall
        rules which 'LIMIT' or 'DENY' ports
      capability: independent.shellcommand
      state:
        field: subexpression
        value:
          variable: ufw-rules-ports-that-either-limit-or-deny-variable
        operation: pattern match
        datatype: string
        variable_check: at least one
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-ubuntu-configure-uncomplicated-firewall-ufw-rate-limit-impacted-network-interfaces:
      test_title: Ubuntu must configure the Uncomplicated Firewall (ufw) to rate-limit impacted network interfaces.
      capability: independent.shellcommand
      object: ubuntu-configure-uncomplicated-firewall-ufw-rate-limit-impacted-network-interfaces-object
      check_existence: at_least_one_exists
      check: only one
      states:
      - state-ubuntu-must-configure-the-uncomplicated-firewall-ufw-to-
  evaluate:
    test: test-ubuntu-configure-uncomplicated-firewall-ufw-rate-limit-impacted-network-interfaces
