assessment:
  id: ng.shared.f4093c705c4680bb644cb74f
  version: 1
  assessment_title: The Oracle Linux operating system must disable Kernel core dumps unless needed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that kernel core dumps are disabled unless needed. Check the status of the "kdump" service with the following
    command: # systemctl status kdump.service kdump.service - Crash recovery kernel arming Loaded: loaded (/usr/lib/systemd/system/kdump.service;
    enabled) Active: active (exited) since Wed 2015-08-26 13:08:09 EDT; 43min ago Main PID: 1130 (code=exited, status=0/SUCCESS)
    kernel arming. If the "kdump" service is active, ask the System Administrator if the use of the service is required and
    documented with the Information System Security Officer (ISSO). If the service is active and is not documented, this is
    a finding.'
  inputs: []
  evidence: []
