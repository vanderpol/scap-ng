assessment:
  id: ng.shared.372841f23f266a626156e507
  version: 1
  assessment_title: Exchange must have anti-spam filtering installed.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    run-get-contentfilterconfig-see-if-data-returned-collection:
      collection_title: Run Get-ContentFilterConfig to see if data is returned
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: add-pssnapin Microsoft.Exchange.Management.Powershell.Snapin;Get-ContentFilterConfig |Select-Object -Property
            Name, Enabled | Format-Table -HideTableHeaders | Out-String -Width 4096
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: \w
      behaviors:
        error_if_stderr_exists: 'true'
  tests:
    test-if-get-contentfilterconfig-returns-no-value-this-finding:
      test_title: If Get-ContentFilterConfig returns no value, this is a finding.
      capability: independent.shellcommand
      collection: run-get-contentfilterconfig-see-if-data-returned-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Verify data is returned
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: \w
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-if-get-contentfilterconfig-returns-no-value-this-finding
