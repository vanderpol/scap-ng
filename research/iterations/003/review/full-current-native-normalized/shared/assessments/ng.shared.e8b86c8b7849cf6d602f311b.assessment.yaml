assessment:
  id: ng.shared.e8b86c8b7849cf6d602f311b
  version: 1
  assessment_title: WN10-SO-000145 - Anonymous enumeration of SAM accounts must not be allowed.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    check-hklm-system-currentcontrolset-control-lsa-restrictanonymoussam-collection:
      collection_title: Check for HKLM\System\CurrentControlSet\Control\Lsa\RestrictAnonymousSAM
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Control\Lsa
        name:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: RestrictAnonymousSAM
  tests:
    test-network-access-do-not-allow-anonymous-enumeration-sam-accounts-set:
      test_title: '''Network access: Do not allow anonymous enumeration of SAM accounts'' is set to ''Enabled'''
      capability: windows.registry
      collection: check-hklm-system-currentcontrolset-control-lsa-restrictanonymoussam-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-network-access-do-not-allow-anonymous-enumeration-sam-accounts-set
