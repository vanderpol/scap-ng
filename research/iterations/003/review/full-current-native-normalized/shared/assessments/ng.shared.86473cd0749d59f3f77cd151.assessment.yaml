assessment:
  id: ng.shared.86473cd0749d59f3f77cd151
  version: 1
  assessment_title: The Oracle Linux operating system must prevent Internet Protocol version 4 (IPv4) Internet Control Message
    Protocol (ICMP) redirect messages from being accepted.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the system will not accept IPv4 ICMP redirect messages. # grep -r net.ipv4.conf.default.accept_redirects
    /run/sysctl.d/* /etc/sysctl.d/* /usr/local/lib/sysctl.d/* /usr/lib/sysctl.d/* /lib/sysctl.d/* /etc/sysctl.conf 2> /dev/null
    If "net.ipv4.conf.default.accept_redirects" is not configured in the /etc/sysctl.conf file or in any of the other sysctl.d
    directories, is commented out, or does not have a value of "0", this is a finding. Check that the operating system implements
    the value of the "accept_redirects" variables with the following command: # /sbin/sysctl -a | grep net.ipv4.conf.default.accept_redirects
    net.ipv4.conf.default.accept_redirects = 0 If the returned line does not have a value of "0", this is a finding. If conflicting
    results are returned, this is a finding.'
  inputs: []
  evidence: []
