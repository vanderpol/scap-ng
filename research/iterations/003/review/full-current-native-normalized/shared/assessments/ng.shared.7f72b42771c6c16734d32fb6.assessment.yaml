assessment:
  id: ng.shared.7f72b42771c6c16734d32fb6
  version: 1
  assessment_title: The system must prevent the use of dictionary words for passwords.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Check /etc/default/passwd for dictionary check configuration. # grep ^DICTION /etc/default/passwd If the DICTIONLIST
    or DICTIONDBDIR settings are not present and are not set to: DICTIONLIST=/usr/share/lib/dict/words DICTIONDBDIR=/var/passwd
    this is a finding. Determine if the target files exist. # ls -l /usr/share/lib/dict/words /var/passwd If the files defined
    by DICTIONLIST or DICTIONBDIR are not present or are empty, this is a finding.'
  inputs: {}
  evidence: []
