assessment:
  id: ng.shared.7b5a681b05d57de6e0959fae
  version: 1
  assessment_title: WN10-SO-000145 - Anonymous enumeration of SAM accounts must not be allowed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    check-hklm-system-currentcontrolset-control-lsa-restrictanonymoussam-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Control\Lsa
        name:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: RestrictAnonymousSAM
      object_title: Check for HKLM\System\CurrentControlSet\Control\Lsa\RestrictAnonymousSAM
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-network-access-do-not-allow-anonymous-enumeration-sam-accounts-set:
      test_title: '''Network access: Do not allow anonymous enumeration of SAM accounts'' is set to ''Enabled'''
      capability: windows.registry
      object: check-hklm-system-currentcontrolset-control-lsa-restrictanonymoussam-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-network-access-do-not-allow-anonymous-enumeration-sam-accounts-set
