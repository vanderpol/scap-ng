assessment:
  id: ng.shared.16ca444a03d482ef6f7ab392
  version: 1
  assessment_title: Windows Server 2019 permissions on the Active Directory data files must only allow System and Administrators
    access.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This applies to domain controllers. It is NA for other systems. Run "Regedit". Navigate to "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\NTDS\Parameters".
    Note the directory locations in the values for: Database log files path DSA Database file By default, they will be \Windows\NTDS.
    If the locations are different, the following will need to be run for each. Open "Command Prompt (Admin)". Navigate to
    the NTDS directory (\Windows\NTDS by default). Run "icacls *.*". If the permissions on each file are not as restrictive
    as the following, this is a finding: NT AUTHORITY\SYSTEM:(I)(F) BUILTIN\Administrators:(I)(F) (I) - permission inherited
    from parent container (F) - full access'
  inputs: []
  evidence: []
