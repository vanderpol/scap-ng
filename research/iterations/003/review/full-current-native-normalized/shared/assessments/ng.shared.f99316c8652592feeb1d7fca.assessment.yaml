assessment:
  id: ng.shared.f99316c8652592feeb1d7fca
  version: 1
  assessment_title: NTLM NULL Session Fallback
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Control\Lsa\MSV1_0
        name:
          operation: equals
          datatype: string
          mask: false
          value: allownullsessionfallback
      object_title: null
  variables:
    network-security-allow-localsystem-null-session-fallback-variable:
      title: 'Network security: Allow LocalSystem NULL session fallback'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: Network_security_Allow_LocalSystem_NULL_session_fallback_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: network-security-allow-localsystem-null-session-fallback-variable
          operation: equals
          datatype: int
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-network-security-allow-localsystem-null-session-fallback-set-disabled:
      test_title: '''Network security: Allow LocalSystem NULL session fallback'' is set to ''Disabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-network-security-allow-localsystem-null-session-fallback-set-disabled
