assessment:
  id: ng.shared.32683bdef834aa1d3cacd8ed
  version: 1
  assessment_title: The RHEL 8 pam_unix.so module must be configured in the password-auth file to use a FIPS 140-2 approved
    cryptographic hashing algorithm for system authentication.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that the pam_unix.so module is configured to use sha512. Check that the pam_unix.so module is configured
    to use sha512 in /etc/pam.d/password-auth with the following command: $ sudo grep password /etc/pam.d/password-auth |
    grep pam_unix password sufficient pam_unix.so sha512 If "sha512" is missing, or is commented out, this is a finding.'
  inputs: []
  evidence: []
