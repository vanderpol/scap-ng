assessment:
  id: ng.shared.bafd04859f60f61e7b91a854
  version: 1
  assessment_title: Active Setup\Installed Components Registry Permissions
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    hkey-local-machine-software-microsoft-active-setup-installed-components-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SOFTWARE\Microsoft\Active Setup\Installed Components
        name:
          operation: equals
          datatype: string
          nil: true
          value: ''
      object_title: HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Active Setup\Installed Components
    hkey-local-machine-software-microsoft-active-setup-installed-components-rights-object:
      capability: windows.regkeyeffectiverights53
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SOFTWARE\Microsoft\Active Setup\Installed Components
        trustee_sid:
          operation: pattern match
          datatype: string
          value: .*
      object_title: HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Active Setup\Installed Components rights
    32-bit-installed-components-rights-except-administrators-users-system-creator-object:
      capability: windows.regkeyeffectiverights53
      set:
        operator: union
        members:
        - object: hkey-local-machine-software-microsoft-active-setup-installed-components-rights-object
        filters:
        - action: exclude
          state: state-administrators-group
        - action: exclude
          state: state-users-group
        - action: exclude
          state: state-system
        - action: exclude
          state: state-creator-owner
        - action: exclude
          state: state-all-application-packages
      object_title: 32-bit Installed Components rights, except for administrators, users, system, creator owner, and all application
        packages
    32-bit-installed-components-rights-except-adminstrators-system-creator-owner-object:
      capability: windows.regkeyeffectiverights53
      set:
        operator: union
        members:
        - object: hkey-local-machine-software-microsoft-active-setup-installed-components-rights-object
        filters:
        - action: exclude
          state: state-administrators-group
        - action: exclude
          state: state-system
        - action: exclude
          state: state-creator-owner
      object_title: 32-bit Installed Components rights, except for Adminstrators, SYSTEM, and CREATOR OWNER
    check-win32-processor-address-width-used-by-operating-system-object:
      capability: windows.wmi.query
      object_title: Check the Win32_Processor for the address width used by the operating system.
      collect:
        namespace: root\cimv2
        query: SELECT AddressWidth FROM win32_processor
    hkey-local-machine-software-wow6432node-microsoft-active-setup-installed-components-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SOFTWARE\Wow6432Node\Microsoft\Active Setup\Installed Components
        name:
          operation: equals
          datatype: string
          nil: true
          value: ''
      object_title: HKEY_LOCAL_MACHINE\SOFTWARE\Wow6432Node\Microsoft\Active Setup\Installed Components
    hkey-local-machine-software-wow6432node-microsoft-active-setup-installed-components-object-2:
      capability: windows.regkeyeffectiverights53
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SOFTWARE\Wow6432Node\Microsoft\Active Setup\Installed Components
        trustee_sid:
          operation: pattern match
          datatype: string
          value: .*
      object_title: HKEY_LOCAL_MACHINE\SOFTWARE\Wow6432Node\Microsoft\Active Setup\Installed Components rights
    64-bit-only-installed-components-rights-except-administrators-users-system-object:
      capability: windows.regkeyeffectiverights53
      set:
        operator: union
        members:
        - object: hkey-local-machine-software-wow6432node-microsoft-active-setup-installed-components-object-2
        filters:
        - action: exclude
          state: state-administrators-group
        - action: exclude
          state: state-users-group
        - action: exclude
          state: state-system
        - action: exclude
          state: state-creator-owner
        - action: exclude
          state: state-all-application-packages
      object_title: 64-bit only Installed Components rights, except for administrators, users, system, creator owner, and
        all application packages
    64-bit-only-installed-components-rights-except-adminstrators-system-creator-object:
      capability: windows.regkeyeffectiverights53
      set:
        operator: union
        members:
        - object: hkey-local-machine-software-wow6432node-microsoft-active-setup-installed-components-object-2
        filters:
        - action: exclude
          state: state-administrators-group
        - action: exclude
          state: state-system
        - action: exclude
          state: state-creator-owner
      object_title: 64-bit only Installed Components rights, except for Adminstrators, SYSTEM, and CREATOR OWNER
  states:
