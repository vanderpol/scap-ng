          entity_existence: at_least_one_exists
        - field: key_wow64_res
          value: '0'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
    state-qenr-registry-rights:
      state_title: QENR registry rights
      capability: windows.regkeyeffectiverights53
      state:
        all:
        - field: standard_delete
          value: '0'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: standard_write_dac
          value: '0'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: standard_write_owner
          value: '0'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: access_system_security
          value: '0'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: generic_write
          value: '0'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: generic_execute
          value: '0'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: generic_all
          value: '0'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: key_set_value
          value: '0'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: key_create_sub_key
          value: '0'
