assessment:
  id: ng.shared.7d2c5c6b700fd8847dbb6e70
  version: 1
  assessment_title: Audit Policy Subcategory Setting
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: System\Currentcontrolset\Control\Lsa
        name:
          operation: equals
          datatype: string
          value: scenoapplylegacyauditpolicy
      object_title: null
  variables:
    audit-force-audit-policy-subcategory-settings-windows-vista-or-later-variable:
      title: 'Audit: Force audit policy subcategory settings (Windows Vista or later) to override audit policy category settings'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: override_audit_policy_settings_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: audit-force-audit-policy-subcategory-settings-windows-vista-or-later-variable
          operation: equals
          datatype: int
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-audit-force-audit-policy-subcategory-settings-windows-vista-or-later:
      test_title: '''Audit: Force audit policy subcategory settings (Windows Vista or later) to override audit policy category
        settings'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-audit-force-audit-policy-subcategory-settings-windows-vista-or-later
