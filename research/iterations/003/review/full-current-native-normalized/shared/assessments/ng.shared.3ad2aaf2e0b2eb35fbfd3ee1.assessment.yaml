assessment:
  id: ng.shared.3ad2aaf2e0b2eb35fbfd3ee1
  version: 1
  assessment_title: The Oracle Linux operating system must implement certificate status checking for PKI authentication.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system implements certificate status checking for PKI authentication. Check to see if Online
    Certificate Status Protocol (OCSP) is enabled on the system with the following command: # grep cert_policy /etc/pam_pkcs11/pam_pkcs11.conf
    | grep -v "^#" cert_policy = ca, ocsp_on, signature; cert_policy = ca, ocsp_on, signature; cert_policy = ca, ocsp_on,
    signature; There should be at least three lines returned. If "ocsp_on" is not present in all uncommented "cert_policy"
    lines in "/etc/pam_pkcs11/pam_pkcs11.conf", this is a finding.'
  inputs: []
  evidence: []
