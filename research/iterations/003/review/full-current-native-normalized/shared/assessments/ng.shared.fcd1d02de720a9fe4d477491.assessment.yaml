assessment:
  id: ng.shared.fcd1d02de720a9fe4d477491
  version: 1
  assessment_title: The macOS system must implement cryptographic mechanisms to protect the confidentiality and integrity
    of all information at rest.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    system-settings-filevault-enforce-recommended-object-collection:
      collection_title: system_settings_filevault_enforce_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: "dontAllowDisable=$(/usr/bin/osascript -l JavaScript << EOS\n$.NSUserDefaults.alloc.initWithSuiteName('com.apple.MCX')\\\
            \n.objectForKey('dontAllowFDEDisable').js\nEOS\n)\nfileVault=$(/usr/bin/fdesetup status | /usr/bin/grep -c \"\
            FileVault is On.\")\nif [[ \"$dontAllowDisable\" == \"true\" ]] && [[ \"$fileVault\" == 1 ]]; then\n  echo \"\
            1\"\nelse\n  echo \"0\"\nfi"
  tests:
    test-system-settings-filevault-enforce-recommended-test:
      test_title: system_settings_filevault_enforce_recommended_test
      capability: independent.shellcommand
      collection: system-settings-filevault-enforce-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: system_settings_filevault_enforce_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: '1'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-system-settings-filevault-enforce-recommended-test
