assessment:
  id: ng.shared.fad834d78843d97269b4c575
  version: 1
  assessment_title: The macOS system must be configured with a firmware password to prevent access to single user mode and
    booting from alternative media.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-firmware-password-require-recommended-object-collection:
      collection_title: os_firmware_password_require_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/sbin/firmwarepasswd -check | /usr/bin/grep "Password Enabled: Yes"'
  tests:
    test-os-firmware-password-require-recommended-test:
      test_title: os_firmware_password_require_recommended_test
      capability: independent.shellcommand
      collection: os-firmware-password-require-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: os_firmware_password_require_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: .*
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-os-firmware-password-require-recommended-test
