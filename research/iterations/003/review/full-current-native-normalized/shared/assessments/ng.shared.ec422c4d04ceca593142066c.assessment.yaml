assessment:
  id: ng.shared.ec422c4d04ceca593142066c
  version: 1
  assessment_title: UBTU-22-431010 - Ubuntu 22.04 LTS must have the "apparmor" package installed.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    apparmor-installed-collection:
      collection_title: apparmor is installed
      capability: linux.dpkginfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: apparmor
  tests:
    test-package-apparmor-installed:
      test_title: package apparmor is installed
      capability: linux.dpkginfo
      collection: apparmor-installed-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state: null
  evaluate:
    test: test-package-apparmor-installed
