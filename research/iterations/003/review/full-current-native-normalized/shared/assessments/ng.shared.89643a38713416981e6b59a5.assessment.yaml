assessment:
  id: ng.shared.89643a38713416981e6b59a5
  version: 1
  assessment_title: Unauthorized remotely accessible registry paths must not be configured.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding: Registry
    Hive: HKEY_LOCAL_MACHINE Registry Path: \System\CurrentControlSet\Control\SecurePipeServers\Winreg\AllowedExactPaths\
    Value Name: Machine Value Type: REG_MULTI_SZ Value: see below System\CurrentControlSet\Control\ProductOptions System\CurrentControlSet\Control\Server
    Applications Software\Microsoft\Windows NT\CurrentVersion Legitimate applications may add entries to this registry value.
    If an application requires these entries to function properly and is documented with the ISSO, this would not be a finding.
    Documentation must contain supporting information from the vendor''s instructions.'
  inputs: {}
  evidence: []
