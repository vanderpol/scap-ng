assessment:
  id: ng.shared.ba2b9a9cd3d5f0e3cd620fe7
  version: 1
  assessment_title: The macOS system must disable Media Sharing.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    system-settings-media-sharing-disabled-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: "/usr/bin/osascript -l JavaScript << EOS\nfunction run() {\n  let pref1 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.applicationaccess')\\\
            \n.objectForKey('allowMediaSharing'))\n  let pref2 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.applicationaccess')\\\
            \n.objectForKey('allowMediaSharingModification'))\n  if ( pref1 == false && pref2 == false ) {\n    return(\"\
            true\")\n  } else {\n    return(\"false\")\n  }\n}\nEOS"
      object_title: system_settings_media_sharing_disabled_recommended_object
  states:
    state-system-settings-media-sharing-disabled-recommended-state:
      state_title: system_settings_media_sharing_disabled_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: 'true'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-settings-media-sharing-disabled-recommended-test:
      test_title: system_settings_media_sharing_disabled_recommended_test
      capability: independent.shellcommand
      object: system-settings-media-sharing-disabled-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-system-settings-media-sharing-disabled-recommended-state
  evaluate:
    test: test-system-settings-media-sharing-disabled-recommended-test
