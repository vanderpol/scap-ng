assessment:
  id: ng.shared.8fcd57f464040a673a428509
  version: 1
  assessment_title: WN10-AU-000160 - The system must be configured to audit System - System Integrity successes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-audit-system-integrity-success-only:
      state_title: Audit - System Integrity - Success only
      capability: windows.auditeventpolicysubcategories
      state:
        field: system_integrity
        value: AUDIT_SUCCESS
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-audit-system-integrity-success-and-failure:
      state_title: Audit - System Integrity - Success and Failure
      capability: windows.auditeventpolicysubcategories
      state:
        field: system_integrity
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-system-integrity-success-only:
      test_title: Audit - System Integrity - Success only
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-audit-system-integrity-success-only
      - state-audit-system-integrity-success-and-failure
  evaluate:
    test: test-audit-system-integrity-success-only
