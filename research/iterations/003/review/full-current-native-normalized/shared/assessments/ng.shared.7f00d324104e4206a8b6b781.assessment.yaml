assessment:
  id: ng.shared.7f00d324104e4206a8b6b781
  version: 1
  assessment_title: Kernel "net.ipv4.conf.all.accept_source_route" Parameter Configuration and Runtime Check
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-sysctl-object:
      capability: unix.sysctl
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: net.ipv4.conf.all.accept_source_route
      object_title: null
    other-sysctl-configuration-files-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: other-sysctl-configuration-file-locations-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: \.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: (?:^|\.*\n)\s*net\.ipv4\.conf\.all\.accept_source_route\s*=\s*(\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: other sysctl configuration files
    etc-sysctl-conf-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/sysctl.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: (?:^|.*\n)\s*net\.ipv4\.conf\.all\.accept_source_route\s*=\s*(\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: /etc/sysctl.conf
    all-sysctl-configuration-files-object:
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - object: other-sysctl-configuration-files-object
        - object: etc-sysctl-conf-object
      object_title: all sysctl configuration files
  variables:
    other-sysctl-configuration-file-locations-variable:
      title: other sysctl configuration file locations
      kind: constant
      datatype: string
      expression:
        literal:
        - /etc/sysctl.d
        - /run/sysctl.d
        - /lib/sysctl.d
        - /usr/lib/sysctl.d
        - /usr/local/lib/sysctl.d
  states:
    state-unix-sysctl:
      state_title: null
      capability: unix.sysctl
      state:
        field: value
        value: '0'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '0'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-kernel-runtime-parameter-net-ipv4-conf-all-accept-source-route:
      test_title: kernel runtime parameter net.ipv4.conf.all.accept_source_route set to the appropriate value
      capability: unix.sysctl
      object: unix-sysctl-object
      check_existence: all_exist
      check: all
      states:
      - state-unix-sysctl
    test-net-ipv4-conf-all-accept-source-route-setting-in-acceptable:
      test_title: net.ipv4.conf.all.accept_source_route setting in acceptable directory is set to 0, and nothing else, and
        there are no conflicting settings in other files
      capability: independent.textfilecontent54
      object: all-sysctl-configuration-files-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    all:
    - test: test-kernel-runtime-parameter-net-ipv4-conf-all-accept-source-route
    - test: test-net-ipv4-conf-all-accept-source-route-setting-in-acceptable
