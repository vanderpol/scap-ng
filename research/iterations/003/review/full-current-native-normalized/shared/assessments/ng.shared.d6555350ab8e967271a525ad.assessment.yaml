assessment:
  id: ng.shared.d6555350ab8e967271a525ad
  version: 1
  assessment_title: The macOS system must be configured so that any connection to the system must display the Standard Mandatory
    DOD Notice and Consent Banner before granting GUI access to the system.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    os-policy-banner-loginwindow-enforce-stig-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /bin/ls -ld /Library/Security/PolicyBanner.rtf*
      object_title: os_policy_banner_loginwindow_enforce_stig_object
  states:
    state-os-policy-banner-loginwindow-enforce-stig-state:
      state_title: os_policy_banner_loginwindow_enforce_stig_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: .*
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-os-policy-banner-loginwindow-enforce-stig-test:
      test_title: os_policy_banner_loginwindow_enforce_stig_test
      capability: independent.shellcommand
      object: os-policy-banner-loginwindow-enforce-stig-object-object
      check_existence: all_exist
      check: all
      states:
      - state-os-policy-banner-loginwindow-enforce-stig-state
  evaluate:
    test: test-os-policy-banner-loginwindow-enforce-stig-test
