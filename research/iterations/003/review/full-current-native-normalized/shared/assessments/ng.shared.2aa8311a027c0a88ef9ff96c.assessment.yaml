assessment:
  id: ng.shared.2aa8311a027c0a88ef9ff96c
  version: 1
  assessment_title: The system must not respond to multicast echo requests.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    ipadm-show-prop-p-respond-echo-multicast-co-current-ipv4-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: ipadm show-prop -p _respond_to_echo_multicast -co current ipv4
        pattern:
          operation: pattern match
          datatype: string
          value: .*
      object_title: ipadm show-prop -p _respond_to_echo_multicast -co current ipv4
    ipadm-show-prop-p-respond-echo-multicast-co-current-ipv6-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: ipadm show-prop -p _respond_to_echo_multicast -co current ipv6
        pattern:
          operation: pattern match
          datatype: string
          value: .*
      object_title: ipadm show-prop -p _respond_to_echo_multicast -co current ipv6
  states:
    state-check-that-line-returns-0-with-an-exit-status-of-0:
      state_title: Check that line returns '0' with an exit status of 0
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: '0'
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-system-not-respond-ipv4-multicast-echo-requests:
      test_title: The system must not respond to ipv4 multicast echo requests.
      capability: independent.shellcommand
      object: ipadm-show-prop-p-respond-echo-multicast-co-current-ipv4-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-check-that-line-returns-0-with-an-exit-status-of-0
    test-system-not-respond-ipv6-multicast-echo-requests:
      test_title: The system must not respond to ipv6 multicast echo requests.
      capability: independent.shellcommand
      object: ipadm-show-prop-p-respond-echo-multicast-co-current-ipv6-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-check-that-line-returns-0-with-an-exit-status-of-0
  evaluate:
    all:
    - test: test-system-not-respond-ipv4-multicast-echo-requests
    - test: test-system-not-respond-ipv6-multicast-echo-requests
