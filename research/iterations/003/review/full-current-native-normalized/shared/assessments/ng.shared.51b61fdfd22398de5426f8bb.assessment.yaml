assessment:
  id: ng.shared.51b61fdfd22398de5426f8bb
  version: 1
  assessment_title: The Oracle Linux operating system must specify the default "include" directory for the /etc/sudoers file.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: If the "include" and "includedir" directives are not present in the /etc/sudoers file, this requirement
    is not applicable. Verify the operating system specifies only the default "include" directory for the /etc/sudoers file
    with the following command: $ sudo grep include /etc/sudoers #includedir /etc/sudoers.d If the results are not "/etc/sudoers.d"
    or additional files or directories are specified, this is a finding. Verify the operating system does not have nested
    "include" files or directories within the /etc/sudoers.d directory with the following command: $ sudo grep -r include
    /etc/sudoers.d If results are returned, this is a finding.'
  inputs: {}
  evidence: []
