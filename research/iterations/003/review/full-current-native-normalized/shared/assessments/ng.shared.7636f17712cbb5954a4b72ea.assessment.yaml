assessment:
  id: ng.shared.7636f17712cbb5954a4b72ea
  version: 1
  assessment_title: Windows PowerShell must be updated to a version that supports script block logging on Windows 2012/2012
    R2.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Open "Windows PowerShell". Enter "$PSVersionTable". If the value for "PSVersion" is not 4.0 or 5.x, this is a
    finding. Windows 2012 R2 includes PowerShell 4.0 by default. Windows 2012 must be updated. If PowerShell 4.0 is used,
    the required patch for script block logging will be verified with the requirement to have that enabled.
  inputs: []
  evidence: []
