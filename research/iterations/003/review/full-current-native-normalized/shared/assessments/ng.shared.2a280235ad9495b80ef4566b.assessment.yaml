assessment:
  id: ng.shared.2a280235ad9495b80ef4566b
  version: 1
  assessment_title: File Transfer Protocol (FTP) servers must be configured to prevent anonymous logons.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If FTP is not installed on the system, this is NA. Determine the IP address and port number assigned to FTP
    sites from documentation or configuration. If Microsoft FTP is used, open "Internet Information Services (IIS) Manager".
    Select "Sites" under the server name. For any sites that reference FTP, view the Binding information for IP address and
    port. The standard port for FTP is 21, however this may be changed. Open a "Command Prompt". Attempt to log on as the
    user "anonymous" with the following commands: Note: Returned results may vary depending on the FTP server software. C:\>
    "ftp" ftp> "Open IP Address Port" (Substituting [IP Address] and [Port] with the information previously identified. If
    no IP Address was listed in the Binding, attempt using "localhost".) (Connected to IP Address 220 Microsoft FTP Service)
    User (IP Address): "anonymous" (331 Anonymous access allowed, send identity (e-mail name) as password.) Password: "password"
    (230 User logged in.) ftp> If the response indicates that an anonymous FTP login was permitted, this is a finding. If
    accounts with administrator privileges are used to access FTP, this is a CAT I finding.'
  inputs: {}
  evidence: []
