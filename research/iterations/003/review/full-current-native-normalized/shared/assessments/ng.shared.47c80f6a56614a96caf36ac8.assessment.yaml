assessment:
  id: ng.shared.47c80f6a56614a96caf36ac8
  version: 1
  assessment_title: Audit Log Warning Level
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Services\Eventlog\Security
        name:
          operation: equals
          datatype: string
          mask: false
          value: WarningLevel
  variables:
    mss-warninglevel-percentage-threshold-security-event-log-at-which-system-variable:
      title: 'MSS: (WarningLevel) Percentage threshold for the security event log at which the system will generate a warning'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: event_log_threshold_warning_var
        validation:
          alternatives:
          - literal: '90'
            hint: 90_percent
  tests:
    test-mss-warninglevel-percentage-threshold-security-event-log-at-which-system:
      test_title: '''MSS: (WarningLevel) Percentage threshold for the security event log at which the system will generate
        a warning'' is set to 90 percent or less'
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value is less than or equal to variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: mss-warninglevel-percentage-threshold-security-event-log-at-which-system-variable
            operation: less than or equal
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-mss-warninglevel-percentage-threshold-security-event-log-at-which-system
