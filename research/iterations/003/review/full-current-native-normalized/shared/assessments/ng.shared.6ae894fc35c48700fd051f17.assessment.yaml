assessment:
  id: ng.shared.6ae894fc35c48700fd051f17
  version: 1
  assessment_title: Audit Access of Global System Objects
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\Currentcontrolset\Control\Lsa
        name:
          operation: equals
          datatype: string
          mask: false
          value: AuditBaseObjects
      object_title: null
  variables:
    audit-audit-access-global-system-objects-variable:
      title: 'Audit: Audit the access of global system objects'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: audit_access_global_system_objects_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: audit-audit-access-global-system-objects-variable
          operation: equals
          datatype: int
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-audit-audit-access-global-system-objects-set-disabled:
      test_title: '''Audit: Audit the access of global system objects'' is set to ''Disabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-audit-audit-access-global-system-objects-set-disabled
