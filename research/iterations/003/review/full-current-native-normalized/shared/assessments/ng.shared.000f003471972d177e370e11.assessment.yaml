assessment:
  id: ng.shared.000f003471972d177e370e11
  version: 1
  assessment_title: The macOS system must enable Recovery Lock.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    os-recovery-lock-enable-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/libexec/mdmclient QuerySecurityInfo 2>/dev/null | /usr/bin/grep "IsRecoveryLockEnabled = 1"
      object_title: os_recovery_lock_enable_recommended_object
  states:
    state-os-recovery-lock-enable-recommended-state:
      state_title: os_recovery_lock_enable_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: .*
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-os-recovery-lock-enable-recommended-test:
      test_title: os_recovery_lock_enable_recommended_test
      capability: independent.shellcommand
      object: os-recovery-lock-enable-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-os-recovery-lock-enable-recommended-state
  evaluate:
    test: test-os-recovery-lock-enable-recommended-test
