  version: 1
  assessment_title: The Oracle Linux operating system must generate audit records for all unsuccessful account access events.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system generates audit records when unsuccessful account access events occur. Check the
    file system rule in "/etc/audit/audit.rules" with the following commands: # grep -i /var/run/faillock /etc/audit/audit.rules
    -w /var/run/faillock -p wa -k logins If the command does not return any output, this is a finding.'
  inputs: []
  evidence: []
