assessment:
  id: ng.shared.6213f49258c8d401a1444566
  version: 1
  assessment_title: The audit system must be configured to audit all discretionary access control permission modifications.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    auditconfig-t-getflags-cut-f2-d-collection:
      collection_title: auditconfig -t -getflags | cut -f2 -d=
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: auditconfig -t -getflags | cut -f2 -d=
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
  tests:
    test-audit-system-configured-audit-all-discretionary-access-control-permission-modifications:
      test_title: The audit system must be configured to audit all discretionary access control permission modifications.
      capability: independent.shellcommand
      collection: auditconfig-t-getflags-cut-f2-d-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: fm is returned in the output
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: fm
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-audit-system-configured-audit-all-discretionary-access-control-permission-modifications
