assessment:
  id: ng.shared.e57f833be60f024529bf91b4
  version: 1
  assessment_title: AZLX-23-002155 - Amazon Linux 2023 must audit all uses of the chcon command.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/audit.rules
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*-a\s+(always,exit|exit,always)(?:\s+-S\s+all)?\s+-F\s+path=\/usr\/bin\/chcon\s+(-F\s+perm=([rwa]*x[rwa]*)\s+)?-F\s+auid>=1000\s+-F\s+auid!=(4294967295|-1|unset)(\s+(-k\s+|-F\s+key=)\S+)?\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: null
  states: {}
  tests:
    test-audit-invocations-usr-bin-chcon:
      test_title: Audit invocations of /usr/bin/chcon
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: all_exist
      check: all
  evaluate:
    test: test-audit-invocations-usr-bin-chcon
