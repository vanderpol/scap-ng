assessment:
  id: ng.shared.d116ff5c4fad8dacf53ab838
  version: 1
  assessment_title: The macOS system must require users to reauthenticate for privilege escalation when using the "sudo" command.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-sudo-timeout-configure-stig-object-collection:
      collection_title: os_sudo_timeout_configure_stig_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/sudo /usr/bin/sudo -V | /usr/bin/grep "Authentication timestamp timeout: 0.0 minutes"'
  tests:
    test-os-sudo-timeout-configure-stig-test:
      test_title: os_sudo_timeout_configure_stig_test
      capability: independent.shellcommand
      collection: os-sudo-timeout-configure-stig-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: os_sudo_timeout_configure_stig_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: .*
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-os-sudo-timeout-configure-stig-test
