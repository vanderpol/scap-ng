assessment:
  id: ng.shared.9b8c893ce387192f8710c86f
  version: 1
  assessment_title: WN19-DC-000401 - Windows Server 2019 must be configured for name-based strong mappings for certificates.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: case insensitive equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: case insensitive equals
          datatype: string
          value: Software\Microsoft\Windows\CurrentVersion\Policies\System\KDC\Parameters
        name:
          operation: case insensitive equals
          datatype: string
          value: UseStrongNameMatches
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-usestrongnamematches-1:
      test_title: UseStrongNameMatches == 1
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-usestrongnamematches-1
