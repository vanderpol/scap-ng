assessment:
  id: ng.shared.59de24acf861208b34f81a7c
  version: 1
  assessment_title: WN11-CC-000205 - Windows Telemetry must not be configured to Full.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SOFTWARE\Policies\Microsoft\Windows\DataCollection
        name:
          operation: equals
          datatype: string
          value: AllowTelemetry
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
    state-windows-registry-2:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-allow-diagnostic-data-set-enabled-diagnostic-data-off-not-recommended:
      test_title: '''Allow Diagnostic Data'' is set to ''Enabled'' with ''Diagnostic Data Off (Not recommended)'' or ''Send
        Required Diagnostic Data'' selected in ''Options:'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-windows-registry
      - state-windows-registry-2
  evaluate:
    test: test-allow-diagnostic-data-set-enabled-diagnostic-data-off-not-recommended
