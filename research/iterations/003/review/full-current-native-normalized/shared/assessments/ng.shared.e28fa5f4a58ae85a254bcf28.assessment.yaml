assessment:
  id: ng.shared.e28fa5f4a58ae85a254bcf28
  version: 1
  assessment_title: The Oracle Linux operating system must require re-authentication when using the "sudo" command.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify the operating system requires re-authentication when using the "sudo" command to elevate privileges. $
    sudo grep -ir 'timestamp_timeout' /etc/sudoers /etc/sudoers.d /etc/sudoers:Defaults timestamp_timeout=0 If conflicting
    results are returned, this is a finding. If "timestamp_timeout" is set to a negative number, is commented out, or no results
    are returned, this is a finding.
  inputs: []
  evidence: []
