assessment:
  id: ng.shared.9cbd1fccf6221276b19f3d04
  version: 1
  assessment_title: Exchange message tracking logging must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    run-get-transportservice-display-messagetrackinglogenabled-configuration-collection:
      collection_title: Run Get-TransportService to display MessageTrackingLogEnabled configuration
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: add-pssnapin Microsoft.Exchange.Management.Powershell.Snapin;Get-TransportService | Select-Object -Property
            Name, MessageTrackingLogEnabled | Format-Table -HideTableHeaders | Out-String -Width 4096
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: \w
      behaviors:
        error_if_stderr_exists: 'true'
  tests:
    test-if-value-messagetrackinglogenabled-not-set-true-this-finding:
      test_title: If the value of MessageTrackingLogEnabled is not set to True, this is a finding.
      capability: independent.shellcommand
      collection: run-get-transportservice-display-messagetrackinglogenabled-configuration-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Verify setting is true
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: (?i)true
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-if-value-messagetrackinglogenabled-not-set-true-this-finding
