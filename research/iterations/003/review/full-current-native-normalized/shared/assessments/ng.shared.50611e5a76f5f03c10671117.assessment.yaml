assessment:
  id: ng.shared.50611e5a76f5f03c10671117
  version: 1
  assessment_title: 'WN22-SO-000170 - Windows Server 2022 setting Microsoft network client: Digitally sign communications
    (if server agrees) must be configured to Enabled.'
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    check-value-stored-at-hkey-local-machine-system-currentcontrolset-services-collection:
      collection_title: Check the value stored at HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\LanmanWorkstation\Parameters\EnableSecuritySignature
      capability: windows.registry
      select:
        hive:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters
        name:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: EnableSecuritySignature
  tests:
    test-microsoft-network-client-digitally-sign-communications-if-server-agrees-set:
      test_title: '''Microsoft network client: Digitally sign communications (if server agrees)'' is set to ''Enabled'''
      capability: windows.registry
      collection: check-value-stored-at-hkey-local-machine-system-currentcontrolset-services-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-microsoft-network-client-digitally-sign-communications-if-server-agrees-set
