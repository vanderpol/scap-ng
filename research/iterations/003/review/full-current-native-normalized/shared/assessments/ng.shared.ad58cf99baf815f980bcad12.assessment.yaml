assessment:
  id: ng.shared.ad58cf99baf815f980bcad12
  version: 1
  assessment_title: Windows Server 2019 Kerberos user logon restrictions must be enforced.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This applies to domain controllers. It is NA for other systems. Verify the following is configured in the Default
    Domain Policy: Open "Group Policy Management". Navigate to "Group Policy Objects" in the Domain being reviewed (Forest
    >> Domains >> Domain). Right-click on the "Default Domain Policy". Select "Edit". Navigate to Computer Configuration >>
    Policies >> Windows Settings >> Security Settings >> Account Policies >> Kerberos Policy. If the "Enforce user logon restrictions"
    is not set to "Enabled", this is a finding.'
  inputs: []
  evidence: []
