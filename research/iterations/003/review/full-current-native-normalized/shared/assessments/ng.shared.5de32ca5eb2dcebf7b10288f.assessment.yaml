assessment:
  id: ng.shared.5de32ca5eb2dcebf7b10288f
  version: 1
  assessment_title: The macOS system must disable root logon.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable root login with the following command: /usr/bin/dscl . -read
    /Users/root UserShell 2>&1 | /usr/bin/grep -c "/usr/bin/false" If the result is not "1", this is a finding.'
  inputs: []
  evidence: []
