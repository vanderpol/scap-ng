assessment:
  id: ng.shared.1c5a424a1da5f9b445722b09
  version: 1
  assessment_title: Windows Server 2016 accounts must require passwords.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    enabled-local-accounts-passwordexpires-false-should-not-exist-list-only-object:
      capability: windows.cmdlet
      select:
        module_name:
          operation: equals
          datatype: string
          value: CimCmdlets
        module_id:
          operation: equals
          datatype: string
          nil: true
          value: ''
        module_version:
          operation: equals
          datatype: version
          nil: true
          value: ''
        verb:
          operation: equals
          datatype: string
          value: Get
        noun:
          operation: equals
          datatype: string
          value: CimInstance
        parameters:
          operation: equals
          datatype: record
          value:
            record:
            - name: class
              value: Win32_Useraccount
              operation: equals
              datatype: string
              entity_check: all
            - name: filter
              value: PasswordRequired=False and LocalAccount=True and Disabled=false
              operation: equals
              datatype: string
              entity_check: all
        select:
          operation: equals
          datatype: record
          value:
            record:
            - name: first
              value: '100'
              operation: equals
              datatype: string
              entity_check: all
      object_title: Enabled Local Accounts with PasswordExpires=False should not exist (list only the first 100, if any are
        found)
    windows-wmi57-object:
      capability: windows.wmi.query
      object_title: null
      collect:
        namespace: root\cimv2
        query: SELECT DomainRole FROM win32_computersystem
    enabled-local-accounts-passwordneverexpires-false-should-not-exist-list-only-object:
      capability: windows.cmdlet
      select:
        module_name:
          operation: equals
          datatype: string
          value: ActiveDirectory
        module_id:
          operation: equals
          datatype: string
          nil: true
          value: ''
        module_version:
          operation: equals
          datatype: version
          nil: true
          value: ''
        verb:
          operation: equals
          datatype: string
          value: Get
        noun:
          operation: equals
          datatype: string
          value: ADUser
        parameters:
          operation: equals
          datatype: record
          value:
            record:
            - name: filter
              value: (Enabled -eq $True) -and (PasswordNotRequired -eq $True)
              operation: equals
              datatype: string
              entity_check: all
            - name: properties
              value: PasswordNotRequired
              operation: equals
              datatype: string
              entity_check: all
        select:
          operation: equals
          datatype: record
          value:
            record:
            - name: first
              value: '100'
              operation: equals
              datatype: string
              entity_check: all
      object_title: Enabled Local Accounts with PasswordNeverExpires=False should not exist (list only the first 100, if any
        are found)
  states:
    state-standalone-server:
      state_title: Standalone Server
      capability: windows.wmi.query
      state:
        field: result
        record:
          mask: false
          match: all
          existence: some
          fields:
            domainrole:
              value: '2'
              operation: equal
              datatype: string
              mask: false
              match: all
              existence: some
    state-domain-member-server:
      state_title: Domain Member Server
      capability: windows.wmi.query
      state:
        field: result
        record:
          mask: false
          match: all
          existence: some
          fields:
            domainrole:
              value: '3'
              operation: equal
              datatype: string
              mask: false
              match: all
              existence: some
    state-accounts-with-passwordnotrequired-true-and-enabled-true-:
      state_title: Accounts with passwordnotrequired = true and enabled = true shall not exist
      capability: windows.cmdlet
      state:
        field: value
        value:
          record:
          - name: passwordnotrequired
            value: 'true'
            operation: case insensitive equals
            datatype: string
            entity_check: all
          - name: enabled
            value: 'true'
            operation: case insensitive equals
            datatype: string
            entity_check: all
        operation: equals
        datatype: record
        entity_check: none satisfy
        entity_existence: at_least_one_exists
    state-backup-domain-controller:
      state_title: Backup Domain Controller
      capability: windows.wmi.query
      state:
        field: result
        record:
          mask: false
          match: all
          existence: some
          fields:
            domainrole:
              value: '4'
              operation: equal
              datatype: string
              mask: false
              match: all
              existence: some
    state-primary-domain-controller:
      state_title: Primary Domain Controller
      capability: windows.wmi.query
      state:
        field: result
        record:
          mask: false
          match: all
          existence: some
          fields:
            domainrole:
              value: '5'
              operation: equal
              datatype: string
              mask: false
              match: all
              existence: some
  tests:
    test-windows-server-accounts-require-passwords:
      test_title: Windows Server - Accounts must require passwords.
      capability: windows.cmdlet
      object: enabled-local-accounts-passwordexpires-false-should-not-exist-list-only-object
      check_existence: none_exist
      check: all
    test-system-windows-standalone-server-or-windows-domain-member-server:
      test_title: The system is a Windows Standalone Server or a Windows Domain Member Server
      capability: windows.wmi.query
      object: windows-wmi57-object
      states:
      - state-standalone-server
      - state-domain-member-server
      existence: some
      match: all
      states_match: any
    test-windows-domain-controller-accounts-require-passwords:
      test_title: Windows Domain Controller - Accounts must require passwords.
      capability: windows.cmdlet
      object: enabled-local-accounts-passwordneverexpires-false-should-not-exist-list-only-object
      check_existence: any_exist
      check: all
      states:
      - state-accounts-with-passwordnotrequired-true-and-enabled-true-
    test-system-windows-domain-controller:
      test_title: The system is a Windows Domain Controller
      capability: windows.wmi.query
      object: windows-wmi57-object
      states:
      - state-backup-domain-controller
      - state-primary-domain-controller
      existence: some
      match: all
      states_match: any
  evaluate:
    any:
    - all:
      - test: test-windows-server-accounts-require-passwords
      - test: test-system-windows-standalone-server-or-windows-domain-member-server
    - all:
      - test: test-windows-domain-controller-accounts-require-passwords
      - test: test-system-windows-domain-controller
