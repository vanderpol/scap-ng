assessment:
  id: ng.shared.b715a44549e85b8c0bd700bb
  version: 1
  assessment_title: TS/RDS - Delete Temp Folders
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: Software\Policies\Microsoft\Windows NT\Terminal Services
        name:
          operation: equals
          datatype: string
          value: DeleteTempDirsOnExit
      object_title: null
  variables:
    do-not-delete-temp-folder-upon-exit-variable:
      title: Do not delete temp folder upon exit
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: do_not_delete_temp_folder_upon_exit_var
        validation:
          alternatives:
          - literal: '1'
            hint: disabled
          - literal: '0'
            hint: enabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: do-not-delete-temp-folder-upon-exit-variable
          operation: equals
          datatype: int
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-do-not-delete-temp-folder-upon-exit-set-disabled:
      test_title: '''Do not delete temp folder upon exit'' is set to ''Disabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-do-not-delete-temp-folder-upon-exit-set-disabled
