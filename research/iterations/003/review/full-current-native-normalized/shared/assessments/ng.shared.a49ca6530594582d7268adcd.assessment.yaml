assessment:
  id: ng.shared.a49ca6530594582d7268adcd
  version: 1
  assessment_title: The macOS system must secure user's home folders.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured so that permissions are set correctly on user home directories with the
    following command: /usr/bin/find /System/Volumes/Data/Users -mindepth 1 -maxdepth 1 -type d ! \( -perm 700 -o -perm 711
    \) | /usr/bin/grep -v "Shared" | /usr/bin/grep -v "Guest" | /usr/bin/wc -l | /usr/bin/xargs If the result is not "0",
    this is a finding.'
  inputs: {}
  evidence: []
