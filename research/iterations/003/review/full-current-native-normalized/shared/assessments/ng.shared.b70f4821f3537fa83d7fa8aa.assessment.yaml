assessment:
  id: ng.shared.b70f4821f3537fa83d7fa8aa
  version: 1
  assessment_title: Passwords must be configured to expire.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    enabled-local-accounts-passwordexpires-false-should-not-exist-list-only-collection:
      collection_title: Enabled Local Accounts with PasswordExpires=False should not exist (list only the first 100, if any
        are found)
      capability: windows.cmdlet
      select:
        module_name:
          operation: equals
          datatype: string
          mask: false
          value: CimCmdlets
        module_id:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
        module_version:
          operation: equals
          datatype: version
          mask: false
          nil: true
          value: ''
        verb:
          operation: equals
          datatype: string
          mask: false
          value: Get
        noun:
          operation: equals
          datatype: string
          mask: false
          value: CimInstance
        parameters:
          operation: equals
          datatype: record
          mask: false
          value:
            record:
            - name: class
              value: Win32_Useraccount
              operation: equals
              datatype: string
              mask: false
              entity_check: all
            - name: filter
              value: PasswordExpires=False and LocalAccount=True and Disabled=False
              operation: equals
              datatype: string
              mask: false
              entity_check: all
        select:
          operation: equals
          datatype: record
          mask: false
          value:
            record:
            - name: first
              value: '100'
              operation: equals
              datatype: string
              mask: false
              entity_check: all
    windows-wmi57-collection:
      collection_title: null
      capability: windows.wmi57
      select:
        namespace:
          operation: equals
          datatype: string
          mask: false
          value: root\cimv2
        wql:
          operation: equals
          datatype: string
          mask: false
          value: SELECT DomainRole FROM win32_computersystem
    enabled-local-accounts-passwordexpires-false-should-not-exist-list-only-collection-2:
      collection_title: Enabled Local Accounts with PasswordExpires=False should not exist (list only the first 100, if any
        are found)
      capability: windows.cmdlet
      select:
        module_name:
          operation: equals
          datatype: string
          mask: false
          value: ActiveDirectory
        module_id:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
        module_version:
          operation: equals
          datatype: version
          mask: false
          nil: true
          value: ''
        verb:
          operation: equals
          datatype: string
          mask: false
          value: Get
        noun:
          operation: equals
          datatype: string
          mask: false
          value: ADUser
        parameters:
          operation: equals
          datatype: record
          mask: false
          value:
            record:
            - name: properties
              value: PasswordNeverExpires
              operation: equals
              datatype: string
              mask: false
              entity_check: all
            - name: filter
              value: Enabled -eq $true -and PasswordNeverExpires -eq $true
              operation: equals
              datatype: string
              mask: false
              entity_check: all
        select:
          operation: equals
          datatype: record
          mask: false
          value:
            record:
            - name: first
              value: '100'
              operation: equals
              datatype: string
              mask: false
              entity_check: all
  tests:
    test-windows-server-local-user-account-passwords-from-enabled-users-configured:
      test_title: Windows Server - Local User Account Passwords from Enabled Users must be configured to expire.
      capability: windows.cmdlet
      collection: enabled-local-accounts-passwordexpires-false-should-not-exist-list-only-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
    test-system-windows-standalone-server-or-windows-domain-member-server:
      test_title: The system is a Windows Standalone Server or a Windows Domain Member Server
      capability: windows.wmi57
      collection: windows-wmi57-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: Standalone Server
          capability: windows.wmi57
          state:
            field: result
            value:
              record:
              - name: domainrole
                value: '2'
                operation: equals
                datatype: string
                mask: false
                entity_check: all
            operation: equals
            datatype: record
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: Domain Member Server
          capability: windows.wmi57
          state:
            field: result
            value:
              record:
              - name: domainrole
                value: '3'
                operation: equals
                datatype: string
                mask: false
                entity_check: all
            operation: equals
            datatype: record
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-windows-domain-controller-active-directory-user-account-passwords-enabled-users:
      test_title: Windows Domain Controller - Active Directory User Account Passwords for Enabled Users must be configured
        to expire.
      capability: windows.cmdlet
      collection: enabled-local-accounts-passwordexpires-false-should-not-exist-list-only-collection-2
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
    test-system-windows-domain-controller:
      test_title: The system is a Windows Domain Controller
      capability: windows.wmi57
      collection: windows-wmi57-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: Backup Domain Controller
          capability: windows.wmi57
          state:
            field: result
            value:
              record:
              - name: domainrole
                value: '4'
                operation: equals
                datatype: string
                mask: false
                entity_check: all
            operation: equals
            datatype: record
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: Primary Domain Controller
          capability: windows.wmi57
          state:
            field: result
            value:
              record:
              - name: domainrole
                value: '5'
                operation: equals
                datatype: string
                mask: false
                entity_check: all
            operation: equals
            datatype: record
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    any:
    - all:
      - test: test-windows-server-local-user-account-passwords-from-enabled-users-configured
      - test: test-system-windows-standalone-server-or-windows-domain-member-server
    - all:
      - test: test-windows-domain-controller-active-directory-user-account-passwords-enabled-users
      - test: test-system-windows-domain-controller
