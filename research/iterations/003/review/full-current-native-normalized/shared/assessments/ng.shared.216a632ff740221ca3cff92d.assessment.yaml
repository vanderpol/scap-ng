assessment:
  id: ng.shared.216a632ff740221ca3cff92d
  version: 1
  assessment_title: The macOS system must be configured to disable hot corners.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    system-settings-hot-corners-disable-recommended-object-collection:
      collection_title: system_settings_hot_corners_disable_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/bin/profiles -P -o stdout | /usr/bin/grep -Ec '"wvous-bl-corner" = 0|"wvous-br-corner" = 0|"wvous-tl-corner"
            = 0|"wvous-tr-corner" = 0'
  tests:
    test-system-settings-hot-corners-disable-recommended-test:
      test_title: system_settings_hot_corners_disable_recommended_test
      capability: independent.shellcommand
      collection: system-settings-hot-corners-disable-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: system_settings_hot_corners_disable_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: '4'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-system-settings-hot-corners-disable-recommended-test
