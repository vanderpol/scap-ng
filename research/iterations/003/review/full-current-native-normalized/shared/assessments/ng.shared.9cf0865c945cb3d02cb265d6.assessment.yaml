assessment:
  id: ng.shared.9cf0865c945cb3d02cb265d6
  version: 1
  assessment_title: Exchange must have anti-spam filtering enabled.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    run-get-contentfilterconfig-determine-if-it-enabled-collection:
      collection_title: Run Get-ContentFilterConfig to determine if it is enabled
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: add-pssnapin Microsoft.Exchange.Management.Powershell.Snapin;Get-ContentFilterConfig | Select-Object -Property
            Name, Enabled | Format-Table -HideTableHeaders | Out-String -Width 4096
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: \w
      behaviors:
        error_if_stderr_exists: 'true'
    run-get-senderfilterconfig-determine-if-it-enabled-collection:
      collection_title: Run Get-SenderFilterConfig to determine if it is enabled
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: add-pssnapin Microsoft.Exchange.Management.Powershell.Snapin;Get-SenderFilterConfig | Select-Object -Property
            Name, Enabled | Format-Table -HideTableHeaders | Out-String -Width 4096
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: \w
      behaviors:
        error_if_stderr_exists: 'true'
    run-get-senderidconfig-determine-if-it-enabled-collection:
