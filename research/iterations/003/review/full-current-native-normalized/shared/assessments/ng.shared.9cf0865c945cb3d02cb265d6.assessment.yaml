        error_if_stderr_exists: 'true'
  tests:
    test-if-get-contentfilterconfig-not-enabled-this-finding:
      test_title: If Get-ContentFilterConfig is not enabled, this is a finding.
      capability: independent.shellcommand
      collection: run-get-contentfilterconfig-determine-if-it-enabled-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Verify True is returned
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: (?i)True\s*$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-if-get-senderfilterconfig-not-enabled-this-finding:
