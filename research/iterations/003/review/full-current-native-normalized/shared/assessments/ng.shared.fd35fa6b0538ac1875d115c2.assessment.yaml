assessment:
  id: ng.shared.fd35fa6b0538ac1875d115c2
  version: 1
  assessment_title: The audit system must be configured to audit failed attempts to access files and programs.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The Audit Configuration profile is required. Check that the audit flag for auditing file access is enabled.
    This check applies to the global zone only. Determine the zone that you are currently securing. # zonename If the command
    output is "global", this check applies. Determine the OS version you are currently securing. # uname –v For Solaris 11,
    11.1, 11.2, and 11.3: # pfexec auditconfig -getflags | grep active | cut -f2 -d= If "-fa" and "-ps" audit flags are not
    displayed, this is a finding. For Solaris 11.4 or newer: # pfexec auditconfig -t -getflags | cut -f2 -d= If "-fa", "-ex",
    and "-ps" audit flags are not displayed, this is a finding. Determine if auditing policy is set to collect command line
    arguments. # pfexec auditconfig -getpolicy | grep active | grep argv If the active audit policies line does not appear,
    this is a finding.'
  inputs: {}
  evidence: []
