  assessment_title: The macOS system must enable gatekeeper.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to enable gatekeeper with the following command: /usr/bin/osascript -l
    JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.systempolicy.control'')\ .objectForKey(''EnableAssessment'').js
    EOS If the result is not "true", this is a finding.'
