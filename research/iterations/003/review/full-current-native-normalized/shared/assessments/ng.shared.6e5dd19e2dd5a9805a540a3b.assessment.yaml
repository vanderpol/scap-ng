assessment:
  id: ng.shared.6e5dd19e2dd5a9805a540a3b
  version: 1
  assessment_title: The macOS system must disable password authentication for SSH.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    auth-ssh-password-authentication-disable-recommended-object-collection:
      collection_title: auth_ssh_password_authentication_disable_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/sbin/sshd -G | /usr/bin/grep -Ec '^(passwordauthentication\s+no|kbdinteractiveauthentication\s+no)'
  tests:
    test-auth-ssh-password-authentication-disable-recommended-test:
      test_title: auth_ssh_password_authentication_disable_recommended_test
      capability: independent.shellcommand
      collection: auth-ssh-password-authentication-disable-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: auth_ssh_password_authentication_disable_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: '2'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-auth-ssh-password-authentication-disable-recommended-test
