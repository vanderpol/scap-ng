assessment:
  id: ng.shared.b4f4ee351c9db422463d919b
  version: 1
  assessment_title: Windows Server 2016 must be running Credential Guard on domain-joined member servers.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'For domain controllers and standalone or nondomain-joined systems, this is NA. Open "PowerShell" with elevated
    privileges (run as administrator). Enter the following: "Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard"
    If "SecurityServicesRunning" does not include a value of "1" (e.g., "{1, 2}"), this is a finding. Alternately: Run "System
    Information". Under "System Summary", verify the following: If "Device Guard Security Services Running" does not list
    "Credential Guard", this is a finding. The policy settings referenced in the Fix section will configure the following
    registry value. However, due to hardware requirements, the registry value alone does not ensure proper function. Registry
    Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\ Value Name: LsaCfgFlags Value
    Type: REG_DWORD Value: 0x00000001 (1) (Enabled with UEFI lock) A Microsoft article on Credential Guard system requirement
    can be found at the following link: https://docs.microsoft.com/en-us/windows/security/identity-protection/credential-guard/credential-guard-requirements'
  inputs: []
  evidence: []
