assessment:
  id: ng.shared.81d0a5a1bfd239df48e7fcb2
  version: 1
  assessment_title: The system must not have accounts configured with blank or null passwords.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    all-entries-under-etc-shadow-file-collection:
      collection_title: All entries under the /etc/shadow file.
      capability: unix.shadow
      select:
        username:
          operation: pattern match
          datatype: string
          mask: false
          value: ^.*$
  tests:
    test-make-sure-no-accounts-have-blank-null-passwords:
      test_title: Make sure no accounts have blank (null) passwords.
      capability: unix.shadow
      collection: all-entries-under-etc-shadow-file-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: none satisfy
        state_title: The blank password state of an account.
        state_capability: unix.shadow
        state:
          field: password
          value: ^$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-make-sure-no-accounts-have-blank-null-passwords
