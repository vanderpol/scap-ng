assessment:
  id: ng.shared.3739acfc0f74e7b83dd1bc11
  version: 1
  assessment_title: Amazon Linux 2023 must generate audit records for all account creations, modifications, disabling, and
    termination events that affect /etc/passwd.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify Amazon Linux 2023 generates audit records for all account creations, modifications, disabling, and termination
    events that affect "/etc/passwd" with the following command: $ sudo auditctl -l | egrep ''(/etc/passwd)'' -w /etc/passwd
    -p wa -k identity If the command does not return a line, or the line is commented out, this is a finding.'
  inputs: {}
  evidence: []
