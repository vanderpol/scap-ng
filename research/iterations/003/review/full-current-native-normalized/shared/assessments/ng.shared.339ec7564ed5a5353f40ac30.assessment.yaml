assessment:
  id: ng.shared.339ec7564ed5a5353f40ac30
  version: 1
  assessment_title: OL08-00-040141 - OL 8 must enable the USBGuard.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    usbguard-service-activestate-object:
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          mask: false
          value: usbguard.service
        property:
          operation: equals
          datatype: string
          mask: false
          value: ActiveState
      object_title: usbguard.service ActiveState
  states:
    state-usbguard-service-active:
      state_title: usbguard.service active
      capability: linux.systemdunitproperty
      state:
        field: value
        value: active
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-usbguard-service-active:
      test_title: usbguard.service is active
      capability: linux.systemdunitproperty
      object: usbguard-service-activestate-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-usbguard-service-active
  evaluate:
    test: test-usbguard-service-active
