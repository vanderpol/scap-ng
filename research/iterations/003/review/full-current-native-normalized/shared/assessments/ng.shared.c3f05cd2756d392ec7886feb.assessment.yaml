assessment:
  id: ng.shared.c3f05cd2756d392ec7886feb
  version: 1
  assessment_title: 'The Ubuntu operating system must implement NIST FIPS-validated cryptography to protect classified information
    and for the following: To provision digital signatures, to generate cryptographic hashes, and to protect unclassified
    information requiring confidentiality and cryptographic protection in accordance with applicable federal laws, Executive
    Orders, directives, policies, regulations, and standards.'
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the system is configured to run in FIPS mode with the following command: $ grep -i 1 /proc/sys/crypto/fips_enabled
    1 If a value of "1" is not returned, this is a finding.'
  inputs: []
  evidence: []
