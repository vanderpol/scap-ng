assessment:
  id: ng.shared.05a61b6e78479cac37390c0b
  version: 1
  assessment_title: The Allow log on locally user right must only be assigned to the Administrators and Users groups.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy
    >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment. If any
    groups or accounts other than the following are granted the "Allow log on locally" user right, this is a finding: Administrators
    Users'
  inputs: []
  evidence: []
