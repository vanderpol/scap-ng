assessment:
  id: ng.shared.a99ee454e66d64260d9cddcb
  version: 1
  assessment_title: UBTU-18-010130 - The Ubuntu operating system must configure the audit tools to be group-owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    audit-tool-executable-files-collection:
      collection_title: audit tool executable files
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: audit-tool-executable-files-variable
  variables:
    audit-tool-executable-files-variable:
      title: audit tool executable files
      kind: constant
      datatype: string
      expression:
        literal:
        - /sbin/auditctl
        - /sbin/aureport
        - /sbin/ausearch
        - /sbin/autrace
        - /sbin/auditd
        - /sbin/audispd
        - /sbin/augenrules
  tests:
    test-audit-tool-executable-files-group-owned-by-root:
      test_title: audit tool executable files group-owned by root
      capability: unix.file
      collection: audit-tool-executable-files-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: group-owned by root
        state_capability: unix.file
        state:
          field: group_id
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-audit-tool-executable-files-group-owned-by-root
