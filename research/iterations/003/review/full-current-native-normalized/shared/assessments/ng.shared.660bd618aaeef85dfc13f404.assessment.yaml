assessment:
  id: ng.shared.660bd618aaeef85dfc13f404
  version: 1
  assessment_title: The Oracle Linux operating system must audit all uses of the postdrop command.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system generates audit records when successful/unsuccessful attempts to use the "postdrop"
    command occur. Check that the following system call is being audited by performing the following command to check the
    file system rules in "/etc/audit/audit.rules": $ sudo grep -w "/usr/sbin/postdrop" /etc/audit/audit.rules -a always,exit
    -F path=/usr/sbin/postdrop -F perm=x -F auid>=1000 -F auid!=unset -k privileged-postfix If the command does not return
    any output, this is a finding.'
  inputs: {}
  evidence: []
