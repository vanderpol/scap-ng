assessment:
  id: ng.shared.76f256bf1fc967a6490289a3
  version: 1
  assessment_title: Case Insensitivity for Non-Windows
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Control\Session Manager\Kernel
        name:
          operation: equals
          datatype: string
          mask: false
          value: ObCaseInsensitive
  variables:
    system-objects-require-case-insensitivity-non-windows-subsystems-variable:
      title: 'System objects: Require case insensitivity for non-Windows subsystems'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: system_objects_require_case_insensitivity_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-system-objects-require-case-insensitivity-non-windows-subsystems-set-enabled:
      test_title: '''System objects: Require case insensitivity for non-Windows subsystems'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: system-objects-require-case-insensitivity-non-windows-subsystems-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-system-objects-require-case-insensitivity-non-windows-subsystems-set-enabled
