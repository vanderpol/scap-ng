assessment:
  id: ng.shared.9a1336b98ac26b96b0df4461
  version: 1
  assessment_title: The gssproxy package must not be installed unless mission essential on RHEL 8.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: If NFS mounts are authorized and in use on the system, this control is not applicable. Verify the gssproxy
    package is not installed with the following command: $ dnf list --installed gssproxy Error: No matching Packages to list
    If the "gssproxy" package is installed and is not documented with the information system security officer (ISSO) as an
    operational requirement, this is a finding.'
  inputs: []
  evidence: []
