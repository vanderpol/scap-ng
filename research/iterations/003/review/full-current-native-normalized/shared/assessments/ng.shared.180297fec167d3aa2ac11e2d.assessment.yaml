assessment:
  id: ng.shared.180297fec167d3aa2ac11e2d
  version: 1
  assessment_title: AZLX-23-001080 - Amazon Linux 2023 must have the firewalld servicew active.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    firewalld-service-activestate-collection:
      collection_title: firewalld.service ActiveState
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          mask: false
          value: firewalld.service
        property:
          operation: equals
          datatype: string
          mask: false
          value: ActiveState
  tests:
    test-check-if-firewalld-in-active-state:
      test_title: Check if firewalld is in 'active' state
      capability: linux.systemdunitproperty
      collection: firewalld-service-activestate-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: linux.systemdunitproperty
        state:
          field: value
          value: active
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-check-if-firewalld-in-active-state
