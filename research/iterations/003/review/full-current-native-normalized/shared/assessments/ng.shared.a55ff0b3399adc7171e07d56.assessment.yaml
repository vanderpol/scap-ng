assessment:
  id: ng.shared.a55ff0b3399adc7171e07d56
  version: 1
  assessment_title: Microsoft Windows Server 2012
  mode: automated
  class: inventory
  purpose: applicability
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    family-object:
      capability: independent.family
      object_title: Family
    this-registry-key-identifies-windows-productname-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SOFTWARE\Microsoft\Windows NT\CurrentVersion
        name:
          operation: equals
          datatype: string
          value: ProductName
      object_title: This registry key identifies the Windows ProductName
  states:
    state-microsoft-windows-family:
      state_title: Microsoft Windows family
      capability: independent.family
      state:
        field: family
        value: windows
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-the-registry-key-matches-with-windows-server-2012:
      state_title: The registry key matches with Windows Server 2012
      capability: windows.registry
      state:
        field: value
        value: ^[a-zA-Z0-9\(\)\s]*2012[a-zA-Z0-9\(\)\s]*$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-the-registry-key-matches-with-windows-server-2012-r2:
      state_title: The registry key matches with Windows Server 2012 R2
      capability: windows.registry
      state:
        field: value
        value: ^[a-zA-Z0-9\(\)\s]*2012 [rR]2[a-zA-Z0-9\(\)\s]*$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-installed-operating-system-part-microsoft-windows-family:
      test_title: the installed operating system is part of the Microsoft Windows family
      capability: independent.family
      object: family-object
      check_existence: at_least_one_exists
      check: only one
      states:
      - state-microsoft-windows-family
    test-windows-server-2012-installed:
      test_title: Windows Server 2012 is installed
      capability: windows.registry
      object: this-registry-key-identifies-windows-productname-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-the-registry-key-matches-with-windows-server-2012
    test-windows-server-2012-r2-installed:
      test_title: Windows Server 2012 R2 is installed
      capability: windows.registry
      object: this-registry-key-identifies-windows-productname-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-the-registry-key-matches-with-windows-server-2012-r2
  evaluate:
    all:
    - test: test-installed-operating-system-part-microsoft-windows-family
    - test: test-windows-server-2012-installed
    - not:
        test: test-windows-server-2012-r2-installed
