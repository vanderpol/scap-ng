assessment:
  id: ng.shared.881a4ef0008b535225d5e32f
  version: 1
  assessment_title: The macOS system must configure SSHD unused connection timeout to 900.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to set the SSHD unused connection timeout to 900 with the following command:
    /usr/sbin/sshd -G | /usr/bin/awk ''/unusedconnectiontimeout/{print $2}'' If the result is not "900", this is a finding.'
  inputs: {}
  evidence: []
