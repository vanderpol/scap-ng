assessment:
  id: ng.shared.54dc1a4e8ea920248c6a8764
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that the SSH daemon does not allow authentication
    using rhosts authentication.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the SSH daemon does not allow authentication using known hosts authentication. To determine how the SSH
    daemon''s "IgnoreRhosts" option is set, run the following command: # grep -i IgnoreRhosts /etc/ssh/sshd_config IgnoreRhosts
    yes If the value is returned as "no", the returned line is commented out, or no output is returned, this is a finding.'
  inputs: []
  evidence: []
