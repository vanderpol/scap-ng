assessment:
  id: ng.shared.de00b25b16a4fa4c48636542
  version: 1
  assessment_title: The macOS system must disable Network File System (NFS) service.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    os-nfsd-disable-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: "isDisabled=$(/sbin/nfsd status | /usr/bin/awk '/nfsd service/ {print $NF}')    \nif [[ \"$isDisabled\" ==\
            \ \"disabled\" ]] && [[ -z $(/usr/bin/pgrep nfsd) ]]; then\n  echo \"pass\"\nelse\n  echo \"fail\"\nfi"
      object_title: os_nfsd_disable_recommended_object
  states:
    state-os-nfsd-disable-recommended-state:
      state_title: os_nfsd_disable_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: pass
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-os-nfsd-disable-recommended-test:
      test_title: os_nfsd_disable_recommended_test
      capability: independent.shellcommand
      object: os-nfsd-disable-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-os-nfsd-disable-recommended-state
  evaluate:
    test: test-os-nfsd-disable-recommended-test
