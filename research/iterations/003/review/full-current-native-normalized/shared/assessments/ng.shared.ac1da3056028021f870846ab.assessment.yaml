assessment:
  id: ng.shared.ac1da3056028021f870846ab
  version: 1
  assessment_title: The UUCP service daemon must not be installed unless required.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    pkg-info-service-network-uucp-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: pkg info service/network/uucp
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
      object_title: pkg info service/network/uucp
  states:
    state-stdout-line-should-not-exist:
      state_title: stdout_line should not exist
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: ''
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: none_exist
  tests:
    test-uucp-service-daemon-not-installed-unless-required:
      test_title: The UUCP service daemon must not be installed unless required.
      capability: independent.shellcommand
      object: pkg-info-service-network-uucp-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-stdout-line-should-not-exist
  evaluate:
    test: test-uucp-service-daemon-not-installed-unless-required
