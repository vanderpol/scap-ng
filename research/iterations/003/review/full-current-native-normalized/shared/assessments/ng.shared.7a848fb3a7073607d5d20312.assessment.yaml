assessment:
  id: ng.shared.7a848fb3a7073607d5d20312
  version: 1
  assessment_title: The macOS system must disable the Bluetooth System Settings pane.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable the Bluetooth System Settings pane with the following command:
    /usr/bin/profiles show -output stdout-xml | /usr/bin/xmllint --xpath ''//key[text()="DisabledSystemSettings"]/following-sibling::*[1]''
    - | /usr/bin/grep -c com.apple.BluetoothSettings If the result is not "1", this is a finding.'
  inputs: {}
  evidence: []
