assessment:
  id: ng.shared.3074404d7c7d8d04fbab24be
  version: 1
  assessment_title: The Ubuntu operating system must synchronize internal information system clocks to the authoritative time
    source when the time difference is greater than one second.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    ubuntu-synchronize-internal-information-system-clocks-authoritative-time-source-when-collection:
      collection_title: Ubuntu must synchronize internal information system clocks to the authoritative time source when the
        time difference is greater than one second.
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/chrony
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .*\.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*makestep\s+1\s+-1\s*
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    ubuntu-synchronize-internal-information-system-clocks-authoritative-time-source-when-collection-2:
      collection_title: Ubuntu must synchronize internal information system clocks to the authoritative time source when the
        time difference is greater than one second.
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: 'timedatectl | grep -Ei ''synchronized'' '
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
    ubuntu-synchronize-internal-information-system-clocks-authoritative-time-source-when-collection-3:
      collection_title: Ubuntu must synchronize internal information system clocks to the authoritative time source when the
        time difference is greater than one second.
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: 'timedatectl | grep -Ei ''service'' '
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
  tests:
    test-ubuntu-synchronize-internal-information-system-clocks-authoritative-time-source-when:
      test_title: Ubuntu must synchronize internal information system clocks to the authoritative time source when the time
        difference is greater than one second.
      capability: independent.textfilecontent54
      collection: ubuntu-synchronize-internal-information-system-clocks-authoritative-time-source-when-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
    test-ubuntu-synchronize-internal-information-system-clocks-authoritative-time-source-check:
      test_title: Ubuntu must synchronize internal information system clocks to the authoritative time source. Check system
        clock synchronized
      capability: independent.shellcommand
      collection: ubuntu-synchronize-internal-information-system-clocks-authoritative-time-source-when-collection-2
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Ubuntu must synchronize internal information system clocks to the authoritative time source. Check System
          clock is synchronized.
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: \s*System\s+clock\s+synchronized:\s+yes
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-ubuntu-synchronize-internal-information-system-clocks-authoritative-time-source-check-2:
      test_title: Ubuntu must synchronize internal information system clocks to the authoritative time source. Check NTP service
        is active.
      capability: independent.shellcommand
      collection: ubuntu-synchronize-internal-information-system-clocks-authoritative-time-source-when-collection-3
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Ubuntu must synchronize internal information system clocks to the authoritative time source. Check NTP
          is active
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: \s*NTP\s+service:\s+active
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-ubuntu-synchronize-internal-information-system-clocks-authoritative-time-source-when
    - test: test-ubuntu-synchronize-internal-information-system-clocks-authoritative-time-source-check
    - test: test-ubuntu-synchronize-internal-information-system-clocks-authoritative-time-source-check-2
