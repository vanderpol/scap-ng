assessment:
  id: ng.shared.accaf86ea407624db99601a4
  version: 1
  assessment_title: The system must disable network routing unless required.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    routeadm-p-collection:
      collection_title: routeadm -p
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: routeadm -p
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: 'routing |forwarding '
  tests:
    test-system-disable-network-routing-unless-required:
      test_title: The system must disable network routing unless required.
      capability: independent.shellcommand
      collection: routeadm-p-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: AND
        states:
        - state_title: Check that line includes 'persistent=disabled' with an exit status of 0
          capability: independent.shellcommand
          state:
            all:
            - field: exit_status
              value: '0'
              operation: equals
              datatype: int
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            - field: stdout_line
              value: persistent=disabled
              operation: pattern match
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
        - state_title: Check that line includes 'current=disabled' with an exit status of 0
          capability: independent.shellcommand
          state:
            all:
            - field: exit_status
              value: '0'
              operation: equals
              datatype: int
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            - field: stdout_line
              value: current=disabled
              operation: pattern match
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
  evaluate:
    test: test-system-disable-network-routing-unless-required
