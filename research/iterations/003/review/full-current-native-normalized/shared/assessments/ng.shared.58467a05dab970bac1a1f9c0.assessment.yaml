assessment:
  id: ng.shared.58467a05dab970bac1a1f9c0
  version: 1
  assessment_title: WN19-CC-000130 - Windows Server 2019 Early Launch Antimalware, Boot-Start Driver Initialization Policy
    must prevent boot drivers identified as bad.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Policies\EarlyLaunch
        name:
          operation: equals
          datatype: string
          mask: false
          value: DriverLoadPolicy
  tests:
    test-boot-start-driver-initialization-policy-not-set-enabled-all-selected:
      test_title: '''Boot-Start Driver Initialization Policy'' is not set to ''Enabled'' with ''All'' selected'
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: null
          capability: windows.registry
          state:
            all:
            - field: type
              value: reg_dword
              operation: equals
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            - field: value
              value: '1'
              operation: equals
              datatype: int
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
        - state_title: null
          capability: windows.registry
          state:
            all:
            - field: type
              value: reg_dword
              operation: equals
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            - field: value
              value: '3'
              operation: equals
              datatype: int
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
        - state_title: Reg_Dword type and value equals 8
          capability: windows.registry
          state:
            all:
            - field: type
              value: reg_dword
              operation: equals
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            - field: value
              value: '8'
              operation: equals
              datatype: int
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
  evaluate:
    test: test-boot-start-driver-initialization-policy-not-set-enabled-all-selected
