assessment:
  id: ng.shared.b6fdfdf452967930176823af
  version: 1
  assessment_title: AZLX-23-002295 - Amazon Linux 2023 library files must be owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-file-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          variable_check: only one
          value:
            variable: system-wide-shared-library-files-directories-variable
        filename:
          operation: pattern match
          datatype: string
          value: \.so(\S+)*$
      filters:
      - action: include
        state: state-unix-file
      - action: exclude
        state: state-owned-by-root
      behaviors:
        recurse_direction: down
      object_title: null
  variables:
    system-wide-shared-library-files-directories-variable:
      title: system-wide shared library files directories
      kind: constant
      datatype: string
      expression:
        literal:
        - /lib
        - /lib64
        - /usr/lib
        - /usr/lib64
  states:
    state-unix-file:
      state_title: null
      capability: unix.file
      state:
        field: type
        value: regular
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-owned-by-root:
      state_title: owned by root
      capability: unix.file
      state:
        field: user_id
        value: '0'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-operating-system-library-files-owned-by-root:
      test_title: The operating system library files are owned by root
      capability: unix.file
      object: unix-file-object
      check_existence: none_exist
      check: all
  evaluate:
    test: test-operating-system-library-files-owned-by-root
