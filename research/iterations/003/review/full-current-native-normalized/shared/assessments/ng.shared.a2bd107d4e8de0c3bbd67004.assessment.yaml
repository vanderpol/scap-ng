assessment:
  id: ng.shared.a2bd107d4e8de0c3bbd67004
  version: 1
  assessment_title: UBTU-22-232080 - Ubuntu 22.04 LTS must configure the directories used by the system journal to be owned
    by "root".
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    run-log-journal-directory-subdirectories-collection:
      collection_title: /run/log/journal directory and subdirectories
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /run/log/journal
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
      filters:
      - action: include
        match:
          field: type
          value: directory
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        capability: unix.file
      behaviors:
        recurse_direction: down
        recurse_file_system: local
    var-log-journal-directory-subdirectories-collection:
      collection_title: /var/log/journal directory and subdirectories
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /var/log/journal
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
      filters:
      - action: include
        match:
          field: type
          value: directory
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        capability: unix.file
      behaviors:
        recurse_direction: down
        recurse_file_system: local
  tests:
    test-run-log-journal-subdirectories-thereof-owned-by-root:
      test_title: /run/log/journal, and subdirectories thereof, are owned by root
      capability: unix.file
      collection: run-log-journal-directory-subdirectories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: owned by root
        state_capability: unix.file
        state:
          field: user_id
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-var-log-journal-subdirectories-thereof-owned-by-root:
      test_title: /var/log/journal, and subdirectories thereof, are owned by root
      capability: unix.file
      collection: var-log-journal-directory-subdirectories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: owned by root
        state_capability: unix.file
        state:
          field: user_id
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-run-log-journal-subdirectories-thereof-owned-by-root
    - test: test-var-log-journal-subdirectories-thereof-owned-by-root
