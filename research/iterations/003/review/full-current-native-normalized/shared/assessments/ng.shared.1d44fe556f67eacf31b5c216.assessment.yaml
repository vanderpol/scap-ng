  version: 1
  assessment_title: The Oracle Linux operating system must not allow users to override SSH environment variables.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system does not allow users to override environment variables to the SSH daemon. Check
    for the value of the "PermitUserEnvironment" keyword with the following command: # grep -i permituserenvironment /etc/ssh/sshd_config
    PermitUserEnvironment no If the "PermitUserEnvironment" keyword is not set to "no", is missing, or is commented out, this
    is a finding.'
  inputs: {}
  evidence: []
