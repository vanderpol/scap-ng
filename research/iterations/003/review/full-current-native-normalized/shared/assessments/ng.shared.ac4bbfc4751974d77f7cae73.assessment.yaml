assessment:
  id: ng.shared.ac4bbfc4751974d77f7cae73
  version: 1
  assessment_title: The macOS system must secure user's home folders.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-home-folders-secure-recommended-object-collection:
      collection_title: os_home_folders_secure_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/bin/find /System/Volumes/Data/Users -mindepth 1 -maxdepth 1 -type d ! \( -perm 700 -o -perm 711 \)|/usr/bin/grep
            -v "Shared"|/usr/bin/grep -v "Guest"
  tests:
    test-os-home-folders-secure-recommended-test:
      test_title: os_home_folders_secure_recommended_test
      capability: independent.shellcommand
      collection: os-home-folders-secure-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: os_home_folders_secure_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: ''
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: none_exist
  evaluate:
    test: test-os-home-folders-secure-recommended-test
