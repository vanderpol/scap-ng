  version: 1
  assessment_title: Firefox must be configured to not automatically check for updated versions of installed search plugins.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Type "about:policies" in the browser address bar. If "Preferences" is not displayed under Policy Name or the
    Policy Value does not include "browser.search.update" with a value of "false" and status of "locked", this is a finding.
  inputs: []
  evidence: []
