assessment:
  id: ng.shared.4bf628158d426c204584c470
  version: 1
  assessment_title: OL 8 must prevent nonprivileged users from executing privileged functions, including disabling, circumventing,
    or altering implemented security safeguards/countermeasures.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system prevents nonprivileged users from executing privileged functions, including disabling,
    circumventing, or altering implemented security safeguards/countermeasures. Obtain a list of authorized users (other than
    system administrator and guest accounts) for the system. Check the list against the system by using the following command:
    $ sudo semanage login -l | more Login Name SELinux User MLS/MCS Range Service __default__ user_u s0-s0:c0.c1023 * root
    unconfined_u s0-s0:c0.c1023 * system_u system_u s0-s0:c0.c1023 * joe staff_u s0-s0:c0.c1023 * All administrators must
    be mapped to the "sysadm_u", "staff_u", or an appropriately tailored confined role as defined by the organization. All
    authorized nonadministrative users must be mapped to the "user_u" role. If they are not mapped in this way, this is a
    finding.'
  inputs: []
  evidence: []
