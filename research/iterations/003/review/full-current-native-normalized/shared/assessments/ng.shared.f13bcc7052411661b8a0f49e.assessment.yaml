assessment:
  id: ng.shared.f13bcc7052411661b8a0f49e
  version: 1
  assessment_title: Any X Windows host must write .Xauthority files.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If X Display Manager (XDM) is not used on the system, this is not applicable. Determine if XDM is running. Procedure:
    # ps -ef | grep xdm If X Display Manager (XDM) is not used on the system, this is not applicable. Determine if XDM is
    running. Procedure: # ps -ef | grep xdm Check for .Xauthority files being utilized by looking for such files in the home
    directory of a user that uses X. Procedure: # cd ~someuser # ls -la .Xauthority If the .Xauthority file does not exist,
    ask the SA if the user is using X Windows. If the user is utilizing X Windows and the .Xauthority file does not exist,
    this is a finding.'
  inputs: []
  evidence: []
