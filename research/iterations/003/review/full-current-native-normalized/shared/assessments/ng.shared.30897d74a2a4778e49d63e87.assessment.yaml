assessment:
  id: ng.shared.30897d74a2a4778e49d63e87
  version: 1
  assessment_title: Address Space Layout Randomization (ASLR) must be enabled.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This check applies to the global zone only. Determine the zone that you are currently securing. # zonename If
    the command output is "global", this check applies. Determine if address space layout randomization is enabled. Determine
    the OS version you are currently securing:. # uname –v For Solaris 11, 11.1, 11.2, and 11.3: # sxadm info -p | grep aslr
    | grep enabled For Solaris 11.4 or newer: # sxadm status -p -o status aslr | grep enabled If no output is produced, this
    is a finding.'
  inputs: []
  evidence: []
