assessment:
  id: ng.shared.d86389fac006ae67404582f7
  version: 1
  assessment_title: WN10-AU-000584 - Windows 10 must be configured to audit handle manipulation successes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-handle-manipulation-is-set-to-success:
      state_title: '''Handle Manipulation'' is set to ''Success'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: handle_manipulation
        value: AUDIT_SUCCESS
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-handle-manipulation-is-set-to-success-and-failure:
      state_title: '''Handle Manipulation'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: handle_manipulation
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-handle-manipulation-set-success:
      test_title: '''Audit Handle Manipulation'' is set to ''Success'''
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-handle-manipulation-is-set-to-success
    test-audit-handle-manipulation-set-success-failure:
      test_title: '''Audit Handle Manipulation'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-handle-manipulation-is-set-to-success-and-failure
  evaluate:
    any:
    - test: test-audit-handle-manipulation-set-success
    - test: test-audit-handle-manipulation-set-success-failure
