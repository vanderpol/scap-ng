assessment:
  id: ng.shared.c585cbd86e96da53b06df181
  version: 1
  assessment_title: The IIS 10.0 websites Maximum Query String limit must be configured.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    get-website-request-filtering-maxquerystring-setting-collection:
      collection_title: Get Website Request Filtering maxQueryString setting
      capability: windows.appcmdlistconfig
      select:
        identifier_type:
          operation: equals
          datatype: string
          mask: false
          value: Site
        identifier:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        section:
          operation: equals
          datatype: string
          mask: false
          value: requestfiltering
        parameter:
          operation: equals
          datatype: string
          mask: false
          value: requestLimits.maxQueryString
  tests:
    test-web-site-request-filtering-maxquerystring-value-2048-or-less:
      test_title: The web-site Request Filtering maxQueryString value must be 2048 or less
      capability: windows.appcmdlistconfig
      collection: get-website-request-filtering-maxquerystring-setting-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: appcmdlistconfig result must equal or less than 2048
        state_capability: windows.appcmdlistconfig
        state:
          field: result
          value: '2048'
          operation: less than or equal
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-web-site-request-filtering-maxquerystring-value-2048-or-less
