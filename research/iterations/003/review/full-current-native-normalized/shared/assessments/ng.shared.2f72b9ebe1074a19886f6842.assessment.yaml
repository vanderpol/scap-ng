assessment:
  id: ng.shared.2f72b9ebe1074a19886f6842
  version: 1
  assessment_title: Cookies exchanged between the Apache web server and the client, such as session cookies, must have cookie
    properties set to prohibit client-side scripts from reading the cookie data.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    gather-unique-apache-http-installation-paths-collection:
      collection_title: Gather unique apache http installation paths
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: ps -e -o command --no-headers | grep -e httpd -e apache2 | sort | uniq
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: ^\/\S+(\/httpd|\/apache2)\s*
    gather-httpd-root-files-via-apachectl-collection:
      collection_title: Gather HTTPD_ROOT files via apachectl
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: httpd-root-apachectl-v-variable
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: HTTPD_ROOT
    gather-server-config-file-files-via-apachectl-collection:
      collection_title: Gather SERVER_CONFIG_FILE files via apachectl
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: server-config-file-apachectl-v-variable
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: SERVER_CONFIG_FILE
    gather-include-statements-from-httpd-conf-collection:
      collection_title: Gather Include statements from httpd.conf
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: shell-command-check-all-include-include-optional-files-variable
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: \S+
    gather-all-session-data-from-httpd-all-include-conf-files-collection:
      collection_title: Gather all Session data from httpd and all Include conf files
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: shell-command-check-session-in-httpd-conf-all-include-conf-variable
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: .+
    gather-all-loaded-config-files-collection:
      collection_title: Gather all loaded config files
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: command-gather-httpd-apache2-list-all-loaded-configuration-files-variable
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: ' \('
    gather-all-session-data-from-all-loaded-conf-files-collection:
      collection_title: Gather all Session data from all loaded conf files
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: shell-command-check-session-in-all-loaded-conf-files-variable
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: .+
    gather-all-sessioncookiename-data-from-httpd-all-include-conf-files-collection:
      collection_title: Gather all SessionCookieName data from httpd and all Include conf files
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: shell-command-check-sessioncookiename-in-httpd-conf-all-include-conf-variable
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: SessionCookieName .+
    gather-all-sessioncookiename-data-from-all-loaded-conf-files-collection:
      collection_title: Gather all SessionCookieName data from all loaded conf files
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: shell-command-check-sessioncookiename-in-all-loaded-conf-files-variable
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: SessionCookieName .+
    gather-all-installed-modules-filter-on-session-cookie-module-collection:
      collection_title: Gather all installed modules and filter on session_cookie_module
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: command-gather-httpd-apache2-modules-variable
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: session_cookie_module
  variables:
    apache-base-install-directories-unix-variable:
      title: Apache base install directories (unix)
      kind: local
      datatype: string
      expression:
        regex_capture:
          value:
            values:
              collection: gather-unique-apache-http-installation-paths-collection
              field: stdout_line
          pattern: (^\/.+\/)httpd|(^\/.+/)apache2
    httpd-root-apachectl-v-variable:
      title: httpd_root to apachectl -V
      kind: local
      datatype: string
      expression:
        concat:
        - variable: apache-base-install-directories-unix-variable
        - literal:
            value: apachectl -V | grep -i 'httpd_root'
            datatype: string
    filepath-httpd-root-variable:
      title: Filepath to HTTPD_ROOT
      kind: local
      datatype: string
      expression:
        regex_capture:
          value:
            values:
              collection: gather-httpd-root-files-via-apachectl-collection
              field: stdout_line
          pattern: ' -D HTTPD_ROOT="(.+)"'
    server-config-file-apachectl-v-variable:
      title: server_config_file to apachectl -V
      kind: local
      datatype: string
      expression:
        concat:
        - variable: apache-base-install-directories-unix-variable
        - literal:
            value: apachectl -V | grep -i 'server_config_file'
            datatype: string
    relative-server-config-file-variable:
      title: relative to SERVER_CONFIG_FILE
      kind: local
      datatype: string
      expression:
        regex_capture:
          value:
            values:
              collection: gather-server-config-file-files-via-apachectl-collection
              field: stdout_line
          pattern: ' -D SERVER_CONFIG_FILE="(.+)"'
    filepath-http-conf-file-variable:
      title: Filepath to http conf file
      kind: local
      datatype: string
      expression:
        concat:
        - variable: filepath-httpd-root-variable
        - literal:
            value: /
            datatype: string
        - variable: relative-server-config-file-variable
    shell-command-check-all-include-include-optional-files-variable:
      title: shell command to check for all Include and Include Optional files
      kind: local
      datatype: string
      expression:
        concat:
        - literal:
            value: 'grep -iEHn ''^\s*Include\s+|^\s*IncludeOptional\s+'' '
            datatype: string
        - variable: filepath-http-conf-file-variable
    all-included-conf-files-from-include-refernces-in-httd-conf-variable:
      title: All included conf files from Include refernces in httd.conf
      kind: local
      datatype: string
      expression:
        concat:
        - variable: filepath-httpd-root-variable
        - literal:
            value: /
            datatype: string
        - regex_capture:
            value:
              values:
                collection: gather-include-statements-from-httpd-conf-collection
                field: stdout_line
            pattern: \S+\s+(\S+)\s*
    merged-included-conf-files-from-include-refernces-in-httd-conf-variable:
      title: merged included conf files from Include refernces in httd.conf
      kind: local
      datatype: string
      expression:
        merge:
          values:
            variable: all-included-conf-files-from-include-refernces-in-httd-conf-variable
          delimiter: ' '
          sort: document
          order: ascending
    httpd-conf-merged-included-conf-files-from-include-refernces-in-variable:
      title: httpd.conf and merged included conf files from Include refernces in httd.conf
      kind: local
      datatype: string
      expression:
        concat:
        - variable: filepath-http-conf-file-variable
        - literal:
            value: ' '
            datatype: string
        - variable: merged-included-conf-files-from-include-refernces-in-httd-conf-variable
    shell-command-check-session-in-httpd-conf-all-include-conf-variable:
      title: shell command to check Session in httpd.conf and all Include conf files
      kind: local
      datatype: string
      expression:
        concat:
        - literal:
            value: 'grep -iHn ''^\s*Session '' '
            datatype: string
        - variable: httpd-conf-merged-included-conf-files-from-include-refernces-in-variable
    apache-path-httpd-or-apache2-variable:
      title: Apache path to httpd or apache2
      kind: local
      datatype: string
      expression:
        regex_capture:
          value:
            values:
              collection: gather-unique-apache-http-installation-paths-collection
              field: stdout_line
          pattern: '(^\/.+\/httpd|^\/.+\/apache2) '
    command-gather-httpd-apache2-list-all-loaded-configuration-files-variable:
      title: command to gather httpd/apache2 list of all loaded configuration files
      kind: local
      datatype: string
      expression:
        concat:
        - variable: apache-path-httpd-or-apache2-variable
        - literal:
            value: ' -t -D DUMP_INCLUDES'
            datatype: string
    all-loaded-configuration-filepaths-variable:
      title: All loaded configuration filepaths
      kind: local
      datatype: string
      expression:
        unique:
          regex_capture:
            value:
              values:
                collection: gather-all-loaded-config-files-collection
                field: stdout_line
            pattern: \(.*\) (/.*)
    merged-list-all-loaded-config-files-variable:
      title: Merged list of all loaded config files
      kind: local
      datatype: string
      expression:
        merge:
          values:
            variable: all-loaded-configuration-filepaths-variable
          delimiter: ' '
          sort: document
          order: ascending
    shell-command-check-session-in-all-loaded-conf-files-variable:
      title: shell command to check Session in all loaded conf files
      kind: local
      datatype: string
      expression:
        concat:
        - literal:
            value: 'grep -iHn ''^\s*Session '' '
            datatype: string
        - variable: merged-list-all-loaded-config-files-variable
    shell-command-check-sessioncookiename-in-httpd-conf-all-include-conf-variable:
      title: shell command to check SessionCookieName in httpd.conf and all Include conf files
      kind: local
      datatype: string
      expression:
        concat:
        - literal:
            value: 'grep -iHn ''^\s*SessionCookieName'' '
            datatype: string
        - variable: httpd-conf-merged-included-conf-files-from-include-refernces-in-variable
    shell-command-check-sessioncookiename-in-all-loaded-conf-files-variable:
      title: shell command to check SessionCookieName in all loaded conf files
      kind: local
      datatype: string
      expression:
        concat:
        - literal:
            value: 'grep -iHn ''^\s*SessionCookieName'' '
            datatype: string
        - variable: merged-list-all-loaded-config-files-variable
    command-gather-httpd-apache2-modules-variable:
      title: command to gather httpd/apache2 modules
      kind: local
      datatype: string
      expression:
        concat:
        - variable: apache-path-httpd-or-apache2-variable
        - literal:
            value: ' -M'
            datatype: string
  tests:
    test-verify-session-directive-exists-configured-on-all-httpd-conf-apache2:
      test_title: Verify the Session directive exists and is configured to On for all httpd.conf/apache2.conf or included
        conf files
      capability: independent.shellcommand
      collection: gather-all-session-data-from-httpd-all-include-conf-files-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Session is On
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: (?i)Session On
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-if-session-directive-exists-in-other-loaded-configuration-files-verify:
      test_title: If the Session directive exists in other loaded configuration files, verify is is configured to On
      capability: independent.shellcommand
      collection: gather-all-session-data-from-all-loaded-conf-files-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Session is On (if found)
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: (?i)Session On
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: any_exist
    test-verify-that-sessioncookiename-directive-exists-configured-httponly-secure-in-httpd:
      test_title: Verify that SessionCookieName directive exists and is configured with HttpOnly and Secure in httpd.conf/apache2.conf
        or included conf files
      capability: independent.shellcommand
      collection: gather-all-sessioncookiename-data-from-httpd-all-include-conf-files-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: AND
        states:
        - state_title: SessionCookieName is configured with HttpOnly
          capability: independent.shellcommand
          state:
            field: stdout_line
            value: (?i)HttpOnly
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: SessionCookieName is configured with Secure
          capability: independent.shellcommand
          state:
            field: stdout_line
            value: (?i)Secure
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-if-sessioncookiename-directive-exists-in-other-loaded-configuration-files-verify:
      test_title: If the SessionCookieName directive exists in other loaded configuration files, verify it is configured with
        HttpOnly
      capability: independent.shellcommand
      collection: gather-all-sessioncookiename-data-from-all-loaded-conf-files-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: AND
        states:
        - state_title: If the SessionCookieName directive is found, it is is configured with HttpOnly
          capability: independent.shellcommand
          state:
            field: stdout_line
            value: (?i)HttpOnly
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: any_exist
        - state_title: If the SessionCookieName directive is found, it is configured with Secure
          capability: independent.shellcommand
          state:
            field: stdout_line
            value: (?i)Secure
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: any_exist
    test-apache-session-cookie-module-enabled:
      test_title: Apache session_cookie_module must be enabled
      capability: independent.shellcommand
      collection: gather-all-installed-modules-filter-on-session-cookie-module-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: session_cookie_module must be enabled
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: session_cookie_module
          operation: pattern match
          datatype: string
          mask: false
          entity_check: at least one
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-verify-session-directive-exists-configured-on-all-httpd-conf-apache2
    - test: test-if-session-directive-exists-in-other-loaded-configuration-files-verify
    - test: test-verify-that-sessioncookiename-directive-exists-configured-httponly-secure-in-httpd
    - test: test-if-sessioncookiename-directive-exists-in-other-loaded-configuration-files-verify
    - test: test-apache-session-cookie-module-enabled
