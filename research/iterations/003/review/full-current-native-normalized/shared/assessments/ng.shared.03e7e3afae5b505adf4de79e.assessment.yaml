assessment:
  id: ng.shared.03e7e3afae5b505adf4de79e
  version: 1
  assessment_title: SOL-11.1-070130 - Reserved UIDs 0-99 must only be used by system accounts.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    uname-collection:
      collection_title: uname -a
      capability: unix.uname
    all-users-collection:
      collection_title: All users
      capability: unix.password
      select:
        username:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[^-+].*$
    home-directories-all-user-accounts-collection:
      collection_title: The home directories of all user accounts.
      capability: unix.password
      set:
        operator: union
        members:
        - collection: all-users-collection
        filters:
        - action: exclude
          match:
            field: user_id
            value: '100'
            operation: less than
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: System accounts.
          capability: unix.password
        - action: exclude
          match:
            field: user_id
            value: '60001'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: System account.
          capability: unix.password
        - action: exclude
          match:
            field: user_id
            value: '60002'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: System account.
          capability: unix.password
        - action: exclude
          match:
            field: user_id
            value: '65534'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: System account.
          capability: unix.password
    system-accounts-collection:
      collection_title: System accounts
      capability: unix.password
      set:
        operator: complement
        members:
        - collection: all-users-collection
        - collection: home-directories-all-user-accounts-collection
  variables:
    authorized-system-accounts-11-3-less-variable:
      title: authorized system accounts for 11.3 and less
      kind: constant
      datatype: string
      expression:
        literal:
        - adm
        - aiuser
        - bin
        - daemon
        - dhcpserv
        - dladm
        - ftp
        - gdm
        - ikeuser
        - lp
        - mysql
        - netadm
        - netcfg
        - noaccess
        - nobody
        - nobody4
        - nuucp
        - openldap
        - pkg5srv
        - polkitd
        - postgres
        - root
        - smmsp
        - sshd
        - svctag
        - sys
        - unknown
        - upnp
        - uucp
        - webservd
        - xvm
        - zfssnap
    authorized-system-accounts-11-4-newer-variable:
      title: authorized system accounts for 11.4 and newer
      kind: constant
      datatype: string
      expression:
        literal:
        - adm
        - aiuser
        - bin
        - daemon
        - dhcpserv
        - dladm
        - gdm
        - ikeuser
        - lp
        - mysql
        - netadm
        - netcfg
        - noaccess
        - nobody
        - nobody4
        - _ntp
        - nuucp
        - openldap
        - pkg5srv
        - _polkitd
        - postgres
        - root
        - smmsp
        - sshd
        - svctag
        - sys
        - unknown
        - upnp
        - uucp
        - webservd
        - xvm
        - zfssnap
  tests:
    test-11-3-or-less:
      test_title: 11.3 or less?
      capability: unix.uname
      collection: uname-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: 11.3 or less.
        state_capability: unix.uname
        state:
          field: os_version
          value: ^11($|\.[0-3]\b)
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-accounts-reserved-uids-match-known-11-3-older-system-accounts:
      test_title: accounts with reserved UIDs match known 11.3 and older system accounts
      capability: unix.password
      collection: system-accounts-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: authorized 11.3 and older system accounts
        state_capability: unix.password
        state:
          field: username
          value:
            variable: authorized-system-accounts-11-3-less-variable
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          entity_check: all
          entity_existence: at_least_one_exists
    test-accounts-reserved-uids-match-known-11-4-newer-system-accounts:
      test_title: accounts with reserved UIDs match known 11.4 and newer system accounts
      capability: unix.password
      collection: system-accounts-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: authorized 11.4 and newer system accounts
        state_capability: unix.password
        state:
          field: username
          value:
            variable: authorized-system-accounts-11-4-newer-variable
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - any:
      - not:
          test: test-11-3-or-less
      - test: test-accounts-reserved-uids-match-known-11-3-older-system-accounts
    - any:
      - test: test-11-3-or-less
      - test: test-accounts-reserved-uids-match-known-11-4-newer-system-accounts
