assessment:
  id: ng.shared.53ff59fb7ce97732a597b53d
  version: 1
  assessment_title: The root account must be the only account with GID of 0.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    all-users-collection:
      collection_title: All users
      capability: unix.password
      select:
        username:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[^-+].*$
    gid-0-not-root-collection:
      collection_title: GID 0 and not root
      capability: unix.password
      set:
        operator: union
        members:
        - collection: all-users-collection
        filters:
        - action: exclude
          match:
            field: group_id
            value: '0'
            operation: not equal
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: Root group ID.
          capability: unix.password
    gid-0-in-etc-group-collection:
      collection_title: GID 0 in /etc/group.
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/group
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[^:]+:[^:]*:0:(\S+)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-root-account-only-account-gid-0:
      test_title: The root account must be the only account with GID of 0.
      capability: unix.password
      collection: gid-0-not-root-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: The root account must be the only account with GID of 0.
        state_capability: unix.password
        state:
          field: username
          value: root
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-gid-0-only-assigned-root:
      test_title: GID 0 must only be assigned to root.
      capability: independent.textfilecontent54
      collection: gid-0-in-etc-group-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: root string.
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: root
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-root-account-only-account-gid-0
    - test: test-gid-0-only-assigned-root
