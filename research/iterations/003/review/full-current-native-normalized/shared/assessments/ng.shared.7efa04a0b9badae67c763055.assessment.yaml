  assessment_title: The macOS system must configure sudoers timestamp type.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured with sudoers timestamp type with the following command: /usr/bin/sudo
    /usr/bin/sudo -V | /usr/bin/awk -F": " ''/Type of authentication timestamp record/{print $2}'' If the result is not "tty",
    this is a finding.'
