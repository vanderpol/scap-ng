assessment:
  id: ng.shared.ea7f5404f4c5f63aed7bbaf9
  version: 1
  assessment_title: The macOS system must set SSH Active Server Alive Maximum to 0.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to set SSH Active Server Alive Maximum to 0 with the following command:
    ret="pass" for u in $(/usr/bin/dscl . -list /Users UniqueID | /usr/bin/awk ''$2 > 500 {print $1}''); do sshCheck=$(/usr/bin/sudo
    -u $u /usr/bin/ssh -G . | /usr/bin/grep -c "^serveralivecountmax 0") if [[ "$sshCheck" == "0" ]]; then ret="fail" break
    fi done /bin/echo $ret If the result is not "pass", this is a finding.'
  inputs: {}
  evidence: []
