assessment:
  id: ng.shared.0fea393c8a12a69cd95229fb
  version: 1
  assessment_title: Anonymous Access to Named Pipes and Shares
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Services\LanManServer\Parameters
        name:
          operation: equals
          datatype: string
          mask: false
          value: restrictnullsessaccess
  variables:
    network-access-restrict-anonymous-access-named-pipes-shares-variable:
      title: 'Network access: Restrict anonymous access to Named Pipes and Shares'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: restrict_anonymous_access_to_named_pipes_and_shares_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-network-access-restrict-anonymous-access-named-pipes-shares-set-enabled:
      test_title: '''Network access: Restrict anonymous access to Named Pipes and Shares'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: network-access-restrict-anonymous-access-named-pipes-shares-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-network-access-restrict-anonymous-access-named-pipes-shares-set-enabled
