assessment:
  id: ng.shared.a7041041e2e828137d83681d
  version: 1
  assessment_title: The Ubuntu operating system SSH server must be configured to use only FIPS-validated key exchange algorithms.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object-2:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*(?i)KexAlgorithms(?-i)\s+"?(\S+)"?\s*(?:#.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
    independent-textfilecontent54-object-3:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/ssh/sshd_config.d
        filename:
          operation: pattern match
          datatype: string
          value: ^.+\.conf$
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*(?i)KexAlgorithms(?-i)\s+"?(\S+)"?\s*(?:#.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      behaviors:
        max_depth: '-1'
        recurse_direction: down
      object_title: null
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - object: independent-textfilecontent54-object-2
        - object: independent-textfilecontent54-object-3
      object_title: null
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,diffie-hellman-group-exchange-sha256
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-sshd-config-kexalgorithms-uses-fips-validated-algorithms:
      test_title: 'sshd_config: KexAlgorithms uses FIPS-validated algorithms'
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    test: test-sshd-config-kexalgorithms-uses-fips-validated-algorithms
