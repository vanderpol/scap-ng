assessment:
  id: ng.shared.24af3b900bf18e1d6f71f844
  version: 1
  assessment_title: Administrative accounts must not be used with applications that access the Internet, such as web browsers,
    or with potential Internet sources, such as email.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Determine whether administrative accounts are prevented from using applications that access the Internet, such
    as web browsers, or with potential Internet sources, such as email, except as necessary for local service administration.
    The organization must have a policy that prohibits administrative accounts from using applications that access the Internet,
    such as web browsers, or with potential Internet sources, such as email, except as necessary for local service administration.
    The policy should define specific exceptions for local service administration. These exceptions may include HTTP(S)-based
    tools that are used for the administration of the local system, services, or attached devices. Technical measures such
    as the removal of applications or application whitelisting must be used where feasible to prevent the use of applications
    that access the Internet. If accounts with administrative privileges are not prevented from using applications that access
    the Internet or with potential Internet sources, this is a finding.
  inputs: {}
  evidence: []
