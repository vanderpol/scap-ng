assessment:
  id: ng.shared.d09fcced0ad71e0b32571e27
  version: 1
  assessment_title: The directory service must be configured to terminate LDAP-based network connections to the directory
    server after 5 minutes of inactivity.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    gather-fully-qualified-ldap-name-domain-being-reviewed-via-powershell-collection:
      collection_title: Gather fully qualified LDAP name of the domain being reviewed via powershell
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: ([ADSI]"LDAP://RootDSE").rootDomainNamingContext
    review-maxconnidletime-setting-via-command-line-dsquery-collection:
      collection_title: Review MaxConnIdleTime setting via command line dsquery
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: cmd
        command:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: dsquery-command-used-gather-maxconnidletime-variable
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: MaxConnIdleTime=(\d+)
  variables:
    dsquery-command-used-gather-maxconnidletime-variable:
      title: The dsquery command used to gather MaxConnIdleTime
      kind: local
      datatype: string
      expression:
        concat:
        - literal:
            value: dsquery * "cn=Default Query Policy,cn=Query-Policies,cn=Directory Service, cn=Windows NT,cn=Services,cn=Configuration,
            datatype: string
        - values:
            collection: gather-fully-qualified-ldap-name-domain-being-reviewed-via-powershell-collection
            field: stdout_line
        - literal:
            value: '" -attr LDAPAdminLimits'
            datatype: string
  tests:
    test-review-maxconnidletime-setting-via-command-line-dsquery:
      test_title: Review MaxConnIdleTime setting via command line dsquery
      capability: independent.shellcommand
      collection: review-maxconnidletime-setting-via-command-line-dsquery-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: MaxConnIdleTime less than or equal to 300
        state_capability: independent.shellcommand
        state:
          all:
          - field: shell
            value: cmd
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: subexpression
            value: '300'
            operation: less than or equal
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-review-maxconnidletime-setting-via-command-line-dsquery
