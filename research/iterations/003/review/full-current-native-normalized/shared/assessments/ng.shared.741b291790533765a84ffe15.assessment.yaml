assessment:
  id: ng.shared.741b291790533765a84ffe15
  version: 1
  assessment_title: Data files owned by users must be on a different logical partition from the directory server data files.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    all-local-disk-volumes-object:
      capability: windows.wmi
      select:
        namespace:
          operation: equals
          datatype: string
          value: root\cimv2
        wql:
          operation: equals
          datatype: string
          value: SELECT name FROM win32_logicaldisk WHERE drivetype=3
      object_title: All 'Local Disk' Volumes
    get-local-shares-via-get-smbshare-exclude-netlogon-sysvol-admin-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: powershell
        command:
          operation: equals
          datatype: string
          variable_check: all
          value:
            variable: get-smbshare-exclude-netlogon-sysvol-ipc-admin-admin-shares-variable
        pattern:
          operation: equals
          datatype: string
          value: ' ([a-zA-Z]):\\'
      object_title: get local shares via get-smbshare, exclude NETLOGON AND SYSVOL and admin shares
    dsa-database-file-location-via-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SYSTEM\CurrentControlSet\Services\NTDS\Parameters
        name:
          operation: equals
          datatype: string
          value: DSA Database file
      object_title: DSA Database file location via registry
  variables:
    get-smbshare-exclude-netlogon-sysvol-ipc-admin-admin-shares-variable:
      title: get-smbshare, exclude NETLOGON AND SYSVOL IPC$ ADMIN$ and admin shares
      kind: local
      datatype: string
      expression:
        concat:
        - literal:
            value: get-smbshare | where-object {$_.Name -notin 'NETLOGON','SYSVOL','IPC$','ADMIN$','
            datatype: string
        - merge:
            values:
              concat:
              - substring:
                  value:
                    values:
                      object: all-local-disk-volumes-object
                      field: result
                  start: '1'
                  length: '1'
              - literal:
                  value: $'
                  datatype: string
            delimiter: ','''
            sort: document
            order: ascending
        - literal:
            value: '} | Select-Object -property name,PATH'
            datatype: string
    drive-letter-that-dsa-database-file-found-on-variable:
      title: Drive Letter that DSA Database file is found on
      kind: local
      datatype: string
      expression:
        substring:
          value:
            values:
              object: dsa-database-file-location-via-registry-object
              field: value
          start: '1'
          length: '1'
  states:
    state-results-do-not-equal-same-drive-letter:
      state_title: results do not equal same drive letter
      capability: independent.shellcommand
      state:
        all:
        - field: shell
          value: powershell
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: subexpression
          value:
            variable: drive-letter-that-dsa-database-file-found-on-variable
          operation: case insensitive not equal
          datatype: string
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
    state-stdout-line-does-not-exist:
      state_title: stdout_line does not exist
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: ''
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: none_exist
  tests:
    test-gather-shares-ensure-directory-doesn-t-match-dsa-database-file:
      test_title: Gather Shares and ensure directory doesn't match DSA Database File drive letter
      capability: independent.shellcommand
      object: get-local-shares-via-get-smbshare-exclude-netlogon-sysvol-admin-object
      check_existence: at_least_one_exists
      check: at least one
      state_operator: OR
      states:
      - state-results-do-not-equal-same-drive-letter
      - state-stdout-line-does-not-exist
  evaluate:
    test: test-gather-shares-ensure-directory-doesn-t-match-dsa-database-file
