  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-dpkginfo-object:
      capability: linux.dpkginfo
      select:
        name:
          operation: equals
          datatype: string
          value: openssh-server
      object_title: null
  states: {}
  tests:
    test-package-ssh-installed:
      test_title: package ssh is installed
      capability: linux.dpkginfo
