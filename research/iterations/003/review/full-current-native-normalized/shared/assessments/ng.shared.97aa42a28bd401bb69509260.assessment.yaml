assessment:
  id: ng.shared.97aa42a28bd401bb69509260
  version: 1
  assessment_title: The Ubuntu operating system SSH server must be configured to use only FIPS-validated key exchange algorithms.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    ssh-server-configured-use-only-fips-validated-key-exchange-algorithms-collection:
      collection_title: SSH server must be configured to use only FIPS-validated key exchange algorithms.
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^KexAlgorithms\s+ecdh-sha2-nistp256\s*,\s*ecdh-sha2-nistp384\s*,\s*ecdh-sha2-nistp521\s*,\s*diffie-hellman-group-exchange-sha256$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-ssh-server-configured-use-only-fips-validated-key-exchange-algorithms:
      test_title: SSH server must be configured to use only FIPS-validated key exchange algorithms.
      capability: independent.textfilecontent54
      collection: ssh-server-configured-use-only-fips-validated-key-exchange-algorithms-collection
      assertion:
        existence: only_one_exists
        item_quantifier: all
        state: null
  evaluate:
    test: test-ssh-server-configured-use-only-fips-validated-key-exchange-algorithms
