assessment:
  id: ng.shared.9d7ce8e2708bb1f987b62fee
  version: 1
  assessment_title: X11 forwarding for SSH must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    x11forwarding-option-in-etc-ssh-sshd-config-collection:
      collection_title: The X11Forwarding option in /etc/ssh/sshd_config.
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[Xx]11[Ff][Oo][Rr][Ww][Aa][Rr][Dd][Ii][Nn][Gg]\s*(\S+)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-x11forwarding-set-no-in-etc-ssh-sshd-config:
      test_title: X11Forwarding must be set to no in /etc/ssh/sshd_config.
      capability: independent.textfilecontent54
      collection: x11forwarding-option-in-etc-ssh-sshd-config-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: The ~no~ string.
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: 'no'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-x11forwarding-set-no-in-etc-ssh-sshd-config
