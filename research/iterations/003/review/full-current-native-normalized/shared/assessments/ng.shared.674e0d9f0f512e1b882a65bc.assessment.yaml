assessment:
  id: ng.shared.674e0d9f0f512e1b882a65bc
  version: 1
  assessment_title: The Oracle Linux operating system must audit all uses of the ssh-keysign command.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system generates audit records when successful/unsuccessful attempts to use the "ssh-keysign"
    command occur. Check that the following system call is being audited by performing the following command to check the
    file system rules in "/etc/audit/audit.rules": $ sudo grep -w "/usr/libexec/openssh/ssh-keysign" /etc/audit/audit.rules
    -a always,exit -F path=/usr/libexec/openssh/ssh-keysign -F perm=x -F auid>=1000 -F auid!=unset -k privileged-ssh If the
    command does not return any output, this is a finding.'
  inputs: {}
  evidence: []
