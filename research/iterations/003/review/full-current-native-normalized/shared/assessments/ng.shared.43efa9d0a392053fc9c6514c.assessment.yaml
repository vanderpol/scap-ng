assessment:
  id: ng.shared.43efa9d0a392053fc9c6514c
  version: 1
  assessment_title: CISC-ND-000460 - The Cisco router must be configured to limit privileges to change the software resident
    within software libraries.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    iosxe-global-collection:
      collection_title: null
      capability: iosxe.global
      select:
        global_command:
          operation: pattern match
          datatype: string
          mask: false
          value: ^file[ \t]+privilege
    iosxe-global-collection-2:
      collection_title: null
      capability: iosxe.global
      select:
        global_command:
          operation: pattern match
          datatype: string
          mask: false
          value: ^file[ \t]+privilege[ \t]+15[ \t]*$
  tests:
    test-check-file-privilege:
      test_title: Check for file privilege
      capability: iosxe.global
      collection: iosxe-global-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
    test-check-file-privilege-15:
      test_title: Check for file privilege 15
      capability: iosxe.global
      collection: iosxe-global-collection-2
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    any:
    - not:
        test: test-check-file-privilege
    - test: test-check-file-privilege-15
