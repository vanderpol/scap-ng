          match:
            field: trustee_sid
            value: S-1-5-32-544
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: Administrators Group
          capability: windows.regkeyeffectiverights53
