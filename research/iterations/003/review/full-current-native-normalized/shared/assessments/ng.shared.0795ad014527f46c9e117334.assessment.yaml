assessment:
  id: ng.shared.0795ad014527f46c9e117334
  version: 1
  assessment_title: Disable GDM Automatic Login
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-rpminfo-collection:
      collection_title: null
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: gdm
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/gdm/custom.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\[daemon]\n(?!([^\n]*\n+)*\[[^\n\]]*]([^\n]*\n+)*AutomaticLoginEnable[ ]?=[ ]?)([^\n]*\n+)*AutomaticLoginEnable[
            ]?=[ ]?
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-textfilecontent54-collection-2:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/gdm/custom.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[ ]*AutomaticLoginEnable[ ]?=[ ]?([^\W]*)[ ]*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-package-gdm-installed:
      test_title: package gdm is installed
      capability: linux.rpminfo
      collection: linux-rpminfo-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state: null
    test-automaticloginenable-present-in-daemon-section:
      test_title: AutomaticLoginEnable present in daemon section
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
    test-all-automaticloginenable-lines-set-correctly:
      test_title: All AutomaticLoginEnable lines are set correctly
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection-2
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: GDM AutomaticLoginEnable = false
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^[Ff][Aa][Ll][Ss][Ee]$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    any:
    - not:
        test: test-package-gdm-installed
    - all:
      - test: test-automaticloginenable-present-in-daemon-section
      - test: test-all-automaticloginenable-lines-set-correctly
