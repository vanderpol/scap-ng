assessment:
  id: ng.shared.faf54fc0681286a92e51c8ab
  version: 1
  assessment_title: Orphaned security identifiers (SIDs) must be removed from user rights on Windows 10.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Review the effective User Rights setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer
    Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment.
    Review each User Right listed for any unresolved SIDs to determine whether they are valid, such as due to being temporarily
    disconnected from the domain. (Unresolved SIDs have the format of "*S-1-…".) If any unresolved SIDs exist and are not
    for currently valid accounts or groups, this is a finding.
  inputs: {}
  evidence: []
