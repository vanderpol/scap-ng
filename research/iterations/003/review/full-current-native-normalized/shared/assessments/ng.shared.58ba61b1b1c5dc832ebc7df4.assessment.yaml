assessment:
  id: ng.shared.58ba61b1b1c5dc832ebc7df4
  version: 1
  assessment_title: OL09-00-002100 - OL 9 must disable the graphical user interface automount function unless required.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/dconf/db/local.d
        filename:
          operation: equals
          datatype: string
          mask: false
          value: 00-security-settings
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*\[org\/gnome\/desktop\/media-handling]\s*\n+[^\[]*automount-open\s*=\s*(\w+)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-system-disables-gui-automount-feature:
      test_title: The system disables the GUI automount feature.
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: 'false'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-system-disables-gui-automount-feature
