assessment:
  id: ng.shared.a471f21e505ed5be523543a4
  version: 1
  assessment_title: WN10-AU-000588 - Windows 10 must be configured to audit sensitive privileged use failures.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-auditeventpolicysubcategories-collection:
      collection_title: null
      capability: windows.auditeventpolicysubcategories
  tests:
    test-audit-sensitive-privilege-use-set-failure:
      test_title: '''Audit Sensitive Privilege Use'' is set to ''Failure'''
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: '''Sensitive Privilege Use'' is set to ''Failure'''
        state_capability: windows.auditeventpolicysubcategories
        state:
          field: sensitive_privilege_use
          value: AUDIT_FAILURE
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-audit-sensitive-privilege-use-set-success-failure:
      test_title: '''Audit Sensitive Privilege Use'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: '''Sensitive Privilege Use'' is set to ''Success'' and ''Failure'''
        state_capability: windows.auditeventpolicysubcategories
        state:
          field: sensitive_privilege_use
          value: AUDIT_SUCCESS_FAILURE
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    any:
    - test: test-audit-sensitive-privilege-use-set-failure
    - test: test-audit-sensitive-privilege-use-set-success-failure
