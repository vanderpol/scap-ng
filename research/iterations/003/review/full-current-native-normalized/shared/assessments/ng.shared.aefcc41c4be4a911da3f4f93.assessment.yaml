assessment:
  id: ng.shared.aefcc41c4be4a911da3f4f93
  version: 1
  assessment_title: The SUSE operating system must not be performing Internet Protocol version 6 (IPv6) packet forwarding
    unless the system is a router.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the SUSE operating system is not performing IPv6 packet forwarding, unless the system is a router. Check
    to see if IPv6 forwarding is enabled using the following command: > sudo sysctl net.ipv6.conf.all.forwarding net.ipv6.conf.all.forwarding
    = 0 If the network parameter "ipv6.conf.all.forwarding" is not equal to "0" or nothing is returned, this is a finding.'
  inputs: []
  evidence: []
