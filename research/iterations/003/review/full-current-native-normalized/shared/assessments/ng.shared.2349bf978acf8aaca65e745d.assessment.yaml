assessment:
  id: ng.shared.2349bf978acf8aaca65e745d
  version: 1
  assessment_title: The macOS system must enforce enrollment in mobile device management.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-mdm-require-recommended-object-collection:
      collection_title: os_mdm_require_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/profiles status -type enrollment | /usr/bin/awk -F: ''/MDM enrollment/ {print $2}'' | /usr/bin/grep
            "Yes (User Approved)"'
  tests:
    test-os-mdm-require-recommended-test:
      test_title: os_mdm_require_recommended_test
      capability: independent.shellcommand
      collection: os-mdm-require-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: os_mdm_require_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: .*
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-os-mdm-require-recommended-test
