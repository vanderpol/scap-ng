assessment:
  id: ng.shared.1258ca8851f45b78b708eba2
  version: 1
  assessment_title: Firefox must be configured to not automatically execute or download MIME types that are not authorized
    for auto-download.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Type "about:preferences" in the browser address bar. Type "Applications" in the Find bar in the upper-right
    corner. Determine if any of the following file extensions are listed: HTA, JSE, JS, MOCHA, SHS, VBE, VBS, SCT, WSC, FDF,
    XFDF, LSL, LSO, LSS, IQY, RQY, DOS, BAT, PS, EPS, WCH, WCM, WB1, WB3, WCH, WCM, AD. If the entry exists and the "Action"
    is "Save File" or "Always Ask", this is not a finding. If an extension exists and the entry in the Action column is associated
    with an application that does/can execute the code, this is a finding.'
  inputs: []
  evidence: []
