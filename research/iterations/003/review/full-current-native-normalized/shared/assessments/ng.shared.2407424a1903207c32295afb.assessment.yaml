assessment:
  id: ng.shared.2407424a1903207c32295afb
  version: 1
  assessment_title: WN22-DC-000320 - Windows Server 2022 domain controllers must require LDAP access signing.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Services\NTDS\Parameters
        name:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: LDAPServerIntegrity
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '2'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-domain-controller-ldap-server-signing-requirements-set-require-signing:
      test_title: '''Domain Controller: LDAP Server signing requirements'' is set to ''Require signing'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-domain-controller-ldap-server-signing-requirements-set-require-signing
