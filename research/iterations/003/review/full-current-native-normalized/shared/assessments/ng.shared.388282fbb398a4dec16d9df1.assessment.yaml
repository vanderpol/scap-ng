assessment:
  id: ng.shared.388282fbb398a4dec16d9df1
  version: 1
  assessment_title: The operating system must protect the audit records resulting from non-local accesses to privileged accounts
    and the execution of privileged functions.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The audit configuration profile is required. This check applies to the global zone only. Determine the zone
    that you are currently securing. # zonename If the command output is "global", this check applies. Determine the location
    of the local audit trail files. # auditconfig -getplugin audit_binfile Plugin: audit_binfile (active) Attributes: p_dir=/var/audit;p_fsize=4M;p_minfree=1;"
    In this example, the audit files can be found in /var/audit. Check that the permissions on the audit files are 640 (rw-
    r-- --) or less permissive. # ls -al /var/audit # ls -l /var/audit/* If the permissions are more permissive than 640,
    this is a finding. Note: The default Solaris 11 location for /var/audit is a link to /var/share/audit.'
  inputs: []
  evidence: []
