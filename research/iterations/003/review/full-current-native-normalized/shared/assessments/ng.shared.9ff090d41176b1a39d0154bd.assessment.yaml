assessment:
  id: ng.shared.9ff090d41176b1a39d0154bd
  version: 1
  assessment_title: The operating system session lock mechanism, when activated on a device with a display screen, must place
    a publicly viewable pattern onto the associated display, hiding what was previously visible on the screen.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    gdm-graphical-login-object:
      capability: solaris.smf
      select:
        fmri:
          operation: equals
          datatype: string
          mask: false
          value: svc://localhost/application/graphical-login/gdm:default
      object_title: The gdm graphical-login.
    xdm-graphical-login-object:
      capability: solaris.smf
      select:
        fmri:
          operation: equals
          datatype: string
          mask: false
          value: svc://localhost/application/graphical-login/xdm:default
      object_title: The xdm graphical-login.
    mode-field-in-xscreensaver-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /usr/share/X11/app-defaults/XScreenSaver
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*\*mode:\s*(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: mode field in XScreenSaver
    all-users-object:
      capability: unix.password
      select:
        username:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[^-+].*$
      object_title: All users
    home-directories-all-user-accounts-object:
      capability: unix.password
      set:
        operator: union
        members:
        - object: all-users-object
        filters:
        - action: exclude
          state: state-system-accounts
        - action: exclude
          state: state-system-account
        - action: exclude
          state: state-system-account-2
        - action: exclude
          state: state-system-account-3
      object_title: The home directories of all user accounts.
    mode-field-in-user-s-xscreensaver-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: home-directories-all-user-accounts-variable
        filename:
          operation: equals
          datatype: string
          mask: false
          value: .xscreensaver
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*mode:\s*(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: mode field in a user's .xscreensaver.
  variables:
    home-directories-all-user-accounts-variable:
      title: The home directories of all user accounts.
      kind: local
      datatype: string
      expression:
        values:
          object: home-directories-all-user-accounts-object
          field: home_dir
  states:
    state-gdm-graphical-login-is-online:
      state_title: gdm graphical-login is online.
      capability: solaris.smf
      state:
        field: service_state
        value: ONLINE
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-the-blank-mode-in-the-default-xscreensaver-file:
      state_title: The blank mode in the default XScreenSaver file.
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: blank
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-the-blank-mode-in-a-user-s-xscreensaver-file:
      state_title: The blank mode in a user's .xscreensaver file
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: blank
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-system-accounts:
      state_title: System accounts.
      capability: unix.password
      state:
        field: user_id
        value: '100'
        operation: less than
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-system-account:
      state_title: System account.
      capability: unix.password
      state:
        field: user_id
        value: '60001'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-system-account-2:
      state_title: System account.
      capability: unix.password
      state:
        field: user_id
        value: '60002'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-system-account-3:
      state_title: System account.
      capability: unix.password
      state:
        field: user_id
        value: '65534'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-check-see-if-xwindows-being-run-by-system-using-cdm:
      test_title: Check to see if XWindows is being run by the system, using CDM.
      capability: solaris.smf
      object: gdm-graphical-login-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-gdm-graphical-login-is-online
    test-check-see-if-xwindows-being-run-by-system-using-xdm:
      test_title: Check to see if XWindows is being run by the system, using XDM.
      capability: solaris.smf
      object: xdm-graphical-login-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-gdm-graphical-login-is-online
    test-xscreensaver-file-list-blank-as-mode:
      test_title: The XScreenSaver file must list blank as the mode.
      capability: independent.textfilecontent54
      object: mode-field-in-xscreensaver-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-the-blank-mode-in-the-default-xscreensaver-file
    test-all-user-xscreensaver-files-list-blank-as-mode:
      test_title: All user .xscreensaver files must list blank as the mode.
      capability: independent.textfilecontent54
      object: mode-field-in-user-s-xscreensaver-object
      check_existence: any_exist
      check: all
      states:
      - state-the-blank-mode-in-a-user-s-xscreensaver-file
  evaluate:
    any:
    - not:
        any:
        - test: test-check-see-if-xwindows-being-run-by-system-using-cdm
        - test: test-check-see-if-xwindows-being-run-by-system-using-xdm
    - all:
      - test: test-xscreensaver-file-list-blank-as-mode
      - test: test-all-user-xscreensaver-files-list-blank-as-mode
