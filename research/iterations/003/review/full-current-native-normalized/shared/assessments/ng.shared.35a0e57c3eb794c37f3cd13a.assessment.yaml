assessment:
  id: ng.shared.35a0e57c3eb794c37f3cd13a
  version: 1
  assessment_title: 'OL07-00-021350 - The Oracle Linux operating system must implement NIST FIPS-validated cryptography for
    the following: to provision digital signatures, to generate cryptographic hashes, and to protect data requiring data-at-rest
    protections in accordance with applicable federal laws, Executive Orders, directives, policies, regulations, and standards.'
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-rpminfo-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          value: prelink
      object_title: null
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/sysconfig/prelink
        pattern:
          operation: pattern match
          datatype: string
          value: ^[\s]*PRELINKING=no[\s]*
        instance:
          operation: equals
          datatype: int
          value: '1'
      object_title: null
    linux-rpminfo-object-2:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          value: dracut-fips
      object_title: null
    independent-textfilecontent54-object-2:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/default/grub
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*GRUB_CMDLINE_LINUX="(.*)"$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
    independent-textfilecontent54-object-3:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/default/grub
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*GRUB_CMDLINE_LINUX_DEFAULT="(.*)"$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
    independent-textfilecontent54-object-4:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          variable_check: at least one
          value:
            variable: grub-cfg-locations-variable
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*linux(?:[^#\n]*)/vmlinuz([^#\n]*)
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
    independent-textfilecontent54-object-5:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /proc/sys/crypto/fips_enabled
        pattern:
          operation: pattern match
          datatype: string
          value: ^1$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
    independent-textfilecontent54-object-6:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/default/grub
        pattern:
          operation: pattern match
          datatype: string
          value: ^[^#]*fips=0
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
    unix-file-object:
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/system-fips
      object_title: null
  variables:
    grub-cfg-locations-variable:
      title: grub.cfg locations
      kind: constant
      datatype: string
      expression:
        literal:
        - /boot/grub2/grub.cfg
        - /boot/efi/EFI/redhat/grub.cfg
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^(.* )?fips=1( .*)?$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-prelink-package-not-installed:
      test_title: Prelink package is not installed
      capability: linux.rpminfo
      object: linux-rpminfo-object
      check_existence: none_exist
      check: all
    test-prelinking-disabled:
      test_title: Prelinking is disabled
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: all_exist
      check: all
    test-dracut-fips-package-installed:
      test_title: Dracut-fips package is installed
      capability: linux.rpminfo
      object: linux-rpminfo-object-2
      check_existence: all_exist
      check: all
    test-fips-1-in-etc-default-grub-via-grub-cmdline-linux:
      test_title: fips=1 in /etc/default/grub via GRUB_CMDLINE_LINUX
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-2
      check_existence: all_exist
      check: all
      states:
      - state-independent-textfilecontent54
    test-fips-1-in-etc-default-grub-via-grub-cmdline-linux-2:
      test_title: fips=1 in /etc/default/grub via GRUB_CMDLINE_LINUX_DEFAULT
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-3
      check_existence: all_exist
      check: all
      states:
      - state-independent-textfilecontent54
    test-fips-1-in-grub-cfg:
      test_title: fips=1 in grub.cfg
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-4
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
    test-1-in-proc-sys-crypto-fips-enabled:
      test_title: 1 in /proc/sys/crypto/fips_enabled
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-5
      check_existence: all_exist
      check: all
    test-fips-0-in-etc-default-grub:
      test_title: fips=0 in /etc/default/grub
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-6
      check_existence: none_exist
      check: all
    test-etc-system-fips-exists:
      test_title: /etc/system-fips exists
      capability: unix.file
      object: unix-file-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    all:
    - any:
      - test: test-prelink-package-not-installed
      - test: test-prelinking-disabled
    - test: test-dracut-fips-package-installed
    - any:
      - test: test-fips-1-in-etc-default-grub-via-grub-cmdline-linux
      - test: test-fips-1-in-etc-default-grub-via-grub-cmdline-linux-2
    - test: test-fips-1-in-grub-cfg
    - test: test-1-in-proc-sys-crypto-fips-enabled
    - test: test-fips-0-in-etc-default-grub
    - test: test-etc-system-fips-exists
