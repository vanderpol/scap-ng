assessment:
  id: ng.shared.69e0632e3433a659ced51889
  version: 1
  assessment_title: The macOS system must disable accounts after 35 days of inactivity.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    pwpolicy-account-inactivity-enforce-stig-object-collection:
      collection_title: pwpolicy_account_inactivity_enforce_stig_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/bin/pwpolicy -getaccountpolicies | /usr/bin/tail +2 | /usr/bin/xmllint --xpath '//dict/key[text()="policyAttributeInactiveDays"]/following-sibling::integer[1]/text()'
            -
  tests:
    test-pwpolicy-account-inactivity-enforce-stig-test:
      test_title: pwpolicy_account_inactivity_enforce_stig_test
      capability: independent.shellcommand
      collection: pwpolicy-account-inactivity-enforce-stig-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: pwpolicy_account_inactivity_enforce_stig_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: '35'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-pwpolicy-account-inactivity-enforce-stig-test
