assessment:
  id: ng.shared.a2c55b71f4d6b61dd46432ca
  version: 1
  assessment_title: UBTU-22-232140 - Ubuntu 22.04 LTS must be configured so that the "journalctl" command is not accessible
    by unauthorized users.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-file-object:
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          value: /usr/bin/journalctl
      object_title: null
  states:
    state-mode-0740-or-less-permissive:
      state_title: mode 0740 or less permissive
      capability: unix.file
      state:
        all:
        - field: suid
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: sgid
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: sticky
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: gwrite
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: gexec
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: oread
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: owrite
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: oexec
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-usr-bin-journalctl-command-has-mode-0740-or-less-permissive:
      test_title: /usr/bin/journalctl command has mode 0740 or less permissive
      capability: unix.file
      object: unix-file-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-mode-0740-or-less-permissive
  evaluate:
    test: test-usr-bin-journalctl-command-has-mode-0740-or-less-permissive
