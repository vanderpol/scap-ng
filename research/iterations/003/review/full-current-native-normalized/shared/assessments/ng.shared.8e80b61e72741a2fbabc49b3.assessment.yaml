assessment:
  id: ng.shared.8e80b61e72741a2fbabc49b3
  version: 1
  assessment_title: WN10-00-000050 - Local volumes must be formatted using NTFS.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    all-local-disk-file-systems-not-using-ntfs-object:
      capability: windows.wmi.query
      object_title: All 'Local Disk' File systems not using NTFS
      collect:
        namespace: root\cimv2
        query: SELECT deviceid FROM win32_logicaldisk WHERE drivetype=3 AND filesystem!="NTFS"
  states: {}
  tests:
    test-local-volumes-use-ntfs:
      test_title: Local volumes use NTFS
      capability: windows.wmi.query
      object: all-local-disk-file-systems-not-using-ntfs-object
      existence: none
      match: all
  evaluate:
    test: test-local-volumes-use-ntfs
