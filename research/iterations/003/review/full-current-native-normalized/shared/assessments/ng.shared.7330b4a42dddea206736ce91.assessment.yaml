assessment:
  id: ng.shared.7330b4a42dddea206736ce91
  version: 1
  assessment_title: OL09-00-005005 - OL 9 must be configured to forward audit records via TCP to a different system or media
    from the system being audited via rsyslog.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    rsyslog-conf-remote-tcp-logging-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/rsyslog.conf
        pattern:
          operation: pattern match
          datatype: string
          value: ^\*\.\*\s+@@(\S+)
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      behaviors:
        ignore_case: 'true'
      object_title: 'rsyslog.conf: remote TCP logging'
    rsyslog-d-conf-remote-tcp-logging-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/rsyslog.d
        filename:
          operation: pattern match
          datatype: string
          value: ^.*\.conf$
        pattern:
          operation: pattern match
          datatype: string
          value: ^\*\.\*\s+@@(\S+)
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      behaviors:
        ignore_case: 'true'
      object_title: 'rsyslog.d/*.conf: remote TCP logging'
    remote-tcp-logging-object:
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - object: rsyslog-conf-remote-tcp-logging-object
        - object: rsyslog-d-conf-remote-tcp-logging-object
      object_title: remote TCP logging
    rsyslog-conf-action-all-messages-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/rsyslog.conf
        pattern:
          operation: pattern match
          datatype: string
          value: ^\*\.\*\s+action\((\s*(?:[^#\)]*(?:#.*$)?\n)*[^#\)]*)\)
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      behaviors:
        ignore_case: 'true'
      object_title: 'rsyslog.conf: action for all messages'
    rsyslog-d-conf-action-all-messages-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/rsyslog.d
        filename:
          operation: pattern match
          datatype: string
          value: ^.*\.conf$
        pattern:
          operation: pattern match
          datatype: string
          value: ^\*\.\*\s+action\((\s*(?:[^#\)]*(?:#.*$)?\n)*[^#\)]*)\)
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      behaviors:
        ignore_case: 'true'
      object_title: 'rsyslog.d/*.conf: action for all messages'
    rsyslog-action-all-messages-object:
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - object: rsyslog-conf-action-all-messages-object
        - object: rsyslog-d-conf-action-all-messages-object
      object_title: 'rsyslog: action for all messages'
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^.+$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54-2:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: (?i)(?:^|\n)[^#]*\btype\s*=\s*"omfwd"
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54-3:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: (?i)(?:^|\n)[^#]*\bprotocol\s*=\s*"tcp"
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-remote-tcp-logging:
      test_title: remote TCP logging
      capability: independent.textfilecontent54
      object: remote-tcp-logging-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
    test-remote-tcp-logging-advanced-syntax:
      test_title: remote TCP logging (advanced syntax)
      capability: independent.textfilecontent54
      object: rsyslog-action-all-messages-object
      check_existence: at_least_one_exists
      check: at least one
      state_operator: AND
      states:
      - state-independent-textfilecontent54-2
      - state-independent-textfilecontent54-3
  evaluate:
    any:
    - test: test-remote-tcp-logging
    - test: test-remote-tcp-logging-advanced-syntax
