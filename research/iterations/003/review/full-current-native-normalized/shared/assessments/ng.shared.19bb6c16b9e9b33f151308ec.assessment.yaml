assessment:
  id: ng.shared.19bb6c16b9e9b33f151308ec
  version: 1
  assessment_title: Exchange internal Receive connectors must not allow anonymous connections.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    run-get-receiveconnector-display-permissiongroups-configuration-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: add-pssnapin Microsoft.Exchange.Management.Powershell.Snapin;Get-ReceiveConnector | Select-Object -Property
            Name, Identity, PermissionGroups |  Format-Table -HideTableHeaders | Out-String -Width 4096
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: \w
      behaviors:
        error_if_stderr_exists: 'true'
      object_title: Run Get-ReceiveConnector to display PermissionGroups configuration
  states:
    state-verify-anonymoususers-is-not-found:
      state_title: Verify AnonymousUsers is not found
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: (?i)AnonymousUsers
        operation: pattern match
        datatype: string
        mask: false
        entity_check: none satisfy
        entity_existence: at_least_one_exists
  tests:
    test-each-receive-connector-if-value-permissiongroups-anonymoususers-any-receive-connector:
      test_title: For each Receive connector, if the value of PermissionGroups is AnonymousUsers for any receive connector,
        this is a finding.
      capability: independent.shellcommand
      object: run-get-receiveconnector-display-permissiongroups-configuration-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-verify-anonymoususers-is-not-found
  evaluate:
    test: test-each-receive-connector-if-value-permissiongroups-anonymoususers-any-receive-connector
