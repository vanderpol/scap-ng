assessment:
  id: ng.shared.81acd63533339d0b86b050fb
  version: 1
  assessment_title: The Cisco router must be running an IOS release that is currently supported by Cisco Systems.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that the router is in compliance with this requirement by having the router administrator enter the following
    command: show version Verify that the release is still supported by Cisco. All releases supported by Cisco can be found
    on the following URL: www.cisco.com/c/en/us/support/ios-nx-os-software If the router is not running a supported release,
    this is a finding.'
  inputs: {}
  evidence: []
