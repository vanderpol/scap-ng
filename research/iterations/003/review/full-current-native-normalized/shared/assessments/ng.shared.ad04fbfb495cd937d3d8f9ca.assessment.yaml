assessment:
  id: ng.shared.ad04fbfb495cd937d3d8f9ca
  version: 1
  assessment_title: Passwords must, at a minimum, be 14 characters.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy
    -> Computer Configuration -> Windows Settings -> Security Settings -> Account Policies -> Password Policy. If the value
    for the "Minimum password length," is less than "14" characters, this is a finding.
  inputs: {}
  evidence: []
