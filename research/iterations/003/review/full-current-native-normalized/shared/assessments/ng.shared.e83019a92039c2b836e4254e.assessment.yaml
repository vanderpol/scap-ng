assessment:
  id: ng.shared.e83019a92039c2b836e4254e
  version: 1
  assessment_title: The Windows DNS Server must be configured to record who added/modified/deleted DNS zone information.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Log on to the DNS server using the Domain Admin or Enterprise Admin account or Local Administrator account. Press
    the Windows key + R and execute "dnsmgmt.msc". Right-click the DNS server and select "Properties". Click the "Event Logging"
    tab. By default, all events are logged. Verify "Errors and warnings" or "All events" is selected. If any option other
    than "Errors and warnings" or "All events" is selected, this is a finding.
  inputs: []
  evidence: []
