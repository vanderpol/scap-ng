assessment:
  id: ng.shared.20a78c339f3b72f563c4c0bc
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that all local interactive user accounts, upon
    creation, are assigned a home directory.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify all local interactive users on the system are assigned a home directory upon creation. Check to see if
    the system is configured to create home directories for local interactive users with the following command: # grep -i
    create_home /etc/login.defs CREATE_HOME yes If the value for "CREATE_HOME" parameter is not set to "yes", the line is
    missing, or the line is commented out, this is a finding.'
  inputs: []
  evidence: []
