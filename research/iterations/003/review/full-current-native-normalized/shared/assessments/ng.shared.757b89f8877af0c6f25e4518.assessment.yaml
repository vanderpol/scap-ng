assessment:
  id: ng.shared.757b89f8877af0c6f25e4518
  version: 1
  assessment_title: The Oracle Linux operating system must prevent a user from overriding the screensaver lock-delay setting
    for the graphical user interface.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system prevents a user from overriding a screensaver lock after a 15-minute period of inactivity
    for graphical user interfaces. Note: If the system does not have GNOME installed, this requirement is Not Applicable.
    Determine which profile the system database is using with the following command: # grep system-db /etc/dconf/profile/user
    system-db:local Check for the lock delay setting with the following command: Note: The example below is using the database
    "local" for the system, so the path is "/etc/dconf/db/local.d". This path must be modified if a database other than "local"
    is being used. # grep -i lock-delay /etc/dconf/db/local.d/locks/* /org/gnome/desktop/screensaver/lock-delay If the command
    does not return a result, this is a finding.'
  inputs: []
  evidence: []
