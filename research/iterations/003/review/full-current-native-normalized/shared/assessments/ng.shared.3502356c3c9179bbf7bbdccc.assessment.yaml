assessment:
  id: ng.shared.3502356c3c9179bbf7bbdccc
  version: 1
  assessment_title: The Windows DNS Server must verify the correct operation of security functions upon startup and/or restart,
    upon command by a user with privileged access, and/or every 30 days.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    list-all-forward-reverse-lookup-zones-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: powershell
        command:
          operation: equals
          datatype: string
          value: Get-DnsServerZone | Where-Object {$_.ZoneType -notin @('Forwarder') -and $_.ZoneName -notin @('TrustAnchors')
            -and (-Not $_.IsAutoCreated)} | ForEach-Object {$_.ZoneName}
      object_title: The list of all forward and reverse lookup zones
    list-all-forward-lookup-zones-that-not-integrated-active-directory-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: powershell
        command:
          operation: equals
          datatype: string
          value: Get-DnsServerZone | Where-Object {$_.ZoneType -notin @('Forwarder') -and $_.ZoneName -notin @('TrustAnchors')
            -and (-Not $_.IsAutoCreated) -and -Not($_.IsReverseLookupZone) -and (-Not $_.IsDsIntegrated)} | ForEach-Object
            {$_.ZoneName}
      object_title: The list of all forward lookup zones that are not integrated with Active Directory
    list-all-forward-lookup-zones-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: powershell
        command:
          operation: equals
          datatype: string
          value: Get-DnsServerZone | Where-Object {$_.ZoneType -notin @('Forwarder') -and $_.ZoneName -notin @('TrustAnchors')
            -and (-Not $_.IsAutoCreated) -and -Not($_.IsReverseLookupZone)} | ForEach-Object {$_.ZoneName}
      object_title: The list of all forward lookup zones
    number-rrsigs-resource-record-signature-associated-each-ipv4-host-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: powershell
        command:
          operation: equals
          datatype: string
          variable_check: all
          value:
            variable: command-get-number-rrsigs-resource-record-signature-associated-each-ipv4-variable
      object_title: The number of RRSIGs (Resource Record Signature) associated with each IPv4 host
    number-rrsigs-resource-record-signature-associated-each-ipv6-host-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: powershell
        command:
          operation: equals
          datatype: string
          variable_check: all
          value:
            variable: command-get-number-rrsigs-resource-record-signature-associated-each-ipv6-variable
      object_title: The number of RRSIGs (Resource Record Signature) associated with each IPv6 host
  variables:
    command-get-number-rrsigs-resource-record-signature-associated-each-ipv4-variable:
      title: The command to get the number of RRSIGs (Resource Record Signature) associated with each IPv4 host
      kind: local
      datatype: string
      expression:
        concat:
        - literal:
            value: try {$zoneName = '
            datatype: string
        - values:
            object: list-all-forward-lookup-zones-object
            field: stdout_line
        - literal:
            value: '''; Get-DnsServerResourceRecord -ZoneName $zoneName -RRType A | Where-Object HostName -NotMatch ''(@|DnsZones)''
              | Select-Object -First 5 | ForEach-Object { $fqdn = $($_.hostname) + ''.'' + $($zoneName); Resolve-DnsName -Name
              $fqdn -Server $env:COMPUTERNAME -DnssecOk | Where-Object Type -EQ RRSIG | Measure-Object | Select-Object -ExpandProperty
              count}} catch {}'
            datatype: string
    command-get-number-rrsigs-resource-record-signature-associated-each-ipv6-variable:
      title: The command to get the number of RRSIGs (Resource Record Signature) associated with each IPv6 host
      kind: local
      datatype: string
      expression:
        concat:
        - literal:
            value: try {$zoneName = '
            datatype: string
        - values:
            object: list-all-forward-lookup-zones-object
            field: stdout_line
        - literal:
            value: '''; Get-DnsServerResourceRecord -ZoneName $zoneName -RRType AAAA | Where-Object HostName -NotMatch ''(@|DnsZones)''
              | Select-Object -First 5 | ForEach-Object { $fqdn = $($_.hostname) + ''.'' + $($zoneName); Resolve-DnsName -Name
              $fqdn -Server $env:COMPUTERNAME -DnssecOk | Where-Object Type -EQ RRSIG | Measure-Object | Select-Object -ExpandProperty
              count}} catch {}'
            datatype: string
  states:
    state-there-are-no-forward-or-reverse-lookup-zones:
      state_title: There are no forward or reverse lookup zones
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: ''
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: none_exist
    state-there-are-no-forward-lookup-zones-that-are-not-integrate:
      state_title: There are no forward lookup zones that are not integrated with Active Directory
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: ''
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: none_exist
    state-the-number-of-rrsigs-resource-record-signatures-associat:
      state_title: The number of RRSIGs (Resource Record Signatures) associated with a given host is greater than 0
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: '0'
        operation: greater than
        datatype: int
        entity_check: all
        entity_existence: any_exist
  tests:
    test-dns-server-caching-only-there-no-forward-or-reverse-lookup:
      test_title: DNS server is caching only (there are no forward or reverse lookup zones)
      capability: independent.shellcommand
      object: list-all-forward-reverse-lookup-zones-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-there-are-no-forward-or-reverse-lookup-zones
    test-all-forward-lookup-zones-if-any-integrated-active-directory:
      test_title: All forward lookup zones (if any) are integrated with Active Directory
      capability: independent.shellcommand
      object: list-all-forward-lookup-zones-that-not-integrated-active-directory-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-there-are-no-forward-lookup-zones-that-are-not-integrate
    test-there-at-least-one-rrsig-resource-record-signature-associated-each:
      test_title: There is at least one RRSIG (Resource Record Signature) associated with each IPv4 host
      capability: independent.shellcommand
      object: number-rrsigs-resource-record-signature-associated-each-ipv4-host-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-the-number-of-rrsigs-resource-record-signatures-associat
    test-there-at-least-one-rrsig-resource-record-signature-associated-each-2:
      test_title: There is at least one RRSIG (Resource Record Signature) associated with each IPv6 host
      capability: independent.shellcommand
      object: number-rrsigs-resource-record-signature-associated-each-ipv6-host-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-the-number-of-rrsigs-resource-record-signatures-associat
  evaluate:
    any:
    - test: test-dns-server-caching-only-there-no-forward-or-reverse-lookup
    - test: test-all-forward-lookup-zones-if-any-integrated-active-directory
    - all:
      - test: test-there-at-least-one-rrsig-resource-record-signature-associated-each
      - test: test-there-at-least-one-rrsig-resource-record-signature-associated-each-2
