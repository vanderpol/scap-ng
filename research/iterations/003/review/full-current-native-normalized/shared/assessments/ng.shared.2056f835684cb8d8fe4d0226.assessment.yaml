assessment:
  id: ng.shared.2056f835684cb8d8fe4d0226
  version: 1
  assessment_title: The Create symbolic links user right must only be assigned to the Administrators group.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy
    >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment. If any
    accounts or groups other than the following are granted the "Create symbolic links" user right, this is a finding: Administrators
    Systems that have the Hyper-V role will also have "Virtual Machines" given this user right (this may be displayed as "NT
    Virtual Machine\Virtual Machines"). This is not a finding.'
  inputs: {}
  evidence: []
