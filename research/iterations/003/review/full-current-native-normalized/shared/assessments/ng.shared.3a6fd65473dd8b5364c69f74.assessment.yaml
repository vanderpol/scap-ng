assessment:
  id: ng.shared.3a6fd65473dd8b5364c69f74
  version: 1
  assessment_title: The Oracle Linux operating system must prevent binary files from being executed on file systems that are
    being imported via Network File System (NFS).
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify file systems that are being NFS imported are configured with the "noexec" option. Find the file system(s)
    that contain the directories being imported with the following command: # more /etc/fstab | grep nfs UUID=e06097bb-cfcd-437b-9e4d-a691f5662a7d
    /store nfs rw,noexec 0 0 If a file system found in "/etc/fstab" refers to NFS and it does not have the "noexec" option
    set, and use of NFS imported binaries is not documented with the Information System Security Officer (ISSO) as an operational
    requirement, this is a finding. Verify the NFS is mounted with the "noexec"option: # mount | grep nfs | grep noexec If
    no results are returned and use of NFS imported binaries is not documented with the Information System Security Officer
    (ISSO) as an operational requirement, this is a finding.'
  inputs: []
  evidence: []
