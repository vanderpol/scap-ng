      capability: windows.appcmdlistconfig
      collection: unspecified-file-extensions-not-allowed-execute-on-production-web-server-collection
      assertion:
        existence: only_one_exists
        item_quantifier: all
        state_title: appcmdlistconfig result must equal False.
        state_capability: windows.appcmdlistconfig
        state:
          field: result
          value: 'false'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-unspecified-file-extensions-not-allowed-execute-on-production-web-server-2:
      test_title: Unspecified file extensions must not be allowed to execute on the production web server. (2 of 2)
      capability: windows.appcmdlistconfig
