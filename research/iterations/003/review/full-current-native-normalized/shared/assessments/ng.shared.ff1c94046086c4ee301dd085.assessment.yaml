assessment:
  id: ng.shared.ff1c94046086c4ee301dd085
  version: 1
  assessment_title: Unspecified file extensions on a production IIS 10.0 web server must be removed.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    unspecified-file-extensions-not-allowed-execute-on-production-web-server-collection:
      collection_title: Unspecified file extensions must not be allowed to execute on the production web server. (1 of 2)
      capability: windows.appcmdlistconfig
      select:
        identifier_type:
          operation: equals
          datatype: string
          mask: false
          value: Webserver
        identifier:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
        section:
          operation: equals
          datatype: string
          mask: false
          value: system.webServer/security/isapiCgiRestriction
        parameter:
          operation: equals
          datatype: string
          mask: false
          value: notListedIsapisAllowed
    unspecified-file-extensions-not-allowed-execute-on-production-web-server-collection-2:
      collection_title: Unspecified file extensions must not be allowed to execute on the production web server. (2 of 2)
      capability: windows.appcmdlistconfig
      select:
        identifier_type:
          operation: equals
          datatype: string
          mask: false
          value: Webserver
        identifier:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
        section:
          operation: equals
          datatype: string
          mask: false
          value: system.webServer/security/isapiCgiRestriction
        parameter:
          operation: equals
          datatype: string
          mask: false
          value: notListedCgisAllowed
  tests:
    test-unspecified-file-extensions-not-allowed-execute-on-production-web-server:
