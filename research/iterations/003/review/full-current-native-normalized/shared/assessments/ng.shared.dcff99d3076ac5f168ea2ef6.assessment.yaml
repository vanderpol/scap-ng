assessment:
  id: ng.shared.dcff99d3076ac5f168ea2ef6
  version: 1
  assessment_title: The Oracle Linux operating system must disable the login screen user list for graphical user interfaces.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that the operating system is configured to disable the login screen user list for graphical user interfaces.
    Note: If the system does not have the GNOME Desktop installed, this requirement is Not Applicable. Verify that the login
    screen user list for the GNOME Desktop is disabled with the following command: $ sudo grep -is disable-user-list /etc/dconf/db/gdm.d/*
    /etc/dconf/db/gdm.d/00-login-screen:disable-user-list=true If the variable "disable-user-list" is not defined in a file
    under "/etc/dconf/db/gdm.d/", is not set to "true", is missing or commented out, this is a finding.'
  inputs: {}
  evidence: []
