  assessment_title: The operating system must implement transaction recovery for transaction-based systems.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Solaris 11 ZFS copy-on-write model allows filesystem accesses to work according to a transactional model, such
    that on-disk content is always consistent and cannot be configured to be out of compliance. Determine if any UFS file
    systems are mounted with the "nologging" option. # mount|grep nologging If any file systems are listed, this is a finding.'
