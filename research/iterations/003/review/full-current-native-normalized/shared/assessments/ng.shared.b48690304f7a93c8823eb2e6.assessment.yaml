assessment:
  id: ng.shared.b48690304f7a93c8823eb2e6
  version: 1
  assessment_title: UBTU-18-010127 - The Ubuntu operating system must configure /var/log/syslog file with mode 0640 or less
    permissive.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    unix-file-collection:
      collection_title: null
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /var/log
        filename:
          operation: equals
          datatype: string
          mask: false
          value: syslog
  tests:
    test-mode-var-log-syslog-file-0640-or-less-permissive:
      test_title: Mode of /var/log/syslog file is 0640 or less permissive
      capability: unix.file
      collection: unix-file-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Mode 0640 or less permissive
        state_capability: unix.file
        state:
          all:
          - field: suid
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: sgid
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: sticky
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: uexec
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: gwrite
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: gexec
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: oread
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: owrite
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: oexec
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-mode-var-log-syslog-file-0640-or-less-permissive
