assessment:
  id: ng.shared.0abe04fddecaadbf9b465028
  version: 1
  assessment_title: Device Install - Drivers System Restore Point
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\Windows\DeviceInstall\Settings
        name:
          operation: equals
          datatype: string
          mask: false
          value: DisableSystemRestore
      object_title: null
  variables:
    do-not-create-system-restore-point-when-new-device-driver-variable:
      title: Do not create system restore point when new device driver installed
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: do_not_create_system_restore_point_when_new_device_driver_installed_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: do-not-create-system-restore-point-when-new-device-driver-variable
          operation: equals
          datatype: int
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-prevent-creation-system-restore-point-during-device-activity-that-would:
      test_title: '''Prevent creation of a system restore point during device activity that would normally prompt creation
        of a restore point'' is set to ''Disabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-prevent-creation-system-restore-point-during-device-activity-that-would
