assessment:
  id: ng.shared.1103b534927535fcacbd1ef8
  version: 1
  assessment_title: WN10-AU-000510 - The System event log size must be configured to 32768 KB or greater.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: case insensitive equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: case insensitive equals
          datatype: string
          value: SOFTWARE\Policies\Microsoft\Windows\EventLog\System
        name:
          operation: case insensitive equals
          datatype: string
          value: MaxSize
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '32768'
          operation: greater than or equal
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-system-event-log-size-configured-32768-kb-or-greater:
      test_title: The System event log size is configured to 32768 KB or greater
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-system-event-log-size-configured-32768-kb-or-greater
