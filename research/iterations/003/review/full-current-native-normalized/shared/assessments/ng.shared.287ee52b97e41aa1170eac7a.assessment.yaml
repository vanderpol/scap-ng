assessment:
  id: ng.shared.287ee52b97e41aa1170eac7a
  version: 1
  assessment_title: Successful/unsuccessful uses of the pam_timestamp_check command in RHEL 8 must generate an audit record.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that an audit event is generated for any successful/unsuccessful use of the "pam_timestamp_check" command
    by performing the following command to check the file system rules in "/etc/audit/audit.rules": $ sudo grep -w pam_timestamp_check
    /etc/audit/audit.rules -a always,exit -F path=/usr/sbin/pam_timestamp_check -F perm=x -F auid>=1000 -F auid!=unset -k
    privileged-pam_timestamp_check If the command does not return a line, or the line is commented out, this is a finding.'
  inputs: {}
  evidence: []
