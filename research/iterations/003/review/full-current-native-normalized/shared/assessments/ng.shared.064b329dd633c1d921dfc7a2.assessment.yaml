  version: 1
  assessment_title: Unused database components, DBMS software, and database objects must be removed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: From the server documentation, obtain a listing of required components. Generate a listing of components installed
    on the server. Click Start >> Type "SQL Server 2016 Installation Center" >> Launch the program >> Click Tools >> Click
    "Installed SQL Server features discovery report" Compare the feature listing against the required components listing.
    If any features are installed, but are not required, this is a finding.
  inputs: {}
  evidence: []
