  version: 1
  assessment_title: The macOS system must disable Server Message Block (SMB) sharing.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable SMB sharing with the following command: /bin/launchctl print-disabled
    system | /usr/bin/grep -c ''"com.apple.smbd" => disabled'' If the result is not "1", this is a finding.'
  inputs: []
  evidence: []
