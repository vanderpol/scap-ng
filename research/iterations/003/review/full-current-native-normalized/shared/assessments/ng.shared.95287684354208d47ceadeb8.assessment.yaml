assessment:
  id: ng.shared.95287684354208d47ceadeb8
  version: 1
  assessment_title: The macOS system must disable root logon.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    os-root-disable-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: zsh
        command:
          operation: equals
          datatype: string
          value: /usr/bin/dscl . -read /Users/root UserShell 2>&1 | /usr/bin/grep "/usr/bin/false"
      object_title: os_root_disable_recommended_object
  states:
    state-os-root-disable-recommended-state:
      state_title: os_root_disable_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: .*
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-os-root-disable-recommended-test:
      test_title: os_root_disable_recommended_test
      capability: independent.shellcommand
      object: os-root-disable-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-os-root-disable-recommended-state
  evaluate:
    test: test-os-root-disable-recommended-test
