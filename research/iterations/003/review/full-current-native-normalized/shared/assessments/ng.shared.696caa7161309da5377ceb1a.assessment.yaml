  version: 1
  assessment_title: The macOS system must disable the iCloud Calendar services.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable iCloud Calendar services with the following command: /usr/bin/osascript
    -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\ .objectForKey(''allowCloudCalendar'').js
    EOS If the result is not "false", this is a finding.'
  inputs: {}
  evidence: []
