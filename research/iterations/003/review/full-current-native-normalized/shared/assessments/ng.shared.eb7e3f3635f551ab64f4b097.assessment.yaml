assessment:
  id: ng.shared.eb7e3f3635f551ab64f4b097
  version: 1
  assessment_title: Non-privileged accounts on the hosting system must only access Apache web server security-relevant information
    and functions through a distinct administrative account.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Determine which tool or control file is used to control the configuration of the web server. If the control of
    the web server is done via control files, verify who has update access to them. If tools are being used to configure the
    web server, determine who has access to execute the tools. If accounts other than the System Administrator (SA), the Web
    Manager, or the Web Manager designees have access to the web administration tool or control files, this is a finding.
  inputs: {}
  evidence: []
