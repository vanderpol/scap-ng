assessment:
  id: ng.shared.c236606495f640c4d803e84e
  version: 1
  assessment_title: The operating system must terminate the network connection associated with a communications session at
    the end of the session or after 10 minutes of inactivity.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Determine if SSH is configured to disconnect sessions after 10 minutes of inactivity. # grep ClientAlive /etc/ssh/sshd_config
    If the output of this command is not: ClientAliveInterval 600 ClientAliveCountMax 0 this is a finding.'
  inputs: []
  evidence: []
