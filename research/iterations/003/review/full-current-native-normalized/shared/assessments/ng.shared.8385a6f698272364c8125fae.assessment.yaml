assessment:
  id: ng.shared.8385a6f698272364c8125fae
  version: 1
  assessment_title: The Oracle Linux operating system must audit all uses of the setxattr, fsetxattr, lsetxattr, removexattr,
    fremovexattr, and lremovexattr syscalls.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system generates audit records upon successful/unsuccessful attempts to use the "setxattr",
    "fsetxattr", "lsetxattr", "removexattr", "fremovexattr", and "lremovexattr" syscalls. Check the file system rules in "/etc/audit/audit.rules"
    with the following commands: # grep xattr /etc/audit/audit.rules -a always,exit -F arch=b32 -S setxattr,fsetxattr,lsetxattr,removexattr,fremovexattr,lremovexattr
    -F auid>=1000 -F auid!=unset -k perm_mod -a always,exit -F arch=b64 -S setxattr,fsetxattr,lsetxattr,removexattr,fremovexattr,lremovexattr
    -F auid>=1000 -F auid!=unset -k perm_mod If both the "b32" and "b64" audit rules are not defined for the "setxattr", "fsetxattr",
    "lsetxattr", "removexattr", "fremovexattr", and "lremovexattr" syscalls, this is a finding.'
  inputs: []
  evidence: []
