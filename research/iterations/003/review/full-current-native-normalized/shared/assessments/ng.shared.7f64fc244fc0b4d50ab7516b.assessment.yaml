assessment:
  id: ng.shared.7f64fc244fc0b4d50ab7516b
  version: 1
  assessment_title: Computer Account Password Reset
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Services\Netlogon\Parameters
        name:
          operation: equals
          datatype: string
          mask: false
          value: DisablePasswordChange
  variables:
    domain-member-disable-machine-account-password-changes-variable:
      title: 'Domain member: Disable machine account password changes'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: disable_machine_account_password_changes_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-domain-member-disable-machine-account-password-changes-set-disabled:
      test_title: '''Domain member: Disable machine account password changes'' is set to ''Disabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: domain-member-disable-machine-account-password-changes-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-domain-member-disable-machine-account-password-changes-set-disabled
