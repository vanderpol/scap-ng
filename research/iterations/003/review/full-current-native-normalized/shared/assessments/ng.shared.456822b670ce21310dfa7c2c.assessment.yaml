  assessment_title: The centralized process core dump data directory must be group-owned by root, bin, or sys.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Check the defined directory for process core dumps. # coreadm | grep "global core file pattern" Check the group
    ownership of the directory. # ls -lLd [core file directory] If the directory is not group-owned by root, bin, or sys,
    this is a finding.'
