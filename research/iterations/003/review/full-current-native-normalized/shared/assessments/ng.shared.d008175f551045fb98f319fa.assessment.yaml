assessment:
  id: ng.shared.d008175f551045fb98f319fa
  version: 1
  assessment_title: Display of Last User Name
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: Software\Microsoft\Windows\CurrentVersion\Policies\System
        name:
          operation: equals
          datatype: string
          value: DontDisplayLastUserName
      object_title: null
  variables:
    interactive-logon-do-not-display-last-user-name-variable:
      title: 'Interactive logon: Do not display last user name'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: do_not_display_last_user_name_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: interactive-logon-do-not-display-last-user-name-variable
          operation: equals
          datatype: int
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-interactive-logon-do-not-display-last-user-name-set-enabled:
      test_title: '''Interactive logon: Do not display last user name'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-interactive-logon-do-not-display-last-user-name-set-enabled
