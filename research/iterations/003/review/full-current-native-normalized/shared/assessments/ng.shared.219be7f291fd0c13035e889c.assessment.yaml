assessment:
  id: ng.shared.219be7f291fd0c13035e889c
  version: 1
  assessment_title: Ubuntu 20.04 LTS must restrict privilege elevation to authorized personnel.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    check-if-etc-sudoers-has-line-that-includes-all-all-collection:
      collection_title: check if /etc/sudoers has line that includes ALL  ALL=(ALL) ALL and ALL ALL=(ALL:ALL) ALL
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/sudoers
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^([^#\n]+)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      filters:
      - action: include
        match:
          field: subexpression
          value: ^\s*ALL\s+ALL=\(ALL(?:\:ALL){0,1}\)\s+ALL\s*
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: Filter out all but - Include ALL  ALL=(ALL) ALL and ALL ALL=(ALL:ALL) ALL
        capability: independent.textfilecontent54
      behaviors:
        ignore_case: 'false'
        multiline: 'true'
        singleline: 'false'
    check-if-file-in-etc-sudoers-d-that-include-all-collection:
      collection_title: check if file in /etc/sudoers.d that Include ALL  ALL=(ALL) ALL and ALL ALL=(ALL:ALL) ALL
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/sudoers.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^([^#\n]+)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      filters:
      - action: include
        match:
          field: subexpression
          value: ^\s*ALL\s+ALL=\(ALL(?:\:ALL){0,1}\)\s+ALL\s*
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: Filter out all but - Include ALL  ALL=(ALL) ALL and ALL ALL=(ALL:ALL) ALL
        capability: independent.textfilecontent54
      behaviors:
        ignore_case: 'false'
        multiline: 'true'
        singleline: 'false'
  tests:
    test-etc-sudoers-not-contain-all-all-all-all-or-all:
      test_title: '/etc/sudoers must not contain: ALL     ALL=(ALL) ALL ,  or: ALL     ALL=(ALL:ALL) ALL'
      capability: independent.textfilecontent54
      collection: check-if-etc-sudoers-has-line-that-includes-all-all-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
    test-etc-sudoers-d-not-contain-file-all-all-all-all:
      test_title: '/etc/sudoers.d must not contain a file with: ALL     ALL=(ALL) ALL  or: ALL     ALL=(ALL:ALL) ALL'
      capability: independent.textfilecontent54
      collection: check-if-file-in-etc-sudoers-d-that-include-all-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
  evaluate:
    all:
    - test: test-etc-sudoers-not-contain-all-all-all-all-or-all
    - test: test-etc-sudoers-d-not-contain-file-all-all-all-all
