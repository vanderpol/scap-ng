assessment:
  id: ng.shared.ddd56c0636c67e27cb1ef2ac
  version: 1
  assessment_title: The operating system must use cryptographic mechanisms to protect and restrict access to information on
    portable digital media.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This check applies to the global zone only. Determine the zone that you are currently securing. # zonename If
    the command output is "global", this check applies. Determine the logical node of all attached removable media: # rmformat
    This command lists all attached removable devices. Note the device logical node name. For example: /dev/rdsk/c8t0d0p0
    Determine which zpool is mapped to the device: # zpool status Determine the file system names of the portable digital
    media: # zfs list | grep [poolname] Using the file system name, determine if the removal media is encrypted: # zfs get
    encryption [filesystem] If "encryption off" is listed, this is a finding.'
  inputs: {}
  evidence: []
