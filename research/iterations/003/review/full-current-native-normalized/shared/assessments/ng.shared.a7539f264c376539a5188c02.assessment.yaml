assessment:
  id: ng.shared.a7539f264c376539a5188c02
  version: 1
  assessment_title: CISC-ND-000090 - The Cisco router must be configured to automatically audit account creation.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    iosxe-line-object:
      capability: iosxe.line
      select:
        show_subcommand:
          operation: equals
          datatype: string
          mask: false
          value: show running-config
      object_title: null
  states:
    state-iosxe-line:
      state_title: null
      capability: iosxe.line
      state:
        field: config_line
        value: \narchive\n log config\n(  \S+[^\n]*\n)*  logging enable\n
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-check-archive-log-config-logging-enable:
      test_title: Check for archive - log config - logging enable
      capability: iosxe.line
      object: iosxe-line-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-iosxe-line
  evaluate:
    test: test-check-archive-log-config-logging-enable
