assessment:
  id: ng.shared.89fa23c5271a657ca9911080
  version: 1
  assessment_title: The SUSE operating system must implement kptr-restrict to prevent the leaking of internal kernel addresses.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the SUSE operating system prevents leaking of internal kernel addresses. Check that the SUSE operating
    system prevents leaking of internal kernel addresses by running the following command: > sudo sysctl kernel.kptr_restrict
    kernel.kptr_restrict = 1 If the kernel parameter "kptr_restrict" is not equal to "1" or nothing is returned, this is a
    finding.'
  inputs: []
  evidence: []
