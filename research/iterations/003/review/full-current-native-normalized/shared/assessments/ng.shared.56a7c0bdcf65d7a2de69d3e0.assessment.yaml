assessment:
  id: ng.shared.56a7c0bdcf65d7a2de69d3e0
  version: 1
  assessment_title: The Cisco router must be configured to require that when a password is changed, the characters are changed
    in at least eight of the positions within the password.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    iosxe-line-collection:
      collection_title: null
      capability: iosxe.line
      select:
        show_subcommand:
          operation: equals
          datatype: string
          mask: false
          value: show running-config
  tests:
    test-verify-that-aaa-common-criteria-policy-enabled:
      test_title: Verify that aaa common-criteria policy is enabled.
      capability: iosxe.line
      collection: iosxe-line-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: Check for aaa common-criteria policy
        state_capability: iosxe.line
        state:
          all:
          - field: show_subcommand
            value: show running-config
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: config_line
            value: \naaa common-criteria policy.+
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-check-password-policy-char-changes-8:
      test_title: Check for password policy char-changes 8
      capability: iosxe.line
      collection: iosxe-line-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: Check common criteria char-changes
        state_capability: iosxe.line
        state:
          all:
          - field: show_subcommand
            value: show running-config
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: config_line
            value: \n char-changes (8|9|10|11|12|13|14)
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-verify-that-aaa-common-criteria-policy-enabled
    - test: test-check-password-policy-char-changes-8
