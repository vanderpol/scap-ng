assessment:
  id: ng.shared.845e19a4816deab51297c567
  version: 1
  assessment_title: The system must prevent local applications from generating source-routed packets.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Determine the OS version you are currently securing. # uname –v Solaris 11, 11.1, 11.2, and 11.3 use IP Filter.
    To continue checking IP Filter, the IP Filter Management profile is required. Check the system for an IPF rule blocking
    outgoing source-routed packets. # ipfstat -o Examine the list for rules such as: block out log quick from any to any with
    opt lsrr block out log quick from any to any with opt ssrr If the listed rules do not block both lsrr and ssrr options,
    this is a finding. For Solaris 11.3 or newer that use Packet Filter, the Network Firewall Management rights profile is
    required. Ensure that IP Options are not in use: # pfctl -s rules | grep allow-opts If any output is returned, this is
    a finding.'
  inputs: []
  evidence: []
