assessment:
  id: ng.shared.f6fb78736ab4009bac9ff8d0
  version: 1
  assessment_title: Windows Server 2019 default permissions for the HKEY_LOCAL_MACHINE registry hive must be maintained.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    gather-permissions-hkey-local-machine-security-registry-collection:
      collection_title: Gather permissions for the HKEY_LOCAL_MACHINE\SECURITY registry
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: '([Microsoft.Win32.Registry]::LocalMachine.OpenSubKey("Security", [System.Security.AccessControl.RegistryRights]::ReadPermissions)).GetAccessControl().Access
            |  Where-Object { $_.RegistryRights -notmatch ''\d+'' } | ForEach-Object { "Identity:$($_.IdentityReference),
            Rights: $($_.RegistryRights), Access: $($_.AccessControlType), IsInherited: $($_.IsInherited), InheritanceFlags:
            $($_.InheritanceFlags), PropagationFlags: $($_.PropagationFlags)" }'
    gather-permissions-hkey-local-machine-software-registry-collection:
      collection_title: Gather permissions for the HKEY_LOCAL_MACHINE\SOFTWARE registry
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: '([Microsoft.Win32.Registry]::LocalMachine.OpenSubKey("Software", [System.Security.AccessControl.RegistryRights]::ReadPermissions)).GetAccessControl().Access
            | Where-Object { $_.RegistryRights -notmatch ''\d+'' } | ForEach-Object { "Identity:$($_.IdentityReference), Rights:
            $($_.RegistryRights), Access: $($_.AccessControlType), IsInherited: $($_.IsInherited), InheritanceFlags: $($_.InheritanceFlags),
            PropagationFlags: $($_.PropagationFlags)" }'
    windows-wmi57-collection:
      collection_title: null
      capability: windows.wmi57
      select:
        namespace:
          operation: equals
          datatype: string
          mask: false
          value: root\cimv2
        wql:
          operation: equals
          datatype: string
          mask: false
          value: SELECT DomainRole FROM win32_computersystem
    gather-permissions-hkey-local-machine-software-registry-collection-2:
      collection_title: Gather permissions for the HKEY_LOCAL_MACHINE\SOFTWARE registry
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: '([Microsoft.Win32.Registry]::LocalMachine.OpenSubKey("System", [System.Security.AccessControl.RegistryRights]::ReadPermissions)).GetAccessControl().Access
            | Where-Object { $_.RegistryRights -notmatch ''\d+'' } | ForEach-Object { "Identity:$($_.IdentityReference), Rights:
            $($_.RegistryRights), Access: $($_.AccessControlType), IsInherited: $($_.IsInherited), InheritanceFlags: $($_.InheritanceFlags),
            PropagationFlags: $($_.PropagationFlags)" }'
  variables:
    required-permissions-hkey-local-machine-security-variable:
      title: Required Permissions for HKEY_LOCAL_MACHINE\Security
      kind: constant
      datatype: string
      expression:
        literal:
        - '^Identity:NT AUTHORITY\\SYSTEM, Rights: FullControl, Access: Allow, IsInherited: False, InheritanceFlags: (ContainerInherit|None),
          PropagationFlags: None$'
        - '^Identity:BUILTIN\\Administrators, Rights: ReadPermissions, ChangePermissions, Access: Allow, IsInherited: False,
          InheritanceFlags: (ContainerInherit|None), PropagationFlags: None$'
    required-permissions-non-domain-controllers-hkey-local-machine-system-hkey-variable:
      title: Required Permissions for Non-Domain Controllers HKEY_LOCAL_MACHINE\System and for HKEY_LOCAL_MACHINE\Software
        on all servers
      kind: constant
      datatype: string
      expression:
        literal:
        - '^Identity:BUILTIN\\Users, Rights: ReadKey, Access: Allow, IsInherited: False, InheritanceFlags: (ContainerInherit|None),
          PropagationFlags: None$'
        - '^Identity:BUILTIN\\Administrators, Rights: FullControl, Access: Allow, IsInherited: False, InheritanceFlags: (ContainerInherit|None),
          PropagationFlags: None$'
        - '^Identity:NT AUTHORITY\\SYSTEM, Rights: FullControl, Access: Allow, IsInherited: False, InheritanceFlags: (ContainerInherit|None),
          PropagationFlags: None$'
        - '^Identity:CREATOR OWNER, Rights: FullControl, Access: Allow, IsInherited: False, InheritanceFlags: (ContainerInherit|None),
          PropagationFlags: (None|InheritOnly)$'
        - '^Identity:APPLICATION PACKAGE AUTHORITY\\ALL APPLICATION PACKAGES, Rights: ReadKey, Access: Allow, IsInherited:
          False, InheritanceFlags: (ContainerInherit|None), PropagationFlags: None$'
        - '^Identity:S-1-15-3-1024-1065365936-1281604716-3511738428-1654721687-432734479-3232135806-4053264122-3456934681,
          Rights: ReadKey, Access: Allow, IsInherited: False, InheritanceFlags: (ContainerInherit|None), PropagationFlags:
          None$'
    required-permissions-domain-controllers-hkey-local-machine-system-variable:
      title: Required Permissions for Domain Controllers HKEY_LOCAL_MACHINE\System
      kind: constant
      datatype: string
      expression:
        literal:
        - '^Identity:NT AUTHORITY\\Authenticated Users, Rights: ReadKey, Access: Allow, IsInherited: False, InheritanceFlags:
          (ContainerInherit|None), PropagationFlags: None$'
        - '^Identity:BUILTIN\\Administrators, Rights: FullControl, Access: Allow, IsInherited: False, InheritanceFlags: (ContainerInherit|None),
          PropagationFlags: None$'
        - '^Identity:NT AUTHORITY\\SYSTEM, Rights: FullControl, Access: Allow, IsInherited: False, InheritanceFlags: (ContainerInherit|None),
          PropagationFlags: None$'
        - '^Identity:CREATOR OWNER, Rights: FullControl, Access: Allow, IsInherited: False, InheritanceFlags: (ContainerInherit|None),
          PropagationFlags: (None|InheritOnly)$'
        - '^Identity:APPLICATION PACKAGE AUTHORITY\\ALL APPLICATION PACKAGES, Rights: ReadKey, Access: Allow, IsInherited:
          False, InheritanceFlags: (ContainerInherit|None), PropagationFlags: None$'
        - '^Identity:BUILTIN\\Server Operators, Rights: ReadKey, Access: Allow, IsInherited: False, InheritanceFlags: (ContainerInherit|None),
          PropagationFlags: None$'
        - '^Identity:S-1-15-3-1024-1065365936-1281604716-3511738428-1654721687-432734479-3232135806-4053264122-3456934681,
          Rights: ReadKey, Access: Allow, IsInherited: False, InheritanceFlags: (ContainerInherit|None), PropagationFlags:
          None$'
        - ''
  tests:
    test-default-permissions-hkey-local-machine-security-registry-key-maintained:
      test_title: Default permissions for the HKEY_LOCAL_MACHINE\SECURITY registry key must be maintained.
      capability: independent.shellcommand
      collection: gather-permissions-hkey-local-machine-security-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Required Permissions for HKEY_LOCAL_MACHINE\Security
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value:
            variable: required-permissions-hkey-local-machine-security-variable
          operation: pattern match
          datatype: string
          mask: false
          variable_check: at least one
          entity_check: all
          entity_existence: at_least_one_exists
    test-default-non-domain-controller-permissions-hkey-local-machine-software-registry:
      test_title: Default Non-Domain Controller permissions for the HKEY_LOCAL_MACHINE\SOFTWARE registry key must be maintained.
      capability: independent.shellcommand
      collection: gather-permissions-hkey-local-machine-software-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Required Permissions for Non-Domain Controllers HKEY_LOCAL_MACHINE\System and for HKEY_LOCAL_MACHINE\Software
          on all servers
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value:
            variable: required-permissions-non-domain-controllers-hkey-local-machine-system-hkey-variable
          operation: pattern match
          datatype: string
          mask: false
          variable_check: at least one
          entity_check: all
          entity_existence: at_least_one_exists
    test-system-windows-domain-controller:
      test_title: The system is a Windows Domain Controller
      capability: windows.wmi57
      collection: windows-wmi57-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: Backup Domain Controller
          capability: windows.wmi57
          state:
            field: result
            value:
              record:
              - name: domainrole
                value: '4'
                operation: equals
                datatype: string
                mask: false
                entity_check: all
            operation: equals
            datatype: record
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: Primary Domain Controller
          capability: windows.wmi57
          state:
            field: result
            value:
              record:
              - name: domainrole
                value: '5'
                operation: equals
                datatype: string
                mask: false
                entity_check: all
            operation: equals
            datatype: record
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-default-domain-controller-permissions-hkey-local-machine-system-registry-key:
      test_title: Default Domain Controller permissions for the HKEY_LOCAL_MACHINE\SYSTEM registry key must be maintained.
      capability: independent.shellcommand
      collection: gather-permissions-hkey-local-machine-software-registry-collection-2
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Required Permissions for Domain Controllers HKEY_LOCAL_MACHINE\System
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value:
            variable: required-permissions-domain-controllers-hkey-local-machine-system-variable
          operation: pattern match
          datatype: string
          mask: false
          variable_check: at least one
          entity_check: all
          entity_existence: at_least_one_exists
    test-default-non-domain-controller-permissions-hkey-local-machine-system-registry:
      test_title: Default Non-Domain Controller permissions for the HKEY_LOCAL_MACHINE\SYSTEM registry key must be maintained.
      capability: independent.shellcommand
      collection: gather-permissions-hkey-local-machine-software-registry-collection-2
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Required Permissions for Non-Domain Controllers HKEY_LOCAL_MACHINE\System and for HKEY_LOCAL_MACHINE\Software
          on all servers
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value:
            variable: required-permissions-non-domain-controllers-hkey-local-machine-system-hkey-variable
          operation: pattern match
          datatype: string
          mask: false
          variable_check: at least one
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-default-permissions-hkey-local-machine-security-registry-key-maintained
    - test: test-default-non-domain-controller-permissions-hkey-local-machine-software-registry
    - any:
      - all:
        - test: test-system-windows-domain-controller
        - test: test-default-domain-controller-permissions-hkey-local-machine-system-registry-key
      - all:
        - not:
            test: test-system-windows-domain-controller
        - test: test-default-non-domain-controller-permissions-hkey-local-machine-system-registry
