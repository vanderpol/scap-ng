assessment:
  id: ng.shared.6ac101bb0acbe99427016bea
  version: 1
  assessment_title: Maximum Machine Account Password Age
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Services\Netlogon\Parameters
        name:
          operation: equals
          datatype: string
          mask: false
          value: MaximumPasswordAge
  variables:
    maximum-machine-account-password-age-variable:
      title: Maximum Machine Account Password Age
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: maximum_machine_account_password_age_var
        validation:
          alternatives:
          - literal: '7'
            hint: 7_days
          - literal: '30'
            hint: 30_days
  tests:
    test-domain-member-maximum-machine-account-password-age-set-30-days:
      test_title: '''Domain member: Maximum machine account password age'' is set to ''30'' days or less'
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value is less than or equal to variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: maximum-machine-account-password-age-variable
            operation: less than or equal
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
    test-domain-member-maximum-machine-account-password-age-not-set-0:
      test_title: '''Domain member: Maximum machine account password age'' is not set to ''0'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value is greater than 0
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '0'
            operation: greater than
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-domain-member-maximum-machine-account-password-age-set-30-days
    - test: test-domain-member-maximum-machine-account-password-age-not-set-0
