assessment:
  id: ng.shared.3d4d223d6401739ace71dd62
  version: 1
  assessment_title: All run control scripts must have no extended ACLs.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    ls-ld-etc-rc-etc-init-d-collection:
      collection_title: ls -ld /etc/rc* /etc/init.d
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: ls -ld /etc/rc* /etc/init.d
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: \+
  tests:
    test-all-run-control-scripts-have-no-extended-acls:
      test_title: All run control scripts must have no extended ACLs.
      capability: independent.shellcommand
      collection: ls-ld-etc-rc-etc-init-d-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: no files with a + should be reported
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: ''
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: none_exist
  evaluate:
    test: test-all-run-control-scripts-have-no-extended-acls
