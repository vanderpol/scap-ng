assessment:
  id: ng.shared.8acaab4c3e54e1d532a13bfd
  version: 1
  assessment_title: The operating system must employ cryptographic mechanisms to protect information in storage.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Determine if file system encryption is required by the organization. If not required, this item does not apply.
    Determine if file system encryption is enabled for user data sets. This check does not apply to the root, var, share,
    swap, or dump datasets. # zfs list Using the file system name, determine if the file system is encrypted: # zfs get encryption
    [filesystem] If "encryption off" is listed, this is a finding.'
  inputs: {}
  evidence: []
