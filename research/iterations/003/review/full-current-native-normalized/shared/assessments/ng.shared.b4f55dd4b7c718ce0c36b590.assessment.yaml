assessment:
  id: ng.shared.b4f55dd4b7c718ce0c36b590
  version: 1
  assessment_title: UBTU-22-255015 - Ubuntu 22.04 LTS must use SSH to protect the confidentiality and integrity of transmitted
    information.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-systemdunitproperty-object:
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          value: ssh.service
        property:
          operation: equals
          datatype: string
          value: ActiveState
      object_title: null
    linux-systemdunitproperty-object-2:
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          value: ssh.service
        property:
          operation: equals
          datatype: string
          value: UnitFileState
      object_title: null
  states:
    state-linux-systemdunitproperty:
      state_title: null
      capability: linux.systemdunitproperty
      state:
        field: value
        value: active
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-linux-systemdunitproperty-2:
      state_title: null
      capability: linux.systemdunitproperty
      state:
        field: value
        value: enabled
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-ssh-service-active:
      test_title: ssh.service is active
      capability: linux.systemdunitproperty
      object: linux-systemdunitproperty-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-linux-systemdunitproperty
    test-ssh-service-enabled:
      test_title: ssh.service is enabled
      capability: linux.systemdunitproperty
      object: linux-systemdunitproperty-object-2
      check_existence: at_least_one_exists
      check: all
      states:
      - state-linux-systemdunitproperty-2
  evaluate:
    all:
    - test: test-ssh-service-active
    - test: test-ssh-service-enabled
