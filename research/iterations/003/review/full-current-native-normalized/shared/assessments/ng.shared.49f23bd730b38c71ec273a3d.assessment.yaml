assessment:
  id: ng.shared.49f23bd730b38c71ec273a3d
  version: 1
  assessment_title: WN19-00-000130 - Windows Server 2019 local volumes must use a format that supports NTFS attributes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-wmi57-object:
      capability: windows.wmi.query
      object_title: null
      collect:
        namespace: root\cimv2
        query: SELECT filesystem FROM win32_logicaldisk WHERE drivetype=3 AND filesystem!='NTFS' AND filesystem!='ReFS' AND
          filesystem!='CSVFS'
  states: {}
  tests:
    test-local-volumes-formatted-using-ntfs-refs-or-csvfs:
      test_title: local volumes are formatted using NTFS, ReFS or CSVFS
      capability: windows.wmi.query
      object: windows-wmi57-object
      existence: none
      match: all
  evaluate:
    test: test-local-volumes-formatted-using-ntfs-refs-or-csvfs
