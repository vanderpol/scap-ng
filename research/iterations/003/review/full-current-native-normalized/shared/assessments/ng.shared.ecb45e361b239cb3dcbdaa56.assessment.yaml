assessment:
  id: ng.shared.ecb45e361b239cb3dcbdaa56
  version: 1
  assessment_title: Login services for serial ports must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    svc-system-console-login-terma-object:
      capability: solaris.smf
      select:
        fmri:
          operation: equals
          datatype: string
          mask: false
          value: svc://localhost/system/console-login:terma
      object_title: svc:/system/console-login:terma
    svc-system-console-login-termb-object:
      capability: solaris.smf
      select:
        fmri:
          operation: equals
          datatype: string
          mask: false
          value: svc://localhost/system/console-login:termb
      object_title: svc:/system/console-login:termb
  states:
    state-disabled-state:
      state_title: Disabled state
      capability: solaris.smf
      state:
        field: service_state
        value: DISABLED
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-svc-system-console-login-terma-disabled:
      test_title: svc:/system/console-login:terma is disabled
      capability: solaris.smf
      object: svc-system-console-login-terma-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-disabled-state
    test-svc-system-console-login-termb-disabled:
      test_title: svc:/system/console-login:termb is disabled
      capability: solaris.smf
      object: svc-system-console-login-termb-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-disabled-state
  evaluate:
    all:
    - test: test-svc-system-console-login-terma-disabled
    - test: test-svc-system-console-login-termb-disabled
