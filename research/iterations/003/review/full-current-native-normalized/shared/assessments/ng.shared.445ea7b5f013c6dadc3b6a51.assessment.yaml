assessment:
  id: ng.shared.445ea7b5f013c6dadc3b6a51
  version: 1
  assessment_title: The operating system must shut down by default upon audit failure (unless availability is an overriding
    concern).
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The Audit Configuration profile is required. This check applies to the global zone only. Determine the zone
    that you are currently securing. # zonename If the command output is "global", this check applies. # pfexec auditconfig
    -getpolicy | grep ahlt If the output does not include "ahlt" as an active audit policy, this is a finding. # pfexec auditconfig
    -getpolicy | grep active | grep cnt If the output includes "cnt" as an active audit policy, this is a finding.'
  inputs: {}
  evidence: []
