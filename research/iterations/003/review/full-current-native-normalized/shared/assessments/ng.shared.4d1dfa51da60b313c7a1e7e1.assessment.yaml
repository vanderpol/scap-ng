assessment:
  id: ng.shared.4d1dfa51da60b313c7a1e7e1
  version: 1
  assessment_title: The Windows dialog box title for the legal banner must be configured.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    legalnoticecaption-setting-collection:
      collection_title: LegalNoticeCaption Setting
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        name:
          operation: equals
          datatype: string
          mask: false
          value: LegalNoticeCaption
  tests:
    test-windows-dialog-box-title-legal-banner-configured-title-option-1:
      test_title: The Windows dialog box title for the legal banner must be configured. Title Option 1
      capability: windows.registry
      collection: legalnoticecaption-setting-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: only one
        state_title: Logon Banner - DoD Notice and Consent Banner.
        state_capability: windows.registry
        state:
          field: value
          value: DoD Notice and Consent Banner
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-windows-dialog-box-title-legal-banner-configured-title-option-2:
      test_title: The Windows dialog box title for the legal banner must be configured. Title Option 2
      capability: windows.registry
      collection: legalnoticecaption-setting-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: only one
        state_title: Logon Banner - US Department of Defense Warning Statement.
        state_capability: windows.registry
        state:
          field: value
          value: US Department of Defense Warning Statement
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-windows-dialog-box-title-legal-banner-configured-title-option-3:
      test_title: The Windows dialog box title for the legal banner must be configured. Title Option 3
      capability: windows.registry
      collection: legalnoticecaption-setting-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: only one
        state_title: Logon Banner - DoW Notice and Consent Banner.
        state_capability: windows.registry
        state:
          field: value
          value: DoW Notice and Consent Banner
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-windows-dialog-box-title-legal-banner-configured-title-option-4:
      test_title: The Windows dialog box title for the legal banner must be configured. Title Option 4
      capability: windows.registry
      collection: legalnoticecaption-setting-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: only one
        state_title: Logon Banner - US Department of War Warning Statement.
        state_capability: windows.registry
        state:
          field: value
          value: US Department of War Warning Statement
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    any:
    - test: test-windows-dialog-box-title-legal-banner-configured-title-option-1
    - test: test-windows-dialog-box-title-legal-banner-configured-title-option-2
    - test: test-windows-dialog-box-title-legal-banner-configured-title-option-3
    - test: test-windows-dialog-box-title-legal-banner-configured-title-option-4
