assessment:
  id: ng.shared.9dfdfc3ecffaaa5b7ae074a7
  version: 1
  assessment_title: Successful/unsuccessful uses of the sudo command in RHEL 8 must generate an audit record.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that an audit event is generated for any successful/unsuccessful use of the "sudo" command by performing
    the following command to check the file system rules in "/etc/audit/audit.rules": $ sudo grep -w sudo /etc/audit/audit.rules
    -a always,exit -F path=/usr/bin/sudo -F perm=x -F auid>=1000 -F auid!=unset -k priv_cmd If the command does not return
    a line, or the line is commented out, this is a finding.'
  inputs: []
  evidence: []
