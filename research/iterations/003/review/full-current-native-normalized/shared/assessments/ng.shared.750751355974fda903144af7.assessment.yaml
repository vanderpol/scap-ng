assessment:
  id: ng.shared.750751355974fda903144af7
  version: 1
  assessment_title: UBTU-22-232135 - Ubuntu 22.04 LTS must configure the "/var/log/syslog" file to be group-owned by "adm".
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    unix-file-collection:
      collection_title: null
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /var/log/syslog
    etc-group-adm-collection:
      collection_title: /etc/group for adm
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/group
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: '^adm:[^:]*:([0-9]+):'
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
  variables:
    gid-adm-variable:
      title: GID for adm
      kind: local
      datatype: int
      expression:
        values:
          collection: etc-group-adm-collection
          field: subexpression
  tests:
    test-var-log-syslog-file-group-owned-by-adm:
      test_title: /var/log/syslog file is group-owned by adm
      capability: unix.file
      collection: unix-file-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Group-owned by adm
        state_capability: unix.file
        state:
          field: group_id
          value:
            variable: gid-adm-variable
          operation: equals
          datatype: int
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-var-log-syslog-file-group-owned-by-adm
