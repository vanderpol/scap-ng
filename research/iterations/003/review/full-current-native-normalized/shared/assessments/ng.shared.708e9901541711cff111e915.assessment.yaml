assessment:
  id: ng.shared.708e9901541711cff111e915
  version: 1
  assessment_title: Display Shutdown Button
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        name:
          operation: equals
          datatype: string
          mask: false
          value: ShutdownWithoutLogon
  variables:
    shutdown-allow-system-shut-down-without-having-log-on-variable:
      title: 'Shutdown: Allow System to be Shut Down Without Having to Log On'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: shutdown_allow_system_shutdown_without_having_logon_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-shutdown-allow-system-shutdown-without-having-log-on-set-disabled:
      test_title: '''Shutdown: Allow system to be shutdown without having to log on'' is set to ''Disabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: shutdown-allow-system-shut-down-without-having-log-on-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-shutdown-allow-system-shutdown-without-having-log-on-set-disabled
