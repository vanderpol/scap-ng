assessment:
  id: ng.shared.8884ffb41158e3dea6847452
  version: 1
  assessment_title: The macOS system must configure audit_control to not contain access control lists.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured without ACLs applied to audit_control with the following command: /bin/ls
    -le /etc/security/audit_control | /usr/bin/awk ''{print $1}'' | /usr/bin/grep -c ":" If the result is not "0", this is
    a finding.'
  inputs: []
  evidence: []
