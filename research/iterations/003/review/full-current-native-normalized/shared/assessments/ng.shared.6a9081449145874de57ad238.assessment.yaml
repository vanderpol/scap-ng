  version: 1
  assessment_title: OL 8 must ensure the password complexity module is enabled in the password-auth file.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system uses "pwquality" to enforce the password complexity rules. Check for the use of
    "pwquality" in the password-auth file with the following command: $ sudo cat /etc/pam.d/password-auth | grep pam_pwquality
    password requisite pam_pwquality.so If the command does not return a line containing the value "pam_pwquality.so" as shown,
    or the line is commented out, this is a finding.'
  inputs: {}
  evidence: []
