assessment:
  id: ng.shared.6068f3a0ba868d1de3a70e55
  version: 1
  assessment_title: WINCC-000018
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Microsoft\Windows\CurrentVersion\Policies\Servicing
        name:
          operation: equals
          datatype: string
          mask: false
          value: UseWindowsUpdate
  tests:
    test-specify-settings-optional-component-installation-component-repair-set-enabled-never:
      test_title: '''Specify settings for optional component installation and component repair'' is set to ''Enabled'' with
        ''Never attempt to download payload from Windows Update'' selected'
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals 2
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '2'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-specify-settings-optional-component-installation-component-repair-set-enabled-never
