assessment:
  id: ng.shared.a07cb2c7ca7540482c8d75e9
  version: 1
  assessment_title: Require authentication upon booting into single-user and maintenance modes.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    check-in-usr-lib-systemd-system-rescue-service-options-assinged-collection:
      collection_title: check in /usr/lib/systemd/system/rescue.service for the options assinged to ExecStart
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /usr/lib/systemd/system
        filename:
          operation: equals
          datatype: string
          mask: false
          value: rescue.service
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*ExecStart=([^\n#]+)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-check-in-usr-lib-systemd-system-rescue-service-option-usr:
      test_title: check in /usr/lib/systemd/system/rescue.service for the option /usr/sbin/sulogin assinged to ExecStart
      capability: independent.textfilecontent54
      collection: check-in-usr-lib-systemd-system-rescue-service-options-assinged-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: the options assigned to ExecStart includes /usr/sbin/sulogin
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: '[''"; ]*\/usr\/sbin\/sulogin[''"; ]*'
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-check-in-usr-lib-systemd-system-rescue-service-option-usr
