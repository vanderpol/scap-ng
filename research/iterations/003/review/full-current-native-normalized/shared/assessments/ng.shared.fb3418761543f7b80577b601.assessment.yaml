assessment:
  id: ng.shared.fb3418761543f7b80577b601
  version: 1
  assessment_title: The Oracle Linux operating system must audit all uses of the unlink, unlinkat, rename, renameat, and rmdir
    syscalls.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system generates audit records upon successful/unsuccessful attempts to use the "unlink",
    "unlinkat", "rename", "renameat", and "rmdir" syscalls. Check the file system rules in "/etc/audit/audit.rules" with the
    following commands: # grep ''unlink\|rename\|rmdir'' /etc/audit/audit.rules -a always,exit -F arch=b32 -S unlink,unlinkat,rename,renameat,rmdir
    -F auid>=1000 -F auid!=unset -k delete -a always,exit -F arch=b64 -S unlink,unlinkat,rename,renameat,rmdir -F auid>=1000
    -F auid!=unset -k delete If both the "b32" and "b64" audit rules are not defined for the "unlink", "unlinkat", "rename",
    "renameat", and "rmdir" syscalls, this is a finding.'
  inputs: []
  evidence: []
