        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Active Setup\Installed Components
        trustee_sid:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
