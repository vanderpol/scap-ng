      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Active Setup\Installed Components
        name:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
    hkey-local-machine-software-microsoft-active-setup-installed-components-rights-collection:
      collection_title: HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Active Setup\Installed Components rights
