assessment:
  id: ng.shared.b1091c96ee5915f386a34070
  version: 1
  assessment_title: The macOS system must configure audit log files to be owned by root.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured with audit log files owned by root with the following command: /bin/ls
    -n $(/usr/bin/grep ''^dir'' /etc/security/audit_control | /usr/bin/awk -F: ''{print $2}'') | /usr/bin/awk ''{s+=$3} END
    {print s}'' If the result is not "0", this is a finding.'
  inputs: {}
  evidence: []
