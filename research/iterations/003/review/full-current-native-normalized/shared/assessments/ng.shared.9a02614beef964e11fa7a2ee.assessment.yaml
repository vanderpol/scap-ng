assessment:
  id: ng.shared.9a02614beef964e11fa7a2ee
  version: 1
  assessment_title: The macOS system must disable the System Settings pane for Wallet and Apple Pay.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable the System Settings pane for Wallet and Apple Pay with the
    following command: /usr/bin/profiles show -output stdout-xml | /usr/bin/xmllint --xpath ''//key[text()="DisabledSystemSettings"]/following-sibling::*[1]''
    - | /usr/bin/grep -c "com.apple.WalletSettingsExtension" If the result is not "1", this is a finding.'
  inputs: {}
  evidence: []
