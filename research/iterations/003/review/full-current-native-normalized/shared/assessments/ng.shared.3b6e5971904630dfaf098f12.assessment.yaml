assessment:
  id: ng.shared.3b6e5971904630dfaf098f12
  version: 1
  assessment_title: The impact of CPCON changes on the cross-directory authentication configuration must be considered and
    procedures documented.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    run-powershell-command-get-adtrust-manual-review-required-collection:
      collection_title: Run Powershell command Get-ADTrust. (Manual Review Required)
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: Get-ADTrust -Filter *
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: \w
  tests:
    test-unknown-test-results-auditor-review-results-gathered-stig-requirements:
      test_title: Unknown Test Results - An auditor must review results gathered and STIG requirements.
      capability: independent.unknown
      result: unknown
    test-run-powershell-command-get-adtrust-manual-review-required:
      test_title: Run PowerShell command Get-ADTrust. (Manual Review Required)
      capability: independent.shellcommand
      collection: run-powershell-command-get-adtrust-manual-review-required-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state: null
  evaluate:
    all:
    - test: test-unknown-test-results-auditor-review-results-gathered-stig-requirements
    - test: test-run-powershell-command-get-adtrust-manual-review-required
