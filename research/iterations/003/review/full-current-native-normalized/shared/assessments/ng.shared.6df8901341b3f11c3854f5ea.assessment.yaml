assessment:
  id: ng.shared.6df8901341b3f11c3854f5ea
  version: 1
  assessment_title: The macOS system must be configured to prevent displaying password hints.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    system-settings-password-hints-disable-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.loginwindow'')\

            .objectForKey(''RetriesUntilHint'').js

            EOS'
      object_title: system_settings_password_hints_disable_recommended_object
  states:
    state-system-settings-password-hints-disable-recommended-state:
      state_title: system_settings_password_hints_disable_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: '0'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-settings-password-hints-disable-recommended-test:
      test_title: system_settings_password_hints_disable_recommended_test
      capability: independent.shellcommand
      object: system-settings-password-hints-disable-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-system-settings-password-hints-disable-recommended-state
  evaluate:
    test: test-system-settings-password-hints-disable-recommended-test
