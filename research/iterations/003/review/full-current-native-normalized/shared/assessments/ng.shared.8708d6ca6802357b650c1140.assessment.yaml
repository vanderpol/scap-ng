assessment:
  id: ng.shared.8708d6ca6802357b650c1140
  version: 1
  assessment_title: The macOS system must require a minimum password length of 14 characters.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    pwpolicy-minimum-length-enforce-stig-object-collection:
      collection_title: pwpolicy_minimum_length_enforce_stig_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/bin/pwpolicy -getaccountpolicies | /usr/bin/tail +2 | /usr/bin/xmllint --xpath 'boolean(//*[contains(text(),"policyAttributePassword
            matches '\''.{14,}'\''")])' -
  tests:
    test-pwpolicy-minimum-length-enforce-stig-test:
      test_title: pwpolicy_minimum_length_enforce_stig_test
      capability: independent.shellcommand
      collection: pwpolicy-minimum-length-enforce-stig-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: pwpolicy_minimum_length_enforce_stig_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: 'true'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-pwpolicy-minimum-length-enforce-stig-test
