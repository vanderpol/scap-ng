assessment:
  id: ng.shared.9d88fcacc0673f540b1e5df5
  version: 1
  assessment_title: SLES-12-010810 - SUSE operating system file systems that are being imported via Network File System (NFS)
    must be mounted to prevent files with the setuid and setgid bit set from being executed.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/fstab
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*\[?[\.\w:-]+\]?:[/\w-]+\s+[/\w-]+\s+nfs[4]?\s+(.*)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-textfilecontent54-collection-2:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/mtab
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*\[?[\.\w:-]+\]?:[/\w-]+\s+[/\w-]+\s+nfs[4]?\s+(.*)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-all-nfs-entries-in-etc-fstab-have-nosuid:
      test_title: all nfs entries in /etc/fstab have nosuid
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^.*nosuid.*$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-all-nfs-entries-in-etc-mtab-have-nosuid:
      test_title: all nfs entries in /etc/mtab have nosuid
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection-2
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^.*nosuid.*$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-all-nfs-entries-in-etc-fstab-have-nosuid
    - test: test-all-nfs-entries-in-etc-mtab-have-nosuid
