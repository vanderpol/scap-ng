assessment:
  id: ng.shared.3bb59761465f111365261742
  version: 1
  assessment_title: OL07-00-020101 - The Oracle Linux operating system must be configured so that the Datagram Congestion
    Control Protocol (DCCP) kernel module is disabled unless required.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/modprobe.d
        filename:
          operation: pattern match
          datatype: string
          value: .*
        pattern:
          operation: pattern match
          datatype: string
          value: ^[ \t]*install[ \t]+dccp[ \t]+/bin/false[ \t]*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
    independent-textfilecontent54-object-2:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/modprobe.d
        filename:
          operation: pattern match
          datatype: string
          value: .*
        pattern:
          operation: pattern match
          datatype: string
          value: ^[ \t]*blacklist[ \t]+dccp[ \t]*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states: {}
  tests:
    test-etc-modprobe-d-contains-file-that-contains-install-dccp-bin:
      test_title: /etc/modprobe.d contains a file that contains 'install dccp /bin/false'
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
    test-etc-modprobe-d-contains-file-that-contains-blacklist-dccp:
      test_title: /etc/modprobe.d contains a file that contains 'blacklist dccp'
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-2
      check_existence: at_least_one_exists
      check: all
  evaluate:
    all:
    - test: test-etc-modprobe-d-contains-file-that-contains-install-dccp-bin
    - test: test-etc-modprobe-d-contains-file-that-contains-blacklist-dccp
