assessment:
  id: ng.shared.e564bac7866d98ac31269b69
  version: 1
  assessment_title: All run control scripts must have no extended ACLs.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    ls-ld-etc-rc-etc-init-d-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: ls -ld /etc/rc* /etc/init.d
        pattern:
          operation: pattern match
          datatype: string
          value: \+
      object_title: ls -ld /etc/rc* /etc/init.d
  states:
    state-no-files-with-a-should-be-reported:
      state_title: no files with a + should be reported
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: ''
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: none_exist
  tests:
    test-all-run-control-scripts-have-no-extended-acls:
      test_title: All run control scripts must have no extended ACLs.
      capability: independent.shellcommand
      object: ls-ld-etc-rc-etc-init-d-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-no-files-with-a-should-be-reported
  evaluate:
    test: test-all-run-control-scripts-have-no-extended-acls
