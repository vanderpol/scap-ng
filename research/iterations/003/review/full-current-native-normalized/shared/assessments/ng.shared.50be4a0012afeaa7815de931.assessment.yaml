assessment:
  id: ng.shared.50be4a0012afeaa7815de931
  version: 1
  assessment_title: The system must require users to re-authenticate to unlock a graphical desktop environment.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the system is not running XWindows, this check does not apply. Determine if the screen saver timeout is configured
    properly. # grep "^\*timeout:" /usr/share/X11/app-defaults/XScreenSaver If the output is not: *timeout: 0:15:00 or a shorter
    time interval, this is a finding. # grep "^\*lockTimeout:" /usr/share/X11/app-defaults/XScreenSaver If the output is not:
    *lockTimeout: 0:00:05 or a shorter time interval, this is a finding. # grep "^\*lock:" /usr/share/X11/app-defaults/XScreenSaver
    If the output is not: *lock: True this is a finding. For each existing user, check the configuring of their personal .xscreensaver
    file. # grep "^timeout:" $HOME/.xscreensaver If the output is not: timeout: 0:15:00 or a shorter time interval, this is
    a finding. # grep "^lockTimeout:" $HOME/.xscreensaver If the output is not: lockTimeout: 0:00:05 or a shorter time interval,
    this is a finding. # grep "^lock:" $HOME/.xscreensaver If the output is not: lock: True this is a finding.'
  inputs: {}
  evidence: []
