assessment:
  id: ng.shared.41517839315567ab49c6d10c
  version: 1
  assessment_title: The system must set strict multihoming.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    ipadm-show-prop-p-strict-dst-multihoming-co-current-ipv4-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: ipadm show-prop -p _strict_dst_multihoming -co current ipv4
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
      object_title: ipadm show-prop -p _strict_dst_multihoming -co current ipv4
    ipadm-show-prop-p-send-redirects-co-current-ipv6-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: ipadm show-prop -p _strict_dst_multihoming -co current ipv6
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
      object_title: ipadm show-prop -p send_redirects -co current ipv6
  states:
    state-check-that-line-returns-1-with-an-exit-status-of-0:
      state_title: Check that line returns '1' with an exit status of 0
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: '1'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-system-set-strict-multihoming:
      test_title: The system must set strict multihoming.
      capability: independent.shellcommand
      object: ipadm-show-prop-p-strict-dst-multihoming-co-current-ipv4-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-check-that-line-returns-1-with-an-exit-status-of-0
    test-system-set-strict-multihoming-2:
      test_title: The system must set strict multihoming.
      capability: independent.shellcommand
      object: ipadm-show-prop-p-send-redirects-co-current-ipv6-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-check-that-line-returns-1-with-an-exit-status-of-0
  evaluate:
    all:
    - test: test-system-set-strict-multihoming
    - test: test-system-set-strict-multihoming-2
