assessment:
  id: ng.shared.153d8327925da9b64dcb5f35
  version: 1
  assessment_title: The Cisco router must be configured to authenticate Network Time Protocol (NTP) sources using authentication
    that is cryptographically based.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    iosxe-line-collection:
      collection_title: null
      capability: iosxe.line
      select:
        show_subcommand:
          operation: equals
          datatype: string
          mask: false
          value: show running-config
  tests:
    test-check-ntp-authentication-key:
      test_title: Check for ntp authentication-key
      capability: iosxe.line
      collection: iosxe-line-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: Check for ntp authentication-key 1 hmac-sha2-256
        state_capability: iosxe.line
        state:
          all:
          - field: show_subcommand
            value: show running-config
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: config_line
            value: \nntp authentication-key 1 hmac-sha2-256 .+
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-check-ntp-authenticate:
      test_title: Check for ntp authenticate
      capability: iosxe.line
      collection: iosxe-line-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: Check for ntp authenticate
        state_capability: iosxe.line
        state:
          all:
          - field: show_subcommand
            value: show running-config
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: config_line
            value: \nntp authenticate
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-check-ntp-trusted-key:
      test_title: Check for ntp trusted-key
      capability: iosxe.line
      collection: iosxe-line-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: Check for ntp trusted-key
        state_capability: iosxe.line
        state:
          all:
          - field: show_subcommand
            value: show running-config
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: config_line
            value: '\nntp trusted-key '
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-check-ntp-server-x-x-x-x-key:
      test_title: Check for ntp server x.x.x.x key
      capability: iosxe.line
      collection: iosxe-line-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: Check for ntp server x.x.x.x key
        state_capability: iosxe.line
        state:
          all:
          - field: show_subcommand
            value: show running-config
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: config_line
            value: '\nntp server .+ key '
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-check-ntp-authentication-key
    - test: test-check-ntp-authenticate
    - test: test-check-ntp-trusted-key
    - test: test-check-ntp-server-x-x-x-x-key
