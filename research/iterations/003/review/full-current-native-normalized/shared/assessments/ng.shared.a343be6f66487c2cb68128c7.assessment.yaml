assessment:
  id: ng.shared.a343be6f66487c2cb68128c7
  version: 1
  assessment_title: Secure Print Driver Installation
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Control\Print\Providers\LanMan Print Services\Servers
        name:
          operation: equals
          datatype: string
          mask: false
          value: AddPrinterDrivers
  tests:
    test-devices-prevent-users-from-installing-printer-drivers-set-enabled:
      test_title: '''Devices: Prevent users from installing printer drivers'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals 1
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-devices-prevent-users-from-installing-printer-drivers-set-enabled
