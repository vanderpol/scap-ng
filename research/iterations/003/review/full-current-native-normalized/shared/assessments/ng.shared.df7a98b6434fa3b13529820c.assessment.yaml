assessment:
  id: ng.shared.df7a98b6434fa3b13529820c
  version: 1
  assessment_title: Disable X11 Forwarding
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-rpminfo-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: openssh-server
      object_title: null
    ssh-x11forwarding-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[\s]*X11Forwarding[ \t]+([^\s#]*)[ \t]*(?:|(?:#.*))?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
        multiline: 'true'
      object_title: SSH X11Forwarding
  states:
    state-x11forwarding-no:
      state_title: X11Forwarding = no
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^(no|"no")$
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-package-openssh-server-removed:
      test_title: package openssh-server is removed
      capability: linux.rpminfo
      object: linux-rpminfo-object
      check_existence: none_exist
      check: all
    test-tests-value-x11forwarding-setting-in-etc-ssh-sshd-config-file:
      test_title: tests the value of X11Forwarding setting in the /etc/ssh/sshd_config file
      capability: independent.textfilecontent54
      object: ssh-x11forwarding-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-x11forwarding-no
  evaluate:
    any:
    - test: test-package-openssh-server-removed
    - test: test-tests-value-x11forwarding-setting-in-etc-ssh-sshd-config-file
