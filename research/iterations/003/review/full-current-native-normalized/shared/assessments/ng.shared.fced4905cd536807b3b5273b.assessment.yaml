assessment:
  id: ng.shared.fced4905cd536807b3b5273b
  version: 1
  assessment_title: OL08-00-010680 - For OL 8 systems using Domain Name Servers (DNS) resolution, at least two name servers
    must be configured.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    etc-nsswitch-conf-hosts-entry-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/nsswitch.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*hosts:\s*(.*)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: /etc/nsswitch.conf hosts entry
    etc-resolv-conf-nameserver-entries-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/resolv.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^nameserver\s+(.*)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: /etc/resolv.conf nameserver entries
    count-unique-name-servers-object:
      capability: independent.variable
      select:
        var_ref:
          operation: equals
          datatype: string
          mask: false
          value:
            variable: count-unique-name-servers-variable
      object_title: count of unique name servers
  variables:
    count-unique-name-servers-variable:
      title: count of unique name servers
      kind: local
      datatype: int
      expression:
        count:
          unique:
            values:
              object: etc-resolv-conf-nameserver-entries-object
              field: subexpression
  states:
    state-hosts-entry-contains-dns:
      state_title: hosts entry contains dns
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: (^|\s)dns(\s|$)
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-etc-resolv-conf-is-configured-with-at-least-two-name-ser:
      state_title: /etc/resolv.conf is configured with at least two name servers
      capability: independent.variable
      state:
        field: value
        value: '2'
        operation: greater than or equal
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-using-dns:
      test_title: The system is using DNS
      capability: independent.textfilecontent54
      object: etc-nsswitch-conf-hosts-entry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-hosts-entry-contains-dns
    test-etc-resolv-conf-contains-at-least-one-nameserver-entry:
      test_title: /etc/resolv.conf contains at least one nameserver entry
      capability: independent.textfilecontent54
      object: etc-resolv-conf-nameserver-entries-object
      check_existence: at_least_one_exists
      check: all
    test-etc-resolv-conf-configured-at-least-two-name-servers:
      test_title: /etc/resolv.conf is configured with at least two name servers
      capability: independent.variable
      object: count-unique-name-servers-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-etc-resolv-conf-is-configured-with-at-least-two-name-ser
  evaluate:
    any:
    - not:
        test: test-system-using-dns
    - all:
      - test: test-system-using-dns
      - test: test-etc-resolv-conf-contains-at-least-one-nameserver-entry
      - test: test-etc-resolv-conf-configured-at-least-two-name-servers
