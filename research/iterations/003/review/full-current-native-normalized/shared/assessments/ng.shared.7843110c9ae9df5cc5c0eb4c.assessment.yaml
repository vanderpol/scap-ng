  assessment_title: The network selection user interface (UI) must not be displayed on the logon screen.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the registry value below. If it does not exist or is not configured as specified, this is a finding.
    Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows\System\ Value Name: DontDisplayNetworkSelectionUI
    Value Type: REG_DWORD Value: 0x00000001 (1)'
