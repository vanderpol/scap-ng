assessment:
  id: ng.shared.c834559f0358e2033a7d498e
  version: 1
  assessment_title: Remote Assistance - Solicit Remote Assistance
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services
        name:
          operation: equals
          datatype: string
          value: fAllowToGetHelp
      object_title: null
  variables:
    solicited-remote-assistance-variable:
      title: Solicited Remote Assistance
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: solicited_remote_assistance_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: solicited-remote-assistance-variable
          operation: equals
          datatype: int
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-configure-solicited-remote-assistance-set-disabled:
      test_title: '''Configure Solicited Remote Assistance'' is set to ''Disabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-configure-solicited-remote-assistance-set-disabled
