  assessment_title: The macOS system must disable Printer Sharing.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable Printer Sharing with the following command: /usr/sbin/cupsctl
    | /usr/bin/grep -c "_share_printers=0" If the result is not "1", this is a finding.'
