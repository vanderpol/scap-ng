assessment:
  id: ng.shared.ae7c90c1c91413a9ac302ae5
  version: 1
  assessment_title: UBTU-18-010434 - The Ubuntu operating system must implement certificate status checking for multifactor
    authentication.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    check-what-cert-policy-set-in-etc-pam-pkcs11-pam-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/pam_pkcs11/pam_pkcs11.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[\s]*cert_policy[ \t]+=[ \t]+([\w\,"' ]+);\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: Check what cert_policy is set to in /etc/pam_pkcs11/pam_pkcs11.conf
  states:
    state-the-ocsp-on-option-is-present-in-the-collected-string:
      state_title: The ocsp_on option is present in the collected string
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^["']*ocsp_on["']*$|^["']*ocsp_on["',\s]|["',\s]ocsp_on["',\s]|["',\s]ocsp_on["']*$
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-check-all-cert-policy-entries-set-ocsp-on-option-in:
      test_title: Check all cert_policy entries are set with the ocsp_on option in /etc/pam_pkcs11/pam_pkcs11.conf
      capability: independent.textfilecontent54
      object: check-what-cert-policy-set-in-etc-pam-pkcs11-pam-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-the-ocsp-on-option-is-present-in-the-collected-string
  evaluate:
    test: test-check-all-cert-policy-entries-set-ocsp-on-option-in
