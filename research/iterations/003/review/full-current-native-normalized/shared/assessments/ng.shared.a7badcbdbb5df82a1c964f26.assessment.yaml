assessment:
  id: ng.shared.a7badcbdbb5df82a1c964f26
  version: 1
  assessment_title: Ubuntu 20.04 LTS must audit any script or executable called by cron as root or by any privileged user.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    run-auditctl-l-look-etc-cron-d-collection:
      collection_title: 'run auditctl -l, look for: /etc/cron.d.'
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: auditctl -l
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
  tests:
    test-test-that-etc-cron-d-being-audited:
      test_title: Test that /etc/cron.d is being audited
      capability: independent.shellcommand
      collection: run-auditctl-l-look-etc-cron-d-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: 'Check that line contains: -w /etc/cron.d -p wa -k cronjobs.'
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: ^\-w\s\/etc\/cron\.d\s\-p\swa\s\-k\scronjobs\s*$
            operation: pattern match
            datatype: string
            mask: false
            entity_check: at least one
            entity_existence: at_least_one_exists
    test-test-that-var-spool-cron-being-audited:
      test_title: Test that /var/spool/cron is being audited.
      capability: independent.shellcommand
      collection: run-auditctl-l-look-etc-cron-d-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: 'Check that line contains: -w /var/spool/cron -p wa -k cronjobs.'
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: ^\-w\s\/var\/spool\/cron\s\-p\swa\s\-k\scronjobs\s*$
            operation: pattern match
            datatype: string
            mask: false
            entity_check: at least one
            entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-test-that-etc-cron-d-being-audited
    - test: test-test-that-var-spool-cron-being-audited
