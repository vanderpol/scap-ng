assessment:
  id: ng.shared.200e50b77883ada3beaac27d
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that the rsyslog daemon does not accept log messages
    from other servers unless the server is being used for log aggregation.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that the system is not accepting "rsyslog" messages from other systems unless it is documented as a log
    aggregation server. Check the configuration of "rsyslog" with the following command: # grep imtcp /etc/rsyslog.conf $ModLoad
    imtcp # grep imudp /etc/rsyslog.conf $ModLoad imudp # grep imrelp /etc/rsyslog.conf $ModLoad imrelp If any of the above
    modules are being loaded in the "/etc/rsyslog.conf" file, ask to see the documentation for the system being used for log
    aggregation. If the documentation does not exist, or does not specify the server as a log aggregation system, this is
    a finding.'
  inputs: {}
  evidence: []
