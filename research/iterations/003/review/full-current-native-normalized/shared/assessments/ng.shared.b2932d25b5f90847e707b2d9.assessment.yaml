  version: 1
  assessment_title: The Apache web server must use a logging mechanism that is configured to allocate log record storage capacity
    large enough to accommodate the logging requirements of the Apache web server.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Work with SIEM administrator to determine log storage capacity. If there is no setting within a SIEM to accommodate
    enough a large logging capacity, this is a finding.
