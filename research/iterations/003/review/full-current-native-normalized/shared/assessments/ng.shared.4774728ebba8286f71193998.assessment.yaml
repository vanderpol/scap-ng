assessment:
  id: ng.shared.4774728ebba8286f71193998
  version: 1
  assessment_title: The macOS system must disable iCloud Reminders.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable iCloud Reminders with the following command: /usr/bin/osascript
    -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\ .objectForKey(''allowCloudReminders'').js
    EOS If the result is not "false", this is a finding.'
  inputs: []
  evidence: []
