assessment:
  id: ng.shared.575f9e554c5a8e5d6b1be26d
  version: 1
  assessment_title: WN10-SO-000150 - Anonymous enumeration of shares must be restricted.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Control\Lsa
        name:
          operation: equals
          datatype: string
          mask: false
          value: restrictanonymous
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-network-access-do-not-allow-anonymous-enumeration-sam-accounts-shares:
      test_title: '''Network access: Do not allow anonymous enumeration of SAM accounts and shares'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-network-access-do-not-allow-anonymous-enumeration-sam-accounts-shares
