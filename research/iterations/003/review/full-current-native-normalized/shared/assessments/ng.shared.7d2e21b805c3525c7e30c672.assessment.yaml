assessment:
  id: ng.shared.7d2e21b805c3525c7e30c672
  version: 1
  assessment_title: All OL 8 local interactive user home directory files must have mode "0750" or less permissive.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify all files and directories contained in a local interactive user home directory, excluding local initialization
    files, have a mode of "0750". Files that begin with a "." are excluded from this requirement. Note: The example will be
    for the user "smithj", who has a home directory of "/home/smithj". $ sudo ls -lLR /home/smithj -rwxr-x--- 1 smithj smithj
    18 Mar 5 17:06 file1 -rwxr----- 1 smithj smithj 193 Mar 5 17:06 file2 -rw-r-x--- 1 smithj smithj 231 Mar 5 17:06 file3
    If any files or directories are found with a mode more permissive than "0750", this is a finding.'
  inputs: {}
  evidence: []
