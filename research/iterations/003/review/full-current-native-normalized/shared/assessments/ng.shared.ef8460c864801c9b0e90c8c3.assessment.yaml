assessment:
  id: ng.shared.ef8460c864801c9b0e90c8c3
  version: 1
  assessment_title: Login must not be permitted with empty/null passwords for SSH.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    permitemptypasswords-set-in-etc-ssh-sshd-config-collection:
      collection_title: PermitEmptyPasswords is set in /etc/ssh/sshd_config.
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh
        filename:
          operation: equals
          datatype: string
          mask: false
          value: sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*[Pp][Ee][Rr][Mm][Ii][Tt][Ee][Mm][Pp][Tt][Yy][Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Ss]\s+(\S+)
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
  tests:
    test-permitemptypasswords-set-no-in-etc-ssh-sshd-config:
      test_title: PermitEmptyPasswords is set to no in /etc/ssh/sshd_config.
      capability: independent.textfilecontent54
      collection: permitemptypasswords-set-in-etc-ssh-sshd-config-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: PermitEmptyPasswords is set to no
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: 'no'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-permitemptypasswords-set-no-in-etc-ssh-sshd-config
