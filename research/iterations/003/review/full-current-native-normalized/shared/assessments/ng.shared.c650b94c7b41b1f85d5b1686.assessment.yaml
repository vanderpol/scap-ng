  version: 1
  assessment_title: The macOS system must prevent Apple Watch from terminating a session lock.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to prevent Apple Watch from terminating a session lock with the following
    command: /usr/bin/osascript -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\
    .objectForKey(''allowAutoUnlock'').js EOS If the result is not "false", this is a finding.'
  inputs: []
  evidence: []
