assessment:
  id: ng.shared.7817be070879ff67cc5da691
  version: 1
  assessment_title: The operating system must allocate audit record storage capacity.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The Audit Configuration profile is required. This check applies to the global zone only. Determine the zone
    that you are currently securing. # zonename If the command output is "global", this check applies. Review the current
    audit file space limitations # pfexec auditconfig -getplugin audit_binfile Plugin: audit_binfile (active) The output of
    the command will appear in this form. Attributes: p_dir=/var/audit;p_fsize=4M;p_minfree=2 If p_minfree is not equal to
    "2" of greater, this is a finding. p_dir defines the current audit file system. Note: By default in Solaris 11.1, /var/audit
    is a link to /var/share/audit which is mounted on rpool/VARSHARE. Check that zfs compression is enabled for the audit
    file system. # zfs get compression [poolname/filesystemname] If compression is off, this is a finding. Check that a ZFS
    quota is enforced for the audit filesystem. # zfs get quota [poolname/filesystemname] If quota is set to "none", this
    is a finding. Ensure that a reservation of space is enforced on /var/share so that other users do not use up audit space.
    # zfs get quota,reservation [poolname/filesystemname] If reservation is set to "none", this is a finding.'
  inputs: []
  evidence: []
