assessment:
  id: ng.shared.440e0d63860c37d8f7e808dc
  version: 1
  assessment_title: The macOS system must be configured to disable the Privacy Setup services.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    os-privacy-setup-prompt-disable-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.SetupAssistant.managed'')\

            .objectForKey(''SkipPrivacySetup'').js

            EOS'
      object_title: os_privacy_setup_prompt_disable_recommended_object
  states:
    state-os-privacy-setup-prompt-disable-recommended-state:
      state_title: os_privacy_setup_prompt_disable_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: 'true'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-os-privacy-setup-prompt-disable-recommended-test:
      test_title: os_privacy_setup_prompt_disable_recommended_test
      capability: independent.shellcommand
      object: os-privacy-setup-prompt-disable-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-os-privacy-setup-prompt-disable-recommended-state
  evaluate:
    test: test-os-privacy-setup-prompt-disable-recommended-test
