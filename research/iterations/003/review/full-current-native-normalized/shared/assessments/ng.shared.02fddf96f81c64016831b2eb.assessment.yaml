assessment:
  id: ng.shared.02fddf96f81c64016831b2eb
  version: 1
  assessment_title: The Oracle Linux operating system must be configured to lock accounts for a minimum of 15 minutes after
    three unsuccessful logon attempts within a 15-minute timeframe.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Check that the system locks an account for a minimum of 15 minutes after three unsuccessful logon attempts within
    a period of 15 minutes with the following command: # grep pam_faillock.so /etc/pam.d/password-auth auth required pam_faillock.so
    preauth silent audit deny=3 even_deny_root fail_interval=900 unlock_time=900 auth [default=die] pam_faillock.so authfail
    audit deny=3 even_deny_root fail_interval=900 unlock_time=900 account required pam_faillock.so If the "deny" parameter
    is set to "0" or a value greater than "3" on both "auth" lines with the "pam_faillock.so" module, or is missing from these
    lines, this is a finding. If the "even_deny_root" parameter is not set on both "auth" lines with the "pam_faillock.so"
    module, or is missing from these lines, this is a finding. If the "fail_interval" parameter is set to "0" or is set to
    a value less than "900" on both "auth" lines with the "pam_faillock.so" module, or is missing from these lines, this is
    a finding. If the "unlock_time" parameter is not set to "0", "never", or is set to a value less than "900" on both "auth"
    lines with the "pam_faillock.so" module, or is missing from these lines, this is a finding. Note: The maximum configurable
    value for "unlock_time" is "604800". If any line referencing the "pam_faillock.so" module is commented out, this is a
    finding. # grep pam_faillock.so /etc/pam.d/system-auth auth required pam_faillock.so preauth silent audit deny=3 even_deny_root
    fail_interval=900 unlock_time=900 auth [default=die] pam_faillock.so authfail audit deny=3 even_deny_root fail_interval=900
    unlock_time=900 account required pam_faillock.so If the "deny" parameter is set to "0" or a value greater than "3" on
    both "auth" lines with the "pam_faillock.so" module, or is missing from these lines, this is a finding. If the "even_deny_root"
    parameter is not set on both "auth" lines with the "pam_faillock.so" module, or is missing from these lines, this is a
    finding. If the "fail_interval" parameter is set to "0" or is set to a value less than "900" on both "auth" lines with
    the "pam_faillock.so" module, or is missing from these lines, this is a finding. If the "unlock_time" parameter is not
    set to "0", "never", or is set to a value less than "900" on both "auth" lines with the "pam_faillock.so" module or is
    missing from these lines, this is a finding. Note: The maximum configurable value for "unlock_time" is "604800". If any
    line referencing the "pam_faillock.so" module is commented out, this is a finding.'
  inputs: []
  evidence: []
