assessment:
  id: ng.shared.ac28030db8337725a6bf5371
  version: 1
  assessment_title: The macOS system must disable password hints.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable password hints with the following command: /usr/bin/osascript
    -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.loginwindow'')\ .objectForKey(''RetriesUntilHint'').js
    EOS If the result is not "0", this is a finding.'
  inputs: {}
  evidence: []
