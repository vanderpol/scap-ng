assessment:
  id: ng.shared.26db0dd30071406da55c872e
  version: 1
  assessment_title: The RHEL 8 SSH public host key files must have mode 0644 or less permissive.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the SSH public host key files have mode "0644" or less permissive with the following command: $ sudo
    ls -l /etc/ssh/*.pub -rw-r--r-- 1 root root 618 Nov 28 06:43 ssh_host_dsa_key.pub -rw-r--r-- 1 root root 347 Nov 28 06:43
    ssh_host_key.pub -rw-r--r-- 1 root root 238 Nov 28 06:43 ssh_host_rsa_key.pub If any key.pub file has a mode more permissive
    than "0644", this is a finding. Note: SSH public key files may be found in other directories on the system depending on
    the installation.'
  inputs: []
  evidence: []
