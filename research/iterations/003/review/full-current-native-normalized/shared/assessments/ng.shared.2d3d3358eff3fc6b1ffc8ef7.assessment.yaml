assessment:
  id: ng.shared.2d3d3358eff3fc6b1ffc8ef7
  version: 1
  assessment_title: The Oracle Linux operating system must define default permissions for all authenticated users in such
    a way that the user can only read and modify their own files.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system defines default permissions for all authenticated users in such a way that the user
    can only read and modify their own files. Check for the value of the "UMASK" parameter in "/etc/login.defs" file with
    the following command: Note: If the value of the "UMASK" parameter is set to "000" in "/etc/login.defs" file, the Severity
    is raised to a CAT I. # grep -i umask /etc/login.defs UMASK 077 If the value for the "UMASK" parameter is not "077", or
    the "UMASK" parameter is missing or is commented out, this is a finding.'
  inputs: []
  evidence: []
