assessment:
  id: ng.shared.adf185c76fcc44c32fb10829
  version: 1
  assessment_title: OL08-00-040070 - The OL 8 file system automounter must be disabled unless required.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-systemdunitproperty-collection:
      collection_title: null
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          mask: false
          value: autofs.service
        property:
          operation: equals
          datatype: string
          mask: false
          value: ActiveState
  tests:
    test-autofs-service-activestate-inactive-if-it-exists:
      test_title: autofs.service ActiveState is inactive if it exists.
      capability: linux.systemdunitproperty
      collection: linux-systemdunitproperty-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: null
        state_capability: linux.systemdunitproperty
        state:
          field: value
          value: inactive
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-autofs-service-activestate-inactive-if-it-exists
