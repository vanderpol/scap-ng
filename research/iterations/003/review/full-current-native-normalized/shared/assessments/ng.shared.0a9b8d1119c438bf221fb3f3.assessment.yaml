assessment:
  id: ng.shared.0a9b8d1119c438bf221fb3f3
  version: 1
  assessment_title: Default demonstration and sample databases, database objects, and applications must be removed.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-sqlext-collection:
      collection_title: null
      capability: independent.sqlext
      select:
        engine:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: microsoft-sql-server-dbms-variable
        version:
          operation: pattern match
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: microsoft-sql-server-version-2016-2022-variable
        instance:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        database:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
        sql:
          operation: equals
          datatype: string
          mask: false
          value: SELECT name FROM sysdatabases WHERE name LIKE 'Northwind' OR name LIKE 'AdventureWorks' OR name LIKE 'pubs'
            OR name LIKE 'WorldwideImporters';
      behaviors:
        context: instance
  variables:
    microsoft-sql-server-dbms-variable:
      title: Microsoft SQL Server DBMS
      kind: constant
      datatype: string
      expression:
        literal: sqlserver
    microsoft-sql-server-version-2016-2022-variable:
      title: Microsoft SQL Server version 2016-2022
      kind: constant
      datatype: string
      expression:
        literal: 2016|2017|2019|2022
  tests:
    test-check-if-pubs-northwinds-adventureworks-or-worldwideimporter-databases-present:
      test_title: Check if pubs, Northwinds, AdventureWorks, or WorldwideImporter databases are present.
      capability: independent.sqlext
      collection: independent-sqlext-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
  evaluate:
    test: test-check-if-pubs-northwinds-adventureworks-or-worldwideimporter-databases-present
