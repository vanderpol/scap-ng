assessment:
  id: ng.shared.17bed99f4def75189f55fab7
  version: 1
  assessment_title: Session Security for NTLM SSP Based Servers
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0
        name:
          operation: equals
          datatype: string
          value: NTLMMinServerSec
      object_title: null
  states:
    state-reg-dword-type-and-value-bitwise-and-524288:
      state_title: Reg_Dword type and value bitwise and 524288
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '524288'
          operation: bitwise and
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
    state-reg-dword-type-and-value-bitwise-and-536870912:
      state_title: Reg_Dword type and value bitwise and 536870912
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '536870912'
          operation: bitwise and
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-network-security-minimum-session-security-ntlm-ssp-based-including-secure:
      test_title: '''Network security: Minimum session security for NTLM SSP based (including secure RPC) servers'' is set
        to ''Require NTLMv2 session security'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-bitwise-and-524288
    test-network-security-minimum-session-security-ntlm-ssp-based-including-secure-2:
      test_title: '''Network security: Minimum session security for NTLM SSP based (including secure RPC) servers'' is set
        to ''Require 128-bit encryption'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-bitwise-and-536870912
  evaluate:
    all:
    - test: test-network-security-minimum-session-security-ntlm-ssp-based-including-secure
    - test: test-network-security-minimum-session-security-ntlm-ssp-based-including-secure-2
