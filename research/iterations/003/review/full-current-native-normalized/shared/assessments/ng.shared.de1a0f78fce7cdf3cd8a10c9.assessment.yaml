assessment:
  id: ng.shared.de1a0f78fce7cdf3cd8a10c9
  version: 1
  assessment_title: WN10-SO-000040 - Outgoing secure channel traffic must be encrypted when possible.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Services\Netlogon\Parameters
        name:
          operation: equals
          datatype: string
          mask: false
          value: SealSecureChannel
  tests:
    test-domain-member-digitally-encrypt-secure-channel-data-when-possible-set:
      test_title: '''Domain member: Digitally encrypt secure channel data (when possible)'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-domain-member-digitally-encrypt-secure-channel-data-when-possible-set
