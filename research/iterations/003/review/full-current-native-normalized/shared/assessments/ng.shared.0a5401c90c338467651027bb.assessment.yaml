assessment:
  id: ng.shared.0a5401c90c338467651027bb
  version: 1
  assessment_title: The Oracle Linux operating system must uniquely identify and must authenticate organizational users (or
    processes acting on behalf of organizational users) using multifactor authentication.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system requires multifactor authentication to uniquely identify organizational users using
    multifactor authentication. Check to see if smartcard authentication is enforced on the system: # authconfig --test |
    grep "pam_pkcs11 is enabled" If no results are returned, this is a finding. # authconfig --test | grep "smartcard removal
    action" If "smartcard removal action" is blank, this is a finding. # authconfig --test | grep "smartcard module" If any
    of the above checks are not configured, ask the administrator to indicate the AO-approved multifactor authentication in
    use and the configuration to support it. If there is no evidence of multifactor authentication, this is a finding.'
  inputs: []
  evidence: []
