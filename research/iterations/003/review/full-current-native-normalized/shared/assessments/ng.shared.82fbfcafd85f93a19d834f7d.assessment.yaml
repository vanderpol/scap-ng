  objects:
    retrieve-configuration-lines-from-etc-aide-conf-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/aide.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*/usr/sbin/auditctl(\s+\S+)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: Retrieve configuration lines from /etc/aide.conf
