assessment:
  id: ng.shared.d79c4091074a41272220aa31
  version: 1
  assessment_title: The macOS system must configure SSHD ClientAliveCountMax to 1.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to set the SSHD ClientAliveCountMax to 1 with the following command: /usr/sbin/sshd
    -G | /usr/bin/awk ''/clientalivecountmax/{print $2}'' If the result is not "1", this is a finding.'
  inputs: []
  evidence: []
