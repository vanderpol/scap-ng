assessment:
  id: ng.shared.924a998ecabc522324174349
  version: 1
  assessment_title: Users must have a valid home directory assignment.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The root role is required. Determine if each user has a valid home directory. # logins -xo | while read line;
    do user=`echo ${line} | awk -F: ''{ print $1 }''` home=`echo ${line} | awk -F: ''{ print $6 }''` if [ -z "${home}" ];
    then echo ${user} fi done If output is produced, this is a finding.'
  inputs: []
  evidence: []
