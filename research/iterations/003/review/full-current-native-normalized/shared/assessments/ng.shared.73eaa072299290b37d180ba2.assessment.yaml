assessment:
  id: ng.shared.73eaa072299290b37d180ba2
  version: 1
  assessment_title: The macOS system must configure system log files to be owned by root and group to wheel.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-newsyslog-files-owner-group-configure-recommended-object-collection:
      collection_title: os_newsyslog_files_owner_group_configure_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/bin/stat -f '%Su:%Sg:%N' $(/usr/bin/grep -v '^#' /etc/newsyslog.conf|/usr/bin/awk '{ print $1 }')|/usr/bin/awk
            '!/^root:wheel:/{print $1}'
  tests:
    test-os-newsyslog-files-owner-group-configure-recommended-test:
      test_title: os_newsyslog_files_owner_group_configure_recommended_test
      capability: independent.shellcommand
      collection: os-newsyslog-files-owner-group-configure-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: os_newsyslog_files_owner_group_configure_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: ''
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: none_exist
  evaluate:
    test: test-os-newsyslog-files-owner-group-configure-recommended-test
