  version: 1
  assessment_title: WN19-DC-000370 - Windows Server 2019 Deny access to this computer from the network user right on domain
    controllers must be configured to prevent unauthenticated access.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-userright-collection:
      collection_title: null
      capability: windows.userright
      select:
        userright:
          operation: equals
          datatype: string
          mask: false
          value: SE_DENY_NETWORK_LOGON_NAME
  tests:
    test-deny-access-this-computer-from-network-guests:
      test_title: Deny access to this computer from the network - Guests
      capability: windows.userright
      collection: windows-userright-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: null
        state_capability: windows.userright
        state:
          field: trustee_name
          value: Guests
          operation: case insensitive equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-deny-access-this-computer-from-network-guests
