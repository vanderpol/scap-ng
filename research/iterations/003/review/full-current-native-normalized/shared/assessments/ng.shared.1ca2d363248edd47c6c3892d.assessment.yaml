assessment:
  id: ng.shared.1ca2d363248edd47c6c3892d
  version: 1
  assessment_title: WN11-UR-000120 - The "Load and unload device drivers" user right must only be assigned to the Administrators
    group.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-userright-object:
      capability: windows.userright
      select:
        userright:
          operation: equals
          datatype: string
          mask: false
          value: SE_LOAD_DRIVER_NAME
      object_title: null
  states:
    state-windows-userright:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: ''
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-userright-2:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: Administrators
        operation: case insensitive equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-load-unload-device-drivers-administrators:
      test_title: Load and unload device drivers - Administrators
      capability: windows.userright
      object: windows-userright-object
      check_existence: at_least_one_exists
