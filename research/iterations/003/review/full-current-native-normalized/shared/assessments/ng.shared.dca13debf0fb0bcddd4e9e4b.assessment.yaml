assessment:
  id: ng.shared.dca13debf0fb0bcddd4e9e4b
  version: 1
  assessment_title: WN10-00-000110 - Simple TCP/IP Services must not be installed on the system.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    simple-tcp-ip-services-object:
      capability: windows.wmi57
      select:
        namespace:
          operation: equals
          datatype: string
          value: root\cimv2
        wql:
          operation: equals
          datatype: string
          value: SELECT startmode FROM Win32_Service WHERE name='simptcp'
      object_title: Simple TCP/IP Services
  states: {}
  tests:
    test-check-make-sure-simple-tcp-ip-services-server-feature-not:
      test_title: Check to make sure the Simple TCP/IP Services server feature is not present.
      capability: windows.wmi57
      object: simple-tcp-ip-services-object
      check_existence: none_exist
      check: at least one
  evaluate:
    test: test-check-make-sure-simple-tcp-ip-services-server-feature-not
