assessment:
  id: ng.shared.76e1ffec0544317e75e81a46
  version: 1
  assessment_title: SQL Server must initiate session auditing upon startup.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-sqlext-collection:
      collection_title: null
      capability: independent.sqlext
      select:
        engine:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: microsoft-sql-server-dbms-variable
        version:
          operation: pattern match
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: microsoft-sql-server-version-2016-2022-variable
        instance:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        database:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
        sql:
          operation: equals
          datatype: string
          mask: false
          value: "SELECT name AS 'Audit Name', \nstatus_desc AS 'Audit Status', \naudit_file_path AS 'Current Audit File'\
            \ \nFROM sys.dm_server_audit_status \nWHERE status_desc = 'STARTED'"
      behaviors:
        context: instance
  variables:
    microsoft-sql-server-dbms-variable:
      title: Microsoft SQL Server DBMS
      kind: constant
      datatype: string
      expression:
        literal: sqlserver
    microsoft-sql-server-version-2016-2022-variable:
      title: Microsoft SQL Server version 2016-2022
      kind: constant
      datatype: string
      expression:
        literal: 2016|2017|2019|2022
  tests:
    test-all-currently-defined-audits-sql-server-instance-will-listed-if:
      test_title: All currently defined audits for the SQL server instance will be listed. If no audits are returned, this
        is a finding.
      capability: independent.sqlext
      collection: independent-sqlext-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    test: test-all-currently-defined-audits-sql-server-instance-will-listed-if
