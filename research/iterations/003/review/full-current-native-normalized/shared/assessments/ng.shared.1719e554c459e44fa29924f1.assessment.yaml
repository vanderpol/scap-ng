assessment:
  id: ng.shared.1719e554c459e44fa29924f1
  version: 1
  assessment_title: The audit system must be configured to audit file deletions.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    audit-system-configured-audit-file-deletions-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: auditconfig -t -getflags | cut -f2 -d=
        pattern:
          operation: pattern match
          datatype: string
          value: .*
      object_title: The audit system must be configured to audit file deletions.
  states:
    state-fd-is-returned-in-the-output:
      state_title: fd is returned in the output
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: fd
          operation: pattern match
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-audit-system-configured-audit-file-deletions:
      test_title: The audit system must be configured to audit file deletions.
      capability: independent.shellcommand
      object: audit-system-configured-audit-file-deletions-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-fd-is-returned-in-the-output
  evaluate:
    test: test-audit-system-configured-audit-file-deletions
