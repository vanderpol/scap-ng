assessment:
  id: ng.shared.753f7a97990deec6e72c823e
  version: 1
  assessment_title: UAC - UIAccess Application Elevation
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Microsoft\Windows\CurrentVersion\Policies\System
        name:
          operation: equals
          datatype: string
          mask: false
          value: EnableSecureUIAPaths
      object_title: null
  variables:
    only-elevate-uiaccess-applications-that-installed-in-secure-locations-variable:
      title: Only elevate UIAccess applications that are installed in secure locations
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: only_elevate_uiaccess_applications_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: only-elevate-uiaccess-applications-that-installed-in-secure-locations-variable
          operation: equals
          datatype: int
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-user-account-control-only-elevate-uiaccess-applications-that-installed-in:
      test_title: '''User Account Control: Only elevate UIAccess applications that are installed in secure locations'' is
        set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-user-account-control-only-elevate-uiaccess-applications-that-installed-in
