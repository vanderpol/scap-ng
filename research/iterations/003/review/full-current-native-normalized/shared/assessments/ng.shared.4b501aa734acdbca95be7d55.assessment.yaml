  version: 1
  assessment_title: The Oracle Linux operating system must not allow accounts configured with blank or null passwords.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'To verify that null passwords cannot be used, run the following command: # grep nullok /etc/pam.d/system-auth
    /etc/pam.d/password-auth If this produces any output, it may be possible to log on with accounts with empty passwords.
    If null passwords can be used, this is a finding.'
  inputs: {}
  evidence: []
