assessment:
  id: ng.shared.7cb749fa094420900ee6df02
  version: 1
  assessment_title: WN12-00-000220
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    select-ids-from-get-windowsfeature-where-installed-collection:
      collection_title: Select the ids from 'Get-WindowsFeature | Where Installed'
      capability: windows.wmi57
      select:
        namespace:
          operation: equals
          datatype: string
          mask: false
          value: root\cimv2
        wql:
          operation: equals
          datatype: string
          mask: false
          value: SELECT id FROM win32_serverfeature
  tests:
    test-windows-powershell-2-0-engine-server-feature-not-installed:
      test_title: Windows PowerShell 2.0 Engine server feature is not installed
      capability: windows.wmi57
      collection: select-ids-from-get-windowsfeature-where-installed-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: ID 411 (Windows PowerShell 2.0 Engine) is NOT in the result set
        state_capability: windows.wmi57
        state:
          field: result
          value:
            record:
            - name: id
              value: '411'
              operation: equals
              datatype: int
              mask: false
              entity_check: none satisfy
          operation: equals
          datatype: record
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-windows-powershell-2-0-engine-server-feature-not-installed
