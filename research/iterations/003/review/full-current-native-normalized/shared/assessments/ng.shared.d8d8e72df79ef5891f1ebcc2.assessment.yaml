assessment:
  id: ng.shared.d8d8e72df79ef5891f1ebcc2
  version: 1
  assessment_title: WN10-SO-000230 - The system must be configured to use FIPS-compliant algorithms for encryption, hashing,
    and signing.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Control\Lsa\FIPSAlgorithmPolicy
        name:
          operation: equals
          datatype: string
          mask: false
          value: Enabled
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-system-cryptography-use-fips-compliant-algorithms-encryption-hashing-signing-set:
      test_title: '''System cryptography: Use FIPS compliant algorithms for encryption, hashing, and signing'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-system-cryptography-use-fips-compliant-algorithms-encryption-hashing-signing-set
