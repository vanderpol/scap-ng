assessment:
  id: ng.shared.5b3d93d4c30423058da5cc5f
  version: 1
  assessment_title: The macOS system must disable root logon.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-root-disable-recommended-object-collection:
      collection_title: os_root_disable_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/bin/dscl . -read /Users/root UserShell 2>&1 | /usr/bin/grep "/usr/bin/false"
  tests:
    test-os-root-disable-recommended-test:
      test_title: os_root_disable_recommended_test
      capability: independent.shellcommand
      collection: os-root-disable-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: os_root_disable_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: .*
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-os-root-disable-recommended-test
