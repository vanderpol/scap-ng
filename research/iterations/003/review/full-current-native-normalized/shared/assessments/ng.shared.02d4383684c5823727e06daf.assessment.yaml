assessment:
  id: ng.shared.02d4383684c5823727e06daf
  version: 1
  assessment_title: The macOS system must ensure Secure Boot level is set to "full".
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-secure-boot-verify-recommended-object-collection:
      collection_title: os_secure_boot_verify_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/libexec/mdmclient QuerySecurityInfo 2>/dev/null | /usr/bin/grep "SecureBootLevel = full"
  tests:
    test-os-secure-boot-verify-recommended-test:
      test_title: os_secure_boot_verify_recommended_test
      capability: independent.shellcommand
      collection: os-secure-boot-verify-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: os_secure_boot_verify_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: .*
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-os-secure-boot-verify-recommended-test
