assessment:
  id: ng.shared.2b3dafff81b3b98c6690d71d
  version: 1
  assessment_title: The macOS system must configure Apple System Log files to mode 640 or less permissive.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-asl-log-files-permissions-configure-recommended-object-collection:
      collection_title: os_asl_log_files_permissions_configure_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/bin/stat -f '%A:%N' $(/usr/bin/grep -e '^>' /etc/asl.conf /etc/asl/*|/usr/bin/awk '{ print $2 }')|/usr/bin/awk
            '!/640/{print $1}'
  tests:
    test-os-asl-log-files-permissions-configure-recommended-test:
      test_title: os_asl_log_files_permissions_configure_recommended_test
      capability: independent.shellcommand
      collection: os-asl-log-files-permissions-configure-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: os_asl_log_files_permissions_configure_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: ''
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: none_exist
  evaluate:
    test: test-os-asl-log-files-permissions-configure-recommended-test
