assessment:
  id: ng.shared.3dea1f198a6a491373b4d574
  version: 1
  assessment_title: The Oracle Linux operating system must audit all uses of the sudo command.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system generates audit records when successful/unsuccessful attempts to use the "sudo"
    command occur. Check that the following system call is being audited by performing the following command to check the
    file system rules in "/etc/audit/audit.rules": $ sudo grep -w "/usr/bin/sudo" /etc/audit/audit.rules -a always,exit -F
    path=/usr/bin/sudo -F perm=x -F auid>=1000 -F auid!=unset -k privileged-priv_change If the command does not return any
    output, this is a finding.'
  inputs: {}
  evidence: []
