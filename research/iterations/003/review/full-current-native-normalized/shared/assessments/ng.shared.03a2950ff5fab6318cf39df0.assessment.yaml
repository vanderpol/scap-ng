assessment:
  id: ng.shared.03a2950ff5fab6318cf39df0
  version: 1
  assessment_title: Solaris Zone Name is global
  mode: automated
  class: inventory
  purpose: applicability
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    run-zonename-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: zonename
        pattern:
          operation: pattern match
          datatype: string
          value: .*
      object_title: Run 'zonename'
  states:
    state-check-that-line-returns-global-with-an-exit-status-of-0:
      state_title: Check that line returns 'global' with an exit status of 0
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: global
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-zone-global:
      test_title: The zone is global
      capability: independent.shellcommand
      object: run-zonename-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-check-that-line-returns-global-with-an-exit-status-of-0
  evaluate:
    test: test-zone-global
