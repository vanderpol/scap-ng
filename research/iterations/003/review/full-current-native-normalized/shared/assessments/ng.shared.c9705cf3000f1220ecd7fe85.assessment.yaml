  assessment_title: The OL 8 "/var/log/messages" file must have mode 0640 or less permissive.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that the "/var/log/messages" file has mode "0640" or less permissive with the following command: $ sudo
