assessment:
  id: ng.shared.c1d65c53a697e52229108e80
  version: 1
  assessment_title: OL 9 must be configured so that the cryptographic hashes of system files match vendor values.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    verify-that-rhel-9-configured-so-that-cryptographic-hashes-system-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: rpm -Va --noconfig | awk '$1 ~ /..5/ && $2 != "c"'
      object_title: Verify that RHEL 9 is configured so that the cryptographic hashes of system files match vendor values.
  states:
    state-confirm-no-files-are-identified:
      state_title: Confirm no files are identified.
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: ''
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: none_exist
  tests:
    test-verify-that-rhel-9-configured-so-that-cryptographic-hashes-system:
      test_title: Verify that RHEL 9 is configured so that the cryptographic hashes of system files match vendor values.
      capability: independent.shellcommand
      object: verify-that-rhel-9-configured-so-that-cryptographic-hashes-system-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-confirm-no-files-are-identified
  evaluate:
    test: test-verify-that-rhel-9-configured-so-that-cryptographic-hashes-system
