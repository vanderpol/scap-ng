assessment:
  id: ng.shared.4fea39cf7ac260f6c20850b8
  version: 1
  assessment_title: Only accounts responsible for the backup operations must be members of the Backup Operators group.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Run "Computer Management". Navigate to System Tools >> Local Users and Groups >> Groups. Review the members of
    the Backup Operators group. If the group contains no accounts, this is not a finding. If the group contains any accounts,
    the accounts must be specifically for backup functions. If the group contains any standard user accounts used for performing
    normal user tasks, this is a finding.
  inputs: []
  evidence: []
