assessment:
  id: ng.shared.72ab2ff3a071d9971b648187
  version: 1
  assessment_title: HTTP Printer Drivers
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows NT\Printers
        name:
          operation: equals
          datatype: string
          mask: false
          value: DisableWebPnPDownload
      object_title: null
  variables:
    turn-off-downloading-print-drivers-over-http-variable:
      title: Turn off downloading of print drivers over HTTP
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: turn_off_downloading_of_print_drivers_over_http_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: turn-off-downloading-print-drivers-over-http-variable
          operation: equals
          datatype: int
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-turn-off-downloading-print-drivers-over-http-set-enabled:
      test_title: '''Turn off downloading of print drivers over HTTP'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-turn-off-downloading-print-drivers-over-http-set-enabled
