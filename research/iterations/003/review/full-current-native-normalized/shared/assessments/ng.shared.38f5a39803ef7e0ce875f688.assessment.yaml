assessment:
  id: ng.shared.38f5a39803ef7e0ce875f688
  version: 1
  assessment_title: WN19-MS-000070 - Windows Server 2019 "Access this computer from the network" user right must only be assigned
    to the Administrators and Authenticated Users groups on domain-joined member servers and standalone or nondomain-joined
    systems.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-userright-object:
      capability: windows.userright
      select:
        userright:
          operation: equals
          datatype: string
          value: SE_NETWORK_LOGON_NAME
      object_title: null
  states:
    state-windows-userright:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: ''
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-userright-2:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: Administrators
        operation: case insensitive equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-userright-3:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: Authenticated Users
        operation: case insensitive equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-access-this-computer-from-network-administrators-authenticated-users:
      test_title: Access this computer from the network - Administrators, Authenticated Users
      capability: windows.userright
      object: windows-userright-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-windows-userright
      - state-windows-userright-2
      - state-windows-userright-3
  evaluate:
    test: test-access-this-computer-from-network-administrators-authenticated-users
