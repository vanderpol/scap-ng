assessment:
  id: ng.shared.a5c4cef10e76f211e4e1496a
  version: 1
  assessment_title: Firefox must have the DOD root certificates installed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Type "about:preferences#privacy" in the browser window. Scroll down to the bottom and select "View Certificates...".
    In the Certificate Manager window, select the "Authorities" tab. Scroll through the Certificate Name list to the U.S.
    Government heading. Look for the entries for DOD Root CA 3, DOD Root CA 4, and DOD Root CA 5. If there are entries for
    DOD Root CA 3, DOD Root CA 4, and DOD Root CA 5, select them individually. Click "View". Verify the issuer name is "US
    Government". If there are no entries for the appropriate DOD root certificates, this is a finding. If other AO-approved
    certificates are used, this is not a finding. If SIPRNet-specific certificates are used, this is not a finding. Note:
    In a Windows environment, use of policy setting "security.enterprise_roots.enabled=true" will point Firefox to the Windows
    Trusted Root Certification Authority Store. This is not a finding. It can also be set via the policy Certificates >> ImportEnterpriseRoots,
    which can be verified via "about:policies".'
  inputs: []
  evidence: []
