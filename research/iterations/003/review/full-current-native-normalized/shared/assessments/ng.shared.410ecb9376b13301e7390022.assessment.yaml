assessment:
  id: ng.shared.410ecb9376b13301e7390022
  version: 1
  assessment_title: The Application event log size must be configured to 32768 KB or greater.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the system is configured to write events directly to an audit server, this is NA. If the following registry
    value does not exist or is not configured as specified, this is a finding: Registry Hive: HKEY_LOCAL_MACHINE Registry
    Path: \SOFTWARE\Policies\Microsoft\Windows\EventLog\Application\ Value Name: MaxSize Type: REG_DWORD Value: 0x00008000
    (32768) (or greater)'
  inputs: {}
  evidence: []
