assessment:
  id: ng.shared.997dbd37e2bb758ef5857c80
  version: 1
  assessment_title: OL09-00-002539 - OL 9 /etc/gshadow- file must be group-owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    unix-file-collection:
      collection_title: null
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/gshadow-
  tests:
    test-etc-gshadow-file-owned-by-root:
      test_title: /etc/gshadow- file is owned by root
      capability: unix.file
      collection: unix-file-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: group-owned by root
        state_capability: unix.file
        state:
          field: group_id
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-etc-gshadow-file-owned-by-root
