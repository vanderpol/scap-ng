  version: 1
  assessment_title: The Ubuntu operating system SSH daemon must prevent remote hosts from connecting to the proxy display.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the SSH daemon prevents remote hosts from connecting to the proxy display. Check the SSH X11UseLocalhost
    setting with the following command: # sudo grep -i x11uselocalhost /etc/ssh/sshd_config X11UseLocalhost yes If the "X11UseLocalhost"
    keyword is set to "no", is missing, or is commented out, this is a finding.'
