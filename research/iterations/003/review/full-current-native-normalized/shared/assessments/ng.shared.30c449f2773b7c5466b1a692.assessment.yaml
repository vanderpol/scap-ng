  version: 1
  assessment_title: Windows must be prevented from sending an error report when a device driver requests additional software
    during installation.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding: Registry
    Hive: HKEY_LOCAL_MACHINE Registry Path: \Software\Policies\Microsoft\Windows\DeviceInstall\Settings\ Value Name: DisableSendRequestAdditionalSoftwareToWER
    Type: REG_DWORD Value: 1'
  inputs: []
  evidence: []
