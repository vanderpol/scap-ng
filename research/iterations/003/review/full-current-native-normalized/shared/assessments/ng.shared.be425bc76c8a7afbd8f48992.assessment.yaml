  collections:
    test-etc-pam-d-password-auth-pam-faillock-so-preauth-collection:
      collection_title: Test /etc/pam.d/password-auth pam_faillock.so preauth line for dir parameter.
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/pam.d/password-auth
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: \n*\s*auth\s+required\s+pam_faillock.so\s+preauth\s+.*?(dir=\S+)\s*.*?\b
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
