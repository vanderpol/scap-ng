assessment:
  id: ng.shared.d76ec2a036cfa13816c4529b
  version: 1
  assessment_title: The Apache web server must not perform user management for hosted applications.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Interview the System Administrator (SA) about the role of the Apache web server. If the web server is hosting
    an application, have the SA provide supporting documentation on how the application's user management is accomplished
    outside of the web server. If the web server is not hosting an application, this is Not Applicable. If the web server
    is performing user management for hosted applications, this is a finding. If the web server is hosting an application
    and the SA cannot provide supporting documentation on how the application's user management is accomplished outside of
    the Apache web server, this is a finding.
  inputs: []
  evidence: []
