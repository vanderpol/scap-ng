assessment:
  id: ng.shared.b06f5da4d89e60b52035b759
  version: 1
  assessment_title: Manually managed application account passwords must be at least 14 characters in length.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    retrieves-passwordpolicy-object-collection:
      collection_title: Retrieves a passwordpolicy_object.
      capability: windows.passwordpolicy
  tests:
    test-verify-password-length-setting-required-14-or-more-characters:
      test_title: Verify Password Length Setting is required to be 14 or more characters.
      capability: windows.passwordpolicy
      collection: retrieves-passwordpolicy-object-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: This passwordpolicy_state represents a password policy that has a min_passwd_len greater than or equal
          to '14'.
        state_capability: windows.passwordpolicy
        state:
          field: min_passwd_len
          value: '14'
          operation: greater than or equal
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-verify-password-length-setting-required-14-or-more-characters
