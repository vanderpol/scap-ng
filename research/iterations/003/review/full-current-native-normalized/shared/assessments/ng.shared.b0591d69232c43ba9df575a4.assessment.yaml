assessment:
  id: ng.shared.b0591d69232c43ba9df575a4
  version: 1
  assessment_title: The Oracle Linux operating system must not be configured to bypass password requirements for privilege
    escalation.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    retrieve-pam-succeed-if-from-configuration-if-it-exists-collection:
      collection_title: Retrieve 'pam_succeed_if' from configuration if it exists.
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/pam.d/sudo
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*[^#\n]*\bpam_succeed_if\b
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-test-that-pam-succeed-if-not-present-in-etc-pam:
      test_title: Test that 'pam_succeed_if' is not present in /etc/pam.d/sudo
      capability: independent.textfilecontent54
      collection: retrieve-pam-succeed-if-from-configuration-if-it-exists-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
  evaluate:
    test: test-test-that-pam-succeed-if-not-present-in-etc-pam
