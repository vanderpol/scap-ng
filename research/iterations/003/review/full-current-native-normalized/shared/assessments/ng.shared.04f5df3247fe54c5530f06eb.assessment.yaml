assessment:
  id: ng.shared.04f5df3247fe54c5530f06eb
  version: 1
  assessment_title: The macOS system must disable sending diagnostic and usage data to Apple.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    system-settings-diagnostics-reports-disable-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: "/usr/bin/osascript -l JavaScript << EOS\nfunction run() {\nlet pref1 = $.NSUserDefaults.alloc.initWithSuiteName('com.apple.SubmitDiagInfo')\\\
            \n.objectForKey('AutoSubmit').js\nlet pref2 = $.NSUserDefaults.alloc.initWithSuiteName('com.apple.applicationaccess')\\\
            \n.objectForKey('allowDiagnosticSubmission').js\nif ( pref1 == false && pref2 == false ){\n    return(\"true\"\
            )\n} else {\n    return(\"false\")\n}\n}\nEOS"
      object_title: system_settings_diagnostics_reports_disable_recommended_object
  states:
    state-system-settings-diagnostics-reports-disable-recommended-:
      state_title: system_settings_diagnostics_reports_disable_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: 'true'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-settings-diagnostics-reports-disable-recommended-test:
      test_title: system_settings_diagnostics_reports_disable_recommended_test
      capability: independent.shellcommand
      object: system-settings-diagnostics-reports-disable-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-system-settings-diagnostics-reports-disable-recommended-
  evaluate:
    test: test-system-settings-diagnostics-reports-disable-recommended-test
