  version: 1
  assessment_title: The macOS system must prevent AdminHostInfo from being available at LoginWindow.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to prevent AdminHostInfo from being available at LoginWindow with the
    following command: /usr/bin/osascript -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.loginwindow'')\
    .objectIsForcedForKey(''AdminHostInfo'') EOS If the result is not "false", this is a finding.'
  inputs: {}
  evidence: []
