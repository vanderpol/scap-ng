assessment:
  id: ng.shared.b4ef02ff8f680c70dfd5594e
  version: 1
  assessment_title: The built-in guest account must be renamed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    return-renamed-guest-account-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: $( if((Get-CimInstance Win32_OperatingSystem).ProductType -eq 2){ Get-ADUser -Filter * -Properties SID |
            Where-Object {$_.SID -match "^S-1-5-[0-9-]+-501$"} | Select-Object Name -First 1 | Format-List } else { Get-Localuser
            | Where-Object {$_.SID -match '^S-1-5-[0-9-]+-501$'} } ) | Format-List
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: Name\s+:\s+(.+)
      object_title: Return the renamed guest account
  states:
    state-account-must-not-be-guest:
      state_title: Account must not be Guest
      capability: independent.shellcommand
      state:
        field: subexpression
        value: Guest
        operation: case insensitive not equal
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-windows-built-in-guest-account-renamed:
      test_title: Windows built-in guest account must be renamed.
      capability: independent.shellcommand
      object: return-renamed-guest-account-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-account-must-not-be-guest
  evaluate:
    test: test-windows-built-in-guest-account-renamed
