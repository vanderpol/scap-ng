  version: 1
  assessment_title: The macOS system must ensure System Integrity Protection is enabled.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to enable System Integrity Protection with the following command: /usr/bin/csrutil
    status | /usr/bin/grep -c ''System Integrity Protection status: enabled.'' If the result is not "1", this is a finding.'
