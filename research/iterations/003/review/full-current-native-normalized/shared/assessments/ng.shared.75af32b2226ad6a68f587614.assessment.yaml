assessment:
  id: ng.shared.75af32b2226ad6a68f587614
  version: 1
  assessment_title: Bad Logon Counter Reset
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    lockout-policy-object:
      capability: windows.lockoutpolicy
      object_title: Lockout policy
  variables:
    reset-account-lockout-counter-after-variable:
      title: Reset Account Lockout Counter After
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: account_lockout_reset_counter_var
        validation:
          alternatives:
          - literal: '900'
            hint: 900_seconds
          - literal: '3600'
            hint: 3600_seconds
          - literal: '86400'
            hint: 86400_seconds
  states:
    state-lockout-observation-window-is-greater-than-or-equal-to-v:
      state_title: Lockout Observation Window is greater than or equal to variable
      capability: windows.lockoutpolicy
      state:
        field: lockout_observation_window
        value:
          variable: reset-account-lockout-counter-after-variable
        operation: greater than or equal
        datatype: int
        mask: false
        variable_check: all
        entity_check: all
        entity_existence: at_least_one_exists
    state-lockout-threshold-is-greater-than-0:
      state_title: Lockout Threshold is greater than 0
      capability: windows.lockoutpolicy
      state:
        field: lockout_threshold
        value: '0'
        operation: greater than
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-reset-account-lockout-counter-after-set-at-least-15-minutes:
      test_title: '''Reset account lockout counter after'' is set to at least ''15'' minutes'
      capability: windows.lockoutpolicy
      object: lockout-policy-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-lockout-observation-window-is-greater-than-or-equal-to-v
    test-account-lockout-threshold-not-set-0:
      test_title: '''Account lockout threshold'' is not set to ''0'''
      capability: windows.lockoutpolicy
      object: lockout-policy-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-lockout-threshold-is-greater-than-0
  evaluate:
    all:
    - test: test-reset-account-lockout-counter-after-set-at-least-15-minutes
    - test: test-account-lockout-threshold-not-set-0
