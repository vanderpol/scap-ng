assessment:
  id: ng.shared.ef46d91d0ebcce24f9c53b13
  version: 1
  assessment_title: The operating system must off-load audit records onto a different system or media from the system being
    audited.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    etc-audisp-audisp-remote-conf-remote-system-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audisp/audisp-remote.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[ ]*remote_server[ ]+=[ ]+(.*)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
        multiline: 'true'
      object_title: /etc/audisp/audisp-remote.conf remote_system
  states:
    state-remote-server-is-not-empty:
      state_title: remote_server is not empty
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^.+$
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-etc-audisp-audisp-remote-conf-remote-system-not-empty:
      test_title: /etc/audisp/audisp-remote.conf remote_system is not empty
      capability: independent.textfilecontent54
      object: etc-audisp-audisp-remote-conf-remote-system-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-remote-server-is-not-empty
  evaluate:
    test: test-etc-audisp-audisp-remote-conf-remote-system-not-empty
