assessment:
  id: ng.shared.59105fdb9536e96a91229634
  version: 1
  assessment_title: LAN Manager Hash Value Stored
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Control\Lsa
        name:
          operation: equals
          datatype: string
          mask: false
          value: NoLMHash
  variables:
    network-security-do-not-store-lan-manager-hash-value-on-variable:
      title: 'Network security: Do not store LAN Manager hash value on next password change'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: do_not_store_lan_manager_hash_value_on_next_password_change_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-network-security-do-not-store-lan-manager-hash-value-on:
      test_title: '''Network security: Do not store LAN Manager hash value on next password change'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: network-security-do-not-store-lan-manager-hash-value-on-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-network-security-do-not-store-lan-manager-hash-value-on
