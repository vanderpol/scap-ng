assessment:
  id: ng.shared.51df3e0a8f5292cc1ee57014
  version: 1
  assessment_title: AZLX-23-002489 - Amazon Linux 2023 must ensure the password complexity module is enabled in the password-auth
    file.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/pam.d/password-auth
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*password\s+(?:required|requisite)\s+pam_pwquality\.so\b
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-pam-pwquality-module-included-in-password-auth:
      test_title: The pam_pwquality module is included in password-auth.
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    test: test-pam-pwquality-module-included-in-password-auth
