assessment:
  id: ng.shared.f2dabd1a7ae52fbc632be59d
  version: 1
  assessment_title: UBTU-18-010031 - The Ubuntu operating system must enforce a delay of at least 4 seconds between logon
    prompts following a failed logon attempt.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/pam.d/common-auth
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*auth\s+required\s+pam_faildelay\.so\s+delay=(\d+)\s*(?:#.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '4000000'
        operation: greater than or equal
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-pam-faildelay-4-seconds-or-greater:
      test_title: pam_faildelay is 4 seconds or greater
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: all_exist
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    test: test-pam-faildelay-4-seconds-or-greater
