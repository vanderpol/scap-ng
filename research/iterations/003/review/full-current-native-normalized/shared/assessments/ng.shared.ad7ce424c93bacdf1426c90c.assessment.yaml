assessment:
  id: ng.shared.ad7ce424c93bacdf1426c90c
  version: 1
  assessment_title: Set SHA512 Password Hashing Algorithm in /etc/libuser.conf
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    etc-libuser-conf-crypt-style-first-instance-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/libuser.conf
        pattern:
          operation: pattern match
          datatype: string
          value: ^[\s]*crypt_style[\s]+=[\s]+(\S+)[\s]*$
        instance:
          operation: equals
          datatype: int
          value: '1'
      object_title: /etc/libuser.conf, crypt_style, first instance
  states:
    state-crypt-style-sha512-case-insensitive:
      state_title: crypt_style = sha512, case insensitive
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^[Ss][Hh][Aa]512$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-password-hashing-algorithm-should-set-correctly-in-etc-libuser-conf:
      test_title: The password hashing algorithm should be set correctly in /etc/libuser.conf
      capability: independent.textfilecontent54
      object: etc-libuser-conf-crypt-style-first-instance-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-crypt-style-sha512-case-insensitive
  evaluate:
    test: test-password-hashing-algorithm-should-set-correctly-in-etc-libuser-conf
