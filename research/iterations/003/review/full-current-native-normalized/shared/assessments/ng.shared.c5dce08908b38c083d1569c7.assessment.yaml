assessment:
  id: ng.shared.c5dce08908b38c083d1569c7
  version: 1
  assessment_title: The macOS system must be configured so that the su command requires smart card authentication.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    auth-pam-su-smartcard-enforce-recommended-object-collection:
      collection_title: auth_pam_su_smartcard_enforce_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/bin/grep -Ec '^(auth\s+sufficient\s+pam_smartcard.so|auth\s+required\s+pam_rootok.so)' /etc/pam.d/su
  tests:
    test-auth-pam-su-smartcard-enforce-recommended-test:
      test_title: auth_pam_su_smartcard_enforce_recommended_test
      capability: independent.shellcommand
      collection: auth-pam-su-smartcard-enforce-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: auth_pam_su_smartcard_enforce_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: '2'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-auth-pam-su-smartcard-enforce-recommended-test
