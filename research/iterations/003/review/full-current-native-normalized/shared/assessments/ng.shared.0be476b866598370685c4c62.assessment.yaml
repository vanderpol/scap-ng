assessment:
  id: ng.shared.0be476b866598370685c4c62
  version: 1
  assessment_title: WN19-SO-000400 - Windows Server 2019 User Account Control must, at a minimum, prompt administrators for
    consent on the secure desktop.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        name:
          operation: equals
          datatype: string
          mask: false
          value: ConsentPromptBehaviorAdmin
  tests:
    test-user-account-control-behavior-elevation-prompt-administrators-in-admin-approval:
      test_title: '''User Account Control: Behavior of the elevation prompt for administrators in Admin Approval Mode'' is
        set to ''Prompt for consent on the secure desktop'' or ''Prompt for credentials on the secure desktop'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: null
          capability: windows.registry
          state:
            all:
            - field: type
              value: reg_dword
              operation: equals
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            - field: value
              value: '1'
              operation: equals
              datatype: int
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
        - state_title: null
          capability: windows.registry
          state:
            all:
            - field: type
              value: reg_dword
              operation: equals
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            - field: value
              value: '2'
              operation: equals
              datatype: int
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
  evaluate:
    test: test-user-account-control-behavior-elevation-prompt-administrators-in-admin-approval
