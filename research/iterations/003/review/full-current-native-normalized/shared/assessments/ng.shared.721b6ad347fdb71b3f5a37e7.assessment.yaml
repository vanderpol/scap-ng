assessment:
  id: ng.shared.721b6ad347fdb71b3f5a37e7
  version: 1
  assessment_title: The system must not have accounts configured with blank or null passwords.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    all-entries-under-etc-shadow-file-object:
      capability: unix.shadow
      select:
        username:
          operation: pattern match
          datatype: string
          value: ^.*$
      object_title: All entries under the /etc/shadow file.
  states:
    state-the-blank-password-state-of-an-account:
      state_title: The blank password state of an account.
      capability: unix.shadow
      state:
        field: password
        value: ^$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-make-sure-no-accounts-have-blank-null-passwords:
      test_title: Make sure no accounts have blank (null) passwords.
      capability: unix.shadow
      object: all-entries-under-etc-shadow-file-object
      check_existence: at_least_one_exists
      check: none satisfy
      states:
      - state-the-blank-password-state-of-an-account
  evaluate:
    test: test-make-sure-no-accounts-have-blank-null-passwords
