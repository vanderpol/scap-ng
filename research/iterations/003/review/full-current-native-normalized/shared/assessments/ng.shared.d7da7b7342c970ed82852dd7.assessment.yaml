assessment:
  id: ng.shared.d7da7b7342c970ed82852dd7
  version: 1
  assessment_title: RHEL 8 must clear memory when it is freed to prevent use-after-free attacks.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that GRUB2 is configured to mitigate use-after-free vulnerabilities by employing memory poisoning. Inspect
    the "GRUB_CMDLINE_LINUX" entry of /etc/default/grub as follows: $ sudo grep -i grub_cmdline_linux /etc/default/grub GRUB_CMDLINE_LINUX="...
    init_on_free=1" If "init_on_free=1" is missing or commented out, this is a finding.'
  inputs: []
  evidence: []
