  version: 1
  assessment_title: The macOS system must disable the iCloud Freeform services.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable iCloud Freeform services with the following command: /usr/bin/osascript
    -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\ .objectForKey(''allowCloudFreeform'').js
    EOS If the result is not "false", this is a finding.'
  inputs: []
  evidence: []
