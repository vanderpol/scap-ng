assessment:
  id: ng.shared.9d09f67c2e3b485abfb76a25
  version: 1
  assessment_title: The kernel core dump data directory must be group-owned by root.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The root role is required. This check applies to the global zone only. Determine the zone that you are currently
    securing. # zonename If the command output is "global", this check applies. Determine the location of the system dump
    directory. # dumpadm | grep directory Check ownership of the core dump data directory. # ls -l [savecore directory] If
    the directory is not group-owned by root, this is a finding. In Solaris 11, /var/crash is linked to /var/share/crash.'
  inputs: {}
  evidence: []
