assessment:
  id: ng.shared.ac5df064c025678646554b64
  version: 1
  assessment_title: The macOS system must require that passwords contain a minimum of one lowercase character and one uppercase
    character.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    pwpolicy-custom-regex-enforce-stig-object-collection:
      collection_title: pwpolicy_custom_regex_enforce_stig_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/bin/pwpolicy -getaccountpolicies | /usr/bin/tail +2 | /usr/bin/xmllint --xpath 'boolean(//*[contains(text(),"policyAttributePassword
            matches '\''^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9]).*$'\''")])' -
  tests:
    test-pwpolicy-custom-regex-enforce-stig-test:
      test_title: pwpolicy_custom_regex_enforce_stig_test
      capability: independent.shellcommand
      collection: pwpolicy-custom-regex-enforce-stig-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: pwpolicy_custom_regex_enforce_stig_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: 'true'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-pwpolicy-custom-regex-enforce-stig-test
