assessment:
  id: ng.shared.c94cff8ee843ea3a5f51829a
  version: 1
  assessment_title: The operating system must protect audit tools from unauthorized access.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The Software Installation Profile is required. Determine what the signature policy is for pkg publishers: #
    pkg property | grep signature-policy Check that output produces: signature-policy verify If the output does not confirm
    that signature-policy verify is active, this is a finding. Check that package permissions are configured and signed per
    vendor requirements. # pkg verify If the command produces any output unrelated to STIG changes, this is a finding. There
    is currently a Solaris 11 bug 16267888 which reports pkg verify errors for a variety of python packages. These can be
    ignored.'
  inputs: {}
  evidence: []
