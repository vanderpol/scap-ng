assessment:
  id: ng.shared.25140085ada3d296b2c816aa
  version: 1
  assessment_title: The audit system must maintain a central audit trail for all zones.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This check applies to the global zone only. Determine the zone that you are currently securing. # zonename If
    the command output is "global", this check applies. List the non-global zones on the system. # zoneadm list -vi | grep
    -v global The Audit Configuration profile is required. Determine whether the "perzone" auditing policy is in effect. #
    pfexec auditconfig -getpolicy | grep active | grep perzone If output is returned, this is a finding.'
  inputs: []
  evidence: []
