assessment:
  id: ng.shared.8cc2f58ffeb3f457fb9e5580
  version: 1
  assessment_title: Generic Security Services (GSS) must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    svcs-svc-network-ipsec-policy-default-collection:
      collection_title: svcs svc:/network/ipsec/policy:default
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: svcs -Ho state svc:/network/rpc/gss
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
  tests:
    test-generic-security-services-gss-disabled:
      test_title: Generic Security Services (GSS) must be disabled.
      capability: independent.shellcommand
      collection: svcs-svc-network-ipsec-policy-default-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Check that the output does not report 'online' and has an exit status of 0
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: ^(?!.*online).*$
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-generic-security-services-gss-disabled
