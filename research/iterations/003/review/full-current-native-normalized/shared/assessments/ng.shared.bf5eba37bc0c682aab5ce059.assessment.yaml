assessment:
  id: ng.shared.bf5eba37bc0c682aab5ce059
  version: 1
  assessment_title: The Server Message Block (SMB) v1 protocol must be disabled on Windows 2012 R2.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This requirement applies to Windows 2012 R2, it is NA for Windows 2012 (see V-73519 and V-73523 for 2012 requirements).
    Different methods are available to disable SMBv1 on Windows 2012 R2. This is the preferred method, however if V-73519
    and V-73523 are configured, this is NA. Run "Windows PowerShell" with elevated privileges (run as administrator). Enter
    the following: Get-WindowsOptionalFeature -Online | Where FeatureName -eq SMB1Protocol If "State : Enabled" is returned,
    this is a finding. Alternately: Search for "Features". Select "Turn Windows features on or off". If "SMB 1.0/CIFS File
    Sharing Support" is selected, this is a finding.'
  inputs: {}
  evidence: []
