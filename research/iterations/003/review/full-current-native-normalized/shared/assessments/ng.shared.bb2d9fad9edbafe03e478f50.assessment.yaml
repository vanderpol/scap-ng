assessment:
  id: ng.shared.bb2d9fad9edbafe03e478f50
  version: 1
  assessment_title: SLES-12-010820 - SUSE operating system file systems that are being imported via Network File System (NFS)
    must be mounted to prevent binary files from being executed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/fstab
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*\[?[\.\w:-]+\]?:[/\w-]+\s+[/\w-]+\s+nfs[4]?\s+(.*)$
        instance:
          operation: not equal
          datatype: int
          mask: false
          value: '0'
      object_title: null
    independent-textfilecontent54-object-2:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/mtab
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*\[?[\.\w:-]+\]?:[/\w-]+\s+[/\w-]+\s+nfs[4]?\s+(.*)$
        instance:
          operation: not equal
          datatype: int
          mask: false
          value: '0'
      object_title: null
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^.*noexec.*$
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-all-nfs-entries-in-etc-fstab-have-noexec:
      test_title: all nfs entries in /etc/fstab have noexec
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: any_exist
      check: all
      states:
      - state-independent-textfilecontent54
    test-all-nfs-entries-in-etc-mtab-have-noexec:
      test_title: all nfs entries in /etc/mtab have noexec
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-2
      check_existence: any_exist
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    all:
    - test: test-all-nfs-entries-in-etc-fstab-have-noexec
    - test: test-all-nfs-entries-in-etc-mtab-have-noexec
