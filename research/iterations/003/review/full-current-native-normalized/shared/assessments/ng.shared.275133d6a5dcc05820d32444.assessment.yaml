assessment:
  id: ng.shared.275133d6a5dcc05820d32444
  version: 1
  assessment_title: WN19-DC-000050 - Windows Server 2019 Kerberos policy user ticket renewal maximum lifetime must be limited
    to seven days or less.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    kerberos-policy-maximum-lifetime-user-ticket-renewal-7-days-or-collection:
      collection_title: Kerberos Policy - Maximum lifetime for user ticket renewal must be 7 days or less
      capability: windows.wmi57
      select:
        namespace:
          operation: equals
          datatype: string
          mask: false
          value: root\rsop\computer
        wql:
          operation: equals
          datatype: string
          mask: false
          value: SELECT setting FROM RSOP_SecuritySettingNumeric WHERE KeyName='MaxRenewAge'
  tests:
    test-kerberos-policy-maximum-lifetime-user-ticket-renewal-7-days-or:
      test_title: Kerberos Policy - Maximum lifetime for user ticket renewal - 7 days or less
      capability: windows.wmi57
      collection: kerberos-policy-maximum-lifetime-user-ticket-renewal-7-days-or-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Maximum lifetime for user ticket renewal lte 7
        state_capability: windows.wmi57
        state:
          field: result
          value:
            record:
            - name: setting
              value: '7'
              operation: less than or equal
              datatype: int
              mask: false
              entity_check: all
          operation: equals
          datatype: record
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-kerberos-policy-maximum-lifetime-user-ticket-renewal-7-days-or
