assessment:
  id: ng.shared.140b6364f11d76a84b45d06f
  version: 1
  assessment_title: OL09-00-002394 - OL 9 must clear the page allocator to prevent use-after-free attacks.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    bls-options-collection:
      collection_title: BLS options
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /boot/loader/entries
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^.*\.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^options\s+(.*)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    etc-default-grub-grub-cmdline-linux-collection:
      collection_title: /etc/default/grub GRUB_CMDLINE_LINUX
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/default/grub
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^GRUB_CMDLINE_LINUX="(.*)"
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-bls-options-contain-page-poison-1:
      test_title: BLS options contain page_poison=1
      capability: independent.textfilecontent54
      collection: bls-options-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: (^|\s)page_poison=1(\s|$)
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-etc-default-grub-page-poison-1:
      test_title: /etc/default/grub page_poison=1
      capability: independent.textfilecontent54
      collection: etc-default-grub-grub-cmdline-linux-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: (^|\s)page_poison=1(\s|$)
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-bls-options-contain-page-poison-1
    - test: test-etc-default-grub-page-poison-1
