assessment:
  id: ng.shared.5fa475ea3e2da35c17adafc3
  version: 1
  assessment_title: WN19-MS-000090 - Windows Server 2019 "Deny log on as a batch job" user right on domain-joined member servers
    must be configured to prevent access from highly privileged domain accounts and from unauthenticated access on all systems.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-wmi57-object:
      capability: windows.wmi.query
      object_title: null
      collect:
        namespace: root\cimv2
        query: SELECT DomainRole FROM win32_computersystem
    windows-userright-object:
      capability: windows.userright
      select:
        userright:
          operation: equals
          datatype: string
          value: SE_DENY_BATCH_LOGON_NAME
      object_title: null
  states:
    state-domain-member-server:
      state_title: Domain Member Server
      capability: windows.wmi.query
      state:
        field: result
        record:
          mask: false
          match: all
          existence: some
          fields:
            domainrole:
              value: '3'
              operation: equal
              datatype: string
              mask: false
              match: all
              existence: some
    state-windows-userright:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: ^(?i)(.+\\)?Domain Admins$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-userright-2:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: ^(?i)(.+\\)?Enterprise Admins$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-userright-3:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: Guests
        operation: case insensitive equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-standalone-server:
      state_title: Standalone Server
      capability: windows.wmi.query
      state:
        field: result
        record:
          mask: false
          match: all
          existence: some
          fields:
            domainrole:
              value: '2'
              operation: equal
              datatype: string
              mask: false
              match: all
              existence: some
  tests:
    test-system-windows-domain-member-server:
      test_title: The system is a Windows Domain Member Server
      capability: windows.wmi.query
      object: windows-wmi57-object
      states:
      - state-domain-member-server
      existence: some
      match: all
    test-deny-log-on-as-batch-job-domain-admins:
      test_title: Deny log on as a batch job - Domain Admins
      capability: windows.userright
      object: windows-userright-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-windows-userright
    test-deny-log-on-as-batch-job-enterprise-admins:
      test_title: Deny log on as a batch job - Enterprise Admins
      capability: windows.userright
      object: windows-userright-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-windows-userright-2
    test-deny-log-on-as-batch-job-guests:
      test_title: Deny log on as a batch job - Guests
      capability: windows.userright
      object: windows-userright-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-windows-userright-3
    test-system-windows-standalone-server:
      test_title: The system is a Windows Standalone Server
      capability: windows.wmi.query
      object: windows-wmi57-object
      states:
      - state-standalone-server
      existence: some
      match: all
  evaluate:
    any:
    - all:
      - test: test-system-windows-domain-member-server
      - test: test-deny-log-on-as-batch-job-domain-admins
      - test: test-deny-log-on-as-batch-job-enterprise-admins
      - test: test-deny-log-on-as-batch-job-guests
    - all:
      - test: test-system-windows-standalone-server
      - test: test-deny-log-on-as-batch-job-guests
