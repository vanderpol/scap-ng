assessment:
  id: ng.shared.750fc2683ec1122c9e1dcc7e
  version: 1
  assessment_title: Permissions for the Windows installation directory must conform to minimum requirements.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    everyoneincludesanonymous-configured-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Control\Lsa
        name:
          operation: equals
          datatype: string
          mask: false
          value: everyoneincludesanonymous
      object_title: everyoneincludesanonymous must be configured
    run-icacls-command-against-windows-install-directory-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: icacls($env:windir)
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: ':'
      object_title: Run Icacls command against Windows install directory
  variables:
    required-permissions-variable:
      title: Required Permissions
      kind: constant
      datatype: string
      expression:
        literal:
        - (?i)NT SERVICE\\TrustedInstaller:\(F\)
        - (?i)NT SERVICE\\TrustedInstaller:\(CI\)\(IO\)\(F\)
        - (?i)NT AUTHORITY\\SYSTEM:\(M\)
        - (?i)NT AUTHORITY\\SYSTEM:\(OI\)\(CI\)\(IO\)\(F\)
        - (?i)BUILTIN\\Administrators:\(M\)
        - (?i)BUILTIN\\Administrators:\(OI\)\(CI\)\(IO\)\(F\)
        - (?i)BUILTIN\\Users:\(RX\)
        - (?i)BUILTIN\\Users:\(OI\)\(CI\)\(IO\)\(GR,GE\)
        - (?i)CREATOR OWNER:\(OI\)\(CI\)\(IO\)\(F\)
        - (?i)APPLICATION PACKAGE AUTHORITY\\ALL APPLICATION PACKAGES:\(RX\)
        - (?i)APPLICATION PACKAGE AUTHORITY\\ALL APPLICATION PACKAGES:\(OI\)\(CI\)\(IO\)\(GR,GE\)
        - (?i)APPLICATION PACKAGE AUTHORITY\\ALL RESTRICTED APPLICATION PACKAGES:\(RX\)
        - (?i)APPLICATION PACKAGE AUTHORITY\\ALL RESTRICTED APPLICATION PACKAGES:\(OI\)\(CI\)\(IO\)\(GR,GE\)
  states:
    state-value-must-be-equal-to-0:
      state_title: Value must be equal to 0
      capability: windows.registry
      state:
        field: value
        value: '0'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-permissions-must-equal-expected-output:
      state_title: Permissions must equal expected output
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value:
            variable: required-permissions-variable
          operation: pattern match
          datatype: string
          mask: false
          variable_check: at least one
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stderr_line
          value: ''
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: none_exist
  tests:
    test-network-access-let-everyone-permissions-apply-anonymous-users-set-disabled:
      test_title: 'Network access: Let Everyone permissions apply to anonymous users is set to ''Disabled'''
      capability: windows.registry
      object: everyoneincludesanonymous-configured-object
      check_existence: at_least_one_exists
      check: only one
      states:
      - state-value-must-be-equal-to-0
    test-permissions-conform-minimum-requirements:
      test_title: Permissions must conform to minimum requirements.
      capability: independent.shellcommand
      object: run-icacls-command-against-windows-install-directory-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-permissions-must-equal-expected-output
  evaluate:
    all:
    - test: test-network-access-let-everyone-permissions-apply-anonymous-users-set-disabled
    - test: test-permissions-conform-minimum-requirements
