assessment:
  id: ng.shared.86cd37e703f4b7d1cc1aeed3
  version: 1
  assessment_title: The macOS system must disable Dictation.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'For Apple Silicon-based systems, this is not applicable. Verify the macOS system is configured to disable Dictation
    with the following command: /usr/bin/osascript -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\
    .objectForKey(''allowDictation'').js EOS If the result is not "false", this is a finding.'
  inputs: {}
  evidence: []
