assessment:
  id: ng.shared.01f65bd7a3c365b5048bd160
  version: 1
  assessment_title: Media Player - Disable Automatic Updates
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\WindowsMediaPlayer
        name:
          operation: equals
          datatype: string
          mask: false
          value: DisableAutoUpdate
  variables:
    prevent-automatic-updates-variable:
      title: Prevent Automatic Updates
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: prevent_automatic_updates_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-prevent-automatic-updates-set-enabled:
      test_title: '''Prevent Automatic Updates'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: prevent-automatic-updates-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-prevent-automatic-updates-set-enabled
