assessment:
  id: ng.shared.04a16c0525e111224ba75884
  version: 1
  assessment_title: The macOS system must enforce session lock no more than five seconds after screen saver is started.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to initiate a session lock within five seconds of the screen saver starting
    with the following command: /usr/bin/osascript -l JavaScript << EOS function run() { let delay = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName(''com.apple.screensaver'')\
    .objectForKey(''askForPasswordDelay'')) if ( delay <= 5 ) { return("true") } else { return("false") } } EOS If the result
    is not "true", this is a finding.'
  inputs: {}
  evidence: []
