assessment:
  id: ng.shared.8452d62adfe81e707b6983cb
  version: 1
  assessment_title: Exchange internal Receive connectors must require encryption.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    run-get-receiveconnector-display-authmechanism-configuration-collection:
      collection_title: Run Get-ReceiveConnector to display AuthMechanism configuration
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: add-pssnapin Microsoft.Exchange.Management.Powershell.Snapin;Get-ReceiveConnector | Select-Object -Property
            Name, Identity, AuthMechanism | Format-Table -HideTableHeaders | Out-String -Width 4096
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: \w
      behaviors:
        error_if_stderr_exists: 'true'
  tests:
    test-each-receive-connector-if-value-authmechanism-not-set-tls-this:
      test_title: For each Receive connector, if the value of AuthMechanism is not set to Tls, this is a finding.
      capability: independent.shellcommand
      collection: run-get-receiveconnector-display-authmechanism-configuration-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Verify value is Tls
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: (?i)\sTls
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-each-receive-connector-if-value-authmechanism-not-set-tls-this
