assessment:
  id: ng.shared.7dcf577bd793e6d9e1ddf1f9
  version: 1
  assessment_title: Login must not be permitted with empty/null passwords for SSH.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    permitemptypasswords-set-in-etc-ssh-sshd-config-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh
        filename:
          operation: equals
          datatype: string
          mask: false
          value: sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*[Pp][Ee][Rr][Mm][Ii][Tt][Ee][Mm][Pp][Tt][Yy][Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Ss]\s+(\S+)
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
      object_title: PermitEmptyPasswords is set in /etc/ssh/sshd_config.
  states:
    state-permitemptypasswords-is-set-to-no:
      state_title: PermitEmptyPasswords is set to no
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: 'no'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-permitemptypasswords-set-no-in-etc-ssh-sshd-config:
      test_title: PermitEmptyPasswords is set to no in /etc/ssh/sshd_config.
      capability: independent.textfilecontent54
      object: permitemptypasswords-set-in-etc-ssh-sshd-config-object
      check_existence: all_exist
      check: all
      states:
      - state-permitemptypasswords-is-set-to-no
  evaluate:
    test: test-permitemptypasswords-set-no-in-etc-ssh-sshd-config
