assessment:
  id: ng.shared.97d9da404ff59912142a6864
  version: 1
  assessment_title: WN19-MS-000120 - Windows Server 2019 "Deny log on through Remote Desktop Services" user right on domain-joined
    member servers must be configured to prevent access from highly privileged domain accounts and all local accounts and
    from unauthenticated access on all systems.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-wmi57-collection:
      collection_title: null
      capability: windows.wmi57
      select:
        namespace:
          operation: equals
          datatype: string
          mask: false
          value: root\cimv2
        wql:
          operation: equals
          datatype: string
          mask: false
          value: SELECT DomainRole FROM win32_computersystem
    windows-userright-collection:
      collection_title: null
      capability: windows.userright
      select:
        userright:
          operation: equals
          datatype: string
          mask: false
          value: SE_DENY_REMOTE_INTERACTIVE_LOGON_NAME
  tests:
    test-system-non-dc-domain-joined-windows-server-or-workstation:
      test_title: The system is a non-DC domain-joined Windows server or workstation
      capability: windows.wmi57
      collection: windows-wmi57-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: Domain Member Workstation
          capability: windows.wmi57
          state:
            field: result
            value:
              record:
              - name: domainrole
                value: '1'
                operation: equals
                datatype: string
                mask: false
                entity_check: all
            operation: equals
            datatype: record
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: Domain Member Server
          capability: windows.wmi57
          state:
            field: result
            value:
              record:
              - name: domainrole
                value: '3'
                operation: equals
                datatype: string
                mask: false
                entity_check: all
            operation: equals
            datatype: record
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-deny-log-on-through-remote-desktop-services-local-account:
      test_title: Deny log on through Remote Desktop Services - Local account
      capability: windows.userright
      collection: windows-userright-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: null
        state_capability: windows.userright
        state:
          field: trustee_name
          value: ^(?i)(NT Authority\\)?Local account$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-deny-log-on-through-remote-desktop-services-guests:
      test_title: Deny log on through Remote Desktop Services - Guests
      capability: windows.userright
      collection: windows-userright-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: null
        state_capability: windows.userright
        state:
          field: trustee_name
          value: Guests
          operation: case insensitive equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-deny-log-on-through-remote-desktop-services-domain-admins:
      test_title: Deny log on through Remote Desktop Services - Domain Admins
      capability: windows.userright
      collection: windows-userright-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: null
        state_capability: windows.userright
        state:
          field: trustee_name
          value: ^(?i)(.+\\)?Domain Admins$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-deny-log-on-through-remote-desktop-services-enterprise-admins:
      test_title: Deny log on through Remote Desktop Services - Enterprise Admins
      capability: windows.userright
      collection: windows-userright-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: null
        state_capability: windows.userright
        state:
          field: trustee_name
          value: ^(?i)(.+\\)?Enterprise Admins$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-system-standalone-windows-server-or-workstation:
      test_title: The system is a standalone Windows server or workstation
      capability: windows.wmi57
      collection: windows-wmi57-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: Standalone Workstation
          capability: windows.wmi57
          state:
            field: result
            value:
              record:
              - name: domainrole
                value: '0'
                operation: equals
                datatype: string
                mask: false
                entity_check: all
            operation: equals
            datatype: record
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: Standalone Server
          capability: windows.wmi57
          state:
            field: result
            value:
              record:
              - name: domainrole
                value: '2'
                operation: equals
                datatype: string
                mask: false
                entity_check: all
            operation: equals
            datatype: record
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    any:
    - all:
      - test: test-system-non-dc-domain-joined-windows-server-or-workstation
      - test: test-deny-log-on-through-remote-desktop-services-local-account
      - test: test-deny-log-on-through-remote-desktop-services-guests
      - test: test-deny-log-on-through-remote-desktop-services-domain-admins
      - test: test-deny-log-on-through-remote-desktop-services-enterprise-admins
    - all:
      - test: test-system-standalone-windows-server-or-workstation
      - test: test-deny-log-on-through-remote-desktop-services-guests
