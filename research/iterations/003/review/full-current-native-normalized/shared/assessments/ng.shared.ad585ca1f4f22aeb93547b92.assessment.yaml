assessment:
  id: ng.shared.ad585ca1f4f22aeb93547b92
  version: 1
  assessment_title: The macOS system must be configured to audit all changes of object attributes.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to audit all changes of object attributes with the following command:
    /usr/bin/awk -F'':'' ''/^flags/ { print $NF }'' /etc/security/audit_control | /usr/bin/tr '','' ''\n'' | /usr/bin/grep
    -Ec ''^fm'' If the result is not "1", this is a finding.'
  inputs: {}
  evidence: []
