  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that the SSH daemon uses privilege separation.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the SSH daemon performs privilege separation. Check that the SSH daemon performs privilege separation
    with the following command: # grep -i usepriv /etc/ssh/sshd_config UsePrivilegeSeparation sandbox If the "UsePrivilegeSeparation"
    keyword is set to "no", is missing, or the returned line is commented out, this is a finding.'
  inputs: {}
  evidence: []
