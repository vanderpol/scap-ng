assessment:
  id: ng.shared.52c76ab29d7be6105600c07f
  version: 1
  assessment_title: WN10-AC-000010 - The number of allowed bad logon attempts must be configured to 3 or less.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-lockoutpolicy-object:
      capability: windows.lockoutpolicy
      object_title: null
  states:
    state-lockout-threshold-is-less-than-or-equal-to-3:
      state_title: Lockout Threshold is less than or equal to 3
      capability: windows.lockoutpolicy
      state:
        field: lockout_threshold
        value: '3'
        operation: less than or equal
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
    state-lockout-threshold-is-greater-than-0:
      state_title: Lockout Threshold is greater than 0
      capability: windows.lockoutpolicy
      state:
        field: lockout_threshold
        value: '0'
        operation: greater than
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-account-lockout-threshold-set-3-or-less:
      test_title: '''Account lockout threshold'' is set to ''3'' or less'
      capability: windows.lockoutpolicy
      object: windows-lockoutpolicy-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-lockout-threshold-is-less-than-or-equal-to-3
    test-account-lockout-threshold-not-set-0:
      test_title: '''Account lockout threshold'' is not set to ''0'''
      capability: windows.lockoutpolicy
      object: windows-lockoutpolicy-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-lockout-threshold-is-greater-than-0
  evaluate:
    all:
    - test: test-account-lockout-threshold-set-3-or-less
    - test: test-account-lockout-threshold-not-set-0
