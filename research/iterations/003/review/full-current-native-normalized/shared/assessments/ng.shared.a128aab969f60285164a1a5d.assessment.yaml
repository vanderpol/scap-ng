assessment:
  id: ng.shared.a128aab969f60285164a1a5d
  version: 1
  assessment_title: WN10-SO-000150 - Anonymous enumeration of shares must be restricted.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Control\Lsa
        name:
          operation: equals
          datatype: string
          mask: false
          value: restrictanonymous
  tests:
    test-network-access-do-not-allow-anonymous-enumeration-sam-accounts-shares:
      test_title: '''Network access: Do not allow anonymous enumeration of SAM accounts and shares'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-network-access-do-not-allow-anonymous-enumeration-sam-accounts-shares
