assessment:
  id: ng.shared.ac0c20c6b0e82b76590b634b
  version: 1
  assessment_title: Ubuntu 20.04 LTS must restrict privilege elevation to authorized personnel.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system restricts privilege elevation to authorized personnel with the following command:
    $ sudo grep -iwR ''ALL'' /etc/sudoers /etc/sudoers.d/ | grep -v ''#'' If either of the following entries are returned,
    this is a finding: ALL ALL=(ALL) ALL ALL ALL=(ALL:ALL) ALL'
  inputs: []
  evidence: []
