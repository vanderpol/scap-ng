assessment:
  id: ng.shared.57603a250d9eb9cf2d7d38da
  version: 1
  assessment_title: The use of FTP must be restricted.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    smf-listing-ftp-service-collection:
      collection_title: SMF listing of FTP service.
      capability: solaris.smf
      select:
        fmri:
          operation: equals
          datatype: string
          mask: false
          value: svc://localhost/network/ftp:default
    etc-ftpd-ftpusers-entries-collection:
      collection_title: /etc/ftpd/ftpusers entries
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ftpd/ftpusers
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(.*)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    all-users-collection:
      collection_title: All users
      capability: unix.password
      select:
        username:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[^-+].*$
    system-users-collection:
      collection_title: system users
      capability: unix.password
      set:
        operator: union
        members:
        - collection: all-users-collection
        filters:
        - action: include
          match:
            field: user_id
            value: '100'
            operation: less than
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: System accounts.
          capability: unix.password
    system-users-not-contained-in-ftpusers-collection:
      collection_title: system users not contained in ftpusers
      capability: unix.password
      set:
        operator: union
        members:
        - collection: system-users-collection
        filters:
        - action: exclude
          match:
            field: username
            value:
              variable: etc-ftpd-ftpusers-entries-variable
            operation: equals
            datatype: string
            mask: false
            variable_check: at least one
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: ftpusers entry for nobody4
          capability: unix.password
  variables:
    etc-ftpd-ftpusers-entries-variable:
      title: /etc/ftpd/ftpusers entries
      kind: local
      datatype: string
      expression:
        values:
          collection: etc-ftpd-ftpusers-entries-collection
          field: subexpression
  tests:
    test-check-see-if-ftp-service-listed-under-smf:
      test_title: Check to see if the FTP service is listed under the SMF.
      capability: solaris.smf
      collection: smf-listing-ftp-service-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
    test-ftpusers-contains-aiuser:
      test_title: ftpusers contains aiuser
      capability: independent.textfilecontent54
      collection: etc-ftpd-ftpusers-entries-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: ftpusers entry for aiuser
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: aiuser
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-ftpusers-contains-noaccess:
      test_title: ftpusers contains noaccess
      capability: independent.textfilecontent54
      collection: etc-ftpd-ftpusers-entries-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: ftpusers entry for noaccess
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: noaccess
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-ftpusers-contains-nobody:
      test_title: ftpusers contains nobody
      capability: independent.textfilecontent54
      collection: etc-ftpd-ftpusers-entries-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: ftpusers entry for nobody
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: nobody
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-ftpusers-contains-nobody4:
      test_title: ftpusers contains nobody4
      capability: independent.textfilecontent54
      collection: etc-ftpd-ftpusers-entries-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: ftpusers entry for nobody4
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: nobody4
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-ftpusers-contains-all-system-users:
      test_title: ftpusers contains all system users
      capability: unix.password
      collection: system-users-not-contained-in-ftpusers-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
  evaluate:
    any:
    - test: test-check-see-if-ftp-service-listed-under-smf
    - all:
      - test: test-ftpusers-contains-aiuser
      - test: test-ftpusers-contains-noaccess
      - test: test-ftpusers-contains-nobody
      - test: test-ftpusers-contains-nobody4
      - test: test-ftpusers-contains-all-system-users
