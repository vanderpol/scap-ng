assessment:
  id: ng.shared.4fa79f24a7b7c266ea4e248d
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that all local initialization files for local
    interactive users are be group-owned by the users primary group or root.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the local initialization files of all local interactive users are group-owned by that user''s primary
    Group Identifier (GID). Check the home directory assignment for all nonprivileged users on the system with the following
    command: Note: The example will be for the smithj user, who has a home directory of "/home/smithj" and a primary group
    of "users". # awk -F: ''($4>=1000)&&($7 !~ /nologin/){print $1, $4, $6}'' /etc/passwd smithj 1000 /home/smithj # grep
    1000 /etc/group users:x:1000:smithj,jonesj,jacksons Note: This may miss interactive users that have been assigned a privileged
    User Identifier (UID). Evidence of interactive use may be obtained from a number of log files containing system logon
    information. Check the group owner of all local interactive users'' initialization files with the following command: #
    ls -al /home/smithj/.[^.]* | more -rw-------. 1 smithj users 2984 Apr 27 19:02 .bash_history -rw-r--r--. 1 smithj users
    18 Aug 21 2019 .bash_logout -rw-r--r--. 1 smithj users 193 Aug 21 2019 .bash_profile If all local interactive users''
    initialization files are not group-owned by that user''s primary GID, this is a finding.'
  inputs: []
  evidence: []
