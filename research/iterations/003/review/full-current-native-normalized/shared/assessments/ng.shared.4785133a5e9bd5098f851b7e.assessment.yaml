assessment:
  id: ng.shared.4785133a5e9bd5098f851b7e
  version: 1
  assessment_title: The macOS system must limit SSH to FIPS-compliant connections.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-ssh-fips-compliant-recommended-object-collection:
      collection_title: os_ssh_fips_compliant_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: "fips_ssh_config=(\"Ciphers aes128-gcm@openssh.com\" \"HostbasedAcceptedAlgorithms ecdsa-sha2-nistp256,ecdsa-sha2-nistp256-cert-v01@openssh.com\"\
            \ \"HostKeyAlgorithms ecdsa-sha2-nistp256-cert-v01@openssh.com,sk-ecdsa-sha2-nistp256-cert-v01@openssh.com,ecdsa-sha2-nistp256,sk-ecdsa-sha2-nistp256@openssh.com\"\
            \ \"KexAlgorithms ecdh-sha2-nistp256\" \"MACs hmac-sha2-256-etm@openssh.com,hmac-sha2-256\" \"PubkeyAcceptedAlgorithms\
            \ ecdsa-sha2-nistp256,ecdsa-sha2-nistp256-cert-v01@openssh.com,sk-ecdsa-sha2-nistp256-cert-v01@openssh.com\" \"\
            CASignatureAlgorithms ecdsa-sha2-nistp256,sk-ecdsa-sha2-nistp256@openssh.com\")\ntotal=0\nret=\"pass\"\nfor config\
            \ in $fips_ssh_config; do\n  if [[ \"$ret\" == \"fail\" ]]; then\n    break\n  fi\n  for u in $(/usr/bin/dscl\
            \ . list /users shell | /usr/bin/egrep -v '(^_)|(root)|(/usr/bin/false)' | /usr/bin/awk '{print $1}'); do\n  \
            \  sshCheck=$(/usr/bin/sudo -u $u /usr/bin/ssh -G . | /usr/bin/grep -ci \"$config\")\n    if [[ \"$sshCheck\"\
            \ == \"0\" ]]; then\n      ret=\"fail\"\n      break\n    fi\n  done\ndone\necho $ret"
  tests:
    test-os-ssh-fips-compliant-recommended-test:
      test_title: os_ssh_fips_compliant_recommended_test
      capability: independent.shellcommand
      collection: os-ssh-fips-compliant-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: os_ssh_fips_compliant_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: pass
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-os-ssh-fips-compliant-recommended-test
