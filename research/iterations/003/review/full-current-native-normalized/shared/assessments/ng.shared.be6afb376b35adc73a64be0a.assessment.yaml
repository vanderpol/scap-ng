assessment:
  id: ng.shared.be6afb376b35adc73a64be0a
  version: 1
  assessment_title: WN10-CC-000327 - PowerShell Transcription must be enabled on Windows 10.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SOFTWARE\Policies\Microsoft\Windows\PowerShell\Transcription
        name:
          operation: equals
          datatype: string
          value: EnableTranscripting
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-powershell-transcription-enabled-on-windows-11:
      test_title: PowerShell Transcription is enabled on Windows 11
      capability: windows.registry
      object: windows-registry-object
      check_existence: all_exist
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-powershell-transcription-enabled-on-windows-11
