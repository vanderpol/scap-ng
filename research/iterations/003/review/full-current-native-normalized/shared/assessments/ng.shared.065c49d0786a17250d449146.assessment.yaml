assessment:
  id: ng.shared.065c49d0786a17250d449146
  version: 1
  assessment_title: The macOS system must disable the Bluetooth system settings pane.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    system-settings-bluetooth-settings-disable-recommended-object-collection:
      collection_title: system_settings_bluetooth_settings_disable_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/bin/profiles show -output stdout-xml | /usr/bin/xmllint --xpath '//key[text()="DisabledSystemSettings"]/following-sibling::*[1]'
            - | /usr/bin/grep com.apple.BluetoothSettings
  tests:
    test-system-settings-bluetooth-settings-disable-recommended-test:
      test_title: system_settings_bluetooth_settings_disable_recommended_test
      capability: independent.shellcommand
      collection: system-settings-bluetooth-settings-disable-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: system_settings_bluetooth_settings_disable_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: .*
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-system-settings-bluetooth-settings-disable-recommended-test
