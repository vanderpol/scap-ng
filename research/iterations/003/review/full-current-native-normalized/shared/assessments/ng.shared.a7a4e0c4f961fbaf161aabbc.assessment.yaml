assessment:
  id: ng.shared.a7a4e0c4f961fbaf161aabbc
  version: 1
  assessment_title: UBTU-22-232090 - Ubuntu 22.04 LTS must configure the files used by the system journal to be owned by "root".
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    files-in-run-log-journal-recursively-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          value: /run/log/journal
        filename:
          operation: pattern match
          datatype: string
          value: .*
      filters:
      - action: include
        state: state-unix-file
      behaviors:
        recurse_direction: down
        recurse_file_system: local
      object_title: Files in /run/log/journal (recursively)
    files-in-var-log-journal-recursively-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          value: /var/log/journal
        filename:
          operation: pattern match
          datatype: string
          value: .*
      filters:
      - action: include
        state: state-unix-file
      behaviors:
        recurse_direction: down
        recurse_file_system: local
      object_title: Files in /var/log/journal (recursively)
  states:
    state-owned-by-root:
      state_title: owned by root
      capability: unix.file
      state:
        field: user_id
        value: '0'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
    state-unix-file:
      state_title: null
      capability: unix.file
      state:
        field: type
        value: regular
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-files-in-run-log-journal-recursively-owned-by-root:
      test_title: Files in /run/log/journal (recursively) are owned by root
      capability: unix.file
      object: files-in-run-log-journal-recursively-object
      check_existence: any_exist
      check: all
      states:
      - state-owned-by-root
    test-files-in-var-log-journal-recursively-owned-by-root:
      test_title: Files in /var/log/journal (recursively) are owned by root
      capability: unix.file
      object: files-in-var-log-journal-recursively-object
      check_existence: any_exist
      check: all
      states:
      - state-owned-by-root
  evaluate:
    all:
    - test: test-files-in-run-log-journal-recursively-owned-by-root
    - test: test-files-in-var-log-journal-recursively-owned-by-root
