assessment:
  id: ng.shared.f5191c876debc071d72b8aba
  version: 1
  assessment_title: The operating system must reveal error messages only to authorized personnel.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Check the permissions of the /var/adm/messages file: # ls -l /var/adm/messages Check the permissions of the
    /var/adm directory: # ls -ld /var/adm If the owner and group of /var/adm/messages is not root and the permissions are
    not 640, this is a finding. If the owner of /var/adm is not root, group is not sys, and the permissions are not 750, this
    is a finding.'
  inputs: {}
  evidence: []
