assessment:
  id: ng.shared.7f9bc864dcd42abdbe8ff65c
  version: 1
  assessment_title: WN19-DC-000040 - Windows Server 2019 Kerberos user ticket lifetime must be limited to 10 hours or less.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-wmi57-collection:
      collection_title: null
      capability: windows.wmi57
      select:
        namespace:
          operation: equals
          datatype: string
          mask: false
          value: root\rsop\computer
        wql:
          operation: equals
          datatype: string
          mask: false
          value: SELECT setting FROM RSOP_SecuritySettingNumeric WHERE KeyName='MaxTicketAge'
  tests:
    test-kerberos-policy-maximum-lifetime-user-ticket-10-hours-or-less:
      test_title: Kerberos Policy - Maximum lifetime for user ticket - 10 hours or less, but greater than 0
      capability: windows.wmi57
      collection: windows-wmi57-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: AND
        states:
        - state_title: null
          capability: windows.wmi57
          state:
            field: result
            value:
              record:
              - name: setting
                value: '10'
                operation: less than or equal
                datatype: int
                mask: false
                entity_check: all
            operation: equals
            datatype: record
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: windows.wmi57
          state:
            field: result
            value:
              record:
              - name: setting
                value: '0'
                operation: greater than
                datatype: int
                mask: false
                entity_check: all
            operation: equals
            datatype: record
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-kerberos-policy-maximum-lifetime-user-ticket-10-hours-or-less
