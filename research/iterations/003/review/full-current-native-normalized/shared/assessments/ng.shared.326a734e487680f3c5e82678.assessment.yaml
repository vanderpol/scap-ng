assessment:
  id: ng.shared.326a734e487680f3c5e82678
  version: 1
  assessment_title: OL08-00-010471 - OL 8 must enable the hardware random number generator entropy gatherer service.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-systemdunitproperty-collection:
      collection_title: null
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          mask: false
          value: rngd.service
        property:
          operation: equals
          datatype: string
          mask: false
          value: UnitFileState
    linux-systemdunitproperty-collection-2:
      collection_title: null
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          mask: false
          value: rngd.service
        property:
          operation: equals
          datatype: string
          mask: false
          value: ActiveState
  tests:
    test-rngd-service-enabled:
      test_title: rngd.service is enabled
      capability: linux.systemdunitproperty
      collection: linux-systemdunitproperty-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: linux.systemdunitproperty
        state:
          field: value
          value: enabled
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-rngd-service-active:
      test_title: rngd.service is active
      capability: linux.systemdunitproperty
      collection: linux-systemdunitproperty-collection-2
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: linux.systemdunitproperty
        state:
          field: value
          value: active
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-rngd-service-enabled
    - test: test-rngd-service-active
