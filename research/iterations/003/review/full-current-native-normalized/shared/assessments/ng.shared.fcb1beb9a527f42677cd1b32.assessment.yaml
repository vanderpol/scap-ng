assessment:
  id: ng.shared.fcb1beb9a527f42677cd1b32
  version: 1
  assessment_title: OL08-00-040070 - The OL 8 file system automounter must be disabled unless required.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-systemdunitproperty-object:
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          mask: false
          value: autofs.service
        property:
          operation: equals
          datatype: string
          mask: false
          value: ActiveState
      object_title: null
  states:
    state-linux-systemdunitproperty:
      state_title: null
      capability: linux.systemdunitproperty
      state:
        field: value
        value: inactive
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-autofs-service-activestate-inactive-if-it-exists:
      test_title: autofs.service ActiveState is inactive if it exists.
      capability: linux.systemdunitproperty
      object: linux-systemdunitproperty-object
      check_existence: any_exist
      check: all
      states:
      - state-linux-systemdunitproperty
  evaluate:
    test: test-autofs-service-activestate-inactive-if-it-exists
