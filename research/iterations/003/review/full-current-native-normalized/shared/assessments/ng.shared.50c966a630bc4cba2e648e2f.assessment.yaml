assessment:
  id: ng.shared.50c966a630bc4cba2e648e2f
  version: 1
  assessment_title: The macOS system must configure system to shut down upon audit failure.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to shut down upon audit failure with the following command: /usr/bin/awk
    -F'':'' ''/^policy/ {print $NF}'' /etc/security/audit_control | /usr/bin/tr '','' ''\n'' | /usr/bin/grep -Ec ''ahlt''
    If the result is not "1", this is a finding.'
  inputs: {}
  evidence: []
