assessment:
  id: ng.shared.bdf57617de780168f1e00fef
  version: 1
  assessment_title: UBTU-18-010134 - The Ubuntu operating system library directories must have mode 0755 or less permissive.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    lib-directory-collection:
      collection_title: /lib directory
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /lib
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
    lib64-directory-collection:
      collection_title: /lib64 directory
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /lib64
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
    usr-lib-directory-collection:
      collection_title: /usr/lib directory
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /usr/lib
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
  tests:
    test-mode-lib-directory-0755-or-less-permissive:
      test_title: Mode of /lib directory is 0755 or less permissive
      capability: unix.file
      collection: lib-directory-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Mode 0755 or less permissive
        state_capability: unix.file
        state:
          all:
          - field: suid
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: sgid
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: sticky
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: gwrite
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: owrite
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-mode-lib64-directory-0755-or-less-permissive:
      test_title: Mode of /lib64 directory is 0755 or less permissive
      capability: unix.file
      collection: lib64-directory-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Mode 0755 or less permissive
        state_capability: unix.file
        state:
          all:
          - field: suid
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: sgid
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: sticky
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: gwrite
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: owrite
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-mode-usr-lib-directory-0755-or-less-permissive:
      test_title: Mode of /usr/lib directory is 0755 or less permissive
      capability: unix.file
      collection: usr-lib-directory-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Mode 0755 or less permissive
        state_capability: unix.file
        state:
          all:
          - field: suid
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: sgid
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: sticky
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: gwrite
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: owrite
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
