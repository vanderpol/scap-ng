assessment:
  id: ng.shared.c7bd2b8118bc3a24ba59c087
  version: 1
  assessment_title: Audit Policy Subcategory Setting
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\Currentcontrolset\Control\Lsa
        name:
          operation: equals
          datatype: string
          mask: false
          value: scenoapplylegacyauditpolicy
  variables:
    audit-force-audit-policy-subcategory-settings-windows-vista-or-later-variable:
      title: 'Audit: Force audit policy subcategory settings (Windows Vista or later) to override audit policy category settings'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: override_audit_policy_settings_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-audit-force-audit-policy-subcategory-settings-windows-vista-or-later:
      test_title: '''Audit: Force audit policy subcategory settings (Windows Vista or later) to override audit policy category
        settings'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: audit-force-audit-policy-subcategory-settings-windows-vista-or-later-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-audit-force-audit-policy-subcategory-settings-windows-vista-or-later
