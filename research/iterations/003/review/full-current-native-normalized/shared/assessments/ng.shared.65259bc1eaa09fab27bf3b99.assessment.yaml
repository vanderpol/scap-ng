assessment:
  id: ng.shared.65259bc1eaa09fab27bf3b99
  version: 1
  assessment_title: The boundary protection system (firewall) must be configured to deny network traffic by default and must
    allow network traffic by exception (i.e., deny all, permit by exception).
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    svcs-firewall-default-collection:
      collection_title: svcs firewall:default
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: svcs firewall:default
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: 'svc:'
    pfctl-s-rules-collection:
      collection_title: pfctl -s rules
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: pfctl -s rules
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
    svcs-firewall-pflog-default-collection:
      collection_title: svcs firewall/pflog:default
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: svcs firewall/pflog:default
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: 'svc:'
  tests:
    test-check-that-packet-filter-firewall-enabled-configured-so-that-only:
      test_title: Check that the Packet Filter firewall is enabled and configured so that only authorized sessions are allowed.
      capability: independent.shellcommand
      collection: svcs-firewall-default-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: line returns online
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: online
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-check-that-filters-configured-properly:
      test_title: Check that the filters are configured properly.
      capability: independent.shellcommand
      collection: pfctl-s-rules-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: line exists that blocks drops and logs all
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: ^block drop log.* all$
            operation: pattern match
            datatype: string
            mask: false
            entity_check: at least one
            entity_existence: at_least_one_exists
    test-check-that-packet-filter-firewall-logging-daemon-enabled:
      test_title: Check that the Packet Filter firewall logging daemon is enabled.
      capability: independent.shellcommand
      collection: svcs-firewall-pflog-default-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: line returns online
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: online
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-check-that-packet-filter-firewall-enabled-configured-so-that-only
    - test: test-check-that-filters-configured-properly
    - test: test-check-that-packet-filter-firewall-logging-daemon-enabled
