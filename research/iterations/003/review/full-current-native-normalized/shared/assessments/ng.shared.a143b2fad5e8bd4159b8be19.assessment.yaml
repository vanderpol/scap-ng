assessment:
  id: ng.shared.a143b2fad5e8bd4159b8be19
  version: 1
  assessment_title: WN19-MS-000070 - Windows Server 2019 "Access this computer from the network" user right must only be assigned
    to the Administrators and Authenticated Users groups on domain-joined member servers and standalone or nondomain-joined
    systems.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-userright-collection:
      collection_title: null
      capability: windows.userright
      select:
        userright:
          operation: equals
          datatype: string
          mask: false
          value: SE_NETWORK_LOGON_NAME
  tests:
    test-access-this-computer-from-network-administrators-authenticated-users:
      test_title: Access this computer from the network - Administrators, Authenticated Users
      capability: windows.userright
      collection: windows-userright-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: null
          capability: windows.userright
          state:
            field: trustee_name
            value: ''
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: windows.userright
          state:
            field: trustee_name
            value: Administrators
            operation: case insensitive equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: windows.userright
          state:
            field: trustee_name
            value: Authenticated Users
            operation: case insensitive equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-access-this-computer-from-network-administrators-authenticated-users
