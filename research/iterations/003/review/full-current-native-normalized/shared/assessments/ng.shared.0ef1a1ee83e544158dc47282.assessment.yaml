assessment:
  id: ng.shared.0ef1a1ee83e544158dc47282
  version: 1
  assessment_title: Ensure gpgcheck Enabled for Local Packages
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    localpkg-gpgcheck-set-in-etc-yum-conf-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/yum.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*localpkg_gpgcheck\s*=\s*(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: localpkg_gpgcheck set in /etc/yum.conf
  states:
    state-localpkg-gpgcheck-is-enabled:
      state_title: localpkg_gpgcheck is enabled
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^(1|True|yes)$
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-check-value-localpkg-gpgcheck-in-etc-yum-conf:
      test_title: check value of localpkg_gpgcheck in /etc/yum.conf
      capability: independent.textfilecontent54
      object: localpkg-gpgcheck-set-in-etc-yum-conf-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-localpkg-gpgcheck-is-enabled
  evaluate:
    test: test-check-value-localpkg-gpgcheck-in-etc-yum-conf
