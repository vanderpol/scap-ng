assessment:
  id: ng.shared.daf59cff4c404cb3812725cb
  version: 1
  assessment_title: OL 8 must disable virtual syscalls.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    retrieve-vsyscall-param-via-grub2-editenv-collection:
      collection_title: Retrieve vsyscall param via grub2-editenv.
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: grub2-editenv list
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: vsyscall
    retrieve-grub-cmd-linux-vsyscall-param-from-etc-default-grub-collection:
      collection_title: Retrieve the GRUB_CMD_LINUX vsyscall param from /etc/default/grub
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/default/grub
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\n*\s*GRUB_CMDLINE_LINUX="(.*?)"
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-confirm-that-current-grub-2-configuration-disables-vsyscalls:
      test_title: Confirm that the current GRUB 2 configuration disables vsyscalls.
      capability: independent.shellcommand
      collection: retrieve-vsyscall-param-via-grub2-editenv-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Confirm vsyscall is set to 'none'.
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: \svsyscall\s*=\s*none\b
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-confirm-that-vsyscalls-disabled-by-default-persist-in-kernel-updates:
      test_title: Confirm that vsyscalls are disabled by default to persist in kernel updates.
      capability: independent.textfilecontent54
      collection: retrieve-grub-cmd-linux-vsyscall-param-from-etc-default-grub-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Confirm the vsyscall param is set to 'none'.
        state_capability: independent.textfilecontent54
        state:
          all:
          - field: instance
            value: '1'
            operation: greater than or equal
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: subexpression
            value: \svsyscall\s*=\s*none\b
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-confirm-that-current-grub-2-configuration-disables-vsyscalls
    - test: test-confirm-that-vsyscalls-disabled-by-default-persist-in-kernel-updates
