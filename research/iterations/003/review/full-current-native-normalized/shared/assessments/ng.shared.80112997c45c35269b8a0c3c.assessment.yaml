assessment:
  id: ng.shared.80112997c45c35269b8a0c3c
  version: 1
  assessment_title: UBTU-20-010006 - The Ubuntu operating system must map the authenticated identity to the user or group
    account for PKI-based authentication.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/pam_pkcs11/pam_pkcs11.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*use_mappers\s*=([^;]*);\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-in-etc-pam-pkcs11-pam-pkcs11-conf-list-mappers-use:
      test_title: In /etc/pam_pkcs11/pam_pkcs11.conf, the list of mappers to use includes pwent
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: \bpwent\b
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-in-etc-pam-pkcs11-pam-pkcs11-conf-list-mappers-use-2:
      test_title: In /etc/pam_pkcs11/pam_pkcs11.conf, the list of mappers to use DOES NOT include null before pwent
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: none satisfy
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: \bnull\b.*\bpwent\b
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-in-etc-pam-pkcs11-pam-pkcs11-conf-list-mappers-use
    - test: test-in-etc-pam-pkcs11-pam-pkcs11-conf-list-mappers-use-2
