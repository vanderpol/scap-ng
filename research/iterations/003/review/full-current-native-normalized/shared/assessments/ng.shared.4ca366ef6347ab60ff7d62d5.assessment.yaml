assessment:
  id: ng.shared.4ca366ef6347ab60ff7d62d5
  version: 1
  assessment_title: Exchange send connector connections count must be limited.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    run-get-transportservice-display-maxoutboundconnections-configuration-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: powershell
        command:
          operation: equals
          datatype: string
          value: add-pssnapin Microsoft.Exchange.Management.Powershell.Snapin;Get-TransportService | Select-Object -Property
            Name, Identity, MaxOutboundConnections  | Format-Table -HideTableHeaders | Out-String -Width 4096
        pattern:
          operation: equals
          datatype: string
          value: .+\s(\d+)\s*$
      behaviors:
        error_if_stderr_exists: 'true'
      object_title: Run Get-TransportService to display MaxOutboundConnections configuration
  states:
    state-verify-value-is-1000:
      state_title: Verify value is 1000
      capability: independent.shellcommand
      state:
        field: subexpression
        value: '1000'
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-if-value-maxoutboundconnections-not-set-1000-this-finding:
      test_title: If the value of MaxOutboundConnections is not set to 1000, this is a finding.
      capability: independent.shellcommand
      object: run-get-transportservice-display-maxoutboundconnections-configuration-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-verify-value-is-1000
  evaluate:
    test: test-if-value-maxoutboundconnections-not-set-1000-this-finding
