assessment:
  id: ng.shared.30201ae0bdc76094b1e3fee5
  version: 1
  assessment_title: The macOS system must configure audit log files to mode 440 or less permissive.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured with audit log files set to mode 440 or less with the following command:
    /bin/ls -l $(/usr/bin/grep ''^dir'' /etc/security/audit_control | /usr/bin/awk -F: ''{print $2}'') | /usr/bin/awk ''!/-r--r-----|current|total/{print
    $1}'' | /usr/bin/wc -l | /usr/bin/tr -d '' '' If the result is not "0", this is a finding.'
  inputs: {}
  evidence: []
