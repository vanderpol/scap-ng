assessment:
  id: ng.shared.432f626f6d4deded086d787e
  version: 1
  assessment_title: AZLX-23-001286 - Amazon Linux 2023 must implement DOD-approved encryption in the bind package.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    named-conf-includes-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/named.conf
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*include\s+"(.*)"\s*;\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: named.conf includes
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: /etc/crypto-policies/back-ends/bind.config
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-named-conf-includes-crypto-policy:
      test_title: named.conf includes crypto-policy
      capability: independent.textfilecontent54
      object: named-conf-includes-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-independent-textfilecontent54
  evaluate:
    test: test-named-conf-includes-crypto-policy
