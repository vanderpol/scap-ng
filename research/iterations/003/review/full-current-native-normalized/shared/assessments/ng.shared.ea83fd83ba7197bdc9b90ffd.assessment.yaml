assessment:
  id: ng.shared.ea83fd83ba7197bdc9b90ffd
  version: 1
  assessment_title: UBTU-22-651020 - Ubuntu 22.04 LTS must notify designated personnel if baseline configurations are changed
    in an unauthorized manner. The file integrity tool must notify the system administrator when changes to the baseline configuration
    or anomalies in the operation of any security functions are discovered.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/default/aide
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: (?i)^\s*SILENTREPORTS\s*=\s*(\w+)\s*(?:#.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-etc-default-aide-silentreports-no:
      test_title: '/etc/default/aide: SILENTREPORTS=no'
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^(no|"no")$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-etc-default-aide-silentreports-no
