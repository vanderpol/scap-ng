assessment:
  id: ng.shared.79e39f4ed5d2384b0f8b0ca6
  version: 1
  assessment_title: The Active Directory Domain Controllers Organizational Unit (OU) object must have the proper access control
    permissions.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    analyze-domain-controllers-ou-permissions-return-details-on-any-failures-collection:
      collection_title: Analyze the Domain Controllers OU permissions and return details on any failures
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: Import-Module GroupPolicy; Import-Module ActiveDirectory; if (-not (Get-PSDrive -Name AD -ErrorAction SilentlyContinue))
            { New-PSDrive -Name AD -PSProvider ActiveDirectory -Root "" -ErrorAction SilentlyContinue | Out-Null }; $dn =
            ([ADSI]"").distinguishedName; $AdminGroupRegex = 'SYSTEM|Domain Admins|Enterprise Admins|Builtin\\Administrators|Administrators|CREATOR
            OWNER|SELF|Key Admins|Enterprise Key Admins|Exchange Enterprise Servers|Exchange Servers|Exchange Windows Permissions|Exchange
            Trusted Subsystem'; $ModRightsRegex = 'Write|CreateChild|DeleteChild|GenericAll|GenericWrite|Delete'; $f = Get-Acl
            -Path "AD:OU=Domain Controllers,$dn" | Select-Object -ExpandProperty Access | Where-Object { $_.AccessControlType
            -eq 'Allow' -and $_.IdentityReference -notmatch $AdminGroupRegex -and $_.ActiveDirectoryRights.ToString() -match
            $ModRightsRegex } | Select-Object @{Name='IdentityReference';Expression={$_.IdentityReference.ToString()}}, @{Name='ActiveDirectoryRights';Expression={$_.ActiveDirectoryRights.ToString()}}
            -Unique | ForEach-Object { [PSCustomObject]@{ GPO = 'Domain Controllers OU'; Status = 'FAIL'; Reason = "Unauthorized
            Trustee '$($_.IdentityReference)' holds '$($_.ActiveDirectoryRights)' modification rights." } }; if ($f) { $f
            | Format-Table -AutoSize | Out-String -Width 4096 } else { [PSCustomObject]@{ GPO = 'Domain Controllers OU'; Status
            = 'PASS'; Reason = 'Delegation securely restricted to authorized administrative groups on Domain Controllers OU.'
            } | Format-Table -AutoSize | Out-String -Width 4096 }
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: .+
      behaviors:
        error_if_stderr_exists: 'true'
  tests:
    test-windows-server-active-directory-domain-controllers-organizational-unit-ou-object:
      test_title: Windows Server Active Directory Domain Controllers Organizational Unit (OU) object must have the proper
        access control permissions.
      capability: independent.shellcommand
      collection: analyze-domain-controllers-ou-permissions-return-details-on-any-failures-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: No lines shall exist listed with status of 'FAIL'
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: ' FAIL '
          operation: pattern match
          datatype: string
          mask: false
          entity_check: none satisfy
          entity_existence: at_least_one_exists
  evaluate:
    test: test-windows-server-active-directory-domain-controllers-organizational-unit-ou-object
