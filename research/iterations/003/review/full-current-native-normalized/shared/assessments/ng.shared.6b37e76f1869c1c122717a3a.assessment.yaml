assessment:
  id: ng.shared.6b37e76f1869c1c122717a3a
  version: 1
  assessment_title: OL08-00-010543 - OL 8 must use a separate file system for "/tmp".
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-partition-object:
      capability: linux.partition
      select:
        mount_point:
          operation: equals
          datatype: string
          value: /tmp
      object_title: null
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/fstab
        pattern:
          operation: pattern match
          datatype: string
          value: ^[^# \t]+\s+/tmp\s+
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states: {}
  tests:
    test-there-separate-file-system-tmp:
      test_title: There is a separate file system for /tmp.
      capability: linux.partition
      object: linux-partition-object
      check_existence: all_exist
      check: all
    test-there-separate-file-system-configured-tmp:
      test_title: There is a separate file system configured for /tmp.
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: all_exist
      check: all
  evaluate:
    all:
    - test: test-there-separate-file-system-tmp
    - test: test-there-separate-file-system-configured-tmp
