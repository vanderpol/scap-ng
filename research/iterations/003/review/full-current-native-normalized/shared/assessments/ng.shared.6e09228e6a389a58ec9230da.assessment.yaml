assessment:
  id: ng.shared.6e09228e6a389a58ec9230da
  version: 1
  assessment_title: OL 8 library directories must have mode 755 or less permissive.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the system-wide shared library directories within "/lib", "/lib64", "/usr/lib" and "/usr/lib64" have
    mode "755" or less permissive with the following command: $ sudo find /lib /lib64 /usr/lib /usr/lib64 -perm /022 -type
    d -exec stat -c "%n %a" ''{}'' \; If any system-wide shared library directories are found to be group-writable or world-writable,
    this is a finding.'
  inputs: []
  evidence: []
