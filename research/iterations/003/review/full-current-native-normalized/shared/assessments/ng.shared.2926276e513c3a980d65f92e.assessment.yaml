assessment:
  id: ng.shared.2926276e513c3a980d65f92e
  version: 1
  assessment_title: Everyone Anonymous Rights
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Control\Lsa
        name:
          operation: equals
          datatype: string
          mask: false
          value: EveryoneIncludesAnonymous
  variables:
    network-access-let-everyone-permissions-apply-anonymous-users-variable:
      title: 'Network access: Let Everyone permissions apply to anonymous users'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: let_everyone_permissions_apply_to_anonymous_users_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-network-access-let-everyone-permissions-apply-anonymous-users-set-disabled:
      test_title: '''Network access: Let Everyone permissions apply to anonymous users'' is set to ''Disabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: network-access-let-everyone-permissions-apply-anonymous-users-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-network-access-let-everyone-permissions-apply-anonymous-users-set-disabled
