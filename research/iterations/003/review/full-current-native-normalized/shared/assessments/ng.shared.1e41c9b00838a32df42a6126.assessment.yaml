assessment:
  id: ng.shared.1e41c9b00838a32df42a6126
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that the SSH daemon does not permit Generic Security
    Service Application Program Interface (GSSAPI) authentication unless needed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the SSH daemon does not permit GSSAPI authentication unless approved. Check that the SSH daemon does
    not permit GSSAPI authentication with the following command: # grep -i gssapiauth /etc/ssh/sshd_config GSSAPIAuthentication
    no If the "GSSAPIAuthentication" keyword is missing, is set to "yes" and is not documented with the Information System
    Security Officer (ISSO), or the returned line is commented out, this is a finding.'
  inputs: []
  evidence: []
