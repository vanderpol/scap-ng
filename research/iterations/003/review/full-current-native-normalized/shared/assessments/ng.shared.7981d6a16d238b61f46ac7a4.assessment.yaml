assessment:
  id: ng.shared.7981d6a16d238b61f46ac7a4
  version: 1
  assessment_title: The macOS system must enforce multifactor authentication for the su command.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to enforce multifactor authentication for the su command with the following
    command: /usr/bin/grep -Ec ''^(auth\s+sufficient\s+pam_smartcard.so|auth\s+required\s+pam_rootok.so)'' /etc/pam.d/su If
    the result is not "2", this is a finding.'
  inputs: {}
  evidence: []
