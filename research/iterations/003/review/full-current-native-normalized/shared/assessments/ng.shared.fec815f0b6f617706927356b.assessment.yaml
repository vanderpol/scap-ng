assessment:
  id: ng.shared.fec815f0b6f617706927356b
  version: 1
  assessment_title: Windows Server 2019 must limit the caching of logon credentials to four or less on domain-joined member
    servers.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This applies to member servers. For domain controllers and standalone or nondomain-joined systems, this is NA.
    If the following registry value does not exist or is not configured as specified, this is a finding: Registry Hive: HKEY_LOCAL_MACHINE
    Registry Path: \SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\ Value Name: CachedLogonsCount Value Type: REG_SZ
    Value: 4 (or less)'
  inputs: {}
  evidence: []
