assessment:
  id: ng.shared.93d161f78ab7a60f47ccdf38
  version: 1
  assessment_title: OL 8 systems, versions 8.2 and above, must ensure account lockouts persist.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    test-etc-security-faillock-conffor-dir-parameter-collection:
      collection_title: Test /etc/security/faillock.conffor dir parameter.
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/security/faillock.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*dir\s*=\s*\S+\s*\b
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-ensure-account-lockouts-persist-test-etc-pam-d-password-auth:
      test_title: Ensure account lockouts persist. Test /etc/pam.d/password-auth pam_faillock.so preauth line for dir parameter.
      capability: independent.textfilecontent54
      collection: test-etc-security-faillock-conffor-dir-parameter-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Check dir is not commented out.
        state_capability: independent.textfilecontent54
        state:
          field: text
          value: ^\s*dir\s*=\s*\S+
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-ensure-account-lockouts-persist-test-etc-pam-d-password-auth
