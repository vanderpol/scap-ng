assessment:
  id: ng.shared.19eb4b72e0ffcdfbdcf3e1ed
  version: 1
  assessment_title: Microsoft IIS 8.5
  mode: automated
  class: inventory
  purpose: applicability
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    iis-version-string-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: Software\Microsoft\InetStp
        name:
          operation: equals
          datatype: string
          value: VersionString
      object_title: IIS Version String
  states:
    state-value-equal-to-8-5:
      state_title: Value Equal To 8.5
      capability: windows.registry
      state:
        field: value
        value: Version 8.5
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-microsoft-iis-8-5-installed:
      test_title: Microsoft IIS 8.5 is installed
      capability: windows.registry
      object: iis-version-string-object
      check_existence: at_least_one_exists
      check: only one
      states:
      - state-value-equal-to-8-5
  evaluate:
    test: test-microsoft-iis-8-5-installed
