assessment:
  id: ng.shared.4f0f1526849a104b57f182a1
  version: 1
  assessment_title: The Oracle Linux operating system must audit all uses of the userhelper command.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system generates audit records when successful/unsuccessful attempts to use the "userhelper"
    command occur. Check the file system rule in "/etc/audit/audit.rules" with the following command: $ sudo grep -w "/usr/sbin/userhelper"
    /etc/audit/audit.rules -a always,exit -F path=/usr/sbin/userhelper -F perm=x -F auid>=1000 -F auid!=unset -k privileged-passwd
    If the command does not return any output, this is a finding.'
  inputs: []
  evidence: []
