assessment:
  id: ng.shared.c123e90aa93014fca99eeffb
  version: 1
  assessment_title: The operating system session lock mechanism, when activated on a device with a display screen, must place
    a publicly viewable pattern onto the associated display, hiding what was previously visible on the screen.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'For Solaris 11, 11.1, 11.2, and 11.3: In the GNOME 2 desktop System >> Preferences >> Screensaver. For Solaris
    11.4 or newer: If using the default GNOME desktop: Activities >> Show Applications >> select "Screensaver" icon. If using
    the GNOME Classic desktop: Applications >> Other >> Screensaver menu item the user can select other screens or disable
    screensaver. Check that "Disable Screensaver" is not selected in the Gnome Screensaver preferences. If "Disable Screensaver"
    is selected or "Blank Screen Only" is not selected, this is a finding.'
  inputs: {}
  evidence: []
