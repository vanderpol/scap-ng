assessment:
  id: ng.shared.4e6392910d1711273327b24e
  version: 1
  assessment_title: UBTU-22-611070 - Ubuntu 22.04 LTS must encrypt all stored passwords with a FIPS 140-3-approved cryptographic
    hashing algorithm.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    etc-login-defs-encrypt-method-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/login.defs
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*ENCRYPT_METHOD\s+([^#\r\n]*)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: /etc/login.defs:ENCRYPT_METHOD
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: SHA512
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-etc-login-defs-encrypt-method-sha512:
      test_title: /etc/login.defs:ENCRYPT_METHOD >= SHA512
      capability: independent.textfilecontent54
      object: etc-login-defs-encrypt-method-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    test: test-etc-login-defs-encrypt-method-sha512
