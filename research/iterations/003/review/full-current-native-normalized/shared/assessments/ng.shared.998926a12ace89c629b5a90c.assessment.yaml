assessment:
  id: ng.shared.998926a12ace89c629b5a90c
  version: 1
  assessment_title: The macOS system must automatically remove or disable temporary or emergency user accounts within 72 hours.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that a password policy is enforced by a directory service by asking the system administrator (SA) or
    information system security officer (ISSO). If no policy is enforced by a directory service, a password policy can be
    set with the "pwpolicy" utility. The variable names may vary depending on how the policy was set. If no temporary or emergency
    accounts are defined on the system, this is not applicable. To check if the password policy is configured to disable a
    temporary or emergency account after 72 hours, run the following command to output the password policy to the screen,
    substituting the correct user name in place of username: /usr/bin/pwpolicy -u username getaccountpolicies | tail -n +2
    If there is no output, and password policy is not controlled by a directory service, this is a finding. Otherwise, look
    for the line "<key>policyCategoryAuthentication</key>". In the array that follows, there should be a <dict> section that
    contains a check <string> that allows users to log in if "policyAttributeCurrentTime" is less than the result of adding
    "policyAttributeCreationTime" to 72 hours (259299 seconds). The check might use a variable defined in its "policyParameters"
    section. If the check does not exist or if the check adds too great an amount of time to "policyAttributeCreationTime",
    this is a finding.'
  inputs: []
  evidence: []
