assessment:
  id: ng.shared.d75e07ebe79aa89c638cb38a
  version: 1
  assessment_title: SQL Server must configure Customer Feedback and Error Reporting.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    find-all-customerfeedback-values-under-hkey-local-machine-software-microsoft-collection:
      collection_title: Find all of the CustomerFeedback values under HKEY_LOCAL_MACHINE\Software\Microsoft\Microsoft SQL
        Server'.
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Microsoft\Microsoft SQL Server
        name:
          operation: equals
          datatype: string
          mask: false
          value: CustomerFeedback
      behaviors:
        max_depth: '-1'
        recurse_direction: down
    find-all-enableerrorreporting-values-under-hkey-local-machine-software-microsoft-collection:
      collection_title: Find all of the EnableErrorReporting values under HKEY_LOCAL_MACHINE\Software\Microsoft\Microsoft
        SQL Server'.
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Microsoft\Microsoft SQL Server
        name:
          operation: equals
          datatype: string
          mask: false
          value: EnableErrorReporting
      behaviors:
        max_depth: '-1'
        recurse_direction: down
  tests:
    test-verify-if-customer-feedback-disabled:
      test_title: Verify if Customer Feedback is Disabled
      capability: windows.registry
      collection: find-all-customerfeedback-values-under-hkey-local-machine-software-microsoft-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Registry key dword value equals 0
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-verify-if-error-reporting-disabled:
      test_title: Verify if Error Reporting is Disabled
      capability: windows.registry
      collection: find-all-enableerrorreporting-values-under-hkey-local-machine-software-microsoft-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Registry key dword value equals 0
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-verify-if-customer-feedback-disabled
    - test: test-verify-if-error-reporting-disabled
