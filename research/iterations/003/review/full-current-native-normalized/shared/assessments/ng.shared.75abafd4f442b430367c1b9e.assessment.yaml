assessment:
  id: ng.shared.75abafd4f442b430367c1b9e
  version: 1
  assessment_title: UBTU-18-010032 - The Ubuntu operating system must display the date and time of the last successful account
    logon upon logon.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/pam.d/login
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*session\s+required\s+pam_lastlog\.so\s+(?:\w+\s+)*showfailed\b\s*(?:\w+\b\s*)*\s*(?:#.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: null
    independent-textfilecontent54-object-2:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/pam.d/login
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*session\s+required\s+pam_lastlog\.so\s+(?:\w+\s+)*silent\b\s*(?:\w+\b\s*)*\s*(?:#.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: null
  states: {}
  tests:
    test-pam-lastlog-used-showfailed-option:
      test_title: pam_lastlog is used with showfailed option
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
    test-pam-lastlog-used-silent-option:
      test_title: pam_lastlog is used with the silent option
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-2
      check_existence: at_least_one_exists
      check: all
  evaluate:
    all:
    - test: test-pam-lastlog-used-showfailed-option
    - not:
        test: test-pam-lastlog-used-silent-option
