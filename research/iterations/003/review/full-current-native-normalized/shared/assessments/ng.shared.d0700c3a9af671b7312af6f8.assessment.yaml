assessment:
  id: ng.shared.d0700c3a9af671b7312af6f8
  version: 1
  assessment_title: WN10-CC-000130 - Local users on domain-joined computers must not be enumerated.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\Windows\System
        name:
          operation: equals
          datatype: string
          mask: false
          value: EnumerateLocalUsers
  tests:
    test-enumerate-local-users-on-domain-joined-computers-set-disabled:
      test_title: '''Enumerate local users on domain-joined computers'' is set to ''Disabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-enumerate-local-users-on-domain-joined-computers-set-disabled
