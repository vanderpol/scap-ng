assessment:
  id: ng.shared.d25add10960b4e5567abb361
  version: 1
  assessment_title: WN11-UR-000100 - The "Force shutdown from a remote system" user right must only be assigned to the Administrators
    group.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-userright-collection:
      collection_title: null
      capability: windows.userright
      select:
        userright:
          operation: equals
          datatype: string
          mask: false
          value: SE_REMOTE_SHUTDOWN_NAME
  tests:
    test-force-shutdown-from-remote-system-administrators:
      test_title: Force shutdown from a remote system - Administrators
      capability: windows.userright
      collection: windows-userright-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: null
          capability: windows.userright
          state:
            field: trustee_name
            value: ''
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: windows.userright
          state:
            field: trustee_name
            value: Administrators
            operation: case insensitive equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-force-shutdown-from-remote-system-administrators
