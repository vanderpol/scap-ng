assessment:
  id: ng.shared.b3806f4cfc6616a911b259f2
  version: 1
  assessment_title: OL 8 must allocate an "audit_backlog_limit" of sufficient size to capture processes that start prior to
    the audit daemon.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    retrieve-audit-backlog-limit-from-grub2-editenv-collection:
      collection_title: Retrieve audit_backlog_limit from grub2-editenv.
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: grub2-editenv list
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: kernelopts=.*?\saudit_backlog_limit=(\d+)\b
    retrieve-audit-backlog-limit-from-etc-default-grub-collection:
      collection_title: Retrieve audit_backlog_limit from '/etc/default/grub'.
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/default/grub
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*GRUB_CMDLINE_LINUX=".*?audit_backlog_limit=(\d+)\b
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-confirm-grub2-editenv-audit-backlog-limit-set-8192-or-greater:
      test_title: Confirm the grub2-editenv 'audit_backlog_limit' is set to '8192' or greater.
      capability: independent.shellcommand
      collection: retrieve-audit-backlog-limit-from-grub2-editenv-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Confirm appropriate audit_backlog_limit.
        state_capability: independent.shellcommand
        state:
          field: subexpression
          value: ^[1-9]\d\d\d\d+|9\d\d\d|8[2-9]\d\d|819[2-9]$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-confirm-grub-configured-audit-backlog-limit-set-8192-or-greater:
      test_title: Confirm grub is configured with 'audit_backlog_limit' set to '8192' or greater.
      capability: independent.textfilecontent54
      collection: retrieve-audit-backlog-limit-from-etc-default-grub-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Confirm appropriate audit_backlog_limit.
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^[1-9]\d\d\d\d+|9\d\d\d|8[2-9]\d\d|819[2-9]$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-confirm-grub2-editenv-audit-backlog-limit-set-8192-or-greater
    - test: test-confirm-grub-configured-audit-backlog-limit-set-8192-or-greater
