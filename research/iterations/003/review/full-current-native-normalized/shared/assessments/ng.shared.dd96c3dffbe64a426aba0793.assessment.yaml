assessment:
  id: ng.shared.dd96c3dffbe64a426aba0793
  version: 1
  assessment_title: OL07-00-010119 - The Oracle Linux operating system must be configured so that when passwords are changed
    or new passwords are established, pwquality must be used.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    in-etc-pam-d-system-auth-check-pam-pwquality-so-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/pam.d/system-auth
        pattern:
          operation: pattern match
          datatype: string
          value: ^[ \t]*password[ \t]+(?:(?:required)|(?:requisite))[ \t]+pam_pwquality\.so(?:[ \t]+|(?:[ \t][^#\r\f\n]+[
            \t]+))retry=([0-9]+)(?:\s|$)
        instance:
          operation: equals
          datatype: int
          value: '1'
      object_title: in /etc/pam.d/system-auth check for pam_pwquality.so retry equals value
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^[123]$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-etc-pam-d-system-auth-retry-not-greater-than-3:
      test_title: /etc/pam.d/system-auth:retry not greater than 3 and not 0
      capability: independent.textfilecontent54
      object: in-etc-pam-d-system-auth-check-pam-pwquality-so-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    test: test-etc-pam-d-system-auth-retry-not-greater-than-3
