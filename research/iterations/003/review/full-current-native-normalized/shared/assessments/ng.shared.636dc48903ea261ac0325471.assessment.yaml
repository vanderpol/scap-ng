assessment:
  id: ng.shared.636dc48903ea261ac0325471
  version: 1
  assessment_title: WN10-CC-000326 - PowerShell script block logging must be enabled on Windows 10.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: case insensitive equals
          datatype: string
          value: SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging
        name:
          operation: case insensitive equals
          datatype: string
          value: EnableScriptBlockLogging
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-turn-on-powershell-script-block-logging-set-enabled:
      test_title: '''Turn on PowerShell Script Block Logging'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-turn-on-powershell-script-block-logging-set-enabled
