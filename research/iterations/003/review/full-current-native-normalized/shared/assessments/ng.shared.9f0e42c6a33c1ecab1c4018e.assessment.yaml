  version: 1
  assessment_title: AZLX-23-001285 - Amazon Linux 2023 crypto policy must not be overridden.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    bind-collection:
      collection_title: bind
      capability: unix.symlink
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/crypto-policies/back-ends/bind.config
