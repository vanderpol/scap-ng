assessment:
  id: ng.shared.5ebafe2c64d59216ceb5c024
  version: 1
  assessment_title: The Cisco router must be configured to send log data to at least two syslog servers for the purpose of
    forwarding alerts to the administrators and the information system security officer (ISSO).
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    iosxe-line-collection:
      collection_title: null
      capability: iosxe.line
      select:
        show_subcommand:
          operation: equals
          datatype: string
          mask: false
          value: show running-config
  tests:
    test-check-two-logging-servers:
      test_title: Check for two logging servers
      capability: iosxe.line
      collection: iosxe-line-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: Check for two logging statements
        state_capability: iosxe.line
        state:
          all:
          - field: show_subcommand
            value: show running-config
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: config_line
            value: \nlogging .+\nlogging .+
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-check-two-logging-servers
