assessment:
  id: ng.shared.65a90d41ba46d29da04c2bc2
  version: 1
  assessment_title: The Active Directory Domain Controllers Organizational Unit (OU) object must be configured with proper
    audit settings.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    query-both-fail-success-auditing-settings-domain-controllers-organizational-unit-collection:
      collection_title: Query both Fail and Success auditing settings for Domain Controllers Organizational Unit (OU)
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: '$domain = Get-ADDomain; $path = ''AD:\'' + $domain.DomainControllersContainer; $aud = (Get-Acl $path -Audit).Audit;
            $hasFail = [bool]($aud | Where-Object {$_.IdentityReference -match ''Everyone|S-1-1-0'' -and $_.AuditFlags -eq
            ''Failure'' -and ($_.ActiveDirectoryRights -match ''GenericAll|FullControl|All'') -and $_.InheritanceType -eq
            ''All'' -and $_.IsInherited -eq $false}); $hasSuccSelf = [bool]($aud | Where-Object {$_.IdentityReference -match
            ''Everyone|S-1-1-0'' -and $_.AuditFlags -eq ''Success'' -and $_.InheritanceType -eq ''None'' -and $_.IsInherited
            -eq $false}); $hasSuccDesc = [bool]($aud | Where-Object {$_.IdentityReference -match ''Everyone|S-1-1-0'' -and
            $_.AuditFlags -eq ''Success'' -and ($_.ActiveDirectoryRights -match ''WriteProperty|WriteAllProperties'') -and
            $_.InheritanceType -eq ''All'' -and $_.IsInherited -eq $false}); . { $t = $path.Replace(''AD:\'',''''); if (-not
            $hasFail -or -not $hasSuccSelf -or -not $hasSuccDesc) { $reasons = @(); if (-not $hasFail) { $reasons += ''MISSING:
            Explicit Everyone : Failure : FullControl [Applies to: All Descendant Objects]'' }; if (-not $hasSuccSelf) { $reasons
            += ''MISSING: Explicit Everyone : Success : Special [Applies to: This Object Only]'' }; if (-not $hasSuccDesc)
            { $reasons += ''MISSING: Explicit Everyone : Success : Write all properties [Applies to: All Descendant Objects]''
            }; ''Target_Object='' + $t + '' | IdentityReference=Everyone (S-1-1-0) | Status=FAIL | Details='' + ($reasons
            -join '' ; '') } else { ''Target_Object='' + $t + '' | IdentityReference=Everyone (S-1-1-0) | Status=PASS | Details=All
            mandatory Failure and Success audit entries and scopes are correctly configured per SV-254404r958732.'' } }'
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: .+
      behaviors:
        error_if_stderr_exists: 'true'
  tests:
    test-windows-server-active-directory-domain-controllers-organizational-unit-ou-object:
      test_title: Windows Server Active Directory Domain Controllers Organizational Unit (OU) object must be configured with
        proper audit settings.
      capability: independent.shellcommand
      collection: query-both-fail-success-auditing-settings-domain-controllers-organizational-unit-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: No lines shall exist listed with status of 'FAIL'
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: '=FAIL '
          operation: pattern match
          datatype: string
          mask: false
          entity_check: none satisfy
          entity_existence: at_least_one_exists
  evaluate:
    test: test-windows-server-active-directory-domain-controllers-organizational-unit-ou-object
