  assessment_title: The macOS system must enforce installation of XProtect Remediator and Gatekeeper updates automatically.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to enforce installation of XProtect Remediator and Gatekeeper updates
    automatically with the following command: /usr/bin/osascript -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.SoftwareUpdate'')\
    .objectForKey(''ConfigDataInstall'').js EOS If the result is not "true", this is a finding.'
