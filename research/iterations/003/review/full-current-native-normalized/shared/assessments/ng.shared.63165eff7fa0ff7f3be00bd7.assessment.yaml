assessment:
  id: ng.shared.63165eff7fa0ff7f3be00bd7
  version: 1
  assessment_title: The NIS package must not be installed.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    pkg-info-service-network-nis-collection:
      collection_title: pkg info service/network/nis
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: pkg info service/network/nis
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
  tests:
    test-nis-package-not-installed:
      test_title: The NIS package must not be installed.
      capability: independent.shellcommand
      collection: pkg-info-service-network-nis-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: stdout_line should not exist
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: ''
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: none_exist
  evaluate:
    test: test-nis-package-not-installed
