assessment:
  id: ng.shared.f1d7b12611a4ab16d897809c
  version: 1
  assessment_title: Exchange receive connector maximum hop count must be 60.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    run-get-receiveconnector-display-maxhopcount-configuration-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: add-pssnapin Microsoft.Exchange.Management.Powershell.Snapin;Get-ReceiveConnector | Select-Object -Property
            Name, Identity, MaxHopCount  | Format-Table -HideTableHeaders | Out-String -Width 4096
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: \w
      behaviors:
        error_if_stderr_exists: 'true'
      object_title: Run Get-ReceiveConnector to display MaxHopCount configuration
  states:
    state-verify-value-is-60:
      state_title: Verify value is 60
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: (?i)60$
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-each-receive-connector-if-value-maxhopcount-not-set-60-this:
      test_title: For each Receive connector, if the value of MaxHopCount is not set to 60, this is a finding.
      capability: independent.shellcommand
      object: run-get-receiveconnector-display-maxhopcount-configuration-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-verify-value-is-60
  evaluate:
    test: test-each-receive-connector-if-value-maxhopcount-not-set-60-this
