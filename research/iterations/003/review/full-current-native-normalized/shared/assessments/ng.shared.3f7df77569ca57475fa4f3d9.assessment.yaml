assessment:
  id: ng.shared.3f7df77569ca57475fa4f3d9
  version: 1
  assessment_title: The macOS system must disable the guest account.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable the guest account with the following command: /usr/bin/osascript
    -l JavaScript << EOS function run() { let pref1 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName(''com.apple.MCX'')\
    .objectForKey(''DisableGuestAccount'')) let pref2 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName(''com.apple.MCX'')\
    .objectForKey(''EnableGuestAccount'')) if ( pref1 == true && pref2 == false ) { return("true") } else { return("false")
    } } EOS If the result is not "true", this is a finding.'
  inputs: []
  evidence: []
