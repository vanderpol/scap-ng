assessment:
  id: ng.shared.2f7cd960f81ea018f66234bb
  version: 1
  assessment_title: The SUSE operating system must use a file integrity tool to verify correct operation of all security functions.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that Advanced Intrusion Detection Environment (AIDE) is installed and verifies the correct operation
    of all security functions. Check that the AIDE package is installed with the following command: $ sudo zypper if aide
    | grep "Installed" Installed: Yes If AIDE is not installed, ask the System Administrator how file integrity checks are
    performed on the system. If there is no application installed to perform integrity checks, this is a finding. If AIDE
    is installed, check if it has been initialized with the following command: $ sudo aide --check If the output is "Couldn''t
    open file /var/lib/aide/aide.db for reading", this is a finding.'
  inputs: {}
  evidence: []
