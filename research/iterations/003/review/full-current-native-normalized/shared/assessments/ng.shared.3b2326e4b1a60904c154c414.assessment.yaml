assessment:
  id: ng.shared.3b2326e4b1a60904c154c414
  version: 1
  assessment_title: The operating system must monitor for unauthorized connections of mobile devices to organizational information
    systems.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-information-collection:
      collection_title: OS information
      capability: unix.uname
    etc-zones-index-collection:
      collection_title: /etc/zones/index
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/zones/index
    etc-zones-index-global-entry-collection:
      collection_title: /etc/zones/index global entry
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/zones/index
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: '^global:'
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    var-share-zones-index-json-collection:
      collection_title: /var/share/zones/index.json
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /var/share/zones/index.json
    var-share-zones-index-json-path-collection:
      collection_title: /var/share/zones/index.json 'path:/'
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /var/share/zones/index.json
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: '"path":\s+"/"'
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    etc-system-file-collection:
      collection_title: The /etc/system file.
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/system
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*exclude:\s*scsa2usb\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    etc-system-d-files-collection:
      collection_title: /etc/system.d files.
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/system.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*exclude:\s*scsa2usb\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-solaris-less-than-11-4:
      test_title: Solaris (less than) 11.4
      capability: unix.uname
      collection: os-information-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: 11.3 or less.
        state_capability: unix.uname
        state:
          field: os_version
          value: ^11($|\.[0-3]\b)
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-etc-zones-index-does-not-exist:
      test_title: /etc/zones/index does not exist
      capability: unix.file
      collection: etc-zones-index-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
    test-etc-zones-index-contains-global:
      test_title: /etc/zones/index contains global
      capability: independent.textfilecontent54
      collection: etc-zones-index-global-entry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
    test-var-share-zones-index-json-does-not-exist:
      test_title: /var/share/zones/index.json does not exist
      capability: unix.file
      collection: var-share-zones-index-json-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
    test-var-share-zones-index-json-does-not-contain-path:
      test_title: /var/share/zones/index.json does not contain 'path:/'
      capability: independent.textfilecontent54
      collection: var-share-zones-index-json-path-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
    test-determine-if-usb-mass-storage-devices-locked-out-by-kernel:
      test_title: Determine if USB mass storage devices are locked out by the kernel in /etc/system.
      capability: independent.textfilecontent54
      collection: etc-system-file-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
    test-determine-if-usb-mass-storage-devices-locked-out-by-kernel-2:
      test_title: Determine if USB mass storage devices are locked out by the kernel in /etc/system.d/*.
      capability: independent.textfilecontent54
      collection: etc-system-d-files-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    any:
    - not:
        all:
        - any:
          - not:
              test: test-solaris-less-than-11-4
          - any:
            - test: test-etc-zones-index-does-not-exist
            - test: test-etc-zones-index-contains-global
        - any:
          - test: test-solaris-less-than-11-4
          - any:
            - test: test-var-share-zones-index-json-does-not-exist
            - test: test-var-share-zones-index-json-does-not-contain-path
    - test: test-determine-if-usb-mass-storage-devices-locked-out-by-kernel
    - test: test-determine-if-usb-mass-storage-devices-locked-out-by-kernel-2
