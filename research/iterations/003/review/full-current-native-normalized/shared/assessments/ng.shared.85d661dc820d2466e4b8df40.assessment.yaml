assessment:
  id: ng.shared.85d661dc820d2466e4b8df40
  version: 1
  assessment_title: Windows Server 2016 password history must be configured to 24 passwords remembered.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy
    >> Computer Configuration >> Windows Settings >> Security Settings >> Account Policies >> Password Policy. If the value
    for "Enforce password history" is less than "24" passwords remembered, this is a finding. For server core installations,
    run the following command: Secedit /Export /Areas SecurityPolicy /CFG C:\Path\FileName.Txt If "PasswordHistorySize" is
    less than "24" in the file, this is a finding.'
  inputs: []
  evidence: []
