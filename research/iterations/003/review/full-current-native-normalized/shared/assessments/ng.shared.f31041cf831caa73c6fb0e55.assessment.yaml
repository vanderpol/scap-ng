assessment:
  id: ng.shared.f31041cf831caa73c6fb0e55
  version: 1
  assessment_title: The Cisco switch must produce audit records containing information to establish where the events occurred.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Review the deny statements in all interface ACLs to determine if the log-input parameter has been configured
    as shown in the example below. Note: log-input can only apply to interface bound ACLs. ip access-list extended BLOCK_INBOUND
    deny icmp any any log-input If the switch is not configured with the log-input parameter after any deny statements to
    note where packets have been dropped via an ACL, this is a finding.'
  inputs: {}
  evidence: []
