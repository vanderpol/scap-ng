assessment:
  id: ng.shared.aeeba9edafd32a84b2e5c60c
  version: 1
  assessment_title: AZLX-23-002595 - Amazon Linux 2023 must ensure the pcscd service is active.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-systemdunitproperty-collection:
      collection_title: null
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          mask: false
          value: pcscd.socket
        property:
          operation: equals
          datatype: string
          mask: false
          value: ActiveState
  tests:
    test-pcscd-socket-active:
      test_title: The pcscd socket is active.
      capability: linux.systemdunitproperty
      collection: linux-systemdunitproperty-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: linux.systemdunitproperty
        state:
          field: value
          value: active
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-pcscd-socket-active
