assessment:
  id: ng.shared.cd1bbc8d6b9c20be6dd7c3c7
  version: 1
  assessment_title: The macOS system must enforce screen saver timeout.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    system-settings-screensaver-timeout-enforce-stig-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: "/usr/bin/osascript -l JavaScript << EOS\nfunction run() {\n  let timeout = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.screensaver')\\\
            \n.objectForKey('idleTime'))\n  if ( timeout <= 900 ) {\n    return(\"true\")\n  } else {\n    return(\"false\"\
            )\n  }\n}\nEOS"
      object_title: system_settings_screensaver_timeout_enforce_stig_object
  states:
    state-system-settings-screensaver-timeout-enforce-stig-state:
      state_title: system_settings_screensaver_timeout_enforce_stig_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: 'true'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-settings-screensaver-timeout-enforce-stig-test:
      test_title: system_settings_screensaver_timeout_enforce_stig_test
      capability: independent.shellcommand
      object: system-settings-screensaver-timeout-enforce-stig-object-object
      check_existence: all_exist
      check: all
      states:
      - state-system-settings-screensaver-timeout-enforce-stig-state
  evaluate:
    test: test-system-settings-screensaver-timeout-enforce-stig-test
