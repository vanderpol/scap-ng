  version: 1
  assessment_title: OL09-00-002531 - OL 9 /boot/grub2/grub.cfg file must be owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-file-object:
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /boot/grub2/grub.cfg
      object_title: null
  states:
    state-owned-by-root:
      state_title: owned by root
      capability: unix.file
      state:
        field: user_id
        value: '0'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-boot-grub2-grub-cfg-file-owned-by-root:
      test_title: /boot/grub2/grub.cfg file is owned by root
      capability: unix.file
      object: unix-file-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-owned-by-root
  evaluate:
    test: test-boot-grub2-grub-cfg-file-owned-by-root
