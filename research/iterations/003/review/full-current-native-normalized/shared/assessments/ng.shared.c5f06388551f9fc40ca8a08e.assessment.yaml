assessment:
  id: ng.shared.c5f06388551f9fc40ca8a08e
  version: 1
  assessment_title: Windows Server 2016 accounts must require passwords.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Review the password required status for enabled user accounts. Open "PowerShell". Domain Controllers: Enter
    "Get-Aduser -Filter * -Properties Passwordnotrequired |FT Name, Passwordnotrequired, Enabled". Exclude disabled accounts
    (e.g., DefaultAccount, Guest) and Trusted Domain Objects (TDOs). If "Passwordnotrequired" is "True" or blank for any enabled
    user account, this is a finding. Member servers and standalone or nondomain-joined systems: Enter ''Get-CimInstance -Class
    Win32_Useraccount -Filter "PasswordRequired=False and LocalAccount=True" | FT Name, PasswordRequired, Disabled, LocalAccount''.
    Exclude disabled accounts (e.g., DefaultAccount, Guest). If any enabled user accounts are returned with a "PasswordRequired"
    status of "False", this is a finding.'
  inputs: []
  evidence: []
