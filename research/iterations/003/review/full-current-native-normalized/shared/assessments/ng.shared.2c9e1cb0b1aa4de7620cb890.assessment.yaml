assessment:
  id: ng.shared.2c9e1cb0b1aa4de7620cb890
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that all files and directories contained in local
    interactive user home directories have a valid owner.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify all files and directories in a local interactive user''s home directory have a valid owner. Check the
    owner of all files and directories in a local interactive user''s home directory with the following command: Note: The
    example will be for the user "smithj", who has a home directory of "/home/smithj". $ sudo ls -lLR /home/smithj -rw-r--r--
    1 smithj smithj 18 Mar 5 17:06 file1 -rw-r--r-- 1 smithj smithj 193 Mar 5 17:06 file2 -rw-r--r-- 1 smithj smithj 231 Mar
    5 17:06 file3 If any files or directories are found without an owner, this is a finding.'
  inputs: []
  evidence: []
