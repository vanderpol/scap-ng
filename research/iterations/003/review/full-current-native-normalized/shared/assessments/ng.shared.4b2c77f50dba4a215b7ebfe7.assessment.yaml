assessment:
  id: ng.shared.4b2c77f50dba4a215b7ebfe7
  version: 1
  assessment_title: WN22-DC-000320 - Windows Server 2022 domain controllers must require LDAP access signing.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Services\NTDS\Parameters
        name:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: LDAPServerIntegrity
  tests:
    test-domain-controller-ldap-server-signing-requirements-set-require-signing:
      test_title: '''Domain Controller: LDAP Server signing requirements'' is set to ''Require signing'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '2'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-domain-controller-ldap-server-signing-requirements-set-require-signing
