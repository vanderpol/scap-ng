assessment:
  id: ng.shared.4dd206580f73261c13d27fbb
  version: 1
  assessment_title: The Oracle Linux operating system must not allow an unrestricted logon to the system.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system does not allow an unrestricted logon to the system via a graphical user interface.
    Note: If the system does not have GNOME installed, this requirement is Not Applicable. Check for the value of the "TimedLoginEnable"
    parameter in "/etc/gdm/custom.conf" file with the following command: # grep -i timedloginenable /etc/gdm/custom.conf TimedLoginEnable=false
    If the value of "TimedLoginEnable" is not set to "false", this is a finding.'
  inputs: []
  evidence: []
