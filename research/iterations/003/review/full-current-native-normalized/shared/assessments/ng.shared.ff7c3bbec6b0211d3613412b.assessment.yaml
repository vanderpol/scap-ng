assessment:
  id: ng.shared.ff7c3bbec6b0211d3613412b
  version: 1
  assessment_title: The system must prevent the use of dictionary words for passwords.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    etc-default-passwd-file-collection:
      collection_title: The (/etc/default/passwd) file.
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/default/passwd
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*DICTIONLIST=(\S*)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    etc-default-passwd-file-collection-2:
      collection_title: The (/etc/default/passwd) file.
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/default/passwd
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*DICTIONDBDIR=(\S*)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    dictionlist-s-listed-file-collection:
      collection_title: DICTIONLIST's listed file.
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /usr/share/lib/dict
        filename:
          operation: equals
          datatype: string
          mask: false
          value: words
    does-pw-dict-hwm-exist-in-path-specified-by-dictondbdir-collection:
      collection_title: Does pw_dict.hwm exist in the path specified by DICTONDBDIR.
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /var/passwd
        filename:
          operation: equals
          datatype: string
          mask: false
          value: pw_dict.hwm
    does-pw-dict-pwd-exist-in-path-specified-by-dictondbdir-collection:
      collection_title: Does pw_dict.pwd exist in the path specified by DICTONDBDIR.
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /var/passwd
        filename:
          operation: equals
          datatype: string
          mask: false
          value: pw_dict.pwd
    does-pw-dict-pwi-exist-in-path-specified-by-dictondbdir-collection:
      collection_title: Does pw_dict.pwi exist in the path specified by DICTONDBDIR.
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /var/passwd
        filename:
          operation: equals
          datatype: string
          mask: false
          value: pw_dict.pwi
    does-authtok-check-lock-exist-in-path-specified-by-dictondbdir-collection:
      collection_title: Does authtok_check.lock exist in the path specified by DICTONDBDIR.
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /var/passwd
        filename:
          operation: equals
          datatype: string
          mask: false
          value: authtok_check.lock
  tests:
    test-check-in-etc-default-passwd-that-dictionlist-set-usr-share:
      test_title: Check in /etc/default/passwd that DICTIONLIST is set to /usr/share/lib/dict/words.
      capability: independent.textfilecontent54
      collection: etc-default-passwd-file-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: The (/usr/share/lib/dict/words) filepath.
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: /usr/share/lib/dict/words
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-check-in-etc-default-passwd-that-dictiondbdir-set-var-passwd:
      test_title: Check in /etc/default/passwd that DICTIONDBDIR is set to /var/passwd.
      capability: independent.textfilecontent54
      collection: etc-default-passwd-file-collection-2
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: The (/var/passwd) filepath.
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: /var/passwd
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-check-make-sure-that-usr-share-lib-dict-words-exists:
      test_title: Check to make sure that /usr/share/lib/dict/words exists and is not empty.
      capability: unix.file
      collection: dictionlist-s-listed-file-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: Check /usr/share/lib/dict/words is not empty.
        state_capability: unix.file
        state:
          field: size
          value: '0'
          operation: greater than
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-check-make-sure-that-pw-dict-hwm-exists-in-path:
      test_title: Check to make sure that pw_dict.hwm exists in the path specified by DICTONDBDIR and is not empty.
      capability: unix.file
      collection: does-pw-dict-hwm-exist-in-path-specified-by-dictondbdir-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: Check /usr/share/lib/dict/words is not empty.
        state_capability: unix.file
        state:
          field: size
          value: '0'
          operation: greater than
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-check-make-sure-that-pw-dict-pwd-exists-in-path:
      test_title: Check to make sure that pw_dict.pwd exists in the path specified by DICTONDBDIR and is not empty.
      capability: unix.file
      collection: does-pw-dict-pwd-exist-in-path-specified-by-dictondbdir-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: Check /usr/share/lib/dict/words is not empty.
        state_capability: unix.file
        state:
          field: size
          value: '0'
          operation: greater than
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-check-make-sure-that-pw-dict-pwi-exists-in-path:
      test_title: Check to make sure that pw_dict.pwi exists in the path specified by DICTONDBDIR and is not empty.
      capability: unix.file
      collection: does-pw-dict-pwi-exist-in-path-specified-by-dictondbdir-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: Check /usr/share/lib/dict/words is not empty.
        state_capability: unix.file
        state:
          field: size
          value: '0'
          operation: greater than
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-check-make-sure-that-authtok-check-lock-exists-in-path:
      test_title: Check to make sure that authtok_check.lock exists in the path specified by DICTONDBDIR.
      capability: unix.file
      collection: does-authtok-check-lock-exist-in-path-specified-by-dictondbdir-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state: null
  evaluate:
    all:
    - test: test-check-in-etc-default-passwd-that-dictionlist-set-usr-share
    - test: test-check-in-etc-default-passwd-that-dictiondbdir-set-var-passwd
    - test: test-check-make-sure-that-usr-share-lib-dict-words-exists
    - test: test-check-make-sure-that-pw-dict-hwm-exists-in-path
    - test: test-check-make-sure-that-pw-dict-pwd-exists-in-path
    - test: test-check-make-sure-that-pw-dict-pwi-exists-in-path
    - test: test-check-make-sure-that-authtok-check-lock-exists-in-path
