assessment:
  id: ng.shared.24b3ca0e06a7208eb15b29bc
  version: 1
  assessment_title: OL08-00-010543 - OL 8 must use a separate file system for "/tmp".
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-partition-collection:
      collection_title: null
      capability: linux.partition
      select:
        mount_point:
          operation: equals
          datatype: string
          mask: false
          value: /tmp
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/fstab
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[^# \t]+\s+/tmp\s+
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-there-separate-file-system-tmp:
      test_title: There is a separate file system for /tmp.
      capability: linux.partition
      collection: linux-partition-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state: null
    test-there-separate-file-system-configured-tmp:
      test_title: There is a separate file system configured for /tmp.
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state: null
  evaluate:
    all:
    - test: test-there-separate-file-system-tmp
    - test: test-there-separate-file-system-configured-tmp
