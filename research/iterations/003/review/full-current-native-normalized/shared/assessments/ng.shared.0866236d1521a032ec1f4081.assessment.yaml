  version: 1
  assessment_title: The value mesg n must be configured as the default setting for all users.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Determine if "mesg n" is the default for users. # grep "^mesg" /etc/.login # grep "^mesg" /etc/profile If either
    of these commands produces a line: mesg y this is a finding. For each existing user on the system, enter the command:
    # mesg If the command output is: is y this is a finding.'
