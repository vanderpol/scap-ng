assessment:
  id: ng.shared.99b599c9c2b6796fd7fa4b80
  version: 1
  assessment_title: The macOS system must configure SSHD unused connection timeout to 900.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    os-sshd-unused-connection-timeout-configure-stig-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: zsh
        command:
          operation: equals
          datatype: string
          value: /usr/sbin/sshd -G | /usr/bin/awk '/unusedconnectiontimeout/{print $2}'
      object_title: os_sshd_unused_connection_timeout_configure_stig_object
  states:
    state-os-sshd-unused-connection-timeout-configure-stig-state:
      state_title: os_sshd_unused_connection_timeout_configure_stig_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: '900'
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-os-sshd-unused-connection-timeout-configure-stig-test:
      test_title: os_sshd_unused_connection_timeout_configure_stig_test
      capability: independent.shellcommand
      object: os-sshd-unused-connection-timeout-configure-stig-object-object
      check_existence: all_exist
      check: all
      states:
      - state-os-sshd-unused-connection-timeout-configure-stig-state
  evaluate:
    test: test-os-sshd-unused-connection-timeout-configure-stig-test
