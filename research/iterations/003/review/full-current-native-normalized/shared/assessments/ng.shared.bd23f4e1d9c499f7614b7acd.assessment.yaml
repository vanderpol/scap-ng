assessment:
  id: ng.shared.bd23f4e1d9c499f7614b7acd
  version: 1
  assessment_title: The macOS system must enforce On Device Dictation.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'For Intel-based systems, this is not applicable. Verify the macOS system is configured to enforce On Device
    Only Dictation with the following command: /usr/bin/osascript -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\
    .objectForKey(''forceOnDeviceOnlyDictation'').js EOS If the result is not "true", this is a finding.'
  inputs: []
  evidence: []
