assessment:
  id: ng.shared.3be1bc672f4aa722d604d930
  version: 1
  assessment_title: Remotely Accessible Registry Paths
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: System\CurrentControlSet\Control\SecurePipeServers\Winreg\AllowedExactPaths
        name:
          operation: equals
          datatype: string
          value: Machine
      object_title: null
  states:
    state-value-matches-system-currentcontrolset-control-productop:
      state_title: Value matches ^((System\\CurrentControlSet\\Control\\ProductOptions)|(System\\CurrentControlSet\\Control\\Server
        Applications)|(Software\\Microsoft\\Windows NT\\CurrentVersion))$
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_multi_sz
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: ^((System\\CurrentControlSet\\Control\\ProductOptions)|(System\\CurrentControlSet\\Control\\Server Applications)|(Software\\Microsoft\\Windows
            NT\\CurrentVersion)|())$
          operation: pattern match
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
    state-reg-multi-sz-type-and-blank-value:
      state_title: Reg_Multi_Sz type and blank value
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_multi_sz
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: .+
          operation: pattern match
          datatype: string
          entity_check: none satisfy
          entity_existence: at_least_one_exists
  tests:
    test-network-access-remotely-accessible-registry-paths-configured-contain-authorized-registry:
      test_title: '''Network access: Remotely accessible registry paths'' is configured to contain authorized registry paths'
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-value-matches-system-currentcontrolset-control-productop
    test-network-access-remotely-accessible-registry-paths-configured-contain-no-entries:
      test_title: '''Network access: Remotely accessible registry paths'' is configured to contain no entries'
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-multi-sz-type-and-blank-value
    test-network-access-remotely-accessible-registry-paths-not-configured:
      test_title: '''Network access: Remotely accessible registry paths'' is is not configured'
      capability: windows.registry
      object: windows-registry-object
      check_existence: none_exist
      check: all
  evaluate:
    any:
    - test: test-network-access-remotely-accessible-registry-paths-configured-contain-authorized-registry
    - test: test-network-access-remotely-accessible-registry-paths-configured-contain-no-entries
    - test: test-network-access-remotely-accessible-registry-paths-not-configured
