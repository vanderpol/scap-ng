assessment:
  id: ng.shared.42ac82156d0c4bae70bde3b9
  version: 1
  assessment_title: Windows 2012/2012 R2 accounts must be configured to require passwords.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Review the password required status for enabled user accounts. Open "Windows PowerShell". Domain Controllers:
    Enter "Get-ADUser -Filter * -Properties PasswordNotRequired | Where PasswordNotRequired -eq True | FT Name, PasswordNotRequired,
    Enabled". Exclude disabled accounts (e.g., Guest) and Trusted Domain Objects (TDOs). If "PasswordNotRequired" is "True"
    for any enabled user account, this is a finding. Member servers and standalone systems: Enter ''Get-CimInstance -Class
    Win32_Useraccount -Filter "PasswordRequired=False and LocalAccount=True" | FT Name, PasswordRequired, Disabled, LocalAccount''.
    Exclude disabled accounts (e.g., Guest). If any enabled user accounts are returned with a "PasswordRequired" status of
    "False", this is a finding.'
  inputs: {}
  evidence: []
