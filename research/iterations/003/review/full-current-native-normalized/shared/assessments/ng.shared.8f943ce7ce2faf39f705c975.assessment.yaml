assessment:
  id: ng.shared.8f943ce7ce2faf39f705c975
  version: 1
  assessment_title: Audit - Other Account Management Events - Success
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-auditeventpolicysubcategories-collection:
      collection_title: null
      capability: windows.auditeventpolicysubcategories
  tests:
    test-audit-other-account-management-events-success-only:
      test_title: Audit - Other Account Management Events - Success only
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Audit - Other Account Management Events - Success only
        state_capability: windows.auditeventpolicysubcategories
        state:
          field: other_account_management_events
          value: AUDIT_SUCCESS
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-audit-other-account-management-events-success-failure:
      test_title: Audit - Other Account Management Events - Success and Failure
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Audit - Other Account Management Events - Success and Failure
        state_capability: windows.auditeventpolicysubcategories
        state:
          field: other_account_management_events
          value: AUDIT_SUCCESS_FAILURE
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    any:
    - test: test-audit-other-account-management-events-success-only
    - test: test-audit-other-account-management-events-success-failure
