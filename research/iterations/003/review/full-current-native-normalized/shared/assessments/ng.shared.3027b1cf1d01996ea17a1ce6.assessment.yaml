assessment:
  id: ng.shared.3027b1cf1d01996ea17a1ce6
  version: 1
  assessment_title: The operating system must encrypt the transfer of audit records off-loaded onto a different system or
    media from the system being audited.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    etc-audisp-audisp-remote-conf-enable-krb5-collection:
      collection_title: /etc/audisp/audisp-remote.conf enable_krb5
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audisp/audisp-remote.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[ ]*enable_krb5[ ]+=[ ]+([^ ]*)[ ]*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
        multiline: 'true'
  tests:
    test-etc-audisp-audisp-remote-conf-enable-krb5-yes:
      test_title: /etc/audisp/audisp-remote.conf enable_krb5 = yes
      capability: independent.textfilecontent54
      collection: etc-audisp-audisp-remote-conf-enable-krb5-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: enable_krb5 = yes
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^[Yy][Ee][Ss]$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-etc-audisp-audisp-remote-conf-enable-krb5-yes
