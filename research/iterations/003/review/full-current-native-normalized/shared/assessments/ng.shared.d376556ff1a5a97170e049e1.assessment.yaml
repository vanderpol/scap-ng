assessment:
  id: ng.shared.d376556ff1a5a97170e049e1
  version: 1
  assessment_title: The macOS system must enable macOS Application Firewall.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to enable the Application Firewall with the following command: /usr/bin/osascript
    -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.security.firewall'')\ .objectForKey(''EnableFirewall'').js
    EOS If the result is not "true", this is a finding.'
  inputs: []
  evidence: []
