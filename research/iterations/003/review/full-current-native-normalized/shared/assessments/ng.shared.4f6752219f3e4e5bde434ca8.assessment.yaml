  version: 1
  assessment_title: The macOS system must disable FileVault automatic login.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable FileVault automatic login with the following command: /usr/bin/osascript
    -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.loginwindow'')\ .objectForKey(''DisableFDEAutoLogin'').js
    EOS If the result is not "true", this is a finding.'
  inputs: []
  evidence: []
