assessment:
  id: ng.shared.9403a3d5f8d2aa9a18ec3781
  version: 1
  assessment_title: The Exchange SMTP automated banner response must not reveal server details.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    run-get-receiveconnector-display-banner-configuration-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: powershell
        command:
          operation: equals
          datatype: string
          value: add-pssnapin Microsoft.Exchange.Management.Powershell.Snapin;Get-ReceiveConnector | Select-Object -Property
            Name, Identity, Banner | Format-Table -HideTableHeaders | Out-String -Width 4096
        pattern:
          operation: equals
          datatype: string
          value: \w
      behaviors:
        error_if_stderr_exists: 'true'
      object_title: Run Get-ReceiveConnector to display Banner configuration
  states:
    state-verify-value-is-220-smtp-server-ready:
      state_title: Verify value is 220 SMTP Server Ready
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: (?i)220 SMTP Server Ready\s*$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-each-receive-connector-if-value-banner-not-set-220-smtp:
      test_title: For each Receive connector, if the value of Banner is not set to 220 SMTP Server Ready, this is a finding.
      capability: independent.shellcommand
      object: run-get-receiveconnector-display-banner-configuration-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-verify-value-is-220-smtp-server-ready
  evaluate:
    test: test-each-receive-connector-if-value-banner-not-set-220-smtp
