assessment:
  id: ng.shared.338cf35247f4cbaed4a355ba
  version: 1
  assessment_title: The limitpriv zone option must be set to the vendor default or less permissive.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This check applies to the global zone only. Determine the zone that you are currently securing. # zonename If
    the command output is "global", this check applies. List the non-global zones on the system. # zoneadm list -vi | grep
    -v global From the output list of non-global zones found, determine if any are Kernel zones. # zoneadm list -cv | grep
    [zonename] | grep solaris-kz Exclude any Kernel zones found from the list of local zones. List the configuration for each
    zone. # zonecfg -z [zonename] info |grep limitpriv If the output of this command has a setting for limitpriv and it is
    not: limitpriv: default this is a finding.'
  inputs: []
  evidence: []
