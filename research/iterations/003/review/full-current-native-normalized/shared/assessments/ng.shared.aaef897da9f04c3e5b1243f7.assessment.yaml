assessment:
  id: ng.shared.aaef897da9f04c3e5b1243f7
  version: 1
  assessment_title: The audit system must be configured to audit all discretionary access control permission modifications.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The Audit Configuration profile is required. Check that the audit flag for auditing file access is enabled.
    This check applies to the global zone only. Determine the zone that you are currently securing. # zonename If the command
    output is "global", this check applies. Determine the OS version you are currently securing. # uname –v For Solaris 11,
    11.1, 11.2, and 11.3: # pfexec auditconfig -getflags | grep active | cut -f2 -d= If "fm" audit flag is not included in
    output, this is a finding. For Solaris 11.4 or newer: # pfexec auditconfig -t -getflags | cut -f2 -d= If "fm" audit flag
    is not included in output, this is a finding. Determine if auditing policy is set to collect command line arguments. #
    pfexec auditconfig -getpolicy | grep active | grep argv If the active audit policies line does not appear, this is a finding.'
  inputs: {}
  evidence: []
