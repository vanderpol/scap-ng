assessment:
  id: ng.shared.3d928b423296690e390336ce
  version: 1
  assessment_title: The legacy remote network access utilities daemons must not be installed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    pkg-info-service-network-legacy-remote-utilities-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: pkg info service/network/legacy-remote-utilities
        pattern:
          operation: pattern match
          datatype: string
          value: .*
      object_title: pkg info service/network/legacy-remote-utilities
  states:
    state-stdout-line-should-not-exist:
      state_title: stdout_line should not exist
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: ''
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: none_exist
  tests:
    test-legacy-remote-network-access-utilities-daemons-not-installed:
      test_title: The legacy remote network access utilities daemons must not be installed.
      capability: independent.shellcommand
      object: pkg-info-service-network-legacy-remote-utilities-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-stdout-line-should-not-exist
  evaluate:
    test: test-legacy-remote-network-access-utilities-daemons-not-installed
