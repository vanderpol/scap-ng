  version: 1
  assessment_title: Host-based authentication for login-based services must be disabled.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: This is the location for Solaris 11.1. For earlier versions, the information is in /etc/pam.conf. Determine
    if host-based authentication services are enabled. # grep ''pam_rhosts_auth.so.1'' /etc/pam.conf /etc/pam.d/*| grep -vc
    ''^#'' If the returned result is not 0 (zero), this is a finding.'
  inputs: []
  evidence: []
