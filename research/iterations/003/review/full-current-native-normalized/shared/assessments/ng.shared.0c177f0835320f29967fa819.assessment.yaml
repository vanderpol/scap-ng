assessment:
  id: ng.shared.0c177f0835320f29967fa819
  version: 1
  assessment_title: TOSS-04-040020 - TOSS must force a frequent session key renegotiation for SSH connections by the client.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*(?i)RekeyLimit\s+(?:\d+[kmg]?)\s+(?:\d+[smdhw]?)+(?-i)\s*
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
