    test-etc-ssh-sshd-config-rekeylimit-max-data-time-greater-than:
      test_title: /etc/ssh/sshd_config:RekeyLimit max data and time are greater than zero.
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: text
          value: ^(?i)\s*RekeyLimit\s+[1-9][0-9]*[kmg]?\s+([1-9][0-9]*[smhdw]?)+\s*$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-etc-ssh-sshd-config-rekeylimit-max-data-time-greater-than
