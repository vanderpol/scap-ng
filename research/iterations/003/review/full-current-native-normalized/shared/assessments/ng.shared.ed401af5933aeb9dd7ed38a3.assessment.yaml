assessment:
  id: ng.shared.ed401af5933aeb9dd7ed38a3
  version: 1
  assessment_title: Reversible password encryption must be disabled.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy
    >> Computer Configuration >> Windows Settings >> Security Settings >> Account Policies >> Password Policy. If the value
    for "Store password using reversible encryption" is not set to "Disabled", this is a finding.
  inputs: {}
  evidence: []
