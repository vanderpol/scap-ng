assessment:
  id: ng.shared.cf0537545d8b5b421c0ded2e
  version: 1
  assessment_title: Ensure gpgcheck Enabled for Local Packages
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    localpkg-gpgcheck-set-in-etc-yum-conf-collection:
      collection_title: localpkg_gpgcheck set in /etc/yum.conf
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/yum.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*localpkg_gpgcheck\s*=\s*(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-check-value-localpkg-gpgcheck-in-etc-yum-conf:
      test_title: check value of localpkg_gpgcheck in /etc/yum.conf
      capability: independent.textfilecontent54
      collection: localpkg-gpgcheck-set-in-etc-yum-conf-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: localpkg_gpgcheck is enabled
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^(1|True|yes)$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-check-value-localpkg-gpgcheck-in-etc-yum-conf
