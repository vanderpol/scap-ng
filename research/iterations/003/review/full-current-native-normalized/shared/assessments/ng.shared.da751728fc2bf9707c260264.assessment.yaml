assessment:
  id: ng.shared.da751728fc2bf9707c260264
  version: 1
  assessment_title: WN19-DC-000260 - Windows Server 2019 must be configured to audit DS Access - Directory Service Changes
    successes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-windows-auditeventpolicysubcategories:
      state_title: null
      capability: windows.auditeventpolicysubcategories
      state:
        field: directory_service_changes
        value: AUDIT_SUCCESS
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-auditeventpolicysubcategories-2:
      state_title: null
      capability: windows.auditeventpolicysubcategories
      state:
        field: directory_service_changes
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-directory-service-changes-success-only-or-success-failure:
      test_title: Audit - Directory Service Changes - 'Success only' or 'Success and Failure'
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-windows-auditeventpolicysubcategories
      - state-windows-auditeventpolicysubcategories-2
  evaluate:
    test: test-audit-directory-service-changes-success-only-or-success-failure
