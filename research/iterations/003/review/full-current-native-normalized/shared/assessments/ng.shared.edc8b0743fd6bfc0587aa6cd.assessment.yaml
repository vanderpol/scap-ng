assessment:
  id: ng.shared.edc8b0743fd6bfc0587aa6cd
  version: 1
  assessment_title: SLES-12-010879 - The SUSE operating system must have system commands owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-file-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: only one
          value:
            variable: system-command-directories-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
      filters:
      - action: include
        state: state-unix-file-2
      behaviors:
        recurse_direction: down
      object_title: null
  variables:
    system-command-directories-variable:
      title: system command directories
      kind: constant
      datatype: string
      expression:
        literal:
        - /bin
        - /sbin
        - /usr/bin
        - /usr/sbin
        - /usr/local/bin
        - /usr/local/sbin
  states:
    state-unix-file:
      state_title: null
      capability: unix.file
      state:
        field: user_id
        value: '0'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-unix-file-2:
      state_title: null
      capability: unix.file
      state:
        field: type
        value: regular
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-command-files-owned-by-root:
      test_title: System command files are owned by root
      capability: unix.file
      object: unix-file-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-unix-file
  evaluate:
    test: test-system-command-files-owned-by-root
