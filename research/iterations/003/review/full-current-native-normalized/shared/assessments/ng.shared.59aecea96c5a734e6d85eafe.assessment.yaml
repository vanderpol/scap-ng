assessment:
  id: ng.shared.59aecea96c5a734e6d85eafe
  version: 1
  assessment_title: Windows 2012/2012 R2 password for the built-in Administrator account must be changed at least annually
    or when a member of the administrative team leaves the organization.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Review the password last set date for the built-in Administrator account. Domain controllers: Open "Windows
    PowerShell". Enter "Get-ADUser -Filter * -Properties SID, PasswordLastSet | Where SID -Like "*-500" | FL Name, SID, PasswordLastSet".
    If the "PasswordLastSet" date is greater than one year old, this is a finding. Member servers and standalone systems:
    Open "Windows PowerShell" or "Command Prompt". Enter ''Net User [account name] | Find /i "Password Last Set"'', where
    [account name] is the name of the built-in administrator account. (The name of the built-in Administrator account must
    be changed to something other than "Administrator" per STIG requirements.) If the "PasswordLastSet" date is greater than
    one year old, this is a finding.'
  inputs: []
  evidence: []
