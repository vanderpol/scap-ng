assessment:
  id: ng.shared.9515b467f901b3b79c6f03ed
  version: 1
  assessment_title: The Oracle Linux operating system must not permit direct logons to the root account using remote access
    via SSH.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify remote access using SSH prevents users from logging on directly as root. Check that SSH prevents users
    from logging on directly as root with the following command: # grep -i permitrootlogin /etc/ssh/sshd_config PermitRootLogin
    no If the "PermitRootLogin" keyword is set to "yes", is missing, or is commented out, this is a finding.'
  inputs: {}
  evidence: []
