assessment:
  id: ng.shared.a758b842329c1005092fc5ef
  version: 1
  assessment_title: X11 forwarding for SSH must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    x11forwarding-option-in-etc-ssh-sshd-config-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          value: ^[Xx]11[Ff][Oo][Rr][Ww][Aa][Rr][Dd][Ii][Nn][Gg]\s*(\S+)$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: The X11Forwarding option in /etc/ssh/sshd_config.
  states:
    state-the-no-string:
      state_title: The ~no~ string.
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: 'no'
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-x11forwarding-set-no-in-etc-ssh-sshd-config:
      test_title: X11Forwarding must be set to no in /etc/ssh/sshd_config.
      capability: independent.textfilecontent54
      object: x11forwarding-option-in-etc-ssh-sshd-config-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-the-no-string
  evaluate:
    test: test-x11forwarding-set-no-in-etc-ssh-sshd-config
