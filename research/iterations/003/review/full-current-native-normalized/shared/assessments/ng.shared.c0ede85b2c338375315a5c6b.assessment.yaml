assessment:
  id: ng.shared.c0ede85b2c338375315a5c6b
  version: 1
  assessment_title: The Master Key must be backed up and stored in a secure location that is not on the SQL Server.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: If the application owner and authorizing official have determined that encryption of data at rest is not required,
    this is not a finding. Review procedures for and evidence of backup of the Master Key in the System Security Plan. If
    the procedures or evidence does not exist, this is a finding. If the procedures do not indicate that a backup of the Master
    Key is stored in a secure location that is not on the SQL Server, this is a finding. If procedures do not indicate access
    restrictions to the Master Key backup, this is a finding.
  inputs: {}
  evidence: []
