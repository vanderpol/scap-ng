  assessment_title: The macOS system must configure audit failure notification.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to produce audit failure notification with the following command: /usr/bin/grep
    -c "logger -s -p" /etc/security/audit_warn If the result is not "1", this is a finding.'
