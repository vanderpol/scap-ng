assessment:
  id: ng.shared.a1166fbe545a3c3f05140ea6
  version: 1
  assessment_title: OL09-00-002581 - OL 9 cron configuration files directory must be group-owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-file-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          value: /etc
        filename:
          operation: pattern match
          datatype: string
          value: ^cron.*
      behaviors:
        max_depth: '-1'
        recurse_direction: down
      object_title: null
  states:
    state-group-owned-by-root:
      state_title: group-owned by root
      capability: unix.file
      state:
        field: group_id
        value: '0'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-cron-configuration-files-group-owned-by-root:
      test_title: cron configuration files are group-owned by root
      capability: unix.file
      object: unix-file-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-group-owned-by-root
  evaluate:
    test: test-cron-configuration-files-group-owned-by-root
