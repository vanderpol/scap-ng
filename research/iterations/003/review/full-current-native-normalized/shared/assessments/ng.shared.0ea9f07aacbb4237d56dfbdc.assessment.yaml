assessment:
  id: ng.shared.0ea9f07aacbb4237d56dfbdc
  version: 1
  assessment_title: The operating system must immediately notify the System Administrator (SA) and Information System Security
    Officer (ISSO) (at a minimum) via email when the threshold for the repository maximum audit record storage capacity is
    reached.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    etc-audit-auditd-conf-space-left-action-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/audit/auditd.conf
        pattern:
          operation: pattern match
          datatype: string
          value: ^[ ]*space_left_action[ ]+=[ ]+([^ ]*)[ ]*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      behaviors:
        ignore_case: 'true'
        multiline: 'true'
      object_title: /etc/audit/auditd.conf space_left_action
  states:
    state-space-left-action-email:
      state_title: space_left_action = email
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^[Ee][Mm][Aa][Ii][Ll]$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-etc-audit-auditd-conf-space-left-action-email:
      test_title: /etc/audit/auditd.conf space_left_action = email
      capability: independent.textfilecontent54
      object: etc-audit-auditd-conf-space-left-action-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-space-left-action-email
  evaluate:
    test: test-etc-audit-auditd-conf-space-left-action-email
