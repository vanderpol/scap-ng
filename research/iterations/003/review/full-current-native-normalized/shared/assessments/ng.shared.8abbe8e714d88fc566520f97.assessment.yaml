assessment:
  id: ng.shared.8abbe8e714d88fc566520f97
  version: 1
  assessment_title: Process core dumps must be disabled unless needed.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    routeadm-p-collection:
      collection_title: routeadm -p
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: coreadm
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: enabled
  tests:
    test-process-core-dumps-disabled-unless-needed:
      test_title: Process core dumps must be disabled unless needed.
      capability: independent.shellcommand
      collection: routeadm-p-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Check that the only output includes 'logging' with an exit status of 0
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: logging
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-process-core-dumps-disabled-unless-needed
