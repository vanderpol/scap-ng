assessment:
  id: ng.shared.92c323768d26f21583bb54ec
  version: 1
  assessment_title: Windows Server 2019 permissions for the System event log must prevent access by non-privileged accounts.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Navigate to the System event log file. The default location is the "%SystemRoot%\System32\winevt\Logs" folder.
    However, the logs may have been moved to another folder. If the permissions for the "System.evtx" file are not as restrictive
    as the default permissions listed below, this is a finding: Eventlog - Full Control SYSTEM - Full Control Administrators
    - Full Control'
  inputs: []
  evidence: []
