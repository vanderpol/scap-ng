assessment:
  id: ng.shared.8b3a6aef95ff862578e72fe1
  version: 1
  assessment_title: The Oracle Linux operating system must audit all uses of the pam_timestamp_check command.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system generates audit records when successful/unsuccessful attempts to use the "pam_timestamp_check"
    command occur. Check the auditing rules in "/etc/audit/audit.rules" with the following command: $ sudo grep -w "/usr/sbin/pam_timestamp_check"
    /etc/audit/audit.rules -a always,exit -F path=/usr/sbin/pam_timestamp_check -F perm=x -F auid>=1000 -F auid!=unset -k
    privileged-pam If the command does not return any output, this is a finding.'
  inputs: []
  evidence: []
