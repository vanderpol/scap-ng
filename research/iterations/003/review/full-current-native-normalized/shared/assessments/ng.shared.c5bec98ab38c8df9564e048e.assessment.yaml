assessment:
  id: ng.shared.c5bec98ab38c8df9564e048e
  version: 1
  assessment_title: UBTU-22-215010 - Ubuntu 22.04 LTS must have the "libpam-pwquality" package installed.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    libpam-pwquality-installed-collection:
      collection_title: libpam-pwquality is installed
      capability: linux.dpkginfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: libpam-pwquality
  tests:
    test-package-libpam-pwquality-installed:
      test_title: package libpam-pwquality is installed
      capability: linux.dpkginfo
      collection: libpam-pwquality-installed-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state: null
  evaluate:
    test: test-package-libpam-pwquality-installed
