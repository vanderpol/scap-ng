assessment:
  id: ng.shared.d397afcf212103e3a5425411
  version: 1
  assessment_title: User .rhosts files must not exist.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    all-accounts-collection:
      collection_title: all accounts
      capability: unix.shadow
      select:
        username:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
    all-accounts-ps-status-collection-2:
      collection_title: all accounts with PS status
      capability: unix.shadow
      set:
        operator: union
        members:
        - collection: all-accounts-collection
        filters:
        - action: exclude
          match:
            field: password
            value: ^\*LK\*
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: Locked account
          capability: unix.shadow
        - action: exclude
          match:
            field: password
            value: NP
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: Login account
          capability: unix.shadow
        - action: exclude
          match:
            field: password
            value: UP
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: UP account status
          capability: unix.shadow
        - action: exclude
          match:
            field: password
            value: ^$
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: no password account status
          capability: unix.shadow
    all-accounts-ps-status-collection:
      collection_title: all accounts with PS status
      capability: unix.password
      select:
        username:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: user-names-ps-status-accounts-variable
    rhosts-files-in-account-home-directories-collection:
      collection_title: .rhosts files in account home directories
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: home-directories-ps-status-accounts-variable
        filename:
          operation: equals
          datatype: string
          mask: false
          value: .rhosts
  variables:
    user-names-ps-status-accounts-variable:
      title: user names for PS status accounts
      kind: local
      datatype: string
      expression:
        values:
          collection: all-accounts-ps-status-collection-2
          field: username
    home-directories-ps-status-accounts-variable:
      title: home directories for PS status accounts
      kind: local
      datatype: string
      expression:
        values:
          collection: all-accounts-ps-status-collection
          field: home_dir
  tests:
    test-rhosts-files-do-not-exist:
      test_title: .rhosts files do not exist
      capability: unix.file
      collection: rhosts-files-in-account-home-directories-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
  evaluate:
    test: test-rhosts-files-do-not-exist
