assessment:
  id: ng.shared.a15abe63da80bdfe30b97e5c
  version: 1
  assessment_title: Force Logoff When Logon Hours Expire
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    lockout-policy-object:
      capability: windows.lockoutpolicy
      object_title: Lockout policy
  variables:
    network-security-force-logoff-when-logon-hours-expire-variable:
      title: 'Network security: Force logoff when logon hours expire'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: force_logoff_when_logon_hours_expire_var
        validation:
          alternatives:
          - literal: '0'
            hint: enabled
          - literal: '1'
            hint: disabled
  states:
    state-force-logoff-equals-variable:
      state_title: Force Logoff equals variable
      capability: windows.lockoutpolicy
      state:
        field: force_logoff
        value:
          variable: network-security-force-logoff-when-logon-hours-expire-variable
        operation: equals
        datatype: int
        mask: false
        variable_check: all
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-network-security-force-logoff-when-logon-hours-expire-set-enabled:
      test_title: '''Network security: Force logoff when logon hours expire'' is set to ''Enabled'''
      capability: windows.lockoutpolicy
      object: lockout-policy-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-force-logoff-equals-variable
  evaluate:
    test: test-network-security-force-logoff-when-logon-hours-expire-set-enabled
