assessment:
  id: ng.shared.8f093b96f4670a1facc23614
  version: 1
  assessment_title: Manually managed application account passwords must be changed at least annually or when a system administrator
    with knowledge of the password leaves the organization.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Determine if manually managed application/service accounts exist. If none exist, this is NA. If passwords for
    manually managed application/service accounts are not changed at least annually or when an administrator with knowledge
    of the password leaves the organization, this is a finding. Identify manually managed application/service accounts. To
    determine the date a password was last changed: Domain controllers: Open "PowerShell". Enter "Get-AdUser -Identity [application
    account name] -Properties PasswordLastSet | FT Name, PasswordLastSet", where [application account name] is the name of
    the manually managed application/service account. If the "PasswordLastSet" date is more than one year old, this is a finding.
    Member servers and standalone or nondomain-joined systems: Open "Command Prompt". Enter ''Net User [application account
    name] | Find /i "Password Last Set"'', where [application account name] is the name of the manually managed application/service
    account. If the "Password Last Set" date is more than one year old, this is a finding.'
  inputs: {}
  evidence: []
