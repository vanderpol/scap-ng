assessment:
  id: ng.shared.70770798c370c19d2b159405
  version: 1
  assessment_title: The macOS system must disable sending Siri and Dictation information to Apple.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable sending Siri and Dictation information to Apple with the following
    command: /usr/bin/osascript -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.assistant.support'')\
    .objectForKey(''Siri Data Sharing Opt-In Status'').js EOS If the result is not "2", this is a finding.'
  inputs: []
  evidence: []
