assessment:
  id: ng.shared.3d9293ba57c0c3954fefe390
  version: 1
  assessment_title: The macOS system must be configured to disable Location Services.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    system-settings-location-services-disable-recommended-object-collection:
      collection_title: system_settings_location_services_disable_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/sudo -u _locationd /usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.locationd'')\

            .objectForKey(''LocationServicesEnabled'').js

            EOS'
  tests:
    test-system-settings-location-services-disable-recommended-test:
      test_title: system_settings_location_services_disable_recommended_test
      capability: independent.shellcommand
      collection: system-settings-location-services-disable-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: system_settings_location_services_disable_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: 'false'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-system-settings-location-services-disable-recommended-test
