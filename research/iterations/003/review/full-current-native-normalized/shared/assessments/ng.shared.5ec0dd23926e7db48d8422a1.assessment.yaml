assessment:
  id: ng.shared.5ec0dd23926e7db48d8422a1
  version: 1
  assessment_title: OL 8 must implement non-executable data to protect its memory from unauthorized code execution.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    retrieve-flags-line-from-proc-cpuinfo-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /proc/cpuinfo
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: \n*\s*(flags\s+:\s+[^#]*?\s+nx\s*\S*)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: Retrieve flags line from /proc/cpuinfo
  states:
    state-confirm-line-content:
      state_title: Confirm line content.
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: flags\s*:.*?\s+nx(\s|$)
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-retrieve-flags-line-from-file-confirm-nx-flag-exists:
      test_title: Retrieve flags line from file and confirm 'nx' flag exists.
      capability: independent.textfilecontent54
      object: retrieve-flags-line-from-proc-cpuinfo-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-confirm-line-content
  evaluate:
    test: test-retrieve-flags-line-from-file-confirm-nx-flag-exists
