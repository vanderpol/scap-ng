assessment:
  id: ng.shared.c19217d35adff1061454121c
  version: 1
  assessment_title: The Oracle Linux operating system must audit all uses of the sudoers file and all files in the /etc/sudoers.d/
    directory.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system generates audit records when successful/unsuccessful attempts to access the "/etc/sudoers"
    file and files in the "/etc/sudoers.d/" directory. Check for modification of the following files being audited by performing
    the following commands to check the file system rules in "/etc/audit/audit.rules": # grep -i "/etc/sudoers" /etc/audit/audit.rules
    -w /etc/sudoers -p wa -k privileged-actions # grep -i "/etc/sudoers.d/" /etc/audit/audit.rules -w /etc/sudoers.d/ -p wa
    -k privileged-actions If the commands do not return output that match the examples, this is a finding.'
  inputs: {}
  evidence: []
