assessment:
  id: ng.shared.27896ef8ad77deb96fc2ef08
  version: 1
  assessment_title: TOSS-04-040020 - TOSS must force a frequent session key renegotiation for SSH connections by the client.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*(?i)RekeyLimit\s+(?:\d+[kmg]?)\s+(?:\d+[smdhw]?)+(?-i)\s*
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: text
        value: ^(?i)\s*RekeyLimit\s+[1-9][0-9]*[kmg]?\s+([1-9][0-9]*[smhdw]?)+\s*$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-etc-ssh-sshd-config-rekeylimit-max-data-time-greater-than:
      test_title: /etc/ssh/sshd_config:RekeyLimit max data and time are greater than zero.
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: all_exist
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    test: test-etc-ssh-sshd-config-rekeylimit-max-data-time-greater-than
