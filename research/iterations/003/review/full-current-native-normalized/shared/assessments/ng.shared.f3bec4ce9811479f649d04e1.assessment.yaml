assessment:
  id: ng.shared.f3bec4ce9811479f649d04e1
  version: 1
  assessment_title: The macOS system must be configured to disable the Network File System (NFS) daemon unless it is required.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-nfsd-disable-recommended-object-collection:
      collection_title: os_nfsd_disable_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /bin/launchctl print-disabled system | /usr/bin/grep '"com.apple.nfsd" => disabled'
  tests:
    test-os-nfsd-disable-recommended-test:
      test_title: os_nfsd_disable_recommended_test
      capability: independent.shellcommand
      collection: os-nfsd-disable-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: os_nfsd_disable_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: .*
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-os-nfsd-disable-recommended-test
