assessment:
  id: ng.shared.980ab6020c30996bbca8ca39
  version: 1
  assessment_title: The macOS system must configure SSHD Channel Timeout to 900.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to set the SSHD Channel Timeout to 900 with the following command: /usr/sbin/sshd
    -G | /usr/bin/awk -F "=" ''/channeltimeout session:*/{print $2}'' If the result is not "900", this is a finding.'
  inputs: {}
  evidence: []
