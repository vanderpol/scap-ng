assessment:
  id: ng.shared.8a844c911bd4a137b64924bf
  version: 1
  assessment_title: OL 8 must configure the use of the pam_faillock.so module in the /etc/pam.d/system-auth file.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    retrieve-configuration-from-file-etc-pam-d-system-auth-collection:
      collection_title: 'Retrieve configuration from file: /etc/pam.d/system-auth.'
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/pam.d/system-auth
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .+
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'false'
        multiline: 'true'
        singleline: 'true'
  tests:
    test-verify-pam-faillock-so-module-present-in-etc-pam-d:
      test_title: Verify the pam_faillock.so module is present in the '/etc/pam.d/system-auth' file.
      capability: independent.textfilecontent54
      collection: retrieve-configuration-from-file-etc-pam-d-system-auth-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: AND
        states:
        - state_title: Check that auth required pam_faillock.so preath line exists.
          capability: independent.textfilecontent54
          state:
            field: text
            value: \n\s*auth\s+required\s+pam_faillock.so\s+preauth\b
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: Check that auth required pam_faillock.so authfail line exists.
          capability: independent.textfilecontent54
          state:
            field: text
            value: \n\s*auth\s+required\s+pam_faillock.so\s+authfail\b
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: Check that account required pam_faillock.so line exists.
          capability: independent.textfilecontent54
          state:
            field: text
            value: \n\s*account\s+required\s+pam_faillock.so\b
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: Check that auth required pam_faillock.so preath line preceeds the pam_unix.so line.
          capability: independent.textfilecontent54
          state:
            field: text
            value: \n\s*auth\s+required\s+pam_faillock.so\s+preauth(.*\n)*auth\s+(required|sufficient|requisite)\s+pam_unix.so
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-verify-pam-faillock-so-module-present-in-etc-pam-d
