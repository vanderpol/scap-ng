assessment:
  id: ng.shared.378022bed851cfe777b54c8e
  version: 1
  assessment_title: Successful/unsuccessful uses of the chage command in RHEL 8 must generate an audit record.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that an audit event is generated for any successful/unsuccessful use of the "chage" command by performing
    the following command to check the file system rules in "/etc/audit/audit.rules": $ sudo grep -w chage /etc/audit/audit.rules
    -a always,exit -F path=/usr/bin/chage -F perm=x -F auid>=1000 -F auid!=unset -k privileged-chage If the command does not
    return a line, or the line is commented out, this is a finding.'
  inputs: []
  evidence: []
