assessment:
  id: ng.shared.ab2a74569256e91a20887d3d
  version: 1
  assessment_title: .Xauthority or X*.hosts (or equivalent) file(s) must be used to restrict access to the X server.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If X Display Manager (XDM) is not used on the system, this is not applicable. Determine if XDM is running. Procedure:
    # ps -ef | grep xdm Determine if xauth is being used. Procedure: # xauth xauth> list If the above command sequence does
    not show any host other than the localhost, then xauth is not being used. Search the system for an X*.hosts files, where
    * is a display number that may be used to limit X window connections. If no files are found, X*.hosts files are not being
    used. If the X*.hosts files contain any unauthorized hosts, this is a finding. If both xauth and X*.hosts files are not
    being used, this is a finding.'
  inputs: {}
  evidence: []
