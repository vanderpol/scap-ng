assessment:
  id: ng.shared.4a87d0e5ede91c83aeebdd66
  version: 1
  assessment_title: WN10-SO-000010 - The built-in guest account must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    built-in-guest-sid-collection:
      collection_title: Built-in Guest SID
      capability: windows.sid_sid
      select:
        trustee_sid:
          operation: pattern match
          datatype: string
          mask: false
          value: ^S-1-5-[0-9-]+-501$
    built-in-guest-account-collection:
      collection_title: Built-in Guest account
      capability: windows.user_sid55
      select:
        user_sid:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: built-in-guest-variable
  variables:
    built-in-guest-variable:
      title: Built-in Guest
      kind: local
      datatype: string
      expression:
        values:
          collection: built-in-guest-sid-collection
          field: trustee_sid
  tests:
    test-built-in-guest-account-disabled:
      test_title: The built-in guest account is disabled.
      capability: windows.user_sid55
      collection: built-in-guest-account-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.user_sid55
        state:
          field: enabled
          value: '0'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-built-in-guest-account-disabled
