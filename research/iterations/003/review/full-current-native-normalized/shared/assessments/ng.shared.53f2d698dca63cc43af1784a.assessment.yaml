assessment:
  id: ng.shared.53f2d698dca63cc43af1784a
  version: 1
  assessment_title: The Oracle Linux operating system must audit all uses of the crontab command.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system generates audit records when successful/unsuccessful attempts to use the "crontab"
    command occur. Check that the following system call is being audited by performing the following command to check the
    file system rules in "/etc/audit/audit.rules": $ sudo grep -w "/usr/bin/crontab" /etc/audit/audit.rules -a always,exit
    -F path=/usr/bin/crontab -F perm=x -F auid>=1000 -F auid!=unset -k privileged-cron If the command does not return any
    output, this is a finding.'
  inputs: []
  evidence: []
