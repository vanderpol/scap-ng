assessment:
  id: ng.shared.9a3b5c8a4e0e80ecb85c2fe1
  version: 1
  assessment_title: WN10-AU-000082 - Windows 10 must be configured to audit Object Access - File Share successes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-file-share-is-set-to-success:
      state_title: '''File Share'' is set to ''Success'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: file_share
        value: AUDIT_SUCCESS
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-file-share-is-set-to-success-and-failure:
      state_title: '''File Share'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: file_share
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-file-share-set-success:
      test_title: '''Audit File Share'' is set to ''Success'''
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-file-share-is-set-to-success
      - state-file-share-is-set-to-success-and-failure
  evaluate:
    test: test-audit-file-share-set-success
