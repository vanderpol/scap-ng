assessment:
  id: ng.shared.fae66ef4f65b153adb3e66bc
  version: 1
  assessment_title: UBTU-18-010106 - The Ubuntu operating system must enforce 24 hours/1 day as the minimum password lifetime.
    Passwords for new users must have a 24 hours/1 day minimum password lifetime restriction.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    etc-login-defs-pass-min-days-collection:
      collection_title: /etc/login.defs:PASS_MIN_DAYS
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/login.defs
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*PASS_MIN_DAYS\s+(\d*)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-etc-login-defs-pass-min-days-1:
      test_title: /etc/login.defs:PASS_MIN_DAYS >= 1
      capability: independent.textfilecontent54
      collection: etc-login-defs-pass-min-days-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: '1'
          operation: greater than or equal
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-etc-login-defs-pass-min-days-1
