assessment:
  id: ng.shared.207548e6a9bf7e1bbba7b7e0
  version: 1
  assessment_title: The operating system must employ FIPS-validate or NSA-approved cryptography to implement digital signatures.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    cryptoadm-list-fips-140-collection:
      collection_title: cryptoadm list fips-140
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: cryptoadm list fips-140
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: FIPS 140 mode
  tests:
    test-check-ensure-that-fips-140-encryption-mode-enabled:
      test_title: Check to ensure that FIPS-140 encryption mode is enabled.
      capability: independent.shellcommand
      collection: cryptoadm-list-fips-140-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: All FIPS 140 modules should return 'is enabled''
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: is enabled
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-check-ensure-that-fips-140-encryption-mode-enabled
