assessment:
  id: ng.shared.1ea3e81d694297f86d045781
  version: 1
  assessment_title: Minimum Password Age
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    password-policy-object:
      capability: windows.passwordpolicy
      object_title: Password policy
  variables:
    minimum-password-age-variable:
      title: Minimum Password Age
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: password_minimum_age_var
        validation:
          alternatives:
          - literal: '86400'
            hint: 86400_seconds
          - literal: '172800'
            hint: 172800_seconds
          - literal: '432000'
            hint: 432000_seconds
  states:
    state-minimum-password-age-is-greater-than-or-equal-to-variabl:
      state_title: Minimum Password Age is greater than or equal to variable
      capability: windows.passwordpolicy
      state:
        field: min_passwd_age
        value:
          variable: minimum-password-age-variable
        operation: greater than or equal
        datatype: int
        variable_check: all
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-minimum-password-age-set-at-least-1-day:
      test_title: '''Minimum Password Age'' is set to at least ''1'' day'
      capability: windows.passwordpolicy
      object: password-policy-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-minimum-password-age-is-greater-than-or-equal-to-variabl
  evaluate:
    test: test-minimum-password-age-set-at-least-1-day
