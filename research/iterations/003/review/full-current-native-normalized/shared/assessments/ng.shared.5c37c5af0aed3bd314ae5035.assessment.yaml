assessment:
  id: ng.shared.5c37c5af0aed3bd314ae5035
  version: 1
  assessment_title: WN19-SO-000390 - Windows Server 2019 UIAccess applications must not be allowed to prompt for elevation
    without using the secure desktop.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        name:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: EnableUIADesktopToggle
  tests:
    test-uiaccess-applications-not-allowed-prompt-elevation-without-using-secure-desktop:
      test_title: UIAccess applications is not allowed to prompt for elevation without using the secure desktop.
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-uiaccess-applications-not-allowed-prompt-elevation-without-using-secure-desktop
