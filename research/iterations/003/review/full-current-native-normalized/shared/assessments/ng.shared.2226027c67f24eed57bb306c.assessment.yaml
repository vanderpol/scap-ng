assessment:
  id: ng.shared.2226027c67f24eed57bb306c
  version: 1
  assessment_title: The macOS system must provide an immediate warning to the System Administrator (SA) and Information System
    Security Officer (ISSO) (at a minimum) when allocated audit record storage volume reaches 75 percent of repository maximum
    audit record storage capacity.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    audit-configure-capacity-notify-stig-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/awk -F: ''/^minfree/{print $2}'' /etc/security/audit_control'
      object_title: audit_configure_capacity_notify_stig_object
  states:
    state-audit-configure-capacity-notify-stig-state:
      state_title: audit_configure_capacity_notify_stig_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: '25'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-configure-capacity-notify-stig-test:
      test_title: audit_configure_capacity_notify_stig_test
      capability: independent.shellcommand
      object: audit-configure-capacity-notify-stig-object-object
      check_existence: all_exist
      check: all
      states:
      - state-audit-configure-capacity-notify-stig-state
  evaluate:
    test: test-audit-configure-capacity-notify-stig-test
