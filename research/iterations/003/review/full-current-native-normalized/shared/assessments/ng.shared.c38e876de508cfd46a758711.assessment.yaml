assessment:
  id: ng.shared.c38e876de508cfd46a758711
  version: 1
  assessment_title: The Oracle Linux operating system must not be performing packet forwarding unless the system is a router.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the system is not performing packet forwarding, unless the system is a router. # grep -r net.ipv4.ip_forward
    /run/sysctl.d/* /etc/sysctl.d/* /usr/local/lib/sysctl.d/* /usr/lib/sysctl.d/* /lib/sysctl.d/* /etc/sysctl.conf 2> /dev/null
    net.ipv4.ip_forward = 0 If "net.ipv4.ip_forward" is not configured in the /etc/sysctl.conf file or in any of the other
    sysctl.d directories, is commented out, or does not have a value of "0", this is a finding. Check that the operating system
    does not implement IP forwarding using the following command: # /sbin/sysctl -a | grep net.ipv4.ip_forward net.ipv4.ip_forward
    = 0 If IP forwarding value is "1" and the system is hosting any application, database, or web servers, this is a finding.
    If conflicting results are returned, this is a finding.'
  inputs: []
  evidence: []
