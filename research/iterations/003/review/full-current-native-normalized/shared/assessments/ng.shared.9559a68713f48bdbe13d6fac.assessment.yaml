assessment:
  id: ng.shared.9559a68713f48bdbe13d6fac
  version: 1
  assessment_title: SLES-12-010874 - The SUSE operating system library directories must be owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-file-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: only one
          value:
            variable: operating-system-library-directories-variable
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
      filters:
      - action: include
        state: state-unix-file-2
      behaviors:
        recurse_direction: down
      object_title: null
  variables:
    operating-system-library-directories-variable:
      title: operating system library directories
      kind: constant
      datatype: string
      expression:
        literal:
        - /lib
        - /lib64
        - /usr/lib
        - /usr/lib64
  states:
    state-unix-file:
      state_title: null
      capability: unix.file
      state:
        field: user_id
        value: '0'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-unix-file-2:
      state_title: null
      capability: unix.file
      state:
        field: type
        value: directory
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-operating-system-library-directories-owned-by-root:
      test_title: operating system library directories are owned by root
      capability: unix.file
      object: unix-file-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-unix-file
  evaluate:
    test: test-operating-system-library-directories-owned-by-root
