assessment:
  id: ng.shared.139f00556bf6d072317e28cc
  version: 1
  assessment_title: Duplicate Group IDs (GIDs) must not exist for multiple groups.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    get-any-duplicate-gid-names-collection:
      collection_title: Get any duplicate GID names
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: 'getent group | cut -f3 -d":" | sort -n | uniq -c |\

            while read x ; do

            [ -z "${x}" ] && break

            set - $x

            if [ $1 -gt 1 ]; then

            grps=`getent group | nawk -F: ''($3 == n) { print $1

            }'' n=$2 | xargs`

            echo "Duplicate GID ($2): ${grps}"

            fi

            done'
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
  tests:
    test-duplicate-group-ids-gids-not-exist-multiple-groups:
      test_title: Duplicate Group IDs (GIDs) must not exist for multiple groups.
      capability: independent.shellcommand
      collection: get-any-duplicate-gid-names-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Nothing is returned and command exits with a status of 0
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: ''
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: none_exist
  evaluate:
    test: test-duplicate-group-ids-gids-not-exist-multiple-groups
