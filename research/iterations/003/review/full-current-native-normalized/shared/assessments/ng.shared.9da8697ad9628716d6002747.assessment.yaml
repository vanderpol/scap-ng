assessment:
  id: ng.shared.9da8697ad9628716d6002747
  version: 1
  assessment_title: The Cisco router must be configured to use FIPS-validated Keyed-Hash Message Authentication Code (HMAC)
    to protect the integrity of remote maintenance sessions.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Review the Cisco router configuration to verify that it is compliant with this requirement as shown in the example
    below. NOTE: Although allowed by SP800-131Ar2 for some applications, SHA-1 is considered a compromised hashing standard
    and is being phased out of use by industry and Government standards. Unless required for legacy use, DoD systems should
    not be configured to use SHA-1 for integrity of remote access sessions. SSH Example ip ssh version 2 ip ssh server algorithm
    mac hmac-sha2-256 If the Cisco router is not configured to use FIPS-validated HMAC to protect the integrity of remote
    maintenance sessions, this is a finding.'
  inputs: []
  evidence: []
