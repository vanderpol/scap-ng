assessment:
  id: ng.shared.33748dbbad887156cdddbbb6
  version: 1
  assessment_title: Login services for serial ports must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    svc-system-console-login-terma-collection:
      collection_title: svc:/system/console-login:terma
      capability: solaris.smf
      select:
        fmri:
          operation: equals
          datatype: string
          mask: false
          value: svc://localhost/system/console-login:terma
    svc-system-console-login-termb-collection:
      collection_title: svc:/system/console-login:termb
      capability: solaris.smf
      select:
        fmri:
          operation: equals
          datatype: string
          mask: false
          value: svc://localhost/system/console-login:termb
  tests:
    test-svc-system-console-login-terma-disabled:
      test_title: svc:/system/console-login:terma is disabled
      capability: solaris.smf
      collection: svc-system-console-login-terma-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Disabled state
        state_capability: solaris.smf
        state:
          field: service_state
          value: DISABLED
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-svc-system-console-login-termb-disabled:
      test_title: svc:/system/console-login:termb is disabled
      capability: solaris.smf
      collection: svc-system-console-login-termb-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Disabled state
        state_capability: solaris.smf
        state:
          field: service_state
          value: DISABLED
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-svc-system-console-login-terma-disabled
    - test: test-svc-system-console-login-termb-disabled
