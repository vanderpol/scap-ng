assessment:
  id: ng.shared.6ade80968918e262c4a21815
  version: 1
  assessment_title: SLES-12-010270 - The SUSE operating system must employ user passwords with a minimum lifetime of 24 hours
    (1 day).
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    minimum-password-age-collection:
      collection_title: Minimum password age
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/shadow
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: '^[^:]+:[^:]+:[^:]+:0+:'
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-no-etc-shadow-line-has-minimum-password-age-0:
      test_title: No /etc/shadow line has a minimum password age of 0
      capability: independent.textfilecontent54
      collection: minimum-password-age-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
  evaluate:
    test: test-no-etc-shadow-line-has-minimum-password-age-0
