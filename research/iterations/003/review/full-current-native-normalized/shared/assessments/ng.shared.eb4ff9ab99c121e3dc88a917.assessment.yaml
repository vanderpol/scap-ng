assessment:
  id: ng.shared.eb4ff9ab99c121e3dc88a917
  version: 1
  assessment_title: UBTU-22-211015 - Ubuntu 22.04 LTS must disable the x86 Ctrl-Alt-Delete key sequence.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    unix-symlink-collection:
      collection_title: null
      capability: unix.symlink
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/systemd/system/ctrl-alt-del.target
  tests:
    test-ctrl-alt-del-target-unit-masked:
      test_title: The ctrl-alt-del.target unit is masked.
      capability: unix.symlink
      collection: unix-symlink-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: unix.symlink
        state:
          field: canonical_path
          value: /dev/null
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-ctrl-alt-del-target-unit-masked
