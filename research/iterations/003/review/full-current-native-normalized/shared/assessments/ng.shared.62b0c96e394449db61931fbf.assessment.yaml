assessment:
  id: ng.shared.62b0c96e394449db61931fbf
  version: 1
  assessment_title: World-writable files must not exist.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    files-that-world-writable-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: 'find / \( -fstype nfs -o -fstype cachefs -o -fstype autofs \

            -o -fstype ctfs -o -fstype mntfs -o -fstype objfs \

            -o -fstype proc \) -prune -o -type f -perm -0002 -print'
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
      object_title: Files that are world-writable
  states:
    state-no-stdout-line-data-should-exist:
      state_title: No stdout_line data should exist
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: ''
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: none_exist
  tests:
    test-files-that-world-writable-should-not-exist:
      test_title: Files that are world-writable should not exist
      capability: independent.shellcommand
      object: files-that-world-writable-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-no-stdout-line-data-should-exist
  evaluate:
    test: test-files-that-world-writable-should-not-exist
