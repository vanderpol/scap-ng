assessment:
  id: ng.shared.9e1565b36979e5bd07a7aaa9
  version: 1
  assessment_title: 'WN19-UR-000140 - Windows Server 2019 Increase scheduling priority: user right must only be assigned to
    the Administrators group.'
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-userright-object:
      capability: windows.userright
      select:
        userright:
          operation: equals
          datatype: string
          mask: false
          value: SE_INC_BASE_PRIORITY_NAME
      object_title: null
  states:
    state-windows-userright:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: ''
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-userright-2:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: Administrators
        operation: case insensitive equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-increase-scheduling-priority-administrators:
      test_title: Increase scheduling priority - Administrators
      capability: windows.userright
      object: windows-userright-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-windows-userright
      - state-windows-userright-2
  evaluate:
    test: test-increase-scheduling-priority-administrators
