assessment:
  id: ng.shared.a1355f2dcbf9e7bd390f0829
  version: 1
  assessment_title: The operating system session lock mechanism, when activated on a device with a display screen, must place
    a publicly viewable pattern onto the associated display, hiding what was previously visible on the screen.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    gdm-graphical-login-collection:
      collection_title: The gdm graphical-login.
      capability: solaris.smf
      select:
        fmri:
          operation: equals
          datatype: string
          mask: false
          value: svc://localhost/application/graphical-login/gdm:default
    xdm-graphical-login-collection:
      collection_title: The xdm graphical-login.
      capability: solaris.smf
      select:
        fmri:
          operation: equals
          datatype: string
          mask: false
          value: svc://localhost/application/graphical-login/xdm:default
    mode-field-in-xscreensaver-collection:
      collection_title: mode field in XScreenSaver
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /usr/share/X11/app-defaults/XScreenSaver
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*\*mode:\s*(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    all-users-collection:
      collection_title: All users
      capability: unix.password
      select:
        username:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[^-+].*$
    home-directories-all-user-accounts-collection:
      collection_title: The home directories of all user accounts.
      capability: unix.password
      set:
        operator: union
        members:
        - collection: all-users-collection
        filters:
        - action: exclude
          match:
            field: user_id
            value: '100'
            operation: less than
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: System accounts.
          capability: unix.password
        - action: exclude
          match:
            field: user_id
            value: '60001'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: System account.
          capability: unix.password
        - action: exclude
          match:
            field: user_id
            value: '60002'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: System account.
          capability: unix.password
        - action: exclude
          match:
            field: user_id
            value: '65534'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: System account.
          capability: unix.password
    mode-field-in-user-s-xscreensaver-collection:
      collection_title: mode field in a user's .xscreensaver.
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: home-directories-all-user-accounts-variable
        filename:
          operation: equals
          datatype: string
          mask: false
          value: .xscreensaver
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*mode:\s*(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  variables:
    home-directories-all-user-accounts-variable:
      title: The home directories of all user accounts.
      kind: local
      datatype: string
      expression:
        values:
          collection: home-directories-all-user-accounts-collection
          field: home_dir
  tests:
    test-check-see-if-xwindows-being-run-by-system-using-cdm:
      test_title: Check to see if XWindows is being run by the system, using CDM.
      capability: solaris.smf
      collection: gdm-graphical-login-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: gdm graphical-login is online.
        state_capability: solaris.smf
        state:
          field: service_state
          value: ONLINE
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-check-see-if-xwindows-being-run-by-system-using-xdm:
      test_title: Check to see if XWindows is being run by the system, using XDM.
      capability: solaris.smf
      collection: xdm-graphical-login-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: gdm graphical-login is online.
        state_capability: solaris.smf
        state:
          field: service_state
          value: ONLINE
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-xscreensaver-file-list-blank-as-mode:
      test_title: The XScreenSaver file must list blank as the mode.
      capability: independent.textfilecontent54
      collection: mode-field-in-xscreensaver-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: The blank mode in the default XScreenSaver file.
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: blank
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-all-user-xscreensaver-files-list-blank-as-mode:
      test_title: All user .xscreensaver files must list blank as the mode.
      capability: independent.textfilecontent54
      collection: mode-field-in-user-s-xscreensaver-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: The blank mode in a user's .xscreensaver file
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: blank
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    any:
    - not:
        any:
        - test: test-check-see-if-xwindows-being-run-by-system-using-cdm
        - test: test-check-see-if-xwindows-being-run-by-system-using-xdm
    - all:
      - test: test-xscreensaver-file-list-blank-as-mode
      - test: test-all-user-xscreensaver-files-list-blank-as-mode
