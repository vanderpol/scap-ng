assessment:
  id: ng.shared.07ea35808bc994e2534761b7
  version: 1
  assessment_title: 'OL07-00-021350 - The Oracle Linux operating system must implement NIST FIPS-validated cryptography for
    the following: to provision digital signatures, to generate cryptographic hashes, and to protect data requiring data-at-rest
    protections in accordance with applicable federal laws, Executive Orders, directives, policies, regulations, and standards.'
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-rpminfo-collection:
      collection_title: null
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: prelink
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/sysconfig/prelink
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[\s]*PRELINKING=no[\s]*
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
    linux-rpminfo-collection-2:
      collection_title: null
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: dracut-fips
    independent-textfilecontent54-collection-2:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/default/grub
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*GRUB_CMDLINE_LINUX="(.*)"$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-textfilecontent54-collection-3:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/default/grub
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*GRUB_CMDLINE_LINUX_DEFAULT="(.*)"$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-textfilecontent54-collection-4:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: grub-cfg-locations-variable
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*linux(?:[^#\n]*)/vmlinuz([^#\n]*)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-textfilecontent54-collection-5:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /proc/sys/crypto/fips_enabled
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^1$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-textfilecontent54-collection-6:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/default/grub
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[^#]*fips=0
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    unix-file-collection:
      collection_title: null
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/system-fips
  variables:
    grub-cfg-locations-variable:
      title: grub.cfg locations
      kind: constant
      datatype: string
      expression:
        literal:
        - /boot/grub2/grub.cfg
        - /boot/efi/EFI/redhat/grub.cfg
  tests:
    test-prelink-package-not-installed:
      test_title: Prelink package is not installed
      capability: linux.rpminfo
      collection: linux-rpminfo-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
    test-prelinking-disabled:
      test_title: Prelinking is disabled
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state: null
    test-dracut-fips-package-installed:
      test_title: Dracut-fips package is installed
      capability: linux.rpminfo
      collection: linux-rpminfo-collection-2
      assertion:
        existence: all_exist
        item_quantifier: all
        state: null
    test-fips-1-in-etc-default-grub-via-grub-cmdline-linux:
      test_title: fips=1 in /etc/default/grub via GRUB_CMDLINE_LINUX
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection-2
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^(.* )?fips=1( .*)?$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-fips-1-in-etc-default-grub-via-grub-cmdline-linux-2:
      test_title: fips=1 in /etc/default/grub via GRUB_CMDLINE_LINUX_DEFAULT
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection-3
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^(.* )?fips=1( .*)?$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-fips-1-in-grub-cfg:
      test_title: fips=1 in grub.cfg
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection-4
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^(.* )?fips=1( .*)?$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-1-in-proc-sys-crypto-fips-enabled:
      test_title: 1 in /proc/sys/crypto/fips_enabled
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection-5
      assertion:
        existence: all_exist
        item_quantifier: all
        state: null
    test-fips-0-in-etc-default-grub:
      test_title: fips=0 in /etc/default/grub
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection-6
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
    test-etc-system-fips-exists:
      test_title: /etc/system-fips exists
      capability: unix.file
      collection: unix-file-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    all:
    - any:
      - test: test-prelink-package-not-installed
      - test: test-prelinking-disabled
    - test: test-dracut-fips-package-installed
    - any:
      - test: test-fips-1-in-etc-default-grub-via-grub-cmdline-linux
      - test: test-fips-1-in-etc-default-grub-via-grub-cmdline-linux-2
    - test: test-fips-1-in-grub-cfg
    - test: test-1-in-proc-sys-crypto-fips-enabled
    - test: test-fips-0-in-etc-default-grub
    - test: test-etc-system-fips-exists
