assessment:
  id: ng.shared.b555e258c00940641fd166e1
  version: 1
  assessment_title: The OracleLinux Operating system must audit all executions of privileged functions.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /usr/lib/systemd/system/auditd.service
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^ExecStartPost=\-\/sbin\/augenrules.*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    audit-augenrules-32-bit-execve-syscall-uid-collection:
      collection_title: Audit augenrules 32-bit execve syscall uid
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/rules.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .*\.rules$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\-a\s+always,exit\s+\-F\s+arch=b32\s+\-S\s+execve\s+\-C\s+uid!=euid\s+\-F\s+euid=0\s+(-k[\s]+|-F[\s]+key=)[-\w]+\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
