assessment:
  id: ng.shared.b2de83ec6724726e96a53073
  version: 1
  assessment_title: Restrict Anonymous Network Shares
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Control\Lsa
        name:
          operation: equals
          datatype: string
          mask: false
          value: RestrictAnonymous
  variables:
    network-access-do-not-allow-anonymous-enumeration-sam-accounts-shares-variable:
      title: 'Network access: Do not allow anonymous enumeration of SAM accounts and shares'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: do_not_allow_anonymous_enumeration_sam_accounts_shares_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-network-access-do-not-allow-anonymous-enumeration-sam-accounts-shares:
      test_title: '''Network access: Do not allow anonymous enumeration of SAM accounts and shares'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: network-access-do-not-allow-anonymous-enumeration-sam-accounts-shares-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-network-access-do-not-allow-anonymous-enumeration-sam-accounts-shares
