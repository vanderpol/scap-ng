assessment:
  id: ng.shared.8c7422a575e99f50fbcbfe22
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that all network connections associated with SSH
    traffic terminate after becoming unresponsive.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the SSH server automatically terminates a user session after the SSH client has become unresponsive.
    Check for the value of the "ClientAliveCountMax" keyword with the following command: # grep -i clientalivecount /etc/ssh/sshd_config
    ClientAliveCountMax 0 If "ClientAliveCountMax" is not set to "0", this is a finding.'
  inputs: {}
  evidence: []
