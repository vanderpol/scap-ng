assessment:
  id: ng.shared.96fbfb009868cdc5eea896af
  version: 1
  assessment_title: Users must be notified if a web-based program attempts to install software.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The default behavior is for Internet Explorer to warn users and select whether to allow or refuse installation
    when a web-based program attempts to install software on the system. If the registry value name below does not exist,
    this is not a finding. If it exists and is configured with a value of "0", this is not a finding. If it exists and is
    configured with a value of "1", this is a finding. Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows\Installer\
    Value Name: SafeForScripting Value Type: REG_DWORD Value: 0x00000000 (0) (or if the Value Name does not exist)'
  inputs: {}
  evidence: []
