assessment:
  id: ng.shared.975539276d258de42b25d199
  version: 1
  assessment_title: The macOS system must allow smart card authentication.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to allow smart card authentication with the following command: /usr/bin/osascript
    -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.security.smartcard'')\ .objectForKey(''allowSmartCard'').js
    EOS If the result is not "true", this is a finding.'
  inputs: []
  evidence: []
