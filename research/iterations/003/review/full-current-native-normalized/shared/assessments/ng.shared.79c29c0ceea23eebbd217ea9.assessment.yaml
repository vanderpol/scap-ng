assessment:
  id: ng.shared.79c29c0ceea23eebbd217ea9
  version: 1
  assessment_title: WINCC-000025
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\Windows\DriverSearching
        name:
          operation: equals
          datatype: string
          mask: false
          value: DriverServerSelection
  tests:
    test-specify-search-server-device-driver-updates-set-enabled-search-managed:
      test_title: '''Specify the search server for device driver updates'' is set to ''Enabled'' with ''Search Managed Server''
        selected'
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals 1
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-specify-search-server-device-driver-updates-set-enabled-search-managed
