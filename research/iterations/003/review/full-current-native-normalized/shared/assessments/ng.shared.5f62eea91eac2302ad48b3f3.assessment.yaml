assessment:
  id: ng.shared.5f62eea91eac2302ad48b3f3
  version: 1
  assessment_title: The FTP daemon must not be installed unless required.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    pkg-info-service-network-ftp-collection:
      collection_title: pkg info service/network/ftp
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: pkg info service/network/ftp
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
  tests:
    test-ftp-daemon-not-installed-unless-required:
      test_title: The FTP daemon must not be installed unless required.
      capability: independent.shellcommand
      collection: pkg-info-service-network-ftp-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: stdout_line should not exist
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: ''
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: none_exist
  evaluate:
    test: test-ftp-daemon-not-installed-unless-required
