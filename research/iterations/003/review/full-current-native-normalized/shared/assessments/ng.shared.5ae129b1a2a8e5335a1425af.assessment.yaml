assessment:
  id: ng.shared.5ae129b1a2a8e5335a1425af
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that remote X connections are disabled, unless
    to fulfill documented and validated mission requirements.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Determine if X11Forwarding is disabled with the following command: # grep -i x11forwarding /etc/ssh/sshd_config
    | grep -v "^#" X11Forwarding no If the "X11Forwarding" keyword is set to "yes" and is not documented with the Information
    System Security Officer (ISSO) as an operational requirement or is missing, this is a finding.'
  inputs: {}
  evidence: []
