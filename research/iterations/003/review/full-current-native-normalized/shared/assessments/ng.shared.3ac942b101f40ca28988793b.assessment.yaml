assessment:
  id: ng.shared.3ac942b101f40ca28988793b
  version: 1
  assessment_title: WN10-00-000115 - The Telnet Client must not be installed on the system.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-wmi57-object:
      capability: windows.wmi57
      select:
        namespace:
          operation: equals
          datatype: string
          mask: false
          value: root\cimv2
        wql:
          operation: equals
          datatype: string
          mask: false
          value: SELECT installstate FROM win32_optionalfeature WHERE name = 'TelnetClient'
      object_title: null
  states:
    state-windows-wmi57:
      state_title: null
      capability: windows.wmi57
      state:
        field: result
        value:
          record:
          - name: installstate
            value: '2'
            operation: equals
            datatype: string
            mask: false
            entity_check: at least one
        operation: equals
        datatype: record
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-telnet-client-not-installed-on-system:
      test_title: The Telnet Client is not installed on the system
      capability: windows.wmi57
      object: windows-wmi57-object
      check_existence: all_exist
      check: all
      states:
      - state-windows-wmi57
  evaluate:
    test: test-telnet-client-not-installed-on-system
