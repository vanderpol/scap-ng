assessment:
  id: ng.shared.d61178403defb625043f8f0b
  version: 1
  assessment_title: The operating system must prevent remote devices that have established a non-remote connection with the
    system from communicating outside of the communication path with resources in external networks.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Determine if the "RestrictOutbound" profile is configured properly: # profiles -p RestrictOutbound info If the
    output is not: name=RestrictOutbound desc=Restrict Outbound Connections limitpriv=zone,!net_access this is a finding.
    For users who are not allowed external network access, determine if a user is configured with the "RestrictOutbound" profile.
    # profiles -l [username] If the output does not include: [username]: RestrictOutbound this is a finding.'
  inputs: []
  evidence: []
