assessment:
  id: ng.shared.dc3e0bd6eb6c9409691c7d0c
  version: 1
  assessment_title: Graphical desktop environments provided by the system must automatically lock after 15 minutes of inactivity.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the system is not running XWindows, this check does not apply. Determine if the screen saver timeout is configured
    properly. # grep "^\*timeout:" /usr/share/X11/app-defaults/XScreenSaver If the output is not: *timeout: 0:15:00 this is
    a finding. # grep "^\*lockTimeout:" /usr/share/X11/app-defaults/XScreenSaver If the output is not: *lockTimeout: 0:00:05
    this is a finding. # grep "^\*lock:" /usr/share/X11/app-defaults/XScreenSaver If the output is not: *lock: True this is
    a finding. For each existing user, check the configuration of their personal .xscreensaver file. # grep "^lock:" $HOME/.xscreensaver
    If the output is not: *lock: True this is a finding. grep "^lockTimeout:" $HOME/.xscreensaver If the output is not: *lockTimeout:
    0:00:05 this is a finding.'
  inputs: []
  evidence: []
