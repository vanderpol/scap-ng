assessment:
  id: ng.shared.1970be19cfc1f524586f3743
  version: 1
  assessment_title: The operating system must employ PKI solutions at workstations, servers, or mobile computing devices on
    the network to create, manage, distribute, use, store, and revoke digital certificates.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: The operator will ensure that a DoD approved PKI system is installed, configured, and properly operating. Ask
    the operator to document the PKI software installation and configuration. If the operator is not able to provide a documented
    configuration for an installed PKI system or if the PKI system is not properly configured, maintained, or used, this is
    a finding.
  inputs: {}
  evidence: []
