assessment:
  id: ng.shared.06489234c45335c2e464c028
  version: 1
  assessment_title: Standard user accounts must only have Read permissions to the Active Setup\Installed Components registry
    key.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Run "Regedit". Navigate to the following registry keys and review the permissions: HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Active
    Setup\Installed Components\ HKEY_LOCAL_MACHINE\SOFTWARE\Wow6432Node\Microsoft\Active Setup\Installed Components\ (64-bit
    systems) If the default permissions listed below have been changed, this is a finding. Users - Read Administrators - Full
    Control SYSTEM - Full Control CREATOR OWNER - Full Control (Subkeys only) ALL APPLICATION PACKAGES - Read'
  inputs: []
  evidence: []
