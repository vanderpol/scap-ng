assessment:
  id: ng.shared.1829ee964408eb7d607e1088
  version: 1
  assessment_title: UBTU-18-010238 - The Ubuntu operating system must generate audit records for the /var/log/wtmp file.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/audit.rules
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*-w\s+/var/log/wtmp(?:\s+-p\s+(?:[rx]*w[rx]*a[rx]*|[rx]*a[rx]*w[rx]*))?(?:\s+(?:-k\s+|-F\s+key=)\S+)*\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-textfilecontent54-collection-2:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/audit.rules
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*-a\s+(?:always,exit|exit,always)\s+-F\s+path=/var/log/wtmp\s+-F\s+perm=(?:[rx]*w[rx]*a[rx]*|[rx]*a[rx]*w[rx]*)(?:\s+(?:-k\s+|-F\s+key=)\S+)*\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-audit-modifications-var-log-wtmp-use-file-watch-syntax:
      test_title: Audit modifications to /var/log/wtmp.  Use file watch syntax.
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
    test-audit-modifications-var-log-wtmp-use-system-call-syntax:
      test_title: Audit modifications to /var/log/wtmp.  Use system call syntax.
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection-2
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    any:
    - test: test-audit-modifications-var-log-wtmp-use-file-watch-syntax
    - test: test-audit-modifications-var-log-wtmp-use-system-call-syntax
