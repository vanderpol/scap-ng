assessment:
  id: ng.shared.0c7061e39d3d4bfb0326913c
  version: 1
  assessment_title: The minimum password age must meet requirements.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy
    -> Computer Configuration -> Windows Settings -> Security Settings -> Account Policies -> Password Policy. If the value
    for the "Minimum password age" is set to "0" days ("Password can be changed immediately."), this is a finding.
  inputs: []
  evidence: []
