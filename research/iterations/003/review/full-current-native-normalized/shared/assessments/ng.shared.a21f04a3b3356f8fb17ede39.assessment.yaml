assessment:
  id: ng.shared.a21f04a3b3356f8fb17ede39
  version: 1
  assessment_title: The macOS system must set minimum password lifetime to 24 hours.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    pwpolicy-minimum-lifetime-enforce-stig-object-collection:
      collection_title: pwpolicy_minimum_lifetime_enforce_stig_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/bin/pwpolicy -getaccountpolicies | /usr/bin/tail +2 | /usr/bin/xmllint --xpath '//dict/key[text()="policyAttributeMinimumLifetimeHours"]/following-sibling::integer[1]/text()'
            - | /usr/bin/awk '{ if ($1 >= 24 ) {print "yes"} else {print "no"}}'
  tests:
    test-pwpolicy-minimum-lifetime-enforce-stig-test:
      test_title: pwpolicy_minimum_lifetime_enforce_stig_test
      capability: independent.shellcommand
      collection: pwpolicy-minimum-lifetime-enforce-stig-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: pwpolicy_minimum_lifetime_enforce_stig_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: 'yes'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-pwpolicy-minimum-lifetime-enforce-stig-test
