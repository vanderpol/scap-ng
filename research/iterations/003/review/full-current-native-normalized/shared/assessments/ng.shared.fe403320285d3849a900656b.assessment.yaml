  version: 1
  assessment_title: The macOS system must disable Bluetooth when no approved device is connected.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable Bluetooth with the following command: /usr/bin/osascript -l
    JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.MCXBluetooth'')\ .objectForKey(''DisableBluetooth'').js
    EOS If the result is not "true", this is a finding.'
  inputs: {}
  evidence: []
