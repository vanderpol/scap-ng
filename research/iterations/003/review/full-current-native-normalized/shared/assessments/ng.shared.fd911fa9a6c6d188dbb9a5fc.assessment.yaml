assessment:
  id: ng.shared.fd911fa9a6c6d188dbb9a5fc
  version: 1
  assessment_title: Permissions on user . (hidden) files must be 750 or less permissive.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The root role is required. Ensure that the permissions on user "." files are 750 or less permissive. # for dir
    in \ `logins -ox | awk -F: ''($8 == "PS") { print $6 }''`; do find ${dir}/.[A-Za-z0-9]* \! -type l \ \( -perm -0001 -o
    -perm -0002 -o -perm -0004 -o -perm -0020 \) -ls done If output is produced, this is a finding.'
  inputs: {}
  evidence: []
