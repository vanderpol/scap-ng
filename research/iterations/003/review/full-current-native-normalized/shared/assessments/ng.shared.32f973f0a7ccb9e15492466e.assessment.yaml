assessment:
  id: ng.shared.32f973f0a7ccb9e15492466e
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that all local interactive user home directories
    have mode 0750 or less permissive.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the assigned home directory of all local interactive users has a mode of "0750" or less permissive. Check
    the home directory assignment for all non-privileged users on the system with the following command: Note: This may miss
    interactive users that have been assigned a privileged User Identifier (UID). Evidence of interactive use may be obtained
    from a number of log files containing system logon information. # ls -ld $(awk -F: ''($3>=1000)&&($7 !~ /nologin/){print
    $6}'' /etc/passwd) -rwxr-x--- 1 smithj users 18 Mar 5 17:06 /home/smithj If home directories referenced in "/etc/passwd"
    do not have a mode of "0750" or less permissive, this is a finding.'
  inputs: {}
  evidence: []
