assessment:
  id: ng.shared.3b28434f6cd254814acea2b8
  version: 1
  assessment_title: The macOS system must be configured to lock the user session when a smart token is removed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    system-settings-token-removal-enforce-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.security.smartcard'')\

            .objectForKey(''tokenRemovalAction'').js

            EOS'
      object_title: system_settings_token_removal_enforce_recommended_object
  states:
    state-system-settings-token-removal-enforce-recommended-state:
      state_title: system_settings_token_removal_enforce_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: '1'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-settings-token-removal-enforce-recommended-test:
      test_title: system_settings_token_removal_enforce_recommended_test
      capability: independent.shellcommand
      object: system-settings-token-removal-enforce-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-system-settings-token-removal-enforce-recommended-state
  evaluate:
    test: test-system-settings-token-removal-enforce-recommended-test
