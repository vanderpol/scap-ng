assessment:
  id: ng.shared.784d4c3c20bc6dc78a6ea773
  version: 1
  assessment_title: SRG-APP-000456-WSR-000187
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    iis-version-string-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: Software\Microsoft\InetStp
        name:
          operation: equals
          datatype: string
          value: VersionString
      object_title: IIS Version String
  states:
    state-value-equal-to-8-5:
      state_title: Value Equal To 8.5
      capability: windows.registry
      state:
        field: value
        value: Version 8.5
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-if-microsoft-iis-8-5-installed-this-finding:
      test_title: If Microsoft IIS 8.5 is installed, this is a finding
      capability: windows.registry
      object: iis-version-string-object
      check_existence: none_exist
      check: all
      states:
      - state-value-equal-to-8-5
  evaluate:
    test: test-if-microsoft-iis-8-5-installed-this-finding
