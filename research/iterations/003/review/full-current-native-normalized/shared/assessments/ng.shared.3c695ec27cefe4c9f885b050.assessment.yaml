assessment:
  id: ng.shared.3c695ec27cefe4c9f885b050
  version: 1
  assessment_title: The operating system, upon successful logon, must display to the user the date and time of the last logon
    (access).
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    printlastlog-set-yes-in-etc-ssh-sshd-config-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/ssh
        filename:
          operation: equals
          datatype: string
          value: sshd_config
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*[Pp][Rr][Ii][Nn][Tt][Ll][Aa][Ss][Tt][Ll][Oo][Gg]\s+(\S+)
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: '"PrintLastLog" must be set to "yes" in /etc/ssh/sshd_config.'
  states:
    state-printlastlog-is-set-to-yes:
      state_title: PrintLastLog is set to yes
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: 'yes'
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-check-printlastlog-set-yes-or-nonexistent-in-etc-ssh-sshd:
      test_title: Check "PrintLastLog" is set to "yes" or nonexistent in /etc/ssh/sshd_config.
      capability: independent.textfilecontent54
      object: printlastlog-set-yes-in-etc-ssh-sshd-config-object
      check_existence: any_exist
      check: all
      states:
      - state-printlastlog-is-set-to-yes
  evaluate:
    test: test-check-printlastlog-set-yes-or-nonexistent-in-etc-ssh-sshd
