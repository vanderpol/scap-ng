assessment:
  id: ng.shared.d1d312bb26c4253b16dbe048
  version: 1
  assessment_title: Handwriting Recognition Error Reporting
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: Software\Policies\Microsoft\Windows\HandwritingErrorReports
        name:
          operation: equals
          datatype: string
          value: PreventHandwritingErrorReports
      object_title: null
  variables:
    turn-off-handwriting-recognition-error-reporting-variable:
      title: Turn Off Handwriting Recognition Error Reporting
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: turn_off_handwriting_recognition_error_reporting_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: turn-off-handwriting-recognition-error-reporting-variable
          operation: equals
          datatype: int
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-turn-off-handwriting-recognition-error-reporting-set-enabled:
      test_title: '''Turn off handwriting recognition error reporting'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-turn-off-handwriting-recognition-error-reporting-set-enabled
