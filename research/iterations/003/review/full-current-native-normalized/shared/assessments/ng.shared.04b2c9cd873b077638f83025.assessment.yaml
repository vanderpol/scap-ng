assessment:
  id: ng.shared.04b2c9cd873b077638f83025
  version: 1
  assessment_title: The Exchange email diagnostic log level must be set to the lowest level.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    run-get-eventloglevel-display-all-event-log-levels-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: add-pssnapin Microsoft.Exchange.Management.Powershell.Snapin;Get-EventLogLevel | Format-Table -HideTableHeaders
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: \w
      behaviors:
        error_if_stderr_exists: 'true'
      object_title: Run Get-EventLogLevel to display all event log levels
  states:
    state-verify-value-is-lowest:
      state_title: Verify value is lowest
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: (?i)lowest
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-if-diagnostic-any-eventlevel-not-set-lowest-this-finding:
      test_title: If the Diagnostic of any EventLevel is not set to Lowest, this is a finding.
      capability: independent.shellcommand
      object: run-get-eventloglevel-display-all-event-log-levels-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-verify-value-is-lowest
  evaluate:
    test: test-if-diagnostic-any-eventlevel-not-set-lowest-this-finding
