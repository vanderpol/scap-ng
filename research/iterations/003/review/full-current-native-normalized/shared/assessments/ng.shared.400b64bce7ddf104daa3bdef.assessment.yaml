assessment:
  id: ng.shared.400b64bce7ddf104daa3bdef
  version: 1
  assessment_title: Remotely Accessible Registry Paths and Sub-Paths
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Control\SecurePipeServers\Winreg\AllowedPaths
        name:
          operation: equals
          datatype: string
          mask: false
          value: Machine
  tests:
    test-network-access-remotely-accessible-registry-paths-sub-paths-configured-contain:
      test_title: '''Network access: Remotely accessible registry paths and sub paths'' is configured to contain authorized
        registry paths'
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Value matches ^((Software\\Microsoft\\Windows NT\\CurrentVersion\\Windows)|(System\\CurrentControlSet\\Control\\Print\\Printers)|(System\\CurrentControlSet\\Services\\Eventlog)|(Software\\Microsoft\\OLAP
          Server)|(Software\\Microsoft\\Windows NT\\CurrentVersion\\Print)|(System\\CurrentControlSet\\Control\\ContentIndex)|(System\\CurrentControlSet\\Control\\Terminal
          Server)|(System\\CurrentControlSet\\Control\\Terminal Server\\UserConfig)|(System\\CurrentControlSet\\Control\\Terminal
          Server\\DefaultUserConfiguration)|(Software\\Microsoft\\Windows NT\\CurrentVersion\\Perflib)|(System\\CurrentControlSet\\Services\\SysmonLog))$
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_multi_sz
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: ^((Software\\Microsoft\\Windows NT\\CurrentVersion\\Windows)|(System\\CurrentControlSet\\Control\\Print\\Printers)|(System\\CurrentControlSet\\Services\\Eventlog)|(Software\\Microsoft\\OLAP
              Server)|(Software\\Microsoft\\Windows NT\\CurrentVersion\\Print)|(System\\CurrentControlSet\\Control\\ContentIndex)|(System\\CurrentControlSet\\Control\\Terminal
              Server)|(System\\CurrentControlSet\\Control\\Terminal Server\\UserConfig)|(System\\CurrentControlSet\\Control\\Terminal
              Server\\DefaultUserConfiguration)|(Software\\Microsoft\\Windows NT\\CurrentVersion\\Perflib)|(System\\CurrentControlSet\\Services\\Sysmon[Ll]og)|())$
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-network-access-remotely-accessible-registry-paths-sub-paths-not-configured:
      test_title: '''Network access: Remotely accessible registry paths and sub paths'' is not configured'
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
    test-network-access-remotely-accessible-registry-paths-sub-paths-configured-but:
      test_title: '''Network access: Remotely accessible registry paths and sub paths'' is configured but contains no entries'
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Multi_Sz type and blank value
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_multi_sz
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: .+
            operation: pattern match
            datatype: string
            mask: false
            entity_check: none satisfy
            entity_existence: at_least_one_exists
  evaluate:
    any:
    - test: test-network-access-remotely-accessible-registry-paths-sub-paths-configured-contain
    - test: test-network-access-remotely-accessible-registry-paths-sub-paths-not-configured
    - test: test-network-access-remotely-accessible-registry-paths-sub-paths-configured-but
