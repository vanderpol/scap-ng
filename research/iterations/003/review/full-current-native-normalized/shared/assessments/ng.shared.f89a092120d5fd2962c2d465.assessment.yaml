assessment:
  id: ng.shared.f89a092120d5fd2962c2d465
  version: 1
  assessment_title: The macOS system must require that passwords contain a minimum of one lowercase character and one uppercase
    character.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    pwpolicy-custom-regex-enforce-stig-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: zsh
        command:
          operation: equals
          datatype: string
          value: /usr/bin/pwpolicy -getaccountpolicies | /usr/bin/tail +2 | /usr/bin/xmllint --xpath 'boolean(//*[contains(text(),"policyAttributePassword
            matches '\''^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9]).*$'\''")])' -
      object_title: pwpolicy_custom_regex_enforce_stig_object
  states:
    state-pwpolicy-custom-regex-enforce-stig-state:
      state_title: pwpolicy_custom_regex_enforce_stig_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: 'true'
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-pwpolicy-custom-regex-enforce-stig-test:
      test_title: pwpolicy_custom_regex_enforce_stig_test
      capability: independent.shellcommand
      object: pwpolicy-custom-regex-enforce-stig-object-object
      check_existence: all_exist
      check: all
      states:
      - state-pwpolicy-custom-regex-enforce-stig-state
  evaluate:
    test: test-pwpolicy-custom-regex-enforce-stig-test
