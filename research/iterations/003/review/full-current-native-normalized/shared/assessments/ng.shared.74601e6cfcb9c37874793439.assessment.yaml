assessment:
  id: ng.shared.74601e6cfcb9c37874793439
  version: 1
  assessment_title: SQL Server User Options feature must be disabled, unless specifically required and approved.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'To determine if "User Options" option is enabled, execute the following query: EXEC SP_CONFIGURE ''show advanced
    options'', ''1''; RECONFIGURE WITH OVERRIDE; EXEC SP_CONFIGURE ''user options''; If the value of "config_value" is "0",
    this is not a finding. If the value of "config_value" is "1", review the system documentation to determine whether the
    use of "user options" is required and authorized. If it is not authorized, this is a finding.'
  inputs: []
  evidence: []
