assessment:
  id: ng.shared.9db0ce92cb4c4819a3ef98a0
  version: 1
  assessment_title: WN10-CC-000185 - The default autorun behavior must be configured to prevent autorun commands.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Microsoft\Windows\CurrentVersion\Policies\Explorer
        name:
          operation: equals
          datatype: string
          mask: false
          value: NoAutorun
  tests:
    test-default-behavior-autorun-set-enabled-do-not-execute-any-autorun:
      test_title: '''Default behavior for AutoRun'' is set to ''Enabled'' with ''Do not execute any autorun commands'' selected'
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-default-behavior-autorun-set-enabled-do-not-execute-any-autorun
