assessment:
  id: ng.shared.910283b0889e942549eab39a
  version: 1
  assessment_title: Network - Windows Connect Now Wizards
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\Windows\WCN\UI
        name:
          operation: equals
          datatype: string
          mask: false
          value: DisableWcnUi
  variables:
    prohibit-access-windows-connect-now-wizards-variable:
      title: Prohibit Access of the Windows Connect Now Wizards
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: prohibit_access_of_the_windows_connect_now_wizards_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-prohibit-access-windows-connect-now-wizards-set-enabled:
      test_title: '''Prohibit Access of the Windows Connect Now wizards'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: prohibit-access-windows-connect-now-wizards-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-prohibit-access-windows-connect-now-wizards-set-enabled
