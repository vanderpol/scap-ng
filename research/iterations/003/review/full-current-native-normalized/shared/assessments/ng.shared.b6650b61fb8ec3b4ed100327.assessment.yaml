assessment:
  id: ng.shared.b6650b61fb8ec3b4ed100327
  version: 1
  assessment_title: WN19-DC-000020 - Windows Server 2019 Kerberos user logon restrictions must be enforced.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    kerberos-policy-enforce-user-logon-restrictions-object:
      capability: windows.wmi.query
      object_title: Kerberos Policy - Enforce user logon restrictions
      collect:
        namespace: root\rsop\computer
        query: SELECT setting FROM RSOP_SecuritySettingBoolean WHERE KeyName='TicketValidateClient'
  states:
    state-kerberos-policy-enforce-user-logon-restrictions-enabled-:
      state_title: Kerberos Policy - Enforce user logon restrictions - Enabled, PA test = -1
      capability: windows.wmi.query
      state:
        field: result
        record:
          mask: false
          match: all
          existence: some
          fields:
            setting:
              value: '-1'
              operation: equal
              datatype: string
              mask: false
              match: all
              existence: some
    state-kerberos-policy-enforce-user-logon-restrictions-enabled--2:
      state_title: Kerberos Policy - Enforce user logon restrictions - Enabled, Other tools test = 1
      capability: windows.wmi.query
      state:
        field: result
        record:
          mask: false
          match: all
          existence: some
          fields:
            setting:
              value: '1'
              operation: equal
              datatype: string
              mask: false
              match: all
              existence: some
  tests:
    test-kerberos-user-logon-restrictions-enforced-pa-test-1-or-other:
      test_title: Kerberos user logon restrictions must be enforced, PA test = -1 OR Other tools test = 1
      capability: windows.wmi.query
      object: kerberos-policy-enforce-user-logon-restrictions-object
      states:
      - state-kerberos-policy-enforce-user-logon-restrictions-enabled-
      - state-kerberos-policy-enforce-user-logon-restrictions-enabled--2
      existence: some
      match: all
      states_match: any
  evaluate:
    test: test-kerberos-user-logon-restrictions-enforced-pa-test-1-or-other
