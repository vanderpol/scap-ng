assessment:
  id: ng.shared.8ffab565d7d454edc2689f91
  version: 1
  assessment_title: The Cisco router must be configured to allocate audit record storage capacity in accordance with organization-defined
    audit record storage requirements.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that the Cisco router is configured with a logging buffer size. The configuration should look like the
    example below: logging buffered xxxxxxxx informational If a logging buffer size is not configured, this is a finding.
    If the Cisco router is not configured to allocate audit record storage capacity in accordance with organization-defined
    audit record storage requirements, this is a finding.'
  inputs: []
  evidence: []
