assessment:
  id: ng.shared.33c8a749b63fc0aa528d5cc8
  version: 1
  assessment_title: The boundary protection system (firewall) must be configured to deny network traffic by default and must
    allow network traffic by exception (i.e., deny all, permit by exception).
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    svcs-firewall-default-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: svcs firewall:default
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: 'svc:'
      object_title: svcs firewall:default
    pfctl-s-rules-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: pfctl -s rules
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
      object_title: pfctl -s rules
    svcs-firewall-pflog-default-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: svcs firewall/pflog:default
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: 'svc:'
      object_title: svcs firewall/pflog:default
  states:
    state-line-returns-online:
      state_title: line returns online
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: online
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    state-line-exists-that-blocks-drops-and-logs-all:
      state_title: line exists that blocks drops and logs all
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: ^block drop log.* all$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: at least one
          entity_existence: at_least_one_exists
  tests:
    test-check-that-packet-filter-firewall-enabled-configured-so-that-only:
      test_title: Check that the Packet Filter firewall is enabled and configured so that only authorized sessions are allowed.
      capability: independent.shellcommand
      object: svcs-firewall-default-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-line-returns-online
    test-check-that-filters-configured-properly:
      test_title: Check that the filters are configured properly.
      capability: independent.shellcommand
      object: pfctl-s-rules-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-line-exists-that-blocks-drops-and-logs-all
    test-check-that-packet-filter-firewall-logging-daemon-enabled:
      test_title: Check that the Packet Filter firewall logging daemon is enabled.
      capability: independent.shellcommand
      object: svcs-firewall-pflog-default-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-line-returns-online
  evaluate:
    all:
    - test: test-check-that-packet-filter-firewall-enabled-configured-so-that-only
    - test: test-check-that-filters-configured-properly
    - test: test-check-that-packet-filter-firewall-logging-daemon-enabled
