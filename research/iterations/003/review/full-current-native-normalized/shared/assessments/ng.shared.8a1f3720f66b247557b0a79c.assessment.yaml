  version: 1
  assessment_title: The macOS system must disable Privacy Setup services during Setup Assistant.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable Privacy Setup services during Setup Assistant with the following
    command: /usr/bin/osascript -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.SetupAssistant.managed'')\
    .objectForKey(''SkipPrivacySetup'').js EOS If the result is not "true", this is a finding.'
  inputs: {}
  evidence: []
