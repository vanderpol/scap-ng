assessment:
  id: ng.shared.f92ab46be8f44ece07ae489d
  version: 1
  assessment_title: The macOS system must be configured to audit all failed write actions on the system.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to audit all failed write actions on the system with the following command:
    /usr/bin/awk -F'':'' ''/^flags/ { print $NF }'' /etc/security/audit_control | /usr/bin/tr '','' ''\n'' | /usr/bin/grep
    -Ec ''\-fw'' If the result is not "1", this is a finding.'
  inputs: []
  evidence: []
