assessment:
  id: ng.shared.b2db96f44c1671962d311183
  version: 1
  assessment_title: The macOS system must be configured to disable SMB File Sharing unless it is required.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    system-settings-smbd-disable-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /bin/launchctl print-disabled system | /usr/bin/grep '"com.apple.smbd" => disabled'
      object_title: system_settings_smbd_disable_recommended_object
  states:
    state-system-settings-smbd-disable-recommended-state:
      state_title: system_settings_smbd_disable_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: .*
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-settings-smbd-disable-recommended-test:
      test_title: system_settings_smbd_disable_recommended_test
      capability: independent.shellcommand
      object: system-settings-smbd-disable-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-system-settings-smbd-disable-recommended-state
  evaluate:
    test: test-system-settings-smbd-disable-recommended-test
