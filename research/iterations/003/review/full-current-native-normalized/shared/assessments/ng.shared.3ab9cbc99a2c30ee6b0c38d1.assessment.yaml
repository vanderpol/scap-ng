assessment:
  id: ng.shared.3ab9cbc99a2c30ee6b0c38d1
  version: 1
  assessment_title: TCP Wrappers must be enabled and configured per site policy to only allow access by approved hosts and
    services.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    inetadm-p-grep-tcp-wrappers-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: inetadm -p | grep tcp_wrappers
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: tcp_wrappers
      object_title: inetadm -p | grep tcp_wrappers
    etc-hosts-deny-object:
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/hosts.deny
      object_title: /etc/hosts.deny
    etc-hosts-allow-object:
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/hosts.allow
      object_title: /etc/hosts.allow
  states:
    state-check-that-line-returns-tcp-wrappers-true:
      state_title: Check that line returns tcp_wrappers=TRUE
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: tcp_wrappers=TRUE
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-tcp-wrappers-enabled:
      test_title: TCP Wrappers must be enabled
      capability: independent.shellcommand
      object: inetadm-p-grep-tcp-wrappers-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-check-that-line-returns-tcp-wrappers-true
    test-etc-hosts-deny-exists:
      test_title: /etc/hosts.deny exists
      capability: unix.file
      object: etc-hosts-deny-object
      check_existence: at_least_one_exists
      check: all
    test-etc-hosts-allow-exists:
      test_title: /etc/hosts.allow exists
      capability: unix.file
      object: etc-hosts-allow-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    all:
    - test: test-tcp-wrappers-enabled
    - test: test-etc-hosts-deny-exists
    - test: test-etc-hosts-allow-exists
