assessment:
  id: ng.shared.aa93ef85a38f58012474cc5d
  version: 1
  assessment_title: WN10-AU-000570 - Windows 10 must be configured to audit Detailed File Share Failures.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-windows-auditeventpolicysubcategories:
      state_title: null
      capability: windows.auditeventpolicysubcategories
      state:
        field: detailed_file_share
        value: AUDIT_FAILURE
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-auditeventpolicysubcategories-2:
      state_title: null
      capability: windows.auditeventpolicysubcategories
      state:
        field: detailed_file_share
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-detailed-file-share-set-failure-or-success-failure:
      test_title: '''Detailed File Share'' is set to ''Failure'' or ''Success and Failure'''
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-windows-auditeventpolicysubcategories
      - state-windows-auditeventpolicysubcategories-2
  evaluate:
    test: test-detailed-file-share-set-failure-or-success-failure
