assessment:
  id: ng.shared.c401764b759785ec91f7a2d7
  version: 1
  assessment_title: The macOS system must disable Media Sharing.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable Media Sharing with the following commands: /usr/bin/osascript
    -l JavaScript << EOS function run() { let pref1 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\
    .objectForKey(''allowMediaSharing'')) let pref2 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\
    .objectForKey(''allowMediaSharingModification'')) if ( pref1 == false && pref2 == false ) { return("true") } else { return("false")
    } } EOS If the result is not "true", this is a finding.'
  inputs: {}
  evidence: []
