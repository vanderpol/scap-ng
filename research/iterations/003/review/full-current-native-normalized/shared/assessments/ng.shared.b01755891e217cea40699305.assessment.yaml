assessment:
  id: ng.shared.b01755891e217cea40699305
  version: 1
  assessment_title: Windows 2012 / 2012 R2 must automatically remove or disable temporary user accounts after 72 hours.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Determine if temporary user accounts are used and identify any that exist. If none exist, this is NA. Review
    temporary user accounts for expiration dates. Open "PowerShell". Domain Controllers: Enter "Search-ADAccount -AccountExpiring
    -TimeSpan 3:00:00:00 | FT Name, AccountExpirationDate" This will return any accounts configured to expire within the next
    3 days. (The "TimeSpan" value to can be changed to find accounts configured to expire at various times such as 30 for
    the next month.) If any accounts identified as temporary are not listed, this is a finding. For any temporary accounts
    returned by the previous query: Enter "Get-ADUser -Identity [Name] -Property WhenCreated" to determine when the account
    was created. If the "WhenCreated" date and "AccountExpirationDate" from the previous query are greater than 3 days apart,
    this is a finding. Member servers and standalone systems: Enter "Net User [username]", where [username] is the name of
    the temporary user account. If "Account expires" has not been defined within 72 hours for any temporary user account,
    this is a finding. If the "Password last set" date and "Account expires" date are greater than 72 hours apart, this is
    a finding. (Net User does not provide an account creation date.)'
  inputs: []
  evidence: []
