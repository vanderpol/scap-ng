assessment:
  id: ng.shared.5791a49234f5f38a849ecf40
  version: 1
  assessment_title: The time service must synchronize with an appropriate DoD time source.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Open "Windows PowerShell" or an elevated "Command Prompt" (run as administrator). Enter "W32tm /query /configuration".
    Domain-joined systems are automatically configured with a "Type" of "NT5DS" to synchronize with domain controllers and
    would not be a finding. If systems are configured with a "Type" of "NTP", including standalone systems and the forest
    root domain controller with the PDC Emulator role, and do not have a DoD time server defined for "NTPServer", this is
    a finding. (See V-8557 in the Active Directory Forest STIG for the time source requirement of the forest root domain PDC
    emulator.) If an alternate time synchronization tool is used and is not enabled or not configured to synchronize with
    a DoD time source, this is a finding. The US Naval Observatory operates stratum 1 time servers, which are identified at:
    https://www.cnmoc.usff.navy.mil/Organization/United-States-Naval-Observatory/Precise-Time-Department/Network-Time-Protocol-NTP/
    Time synchronization will occur through a hierarchy of time servers down to the local level. Clients and lower-level servers
    will synchronize with an authorized time server in the hierarchy.'
  inputs: {}
  evidence: []
