assessment:
  id: ng.shared.515848d92cae4260536637d0
  version: 1
  assessment_title: Find world writable directories not group-owned by a system account
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    all-local-directories-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
      filters:
      - action: include
        state: state-gid-greater-than-or-equal-to-1000-and-world-writable
      behaviors:
        max_depth: '-1'
        recurse: directories
        recurse_direction: down
        recurse_file_system: local
      object_title: all local directories
  states:
    state-gid-greater-than-or-equal-to-1000-and-world-writable:
      state_title: gid greater than or equal to 1000 and world writable
      capability: unix.file
      state:
        all:
        - field: group_id
          value: '1000'
          operation: greater than or equal
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: owrite
          value: 'true'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-check-local-directories-that-world-writable-have-gid-greater-than:
      test_title: check for local directories that are world writable and have gid greater than or equal to 1000
      capability: unix.file
      object: all-local-directories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-gid-greater-than-or-equal-to-1000-and-world-writable
  evaluate:
    not:
      test: test-check-local-directories-that-world-writable-have-gid-greater-than
