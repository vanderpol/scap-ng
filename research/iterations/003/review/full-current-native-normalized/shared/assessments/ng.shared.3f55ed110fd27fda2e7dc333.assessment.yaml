assessment:
  id: ng.shared.3f55ed110fd27fda2e7dc333
  version: 1
  assessment_title: Windows Server 2016 must have the built-in Windows password complexity policy enabled.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy
    >> Computer Configuration >> Windows Settings >> Security Settings >> Account Policies >> Password Policy. If the value
    for "Password must meet complexity requirements" is not set to "Enabled", this is a finding. For server core installations,
    run the following command: Secedit /Export /Areas SecurityPolicy /CFG C:\Path\FileName.Txt If "PasswordComplexity" equals
    "0" in the file, this is a finding. Note: If an external password filter is in use that enforces all four character types
    and requires this setting to be set to "Disabled", this would not be considered a finding. If this setting does not affect
    the use of an external password filter, it must be enabled for fallback purposes.'
  inputs: {}
  evidence: []
