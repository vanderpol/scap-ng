assessment:
  id: ng.shared.fd4b55017e025637f13e73a0
  version: 1
  assessment_title: All .Xauthority files must have mode 0600 or less permissive.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    gdm-graphical-login-object:
      capability: solaris.smf
      select:
        fmri:
          operation: equals
          datatype: string
          value: svc://localhost/application/graphical-login/gdm:default
      object_title: The gdm graphical-login.
    xdm-graphical-login-object:
      capability: solaris.smf
      select:
        fmri:
          operation: equals
          datatype: string
          value: svc://localhost/application/graphical-login/xdm:default
      object_title: The xdm graphical-login.
    all-usernames-object:
      capability: unix.password
      select:
        username:
          operation: pattern match
          datatype: string
          value: .*
      object_title: All usernames
    xauthority-file-location-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          variable_check: at least one
          value:
            variable: user-home-directories-variable
        filename:
          operation: equals
          datatype: string
          value: .Xauthority
      object_title: .Xauthority file location
  variables:
    user-home-directories-variable:
      title: User Home Directories
      kind: local
      datatype: string
      expression:
        values:
          object: all-usernames-object
          field: home_dir
  states:
    state-gdm-graphical-login-is-online:
      state_title: gdm graphical-login is online.
      capability: solaris.smf
      state:
        field: service_state
        value: ONLINE
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-permission-0600:
      state_title: Permission 0600
      capability: unix.file
      state:
        all:
        - field: suid
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: sgid
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: uexec
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: gread
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: gwrite
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: gexec
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: oread
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: owrite
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: oexec
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-check-see-if-xwindows-being-run-by-system-using-cdm:
      test_title: Check to see if XWindows is being run by the system, using CDM.
      capability: solaris.smf
      object: gdm-graphical-login-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-gdm-graphical-login-is-online
    test-check-see-if-xwindows-being-run-by-system-using-xdm:
      test_title: Check to see if XWindows is being run by the system, using XDM.
      capability: solaris.smf
      object: xdm-graphical-login-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-gdm-graphical-login-is-online
    test-xauthority-files-have-mode-0600-or-less-permissive:
      test_title: .Xauthority files must have mode 0600 or less permissive
      capability: unix.file
      object: xauthority-file-location-object
      check_existence: any_exist
      check: all
      states:
      - state-permission-0600
  evaluate:
    any:
    - not:
        any:
        - test: test-check-see-if-xwindows-being-run-by-system-using-cdm
        - test: test-check-see-if-xwindows-being-run-by-system-using-xdm
    - test: test-xauthority-files-have-mode-0600-or-less-permissive
