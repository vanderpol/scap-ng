assessment:
  id: ng.shared.842aa28e26367c77f19df63b
  version: 1
  assessment_title: WN10-CC-000030 - The system must be configured to prevent Internet Control Message Protocol (ICMP) redirects
    from overriding Open Shortest Path First (OSPF) generated routes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SYSTEM\CurrentControlSet\Services\Tcpip\Parameters
        name:
          operation: equals
          datatype: string
          value: EnableICMPRedirect
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-mss-enableicmpredirect-allow-icmp-redirects-override-ospf-generated-routes-set:
      test_title: '''MSS: (EnableICMPRedirect) Allow ICMP redirects to override OSPF generated routes'' is set to ''Disabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-mss-enableicmpredirect-allow-icmp-redirects-override-ospf-generated-routes-set
