assessment:
  id: ng.shared.d46d337e2cee5f4d4c98046b
  version: 1
  assessment_title: 'WN19-SO-000200 - Windows Server 2019 setting Microsoft network server: Digitally sign communications
    (if client agrees) must be configured to Enabled.'
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    check-registry-value-at-hkey-local-machine-system-currentcontrolset-services-collection:
      collection_title: Check the registry value at HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters\EnableSecuritySignature
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Services\LanManServer\Parameters
        name:
          operation: equals
          datatype: string
          mask: false
          value: EnableSecuritySignature
  tests:
    test-microsoft-network-server-digitally-sign-communications-if-client-agrees-set:
      test_title: '''Microsoft network server: Digitally sign communications (if client agrees)'' is set to ''Enabled'''
      capability: windows.registry
      collection: check-registry-value-at-hkey-local-machine-system-currentcontrolset-services-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-microsoft-network-server-digitally-sign-communications-if-client-agrees-set
