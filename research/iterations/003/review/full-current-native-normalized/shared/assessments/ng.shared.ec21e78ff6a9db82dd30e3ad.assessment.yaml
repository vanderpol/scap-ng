assessment:
  id: ng.shared.ec21e78ff6a9db82dd30e3ad
  version: 1
  assessment_title: WN10-CC-000010 - The display of slide shows on the lock screen must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    registry-object-hkey-local-machine-software-policies-microsoft-windows-personalization-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SOFTWARE\Policies\Microsoft\Windows\Personalization
        name:
          operation: equals
          datatype: string
          value: NoLockScreenSlideshow
      object_title: Registry object for HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\Personalization\NoLockScreenSlideshow
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-verifies-prevent-enabling-lock-screen-slide-show-set-enabled:
      test_title: Verifies 'Prevent enabling lock screen slide show' is set to 'Enabled'
      capability: windows.registry
      object: registry-object-hkey-local-machine-software-policies-microsoft-windows-personalization-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-verifies-prevent-enabling-lock-screen-slide-show-set-enabled
