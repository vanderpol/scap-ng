assessment:
  id: ng.shared.e5fcdc472a9ba0291a0189bd
  version: 1
  assessment_title: The Ubuntu operating system must allocate audit record storage capacity to store at least one weeks worth
    of audit records, when audit records are not immediately sent to a central audit record storage facility.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-allocate-audit-record-storage-capacity-store-at-least-one-collection-2:
      collection_title: The OS must allocate audit record storage capacity to store at least one weeks' worth of audit records,
        when audit records are not immediately sent to a central audit record storage facility.
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/auditd.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: log_file\s+=\s+(\/\S+\/)+\S+\s*
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    os-allocate-audit-record-storage-capacity-store-at-least-one-collection:
      collection_title: The OS must allocate audit record storage capacity to store at least one weeks' worth of audit records,
        when audit records are not immediately sent to a central audit record storage facility.
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: determine-path-audit-log-file-variable
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: (?:\/\w+)+\/\S+\s+(\d+(\.\d+)*)(?:[KMGTP])\s+(?:\d+(?:\.\d+)*)(?:[KMGTP])\s+(?:\d+(?:\.\d+)*)(?:[KMGTP])
    os-allocate-audit-record-storage-capacity-store-at-least-one-collection-3:
      collection_title: The OS must allocate audit record storage capacity to store at least one weeks' worth of audit records,
        when audit records are not immediately sent to a central audit record storage facility.
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: determine-path-audit-log-file-variable
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: (?:\/\w+)+\/\S+\s+(?:\d+(?:\.\d+)*)(?:[KMGTP])\s+(?:\d+(?:\.\d+)*)(?:[KMGTP])\s+(\d+(\.\d+)*)(?:[KMGTP])
  variables:
    determine-path-audit-log-file-variable:
      title: Determine path to audit.log file
      kind: local
      datatype: string
      expression:
        concat:
        - literal:
            value: 'df -h '
            datatype: string
        - values:
            collection: os-allocate-audit-record-storage-capacity-store-at-least-one-collection-2
            field: subexpression
  tests:
    test-os-allocate-audit-record-storage-capacity-store-at-least-one:
      test_title: The OS must allocate audit record storage capacity to store at least one weeks' worth of audit records,
        when audit records are not immediately sent to a central audit record storage facility. Log partition size is greater
        than or equal to 10G.
      capability: independent.shellcommand
      collection: os-allocate-audit-record-storage-capacity-store-at-least-one-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: The OS must allocate audit record storage capacity to store at least one weeks' worth of audit records,
          when audit records are not immediately sent to a central audit record storage facility.
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: subexpression
            value: '10.0'
            operation: greater than or equal
            datatype: float
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-os-allocate-audit-record-storage-capacity-store-at-least-one-2:
      test_title: The OS must allocate audit record storage capacity to store at least one weeks' worth of audit records,
        when audit records are not immediately sent to a central audit record storage facility. Free space on log partition
        greater than or equal to 10G.
      capability: independent.shellcommand
      collection: os-allocate-audit-record-storage-capacity-store-at-least-one-collection-3
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: The OS must allocate audit record storage capacity to store at least one weeks' worth of audit records,
          when audit records are not immediately sent to a central audit record storage facility.
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: subexpression
            value: '10.0'
            operation: greater than or equal
            datatype: float
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-os-allocate-audit-record-storage-capacity-store-at-least-one
    - test: test-os-allocate-audit-record-storage-capacity-store-at-least-one-2
