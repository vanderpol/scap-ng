assessment:
  id: ng.shared.4b779a7bf6fb5f99e723503d
  version: 1
  assessment_title: The macOS system must compare internal information system clocks at least every 24 hours with a server
    that is synchronized to one of the redundant United States Naval Observatory (USNO) time servers or a time server designated
    for the appropriate DOD network (NIPRNet/SIPRNet) and/or the Global Positioning System (GPS).
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    os-time-server-enabled-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: zsh
        command:
          operation: equals
          datatype: string
          value: /bin/launchctl print system | /usr/bin/grep com.apple.timed
      object_title: os_time_server_enabled_recommended_object
  states:
    state-os-time-server-enabled-recommended-state:
      state_title: os_time_server_enabled_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: .*
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-os-time-server-enabled-recommended-test:
      test_title: os_time_server_enabled_recommended_test
      capability: independent.shellcommand
      object: os-time-server-enabled-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-os-time-server-enabled-recommended-state
  evaluate:
    test: test-os-time-server-enabled-recommended-test
