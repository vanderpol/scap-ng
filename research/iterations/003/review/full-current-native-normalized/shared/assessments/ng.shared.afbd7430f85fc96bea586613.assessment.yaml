assessment:
  id: ng.shared.afbd7430f85fc96bea586613
  version: 1
  assessment_title: Users must have a valid home directory assignment.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    all-users-object:
      capability: unix.password
      select:
        username:
          operation: pattern match
          datatype: string
          value: ^[^-+].*$
      object_title: All users
  states:
    state-non-empty-home-directory-entry:
      state_title: non-empty home directory entry
      capability: unix.password
      state:
        field: home_dir
        value: ^.+
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-user-home-directory-assignments-not-blank:
      test_title: user home directory assignments are not blank
      capability: unix.password
      object: all-users-object
      check_existence: any_exist
      check: all
      states:
      - state-non-empty-home-directory-entry
  evaluate:
    test: test-user-home-directory-assignments-not-blank
