assessment:
  id: ng.shared.3fcff9f3c064cd919c52c9cc
  version: 1
  assessment_title: OL08-00-010580 - OL 8 must prevent special devices on non-root local partitions.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-partition-object:
      capability: linux.partition
      select:
        mount_point:
          operation: pattern match
          datatype: string
          mask: false
          value: ^/\S+$
      filters:
      - action: include
        state: state-linux-partition-2
      object_title: null
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/fstab
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*/dev\S*\s+/\S+\s+\S+\s+(\S+)\s+\S+\s+\S+\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: null
  states:
    state-linux-partition:
      state_title: null
      capability: linux.partition
      state:
        field: mount_options
        value: nodev
        operation: equals
        datatype: string
        mask: false
        entity_check: at least one
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: (?:^nodev$|^nodev,|,nodev$|,nodev,)
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-linux-partition-2:
      state_title: null
      capability: linux.partition
      state:
        field: device
        value: ^/dev\S*$
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-device-files-mounted-nodev-option-mounts-on-ignored:
      test_title: Device files are mounted with the nodev option.  Mounts on '/' are ignored.
      capability: linux.partition
      object: linux-partition-object
      check_existence: any_exist
      check: all
      states:
      - state-linux-partition
    test-device-files-configured-in-etc-fstab-use-nodev-option-mounts:
      test_title: Device files are configured in /etc/fstab to use the nodev option.  Mounts on '/' are ignored.
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: any_exist
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    all:
    - test: test-device-files-mounted-nodev-option-mounts-on-ignored
    - test: test-device-files-configured-in-etc-fstab-use-nodev-option-mounts
