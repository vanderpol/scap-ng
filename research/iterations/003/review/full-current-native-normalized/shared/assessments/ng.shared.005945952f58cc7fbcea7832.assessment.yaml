assessment:
  id: ng.shared.005945952f58cc7fbcea7832
  version: 1
  assessment_title: PowerShell script block logging must be enabled on Windows 2012/2012 R2.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding. Registry
    Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging\ Value Name:
    EnableScriptBlockLogging Value Type: REG_DWORD Value: 0x00000001 (1) PowerShell 4.0 requires the installation of patch
    KB3000850 on Windows 2012 R2 or KB3119938 on Windows 2012. If the patch is not installed on systems with PowerShell 4.0,
    this is a finding. PowerShell 5.x does not require the installation of an additional patch.'
  inputs: {}
  evidence: []
