assessment:
  id: ng.shared.25451f501fc014530983964f
  version: 1
  assessment_title: Anonymous Access to Named Pipes and Shares
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Services\LanManServer\Parameters
        name:
          operation: equals
          datatype: string
          mask: false
          value: restrictnullsessaccess
      object_title: null
  variables:
    network-access-restrict-anonymous-access-named-pipes-shares-variable:
      title: 'Network access: Restrict anonymous access to Named Pipes and Shares'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: restrict_anonymous_access_to_named_pipes_and_shares_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: network-access-restrict-anonymous-access-named-pipes-shares-variable
          operation: equals
          datatype: int
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-network-access-restrict-anonymous-access-named-pipes-shares-set-enabled:
      test_title: '''Network access: Restrict anonymous access to Named Pipes and Shares'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-network-access-restrict-anonymous-access-named-pipes-shares-set-enabled
