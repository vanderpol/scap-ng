assessment:
  id: ng.shared.70e7e3c3b9edeea007bf0f6c
  version: 1
  assessment_title: AZLX-23-002105 - Amazon Linux 2023 must generate audit records for all account creations, modifications,
    disabling, and termination events that affect /etc/opasswd.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/audit.rules
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*-w\s+/etc/security/opasswd(\s+-p\s*([rx]*w[rx]*a[rx]*|[rx]*a[rx]*w[rx]*))?(\s+(-k\s+|-F\s+key=)\w+)?\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-audit-modifications-etc-security-opasswd:
      test_title: Audit modifications to /etc/security/opasswd
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state: null
  evaluate:
    test: test-audit-modifications-etc-security-opasswd
