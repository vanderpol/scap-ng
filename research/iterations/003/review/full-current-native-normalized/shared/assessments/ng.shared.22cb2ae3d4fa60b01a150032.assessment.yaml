assessment:
  id: ng.shared.22cb2ae3d4fa60b01a150032
  version: 1
  assessment_title: AZLX-23-002030 - Amazon Linux 2023 must take appropriate action when the internal event queue is full.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/auditd.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: (?i)^\s*overflow_action\s*=\s*(\w+)\s*(?:#.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-etc-audit-auditd-conf-overflow-action-syslog-single-or-halt:
      test_title: '/etc/audit/auditd.conf: overflow_action = syslog, single or halt'
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: null
          capability: independent.textfilecontent54
          state:
            field: subexpression
            value: (?i)^syslog$
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: independent.textfilecontent54
          state:
            field: subexpression
            value: (?i)^single$
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: independent.textfilecontent54
          state:
            field: subexpression
            value: (?i)^halt$
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-etc-audit-auditd-conf-overflow-action-syslog-single-or-halt
