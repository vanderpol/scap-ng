  version: 1
  assessment_title: The operating system must back up audit records at least every seven days onto a different system or system
    component than the system or component being audited.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This check applies to the global zone only. Determine the zone that you a currently securing. # zonename If
    the command output is "global" this check applies. The operator must back up audit records at least every 7 days. If the
    operator is unable to provide a documented procedure or the documented procedure is not being followed, then this is a
    finding.'
