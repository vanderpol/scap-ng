  assessment_title: Simple TCP/IP Services must not be installed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Open "PowerShell". Enter "Get-WindowsFeature | Where Name -eq Simple-TCPIP". If "Installed State" is "Installed",
    this is a finding. An Installed State of "Available" or "Removed" is not a finding.
