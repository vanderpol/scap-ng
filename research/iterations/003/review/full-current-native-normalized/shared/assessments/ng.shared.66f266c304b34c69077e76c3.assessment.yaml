  version: 1
  assessment_title: RHEL 8 account identifiers (individuals, groups, roles, and devices) must be disabled after 35 days of
    inactivity.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the account identifiers (individuals, groups, roles, and devices) are disabled after 35 days of inactivity
    with the following command: Check the account inactivity value by performing the following command: $ sudo grep -i inactive
    /etc/default/useradd INACTIVE=35 If "INACTIVE" is set to "-1", a value greater than "35", or is commented out, this is
    a finding.'
  inputs: []
  evidence: []
