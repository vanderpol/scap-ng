assessment:
  id: ng.shared.de1567b0a93b1aafd02f71fa
  version: 1
  assessment_title: SQL Server Mirroring endpoint must utilize AES encryption.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the data owner does not have a strict requirement for ensuring data integrity and confidentiality is maintained
    at every step of the data transfer and handling process, and the requirement is documented and authorized, this is not
    a finding. If Database Mirroring is in use, run the following to check for encrypted transmissions: SELECT name, type_desc,
    encryption_algorithm_desc FROM sys.database_mirroring_endpoints WHERE encryption_algorithm != 2 If any records are returned,
    this is a finding.'
  inputs: []
  evidence: []
