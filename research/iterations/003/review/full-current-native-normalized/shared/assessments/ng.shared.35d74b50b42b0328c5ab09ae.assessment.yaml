assessment:
  id: ng.shared.35d74b50b42b0328c5ab09ae
  version: 1
  assessment_title: The Cisco router must be configured to obtain its public key certificates from an appropriate certificate
    policy through an approved service provider.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Review the router configuration to determine if a CA trust point has been configured. The CA trust point will
    contain the URL of the CA in which the router has enrolled with. Verify this is a DOD or DOD-approved CA. This will ensure
    the router has enrolled and received a certificate from a trusted CA. The CA trust point configuration would look similar
    to the example below. crypto pki trustpoint CA_X enrollment url http://trustpoint1.example.com Note: A remote end-point''s
    certificate will always be validated by the router by verifying the signature of the CA on the certificate using the CA''s
    public key, which is contained in the router''s certificate it received at enrollment. Note: This requirement is not applicable
    if the router does not have any public key certificates. If the Cisco router is not configured to obtain its public key
    certificates from an appropriate certificate policy through an approved service provider, this is a finding.'
  inputs: []
  evidence: []
