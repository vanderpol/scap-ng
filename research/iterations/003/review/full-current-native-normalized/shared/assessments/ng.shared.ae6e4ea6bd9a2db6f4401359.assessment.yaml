assessment:
  id: ng.shared.ae6e4ea6bd9a2db6f4401359
  version: 1
  assessment_title: The Oracle Linux operating system must display the date and time of the last successful account logon
    upon logon.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify users are provided with feedback on when account accesses last occurred. Check that "pam_lastlog" is
    used and not silent with the following command: # grep pam_lastlog /etc/pam.d/postlogin session required pam_lastlog.so
    showfailed If "pam_lastlog" is missing from "/etc/pam.d/postlogin" file, or the silent option is present, this is a finding.'
  inputs: []
  evidence: []
