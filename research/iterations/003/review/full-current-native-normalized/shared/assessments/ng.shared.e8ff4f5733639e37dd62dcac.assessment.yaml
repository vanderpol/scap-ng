          entity_check: all
          entity_existence: at_least_one_exists
    state-administrators-group:
      state_title: Administrators Group
      capability: windows.regkeyeffectiverights53
      state:
        field: trustee_sid
        value: S-1-5-32-544
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-backup-operators-group:
      state_title: Backup Operators Group
      capability: windows.regkeyeffectiverights53
      state:
        field: trustee_sid
        value: S-1-5-32-551
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-system-user:
      state_title: System user
      capability: windows.regkeyeffectiverights53
      state:
        field: trustee_sid
        value: S-1-5-18
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-local-service:
      state_title: Local Service
      capability: windows.regkeyeffectiverights53
      state:
        field: trustee_sid
        value: S-1-5-19
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-winreg-key-exists:
      test_title: Winreg key exists
      capability: windows.registry
      object: winreg-key-object
      check_existence: at_least_one_exists
      check: at least one
    test-winreg-key-has-no-bad-rights-non-admin-backup-localservice:
      test_title: Winreg key has no bad rights for non-(admin,backup,localservice)
      capability: windows.regkeyeffectiverights53
      object: winreg-rights-except-system-admin-backup-local-service-object
      check_existence: any_exist
      check: all
      states:
      - state-no-registry-rights
    test-winreg-key-has-no-non-admin-backup-localsys-rights-check:
      test_title: Winreg key has no non-(admin,backup,localsys) rights to check
      capability: windows.regkeyeffectiverights53
      object: winreg-rights-except-system-admin-backup-local-service-object
      check_existence: none_exist
      check: all
    test-winreg-key-has-no-bad-rights-non-admin:
      test_title: Winreg key has no bad rights for non-admin
      capability: windows.regkeyeffectiverights53
      object: winreg-rights-except-system-admin-object
      check_existence: any_exist
      check: all
      states:
      - state-qenr-registry-rights
    test-winreg-key-has-no-non-admin-rights-check:
      test_title: Winreg key has no non-admin rights to check
      capability: windows.regkeyeffectiverights53
      object: winreg-rights-except-system-admin-object
      check_existence: none_exist
      check: all
  evaluate:
    all:
    - test: test-winreg-key-exists
    - any:
      - test: test-winreg-key-has-no-bad-rights-non-admin-backup-localservice
      - test: test-winreg-key-has-no-non-admin-backup-localsys-rights-check
    - any:
      - test: test-winreg-key-has-no-bad-rights-non-admin
      - test: test-winreg-key-has-no-non-admin-rights-check
