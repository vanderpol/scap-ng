assessment:
  id: ng.shared.e8ff4f5733639e37dd62dcac
  version: 1
  assessment_title: Anonymous Access to the Registry
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    winreg-key-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: System\CurrentControlSet\Control\SecurePipeServers\Winreg
        name:
          operation: equals
          datatype: string
          nil: true
          value: ''
      object_title: Winreg key
    winreg-rights-object:
      capability: windows.regkeyeffectiverights53
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: System\CurrentControlSet\Control\SecurePipeServers\Winreg
        trustee_sid:
          operation: pattern match
          datatype: string
          value: .*
      object_title: Winreg rights
    winreg-rights-except-system-admin-backup-local-service-object:
      capability: windows.regkeyeffectiverights53
      set:
        operator: union
        members:
        - object: winreg-rights-object
        filters:
        - action: exclude
          state: state-administrators-group
        - action: exclude
          state: state-backup-operators-group
        - action: exclude
          state: state-system-user
        - action: exclude
          state: state-local-service
      object_title: Winreg rights, except for System, admin, backup, local service
    winreg-rights-except-system-admin-object:
      capability: windows.regkeyeffectiverights53
      set:
        operator: union
        members:
        - object: winreg-rights-object
        filters:
        - action: exclude
          state: state-administrators-group
        - action: exclude
          state: state-system-user
      object_title: Winreg rights, except for System, admin
  states:
    state-no-registry-rights:
      state_title: No registry rights
      capability: windows.regkeyeffectiverights53
      state:
        all:
        - field: standard_delete
          value: '0'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: standard_read_control
          value: '0'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: standard_write_dac
          value: '0'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: standard_write_owner
          value: '0'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: access_system_security
          value: '0'
