assessment:
  id: ng.shared.1ec48a97d2fc2196defb0fc0
  version: 1
  assessment_title: WN10-CC-000175 - The Application Compatibility Program Inventory must be prevented from collecting data
    and sending the information to Microsoft.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows\AppCompat
        name:
          operation: equals
          datatype: string
          mask: false
          value: DisableInventory
  tests:
    test-turn-off-inventory-collector-set-enabled:
      test_title: '''Turn off Inventory Collector'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-turn-off-inventory-collector-set-enabled
