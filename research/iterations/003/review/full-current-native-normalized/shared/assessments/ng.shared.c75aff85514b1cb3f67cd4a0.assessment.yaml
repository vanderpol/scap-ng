  assessment_title: The macOS system must disable Remote Apple Events.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable Remote Apple Events with the following command: /bin/launchctl
    print-disabled system | /usr/bin/grep -c ''"com.apple.AEServer" => disabled'' If the result is not "1", this is a finding.'
