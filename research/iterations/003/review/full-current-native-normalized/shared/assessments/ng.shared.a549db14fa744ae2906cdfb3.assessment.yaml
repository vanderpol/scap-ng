assessment:
  id: ng.shared.a549db14fa744ae2906cdfb3
  version: 1
  assessment_title: Configure the GNOME3 GUI Screen locking
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-rpminfo-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          value: dconf
      object_title: null
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/dconf/profile/user
        pattern:
          operation: pattern match
          datatype: string
          value: ^user-db:user\nsystem-db:local$
        instance:
          operation: equals
          datatype: int
          value: '1'
      object_title: null
    independent-textfilecontent54-object-2:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/dconf/db/
        filename:
          operation: pattern match
          datatype: string
          value: ^[0-9].*$
        pattern:
          operation: pattern match
          datatype: string
          value: ^\[org/gnome/desktop/session\](?:[^\n]*\n+)+?idle-delay\s*=\s*uint32[\s]+([0-9]*)
        instance:
          operation: equals
          datatype: int
          value: '1'
      behaviors:
        multiline: 'true'
        max_depth: '1'
        recurse_direction: down
      object_title: null
  variables:
    inactivity-timeout-variable-variable:
      title: inactivity timeout variable
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: inactivity_timeout_value
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value:
          variable: inactivity-timeout-variable-variable
        operation: less than or equal
        datatype: int
        variable_check: all
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-package-dconf-installed:
      test_title: package dconf is installed
      capability: linux.rpminfo
      object: linux-rpminfo-object
      check_existence: all_exist
      check: all
    test-dconf-user-profile-exists:
      test_title: dconf user profile exists
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: all_exist
      check: all
    test-screensaver-idle-delay-configured:
      test_title: screensaver idle delay is configured
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-2
      check_existence: all_exist
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    any:
    - not:
        test: test-package-dconf-installed
    - all:
      - any:
        - not:
            test: test-package-dconf-installed
        - test: test-dconf-user-profile-exists
      - test: test-screensaver-idle-delay-configured
