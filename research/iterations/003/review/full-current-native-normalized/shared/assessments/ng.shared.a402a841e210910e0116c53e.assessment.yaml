assessment:
  id: ng.shared.a402a841e210910e0116c53e
  version: 1
  assessment_title: Firefox extension recommendations must be disabled.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Type "about:policies" in the browser address bar. If "Preferences" is not displayed under Policy Name and the
    Policy Value does not include "extensions.htmlaboutaddons.recommendations.enabled" with a value of "false" and status
    of "locked", this is a finding.
  inputs: []
  evidence: []
