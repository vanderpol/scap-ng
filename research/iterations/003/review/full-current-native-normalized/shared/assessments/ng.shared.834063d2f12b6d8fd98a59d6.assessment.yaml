assessment:
  id: ng.shared.834063d2f12b6d8fd98a59d6
  version: 1
  assessment_title: AZLX-23-002085 - Amazon Linux 2023 must generate audit records for all account creations, modifications,
    disabling, and termination events that affect /etc/sudoers.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/audit.rules
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*-w\s+/etc/sudoers(\s+-p\s*([rx]*w[rx]*a[rx]*|[rx]*a[rx]*w[rx]*))?(\s+(-k\s+|-F\s+key=)\w+)?\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-audit-modifications-etc-sudoers:
      test_title: Audit modifications to /etc/sudoers
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state: null
  evaluate:
    test: test-audit-modifications-etc-sudoers
