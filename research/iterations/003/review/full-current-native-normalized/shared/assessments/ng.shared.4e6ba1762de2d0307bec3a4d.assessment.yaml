assessment:
  id: ng.shared.4e6ba1762de2d0307bec3a4d
  version: 1
  assessment_title: FIPS Compliant Algorithms
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Control\Lsa\FIPSAlgorithmPolicy
        name:
          operation: equals
          datatype: string
          mask: false
          value: Enabled
      object_title: null
  variables:
    system-cryptography-use-fips-compliant-algorithms-encryption-hashing-signing-variable:
      title: 'System Cryptography: Use FIPS compliant algorithms for encryption, hashing, and signing'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: system_cryptography_use_fips_compliant_alorithm_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: system-cryptography-use-fips-compliant-algorithms-encryption-hashing-signing-variable
          operation: equals
          datatype: int
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-system-cryptography-use-fips-compliant-algorithms-encryption-hashing-signing-set:
      test_title: '''System cryptography: Use FIPS compliant algorithms for encryption, hashing, and signing'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-system-cryptography-use-fips-compliant-algorithms-encryption-hashing-signing-set
