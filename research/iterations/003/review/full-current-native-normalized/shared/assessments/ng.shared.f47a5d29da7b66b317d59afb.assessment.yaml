assessment:
  id: ng.shared.f47a5d29da7b66b317d59afb
  version: 1
  assessment_title: The Oracle Linux operating system must initiate an action to notify the System Administrator (SA) and
    Information System Security Officer (ISSO), at a minimum, when allocated audit record storage volume reaches 75 percent
    of the repository maximum audit record storage capacity.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system initiates an action to notify the SA and ISSO (at a minimum) when allocated audit
    record storage volume reaches 75 percent of the repository maximum audit record storage capacity. Check the system configuration
    to determine the partition the audit records are being written to with the following command: $ sudo grep -iw log_file
    /etc/audit/auditd.conf log_file = /var/log/audit/audit.log Determine what the threshold is for the system to take action
    when 75 percent of the repository maximum audit record storage capacity is reached: $ sudo grep -iw space_left /etc/audit/auditd.conf
    space_left = 25% If the value of the "space_left" keyword is not set to 25 percent of the total partition size, this is
    a finding.'
  inputs: {}
  evidence: []
