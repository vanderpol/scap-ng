assessment:
  id: ng.shared.8c3368031e1aafcab90446db
  version: 1
  assessment_title: The SUSE operating system must not have the vsftpd package installed if not required for operational support.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the vsftpd package is not installed on the SUSE operating system. Check that the vsftpd package is not
    installed on the SUSE operating system by running the following command: > zypper info vsftpd | grep Installed If "vsftpd"
    is installed and is not documented with the Information System Security Officer (ISSO) as an operational requirement,
    this is a finding.'
  inputs: []
  evidence: []
