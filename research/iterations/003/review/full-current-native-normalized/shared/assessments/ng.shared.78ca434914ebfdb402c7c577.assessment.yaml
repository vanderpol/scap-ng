assessment:
  id: ng.shared.78ca434914ebfdb402c7c577
  version: 1
  assessment_title: WN19-00-000320 - Windows Server 2019 must not have the Fax Server role installed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    fax-server-object:
      capability: windows.wmi.query
      object_title: Fax Server
      collect:
        namespace: root\cimv2
        query: SELECT startmode FROM Win32_Service WHERE name='fax'
  states:
    state-startmode-is-disabled:
      state_title: StartMode is Disabled
      capability: windows.wmi.query
      state:
        field: result
        record:
          mask: false
          match: all
          existence: some
          fields:
            startmode:
              value: Disabled
              operation: equal
              datatype: string
              mask: false
              match: all
              existence: some
  tests:
    test-fax-server-role-not-installed:
      test_title: The Fax server role is not installed.
      capability: windows.wmi.query
      object: fax-server-object
      states:
      - state-startmode-is-disabled
      existence: optional
      match: all
  evaluate:
    test: test-fax-server-role-not-installed
