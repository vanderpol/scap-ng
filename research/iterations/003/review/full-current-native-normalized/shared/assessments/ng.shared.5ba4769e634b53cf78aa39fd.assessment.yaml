assessment:
  id: ng.shared.5ba4769e634b53cf78aa39fd
  version: 1
  assessment_title: WN19-UR-000090 - Windows Server 2019 Create symbolic links user right must only be assigned to the Administrators
    group.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-userright-object:
      capability: windows.userright
      select:
        userright:
          operation: equals
          datatype: string
          value: SE_CREATE_SYMBOLIC_LINK_NAME
      object_title: null
    windows-wmi57-object:
      capability: windows.wmi.query
      object_title: null
      collect:
        namespace: root\cimv2
        query: SELECT ID FROM Win32_ServerFeature
  states:
    state-windows-userright:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: ''
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-userright-2:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: Administrators
        operation: case insensitive equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-userright-3:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: ^(?i)(NT VIRTUAL MACHINE\\)?Virtual Machines$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-create-symbolic-links-administrators:
      test_title: Create symbolic links - Administrators
      capability: windows.userright
      object: windows-userright-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-windows-userright
      - state-windows-userright-2
    test-create-symbolic-links-administrators-virtual-machines:
      test_title: Create symbolic links - Administrators, Virtual Machines
      capability: windows.userright
      object: windows-userright-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-windows-userright
      - state-windows-userright-2
      - state-windows-userright-3
    test-hyper-v-role-installed:
      test_title: Hyper-V Role is installed
      capability: windows.wmi.query
      object: windows-wmi57-object
      existence: some
      match: any
  evaluate:
    any:
    - test: test-create-symbolic-links-administrators
    - all:
      - test: test-create-symbolic-links-administrators-virtual-machines
      - test: test-hyper-v-role-installed
