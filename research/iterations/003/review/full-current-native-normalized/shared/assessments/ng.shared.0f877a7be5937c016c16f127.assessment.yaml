assessment:
  id: ng.shared.0f877a7be5937c016c16f127
  version: 1
  assessment_title: AZLX-23-001060 - Amazon Linux 2023 must have the Advanced Intrusion Detection Environment (AIDE) package
    installed.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-rpminfo-collection:
      collection_title: null
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: aide
    unix-file-collection:
      collection_title: null
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /var/lib/aide/aide.db.gz
  tests:
    test-aide-package-installed:
      test_title: aide package is installed
      capability: linux.rpminfo
      collection: linux-rpminfo-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
    test-var-lib-aide-aide-db-gz-exists-not-empty:
      test_title: /var/lib/aide/aide.db.gz exists and is not empty
      capability: unix.file
      collection: unix-file-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: not empty
        state_capability: unix.file
        state:
          field: size
          value: '0'
          operation: greater than
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-aide-package-installed
    - test: test-var-lib-aide-aide-db-gz-exists-not-empty
