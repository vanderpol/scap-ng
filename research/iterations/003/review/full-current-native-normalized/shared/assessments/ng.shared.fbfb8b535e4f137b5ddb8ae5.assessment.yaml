assessment:
  id: ng.shared.fbfb8b535e4f137b5ddb8ae5
  version: 1
  assessment_title: The SUSE operating system must disable the x86 Ctrl-Alt-Delete key sequence for Graphical User Interfaces.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: If a graphical user interface is not installed, this requirement is Not Applicable. Verify the SUSE operating
    system is not configured to reboot the system when Ctrl-Alt-Delete is pressed in the graphical user interface. Check that
    the dconf setting was disabled to allow the Ctrl-Alt-Delete sequence in the graphical user interface with the following
    command: Check the default logout key sequence: > sudo gsettings get org.gnome.settings-daemon.plugins.media-keys logout
    '''' Check that the value is not writable and cannot be changed by the user: > sudo gsettings writable org.gnome.settings-daemon.plugins.media-keys
    logout false If the logout value is not [''''] and the writable status is not false, this is a finding.'
  inputs: []
  evidence: []
