assessment:
  id: ng.shared.4a3e6b94b57fb58cdec5fe2f
  version: 1
  assessment_title: SMB Client Packet Signing (if server agrees)
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Services\LanmanWorkstation\Parameters
        name:
          operation: equals
          datatype: string
          mask: false
          value: EnableSecuritySignature
  variables:
    microsoft-network-client-digitally-sign-communications-if-server-agrees-variable:
      title: 'Microsoft network client: Digitally sign communications (if server agrees)'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: digitally_sign_communications_client_server_agrees_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-microsoft-network-client-digitally-sign-communications-if-server-agrees-set:
      test_title: '''Microsoft network client: Digitally sign communications (if server agrees)'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: microsoft-network-client-digitally-sign-communications-if-server-agrees-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-microsoft-network-client-digitally-sign-communications-if-server-agrees-set
