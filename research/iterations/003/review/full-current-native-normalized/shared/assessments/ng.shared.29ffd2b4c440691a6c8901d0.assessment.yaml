assessment:
  id: ng.shared.29ffd2b4c440691a6c8901d0
  version: 1
  assessment_title: AZLX-23-002445 - Amazon Linux 2023 must enable the SELinux targeted policy.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    sys-fs-selinux-collection:
      collection_title: /sys/fs/selinux
      capability: linux.partition
      select:
        mount_point:
          operation: equals
          datatype: string
          mask: false
          value: /sys/fs/selinux
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/selinux/config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*SELINUXTYPE\s*=\s*(\w+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-selinux-active:
      test_title: selinux is active
      capability: linux.partition
      collection: sys-fs-selinux-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: linux.partition
        state:
          field: fs_type
          value: selinuxfs
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-etc-selinux-config-selinuxtype-targeted:
      test_title: '/etc/selinux/config: SELINUXTYPE=targeted'
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: targeted
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-selinux-active
    - test: test-etc-selinux-config-selinuxtype-targeted
