assessment:
  id: ng.shared.91e42220cf62ba5493637f8f
  version: 1
  assessment_title: The Oracle Linux operating system must audit all uses of the umount command.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system generates audit records when successful/unsuccessful attempts to use the "umount"
    command occur. Check that the following system call is being audited by performing the following series of commands to
    check the file system rules in "/etc/audit/audit.rules": $ sudo grep -w "/usr/bin/umount" /etc/audit/audit.rules -a always,exit
    -F path=/usr/bin/umount -F perm=x -F auid>=1000 -F auid!=unset -k privileged-mount If the command does not return any
    output, this is a finding.'
  inputs: {}
  evidence: []
