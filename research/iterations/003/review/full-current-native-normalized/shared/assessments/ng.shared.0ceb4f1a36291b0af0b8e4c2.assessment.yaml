assessment:
  id: ng.shared.0ceb4f1a36291b0af0b8e4c2
  version: 1
  assessment_title: OL09-00-000351 - OL 9 must be configured so that the rsyslog service is active.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-systemdunitproperty-collection:
      collection_title: null
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          mask: false
          value: rsyslog.service
        property:
          operation: equals
          datatype: string
          mask: false
          value: ActiveState
  tests:
    test-rsyslog-service-active:
      test_title: rsyslog.service is active
      capability: linux.systemdunitproperty
      collection: linux-systemdunitproperty-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: linux.systemdunitproperty
        state:
          field: value
          value: active
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-rsyslog-service-active
