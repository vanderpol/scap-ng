assessment:
  id: ng.shared.748eb76d261b0a9fa8218a32
  version: 1
  assessment_title: The Cisco router must be configured to enforce password complexity by requiring that at least one uppercase
    character be used.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    iosxe-line-object:
      capability: iosxe.line
      select:
        show_subcommand:
          operation: equals
          datatype: string
          mask: false
          value: show running-config
      object_title: null
  states:
    state-check-for-aaa-common-criteria-policy:
      state_title: Check for aaa common-criteria policy
      capability: iosxe.line
      state:
        all:
        - field: show_subcommand
          value: show running-config
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: config_line
          value: \naaa common-criteria policy.+
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    state-check-for-password-policy-upper-case-at-least-1:
      state_title: Check for password policy upper-case at least 1
      capability: iosxe.line
      state:
        all:
        - field: show_subcommand
          value: show running-config
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: config_line
          value: \n upper-case (1|2|3|4|5|6|7|8)
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-verify-that-aaa-common-criteria-policy-enabled:
      test_title: Verify that aaa common-criteria policy is enabled.
      capability: iosxe.line
      object: iosxe-line-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-check-for-aaa-common-criteria-policy
    test-check-password-policy-upper-case-at-least-1:
      test_title: Check for password policy upper-case at least 1
      capability: iosxe.line
      object: iosxe-line-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-check-for-password-policy-upper-case-at-least-1
  evaluate:
    all:
    - test: test-verify-that-aaa-common-criteria-policy-enabled
    - test: test-check-password-policy-upper-case-at-least-1
