assessment:
  id: ng.shared.fa977b6aca6e1623889c2c14
  version: 1
  assessment_title: TS/RDS - Password Prompting
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\Windows NT\Terminal Services
        name:
          operation: equals
          datatype: string
          mask: false
          value: fPromptForPassword
      object_title: null
  variables:
    always-prompt-password-upon-connection-variable:
      title: Always prompt for password upon connection
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: always_prompt_for_password_upon_connection_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: always-prompt-password-upon-connection-variable
          operation: equals
          datatype: int
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-always-prompt-password-upon-connection-set-enabled:
      test_title: '''Always prompt for password upon connection'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-always-prompt-password-upon-connection-set-enabled
