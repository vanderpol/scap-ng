assessment:
  id: ng.shared.9c1744db2f10cb6b7771af26
  version: 1
  assessment_title: WN19-UR-000130 - Windows Server 2019 Impersonate a client after authentication user right must only be
    assigned to Administrators, Service, Local Service, and Network Service.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-userright-collection:
      collection_title: null
      capability: windows.userright
      select:
        userright:
          operation: equals
          datatype: string
          mask: false
          value: SE_IMPERSONATE_NAME
  tests:
    test-impersonate-client-after-authentication-administrators-local-service-network-service-service:
      test_title: Impersonate a client after authentication - Administrators, LOCAL SERVICE, NETWORK SERVICE, SERVICE
      capability: windows.userright
      collection: windows-userright-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: null
          capability: windows.userright
          state:
            field: trustee_name
            value: ''
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: windows.userright
          state:
            field: trustee_name
            value: Administrators
            operation: case insensitive equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: windows.userright
          state:
            field: trustee_name
            value: LOCAL SERVICE
            operation: case insensitive equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: windows.userright
          state:
            field: trustee_name
            value: NETWORK SERVICE
            operation: case insensitive equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: windows.userright
          state:
            field: trustee_name
            value: SERVICE
            operation: case insensitive equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-impersonate-client-after-authentication-administrators-local-service-network-service-service
