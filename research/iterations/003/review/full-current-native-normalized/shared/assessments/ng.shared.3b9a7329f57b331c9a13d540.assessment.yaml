assessment:
  id: ng.shared.3b9a7329f57b331c9a13d540
  version: 1
  assessment_title: The macOS system must set Login Grace Time to 30.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    os-sshd-login-grace-time-configure-stig-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/sbin/sshd -G | /usr/bin/awk '/logingracetime/{print $2}'
      object_title: os_sshd_login_grace_time_configure_stig_object
  states:
    state-os-sshd-login-grace-time-configure-stig-state:
      state_title: os_sshd_login_grace_time_configure_stig_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: '30'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-os-sshd-login-grace-time-configure-stig-test:
      test_title: os_sshd_login_grace_time_configure_stig_test
      capability: independent.shellcommand
      object: os-sshd-login-grace-time-configure-stig-object-object
      check_existence: all_exist
      check: all
      states:
      - state-os-sshd-login-grace-time-configure-stig-state
  evaluate:
    test: test-os-sshd-login-grace-time-configure-stig-test
