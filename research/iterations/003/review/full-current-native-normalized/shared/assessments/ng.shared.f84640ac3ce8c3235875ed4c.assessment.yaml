assessment:
  id: ng.shared.f84640ac3ce8c3235875ed4c
  version: 1
  assessment_title: The operating system must use mechanisms for authentication to a cryptographic module meeting the requirements
    of applicable federal laws, Executive orders, directives, policies, regulations, standards, and guidance for such authentication.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This check applies to the global zone only. Determine the zone that you are currently securing. # zonename If
    the command output is "global", this check applies. The Crypto Management profile is required to execute this command.
    Check to ensure that FIPS-140 encryption mode is enabled. # cryptoadm list fips-140| grep -c "is disabled" If the output
    of this command is not "0", this is a finding.'
  inputs: {}
  evidence: []
