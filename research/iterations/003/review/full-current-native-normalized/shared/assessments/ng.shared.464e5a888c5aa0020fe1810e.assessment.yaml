assessment:
  id: ng.shared.464e5a888c5aa0020fe1810e
  version: 1
  assessment_title: The Oracle Linux operating system must generate audit records for all account creations, modifications,
    disabling, and termination events that affect /etc/passwd.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system must generate audit records for all account creations, modifications, disabling,
    and termination events that affect "/etc/passwd". Check the auditing rules in "/etc/audit/audit.rules" with the following
    command: # grep /etc/passwd /etc/audit/audit.rules -w /etc/passwd -p wa -k identity If the command does not return a line,
    or the line is commented out, this is a finding.'
  inputs: []
  evidence: []
