assessment:
  id: ng.shared.095fc7186c97adbdf01e11ce
  version: 1
  assessment_title: The macOS system must enable macOS Application Firewall.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    system-settings-firewall-enable-recommended-object-collection:
      collection_title: system_settings_firewall_enable_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.security.firewall'')\

            .objectForKey(''EnableFirewall'').js

            EOS'
  tests:
    test-system-settings-firewall-enable-recommended-test:
      test_title: system_settings_firewall_enable_recommended_test
      capability: independent.shellcommand
      collection: system-settings-firewall-enable-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: system_settings_firewall_enable_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: 'true'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-system-settings-firewall-enable-recommended-test
