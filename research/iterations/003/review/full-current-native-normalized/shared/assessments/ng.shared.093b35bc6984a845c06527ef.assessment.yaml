  version: 1
  assessment_title: The Oracle Linux operating system must not be configured to bypass password requirements for privilege
    escalation.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system is not be configured to bypass password requirements for privilege escalation. Check
    the configuration of the "/etc/pam.d/sudo" file with the following command: $ sudo grep pam_succeed_if /etc/pam.d/sudo
    If any occurrences of "pam_succeed_if" is returned from the command, this is a finding.'
