assessment:
  id: ng.shared.df1e9d9f8411c898fdd14cf3
  version: 1
  assessment_title: WN19-DC-000020 - Windows Server 2019 Kerberos user logon restrictions must be enforced.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    kerberos-policy-enforce-user-logon-restrictions-collection:
      collection_title: Kerberos Policy - Enforce user logon restrictions
      capability: windows.wmi57
      select:
        namespace:
          operation: equals
          datatype: string
          mask: false
          value: root\rsop\computer
        wql:
          operation: equals
          datatype: string
          mask: false
          value: SELECT setting FROM RSOP_SecuritySettingBoolean WHERE KeyName='TicketValidateClient'
  tests:
    test-kerberos-user-logon-restrictions-enforced-pa-test-1-or-other:
      test_title: Kerberos user logon restrictions must be enforced, PA test = -1 OR Other tools test = 1
      capability: windows.wmi57
      collection: kerberos-policy-enforce-user-logon-restrictions-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: Kerberos Policy - Enforce user logon restrictions - Enabled, PA test = -1
          capability: windows.wmi57
          state:
            field: result
            value:
              record:
              - name: setting
                value: '-1'
                operation: equals
                datatype: string
                mask: false
                entity_check: all
            operation: equals
            datatype: record
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: Kerberos Policy - Enforce user logon restrictions - Enabled, Other tools test = 1
          capability: windows.wmi57
          state:
            field: result
            value:
              record:
              - name: setting
                value: '1'
                operation: equals
                datatype: string
                mask: false
                entity_check: all
            operation: equals
            datatype: record
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-kerberos-user-logon-restrictions-enforced-pa-test-1-or-other
