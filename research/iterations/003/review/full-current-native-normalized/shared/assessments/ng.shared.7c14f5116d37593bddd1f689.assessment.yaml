assessment:
  id: ng.shared.7c14f5116d37593bddd1f689
  version: 1
  assessment_title: Audit - System Integrity - Success
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-audit-system-integrity-success-only:
      state_title: Audit - System Integrity - Success only
      capability: windows.auditeventpolicysubcategories
      state:
        field: system_integrity
        value: AUDIT_SUCCESS
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-audit-system-integrity-success-and-failure:
      state_title: Audit - System Integrity - Success and Failure
      capability: windows.auditeventpolicysubcategories
      state:
        field: system_integrity
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-system-integrity-success-only:
      test_title: Audit - System Integrity - Success only
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-audit-system-integrity-success-only
    test-audit-system-integrity-success-failure:
      test_title: Audit - System Integrity - Success and Failure
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-audit-system-integrity-success-and-failure
  evaluate:
    any:
    - test: test-audit-system-integrity-success-only
    - test: test-audit-system-integrity-success-failure
