      test_title: pam_faillock.so module authfail is present in /etc/pam.d/common-auth file
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
    test-pam-faillock-so-module-authsucc-present-in-etc-pam-d:
