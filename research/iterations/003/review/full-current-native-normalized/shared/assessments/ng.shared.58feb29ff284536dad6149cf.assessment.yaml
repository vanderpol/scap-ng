      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-2
      check_existence: at_least_one_exists
      check: all
    test-pam-faillock-so-used-audit:
      test_title: pam_faillock.so is used with audit
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-3
      check_existence: at_least_one_exists
      check: all
    test-pam-faillock-so-used-silent:
      test_title: pam_faillock.so is used with silent
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-4
      check_existence: at_least_one_exists
      check: all
    test-pam-faillock-so-used-deny-set-3-or-less:
      test_title: pam_faillock.so is used with deny set to 3 or less
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-5
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
    test-pam-faillock-so-used-fail-interval-set-900-or-less:
      test_title: pam_faillock.so is used with fail_interval set to 900 or less
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-6
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54-2
    test-pam-faillock-so-used-unlock-time-set-0:
      test_title: pam_faillock.so is used with unlock_time set to 0
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-7
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54-3
  evaluate:
    all:
    - test: test-pam-faillock-so-module-authfail-present-in-etc-pam-d
    - test: test-pam-faillock-so-module-authsucc-present-in-etc-pam-d
    - test: test-pam-faillock-so-used-audit
    - test: test-pam-faillock-so-used-silent
    - test: test-pam-faillock-so-used-deny-set-3-or-less
    - test: test-pam-faillock-so-used-fail-interval-set-900-or-less
    - test: test-pam-faillock-so-used-unlock-time-set-0
