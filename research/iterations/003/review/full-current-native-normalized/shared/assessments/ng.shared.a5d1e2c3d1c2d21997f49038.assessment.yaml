assessment:
  id: ng.shared.a5d1e2c3d1c2d21997f49038
  version: 1
  assessment_title: Network interfaces configured on The Oracle Linux operating system must not be in promiscuous mode.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify network interfaces are not in promiscuous mode unless approved by the ISSO and documented. Check for
    the status with the following command: # ip link | grep -i promisc If network interfaces are found on the system in promiscuous
    mode and their use has not been approved by the ISSO and documented, this is a finding.'
  inputs: []
  evidence: []
