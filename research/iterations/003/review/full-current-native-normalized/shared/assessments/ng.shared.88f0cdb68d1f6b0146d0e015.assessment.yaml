assessment:
  id: ng.shared.88f0cdb68d1f6b0146d0e015
  version: 1
  assessment_title: The IIS 10.0 website must be configured to limit the maxURL.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    get-website-request-filtering-maxurl-setting-collection:
      collection_title: Get Website Request Filtering maxUrl setting
      capability: windows.appcmdlistconfig
      select:
        identifier_type:
          operation: equals
          datatype: string
          mask: false
          value: Site
        identifier:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        section:
          operation: equals
          datatype: string
          mask: false
          value: requestfiltering
        parameter:
          operation: equals
          datatype: string
          mask: false
          value: requestLimits.maxUrl
  tests:
    test-web-site-request-filtering-maxurl-value-4096-or-less:
      test_title: The web-site Request Filtering maxUrl value must be 4096 or less
      capability: windows.appcmdlistconfig
      collection: get-website-request-filtering-maxurl-setting-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: appcmdlistconfig result must equal or less than 4096
        state_capability: windows.appcmdlistconfig
        state:
          field: result
          value: '4096'
          operation: less than or equal
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-web-site-request-filtering-maxurl-value-4096-or-less
