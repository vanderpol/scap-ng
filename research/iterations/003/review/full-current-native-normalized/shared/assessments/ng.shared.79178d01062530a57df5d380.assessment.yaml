assessment:
  id: ng.shared.79178d01062530a57df5d380
  version: 1
  assessment_title: The operating system must terminate all sessions and network connections when non-local maintenance is
    completed.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    clientaliveinterval-set-in-etc-ssh-sshd-config-collection:
      collection_title: ClientAliveInterval is set in /etc/ssh/sshd_config.
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh
        filename:
          operation: equals
          datatype: string
          mask: false
          value: sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*[Cc][Ll][Ii][Ee][Nn][Tt][Aa][Ll][Ii][Vv][Ee][Ii][Nn][Tt][Ee][Rr][Vv][Aa][Ll]\s+(\d+)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    clientalivecountmax-set-in-etc-ssh-sshd-config-collection:
      collection_title: ClientAliveCountMax is set in /etc/ssh/sshd_config.
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh
        filename:
          operation: equals
          datatype: string
          mask: false
          value: sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*[Cc][Ll][Ii][Ee][Nn][Tt][Aa][Ll][Ii][Vv][Ee][Cc][Oo][Uu][Nn][Tt][Mm][Aa][Xx]\s+(\d+)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  variables:
    clientaliveinterval-set-600-variable:
      title: ClientAliveInterval  is set to 600
      kind: constant
      datatype: string
      expression:
        literal: '600'
    clientalivecountmax-set-0-variable:
      title: ClientAliveCountMax is set to 0
      kind: constant
      datatype: string
      expression:
        literal: '0'
  tests:
    test-clientaliveinterval-set-600-in-etc-ssh-sshd-config:
      test_title: ClientAliveInterval is set to 600 in /etc/ssh/sshd_config.
      capability: independent.textfilecontent54
      collection: clientaliveinterval-set-in-etc-ssh-sshd-config-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: ClientAliveInterval  is set to 600
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value:
            variable: clientaliveinterval-set-600-variable
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          entity_check: all
          entity_existence: at_least_one_exists
    test-clientalivecountmax-set-0-in-etc-ssh-sshd-config:
      test_title: ClientAliveCountMax is set to 0 in /etc/ssh/sshd_config.
      capability: independent.textfilecontent54
      collection: clientalivecountmax-set-in-etc-ssh-sshd-config-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: ClientAliveCountMax  is set to 0
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value:
            variable: clientalivecountmax-set-0-variable
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-clientaliveinterval-set-600-in-etc-ssh-sshd-config
    - test: test-clientalivecountmax-set-0-in-etc-ssh-sshd-config
