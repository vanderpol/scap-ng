assessment:
  id: ng.shared.832c4a9bbf7dca3b706ad3a2
  version: 1
  assessment_title: The macOS system must configure audit capacity warning.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to require a minimum of 25 percent free disk space for audit record storage
    with the following command: /usr/bin/awk -F: ''/^minfree/{print $2}'' /etc/security/audit_control If the result is not
    "25", this is a finding.'
  inputs: []
  evidence: []
