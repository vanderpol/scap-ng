assessment:
  id: ng.shared.4ab07b2fced0b747113cb7f0
  version: 1
  assessment_title: The application pools rapid fail protection settings for each IIS 10.0 website must be managed.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    get-appcmd-apppool-setting-failure-rapidfailprotectioninterval-collection:
      collection_title: get appcmd apppool setting failure.rapidFailProtectionInterval
      capability: windows.appcmd
      select:
        identifier_type:
          operation: equals
          datatype: string
          mask: false
          value: Apppool
        identifier:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        parameter:
          operation: equals
          datatype: string
          mask: false
          value: failure.rapidFailProtectionInterval
    full-path-each-web-directory-translated-environment-paths-collection:
      collection_title: Full path of each web directory (translated environment paths)
      capability: independent.variable
      select:
        var_ref:
          operation: equals
          datatype: string
          mask: false
          value:
            variable: time-in-int-hhmmss-used-hh-mm-ss-variable
  variables:
    time-in-int-hhmmss-used-hh-mm-ss-variable:
      title: Time In Int hhmmss (used to be hh:mm:ss)
      kind: local
      datatype: int
      expression:
        concat:
        - regex_capture:
            value:
              values:
                collection: get-appcmd-apppool-setting-failure-rapidfailprotectioninterval-collection
                field: result
            pattern: (\d\d):\d\d:\d\d
        - regex_capture:
            value:
              values:
                collection: get-appcmd-apppool-setting-failure-rapidfailprotectioninterval-collection
                field: result
            pattern: \d\d:(\d\d):\d\d
        - regex_capture:
            value:
              values:
                collection: get-appcmd-apppool-setting-failure-rapidfailprotectioninterval-collection
                field: result
            pattern: \d\d:\d\d:(\d\d)
  tests:
    test-application-pool-s-rapid-fail-protection-value-failure-interval-set:
      test_title: An application pool’s rapid fail protection value for Failure Interval is set to 5. If the Failure Interval
        is not set to 5 or less, this is a finding
      capability: independent.variable
      collection: full-path-each-web-directory-translated-environment-paths-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: less than or equal to 00:05:00
        state_capability: independent.variable
        state:
          field: value
          value: '000500'
          operation: less than or equal
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-application-pool-s-rapid-fail-protection-value-failure-interval-set
