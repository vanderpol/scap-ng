assessment:
  id: ng.shared.2ad6ffc9d2131d7c6779f296
  version: 1
  assessment_title: The /etc/zones directory, and its contents, must have the vendor default owner, group, and permissions.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    pkg-verify-system-zones-collection:
      collection_title: pkg verify system/zones
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: pkg verify system/zones
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(?!.*Planning:).*
  tests:
    test-etc-zones-directory-its-contents-have-vendor-default-owner-group:
      test_title: The /etc/zones directory, and its contents, must have the vendor default owner, group, and permissions.
      capability: independent.shellcommand
      collection: pkg-verify-system-zones-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: No stdout_line should exist
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: ''
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: none_exist
  evaluate:
    test: test-etc-zones-directory-its-contents-have-vendor-default-owner-group
