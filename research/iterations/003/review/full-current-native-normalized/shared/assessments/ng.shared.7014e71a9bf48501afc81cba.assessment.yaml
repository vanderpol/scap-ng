assessment:
  id: ng.shared.7014e71a9bf48501afc81cba
  version: 1
  assessment_title: Mount Remote Filesystems with nosuid
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/fstab
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*\[?[\.\w:-]+\]?:[/\w-]+\s+[/\w-]+\s+nfs[4]?\s+(.*)$
        instance:
          operation: not equal
          datatype: int
          value: '0'
      object_title: null
    independent-textfilecontent54-object-2:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/mtab
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*\[?[\.\w:-]+\]?:[/\w-]+\s+[/\w-]+\s+nfs[4]?\s+(.*)$
        instance:
          operation: not equal
          datatype: int
          value: '0'
      object_title: null
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^.*nosuid.*$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-all-nfs-in-etc-fstab-has-nosuid:
      test_title: all nfs in /etc/fstab has nosuid
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: any_exist
      check: all
      states:
      - state-independent-textfilecontent54
    test-all-nfs-has-nosuid:
      test_title: all nfs has nosuid
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-2
      check_existence: any_exist
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    all:
    - test: test-all-nfs-in-etc-fstab-has-nosuid
    - test: test-all-nfs-has-nosuid
