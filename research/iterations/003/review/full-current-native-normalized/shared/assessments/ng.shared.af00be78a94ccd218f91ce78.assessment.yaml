assessment:
  id: ng.shared.af00be78a94ccd218f91ce78
  version: 1
  assessment_title: The Ubuntu operating system must display the Standard Mandatory DOD Notice and Consent Banner before granting
    any local or remote connection to the system.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    ubuntu-display-standard-mandatory-dod-notice-consent-banner-before-granting-collection:
      collection_title: Ubuntu must display the Standard Mandatory DOD Notice and Consent Banner before granting any local
        or remote connection to the system.
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/issue.net
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .+
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
      behaviors:
        singleline: 'true'
    get-sshd-banner-collection:
      collection_title: Get the sshd banner
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/sbin/sshd -dd 2>&1 | awk '/filename/ {print $4}' | tr -d '\r' | tr '\n' ' ' | xargs grep -iH 'banner'
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: :\s*Banner\s+/etc/issue\.net
  tests:
    test-ubuntu-display-standard-mandatory-dod-notice-consent-banner-before-granting:
      test_title: Ubuntu must display the Standard Mandatory DOD Notice and Consent Banner before granting any local or remote
        connection to the system.
      capability: independent.textfilecontent54
      collection: ubuntu-display-standard-mandatory-dod-notice-consent-banner-before-granting-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Ubuntu must display the Standard Mandatory DOD Notice and Consent Banner before granting any local or
          remote connection to the system.
        state_capability: independent.textfilecontent54
        state:
          field: text
          value: You\s+are\s+accessing\s+a\s+U\.S\.\s+Government\s+\(USG\)\s+Information\s+System\s+\(IS\)\s+that\s+is\s+provided\s+for\s+USG-authorized\s+use\s+only.[\n\r
            \t]+By\s+using\s+this\s+IS\s+\(which\s+includes\s+any\s+device\s+attached\s+to\s+this\s+IS\),\s+you\s+consent\s+to\s+the\s+following\s+conditions:[\n\r
            \t]+-The\s+USG\s+routinely\s+intercepts\s+and\s+monitors\s+communications\s+on\s+this\s+IS\s+for\s+purposes\s+including,\s+but\s+not\s+limited\s+to,\s+penetration\s+testing,\s+COMSEC\s+monitoring,\s+network\s+operations\s+and\s+defense,\s+personnel\s+misconduct\s+\(PM\),\s+law\s+enforcement\s+\(LE\),\s+and\s+counterintelligence\s+\(CI\)\s+investigations.[\n\r
            \t]+-At\s+any\s+time,\s+the\s+USG\s+may\s+inspect\s+and\s+seize\s+data\s+stored\s+on\s+this\s+IS.[\n\r \t]+-Communications\s+using,\s+or\s+data\s+stored\s+on,\s+this\s+IS\s+are\s+not\s+private,\s+are\s+subject\s+to\s+routine\s+monitoring,\s+interception,\s+and\s+search,\s+and\s+may\s+be\s+disclosed\s+or\s+used\s+for\s+any\s+USG-authorized\s+purpose.[\n\r
            \t]+-This\s+IS\s+includes\s+security\s+measures\s+\(e.g.,\s+authentication\s+and\s+access\s+controls\)\s+to\s+protect\s+USG\s*interests\s*\-\-\s*not\s+for\s+your\s+personal\s+benefit\s+or\s+privacy.[\n\r
            \t]+-Notwithstanding\s+the\s+above,\s+using\s+this\s+IS\s+does\s+not\s+constitute\s+consent\s+to\s+PM,\s+LE\s+or\s+CI\s+investigative\s+searching\s+or\s+monitoring\s+of\s+the\s+content\s+of\s+privileged\s+communications,\s+or\s+work\s+product,\s+related\s+to\s+personal\s+representation\s+or\s+services\s+by\s+attorneys,\s+psychotherapists,\s+or\s+clergy,\s+and\s+their\s+assistants.\s+Such\s+communications\s+and\s+work\s+product\s+are\s+private\s+and\s+confidential.\s+See\s+User\s+Agreement\s+for\s+details.[\n\r]*.*
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-sshd-server-b-congiured-use-banner-file-etc-issue-net:
      test_title: SSHD server must b congiured to use banner file /etc/issue.net
      capability: independent.shellcommand
      collection: get-sshd-banner-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Ensure pattern \s*Banner\s+\/etc\/issue\.net is found
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: :\s*Banner\s+\/etc\/issue\.net
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-ubuntu-display-standard-mandatory-dod-notice-consent-banner-before-granting
    - test: test-sshd-server-b-congiured-use-banner-file-etc-issue-net
