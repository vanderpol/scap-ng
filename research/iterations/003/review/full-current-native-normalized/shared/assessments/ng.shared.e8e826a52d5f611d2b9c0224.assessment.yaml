assessment:
  id: ng.shared.e8e826a52d5f611d2b9c0224
  version: 1
  assessment_title: The macOS system must secure user's home folders.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    os-home-folders-secure-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: zsh
        command:
          operation: equals
          datatype: string
          value: /usr/bin/find /System/Volumes/Data/Users -mindepth 1 -maxdepth 1 -type d ! \( -perm 700 -o -perm 711 \)|/usr/bin/grep
            -v "Shared"|/usr/bin/grep -v "Guest"
      object_title: os_home_folders_secure_recommended_object
  states:
    state-os-home-folders-secure-recommended-state:
      state_title: os_home_folders_secure_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: ''
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: none_exist
  tests:
    test-os-home-folders-secure-recommended-test:
      test_title: os_home_folders_secure_recommended_test
      capability: independent.shellcommand
      object: os-home-folders-secure-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-os-home-folders-secure-recommended-state
  evaluate:
    test: test-os-home-folders-secure-recommended-test
