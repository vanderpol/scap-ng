assessment:
  id: ng.shared.c278b5d4a8fba3a017426d20
  version: 1
  assessment_title: The Oracle Linux operating system must audit all uses of the su command.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system generates audit records when successful/unsuccessful attempts to use the "su" command
    occur. Check that the following system call is being audited by performing the following command to check the file system
    rules in "/etc/audit/audit.rules": $ sudo grep -w "/usr/bin/su" /etc/audit/audit.rules -a always,exit -F path=/usr/bin/su
    -F perm=x -F auid>=1000 -F auid!=unset -k privileged-priv_change If the command does not return any output, this is a
    finding.'
  inputs: []
  evidence: []
