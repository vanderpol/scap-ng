assessment:
  id: ng.shared.c3e0690ea4a68d08755a5962
  version: 1
  assessment_title: The Ubuntu operating system must configure the uncomplicated firewall to rate-limit impacted network interfaces.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    ubuntu-configure-uncomplicated-firewall-ufw-rate-limit-impacted-network-interfaces-collection:
      collection_title: Ubuntu must configure the Uncomplicated Firewall (ufw) to rate-limit impacted network interfaces.
        All network ports in 'LISTEN' state.
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: ss -l46utn
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\S+\s+(?:LISTEN)(?:\s+\S+\s+){2}\[:+\d*\]:(\S+)\s+
    ubuntu-configure-uncomplicated-firewall-ufw-rate-limit-impacted-network-interfaces-collection-2:
      collection_title: Ubuntu must configure the Uncomplicated Firewall (ufw) to rate-limit impacted network interfaces.
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: ufw status
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(\d+)(?:\/|\s).*(?:LIMIT|DENY)\s+
  variables:
    ufw-rules-ports-that-either-limit-or-deny-variable:
      title: ufw rules ports that are either LIMIT or DENY
      kind: local
      datatype: string
      expression:
        unique:
          values:
            collection: ubuntu-configure-uncomplicated-firewall-ufw-rate-limit-impacted-network-interfaces-collection-2
            field: subexpression
  tests:
    test-ubuntu-configure-uncomplicated-firewall-ufw-rate-limit-impacted-network-interfaces:
      test_title: Ubuntu must configure the Uncomplicated Firewall (ufw) to rate-limit impacted network interfaces.
      capability: independent.shellcommand
      collection: ubuntu-configure-uncomplicated-firewall-ufw-rate-limit-impacted-network-interfaces-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: only one
        state_title: Ubuntu must configure the Uncomplicated Firewall (ufw) to rate-limit impacted network interfaces. Firewall
          rules which 'LIMIT' or 'DENY' ports
        state_capability: independent.shellcommand
        state:
          field: subexpression
          value:
            variable: ufw-rules-ports-that-either-limit-or-deny-variable
          operation: pattern match
          datatype: string
          mask: false
          variable_check: at least one
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-ubuntu-configure-uncomplicated-firewall-ufw-rate-limit-impacted-network-interfaces
