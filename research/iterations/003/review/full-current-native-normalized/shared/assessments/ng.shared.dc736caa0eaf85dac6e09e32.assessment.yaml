assessment:
  id: ng.shared.dc736caa0eaf85dac6e09e32
  version: 1
  assessment_title: Active hyperlinks in messages from non .mil domains must be rendered unclickable.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: If using another DOD-approved anti-spam product for email or a DOD-approved Email Gateway spamming device,
    such as Enterprise Email Security Gateway (EEMSG), this is not applicable. Note: If system is on SIPRNet, this is not
    applicable. Review the Email Domain Security Plan (EDSP). Determine the name of the Transport Agent. Open the Windows
    PowerShell console and enter the following command: Get-TransportAgent -Name ''customAgent'' | Format-List If the value
    does not return "customAgent", this is a finding. Note: "customAgent" is the name of the custom agent developed to render
    hyperlink email sources from non .mil domains as unclickable.'
  inputs: []
  evidence: []
