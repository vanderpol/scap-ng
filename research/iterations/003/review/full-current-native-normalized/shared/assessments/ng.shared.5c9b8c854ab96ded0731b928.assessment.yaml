assessment:
  id: ng.shared.5c9b8c854ab96ded0731b928
  version: 1
  assessment_title: The Create permanent shared objects user right must not be assigned to any groups or accounts.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy
    >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment. If any
    groups or accounts are granted the "Create permanent shared objects" user right, this is a finding.
  inputs: []
  evidence: []
