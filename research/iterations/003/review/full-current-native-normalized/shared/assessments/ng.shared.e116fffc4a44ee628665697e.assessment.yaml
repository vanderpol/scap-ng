assessment:
  id: ng.shared.e116fffc4a44ee628665697e
  version: 1
  assessment_title: The Oracle Linux operating system must audit all uses of the setfiles command.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system generates audit records when successful/unsuccessful attempts to use the "setfiles"
    command occur. Check the file system rule in "/etc/audit/audit.rules" with the following command: $ sudo grep -w "/usr/sbin/setfiles"
    /etc/audit/audit.rules -a always,exit -F path=/usr/sbin/setfiles -F perm=x -F auid>=1000 -F auid!=unset -k privileged-priv_change
    If the command does not return any output, this is a finding.'
  inputs: []
  evidence: []
