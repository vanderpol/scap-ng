assessment:
  id: ng.shared.c1fa1ad88f3b54de1258945b
  version: 1
  assessment_title: The operating system must prevent a user from overriding the screensaver idle-activation-enabled setting
    for the graphical user interface.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-rpminfo-collection:
      collection_title: null
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: dconf
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/dconf/db/
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[0-9].*$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\[org/gnome/desktop/screensaver\]([^\n]*\n+)+?idle-activation-enabled\s*=\s*(?:true|false)\s*$
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
      behaviors:
        multiline: 'true'
        max_depth: '1'
        recurse_direction: down
    idle-activation-enabled-locks-collection:
      collection_title: idle-activation-enabled locks
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: lock-paths-databases-that-have-idle-activation-enabled-settings-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^.*$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^/org/gnome/desktop/screensaver/idle-activation-enabled\s*$
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
      behaviors:
        multiline: 'true'
        max_depth: '1'
        recurse_direction: down
    idle-activation-enabled-entries-that-not-locked-collection:
      collection_title: idle-activation-enabled entries that are not locked
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - collection: independent-textfilecontent54-collection
        filters:
        - action: exclude
          match:
            field: path
            value:
              variable: paths-databases-that-have-idle-activation-enabled-locked-variable
            operation: equals
            datatype: string
            mask: false
            variable_check: at least one
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: match paths for databases that have idle-activation-enabled locked
          capability: independent.textfilecontent54
  variables:
    lock-paths-databases-that-have-idle-activation-enabled-settings-variable:
      title: lock paths for databases that have idle-activation-enabled settings
      kind: local
      datatype: string
      expression:
        concat:
        - values:
            collection: independent-textfilecontent54-collection
            field: path
        - literal:
            value: /locks
            datatype: string
    paths-databases-that-have-idle-activation-enabled-locked-variable:
      title: paths for databases that have idle-activation-enabled locked
      kind: local
      datatype: string
      expression:
        regex_capture:
          value:
            values:
              collection: idle-activation-enabled-locks-collection
              field: path
          pattern: ^(.*)/locks$
  tests:
    test-package-dconf-installed:
      test_title: package dconf is installed
      capability: linux.rpminfo
      collection: linux-rpminfo-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state: null
    test-idle-activation-enabled-configuration-present:
      test_title: idle-activation-enabled configuration is present
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
    test-idle-activation-enabled-lock-exists:
      test_title: idle-activation-enabled lock exists
      capability: independent.textfilecontent54
      collection: idle-activation-enabled-locks-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
    test-all-idle-activation-enabled-entries-locked:
      test_title: all idle-activation-enabled entries are locked
      capability: independent.textfilecontent54
      collection: idle-activation-enabled-entries-that-not-locked-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
  evaluate:
    any:
    - not:
        test: test-package-dconf-installed
    - all:
      - test: test-idle-activation-enabled-configuration-present
      - test: test-idle-activation-enabled-lock-exists
      - test: test-all-idle-activation-enabled-entries-locked
