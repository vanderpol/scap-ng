assessment:
  id: ng.shared.48db2d299d58283c791ffed7
  version: 1
  assessment_title: Media Player - First Use Dialog Boxes
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: Software\Policies\Microsoft\WindowsMediaPlayer
        name:
          operation: equals
          datatype: string
          value: GroupPrivacyAcceptance
      object_title: null
  states:
    state-reg-dword-type-and-value-equals-1:
      state_title: Reg_Dword type and value equals 1
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-do-not-show-first-use-dialog-boxes-set-enabled:
      test_title: '''Do Not Show First Use Dialog Boxes'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-1
  evaluate:
    test: test-do-not-show-first-use-dialog-boxes-set-enabled
