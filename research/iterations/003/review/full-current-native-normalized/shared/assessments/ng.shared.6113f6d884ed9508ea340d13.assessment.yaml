assessment:
  id: ng.shared.6113f6d884ed9508ea340d13
  version: 1
  assessment_title: The IIS 10.0 websites Maximum Query String limit must be configured.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    get-website-request-filtering-maxquerystring-setting-object:
      capability: windows.appcmdlistconfig
      select:
        identifier_type:
          operation: equals
          datatype: string
          value: Site
        identifier:
          operation: pattern match
          datatype: string
          value: .*
        section:
          operation: equals
          datatype: string
          value: requestfiltering
        parameter:
          operation: equals
          datatype: string
          value: requestLimits.maxQueryString
      object_title: Get Website Request Filtering maxQueryString setting
  states:
    state-appcmdlistconfig-result-must-equal-or-less-than-2048:
      state_title: appcmdlistconfig result must equal or less than 2048
      capability: windows.appcmdlistconfig
      state:
        field: result
        value: '2048'
        operation: less than or equal
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-web-site-request-filtering-maxquerystring-value-2048-or-less:
      test_title: The web-site Request Filtering maxQueryString value must be 2048 or less
      capability: windows.appcmdlistconfig
      object: get-website-request-filtering-maxquerystring-setting-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-appcmdlistconfig-result-must-equal-or-less-than-2048
  evaluate:
    test: test-web-site-request-filtering-maxquerystring-value-2048-or-less
