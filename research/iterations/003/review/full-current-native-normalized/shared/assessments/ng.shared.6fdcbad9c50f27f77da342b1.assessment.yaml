assessment:
  id: ng.shared.6fdcbad9c50f27f77da342b1
  version: 1
  assessment_title: Remote Assistance - Solicit Remote Assistance
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services
        name:
          operation: equals
          datatype: string
          mask: false
          value: fAllowToGetHelp
  variables:
    solicited-remote-assistance-variable:
      title: Solicited Remote Assistance
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: solicited_remote_assistance_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-configure-solicited-remote-assistance-set-disabled:
      test_title: '''Configure Solicited Remote Assistance'' is set to ''Disabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: solicited-remote-assistance-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-configure-solicited-remote-assistance-set-disabled
