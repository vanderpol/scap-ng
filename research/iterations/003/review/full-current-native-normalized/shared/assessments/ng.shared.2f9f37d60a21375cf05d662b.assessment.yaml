assessment:
  id: ng.shared.2f9f37d60a21375cf05d662b
  version: 1
  assessment_title: Apache 2.4 Windows
  mode: automated
  class: inventory
  purpose: applicability
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    gather-unique-apache-http-installation-paths-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: powershell
        command:
          operation: equals
          datatype: string
          value: (Get-Process httpd -ErrorAction SilentlyContinue).Path | Split-Path | Sort-Object -Unique
        pattern:
          operation: equals
          datatype: string
          value: .*
      object_title: Gather unique apache http installation paths
  states:
    state-powershell-command-returns-a-path:
      state_title: Powershell Command returns a path
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: '^[a-zA-Z]:'
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-gather-all-installation-directories-from-running-apache-httpd-processes:
      test_title: Gather all installation directories from running apache httpd processes
      capability: independent.shellcommand
      object: gather-unique-apache-http-installation-paths-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-powershell-command-returns-a-path
  evaluate:
    test: test-gather-all-installation-directories-from-running-apache-httpd-processes
