assessment:
  id: ng.shared.a3c842d76999e6d0172827d9
  version: 1
  assessment_title: Limit Blank Passwords
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\Currentcontrolset\Control\Lsa
        name:
          operation: equals
          datatype: string
          mask: false
          value: Limitblankpassworduse
  variables:
    accounts-limit-local-account-use-blank-passwords-console-logon-only-variable:
      title: 'Accounts: Limit local account use to blank passwords to console logon only'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: limit_blank_password_use_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-accounts-limit-local-account-use-blank-passwords-console-logon-only:
      test_title: '''Accounts: Limit local account use of blank passwords to console logon only'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: accounts-limit-local-account-use-blank-passwords-console-logon-only-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-accounts-limit-local-account-use-blank-passwords-console-logon-only
