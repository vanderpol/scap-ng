assessment:
  id: ng.shared.6ce52d2b0162ac2fffebc798
  version: 1
  assessment_title: UBTU-20-010198 - The Ubuntu operating system must initiate session audits at system start-up.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /boot/grub/grub.cfg
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*linux\s+(.+)$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
    independent-textfilecontent54-object-2:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/default/grub
        pattern:
          operation: pattern match
          datatype: string
          value: (?i)^\s*GRUB_CMDLINE_LINUX\w*\s*=\s*(.+)$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: \baudit=1\b
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-all-linux-lines-in-boot-grub-grub-cfg-contain-audit:
      test_title: All linux lines in /boot/grub/grub.cfg must contain 'audit=1'.
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
    test-all-linux-lines-in-etc-default-grub-contain-audit-1:
      test_title: All linux lines in /etc/default/grub contain 'audit=1'.
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-2
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    all:
    - test: test-all-linux-lines-in-boot-grub-grub-cfg-contain-audit
    - test: test-all-linux-lines-in-etc-default-grub-contain-audit-1
