assessment:
  id: ng.shared.db0c755ec47fb31306616512
  version: 1
  assessment_title: Disable Empty Passwords
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-rpminfo-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: openssh-server
      object_title: null
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[\s]*PermitEmptyPasswords[ \t]+([^\s#]*)[ \t]*(?:|(?:#.*))?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
        multiline: 'true'
      object_title: null
  states:
    state-permitemptypasswords-no:
      state_title: PermitEmptyPasswords = no
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^(no|"no")$
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-package-openssh-server-removed:
      test_title: package openssh-server is removed
      capability: linux.rpminfo
      object: linux-rpminfo-object
      check_existence: none_exist
      check: all
    test-etc-ssh-sshd-config-permitemptypasswords:
      test_title: /etc/ssh/sshd_config PermitEmptyPasswords
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: any_exist
      check: all
      states:
      - state-permitemptypasswords-no
  evaluate:
    any:
    - test: test-package-openssh-server-removed
    - test: test-etc-ssh-sshd-config-permitemptypasswords
