assessment:
  id: ng.shared.c4142814386b3ce7eed5c798
  version: 1
  assessment_title: The macOS system must disable Remote Management.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    system-settings-remote-management-disable-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/libexec/mdmclient QuerySecurityInfo 2>/dev/null | /usr/bin/grep "RemoteDesktopEnabled = 0"
      object_title: system_settings_remote_management_disable_recommended_object
  states:
    state-system-settings-remote-management-disable-recommended-st:
      state_title: system_settings_remote_management_disable_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: .*
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-settings-remote-management-disable-recommended-test:
      test_title: system_settings_remote_management_disable_recommended_test
      capability: independent.shellcommand
      object: system-settings-remote-management-disable-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-system-settings-remote-management-disable-recommended-st
  evaluate:
    test: test-system-settings-remote-management-disable-recommended-test
