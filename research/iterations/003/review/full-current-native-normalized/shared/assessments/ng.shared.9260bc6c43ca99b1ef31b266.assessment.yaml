assessment:
  id: ng.shared.9260bc6c43ca99b1ef31b266
  version: 1
  assessment_title: Exchange servers must use approved DOD certificates.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    run-get-exchangecertificate-gather-certificatedomains-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: add-pssnapin Microsoft.Exchange.Management.Powershell.Snapin;Get-ExchangeCertificate | Select-Object CertificateDomains,
            Issuer, Status | Format-Table -HideTableHeaders | Out-String -Width 4096
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: \w
      behaviors:
        error_if_stderr_exists: 'true'
      object_title: Run Get-ExchangeCertificate to gather CertificateDomains.
  states:
    state-verify-dod-root-exists-in-subexpression:
      state_title: Verify DoD root exists in subexpression
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: (?i)dod.*\svalid$
        operation: pattern match
        datatype: string
        mask: false
        entity_check: at least one
        entity_existence: at_least_one_exists
  tests:
    test-if-value-certificatedomains-does-not-indicate-it-issued-by-dod:
      test_title: If the value of CertificateDomains does not indicate it is issued by the DOD, this is a finding.
      capability: independent.shellcommand
      object: run-get-exchangecertificate-gather-certificatedomains-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-verify-dod-root-exists-in-subexpression
  evaluate:
    test: test-if-value-certificatedomains-does-not-indicate-it-issued-by-dod
