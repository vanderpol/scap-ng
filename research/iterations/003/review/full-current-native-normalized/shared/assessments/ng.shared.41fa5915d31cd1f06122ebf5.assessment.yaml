assessment:
  id: ng.shared.41fa5915d31cd1f06122ebf5
  version: 1
  assessment_title: Networking is enabled on System.
  mode: automated
  class: inventory
  purpose: applicability
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    networking-enabled-object:
      capability: unix.interface
      select:
        name:
          operation: pattern match
          datatype: string
          value: .*
      filters:
      - action: exclude
        state: state-find-ethernet-interfaces
      object_title: Networking Enabled.
  states:
    state-networking-enabled-look-for-interfaces-that-are-up:
      state_title: Networking Enabled - look for interfaces that are 'UP'
      capability: unix.interface
      state:
        field: flag
        value: RUNNING|MULTICAST|BROADCAST|UP
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-find-ethernet-interfaces:
      state_title: Find ethernet interfaces.
      capability: unix.interface
      state:
        field: type
        value: ARPHRD_LOOPBACK
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-networking-enabled:
      test_title: Networking Enabled.
      capability: unix.interface
      object: networking-enabled-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-networking-enabled-look-for-interfaces-that-are-up
  evaluate:
    test: test-networking-enabled
