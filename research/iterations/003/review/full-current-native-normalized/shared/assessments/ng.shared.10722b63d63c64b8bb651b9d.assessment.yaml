  assessment_title: The Oracle Linux operating system must be configured so that the root account must be the only account
    having unrestricted access to the system.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Check the system for duplicate UID "0" assignments with the following command: # awk -F: ''$3 == 0 {print $1}''
    /etc/passwd If any accounts other than root have a UID of "0", this is a finding.'
