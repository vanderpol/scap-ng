assessment:
  id: ng.shared.f274427e8bf24092d6001e51
  version: 1
  assessment_title: AZLX-23-002335 - Amazon Linux 2023 must ensure the /var/log/messages file be group-owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-file-object:
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          value: /var/log/messages
      object_title: null
  states:
    state-group-owned-by-root:
      state_title: group-owned by root
      capability: unix.file
      state:
        field: group_id
        value: '0'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-var-log-messages-file-owned-by-root:
      test_title: /var/log/messages file is owned by root
      capability: unix.file
      object: unix-file-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-group-owned-by-root
  evaluate:
    test: test-var-log-messages-file-owned-by-root
