assessment:
  id: ng.shared.58522b08fe167f4681414e37
  version: 1
  assessment_title: UBTU-22-232095 - Ubuntu 22.04 LTS must configure the files used by the system journal to be group-owned
    by "systemd-journal".
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-file-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /run/log/journal
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .+
      behaviors:
        recurse_direction: down
      object_title: null
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/group
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: '^systemd-journal:[^:]*:([0-9]+):'
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: null
    unix-file-object-2:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /var/log/journal
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .+
      behaviors:
        recurse_direction: down
      object_title: null
  variables:
    gid-systemd-journal-variable:
      title: GID for systemd-journal
      kind: local
      datatype: int
      expression:
        values:
          object: independent-textfilecontent54-object
          field: subexpression
  states:
    state-group-id-for-systemd-journal:
      state_title: group id for systemd-journal
      capability: unix.file
      state:
        field: group_id
        value:
          variable: gid-systemd-journal-variable
        operation: equals
        datatype: int
        mask: false
        variable_check: all
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-run-log-journal-files-owned-by-systemd-journal:
      test_title: '/run/log/journal: files owned by systemd-journal'
      capability: unix.file
      object: unix-file-object
      check_existence: any_exist
      check: all
      states:
      - state-group-id-for-systemd-journal
    test-var-log-journal-files-owned-by-systemd-journal:
      test_title: '/var/log/journal: files owned by systemd-journal'
      capability: unix.file
      object: unix-file-object-2
      check_existence: any_exist
      check: all
      states:
      - state-group-id-for-systemd-journal
  evaluate:
    all:
    - test: test-run-log-journal-files-owned-by-systemd-journal
    - test: test-var-log-journal-files-owned-by-systemd-journal
