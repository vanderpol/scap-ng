assessment:
  id: ng.shared.6c549082e6d514502fd7c265
  version: 1
  assessment_title: The operating system must have no unowned files.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    files-that-owned-by-user-or-group-not-listed-in-collection:
      collection_title: Files that are owned by a user or group not listed in /etc/passwd or /etc/group
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: 'find / \( -fstype nfs -o -fstype cachefs -o -fstype autofs \

            -o -fstype ctfs -o -fstype mntfs -o -fstype objfs \

            -o -fstype proc \) -prune \( -nouser -o -nogroup \) -ls'
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
  tests:
    test-files-that-owned-by-user-or-group-not-listed-in:
      test_title: Files that are owned by a user or group not listed in /etc/passwd or /etc/group should not exist
      capability: independent.shellcommand
      collection: files-that-owned-by-user-or-group-not-listed-in-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: No stdout_line data should exist
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: ''
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: none_exist
  evaluate:
    test: test-files-that-owned-by-user-or-group-not-listed-in
