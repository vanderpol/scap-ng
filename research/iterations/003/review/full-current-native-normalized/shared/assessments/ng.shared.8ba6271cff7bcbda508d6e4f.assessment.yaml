assessment:
  id: ng.shared.8ba6271cff7bcbda508d6e4f
  version: 1
  assessment_title: Anonymous SID/Name translation must not be allowed.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    retrieves-passwordpolicy-object-collection:
      collection_title: Retrieves a passwordpolicy_object.
      capability: windows.passwordpolicy
  tests:
    test-network-access-allow-anonymous-sid-name-translation-set-disabled:
      test_title: 'Network access: Allow anonymous SID/Name translation is set to ''Disabled'''
      capability: windows.passwordpolicy
      collection: retrieves-passwordpolicy-object-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: This passwordpolicy_state represents a password policy that has a anonymous_name_lookup equal to '0'.
        state_capability: windows.passwordpolicy
        state:
          field: anonymous_name_lookup
          value: '0'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-network-access-allow-anonymous-sid-name-translation-set-disabled
