assessment:
  id: ng.shared.1c2da9b6ed1d7dfb46dfb40a
  version: 1
  assessment_title: OL 8 audit tools must be group-owned by root.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the audit tools are group-owned by "root" to prevent any unauthorized access, deletion, or modification.
    Check the owner of each audit tool by running the following commands: $ sudo stat -c "%G %n" /sbin/auditctl /sbin/aureport
    /sbin/ausearch /sbin/autrace /sbin/auditd /sbin/rsyslogd /sbin/augenrules root /sbin/auditctl root /sbin/aureport root
    /sbin/ausearch root /sbin/autrace root /sbin/auditd root /sbin/rsyslogd root /sbin/augenrules If any of the audit tools
    are not group-owned by "root", this is a finding.'
  inputs: []
  evidence: []
