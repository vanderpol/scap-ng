assessment:
  id: ng.shared.d0b6de2f011b51d060cb55f2
  version: 1
  assessment_title: WN10-CC-000215 - Explorer Data Execution Prevention must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: Software\Policies\Microsoft\Windows\Explorer
        name:
          operation: equals
          datatype: string
          value: NoDataExecutionPrevention
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-turn-off-data-execution-prevention-explorer-set-disabled-or-not:
      test_title: '''Turn off Data Execution Prevention for Explorer'' is set to ''Disabled'' or ''Not Configured'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: any_exist
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-turn-off-data-execution-prevention-explorer-set-disabled-or-not
