assessment:
  id: ng.shared.9e911d3359aa3fced42c9c1c
  version: 1
  assessment_title: The macOS system must be configured so that log files do not contain access control lists (ACLs).
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    audit-acls-files-configure-recommended-object-collection:
      collection_title: audit_acls_files_configure_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/bin/ls -le $(/usr/bin/grep ''^dir'' /etc/security/audit_control | /usr/bin/awk -F: ''{print $2}'') | /usr/bin/awk
            ''{print $1}'' | /usr/bin/grep ":"'
  tests:
    test-audit-acls-files-configure-recommended-test:
      test_title: audit_acls_files_configure_recommended_test
      capability: independent.shellcommand
      collection: audit-acls-files-configure-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: audit_acls_files_configure_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: ''
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: none_exist
  evaluate:
    test: test-audit-acls-files-configure-recommended-test
