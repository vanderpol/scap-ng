assessment:
  id: ng.shared.499261fee52524a9fcffa253
  version: 1
  assessment_title: Forcibly Disconnect when Logon Hours Expire
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Services\LanManServer\Parameters
        name:
          operation: equals
          datatype: string
          mask: false
          value: EnableForcedLogOff
      object_title: null
  variables:
    microsoft-network-server-disconnect-clients-when-logon-hours-expire-variable:
      title: 'Microsoft network server: Disconnect clients when logon hours expire'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: disconnect_client_when_logon_hours_expire_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: microsoft-network-server-disconnect-clients-when-logon-hours-expire-variable
          operation: equals
          datatype: int
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-microsoft-network-server-disconnect-clients-when-logon-hours-expire-set:
      test_title: '''Microsoft network server: Disconnect clients when logon hours expire'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-microsoft-network-server-disconnect-clients-when-logon-hours-expire-set
