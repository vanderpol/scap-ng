assessment:
  id: ng.shared.3e49ff5e5a62248822d80981
  version: 1
  assessment_title: WN19-DC-000410 - Windows Server 2019 Deny log on through Remote Desktop Services user right on domain
    controllers must be configured to prevent unauthenticated access.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-userright-object:
      capability: windows.userright
      select:
        userright:
          operation: equals
          datatype: string
          mask: false
          value: SE_DENY_REMOTE_INTERACTIVE_LOGON_NAME
      object_title: null
  states:
    state-windows-userright:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: Guests
        operation: case insensitive equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-deny-log-on-through-remote-desktop-services-guests:
      test_title: Deny log on through Remote Desktop Services - Guests
      capability: windows.userright
      object: windows-userright-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-windows-userright
  evaluate:
    test: test-deny-log-on-through-remote-desktop-services-guests
