assessment:
  id: ng.shared.8b2025b20869a44030490a51
  version: 1
  assessment_title: The operating system must have no files with extended attributes.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    find-files-extended-attributes-collection:
      collection_title: find files with extended attributes
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: 'find / \( -fstype nfs -o -fstype cachefs -o -fstype autofs \

            -o -fstype ctfs -o -fstype mntfs -o -fstype objfs \

            -o -fstype proc \) -prune -o -xattr -ls'
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
  tests:
    test-operating-system-have-no-files-extended-attributes:
      test_title: The operating system must have no files with extended attributes.
      capability: independent.shellcommand
      collection: find-files-extended-attributes-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: No stdout_line data should exist
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: ''
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: none_exist
  evaluate:
    test: test-operating-system-have-no-files-extended-attributes
