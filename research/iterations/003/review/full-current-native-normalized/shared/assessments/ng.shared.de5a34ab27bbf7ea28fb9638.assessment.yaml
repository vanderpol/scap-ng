assessment:
  id: ng.shared.de5a34ab27bbf7ea28fb9638
  version: 1
  assessment_title: The macOS system must configure system log files to be owned by root and group to wheel.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured with system log files owned by root and group to wheel with the following
    command: /usr/bin/stat -f ''%Su:%Sg:%N'' $(/usr/bin/grep -v ''^#'' /etc/newsyslog.conf | /usr/bin/awk ''{ print $1 }'')
    2> /dev/null | /usr/bin/awk ''!/^root:wheel:/{print $1}'' | /usr/bin/wc -l | /usr/bin/tr -d '' '' If the result is not
    "0", this is a finding.'
  inputs: {}
  evidence: []
