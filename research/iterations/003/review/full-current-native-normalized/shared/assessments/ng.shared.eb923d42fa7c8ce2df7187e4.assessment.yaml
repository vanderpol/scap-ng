assessment:
  id: ng.shared.eb923d42fa7c8ce2df7187e4
  version: 1
  assessment_title: UBTU-18-010311 - The Ubuntu operating system must be configured so that audit configuration files are
    not write-accessible by unauthorized users.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    unix-file-collection:
      collection_title: null
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/auditd.conf
    unix-file-collection-2:
      collection_title: null
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/rules.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .rules$
