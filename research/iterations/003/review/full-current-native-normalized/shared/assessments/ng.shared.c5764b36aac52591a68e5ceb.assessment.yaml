assessment:
  id: ng.shared.c5764b36aac52591a68e5ceb
  version: 1
  assessment_title: OL09-00-002060 - OL 9 must mount /var with the nodev option.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-partition-collection:
      collection_title: null
      capability: linux.partition
      select:
        mount_point:
          operation: equals
          datatype: string
          mask: false
          value: /var
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/fstab
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*[^#\s]+\s+/var\s+\S+\s+(\S+)\s+\S+\s+\S+\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-var-mounted-nodev-option:
      test_title: /var is mounted with the nodev option.
      capability: linux.partition
      collection: linux-partition-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: linux.partition
        state:
          field: mount_options
          value: nodev
          operation: equals
          datatype: string
          mask: false
          entity_check: at least one
          entity_existence: at_least_one_exists
    test-var-configured-in-etc-fstab-nodev-option:
      test_title: /var is configured in /etc/fstab with the nodev option.
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: nodev option
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: (^|,)nodev(,|$)
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-var-mounted-nodev-option
    - test: test-var-configured-in-etc-fstab-nodev-option
