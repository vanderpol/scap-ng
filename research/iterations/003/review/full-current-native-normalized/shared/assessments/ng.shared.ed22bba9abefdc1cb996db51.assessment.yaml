assessment:
  id: ng.shared.ed22bba9abefdc1cb996db51
  version: 1
  assessment_title: The operating system must have no files with extended attributes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    find-files-extended-attributes-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: 'find / \( -fstype nfs -o -fstype cachefs -o -fstype autofs \

            -o -fstype ctfs -o -fstype mntfs -o -fstype objfs \

            -o -fstype proc \) -prune -o -xattr -ls'
        pattern:
          operation: pattern match
          datatype: string
          value: .*
      object_title: find files with extended attributes
  states:
    state-no-stdout-line-data-should-exist:
      state_title: No stdout_line data should exist
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: ''
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: none_exist
  tests:
    test-operating-system-have-no-files-extended-attributes:
      test_title: The operating system must have no files with extended attributes.
      capability: independent.shellcommand
      object: find-files-extended-attributes-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-no-stdout-line-data-should-exist
  evaluate:
    test: test-operating-system-have-no-files-extended-attributes
