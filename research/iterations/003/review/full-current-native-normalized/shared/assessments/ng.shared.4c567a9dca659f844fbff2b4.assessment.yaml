assessment:
  id: ng.shared.4c567a9dca659f844fbff2b4
  version: 1
  assessment_title: RHEL-08-040279 - RHEL 8 must ignore IPv4 Internet Control Message Protocol (ICMP) redirect messages.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    unix-sysctl-collection:
      collection_title: null
      capability: unix.sysctl
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: net.ipv4.conf.all.accept_redirects
    setting-net-ipv4-conf-all-accept-redirects-in-sysctl-d-collection:
      collection_title: Setting for net.ipv4.conf.all.accept_redirects in sysctl.d directories.
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: directories-containing-sysctl-configuration-files-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: \.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*net\.ipv4\.conf\.all\.accept_redirects\s*=\s*(\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    setting-net-ipv4-conf-all-accept-redirects-in-etc-sysctl-collection:
      collection_title: Setting for net.ipv4.conf.all.accept_redirects in /etc/sysctl.conf.
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/sysctl.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*net\.ipv4\.conf\.all\.accept_redirects\s*=\s*(\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    setting-net-ipv4-conf-all-accept-redirects-in-all-sysctl-collection:
      collection_title: Setting for net.ipv4.conf.all.accept_redirects in all sysctl configuration files.
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - collection: setting-net-ipv4-conf-all-accept-redirects-in-sysctl-d-collection
        - collection: setting-net-ipv4-conf-all-accept-redirects-in-etc-sysctl-collection
  variables:
    directories-containing-sysctl-configuration-files-variable:
      title: Directories containing sysctl configuration files
      kind: constant
      datatype: string
      expression:
        literal:
        - /etc/sysctl.d
        - /run/sysctl.d
        - /lib/sysctl.d
        - /usr/lib/sysctl.d
        - /usr/local/lib/sysctl.d
  tests:
    test-net-ipv4-conf-all-accept-redirects-set-0-in-kernel:
      test_title: net.ipv4.conf.all.accept_redirects is set to 0 in kernel
      capability: unix.sysctl
      collection: unix-sysctl-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: unix.sysctl
        state:
          field: value
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-net-ipv4-conf-all-accept-redirects-set-0-in-sysctl:
      test_title: net.ipv4.conf.all.accept_redirects is set to 0 in the sysctl configuration files.
      capability: independent.textfilecontent54
      collection: setting-net-ipv4-conf-all-accept-redirects-in-all-sysctl-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-net-ipv4-conf-all-accept-redirects-set-0-in-kernel
    - test: test-net-ipv4-conf-all-accept-redirects-set-0-in-sysctl
