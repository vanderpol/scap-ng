assessment:
  id: ng.shared.ea2ec9461d2a4648247570d0
  version: 1
  assessment_title: The macOS system must be configured with audit log files set to mode 440 or less permissive.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    audit-files-mode-configure-recommended-object-collection:
      collection_title: audit_files_mode_configure_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/bin/ls -l $(/usr/bin/grep ''^dir'' /etc/security/audit_control|/usr/bin/awk -F: ''{print $2}'')|/usr/bin/awk
            ''!/-r--r-----|current|total/{print $1}'''
  tests:
    test-audit-files-mode-configure-recommended-test:
      test_title: audit_files_mode_configure_recommended_test
      capability: independent.shellcommand
      collection: audit-files-mode-configure-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: audit_files_mode_configure_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: ''
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: none_exist
  evaluate:
    test: test-audit-files-mode-configure-recommended-test
