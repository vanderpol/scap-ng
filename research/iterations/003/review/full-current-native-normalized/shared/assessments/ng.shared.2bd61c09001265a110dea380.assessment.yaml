assessment:
  id: ng.shared.2bd61c09001265a110dea380
  version: 1
  assessment_title: The legacy remote network access utilities daemons must not be installed.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    pkg-info-service-network-legacy-remote-utilities-collection:
      collection_title: pkg info service/network/legacy-remote-utilities
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: pkg info service/network/legacy-remote-utilities
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
  tests:
    test-legacy-remote-network-access-utilities-daemons-not-installed:
      test_title: The legacy remote network access utilities daemons must not be installed.
      capability: independent.shellcommand
      collection: pkg-info-service-network-legacy-remote-utilities-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: stdout_line should not exist
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: ''
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: none_exist
  evaluate:
    test: test-legacy-remote-network-access-utilities-daemons-not-installed
