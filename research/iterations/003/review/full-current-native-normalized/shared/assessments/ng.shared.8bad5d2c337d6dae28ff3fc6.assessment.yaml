assessment:
  id: ng.shared.8bad5d2c337d6dae28ff3fc6
  version: 1
  assessment_title: OL09-00-002013 - OL 9 must prevent files with the setuid and setgid bit set from being executed on file
    systems that are imported via Network File System (NFS).
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    etc-fstab-uncommented-nfs-capturing-options-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/fstab
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*[^#\s][^\s]*\s+[^\s]+\s+nfs[^\s]*\s+([^\s]+)
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: /etc/fstab, uncommented, nfs, capturing options
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: (^|,)nosuid(,|$)
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-nfs-mounts-mounted-nosuid:
      test_title: NFS mounts are mounted with nosuid
      capability: independent.textfilecontent54
      object: etc-fstab-uncommented-nfs-capturing-options-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    test: test-nfs-mounts-mounted-nosuid
