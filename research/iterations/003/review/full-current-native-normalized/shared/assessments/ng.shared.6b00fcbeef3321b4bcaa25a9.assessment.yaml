assessment:
  id: ng.shared.6b00fcbeef3321b4bcaa25a9
  version: 1
  assessment_title: User accounts must be locked after 35 days of inactivity.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Determine whether the 35-day inactivity lock is configured properly. # useradd -D | xargs -n 1 | grep inactive
    |\ awk -F= ''{ print $2 }'' If the command returns a result other than 35, this is a finding. The root role is required
    for the "logins" command. For each configured user name and role name on the system, determine whether a 35-day inactivity
    period is configured. Replace [username] with an actual user name or role name. # logins -axo -l [username] | awk -F:
    ''{ print $13 }'' If these commands provide output other than 35, this is a finding.'
  inputs: []
  evidence: []
