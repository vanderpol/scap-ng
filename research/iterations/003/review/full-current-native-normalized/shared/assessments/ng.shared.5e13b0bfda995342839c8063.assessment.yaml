assessment:
  id: ng.shared.5e13b0bfda995342839c8063
  version: 1
  assessment_title: WN19-DC-000060 - Windows Server 2019 computer clock synchronization tolerance must be limited to five
    minutes or less.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    kerberos-policy-maximum-tolerance-computer-clock-synchronization-5-minutes-or-object:
      capability: windows.wmi.query
      object_title: Kerberos Policy - Maximum tolerance for computer clock synchronization must be 5 minutes or less
      collect:
        namespace: root\rsop\computer
        query: SELECT setting FROM RSOP_SecuritySettingNumeric WHERE KeyName='MaxClockSkew'
  states:
    state-maximum-tolerance-for-computer-clock-synchronization-lte:
      state_title: Maximum tolerance for computer clock synchronization lte 5
      capability: windows.wmi.query
      state:
        field: result
        record:
          mask: false
          match: all
          existence: some
          fields:
            setting:
              value: '5'
              operation: less_or_equal
              datatype: integer
              mask: false
              match: all
              existence: some
  tests:
    test-kerberos-policy-maximum-tolerance-computer-clock-synchronization-5-minutes-or:
      test_title: Kerberos Policy - Maximum tolerance for computer clock synchronization - 5 minutes or less
      capability: windows.wmi.query
      object: kerberos-policy-maximum-tolerance-computer-clock-synchronization-5-minutes-or-object
      states:
      - state-maximum-tolerance-for-computer-clock-synchronization-lte
      existence: some
      match: all
  evaluate:
    test: test-kerberos-policy-maximum-tolerance-computer-clock-synchronization-5-minutes-or
