assessment:
  id: ng.shared.6afa0d20f3501ab6c967dc42
  version: 1
  assessment_title: The macOS system must enforce enrollment in mobile device management.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to enforce enrollment in mobile device management with the following command:
    /usr/bin/profiles status -type enrollment | /usr/bin/awk -F: ''/MDM enrollment/ {print $2}'' | /usr/bin/grep -c "Yes (User
    Approved)" If the result is not "1", this is a finding.'
  inputs: []
  evidence: []
