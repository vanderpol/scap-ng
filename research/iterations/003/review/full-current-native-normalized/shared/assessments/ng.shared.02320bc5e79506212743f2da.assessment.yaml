assessment:
  id: ng.shared.02320bc5e79506212743f2da
  version: 1
  assessment_title: WINCC-000030
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-winstore-exist-object:
      capability: windows.file
      select:
        path:
          operation: equals
          datatype: string
          value: C:\Windows\WinStore
        filename:
          operation: equals
          datatype: string
          nil: true
          value: ''
      behaviors:
        recurse_direction: down
        max_depth: '-1'
      object_title: Windows/WinStore exist
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: Software\Policies\Microsoft\Windows\Explorer
        name:
          operation: equals
          datatype: string
          value: NoUseStoreOpenWith
      object_title: null
  states:
    state-reg-dword-type-and-value-equals-1:
      state_title: Reg_Dword type and value equals 1
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-windows-winstore-does-not-exist-not-applicable:
      test_title: Windows\WinStore does not exist, Not Applicable
      capability: windows.file
      object: windows-winstore-exist-object
      check_existence: none_exist
      check: all
    test-turn-off-access-store-set-enabled:
      test_title: '''Turn off access to the Store'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-1
    test-windows-winstore-exist:
      test_title: Windows\WinStore exist
      capability: windows.file
      object: windows-winstore-exist-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    any:
    - test: test-windows-winstore-does-not-exist-not-applicable
    - all:
      - test: test-turn-off-access-store-set-enabled
      - test: test-windows-winstore-exist
