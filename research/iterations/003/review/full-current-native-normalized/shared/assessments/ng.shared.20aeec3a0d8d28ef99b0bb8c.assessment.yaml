assessment:
  id: ng.shared.20aeec3a0d8d28ef99b0bb8c
  version: 1
  assessment_title: The operating system must not allow logins for users with blank passwords.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    passreq-lines-in-etc-default-login-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/default
        filename:
          operation: equals
          datatype: string
          mask: false
          value: login
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^PASSREQ=(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: PASSREQ lines in /etc/default/login
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: 'YES'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-passreq-lines-in-etc-default-login:
      test_title: PASSREQ lines in /etc/default/login
      capability: independent.textfilecontent54
      object: passreq-lines-in-etc-default-login-object
      check_existence: all_exist
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    test: test-passreq-lines-in-etc-default-login
