assessment:
  id: ng.shared.0d2d0dd1c78c39e65b5878f7
  version: 1
  assessment_title: Elevate when setting a network’s location
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\Windows\Network Connections
        name:
          operation: equals
          datatype: string
          mask: false
          value: NC_StdDomainUserSetLocation
      object_title: null
  variables:
    require-domain-users-elevate-when-setting-network-s-location-variable:
      title: Require domain users to elevate when setting a network's location
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: require_domain_users_to_elevate_when_setting_a_networks_location_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: require-domain-users-elevate-when-setting-network-s-location-variable
          operation: equals
          datatype: int
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-require-domain-users-elevate-when-setting-network-s-location-set:
      test_title: '''Require domain users to elevate when setting a network''s location'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-require-domain-users-elevate-when-setting-network-s-location-set
