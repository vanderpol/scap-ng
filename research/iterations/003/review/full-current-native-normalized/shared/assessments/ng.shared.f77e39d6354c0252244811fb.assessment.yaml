assessment:
  id: ng.shared.f77e39d6354c0252244811fb
  version: 1
  assessment_title: AZLX-23-002065 - Amazon Linux 2023 must authenticate the remote logging server for off-loading audit logs
    via rsyslog.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    rsyslog-conf-actionsendstreamdriverauthmode-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/rsyslog.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\$ActionSendStreamDriverAuthMode\s+(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
      object_title: 'rsyslog.conf: ActionSendStreamDriverAuthMode'
    rsyslog-d-conf-actionsendstreamdriverauthmode-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/rsyslog.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^.*\.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\$ActionSendStreamDriverAuthMode\s+(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
      object_title: 'rsyslog.d/*.conf: ActionSendStreamDriverAuthMode'
    actionsendstreamdriverauthmode-object:
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - object: rsyslog-conf-actionsendstreamdriverauthmode-object
        - object: rsyslog-d-conf-actionsendstreamdriverauthmode-object
      object_title: ActionSendStreamDriverAuthMode
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: x509/name
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-actionsendstreamdriverauthmode-x509-name:
      test_title: ActionSendStreamDriverAuthMode == x509/name
      capability: independent.textfilecontent54
      object: actionsendstreamdriverauthmode-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    test: test-actionsendstreamdriverauthmode-x509-name
