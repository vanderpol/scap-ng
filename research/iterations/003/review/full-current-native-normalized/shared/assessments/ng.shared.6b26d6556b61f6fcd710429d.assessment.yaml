assessment:
  id: ng.shared.6b26d6556b61f6fcd710429d
  version: 1
  assessment_title: UBTU-18-010141 - The Ubuntu operating system must have system commands owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    all-files-in-system-command-directories-collection:
      collection_title: All files in system command directories
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: system-command-directories-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
    all-files-in-system-command-directories-execute-bit-set-less-collection:
      collection_title: all files in system command directories (with execute bit set), less symbolic links and setgid files
      capability: unix.file
      set:
        operator: union
        members:
        - collection: all-files-in-system-command-directories-collection
        filters:
        - action: exclude
          match:
            field: type
            value: symbolic link
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: symbolic links
          capability: unix.file
  variables:
    system-command-directories-variable:
      title: system command directories
      kind: constant
      datatype: string
      expression:
        literal:
        - /bin
        - /sbin
        - /usr/bin
        - /usr/sbin
        - /usr/local/bin
        - /usr/local/sbin
  tests:
    test-all-files-in-system-command-directories:
      test_title: All files in system command directories
      capability: unix.file
      collection: all-files-in-system-command-directories-execute-bit-set-less-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: 0755 permissions or less permissive
        state_capability: unix.file
        state:
          field: user_id
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-all-files-in-system-command-directories
