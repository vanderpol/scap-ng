assessment:
  id: ng.shared.6325616f3a79bef896dc8116
  version: 1
  assessment_title: 'WN19-UR-000140 - Windows Server 2019 Increase scheduling priority: user right must only be assigned to
    the Administrators group.'
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-userright-collection:
      collection_title: null
      capability: windows.userright
      select:
        userright:
          operation: equals
          datatype: string
          mask: false
          value: SE_INC_BASE_PRIORITY_NAME
  tests:
    test-increase-scheduling-priority-administrators:
      test_title: Increase scheduling priority - Administrators
      capability: windows.userright
      collection: windows-userright-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: null
          capability: windows.userright
          state:
            field: trustee_name
            value: ''
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: windows.userright
          state:
            field: trustee_name
            value: Administrators
            operation: case insensitive equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-increase-scheduling-priority-administrators
