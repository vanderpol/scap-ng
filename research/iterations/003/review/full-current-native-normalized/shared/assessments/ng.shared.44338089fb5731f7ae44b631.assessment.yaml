assessment:
  id: ng.shared.44338089fb5731f7ae44b631
  version: 1
  assessment_title: OL08-00-010520 - The OL 8 SSH daemon must not allow authentication using known host's authentication.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*(?i)IgnoreUserKnownHosts(?-i)[ \t]+([\w\"]+)[\s]*(?:|(?:#.*))?$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^(yes|"yes")$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-etc-ssh-sshd-config-ignoreuserknownhosts-yes:
      test_title: /etc/ssh/sshd_config:IgnoreUserKnownHosts == yes
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    test: test-etc-ssh-sshd-config-ignoreuserknownhosts-yes
