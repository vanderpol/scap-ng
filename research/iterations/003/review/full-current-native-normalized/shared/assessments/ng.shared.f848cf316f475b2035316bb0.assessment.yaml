  version: 1
  assessment_title: The operating system must protect the confidentiality and integrity of information at rest.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Determine if file system encryption is required by your organization. If not required, this item does not apply.
    Determine if file system encryption is enabled for user data sets. This check does not apply to the root, var, share,
    swap or dump datasets. # zfs list Using the file system name, determine if the file system is encrypted: # zfs get encryption
    [filesystem] If "encryption off" is listed, this is a finding.'
  inputs: []
  evidence: []
