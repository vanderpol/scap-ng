assessment:
  id: ng.shared.b0f854ed4c7b6a47bff5638e
  version: 1
  assessment_title: The audit system must be configured to audit all discretionary access control permission modifications.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    auditconfig-t-getflags-cut-f2-d-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: auditconfig -t -getflags | cut -f2 -d=
        pattern:
          operation: pattern match
          datatype: string
          value: .*
      object_title: auditconfig -t -getflags | cut -f2 -d=
  states:
    state-fm-is-returned-in-the-output:
      state_title: fm is returned in the output
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: fm
          operation: pattern match
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-audit-system-configured-audit-all-discretionary-access-control-permission-modifications:
      test_title: The audit system must be configured to audit all discretionary access control permission modifications.
      capability: independent.shellcommand
      object: auditconfig-t-getflags-cut-f2-d-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-fm-is-returned-in-the-output
  evaluate:
    test: test-audit-system-configured-audit-all-discretionary-access-control-permission-modifications
