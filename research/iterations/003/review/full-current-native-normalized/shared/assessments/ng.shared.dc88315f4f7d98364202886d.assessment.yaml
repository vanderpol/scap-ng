assessment:
  id: ng.shared.dc88315f4f7d98364202886d
  version: 1
  assessment_title: Verify File Hashes with RPM
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    rpm-verify-all-executables-library-files-collection:
      collection_title: rpm verify of all executables and library files
      capability: linux.rpmverifyfile
      select:
        name:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        epoch:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        version:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        release:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        arch:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        filepath:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(|/usr|/usr/local)/(bin|sbin|lib|lib64|libexec)/.+$
      filters:
      - action: include
        match:
          field: md5_differs
          value: fail
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        capability: linux.rpmverifyfile
      - action: exclude
        match:
          field: ghost_file
          value: 'true'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        capability: linux.rpmverifyfile
      - action: exclude
        match:
          field: configuration_file
          value: 'true'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        capability: linux.rpmverifyfile
      behaviors:
        nomd5: 'false'
        noconfigfiles: 'true'
        noghostfiles: 'true'
  tests:
    test-verify-file-md5-hashes:
      test_title: verify file md5 hashes
      capability: linux.rpmverifyfile
      collection: rpm-verify-all-executables-library-files-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
  evaluate:
    test: test-verify-file-md5-hashes
