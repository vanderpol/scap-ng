assessment:
  id: ng.shared.46e048e152dfa4269e28c17e
  version: 1
  assessment_title: The macOS system must not allow an unattended or automatic logon to the system.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    system-settings-automatic-login-disable-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: zsh
        command:
          operation: equals
          datatype: string
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.loginwindow'')\

            .objectForKey(''com.apple.login.mcx.DisableAutoLoginClient'').js

            EOS'
      object_title: system_settings_automatic_login_disable_recommended_object
  states:
    state-system-settings-automatic-login-disable-recommended-stat:
      state_title: system_settings_automatic_login_disable_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: 'true'
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-settings-automatic-login-disable-recommended-test:
      test_title: system_settings_automatic_login_disable_recommended_test
      capability: independent.shellcommand
      object: system-settings-automatic-login-disable-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-system-settings-automatic-login-disable-recommended-stat
  evaluate:
    test: test-system-settings-automatic-login-disable-recommended-test
