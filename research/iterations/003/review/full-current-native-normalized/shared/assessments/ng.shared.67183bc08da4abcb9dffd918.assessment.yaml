        DOD network (NIPRNet/SIPRNet), and/or the Global Positioning System (GPS).(Only check for USNO.)'
      capability: independent.textfilecontent54
      object: linux-networked-systems-etc-chrony-conf-authoratative-time-servers-configured-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-linux-must-for-networked-systems-compare-internal-inform
    test-linux-networked-systems-compare-internal-information-system-clocks-at-least-3:
      test_title: Linux must, for networked systems, compare internal information system clocks at least every 24 hours. /etc/crony/*(.sources
        or .conf) configure maxpoll less than 17.
      capability: independent.textfilecontent54
      object: linux-networked-systems-etc-crony-sources-or-conf-configure-maxpoll-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-maxburst-less-than-17
    test-linux-networked-systems-compare-internal-information-system-clocks-at-least-4:
      test_title: 'Linux must, for networked systems, compare internal information system clocks at least every 24 hours with
        a server synchronized to one of the redundant United States Naval Observatory (USNO) time servers: /etc/chrony/*(.sources
        or .conf) Authoratative time servers must be configured:( tick.usno.navy.mil or tock.usno.navy.mil or ntp2.usno.navy.mil),
        or a time server designated for the appropriate DOD network (NIPRNet/SIPRNet), and/or the Global Positioning System
        (GPS).(Only check for USNO.)'
      capability: independent.textfilecontent54
      object: linux-networked-systems-etc-chrony-sources-or-conf-authoratative-time-object
