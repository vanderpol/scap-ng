      capability: independent.textfilecontent54
      object: linux-networked-systems-etc-crony-conf-configure-maxpoll-less-than-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-maxburst-less-than-17
    test-linux-networked-systems-compare-internal-information-system-clocks-at-least-2:
      test_title: 'Linux must, for networked systems, compare internal information system clocks at least every 24 hours with
