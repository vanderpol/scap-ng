    - all:
      - test: test-linux-networked-systems-compare-internal-information-system-clocks-at-least
      - test: test-linux-networked-systems-compare-internal-information-system-clocks-at-least-2
    - all:
      - test: test-linux-networked-systems-compare-internal-information-system-clocks-at-least-3
      - test: test-linux-networked-systems-compare-internal-information-system-clocks-at-least-4
