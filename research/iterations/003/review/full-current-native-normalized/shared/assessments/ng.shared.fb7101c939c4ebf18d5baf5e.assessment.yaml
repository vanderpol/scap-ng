assessment:
  id: ng.shared.fb7101c939c4ebf18d5baf5e
  version: 1
  assessment_title: The TFTP service daemon must not be installed unless required.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    pkg-info-service-network-tftp-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: pkg info service/network/tftp
        pattern:
          operation: pattern match
          datatype: string
          value: .*
      object_title: pkg info service/network/tftp
  states:
    state-stdout-line-should-not-exist:
      state_title: stdout_line should not exist
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: ''
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: none_exist
  tests:
    test-tftp-daemon-not-installed-unless-required:
      test_title: The TFTP daemon must not be installed unless required.
      capability: independent.shellcommand
      object: pkg-info-service-network-tftp-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-stdout-line-should-not-exist
  evaluate:
    test: test-tftp-daemon-not-installed-unless-required
