assessment:
  id: ng.shared.ccce5794f6493f1553bb3971
  version: 1
  assessment_title: Find world writable directories not group-owned by a system account
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    all-local-directories-collection:
      collection_title: all local directories
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
      filters:
      - action: include
        match:
          all:
          - field: group_id
            value: '1000'
            operation: greater than or equal
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: owrite
            value: 'true'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        state_title: gid greater than or equal to 1000 and world writable
        capability: unix.file
      behaviors:
        max_depth: '-1'
        recurse: directories
        recurse_direction: down
        recurse_file_system: local
  tests:
    test-check-local-directories-that-world-writable-have-gid-greater-than:
      test_title: check for local directories that are world writable and have gid greater than or equal to 1000
      capability: unix.file
      collection: all-local-directories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: gid greater than or equal to 1000 and world writable
        state_capability: unix.file
        state:
          all:
          - field: group_id
            value: '1000'
            operation: greater than or equal
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: owrite
            value: 'true'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    not:
      test: test-check-local-directories-that-world-writable-have-gid-greater-than
