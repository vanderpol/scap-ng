assessment:
  id: ng.shared.e5a08e2da7bff3c96ce6f45e
  version: 1
  assessment_title: WN12-AU-000031
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    audit-event-subcategories-policy-object:
      capability: windows.auditeventpolicysubcategories
      object_title: Audit event subcategories policy
  states:
    state-account-lockout-is-set-to-failure:
      state_title: '''Account Lockout'' is set to ''Failure'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: account_lockout
        value: AUDIT_FAILURE
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-account-lockout-is-set-to-success-and-failure:
      state_title: '''Account Lockout'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: account_lockout
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-account-lockout-set-failure:
      test_title: '''Audit Account Lockout'' is set to ''Failure'''
      capability: windows.auditeventpolicysubcategories
      object: audit-event-subcategories-policy-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-account-lockout-is-set-to-failure
    test-audit-account-lockout-set-success-failure:
      test_title: '''Audit Account Lockout'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      object: audit-event-subcategories-policy-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-account-lockout-is-set-to-success-and-failure
  evaluate:
    any:
    - test: test-audit-account-lockout-set-failure
    - test: test-audit-account-lockout-set-success-failure
