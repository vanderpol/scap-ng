  assessment_title: The Oracle Linux operating system must use a separate file system for /var.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that a separate file system/partition has been created for "/var". Check that a file system/partition
    has been created for "/var" with the following command: # grep /var /etc/fstab UUID=c274f65f /var ext4 noatime,nobarrier
    1 2 If a separate entry for "/var" is not in use, this is a finding.'
