assessment:
  id: ng.shared.900eadcc213b8f4c4d7539f8
  version: 1
  assessment_title: Ubuntu 22.04 LTS audit event multiplexor must be configured to offload audit logs onto a different system
    from the system being audited.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    audit-event-multiplexor-configured-offload-audit-logs-onto-different-system-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: dpkg -l | grep audispd-plugins
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: \s*ii\s+(audispd-plugins)\s+
      object_title: Audit event multiplexor must be configured to offload audit logs onto a different system from the system
        being audited. package audispd-plugins must be installed.
    audit-event-multiplexor-configured-offload-audit-logs-onto-different-system-object-2:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/plugins.d/au-remote.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*active\s*=\s*yes\b
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: Audit event multiplexor must be configured to offload audit logs onto a different system from the system
        being audited.
    audit-event-multiplexor-configured-offload-audit-logs-onto-different-system-object-3:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/audisp-remote.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*remote_server\s*=\s*(\S+)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: Audit event multiplexor must be configured to offload audit logs onto a different system. Verify offload
        server is on diffierent network from the system being audited.
    audit-event-multiplexor-configured-offload-audit-logs-onto-different-system-object-4:
      capability: unix.interface
      select:
        name:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
      filters:
      - action: include
        state: state-audit-event-multiplexor-must-be-configured-to-offload-au-6
      object_title: Audit event multiplexor must be configured to offload audit logs onto a different system. Verify offload
        server is on diffierent network from the system being audited.
    audit-event-multiplexor-configured-offload-audit-logs-onto-different-system-object-5:
      capability: unix.interface
      select:
        name:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
      filters:
      - action: include
        state: state-audit-event-multiplexor-must-be-configured-to-offload-au-7
      object_title: Audit event multiplexor must be configured to offload audit logs onto a different system. Verify offload
        server is on diffierent network from the system being audited.
  variables:
    audit-event-multiplexor-configured-offload-audit-logs-onto-different-system-variable:
      title: Audit event multiplexor must be configured to offload audit logs onto a different system. Verify offload ip address
        is not a local interface ip address.
      kind: local
      datatype: string
      expression:
        values:
          object: audit-event-multiplexor-configured-offload-audit-logs-onto-different-system-object-4
          field: inet_addr
    audit-event-multiplexor-configured-offload-audit-logs-onto-different-system-variable-2:
      title: Audit event multiplexor must be configured to offload audit logs onto a different system. Verify offload ip address
        is not a local interface ip address.
      kind: local
      datatype: string
      expression:
        values:
          object: audit-event-multiplexor-configured-offload-audit-logs-onto-different-system-object-5
          field: inet_addr
  states:
    state-audit-event-multiplexor-must-be-configured-to-offload-au:
      state_title: Audit event multiplexor must be configured to offload audit logs onto a different system from the system
        being audited. Check if the 'audispd-plugins' package is installed
      capability: independent.shellcommand
      state:
        field: subexpression
        value: audispd\-plugins
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-audit-event-multiplexor-must-be-configured-to-offload-au-2:
      state_title: Audit event multiplexor must be configured to offload audit logs onto a different system from the system
        being audited.
      capability: independent.textfilecontent54
      state:
        field: text
        value: ^[ \t]*active\s*=\s*yes\b
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-audit-event-multiplexor-must-be-configured-to-offload-au-3:
      state_title: Audit event multiplexor must be configured to offload audit logs onto a different system. Verify offload
        ip address is configured and a valid ip address.
      capability: independent.textfilecontent54
      state:
        all:
        - field: instance
          value: '1'
          operation: greater than or equal
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: subexpression
          value: ^((((([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])))|((?:(?!0{1,4}:)(?:(?:[0-9a-fA-F]){1,4}):)(?:(?:(?:(?:[0-9a-fA-F]){1,4}):)|:){4}(?:[0-9a-fA-F]){1,4}))$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    state-audit-event-multiplexor-must-be-configured-to-offload-au-4:
      state_title: Audit event multiplexor must be configured to offload audit logs onto a different system. Verify offload
        ip address configured is not a local interface ip address.
      capability: independent.textfilecontent54
      state:
        all:
        - field: instance
          value: '1'
          operation: greater than or equal
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: subexpression
          value:
            variable: audit-event-multiplexor-configured-offload-audit-logs-onto-different-system-variable
          operation: pattern match
          datatype: string
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
    state-audit-event-multiplexor-must-be-configured-to-offload-au-5:
      state_title: Audit event multiplexor must be configured to offload audit logs onto a different system. Verify offload
        ip address configured is not a local interface ip address.
      capability: independent.textfilecontent54
      state:
        all:
        - field: instance
          value: '1'
          operation: greater than or equal
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: subexpression
          value:
            variable: audit-event-multiplexor-configured-offload-audit-logs-onto-different-system-variable-2
          operation: pattern match
          datatype: string
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
    state-audit-event-multiplexor-must-be-configured-to-offload-au-6:
      state_title: Audit event multiplexor must be configured to offload audit logs onto a different system from the system
        being audited.Check off site server is not on local ip address (not loopback.)
      capability: unix.interface
      state:
        field: type
        value: ARPHRD_LOOPBACK
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-audit-event-multiplexor-must-be-configured-to-offload-au-7:
      state_title: Audit event multiplexor must be configured to offload audit logs onto a different system from the system
        being audited.Check off site server is not on local ip address.
      capability: unix.interface
      state:
        field: type
        value: ARPHRD_ETHER
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-event-multiplexor-configured-offload-audit-logs-onto-different-system:
      test_title: Audit event multiplexor must be configured to offload audit logs onto a different system from the system
        being audited. Check if the 'audispd-plugins' package is installed
      capability: independent.shellcommand
      object: audit-event-multiplexor-configured-offload-audit-logs-onto-different-system-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-audit-event-multiplexor-must-be-configured-to-offload-au
    test-audit-event-multiplexor-configured-offload-audit-logs-onto-different-system-2:
      test_title: Audit event multiplexor must be configured to offload audit logs onto a different system from the system
        being audited. Check that config file contains 'active = yes'.
      capability: independent.textfilecontent54
      object: audit-event-multiplexor-configured-offload-audit-logs-onto-different-system-object-2
      check_existence: at_least_one_exists
      check: all
      states:
      - state-audit-event-multiplexor-must-be-configured-to-offload-au-2
    test-audit-event-multiplexor-configured-offload-audit-logs-onto-different-system-3:
      test_title: Audit event multiplexor must be configured to offload audit logs onto a different system from the system
        being audited. Check offload host is configured and contains a valid ip addrees.
      capability: independent.textfilecontent54
      object: audit-event-multiplexor-configured-offload-audit-logs-onto-different-system-object-3
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-audit-event-multiplexor-must-be-configured-to-offload-au-3
    test-audit-event-multiplexor-configured-offload-audit-logs-onto-different-system-4:
      test_title: 'Audit event multiplexor must be configured to offload audit logs onto a different system from the system
        being audited. Check offload host is configured and does not contain a local (on the system being tested) IP address.
        Note: this test checks for a match. The crtieria is negated!'
      capability: independent.textfilecontent54
      object: audit-event-multiplexor-configured-offload-audit-logs-onto-different-system-object-3
      check_existence: at_least_one_exists
      check: at least one
      state_operator: OR
      states:
      - state-audit-event-multiplexor-must-be-configured-to-offload-au-4
      - state-audit-event-multiplexor-must-be-configured-to-offload-au-5
  evaluate:
    all:
    - test: test-audit-event-multiplexor-configured-offload-audit-logs-onto-different-system
    - test: test-audit-event-multiplexor-configured-offload-audit-logs-onto-different-system-2
    - test: test-audit-event-multiplexor-configured-offload-audit-logs-onto-different-system-3
    - not:
        test: test-audit-event-multiplexor-configured-offload-audit-logs-onto-different-system-4
