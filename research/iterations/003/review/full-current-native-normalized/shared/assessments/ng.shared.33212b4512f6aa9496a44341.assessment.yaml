assessment:
  id: ng.shared.33212b4512f6aa9496a44341
  version: 1
  assessment_title: The Oracle Linux operating system must generate audit records for all account creations, modifications,
    disabling, and termination events that affect /etc/security/opasswd.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system must generate audit records for all account creations, modifications, disabling,
    and termination events that affect /etc/security/opasswd. Check the auditing rules in "/etc/audit/audit.rules" with the
    following command: # grep /etc/security/opasswd /etc/audit/audit.rules -w /etc/security/opasswd -p wa -k identity If the
    command does not return a line, or the line is commented out, this is a finding.'
  inputs: []
  evidence: []
