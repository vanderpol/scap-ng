assessment:
  id: ng.shared.7086c4f8c079ee30eb1fb651
  version: 1
  assessment_title: Enumerate Administrator Accounts on Elevation
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\CredUI
        name:
          operation: equals
          datatype: string
          mask: false
          value: EnumerateAdministrators
  variables:
    enumerate-administrator-accounts-on-elevation-variable:
      title: Enumerate administrator accounts on elevation
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: enumerate_administrator_accounts_on_elevation_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-enumerate-administrator-accounts-on-elevation-set-disabled:
      test_title: '''Enumerate administrator accounts on elevation'' is set to ''Disabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: enumerate-administrator-accounts-on-elevation-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-enumerate-administrator-accounts-on-elevation-set-disabled
