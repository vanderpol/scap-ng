assessment:
  id: ng.shared.aa4b17fb6740caa089b34d41
  version: 1
  assessment_title: The password for the krbtgt account on a domain must be reset at least every 180 days.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: This requirement is applicable to domain controllers; it is NA for other systems. Open "Windows PowerShell".
    Enter "Get-ADUser krbtgt -Property PasswordLastSet". If the "PasswordLastSet" date is more than 180 days old, this is
    a finding.
  inputs: []
  evidence: []
