  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-rpminfo-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          value: nfs-utils
      object_title: null
  states: {}
  tests:
    test-nfs-utils-package-installed:
      test_title: nfs-utils package is installed
      capability: linux.rpminfo
      object: linux-rpminfo-object
