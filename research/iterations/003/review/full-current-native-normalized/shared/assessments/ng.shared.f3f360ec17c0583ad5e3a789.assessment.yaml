assessment:
  id: ng.shared.f3f360ec17c0583ad5e3a789
  version: 1
  assessment_title: Non-ASCII characters in URLs must be prohibited by any IIS 10.0 website.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    web-site-not-allow-non-ascii-characters-in-urls-collection:
      collection_title: The web-site must not allow non-ASCII characters in URLs.
      capability: windows.appcmdlistconfig
      select:
        identifier_type:
          operation: equals
          datatype: string
          mask: false
          value: Site
        identifier:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        section:
          operation: equals
          datatype: string
          mask: false
          value: requestfiltering
        parameter:
          operation: equals
          datatype: string
          mask: false
          value: allowhighbitcharacters
  tests:
    test-web-site-not-allow-non-ascii-characters-in-urls:
      test_title: The web-site must not allow non-ASCII characters in URLs.
      capability: windows.appcmdlistconfig
      collection: web-site-not-allow-non-ascii-characters-in-urls-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: appcmdlistconfig result must equal False.
        state_capability: windows.appcmdlistconfig
        state:
          field: result
          value: 'false'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-web-site-not-allow-non-ascii-characters-in-urls
