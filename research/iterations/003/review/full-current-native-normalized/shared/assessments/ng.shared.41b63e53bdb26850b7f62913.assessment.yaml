assessment:
  id: ng.shared.41b63e53bdb26850b7f62913
  version: 1
  assessment_title: The operator must document all file system objects that have non-standard access control list settings.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The root role is required. Identify all file system objects that have non-standard access control lists enabled.
    # find / \( -fstype nfs -o -fstype cachefs -o -fstype autofs \ -o -fstype ctfs -o -fstype mntfs -o -fstype objfs \ -o
    -fstype proc \) -prune -o -acl -ls This command should return no output. If output is created, this is a finding. If the
    files are approved to have ACLs by organizational security policy, document the files and the reason that ACLs are required.'
  inputs: []
  evidence: []
