assessment:
  id: ng.shared.9133d0184235e98806c04f67
  version: 1
  assessment_title: The macOS system must apply gatekeeper settings to block applications from unidentified developers.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    system-settings-gatekeeper-identified-developers-allowed-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: zsh
        command:
          operation: equals
          datatype: string
          value: "/usr/bin/osascript -l JavaScript << EOS\nfunction run() {\n  let pref1 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.systempolicy.control')\\\
            \n.objectForKey('AllowIdentifiedDevelopers'))\n  let pref2 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.systempolicy.control')\\\
            \n.objectForKey('EnableAssessment'))\n  if ( pref1 == true && pref2 == true ) {\n    return(\"true\")\n  } else\
            \ {\n    return(\"false\")\n  }\n}\nEOS"
      object_title: system_settings_gatekeeper_identified_developers_allowed_recommended_object
  states:
    state-system-settings-gatekeeper-identified-developers-allowed:
      state_title: system_settings_gatekeeper_identified_developers_allowed_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: 'true'
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-settings-gatekeeper-identified-developers-allowed-recommended-test:
      test_title: system_settings_gatekeeper_identified_developers_allowed_recommended_test
      capability: independent.shellcommand
      object: system-settings-gatekeeper-identified-developers-allowed-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-system-settings-gatekeeper-identified-developers-allowed
  evaluate:
    test: test-system-settings-gatekeeper-identified-developers-allowed-recommended-test
