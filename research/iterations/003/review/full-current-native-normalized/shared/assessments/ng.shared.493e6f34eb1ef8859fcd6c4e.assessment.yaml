assessment:
  id: ng.shared.493e6f34eb1ef8859fcd6c4e
  version: 1
  assessment_title: UBTU-18-010022 - The Ubuntu operating system must be configured to preserve log records from failure events.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-dpkginfo-collection:
      collection_title: null
      capability: linux.dpkginfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: rsyslog
    unix-process58-collection:
      collection_title: null
      capability: unix.process58
      select:
        command_line:
          operation: pattern match
          datatype: string
          mask: false
          value: ^/usr/sbin/rsyslogd\b
        pid:
          operation: greater than
          datatype: int
          mask: false
          value: '1'
  tests:
    test-rsyslog-package-installed:
      test_title: The rsyslog package is installed.
      capability: linux.dpkginfo
      collection: linux-dpkginfo-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
    test-rsyslogd-process-running:
      test_title: The rsyslogd process is running.
      capability: unix.process58
      collection: unix-process58-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    all:
    - test: test-rsyslog-package-installed
    - test: test-rsyslogd-process-running
