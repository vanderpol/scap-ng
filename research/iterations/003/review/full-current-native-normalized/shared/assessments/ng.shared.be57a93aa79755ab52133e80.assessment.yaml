assessment:
  id: ng.shared.be57a93aa79755ab52133e80
  version: 1
  assessment_title: The macOS system must disable Find My service.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    system-settings-find-my-disable-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: zsh
        command:
          operation: equals
          datatype: string
          value: "/usr/bin/osascript -l JavaScript << EOS\nfunction run() {\n  let pref1 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.applicationaccess')\\\
            \n.objectForKey('allowFindMyDevice'))\n  let pref2 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.applicationaccess')\\\
            \n.objectForKey('allowFindMyFriends'))\n  let pref3 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.icloud.managed')\\\
            \n.objectForKey('DisableFMMiCloudSetting'))\n  if ( pref1 == false && pref2 == false && pref3 == true ) {\n  \
            \  return(\"true\")\n  } else {\n    return(\"false\")\n  }\n}\nEOS"
      object_title: system_settings_find_my_disable_recommended_object
  states:
    state-system-settings-find-my-disable-recommended-state:
      state_title: system_settings_find_my_disable_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: 'true'
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-settings-find-my-disable-recommended-test:
      test_title: system_settings_find_my_disable_recommended_test
      capability: independent.shellcommand
      object: system-settings-find-my-disable-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-system-settings-find-my-disable-recommended-state
  evaluate:
    test: test-system-settings-find-my-disable-recommended-test
