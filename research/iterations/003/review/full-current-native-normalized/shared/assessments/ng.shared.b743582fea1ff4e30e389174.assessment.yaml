assessment:
  id: ng.shared.b743582fea1ff4e30e389174
  version: 1
  assessment_title: The system must not allow autologin capabilities from the GNOME desktop.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    etc-pam-d-gdm-autologin-uncommented-lines-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/pam.d/gdm-autologin
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[^#].*
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: /etc/pam.d/gdm-autologin uncommented lines
  states:
    state-etc-pam-d-gdm-autologin-auth-or-account-entries:
      state_title: /etc/pam.d/gdm-autologin auth or account entries
      capability: independent.textfilecontent54
      state:
        field: text
        value: .*(auth|account).*
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-etc-pam-d-gdm-autologin-contains-no-auth-or-account:
      test_title: /etc/pam.d/gdm-autologin contains no auth or account entries
      capability: independent.textfilecontent54
      object: etc-pam-d-gdm-autologin-uncommented-lines-object
      check_existence: any_exist
      check: none satisfy
      states:
      - state-etc-pam-d-gdm-autologin-auth-or-account-entries
  evaluate:
    test: test-etc-pam-d-gdm-autologin-contains-no-auth-or-account
