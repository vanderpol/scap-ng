assessment:
  id: ng.shared.d7f3e7b414d509ecd8546e7e
  version: 1
  assessment_title: WN19-00-000330 - Windows Server 2019 must not have the Microsoft FTP service installed unless required
    by the organization.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    ftp-server-object:
      capability: windows.wmi57
      select:
        namespace:
          operation: equals
          datatype: string
          value: root\cimv2
        wql:
          operation: equals
          datatype: string
          value: SELECT startmode FROM Win32_Service WHERE name='ftpsvc'
      object_title: FTP Server
  states: {}
  tests:
    test-check-make-sure-ftp-server-role-not-present:
      test_title: Check to make sure the FTP server role is not present.
      capability: windows.wmi57
      object: ftp-server-object
      check_existence: none_exist
      check: at least one
  evaluate:
    test: test-check-make-sure-ftp-server-role-not-present
