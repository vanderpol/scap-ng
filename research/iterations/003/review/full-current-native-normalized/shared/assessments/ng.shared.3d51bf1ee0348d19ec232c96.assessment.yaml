assessment:
  id: ng.shared.3d51bf1ee0348d19ec232c96
  version: 1
  assessment_title: Verify File Hashes with RPM
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    rpm-verify-all-executables-library-files-object:
      capability: linux.rpmverifyfile
      select:
        name:
          operation: pattern match
          datatype: string
          value: .*
        epoch:
          operation: pattern match
          datatype: string
          value: .*
        version:
          operation: pattern match
          datatype: string
          value: .*
        release:
          operation: pattern match
          datatype: string
          value: .*
        arch:
          operation: pattern match
          datatype: string
          value: .*
        filepath:
          operation: pattern match
          datatype: string
          value: ^(|/usr|/usr/local)/(bin|sbin|lib|lib64|libexec)/.+$
      filters:
      - action: include
        state: state-linux-rpmverifyfile
      - action: exclude
        state: state-linux-rpmverifyfile-2
      - action: exclude
        state: state-linux-rpmverifyfile-3
      behaviors:
        nomd5: 'false'
        noconfigfiles: 'true'
        noghostfiles: 'true'
      object_title: rpm verify of all executables and library files
  states:
    state-linux-rpmverifyfile:
      state_title: null
      capability: linux.rpmverifyfile
      state:
        field: md5_differs
        value: fail
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-linux-rpmverifyfile-2:
      state_title: null
      capability: linux.rpmverifyfile
      state:
        field: ghost_file
        value: 'true'
        operation: equals
        datatype: boolean
        entity_check: all
        entity_existence: at_least_one_exists
    state-linux-rpmverifyfile-3:
      state_title: null
      capability: linux.rpmverifyfile
      state:
        field: configuration_file
        value: 'true'
        operation: equals
        datatype: boolean
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-verify-file-md5-hashes:
      test_title: verify file md5 hashes
      capability: linux.rpmverifyfile
      object: rpm-verify-all-executables-library-files-object
      check_existence: none_exist
      check: all
  evaluate:
    test: test-verify-file-md5-hashes
