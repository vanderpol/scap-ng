  version: 1
  assessment_title: The macOS system must configure user session lock when a smart token is removed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to lock the user session when a smart token is removed with the following
    command: /usr/bin/osascript -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.security.smartcard'')\
    .objectForKey(''tokenRemovalAction'').js EOS If the result is not "1", this is a finding.'
  inputs: {}
  evidence: []
