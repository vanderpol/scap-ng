assessment:
  id: ng.shared.e6afbe11799ac61a582ad3fa
  version: 1
  assessment_title: The macOS system must authorize USB devices before allowing connection.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to authorize USB devices before allowing connection with the following
    command: /usr/bin/osascript -l JavaScript << EOS function run() { let pref1 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\
    .objectForKey(''allowUSBRestrictedMode'')) if ( pref1 == false ) { return("false") } else { return("true") } } EOS If
    the result is not "true", this is a finding.'
  inputs: {}
  evidence: []
