assessment:
  id: ng.shared.f4930ecf3e947b7ee826bc36
  version: 1
  assessment_title: The macOS system must be configured to prevent displaying password hints.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    system-settings-password-hints-disable-recommended-object-collection:
      collection_title: system_settings_password_hints_disable_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.loginwindow'')\

            .objectForKey(''RetriesUntilHint'').js

            EOS'
  tests:
    test-system-settings-password-hints-disable-recommended-test:
      test_title: system_settings_password_hints_disable_recommended_test
      capability: independent.shellcommand
      collection: system-settings-password-hints-disable-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: system_settings_password_hints_disable_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: '0'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-system-settings-password-hints-disable-recommended-test
