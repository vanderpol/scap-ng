assessment:
  id: ng.shared.75fcf7268ee6caf957fbfe4c
  version: 1
  assessment_title: The SUSE operating system library directories must be group-owned by root.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the system-wide library directories "/lib", "/lib64", "/usr/lib" and "/usr/lib64" are group-owned by
    root. Check that the system-wide library directories are group-owned by root with the following command: > sudo find /lib
    /lib64 /usr/lib /usr/lib64 ! -group root -type d -exec stat -c "%n %G" ''{}'' \; If any system wide shared library directory
    is returned, this is a finding.'
  inputs: []
  evidence: []
