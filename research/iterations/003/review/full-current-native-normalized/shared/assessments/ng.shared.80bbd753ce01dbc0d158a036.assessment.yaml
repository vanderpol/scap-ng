assessment:
  id: ng.shared.80bbd753ce01dbc0d158a036
  version: 1
  assessment_title: WINCC-000048
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\Control Panel\International
        name:
          operation: equals
          datatype: string
          mask: false
          value: BlockUserInputMethodsForSignIn
  tests:
    test-disallow-copying-user-input-methods-system-account-sign-in-set:
      test_title: '''Disallow copying of user input methods to the system account for sign-in'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals 1
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-disallow-copying-user-input-methods-system-account-sign-in-set
