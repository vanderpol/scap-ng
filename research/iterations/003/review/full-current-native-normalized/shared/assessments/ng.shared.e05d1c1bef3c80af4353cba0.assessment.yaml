  assessment_title: The Oracle Linux operating system must enable SELinux.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system verifies correct operation of all security functions. Check if "SELinux" is active
    and in "Enforcing" mode with the following command: # getenforce Enforcing If "SELinux" is not active and not in "Enforcing"
    mode, this is a finding.'
