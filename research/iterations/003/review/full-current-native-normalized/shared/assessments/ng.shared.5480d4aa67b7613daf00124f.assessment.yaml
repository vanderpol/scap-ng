assessment:
  id: ng.shared.5480d4aa67b7613daf00124f
  version: 1
  assessment_title: WINCC-000027
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Policies\EarlyLaunch
        name:
          operation: equals
          datatype: string
          mask: false
          value: DriverLoadPolicy
  tests:
    test-boot-start-driver-initialization-policy-set-enabled-good-unknown-selected:
      test_title: '''Boot-Start Driver Initialization Policy'' is set to ''Enabled'' with ''Good and Unknown'' selected'
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals 1
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-boot-start-driver-initialization-policy-set-enabled-good-unknown-selected
