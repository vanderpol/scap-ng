assessment:
  id: ng.shared.5430e597a8f970aa019c0c33
  version: 1
  assessment_title: WN10-SO-000045 - Outgoing secure channel traffic must be signed when possible.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: case insensitive equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: case insensitive equals
          datatype: string
          value: SYSTEM\CurrentControlSet\Services\Netlogon\Parameters
        name:
          operation: case insensitive equals
          datatype: string
          value: SignSecureChannel
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-outgoing-secure-channel-traffic-signed:
      test_title: Outgoing secure channel traffic is signed.
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-outgoing-secure-channel-traffic-signed
