assessment:
  id: ng.shared.b2010e4bfb6b1c0da69843e8
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that a file integrity tool verifies the baseline
    operating system configuration at least weekly.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system routinely checks the baseline configuration for unauthorized changes. Note: A file
    integrity tool other than Advanced Intrusion Detection Environment (AIDE) may be used, but the tool must be executed at
    least once per week. Check for the presence of a cron job running daily or weekly on the system that executes AIDE daily
    to scan for changes to the system baseline. The command used in the example will use a daily occurrence. Check the cron
    directories for a script file controlling the execution of the file integrity application. For example, if AIDE is installed
    on the system, use the following command: # ls -al /etc/cron.* | grep aide -rwxr-xr-x 1 root root 602 Mar 6 20:02 aide
    # grep aide /etc/crontab /var/spool/cron/root /etc/crontab: 30 04 * * * root /usr/sbin/aide --check /var/spool/cron/root:
    30 04 * * * /usr/sbin/aide --check If the file integrity application does not exist, or a script file controlling the
    execution of the file integrity application does not exist, this is a finding.'
  inputs: {}
  evidence: []
