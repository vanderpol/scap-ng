assessment:
  id: ng.shared.3afc30ae45d1b9f4e0e35484
  version: 1
  assessment_title: The Cisco router must be configured to generate an alert for all audit failure events.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    iosxe-line-collection:
      collection_title: null
      capability: iosxe.line
      select:
        show_subcommand:
          operation: equals
          datatype: string
          mask: false
          value: show running-config
  tests:
    test-ensure-that-no-logging-trap-not-found:
      test_title: Ensure that 'no logging trap' is not found
      capability: iosxe.line
      collection: iosxe-line-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: none satisfy
        state_title: Ensure that 'no logging trap' is not found
        state_capability: iosxe.line
        state:
          all:
          - field: show_subcommand
            value: show running-config
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: config_line
            value: \nno logging trap
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-ensure-that-no-logging-trap-not-found
