assessment:
  id: ng.shared.62223523867a4e91f171dff4
  version: 1
  assessment_title: The macOS system must be configured so that any connection to the system must display the Standard Mandatory
    DOD Notice and Consent Banner before granting GUI access to the system.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-policy-banner-loginwindow-enforce-stig-object-collection:
      collection_title: os_policy_banner_loginwindow_enforce_stig_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /bin/ls -ld /Library/Security/PolicyBanner.rtf*
  tests:
    test-os-policy-banner-loginwindow-enforce-stig-test:
      test_title: os_policy_banner_loginwindow_enforce_stig_test
      capability: independent.shellcommand
      collection: os-policy-banner-loginwindow-enforce-stig-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: os_policy_banner_loginwindow_enforce_stig_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: .*
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-os-policy-banner-loginwindow-enforce-stig-test
