assessment:
  id: ng.shared.690c7a71767f5b32e3aea794
  version: 1
  assessment_title: Network interfaces configured on The Oracle Linux operating system must not be in promiscuous mode.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    all-interfaces-collection:
      collection_title: All Interfaces
      capability: unix.interface
      select:
        name:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
  tests:
    test-no-network-interfaces-in-promiscuous-mode:
      test_title: no network interfaces are in promiscuous mode
      capability: unix.interface
      collection: all-interfaces-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: Interface is not in PROMISC mode
        state_capability: unix.interface
        state:
          field: flag
          value: (^|\s)PROMISC(\s|$)
          operation: pattern match
          datatype: string
          mask: false
          entity_check: none satisfy
          entity_existence: at_least_one_exists
  evaluate:
    test: test-no-network-interfaces-in-promiscuous-mode
