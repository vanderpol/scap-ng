assessment:
  id: ng.shared.34c4956218183152f677800e
  version: 1
  assessment_title: The system must generate an audit event when the audit log reaches a percentage of full threshold.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the system is configured to write to an audit server, or is configured to automatically archive full logs,
    this is NA. If the following registry value does not exist or is not configured as specified, this is a finding: Registry
    Hive: HKEY_LOCAL_MACHINE Registry Path: \System\CurrentControlSet\Services\Eventlog\Security\ Value Name: WarningLevel
    Value Type: REG_DWORD Value: 90 (or less)'
  inputs: []
  evidence: []
