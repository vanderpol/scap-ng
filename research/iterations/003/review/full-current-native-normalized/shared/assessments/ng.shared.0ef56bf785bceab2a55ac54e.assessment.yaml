assessment:
  id: ng.shared.0ef56bf785bceab2a55ac54e
  version: 1
  assessment_title: AZLX-23-002290 - Amazon Linux 2023 library files must have mode "755" or less permissive.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-file-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: only one
          value:
            variable: system-wide-shared-library-files-directories-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: \.so\S*$
      filters:
      - action: include
        state: state-unix-file
      - action: include
        state: state-unix-file-2
      behaviors:
        recurse_direction: down
      object_title: null
    unix-file-object-2:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: only one
          value:
            variable: system-wide-shared-library-files-directories-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: \.so\S*$
      filters:
      - action: include
        state: state-unix-file
      - action: include
        state: state-unix-file-3
      behaviors:
        recurse_direction: down
      object_title: null
    unix-file-object-3:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: only one
          value:
            variable: system-wide-shared-library-files-directories-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: \.so\S*$
      filters:
      - action: include
        state: state-unix-file
      - action: include
        state: state-unix-file-4
      behaviors:
        recurse_direction: down
      object_title: null
    unix-file-object-4:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: only one
          value:
            variable: system-wide-shared-library-files-directories-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: \.so\S*$
      filters:
      - action: include
        state: state-unix-file
      - action: include
        state: state-unix-file-5
      behaviors:
        recurse_direction: down
      object_title: null
    unix-file-object-5:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: only one
          value:
            variable: system-wide-shared-library-files-directories-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: \.so\S*$
      filters:
      - action: include
        state: state-unix-file
      - action: include
        state: state-unix-file-6
      behaviors:
        recurse_direction: down
      object_title: null
  variables:
    system-wide-shared-library-files-directories-variable:
      title: system-wide shared library files directories
      kind: constant
      datatype: string
      expression:
        literal:
        - /lib
        - /lib64
        - /usr/lib
        - /usr/lib64
  states:
    state-unix-file:
      state_title: null
      capability: unix.file
      state:
        field: type
        value: regular
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-unix-file-2:
      state_title: null
      capability: unix.file
      state:
        field: suid
        value: 'true'
        operation: equals
        datatype: boolean
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-unix-file-3:
      state_title: null
      capability: unix.file
      state:
        field: sgid
        value: 'true'
        operation: equals
        datatype: boolean
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-unix-file-4:
      state_title: null
      capability: unix.file
      state:
        field: sticky
        value: 'true'
        operation: equals
        datatype: boolean
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-unix-file-5:
      state_title: null
      capability: unix.file
      state:
        field: gwrite
        value: 'true'
        operation: equals
        datatype: boolean
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-unix-file-6:
      state_title: null
      capability: unix.file
      state:
        field: owrite
        value: 'true'
        operation: equals
        datatype: boolean
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-no-operating-system-library-regular-files-have-suid-special-permission:
      test_title: no operating system library regular files have the SUID special permission set
      capability: unix.file
      object: unix-file-object
      check_existence: none_exist
      check: all
    test-no-operating-system-library-regular-files-have-sgid-special-permission:
      test_title: no operating system library regular files have the SGID special permission set
      capability: unix.file
      object: unix-file-object-2
      check_existence: none_exist
      check: all
    test-no-operating-system-library-regular-files-have-sticky-bit-set:
      test_title: no operating system library regular files have the sticky bit set
      capability: unix.file
      object: unix-file-object-3
      check_existence: none_exist
      check: all
    test-no-operating-system-library-regular-files-group-writable:
      test_title: no operating system library regular files are group-writable
      capability: unix.file
      object: unix-file-object-4
      check_existence: none_exist
      check: all
    test-no-operating-system-library-regular-files-world-writable:
      test_title: no operating system library regular files are world-writable
      capability: unix.file
      object: unix-file-object-5
      check_existence: none_exist
      check: all
  evaluate:
    all:
    - test: test-no-operating-system-library-regular-files-have-suid-special-permission
    - test: test-no-operating-system-library-regular-files-have-sgid-special-permission
    - test: test-no-operating-system-library-regular-files-have-sticky-bit-set
    - test: test-no-operating-system-library-regular-files-group-writable
    - test: test-no-operating-system-library-regular-files-world-writable
