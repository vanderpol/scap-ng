assessment:
  id: ng.shared.02963830cc2bc728a0175179
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that all wireless network adapters are disabled.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that there are no wireless interfaces configured on the system. This is N/A for systems that do not have
    wireless network adapters. Check for the presence of active wireless interfaces with the following command: # nmcli device
    DEVICE TYPE STATE eth0 ethernet connected wlp3s0 wifi disconnected lo loopback unmanaged If a wireless interface is configured
    and its use on the system is not documented with the Information System Security Officer (ISSO), this is a finding.'
  inputs: {}
  evidence: []
