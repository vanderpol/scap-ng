assessment:
  id: ng.shared.a89becd0b7c0d98bcb06363e
  version: 1
  assessment_title: WN19-00-000330 - Windows Server 2019 must not have the Microsoft FTP service installed unless required
    by the organization.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    ftp-server-object:
      capability: windows.wmi.query
      object_title: FTP Server
      collect:
        namespace: root\cimv2
        query: SELECT startmode FROM Win32_Service WHERE name='ftpsvc'
  states: {}
  tests:
    test-check-make-sure-ftp-server-role-not-present:
      test_title: Check to make sure the FTP server role is not present.
      capability: windows.wmi.query
      object: ftp-server-object
      existence: none
      match: any
  evaluate:
    test: test-check-make-sure-ftp-server-role-not-present
