assessment:
  id: ng.shared.44eb844b5d11171cce1f3bf6
  version: 1
  assessment_title: OL09-00-002072 - OL 9 must prevent code from being executed on file systems that contain user home directories.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    home-collection:
      collection_title: /home
      capability: linux.partition
      select:
        mount_point:
          operation: pattern match
          datatype: string
          mask: false
          value: .*\/home
  tests:
    test-home-has-noexec-option:
      test_title: /home has noexec option
      capability: linux.partition
      collection: home-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: linux.partition
        state:
          field: mount_options
          value: noexec
          operation: equals
          datatype: string
          mask: false
          entity_check: at least one
          entity_existence: at_least_one_exists
  evaluate:
    test: test-home-has-noexec-option
