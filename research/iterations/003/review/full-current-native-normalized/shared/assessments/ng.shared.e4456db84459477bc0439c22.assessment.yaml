assessment:
  id: ng.shared.e4456db84459477bc0439c22
  version: 1
  assessment_title: The Cisco router must be configured to protect audit information from unauthorized modification.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Review the Cisco router configuration to verify that it is compliant with this requirement. Step 1: If persistent
    logging is enabled as shown in the example below, go to step 2. Otherwise, this requirement is not applicable. logging
    persistent url disk0:/logfile size 134217728 filesize 16384 Step 2: Verify that the router is not configured with a privilege
    level other than "15" to allow access to the file system as shown in the example below. file privilege 10 Note: The default
    privilege level required for access to the file system is "15"; hence, the command file privilege "15" will not be shown
    in the configuration. If the router is configured with a privilege level other than "15" to allow access to the file system,
    this is a finding.'
  inputs: {}
  evidence: []
