assessment:
  id: ng.shared.fa574c4ff459671900ee924b
  version: 1
  assessment_title: WN11-UR-000065 - The "Debug programs" user right must only be assigned to the Administrators group.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-userright-object:
      capability: windows.userright
      select:
        userright:
          operation: equals
          datatype: string
          mask: false
          value: SE_DEBUG_NAME
      object_title: null
  states:
    state-windows-userright:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: ''
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-userright-2:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: Administrators
        operation: case insensitive equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-debug-programs-administrators:
      test_title: Debug Programs - Administrators
      capability: windows.userright
      object: windows-userright-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-windows-userright
      - state-windows-userright-2
  evaluate:
    test: test-debug-programs-administrators
