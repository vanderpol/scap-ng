assessment:
  id: ng.shared.07298c7252bc207556e7dff8
  version: 1
  assessment_title: SQL Server must configure Customer Feedback and Error Reporting.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    find-all-customerfeedback-values-under-hkey-local-machine-software-microsoft-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Microsoft\Microsoft SQL Server
        name:
          operation: equals
          datatype: string
          mask: false
          value: CustomerFeedback
      behaviors:
        max_depth: '-1'
        recurse_direction: down
      object_title: Find all of the CustomerFeedback values under HKEY_LOCAL_MACHINE\Software\Microsoft\Microsoft SQL Server'.
    find-all-enableerrorreporting-values-under-hkey-local-machine-software-microsoft-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Microsoft\Microsoft SQL Server
        name:
          operation: equals
          datatype: string
          mask: false
          value: EnableErrorReporting
      behaviors:
        max_depth: '-1'
        recurse_direction: down
      object_title: Find all of the EnableErrorReporting values under HKEY_LOCAL_MACHINE\Software\Microsoft\Microsoft SQL
        Server'.
  states:
    state-registry-key-dword-value-equals-0:
      state_title: Registry key dword value equals 0
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-verify-if-customer-feedback-disabled:
      test_title: Verify if Customer Feedback is Disabled
      capability: windows.registry
      object: find-all-customerfeedback-values-under-hkey-local-machine-software-microsoft-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-registry-key-dword-value-equals-0
    test-verify-if-error-reporting-disabled:
      test_title: Verify if Error Reporting is Disabled
      capability: windows.registry
      object: find-all-enableerrorreporting-values-under-hkey-local-machine-software-microsoft-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-registry-key-dword-value-equals-0
  evaluate:
    all:
    - test: test-verify-if-customer-feedback-disabled
    - test: test-verify-if-error-reporting-disabled
