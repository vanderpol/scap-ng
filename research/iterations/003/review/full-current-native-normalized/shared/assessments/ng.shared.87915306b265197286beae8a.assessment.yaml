assessment:
  id: ng.shared.87915306b265197286beae8a
  version: 1
  assessment_title: Windows Server 2016 must have the number of allowed bad logon attempts configured to three or less.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy
    >> Computer Configuration >> Windows Settings >> Security Settings >> Account Policies >> Account Lockout Policy. If the
    "Account lockout threshold" is "0" or more than "3" attempts, this is a finding. For server core installations, run the
    following command: Secedit /Export /Areas SecurityPolicy /CFG C:\Path\FileName.Txt If "LockoutBadCount" equals "0" or
    is greater than "3" in the file, this is a finding.'
  inputs: {}
  evidence: []
