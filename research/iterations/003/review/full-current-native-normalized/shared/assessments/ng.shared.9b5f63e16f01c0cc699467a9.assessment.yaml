  assessment_title: Protection methods such as TLS, encrypted VPNs, or IPSEC must be implemented if the data owner has a strict
    requirement for ensuring data integrity and confidentiality is maintained at every step of the data transfer and handling
    process.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: If the data owner has a strict requirement for ensuring data integrity and confidentiality is maintained at every
    step of the data transfer and handling process, verify protection methods such as TLS, encrypted VPNs, or IPSEC have been
    implemented. If protection methods have not been implemented, this is a finding.
