assessment:
  id: ng.shared.06c34ac51f17db8f10412167
  version: 1
  assessment_title: Windows Server 2016 built-in guest account must be disabled.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy
    >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> Security Options. If the value
    for "Accounts: Guest account status" is not set to "Disabled", this is a finding. For server core installations, run the
    following command: Secedit /Export /Areas SecurityPolicy /CFG C:\Path\FileName.Txt If "EnableGuestAccount" equals "1"
    in the file, this is a finding.'
  inputs: {}
  evidence: []
