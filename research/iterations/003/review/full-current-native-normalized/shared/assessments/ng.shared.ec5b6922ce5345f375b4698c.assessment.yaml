assessment:
  id: ng.shared.ec5b6922ce5345f375b4698c
  version: 1
  assessment_title: UBTU-18-010032 - The Ubuntu operating system must display the date and time of the last successful account
    logon upon logon.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/pam.d/login
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*session\s+required\s+pam_lastlog\.so\s+(?:\w+\s+)*showfailed\b\s*(?:\w+\b\s*)*\s*(?:#.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-textfilecontent54-collection-2:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/pam.d/login
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*session\s+required\s+pam_lastlog\.so\s+(?:\w+\s+)*silent\b\s*(?:\w+\b\s*)*\s*(?:#.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-pam-lastlog-used-showfailed-option:
      test_title: pam_lastlog is used with showfailed option
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
    test-pam-lastlog-used-silent-option:
      test_title: pam_lastlog is used with the silent option
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection-2
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    all:
    - test: test-pam-lastlog-used-showfailed-option
    - not:
        test: test-pam-lastlog-used-silent-option
