assessment:
  id: ng.shared.35835adc3e1189b0fd93b8f5
  version: 1
  assessment_title: The Ubuntu operating system must implement non-executable data to protect its memory from unauthorized
    code execution.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    ubuntu-implement-nonexecutable-data-protect-its-memory-from-unauthorized-code-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: dmesg | grep -i "execute disable"
        pattern:
          operation: pattern match
          datatype: string
          value: NX
      object_title: Ubuntu must implement nonexecutable data to protect its memory from unauthorized code execution.
    ubuntu-implement-nonexecutable-data-protect-its-memory-from-unauthorized-code-object-2:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: grep flags /proc/cpuinfo | grep -o nx | sort -u
        pattern:
          operation: pattern match
          datatype: string
          value: nx
      object_title: Ubuntu must implement nonexecutable data to protect its memory from unauthorized code execution.
  states:
    state-ubuntu-must-implement-nonexecutable-data-to-protect-its-:
      state_title: Ubuntu must implement nonexecutable data to protect its memory from unauthorized code execution.
      capability: independent.shellcommand
      state:
        all:
        - field: command
          value: dmesg | grep -i "execute disable"
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: NX\s+\(Execute Disable\)\s+protection:\s+active
          operation: pattern match
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
    state-ubuntu-must-implement-nonexecutable-data-to-protect-its--2:
      state_title: Ubuntu must implement nonexecutable data to protect its memory from unauthorized code execution.
      capability: independent.shellcommand
      state:
        all:
        - field: command
          value: grep flags /proc/cpuinfo | grep -o nx | sort -u
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: nx
          operation: pattern match
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-ubuntu-implement-nonexecutable-data-protect-its-memory-from-unauthorized-code:
      test_title: Ubuntu must implement nonexecutable data to protect its memory from unauthorized code execution. Check NX
        (noexec) configured.
      capability: independent.shellcommand
      object: ubuntu-implement-nonexecutable-data-protect-its-memory-from-unauthorized-code-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-ubuntu-must-implement-nonexecutable-data-to-protect-its-
    test-ubuntu-implement-nonexecutable-data-protect-its-memory-from-unauthorized-code-2:
      test_title: Ubuntu must implement nonexecutable data to protect its memory from unauthorized code execution. Check CPU
        supports NX
      capability: independent.shellcommand
      object: ubuntu-implement-nonexecutable-data-protect-its-memory-from-unauthorized-code-object-2
      check_existence: at_least_one_exists
      check: all
      states:
      - state-ubuntu-must-implement-nonexecutable-data-to-protect-its--2
  evaluate:
    all:
    - test: test-ubuntu-implement-nonexecutable-data-protect-its-memory-from-unauthorized-code
    - test: test-ubuntu-implement-nonexecutable-data-protect-its-memory-from-unauthorized-code-2
