assessment:
  id: ng.shared.f03170a82baed16b9c27a456
  version: 1
  assessment_title: The Oracle Linux operating system must implement cryptography to protect the integrity of Lightweight
    Directory Access Protocol (LDAP) communications.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If LDAP is not being utilized, this requirement is Not Applicable. Verify the operating system implements cryptography
    to protect the integrity of remote LDAP access sessions. To determine if LDAP is being used for authentication, use the
    following command: # systemctl status sssd.service sssd.service - System Security Services Daemon Loaded: loaded (/usr/lib/systemd/system/sssd.service;
    enabled; vendor preset: disabled) Active: active (running) since Wed 2018-06-27 10:58:11 EST; 1h 50min ago If the "sssd.service"
    is "active", then LDAP is being used. Determine the "id_provider" the LDAP is currently using: # grep -ir id_provider
    /etc/sssd/sssd.conf /etc/sssd/conf.d/*.conf id_provider = ad If "id_provider" is set to "ad", this is Not Applicable.
    Verify the sssd service is configured to require the use of certificates: # grep -ir tls_reqcert /etc/sssd/sssd.conf /etc/sssd/conf.d/*.conf
    ldap_tls_reqcert = demand If the "ldap_tls_reqcert" setting is missing, commented out, or does not exist, this is a finding.
    If the "ldap_tls_reqcert" setting is not set to "demand" or "hard", this is a finding.'
  inputs: {}
  evidence: []
