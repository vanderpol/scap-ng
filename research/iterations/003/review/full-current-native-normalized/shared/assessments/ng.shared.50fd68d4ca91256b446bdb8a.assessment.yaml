assessment:
  id: ng.shared.50fd68d4ca91256b446bdb8a
  version: 1
  assessment_title: All local interactive user home directories must have mode 0750 or less permissive.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the assigned home directory of all local interactive users has a mode of "0750" or less permissive with
    the following command: Note: This may miss interactive users that have been assigned a privileged User Identifier (UID).
    Evidence of interactive use may be obtained from a number of log files containing system logon information. $ sudo ls
    -ld $(awk -F: ''($3>=1000)&&($7 !~ /nologin/){print $6}'' /etc/passwd) drwxr-x--- 2 smithj admin 4096 Jun 5 12:41 smithj
    If home directories referenced in "/etc/passwd" do not have a mode of "0750" or less permissive, this is a finding.'
  inputs: []
  evidence: []
