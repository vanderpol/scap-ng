assessment:
  id: ng.shared.3cee076c0cd822065368154a
  version: 1
  assessment_title: The macOS system must be configured to disable iCloud Address Book services.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    icloud-addressbook-disable-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: zsh
        command:
          operation: equals
          datatype: string
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\

            .objectForKey(''allowCloudAddressBook'').js

            EOS'
      object_title: icloud_addressbook_disable_recommended_object
  states:
    state-icloud-addressbook-disable-recommended-state:
      state_title: icloud_addressbook_disable_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: 'false'
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-icloud-addressbook-disable-recommended-test:
      test_title: icloud_addressbook_disable_recommended_test
      capability: independent.shellcommand
      object: icloud-addressbook-disable-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-icloud-addressbook-disable-recommended-state
  evaluate:
    test: test-icloud-addressbook-disable-recommended-test
