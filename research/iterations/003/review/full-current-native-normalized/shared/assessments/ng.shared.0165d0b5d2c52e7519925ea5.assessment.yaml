assessment:
  id: ng.shared.0165d0b5d2c52e7519925ea5
  version: 1
  assessment_title: Ubuntu 22.04 LTS must have system commands owned by "root" or a system account.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    all-system-command-files-not-owned-by-root-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: only one
          value:
            variable: system-command-directories-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
      filters:
      - action: exclude
        state: state-owned-by-root
      - action: exclude
        state: state-symbolic-links
      - action: exclude
        state: state-unix-file
      behaviors:
        recurse_direction: down
      object_title: All system-command files not owned by root
  variables:
    system-command-directories-variable:
      title: system command directories
      kind: constant
      datatype: string
      expression:
        literal:
        - /bin
        - /sbin
        - /usr/bin
        - /usr/sbin
        - /usr/local/bin
        - /usr/local/sbin
  states:
    state-owned-by-root:
      state_title: owned by root
      capability: unix.file
      state:
        field: user_id
        value: '0'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-symbolic-links:
      state_title: symbolic links
      capability: unix.file
      state:
        field: type
        value: symbolic link
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-unix-file:
      state_title: null
      capability: unix.file
      state:
        field: type
        value: directory
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-files-in-system-command-directories-owned-by-root:
      test_title: Files in System command directories are owned by root
      capability: unix.file
      object: all-system-command-files-not-owned-by-root-object
      check_existence: none_exist
      check: all
  evaluate:
    test: test-files-in-system-command-directories-owned-by-root
