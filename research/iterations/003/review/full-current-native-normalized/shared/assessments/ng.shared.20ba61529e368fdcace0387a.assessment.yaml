assessment:
  id: ng.shared.20ba61529e368fdcace0387a
  version: 1
  assessment_title: The macOS system must apply gatekeeper settings to block applications from unidentified developers.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to apply gatekeeper settings to block applications from unidentified developers
    with the following commands: /usr/bin/osascript -l JavaScript << EOS function run() { let pref1 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName(''com.apple.systempolicy.control'')\
    .objectForKey(''AllowIdentifiedDevelopers'')) let pref2 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName(''com.apple.systempolicy.control'')\
    .objectForKey(''EnableAssessment'')) if ( pref1 == true && pref2 == true ) { return("true") } else { return("false") }
    } EOS If the result is not "true", this is a finding.'
  inputs: {}
  evidence: []
