assessment:
  id: ng.shared.6aa6458385f44d78aa17ef0e
  version: 1
  assessment_title: WN19-DC-000240 - Windows Server 2019 must be configured to audit DS Access - Directory Service Access
    successes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-audit-directory-service-access-success-only:
      state_title: Audit - Directory Service Access - Success only
      capability: windows.auditeventpolicysubcategories
      state:
        field: directory_service_access
        value: AUDIT_SUCCESS
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-audit-directory-service-access-success-and-failure:
      state_title: Audit - Directory Service Access - Success and Failure
      capability: windows.auditeventpolicysubcategories
      state:
        field: directory_service_access
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-directory-service-access-success:
      test_title: Audit - Directory Service Access - Success
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-audit-directory-service-access-success-only
      - state-audit-directory-service-access-success-and-failure
  evaluate:
    test: test-audit-directory-service-access-success
