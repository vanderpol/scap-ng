assessment:
  id: ng.shared.bfd05aa65693699e3659fecc
  version: 1
  assessment_title: Access to linked servers must be disabled or restricted, unless specifically required and approved.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'A linked server allows for access to distributed, heterogeneous queries against OLE DB data sources. After a
    linked server is created, distributed queries can be run against this server, and queries can join tables from more than
    one data source. If the linked server is defined as an instance of SQL Server, remote stored procedures can be executed.
    To obtain a list of linked servers, execute the following command: SELECT name FROM sys.servers s WHERE s.is_linked =
    1 Review the system documentation to determine whether the linked servers listed are required and approved. If it is not
    approved, this is a finding. Run the following to get a linked server login mapping: SELECT s.name, p.principal_id, l.remote_name
    FROM sys.servers s JOIN sys.linked_logins l ON s.server_id = l.server_id LEFT JOIN sys.server_principals p ON l.local_principal_id
    = p.principal_id WHERE s.is_linked = 1 Review the linked login mapping and check the remote name as it can impersonate
    sysadmin. If a login in the list is impersonating sysadmin and system documentation does not require this, it is a finding.'
  inputs: []
  evidence: []
