assessment:
  id: ng.shared.61523f95f3fd8d663fdffc6e
  version: 1
  assessment_title: The system must disable ICMP redirect messages.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Determine the version of Solaris 11 in use. # cat /etc/release If the version of Solaris is earlier than Solaris
    11.2, determine if ICMP redirect messages are disabled. # ipadm show-prop -p _send_redirects -co current ipv4 # ipadm
    show-prop -p _send_redirects -co current ipv6 If the output of all commands is not "0", this is a finding. If the version
    of Solaris is Solaris 11.2 or later, determine if ICMP redirect messages are disabled. # ipadm show-prop -p send_redirects
    -co current ipv4 # ipadm show-prop -p send_redirects -co current ipv6 If the output of all commands is not "off", this
    is a finding.'
  inputs: {}
  evidence: []
