assessment:
  id: ng.shared.7e45afea963f18fbfe4868df
  version: 1
  assessment_title: The OL 8 audit system must protect logon UIDs from unauthorized change.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the audit system prevents unauthorized changes to logon UIDs with the following command: $ sudo grep
    -i immutable /etc/audit/audit.rules --loginuid-immutable If the login UIDs are not set to be immutable by adding the "--loginuid-immutable"
    option to the "/etc/audit/audit.rules", this is a finding.'
  inputs: {}
  evidence: []
