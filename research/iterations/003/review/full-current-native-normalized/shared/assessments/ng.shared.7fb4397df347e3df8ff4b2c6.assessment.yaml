assessment:
  id: ng.shared.7fb4397df347e3df8ff4b2c6
  version: 1
  assessment_title: Only administrators responsible for the domain controller must have Administrator rights on the system.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: This applies to domain controllers. A separate version applies to other systems. Review the Administrators group.
    Only the appropriate administrator groups or accounts responsible for administration of the system may be members of the
    group. Standard user accounts must not be members of the local administrator group. If prohibited accounts are members
    of the local administrators group, this is a finding. If the built-in Administrator account or other required administrative
    accounts are found on the system, this is not a finding.
  inputs: []
  evidence: []
