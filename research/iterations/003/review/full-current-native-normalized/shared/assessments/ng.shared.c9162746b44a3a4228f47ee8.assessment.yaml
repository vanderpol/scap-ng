assessment:
  id: ng.shared.c9162746b44a3a4228f47ee8
  version: 1
  assessment_title: The macOS system must configure sudo to log events.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    os-sudo-log-enforce-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: zsh
        command:
          operation: equals
          datatype: string
          value: /usr/bin/sudo /usr/bin/sudo -V | /usr/bin/grep "Log when a command is allowed by sudoers"
      object_title: os_sudo_log_enforce_recommended_object
  states:
    state-os-sudo-log-enforce-recommended-state:
      state_title: os_sudo_log_enforce_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: .*
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-os-sudo-log-enforce-recommended-test:
      test_title: os_sudo_log_enforce_recommended_test
      capability: independent.shellcommand
      object: os-sudo-log-enforce-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-os-sudo-log-enforce-recommended-state
  evaluate:
    test: test-os-sudo-log-enforce-recommended-test
