assessment:
  id: ng.shared.becb78a3c01aaa7919feca7d
  version: 1
  assessment_title: Windows Enterprise LTSC
  mode: automated
  class: inventory
  purpose: applicability
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    editionid-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SOFTWARE\Microsoft\Windows NT\CurrentVersion
        name:
          operation: equals
          datatype: string
          value: EditionId
      object_title: EditionID
  states:
    state-editionid-enterprises-reg-sz:
      state_title: EditionID = EnterpriseS (reg_sz)
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_sz
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: EnterpriseS
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-os-windows-enterprise-ltsc:
      test_title: The OS is Windows Enterprise LTSC
      capability: windows.registry
      object: editionid-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-editionid-enterprises-reg-sz
  evaluate:
    not:
      test: test-os-windows-enterprise-ltsc
