assessment:
  id: ng.shared.27e5d2c91ed81f6e3bd349a5
  version: 1
  assessment_title: Verify /etc/pam.d/system-auth is included in /etc/pam.d/passwd
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    etc-pam-d-system-auth-included-in-etc-pam-d-collection:
      collection_title: /etc/pam.d/system-auth is included in /etc/pam.d/passwd.
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/pam.d
        filename:
          operation: equals
          datatype: string
          mask: false
          value: passwd
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[\s]*password[ \t]+substack[ \t]+system-auth\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-etc-pam-d-system-auth-included-in-etc-pam-d:
      test_title: /etc/pam.d/system-auth is included in /etc/pam.d/passwd.
      capability: independent.textfilecontent54
      collection: etc-pam-d-system-auth-included-in-etc-pam-d-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    test: test-etc-pam-d-system-auth-included-in-etc-pam-d
