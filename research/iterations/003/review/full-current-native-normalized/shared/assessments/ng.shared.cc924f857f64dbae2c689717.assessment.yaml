assessment:
  id: ng.shared.cc924f857f64dbae2c689717
  version: 1
  assessment_title: OL08-00-010541 - OL 8 must use a separate file system for "/var/log".
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-partition-object:
      capability: linux.partition
      select:
        mount_point:
          operation: equals
          datatype: string
          mask: false
          value: /var/log
      object_title: null
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/fstab
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[^# \t]+\s+/var/log\s+
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: null
  states: {}
  tests:
    test-there-separate-file-system-var-log:
      test_title: There is a separate file system for /var/log.
      capability: linux.partition
      object: linux-partition-object
      check_existence: all_exist
      check: all
    test-there-separate-file-system-configured-var-log:
      test_title: There is a separate file system configured for /var/log.
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: all_exist
      check: all
  evaluate:
    all:
    - test: test-there-separate-file-system-var-log
    - test: test-there-separate-file-system-configured-var-log
