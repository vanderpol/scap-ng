assessment:
  id: ng.shared.eab35923c27508613e787b37
  version: 1
  assessment_title: The Exchange email diagnostic log level must be set to the lowest level.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    run-get-eventloglevel-display-all-event-log-levels-collection:
      collection_title: Run Get-EventLogLevel to display all event log levels
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: add-pssnapin Microsoft.Exchange.Management.Powershell.Snapin;Get-EventLogLevel | Format-Table -HideTableHeaders
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: \w
      behaviors:
        error_if_stderr_exists: 'true'
  tests:
    test-if-diagnostic-any-eventlevel-not-set-lowest-this-finding:
      test_title: If the Diagnostic of any EventLevel is not set to Lowest, this is a finding.
      capability: independent.shellcommand
      collection: run-get-eventloglevel-display-all-event-log-levels-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Verify value is lowest
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: (?i)lowest
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-if-diagnostic-any-eventlevel-not-set-lowest-this-finding
