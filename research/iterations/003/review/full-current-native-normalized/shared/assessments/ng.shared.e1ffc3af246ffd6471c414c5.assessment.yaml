assessment:
  id: ng.shared.e1ffc3af246ffd6471c414c5
  version: 1
  assessment_title: WN19-DC-000260 - Windows Server 2019 must be configured to audit DS Access - Directory Service Changes
    successes.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-auditeventpolicysubcategories-collection:
      collection_title: null
      capability: windows.auditeventpolicysubcategories
  tests:
    test-audit-directory-service-changes-success-only-or-success-failure:
      test_title: Audit - Directory Service Changes - 'Success only' or 'Success and Failure'
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: null
          capability: windows.auditeventpolicysubcategories
          state:
            field: directory_service_changes
            value: AUDIT_SUCCESS
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: windows.auditeventpolicysubcategories
          state:
            field: directory_service_changes
            value: AUDIT_SUCCESS_FAILURE
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-audit-directory-service-changes-success-only-or-success-failure
