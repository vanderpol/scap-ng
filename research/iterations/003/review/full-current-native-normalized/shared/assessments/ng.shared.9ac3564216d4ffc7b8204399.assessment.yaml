assessment:
  id: ng.shared.9ac3564216d4ffc7b8204399
  version: 1
  assessment_title: The Oracle Linux operating system must initiate a session lock for graphical user interfaces when the
    screensaver is activated.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system initiates a session lock a for graphical user interfaces when the screensaver is
    activated. Note: If the system does not have GNOME installed, this requirement is Not Applicable. If GNOME is installed,
    check to see a session lock occurs when the screensaver is activated with the following command: # grep -i lock-delay
    /etc/dconf/db/local.d/* lock-delay=uint32 5 If the "lock-delay" setting is missing, or is not set to "5" or less, this
    is a finding.'
  inputs: []
  evidence: []
