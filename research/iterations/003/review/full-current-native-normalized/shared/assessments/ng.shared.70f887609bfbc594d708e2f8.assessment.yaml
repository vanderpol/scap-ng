assessment:
  id: ng.shared.70f887609bfbc594d708e2f8
  version: 1
  assessment_title: The default umask for FTP users must be 077.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The package service/network/ftp must be installed for this check. # pkg list service/network/ftp If the output
    of this command is: pkg list: no packages matching ''service/network/ftp'' installed no further action is required. Determine
    if the FTP umask is set to 077. # egrep -i "^UMASK" /etc/proftpd.conf | awk ''{ print $2 }'' If 077 is not displayed,
    this is a finding.'
  inputs: {}
  evidence: []
