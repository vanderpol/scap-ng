assessment:
  id: ng.shared.ef71bdb1bc61e64ddaed3ec6
  version: 1
  assessment_title: WN10-CC-000327 - PowerShell Transcription must be enabled on Windows 10.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows\PowerShell\Transcription
        name:
          operation: equals
          datatype: string
          mask: false
          value: EnableTranscripting
  tests:
    test-powershell-transcription-enabled-on-windows-11:
      test_title: PowerShell Transcription is enabled on Windows 11
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-powershell-transcription-enabled-on-windows-11
