assessment:
  id: ng.shared.8f46c919cd5147e278eb97bc
  version: 1
  assessment_title: Ubuntu 20.04 LTS must require users to provide a password for privilege escalation.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    check-if-etc-sudoers-has-line-that-includes-nopasswd-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/sudoers
        pattern:
          operation: pattern match
          datatype: string
          value: ^([^#\n]+)
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      filters:
      - action: include
        state: state-filter-out-all-but-include-all-all-all-all-and-all-all-a
      behaviors:
        ignore_case: 'false'
        multiline: 'true'
        singleline: 'false'
      object_title: check if /etc/sudoers has line that includes NOPASSWD
    check-if-file-in-etc-sudoers-d-that-include-nopasswd-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/sudoers.d
        filename:
          operation: pattern match
          datatype: string
          value: .*
        pattern:
          operation: pattern match
          datatype: string
          value: ^([^#\n]+)
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      filters:
      - action: include
        state: state-filter-out-all-but-include-all-all-all-all-and-all-all-a
      behaviors:
        ignore_case: 'false'
        multiline: 'true'
        singleline: 'false'
      object_title: check if file in /etc/sudoers.d that Include NOPASSWD
  states:
    state-filter-out-all-but-include-all-all-all-all-and-all-all-a:
      state_title: Filter out all but - Include ALL  ALL=(ALL) ALL and ALL ALL=(ALL:ALL) ALL
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: NOPASSWD(?:\:|\s){0,1}.*
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-etc-sudoers-not-contain-nopasswd:
      test_title: '/etc/sudoers must not contain: NOPASSWD'
      capability: independent.textfilecontent54
      object: check-if-etc-sudoers-has-line-that-includes-nopasswd-object
      check_existence: none_exist
      check: all
    test-etc-sudoers-d-not-contain-file-nopasswd:
      test_title: '/etc/sudoers.d must not contain a file with: NOPASSWD'
      capability: independent.textfilecontent54
      object: check-if-file-in-etc-sudoers-d-that-include-nopasswd-object
      check_existence: none_exist
      check: all
  evaluate:
    all:
    - test: test-etc-sudoers-not-contain-nopasswd
    - test: test-etc-sudoers-d-not-contain-file-nopasswd
