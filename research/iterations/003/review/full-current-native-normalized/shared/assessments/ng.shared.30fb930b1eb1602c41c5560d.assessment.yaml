assessment:
  id: ng.shared.30fb930b1eb1602c41c5560d
  version: 1
  assessment_title: The macOS system must configure audit log folders to be owned by root.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured with audit log folders owned by root with the following command: /bin/ls
    -dn $(/usr/bin/grep ''^dir'' /etc/security/audit_control | /usr/bin/awk -F: ''{print $2}'') | /usr/bin/awk ''{print $3}''
    If the result is not "0", this is a finding.'
  inputs: {}
  evidence: []
