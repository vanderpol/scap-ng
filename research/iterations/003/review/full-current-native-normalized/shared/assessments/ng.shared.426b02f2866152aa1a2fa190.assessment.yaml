assessment:
  id: ng.shared.426b02f2866152aa1a2fa190
  version: 1
  assessment_title: The macOS system must use multifactor authentication for local access to privileged and nonprivileged
    accounts.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    auth-smartcard-enforce-recommended-object-collection:
      collection_title: auth_smartcard_enforce_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.security.smartcard'')\

            .objectForKey(''enforceSmartCard'').js

            EOS'
  tests:
    test-auth-smartcard-enforce-recommended-test:
      test_title: auth_smartcard_enforce_recommended_test
      capability: independent.shellcommand
      collection: auth-smartcard-enforce-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: auth_smartcard_enforce_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: 'true'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-auth-smartcard-enforce-recommended-test
