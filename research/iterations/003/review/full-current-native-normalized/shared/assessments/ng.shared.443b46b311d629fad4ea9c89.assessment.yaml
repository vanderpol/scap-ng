assessment:
  id: ng.shared.443b46b311d629fad4ea9c89
  version: 1
  assessment_title: UAC - Non UAC Compliant Application Virtualization
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Microsoft\Windows\CurrentVersion\Policies\System
        name:
          operation: equals
          datatype: string
          mask: false
          value: EnableVirtualization
  variables:
    virtualize-file-registry-write-failures-per-user-locations-variable:
      title: Virtualize file and registry write failures to per-user locations
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: virtualize_write_failures_per_user_locations_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-user-account-control-virtualize-file-registry-write-failures-per-user:
      test_title: '''User Account Control: Virtualize file and registry write failures to per-user locations'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: virtualize-file-registry-write-failures-per-user-locations-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-user-account-control-virtualize-file-registry-write-failures-per-user
