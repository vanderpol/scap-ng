assessment:
  id: ng.shared.b8e45e47d98a476eb868883e
  version: 1
  assessment_title: The macOS system must disable the Bluetooth system settings pane.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    system-settings-bluetooth-settings-disable-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/bin/profiles show -output stdout-xml | /usr/bin/xmllint --xpath '//key[text()="DisabledSystemSettings"]/following-sibling::*[1]'
            - | /usr/bin/grep com.apple.BluetoothSettings
      object_title: system_settings_bluetooth_settings_disable_recommended_object
  states:
    state-system-settings-bluetooth-settings-disable-recommended-s:
      state_title: system_settings_bluetooth_settings_disable_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: .*
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-settings-bluetooth-settings-disable-recommended-test:
      test_title: system_settings_bluetooth_settings_disable_recommended_test
      capability: independent.shellcommand
      object: system-settings-bluetooth-settings-disable-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-system-settings-bluetooth-settings-disable-recommended-s
  evaluate:
    test: test-system-settings-bluetooth-settings-disable-recommended-test
