assessment:
  id: ng.shared.d94c2db4a8111868fcec8f60
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that when passwords are changed a minimum of eight
    of the total number of characters must be changed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The "difok" option sets the number of characters in a password that must not be present in the old password.
    Check for the value of the "difok" option in "/etc/security/pwquality.conf" with the following command: # grep difok /etc/security/pwquality.conf
    difok = 8 If the value of "difok" is set to less than "8", this is a finding.'
  inputs: []
  evidence: []
