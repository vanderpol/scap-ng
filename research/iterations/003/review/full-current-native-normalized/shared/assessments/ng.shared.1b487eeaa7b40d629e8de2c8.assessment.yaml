assessment:
  id: ng.shared.1b487eeaa7b40d629e8de2c8
  version: 1
  assessment_title: WN19-DC-000400 - Windows Server 2019 Deny log on locally user right on domain controllers must be configured
    to prevent unauthenticated access.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-userright-object:
      capability: windows.userright
      select:
        userright:
          operation: equals
          datatype: string
          mask: false
          value: SE_DENY_INTERACTIVE_LOGON_NAME
      object_title: null
  states:
    state-windows-userright:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: Guests
        operation: case insensitive equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-deny-log-on-locally-guests:
      test_title: Deny log on locally - Guests
      capability: windows.userright
      object: windows-userright-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-windows-userright
  evaluate:
    test: test-deny-log-on-locally-guests
