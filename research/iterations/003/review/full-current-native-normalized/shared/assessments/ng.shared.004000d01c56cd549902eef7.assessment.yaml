assessment:
  id: ng.shared.004000d01c56cd549902eef7
  version: 1
  assessment_title: Bad Logon Attempts
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    lockout-policy-collection:
      collection_title: Lockout policy
      capability: windows.lockoutpolicy
  variables:
    account-lockout-threshold-variable:
      title: Account Lockout Threshold
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: account_lockout_threshold_var
        validation:
          alternatives:
          - literal: '3'
            hint: 3_attempts
          - literal: '5'
            hint: 5_attempts
          - literal: '10'
            hint: 10_attempts
          - literal: '50'
            hint: 50_attempts
  tests:
    test-account-lockout-threshold-set-3-or-less:
      test_title: '''Account lockout threshold'' is set to ''3'' or less'
      capability: windows.lockoutpolicy
      collection: lockout-policy-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Lockout Threshold is less than or equal to variable
        state_capability: windows.lockoutpolicy
        state:
          field: lockout_threshold
          value:
            variable: account-lockout-threshold-variable
          operation: less than or equal
          datatype: int
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
    test-account-lockout-threshold-not-set-0:
      test_title: '''Account lockout threshold'' is not set to ''0'''
      capability: windows.lockoutpolicy
      collection: lockout-policy-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Lockout Threshold is greater than 0
        state_capability: windows.lockoutpolicy
        state:
          field: lockout_threshold
          value: '0'
          operation: greater than
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-account-lockout-threshold-set-3-or-less
    - test: test-account-lockout-threshold-not-set-0
