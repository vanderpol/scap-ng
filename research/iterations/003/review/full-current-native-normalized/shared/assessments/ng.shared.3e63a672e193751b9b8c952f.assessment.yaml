assessment:
  id: ng.shared.3e63a672e193751b9b8c952f
  version: 1
  assessment_title: WN10-CC-000210 - The Windows Defender SmartScreen for Explorer must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\Windows\System
        name:
          operation: equals
          datatype: string
          mask: false
          value: EnableSmartScreen
  tests:
    test-configure-windows-smartscreen-set-enabled:
      test_title: '''Configure Windows SmartScreen'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-configure-windows-smartscreen-set-enabled
