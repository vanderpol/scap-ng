assessment:
  id: ng.shared.f1d8827584753bfcabb84b17
  version: 1
  assessment_title: 'OL08-00-010020 - OL 8 must implement NIST FIPS-validated cryptography for the following: To provision
    digital signatures, to generate cryptographic hashes, and to protect data requiring data-at-rest protections in accordance
    with applicable federal laws, Executive Orders, directives, policies, regulations, and standards.'
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    proc-sys-crypto-fips-enabled-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /proc/sys/crypto/fips_enabled
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(\d+)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: /proc/sys/crypto/fips_enabled
    boot-grub2-grubenv-kernelopts-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /boot/grub2/grubenv
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*kernelopts=[^#]*fips=(\d+)\b
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: /boot/grub2/grubenv:kernelopts
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '1'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-fips-enabled-1:
      test_title: fips_enabled == 1
      capability: independent.textfilecontent54
      object: proc-sys-crypto-fips-enabled-object
      check_existence: all_exist
      check: all
      states:
      - state-independent-textfilecontent54
    test-boot-grub2-grubenv-kernelopts-contains-fips-1:
      test_title: /boot/grub2/grubenv:kernelopts contains fips=1
      capability: independent.textfilecontent54
      object: boot-grub2-grubenv-kernelopts-object
      check_existence: all_exist
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    all:
    - test: test-fips-enabled-1
    - test: test-boot-grub2-grubenv-kernelopts-contains-fips-1
