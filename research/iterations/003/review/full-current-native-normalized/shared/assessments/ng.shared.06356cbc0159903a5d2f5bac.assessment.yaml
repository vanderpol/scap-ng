assessment:
  id: ng.shared.06356cbc0159903a5d2f5bac
  version: 1
  assessment_title: Active Directory Group Policy objects must have proper access control permissions.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    analyze-permissions-on-group-policy-objects-report-details-on-any-collection:
      collection_title: Analyze the permissions on the Group Policy Objects and report details on any non-compliant permission
        found.
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: Import-Module ActiveDirectory; $a='^SYSTEM$|^Domain Admins$|^Enterprise Admins$|^Administrators$|^Enterprise
            Domain Controllers$|^CREATOR OWNER$'; $s='^Authenticated Users$|^Domain Computers$'; $results=foreach($gpo in
            (Get-ADObject -Filter "objectClass -eq 'groupPolicyContainer'" -SearchBase (Get-ADDomain).SystemsContainer -Properties
            displayName)){$acl = (Get-Acl -Path "AD:\$($gpo.DistinguishedName)").Access; foreach($rule in $acl){$t = $rule.IdentityReference.Value.Split('\')[-1];
            if(-not $t -or $t -match $a -or $t -match $s){continue}else{"GPO=$($gpo.displayName) | Status=FAIL | Reason=Unauthorized
            trustee $t holds explicit ACL entry on this GPO."}}}; if($results){$results}else{"GPO=All GPOs | Status=PASS |
            Reason=Delegation secure."}
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: .+
      behaviors:
        error_if_stderr_exists: 'true'
  tests:
    test-windows-server-active-directory-group-policy-objects-have-proper-access:
      test_title: Windows Server Active Directory Group Policy objects must have proper access control permissions.
      capability: independent.shellcommand
      collection: analyze-permissions-on-group-policy-objects-report-details-on-any-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: No lines shall exist listed with status of 'FAIL'
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: Status=FAIL
          operation: pattern match
          datatype: string
          mask: false
          entity_check: none satisfy
          entity_existence: at_least_one_exists
  evaluate:
    test: test-windows-server-active-directory-group-policy-objects-have-proper-access
