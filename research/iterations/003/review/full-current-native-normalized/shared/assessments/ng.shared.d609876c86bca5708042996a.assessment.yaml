assessment:
  id: ng.shared.d609876c86bca5708042996a
  version: 1
  assessment_title: OL09-00-002011 - OL 9 must prevent special devices on file systems that are imported via Network File
    System (NFS).
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    etc-fstab-uncommented-nfs-capturing-options-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/fstab
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*[^#\s][^\s]*\s+[^\s]+\s+nfs[^\s]*\s+([^\s]+)
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: /etc/fstab, uncommented, nfs, capturing options
  states:
    state-nodev-option:
      state_title: nodev option
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: (^|,)nodev(,|$)
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-nfs-mounts-mounted-nodev:
      test_title: NFS mounts are mounted with nodev
      capability: independent.textfilecontent54
      object: etc-fstab-uncommented-nfs-capturing-options-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-nodev-option
  evaluate:
    test: test-nfs-mounts-mounted-nodev
