assessment:
  id: ng.shared.5824f2edc2c3a9ccf9be8178
  version: 1
  assessment_title: SQL Server must protect its audit configuration from authorized and unauthorized access and modification.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Check the server documentation for a list of approved users with access to SQL Server Audits. To create, alter,
    or drop a server audit, principals require the ALTER ANY SERVER AUDIT or the CONTROL SERVER permission. Review the SQL
    Server permissions granted to principals. Look for permissions ALTER ANY SERVER AUDIT, ALTER ANY DATABASE AUDIT, CONTROL
    SERVER: SELECT login.name, perm.permission_name, perm.state_desc FROM sys.server_permissions perm JOIN sys.server_principals
    login ON perm.grantee_principal_id = login.principal_id WHERE permission_name in (''ALTER ANY DATABASE AUDIT'', ''ALTER
    ANY SERVER AUDIT'', ''CONTROL SERVER'') and login.name not like ''##MS_%''; If unauthorized accounts have these privileges,
    this is a finding.'
  inputs: []
  evidence: []
