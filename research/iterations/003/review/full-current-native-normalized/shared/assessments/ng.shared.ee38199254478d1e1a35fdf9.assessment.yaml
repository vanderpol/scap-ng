assessment:
  id: ng.shared.ee38199254478d1e1a35fdf9
  version: 1
  assessment_title: The Oracle Linux operating system must display the date and time of the last successful account logon
    upon SSH logon.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-rpminfo-collection:
      collection_title: null
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: openssh-server
    check-etc-ssh-sshd-config-printlastlog-setting-its-value-collection:
      collection_title: Check /etc/ssh/sshd_config for the PrintLastLog setting and its value
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[\s]*(?i)PrintLastLog(?-i)[ \t]+([\w\"]+)[\s]*(?:|(?:#.*))?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-package-openssh-server-removed:
      test_title: package openssh-server is removed
      capability: linux.rpminfo
      collection: linux-rpminfo-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
    test-tests-value-printlastlog-setting-in-etc-ssh-sshd-config-file:
      test_title: tests the value of PrintLastLog setting in the /etc/ssh/sshd_config file
      capability: independent.textfilecontent54
      collection: check-etc-ssh-sshd-config-printlastlog-setting-its-value-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: The value was set to yes
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^yes$|^"yes"$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    any:
    - test: test-package-openssh-server-removed
    - test: test-tests-value-printlastlog-setting-in-etc-ssh-sshd-config-file
