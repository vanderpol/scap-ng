  version: 1
  assessment_title: The macOS system must disable Internet Sharing.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable Internet Sharing with the following command: /usr/bin/osascript
    -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.MCX'')\ .objectForKey(''forceInternetSharingOff'').js
    EOS If the result is not "true", this is a finding.'
  inputs: []
  evidence: []
