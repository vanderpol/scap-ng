assessment:
  id: ng.shared.9a50320a324c6dc3b79f9180
  version: 1
  assessment_title: OL08-00-020080 - OL 8 must prevent a user from overriding the session lock-delay setting for the graphical
    user interface.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    dconf-user-databases-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/dconf/profile/user
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^system-db:(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: dconf user databases
    org-gnome-desktop-screensaver-lock-delay-in-dconf-user-database-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: dconf-user-database-locks-directories-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^/org/gnome/desktop/screensaver/lock-delay$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: /org/gnome/desktop/screensaver/lock-delay in dconf user database locks directories
  variables:
    dconf-user-database-locks-directories-variable:
      title: dconf user database locks directories
      kind: local
      datatype: string
      expression:
        concat:
        - literal:
            value: /etc/dconf/db/
            datatype: string
        - values:
            object: dconf-user-databases-object
            field: subexpression
        - literal:
            value: .d/locks
            datatype: string
  states: {}
  tests:
    test-dconf-user-database-s-exist:
      test_title: dconf user database(s) exist
      capability: independent.textfilecontent54
      object: dconf-user-databases-object
      check_existence: at_least_one_exists
      check: all
    test-org-gnome-desktop-screensaver-lock-delay-in-dconf-user-database:
      test_title: /org/gnome/desktop/screensaver/lock-delay in dconf user database locks directories exists
      capability: independent.textfilecontent54
      object: org-gnome-desktop-screensaver-lock-delay-in-dconf-user-database-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    all:
    - test: test-dconf-user-database-s-exist
    - test: test-org-gnome-desktop-screensaver-lock-delay-in-dconf-user-database
