assessment:
  id: ng.shared.a6a7739771f887cf235a09dd
  version: 1
  assessment_title: AZLX-23-002280 - Amazon Linux 2023 library directories must be group-owned by root or a system account.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    all-system-wide-library-directories-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          variable_check: only one
          value:
            variable: system-wide-shared-library-files-directories-variable
        filename:
          operation: equals
          datatype: string
          nil: true
          value: ''
      filters:
      - action: include
        state: state-unix-file
      - action: exclude
        state: state-group-owned-by-root
      behaviors:
        recurse_direction: down
      object_title: All system-wide library directories
  variables:
    system-wide-shared-library-files-directories-variable:
      title: system-wide shared library files directories
      kind: constant
      datatype: string
      expression:
        literal:
        - /lib
        - /lib64
        - /usr/lib
        - /usr/lib64
  states:
    state-unix-file:
      state_title: null
      capability: unix.file
      state:
        field: type
        value: directory
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-group-owned-by-root:
      state_title: group-owned by root
      capability: unix.file
      state:
        field: group_id
        value: '0'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-no-system-wide-library-directories-exist-except-those-group-owned:
      test_title: No system-wide library directories exist except for those group-owned by root
      capability: unix.file
      object: all-system-wide-library-directories-object
      check_existence: none_exist
      check: all
  evaluate:
    test: test-no-system-wide-library-directories-exist-except-those-group-owned
