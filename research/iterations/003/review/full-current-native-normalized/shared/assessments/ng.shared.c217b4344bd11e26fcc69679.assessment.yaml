assessment:
  id: ng.shared.c217b4344bd11e26fcc69679
  version: 1
  assessment_title: The macOS system must enforce SSH to display the Standard Mandatory DOD Notice and Consent Banner.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to display the contents of "/etc/banner" before granting access to the
    system with the following command: /usr/sbin/sshd -G | /usr/bin/grep -c "^banner /etc/banner" If the command does not
    return "1", this is a finding.'
  inputs: {}
  evidence: []
