assessment:
  id: ng.shared.6fee5c82bff122f0b0f8b434
  version: 1
  assessment_title: User passwords must be changed at least every 60 days.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    gather-non-root-unlocked-users-passwords-greater-than-60-days-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: 'logins -ox |awk -F: ''( $1 != "root" && $8 != "LK" && $8 != "NL" && ($11 > "60"|| $11 < "1")) { print }'''
        pattern:
          operation: pattern match
          datatype: string
          value: .*
      object_title: Gather non-root, unlocked users with passwords greater than 60 days
    check-etc-default-passwd-maxdays-setting-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/default/passwd
        pattern:
          operation: pattern match
          datatype: string
          value: ^MAXDAYS=(.*)
        instance:
          operation: equals
          datatype: int
          value: '1'
      object_title: Check /etc/default/passwd for MAXDAYS setting
    check-etc-default-passwd-ensure-maxweeks-not-defined-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/default/passwd
        pattern:
          operation: pattern match
          datatype: string
          value: ^MAXWEEKS=
        instance:
          operation: equals
          datatype: int
          value: '1'
      object_title: Check /etc/default/passwd to ensure MAXWEEKS is not defined
  states:
    state-stdout-line-should-not-return-any-users:
      state_title: stdout_line should not return any users
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: ''
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: none_exist
    state-maxdays-is-60-or-less:
      state_title: MAXDAYS is 60 or less
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '60'
        operation: less than or equal
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-check-etc-passwd-users-password-age-greater-than-60-days:
      test_title: Check /etc/passwd for users with password age greater than 60 days
      capability: independent.shellcommand
      object: gather-non-root-unlocked-users-passwords-greater-than-60-days-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-stdout-line-should-not-return-any-users
    test-check-etc-default-passwd-maxdays-setting:
      test_title: Check /etc/default/passwd for MAXDAYS setting
      capability: independent.textfilecontent54
      object: check-etc-default-passwd-maxdays-setting-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-maxdays-is-60-or-less
    test-check-etc-default-passwd-ensure-maxweeks-not-defined:
      test_title: Check /etc/default/passwd to ensure MAXWEEKS is not defined
      capability: independent.textfilecontent54
      object: check-etc-default-passwd-ensure-maxweeks-not-defined-object
      check_existence: none_exist
      check: all
  evaluate:
    all:
    - test: test-check-etc-passwd-users-password-age-greater-than-60-days
    - test: test-check-etc-default-passwd-maxdays-setting
    - test: test-check-etc-default-passwd-ensure-maxweeks-not-defined
