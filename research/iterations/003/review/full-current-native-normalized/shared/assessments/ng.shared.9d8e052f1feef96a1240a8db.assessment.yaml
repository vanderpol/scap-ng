  version: 1
  assessment_title: The rhost-based authentication for SSH must be disabled.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Determine if rhost-based authentication is enabled. # grep "^IgnoreRhosts" /etc/ssh/sshd_config If the output
    is produced and it is not: IgnoreRhosts yes this is a finding. If the IgnoreRhosts line does not exist in the file, the
    default setting of "Yes" is automatically used and there is no finding.'
  inputs: []
  evidence: []
