assessment:
  id: ng.shared.fd0e7f53ecff920100288d67
  version: 1
  assessment_title: The operating system must protect the integrity of transmitted information.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    svcs-svc-network-ipsec-policy-default-collection:
      collection_title: svcs svc:/network/ipsec/policy:default
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: svcs svc:/network/ipsec/policy:default
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: svc:\/network\/ipsec\/policy:default
  tests:
    test-operating-system-protect-integrity-transmitted-information:
      test_title: The operating system must protect the integrity of transmitted information.
      capability: independent.shellcommand
      collection: svcs-svc-network-ipsec-policy-default-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Check that the output starts with 'online' with an exit status of 0
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: ^online
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-operating-system-protect-integrity-transmitted-information
