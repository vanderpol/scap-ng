assessment:
  id: ng.shared.ef56358468538f5a5cfd8805
  version: 1
  assessment_title: The Ubuntu Operating system must disable the x86 Ctrl-Alt-Delete key sequence.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    systemctl-status-ctrl-alt-del-target-collection:
      collection_title: systemctl status ctrl-alt-del.target
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: systemctl status ctrl-alt-del.target
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: 'Loaded:'
  tests:
    test-verify-operating-system-not-configured-reboot-system-when-ctrl-alt:
      test_title: Verify the operating system is not configured to reboot the system when Ctrl-Alt-Delete is pressed.
      capability: independent.shellcommand
      collection: systemctl-status-ctrl-alt-del-target-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: If the ctrl-alt-del.target is not masked, this is a finding.
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: ': masked'
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-verify-operating-system-not-configured-reboot-system-when-ctrl-alt
