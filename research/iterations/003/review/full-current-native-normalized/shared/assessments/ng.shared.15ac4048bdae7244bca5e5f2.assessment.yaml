assessment:
  id: ng.shared.15ac4048bdae7244bca5e5f2
  version: 1
  assessment_title: The default umask for system and users must be 077.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    all-users-collection:
      collection_title: All users
      capability: unix.password
      select:
        username:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[^-+].*$
    home-directories-all-user-accounts-collection:
      collection_title: The home directories of all user accounts.
      capability: unix.password
      set:
        operator: union
        members:
        - collection: all-users-collection
        filters:
        - action: exclude
          match:
            field: user_id
            value: '100'
            operation: less than
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: System accounts.
          capability: unix.password
        - action: exclude
          match:
            field: user_id
            value: '60001'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: System account.
          capability: unix.password
        - action: exclude
          match:
            field: user_id
            value: '60002'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: System account.
          capability: unix.password
        - action: exclude
          match:
            field: user_id
            value: '65534'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: System account.
          capability: unix.password
    user-initialization-file-profile-s-umask-setting-collection:
      collection_title: The user initialization file, .profile's, umask setting
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: home-directories-all-user-accounts-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[.].*$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*umask\s+(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    default-login-s-umask-setting-collection:
      collection_title: The default login's umask setting.
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/default/login
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*UMASK=(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    home-directories-all-user-accounts-that-don-t-have-profile-collection:
      collection_title: The home directories of all user accounts that don't have .profile files.
      capability: unix.password
      set:
        operator: union
        members:
        - collection: all-users-collection
        filters:
        - action: exclude
          match:
            field: user_id
            value: '100'
            operation: less than
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: System accounts.
          capability: unix.password
        - action: exclude
          match:
            field: user_id
            value: '60001'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: System account.
          capability: unix.password
        - action: exclude
          match:
            field: user_id
            value: '60002'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: System account.
          capability: unix.password
        - action: exclude
          match:
            field: user_id
            value: '65534'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: System account.
          capability: unix.password
        - action: exclude
          match:
            field: home_dir
            value:
              variable: home-directories-all-user-accounts-that-have-profile-variable
            operation: equals
            datatype: string
            mask: false
            variable_check: at least one
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: User accounts that have a .profile
          capability: unix.password
  variables:
    home-directories-all-user-accounts-variable:
      title: The home directories of all user accounts.
      kind: local
      datatype: string
      expression:
        values:
          collection: home-directories-all-user-accounts-collection
          field: home_dir
    home-directories-all-user-accounts-that-have-profile-variable:
      title: The home directories of all user accounts that have .profile
      kind: local
      datatype: string
      expression:
        values:
          collection: user-initialization-file-profile-s-umask-setting-collection
          field: path
  tests:
    test-check-umask-setting-in-every-user-initialization-file-make-sure:
      test_title: Check the umask setting in every user initialization file to make sure it is 077.
      capability: independent.textfilecontent54
      collection: user-initialization-file-profile-s-umask-setting-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Umask setting of 077.
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: '077'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-check-umask-setting-in-default-login-file-make-sure-it:
      test_title: Check the umask setting in the default login file to make sure it is 077.
      capability: independent.textfilecontent54
      collection: default-login-s-umask-setting-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Umask setting of 077.
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: '077'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-home-directories-all-user-accounts-that-don-t-have-profile:
      test_title: The home directories of all user accounts that don't have .profile files.
      capability: unix.password
      collection: home-directories-all-user-accounts-that-don-t-have-profile-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
  evaluate:
    all:
    - test: test-check-umask-setting-in-every-user-initialization-file-make-sure
    - test: test-check-umask-setting-in-default-login-file-make-sure-it
    - test: test-home-directories-all-user-accounts-that-don-t-have-profile
