assessment:
  id: ng.shared.5fd67eaaf2c8c6e24c6d8281
  version: 1
  assessment_title: The SUSE operating system SSH daemon public host key files must have mode 0644 or less permissive.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the SUSE operating system SSH daemon public host key files have mode "0644" or less permissive. Note:
    SSH public key files may be found in other directories on the system depending on the installation. The following command
    will find all SSH public key files on the system: > find /etc/ssh -name ''ssh_host*key.pub'' -exec stat -c "%a %n" {}
    \; 644 /etc/ssh/ssh_host_rsa_key.pub 644 /etc/ssh/ssh_host_dsa_key.pub 644 /etc/ssh/ssh_host_ecdsa_key.pub 644 /etc/ssh/ssh_host_ed25519_key.pub
    If any file has a mode more permissive than "0644", this is a finding.'
  inputs: []
  evidence: []
