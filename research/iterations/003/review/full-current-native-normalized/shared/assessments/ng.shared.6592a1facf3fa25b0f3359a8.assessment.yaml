assessment:
  id: ng.shared.6592a1facf3fa25b0f3359a8
  version: 1
  assessment_title: Caching of logon credentials must be limited.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This is the default configuration for this setting (10 logons to cache). If the following registry value does
    not exist or is not configured as specified, this is a finding: Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Microsoft\Windows
    NT\CurrentVersion\Winlogon\ Value Name: CachedLogonsCount Value Type: REG_SZ Value: 10 (or less) This setting only applies
    to domain-joined systems, however, it is configured by default on all systems.'
  inputs: {}
  evidence: []
