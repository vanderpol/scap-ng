assessment:
  id: ng.shared.cae39ef51a6c32c860f3f8e5
  version: 1
  assessment_title: Windows 10 must be configured to audit file system failures.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that Audit File System auditing has been enabled: Computer Configuration >> Windows Settings >> Security
    Settings >> Advanced Audit Policy Configuration >> System Audit Policies >> Object Access >> Audit File System. If "Audit
    File System" is not set to "Failure", this is a finding.'
  inputs: []
  evidence: []
