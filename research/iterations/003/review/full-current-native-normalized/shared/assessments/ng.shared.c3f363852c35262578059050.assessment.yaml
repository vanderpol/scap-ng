  version: 1
  assessment_title: The Oracle Linux operating system must be configured so users must re-authenticate for privilege escalation.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system requires users to reauthenticate for privilege escalation. Check the configuration
    of the "/etc/sudoers" and "/etc/sudoers.d/*" files with the following command: # grep -i authenticate /etc/sudoers /etc/sudoers.d/*
    If any uncommented line is found with a "!authenticate" tag, this is a finding.'
  inputs: []
  evidence: []
