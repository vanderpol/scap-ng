assessment:
  id: ng.shared.16b341df890953c25a4d7baf
  version: 1
  assessment_title: The SUSE operating system must not be performing Internet Protocol version 6 (IPv6) packet forwarding
    by default unless the system is a router.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the SUSE operating system is not performing IPv6 packet forwarding by default, unless the system is a
    router. Check to see if IPv6 forwarding is disabled by default using the following command: > sudo sysctl net.ipv6.conf.default.forwarding
    net.ipv6.conf.default.forwarding = 0 If the network parameter "ipv6.conf.default.forwarding" is not equal to "0" or nothing
    is returned, this is a finding.'
  inputs: []
  evidence: []
