assessment:
  id: ng.shared.68aefacc984b7c9c49da4d4d
  version: 1
  assessment_title: Device Install - PnP Interface Remote Access
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\Windows\DeviceInstall\Settings
        name:
          operation: equals
          datatype: string
          mask: false
          value: AllowRemoteRPC
  variables:
    allow-remote-access-pnp-interface-variable:
      title: Allow remote access to the PnP interface
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: allow_remote_access_to_the_pnp_interface_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-allow-remote-access-plug-play-interface-set-disabled:
      test_title: '''Allow remote access to the Plug and Play interface'' is set to ''Disabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: allow-remote-access-pnp-interface-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-allow-remote-access-plug-play-interface-set-disabled
