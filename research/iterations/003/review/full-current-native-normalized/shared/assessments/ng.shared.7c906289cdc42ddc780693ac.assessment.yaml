assessment:
  id: ng.shared.7c906289cdc42ddc780693ac
  version: 1
  assessment_title: WN10-SO-000040 - Outgoing secure channel traffic must be encrypted when possible.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Services\Netlogon\Parameters
        name:
          operation: equals
          datatype: string
          mask: false
          value: SealSecureChannel
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-domain-member-digitally-encrypt-secure-channel-data-when-possible-set:
      test_title: '''Domain member: Digitally encrypt secure channel data (when possible)'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-domain-member-digitally-encrypt-secure-channel-data-when-possible-set
