assessment:
  id: ng.shared.b90c06bd6e561f153f62764c
  version: 1
  assessment_title: UAC - Application Installations
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Microsoft\Windows\CurrentVersion\Policies\System
        name:
          operation: equals
          datatype: string
          mask: false
          value: EnableInstallerDetection
      object_title: null
  variables:
    detect-application-installations-prompt-elevation-variable:
      title: Detect application installations and prompt for elevation
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: detect_application_installations_prompt_elevation_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: detect-application-installations-prompt-elevation-variable
          operation: equals
          datatype: int
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-user-account-control-detect-application-installations-prompt-elevation-set-enabled:
      test_title: '''User Account Control: Detect application installations and prompt for elevation'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-user-account-control-detect-application-installations-prompt-elevation-set-enabled
