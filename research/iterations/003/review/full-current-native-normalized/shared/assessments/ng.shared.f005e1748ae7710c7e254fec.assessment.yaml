  version: 1
  assessment_title: The macOS system must configure login window to prompt for username and password.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to prompt for username and password at the login window with the following
    command: /usr/bin/osascript -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.loginwindow'')\
    .objectForKey(''SHOWFULLNAME'').js EOS If the result is not "true", this is a finding.'
  inputs: {}
  evidence: []
