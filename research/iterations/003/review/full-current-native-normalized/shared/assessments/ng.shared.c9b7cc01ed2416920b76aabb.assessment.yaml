assessment:
  id: ng.shared.c9b7cc01ed2416920b76aabb
  version: 1
  assessment_title: The Create global objects user right must only be assigned to Administrators, Service, Local Service,
    and Network Service.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy
    >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment. If any
    groups or accounts other than the following are granted the "Create global objects" user right, this is a finding: Administrators
    LOCAL SERVICE NETWORK SERVICE SERVICE'
  inputs: []
  evidence: []
