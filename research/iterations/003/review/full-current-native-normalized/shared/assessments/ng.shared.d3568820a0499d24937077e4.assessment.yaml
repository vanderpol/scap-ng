  variables:
    system-wide-shared-library-files-directories-variable:
      title: system-wide shared library files directories
      kind: constant
      datatype: string
      expression:
        literal:
        - /lib
        - /lib64
        - /usr/lib
        - /usr/lib64
  tests:
    test-no-operating-system-library-regular-files-have-suid-special-permission:
      test_title: no operating system library regular files have the SUID special permission set
      capability: unix.file
      collection: unix-file-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
    test-no-operating-system-library-regular-files-have-sgid-special-permission:
