assessment:
  id: ng.shared.8e302631b44358ccf3d5e72d
  version: 1
  assessment_title: AZLX-23-002485 - Amazon Linux 2023 must ensure all interactive users have unique User IDs (UIDs).
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    interactive-users-object:
      capability: unix.password
      select:
        username:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
      filters:
      - action: include
        state: state-interactive-users
      object_title: Interactive Users
    count-passwd-entries-object:
      capability: independent.variable
      select:
        var_ref:
          operation: equals
          datatype: string
          mask: false
          value:
            variable: count-passwd-entries-variable
      object_title: count of passwd entries
  variables:
    count-passwd-entries-variable:
      title: count of passwd entries
      kind: local
      datatype: int
      expression:
        count:
          values:
            object: interactive-users-object
            field: user_id
    count-unique-uids-variable:
      title: count of unique UIDs
      kind: local
      datatype: int
      expression:
        count:
          unique:
            values:
              object: interactive-users-object
              field: user_id
  states:
    state-count-of-passwd-uids:
      state_title: count of passwd UIDs
      capability: independent.variable
      state:
        field: value
        value:
          variable: count-unique-uids-variable
        operation: equals
        datatype: int
        mask: false
        variable_check: all
        entity_check: all
        entity_existence: at_least_one_exists
    state-interactive-users:
      state_title: Interactive Users
      capability: unix.password
      state:
        field: user_id
        value: '1000'
        operation: greater than or equal
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-uids-unique:
      test_title: UIDs are unique
      capability: independent.variable
      object: count-passwd-entries-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-count-of-passwd-uids
  evaluate:
    test: test-uids-unique
