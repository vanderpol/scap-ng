assessment:
  id: ng.shared.911eb3a62bd96481f05f6545
  version: 1
  assessment_title: TCP Wrappers must be enabled and configured per site policy to only allow access by approved hosts and
    services.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    inetadm-p-grep-tcp-wrappers-collection:
      collection_title: inetadm -p | grep tcp_wrappers
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: inetadm -p | grep tcp_wrappers
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: tcp_wrappers
    etc-hosts-deny-collection:
      collection_title: /etc/hosts.deny
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/hosts.deny
    etc-hosts-allow-collection:
      collection_title: /etc/hosts.allow
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/hosts.allow
  tests:
    test-tcp-wrappers-enabled:
      test_title: TCP Wrappers must be enabled
      capability: independent.shellcommand
      collection: inetadm-p-grep-tcp-wrappers-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Check that line returns tcp_wrappers=TRUE
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: tcp_wrappers=TRUE
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-etc-hosts-deny-exists:
      test_title: /etc/hosts.deny exists
      capability: unix.file
      collection: etc-hosts-deny-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
    test-etc-hosts-allow-exists:
      test_title: /etc/hosts.allow exists
      capability: unix.file
      collection: etc-hosts-allow-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    all:
    - test: test-tcp-wrappers-enabled
    - test: test-etc-hosts-deny-exists
    - test: test-etc-hosts-allow-exists
