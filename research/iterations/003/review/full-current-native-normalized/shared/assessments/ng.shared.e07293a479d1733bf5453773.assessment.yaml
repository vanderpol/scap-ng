assessment:
  id: ng.shared.e07293a479d1733bf5453773
  version: 1
  assessment_title: The Cisco router must be configured to allocate audit record storage capacity in accordance with organization-defined
    audit record storage requirements.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    iosxe-line-object:
      capability: iosxe.line
      select:
        show_subcommand:
          operation: equals
          datatype: string
          value: show running-config
      object_title: null
  states:
    state-check-to-see-if-logging-buffered-is-enabled:
      state_title: Check to see if logging buffered is enabled
      capability: iosxe.line
      state:
        all:
        - field: show_subcommand
          value: show running-config
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: config_line
          value: \nlogging buffered \d+
          operation: pattern match
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-check-see-if-logging-buffered-enabled:
      test_title: Check to see if logging buffered is enabled
      capability: iosxe.line
      object: iosxe-line-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-check-to-see-if-logging-buffered-is-enabled
  evaluate:
    test: test-check-see-if-logging-buffered-enabled
