assessment:
  id: ng.shared.da7230998bd8d6395cd2750f
  version: 1
  assessment_title: The macOS system must prohibit user installation of software into /users/.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-user-app-installation-prohibit-recommended-object-collection:
      collection_title: os_user_app_installation_prohibit_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: "/usr/bin/osascript -l JavaScript << EOS\nfunction run() {\n  let pref1 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.applicationaccess.new')\\\
            \n  .objectForKey('familyControlsEnabled'))\n  let pathlist = $.NSUserDefaults.alloc.initWithSuiteName('com.apple.applicationaccess.new')\\\
            \n  .objectForKey('pathBlackList').js\n  for ( let app in pathlist ) {\n      if ( ObjC.unwrap(pathlist[app])\
            \ == \"/Users/\" && pref1 == true ){\n          return(\"true\")\n      }\n  }\n  return(\"false\")\n  }\nEOS"
  tests:
    test-os-user-app-installation-prohibit-recommended-test:
      test_title: os_user_app_installation_prohibit_recommended_test
      capability: independent.shellcommand
      collection: os-user-app-installation-prohibit-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: os_user_app_installation_prohibit_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: 'true'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-os-user-app-installation-prohibit-recommended-test
