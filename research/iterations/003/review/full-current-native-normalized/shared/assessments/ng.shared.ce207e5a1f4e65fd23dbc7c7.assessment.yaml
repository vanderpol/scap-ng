assessment:
  id: ng.shared.ce207e5a1f4e65fd23dbc7c7
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that the PAM system service is configured to store
    only encrypted representations of passwords.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the PAM system service is configured to store only encrypted representations of passwords. The strength
    of encryption that must be used to hash passwords for all accounts is SHA512. Check that the system is configured to create
    SHA512 hashed passwords with the following command: # grep password /etc/pam.d/system-auth /etc/pam.d/password-auth Outcome
    should look like following: /etc/pam.d/system-auth-ac:password sufficient pam_unix.so sha512 shadow try_first_pass use_authtok
    /etc/pam.d/password-auth:password sufficient pam_unix.so sha512 shadow try_first_pass use_authtok If the "/etc/pam.d/system-auth"
    and "/etc/pam.d/password-auth" configuration files allow for password hashes other than SHA512 to be used, this is a finding.'
  inputs: []
  evidence: []
