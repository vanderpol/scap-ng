assessment:
  id: ng.shared.125f0955140b74cb5d3deb62
  version: 1
  assessment_title: UBTU-22-654190 - Ubuntu 22.04 LTS must generate audit records for all events that affect the systemd journal
    files.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/audit.rules
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*-w\s+/var/log/journal(\s+-p\s*([rx]*w[rx]*a[rx]*|[rx]*a[rx]*w[rx]*))?(\s+(-k\s+|-F\s+key=)\w+)?\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-audit-modifications-var-log-journal:
      test_title: Audit modifications to /var/log/journal
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state: null
  evaluate:
    test: test-audit-modifications-var-log-journal
