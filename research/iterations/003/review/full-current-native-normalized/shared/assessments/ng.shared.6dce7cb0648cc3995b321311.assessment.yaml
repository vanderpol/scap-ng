assessment:
  id: ng.shared.6dce7cb0648cc3995b321311
  version: 1
  assessment_title: The Oracle Linux operating system must off-load audit records onto a different system or media from the
    system being audited.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system off-loads audit records onto a different system or media from the system being audited.
    To determine the remote server that the records are being sent to, use the following command: # grep -i remote_server
    /etc/audisp/audisp-remote.conf remote_server = 10.0.21.1 If a remote server is not configured, or the line is commented
    out, ask the System Administrator to indicate how the audit logs are off-loaded to a different system or media. If there
    is no evidence that the audit logs are being off-loaded to another system or media, this is a finding.'
  inputs: []
  evidence: []
