assessment:
  id: ng.shared.dd13d11ba1b5e29e8dab8812
  version: 1
  assessment_title: The macOS system must disable Unlock with Apple Watch during Setup Assistant.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable Unlock with Apple Watch during Setup Assistant with the following
    command: /usr/bin/osascript -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.SetupAssistant.managed'')\
    .objectForKey(''SkipUnlockWithWatch'').js EOS If the result is not "true", this is a finding.'
  inputs: []
  evidence: []
