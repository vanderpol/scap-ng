assessment:
  id: ng.shared.669d9b941339530d9a0b1c17
  version: 1
  assessment_title: CISC-ND-000380 - The Cisco router must be configured to protect audit information from unauthorized modification.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    iosxe-global-object:
      capability: iosxe.global
      select:
        global_command:
          operation: pattern match
          datatype: string
          value: ^logging[ \t]+persistent\b
      object_title: null
    iosxe-global-object-2:
      capability: iosxe.global
      select:
        global_command:
          operation: pattern match
          datatype: string
          value: ^file[ \t]+privilege
      object_title: null
    iosxe-global-object-3:
      capability: iosxe.global
      select:
        global_command:
          operation: pattern match
          datatype: string
          value: ^file[ \t]+privilege[ \t]+15[ \t]*$
      object_title: null
  states: {}
  tests:
    test-check-persistent-logging:
      test_title: Check for persistent logging
      capability: iosxe.global
      object: iosxe-global-object
      check_existence: at_least_one_exists
      check: all
    test-check-file-privilege:
      test_title: Check for file privilege
      capability: iosxe.global
      object: iosxe-global-object-2
      check_existence: at_least_one_exists
      check: all
    test-check-file-privilege-15:
      test_title: Check for file privilege 15
      capability: iosxe.global
      object: iosxe-global-object-3
      check_existence: at_least_one_exists
      check: all
  evaluate:
    any:
    - not:
        test: test-check-persistent-logging
    - any:
      - not:
          test: test-check-file-privilege
      - test: test-check-file-privilege-15
