assessment:
  id: ng.shared.13d388f7c642649eeef3bd68
  version: 1
  assessment_title: OL09-00-005030 - OL 9 must be configured so that the rsyslog daemon does not accept log messages from
    other servers unless the server is being used for log aggregation.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    rsyslog-conf-remote-log-acceptance-config-collection:
      collection_title: 'rsyslog.conf: remote log acceptance config'
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/rsyslog.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: patterns-remote-log-acceptance-config-variable
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
    rsyslog-d-conf-remote-log-acceptance-config-collection:
      collection_title: 'rsyslog.d/*.conf: remote log acceptance config'
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/rsyslog.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^.*\.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: patterns-remote-log-acceptance-config-variable
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
    remote-log-acceptance-config-collection:
      collection_title: remote log acceptance config
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - collection: rsyslog-conf-remote-log-acceptance-config-collection
        - collection: rsyslog-d-conf-remote-log-acceptance-config-collection
  variables:
    patterns-remote-log-acceptance-config-variable:
      title: Patterns for remote log acceptance config
      kind: constant
      datatype: string
      expression:
        literal:
        - ^[^#]*InputTCPServerRun
        - ^[^#]*UDPServerRun
        - ^[^#]*RELPServerRun
        - ^[^#]*module\s*\(.*\bload\s*=\s*"imtcp".*\)
        - ^[^#]*module\s*\(.*\bload\s*=\s*"imudp".*\)
        - ^[^#]*module\s*\(.*\bload\s*=\s*"imrelp".*\)
        - ^[^#]*input\s*\(.*\btype\b\s*=\s*"imtcp"\s*\bport\b\s*=\s*"514".*\)
        - ^[^#]*input\s*\(.*\btype\b\s*=\s*"imudp"\s*\bport\b\s*=\s*"514".*\)
        - ^[^#]*input\s*\(.*\btype\b\s*=\s*"imrelp"\s*\bport\b\s*=\s*"514".*\)
  tests:
    test-no-remote-log-acceptance:
      test_title: no remote log acceptance
      capability: independent.textfilecontent54
      collection: remote-log-acceptance-config-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
  evaluate:
    test: test-no-remote-log-acceptance
