assessment:
  id: ng.shared.a6907d0d6d2854c37ee47caa
  version: 1
  assessment_title: WINCC-000027
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: System\CurrentControlSet\Policies\EarlyLaunch
        name:
          operation: equals
          datatype: string
          value: DriverLoadPolicy
      object_title: null
  states:
    state-reg-dword-type-and-value-equals-1:
      state_title: Reg_Dword type and value equals 1
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-boot-start-driver-initialization-policy-set-enabled-good-unknown-selected:
      test_title: '''Boot-Start Driver Initialization Policy'' is set to ''Enabled'' with ''Good and Unknown'' selected'
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-1
  evaluate:
    test: test-boot-start-driver-initialization-policy-set-enabled-good-unknown-selected
