assessment:
  id: ng.shared.284d8938d35e412dbc75042c
  version: 1
  assessment_title: Internet File Association Service
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Microsoft\Windows\CurrentVersion\Policies\Explorer
        name:
          operation: equals
          datatype: string
          mask: false
          value: NoInternetOpenWith
  variables:
    turn-off-internet-file-association-service-variable:
      title: Turn Off Internet File Association Service
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: turn_off_internet_file_association_service_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-turn-off-internet-file-association-service-set-enabled:
      test_title: '''Turn off Internet File Association service'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: turn-off-internet-file-association-service-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-turn-off-internet-file-association-service-set-enabled
