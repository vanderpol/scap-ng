assessment:
  id: ng.shared.1518a88869d4eff09abd8c31
  version: 1
  assessment_title: The macOS system must restrict maximum password lifetime to 60 days.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to restrict maximum password lifetime to 60 days with the following command:
    /usr/bin/pwpolicy -getaccountpolicies 2> /dev/null | /usr/bin/tail +2 | /usr/bin/xmllint --xpath ''//dict/key[text()="policyAttributeExpiresEveryNDays"]/following-sibling::*[1]/text()''
    - If the result is not "60" or less, this is a finding.'
  inputs: []
  evidence: []
