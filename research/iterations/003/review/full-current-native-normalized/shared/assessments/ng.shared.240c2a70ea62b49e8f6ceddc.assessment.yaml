assessment:
  id: ng.shared.240c2a70ea62b49e8f6ceddc
  version: 1
  assessment_title: The macOS system must configure audit_control to mode 440 or less permissive.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    audit-control-mode-configure-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: zsh
        command:
          operation: equals
          datatype: string
          value: /bin/ls -l /etc/security/audit_control|/usr/bin/awk '!/-r--[r-]-----|current|total/{print $1}'
      object_title: audit_control_mode_configure_recommended_object
  states:
    state-audit-control-mode-configure-recommended-state:
      state_title: audit_control_mode_configure_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: ''
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: none_exist
  tests:
    test-audit-control-mode-configure-recommended-test:
      test_title: audit_control_mode_configure_recommended_test
      capability: independent.shellcommand
      object: audit-control-mode-configure-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-audit-control-mode-configure-recommended-state
  evaluate:
    test: test-audit-control-mode-configure-recommended-test
