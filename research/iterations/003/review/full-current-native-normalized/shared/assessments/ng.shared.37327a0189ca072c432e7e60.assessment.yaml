assessment:
  id: ng.shared.37327a0189ca072c432e7e60
  version: 1
  assessment_title: The SUSE operating system library directories must be owned by root.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the system-wide shared library directories "/lib", "/lib64", "/usr/lib/" and "/usr/lib64" are owned by
    root. Check that the system-wide shared library directories are owned by root with the following command: > sudo find
    /lib /lib64 /usr/lib /usr/lib64 ! -user root -type d -exec stat -c "%n %U" ''{}'' \; If any system wide library directory
    is returned, this is a finding.'
  inputs: {}
  evidence: []
