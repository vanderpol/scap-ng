  version: 1
  assessment_title: Exchange servers must use approved DOD certificates.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Open the Exchange Management Shell and enter the following command: Get-ExchangeCertificate | Select-Object
    -Property CertificateDomains, issuer If the value of "CertificateDomains" does not indicate it is issued by the DOD, this
    is a finding.'
  inputs: []
  evidence: []
