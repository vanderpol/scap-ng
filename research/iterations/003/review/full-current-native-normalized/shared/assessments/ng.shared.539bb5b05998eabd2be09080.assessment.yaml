assessment:
  id: ng.shared.539bb5b05998eabd2be09080
  version: 1
  assessment_title: The SUSE operating system SSH daemon private host key files must have mode 0640 or less permissive.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the SUSE operating system SSH daemon private host key files have mode "0640" or less permissive. The
    following command will find all SSH private key files on the system: > sudo find / -name ''*ssh_host*key'' -exec ls -lL
    {} \; Check the mode of the private host key files under "/etc/ssh" file with the following command: > find /etc/ssh -name
    ''ssh_host*key'' -exec stat -c "%a %n" {} \; 640 /etc/ssh/ssh_host_rsa_key 640 /etc/ssh/ssh_host_dsa_key 640 /etc/ssh/ssh_host_ecdsa_key
    640 /etc/ssh/ssh_host_ed25519_key If any file has a mode more permissive than "0640", this is a finding.'
  inputs: {}
  evidence: []
