assessment:
  id: ng.shared.0e40beaa5f3d8917ba5d4953
  version: 1
  assessment_title: Database contents must be protected from unauthorized and unintended information transfer by enforcement
    of a data-transfer policy.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Review the procedures for the refreshing of development/test data from production. Review any scripts or code
    that exists for the movement of production data to development/test systems, or to any other location or for any other
    purpose. Verify that copies of production data are not left in unprotected locations. If the code that exists for data
    movement does not comply with the organization-defined data transfer policy and/or fails to remove any copies of production
    data from unprotected locations, this is a finding.
  inputs: {}
  evidence: []
