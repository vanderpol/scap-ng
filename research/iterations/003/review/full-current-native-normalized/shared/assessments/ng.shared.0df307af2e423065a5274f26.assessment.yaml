assessment:
  id: ng.shared.0df307af2e423065a5274f26
  version: 1
  assessment_title: The macOS system must configure sudoers timestamp type.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-sudoers-timestamp-type-configure-recommended-object-collection:
      collection_title: os_sudoers_timestamp_type_configure_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/sudo /usr/bin/sudo -V | /usr/bin/awk -F": " ''/Type of authentication timestamp record/{print $2}'''
  tests:
    test-os-sudoers-timestamp-type-configure-recommended-test:
      test_title: os_sudoers_timestamp_type_configure_recommended_test
      capability: independent.shellcommand
      collection: os-sudoers-timestamp-type-configure-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: os_sudoers_timestamp_type_configure_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: tty
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-os-sudoers-timestamp-type-configure-recommended-test
