assessment:
  id: ng.shared.5d882596005f1e0dc8a6e89e
  version: 1
  assessment_title: Set Password Expiration Parameters
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/login.defs
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*PASS_MIN_DAYS\s+(\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  variables:
    minimum-password-age-in-days-variable:
      title: Minimum password age in days
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: var_accounts_minimum_age_login_defs
  tests:
    test-value-pass-min-days-should-set-appropriately-in-etc-login:
      test_title: The value of PASS_MIN_DAYS should be set appropriately in /etc/login.defs
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value:
            variable: minimum-password-age-in-days-variable
          operation: greater than or equal
          datatype: int
          mask: false
          variable_check: at least one
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-value-pass-min-days-should-set-appropriately-in-etc-login
