assessment:
  id: ng.shared.eb69c2a2bec49dc0b9e49942
  version: 1
  assessment_title: The VNC server package must not be installed unless required.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    pkg-info-x11-server-xvnc-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: pkg info x11/server/xvnc
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
      object_title: pkg info x11/server/xvnc
  states:
    state-stdout-line-should-not-exist:
      state_title: stdout_line should not exist
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: ''
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: none_exist
  tests:
    test-vnc-server-package-not-installed-unless-required:
      test_title: The VNC server package must not be installed unless required.
      capability: independent.shellcommand
      object: pkg-info-x11-server-xvnc-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-stdout-line-should-not-exist
  evaluate:
    test: test-vnc-server-package-not-installed-unless-required
