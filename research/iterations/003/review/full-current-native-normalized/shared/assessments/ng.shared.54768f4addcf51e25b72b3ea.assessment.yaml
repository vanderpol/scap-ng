assessment:
  id: ng.shared.54768f4addcf51e25b72b3ea
  version: 1
  assessment_title: The rpcbind service must be configured for local only services unless organizationally defined.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    svcprop-p-config-local-only-network-rpc-bind-collection:
      collection_title: svcprop -p config/local_only network/rpc/bind
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: svcprop -p config/local_only network/rpc/bind
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
  tests:
    test-rpcbind-service-configured-local-only-services-unless-organizationally-defined:
      test_title: The rpcbind service must be configured for local only services unless organizationally defined.
      capability: independent.shellcommand
      collection: svcprop-p-config-local-only-network-rpc-bind-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: 'Check that line contains: true, and command exits with a status of 0'
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: 'true'
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-rpcbind-service-configured-local-only-services-unless-organizationally-defined
