assessment:
  id: ng.shared.969caa88e4bdd0ff4238679a
  version: 1
  assessment_title: The operating system must encrypt the transfer of audit records off-loaded onto a different system or
    media from the system being audited.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    etc-audisp-audisp-remote-conf-enable-krb5-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/audisp/audisp-remote.conf
        pattern:
          operation: pattern match
          datatype: string
          value: ^[ ]*enable_krb5[ ]+=[ ]+([^ ]*)[ ]*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      behaviors:
        ignore_case: 'true'
        multiline: 'true'
      object_title: /etc/audisp/audisp-remote.conf enable_krb5
  states:
    state-enable-krb5-yes:
      state_title: enable_krb5 = yes
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^[Yy][Ee][Ss]$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-etc-audisp-audisp-remote-conf-enable-krb5-yes:
      test_title: /etc/audisp/audisp-remote.conf enable_krb5 = yes
      capability: independent.textfilecontent54
      object: etc-audisp-audisp-remote-conf-enable-krb5-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-enable-krb5-yes
  evaluate:
    test: test-etc-audisp-audisp-remote-conf-enable-krb5-yes
