assessment:
  id: ng.shared.aef099da584c2565a453ef17
  version: 1
  assessment_title: The Microsoft FTP service must not be installed unless required.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: If the server has the role of an FTP server, this is NA. Open "PowerShell". Enter "Get-WindowsFeature | Where
    Name -eq Web-Ftp-Service". If "Installed State" is "Installed", this is a finding. An Installed State of "Available" or
    "Removed" is not a finding. If the system has the role of an FTP server, this must be documented with the ISSO.
  inputs: []
  evidence: []
