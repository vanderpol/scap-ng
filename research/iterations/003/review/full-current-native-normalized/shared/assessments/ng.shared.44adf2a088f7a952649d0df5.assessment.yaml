assessment:
  id: ng.shared.44adf2a088f7a952649d0df5
  version: 1
  assessment_title: OL09-00-002030 - OL 9 must mount /boot with the nodev option.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    boot-object:
      capability: linux.partition
      select:
        mount_point:
          operation: equals
          datatype: string
          mask: false
          value: /boot
      object_title: /boot
  states:
    state-linux-partition:
      state_title: null
      capability: linux.partition
      state:
        field: mount_options
        value: nodev
        operation: equals
        datatype: string
        mask: false
        entity_check: at least one
        entity_existence: at_least_one_exists
  tests:
    test-boot-has-nodev-option:
      test_title: /boot has nodev option
      capability: linux.partition
      object: boot-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-linux-partition
  evaluate:
    test: test-boot-has-nodev-option
