assessment:
  id: ng.shared.5f81ad9555edffcdf3f6713f
  version: 1
  assessment_title: CISC-ND-001210 - The Cisco router must be configured to implement cryptographic mechanisms to protect
    the confidentiality of remote maintenance sessions.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    show-running-config-object:
      capability: iosxe.line
      select:
        show_subcommand:
          operation: equals
          datatype: string
          value: show running-config
      object_title: show running-config
    show-running-config-object-2:
      capability: iosxe.line
      select:
        show_subcommand:
          operation: equals
          datatype: string
          value: show running-config
      object_title: show running-config
  states:
    state-ip-ssh-version-2:
      state_title: ip ssh version 2
      capability: iosxe.line
      state:
        field: config_line
        value: '[\r\n]\s*ip ssh version 2[\r\n]'
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-ip-ssh-server-algorithm-encryption:
      state_title: ip ssh server algorithm encryption ...
      capability: iosxe.line
      state:
        field: config_line
        value: '[\r\n]\s*ip ssh server algorithm encryption .+[\r\n]'
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-ip-ssh-server-algorithm-encryption-3des-or-cbc:
      state_title: ip ssh server algorithm encryption 3des or -cbc
      capability: iosxe.line
      state:
        field: config_line
        value: '[\r\n]\s*ip ssh server algorithm encryption(?: .+-cbc.*| .*3des-.+)+[\r\n]'
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-ip-ssh-version-2:
      test_title: ip ssh version 2
      capability: iosxe.line
      object: show-running-config-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-ip-ssh-version-2
    test-ip-ssh-server-algorithm-encryption-fips-validated-algorithms:
      test_title: ip ssh server algorithm encryption FIPS-validated algorithms
      capability: iosxe.line
      object: show-running-config-object-2
      check_existence: at_least_one_exists
      check: all
      states:
      - state-ip-ssh-server-algorithm-encryption
    test-ip-ssh-server-algorithm-encryption-3des-or-cbc-algorithms:
      test_title: ip ssh server algorithm encryption 3des or -cbc algorithms
      capability: iosxe.line
      object: show-running-config-object-2
      check_existence: at_least_one_exists
      check: all
      states:
      - state-ip-ssh-server-algorithm-encryption-3des-or-cbc
  evaluate:
    all:
    - test: test-ip-ssh-version-2
    - test: test-ip-ssh-server-algorithm-encryption-fips-validated-algorithms
    - not:
        test: test-ip-ssh-server-algorithm-encryption-3des-or-cbc-algorithms
