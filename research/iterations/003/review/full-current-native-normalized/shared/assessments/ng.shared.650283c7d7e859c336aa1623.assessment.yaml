assessment:
  id: ng.shared.650283c7d7e859c336aa1623
  version: 1
  assessment_title: The macOS system must require that passwords contain a minimum of one lowercase character and one uppercase
    character.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to require that passwords contain a minimum of one lowercase character
    and one uppercase character with the following command: /usr/bin/pwpolicy -getaccountpolicies 2> /dev/null | /usr/bin/tail
    +2 | /usr/bin/xmllint --xpath ''boolean(//*[contains(text(),"policyAttributePassword matches ''\''''^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9]).*$''\''''")])''
    - If the result is not "true", this is a finding.'
  inputs: {}
  evidence: []
