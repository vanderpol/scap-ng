assessment:
  id: ng.shared.a336ced254fbf5b5b6f43d2d
  version: 1
  assessment_title: The Oracle Linux operating system must protect audit information from unauthorized read, modification,
    or deletion.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system audit records have proper permissions and ownership. List the full permissions and
    ownership of the audit log files with the following command. # ls -la /var/log/audit total 4512 drwx------. 2 root root
    23 Apr 25 16:53 . drwxr-xr-x. 17 root root 4096 Aug 9 13:09 .. -rw-------. 1 root root 8675309 Aug 9 12:54 audit.log Audit
    logs must be mode 0600 or less permissive. If any are more permissive, this is a finding. The owner and group owner of
    all audit log files must both be "root". If any other owner or group owner is listed, this is a finding.'
  inputs: []
  evidence: []
