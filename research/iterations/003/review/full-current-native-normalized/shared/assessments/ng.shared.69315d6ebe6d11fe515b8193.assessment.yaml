  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    svcprop-p-config-local-only-network-rpc-bind-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: svcprop -p config/local_only network/rpc/bind
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
      object_title: svcprop -p config/local_only network/rpc/bind
