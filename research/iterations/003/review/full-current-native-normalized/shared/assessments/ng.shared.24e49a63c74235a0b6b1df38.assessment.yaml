assessment:
  id: ng.shared.24e49a63c74235a0b6b1df38
  version: 1
  assessment_title: Local volumes must use a format that supports NTFS attributes.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Open "Computer Management". Select "Disk Management" under "Storage". For each local volume, if the file system
    does not indicate "NTFS", this is a finding. "ReFS" (Resilient File System) is also acceptable and would not be a finding.
    “CSV” (Cluster Share Volumes) is also acceptable and would not be a finding. This does not apply to system partitions
    such as the Recovery and EFI System Partition.
  inputs: []
  evidence: []
