assessment:
  id: ng.shared.239f4b07e7543b9f257e3f21
  version: 1
  assessment_title: The OS must disable information system functionality that provides the capability for automatic execution
    of code on mobile devices without user direction.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-information-collection:
      collection_title: OS information
      capability: unix.uname
    etc-zones-index-collection:
      collection_title: /etc/zones/index
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/zones/index
    etc-zones-index-global-entry-collection:
      collection_title: /etc/zones/index global entry
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/zones/index
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: '^global:'
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    var-share-zones-index-json-collection:
      collection_title: /var/share/zones/index.json
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /var/share/zones/index.json
    var-share-zones-index-json-path-collection:
      collection_title: /var/share/zones/index.json 'path:/'
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /var/share/zones/index.json
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: '"path":\s+"/"'
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    removable-media-volume-manager-collection:
      collection_title: The removable media volume manager.
      capability: solaris.smf
      select:
        fmri:
          operation: equals
          datatype: string
          mask: false
          value: svc://localhost/system/filesystem/rmvolmgr:default
  tests:
    test-solaris-less-than-11-4:
      test_title: Solaris (less than) 11.4
      capability: unix.uname
      collection: os-information-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: 11.3 or less.
        state_capability: unix.uname
        state:
          field: os_version
          value: ^11($|\.[0-3]\b)
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-etc-zones-index-does-not-exist:
      test_title: /etc/zones/index does not exist
      capability: unix.file
      collection: etc-zones-index-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
    test-etc-zones-index-contains-global:
      test_title: /etc/zones/index contains global
      capability: independent.textfilecontent54
      collection: etc-zones-index-global-entry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
    test-var-share-zones-index-json-does-not-exist:
      test_title: /var/share/zones/index.json does not exist
      capability: unix.file
      collection: var-share-zones-index-json-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
    test-var-share-zones-index-json-does-not-contain-path:
      test_title: /var/share/zones/index.json does not contain 'path:/'
      capability: independent.textfilecontent54
      collection: var-share-zones-index-json-path-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
    test-determine-if-removable-media-volume-manager-running:
      test_title: Determine if the removable media volume manager is running.
      capability: solaris.smf
      collection: removable-media-volume-manager-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Disabled state
        state_capability: solaris.smf
        state:
          field: service_state
          value: DISABLED
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    any:
    - not:
        all:
        - any:
          - not:
              test: test-solaris-less-than-11-4
          - any:
            - test: test-etc-zones-index-does-not-exist
            - test: test-etc-zones-index-contains-global
        - any:
          - test: test-solaris-less-than-11-4
          - any:
            - test: test-var-share-zones-index-json-does-not-exist
            - test: test-var-share-zones-index-json-does-not-contain-path
    - test: test-determine-if-removable-media-volume-manager-running
