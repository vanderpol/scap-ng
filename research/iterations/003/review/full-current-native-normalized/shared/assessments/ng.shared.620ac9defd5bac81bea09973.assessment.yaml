          value: 'false'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: sticky
          value: 'false'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: uexec
          value: 'false'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: gread
          value: 'false'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: gwrite
          value: 'false'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: gexec
          value: 'false'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: oread
          value: 'false'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: owrite
          value: 'false'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: oexec
          value: 'false'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
