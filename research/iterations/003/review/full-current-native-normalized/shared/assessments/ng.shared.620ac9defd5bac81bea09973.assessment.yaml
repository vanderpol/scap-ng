assessment:
  id: ng.shared.620ac9defd5bac81bea09973
  version: 1
  assessment_title: OL08-00-010490 - The OL 8 SSH private host key files must have mode "0600" or less permissive.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    ssh-private-key-files-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^ssh_host_.*_key$
      object_title: SSH private key files
  states:
    state-mode-0600-or-less-permissive:
      state_title: Mode 0600 or less permissive
      capability: unix.file
      state:
