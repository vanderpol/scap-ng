  version: 1
  assessment_title: The system must be configured to limit how often keep-alive packets are sent.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding: Registry
    Hive: HKEY_LOCAL_MACHINE Registry Path: \System\CurrentControlSet\Services\Tcpip\Parameters\ Value Name: KeepAliveTime
    Value Type: REG_DWORD Value: 300000 (or less)'
