assessment:
  id: ng.shared.b7fcd5115218807208577be7
  version: 1
  assessment_title: OL 9 local interactive user home directories defined in the /etc/passwd file must exist.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    retrieve-array-users-from-passwd-file-uid-1000-nologin-collection:
      collection_title: Retrieve array of users from passwd file with UID >=1000 and 'nologin'.
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: 'ls -d $(awk -F: ''($3>=1000)&&($7 !~ /nologin/){print $6}'' /etc/passwd)'
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ''
  tests:
    test-confirm-interactive-user-s-home-directories-exist:
      test_title: Confirm interactive user's home directories exist.
      capability: independent.shellcommand
      collection: retrieve-array-users-from-passwd-file-uid-1000-nologin-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: Check that no directories produce 'cannot access' errors.
        state_capability: independent.shellcommand
        state:
          field: stderr_line
          value: .*
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: none_exist
  evaluate:
    test: test-confirm-interactive-user-s-home-directories-exist
