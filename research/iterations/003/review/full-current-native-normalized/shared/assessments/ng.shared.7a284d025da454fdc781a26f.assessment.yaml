assessment:
  id: ng.shared.7a284d025da454fdc781a26f
  version: 1
  assessment_title: The Oracle Linux operating system must display the Standard Mandatory DoD Notice and Consent Banner before
    granting local or remote access to the system via a graphical user logon.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system displays the Standard Mandatory DoD Notice and Consent Banner before granting access
    to the operating system via a graphical user logon. Note: If the system does not have GNOME installed, this requirement
    is Not Applicable. Check to see if the operating system displays a banner at the logon screen with the following command:
    # grep banner-message-enable /etc/dconf/db/local.d/* banner-message-enable=true If "banner-message-enable" is set to "false"
    or is missing, this is a finding.'
  inputs: {}
  evidence: []
