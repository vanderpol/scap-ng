assessment:
  id: ng.shared.316527ccc2d720e9149898bd
  version: 1
  assessment_title: The macOS system must set Login Grace Time to 30.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-sshd-login-grace-time-configure-stig-object-collection:
      collection_title: os_sshd_login_grace_time_configure_stig_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/sbin/sshd -G | /usr/bin/awk '/logingracetime/{print $2}'
  tests:
    test-os-sshd-login-grace-time-configure-stig-test:
      test_title: os_sshd_login_grace_time_configure_stig_test
      capability: independent.shellcommand
      collection: os-sshd-login-grace-time-configure-stig-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: os_sshd_login_grace_time_configure_stig_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: '30'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-os-sshd-login-grace-time-configure-stig-test
