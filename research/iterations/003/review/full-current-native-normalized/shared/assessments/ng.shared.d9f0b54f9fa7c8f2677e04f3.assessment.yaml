assessment:
  id: ng.shared.d9f0b54f9fa7c8f2677e04f3
  version: 1
  assessment_title: The delay between login prompts following a failed login attempt must be at least 4 seconds.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    sleeptime-etc-default-login-collection:
      collection_title: SLEEPTIME /etc/default/login
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/default
        filename:
          operation: equals
          datatype: string
          mask: false
          value: login
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*SLEEPTIME=(\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-sleeptime-set-4-or-more-in-etc-default-login:
      test_title: SLEEPTIME is set to 4 or more in /etc/default/login
      capability: independent.textfilecontent54
      collection: sleeptime-etc-default-login-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: SLEEPTIME must not be less than 4
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: '4'
          operation: greater than or equal
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-sleeptime-set-4-or-more-in-etc-default-login
