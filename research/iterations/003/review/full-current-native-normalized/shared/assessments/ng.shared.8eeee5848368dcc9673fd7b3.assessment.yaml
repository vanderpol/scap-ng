assessment:
  id: ng.shared.8eeee5848368dcc9673fd7b3
  version: 1
  assessment_title: WN19-DC-000030 - Windows Server 2019 Kerberos service ticket maximum lifetime must be limited to 600 minutes
    or less.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    kerberos-policy-maximum-lifetime-service-ticket-600-or-less-collection:
      collection_title: Kerberos Policy - Maximum lifetime for service ticket must be 600 or less
      capability: windows.wmi57
      select:
        namespace:
          operation: equals
          datatype: string
          mask: false
          value: root\rsop\computer
        wql:
          operation: equals
          datatype: string
          mask: false
          value: SELECT setting FROM RSOP_SecuritySettingNumeric WHERE KeyName='MaxServiceAge'
  tests:
    test-kerberos-policy-maximum-lifetime-service-ticket-600-minutes-or-less:
      test_title: Kerberos Policy - Maximum lifetime for service ticket - 600 minutes or less and greater than 0
      capability: windows.wmi57
      collection: kerberos-policy-maximum-lifetime-service-ticket-600-or-less-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: AND
        states:
        - state_title: Maximum lifetime for service ticket is less than or eequal to 600
          capability: windows.wmi57
          state:
            field: result
            value:
              record:
              - name: setting
                value: '600'
                operation: less than or equal
                datatype: int
                mask: false
                entity_check: all
            operation: equals
            datatype: record
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: Maximum lifetime for service ticket policy is greater than 0.
          capability: windows.wmi57
          state:
            field: result
            value:
              record:
              - name: setting
                value: '0'
                operation: greater than
                datatype: int
                mask: false
                entity_check: all
            operation: equals
            datatype: record
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-kerberos-policy-maximum-lifetime-service-ticket-600-minutes-or-less
