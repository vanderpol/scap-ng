assessment:
  id: ng.shared.f2bd6a705aa576fffbc07a9f
  version: 1
  assessment_title: The macOS system must use multifactor authentication for local access to privileged and nonprivileged
    accounts.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    auth-smartcard-enforce-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.security.smartcard'')\

            .objectForKey(''enforceSmartCard'').js

            EOS'
      object_title: auth_smartcard_enforce_recommended_object
  states:
    state-auth-smartcard-enforce-recommended-state:
      state_title: auth_smartcard_enforce_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: 'true'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-auth-smartcard-enforce-recommended-test:
      test_title: auth_smartcard_enforce_recommended_test
      capability: independent.shellcommand
      object: auth-smartcard-enforce-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-auth-smartcard-enforce-recommended-state
  evaluate:
    test: test-auth-smartcard-enforce-recommended-test
