assessment:
  id: ng.shared.4f10b9e7aa81b30ebcd59120
  version: 1
  assessment_title: Exchange message size restrictions must be controlled on Send connectors.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    run-get-sendconnector-display-maxmessagesize-configuration-collection:
      collection_title: Run Get-SendConnector to display MaxMessageSize configuration
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: add-pssnapin Microsoft.Exchange.Management.Powershell.Snapin;Get-SendConnector | Select-Object -Property
            Name, Identity, MaxMessageSize
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: ''
      behaviors:
        error_if_stderr_exists: 'true'
  tests:
    test-unknown-test-results-auditor-review-system-settings-gathered-stig-requirements:
      test_title: Unknown Test Results - An auditor must review system settings gathered and STIG requirements.
      capability: independent.unknown
      result: unknown
    test-each-send-connector-if-value-maxmessagesize-not-same-as-global:
      test_title: For each Send connector, if the value of MaxMessageSize is not the same as the global value, this is a finding.
        Or, if MaxMessageSize is set to a numeric value different from the maximum message send size value documented in the
        EDSP, this is a finding.
      capability: independent.shellcommand
      collection: run-get-sendconnector-display-maxmessagesize-configuration-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state: null
    test-no-send-connectors-exist-on-this-exchange-edge-server:
      test_title: No Send Connectors exist on this Exchange Edge Server.
      capability: independent.shellcommand
      collection: run-get-sendconnector-display-maxmessagesize-configuration-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Verify No Send Connectors Exist
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: ''
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: none_exist
  evaluate:
    any:
    - all:
      - test: test-unknown-test-results-auditor-review-system-settings-gathered-stig-requirements
      - test: test-each-send-connector-if-value-maxmessagesize-not-same-as-global
    - test: test-no-send-connectors-exist-on-this-exchange-edge-server
