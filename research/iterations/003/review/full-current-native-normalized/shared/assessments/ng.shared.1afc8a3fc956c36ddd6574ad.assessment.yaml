assessment:
  id: ng.shared.1afc8a3fc956c36ddd6574ad
  version: 1
  assessment_title: AZLX-23-002325 - Amazon Linux 2023 must ensure the /var/log directory be group-owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    var-log-directory-collection:
      collection_title: /var/log directory
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /var/log
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
  tests:
    test-var-log-directory-group-owned-by-root:
      test_title: /var/log directory is group-owned by root.
      capability: unix.file
      collection: var-log-directory-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: group-owned by root
        state_capability: unix.file
        state:
          field: group_id
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-var-log-directory-group-owned-by-root
