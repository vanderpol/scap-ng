assessment:
  id: ng.shared.061164dc53d2c47129f3b787
  version: 1
  assessment_title: Domain controllers must have a PKI server certificate.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    gather-certifates-in-personal-collection:
      collection_title: Gather certifates in 'Personal'.
      capability: windows.cmdlet
      select:
        module_name:
          operation: equals
          datatype: string
          mask: false
          value: Microsoft.Powershell.Management
        module_id:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
        module_version:
          operation: equals
          datatype: version
          mask: false
          nil: true
          value: ''
        verb:
          operation: equals
          datatype: string
          mask: false
          value: Get
        noun:
          operation: equals
          datatype: string
          mask: false
          value: ChildItem
        parameters:
          operation: equals
          datatype: record
          mask: false
          value:
            record:
            - name: path
              value: Cert:\LocalMachine\my
              operation: equals
              datatype: string
              mask: false
              entity_check: all
        select:
          operation: equals
          datatype: record
          mask: false
          value:
            record:
            - name: property
              value: issuer,thumbprint
              operation: equals
              datatype: string
              mask: false
              entity_check: all
  tests:
    test-verify-pki-cerificate-being-used:
      test_title: Verify a PKI cerificate is being used
      capability: windows.cmdlet
      collection: gather-certifates-in-personal-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    test: test-verify-pki-cerificate-being-used
