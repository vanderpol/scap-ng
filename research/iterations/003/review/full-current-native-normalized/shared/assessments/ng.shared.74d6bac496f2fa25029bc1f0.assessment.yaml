assessment:
  id: ng.shared.74d6bac496f2fa25029bc1f0
  version: 1
  assessment_title: Anonymous Access to the Registry
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    winreg-key-collection:
      collection_title: Winreg key
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Control\SecurePipeServers\Winreg
        name:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
    winreg-rights-collection:
      collection_title: Winreg rights
      capability: windows.regkeyeffectiverights53
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Control\SecurePipeServers\Winreg
        trustee_sid:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
    winreg-rights-except-system-admin-backup-local-service-collection:
      collection_title: Winreg rights, except for System, admin, backup, local service
      capability: windows.regkeyeffectiverights53
      set:
        operator: union
        members:
        - collection: winreg-rights-collection
        filters:
        - action: exclude
          match:
            field: trustee_sid
            value: S-1-5-32-544
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: Administrators Group
          capability: windows.regkeyeffectiverights53
        - action: exclude
          match:
            field: trustee_sid
            value: S-1-5-32-551
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: Backup Operators Group
          capability: windows.regkeyeffectiverights53
        - action: exclude
          match:
            field: trustee_sid
            value: S-1-5-18
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: System user
          capability: windows.regkeyeffectiverights53
        - action: exclude
          match:
            field: trustee_sid
            value: S-1-5-19
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: Local Service
          capability: windows.regkeyeffectiverights53
    winreg-rights-except-system-admin-collection:
      collection_title: Winreg rights, except for System, admin
      capability: windows.regkeyeffectiverights53
      set:
        operator: union
        members:
        - collection: winreg-rights-collection
        filters:
        - action: exclude
          match:
            field: trustee_sid
            value: S-1-5-32-544
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: Administrators Group
          capability: windows.regkeyeffectiverights53
        - action: exclude
          match:
            field: trustee_sid
            value: S-1-5-18
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: System user
          capability: windows.regkeyeffectiverights53
  tests:
    test-winreg-key-exists:
      test_title: Winreg key exists
      capability: windows.registry
      collection: winreg-key-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state: null
    test-winreg-key-has-no-bad-rights-non-admin-backup-localservice:
      test_title: Winreg key has no bad rights for non-(admin,backup,localservice)
      capability: windows.regkeyeffectiverights53
      collection: winreg-rights-except-system-admin-backup-local-service-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: No registry rights
        state_capability: windows.regkeyeffectiverights53
        state:
          all:
          - field: standard_delete
            value: '0'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: standard_read_control
            value: '0'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: standard_write_dac
