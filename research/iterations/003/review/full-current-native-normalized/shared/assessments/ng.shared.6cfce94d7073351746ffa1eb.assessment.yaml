assessment:
  id: ng.shared.6cfce94d7073351746ffa1eb
  version: 1
  assessment_title: OL08-00-010650 - OL 8 must prevent files with the setuid and setgid bit set from being executed on file
    systems that are imported via Network File System (NFS).
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/fstab
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*[^#\s][^\s]*\s+[^\s]+\s+nfs[^\s]*\s+([^\s]+)
        instance:
          operation: not equal
          datatype: int
          value: '0'
      object_title: null
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: (^|,)nosuid(,|$)
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-all-nfs-entries-in-etc-fstab-have-nosuid:
      test_title: all nfs entries in /etc/fstab have nosuid
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: any_exist
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    test: test-all-nfs-entries-in-etc-fstab-have-nosuid
