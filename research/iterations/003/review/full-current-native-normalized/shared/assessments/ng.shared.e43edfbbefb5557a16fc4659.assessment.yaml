assessment:
  id: ng.shared.e43edfbbefb5557a16fc4659
  version: 1
  assessment_title: TS/RDS - Set Encryption Level
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: Software\Policies\Microsoft\Windows NT\Terminal Services
        name:
          operation: equals
          datatype: string
          value: MinEncryptionLevel
      object_title: null
  variables:
    set-client-connection-encryption-level-variable:
      title: Set client connection encryption level
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: set_client_connection_encryption_level_var
        validation:
          alternatives:
          - literal: '1'
            hint: low_level
          - literal: '2'
            hint: client_compatible
          - literal: '3'
            hint: high_level
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: set-client-connection-encryption-level-variable
          operation: equals
          datatype: int
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-set-client-connection-encryption-level-set-enabled-high-level:
      test_title: '''Set client connection encryption level'' is set to ''Enabled'' and ''High Level'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-set-client-connection-encryption-level-set-enabled-high-level
