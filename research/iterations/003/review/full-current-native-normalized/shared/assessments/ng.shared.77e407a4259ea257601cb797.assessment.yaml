assessment:
  id: ng.shared.77e407a4259ea257601cb797
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that passwords are a minimum of 15 characters
    in length.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system enforces a minimum 15-character password length. The "minlen" option sets the minimum
    number of characters in a new password. Check for the value of the "minlen" option in "/etc/security/pwquality.conf" with
    the following command: # grep minlen /etc/security/pwquality.conf minlen = 15 If the command does not return a "minlen"
    value of 15 or greater, this is a finding.'
  inputs: {}
  evidence: []
