assessment:
  id: ng.shared.7ede93f1568dbefa27d13b6f
  version: 1
  assessment_title: OL 8 systems, versions 8.2 and above, must ensure account lockouts persist.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    test-etc-security-faillock-conffor-dir-parameter-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/security/faillock.conf
        pattern:
          operation: pattern match
          datatype: string
          value: .*dir\s*=\s*\S+\s*\b
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: Test /etc/security/faillock.conffor dir parameter.
  states:
    state-check-dir-is-not-commented-out:
      state_title: Check dir is not commented out.
      capability: independent.textfilecontent54
      state:
        field: text
        value: ^\s*dir\s*=\s*\S+
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-ensure-account-lockouts-persist-test-etc-pam-d-password-auth:
      test_title: Ensure account lockouts persist. Test /etc/pam.d/password-auth pam_faillock.so preauth line for dir parameter.
      capability: independent.textfilecontent54
      object: test-etc-security-faillock-conffor-dir-parameter-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-check-dir-is-not-commented-out
  evaluate:
    test: test-ensure-account-lockouts-persist-test-etc-pam-d-password-auth
