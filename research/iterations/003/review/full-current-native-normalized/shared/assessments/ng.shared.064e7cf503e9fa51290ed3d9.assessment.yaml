assessment:
  id: ng.shared.064e7cf503e9fa51290ed3d9
  version: 1
  assessment_title: Windows Server 2019 hardened Universal Naming Convention (UNC) paths must be defined to require mutual
    authentication and integrity for at least the \\*\SYSVOL and \\*\NETLOGON shares.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This requirement is applicable to domain-joined systems. For standalone or nondomain-joined systems, this is
    NA. If the following registry values do not exist or are not configured as specified, this is a finding: Registry Hive:
    HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows\NetworkProvider\HardenedPaths\ Value Name: \\*\NETLOGON
    Value Type: REG_SZ Value: RequireMutualAuthentication=1, RequireIntegrity=1 Value Name: \\*\SYSVOL Value Type: REG_SZ
    Value: RequireMutualAuthentication=1, RequireIntegrity=1 Additional entries would not be a finding.'
  inputs: {}
  evidence: []
