  version: 1
  assessment_title: The Server Message Block (SMB) v1 protocol must be disabled on the SMB server.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This requirement specifically applies to Windows 2012 but can also be used for Windows 2012 R2. Different methods
    are available to disable SMBv1 on Windows 2012 R2, if V-73805 is configured on Windows 2012 R2, this is NA. If the following
    registry value does not exist or is not configured as specified, this is a finding: Registry Hive: HKEY_LOCAL_MACHINE
    Registry Path: \SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters\ Value Name: SMB1 Type: REG_DWORD Value: 0x00000000
    (0)'
