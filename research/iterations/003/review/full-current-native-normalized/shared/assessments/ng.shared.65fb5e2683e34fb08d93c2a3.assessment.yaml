assessment:
  id: ng.shared.65fb5e2683e34fb08d93c2a3
  version: 1
  assessment_title: OL08-00-040171 - The x86 Ctrl-Alt-Delete key sequence in OL 8 must be disabled if a graphical user interface
    is installed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/dconf/db/local.d
        filename:
          operation: pattern match
          datatype: string
          value: .*
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*\[org/gnome/settings-daemon/plugins/media-keys\]\s+[^\[\]]*^\s*logout=(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ''''''
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-logout-set-in-org-gnome-settings-daemon-plugins-media-keys:
      test_title: logout is set to '' in [org/gnome/settings-daemon/plugins/media-keys] section of /etc/dconf/db/local.d*.
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    test: test-logout-set-in-org-gnome-settings-daemon-plugins-media-keys
