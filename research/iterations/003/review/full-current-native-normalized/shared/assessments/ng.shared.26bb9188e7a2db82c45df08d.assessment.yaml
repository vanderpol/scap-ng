assessment:
  id: ng.shared.26bb9188e7a2db82c45df08d
  version: 1
  assessment_title: UBTU-20-010009 - Ubuntu operating systems when booted must require authentication upon booting into single-user
    and maintenance modes.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    root-password-hash-in-boot-grub-grub-cfg-collection:
      collection_title: root password hash in /boot/grub/grub.cfg
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /boot/grub/grub.cfg
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*(password\S*)\s+root\s+
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-boot-grub-grub-cfg-uses-password-pbkdf2-root:
      test_title: /boot/grub/grub.cfg uses password_pbkdf2 for root
      capability: independent.textfilecontent54
      collection: root-password-hash-in-boot-grub-grub-cfg-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: password_pbkdf2
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-boot-grub-grub-cfg-uses-password-pbkdf2-root
