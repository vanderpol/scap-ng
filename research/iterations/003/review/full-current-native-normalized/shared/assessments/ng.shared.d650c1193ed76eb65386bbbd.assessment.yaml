assessment:
  id: ng.shared.d650c1193ed76eb65386bbbd
  version: 1
  assessment_title: The audit system must be configured to audit failed attempts to access files and programs.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    auditconfig-t-getflags-cut-f2-d-collection:
      collection_title: auditconfig -t -getflags | cut -f2 -d=
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: auditconfig -t -getflags | cut -f2 -d=
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
    auditconfig-getpolicy-filter-on-active-collection:
      collection_title: auditconfig -getpolicy and filter on active
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: auditconfig -getpolicy
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: active
  tests:
    test-audit-system-configured-audit-failed-attempts-access-files-programs:
      test_title: The audit system must be configured to audit failed attempts to access files and programs.
      capability: independent.shellcommand
      collection: auditconfig-t-getflags-cut-f2-d-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: AND
        states:
        - state_title: -fa is returned in the output
          capability: independent.shellcommand
          state:
            all:
            - field: exit_status
              value: '0'
              operation: equals
              datatype: int
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            - field: stdout_line
              value: -fa
              operation: pattern match
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
        - state_title: -ex is returned in the output
          capability: independent.shellcommand
          state:
            all:
            - field: exit_status
              value: '0'
              operation: equals
              datatype: int
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            - field: stdout_line
              value: -ex
              operation: pattern match
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
        - state_title: -ps is returned in the output
          capability: independent.shellcommand
          state:
            all:
            - field: exit_status
              value: '0'
              operation: equals
              datatype: int
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            - field: stdout_line
              value: -ps
              operation: pattern match
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
    test-active-audit-policy-includes-argv:
      test_title: The active audit policy includes argv
      capability: independent.shellcommand
      collection: auditconfig-getpolicy-filter-on-active-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: argv is returned in the output
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: argv
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-audit-system-configured-audit-failed-attempts-access-files-programs
    - test: test-active-audit-policy-includes-argv
