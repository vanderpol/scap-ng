assessment:
  id: ng.shared.ef6961266497df5519537422
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that when passwords are changed or new passwords
    are established, the new password must contain at least one upper-case character.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: The value to require a number of upper-case characters to be set is expressed as a negative number in
    "/etc/security/pwquality.conf". Check the value for "ucredit" in "/etc/security/pwquality.conf" with the following command:
    # grep ucredit /etc/security/pwquality.conf ucredit = -1 If the value of "ucredit" is not set to a negative value, this
    is a finding.'
  inputs: []
  evidence: []
