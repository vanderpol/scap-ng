assessment:
  id: ng.shared.526ebbdb36eb054a426be9a9
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that all files and directories have a valid group
    owner.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify all files and directories on the system have a valid group. Check the owner of all files and directories
    with the following command: Note: The value after -fstype must be replaced with the filesystem type. XFS is used as an
    example. # find / -fstype xfs -nogroup If any files on the system do not have an assigned group, this is a finding.'
  inputs: []
  evidence: []
