assessment:
  id: ng.shared.f0771b331c6df7eb21c9f6f4
  version: 1
  assessment_title: UBTU-22-611045 - Ubuntu 22.04 LTS must be configured so that when passwords are changed or new passwords
    are established, pwquality must be used.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    enforcing-1-in-etc-security-pwquality-conf-collection:
      collection_title: enforcing = 1 in /etc/security/pwquality.conf
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/security/pwquality.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*enforcing[\s]*=[\s]*(\d+)(?:[\s]|$)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    etc-pam-d-common-password-uses-pam-pwquality-collection:
      collection_title: /etc/pam.d/common-password uses pam_pwquality
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/pam.d/common-password
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*\w+[\s]+requisite[\s]+pam_pwquality\.so[\s]+(?:|.+\s+)retry=([\d]+)(?:[\s]|$)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-etc-security-pwquality-conf-enforcing-1:
      test_title: /etc/security/pwquality.conf enforcing=1
      capability: independent.textfilecontent54
      collection: enforcing-1-in-etc-security-pwquality-conf-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-etc-pam-d-common-password-uses-pwquality-retry-between-1:
      test_title: /etc/pam.d/common-password uses pwquality and retry is between 1 and 3 inclusively
      capability: independent.textfilecontent54
      collection: etc-pam-d-common-password-uses-pam-pwquality-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: AND
        states:
        - state_title: null
          capability: independent.textfilecontent54
          state:
            field: subexpression
            value: '3'
            operation: less than or equal
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: independent.textfilecontent54
          state:
            field: subexpression
            value: '0'
            operation: greater than
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-etc-security-pwquality-conf-enforcing-1
    - test: test-etc-pam-d-common-password-uses-pwquality-retry-between-1
