assessment:
  id: ng.shared.0d166c7c602cbd8104b90266
  version: 1
  assessment_title: The password for the krbtgt account on a domain must be reset at least every 180 days.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    run-user-get-aduser-krbtgt-properties-passwordlastset-datetime-now-user-collection:
      collection_title: Run $user = Get-ADUser krbtgt -properties passwordlastset; ([datetime]::Now - $user.PasswordLastSet).Days
        command via PowerShell
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: $user = Get-ADUser krbtgt -properties passwordlastset; ([datetime]::Now - $user.PasswordLastSet).Days
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: ''
  tests:
    test-password-krbtgt-account-on-domain-reset-at-least-every-180:
      test_title: The password for the krbtgt account on a domain must be reset at least every 180 days.
      capability: independent.shellcommand
      collection: run-user-get-aduser-krbtgt-properties-passwordlastset-datetime-now-user-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: Password for krbtgt account should be 180 or less days old
        state_capability: independent.shellcommand
        state:
          all:
          - field: command
            value: $user = Get-ADUser krbtgt -properties passwordlastset; ([datetime]::Now - $user.PasswordLastSet).Days
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: '180'
            operation: less than or equal
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-password-krbtgt-account-on-domain-reset-at-least-every-180
