assessment:
  id: ng.shared.f68fbdf0f3d4968571f84411
  version: 1
  assessment_title: AZLX-23-002495 - Amazon Linux 2023 system-auth must be configured to use a sufficient number of hashing
    rounds.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/pam.d/system-auth
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*password\s+sufficient\s+pam_unix\.so\s+[^#\n]*\brounds=(\d+)\b
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '100000'
        operation: greater than or equal
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-pam-unix-module-included-in-system-auth-configured-100000-or:
      test_title: The pam_unix module is included in system-auth and configured for 100000 or more rounds.
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    test: test-pam-unix-module-included-in-system-auth-configured-100000-or
