assessment:
  id: ng.shared.f5883b1dc26f8ae2af18dd02
  version: 1
  assessment_title: Windows Server 2019 Deny log on locally user right on domain controllers must be configured to prevent
    unauthenticated access.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This applies to domain controllers. A separate version applies to other systems. Verify the effective setting
    in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy >> Computer Configuration >> Windows
    Settings >> Security Settings >> Local Policies >> User Rights Assignment. If the following accounts or groups are not
    defined for the "Deny log on locally" user right, this is a finding: - Guests Group For server core installations, run
    the following command: Secedit /Export /Areas User_Rights /cfg c:\path\filename.txt Review the text file. If the following
    SID(s) are not defined for the "SeDenyInteractiveLogonRight" user right, this is a finding: S-1-5-32-546 (Guests)'
  inputs: {}
  evidence: []
