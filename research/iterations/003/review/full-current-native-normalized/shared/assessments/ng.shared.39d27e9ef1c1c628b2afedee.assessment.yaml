assessment:
  id: ng.shared.39d27e9ef1c1c628b2afedee
  version: 1
  assessment_title: OL08-00-040350 - If the Trivial File Transfer Protocol (TFTP) server is required, the OL 8 TFTP daemon
    must be configured to operate in secure mode.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-rpminfo-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          value: tftp-server
      object_title: null
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/xinetd.d/tftp
        pattern:
          operation: pattern match
          datatype: string
          value: ^server_args[ \t]*=[ \t]*-s[ \t]+/\S+[ \t]*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states: {}
  tests:
    test-tftp-server-package-absent:
      test_title: The tftp-server package is absent.
      capability: linux.rpminfo
      object: linux-rpminfo-object
      check_existence: none_exist
      check: all
    test-etc-xinetd-d-tftp-server-args-has-s-option-subdirectory:
      test_title: '/etc/xinetd.d/tftp: server_args has a -s option with a subdirectory assigned'
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    any:
    - test: test-tftp-server-package-absent
    - test: test-etc-xinetd-d-tftp-server-args-has-s-option-subdirectory
