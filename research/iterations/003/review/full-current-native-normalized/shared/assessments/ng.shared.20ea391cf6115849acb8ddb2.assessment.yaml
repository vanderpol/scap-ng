assessment:
  id: ng.shared.20ea391cf6115849acb8ddb2
  version: 1
  assessment_title: Case Insensitivity for Non-Windows
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SYSTEM\CurrentControlSet\Control\Session Manager\Kernel
        name:
          operation: equals
          datatype: string
          value: ObCaseInsensitive
      object_title: null
  variables:
    system-objects-require-case-insensitivity-non-windows-subsystems-variable:
      title: 'System objects: Require case insensitivity for non-Windows subsystems'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: system_objects_require_case_insensitivity_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: system-objects-require-case-insensitivity-non-windows-subsystems-variable
          operation: equals
          datatype: int
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-system-objects-require-case-insensitivity-non-windows-subsystems-set-enabled:
      test_title: '''System objects: Require case insensitivity for non-Windows subsystems'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-system-objects-require-case-insensitivity-non-windows-subsystems-set-enabled
