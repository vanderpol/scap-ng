assessment:
  id: ng.shared.9d721a08b024154019b83590
  version: 1
  assessment_title: Data files owned by users must be on a different logical partition from the directory server data files.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    all-local-disk-volumes-collection:
      collection_title: All 'Local Disk' Volumes
      capability: windows.wmi
      select:
        namespace:
          operation: equals
          datatype: string
          mask: false
          value: root\cimv2
        wql:
          operation: equals
          datatype: string
          mask: false
          value: SELECT name FROM win32_logicaldisk WHERE drivetype=3
    get-local-shares-via-get-smbshare-exclude-netlogon-sysvol-admin-collection:
      collection_title: get local shares via get-smbshare, exclude NETLOGON AND SYSVOL and admin shares
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: get-smbshare-exclude-netlogon-sysvol-ipc-admin-admin-shares-variable
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: ' ([a-zA-Z]):\\'
    dsa-database-file-location-via-registry-collection:
      collection_title: DSA Database file location via registry
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Services\NTDS\Parameters
        name:
          operation: equals
          datatype: string
          mask: false
          value: DSA Database file
  variables:
    get-smbshare-exclude-netlogon-sysvol-ipc-admin-admin-shares-variable:
      title: get-smbshare, exclude NETLOGON AND SYSVOL IPC$ ADMIN$ and admin shares
      kind: local
      datatype: string
      expression:
        concat:
        - literal:
            value: get-smbshare | where-object {$_.Name -notin 'NETLOGON','SYSVOL','IPC$','ADMIN$','
            datatype: string
        - merge:
            values:
              concat:
              - substring:
                  value:
                    values:
                      collection: all-local-disk-volumes-collection
                      field: result
                  start: '1'
                  length: '1'
              - literal:
                  value: $'
                  datatype: string
            delimiter: ','''
            sort: document
            order: ascending
        - literal:
            value: '} | Select-Object -property name,PATH'
            datatype: string
    drive-letter-that-dsa-database-file-found-on-variable:
      title: Drive Letter that DSA Database file is found on
      kind: local
      datatype: string
      expression:
        substring:
          value:
            values:
              collection: dsa-database-file-location-via-registry-collection
              field: value
          start: '1'
          length: '1'
  tests:
    test-gather-shares-ensure-directory-doesn-t-match-dsa-database-file:
      test_title: Gather Shares and ensure directory doesn't match DSA Database File drive letter
      capability: independent.shellcommand
      collection: get-local-shares-via-get-smbshare-exclude-netlogon-sysvol-admin-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_operator: OR
        states:
        - state_title: results do not equal same drive letter
          capability: independent.shellcommand
          state:
            all:
            - field: shell
              value: powershell
              operation: equals
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            - field: subexpression
              value:
                variable: drive-letter-that-dsa-database-file-found-on-variable
              operation: case insensitive not equal
              datatype: string
              mask: false
              variable_check: all
              entity_check: all
              entity_existence: at_least_one_exists
        - state_title: stdout_line does not exist
          capability: independent.shellcommand
          state:
            field: stdout_line
            value: ''
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: none_exist
  evaluate:
    test: test-gather-shares-ensure-directory-doesn-t-match-dsa-database-file
