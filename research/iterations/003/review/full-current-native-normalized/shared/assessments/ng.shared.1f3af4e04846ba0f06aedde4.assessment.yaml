assessment:
  id: ng.shared.1f3af4e04846ba0f06aedde4
  version: 1
  assessment_title: The Oracle Linux operating system must require authentication upon booting into single-user and maintenance
    modes.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system must require authentication upon booting into single-user and maintenance modes.
    Check that the operating system requires authentication upon booting into single-user mode with the following command:
    # grep -i execstart /usr/lib/systemd/system/rescue.service | grep -i sulogin ExecStart=-/bin/sh -c "/usr/sbin/sulogin;
    /usr/bin/systemctl --fail --no-block default" If "ExecStart" does not have "/usr/sbin/sulogin" as an option, this is a
    finding.'
  inputs: []
  evidence: []
