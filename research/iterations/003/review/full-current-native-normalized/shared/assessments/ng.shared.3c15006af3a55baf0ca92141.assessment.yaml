assessment:
  id: ng.shared.3c15006af3a55baf0ca92141
  version: 1
  assessment_title: Anonymous Access to Network Shares
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: System\CurrentControlSet\Services\LanManServer\Parameters
        name:
          operation: equals
          datatype: string
          value: NullSessionShares
      object_title: null
  states:
    state-reg-multi-sz-type-and-value-is-blank:
      state_title: Reg_Multi_Sz type and value is blank
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_multi_sz
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: .+
          operation: pattern match
          datatype: string
          entity_check: none satisfy
          entity_existence: at_least_one_exists
  tests:
    test-network-access-shares-that-can-accessed-anonymously-blank:
      test_title: '''Network access: Shares that can be accessed anonymously'' is blank'
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-multi-sz-type-and-value-is-blank
    test-network-access-shares-that-can-accessed-anonymously-not-configured:
      test_title: '''Network access: Shares that can be accessed anonymously'' is not configured'
      capability: windows.registry
      object: windows-registry-object
      check_existence: none_exist
      check: all
  evaluate:
    any:
    - test: test-network-access-shares-that-can-accessed-anonymously-blank
    - test: test-network-access-shares-that-can-accessed-anonymously-not-configured
