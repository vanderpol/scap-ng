  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that existing passwords are restricted to a 60-day
    maximum lifetime.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Check whether the maximum time period for existing passwords is restricted to 60 days. # awk -F: ''$5 > 60 {print
    $1 " " $5}'' /etc/shadow If any results are returned that are not associated with a system account, this is a finding.'
  inputs: {}
  evidence: []
