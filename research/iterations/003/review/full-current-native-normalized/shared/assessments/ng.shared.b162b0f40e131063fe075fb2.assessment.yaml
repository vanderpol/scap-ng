assessment:
  id: ng.shared.b162b0f40e131063fe075fb2
  version: 1
  assessment_title: The operating system must protect the integrity of transmitted information.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    svcs-svc-network-ipsec-policy-default-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: svcs svc:/network/ipsec/policy:default
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: svc:\/network\/ipsec\/policy:default
      object_title: svcs svc:/network/ipsec/policy:default
  states:
    state-check-that-the-output-starts-with-online-with-an-exit-st:
      state_title: Check that the output starts with 'online' with an exit status of 0
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: ^online
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-operating-system-protect-integrity-transmitted-information:
      test_title: The operating system must protect the integrity of transmitted information.
      capability: independent.shellcommand
      object: svcs-svc-network-ipsec-policy-default-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-check-that-the-output-starts-with-online-with-an-exit-st
  evaluate:
    test: test-operating-system-protect-integrity-transmitted-information
