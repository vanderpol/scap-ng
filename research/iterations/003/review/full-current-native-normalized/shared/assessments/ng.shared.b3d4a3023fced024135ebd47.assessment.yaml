assessment:
  id: ng.shared.b3d4a3023fced024135ebd47
  version: 1
  assessment_title: UBTU-22-411010 - Ubuntu 22.04 LTS must prevent direct login into the root account.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    unix-shadow-collection:
      collection_title: null
      capability: unix.shadow
      select:
        username:
          operation: equals
          datatype: string
          mask: false
          value: root
  tests:
    test-root-account-locked:
      test_title: root account is locked
      capability: unix.shadow
      collection: unix-shadow-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: unix.shadow
        state:
          field: password
          value: ^!
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-root-account-locked
