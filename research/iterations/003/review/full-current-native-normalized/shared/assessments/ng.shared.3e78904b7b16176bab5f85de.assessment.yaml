assessment:
  id: ng.shared.3e78904b7b16176bab5f85de
  version: 1
  assessment_title: WN11-UR-000130 - The "Manage auditing and security log" user right must only be assigned to the Administrators
    group.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-userright-collection:
      collection_title: null
      capability: windows.userright
      select:
        userright:
          operation: equals
          datatype: string
          mask: false
          value: SE_SECURITY_NAME
  tests:
    test-manage-auditing-security-log-administrators:
      test_title: Manage auditing and security log - Administrators
      capability: windows.userright
      collection: windows-userright-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: null
          capability: windows.userright
          state:
            field: trustee_name
            value: ''
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: windows.userright
          state:
            field: trustee_name
            value: Administrators
            operation: case insensitive equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-manage-auditing-security-log-administrators
