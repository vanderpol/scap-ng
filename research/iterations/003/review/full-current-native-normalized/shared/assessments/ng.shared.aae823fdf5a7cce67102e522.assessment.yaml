assessment:
  id: ng.shared.aae823fdf5a7cce67102e522
  version: 1
  assessment_title: The Oracle Linux operating system must disable account identifiers (individuals, groups, roles, and devices)
    if the password expires.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If passwords are not being used for authentication, this is Not Applicable. Verify the operating system disables
    account identifiers (individuals, groups, roles, and devices) after the password has expired with the following command:
    # grep -i inactive /etc/default/useradd INACTIVE=35 If "INACTIVE" is set to "-1", a value greater than "35", is commented
    out, or is not defined, this is a finding.'
  inputs: []
  evidence: []
