assessment:
  id: ng.shared.4316691e22513a6f3be730d9
  version: 1
  assessment_title: OL 8 systems, version 8.4 and above, must ensure the password complexity module is configured for three
    retries or less.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    check-that-pwquality-conf-files-allow-maximum-3-retries-collection:
      collection_title: Check that pwquality.conf files allow maximum of 3 retries.
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/security/pwquality.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(\s*retry\s*=\s*\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    check-that-pwquality-files-allow-maximum-3-retries-collection:
      collection_title: Check that pwquality files allow maximum of 3 retries.
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/security/pwquality.conf.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .+
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(\s*retry\s*=\s*\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    check-that-pwquality-files-allow-maximum-3-retries-collection-2:
      collection_title: Check that pwquality files allow maximum of 3 retries.
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/pam.d/system-auth
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[ \t]*password\s+(.*\sretry.*)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    check-that-pwquality-files-allow-maximum-3-retries-collection-3:
      collection_title: Check that pwquality files allow maximum of 3 retries.
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/pam.d/password-auth
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[ \t]*password\s+(.*\sretry.*)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        multiline: 'true'
  tests:
    test-check-that-pwquality-conf-file-configured-three-or-fewer-retries:
      test_title: Check that pwquality.conf file is configured for three or fewer retries.
      capability: independent.textfilecontent54
      collection: check-that-pwquality-conf-files-allow-maximum-3-retries-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Confirm retry value is 1-3.
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^\s*retry\s*=\s*[123]$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-check-that-files-in-etc-security-pwquality-conf-d-configured:
      test_title: Check that files in /etc/security/pwquality.conf.d are configured for three or fewer retries.
      capability: independent.textfilecontent54
      collection: check-that-pwquality-files-allow-maximum-3-retries-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Confirm retry value is 1-3.
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^\s*retry\s*=\s*[123]$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-no-retry-entries-allowed-in-etc-pam-d-system-auth:
      test_title: No 'retry' entries allowed in /etc/pam.d/system-auth or password-auth files.
      capability: independent.textfilecontent54
      collection: check-that-pwquality-files-allow-maximum-3-retries-collection-2
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
    test-no-retry-entries-allowed-in-etc-pam-d-system-auth-2:
      test_title: No 'retry' entries allowed in /etc/pam.d/system-auth or password-auth files.
      capability: independent.textfilecontent54
      collection: check-that-pwquality-files-allow-maximum-3-retries-collection-3
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
  evaluate:
    all:
    - any:
      - test: test-check-that-pwquality-conf-file-configured-three-or-fewer-retries
      - test: test-check-that-files-in-etc-security-pwquality-conf-d-configured
    - all:
      - test: test-no-retry-entries-allowed-in-etc-pam-d-system-auth
      - test: test-no-retry-entries-allowed-in-etc-pam-d-system-auth-2
