assessment:
  id: ng.shared.508d541579dfa482f8ccc7c5
  version: 1
  assessment_title: Kernel core dumps must be disabled unless needed.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    dumpadm-show-savecore-enabled-line-collection:
      collection_title: dumpadm, show Savecore enabled line
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: dumpadm
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: Savecore enabled
  tests:
    test-kernel-core-dumps-disabled-unless-needed:
      test_title: Kernel core dumps must be disabled unless needed.
      capability: independent.shellcommand
      collection: dumpadm-show-savecore-enabled-line-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Savecore enabled should report 'no'
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: 'no'
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-kernel-core-dumps-disabled-unless-needed
