assessment:
  id: ng.shared.3911eda4c081e45590661a4a
  version: 1
  assessment_title: The macOS system must be configured to audit all deletions of object attributes.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to audit all deletions of object attributes with the following command:
    /usr/bin/awk -F'':'' ''/^flags/ { print $NF }'' /etc/security/audit_control | /usr/bin/tr '','' ''\n'' | /usr/bin/grep
    -Ec ''\-fd'' If the result is not "1", this is a finding.'
  inputs: {}
  evidence: []
