  version: 1
  assessment_title: The macOS system must disable proximity-based password sharing requests.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable proximity-based password sharing requests with the following
    command: /usr/bin/osascript -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\
    .objectForKey(''allowPasswordProximityRequests'').js EOS If the result is not "false", this is a finding.'
  inputs: []
  evidence: []
