assessment:
  id: ng.shared.0ecb625ca8f1fd942cf8a015
  version: 1
  assessment_title: Unauthorized remotely accessible registry paths and sub-paths must not be configured.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding: Registry
    Hive: HKEY_LOCAL_MACHINE Registry Path: \System\CurrentControlSet\Control\SecurePipeServers\Winreg\AllowedPaths\ Value
    Name: Machine Value Type: REG_MULTI_SZ Value: see below Software\Microsoft\OLAP Server Software\Microsoft\Windows NT\CurrentVersion\Perflib
    Software\Microsoft\Windows NT\CurrentVersion\Print Software\Microsoft\Windows NT\CurrentVersion\Windows System\CurrentControlSet\Control\ContentIndex
    System\CurrentControlSet\Control\Print\Printers System\CurrentControlSet\Control\Terminal Server System\CurrentControlSet\Control\Terminal
    Server\UserConfig System\CurrentControlSet\Control\Terminal Server\DefaultUserConfiguration System\CurrentControlSet\Services\Eventlog
    System\CurrentControlSet\Services\Sysmonlog Legitimate applications may add entries to this registry value. If an application
    requires these entries to function properly and is documented with the ISSO, this would not be a finding. Documentation
    must contain supporting information from the vendor''s instructions.'
  inputs: []
  evidence: []
