assessment:
  id: ng.shared.d7e056659e0e1c64fe75b7e8
  version: 1
  assessment_title: Software certificate installation files must be removed from Windows Server 2016.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    search-p12-files-object:
      capability: windows.file
      select:
        path:
          operation: pattern match
          datatype: string
          value: .*
        filename:
          operation: pattern match
          datatype: string
          value: \.[Pp]12$
      filters:
      - action: exclude
        state: state-preflight-p12-adobe-file-should-not-report-failure
      behaviors:
        max_depth: '-1'
        recurse_direction: down
      object_title: Search for .p12 files
    search-pfx-files-object:
      capability: windows.file
      select:
        path:
          operation: pattern match
          datatype: string
          value: .*
        filename:
          operation: pattern match
          datatype: string
          value: \.[Pp][Ff][Xx]$
      behaviors:
        max_depth: '-1'
        recurse_direction: down
      object_title: Search for .pfx files
  states:
    state-preflight-p12-adobe-file-should-not-report-failure:
      state_title: Preflight.p12 Adobe file should not report failure
      capability: windows.file
      state:
        field: filepath
        value: '[Aa]dobe.+Preflight\.p12$'
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-software-certificate-installation-files-removed-p12-files:
      test_title: Software certificate installation files must be removed. .p12 files
      capability: windows.file
      object: search-p12-files-object
      check_existence: none_exist
      check: all
    test-software-certificate-installation-files-removed-pfx-files:
      test_title: Software certificate installation files must be removed. .pfx  files
      capability: windows.file
      object: search-pfx-files-object
      check_existence: none_exist
      check: all
  evaluate:
    all:
    - test: test-software-certificate-installation-files-removed-p12-files
    - test: test-software-certificate-installation-files-removed-pfx-files
