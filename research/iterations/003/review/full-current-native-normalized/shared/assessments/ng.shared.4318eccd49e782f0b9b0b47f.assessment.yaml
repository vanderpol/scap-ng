assessment:
  id: ng.shared.4318eccd49e782f0b9b0b47f
  version: 1
  assessment_title: UBTU-22-271010 - Ubuntu 22.04 LTS must enable the graphical user logon banner to display the Standard
    Mandatory DOD Notice and Consent Banner before granting local access to the system via a graphical user logon.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/gdm3/greeter.dconf-defaults
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*banner-message-enable\s*=\s*(\w+)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-etc-gdm3-greeter-dconf-defaults-banner-message-enable-set-true:
      test_title: /etc/gdm3/greeter.dconf-defaults banner-message-enable is set to true
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: 'true'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-etc-gdm3-greeter-dconf-defaults-banner-message-enable-set-true
