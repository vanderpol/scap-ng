assessment:
  id: ng.shared.c6450b234f35baf172d92b79
  version: 1
  assessment_title: The Smart Card removal option must be configured to Force Logoff or Lock Workstation.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding: Registry
    Hive: HKEY_LOCAL_MACHINE Registry Path: \Software\Microsoft\Windows NT\CurrentVersion\Winlogon\ Value Name: SCRemoveOption
    Value Type: REG_SZ Value: 1 (Lock Workstation) or 2 (Force Logoff) If configuring this on servers causes issues such as
    terminating users'' remote sessions and the site has a policy in place that any other sessions on the servers such as
    administrative console logons, are manually locked or logged off when unattended or not in use, this would be acceptable.
    This must be documented with the ISSO.'
  inputs: []
  evidence: []
