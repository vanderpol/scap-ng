assessment:
  id: ng.shared.afcf87aae0093deb282d8902
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that all local initialization files have mode
    0740 or less permissive.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that all local initialization files have a mode of "0740" or less permissive. Check the mode on all local
    initialization files with the following command: Note: The example will be for the "smithj" user, who has a home directory
    of "/home/smithj". # ls -al /home/smithj/.[^.]* | more -rw-------. 1 smithj users 2984 Apr 27 19:02 .bash_history -rw-r--r--.
    1 smithj users 18 Aug 21 2019 .bash_logout -rw-r--r--. 1 smithj users 193 Aug 21 2019 .bash_profile If any local initialization
    files have a mode more permissive than "0740", this is a finding.'
  inputs: []
  evidence: []
