assessment:
  id: ng.shared.5c189f7c57064471a247c477
  version: 1
  assessment_title: The Create a token object user right must not be assigned to any groups or accounts.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy
    >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment. If any
    groups or accounts are granted the "Create a token object" user right, this is a finding.
  inputs: {}
  evidence: []
