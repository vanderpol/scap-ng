assessment:
  id: ng.shared.4a0040ffd92c13df4f5657bb
  version: 1
  assessment_title: AZLX-23-001206 - The Amazon Linux 2023 SSH client must be configured to use only DOD-approved encryption
    ciphers employing FIPS 140-3-validated cryptographic hash algorithms to protect the confidentiality of SSH client connections.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/crypto-policies/back-ends/openssh.config
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*(?i)Ciphers(?-i)[ \t]+(\S+)[\s]*(?:|(?:#.*))?$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: aes256-gcm@openssh.com,aes256-ctr,aes128-gcm@openssh.com,aes128-ctr
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54-2:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '"aes256-gcm@openssh.com,aes256-ctr,aes128-gcm@openssh.com,aes128-ctr"'
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-openssh-config-ciphers-correct:
      test_title: openssh.config ciphers correct
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-independent-textfilecontent54
      - state-independent-textfilecontent54-2
  evaluate:
    test: test-openssh-config-ciphers-correct
