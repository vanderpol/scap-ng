assessment:
  id: ng.shared.01bb25e47d97130583bafd1b
  version: 1
  assessment_title: The Oracle Linux operating system must use a file integrity tool that is configured to use FIPS 140-2
    approved cryptographic hashes for validating file contents and directories.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the file integrity tool is configured to use FIPS 140-2-approved cryptographic hashes for validating
    file contents and directories. Note: AIDE is highly configurable at install time. These commands assume the "aide.conf"
    file is under the "/etc" directory. Use the following command to determine if the file is in another location: # find
    / -name aide.conf Check the "aide.conf" file to determine if the "sha512" rule has been added to the rule list being applied
    to the files and directories selection lists. Exclude any log files, or files expected to change frequently, to reduce
    unnecessary notifications. An example rule that includes the "sha512" rule follows: All=p+i+n+u+g+s+m+S+sha512+acl+xattrs+selinux
    /bin All # apply the custom rule to the files in bin /sbin All # apply the same custom rule to the files in sbin If the
    "sha512" rule is not being used on all uncommented selection lines in the "/etc/aide.conf" file, or another file integrity
    tool is not using FIPS 140-2-approved cryptographic hashes for validating file contents and directories, this is a finding.'
  inputs: []
  evidence: []
