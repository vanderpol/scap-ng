assessment:
  id: ng.shared.9bfffe7cd187a7a7b00c6f58
  version: 1
  assessment_title: The macOS system must allow smart card authentication.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    auth-smartcard-allow-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: zsh
        command:
          operation: equals
          datatype: string
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.security.smartcard'')\

            .objectForKey(''allowSmartCard'').js

            EOS'
      object_title: auth_smartcard_allow_recommended_object
  states:
    state-auth-smartcard-allow-recommended-state:
      state_title: auth_smartcard_allow_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: 'true'
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-auth-smartcard-allow-recommended-test:
      test_title: auth_smartcard_allow_recommended_test
      capability: independent.shellcommand
      object: auth-smartcard-allow-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-auth-smartcard-allow-recommended-state
  evaluate:
    test: test-auth-smartcard-allow-recommended-test
