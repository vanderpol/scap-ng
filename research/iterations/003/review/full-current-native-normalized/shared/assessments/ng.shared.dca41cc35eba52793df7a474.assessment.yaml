assessment:
  id: ng.shared.dca41cc35eba52793df7a474
  version: 1
  assessment_title: The macOS system must be configured to prevent users from erasing all system content and settings.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    os-erase-content-settings-disable-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: zsh
        command:
          operation: equals
          datatype: string
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\

            .objectForKey(''allowEraseContentAndSettings'').js

            EOS'
      object_title: os_erase_content_and_settings_disable_recommended_object
  states:
    state-os-erase-content-and-settings-disable-recommended-state:
      state_title: os_erase_content_and_settings_disable_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: 'false'
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-os-erase-content-settings-disable-recommended-test:
      test_title: os_erase_content_and_settings_disable_recommended_test
      capability: independent.shellcommand
      object: os-erase-content-settings-disable-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-os-erase-content-and-settings-disable-recommended-state
  evaluate:
    test: test-os-erase-content-settings-disable-recommended-test
