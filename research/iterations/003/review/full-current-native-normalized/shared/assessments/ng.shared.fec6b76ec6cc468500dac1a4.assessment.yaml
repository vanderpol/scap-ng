assessment:
  id: ng.shared.fec6b76ec6cc468500dac1a4
  version: 1
  assessment_title: UBTU-22-232100 - Ubuntu 22.04 LTS must be configured so that the "journalctl" command is owned by "root".
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-file-object:
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          value: /usr/bin/journalctl
      object_title: null
  states:
    state-owned-by-root:
      state_title: owned by root
      capability: unix.file
      state:
        field: user_id
        value: '0'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-usr-bin-journalctl-command-owned-by-root:
      test_title: /usr/bin/journalctl command is owned by root
      capability: unix.file
      object: unix-file-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-owned-by-root
  evaluate:
    test: test-usr-bin-journalctl-command-owned-by-root
