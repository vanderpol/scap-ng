assessment:
  id: ng.shared.ba9b762fc1af526e9723e417
  version: 1
  assessment_title: Windows Explorer - Heap Termination
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: Software\Policies\Microsoft\Windows\Explorer
        name:
          operation: equals
          datatype: string
          value: NoHeapTerminationOnCorruption
      object_title: null
  variables:
    turn-off-heap-termination-on-corruption-variable:
      title: Turn off Heap termination on corruption
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: turn_off_heap_termination_corruption_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: turn-off-heap-termination-on-corruption-variable
          operation: equals
          datatype: int
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-turn-off-heap-termination-on-corruption-set-disabled:
      test_title: '''Turn off heap termination on corruption'' is set to ''Disabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-turn-off-heap-termination-on-corruption-set-disabled
