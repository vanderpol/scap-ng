assessment:
  id: ng.shared.af5859d5fb63f81b1548f7c2
  version: 1
  assessment_title: SQL Server must provide non-privileged users with error messages that provide information necessary for
    corrective actions without revealing information that could be exploited by adversaries.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Review application behavior and custom database code (stored procedures, triggers), to determine whether error
    messages contain information beyond what is needed for explaining the issue to general users. If database error messages
    contain PII data, sensitive business data, or information useful for identifying the host system or database structure,
    this is a finding.
  inputs: []
  evidence: []
