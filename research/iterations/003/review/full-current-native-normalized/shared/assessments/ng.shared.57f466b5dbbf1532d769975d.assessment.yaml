assessment:
  id: ng.shared.57f466b5dbbf1532d769975d
  version: 1
  assessment_title: The directory service must be configured to terminate LDAP-based network connections to the directory
    server after 5 minutes of inactivity.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    gather-fully-qualified-ldap-name-domain-being-reviewed-via-powershell-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: powershell
        command:
          operation: equals
          datatype: string
          value: ([ADSI]"LDAP://RootDSE").rootDomainNamingContext
      object_title: Gather fully qualified LDAP name of the domain being reviewed via powershell
    review-maxconnidletime-setting-via-command-line-dsquery-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: cmd
        command:
          operation: equals
          datatype: string
          variable_check: all
          value:
            variable: dsquery-command-used-gather-maxconnidletime-variable
        pattern:
          operation: equals
          datatype: string
          value: MaxConnIdleTime=(\d+)
      object_title: Review MaxConnIdleTime setting via command line dsquery
  variables:
    dsquery-command-used-gather-maxconnidletime-variable:
      title: The dsquery command used to gather MaxConnIdleTime
      kind: local
      datatype: string
      expression:
        concat:
        - literal:
            value: dsquery * "cn=Default Query Policy,cn=Query-Policies,cn=Directory Service, cn=Windows NT,cn=Services,cn=Configuration,
            datatype: string
        - values:
            object: gather-fully-qualified-ldap-name-domain-being-reviewed-via-powershell-object
            field: stdout_line
        - literal:
            value: '" -attr LDAPAdminLimits'
            datatype: string
  states:
    state-maxconnidletime-less-than-or-equal-to-300:
      state_title: MaxConnIdleTime less than or equal to 300
      capability: independent.shellcommand
      state:
        all:
        - field: shell
          value: cmd
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: subexpression
          value: '300'
          operation: less than or equal
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-review-maxconnidletime-setting-via-command-line-dsquery:
      test_title: Review MaxConnIdleTime setting via command line dsquery
      capability: independent.shellcommand
      object: review-maxconnidletime-setting-via-command-line-dsquery-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-maxconnidletime-less-than-or-equal-to-300
  evaluate:
    test: test-review-maxconnidletime-setting-via-command-line-dsquery
