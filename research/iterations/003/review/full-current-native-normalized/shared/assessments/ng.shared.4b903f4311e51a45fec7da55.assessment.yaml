assessment:
  id: ng.shared.4b903f4311e51a45fec7da55
  version: 1
  assessment_title: The macOS system must monitor remote access methods and generate audit records when successful/unsuccessful
    attempts to access/modify privileges occur.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    audit-flags-lo-configure-recommended-object-collection:
      collection_title: audit_flags_lo_configure_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/bin/awk -F':' '/^flags/ { print $NF }' /etc/security/audit_control | /usr/bin/tr ',' '\n' | /usr/bin/grep
            -Ec '^lo'
  tests:
    test-audit-flags-lo-configure-recommended-test:
      test_title: audit_flags_lo_configure_recommended_test
      capability: independent.shellcommand
      collection: audit-flags-lo-configure-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: audit_flags_lo_configure_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: '1'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-audit-flags-lo-configure-recommended-test
