assessment:
  id: ng.shared.7d146acad12554a91eff9f06
  version: 1
  assessment_title: UAC - Non UAC Compliant Application Virtualization
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Microsoft\Windows\CurrentVersion\Policies\System
        name:
          operation: equals
          datatype: string
          mask: false
          value: EnableVirtualization
      object_title: null
  variables:
    virtualize-file-registry-write-failures-per-user-locations-variable:
      title: Virtualize file and registry write failures to per-user locations
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: virtualize_write_failures_per_user_locations_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: virtualize-file-registry-write-failures-per-user-locations-variable
          operation: equals
          datatype: int
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-user-account-control-virtualize-file-registry-write-failures-per-user:
      test_title: '''User Account Control: Virtualize file and registry write failures to per-user locations'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-user-account-control-virtualize-file-registry-write-failures-per-user
