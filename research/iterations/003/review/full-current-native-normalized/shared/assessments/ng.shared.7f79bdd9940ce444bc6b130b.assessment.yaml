assessment:
  id: ng.shared.7f79bdd9940ce444bc6b130b
  version: 1
  assessment_title: Autoplay for non-volume devices
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\Windows\Explorer
        name:
          operation: equals
          datatype: string
          mask: false
          value: NoAutoplayfornonVolume
  variables:
    turn-off-autoplay-non-volume-devices-variable:
      title: Turn off Autoplay for non-volume devices
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: turn_off_autoplay_for_non_volume_devices_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-disallow-autoplay-non-volume-devices-set-enabled:
      test_title: '''Disallow Autoplay for non-volume devices'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: turn-off-autoplay-non-volume-devices-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-disallow-autoplay-non-volume-devices-set-enabled
