assessment:
  id: ng.shared.2ec7d09484c4bca151151333
  version: 1
  assessment_title: AZLX-23-001020 - Amazon Linux 2023 must require users to provide a password for privilege escalation.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/sudoers
        pattern:
          operation: pattern match
          datatype: string
          value: ^(?!#).*\s+NOPASSWD.*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      behaviors:
        ignore_case: 'true'
      object_title: null
    independent-textfilecontent54-object-2:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/sudoers.d
        filename:
          operation: pattern match
          datatype: string
          value: ^.*$
        pattern:
          operation: pattern match
          datatype: string
          value: ^(?!#).*\s+NOPASSWD.*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      behaviors:
        ignore_case: 'true'
        recurse_direction: down
      object_title: null
  states: {}
  tests:
    test-nopasswd-does-not-exist-in-etc-sudoers:
      test_title: '''NOPASSWD'' does not exist in /etc/sudoers'
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: none_exist
      check: all
    test-nopasswd-does-not-exist-in-etc-sudoers-d:
      test_title: '''NOPASSWD'' does not exist in /etc/sudoers.d'
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-2
      check_existence: none_exist
      check: all
  evaluate:
    all:
    - test: test-nopasswd-does-not-exist-in-etc-sudoers
    - test: test-nopasswd-does-not-exist-in-etc-sudoers-d
