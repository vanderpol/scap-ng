assessment:
  id: ng.shared.462f8767fc5b6c79f5d8276c
  version: 1
  assessment_title: OL08-00-020032 - OL 8 must disable the user list at logon for graphical user interfaces.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/dconf/db/local.d
        filename:
          operation: pattern match
          datatype: string
          value: .+
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*\[org\/gnome\/login-screen]\s*\n+[^\[]*disable-user-list\s*=\s*(\w+)$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: 'true'
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-disables-gui-user-list-feature:
      test_title: The system disables the GUI user list feature.
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    test: test-system-disables-gui-user-list-feature
