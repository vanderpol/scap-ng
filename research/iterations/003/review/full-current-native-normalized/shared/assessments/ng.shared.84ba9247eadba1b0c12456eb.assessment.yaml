assessment:
  id: ng.shared.84ba9247eadba1b0c12456eb
  version: 1
  assessment_title: Permissions for the system drive root directory (usually C:\) must conform to minimum requirements.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    everyoneincludesanonymous-configured-collection:
      collection_title: everyoneincludesanonymous must be configured
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Control\Lsa
        name:
          operation: equals
          datatype: string
          mask: false
          value: everyoneincludesanonymous
    run-icacls-command-against-system-drive-root-directory-collection:
      collection_title: Run Icacls command against system drive root directory
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: icacls($env:SystemDrive + '\')
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: ':'
  variables:
    required-permissions-variable:
      title: Required Permissions
      kind: constant
      datatype: string
      expression:
        literal:
        - (?i)NT AUTHORITY\\SYSTEM:\(OI\)\(CI\)\(F\)
        - (?i)BUILTIN\\Administrators:\(OI\)\(CI\)\(F\)
        - (?i)BUILTIN\\Users:\(OI\)\(CI\)\(RX\)
        - (?i)BUILTIN\\Users:\(CI\)\(AD\)
        - (?i)BUILTIN\\Users:\(CI\)\(IO\)\(WD\)
        - (?i)CREATOR OWNER:\(OI\)\(CI\)\(IO\)\(F\)
  tests:
    test-network-access-let-everyone-permissions-apply-anonymous-users-set-disabled:
      test_title: 'Network access: Let Everyone permissions apply to anonymous users is set to ''Disabled'''
      capability: windows.registry
      collection: everyoneincludesanonymous-configured-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: only one
        state_title: Value must be equal to 0
        state_capability: windows.registry
        state:
          field: value
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-permissions-conform-minimum-requirements:
      test_title: Permissions must conform to minimum requirements.
      capability: independent.shellcommand
      collection: run-icacls-command-against-system-drive-root-directory-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Permissions must equal expected output
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value:
              variable: required-permissions-variable
            operation: pattern match
            datatype: string
            mask: false
            variable_check: at least one
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stderr_line
            value: ''
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: none_exist
  evaluate:
    all:
    - test: test-network-access-let-everyone-permissions-apply-anonymous-users-set-disabled
    - test: test-permissions-conform-minimum-requirements
