assessment:
  id: ng.shared.b93c6acbd44ba423a3534042
  version: 1
  assessment_title: The macOS system must set minimum password lifetime to 24 hours.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to set minimum password lifetime to 24 hours with the following command:
    /usr/bin/pwpolicy -getaccountpolicies 2> /dev/null | /usr/bin/tail +2 | /usr/bin/xmllint --xpath ''//dict/key[text()="policyAttributeMinimumLifetimeHours"]/following-sibling::integer[1]/text()''
    - | /usr/bin/awk ''{ if ($1 >= 24 ) {print "yes"} else {print "no"}}'' If the result is not "yes", this is a finding.'
  inputs: []
  evidence: []
