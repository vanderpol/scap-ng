assessment:
  id: ng.shared.6840135270b1cf9c46bb6421
  version: 1
  assessment_title: The system must disable accounts after three consecutive unsuccessful login attempts.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RETRIES is set in the login file. # grep ^RETRIES /etc/default/login If the output is not RETRIES=3 or
    fewer, this is a finding. Verify the account locks after invalid login attempts. # grep ^LOCK_AFTER_RETRIES /etc/security/policy.conf
    If the output is not LOCK_AFTER_RETRIES=YES, this is a finding. For each user in the system, use the command: # userattr
    lock_after_retries [username] to determine if the user overrides the system value. If the output of this command is "no",
    this is a finding.'
  inputs: []
  evidence: []
