assessment:
  id: ng.shared.dba643faf5cd128ecf5a69cf
  version: 1
  assessment_title: File system automounter must be disabled unless required.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    check-automount-object:
      capability: unix.process58
      select:
        command_line:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(/usr)?/sbin/automount.*
        pid:
          operation: greater than
          datatype: int
          mask: false
          value: '1'
      object_title: check for automount
  states: {}
  tests:
    test-check-automount:
      test_title: check for automount
      capability: unix.process58
      object: check-automount-object
      check_existence: none_exist
      check: all
  evaluate:
    test: test-check-automount
