assessment:
  id: ng.shared.c06335b720c5f18c0a69669e
  version: 1
  assessment_title: Windows Server 2019 computer clock synchronization tolerance must be limited to five minutes or less.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This applies to domain controllers. It is NA for other systems. Verify the following is configured in the Default
    Domain Policy: Open "Group Policy Management". Navigate to "Group Policy Objects" in the Domain being reviewed (Forest
    >> Domains >> Domain). Right-click on the "Default Domain Policy". Select "Edit". Navigate to Computer Configuration >>
    Policies >> Windows Settings >> Security Settings >> Account Policies >> Kerberos Policy. If the "Maximum tolerance for
    computer clock synchronization" is greater than "5" minutes, this is a finding.'
  inputs: []
  evidence: []
