assessment:
  id: ng.shared.ddca6dd18ec4229199562d6a
  version: 1
  assessment_title: The macOS system must be configured to audit all failed program execution on the system.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to audit all failed program execution on the system with the following
    command: /usr/bin/awk -F'':'' ''/^flags/ { print $NF }'' /etc/security/audit_control | /usr/bin/tr '','' ''\n'' | /usr/bin/grep
    -Ec ''\-ex'' If the result is not "1", this is a finding.'
  inputs: {}
  evidence: []
