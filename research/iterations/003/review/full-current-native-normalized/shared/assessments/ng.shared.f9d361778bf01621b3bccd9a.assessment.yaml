assessment:
  id: ng.shared.f9d361778bf01621b3bccd9a
  version: 1
  assessment_title: The macOS system must disable root logon for SSH.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    os-sshd-permit-root-login-configure-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/sbin/sshd -G | /usr/bin/awk '/permitrootlogin/{print $2}'
      object_title: os_sshd_permit_root_login_configure_recommended_object
  states:
    state-os-sshd-permit-root-login-configure-recommended-state:
      state_title: os_sshd_permit_root_login_configure_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: 'no'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-os-sshd-permit-root-login-configure-recommended-test:
      test_title: os_sshd_permit_root_login_configure_recommended_test
      capability: independent.shellcommand
      object: os-sshd-permit-root-login-configure-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-os-sshd-permit-root-login-configure-recommended-state
  evaluate:
    test: test-os-sshd-permit-root-login-configure-recommended-test
