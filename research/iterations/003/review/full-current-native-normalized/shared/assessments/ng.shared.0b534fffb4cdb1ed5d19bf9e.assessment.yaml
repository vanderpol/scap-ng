assessment:
  id: ng.shared.0b534fffb4cdb1ed5d19bf9e
  version: 1
  assessment_title: WN10-SO-000045 - Outgoing secure channel traffic must be signed when possible.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Services\Netlogon\Parameters
        name:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: SignSecureChannel
  tests:
    test-outgoing-secure-channel-traffic-signed:
      test_title: Outgoing secure channel traffic is signed.
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-outgoing-secure-channel-traffic-signed
