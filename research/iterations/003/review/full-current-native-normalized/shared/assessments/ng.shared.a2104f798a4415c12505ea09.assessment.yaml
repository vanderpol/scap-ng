assessment:
  id: ng.shared.a2104f798a4415c12505ea09
  version: 1
  assessment_title: Security configuration tools or equivalent processes must be used to configure and maintain platforms
    for security compliance.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify security configuration tools or equivalent processes are being used to configure Windows systems to meet
    security requirements. If security configuration tools or equivalent processes are not used, this is a finding. Security
    configuration tools that are integrated into Windows, such as Group Policies and Security Templates, may be used to configure
    platforms for security compliance. If an alternate method is used to configure a system (e.g., manually using the DISA
    Windows Security STIGs, etc.) and the same configured result is achieved, this is acceptable.
  inputs: []
  evidence: []
