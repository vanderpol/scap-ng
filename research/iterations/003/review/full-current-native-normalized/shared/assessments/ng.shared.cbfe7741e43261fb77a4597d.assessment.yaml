assessment:
  id: ng.shared.cbfe7741e43261fb77a4597d
  version: 1
  assessment_title: The Oracle Linux operating system must lock the associated account after three unsuccessful root logon
    attempts are made within a 15-minute period.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system automatically locks the root account, for a minimum of 15 minutes, when three unsuccessful
    logon attempts in 15 minutes are made. # grep pam_faillock.so /etc/pam.d/password-auth auth required pam_faillock.so preauth
    silent audit deny=3 even_deny_root fail_interval=900 unlock_time=900 auth [default=die] pam_faillock.so authfail audit
    deny=3 even_deny_root fail_interval=900 unlock_time=900 account required pam_faillock.so If the "even_deny_root" setting
    is not defined on both lines with the "pam_faillock.so" module, is commented out, or is missing from a line, this is a
    finding. # grep pam_faillock.so /etc/pam.d/system-auth auth required pam_faillock.so preauth silent audit deny=3 even_deny_root
    fail_interval=900 unlock_time=900 auth [default=die] pam_faillock.so authfail audit deny=3 even_deny_root fail_interval=900
    unlock_time=900 account required pam_faillock.so If the "even_deny_root" setting is not defined on both lines with the
    "pam_faillock.so" module, is commented out, or is missing from a line, this is a finding.'
  inputs: []
  evidence: []
