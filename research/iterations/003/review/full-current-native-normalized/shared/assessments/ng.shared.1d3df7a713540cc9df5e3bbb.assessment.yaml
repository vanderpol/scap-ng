  procedure: 'Confirm that the interactive user account passwords are using a strong password hash with the following command:
    $ sudo cut -d: -f1,2 /etc/shadow nsauser:$6$kcOnRq/5$NUEYPuyL.wghQwWssXRcLRFiiru7f5JPV6GaJhNC2aK5F3PZpE/BCCtwrxRc/AInKMNX3CdMw11m9STiql12f/
