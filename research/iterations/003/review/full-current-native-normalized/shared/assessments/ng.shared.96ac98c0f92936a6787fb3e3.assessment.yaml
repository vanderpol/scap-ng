assessment:
  id: ng.shared.96ac98c0f92936a6787fb3e3
  version: 1
  assessment_title: FTP servers must be configured to prevent access to the system drive.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: If FTP is not installed on the system, this is NA. Open "Internet Information Services (IIS) Manager". Select
    "Sites" under the server name. For any sites with a Binding that lists FTP, right-click the site and select "Explore".
    If the site is not defined to a specific folder for shared FTP resources, this is a finding. If the site includes any
    system areas such as root of the drive, Program Files, or Windows directories, this is a finding.
  inputs: []
  evidence: []
