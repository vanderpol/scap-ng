assessment:
  id: ng.shared.10a97c5b05248afd0512e0e2
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that the audit system takes appropriate action
    when the audit storage volume is full.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the action the operating system takes if the disk the audit records are written to becomes full. To determine
    the action that takes place if the disk is full on the remote server, use the following command: # grep -i disk_full_action
    /etc/audisp/audisp-remote.conf disk_full_action = single If the value of the "disk_full_action" option is not "syslog",
    "single", or "halt", or the line is commented out, ask the System Administrator to indicate how the audit logs are off-loaded
    to a different system or storage media, and to indicate the action taken when the disk is full on the remote server. If
    there is no evidence that the system is configured to off-load audit logs to a different system or storage media, or if
    the configuration does not take appropriate action when the disk is full on the remote server, this is a finding.'
  inputs: {}
  evidence: []
