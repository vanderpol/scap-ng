assessment:
  id: ng.shared.1c0d8bbc8f43ad3d35058b53
  version: 1
  assessment_title: When updates are applied to SQL Server software, any software components that have been replaced or made
    unnecessary must be removed.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    sql-2016-bootstrap-setup-directory-collection:
      collection_title: SQL 2016 Bootstrap Setup directory
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Microsoft SQL Server\130\Bootstrap
        name:
          operation: equals
          datatype: string
          mask: false
          value: BootstrapDir
    sql-2016-setup-bootstrap-log-exist-collection:
      collection_title: SQL 2016 Setup Bootstrap Log must exist
      capability: windows.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: sql-2016-setup-bootstrap-log-summary-txt-file-variable
    gather-sql-2016-installed-product-features-collection:
      collection_title: Gather SQL 2016 Installed Product Features
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: sql-2016-setup-bootstrap-log-summary-txt-file-variable
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^  SQL Server 2016      .*
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-sqlext-collection:
      collection_title: null
      capability: independent.sqlext
      select:
        engine:
          operation: equals
          datatype: string
          mask: false
          value: sqlserver
        version:
          operation: pattern match
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: microsoft-sql-server-version-2016-2019-variable
        instance:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        database:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
        sql:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
      behaviors:
        context: instance
    sql-2017-bootstrap-setup-log-directory-collection:
      collection_title: SQL 2017 Bootstrap Setup Log directory
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Microsoft SQL Server\140\Bootstrap
        name:
          operation: equals
          datatype: string
          mask: false
          value: BootstrapDir
    sql-2017-setup-bootstrap-log-exist-collection:
      collection_title: SQL 2017 Setup Bootstrap Log must exist
      capability: windows.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: sql-2017-setup-bootstrap-log-summary-txt-file-variable
    gather-sql-2017-installed-product-features-collection:
      collection_title: Gather SQL 2017 Installed Product Features
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: sql-2017-setup-bootstrap-log-summary-txt-file-variable
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^  SQL Server 2017      .*
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-sqlext-collection-2:
      collection_title: null
      capability: independent.sqlext
      select:
        engine:
          operation: equals
          datatype: string
          mask: false
          value: sqlserver
        version:
          operation: pattern match
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: microsoft-sql-server-version-2016-2019-variable
        instance:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        database:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
        sql:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
      behaviors:
        context: instance
    sql-2019-bootstrap-setup-log-directory-collection:
      collection_title: SQL 2019 Bootstrap Setup Log directory
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Microsoft SQL Server\150\Bootstrap
        name:
          operation: equals
          datatype: string
          mask: false
          value: BootstrapDir
    sql-2019-setup-bootstrap-log-exist-run-sql-server-installed-collection:
      collection_title: SQL 2019 Setup Bootstrap Log must exist (run SQL Server 'Installed SQL Server features discovery report'
        if not found)
      capability: windows.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: sql-2019-setup-bootstrap-log-summary-txt-file-variable
    gather-sql-2019-installed-product-features-collection:
      collection_title: Gather SQL 2019 Installed Product Features
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: sql-2019-setup-bootstrap-log-summary-txt-file-variable
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^  SQL Server 2019      .*
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-sqlext-collection-3:
      collection_title: null
      capability: independent.sqlext
      select:
        engine:
          operation: equals
          datatype: string
          mask: false
          value: sqlserver
        version:
          operation: pattern match
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: microsoft-sql-server-version-2016-2019-variable
        instance:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        database:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
        sql:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
      behaviors:
        context: instance
  variables:
    sql-2016-setup-bootstrap-log-summary-txt-file-variable:
      title: SQL 2016 Setup Bootstrap Log\Summary.txt file
      kind: local
      datatype: string
      expression:
        concat:
        - values:
            collection: sql-2016-bootstrap-setup-directory-collection
            field: value
        - literal:
            value: Log\Summary.txt
            datatype: string
    end-user-provided-list-required-approved-sql-components-variable:
      title: End user provided list of required and approved SQL components
      kind: external
      datatype: string
      input:
        required: true
        cardinality: one_or_more
    microsoft-sql-server-version-2016-2019-variable:
      title: Microsoft SQL Server version 2016-2019
      kind: constant
      datatype: string
      expression:
        literal: 2016|2017|2019
    sql-2017-setup-bootstrap-log-summary-txt-file-variable:
      title: SQL 2017 Setup Bootstrap Log\Summary.txt file
      kind: local
      datatype: string
      expression:
        concat:
        - values:
            collection: sql-2017-bootstrap-setup-log-directory-collection
            field: value
        - literal:
            value: Log\Summary.txt
            datatype: string
    sql-2019-setup-bootstrap-log-summary-txt-file-variable:
      title: SQL 2019 Setup Bootstrap Log\Summary.txt file
      kind: local
      datatype: string
      expression:
        concat:
        - values:
            collection: sql-2019-bootstrap-setup-log-directory-collection
            field: value
        - literal:
            value: Log\Summary.txt
            datatype: string
  tests:
    test-verify-sql-2016-setup-bootstrap-log-exist-run-installed-sql:
      test_title: Verify SQL 2016 Setup Bootstrap Log must exist (run 'Installed SQL 2016 Server features discovery report'
        if not found)
      capability: windows.file
      collection: sql-2016-setup-bootstrap-log-exist-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
    test-compare-sql-2016-installed-features-against-system-documentation-run-installed:
      test_title: Compare SQL 2016 Installed Features against system documentation (run 'Installed SQL 2016 Server features
        discovery report' no features are found)
      capability: independent.textfilecontent54
      collection: gather-sql-2016-installed-product-features-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Check SQL bootstrap logs for user approved list of usernames
        state_capability: independent.textfilecontent54
        state:
          field: text
          value:
            variable: end-user-provided-list-required-approved-sql-components-variable
          operation: pattern match
          datatype: string
          mask: false
          variable_check: at least one
          entity_check: all
          entity_existence: at_least_one_exists
    test-verify-sql-instance-sql-2016:
      test_title: Verify SQL Instance is SQL 2016
      capability: independent.sqlext
      collection: independent-sqlext-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Instance is SQL 2016
        state_capability: independent.sqlext
        state:
          field: version
          value: '2016'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-verify-sql-2017-setup-bootstrap-log-exist-run-installed-sql:
      test_title: Verify SQL 2017 Setup Bootstrap Log must exist (run 'Installed SQL 2017 Server features discovery report'
        if not found)
      capability: windows.file
      collection: sql-2017-setup-bootstrap-log-exist-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
    test-compare-sql-2017-installed-features-against-system-documentation-run-installed:
      test_title: Compare SQL 2017 Installed Features against system documentation (run 'Installed SQL 2017 Server features
        discovery report' no features are found)
      capability: independent.textfilecontent54
      collection: gather-sql-2017-installed-product-features-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Check SQL bootstrap logs for user approved list of usernames
        state_capability: independent.textfilecontent54
        state:
          field: text
          value:
            variable: end-user-provided-list-required-approved-sql-components-variable
          operation: pattern match
          datatype: string
          mask: false
          variable_check: at least one
          entity_check: all
          entity_existence: at_least_one_exists
    test-verify-sql-instance-sql-2017:
      test_title: Verify SQL Instance is SQL 2017
      capability: independent.sqlext
      collection: independent-sqlext-collection-2
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Instance is SQL 2017
        state_capability: independent.sqlext
        state:
          field: version
          value: '2017'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-verify-sql-2019-setup-bootstrap-log-exist-run-installed-sql:
      test_title: Verify SQL 2019 Setup Bootstrap Log must exist (run 'Installed SQL 2019 Server features discovery report'
        if not found)
      capability: windows.file
      collection: sql-2019-setup-bootstrap-log-exist-run-sql-server-installed-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
    test-compare-sql-2019-installed-features-against-system-documentation-run-installed:
      test_title: Compare SQL 2019 Installed Features against system documentation (run 'Installed SQL 2019 Server features
        discovery report' no features are found)
      capability: independent.textfilecontent54
      collection: gather-sql-2019-installed-product-features-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Check SQL bootstrap logs for user approved list of usernames
        state_capability: independent.textfilecontent54
        state:
          field: text
          value:
            variable: end-user-provided-list-required-approved-sql-components-variable
          operation: pattern match
          datatype: string
          mask: false
          variable_check: at least one
          entity_check: all
          entity_existence: at_least_one_exists
    test-verify-sql-instance-sql-2019:
      test_title: Verify SQL Instance is SQL 2019
      capability: independent.sqlext
      collection: independent-sqlext-collection-3
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Instance is SQL 2019
        state_capability: independent.sqlext
        state:
          field: version
          value: '2019'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    any:
    - all:
      - test: test-verify-sql-2016-setup-bootstrap-log-exist-run-installed-sql
      - test: test-compare-sql-2016-installed-features-against-system-documentation-run-installed
      - test: test-verify-sql-instance-sql-2016
    - all:
      - test: test-verify-sql-2017-setup-bootstrap-log-exist-run-installed-sql
      - test: test-compare-sql-2017-installed-features-against-system-documentation-run-installed
      - test: test-verify-sql-instance-sql-2017
    - all:
      - test: test-verify-sql-2019-setup-bootstrap-log-exist-run-installed-sql
      - test: test-compare-sql-2019-installed-features-against-system-documentation-run-installed
      - test: test-verify-sql-instance-sql-2019
