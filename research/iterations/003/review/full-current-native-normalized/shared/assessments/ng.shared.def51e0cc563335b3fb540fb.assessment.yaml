assessment:
  id: ng.shared.def51e0cc563335b3fb540fb
  version: 1
  assessment_title: Ensure that FAIL_DELAY is Configured in /etc/login.defs
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    fail-delay-value-from-etc-login-defs-collection:
      collection_title: FAIL_DELAY value from /etc/login.defs
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/login.defs
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[\s]*FAIL_DELAY[\s]+([^#\s]*)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  variables:
    expected-fail-delay-variable:
      title: Expected fail_delay
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: var_accounts_fail_delay
  tests:
    test-check-fail-delay-in-etc-login-defs:
      test_title: check FAIL_DELAY in /etc/login.defs
      capability: independent.textfilecontent54
      collection: fail-delay-value-from-etc-login-defs-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value:
            variable: expected-fail-delay-variable
          operation: greater than or equal
          datatype: int
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-check-fail-delay-in-etc-login-defs
