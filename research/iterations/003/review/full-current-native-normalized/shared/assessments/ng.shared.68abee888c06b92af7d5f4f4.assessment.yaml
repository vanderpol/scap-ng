assessment:
  id: ng.shared.68abee888c06b92af7d5f4f4
  version: 1
  assessment_title: UBTU-22-232105 - Ubuntu 22.04 LTS must be configured so that the "journalctl" command is group-owned by
    "root".
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    unix-file-collection:
      collection_title: null
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /usr/bin/journalctl
  tests:
    test-usr-bin-journalctl-group-owned-by-root:
      test_title: /usr/bin/journalctl is group-owned by root
      capability: unix.file
      collection: unix-file-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: group-owned by root
        state_capability: unix.file
        state:
          field: group_id
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-usr-bin-journalctl-group-owned-by-root
