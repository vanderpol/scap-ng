assessment:
  id: ng.shared.29496a36fbd3a3f60e0de65b
  version: 1
  assessment_title: The Oracle Linux operating system must use a reverse-path filter for IPv4 network traffic when possible
    by default.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the system uses a reverse-path filter for IPv4: # grep -r net.ipv4.conf.default.rp_filter /run/sysctl.d/*
    /etc/sysctl.d/* /usr/local/lib/sysctl.d/* /usr/lib/sysctl.d/* /lib/sysctl.d/* /etc/sysctl.conf 2> /dev/null net.ipv4.conf.default.rp_filter
    = 1 If "net.ipv4.conf.default.rp_filter" is not configured in the /etc/sysctl.conf file or in any of the other sysctl.d
    directories, is commented out, or does not have a value of "1", this is a finding. Check that the operating system implements
    the accept source route variable with the following command: # /sbin/sysctl -a | grep net.ipv4.conf.default.rp_filter
    net.ipv4.conf.default.rp_filter = 1 If the returned line does not have a value of "1", this is a finding. If conflicting
    results are returned, this is a finding.'
  inputs: []
  evidence: []
