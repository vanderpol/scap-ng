assessment:
  id: ng.shared.6b40b12dc137550622fc7b77
  version: 1
  assessment_title: Computer Identity Authentication for NTLM
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Control\Lsa
        name:
          operation: equals
          datatype: string
          mask: false
          value: UseMachineId
      object_title: null
  variables:
    network-security-allow-local-system-use-computer-identity-ntlm-variable:
      title: 'Network security: Allow Local System to use computer identity for NTLM'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: Network_security_Allow_Local_System_to_use_computer_identity_for_NTLM_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: network-security-allow-local-system-use-computer-identity-ntlm-variable
          operation: equals
          datatype: int
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-network-security-allow-local-system-use-computer-identity-ntlm-set:
      test_title: '''Network Security: Allow Local System to use computer identity for NTLM'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-network-security-allow-local-system-use-computer-identity-ntlm-set
