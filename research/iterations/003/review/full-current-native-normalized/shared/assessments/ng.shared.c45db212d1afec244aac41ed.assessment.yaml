  assessment_title: Firefox encrypted media extensions must be disabled.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Type "about:policies" in the browser address bar. If "EncryptedMediaExtensions" is not displayed under Policy
    Name or the Policy Value does not have "Enabled" set to "false" or the Policy Value does not have "Locked" set to "true",
    this is a finding.
