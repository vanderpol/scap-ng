assessment:
  id: ng.shared.99fe8c2ac4827fdffa6ebc4f
  version: 1
  assessment_title: The operating system must display the DoD approved system use notification message or banner for SSH connections.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    contents-etc-issue-file-collection:
      collection_title: Contents of the /etc/issue file
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/issue
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .+
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
      behaviors:
        singleline: 'true'
    contents-etc-ssh-sshd-config-collection:
      collection_title: Contents of the /etc/ssh/sshd_config
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^Banner.*
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
  tests:
    test-etc-issue-contain-standard-mandatory-dod-notice-consent-banner:
      test_title: /etc/issue must contain the Standard Mandatory DoD Notice and Consent Banner
      capability: independent.textfilecontent54
      collection: contents-etc-issue-file-collection
      assertion:
        existence: only_one_exists
        item_quantifier: all
        state_title: Text matches the Standard Mandatory DoD Notice and Consent Banner
        state_capability: independent.textfilecontent54
        state:
          field: text
          value: You\s+are\s+accessing\s+a\s+U.S.\s+Government\s+\(USG\)\s+Information\s+System\s+\(IS\)\s+that\s+is\s+provided\s+for\s+USG-authorized\s+use\s+only.[\n\r
            \t]+By\s+using\s+this\s+IS\s+\(which\s+includes\s+any\s+device\s+attached\s+to\s+this\s+IS\),\s+you\s+consent\s+to\s+the\s+following\s+conditions:[\n\r
            \t]+-The\s+USG\s+routinely\s+intercepts\s+and\s+monitors\s+communications\s+on\s+this\s+IS\s+for\s+purposes\s+including,\s+but\s+not\s+limited\s+to,\s+penetration\s+testing,\s+COMSEC\s+monitoring,\s+network\s+operations\s+and\s+defense,\s+personnel\s+misconduct\s+\(PM\),\s+law\s+enforcement\s+\(LE\),\s+and\s+counterintelligence\s+\(CI\)\s+investigations.[\n\r
            \t]+-At\s+any\s+time,\s+the\s+USG\s+may\s+inspect\s+and\s+seize\s+data\s+stored\s+on\s+this\s+IS.[\n\r \t]+-Communications\s+using,\s+or\s+data\s+stored\s+on,\s+this\s+IS\s+are\s+not\s+private,\s+are\s+subject\s+to\s+routine\s+monitoring,\s+interception,\s+and\s+search,\s+and\s+may\s+be\s+disclosed\s+or\s+used\s+for\s+any\s+USG-authorized\s+purpose.[\n\r
            \t]+-This\s+IS\s+includes\s+security\s+measures\s+\(e.g.,\s+authentication\s+and\s+access\s+controls\)\s+to\s+protect\s+USG\s+interests\s*-\-\s*not\s+for\s+your\s+personal\s+benefit\s+or\s+privacy.[\n\r
            \t]+-Notwithstanding\s+the\s+above,\s+using\s+this\s+IS\s+does\s+not\s+constitute\s+consent\s+to\s+PM,\s+LE\s+or\s+CI\s+investigative\s+searching\s+or\s+monitoring\s+of\s+the\s+content\s+of\s+privileged\s+communications,\s+or\s+work\s+product,\s+related\s+to\s+personal\s+representation\s+or\s+services\s+by\s+attorneys,\s+psychotherapists,\s+or\s+clergy,\s+and\s+their\s+assistants.\s+Such\s+communications\s+and\s+work\s+product\s+are\s+private\s+and\s+confidential.\s+See\s+User\s+Agreement\s+for\s+details.[\n\r]*
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-sshd-configured-use-etc-issue:
      test_title: sshd must be configured to use /etc/issue
      capability: independent.textfilecontent54
      collection: contents-etc-ssh-sshd-config-collection
      assertion:
        existence: only_one_exists
        item_quantifier: all
        state_title: Text matches Banner /etc/issue
        state_capability: independent.textfilecontent54
        state:
          field: text
          value: ^Banner\s+/etc/issue(([\s\n])+|$)
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-etc-issue-contain-standard-mandatory-dod-notice-consent-banner
    - test: test-sshd-configured-use-etc-issue
