assessment:
  id: ng.shared.bb08ba9262c4fa0de62c8035
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that all local interactive user home directories
    have mode 0750 or less permissive.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    operating-system-configured-so-that-all-local-interactive-user-home-object-2:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/passwd
        pattern:
          operation: pattern match
          datatype: string
          value: ^[^:]*:[^:]*:[^:]*:[^:]*:[^:]*:([^:]*?):.*
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      filters:
      - action: exclude
        state: state-filter-out-users-with-uid-less-than-1000
      - action: exclude
        state: state-filter-out-users-with-shell-of-nologin
      object_title: The operating system must be configured so that all local interactive user home directories have mode
        0750 or less permissive.
    operating-system-configured-so-that-all-local-interactive-user-home-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          variable_check: all
          value:
            variable: retrieve-home-directory-variable
        filename:
          operation: equals
          datatype: string
          nil: true
          value: ''
      behaviors:
        recurse_direction: none
        recurse: symlinks and directories
        max_depth: '0'
      object_title: The operating system must be configured so that all local interactive user home directories have mode
        0750 or less permissive.
  variables:
    retrieve-home-directory-variable:
      title: Retrieve home directory
      kind: local
      datatype: string
      expression:
        values:
          object: operating-system-configured-so-that-all-local-interactive-user-home-object-2
          field: subexpression
  states:
    state-the-operating-system-must-be-configured-so-that-all-loca:
      state_title: The operating system must be configured so that all local interactive user home directories have mode 0750
        or less permissive.
      capability: unix.file
      state:
        all:
        - field: gwrite
          value: '0'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: oread
          value: '0'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: owrite
          value: '0'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: oexec
          value: '0'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
    state-filter-out-users-with-uid-less-than-1000:
      state_title: Filter out users with UID less than 1000.
      capability: independent.textfilecontent54
      state:
        field: text
        value: ^[^:]*:[^:]*:(\d{1,3}):.*
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-filter-out-users-with-shell-of-nologin:
      state_title: Filter out users with shell of 'nologin'.
      capability: independent.textfilecontent54
      state:
        field: text
        value: ^.*bin/nologin
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-operating-system-configured-so-that-all-local-interactive-user-home:
      test_title: The operating system must be configured so that all local interactive user home directories have mode 0750
        or less permissive.
      capability: unix.file
      object: operating-system-configured-so-that-all-local-interactive-user-home-object
      check_existence: any_exist
      check: all
      states:
      - state-the-operating-system-must-be-configured-so-that-all-loca
  evaluate:
    test: test-operating-system-configured-so-that-all-local-interactive-user-home
