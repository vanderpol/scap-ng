assessment:
  id: ng.shared.3deb33ca5667b222f45841a2
  version: 1
  assessment_title: The macOS system logon window must be configured to prompt for username and password.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    system-settings-loginwindow-prompt-username-password-enforce-recommended-object-collection:
      collection_title: system_settings_loginwindow_prompt_username_password_enforce_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.loginwindow'')\

            .objectForKey(''SHOWFULLNAME'').js

            EOS'
  tests:
    test-system-settings-loginwindow-prompt-username-password-enforce-recommended-test:
      test_title: system_settings_loginwindow_prompt_username_password_enforce_recommended_test
      capability: independent.shellcommand
      collection: system-settings-loginwindow-prompt-username-password-enforce-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: system_settings_loginwindow_prompt_username_password_enforce_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: 'true'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-system-settings-loginwindow-prompt-username-password-enforce-recommended-test
