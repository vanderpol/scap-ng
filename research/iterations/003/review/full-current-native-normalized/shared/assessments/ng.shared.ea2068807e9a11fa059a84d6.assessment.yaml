assessment:
  id: ng.shared.ea2068807e9a11fa059a84d6
  version: 1
  assessment_title: Explorer Data Execution Prevention must be enabled.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The default behavior is for Data Execution Prevention to be turned on for File Explorer. If the registry value
    name below does not exist, this is not a finding. If it exists and is configured with a value of "0", this is not a finding.
    If it exists and is configured with a value of "1", this is a finding. Registry Hive: HKEY_LOCAL_MACHINE Registry Path:
    \SOFTWARE\Policies\Microsoft\Windows\Explorer\ Value Name: NoDataExecutionPrevention Value Type: REG_DWORD Value: 0x00000000
    (0) (or if the Value Name does not exist)'
  inputs: {}
  evidence: []
