assessment:
  id: ng.shared.92e76e223097de3292195334
  version: 1
  assessment_title: Disable PerfTrack
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SOFTWARE\Policies\Microsoft\Windows\WDI\{9c5a40da-b965-4fc3-8781-88dd50a6299d}
        name:
          operation: equals
          datatype: string
          value: ScenarioExecutionEnabled
      object_title: null
  variables:
    enable-disable-perftrack-variable:
      title: Enable/Disable PerfTrack
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: enable_disable_perftrack_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: enable-disable-perftrack-variable
          operation: equals
          datatype: int
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-enable-disable-perftrack-set-disabled:
      test_title: '''Enable/Disable PerfTrack'' is set to ''Disabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-enable-disable-perftrack-set-disabled
