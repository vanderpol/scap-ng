assessment:
  id: ng.shared.772d4167625b91a58b251815
  version: 1
  assessment_title: WN19-DC-000360 - Windows Server 2019 Allow log on through Remote Desktop Services user right must only
    be assigned to the Administrators group on domain controllers.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-userright-collection:
      collection_title: null
      capability: windows.userright
      select:
        userright:
          operation: equals
          datatype: string
          mask: false
          value: SE_REMOTE_INTERACTIVE_LOGON_NAME
  tests:
    test-allow-log-on-through-remote-desktop-services-administrators:
      test_title: Allow log on through Remote Desktop Services - Administrators
      capability: windows.userright
      collection: windows-userright-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: null
          capability: windows.userright
          state:
            field: trustee_name
            value: ''
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: windows.userright
          state:
            field: trustee_name
            value: Administrators
            operation: case insensitive equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-allow-log-on-through-remote-desktop-services-administrators
