assessment:
  id: ng.shared.d6558427cd89de6e4e4295e5
  version: 1
  assessment_title: WN12-AU-000106
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    audit-event-subcategories-policy-object:
      capability: windows.auditeventpolicysubcategories
      object_title: Audit event subcategories policy
  states:
    state-other-system-events-is-set-to-failure:
      state_title: '''Other System Events'' is set to ''Failure'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: other_system_events
        value: AUDIT_FAILURE
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-other-system-events-is-set-to-success-and-failure:
      state_title: '''Other System Events'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: other_system_events
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-other-system-events-set-failure:
      test_title: '''Audit Other System Events'' is set to ''Failure'''
      capability: windows.auditeventpolicysubcategories
      object: audit-event-subcategories-policy-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-other-system-events-is-set-to-failure
    test-audit-other-system-events-set-success-failure:
      test_title: '''Audit Other System Events'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      object: audit-event-subcategories-policy-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-other-system-events-is-set-to-success-and-failure
  evaluate:
    any:
    - test: test-audit-other-system-events-set-failure
    - test: test-audit-other-system-events-set-success-failure
