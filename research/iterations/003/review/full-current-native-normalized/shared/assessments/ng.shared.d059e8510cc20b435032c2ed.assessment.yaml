assessment:
  id: ng.shared.d059e8510cc20b435032c2ed
  version: 1
  assessment_title: UBTU-22-653075 - Ubuntu 22.04 LTS must permit only authorized groups to own the audit configuration files.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-file-object:
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/audit/auditd.conf
      object_title: null
    unix-file-object-2:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/audit/rules.d
        filename:
          operation: pattern match
          datatype: string
          value: .rules$
      object_title: null
    unix-file-object-3:
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/audit/audit.rules
      object_title: null
  states:
    state-group-owned-by-root:
      state_title: group-owned by root
      capability: unix.file
      state:
        field: group_id
        value: '0'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-etc-audit-auditd-conf-group-owned-by-root:
      test_title: /etc/audit/auditd.conf is group owned by root
      capability: unix.file
      object: unix-file-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-group-owned-by-root
    test-rules-files-in-etc-audit-rules-d-group-owned-by:
      test_title: .rules files in /etc/audit/rules.d are group owned by root
      capability: unix.file
      object: unix-file-object-2
      check_existence: at_least_one_exists
      check: all
      states:
      - state-group-owned-by-root
    test-etc-audit-audit-rules-group-owned-by-root:
      test_title: /etc/audit/audit.rules is group owned by root
      capability: unix.file
      object: unix-file-object-3
      check_existence: at_least_one_exists
      check: all
      states:
      - state-group-owned-by-root
  evaluate:
    all:
    - test: test-etc-audit-auditd-conf-group-owned-by-root
    - test: test-rules-files-in-etc-audit-rules-d-group-owned-by
    - test: test-etc-audit-audit-rules-group-owned-by-root
