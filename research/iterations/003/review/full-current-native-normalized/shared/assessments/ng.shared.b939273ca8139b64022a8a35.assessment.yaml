assessment:
  id: ng.shared.b939273ca8139b64022a8a35
  version: 1
  assessment_title: IPSec Exemptions
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: System\CurrentControlSet\Services\IPSEC
        name:
          operation: equals
          datatype: string
          value: NoDefaultExempt
      object_title: null
  variables:
    mss-nodefaultexempt-configure-ipsec-exemptions-various-types-network-traffic-variable:
      title: 'MSS: (NoDefaultExempt) Configure IPSec exemptions for various types of network traffic'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: no_default_exempt_var
        validation:
          alternatives:
          - literal: '0'
            hint: multicast_broadcast_rsvp_kerberos_isakmp_exempt
          - literal: '1'
            hint: multicast_broadcast_isakmp_exempt
          - literal: '2'
            hint: rsvp_kerberos_isakmp_exempt
          - literal: '3'
            hint: isakmp_exempt
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: mss-nodefaultexempt-configure-ipsec-exemptions-various-types-network-traffic-variable
          operation: equals
          datatype: int
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-mss-nodefaultexempt-configure-ipsec-exemptions-various-types-network-traffic-set:
      test_title: '''MSS: (NoDefaultExempt) Configure IPSec exemptions for various types of network traffic'' is set to ''Only
        ISAKMP is exempt (recommended for Windows Server 2003)'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-mss-nodefaultexempt-configure-ipsec-exemptions-various-types-network-traffic-set
