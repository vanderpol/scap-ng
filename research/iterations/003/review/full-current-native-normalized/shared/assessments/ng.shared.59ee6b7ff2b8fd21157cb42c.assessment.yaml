assessment:
  id: ng.shared.59ee6b7ff2b8fd21157cb42c
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that the cron.allow file, if it exists, is owned
    by root.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that the "cron.allow" file is owned by root. Check the owner of the "cron.allow" file with the following
    command: # ls -al /etc/cron.allow -rw------- 1 root root 6 Mar 5 2011 /etc/cron.allow If the "cron.allow" file exists
    and has an owner other than root, this is a finding.'
  inputs: {}
  evidence: []
