  version: 1
  assessment_title: OL08-00-010152 - OL 8 operating systems must require authentication upon booting into emergency mode.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    usr-lib-systemd-system-emergency-service-execstart-collection:
      collection_title: /usr/lib/systemd/system/emergency.service ExecStart
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /usr/lib/systemd/system/emergency.service
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^ExecStart=(.*)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-emergency-service-config-correct:
      test_title: emergency.service config correct
      capability: independent.textfilecontent54
      collection: usr-lib-systemd-system-emergency-service-execstart-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: emergency.service ExecStart
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: -/usr/lib/systemd/systemd-sulogin-shell emergency
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-emergency-service-config-correct
