assessment:
  id: ng.shared.2bc644898ae6a8229abd4896
  version: 1
  assessment_title: The Windows dialog box title for the legal banner must be configured.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding: Registry
    Hive: HKEY_LOCAL_MACHINE Registry Path: \Software\Microsoft\Windows\CurrentVersion\Policies\System\ Value Name: LegalNoticeCaption
    Value Type: REG_SZ Value: See message title options below "DoD Notice and Consent Banner", "US Department of Defense Warning
    Statement", or a site-defined equivalent. If a site-defined title is used, it can in no case contravene or modify the
    language of the banner text required in V-1089. Automated tools may only search for the titles defined above. If a site-defined
    title is used, a manual review will be required.'
  inputs: []
  evidence: []
