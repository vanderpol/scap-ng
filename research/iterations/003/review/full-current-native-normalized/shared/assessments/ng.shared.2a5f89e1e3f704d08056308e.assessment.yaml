assessment:
  id: ng.shared.2a5f89e1e3f704d08056308e
  version: 1
  assessment_title: UBTU-18-010104 - The Ubuntu operating system must encrypt all stored passwords with a FIPS 140-2 approved
    cryptographic hashing algorithm.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    etc-login-defs-encrypt-method-collection:
      collection_title: /etc/login.defs:ENCRYPT_METHOD
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/login.defs
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*ENCRYPT_METHOD\s+(\w*)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-etc-login-defs-encrypt-method-sha512:
      test_title: /etc/login.defs:ENCRYPT_METHOD == SHA512
      capability: independent.textfilecontent54
      collection: etc-login-defs-encrypt-method-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: SHA512
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-etc-login-defs-encrypt-method-sha512
