assessment:
  id: ng.shared.39a180d5f4927dff2697872f
  version: 1
  assessment_title: The operating system must use cryptographic mechanisms to protect the integrity of audit information.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The Audit Configuration and the Audit Control profiles are required. This check applies to the global zone only.
    Determine the zone that you are currently securing. # zonename If the command output is "global", this check applies.
    Determine if audit log encryption is required by your organization. If not required, this check does not apply. Determine
    where the audit logs are stored and whether the file system is encrypted. # pfexec auditconfig -getplugin audit_binfile
    The p_dir attribute lists the location of the audit log filesystem. The default location for Solaris 11.1 is /var/audit.
    /var/audit is a link to /var/share/audit which, by default, is mounted on rpool/VARSHARE. Determine if this is encrypted:
    # zfs get encryption rpool/VARSHARE If the file system where audit logs are stored reports "encryption off", this is a
    finding.'
  inputs: {}
  evidence: []
