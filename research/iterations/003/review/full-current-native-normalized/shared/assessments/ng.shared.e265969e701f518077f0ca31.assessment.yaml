assessment:
  id: ng.shared.e265969e701f518077f0ca31
  version: 1
  assessment_title: AZLX-23-001235 - Amazon Linux 2023 SSHD must not allow blank passwords.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(?i)\s*PermitEmptyPasswords\s+(\w+)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-textfilecontent54-collection-2:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .+
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(?i)\s*PermitEmptyPasswords\s+(\w+)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    permitemptypasswords-in-all-sshd-config-sshd-config-d-files-collection:
      collection_title: PermitEmptyPasswords in all sshd_config and sshd_config.d/* files
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - collection: independent-textfilecontent54-collection
        - collection: independent-textfilecontent54-collection-2
  tests:
    test-etc-ssh-sshd-config-or-etc-ssh-sshd-config-d:
      test_title: /etc/ssh/sshd_config or /etc/ssh/sshd_config.d/*:PermitEmptyPasswords == no
      capability: independent.textfilecontent54
      collection: permitemptypasswords-in-all-sshd-config-sshd-config-d-files-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^(no|"no")$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-etc-ssh-sshd-config-or-etc-ssh-sshd-config-d
