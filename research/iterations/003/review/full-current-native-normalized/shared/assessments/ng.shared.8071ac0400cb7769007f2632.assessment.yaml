assessment:
  id: ng.shared.8071ac0400cb7769007f2632
  version: 1
  assessment_title: The system SQL Server must off-load audit data to a separate log management facility; this must be continuous
    and in near real time for systems with a network connection to the storage facility and weekly or more often for stand-alone
    systems.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Review the system documentation for a description of how audit records are off-loaded. If the system has a continuous
    network connection to the centralized log management system, but the DBMS audit records are not written directly to the
    centralized log management system or transferred in near-real-time, this is a finding. If the system does not have a continuous
    network connection to the centralized log management system, and the DBMS audit records are not transferred to the centralized
    log management system weekly or more often, this is a finding.
  inputs: {}
  evidence: []
