assessment:
  id: ng.shared.0e10ea70e3f703821d9664ed
  version: 1
  assessment_title: The macOS system must be configured with system log files owned by root and group-owned by wheel or admin.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    os-asl-log-files-owner-group-configure-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/bin/stat -f '%Su:%Sg:%N' $(/usr/bin/grep -e '^>' /etc/asl.conf /etc/asl/*|/usr/bin/awk '{ print $2 }')|/usr/bin/awk
            '!/^root:wheel:/{print $1}'
      object_title: os_asl_log_files_owner_group_configure_recommended_object
  states:
    state-os-asl-log-files-owner-group-configure-recommended-state:
      state_title: os_asl_log_files_owner_group_configure_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: ''
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: none_exist
  tests:
    test-os-asl-log-files-owner-group-configure-recommended-test:
      test_title: os_asl_log_files_owner_group_configure_recommended_test
      capability: independent.shellcommand
      object: os-asl-log-files-owner-group-configure-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-os-asl-log-files-owner-group-configure-recommended-state
  evaluate:
    test: test-os-asl-log-files-owner-group-configure-recommended-test
