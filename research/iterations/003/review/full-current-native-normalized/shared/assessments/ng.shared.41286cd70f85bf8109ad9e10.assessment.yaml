assessment:
  id: ng.shared.41286cd70f85bf8109ad9e10
  version: 1
  assessment_title: The operating system must employ automated mechanisms, per organization-defined frequency, to detect the
    addition of unauthorized components/devices into the operating system.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The Software Installation Profile is required. Display the installation history of packages on the system to
    ensure that no undesirable packages have been installed: # pkg history -o finish,user,operation,command |grep install
    If the install command is listed as "/usr/bin/packagemanager", execute the command: # pkg history -l to determine which
    packages were installed during package manager sessions. If undocumented or unapproved packages have been installed, this
    is a finding.'
  inputs: {}
  evidence: []
