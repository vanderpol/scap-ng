assessment:
  id: ng.shared.f795854aa8ccb08e7d461787
  version: 1
  assessment_title: The system must not respond to multicast echo requests.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    ipadm-show-prop-p-respond-echo-multicast-co-current-ipv4-collection:
      collection_title: ipadm show-prop -p _respond_to_echo_multicast -co current ipv4
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: ipadm show-prop -p _respond_to_echo_multicast -co current ipv4
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
    ipadm-show-prop-p-respond-echo-multicast-co-current-ipv6-collection:
      collection_title: ipadm show-prop -p _respond_to_echo_multicast -co current ipv6
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: ipadm show-prop -p _respond_to_echo_multicast -co current ipv6
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
  tests:
    test-system-not-respond-ipv4-multicast-echo-requests:
      test_title: The system must not respond to ipv4 multicast echo requests.
      capability: independent.shellcommand
      collection: ipadm-show-prop-p-respond-echo-multicast-co-current-ipv4-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Check that line returns '0' with an exit status of 0
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: '0'
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-system-not-respond-ipv6-multicast-echo-requests:
      test_title: The system must not respond to ipv6 multicast echo requests.
      capability: independent.shellcommand
      collection: ipadm-show-prop-p-respond-echo-multicast-co-current-ipv6-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Check that line returns '0' with an exit status of 0
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: '0'
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-system-not-respond-ipv4-multicast-echo-requests
    - test: test-system-not-respond-ipv6-multicast-echo-requests
