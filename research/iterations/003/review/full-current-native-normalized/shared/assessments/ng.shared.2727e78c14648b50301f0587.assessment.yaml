assessment:
  id: ng.shared.2727e78c14648b50301f0587
  version: 1
  assessment_title: The Cisco switch must be configured with only one local account to be used as the account of last resort
    in the event the authentication server is unavailable.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Step 1: Review the Cisco switch configuration to verify that a local account for last resort has been configured
    with a privilege level that will enable the administrator to troubleshoot connectivity to the authentication server. username
    xxxxxxxxxxx privilege 10 common-criteria-policy PASSWORD_POLICY password xxxxxxxxxx Note: The configured Common Criteria
    policy must be used when creating or changing the local account password as shown in the example above. Step 2: Verify
    that local is defined after radius or tacacs+ in the authentication order as shown in the example below: aaa authentication
    login default group tacacs+ local If the Cisco switch is not configured with only one local account to be used as the
    account of last resort in the event the authentication server is unavailable, this is a finding.'
  inputs: {}
  evidence: []
