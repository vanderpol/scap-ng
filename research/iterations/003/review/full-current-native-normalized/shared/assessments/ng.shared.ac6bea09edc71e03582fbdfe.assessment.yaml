assessment:
  id: ng.shared.ac6bea09edc71e03582fbdfe
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that when passwords are changed or new passwords
    are established, the new password must contain at least one lower-case character.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: The value to require a number of lower-case characters to be set is expressed as a negative number in
    "/etc/security/pwquality.conf". Check the value for "lcredit" in "/etc/security/pwquality.conf" with the following command:
    # grep lcredit /etc/security/pwquality.conf lcredit = -1 If the value of "lcredit" is not set to a negative value, this
    is a finding.'
  inputs: []
  evidence: []
