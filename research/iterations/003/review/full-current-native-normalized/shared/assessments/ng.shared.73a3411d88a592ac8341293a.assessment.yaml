assessment:
  id: ng.shared.73a3411d88a592ac8341293a
  version: 1
  assessment_title: WN19-AU-000270 - Windows Server 2019 must be configured to audit Policy Change - Audit Policy Change failures.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-audit-policy-change-is-set-to-success-and-failure:
      state_title: '''Audit Policy Change'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: audit_policy_change
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-auditeventpolicysubcategories:
      state_title: null
      capability: windows.auditeventpolicysubcategories
      state:
        field: audit_policy_change
        value: AUDIT_FAILURE
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-policy-change-failure-only-or-success-failure:
      test_title: Audit Policy Change - 'Failure only' or 'Success and Failure'
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-audit-policy-change-is-set-to-success-and-failure
      - state-windows-auditeventpolicysubcategories
  evaluate:
    test: test-audit-policy-change-failure-only-or-success-failure
