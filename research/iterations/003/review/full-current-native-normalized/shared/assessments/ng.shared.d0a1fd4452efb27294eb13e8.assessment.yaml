assessment:
  id: ng.shared.d0a1fd4452efb27294eb13e8
  version: 1
  assessment_title: Contained databases must use Windows principals.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    gather-list-contained-database-names-collection:
      collection_title: Gather list of contained database names
      capability: independent.sqlext
      select:
        engine:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: microsoft-sql-server-dbms-variable
        version:
          operation: pattern match
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: microsoft-sql-server-version-2016-2022-variable
        instance:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        database:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
        sql:
          operation: equals
          datatype: string
          mask: false
          value: SELECT name FROM sys.databases WHERE containment = 1
      behaviors:
        context: instance
    independent-sqlext-collection:
      collection_title: null
      capability: independent.sqlext
      select:
        engine:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: microsoft-sql-server-dbms-variable
        version:
          operation: pattern match
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: microsoft-sql-server-version-2016-2022-variable
        instance:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        database:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: list-contained-databases-variable
        sql:
          operation: equals
          datatype: string
          mask: false
          value: 'select name, type, type_desc, authentication_type, authentication_type_desc

            from sys.database_principals

            where authentication_type =2'
      behaviors:
        context: instance
  variables:
    microsoft-sql-server-dbms-variable:
      title: Microsoft SQL Server DBMS
      kind: constant
      datatype: string
      expression:
        literal: sqlserver
    microsoft-sql-server-version-2016-2022-variable:
      title: Microsoft SQL Server version 2016-2022
      kind: constant
      datatype: string
      expression:
        literal: 2016|2017|2019|2022
    list-contained-databases-variable:
      title: List of contained databases
      kind: local
      datatype: string
      expression:
        values:
          collection: gather-list-contained-database-names-collection
          field: result
          record_field: name
  tests:
    test-if-no-contained-databases-found-this-not-finding:
      test_title: If no contained databases are found, this is not a finding
      capability: independent.sqlext
      collection: gather-list-contained-database-names-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
    test-ensure-contained-database-users-not-using-sql-authentication:
      test_title: Ensure contained database users are not using SQL Authentication.
      capability: independent.sqlext
      collection: independent-sqlext-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
  evaluate:
    any:
    - test: test-if-no-contained-databases-found-this-not-finding
    - test: test-ensure-contained-database-users-not-using-sql-authentication
