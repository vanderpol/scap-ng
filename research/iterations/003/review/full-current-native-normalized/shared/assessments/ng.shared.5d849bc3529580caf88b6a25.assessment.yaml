assessment:
  id: ng.shared.5d849bc3529580caf88b6a25
  version: 1
  assessment_title: TS/RDS - Prevent Password Saving
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services
        name:
          operation: equals
          datatype: string
          value: DisablePasswordSaving
      object_title: null
  variables:
    do-not-allow-passwords-saved-variable:
      title: Do not allow passwords to be saved
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: do_not_allow_passwords_to_be_saved_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: do-not-allow-passwords-saved-variable
          operation: equals
          datatype: int
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-do-not-allow-passwords-saved-set-enabled:
      test_title: '''Do not allow passwords to be saved'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-do-not-allow-passwords-saved-set-enabled
