assessment:
  id: ng.shared.21348ab2dc98d070dcf2c9de
  version: 1
  assessment_title: The macOS system must disable accounts after 35 days of inactivity.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable accounts after 35 days of inactivity with the following command:
    /usr/bin/pwpolicy -getaccountpolicies 2> /dev/null | /usr/bin/tail +2 | /usr/bin/xmllint --xpath ''//dict/key[text()="policyAttributeInactiveDays"]/following-sibling::integer[1]/text()''
    - If the result is not "35", this is a finding.'
  inputs: []
  evidence: []
