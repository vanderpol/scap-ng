assessment:
  id: ng.shared.1a0214c2c92b43beecf79277
  version: 1
  assessment_title: A screen saver must be enabled on the system.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding: Registry
    Hive: HKEY_CURRENT_USER Registry Path: \Software\Policies\Microsoft\Windows\Control Panel\Desktop\ Value Name: ScreenSaveActive
    Type: REG_SZ Value: 1 Applications requiring continuous, real-time screen display (e.g., network management products)
    require the following and must be documented with the ISSO: -The logon session does not have administrator rights. -The
    display station (e.g., keyboard, monitor, etc.) is located in a controlled access area.'
  inputs: {}
  evidence: []
