assessment:
  id: ng.shared.c833b44ccbc38639559b0ae4
  version: 1
  assessment_title: AZLX-23-002195 - Amazon Linux 2023 audit tools must be owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    audit-tools-object:
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          variable_check: at least one
          value:
            variable: audit-tools-variable
      object_title: audit tools
  variables:
    audit-tools-variable:
      title: audit tools
      kind: constant
      datatype: string
      expression:
        literal:
        - /sbin/auditctl
        - /sbin/aureport
        - /sbin/ausearch
        - /sbin/autrace
        - /sbin/auditd
        - /sbin/rsyslogd
        - /sbin/augenrules
  states:
    state-owned-by-root:
      state_title: owned by root
      capability: unix.file
      state:
        field: user_id
        value: '0'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-tools-owned-by-root:
      test_title: audit tools are owned by root
      capability: unix.file
      object: audit-tools-object
      check_existence: all_exist
      check: all
      states:
      - state-owned-by-root
  evaluate:
    test: test-audit-tools-owned-by-root
