assessment:
  id: ng.shared.511fa057e0c8f53f02396eac
  version: 1
  assessment_title: The macOS system must enforce FileVault.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to enforce FileVault with the following command: dontAllowDisable=$(/usr/bin/osascript
    -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.MCX'')\ .objectForKey(''dontAllowFDEDisable'').js
    EOS ) fileVault=$(/usr/bin/fdesetup status | /usr/bin/grep -c "FileVault is On.") if [[ "$dontAllowDisable" == "true"
    ]] && [[ "$fileVault" == 1 ]]; then echo "1" else echo "0" fi If the result is not "1", this is a finding.'
  inputs: {}
  evidence: []
