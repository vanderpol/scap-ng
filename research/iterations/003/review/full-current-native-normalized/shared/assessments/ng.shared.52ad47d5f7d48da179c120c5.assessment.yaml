assessment:
  id: ng.shared.52ad47d5f7d48da179c120c5
  version: 1
  assessment_title: The macOS system must disable Printer Sharing.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    system-settings-printer-sharing-disable-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/sbin/cupsctl | /usr/bin/grep "_share_printers=0"
      object_title: system_settings_printer_sharing_disable_recommended_object
  states:
    state-system-settings-printer-sharing-disable-recommended-stat:
      state_title: system_settings_printer_sharing_disable_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: .*
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-settings-printer-sharing-disable-recommended-test:
      test_title: system_settings_printer_sharing_disable_recommended_test
      capability: independent.shellcommand
      object: system-settings-printer-sharing-disable-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-system-settings-printer-sharing-disable-recommended-stat
  evaluate:
    test: test-system-settings-printer-sharing-disable-recommended-test
