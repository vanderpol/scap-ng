assessment:
  id: ng.shared.5fe41d4d595be329f5629e25
  version: 1
  assessment_title: SNMP community strings on the Oracle Linux operating system must be changed from the default.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that a system using SNMP is not using default community strings. Check to see if the "/etc/snmp/snmpd.conf"
    file exists with the following command: # ls -al /etc/snmp/snmpd.conf -rw------- 1 root root 52640 Mar 12 11:08 snmpd.conf
    If the file does not exist, this is Not Applicable. If the file does exist, check for the default community strings with
    the following commands: # grep public /etc/snmp/snmpd.conf # grep private /etc/snmp/snmpd.conf If either of these commands
    returns any output, this is a finding.'
  inputs: {}
  evidence: []
