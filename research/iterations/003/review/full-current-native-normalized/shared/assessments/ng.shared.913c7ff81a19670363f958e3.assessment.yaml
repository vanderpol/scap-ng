assessment:
  id: ng.shared.913c7ff81a19670363f958e3
  version: 1
  assessment_title: WN19-DC-000250 - Windows Server 2019 must be configured to audit DS Access - Directory Service Access
    failures.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-audit-directory-service-access-failure-only:
      state_title: Audit - Directory Service Access - Failure only
      capability: windows.auditeventpolicysubcategories
      state:
        field: directory_service_access
        value: AUDIT_FAILURE
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-audit-directory-service-access-success-and-failure:
      state_title: Audit - Directory Service Access - Success and Failure
      capability: windows.auditeventpolicysubcategories
      state:
        field: directory_service_access
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-directory-service-access-failure:
      test_title: Audit - Directory Service Access - Failure
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-audit-directory-service-access-failure-only
      - state-audit-directory-service-access-success-and-failure
  evaluate:
    test: test-audit-directory-service-access-failure
