assessment:
  id: ng.shared.b80b824a842ecf9187ca4e6f
  version: 1
  assessment_title: The operating system must shut down by default upon audit failure (unless availability is an overriding
    concern).
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    auditconfig-getpolicy-collection:
      collection_title: auditconfig -getpolicy
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: auditconfig -getpolicy
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: active
    auditconfig-getpolicy-filter-on-active-cnt-collection:
      collection_title: auditconfig -getpolicy and filter on active and cnt
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: auditconfig -getpolicy
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: active.*cnt.*
  tests:
    test-operating-system-shut-down-by-default-upon-audit-failure:
      test_title: The operating system must shut down by default upon audit failure).
      capability: independent.shellcommand
      collection: auditconfig-getpolicy-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: active is returned in the output
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: ahlt
            operation: pattern match
            datatype: string
            mask: false
            entity_check: at least one
            entity_existence: at_least_one_exists
    test-active-audit-policy-does-not-include-cnt:
      test_title: The active audit policy does not include cnt
      capability: independent.shellcommand
      collection: auditconfig-getpolicy-filter-on-active-cnt-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: cnt is should not be returned as an active audit
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: ''
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: none_exist
  evaluate:
    all:
    - test: test-operating-system-shut-down-by-default-upon-audit-failure
    - test: test-active-audit-policy-does-not-include-cnt
