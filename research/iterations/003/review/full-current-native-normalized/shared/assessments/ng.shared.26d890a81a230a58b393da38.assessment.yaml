assessment:
  id: ng.shared.26d890a81a230a58b393da38
  version: 1
  assessment_title: Explorer Data Execution Prevention
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\Windows\Explorer
        name:
          operation: equals
          datatype: string
          mask: false
          value: NoDataExecutionPrevention
  variables:
    turn-off-data-execution-protection-variable:
      title: Turn off Data Execution Protection
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: turn_off_data_execution_prevention_for_explorer_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-turn-off-data-execution-prevention-explorer-set-disabled:
      test_title: '''Turn off Data Execution Prevention for Explorer'' is set to ''Disabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: turn-off-data-execution-protection-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-turn-off-data-execution-prevention-explorer-set-disabled
