assessment:
  id: ng.shared.164c4832bd5b120cc7dde245
  version: 1
  assessment_title: Ubuntu 22.04 LTS must require users to reauthenticate for privilege escalation or when changing roles.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the "/etc/sudoers" file has no occurrences of "!authenticate" with the following command: $ sudo egrep
    -iR ''!authenticate'' /etc/sudoers /etc/sudoers.d/ If any occurrences of "!authenticate" return from the command, this
    is a finding.'
  inputs: []
  evidence: []
