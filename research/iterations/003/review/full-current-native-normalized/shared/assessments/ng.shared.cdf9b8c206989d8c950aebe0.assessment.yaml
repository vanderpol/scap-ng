assessment:
  id: ng.shared.cdf9b8c206989d8c950aebe0
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that the SSH daemon does not allow authentication
    using an empty password.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'To determine how the SSH daemon''s "PermitEmptyPasswords" option is set, run the following command: # grep -i
    PermitEmptyPasswords /etc/ssh/sshd_config PermitEmptyPasswords no If no line, a commented line, or a line indicating the
    value "no" is returned, the required value is set. If the required value is not set, this is a finding.'
  inputs: {}
  evidence: []
