assessment:
  id: ng.shared.cc72d1ee74c0ce30f618433f
  version: 1
  assessment_title: Do Not Allow Users to Set Environment Options
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-rpminfo-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          value: openssh-server
      object_title: null
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          value: ^[\s]*(?i)PermitUserEnvironment(?-i)[\s]+(\w*)[\s]*(?:|(?:#.*))?$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states:
    state-no:
      state_title: 'no'
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: 'no'
        operation: case insensitive equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-package-openssh-server-removed:
      test_title: package openssh-server is removed
      capability: linux.rpminfo
      object: linux-rpminfo-object
      check_existence: none_exist
      check: all
    test-check-value-permituserenvironment-in-etc-ssh-sshd-config:
      test_title: Check value of PermitUserEnvironment in /etc/ssh/sshd_config
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: all_exist
      check: all
      states:
      - state-no
  evaluate:
    any:
    - test: test-package-openssh-server-removed
    - test: test-check-value-permituserenvironment-in-etc-ssh-sshd-config
