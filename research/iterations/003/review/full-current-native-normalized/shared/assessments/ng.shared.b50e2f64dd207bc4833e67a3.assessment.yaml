assessment:
  id: ng.shared.b50e2f64dd207bc4833e67a3
  version: 1
  assessment_title: The operating system must configure auditing to reduce the likelihood of storage capacity being exceeded.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The Audit Configuration profile is required. This check applies to the global zone only. Determine the zone
    that is currently being secured. # zonename If the command output is "global", this check applies. Check the status of
    the audit system. It must be auditing. # pfexec auditconfig -getplugin p_fsize=4M (example output) If the output of this
    command does not contain a specific file size, this is a finding.'
  inputs: {}
  evidence: []
