assessment:
  id: ng.shared.d8cda20a3c4a794317f3a3f3
  version: 1
  assessment_title: The macOS system must be configured to audit all authorization and authentication events.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to audit login events with the following command: /usr/bin/awk -F'':''
    ''/^flags/ { print $NF }'' /etc/security/audit_control | /usr/bin/tr '','' ''\n'' | /usr/bin/grep -Ec ''aa'' If the result
    is not "1", this is a finding.'
  inputs: {}
  evidence: []
