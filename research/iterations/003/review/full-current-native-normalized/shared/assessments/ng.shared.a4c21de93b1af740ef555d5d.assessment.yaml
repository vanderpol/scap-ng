assessment:
  id: ng.shared.a4c21de93b1af740ef555d5d
  version: 1
  assessment_title: OL08-00-010140 - OL 8 operating systems booted with United Extensible Firmware Interface (UEFI) must require
    authentication upon booting into single-user mode and maintenance.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /boot/efi/EFI/redhat/grub.cfg
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*set\s+superusers\s*=\s*"(\w+)"\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
    independent-textfilecontent54-object-2:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /boot/efi/EFI/redhat/user.cfg
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*GRUB2_PASSWORD=(\S+)\b
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^\S+$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54-2:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^grub\.pbkdf2\.sha512
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-boot-efi-efi-redhat-grub-cfg-superusers-exists-has-name:
      test_title: /boot/efi/EFI/redhat/grub.cfg:superusers exists and has a name.
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: all_exist
      check: all
      states:
      - state-independent-textfilecontent54
    test-boot-efi-efi-redhat-user-cfg-grub2-password-exists-has:
      test_title: /boot/efi/EFI/redhat/user.cfg:GRUB2_PASSWORD exists and has a PBKDF2/SHA512 password assigned.
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-2
      check_existence: all_exist
      check: all
      states:
      - state-independent-textfilecontent54-2
  evaluate:
    all:
    - test: test-boot-efi-efi-redhat-grub-cfg-superusers-exists-has-name
    - test: test-boot-efi-efi-redhat-user-cfg-grub2-password-exists-has
