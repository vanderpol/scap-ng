assessment:
  id: ng.shared.bbd58c745a0bfd2e04189392
  version: 1
  assessment_title: The kernel core dump data directory must be owned by root.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The root role is required. This check applies to the global zone only. Determine the zone that you are currently
    securing. # zonename If the command output is "global", this check applies. Determine the location of the system dump
    directory. # dumpadm | grep directory Check the ownership of the kernel core dump data directory. # ls -ld [savecore directory]
    If the kernel core dump data directory is not owned by root, this is a finding. In Solaris 11, /var/crash is linked to
    /var/share/crash.'
  inputs: []
  evidence: []
