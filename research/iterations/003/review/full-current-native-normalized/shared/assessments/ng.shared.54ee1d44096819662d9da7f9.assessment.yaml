assessment:
  id: ng.shared.54ee1d44096819662d9da7f9
  version: 1
  assessment_title: Exchange Send Fatal Errors to Microsoft must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    run-get-exchangeserver-display-errorreportingenabled-configuration-collection:
      collection_title: Run Get-ExchangeServer to display ErrorReportingEnabled configuration
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: add-pssnapin Microsoft.Exchange.Management.Powershell.Snapin;Get-TransportService | Get-ExchangeServer -status
            | Select-Object -Property Name, Identity, ErrorReportingEnabled | Format-Table -HideTableHeaders | Out-String
            -Width 4096
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: \w
      behaviors:
        error_if_stderr_exists: 'true'
  tests:
    test-each-exchange-server-if-value-errorreportingenabled-not-set-false-this:
      test_title: For each Exchange Server, if the value of ErrorReportingEnabled is not set to False, this is a finding.
      capability: independent.shellcommand
      collection: run-get-exchangeserver-display-errorreportingenabled-configuration-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Verify setting is false
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: (?i)false$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-each-exchange-server-if-value-errorreportingenabled-not-set-false-this
