assessment:
  id: ng.shared.bee7cb48989d1f75c483a075
  version: 1
  assessment_title: WN10-AU-000560 - Windows 10 must be configured to audit other Logon/Logoff Events Successes.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-auditeventpolicysubcategories-collection:
      collection_title: null
      capability: windows.auditeventpolicysubcategories
  tests:
    test-audit-logon-set-failure-succss-failure:
      test_title: '''Audit Logon'' is set to ''Failure'' and ''Succss and Failure'
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: '''Log On'' is set to ''Success'''
          capability: windows.auditeventpolicysubcategories
          state:
            field: other_logon_logoff_events
            value: AUDIT_SUCCESS
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: '''Log On'' is set to ''Success'' and ''Failure'''
          capability: windows.auditeventpolicysubcategories
          state:
            field: other_logon_logoff_events
            value: AUDIT_SUCCESS_FAILURE
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-audit-logon-set-failure-succss-failure
