assessment:
  id: ng.shared.467e22cac20be9303489a3c9
  version: 1
  assessment_title: The macOS system must disable sending search data from Spotlight to Apple.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable sending search data from Spotlight with the following command:
    /usr/bin/osascript -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.assistant.support'')\ .objectForKey(''Search
    Queries Data Sharing Status'').js EOS If the result is not "2", this is a finding.'
  inputs: []
  evidence: []
