assessment:
  id: ng.shared.d846876022be56bc3b25860b
  version: 1
  assessment_title: Logins to the root account must be restricted to the system console only.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This check applies to the global zone only. Determine the zone that you are currently securing. # zonename If
    the command output is "global", this check applies. Determine if root login is restricted to the console. # grep "^CONSOLE=/dev/console"
    /etc/default/login If the output of this command is not: CONSOLE=/dev/console this is a finding.'
  inputs: []
  evidence: []
