  assessment_title: Access to the Windows Store must be turned off.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The Windows Store is not installed by default. If the \Windows\WinStore directory does not exist, this is NA.
    If the following registry value does not exist or is not configured as specified, this is a finding: Registry Hive: HKEY_LOCAL_MACHINE
    Registry Path: \SOFTWARE\Policies\Microsoft\Windows\Explorer\ Value Name: NoUseStoreOpenWith Type: REG_DWORD Value: 1'
