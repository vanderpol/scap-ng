assessment:
  id: ng.shared.0b515aefa01342a3c83cd1b7
  version: 1
  assessment_title: Sharing and Security Model for Local Accounts
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Control\Lsa
        name:
          operation: equals
          datatype: string
          mask: false
          value: ForceGuest
      object_title: null
  variables:
    network-access-sharing-security-model-local-accounts-variable:
      title: 'Network access: Sharing and security model for local accounts'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: sharing_and_security_model_for_local_accounts_var
        validation:
          alternatives:
          - literal: '0'
            hint: classic
          - literal: '1'
            hint: guests_only
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: network-access-sharing-security-model-local-accounts-variable
          operation: equals
          datatype: int
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-network-access-sharing-security-model-local-accounts-set-classic-local:
      test_title: '''Network access: Sharing and security model for local accounts'' is set to ''Classic - local users authenticate
        as themselves'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-network-access-sharing-security-model-local-accounts-set-classic-local
