assessment:
  id: ng.shared.988daa8f6cd54bcd3d7c608b
  version: 1
  assessment_title: Smartcard authentication enabled for graphical user logon.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-rpminfo-collection:
      collection_title: null
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: dconf
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/dconf/profile/user
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^user-db:user\nsystem-db:local$
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
    check-value-assigned-enable-smartcard-authentication-collection:
      collection_title: check the value assigned to enable-smartcard-authentication
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/dconf/db/
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[0-9].*$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*\[org/gnome/login-screen\](?:[^\n]*\n+)+?enable-smartcard-authentication\s*=\s*(\w+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        multiline: 'true'
        max_depth: '-1'
        recurse: symlinks and directories
        recurse_direction: down
  tests:
    test-package-dconf-installed:
      test_title: package dconf is installed
      capability: linux.rpminfo
      collection: linux-rpminfo-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state: null
    test-dconf-user-profile-exists:
      test_title: dconf user profile exists
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state: null
    test-check-enable-smartcard-authentication-set-true:
      test_title: check for enable-smartcard-authentication set to true
      capability: independent.textfilecontent54
      collection: check-value-assigned-enable-smartcard-authentication-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: the value assigned to enable-smartcard-authentication is true
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^true$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-check-enable-smartcard-authentication-set-false:
      test_title: check for enable-smartcard-authentication set to false
      capability: independent.textfilecontent54
      collection: check-value-assigned-enable-smartcard-authentication-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: the value assigned to enable-smartcard-authentication is false
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^false$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    any:
    - not:
        test: test-package-dconf-installed
    - all:
      - any:
        - not:
            test: test-package-dconf-installed
        - test: test-dconf-user-profile-exists
      - test: test-check-enable-smartcard-authentication-set-true
      - not:
          test: test-check-enable-smartcard-authentication-set-false
