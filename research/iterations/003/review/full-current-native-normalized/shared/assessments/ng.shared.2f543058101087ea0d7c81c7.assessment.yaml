assessment:
  id: ng.shared.2f543058101087ea0d7c81c7
  version: 1
  assessment_title: The built-in guest account must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    return-renamed-guest-account-information-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: $( if((Get-CimInstance Win32_OperatingSystem).ProductType -eq 2){ Get-ADUser -Filter * -Properties SID |
            Where-Object {$_.SID -match "^S-1-5-[0-9-]+-501$"} | Select-Object Name,Enabled -First 1 | Format-List } else
            { Get-Localuser | Where-Object {$_.SID -match '^S-1-5-[0-9-]+-501$'} } ) | Format-List
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: .+
      object_title: Return the renamed guest account information
  states:
    state-guest-account-must-not-be-enabled:
      state_title: Guest account must not be enabled
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: Enabled\s+:\s+True
        operation: pattern match
        datatype: string
        mask: false
        entity_check: none satisfy
        entity_existence: at_least_one_exists
  tests:
    test-windows-built-in-guest-account-disabled:
      test_title: Windows built-in guest account must be disabled.
      capability: independent.shellcommand
      object: return-renamed-guest-account-information-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-guest-account-must-not-be-enabled
  evaluate:
    test: test-windows-built-in-guest-account-disabled
