assessment:
  id: ng.shared.5380803e3e87408a7f2ccb36
  version: 1
  assessment_title: The Oracle Linux operating system must implement multifactor authentication for access to privileged accounts
    via pluggable authentication modules (PAM).
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system implements multifactor authentication for remote access to privileged accounts via
    pluggable authentication modules (PAM). Check the "/etc/sssd/sssd.conf" file for the authentication services that are
    being used with the following command: # grep services /etc/sssd/sssd.conf /etc/sssd/conf.d/*.conf services = nss, pam
    If the "pam" service is not present on all "services" lines, this is a finding.'
  inputs: []
  evidence: []
