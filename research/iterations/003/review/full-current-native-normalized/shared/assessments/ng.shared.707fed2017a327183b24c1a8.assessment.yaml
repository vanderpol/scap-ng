assessment:
  id: ng.shared.707fed2017a327183b24c1a8
  version: 1
  assessment_title: A file integrity baseline must be created, maintained, and reviewed at least weekly to determine if unauthorized
    changes have been made to important system files located in the root file system.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The root role is required. Solaris 11 includes the Basic Account and Reporting Tool (BART), which uses cryptographic-strength
    checksums and file system metadata to determine changes. By default, the manifest generator catalogs all attributes of
    all files in the root (/) file system. File systems mounted on the root file system are cataloged only if they are of
    the same type as the root file system. A Baseline BART manifest may exist in: /var/adm/log/bartlogs/[control manifest
    filename] If a BART manifest does not exist, this is a finding. At least weekly, create a new BART baseline report. #
    bart create > /var/adm/log/bartlogs/[new manifest filename] Compare the new report to the previous report to identify
    any changes in the system baseline. # bart compare /var/adm/log/bartlogs/[baseline manifest filename] /var/adm/log/bartlogs/[new
    manifest filename] Examine the BART report for changes. If there are changes to system files in /etc that are not approved,
    this is a finding.'
  inputs: {}
  evidence: []
