assessment:
  id: ng.shared.0ba9c35e6627ad8becc71db3
  version: 1
  assessment_title: Windows 10 domain-joined systems must have a Trusted Platform Module (TPM) enabled and ready for use.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    check-tpm-values-collection:
      collection_title: Check for TPM values
      capability: windows.cmdlet
      select:
        module_name:
          operation: equals
          datatype: string
          mask: false
          value: TrustedPlatformModule
        module_id:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
        module_version:
          operation: equals
          datatype: version
          mask: false
          nil: true
          value: ''
        verb:
          operation: equals
          datatype: string
          mask: false
          value: Get
        noun:
          operation: equals
          datatype: string
          mask: false
          value: Tpm
        parameters:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
        select:
          operation: equals
          datatype: record
          mask: false
          value:
            record:
            - name: property
              value: tpmpresent,tpmready
              operation: equals
              datatype: string
              mask: false
              entity_check: all
    check-tpm-specific-version-collection:
      collection_title: Check for TPM Specific Version
      capability: windows.cmdlet
      select:
        module_name:
          operation: equals
          datatype: string
          mask: false
          value: CimCmdlets
        module_id:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
        module_version:
          operation: equals
          datatype: version
          mask: false
          nil: true
          value: ''
        verb:
          operation: equals
          datatype: string
          mask: false
          value: Get
        noun:
          operation: equals
          datatype: string
          mask: false
          value: CimInstance
        parameters:
          operation: equals
          datatype: record
          mask: false
          value:
            record:
            - name: classname
              value: Win32_TPM
              operation: equals
              datatype: string
              mask: false
              entity_check: all
            - name: namespace
              value: root\cimv2\security\microsofttpm
              operation: equals
              datatype: string
              mask: false
              entity_check: all
        select:
          operation: equals
          datatype: record
          mask: false
          value:
            record:
            - name: property
              value: specversion
              operation: equals
              datatype: string
              mask: false
              entity_check: all
  tests:
    test-windows-system-have-tpm-ready-use:
      test_title: Windows system must have TPM and must be ready to use
      capability: windows.cmdlet
      collection: check-tpm-values-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: TPM values must equal True
        state_capability: windows.cmdlet
        state:
          field: value
          value:
            record:
            - name: tpmpresent
              value: 'True'
              operation: equals
              datatype: string
              mask: false
              entity_check: all
            - name: tpmready
              value: 'True'
              operation: equals
              datatype: string
              mask: false
              entity_check: all
          operation: equals
          datatype: record
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-windows-system-tpm-specific-version-should-1-2-or-2:
      test_title: Windows system TPM specific version should be 1.2 or 2.0
      capability: windows.cmdlet
      collection: check-tpm-specific-version-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: Specific Version must be 2.0 or 1.2
        state_capability: windows.cmdlet
        state:
          field: value
          value:
            record:
            - name: specversion
              value: \b(1\.2|2\.0)\b
              operation: pattern match
              datatype: string
              mask: false
              entity_check: all
          operation: equals
          datatype: record
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-windows-system-have-tpm-ready-use
    - test: test-windows-system-tpm-specific-version-should-1-2-or-2
