assessment:
  id: ng.shared.3d739fa4874a391c13f535c9
  version: 1
  assessment_title: The Oracle Linux operating system must display the date and time of the last successful account logon
    upon SSH logon.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-rpminfo-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: openssh-server
      object_title: null
    check-etc-ssh-sshd-config-printlastlog-setting-its-value-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[\s]*(?i)PrintLastLog(?-i)[ \t]+([\w\"]+)[\s]*(?:|(?:#.*))?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: Check /etc/ssh/sshd_config for the PrintLastLog setting and its value
  states:
    state-the-value-was-set-to-yes:
      state_title: The value was set to yes
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^yes$|^"yes"$
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-package-openssh-server-removed:
      test_title: package openssh-server is removed
      capability: linux.rpminfo
      object: linux-rpminfo-object
      check_existence: none_exist
      check: all
    test-tests-value-printlastlog-setting-in-etc-ssh-sshd-config-file:
      test_title: tests the value of PrintLastLog setting in the /etc/ssh/sshd_config file
      capability: independent.textfilecontent54
      object: check-etc-ssh-sshd-config-printlastlog-setting-its-value-object
      check_existence: all_exist
      check: all
      states:
      - state-the-value-was-set-to-yes
  evaluate:
    any:
    - test: test-package-openssh-server-removed
    - test: test-tests-value-printlastlog-setting-in-etc-ssh-sshd-config-file
