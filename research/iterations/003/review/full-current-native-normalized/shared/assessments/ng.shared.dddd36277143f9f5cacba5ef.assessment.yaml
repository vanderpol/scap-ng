assessment:
  id: ng.shared.dddd36277143f9f5cacba5ef
  version: 1
  assessment_title: AZLX-23-002405 - Amazon Linux 2023 must enforce a delay of at least four seconds between logon prompts
    following a failed logon attempt.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/login.defs
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*FAIL_DELAY\s+(\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-etc-login-defs-fail-delay-4-or-greater:
      test_title: '/etc/login.defs: FAIL_DELAY = 4 or greater'
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: '4'
          operation: greater than or equal
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-etc-login-defs-fail-delay-4-or-greater
