assessment:
  id: ng.shared.7d45ac41ce16c71b86eb5783
  version: 1
  assessment_title: OL07-00-020030 - The Oracle Linux operating system must be configured so that a file integrity tool verifies
    the baseline operating system configuration at least weekly.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-rpminfo-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          value: aide
      object_title: null
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/crontab
        pattern:
          operation: pattern match
          datatype: string
          value: ^[ \t]*([\S]+[ \t]+[\S]+[ \t]+\*[ \t]+\*[ \t]+[\S]+)[ \t]+root[ \t]+\/usr\/sbin\/aide[ \t]+\-\-check(?:[\s]+|[\>\|]|$)
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
    independent-textfilecontent54-object-2:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/cron.d
        filename:
          operation: pattern match
          datatype: string
          value: ^.+$
        pattern:
          operation: pattern match
          datatype: string
          value: ^[ \t]*([\S]+[ \t]+[\S]+[ \t]+\*[ \t]+\*[ \t]+[\S]+)[ \t]+root[ \t]+\/usr\/sbin\/aide[ \t]+\-\-check(?:[\s]+|[\>\|]|$)
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
    independent-textfilecontent54-object-3:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /var/spool/cron/root
        pattern:
          operation: pattern match
          datatype: string
          value: ^[ \t]*([\S]+[ \t]+[\S]+[ \t]+\*[ \t]+\*[ \t]+[\S]+)[ \t]+\/usr\/sbin\/aide[ \t]+\-\-check(?:[\s]+|[\>\|]|$)
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
    independent-textfilecontent54-object-4:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/cron.daily
        filename:
          operation: pattern match
          datatype: string
          value: ^.+$
        pattern:
          operation: pattern match
          datatype: string
          value: ^[ \t]*/usr/sbin/aide[ \t]*\-\-check(?:[\s]+|[\>\|]|$)
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
    independent-textfilecontent54-object-5:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/cron.weekly
        filename:
          operation: pattern match
          datatype: string
          value: ^.+$
        pattern:
          operation: pattern match
          datatype: string
          value: ^[ \t]*/usr/sbin/aide[ \t]*\-\-check(?:[\s]+|[\>\|]|$)
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
    independent-textfilecontent54-object-6:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/cron.hourly
        filename:
          operation: pattern match
          datatype: string
          value: ^.+$
        pattern:
          operation: pattern match
          datatype: string
          value: ^[ \t]*/usr/sbin/aide[ \t]*\-\-check(?:[\s]+|[\>\|]|$)
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states:
    state-the-days-of-the-week-must-be-set:
      state_title: The days of the week must be set
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ((?:[0-5]?[0-9]|\*)[ \t]+(?:[01]?[0-9]|2[0-3]|\*)[ \t]+\*[ \t]+\*[ \t]+(?:[0-7]|sun|mon|tue|wed|thu|fri|sat))
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-the-hours-in-the-day-must-be-set:
      state_title: The hours in the day must be set
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ((?:[0-5]?[0-9]|\*)[ \t]+(?:[01]?[0-9]|2[0-3])[ \t]+\*[ \t]+\*[ \t]+(?:[0-7]|sun|mon|tue|wed|thu|fri|sat|\*))
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-the-minutes-in-an-hour-must-be-set:
      state_title: The minutes in an hour must be set
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ((?:[0-5]?[0-9])[ \t]+(?:[01]?[0-9]|2[0-3]|\*)[ \t]+\*[ \t]+\*[ \t]+(?:[0-7]|sun|mon|tue|wed|thu|fri|sat|\*))
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-aide-package-installed:
      test_title: AIDE package is installed
      capability: linux.rpminfo
      object: linux-rpminfo-object
      check_existence: all_exist
      check: all
    test-aide-configured-run-daily-etc-crontab:
      test_title: AIDE is configured to run daily with /etc/crontab
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: all_exist
      check: all
      state_operator: OR
      states:
      - state-the-days-of-the-week-must-be-set
      - state-the-hours-in-the-day-must-be-set
      - state-the-minutes-in-an-hour-must-be-set
    test-aide-configured-run-daily-etc-cron-d:
      test_title: AIDE is configured to run daily with /etc/cron.d
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-2
      check_existence: all_exist
      check: all
      state_operator: OR
      states:
      - state-the-days-of-the-week-must-be-set
      - state-the-hours-in-the-day-must-be-set
      - state-the-minutes-in-an-hour-must-be-set
    test-aide-configured-run-daily-var-spool-cron-root:
      test_title: AIDE is configured to run daily with /var/spool/cron/root
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-3
      check_existence: all_exist
      check: all
      state_operator: OR
      states:
      - state-the-days-of-the-week-must-be-set
      - state-the-hours-in-the-day-must-be-set
      - state-the-minutes-in-an-hour-must-be-set
    test-aide-configured-run-daily-cron-daily:
      test_title: AIDE is configured to run daily with cron.daily
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-4
      check_existence: all_exist
      check: all
    test-aide-configured-run-daily-cron-weekly:
      test_title: AIDE is configured to run daily with cron.weekly
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-5
      check_existence: all_exist
      check: all
    test-aide-configured-run-daily-cron-hourly:
      test_title: AIDE is configured to run daily with cron.hourly
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-6
      check_existence: all_exist
      check: all
  evaluate:
    all:
    - test: test-aide-package-installed
    - any:
      - test: test-aide-configured-run-daily-etc-crontab
      - test: test-aide-configured-run-daily-etc-cron-d
      - test: test-aide-configured-run-daily-var-spool-cron-root
      - test: test-aide-configured-run-daily-cron-daily
      - test: test-aide-configured-run-daily-cron-weekly
      - test: test-aide-configured-run-daily-cron-hourly
