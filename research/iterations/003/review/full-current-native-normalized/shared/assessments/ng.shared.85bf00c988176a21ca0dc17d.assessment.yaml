  version: 1
  assessment_title: The macOS system must set Login Grace Time to 30.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to set Login Grace Time to 30 with the following command: /usr/sbin/sshd
    -G | /usr/bin/awk ''/logingracetime/{print $2}'' If the result is not "30", this is a finding.'
  inputs: []
  evidence: []
