assessment:
  id: ng.shared.7cfc5af6898fadb284357725
  version: 1
  assessment_title: The macOS system must be configured to disable sending diagnostic and usage data to Apple.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    system-settings-improve-siri-dictation-disable-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: zsh
        command:
          operation: equals
          datatype: string
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.assistant.support'')\

            .objectForKey(''Siri Data Sharing Opt-In Status'').js

            EOS'
      object_title: system_settings_improve_siri_dictation_disable_recommended_object
  states:
    state-system-settings-improve-siri-dictation-disable-recommend:
      state_title: system_settings_improve_siri_dictation_disable_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: '2'
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-settings-improve-siri-dictation-disable-recommended-test:
      test_title: system_settings_improve_siri_dictation_disable_recommended_test
      capability: independent.shellcommand
      object: system-settings-improve-siri-dictation-disable-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-system-settings-improve-siri-dictation-disable-recommend
  evaluate:
    test: test-system-settings-improve-siri-dictation-disable-recommended-test
