assessment:
  id: ng.shared.c00d50ede9ed9d3d177fa5f5
  version: 1
  assessment_title: Windows Server 2019 Kerberos policy user ticket renewal maximum lifetime must be limited to seven days
    or less.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This applies to domain controllers. It is NA for other systems. Verify the following is configured in the Default
    Domain Policy: Open "Group Policy Management". Navigate to "Group Policy Objects" in the Domain being reviewed (Forest
    >> Domains >> Domain). Right-click on the "Default Domain Policy". Select "Edit". Navigate to Computer Configuration >>
    Policies >> Windows Settings >> Security Settings >> Account Policies >> Kerberos Policy. If the "Maximum lifetime for
    user ticket renewal" is greater than "7" days, this is a finding.'
  inputs: {}
  evidence: []
