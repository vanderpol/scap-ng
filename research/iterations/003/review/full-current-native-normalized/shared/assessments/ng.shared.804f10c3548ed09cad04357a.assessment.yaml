assessment:
  id: ng.shared.804f10c3548ed09cad04357a
  version: 1
  assessment_title: The system must disable accounts after three consecutive unsuccessful login attempts.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    lock-after-retries-in-etc-security-policy-conf-collection:
      collection_title: LOCK_AFTER_RETRIES in /etc/security/policy.conf
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/security/policy.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*LOCK_AFTER_RETRIES=(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    retries-in-etc-default-login-collection:
      collection_title: RETRIES in /etc/default/login
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/default/login
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*RETRIES=(\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    lock-after-retries-in-etc-user-attr-collection:
      collection_title: lock_after_retries in /etc/user_attr
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/user_attr
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[^:#]+:[^:#]*:[^:#]*:[^:#]*:[^:#]*(?:[^:#]*;)?lock_after_retries=([^;\s]+)(?:;|\s|$)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-lock-after-retries-yes-in-etc-security-policy-conf:
      test_title: LOCK_AFTER_RETRIES == YES in /etc/security/policy.conf
      capability: independent.textfilecontent54
      collection: lock-after-retries-in-etc-security-policy-conf-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: LOCK_AFTER_RETRIES == YES in /etc/security/policy.conf
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: 'YES'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-retries-3-in-etc-default-login:
      test_title: RETRIES <= 3 in /etc/default/login
      capability: independent.textfilecontent54
      collection: retries-in-etc-default-login-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: RETRIES <= 3 in /etc/default/login
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: '3'
          operation: less than or equal
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-lock-after-retries-no-in-etc-user-attr:
      test_title: lock_after_retries != no in /etc/user_attr
      capability: independent.textfilecontent54
      collection: lock-after-retries-in-etc-user-attr-collection
      assertion:
        existence: any_exist
        item_quantifier: none satisfy
        state_title: lock_after_retries == no
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: 'no'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-lock-after-retries-yes-in-etc-security-policy-conf
    - test: test-retries-3-in-etc-default-login
    - test: test-lock-after-retries-no-in-etc-user-attr
