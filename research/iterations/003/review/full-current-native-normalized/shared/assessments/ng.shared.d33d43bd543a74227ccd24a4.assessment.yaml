assessment:
  id: ng.shared.d33d43bd543a74227ccd24a4
  version: 1
  assessment_title: Windows Server 2016 maximum password age must be configured to 60 days or less.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy
    >> Computer Configuration >> Windows Settings >> Security Settings >> Account Policies >> Password Policy. If the value
    for the "Maximum password age" is greater than "60" days, this is a finding. If the value is set to "0" (never expires),
    this is a finding. For server core installations, run the following command: Secedit /Export /Areas SecurityPolicy /CFG
    C:\Path\FileName.Txt If "MaximumPasswordAge" is greater than "60" or equal to "0" in the file, this is a finding.'
  inputs: {}
  evidence: []
