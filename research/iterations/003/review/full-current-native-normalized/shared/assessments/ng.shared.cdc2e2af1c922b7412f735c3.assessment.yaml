assessment:
  id: ng.shared.cdc2e2af1c922b7412f735c3
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that auditing is configured to produce records
    containing information to establish what type of events occurred, where the events occurred, the source of the events,
    and the outcome of the events. These audit records must also identify individual identities of group account users.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system produces audit records containing information to establish when (date and time)
    the events occurred. Check to see if auditing is active by issuing the following command: # systemctl is-active auditd.service
    active If the "auditd" status is not active, this is a finding.'
  inputs: []
  evidence: []
