assessment:
  id: ng.shared.82b5d28ae8bb4739c8087a96
  version: 1
  assessment_title: Network - Windows Connect Now Wizards
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: Software\Policies\Microsoft\Windows\WCN\UI
        name:
          operation: equals
          datatype: string
          value: DisableWcnUi
      object_title: null
  variables:
    prohibit-access-windows-connect-now-wizards-variable:
      title: Prohibit Access of the Windows Connect Now Wizards
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: prohibit_access_of_the_windows_connect_now_wizards_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: prohibit-access-windows-connect-now-wizards-variable
          operation: equals
          datatype: int
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-prohibit-access-windows-connect-now-wizards-set-enabled:
      test_title: '''Prohibit Access of the Windows Connect Now wizards'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-prohibit-access-windows-connect-now-wizards-set-enabled
