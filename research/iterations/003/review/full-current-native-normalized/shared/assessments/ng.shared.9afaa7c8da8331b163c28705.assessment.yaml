assessment:
  id: ng.shared.9afaa7c8da8331b163c28705
  version: 1
  assessment_title: Ubuntu 22.04 LTS must have system commands set to a mode of "755" or less permissive.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    all-files-in-system-command-directories-mode-755-gwrite-should-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: only one
          value:
            variable: system-command-directories-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
      filters:
      - action: exclude
        state: state-mode-755-or-less-permissive-gwrite-should-be-false
      - action: exclude
        state: state-symbolic-links
      - action: exclude
        state: state-unix-file
      object_title: All files in system command directories with mode 755 (gwrite should be = false)
    all-files-in-system-command-directories-mode-755-owrite-should-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: only one
          value:
            variable: system-command-directories-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
      filters:
      - action: exclude
        state: state-mode-755-or-less-permissive-owrite-should-be-false
      - action: exclude
        state: state-symbolic-links
      - action: exclude
        state: state-unix-file
      object_title: All files in system command directories with mode 755 (owrite should be = false)
  variables:
    system-command-directories-variable:
      title: system command directories
      kind: constant
      datatype: string
      expression:
        literal:
        - /bin
        - /sbin
        - /usr/bin
        - /usr/sbin
        - /usr/local/bin
        - /usr/local/sbin
  states:
    state-mode-755-or-less-permissive-gwrite-should-be-false:
      state_title: Mode 755 or less permissive (gwrite should be = false.)
      capability: unix.file
      state:
        field: gwrite
        value: 'false'
        operation: equals
        datatype: boolean
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-symbolic-links:
      state_title: symbolic links
      capability: unix.file
      state:
        field: type
        value: symbolic link
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-unix-file:
      state_title: null
      capability: unix.file
      state:
        field: type
        value: directory
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-mode-755-or-less-permissive-owrite-should-be-false:
      state_title: Mode 755 or less permissive (owrite should be = false.)
      capability: unix.file
      state:
        field: owrite
        value: 'false'
        operation: equals
        datatype: boolean
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-files-in-system-command-dirs-have-mode-755-or-less:
      test_title: Files in System command dirs have mode 755 or less permissive (gwrite should be = false.)
      capability: unix.file
      object: all-files-in-system-command-directories-mode-755-gwrite-should-object
      check_existence: none_exist
      check: all
    test-files-in-system-command-dirs-have-mode-755-or-less-2:
      test_title: Files in System command dirs have mode 755 or less permissive (owrite should be = false.)
      capability: unix.file
      object: all-files-in-system-command-directories-mode-755-owrite-should-object
      check_existence: none_exist
      check: all
  evaluate:
    all:
    - test: test-files-in-system-command-dirs-have-mode-755-or-less
    - test: test-files-in-system-command-dirs-have-mode-755-or-less-2
