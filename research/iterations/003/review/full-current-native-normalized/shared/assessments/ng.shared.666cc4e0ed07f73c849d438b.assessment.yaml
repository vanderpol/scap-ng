assessment:
  id: ng.shared.666cc4e0ed07f73c849d438b
  version: 1
  assessment_title: The macOS system must configure install.log retention to 365.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured with install.log retention to 365 with the following command: /usr/sbin/aslmanager
    -dd 2>&1 | /usr/bin/awk ''/\/var\/log\/install.log$/ {count++} /Processing module com.apple.install/,/Finished/ { for
    (i=1;i<=NR;i++) { if ($i == "TTL" && $(i+2) >= 365) { ttl="True" }; if ($i == "MAX") {max="True"}}} END{if (count > 1)
    { print "Multiple config files for /var/log/install, manually remove the extra files"} else if (max == "True") { print
    "all_max setting is configured, must be removed" } if (ttl != "True") { print "TTL not configured" } else { print "Yes"
    }}'' If the result is not "yes", this is a finding.'
  inputs: []
  evidence: []
