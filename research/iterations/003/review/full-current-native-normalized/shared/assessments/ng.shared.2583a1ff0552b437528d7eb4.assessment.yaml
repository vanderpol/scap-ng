assessment:
  id: ng.shared.2583a1ff0552b437528d7eb4
  version: 1
  assessment_title: TCP Wrappers must be enabled and configured per site policy to only allow access by approved hosts and
    services.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Check that TCP Wrappers are enabled and the host.deny and host.allow files exist. # inetadm -p | grep tcp_wrappers
    If the output of this command is "tcp_wrappers=FALSE", this is a finding. # ls /etc/hosts.deny /etc/hosts.deny # ls /etc/hosts.allow
    /etc/hosts.allow If these files do not exist or do not contain the names of allowed or denied hosts, this is a finding.'
  inputs: {}
  evidence: []
