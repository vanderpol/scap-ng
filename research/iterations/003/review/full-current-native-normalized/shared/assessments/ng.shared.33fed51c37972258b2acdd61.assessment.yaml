assessment:
  id: ng.shared.33fed51c37972258b2acdd61
  version: 1
  assessment_title: The Oracle Linux operating system must take appropriate action when the audisp-remote buffer is full.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    check-etc-audisp-audispd-conf-value-assigned-overflow-action-setting-collection:
      collection_title: Check /etc/audisp/audispd.conf for the value assigned to overflow_action setting.
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audisp/audispd.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: (?i)^\s*overflow_action[ ]*=[ ]*([\w]+)\s*
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
  tests:
    test-check-value-assigned-overflow-action-in-etc-audisp-audispd-conf:
      test_title: Check the value assigned to overflow_action in /etc/audisp/audispd.conf
      capability: independent.textfilecontent54
      collection: check-etc-audisp-audispd-conf-value-assigned-overflow-action-setting-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: The value is set to a case insensitive syslog, single, or halt
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: (?i)^syslog|single|halt$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-check-value-assigned-overflow-action-in-etc-audisp-audispd-conf
