assessment:
  id: ng.shared.cd67473fab929707065e340c
  version: 1
  assessment_title: The Oracle Linux operating system must implement certificate status checking for PKI authentication.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    check-what-cert-policy-set-in-etc-pam-pkcs11-pam-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/pam_pkcs11/pam_pkcs11.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[\s]*cert_policy[ \t]+=[ \t]+([\w\,"' ]+);\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: Check what cert_policy is set to in /etc/pam_pkcs11/pam_pkcs11.conf
    there-3-or-more-cert-policy-ocsp-on-option-set-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/pam_pkcs11/pam_pkcs11.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[\s]*cert_policy[ \t]+=[ \t]+([\w\,"' ]*ocsp_on[\w\,"' ]*);\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '3'
      object_title: There are 3 or more cert_policy with the ocsp_on option set in /etc/pam_pkcs11/pam_pkcs11.conf
  states:
    state-the-ocsp-on-option-is-present-in-the-collected-string:
      state_title: The ocsp_on option is present in the collected string
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^["']*ocsp_on["']*$|^["']*ocsp_on["',\s]|["',\s]ocsp_on["',\s]|["',\s]ocsp_on["']*$
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-check-all-cert-policy-entries-set-ocsp-on-option-in:
      test_title: Check all cert_policy entries are set with the ocsp_on option in /etc/pam_pkcs11/pam_pkcs11.conf
      capability: independent.textfilecontent54
      object: check-what-cert-policy-set-in-etc-pam-pkcs11-pam-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-the-ocsp-on-option-is-present-in-the-collected-string
    test-check-cert-policy-set-ocsp-on-option-3-or-more:
      test_title: Check cert_policy is set with the ocsp_on option 3 or more times in /etc/pam_pkcs11/pam_pkcs11.conf
      capability: independent.textfilecontent54
      object: there-3-or-more-cert-policy-ocsp-on-option-set-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    all:
    - test: test-check-all-cert-policy-entries-set-ocsp-on-option-in
    - test: test-check-cert-policy-set-ocsp-on-option-3-or-more
