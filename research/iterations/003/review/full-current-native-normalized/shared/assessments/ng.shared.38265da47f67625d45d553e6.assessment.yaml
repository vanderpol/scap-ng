assessment:
  id: ng.shared.38265da47f67625d45d553e6
  version: 1
  assessment_title: WN10-00-000005 - Domain-joined systems must use Windows 10 Enterprise Edition 64-bit version.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    editionid-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SOFTWARE\Microsoft\Windows NT\CurrentVersion
        name:
          operation: equals
          datatype: string
          value: EditionId
      object_title: EditionID
  states:
    state-editionid-enterprise-reg-sz:
      state_title: EditionID = Enterprise (reg_sz)
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_sz
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: Enterprise
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
    state-editionid-enterprises-reg-sz:
      state_title: EditionID = EnterpriseS (reg_sz)
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_sz
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: EnterpriseS
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-editionid-enterprise-or-enterprises:
      test_title: EditionID is Enterprise or EnterpriseS
      capability: windows.registry
      object: editionid-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-editionid-enterprise-reg-sz
      - state-editionid-enterprises-reg-sz
  evaluate:
    test: test-editionid-enterprise-or-enterprises
