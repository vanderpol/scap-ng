assessment:
  id: ng.shared.efa16d357d9c3a3b3e207fbf
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that the audit system takes appropriate action
    when there is an error sending audit records to a remote system.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    check-etc-audisp-audisp-remote-conf-value-assigned-network-failure-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audisp/audisp-remote.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: (?i)^\s*network_failure_action[ ]*=[ ]*([\w]+)\s*
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
      object_title: Check /etc/audisp/audisp-remote.conf for the value assigned to network_failure_action setting.
  states:
    state-the-value-is-set-to-a-case-insensitive-syslog-single-or-:
      state_title: The value is set to a case insensitive syslog, single, or halt
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: (?i)^syslog|single|halt$
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-check-value-assigned-network-failure-action-in-etc-audisp-audisp:
      test_title: Check the value assigned to network_failure_action in /etc/audisp/audisp-remote.conf
      capability: independent.textfilecontent54
      object: check-etc-audisp-audisp-remote-conf-value-assigned-network-failure-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-the-value-is-set-to-a-case-insensitive-syslog-single-or-
  evaluate:
    test: test-check-value-assigned-network-failure-action-in-etc-audisp-audisp
