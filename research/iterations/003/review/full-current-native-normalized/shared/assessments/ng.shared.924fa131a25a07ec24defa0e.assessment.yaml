assessment:
  id: ng.shared.924fa131a25a07ec24defa0e
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that the Network File System (NFS) is configured
    to use RPCSEC_GSS.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify "AUTH_GSS" is being used to authenticate NFS mounts. To check if the system is importing an NFS file
    system, look for any entries in the "/etc/fstab" file that have a file system type of "nfs" with the following command:
    # cat /etc/fstab | grep nfs 192.168.21.5:/mnt/export /data1 nfs4 rw,sync ,soft,sec=krb5:krb5i:krb5p If the system is mounting
    file systems via NFS and has the sec option without the "krb5:krb5i:krb5p" settings, the "sec" option has the "sys" setting,
    or the "sec" option is missing, this is a finding.'
  inputs: []
  evidence: []
