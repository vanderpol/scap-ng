assessment:
  id: ng.shared.54ac3c9859a1996b7f381837
  version: 1
  assessment_title: ASP.NET Installation
  mode: automated
  class: inventory
  purpose: applicability
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    if-asp-net-not-installed-this-not-applicable-object:
      capability: windows.cmdlet
      select:
        module_name:
          operation: equals
          datatype: string
          value: ServerManager
        module_id:
          operation: equals
          datatype: string
          nil: true
          value: ''
        module_version:
          operation: equals
          datatype: version
          nil: true
          value: ''
        verb:
          operation: equals
          datatype: string
          value: Get
        noun:
          operation: equals
          datatype: string
          value: windowsfeature
        parameters:
          operation: equals
          datatype: record
          value:
            record:
            - name: name
              value: web-asp-net,web-asp-net45
              operation: equals
              datatype: string
              entity_check: all
        select:
          operation: equals
          datatype: record
          value:
            record:
            - name: property
              value: installstate
              operation: equals
              datatype: string
              entity_check: all
      object_title: If ASP.NET is not installed, this is Not Applicable
  states:
    state-is-install-state-not-equal-to-installed:
      state_title: Is install state not equal to installed
      capability: windows.cmdlet
      state:
        field: value
        value:
          record:
          - name: installstate
            value: installed
            operation: case insensitive not equal
            datatype: string
            entity_check: all
        operation: equals
        datatype: record
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-asp-net-installed:
      test_title: Is ASP.NET installed?
      capability: windows.cmdlet
      object: if-asp-net-not-installed-this-not-applicable-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-is-install-state-not-equal-to-installed
  evaluate:
    not:
      test: test-asp-net-installed
