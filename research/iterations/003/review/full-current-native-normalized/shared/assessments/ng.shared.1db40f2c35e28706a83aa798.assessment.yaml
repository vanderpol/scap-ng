assessment:
  id: ng.shared.1db40f2c35e28706a83aa798
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that the SSH daemon performs strict mode checking
    of home directory configuration files.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the SSH daemon performs strict mode checking of home directory configuration files. The location of the
    "sshd_config" file may vary if a different daemon is in use. Inspect the "sshd_config" file with the following command:
    # grep -i strictmodes /etc/ssh/sshd_config StrictModes yes If "StrictModes" is set to "no", is missing, or the returned
    line is commented out, this is a finding.'
  inputs: []
  evidence: []
