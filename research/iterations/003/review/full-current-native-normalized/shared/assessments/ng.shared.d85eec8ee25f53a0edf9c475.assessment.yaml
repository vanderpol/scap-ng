assessment:
  id: ng.shared.d85eec8ee25f53a0edf9c475
  version: 1
  assessment_title: The Cisco router must be configured to back up the configuration when changes occur.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Review the Cisco router configuration to verify that it is compliant with this requirement. The example configuration
    below will send the configuration to a SCP server when a configuration change occurs. event manager applet BACKUP_CONFIG
    event syslog pattern "%SYS-5-CONFIG_I" action 1 info type routername action 2 cli command "enable" action 3 cli command
    "copy run scp" pattern "remote host" action 4 cli command "x.x.x.x" pattern "filename" action 5 cli command "$_info_routername-config"
    action 6 syslog priority informational msg "Configuration backup was executed" If the Cisco router is not configured to
    conduct backups of the configuration when changes occur, this is a finding.
  inputs: []
  evidence: []
