assessment:
  id: ng.shared.fd0ace97203a9bfc85892b93
  version: 1
  assessment_title: OL08-00-040321 - The graphical display manager must not be the default target on OL 8 unless approved.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-symlink-object:
      capability: unix.symlink
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/systemd/system/default.target
      object_title: null
  states:
    state-unix-symlink:
      state_title: null
      capability: unix.symlink
      state:
        field: canonical_path
        value: '[\S]*\/multi\-user\.target$'
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-default-target-symlinked-multi-user-target:
      test_title: default.target is symlinked to multi-user.target
      capability: unix.symlink
      object: unix-symlink-object
      check_existence: all_exist
      check: all
      states:
      - state-unix-symlink
  evaluate:
    test: test-default-target-symlinked-multi-user-target
