assessment:
  id: ng.shared.0627c04753c50ab3fbf570e0
  version: 1
  assessment_title: TS/RDS - Set Encryption Level
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\Windows NT\Terminal Services
        name:
          operation: equals
          datatype: string
          mask: false
          value: MinEncryptionLevel
  variables:
    set-client-connection-encryption-level-variable:
      title: Set client connection encryption level
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: set_client_connection_encryption_level_var
        validation:
          alternatives:
          - literal: '1'
            hint: low_level
          - literal: '2'
            hint: client_compatible
          - literal: '3'
            hint: high_level
  tests:
    test-set-client-connection-encryption-level-set-enabled-high-level:
      test_title: '''Set client connection encryption level'' is set to ''Enabled'' and ''High Level'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: set-client-connection-encryption-level-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-set-client-connection-encryption-level-set-enabled-high-level
