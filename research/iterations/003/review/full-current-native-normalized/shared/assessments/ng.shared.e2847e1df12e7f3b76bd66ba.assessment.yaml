            record:
            - name: classname
              value: Win32_DeviceGuard
              operation: equals
              datatype: string
              mask: false
              entity_check: all
            - name: namespace
              value: root\Microsoft\Windows\DeviceGuard
              operation: equals
              datatype: string
              mask: false
              entity_check: all
        select:
          operation: equals
          datatype: record
          mask: false
          value:
            record:
            - name: property
              value: RequiredSecurityProperties
              operation: equals
              datatype: string
              mask: false
              entity_check: all
    deviceguard-virtualizationbasedsecuritystatus-collection:
      collection_title: DeviceGuard VirtualizationBasedSecurityStatus
      capability: windows.cmdlet
      select:
        module_name:
          operation: equals
          datatype: string
