          operation: equals
          datatype: string
          mask: false
          value: CimInstance
        parameters:
          operation: equals
          datatype: record
          mask: false
          value:
            record:
            - name: classname
              value: Win32_DeviceGuard
              operation: equals
              datatype: string
              mask: false
              entity_check: all
            - name: namespace
              value: root\Microsoft\Windows\DeviceGuard
              operation: equals
              datatype: string
