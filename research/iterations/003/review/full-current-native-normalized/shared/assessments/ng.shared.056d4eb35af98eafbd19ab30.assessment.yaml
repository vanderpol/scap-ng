assessment:
  id: ng.shared.056d4eb35af98eafbd19ab30
  version: 1
  assessment_title: The system must be configured to force users to log off when their allowed logon hours expire.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy
    -> Computer Configuration -> Windows Settings -> Security Settings -> Local Policies -> Security Options. If the value
    for "Network security: Force logoff when logon hours expire" is not set to "Enabled", this is a finding.'
  inputs: {}
  evidence: []
