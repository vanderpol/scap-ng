assessment:
  id: ng.shared.076d325c390a883395d22eda
  version: 1
  assessment_title: OL08-00-040200 - The root account must be the only account having unrestricted access to the OL 8 system.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-password-object:
      capability: unix.password
      select:
        username:
          operation: not equal
          datatype: string
          value: root
      object_title: null
  states:
    state-unix-password:
      state_title: null
      capability: unix.password
      state:
        field: user_id
        value: '0'
        operation: not equal
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-only-root-account-has-uid-zero:
      test_title: Only the root account has a UID of zero.
      capability: unix.password
      object: unix-password-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-unix-password
  evaluate:
    test: test-only-root-account-has-uid-zero
