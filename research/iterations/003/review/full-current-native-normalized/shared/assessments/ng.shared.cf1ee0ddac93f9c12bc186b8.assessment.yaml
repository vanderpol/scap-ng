  version: 1
  assessment_title: The IIS 10.0 web server must not be running on a system providing any other role.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Review programs installed on the OS. Open Control Panel. Open Programs and Features. The following programs
    may be installed without any additional documentation: Administration Pack for IIS IIS Search Engine Optimization Toolkit
    Microsoft .NET Framework version 3.5 SP1 or greater Microsoft Web Platform Installer version 3.x or greater Virtual Machine
    Additions Review the installed programs, if any programs are installed other than those listed above, this is a finding.
    Note: If additional software is needed and has supporting documentation signed by the ISSO, this is not a finding.'
  inputs: {}
  evidence: []
