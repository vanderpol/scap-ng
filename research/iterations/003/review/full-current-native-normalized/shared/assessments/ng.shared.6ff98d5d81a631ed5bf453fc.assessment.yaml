assessment:
  id: ng.shared.6ff98d5d81a631ed5bf453fc
  version: 1
  assessment_title: Auditd Email Account to Notify Upon Action
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/auditd.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[ ]*action_mail_acct[ ]+=[ ]+(\S+)[ ]*$
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
      object_title: null
  variables:
    audit-action-mail-acct-setting-variable:
      title: audit action_mail_acct setting
      kind: external
      datatype: string
      input:
        required: true
        cardinality: one_or_more
        parameter: var_auditd_action_mail_acct
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value:
          variable: audit-action-mail-acct-setting-variable
        operation: equals
        datatype: string
        mask: false
        variable_check: all
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-email-account-actions:
      test_title: email account for actions
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    test: test-email-account-actions
