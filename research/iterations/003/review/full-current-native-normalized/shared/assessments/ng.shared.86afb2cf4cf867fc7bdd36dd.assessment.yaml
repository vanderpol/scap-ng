assessment:
  id: ng.shared.86afb2cf4cf867fc7bdd36dd
  version: 1
  assessment_title: Windows Server 2019 Kerberos user ticket lifetime must be limited to 10 hours or less.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This applies to domain controllers. It is NA for other systems. Verify the following is configured in the Default
    Domain Policy: Open "Group Policy Management". Navigate to "Group Policy Objects" in the Domain being reviewed (Forest
    >> Domains >> Domain). Right-click on the "Default Domain Policy". Select "Edit". Navigate to Computer Configuration >>
    Policies >> Windows Settings >> Security Settings >> Account Policies >> Kerberos Policy. If the value for "Maximum lifetime
    for user ticket" is "0" or greater than "10" hours, this is a finding.'
  inputs: {}
  evidence: []
