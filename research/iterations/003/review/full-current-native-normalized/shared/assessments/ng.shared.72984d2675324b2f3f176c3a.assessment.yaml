assessment:
  id: ng.shared.72984d2675324b2f3f176c3a
  version: 1
  assessment_title: Exchange receive connector maximum hop count must be 60.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    run-get-receiveconnector-display-maxhopcount-configuration-collection:
      collection_title: Run Get-ReceiveConnector to display MaxHopCount configuration
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: add-pssnapin Microsoft.Exchange.Management.Powershell.Snapin;Get-ReceiveConnector | Select-Object -Property
            Name, Identity, MaxHopCount  | Format-Table -HideTableHeaders | Out-String -Width 4096
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: \w
      behaviors:
        error_if_stderr_exists: 'true'
  tests:
    test-each-receive-connector-if-value-maxhopcount-not-set-60-this:
      test_title: For each Receive connector, if the value of MaxHopCount is not set to 60, this is a finding.
      capability: independent.shellcommand
      collection: run-get-receiveconnector-display-maxhopcount-configuration-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Verify value is 60
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: (?i)60$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-each-receive-connector-if-value-maxhopcount-not-set-60-this
