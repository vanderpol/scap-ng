assessment:
  id: ng.shared.ad3d7186730cc8b1d4dc794e
  version: 1
  assessment_title: The SUSE operating system must employ FIPS 140-2 approved cryptographic hashing algorithm for system authentication
    (login.defs).
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the SUSE operating system requires that the "ENCRYPT_METHOD" value in "/etc/login.defs" is set to "SHA512".
    Check the value of "ENCRYPT_METHOD" value in "/etc/login.defs" with the following command: > grep "^ENCRYPT_METHOD " /etc/login.defs
    ENCRYPT_METHOD SHA512 If "ENCRYPT_METHOD" is not set to "SHA512", if any values other that "SHA512" are configured, or
    if no output is produced, this is a finding.'
  inputs: []
  evidence: []
