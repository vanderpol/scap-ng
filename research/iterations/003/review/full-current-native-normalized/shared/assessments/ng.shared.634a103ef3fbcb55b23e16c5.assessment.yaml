  version: 1
  assessment_title: Automatic download of updates from the Windows Store must be turned off.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The Windows Store is not installed by default. If the \Windows\WinStore directory does not exist, this is NA.
    If the following registry value does not exist or is not configured as specified, this is a finding: Windows 2012 R2:
    Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\WindowsStore\ Value Name: AutoDownload Type:
    REG_DWORD Value: 0x00000002 (2) Windows 2012: Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\WindowsStore\WindowsUpdate\
    Value Name: AutoDownload Type: REG_DWORD Value: 0x00000002 (2)'
  inputs: []
  evidence: []
