assessment:
  id: ng.shared.9d82282dfbeeb5f85eabee07
  version: 1
  assessment_title: Nonadministrative user accounts or groups must only have print permissions on printer shares.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Open "Devices and Printers" in Control Panel or through Search. If there are no printers configured, this is
    NA.(Exclude Microsoft Print to PDF and Microsoft XPS Document Writer, which do not support sharing.) For each configured
    printer: Right click on the printer. Select "Printer Properties". Select the "Sharing" tab. View whether "Share this printer"
    is checked. For any printers with "Share this printer" selected: Select the Security tab. If any standard user accounts
    or groups have permissions other than "Print", this is a finding. Standard users will typically be given "Print" permission
    through the Everyone group. "All APPLICATION PACKAGES" and "CREATOR OWNER" are not considered standard user accounts for
    this requirement.'
  inputs: []
  evidence: []
