assessment:
  id: ng.shared.1c0b04f0368a7dee9739505b
  version: 1
  assessment_title: The Active Directory AdminSDHolder object must be configured with proper audit settings.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    query-both-fail-success-auditing-settings-adminsdholder-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: '$p=''AD:\CN=AdminSDHolder,CN=System,''+(Get-ADDomain).DistinguishedName;$a=(Get-Acl $p -Audit).Audit;$f=[bool]($a|Where-Object{$_.IdentityReference
            -match ''Everyone|S-1-1-0'' -and $_.AuditFlags -eq ''Failure'' -and ($_.ActiveDirectoryRights -match ''GenericAll|FullControl|All'')
            -and $_.InheritanceType -eq ''None''});$s=[bool]($a|Where-Object{$_.IdentityReference -match ''Everyone|S-1-1-0''
            -and $_.AuditFlags -eq ''Success'' -and ($_.ActiveDirectoryRights -match ''ExtendedRight|WriteProperty'') -and
            $_.InheritanceType -eq ''None''});if(-not $f -or -not $s){$r=@();if(-not $f){$r+=''MISSING/INVALID: Everyone [Failure]
            GenericAll/FullControl (Must be This object only)''};if(-not $s){$r+=''MISSING/INVALID: Everyone [Success] ExtendedRight/WriteProperty
            (Must be This object only)''};''Target_Object={0} | IdentityReference=Everyone (S-1-1-0) | Status=FAIL | Details={1}''
            -f $p.Replace(''AD:\'',''''),($r -join '' / '')}else{''Target_Object={0} | IdentityReference=Everyone (S-1-1-0)
            | Status=PASS | Details=All mandatory Failure and Success audit policies are correctly configured per the STIG.''
            -f $p.Replace(''AD:\'','''')}'
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: .+
      behaviors:
        error_if_stderr_exists: 'true'
      object_title: Query both Fail and Success auditing settings for AdminSDHolder
  states:
    state-no-lines-shall-exist-listed-with-status-of-fail:
      state_title: No lines shall exist listed with status of 'FAIL'
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: '=FAIL '
        operation: pattern match
        datatype: string
        mask: false
        entity_check: none satisfy
        entity_existence: at_least_one_exists
  tests:
    test-windows-server-active-directory-adminsdholder-object-configured-proper-audit-settings:
      test_title: Windows Server Active Directory AdminSDHolder object must be configured with proper audit settings.
      capability: independent.shellcommand
      object: query-both-fail-success-auditing-settings-adminsdholder-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-no-lines-shall-exist-listed-with-status-of-fail
  evaluate:
    test: test-windows-server-active-directory-adminsdholder-object-configured-proper-audit-settings
