assessment:
  id: ng.shared.a63b602736017169d4a538b1
  version: 1
  assessment_title: UBTU-18-010126 - The Ubuntu operating system must configure /var/log/syslog file to be owned by syslog.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    var-log-syslog-file-collection:
      collection_title: /var/log/syslog file
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /var/log
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: syslog
    etc-passwd-syslog-collection:
      collection_title: /etc/passwd for syslog
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc
        filename:
          operation: equals
          datatype: string
          mask: false
          value: passwd
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^syslog:x:([0-9]+):[0-9]+::.*:.*$
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
  variables:
    id-syslog-variable:
      title: ID for syslog
      kind: local
      datatype: int
      expression:
        values:
          collection: etc-passwd-syslog-collection
          field: subexpression
  tests:
    test-var-log-syslog-file-owned-by-syslog:
      test_title: /var/log/syslog file must be owned by syslog
      capability: unix.file
      collection: var-log-syslog-file-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: owned by syslog
        state_capability: unix.file
        state:
          field: user_id
          value:
            variable: id-syslog-variable
          operation: equals
          datatype: int
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-var-log-syslog-file-owned-by-syslog
