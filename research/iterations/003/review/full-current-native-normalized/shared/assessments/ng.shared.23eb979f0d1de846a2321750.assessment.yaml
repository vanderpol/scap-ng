assessment:
  id: ng.shared.23eb979f0d1de846a2321750
  version: 1
  assessment_title: Microsoft Strong Password Filtering
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    password-policy-object:
      capability: windows.passwordpolicy
      object_title: Password policy
  variables:
    enforce-password-complexity-variable:
      title: Enforce Password Complexity
      kind: external
      datatype: boolean
      input:
        required: true
        cardinality: one_or_more
        parameter: password_complexity_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  states:
    state-password-complexity-equals-variable:
      state_title: Password Complexity equals variable
      capability: windows.passwordpolicy
      state:
        field: password_complexity
        value:
          variable: enforce-password-complexity-variable
        operation: equals
        datatype: boolean
        variable_check: all
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-password-meet-complexity-requirements-set-enabled:
      test_title: '''Password must meet complexity requirements'' is set to ''Enabled'''
      capability: windows.passwordpolicy
      object: password-policy-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-password-complexity-equals-variable
  evaluate:
    test: test-password-meet-complexity-requirements-set-enabled
