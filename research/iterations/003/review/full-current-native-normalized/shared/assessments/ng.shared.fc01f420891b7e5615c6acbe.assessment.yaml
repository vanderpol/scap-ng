assessment:
  id: ng.shared.fc01f420891b7e5615c6acbe
  version: 1
  assessment_title: OL08-00-030120 - The OL 8 audit log directory must have a mode of 0700 or less permissive to prevent unauthorized
    read access.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/auditd.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*log_file\s*=\s*(\S+)/\S+\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
    audit-log-directory-collection:
      collection_title: Audit log directory
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: audit-data-directory-from-etc-audit-auditd-conf-variable
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
  variables:
    audit-data-directory-from-etc-audit-auditd-conf-variable:
      title: audit data directory from /etc/audit/auditd.conf
      kind: local
      datatype: string
      expression:
        values:
          collection: independent-textfilecontent54-collection
          field: subexpression
  tests:
    test-audit-log-directory-has-mode-0700-or-less-permissive:
      test_title: audit log directory has a mode of 0700 or less permissive
      capability: unix.file
      collection: audit-log-directory-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: Mode 0700 or less permissive
        state_capability: unix.file
        state:
          all:
          - field: suid
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: sgid
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: sticky
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: gread
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: gwrite
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: gexec
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: oread
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: owrite
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: oexec
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-audit-log-directory-has-mode-0700-or-less-permissive
