assessment:
  id: ng.shared.20a1cbdd1cea8b1d30540207
  version: 1
  assessment_title: X displays must not be exported to the world.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If X Windows is not used on the system, this is not applicable. Check the output of the xhost command from an
    X terminal. Procedure: $ xhost If the output reports access control is enabled (and possibly lists the hosts that can
    receive X Window logins), this is not a finding. If the xhost command returns a line indicating access control is disabled,
    this is a finding. NOTE: It may be necessary to define the display if the command reports it cannot open the display.
    Procedure: $ DISPLAY=MachineName:0.0; export DISPLAY MachineName may be replaced with an Internet Protocol Address. Repeat
    the check procedure after setting the display.'
  inputs: []
  evidence: []
