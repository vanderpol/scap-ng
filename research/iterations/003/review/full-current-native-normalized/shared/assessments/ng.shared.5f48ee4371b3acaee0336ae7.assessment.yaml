  version: 1
  assessment_title: Firefox must be configured to prevent JavaScript from raising or lowering windows.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Type "about:policies" in the browser address bar. If "Preferences" is not displayed under Policy Name or the
    Policy Value does not include "dom.disable_window_flip" with a value of "true" and status of "locked", this is a finding.
  inputs: {}
  evidence: []
