assessment:
  id: ng.shared.f8a36de77bfe1644a2a16ce3
  version: 1
  assessment_title: The macOS system must disable the system settings pane for Siri.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    system-settings-siri-settings-disable-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: zsh
        command:
          operation: equals
          datatype: string
          value: /usr/bin/profiles show -output stdout-xml | /usr/bin/xmllint --xpath '//key[text()="DisabledSystemSettings"]/following-sibling::*[1]'
            - | /usr/bin/grep com.apple.Siri-Settings.extension
      object_title: system_settings_siri_settings_disable_recommended_object
  states:
    state-system-settings-siri-settings-disable-recommended-state:
      state_title: system_settings_siri_settings_disable_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: .*
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-settings-siri-settings-disable-recommended-test:
      test_title: system_settings_siri_settings_disable_recommended_test
      capability: independent.shellcommand
      object: system-settings-siri-settings-disable-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-system-settings-siri-settings-disable-recommended-state
  evaluate:
    test: test-system-settings-siri-settings-disable-recommended-test
