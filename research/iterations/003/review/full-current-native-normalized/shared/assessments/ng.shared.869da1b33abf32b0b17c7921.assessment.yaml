          operation: equals
          datatype: string
          value: /etc/pam.d
        filename:
          operation: equals
          datatype: string
          value: system-auth
        pattern:
          operation: pattern match
          datatype: string
          value: ^[ \t]*password[ \t]+sufficient[ \t]+pam_unix\.so(?:[ \t]+|(?:[ \t][^#\r\f\n]+[ \t]))sha512(?:[ \t]|$)
        instance:
