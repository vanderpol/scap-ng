assessment:
  id: ng.shared.eda26236db5843c3a4ce10d8
  version: 1
  assessment_title: Windows Explorer - Shell Protocol Protected Mode
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Microsoft\Windows\CurrentVersion\Policies\Explorer
        name:
          operation: equals
          datatype: string
          mask: false
          value: PreXPSP2ShellProtocolBehavior
  variables:
    turn-off-shell-protocol-protected-mode-variable:
      title: Turn off shell protocol protected mode
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: turn_off_shell_protocol_protected_mode_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-turn-off-shell-protocol-protected-mode-set-disabled:
      test_title: '''Turn off shell protocol protected mode'' is set to ''Disabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: turn-off-shell-protocol-protected-mode-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-turn-off-shell-protocol-protected-mode-set-disabled
