assessment:
  id: ng.shared.0f4d317ef1d88ead994eb6c3
  version: 1
  assessment_title: Address Space Layout Randomization (ASLR) must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    sxadm-status-p-o-status-aslr-collection:
      collection_title: sxadm status -p -o status aslr
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: sxadm status -p -o status aslr
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
  tests:
    test-address-space-layout-randomization-aslr-enabled:
      test_title: Address Space Layout Randomization (ASLR) must be enabled.
      capability: independent.shellcommand
      collection: sxadm-status-p-o-status-aslr-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: must include 'enabled'
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: enabled
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-address-space-layout-randomization-aslr-enabled
