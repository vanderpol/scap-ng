assessment:
  id: ng.shared.04d81e2a8b074299a9efea6c
  version: 1
  assessment_title: The macOS system must enable security auditing.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    audit-auditd-enabled-recommended-object-collection:
      collection_title: audit_auditd_enabled_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: "LAUNCHD_RUNNING=$(/bin/launchctl print system | /usr/bin/grep -c '\"com.apple.auditd\" => enabled')\nAUDITD_RUNNING=$(/usr/sbin/audit\
            \ -c | /usr/bin/grep -c \"AUC_AUDITING\")\nif [[ $LAUNCHD_RUNNING == 1 ]] && [[ -e /etc/security/audit_control\
            \ ]] && [[ $AUDITD_RUNNING == 1 ]]; then\n  echo \"pass\"\nelse\n  echo \"fail\"\nfi"
  tests:
    test-audit-auditd-enabled-recommended-test:
      test_title: audit_auditd_enabled_recommended_test
      capability: independent.shellcommand
      collection: audit-auditd-enabled-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: audit_auditd_enabled_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: pass
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-audit-auditd-enabled-recommended-test
