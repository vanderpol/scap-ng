assessment:
  id: ng.shared.db268202d5a62bfa526fd165
  version: 1
  assessment_title: Ubuntu 22.04 LTS must have an application firewall enabled.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the ufw is enabled on the system with the following command: $ sudo ufw status Status: active If the
    above command returns the status as "inactive" or any type of error, this is a finding. If the ufw is not installed, ask
    the system administrator if another application firewall is installed. If a different firewall is active on the system,
    this is not a finding.'
  inputs: {}
  evidence: []
