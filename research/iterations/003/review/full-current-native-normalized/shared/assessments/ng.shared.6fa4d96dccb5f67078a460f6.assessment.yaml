assessment:
  id: ng.shared.6fa4d96dccb5f67078a460f6
  version: 1
  assessment_title: OL08-00-020330 - OL 8 must not allow accounts configured with blank or null passwords.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(?i)\s*PermitEmptyPasswords\s+(\w+)$
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
  tests:
    test-permitemptypasswords-option-not-set-yes-in-etc-ssh-sshd-config:
      test_title: The PermitEmptyPasswords option is not set to yes in /etc/ssh/sshd_config.
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: any_exist
        item_quantifier: none satisfy
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^(yes|"yes")$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-permitemptypasswords-option-not-set-yes-in-etc-ssh-sshd-config
