assessment:
  id: ng.shared.5e64c45739d3964e4fb4b9c5
  version: 1
  assessment_title: OL07-00-010119 - The Oracle Linux operating system must be configured so that when passwords are changed
    or new passwords are established, pwquality must be used.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    in-etc-pam-d-system-auth-check-pam-pwquality-so-collection:
      collection_title: in /etc/pam.d/system-auth check for pam_pwquality.so retry equals value
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/pam.d/system-auth
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[ \t]*password[ \t]+(?:(?:required)|(?:requisite))[ \t]+pam_pwquality\.so(?:[ \t]+|(?:[ \t][^#\r\f\n]+[
            \t]+))retry=([0-9]+)(?:\s|$)
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
  tests:
    test-etc-pam-d-system-auth-retry-not-greater-than-3:
      test_title: /etc/pam.d/system-auth:retry not greater than 3 and not 0
      capability: independent.textfilecontent54
      collection: in-etc-pam-d-system-auth-check-pam-pwquality-so-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^[123]$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-etc-pam-d-system-auth-retry-not-greater-than-3
