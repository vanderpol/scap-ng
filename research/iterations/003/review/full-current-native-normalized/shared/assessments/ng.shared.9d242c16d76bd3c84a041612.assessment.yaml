assessment:
  id: ng.shared.9d242c16d76bd3c84a041612
  version: 1
  assessment_title: SQL Server must generate audit records when attempts to access privileges, categorized information, and
    security objects occur.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Review the system documentation to determine if SQL Server is required to audit when the following events occur:
    - Attempts to retrieve privilege/permission/role membership information. - Security objects are accessed, modified, or
    deleted. - Data classifications (e.g., classification levels/security levels) are accessed, modified, or deleted. - Any
    other specified objects are accessed, modified, or deleted as required by the site. If SQL Server is not required to audit
    any of the above, this is not a finding. If the documentation does not exist, this is a finding. Determine if an audit
    is configured and started by executing the following query. If no records are returned, this is a finding. SELECT name
    AS ''Audit Name'', status_desc AS ''Audit Status'', audit_file_path AS ''Current Audit File'' FROM sys.dm_server_audit_status
    If auditing the retrieval of the above information or objects is required, execute the following to verify the SCHEMA_OBJECT_ACCESS_GROUP
    is included in the server audit specification: SELECT a.name AS ''AuditName'', s.name AS ''SpecName'', d.audit_action_name
    AS ''ActionName'', d.audited_result AS ''Result'' FROM sys.server_audit_specifications s JOIN sys.server_audits a ON s.audit_guid
    = a.audit_guid JOIN sys.server_audit_specification_details d ON s.server_specification_id = d.server_specification_id
    WHERE a.is_state_enabled = 1 AND d.audit_action_name = ''SCHEMA_OBJECT_ACCESS_GROUP'' If the SCHEMA_OBJECT_ACCESS_GROUP
    is not returned in an active audit, this is a finding.'
  inputs: []
  evidence: []
