assessment:
  id: ng.shared.b8cd60945171c9876ba5893a
  version: 1
  assessment_title: WN12-00-000160
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    smb-v1-protocol-win32-optionalfeature-object-collection:
      collection_title: SMB v1 Protocol Win32_OptionalFeature object
      capability: windows.wmi57
      select:
        namespace:
          operation: equals
          datatype: string
          mask: false
          value: root\cimv2
        wql:
          operation: equals
          datatype: string
          mask: false
          value: SELECT installstate FROM win32_optionalfeature WHERE name = 'SMB1Protocol'
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Windows NT\CurrentVersion
        name:
          operation: equals
          datatype: string
          mask: false
          value: CurrentVersion
    windows-registry-collection-2:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters
        name:
          operation: equals
          datatype: string
          mask: false
          value: SMB1
    windows-registry-collection-3:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Services\mrxsmb10
        name:
          operation: equals
          datatype: string
          mask: false
          value: Start
    windows-registry-collection-4:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Services\LanmanWorkstation
        name:
          operation: equals
          datatype: string
          mask: false
          value: DependOnService
  tests:
    test-smb-1-0-cifs-file-sharing-support-feature-not-installed:
      test_title: '''SMB 1.0/CIFS File Sharing Support'' feature is not installed'
      capability: windows.wmi57
      collection: smb-v1-protocol-win32-optionalfeature-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: Check SMB v1 Protocol Win32_OptionalFeature object InstallState is equal to 2
        state_capability: windows.wmi57
        state:
          field: result
          value:
            record:
            - name: installstate
              value: '2'
              operation: equals
              datatype: string
              mask: false
              entity_check: at least one
          operation: equals
          datatype: record
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-system-running-windows-8-1-or-windows-server-2012-r2:
      test_title: The system is running Windows 8.1 or Windows Server 2012 R2
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Sz type and value equals 6.3
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_sz
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '6.3'
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-configure-smbv1-server-set-disabled:
      test_title: '''Configure SMBv1 Server'' is set to ''Disabled'''
      capability: windows.registry
      collection: windows-registry-collection-2
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: REG_DWORD type and value equals 0
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-configure-smbv1-client-driver-set-enabled-disable-driver-recommended-selected:
      test_title: '''Configure SMBv1 client driver'' is set to ''Enabled'' with ''Disable driver (recommended)'' selected
        for ''Configure MrxSmb10 driver'''
      capability: windows.registry
      collection: windows-registry-collection-3
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: REG_DWORD type and value equals 4
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '4'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-configure-smbv1-client-extra-setting-needed-pre-win8-1-2012r2:
      test_title: '''Configure SMBv1 client (extra setting needed for pre-Win8.1/2012R2) is set to ''Enabled'' with ''MrxSmb10''
        excluded from ''Configure LanmanWorkstation Dependencies:'''
      capability: windows.registry
      collection: windows-registry-collection-4
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: REG_MULTI_SZ type and value does not equal 'MRxSmb10'
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_multi_sz
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: ^[Mm][Rr][Xx][Ss][Mm][Bb]10$
            operation: pattern match
            datatype: string
            mask: false
            entity_check: none satisfy
            entity_existence: at_least_one_exists
  evaluate:
    any:
    - all:
      - test: test-smb-1-0-cifs-file-sharing-support-feature-not-installed
      - test: test-system-running-windows-8-1-or-windows-server-2012-r2
    - all:
      - test: test-configure-smbv1-server-set-disabled
      - all:
        - test: test-configure-smbv1-client-driver-set-enabled-disable-driver-recommended-selected
        - test: test-configure-smbv1-client-extra-setting-needed-pre-win8-1-2012r2
    - not:
        test: test-system-running-windows-8-1-or-windows-server-2012-r2
