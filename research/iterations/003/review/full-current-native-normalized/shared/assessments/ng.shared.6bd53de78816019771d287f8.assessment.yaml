assessment:
  id: ng.shared.6bd53de78816019771d287f8
  version: 1
  assessment_title: All OL 8 world-writable directories must be group-owned by root, sys, bin, or an application group.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    get-directories-on-local-partitions-that-world-writable-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
      filters:
      - action: exclude
        state: state-used-as-filter-to-exclude-owrite-of-0
      - action: exclude
        state: state-filters-out-files-with-group-id-less-than-1000
      behaviors:
        recurse_direction: down
        recurse_file_system: local
        recurse: directories
      object_title: Get directories on local partitions that are world writable.
  states:
    state-used-as-filter-to-exclude-owrite-of-0:
      state_title: Used as filter to exclude owrite of '0'.
      capability: unix.file
      state:
        field: owrite
        value: '0'
        operation: equals
        datatype: boolean
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-filters-out-files-with-group-id-less-than-1000:
      state_title: Filters out files with group_id less than 1000.
      capability: unix.file
      state:
        field: group_id
        value: '1000'
        operation: less than
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-all-world-writable-directories-group-owned-by-root-sys-bin:
      test_title: All world-writable directories must be group-owned by root, sys, bin, or an application group.
      capability: unix.file
      object: get-directories-on-local-partitions-that-world-writable-object
      check_existence: none_exist
      check: all
  evaluate:
    test: test-all-world-writable-directories-group-owned-by-root-sys-bin
