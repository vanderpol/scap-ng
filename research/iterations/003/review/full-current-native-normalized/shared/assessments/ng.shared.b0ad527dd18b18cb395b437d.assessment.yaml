assessment:
  id: ng.shared.b0ad527dd18b18cb395b437d
  version: 1
  assessment_title: Ubuntu 22.04 LTS must have directories that contain system commands set to a mode of "755" or less permissive.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    all-system-command-directories-mode-755-gwrite-should-false-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: only one
          value:
            variable: system-command-directories-variable
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
      filters:
      - action: exclude
        state: state-mode-755-or-less-permissive-gwrite-should-be-false
      - action: exclude
        state: state-symbolic-links
      - action: exclude
        state: state-unix-file
      behaviors:
        recurse_direction: down
      object_title: All system-command  directories mode 755 ( gwrite should be = false.)
    all-system-command-directories-mode-755-owrite-should-false-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: only one
          value:
            variable: system-command-directories-variable
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
      filters:
      - action: exclude
        state: state-mode-755-or-less-permissive-owrite-should-be-false
      - action: exclude
        state: state-symbolic-links
      - action: exclude
        state: state-unix-file
      behaviors:
        recurse_direction: down
      object_title: All system-command  directories mode 755 (owrite should be = false.)
  variables:
    system-command-directories-variable:
      title: system command directories
      kind: constant
      datatype: string
      expression:
        literal:
        - /bin
        - /sbin
        - /usr/bin
        - /usr/sbin
        - /usr/local/bin
        - /usr/local/sbin
  states:
    state-mode-755-or-less-permissive-gwrite-should-be-false:
      state_title: Mode 755 or less permissive (gwrite should be = false.)
      capability: unix.file
      state:
        field: gwrite
        value: 'false'
        operation: equals
        datatype: boolean
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-symbolic-links:
      state_title: symbolic links
      capability: unix.file
      state:
        field: type
        value: symbolic link
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-unix-file:
      state_title: null
      capability: unix.file
      state:
        field: type
        value: file
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-mode-755-or-less-permissive-owrite-should-be-false:
      state_title: Mode 755 or less permissive (owrite should be = false.)
      capability: unix.file
      state:
        field: owrite
        value: 'false'
        operation: equals
        datatype: boolean
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-command-directories-have-mode-755-or-less-permissive-gwrite:
      test_title: System command directories have mode 755 or less permissive. (gwrite should be = false)
      capability: unix.file
      object: all-system-command-directories-mode-755-gwrite-should-false-object
      check_existence: none_exist
      check: all
    test-system-command-directories-have-mode-755-or-less-permissive-owrite:
      test_title: System command directories have mode 755 or less permissive.(owrite should be = false.)
      capability: unix.file
      object: all-system-command-directories-mode-755-owrite-should-false-object
      check_existence: none_exist
      check: all
  evaluate:
    all:
    - test: test-system-command-directories-have-mode-755-or-less-permissive-gwrite
    - test: test-system-command-directories-have-mode-755-or-less-permissive-owrite
