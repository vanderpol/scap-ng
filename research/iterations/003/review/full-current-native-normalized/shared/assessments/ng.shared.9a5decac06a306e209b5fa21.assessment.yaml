assessment:
  id: ng.shared.9a5decac06a306e209b5fa21
  version: 1
  assessment_title: The Windows DNS secondary server must request data integrity verification from the primary server when
    requesting name/address resolution.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: This check is not applicable for Windows DNS Servers that host only Active Directory-integrated zones
    or for Windows DNS Servers on a classified network. Validate this check from the Windows DNS Server being configured/reviewed.
    Log on to the Windows DNS Server using the account designated as Administrator or DNS Administrator. Determine a valid
    host in the zone. Open the Windows PowerShell prompt on the Windows DNS Server being configured/reviewed. Issue the following
    command: (Replace www.zonename.mil with a FQDN of a valid host in the zone being validated. Replace ###.###.###.### with
    the FQDN or IP address of the Windows DNS Server hosting the signed zone.) resolve-dnsname www.zonename.mil -server ###.###.###.###
    -dnssecok <enter> Note: It is important to use the -server switch followed by the DNS server name/IP address. The result
    should show the "A" record results. In addition, the results should show QueryType: RRSIG with an expiration, date signed,
    signer, and signature, similar to the following: Name: www.zonename.mil QueryType: RRSIG TTL: 189 Section: Answer TypeCovered:
    CNAME Algorithm: 8 LabelCount: 3 OriginalTtl: 300 Expiration: 11/21/2022 10:22:28 PM Signed: 10/22/2022 10:22:28 PM Signer:
    zonename.mil Signature: {87, 232, 34, 134...} Name: origin-www.zonename.mil QueryType: A TTL: 201 Section: Answer IP4Address:
    ###.###.###.### If the results do not show the RRSIG and signature information, this is a finding.'
  inputs: []
  evidence: []
