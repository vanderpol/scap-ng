assessment:
  id: ng.shared.de6149d70f212daf66ac678d
  version: 1
  assessment_title: Windows Server 2022 systems must have a Trusted Platform Module (TPM) enabled and ready for use.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify the system has a TPM and it is ready for use. Run "tpm.msc". Review the sections in the center pane. "Status"
    must indicate it has been configured with a message such as "The TPM is ready for use" or "The TPM is on and ownership
    has been taken". TPM Manufacturer Information - Specific Version = 2.0 If a TPM is not found or is not ready for use,
    this is a finding.
  inputs: []
  evidence: []
