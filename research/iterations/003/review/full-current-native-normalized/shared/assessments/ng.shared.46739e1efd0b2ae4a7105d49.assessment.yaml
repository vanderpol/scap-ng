assessment:
  id: ng.shared.46739e1efd0b2ae4a7105d49
  version: 1
  assessment_title: The operating system, upon successful logon, must display to the user the date and time of the last logon
    (access).
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Determine if last login will be printed for SSH users. # grep PrintLastLog /etc/ssh/sshd_config If PrintLastLog
    is found, not preceded with a "#" sign, and is set to "no", this is a finding. PrintLastLog should either not exist (defaulting
    to yes) or exist and be set to yes.'
  inputs: {}
  evidence: []
