assessment:
  id: ng.shared.ef3f555d9efb9db3323d2455
  version: 1
  assessment_title: Non-ASCII characters in URLs must be prohibited by any IIS 10.0 website.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    web-site-not-allow-non-ascii-characters-in-urls-object:
      capability: windows.appcmdlistconfig
      select:
        identifier_type:
          operation: equals
          datatype: string
          mask: false
          value: Site
        identifier:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        section:
          operation: equals
          datatype: string
          mask: false
          value: requestfiltering
        parameter:
          operation: equals
          datatype: string
          mask: false
          value: allowhighbitcharacters
      object_title: The web-site must not allow non-ASCII characters in URLs.
  states:
    state-appcmdlistconfig-result-must-equal-false:
      state_title: appcmdlistconfig result must equal False.
      capability: windows.appcmdlistconfig
      state:
        field: result
        value: 'false'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-web-site-not-allow-non-ascii-characters-in-urls:
      test_title: The web-site must not allow non-ASCII characters in URLs.
      capability: windows.appcmdlistconfig
      object: web-site-not-allow-non-ascii-characters-in-urls-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-appcmdlistconfig-result-must-equal-false
  evaluate:
    test: test-web-site-not-allow-non-ascii-characters-in-urls
