assessment:
  id: ng.shared.340e8410c679d99e0411072b
  version: 1
  assessment_title: OL09-00-002030 - OL 9 must mount /boot with the nodev option.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    boot-collection:
      collection_title: /boot
      capability: linux.partition
      select:
        mount_point:
          operation: equals
          datatype: string
          mask: false
          value: /boot
  tests:
    test-boot-has-nodev-option:
      test_title: /boot has nodev option
      capability: linux.partition
      collection: boot-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: linux.partition
        state:
          field: mount_options
          value: nodev
          operation: equals
          datatype: string
          mask: false
          entity_check: at least one
          entity_existence: at_least_one_exists
  evaluate:
    test: test-boot-has-nodev-option
