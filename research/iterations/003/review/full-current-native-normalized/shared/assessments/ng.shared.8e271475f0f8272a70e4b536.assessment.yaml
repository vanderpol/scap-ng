assessment:
  id: ng.shared.8e271475f0f8272a70e4b536
  version: 1
  assessment_title: The macOS system must be configured to disable Location Services.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    system-settings-location-services-disable-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: zsh
        command:
          operation: equals
          datatype: string
          value: '/usr/bin/sudo -u _locationd /usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.locationd'')\

            .objectForKey(''LocationServicesEnabled'').js

            EOS'
      object_title: system_settings_location_services_disable_recommended_object
  states:
    state-system-settings-location-services-disable-recommended-st:
      state_title: system_settings_location_services_disable_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: 'false'
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-settings-location-services-disable-recommended-test:
      test_title: system_settings_location_services_disable_recommended_test
      capability: independent.shellcommand
      object: system-settings-location-services-disable-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-system-settings-location-services-disable-recommended-st
  evaluate:
    test: test-system-settings-location-services-disable-recommended-test
