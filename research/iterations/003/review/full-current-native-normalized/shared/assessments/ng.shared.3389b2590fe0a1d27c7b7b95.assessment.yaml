  version: 1
  assessment_title: The macOS system must configure audit retention to seven days.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to set audit retention to seven days with the following command: /usr/bin/awk
    -F: ''/expire-after/{print $2}'' /etc/security/audit_control If the result is not "7d", this is a finding.'
  inputs: {}
  evidence: []
