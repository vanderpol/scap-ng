assessment:
  id: ng.shared.6375011feac31cc515835735
  version: 1
  assessment_title: No wireless interface on System.
  mode: automated
  class: inventory
  purpose: applicability
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    check-if-wireless-adaptor-installed-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: lspci |  grep -i wireless
        pattern:
          operation: pattern match
          datatype: string
          value: (?i)wireless
      object_title: Check if wireless adaptor is installed.
  states:
    state-configure-aide-to-perform-file-integrity-checking-on-the:
      state_title: Configure AIDE to perform file integrity checking on the file system.
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: (?i)wireless
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-check-if-wireless-interfaces-radio-installed-on-system:
      test_title: Check if wireless interfaces (radio) is installed on system.
      capability: independent.shellcommand
      object: check-if-wireless-adaptor-installed-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-configure-aide-to-perform-file-integrity-checking-on-the
  evaluate:
    test: test-check-if-wireless-interfaces-radio-installed-on-system
