assessment:
  id: ng.shared.cfdcf5256cb48a3d96b1a0bc
  version: 1
  assessment_title: The operating system must enforce minimum password lifetime restrictions.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    gather-non-root-unlocked-users-passwords-greater-than-60-days-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: 'logins -ox |awk -F: ''( $1 != "root" && $8 != "LK" && $8 != "NL" && $10 < "1" ) { print }'''
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
      object_title: Gather non-root, unlocked users with passwords greater than 60 days
    check-etc-default-passwd-mindays-setting-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/default/passwd
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^MINDAYS=(.*)
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
      object_title: Check /etc/default/passwd for MINDAYS setting
    check-etc-default-passwd-ensure-minweeks-not-defined-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/default/passwd
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^MINWEEKS=
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
      object_title: Check /etc/default/passwd to ensure MINWEEKS is not defined
  states:
    state-stdout-line-should-not-return-any-users:
      state_title: stdout_line should not return any users
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: ''
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: none_exist
    state-mindays-is-1-or-more:
      state_title: MINDAYS is 1 or more
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '1'
        operation: greater than or equal
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-check-etc-passwd-users-minimum-password-less-than-1-day:
      test_title: Check /etc/passwd for users with a minimum password less than 1 day
      capability: independent.shellcommand
      object: gather-non-root-unlocked-users-passwords-greater-than-60-days-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-stdout-line-should-not-return-any-users
    test-check-etc-default-passwd-mindays-setting:
      test_title: Check /etc/default/passwd for MINDAYS setting
      capability: independent.textfilecontent54
      object: check-etc-default-passwd-mindays-setting-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-mindays-is-1-or-more
    test-check-etc-default-passwd-ensure-minweeks-not-defined:
      test_title: Check /etc/default/passwd to ensure MINWEEKS is not defined
      capability: independent.textfilecontent54
      object: check-etc-default-passwd-ensure-minweeks-not-defined-object
      check_existence: none_exist
      check: all
  evaluate:
    all:
    - test: test-check-etc-passwd-users-minimum-password-less-than-1-day
    - test: test-check-etc-default-passwd-mindays-setting
    - test: test-check-etc-default-passwd-ensure-minweeks-not-defined
