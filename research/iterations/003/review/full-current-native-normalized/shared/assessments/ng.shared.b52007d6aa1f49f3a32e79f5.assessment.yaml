assessment:
  id: ng.shared.b52007d6aa1f49f3a32e79f5
  version: 1
  assessment_title: The Apache web server document directory must be in a separate partition from the Apache web servers system
    files.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Determine whether the public web server has a two-way trusted relationship with any private asset located within
    the network. Private web server resources (e.g., drives, folders, printers, etc.) will not be directly mapped to or shared
    with public web servers. If sharing is selected for any web folder, this is a finding. If private resources (e.g., drives,
    partitions, folders/directories, printers, etc.) are shared with the public web server, this is a finding.
  inputs: []
  evidence: []
