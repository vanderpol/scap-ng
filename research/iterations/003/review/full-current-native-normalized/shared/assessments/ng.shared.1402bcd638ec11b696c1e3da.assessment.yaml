assessment:
  id: ng.shared.1402bcd638ec11b696c1e3da
  version: 1
  assessment_title: AZLX-23-000125 - Amazon Linux 2023 must have GPG signature verification enabled for all software repositories.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/yum.repos.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: \.repo$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*\[[^]]+\]\s*\n(?:[^[]*\n)*
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: null
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: text
        value: \n\s*gpgcheck\s*=\s*(True|1|yes)\s*(\n|$)
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54-2:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: text
        value: \n\s*gpgcheck\s*=\s*(False|0|no)\s*(\n|$)
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-every-etc-yum-repos-d-repo-reponame-has-gpgcheck-set:
      test_title: Every /etc/yum.repos.d/*.repo:[{reponame}] has a gpgcheck set to 1.
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: all_exist
      check: all
      states:
      - state-independent-textfilecontent54
    test-no-etc-yum-repos-d-repo-reponame-has-gpgcheck-set:
      test_title: No /etc/yum.repos.d/*.repo:[{reponame}] has a gpgcheck set to 0.
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: all_exist
      check: none satisfy
      states:
      - state-independent-textfilecontent54-2
  evaluate:
    all:
    - test: test-every-etc-yum-repos-d-repo-reponame-has-gpgcheck-set
    - test: test-no-etc-yum-repos-d-repo-reponame-has-gpgcheck-set
