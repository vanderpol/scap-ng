assessment:
  id: ng.shared.363c8981d1a8e4a83a1bcd84
  version: 1
  assessment_title: Idle Time Before Suspending a Session.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: System\CurrentControlSet\Services\LanmanServer\Parameters
        name:
          operation: equals
          datatype: string
          value: AutoDisconnect
      object_title: null
  variables:
    amount-idle-time-required-before-suspending-session-variable:
      title: Amount of Idle Time Required Before Suspending Session
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: amount_of_idle_time_required_before_suspending_session_var
        validation:
          alternatives:
          - literal: '15'
            hint: 15_minutes
  states:
    state-reg-dword-type-and-value-is-less-than-or-equal-to-variab:
      state_title: Reg_Dword type and value is less than or equal to variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: amount-idle-time-required-before-suspending-session-variable
          operation: less than or equal
          datatype: int
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-microsoft-network-server-amount-idle-time-required-before-suspending-session:
      test_title: '''Microsoft network server: Amount of idle time required before suspending session'' is set to ''15'' minutes
        or less'
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-is-less-than-or-equal-to-variab
  evaluate:
    test: test-microsoft-network-server-amount-idle-time-required-before-suspending-session
