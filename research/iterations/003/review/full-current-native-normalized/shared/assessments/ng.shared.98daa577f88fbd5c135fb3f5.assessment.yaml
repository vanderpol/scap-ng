assessment:
  id: ng.shared.98daa577f88fbd5c135fb3f5
  version: 1
  assessment_title: Ubuntu 22.04 LTS must initiate a graphical session lock after 10 minutes of inactivity.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    ubuntu-retain-user-s-session-lock-until-that-user-reestablishes-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: gsettings get org.gnome.desktop.screensaver lock-enabled
        pattern:
          operation: pattern match
          datatype: string
          value: 'true'
      object_title: Ubuntu must retain a user's session lock until that user reestablishes access using established identification
        and authentication procedures.
    ubuntu-initiate-graphical-session-lock-after-15-minutes-inactivity-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: 'gsettings get org.gnome.desktop.screensaver lock-delay '
        pattern:
          operation: pattern match
          datatype: string
          value: uint32\s+(\d+)
      object_title: Ubuntu must initiate a graphical session lock after 15 minutes of inactivity.
  states:
    state-ubuntu-must-retain-a-user-s-session-lock-until-that-user:
      state_title: Ubuntu must retain a user's session lock until that user reestablishes access using established identification
        and authentication procedures.
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: 'true'
          operation: pattern match
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
    state-ubuntu-must-initiate-a-graphical-session-lock-after-15-m:
      state_title: Ubuntu must initiate a graphical session lock after 15 minutes of inactivity.
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: subexpression
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-check-that-screensaver-idle-lock-enabled:
      test_title: Check that screensaver idle lock is enabled.
      capability: independent.shellcommand
      object: ubuntu-retain-user-s-session-lock-until-that-user-reestablishes-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-ubuntu-must-retain-a-user-s-session-lock-until-that-user
    test-ubuntu-initiate-graphical-session-lock-after-15-minutes-inactivity-lock:
      test_title: Ubuntu must initiate a graphical session lock after 15 minutes of inactivity.(Lock delay must be 0)
      capability: independent.shellcommand
      object: ubuntu-initiate-graphical-session-lock-after-15-minutes-inactivity-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-ubuntu-must-initiate-a-graphical-session-lock-after-15-m
    test-ubuntu-initiate-graphical-session-lock-after-15-minutes-inactivity-idle:
      test_title: Ubuntu must initiate a graphical session lock after 15 minutes of inactivity.(idle delay must be 15 mins
        or less)
      capability: independent.shellcommand
      object: ubuntu-initiate-graphical-session-lock-after-15-minutes-inactivity-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-ubuntu-must-initiate-a-graphical-session-lock-after-15-m
  evaluate:
    all:
    - test: test-check-that-screensaver-idle-lock-enabled
    - test: test-ubuntu-initiate-graphical-session-lock-after-15-minutes-inactivity-lock
    - test: test-ubuntu-initiate-graphical-session-lock-after-15-minutes-inactivity-idle
