assessment:
  id: ng.shared.6896863215386247151a9df5
  version: 1
  assessment_title: The Exchange local machine policy must require signed scripts.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    run-get-executionpolicy-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: powershell
        command:
          operation: equals
          datatype: string
          value: add-pssnapin Microsoft.Exchange.Management.Powershell.Snapin;Get-ExecutionPolicy
        pattern:
          operation: equals
          datatype: string
          value: \w
      behaviors:
        error_if_stderr_exists: 'true'
      object_title: Run Get-ExecutionPolicy
  states:
    state-verify-value-is-remotesigned:
      state_title: Verify value is RemoteSigned
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: (?i)RemoteSigned\s*$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-if-value-returned-not-remotesigned-this-finding:
      test_title: If the value returned is not RemoteSigned, this is a finding.
      capability: independent.shellcommand
      object: run-get-executionpolicy-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-verify-value-is-remotesigned
  evaluate:
    test: test-if-value-returned-not-remotesigned-this-finding
