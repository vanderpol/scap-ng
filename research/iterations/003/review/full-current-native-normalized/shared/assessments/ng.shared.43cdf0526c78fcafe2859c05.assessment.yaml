assessment:
  id: ng.shared.43cdf0526c78fcafe2859c05
  version: 1
  assessment_title: The operating system must configure auditing to reduce the likelihood of storage capacity being exceeded.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    retrieve-results-auditconfig-getplugin-audit-binfile-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: auditconfig -getplugin audit_binfile
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: \s*Attributes:\s*.*
      object_title: Retrieve results of 'auditconfig -getplugin audit_binfile'.
  states:
    state-confirm-the-size-of-a-binary-audit-file-is-deliberately-:
      state_title: Confirm the size of a binary audit file is deliberately set to a specific numeric value.
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: p_fsize=\d+M
          operation: pattern match
          datatype: string
          mask: false
          entity_check: at least one
          entity_existence: at_least_one_exists
  tests:
    test-test-that-operating-system-configured-reduce-likelihood-auditing-storage-capacity:
      test_title: Test that the operating system is configured to reduce the likelihood of auditing storage capacity being
        exceeded.
      capability: independent.shellcommand
      object: retrieve-results-auditconfig-getplugin-audit-binfile-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-confirm-the-size-of-a-binary-audit-file-is-deliberately-
  evaluate:
    test: test-test-that-operating-system-configured-reduce-likelihood-auditing-storage-capacity
