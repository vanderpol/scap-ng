assessment:
  id: ng.shared.7dfe30f93e8d8ca8233c7a12
  version: 1
  assessment_title: UBTU-20-010136 - The Ubuntu operating system must generate audit records for successful/unsuccessful uses
    of the su command.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/audit/audit.rules
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*-a\s+(?:always,exit|exit,always)(?:\s+-S\s+all)?\s+-F\s+path=/bin/su\s+(?:-F\s+perm=[rwa]*x[rwa]*\s+)?-F\s+auid>=1000\s+-F\s+auid!=(?:4294967295|-1|unset)(?:\s+(?:-k\s+|-F\s+key=)\S+)*\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states: {}
  tests:
    test-audit-invocations-bin-su:
      test_title: Audit invocations of /bin/su
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    test: test-audit-invocations-bin-su
