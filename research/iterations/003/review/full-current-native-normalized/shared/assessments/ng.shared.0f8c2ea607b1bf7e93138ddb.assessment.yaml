assessment:
  id: ng.shared.0f8c2ea607b1bf7e93138ddb
  version: 1
  assessment_title: Active Directory Domain
  mode: automated
  class: compliance
  purpose: applicability
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-wmi57-object:
      capability: windows.wmi57
      select:
        namespace:
          operation: equals
          datatype: string
          value: root\cimv2
        wql:
          operation: equals
          datatype: string
          value: SELECT DomainRole FROM win32_computersystem
      object_title: null
  states:
    state-backup-domain-controller:
      state_title: Backup Domain Controller
      capability: windows.wmi57
      state:
        field: result
        value:
          record:
          - name: domainrole
            value: '4'
            operation: equals
            datatype: string
            entity_check: all
        operation: equals
        datatype: record
        entity_check: all
        entity_existence: at_least_one_exists
    state-primary-domain-controller:
      state_title: Primary Domain Controller
      capability: windows.wmi57
      state:
        field: result
        value:
          record:
          - name: domainrole
            value: '5'
            operation: equals
            datatype: string
            entity_check: all
        operation: equals
        datatype: record
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-windows-domain-controller:
      test_title: The system is a Windows Domain Controller
      capability: windows.wmi57
      object: windows-wmi57-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-backup-domain-controller
      - state-primary-domain-controller
  evaluate:
    test: test-system-windows-domain-controller
