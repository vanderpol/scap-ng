assessment:
  id: ng.shared.5e140f047af0aa1a9e974b26
  version: 1
  assessment_title: The Cisco router must be configured to enforce a minimum 15-character password length.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    iosxe-line-object:
      capability: iosxe.line
      select:
        show_subcommand:
          operation: equals
          datatype: string
          value: show running-config
      object_title: null
  states:
    state-check-for-aaa-common-criteria-policy:
      state_title: Check for aaa common-criteria policy
      capability: iosxe.line
      state:
        all:
        - field: show_subcommand
          value: show running-config
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: config_line
          value: \naaa common-criteria policy.+
          operation: pattern match
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
    state-check-for-password-policy-min-length-at-least-15:
      state_title: Check for password policy min-length at least 15
      capability: iosxe.line
      state:
        all:
        - field: show_subcommand
          value: show running-config
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: config_line
          value: \n min-length (15|16|17|18|19|20)
          operation: pattern match
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-verify-that-aaa-common-criteria-policy-enabled:
      test_title: Verify that aaa common-criteria policy is enabled.
      capability: iosxe.line
      object: iosxe-line-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-check-for-aaa-common-criteria-policy
    test-check-password-policy-min-length-at-least-15:
      test_title: Check for password policy min-length at least 15
      capability: iosxe.line
      object: iosxe-line-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-check-for-password-policy-min-length-at-least-15
  evaluate:
    all:
    - test: test-verify-that-aaa-common-criteria-policy-enabled
    - test: test-check-password-policy-min-length-at-least-15
