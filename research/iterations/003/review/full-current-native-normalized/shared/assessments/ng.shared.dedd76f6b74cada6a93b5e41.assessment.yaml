assessment:
  id: ng.shared.dedd76f6b74cada6a93b5e41
  version: 1
  assessment_title: Prohibit Network Bridge
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows\Network Connections
        name:
          operation: equals
          datatype: string
          mask: false
          value: NC_AllowNetBridge_NLA
      object_title: null
  variables:
    prohibit-installation-configuration-network-bridge-on-your-dns-domain-network-variable:
      title: Prohibit installation and configuration of Network Bridge on your DNS domain network
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: prohibit_installation_network_bridge_var
        validation:
          alternatives:
          - literal: '1'
            hint: disabled
          - literal: '0'
            hint: enabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: prohibit-installation-configuration-network-bridge-on-your-dns-domain-network-variable
          operation: equals
          datatype: int
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-prohibit-installation-configuration-network-bridge-on-your-dns-domain-network:
      test_title: '''Prohibit installation and configuration of Network Bridge on your DNS domain network'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-prohibit-installation-configuration-network-bridge-on-your-dns-domain-network
