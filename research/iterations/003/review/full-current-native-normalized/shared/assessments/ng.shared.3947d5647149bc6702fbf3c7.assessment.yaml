assessment:
  id: ng.shared.3947d5647149bc6702fbf3c7
  version: 1
  assessment_title: The Apache web server must be built to fail to a known safe state if system initialization fails, shutdown
    fails, or aborts fail.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Interview the System Administrator for the Apache 2.4 web server. Ask for documentation on the disaster recovery
    methods tested and planned for the Apache 2.4 web server in the event of the necessity for rollback. If documentation
    for a disaster recovery has not been established, this is a finding.
  inputs: []
  evidence: []
