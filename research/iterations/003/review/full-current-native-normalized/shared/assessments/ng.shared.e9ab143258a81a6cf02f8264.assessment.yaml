assessment:
  id: ng.shared.e9ab143258a81a6cf02f8264
  version: 1
  assessment_title: UBTU-18-010136 - The Ubuntu operating system library directories must be owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    all-system-wide-library-directories-collection:
      collection_title: All system-wide library directories
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: system-wide-library-directories-variable
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
  variables:
    system-wide-library-directories-variable:
      title: System-wide library directories
      kind: constant
      datatype: string
      expression:
        literal:
        - /lib
        - /lib64
        - /usr/lib
  tests:
    test-all-system-wide-library-directories-owned-by-root:
      test_title: All system-wide library directories must be owned by root
      capability: unix.file
      collection: all-system-wide-library-directories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Owned by root
        state_capability: unix.file
        state:
          field: user_id
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-all-system-wide-library-directories-owned-by-root
