assessment:
  id: ng.shared.7226edf6c448257bf7fc6082
  version: 1
  assessment_title: The system must be configured to use FIPS-compliant algorithms for encryption, hashing, and signing.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding: Registry
    Hive: HKEY_LOCAL_MACHINE Registry Path: \SYSTEM\CurrentControlSet\Control\Lsa\FIPSAlgorithmPolicy\ Value Name: Enabled
    Value Type: REG_DWORD Value: 1 Warning: Clients with this setting enabled will not be able to communicate via digitally
    encrypted or signed protocols with servers that do not support these algorithms. Both the browser and web server must
    be configured to use TLS, or the browser will not be able to connect to a secure site.'
  inputs: []
  evidence: []
