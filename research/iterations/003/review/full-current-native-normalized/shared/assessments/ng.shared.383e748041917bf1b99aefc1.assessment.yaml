assessment:
  id: ng.shared.383e748041917bf1b99aefc1
  version: 1
  assessment_title: The directory service must be configured to terminate LDAP-based network connections to the directory
    server after 5 minutes of inactivity.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This applies to domain controllers. It is NA for other systems. Open an elevated "Command Prompt" (run as administrator).
    Enter "ntdsutil". At the "ntdsutil:" prompt, enter "LDAP policies". At the "ldap policy:" prompt, enter "connections".
    At the "server connections:" prompt, enter "connect to server [host-name]" (where [host-name] is the computer name of
    the domain controller). At the "server connections:" prompt, enter "q". At the "ldap policy:" prompt, enter "show values".
    If the value for MaxConnIdleTime is greater than "300" (5 minutes) or is not specified, this is a finding. Enter "q" at
    the "ldap policy:" and "ntdsutil:" prompts to exit. Alternately, Dsquery can be used to display MaxConnIdleTime: Open
    "Command Prompt (Admin)". Enter the following command (on a single line). dsquery * "cn=Default Query Policy,cn=Query-Policies,cn=Directory
    Service, cn=Windows NT,cn=Services,cn=Configuration,dc=[forest-name]" -attr LDAPAdminLimits The quotes are required and
    dc=[forest-name] is the fully qualified LDAP name of the domain being reviewed (e.g., dc=disaost,dc=mil). If the results
    do not specify a "MaxConnIdleTime" or it has a value greater than "300" (5 minutes), this is a finding.'
  inputs: []
  evidence: []
