assessment:
  id: ng.shared.b6e287f8be08c3e0e28927c5
  version: 1
  assessment_title: User passwords must be at least 15 characters in length.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    default-passwd-file-etc-default-passwd-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/default
        filename:
          operation: equals
          datatype: string
          value: passwd
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*PASSLENGTH=(\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: The default passwd file (/etc/default/passwd)
  states:
    state-subexpression-value-greater-than-or-equal-to-15:
      state_title: subexpression value greater than or equal to 15
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '15'
        operation: greater than or equal
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-check-default-password-length-setting:
      test_title: Check the default password length setting.
      capability: independent.textfilecontent54
      object: default-passwd-file-etc-default-passwd-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-subexpression-value-greater-than-or-equal-to-15
  evaluate:
    test: test-check-default-password-length-setting
