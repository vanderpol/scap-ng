assessment:
  id: ng.shared.127887006e92418fe80a1e18
  version: 1
  assessment_title: The system must not respond to ICMP timestamp requests.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    ipadm-show-prop-p-respond-timestamp-co-current-ip-collection:
      collection_title: ipadm show-prop -p _respond_to_timestamp -co current ip
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: ipadm show-prop -p _respond_to_timestamp -co current ip
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
  tests:
    test-system-not-respond-icmp-timestamp-requests:
      test_title: The system must not respond to ICMP timestamp requests.
      capability: independent.shellcommand
      collection: ipadm-show-prop-p-respond-timestamp-co-current-ip-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Check that line returns '0' with an exit status of 0
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: '0'
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-system-not-respond-icmp-timestamp-requests
