assessment:
  id: ng.shared.bb0df7138696424c2ec8d323
  version: 1
  assessment_title: The Oracle Linux operating system must audit all uses of the setsebool command.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system generates audit records when successful/unsuccessful attempts to use the "setsebool"
    command occur. Check the file system rule in "/etc/audit/audit.rules" with the following command: $ sudo grep -w "/usr/sbin/setsebool"
    /etc/audit/audit.rules -a always,exit -F path=/usr/sbin/setsebool -F perm=x -F auid>=1000 -F auid!=unset -k privileged-priv_change
    If the command does not return any output, this is a finding.'
  inputs: {}
  evidence: []
