assessment:
  id: ng.shared.8339d6f147d0ca3585ec260b
  version: 1
  assessment_title: OL08-00-030110 - The OL 8 audit log directory must be group-owned by root to prevent unauthorized read
    access.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/auditd.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*log_file\s*=\s*(\S+)/\S+\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
      object_title: null
    audit-log-directory-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: audit-data-directory-from-etc-audit-auditd-conf-variable
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
      object_title: Audit log directory
  variables:
    audit-data-directory-from-etc-audit-auditd-conf-variable:
      title: audit data directory from /etc/audit/auditd.conf
      kind: local
      datatype: string
      expression:
        values:
          object: independent-textfilecontent54-object
          field: subexpression
  states:
    state-group-owned-by-root:
      state_title: group-owned by root
      capability: unix.file
      state:
        field: group_id
        value: '0'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-log-directories-group-owned-by-root:
      test_title: audit log directories are group-owned by root
      capability: unix.file
      object: audit-log-directory-object
      check_existence: all_exist
      check: all
      states:
      - state-group-owned-by-root
  evaluate:
    test: test-audit-log-directories-group-owned-by-root
