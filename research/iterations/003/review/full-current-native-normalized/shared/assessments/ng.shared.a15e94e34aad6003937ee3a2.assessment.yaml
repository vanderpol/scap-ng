assessment:
  id: ng.shared.a15e94e34aad6003937ee3a2
  version: 1
  assessment_title: All system start-up files must be group-owned by root, sys, or bin.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    etc-rc-etc-init-d-directories-collection-2:
      collection_title: The /etc/rc* and /etc/init.d directories.
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: run-control-scripts-dir-paths-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
    etc-rc-etc-init-d-directories-collection:
      collection_title: The /etc/rc* and /etc/init.d directories.
      capability: unix.file
      set:
        operator: union
        members:
        - collection: etc-rc-etc-init-d-directories-collection-2
        filters:
        - action: exclude
          match:
            field: type
            value: symbolic link
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: symbolic link
          capability: unix.file
  variables:
    run-control-scripts-dir-paths-variable:
      title: Run control scripts' dir paths.
      kind: constant
      datatype: string
      expression:
        literal:
        - /etc/init.d
        - /etc/rc0.d
        - /etc/rc1.d
        - /etc/rc2.d
        - /etc/rc3.d
        - /etc/rcS.d
        - /etc/rcm
  tests:
    test-all-files-under-etc-rc-init-d-directories-have-group:
      test_title: All files under /etc/rc* and init.d directories have group owner root, sys, or bin
      capability: unix.file
      collection: etc-rc-etc-init-d-directories-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: group owner root (GID 0)
          capability: unix.file
          state:
            field: group_id
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: group owner bin (GID 2)
          capability: unix.file
          state:
            field: group_id
            value: '2'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: group owner sys (GID 3)
          capability: unix.file
          state:
            field: group_id
            value: '3'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-all-files-under-etc-rc-init-d-directories-have-group
