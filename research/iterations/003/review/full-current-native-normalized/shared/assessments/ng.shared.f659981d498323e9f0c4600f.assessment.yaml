assessment:
  id: ng.shared.f659981d498323e9f0c4600f
  version: 1
  assessment_title: The default umask for FTP users must be 077.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    smf-listing-ftp-service-collection:
      collection_title: SMF listing of FTP service.
      capability: solaris.smf
      select:
        fmri:
          operation: equals
          datatype: string
          mask: false
          value: svc://localhost/network/ftp:default
    umask-id-string-in-etc-proftpd-conf-file-collection:
      collection_title: Umask ID string in The (/etc/proftpd.conf) file.
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/proftpd.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*Umask\s+(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-check-see-if-ftp-service-listed-under-smf:
      test_title: Check to see if the FTP service is listed under the SMF.
      capability: solaris.smf
      collection: smf-listing-ftp-service-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
    test-ftp-umask-value-set-077:
      test_title: FTP umask value must be set to 077.
      capability: independent.textfilecontent54
      collection: umask-id-string-in-etc-proftpd-conf-file-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: 077 state for umask.
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: '077'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    any:
    - test: test-check-see-if-ftp-service-listed-under-smf
    - test: test-ftp-umask-value-set-077
