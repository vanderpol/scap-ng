assessment:
  id: ng.shared.61c275eb5abed4777b4e3fb4
  version: 1
  assessment_title: The system must disable accounts after three consecutive unsuccessful login attempts.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    lock-after-retries-in-etc-security-policy-conf-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/security/policy.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*LOCK_AFTER_RETRIES=(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: LOCK_AFTER_RETRIES in /etc/security/policy.conf
    retries-in-etc-default-login-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/default/login
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*RETRIES=(\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: RETRIES in /etc/default/login
    lock-after-retries-in-etc-user-attr-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/user_attr
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[^:#]+:[^:#]*:[^:#]*:[^:#]*:[^:#]*(?:[^:#]*;)?lock_after_retries=([^;\s]+)(?:;|\s|$)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: lock_after_retries in /etc/user_attr
  states:
    state-lock-after-retries-yes-in-etc-security-policy-conf:
      state_title: LOCK_AFTER_RETRIES == YES in /etc/security/policy.conf
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: 'YES'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-retries-3-in-etc-default-login:
      state_title: RETRIES <= 3 in /etc/default/login
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '3'
        operation: less than or equal
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-lock-after-retries-no:
      state_title: lock_after_retries == no
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: 'no'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-lock-after-retries-yes-in-etc-security-policy-conf:
      test_title: LOCK_AFTER_RETRIES == YES in /etc/security/policy.conf
      capability: independent.textfilecontent54
      object: lock-after-retries-in-etc-security-policy-conf-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-lock-after-retries-yes-in-etc-security-policy-conf
    test-retries-3-in-etc-default-login:
      test_title: RETRIES <= 3 in /etc/default/login
      capability: independent.textfilecontent54
      object: retries-in-etc-default-login-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-retries-3-in-etc-default-login
    test-lock-after-retries-no-in-etc-user-attr:
      test_title: lock_after_retries != no in /etc/user_attr
      capability: independent.textfilecontent54
      object: lock-after-retries-in-etc-user-attr-object
      check_existence: any_exist
      check: none satisfy
      states:
      - state-lock-after-retries-no
  evaluate:
    all:
    - test: test-lock-after-retries-yes-in-etc-security-policy-conf
    - test: test-retries-3-in-etc-default-login
    - test: test-lock-after-retries-no-in-etc-user-attr
