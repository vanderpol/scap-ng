assessment:
  id: ng.shared.4b5a633122e2c4d4eac22661
  version: 1
  assessment_title: Non system-created file shares on a system must limit access to groups that require it.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: If only system-created shares such as "ADMIN$", "C$", and "IPC$" exist on the system, this is NA. (System-created
    shares will display a message that it has been shared for administrative purposes when "Properties" is selected.) Run
    "Computer Management". Navigate to System Tools >> Shared Folders >> Shares. Right click any non-system-created shares.
    Select "Properties". Select the "Share Permissions" tab. If the file shares have not been reconfigured to restrict permissions
    to the specific groups or accounts that require access, this is a finding. Select the "Security" tab. If the NTFS permissions
    have not been reconfigured to restrict permissions to the specific groups or accounts that require access, this is a finding.
  inputs: {}
  evidence: []
