assessment:
  id: ng.shared.e81efeccb4db3b13738fcf07
  version: 1
  assessment_title: The Ubuntu operating system SSH daemon must prevent remote hosts from connecting to the proxy display.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the SSH daemon prevents remote hosts from connecting to the proxy display. Check the SSH X11UseLocalhost
    setting with the following command: $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr
    ''\n'' '' '' | xargs sudo grep -iH ''^\s*x11uselocalhost'' X11UseLocalhost yes If the "X11UseLocalhost" keyword is set
    to "no", is missing, or is commented out, this is a finding. If conflicting results are returned, this is a finding.'
  inputs: {}
  evidence: []
