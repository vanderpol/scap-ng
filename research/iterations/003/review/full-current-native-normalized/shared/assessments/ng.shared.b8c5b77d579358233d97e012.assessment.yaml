assessment:
  id: ng.shared.b8c5b77d579358233d97e012
  version: 1
  assessment_title: The Ubuntu operating system SSH server must be configured to use only FIPS-validated key exchange algorithms.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that the SSH server is configured to use only FIPS-validated key exchange algorithms: $ sudo grep -i
    kexalgorithms /etc/ssh/sshd_config KexAlgorithms ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,diffie-hellman-group-exchange-sha256
    If "KexAlgorithms" is not configured, is commented out, or does not contain only the algorithms "ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,diffie-hellman-group-exchange-sha256"
    in exact order, this is a finding.'
  inputs: []
  evidence: []
