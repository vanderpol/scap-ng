assessment:
  id: ng.shared.92312df5f077fdd9825d4281
  version: 1
  assessment_title: Direct Access - Route Through Internal Network
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\Windows\TCPIP\v6Transition
        name:
          operation: equals
          datatype: string
          mask: false
          value: Force_Tunneling
      object_title: null
  variables:
    route-all-traffic-through-internal-network-variable:
      title: Route all traffic through the internal network
      kind: external
      datatype: string
      input:
        required: true
        cardinality: one_or_more
        parameter: route_all_traffic_through_the_internal_network_var
        validation:
          alternatives:
          - literal: Enabled
            hint: enabled_enabled_state
          - literal: Disabled
            hint: enabled_disabled_state
  states:
    state-reg-sz-type-and-value-equals-variable:
      state_title: Reg_Sz type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_sz
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: route-all-traffic-through-internal-network-variable
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-route-all-traffic-through-internal-network-set-enabled-enabled-state:
      test_title: '''Route all traffic through the internal network'' is set to ''Enabled: Enabled State'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-sz-type-and-value-equals-variable
  evaluate:
    test: test-route-all-traffic-through-internal-network-set-enabled-enabled-state
