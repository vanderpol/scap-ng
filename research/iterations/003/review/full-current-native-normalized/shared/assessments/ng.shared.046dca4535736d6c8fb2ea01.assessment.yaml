assessment:
  id: ng.shared.046dca4535736d6c8fb2ea01
  version: 1
  assessment_title: The audit service must be running.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    check-auditd-collection:
      collection_title: check for auditd
      capability: unix.process58
      select:
        command_line:
          operation: pattern match
          datatype: string
          mask: false
          value: '[\00]*\/sbin\/auditd[\00]*'
        pid:
          operation: greater than
          datatype: int
          mask: false
          value: '1'
  tests:
    test-check-auditd:
      test_title: check for auditd
      capability: unix.process58
      collection: check-auditd-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    test: test-check-auditd
