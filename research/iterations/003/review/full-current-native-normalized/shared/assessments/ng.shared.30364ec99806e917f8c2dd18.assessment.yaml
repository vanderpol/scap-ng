assessment:
  id: ng.shared.30364ec99806e917f8c2dd18
  version: 1
  assessment_title: Windows Server 2019 permissions for the Security event log must prevent access by non-privileged accounts.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Navigate to the Security event log file. The default location is the "%SystemRoot%\System32\winevt\Logs" folder.
    However, the logs may have been moved to another folder. If the permissions for the "Security.evtx" file are not as restrictive
    as the default permissions listed below, this is a finding: Eventlog - Full Control SYSTEM - Full Control Administrators
    - Full Control'
  inputs: {}
  evidence: []
