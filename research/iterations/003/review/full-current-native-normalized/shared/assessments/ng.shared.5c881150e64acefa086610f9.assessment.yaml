assessment:
  id: ng.shared.5c881150e64acefa086610f9
  version: 1
  assessment_title: RHEL 8 wireless network adapters must be disabled.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify there are no wireless interfaces configured on the system with the following command: Note: This requirement
    is Not Applicable for systems that do not have physical wireless network radios. $ sudo nmcli device status DEVICE TYPE
    STATE CONNECTION virbr0 bridge connected virbr0 wlp7s0 wifi connected wifiSSID enp6s0 ethernet disconnected -- p2p-dev-wlp7s0
    wifi-p2p disconnected -- lo loopback unmanaged -- virbr0-nic tun unmanaged -- If a wireless interface is configured and
    has not been documented and approved by the Information System Security Officer (ISSO), this is a finding.'
  inputs: {}
  evidence: []
