assessment:
  id: ng.shared.3a0d14de783fd74fe4b2d7e3
  version: 1
  assessment_title: UBTU-22-654205 - Ubuntu 22.04 LTS must generate audit records for the /var/run/utmp file.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/audit.rules
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*-w\s+/var/run/utmp(?:\s+-p\s+(?:[rx]*w[rx]*a[rx]*|[rx]*a[rx]*w[rx]*))?(?:\s+(?:-k\s+|-F\s+key=)\S+)*\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-textfilecontent54-collection-2:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/audit.rules
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*-a\s+(?:always,exit|exit,always)(?:\s+-S\s+all)?\s+-F\s+path=/var/run/utmp\s+-F\s+perm=(?:[rx]*w[rx]*a[rx]*|[rx]*a[rx]*w[rx]*)(?:\s+(?:-k\s+|-F\s+key=)\S+)*\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-audit-modifications-var-run-utmp-use-file-watch-syntax:
      test_title: Audit modifications to /var/run/utmp.  Use file watch syntax.
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
    test-audit-modifications-var-run-utmp-use-system-call-syntax:
      test_title: Audit modifications to /var/run/utmp.  Use system call syntax.
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection-2
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    any:
    - test: test-audit-modifications-var-run-utmp-use-file-watch-syntax
    - test: test-audit-modifications-var-run-utmp-use-system-call-syntax
