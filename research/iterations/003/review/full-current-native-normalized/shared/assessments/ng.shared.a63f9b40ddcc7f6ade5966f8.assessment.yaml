assessment:
  id: ng.shared.a63f9b40ddcc7f6ade5966f8
  version: 1
  assessment_title: Audit - Logon - Failure
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-auditeventpolicysubcategories-collection:
      collection_title: null
      capability: windows.auditeventpolicysubcategories
  tests:
