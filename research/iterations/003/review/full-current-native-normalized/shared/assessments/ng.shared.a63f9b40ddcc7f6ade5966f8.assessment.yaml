      test_title: Audit - Logon - Failure only
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Audit - Logon - Failure only
        state_capability: windows.auditeventpolicysubcategories
        state:
          field: logon
          value: AUDIT_FAILURE
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-audit-logon-success-failure:
      test_title: Audit - Logon - Success and Failure
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Audit - Logon - Success and Failure
        state_capability: windows.auditeventpolicysubcategories
        state:
          field: logon
          value: AUDIT_SUCCESS_FAILURE
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    any:
    - test: test-audit-logon-failure-only
    - test: test-audit-logon-success-failure
