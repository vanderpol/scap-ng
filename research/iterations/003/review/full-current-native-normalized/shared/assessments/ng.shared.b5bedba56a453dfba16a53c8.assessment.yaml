assessment:
  id: ng.shared.b5bedba56a453dfba16a53c8
  version: 1
  assessment_title: The system must verify that package updates are digitally signed.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    pkg-property-collection:
      collection_title: pkg property
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: pkg property
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: signature-policy
  tests:
    test-determine-what-signature-policy-pkg-publishers:
      test_title: 'Determine what the signature policy is for pkg publishers:'
      capability: independent.shellcommand
      collection: pkg-property-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Check that line returns signature-policy               verify
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: signature-policy               verify
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-determine-what-signature-policy-pkg-publishers
