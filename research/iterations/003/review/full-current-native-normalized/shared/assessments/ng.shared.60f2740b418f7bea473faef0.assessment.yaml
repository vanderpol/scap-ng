assessment:
  id: ng.shared.60f2740b418f7bea473faef0
  version: 1
  assessment_title: The Oracle Linux operating system must audit all uses of the creat, open, openat, open_by_handle_at, truncate,
    and ftruncate syscalls.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system generates audit records upon successful/unsuccessful attempts to use the "creat",
    "open", "openat", "open_by_handle_at", "truncate", and "ftruncate" syscalls. Check the file system rules in "/etc/audit/audit.rules"
    with the following commands: # grep ''open\|truncate\|creat'' /etc/audit/audit.rules -a always,exit -F arch=b32 -S creat,open,openat,open_by_handle_at,truncate,ftruncate
    -F exit=-EPERM -F auid>=1000 -F auid!=unset -k access -a always,exit -F arch=b32 -S creat,open,openat,open_by_handle_at,truncate,ftruncate
    -F exit=-EACCES -F auid>=1000 -F auid!=unset -k access -a always,exit -F arch=b64 -S creat,open,openat,open_by_handle_at,truncate,ftruncate
    -F exit=-EPERM -F auid>=1000 -F auid!=unset -k access -a always,exit -F arch=b64 -S creat,open,openat,open_by_handle_at,truncate,ftruncate
    -F exit=-EACCES -F auid>=1000 -F auid!=unset -k access If both the "b32" and "b64" audit rules are not defined for the
    "creat", "open", "openat", "open_by_handle_at", "truncate", and "ftruncate" syscalls, this is a finding. If the output
    does not produce rules containing "-F exit=-EPERM", this is a finding. If the output does not produce rules containing
    "-F exit=-EACCES", this is a finding.'
  inputs: []
  evidence: []
