assessment:
  id: ng.shared.841bfd1e25a6584e28e8657f
  version: 1
  assessment_title: IIS 10.0 website session IDs must be sent to the client using TLS.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    get-session-keepsessionidsecure-setting-from-system-web-httpcookies-collection:
      collection_title: get session.keepSessionIdSecure setting from system.web/httpCookies
      capability: windows.appcmdlistconfig
      select:
        identifier_type:
          operation: equals
          datatype: string
          mask: false
          value: Site
        identifier:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        section:
          operation: equals
          datatype: string
          mask: false
          value: system.webServer/asp
        parameter:
          operation: equals
          datatype: string
          mask: false
          value: session.keepSessionIdSecure
  tests:
    test-website-system-webserver-asp-sessions-keepsessionidsecure-setting:
      test_title: Website system.webServer/asp sessions.keepSessionIdSecure setting
      capability: windows.appcmdlistconfig
      collection: get-session-keepsessionidsecure-setting-from-system-web-httpcookies-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: appcmdlistconfig result must equal True.
        state_capability: windows.appcmdlistconfig
        state:
          field: result
          value: 'true'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-website-system-webserver-asp-sessions-keepsessionidsecure-setting
