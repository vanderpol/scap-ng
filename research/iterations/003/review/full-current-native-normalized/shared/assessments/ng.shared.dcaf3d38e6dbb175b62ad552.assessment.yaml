assessment:
  id: ng.shared.dcaf3d38e6dbb175b62ad552
  version: 1
  assessment_title: All OL 8 world-writable directories must be group-owned by root, sys, bin, or an application group.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    get-directories-on-local-partitions-that-world-writable-collection:
      collection_title: Get directories on local partitions that are world writable.
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
      filters:
      - action: exclude
        match:
          field: owrite
          value: '0'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: Used as filter to exclude owrite of '0'.
        capability: unix.file
      - action: exclude
        match:
          field: group_id
          value: '1000'
          operation: less than
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: Filters out files with group_id less than 1000.
        capability: unix.file
      behaviors:
        recurse_direction: down
        recurse_file_system: local
        recurse: directories
  tests:
    test-all-world-writable-directories-group-owned-by-root-sys-bin:
      test_title: All world-writable directories must be group-owned by root, sys, bin, or an application group.
      capability: unix.file
      collection: get-directories-on-local-partitions-that-world-writable-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
  evaluate:
    test: test-all-world-writable-directories-group-owned-by-root-sys-bin
