assessment:
  id: ng.shared.1db8c1b603199982fff962fb
  version: 1
  assessment_title: The macOS system must enable Authenticated Root.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    os-authenticated-root-enable-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/libexec/mdmclient QuerySecurityInfo 2>/dev/null | /usr/bin/grep "AuthenticatedRootVolumeEnabled = 1;"
      object_title: os_authenticated_root_enable_recommended_object
  states:
    state-os-authenticated-root-enable-recommended-state:
      state_title: os_authenticated_root_enable_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: .*
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-os-authenticated-root-enable-recommended-test:
      test_title: os_authenticated_root_enable_recommended_test
      capability: independent.shellcommand
      object: os-authenticated-root-enable-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-os-authenticated-root-enable-recommended-state
  evaluate:
    test: test-os-authenticated-root-enable-recommended-test
