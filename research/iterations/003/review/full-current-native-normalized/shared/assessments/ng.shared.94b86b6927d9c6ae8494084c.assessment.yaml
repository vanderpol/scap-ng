assessment:
  id: ng.shared.94b86b6927d9c6ae8494084c
  version: 1
  assessment_title: OL09-00-002534 - OL 9 /etc/group file must be owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-file-object:
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/group
      object_title: null
  states:
    state-owned-by-root:
      state_title: owned by root
      capability: unix.file
      state:
        field: user_id
        value: '0'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-etc-group-file-owned-by-root:
      test_title: /etc/group file is owned by root
      capability: unix.file
      object: unix-file-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-owned-by-root
  evaluate:
    test: test-etc-group-file-owned-by-root
