assessment:
  id: ng.shared.284c4b2020a31dca020b9eab
  version: 1
  assessment_title: The macOS system must disable Bluetooth Sharing.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable Bluetooth sharing with the following commands: CURRENT_USER=$(
    /usr/sbin/scutil <<< "show State:/Users/ConsoleUser" | /usr/bin/awk ''/Name :/ && ! /loginwindow/ { print $3 }'' ) /usr/bin/sudo
    -u "$CURRENT_USER" /usr/bin/defaults -currentHost read com.apple.Bluetooth PrefKeyServicesEnabled If the result is not
    "0", this is a finding.'
  inputs: {}
  evidence: []
