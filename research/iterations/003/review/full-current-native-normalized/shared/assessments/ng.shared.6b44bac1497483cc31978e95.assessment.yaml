assessment:
  id: ng.shared.6b44bac1497483cc31978e95
  version: 1
  assessment_title: The nobody access for RPC encryption key storage service must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    etc-default-keyserv-file-collection:
      collection_title: The (/etc/default/keyserv) file.
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/default/keyserv
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*ENABLE_NOBODY_KEYS=(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-check-see-that-nobody-keys-disabled:
      test_title: Check to see that nobody keys are disabled.
      capability: independent.textfilecontent54
      collection: etc-default-keyserv-file-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: NO or no string.
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^[Nn][Oo]$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-check-see-that-nobody-keys-disabled
