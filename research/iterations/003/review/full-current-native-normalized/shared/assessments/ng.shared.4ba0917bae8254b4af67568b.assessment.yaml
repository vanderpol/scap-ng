assessment:
  id: ng.shared.4ba0917bae8254b4af67568b
  version: 1
  assessment_title: Apache web server application directories, libraries, and configuration files must only be accessible
    to privileged users.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Obtain a list of the user accounts for the system, noting the privileges for each account. Verify with the System
    Administrator (SA) or the Information System Security Officer (ISSO) that all privileged accounts are mission essential
    and documented. Verify with the SA or the ISSO that all non-administrator access to shell scripts and operating system
    functions are mission essential and documented. If undocumented privileged accounts are present, this is a finding. If
    undocumented access to shell scripts or operating system functions is present, this is a finding.
  inputs: {}
  evidence: []
