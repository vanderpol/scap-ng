  version: 1
  assessment_title: The TFTP Client must not be installed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Open "PowerShell". Enter "Get-WindowsFeature | Where Name -eq TFTP-Client". If "Installed State" is "Installed",
    this is a finding. An Installed State of "Available" or "Removed" is not a finding.
  inputs: []
  evidence: []
