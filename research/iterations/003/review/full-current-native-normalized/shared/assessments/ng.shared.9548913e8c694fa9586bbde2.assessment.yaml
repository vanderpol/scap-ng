assessment:
  id: ng.shared.9548913e8c694fa9586bbde2
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that all local interactive user home directories
    have mode 0750 or less permissive.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    operating-system-configured-so-that-all-local-interactive-user-home-collection-2:
      collection_title: The operating system must be configured so that all local interactive user home directories have mode
        0750 or less permissive.
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/passwd
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[^:]*:[^:]*:[^:]*:[^:]*:[^:]*:([^:]*?):.*
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      filters:
      - action: exclude
        match:
          field: text
          value: ^[^:]*:[^:]*:(\d{1,3}):.*
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: Filter out users with UID less than 1000.
        capability: independent.textfilecontent54
      - action: exclude
        match:
          field: text
          value: ^.*bin/nologin
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: Filter out users with shell of 'nologin'.
        capability: independent.textfilecontent54
    operating-system-configured-so-that-all-local-interactive-user-home-collection:
      collection_title: The operating system must be configured so that all local interactive user home directories have mode
        0750 or less permissive.
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: retrieve-home-directory-variable
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
      behaviors:
        recurse_direction: none
        recurse: symlinks and directories
        max_depth: '0'
  variables:
    retrieve-home-directory-variable:
      title: Retrieve home directory
      kind: local
      datatype: string
      expression:
        values:
          collection: operating-system-configured-so-that-all-local-interactive-user-home-collection-2
          field: subexpression
  tests:
    test-operating-system-configured-so-that-all-local-interactive-user-home:
      test_title: The operating system must be configured so that all local interactive user home directories have mode 0750
        or less permissive.
      capability: unix.file
      collection: operating-system-configured-so-that-all-local-interactive-user-home-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: The operating system must be configured so that all local interactive user home directories have mode
          0750 or less permissive.
        state_capability: unix.file
        state:
          all:
          - field: gwrite
            value: '0'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: oread
            value: '0'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: owrite
            value: '0'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: oexec
            value: '0'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-operating-system-configured-so-that-all-local-interactive-user-home
