assessment:
  id: ng.shared.11608263a7e96264e891a5e0
  version: 1
  assessment_title: Membership to the Domain Admins group must be restricted to accounts used only to manage the Active Directory
    domain and domain controllers.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    run-powershell-command-determine-members-enterprise-admins-group-manual-review-collection:
      collection_title: Run a PowerShell command to determine members of the Enterprise Admins group. (Manual Review Required)
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: Get-ADGroupMember -Identity 'Enterprise Admins'
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: \w
  tests:
    test-unknown-test-results-auditor-review-results-gathered-stig-requirements:
      test_title: Unknown Test Results - An auditor must review results gathered and STIG requirements.
      capability: independent.unknown
      result: unknown
    test-run-powershell-command-gather-members-enterprise-admins-group-manual-review:
      test_title: Run a PowerShell command to gather members of the Enterprise Admins group. (Manual Review Required)
      capability: independent.shellcommand
      collection: run-powershell-command-determine-members-enterprise-admins-group-manual-review-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state: null
  evaluate:
    all:
    - test: test-unknown-test-results-auditor-review-results-gathered-stig-requirements
    - test: test-run-powershell-command-gather-members-enterprise-admins-group-manual-review
