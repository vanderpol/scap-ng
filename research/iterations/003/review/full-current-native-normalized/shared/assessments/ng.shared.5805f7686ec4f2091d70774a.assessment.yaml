  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    tmp-object:
      capability: linux.partition
      select:
        mount_point:
          operation: equals
          datatype: string
          value: /tmp
      object_title: /tmp
  states: {}
  tests:
    test-check-tmp:
      test_title: check for /tmp
