assessment:
  id: ng.shared.92037c82ad627c054dfcb8b2
  version: 1
  assessment_title: OL 8 must implement non-executable data to protect its memory from unauthorized code execution.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    retrieve-flags-line-from-proc-cpuinfo-collection:
      collection_title: Retrieve flags line from /proc/cpuinfo
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /proc/cpuinfo
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: \n*\s*(flags\s+:\s+[^#]*?\s+nx\s*\S*)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-retrieve-flags-line-from-file-confirm-nx-flag-exists:
      test_title: Retrieve flags line from file and confirm 'nx' flag exists.
      capability: independent.textfilecontent54
      collection: retrieve-flags-line-from-proc-cpuinfo-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Confirm line content.
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: flags\s*:.*?\s+nx(\s|$)
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-retrieve-flags-line-from-file-confirm-nx-flag-exists
