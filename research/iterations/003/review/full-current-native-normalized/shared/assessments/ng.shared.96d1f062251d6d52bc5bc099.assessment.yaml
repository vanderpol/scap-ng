assessment:
  id: ng.shared.96d1f062251d6d52bc5bc099
  version: 1
  assessment_title: WN10-CC-000360 - The Windows Remote Management (WinRM) client must not use Digest authentication.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\Windows\WinRM\Client
        name:
          operation: equals
          datatype: string
          mask: false
          value: AllowDigest
  tests:
    test-disallow-digest-authentication-set-enabled:
      test_title: '''Disallow Digest authentication'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-disallow-digest-authentication-set-enabled
