  version: 1
  assessment_title: The maximum age for machine account passwords must be set to requirements.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding: Registry
    Hive: HKEY_LOCAL_MACHINE Registry Path: \System\CurrentControlSet\Services\Netlogon\Parameters\ Value Name: MaximumPasswordAge
    Value Type: REG_DWORD Value: 30 (or less, but not 0)'
  inputs: []
  evidence: []
