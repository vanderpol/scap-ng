  version: 1
  assessment_title: Windows Server 2022 must have Secure Boot enabled.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Devices that have UEFI firmware must have Secure Boot enabled. Run "System Information". Under "System Summary",
    if "Secure Boot State" does not display "On", this is a finding. On server core installations, run the following PowerShell
    command: Confirm-SecureBootUEFI If a value of "True" is not returned, this is a finding.'
  inputs: {}
  evidence: []
