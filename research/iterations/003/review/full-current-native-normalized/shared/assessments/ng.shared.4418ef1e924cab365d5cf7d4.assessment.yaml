assessment:
  id: ng.shared.4418ef1e924cab365d5cf7d4
  version: 1
  assessment_title: The system must require users to re-authenticate to unlock a graphical desktop environment.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    gdm-graphical-login-object:
      capability: solaris.smf
      select:
        fmri:
          operation: equals
          datatype: string
          value: svc://localhost/application/graphical-login/gdm:default
      object_title: The gdm graphical-login.
    xdm-graphical-login-object:
      capability: solaris.smf
      select:
        fmri:
          operation: equals
          datatype: string
          value: svc://localhost/application/graphical-login/xdm:default
      object_title: The xdm graphical-login.
    timeout-field-in-xscreensaver-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /usr/share/X11/app-defaults/XScreenSaver
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*\*timeout:\s*(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: timeout field in XScreenSaver.
    locktimeout-field-in-xscreensaver-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /usr/share/X11/app-defaults/XScreenSaver
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*\*lockTimeout:\s*(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: lockTimeout field in XScreenSaver.
    lock-field-in-xscreensaver-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /usr/share/X11/app-defaults/XScreenSaver
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*\*lock:\s*(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: lock field in XScreenSaver.
    all-users-object:
      capability: unix.password
      select:
        username:
          operation: pattern match
          datatype: string
          value: ^[^-+].*$
      object_title: All users
    home-directories-all-user-accounts-object:
      capability: unix.password
      set:
        operator: union
        members:
        - object: all-users-object
        filters:
        - action: exclude
          state: state-system-accounts
        - action: exclude
          state: state-system-account
        - action: exclude
          state: state-system-account-2
        - action: exclude
          state: state-system-account-3
      object_title: The home directories of all user accounts.
    lock-field-in-xscreensaver-object-2:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          variable_check: at least one
          value:
            variable: home-directories-all-user-accounts-variable
        filename:
          operation: equals
          datatype: string
          value: .xscreensaver
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*lock:\s*(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: lock field in .xscreensaver.
    locktimeout-field-in-xscreensaver-object-2:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          variable_check: at least one
          value:
            variable: home-directories-all-user-accounts-variable
        filename:
          operation: equals
          datatype: string
          value: .xscreensaver
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*lockTimeout:\s*(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: lockTimeout field in .xscreensaver.
    timeout-field-in-xscreensaver-object-2:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          variable_check: at least one
          value:
            variable: home-directories-all-user-accounts-variable
        filename:
          operation: equals
          datatype: string
          value: .xscreensaver
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*timeout:\s*(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: timeout field in .xscreensaver.
  variables:
    home-directories-all-user-accounts-variable:
      title: The home directories of all user accounts.
      kind: local
      datatype: string
      expression:
        values:
          object: home-directories-all-user-accounts-object
          field: home_dir
  states:
    state-gdm-graphical-login-is-online:
      state_title: gdm graphical-login is online.
      capability: solaris.smf
      state:
        field: service_state
        value: ONLINE
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-xscreensaver-15-min-or-less-timeout:
      state_title: XScreenSaver 15 min or less timeout.
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: (?:0:15:00|0:1[0-4]:[0-5][0-9]|0:0[0-9]:[0-5][0-9])
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-xscreensaver-0-00-05-or-less-locktimeout:
      state_title: XScreenSaver 0:00:05 or less lockTimeout.
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: 0:00:0[0-5]
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-xscreensaver-true-lock-setting:
      state_title: XScreenSaver true lock setting.
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: 'True'
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-xscreensaver-true-lock-setting-2:
      state_title: .xscreensaver true lock setting.
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: 'True'
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-xscreensaver-5-second-or-less-locktimeout:
      state_title: .xscreensaver 5 second or less lockTimeout.
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: 0:00:0[0-5]
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-xscreensaver-15-min-or-less-timeout-2:
      state_title: .xscreensaver 15 min or less timeout.
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: (?:0:15:00|0:1[0-4]:[0-5][0-9]|0:0[0-9]:[0-5][0-9])
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-system-accounts:
      state_title: System accounts.
      capability: unix.password
      state:
        field: user_id
        value: '100'
        operation: less than
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
    state-system-account:
      state_title: System account.
      capability: unix.password
      state:
        field: user_id
        value: '60001'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
    state-system-account-2:
      state_title: System account.
      capability: unix.password
      state:
        field: user_id
        value: '60002'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
    state-system-account-3:
      state_title: System account.
      capability: unix.password
      state:
        field: user_id
        value: '65534'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-check-see-if-xwindows-being-run-by-system-using-cdm:
      test_title: Check to see if XWindows is being run by the system, using CDM.
      capability: solaris.smf
      object: gdm-graphical-login-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-gdm-graphical-login-is-online
    test-check-see-if-xwindows-being-run-by-system-using-xdm:
      test_title: Check to see if XWindows is being run by the system, using XDM.
      capability: solaris.smf
      object: xdm-graphical-login-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-gdm-graphical-login-is-online
    test-xscreensaver-have-timeout-15-minutes:
      test_title: XScreenSaver must have a timeout of 15 minutes.
      capability: independent.textfilecontent54
      object: timeout-field-in-xscreensaver-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-xscreensaver-15-min-or-less-timeout
    test-xscreensaver-have-locktimeout-0-00-05:
      test_title: XScreenSaver must have a lockTimeout of 0:00:05.
      capability: independent.textfilecontent54
      object: locktimeout-field-in-xscreensaver-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-xscreensaver-0-00-05-or-less-locktimeout
    test-xscreensaver-have-lock-field-set-true:
      test_title: XScreenSaver must have a lock field set to true.
      capability: independent.textfilecontent54
      object: lock-field-in-xscreensaver-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-xscreensaver-true-lock-setting
    test-each-user-s-xscreensaver-have-lock-field-set-true:
      test_title: Each user's .xscreensaver must have a lock field set to true.
      capability: independent.textfilecontent54
      object: lock-field-in-xscreensaver-object-2
      check_existence: any_exist
      check: all
      states:
      - state-xscreensaver-true-lock-setting-2
    test-each-user-s-xscreensaver-have-locktimeout-5-seconds:
      test_title: Each user's .xscreensaver must have a lockTimeout of 5 seconds.
      capability: independent.textfilecontent54
      object: locktimeout-field-in-xscreensaver-object-2
      check_existence: any_exist
      check: all
      states:
      - state-xscreensaver-5-second-or-less-locktimeout
    test-xscreensaver-have-timeout-15-minutes-2:
      test_title: XScreenSaver must have a timeout of 15 minutes.
      capability: independent.textfilecontent54
      object: timeout-field-in-xscreensaver-object-2
      check_existence: any_exist
      check: all
      states:
      - state-xscreensaver-15-min-or-less-timeout-2
  evaluate:
    any:
    - not:
        any:
        - test: test-check-see-if-xwindows-being-run-by-system-using-cdm
        - test: test-check-see-if-xwindows-being-run-by-system-using-xdm
    - all:
      - test: test-xscreensaver-have-timeout-15-minutes
      - test: test-xscreensaver-have-locktimeout-0-00-05
      - test: test-xscreensaver-have-lock-field-set-true
      - test: test-each-user-s-xscreensaver-have-lock-field-set-true
      - test: test-each-user-s-xscreensaver-have-locktimeout-5-seconds
      - test: test-xscreensaver-have-timeout-15-minutes-2
