assessment:
  id: ng.shared.0c046ca97d5e213aa228c4ad
  version: 1
  assessment_title: Separate, NSA-approved (Type 1) cryptography must be used to protect the directory data in transit for
    directory service implementations at a classified confidentiality level when replication data traverses a network cleared
    to a lower level than the data.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: This applies to domain controllers. It is NA for other systems. Review the organization network diagram(s) or
    documentation to determine the level of classification for the network(s) over which replication data is transmitted.
    Determine the classification level of the Windows domain controller. If the classification level of the Windows domain
    controller is higher than the level of the networks, review the organization network diagram(s) and directory implementation
    documentation to determine if NSA-approved encryption is used to protect the replication network traffic. If the classification
    level of the Windows domain controller is higher than the level of the network traversed and NSA-approved encryption is
    not used, this is a finding.
  inputs: {}
  evidence: []
