assessment:
  id: ng.shared.519bedf50d771da1e7a5e35a
  version: 1
  assessment_title: MSDT Interactive Communication
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows\ScriptedDiagnosticsProvider\Policy
        name:
          operation: equals
          datatype: string
          mask: false
          value: DisableQueryRemoteServer
  variables:
    microsoft-support-diagnostic-tool-turn-on-msdt-interactive-communication-support-variable:
      title: 'Microsoft Support Diagnostic Tool: Turn on MSDT interactive communication with support provider'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: microsoft_support_diagnostic_tool_turn_on_msdt_interactive_communication_with_support_provider_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-microsoft-support-diagnostic-tool-turn-on-msdt-interactive-communication-support:
      test_title: '''Microsoft Support Diagnostic Tool: Turn on MSDT interactive communication with Support Provider'' is
        set to ''Disabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: microsoft-support-diagnostic-tool-turn-on-msdt-interactive-communication-support-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-microsoft-support-diagnostic-tool-turn-on-msdt-interactive-communication-support
