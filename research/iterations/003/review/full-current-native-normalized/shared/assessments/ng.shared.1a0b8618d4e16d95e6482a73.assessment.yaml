assessment:
  id: ng.shared.1a0b8618d4e16d95e6482a73
  version: 1
  assessment_title: OL08-00-010730 - All OL 8 local interactive user home directories must have mode "0750" or less permissive.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    local-interactive-users-without-nologin-object:
      capability: unix.password
      select:
        username:
          operation: pattern match
          datatype: string
          value: .*
      filters:
      - action: exclude
        state: state-nologin-shell
      - action: exclude
        state: state-uid-1000
      - action: exclude
        state: state-uid-65534-nobody
      object_title: Local interactive users without nologin
    home-directories-local-interactive-users-without-nologin-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          variable_check: at least one
          value:
            variable: home-directories-local-interactive-users-without-nologin-variable
        filename:
          operation: equals
          datatype: string
          nil: true
          value: ''
      object_title: home directories of local interactive users without nologin
  variables:
    home-directories-local-interactive-users-without-nologin-variable:
      title: home directories of local interactive users without nologin
      kind: local
      datatype: string
      expression:
        values:
          object: local-interactive-users-without-nologin-object
          field: home_dir
  states:
    state-mode-0750-or-less-permissive:
      state_title: mode 0750 or less permissive
      capability: unix.file
      state:
        all:
        - field: suid
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: sgid
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: sticky
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: gwrite
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: oread
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: owrite
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: oexec
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
    state-nologin-shell:
      state_title: nologin shell
      capability: unix.password
      state:
        field: login_shell
        value: ^.*nologin.*$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-uid-1000:
      state_title: uid < 1000
      capability: unix.password
      state:
        field: user_id
        value: '1000'
        operation: less than
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
    state-uid-65534-nobody:
      state_title: uid = 65534 (nobody)
      capability: unix.password
      state:
        field: user_id
        value: '65534'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-all-local-interactive-user-home-directories-0750-or-less:
      test_title: All local interactive user home directories are 0750 or less
      capability: unix.file
      object: home-directories-local-interactive-users-without-nologin-object
      check_existence: any_exist
      check: all
      states:
      - state-mode-0750-or-less-permissive
  evaluate:
    test: test-all-local-interactive-user-home-directories-0750-or-less
