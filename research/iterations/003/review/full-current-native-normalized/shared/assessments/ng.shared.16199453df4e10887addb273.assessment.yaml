assessment:
  id: ng.shared.16199453df4e10887addb273
  version: 1
  assessment_title: UBTU-18-010128 - The Ubuntu operating system must configure audit tools with a mode of 0755 or less permissive.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    audit-tool-executable-files-object:
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          variable_check: at least one
          value:
            variable: audit-tool-executable-files-variable
      object_title: audit tool executable files
  variables:
    audit-tool-executable-files-variable:
      title: audit tool executable files
      kind: constant
      datatype: string
      expression:
        literal:
        - /sbin/auditctl
        - /sbin/aureport
        - /sbin/ausearch
        - /sbin/autrace
        - /sbin/auditd
        - /sbin/audispd
        - /sbin/augenrules
  states:
    state-0755-permissions-or-less:
      state_title: 0755 permissions or less
      capability: unix.file
      state:
        all:
        - field: suid
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: sgid
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: sticky
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: gwrite
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: owrite
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-audit-tool-executable-file-permissions-at-least-0755:
      test_title: audit tool executable file permissions at least 0755
      capability: unix.file
      object: audit-tool-executable-files-object
      check_existence: all_exist
      check: all
      states:
      - state-0755-permissions-or-less
  evaluate:
    test: test-audit-tool-executable-file-permissions-at-least-0755
