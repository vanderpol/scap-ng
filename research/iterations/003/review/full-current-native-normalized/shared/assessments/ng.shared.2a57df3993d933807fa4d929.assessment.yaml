assessment:
  id: ng.shared.2a57df3993d933807fa4d929
  version: 1
  assessment_title: Administrative accounts must not be used with applications that access the Internet, such as web browsers,
    or with potential Internet sources, such as email.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Determine whether organization policy, at a minimum, prohibits administrative accounts from using applications
    that access the Internet, such as web browsers, or with potential Internet sources, such as email, except as necessary
    for local service administration. If it does not, this is a finding. The organization may use technical means such as
    whitelisting to prevent the use of browsers and mail applications to enforce this requirement.
  inputs: {}
  evidence: []
