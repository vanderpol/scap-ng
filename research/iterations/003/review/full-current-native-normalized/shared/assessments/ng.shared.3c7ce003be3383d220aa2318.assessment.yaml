assessment:
  id: ng.shared.3c7ce003be3383d220aa2318
  version: 1
  assessment_title: SRG-APP-000456-WSR-000187
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    iis-version-string-collection:
      collection_title: IIS Version String
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Microsoft\InetStp
        name:
          operation: equals
          datatype: string
          mask: false
          value: VersionString
  tests:
    test-if-microsoft-iis-8-5-installed-this-finding:
      test_title: If Microsoft IIS 8.5 is installed, this is a finding
      capability: windows.registry
      collection: iis-version-string-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state_title: Value Equal To 8.5
        state_capability: windows.registry
        state:
          field: value
          value: Version 8.5
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-if-microsoft-iis-8-5-installed-this-finding
