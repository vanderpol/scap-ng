  assessment_title: The system must not respond to multicast echo requests.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Determine if response to multicast echo requests is disabled. # ipadm show-prop -p _respond_to_echo_multicast
    -co current ipv4 # ipadm show-prop -p _respond_to_echo_multicast -co current ipv6 If the output of all commands is not
    "0", this is a finding.'
