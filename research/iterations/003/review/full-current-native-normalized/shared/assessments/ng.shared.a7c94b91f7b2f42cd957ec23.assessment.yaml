      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: ipadm show-prop -p _forward_directed_broadcasts -co current ip
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
