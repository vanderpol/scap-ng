assessment:
  id: ng.shared.7f1df9d2193b7f519d892524
  version: 1
  assessment_title: WINCC-000106
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\Internet Explorer\Feeds
        name:
          operation: equals
          datatype: string
          mask: false
          value: AllowBasicAuthInClear
  tests:
    test-turn-on-basic-feed-authentication-over-http-set-disabled:
      test_title: '''Turn on Basic feed authentication over HTTP'' is set to ''Disabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals 0
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-turn-on-basic-feed-authentication-over-http-set-disabled
