assessment:
  id: ng.shared.65f38a679e8e75813bda68ea
  version: 1
  assessment_title: WN19-DC-000020 - Windows Server 2019 Kerberos user logon restrictions must be enforced.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    kerberos-policy-enforce-user-logon-restrictions-object:
      capability: windows.wmi57
      select:
        namespace:
          operation: equals
          datatype: string
          mask: false
          value: root\rsop\computer
        wql:
          operation: equals
          datatype: string
          mask: false
          value: SELECT setting FROM RSOP_SecuritySettingBoolean WHERE KeyName='TicketValidateClient'
      object_title: Kerberos Policy - Enforce user logon restrictions
  states:
    state-kerberos-policy-enforce-user-logon-restrictions-enabled-:
      state_title: Kerberos Policy - Enforce user logon restrictions - Enabled, PA test = -1
      capability: windows.wmi57
      state:
        field: result
        value:
          record:
          - name: setting
            value: '-1'
            operation: equals
            datatype: string
            mask: false
            entity_check: all
        operation: equals
        datatype: record
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-kerberos-policy-enforce-user-logon-restrictions-enabled--2:
      state_title: Kerberos Policy - Enforce user logon restrictions - Enabled, Other tools test = 1
      capability: windows.wmi57
      state:
        field: result
        value:
          record:
          - name: setting
            value: '1'
            operation: equals
            datatype: string
            mask: false
            entity_check: all
        operation: equals
        datatype: record
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-kerberos-user-logon-restrictions-enforced-pa-test-1-or-other:
      test_title: Kerberos user logon restrictions must be enforced, PA test = -1 OR Other tools test = 1
      capability: windows.wmi57
      object: kerberos-policy-enforce-user-logon-restrictions-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-kerberos-policy-enforce-user-logon-restrictions-enabled-
      - state-kerberos-policy-enforce-user-logon-restrictions-enabled--2
  evaluate:
    test: test-kerberos-user-logon-restrictions-enforced-pa-test-1-or-other
