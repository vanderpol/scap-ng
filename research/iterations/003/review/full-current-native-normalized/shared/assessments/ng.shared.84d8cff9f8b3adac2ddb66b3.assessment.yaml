assessment:
  id: ng.shared.84d8cff9f8b3adac2ddb66b3
  version: 1
  assessment_title: The Cisco perimeter router must be configured to drop IPv6 packets containing an extension header with
    the Endpoint Identification option.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This requirement is not applicable for the DODIN Backbone. Review the router configuration to determine if it
    is compliant with this requirement. Step 1: Verify that an inbound IPv6 ACL has been configured on the external interface.
    interface gigabitethernet1/0 ipv6 address 2001::1:0:22/64 ipv6 traffic-filter FILTER_IPV6 in Step 2: Verify that the ACL
    drops IPv6 packets containing a Destination Option header as shown in the example below. ipv6 access-list FILTER_IPV6
    deny 60 any any dest-option log permit ipv6 … … … … deny ipv6 any any log Note: Cisco has deprecated the dest-option-type
    command used to filter by option type within the Destination Option header. Therefore, all packets with the Destination
    Option header must be dropped. If the router is not configured to drop IPv6 packets containing a Destination Option header,
    this is a finding.'
  inputs: []
  evidence: []
