assessment:
  id: ng.shared.d3b80aae80afe20d505025c5
  version: 1
  assessment_title: The OracleLinux Operating system must audit all executions of privileged functions.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /usr/lib/systemd/system/auditd.service
        pattern:
          operation: pattern match
          datatype: string
          value: ^ExecStartPost=\-\/sbin\/augenrules.*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
    audit-augenrules-32-bit-execve-syscall-uid-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/audit/rules.d
        filename:
          operation: pattern match
          datatype: string
          value: .*\.rules$
        pattern:
          operation: pattern match
          datatype: string
          value: ^\-a\s+always,exit\s+\-F\s+arch=b32\s+\-S\s+execve\s+\-C\s+uid!=euid\s+\-F\s+euid=0\s+(-k[\s]+|-F[\s]+key=)[-\w]+\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: Audit augenrules 32-bit execve syscall uid
    audit-augenrules-32-bit-execve-syscall-gid-object:
