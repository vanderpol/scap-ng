assessment:
  id: ng.shared.99832dba5e7296f4c2ca20ed
  version: 1
  assessment_title: OL09-00-000351 - OL 9 must be configured so that the rsyslog service is active.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-systemdunitproperty-object:
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          value: rsyslog.service
        property:
          operation: equals
          datatype: string
          value: ActiveState
      object_title: null
  states:
    state-linux-systemdunitproperty:
      state_title: null
      capability: linux.systemdunitproperty
      state:
        field: value
        value: active
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-rsyslog-service-active:
      test_title: rsyslog.service is active
      capability: linux.systemdunitproperty
      object: linux-systemdunitproperty-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-linux-systemdunitproperty
  evaluate:
    test: test-rsyslog-service-active
