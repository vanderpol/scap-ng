assessment:
  id: ng.shared.6d15164c7abd7520fb89b1bf
  version: 1
  assessment_title: The operating system must have no unowned files.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    files-that-owned-by-user-or-group-not-listed-in-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: 'find / \( -fstype nfs -o -fstype cachefs -o -fstype autofs \

            -o -fstype ctfs -o -fstype mntfs -o -fstype objfs \

            -o -fstype proc \) -prune \( -nouser -o -nogroup \) -ls'
        pattern:
          operation: pattern match
          datatype: string
          value: .*
      object_title: Files that are owned by a user or group not listed in /etc/passwd or /etc/group
  states:
    state-no-stdout-line-data-should-exist:
      state_title: No stdout_line data should exist
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: ''
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: none_exist
  tests:
    test-files-that-owned-by-user-or-group-not-listed-in:
      test_title: Files that are owned by a user or group not listed in /etc/passwd or /etc/group should not exist
      capability: independent.shellcommand
      object: files-that-owned-by-user-or-group-not-listed-in-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-no-stdout-line-data-should-exist
  evaluate:
    test: test-files-that-owned-by-user-or-group-not-listed-in
