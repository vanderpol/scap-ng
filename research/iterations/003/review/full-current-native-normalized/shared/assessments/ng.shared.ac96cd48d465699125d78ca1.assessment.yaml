assessment:
  id: ng.shared.ac96cd48d465699125d78ca1
  version: 1
  assessment_title: The system must be configured to audit Logon/Logoff - Group Membership successes.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    secure-boot-state-setting-collection:
      collection_title: Secure Boot State Setting
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Control\LSA
        name:
          operation: equals
          datatype: string
          mask: false
          value: SCENoApplyLegacyAuditPolicy
    retrieves-auditeventpolicysubcategories-object-collection:
      collection_title: Retrieves a auditeventpolicysubcategories_object.
      capability: windows.auditeventpolicysubcategories
  variables:
    this-variable-represents-regular-expression-audit-success-success-failure-which-variable:
      title: This variable represents the regular expression 'AUDIT_(SUCCESS|SUCCESS_FAILURE)' which matches SUCCESS audit.
      kind: constant
      datatype: string
      expression:
        literal: AUDIT_(SUCCESS|SUCCESS_FAILURE)
  tests:
    test-audit-force-audit-policy-subcategory-settings-override-audit-policy-category:
      test_title: 'Audit: Force audit policy subcategory settings to override audit policy category settings must be set to
        Enabled'
      capability: windows.registry
      collection: secure-boot-state-setting-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: only one
        state_title: Value Equal To 1
        state_capability: windows.registry
        state:
          field: value
          value: '1'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-logon-logoff-group-membership-successes:
      test_title: Logon/Logoff - Group Membership successes.
      capability: windows.auditeventpolicysubcategories
      collection: retrieves-auditeventpolicysubcategories-object-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: group_membership subcategory must be Success.
        state_capability: windows.auditeventpolicysubcategories
        state:
          field: group_membership
          value:
            variable: this-variable-represents-regular-expression-audit-success-success-failure-which-variable
          operation: pattern match
          datatype: string
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-audit-force-audit-policy-subcategory-settings-override-audit-policy-category
    - test: test-logon-logoff-group-membership-successes
