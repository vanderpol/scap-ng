assessment:
  id: ng.shared.b7e0577bea993fea42cde5e4
  version: 1
  assessment_title: UBTU-20-010198 - The Ubuntu operating system must initiate session audits at system start-up.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /boot/grub/grub.cfg
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*linux\s+(.+)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-textfilecontent54-collection-2:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/default/grub
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: (?i)^\s*GRUB_CMDLINE_LINUX\w*\s*=\s*(.+)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-all-linux-lines-in-boot-grub-grub-cfg-contain-audit:
      test_title: All linux lines in /boot/grub/grub.cfg must contain 'audit=1'.
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: \baudit=1\b
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-all-linux-lines-in-etc-default-grub-contain-audit-1:
      test_title: All linux lines in /etc/default/grub contain 'audit=1'.
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection-2
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: \baudit=1\b
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-all-linux-lines-in-boot-grub-grub-cfg-contain-audit
    - test: test-all-linux-lines-in-etc-default-grub-contain-audit-1
