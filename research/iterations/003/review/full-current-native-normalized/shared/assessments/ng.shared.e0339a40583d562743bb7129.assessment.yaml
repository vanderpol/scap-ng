assessment:
  id: ng.shared.e0339a40583d562743bb7129
  version: 1
  assessment_title: The system must not boot into multiple operating systems (dual-boot).
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify the local system boots directly into Windows. Open Control Panel. Select "System". Select the "Advanced
    System Settings" link. Select the "Advanced" tab. Click the "Startup and Recovery" Settings button. If the drop-down list
    box "Default operating system:" shows any operating system other than Windows Server 2012, this is a finding.
  inputs: []
  evidence: []
