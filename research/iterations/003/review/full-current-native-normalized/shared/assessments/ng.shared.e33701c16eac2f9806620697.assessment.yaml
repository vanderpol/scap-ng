  version: 1
  assessment_title: The macOS system must disable Remote Management.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable Remote Management with the following command: /usr/libexec/mdmclient
    QuerySecurityInfo | /usr/bin/grep -c "RemoteDesktopEnabled = 0" If the result is not "1", this is a finding.'
  inputs: {}
  evidence: []
