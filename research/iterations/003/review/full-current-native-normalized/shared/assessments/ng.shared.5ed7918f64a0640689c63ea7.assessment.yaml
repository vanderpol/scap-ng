assessment:
  id: ng.shared.5ed7918f64a0640689c63ea7
  version: 1
  assessment_title: The Ubuntu operating system library files must be owned by root.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the systemwide shared library files contained in the directories "/lib", "/lib64", "/usr/lib", and "/usr/lib64"
    are owned by root with the following command: $ sudo find /lib /lib64 /usr/lib /usr/lib64 -type f -name ''*.so*'' ! -user
    root -exec stat -c "%n %U" {} + If any output is returned, this is a finding.'
  inputs: []
  evidence: []
