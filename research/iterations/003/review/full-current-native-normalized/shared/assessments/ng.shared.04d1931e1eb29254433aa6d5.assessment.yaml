assessment:
  id: ng.shared.04d1931e1eb29254433aa6d5
  version: 1
  assessment_title: The Oracle Linux operating system must prevent the installation of software, patches, service packs, device
    drivers, or operating system components of local packages without verification they have been digitally signed using a
    certificate that is issued by a Certificate Authority (CA) that is recognized and approved by the organization.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system prevents the installation of patches, service packs, device drivers, or operating
    system components of local packages without verification that they have been digitally signed using a certificate that
    is recognized and approved by the organization. Check that yum verifies the signature of local packages prior to install
    with the following command: # grep localpkg_gpgcheck /etc/yum.conf localpkg_gpgcheck=1 If "localpkg_gpgcheck" is not set
    to "1", or if options are missing or commented out, ask the System Administrator how the signatures of local packages
    and other operating system components are verified. If there is no process to validate the signatures of local packages
    that is approved by the organization, this is a finding.'
  inputs: []
  evidence: []
