assessment:
  id: ng.shared.f4fc8ecbff2e7c02996c8732
  version: 1
  assessment_title: Windows Server 2016 minimum password length must be configured to 14 characters.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy
    >> Computer Configuration >> Windows Settings >> Security Settings >> Account Policies >> Password Policy. If the value
    for the "Minimum password length," is less than "14" characters, this is a finding. For server core installations, run
    the following command: Secedit /Export /Areas SecurityPolicy /CFG C:\Path\FileName.Txt If "MinimumPasswordLength" is less
    than "14" in the file, this is a finding.'
  inputs: {}
  evidence: []
