assessment:
  id: ng.shared.eb401e2082434cc33cda0df9
  version: 1
  assessment_title: A host-based firewall must be installed and enabled on the system.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    gather-firewallproduct-from-securitycenter2-object:
      capability: windows.cmdlet
      select:
        module_name:
          operation: equals
          datatype: string
          value: CimCmdlets
        module_id:
          operation: equals
          datatype: string
          nil: true
          value: ''
        module_version:
          operation: equals
          datatype: version
          nil: true
          value: ''
        verb:
          operation: equals
          datatype: string
          value: Get
        noun:
          operation: equals
          datatype: string
          value: CimInstance
        parameters:
          operation: equals
          datatype: record
          value:
            record:
            - name: classname
              value: firewallproduct
              operation: equals
              datatype: string
              entity_check: all
            - name: namespace
              value: root\securitycenter2
              operation: equals
              datatype: string
              entity_check: all
        select:
          operation: equals
          datatype: record
          value:
            record:
            - name: property
              value: displayname,productstate
              operation: equals
              datatype: string
              entity_check: all
      object_title: Gather FirewallProduct from SecurityCenter2
    gather-firewallproduct-from-netsecurity-object:
      capability: windows.cmdlet
      select:
        module_name:
          operation: equals
          datatype: string
          value: NetSecurity
        module_id:
          operation: equals
          datatype: string
          nil: true
          value: ''
        module_version:
          operation: equals
          datatype: version
          nil: true
          value: ''
        verb:
          operation: equals
          datatype: string
          value: Get
        noun:
          operation: equals
          datatype: string
          value: NetFirewallProfile
        parameters:
          operation: equals
          datatype: record
          value:
            record:
            - name: policystore
              value: ActiveStore
              operation: equals
              datatype: string
              entity_check: all
        select:
          operation: equals
          datatype: record
          value:
            record:
            - name: property
              value: name,enabled,defaultinboundaction,defaultoutboundaction,logfilename
              operation: equals
              datatype: string
              entity_check: all
      object_title: Gather FirewallProduct from NetSecurity
  states:
    state-product-state-must-be-397568-enabled:
      state_title: Product State must be 397568 (enabled)
      capability: windows.cmdlet
      state:
        field: value
        value:
          record:
          - name: productstate
            value: '266240'
            operation: equals
            datatype: string
            entity_check: all
        operation: equals
        datatype: record
        entity_check: all
        entity_existence: at_least_one_exists
    state-enabled-must-be-true:
      state_title: Enabled must be 'True')
      capability: windows.cmdlet
      state:
        field: value
        value:
          record:
          - name: enabled
            value: 'True'
            operation: equals
            datatype: string
            entity_check: all
        operation: equals
        datatype: record
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-verify-3rd-party-firewall-installed-enabled-via-security-center:
      test_title: Verify a 3rd party firewall is installed and enabled via Security Center.
      capability: windows.cmdlet
      object: gather-firewallproduct-from-securitycenter2-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-product-state-must-be-397568-enabled
    test-verify-windows-defender-firewall-enabled:
      test_title: Verify Windows defender firewall is enabled.
      capability: windows.cmdlet
      object: gather-firewallproduct-from-netsecurity-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-enabled-must-be-true
  evaluate:
    any:
    - test: test-verify-3rd-party-firewall-installed-enabled-via-security-center
    - test: test-verify-windows-defender-firewall-enabled
