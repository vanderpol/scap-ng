assessment:
  id: ng.shared.6905601b8157524781266b18
  version: 1
  assessment_title: The macOS system must remove password hints from user accounts.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to remove password hints from user accounts with the following command:
    HINT=$(/usr/bin/dscl . -list /Users hint | /usr/bin/awk ''{ print $2 }'') if [ -z "$HINT" ]; then echo "PASS" else echo
    "FAIL" fi If the result is not "PASS", this is a finding.'
  inputs: []
  evidence: []
