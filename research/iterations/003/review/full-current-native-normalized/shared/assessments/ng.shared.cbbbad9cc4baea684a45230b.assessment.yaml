assessment:
  id: ng.shared.cbbbad9cc4baea684a45230b
  version: 1
  assessment_title: OS Version is 8.1. or 8.2, only.
  mode: automated
  class: inventory
  purpose: applicability
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/os-release
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*VERSION_ID="([\d.]+)"
        instance:
          operation: equals
          datatype: int
          value: '1'
      object_title: null
  states:
    state-used-by-platform-spec-check-state-equals-version-8-01:
      state_title: Used by platform spec check. State equals version 8[01]
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^8\.[01]$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-platform-spec-check-correct-os-version:
      test_title: Platform Spec check for correct OS version.
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: only_one_exists
      check: all
      states:
      - state-used-by-platform-spec-check-state-equals-version-8-01
  evaluate:
    test: test-platform-spec-check-correct-os-version
