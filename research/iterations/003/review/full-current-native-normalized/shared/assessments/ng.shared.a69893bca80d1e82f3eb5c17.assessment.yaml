assessment:
  id: ng.shared.a69893bca80d1e82f3eb5c17
  version: 1
  assessment_title: Contained databases must use Windows principals.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    gather-list-contained-database-names-object:
      capability: independent.sqlext
      select:
        engine:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: microsoft-sql-server-dbms-variable
        version:
          operation: pattern match
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: microsoft-sql-server-version-2016-2022-variable
        instance:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        database:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
        sql:
          operation: equals
          datatype: string
          mask: false
          value: SELECT name FROM sys.databases WHERE containment = 1
      behaviors:
        context: instance
      object_title: Gather list of contained database names
    independent-sqlext-object:
      capability: independent.sqlext
      select:
        engine:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: microsoft-sql-server-dbms-variable
        version:
          operation: pattern match
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: microsoft-sql-server-version-2016-2022-variable
        instance:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        database:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: list-contained-databases-variable
        sql:
          operation: equals
          datatype: string
          mask: false
          value: 'select name, type, type_desc, authentication_type, authentication_type_desc

            from sys.database_principals

            where authentication_type =2'
      behaviors:
        context: instance
      object_title: null
  variables:
    microsoft-sql-server-dbms-variable:
      title: Microsoft SQL Server DBMS
      kind: constant
      datatype: string
      expression:
        literal: sqlserver
    microsoft-sql-server-version-2016-2022-variable:
      title: Microsoft SQL Server version 2016-2022
      kind: constant
      datatype: string
      expression:
        literal: 2016|2017|2019|2022
    list-contained-databases-variable:
      title: List of contained databases
      kind: local
      datatype: string
      expression:
        values:
          object: gather-list-contained-database-names-object
          field: result
          record_field: name
  states: {}
  tests:
    test-if-no-contained-databases-found-this-not-finding:
      test_title: If no contained databases are found, this is not a finding
      capability: independent.sqlext
      object: gather-list-contained-database-names-object
      check_existence: none_exist
      check: all
    test-ensure-contained-database-users-not-using-sql-authentication:
      test_title: Ensure contained database users are not using SQL Authentication.
      capability: independent.sqlext
      object: independent-sqlext-object
      check_existence: none_exist
      check: all
  evaluate:
    any:
    - test: test-if-no-contained-databases-found-this-not-finding
    - test: test-ensure-contained-database-users-not-using-sql-authentication
