assessment:
  id: ng.shared.51d93dca181201c188f3c969
  version: 1
  assessment_title: Screen Saver Grace Period
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Microsoft\Windows NT\CurrentVersion\Winlogon
        name:
          operation: equals
          datatype: string
          mask: false
          value: ScreenSaverGracePeriod
  variables:
    mss-screensavergraceperiod-time-in-seconds-before-screen-saver-grace-period-variable:
      title: 'MSS: (ScreenSaverGracePeriod) The time in seconds before the screen saver grace period expires (0 recommended)'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: screen_saver_grace_period_var
        validation:
          alternatives:
          - literal: '0'
            hint: zero_seconds
          - literal: '5'
            hint: 5_seconds
  tests:
    test-mss-screensavergraceperiod-time-in-seconds-before-screen-saver-grace-period:
      test_title: '''MSS: (ScreenSaverGracePeriod) The time in seconds before the screen saver grace period expires (0 recommended)''
        is set to 5 or less'
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Sz type and value is less than or equal to variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_sz
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: mss-screensavergraceperiod-time-in-seconds-before-screen-saver-grace-period-variable
            operation: less than or equal
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-mss-screensavergraceperiod-time-in-seconds-before-screen-saver-grace-period
