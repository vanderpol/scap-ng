assessment:
  id: ng.shared.47e691ef0d763019dcb22968
  version: 1
  assessment_title: Windows Server 2012/2012 R2 must be configured to audit System - Other System Events successes.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Security Option "Audit: Force audit policy subcategory settings (Windows Vista or later) to override audit policy
    category settings" must be set to "Enabled" (V-14230) for the detailed auditing subcategories to be effective. Use the
    AuditPol tool to review the current Audit Policy configuration: Open an elevated "Command Prompt" (run as administrator).
    Enter "AuditPol /get /category:*" Compare the AuditPol settings with the following. If the system does not audit the following,
    this is a finding. System >> Other System Events - Success'
  inputs: {}
  evidence: []
