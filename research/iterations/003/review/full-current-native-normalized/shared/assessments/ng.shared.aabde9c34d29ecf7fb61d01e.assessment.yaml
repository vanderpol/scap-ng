assessment:
  id: ng.shared.aabde9c34d29ecf7fb61d01e
  version: 1
  assessment_title: The system must prevent local applications from generating source-routed packets.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    pfctl-s-rules-grep-allow-opts-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: pfctl -s rules
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: grep allow-opts
      object_title: pfctl -s rules | grep allow-opts
  states:
    state-no-stdout-lines-should-exist:
      state_title: No stdout_lines should exist
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: ''
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: none_exist
  tests:
    test-system-prevent-local-applications-from-generating-source-routed-packets:
      test_title: The system must prevent local applications from generating source-routed packets.
      capability: independent.shellcommand
      object: pfctl-s-rules-grep-allow-opts-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-no-stdout-lines-should-exist
  evaluate:
    test: test-system-prevent-local-applications-from-generating-source-routed-packets
