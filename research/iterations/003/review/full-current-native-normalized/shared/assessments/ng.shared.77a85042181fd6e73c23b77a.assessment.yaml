  assessment_title: The operating system must conduct backups of user-level information contained in the operating system
    per organization-defined frequency to conduct backups consistent with recovery time and recovery point objectives.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: The operations staff shall ensure that proper backups are created, tested, and archived. Ask the operator for
    documentation on the backup procedures implemented. If the backup procedures are not documented then this is a finding.
