assessment:
  id: ng.shared.bf5b1c95deec0e1bbc3ddb74
  version: 1
  assessment_title: User passwords must be changed at least every 60 days.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The root role is required. Determine if user passwords are properly configured to be changed every 60 days.
    Determine the OS version to be secured. # uname -v For Solaris 11, 11.1, 11.2, and 11.3: # logins -ox |awk -F: ''( $1
    != "root" && $8 != "LK" && $8 != "NL" && ( $11 > “56" || $11 < “1" )) { print }'' If output is returned and the listed
    account is accessed via direct logon, this is a finding. Check that /etc/default/password is configured to enforce password
    expiration every eight weeks or less. # grep "^MAXWEEKS=" /etc/default/passwd If the command does not report MAXWEEKS=8
    or less, this is a finding. For Solaris 11.4 or newer: # logins -ox |awk -F: ''( $1 != "root" && $8 != "LK" && $8 != "NL"
    && ($11 > "60"|| $11 < "1")) { print }'' If output is returned and the listed account is accessed via direct logon, this
    is a finding. Check that /etc/default/password is configured to enforce password expiration every 60 days or less. Note:
    It is an error to set both the WEEKS and the DAYS variant for a given MIN/MAX/WARN variable. # grep "^MAXDAYS=" /etc/default/passwd
    If the command does not report MAXDAYS=60 or less, this is a finding. # grep "^MAXWEEKS=" /etc/default/passwd If output
    is returned, this is a finding.'
  inputs: {}
  evidence: []
