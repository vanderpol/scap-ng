assessment:
  id: ng.shared.99a9798924b235acda03ed73
  version: 1
  assessment_title: The operating system must prevent the execution of prohibited mobile code.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Determine if the Firefox package is installed: # pkg list web/browser/firefox If the package is not installed,
    this check does not apply. If installed, ensure that it is a supported version. # pkg info firefox | grep Version Version:
    52.5.2 If the version is not supported, this is a finding. Ensure that Java and JavaScript access by Firefox are disabled.
    Start Firefox. In the address bar type: about:config In search bar type: javascript.enabled If ''Value" is true, this
    is a finding In the address bar type: about:addons Click on "I accept the risk" button. Click on "Plugins". If Java is
    enabled, this is a finding.'
  inputs: {}
  evidence: []
