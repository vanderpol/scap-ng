assessment:
  id: ng.shared.541f1878cf22ffa20979dbf5
  version: 1
  assessment_title: WN10-CC-000325 - Automatically signing in the last interactive user after a system-initiated restart must
    be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        name:
          operation: equals
          datatype: string
          mask: false
          value: DisableAutomaticRestartSignOn
  tests:
    test-verifies-sign-in-last-interactive-user-automatically-after-system-initiated:
      test_title: Verifies 'Sign-in last interactive user automatically after a system-initiated restart' is set to 'Disabled'
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-verifies-sign-in-last-interactive-user-automatically-after-system-initiated
