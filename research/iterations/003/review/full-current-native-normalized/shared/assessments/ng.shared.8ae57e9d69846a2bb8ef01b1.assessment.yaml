assessment:
  id: ng.shared.8ae57e9d69846a2bb8ef01b1
  version: 1
  assessment_title: AZLX-23-002165 - Amazon Linux 2023 must generate audit records for all account creations, modifications,
    disabling, and termination events that affect /var/log/lastlog.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/audit.rules
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*-w\s+/var/log/lastlog(\s+-p\s*([rx]*w[rx]*a[rx]*|[rx]*a[rx]*w[rx]*))?(\s+(-k\s+|-F\s+key=)\w+)?\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: null
  states: {}
  tests:
    test-audit-modifications-var-log-lastlog:
      test_title: Audit modifications to /var/log/lastlog
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: all_exist
      check: all
  evaluate:
    test: test-audit-modifications-var-log-lastlog
