assessment:
  id: ng.shared.8d4f3988b855a21f9e4d503e
  version: 1
  assessment_title: Event Viewer Events.asp Links
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: Software\Policies\Microsoft\EventViewer
        name:
          operation: equals
          datatype: string
          value: MicrosoftEventVwrDisableLinks
      object_title: null
  states:
    state-reg-dword-type-and-value-equals-1:
      state_title: Reg_Dword type and value equals 1
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-turn-off-event-viewer-events-asp-set-enabled:
      test_title: '''Turn off Event Viewer “Events.asp'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-1
  evaluate:
    test: test-turn-off-event-viewer-events-asp-set-enabled
