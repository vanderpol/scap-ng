assessment:
  id: ng.shared.e4570e2292c613f2ccebae7b
  version: 1
  assessment_title: Ubuntu 22.04 LTS must have directories that contain system commands set to a mode of "755" or less permissive.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    all-system-command-directories-mode-755-gwrite-should-false-collection:
      collection_title: All system-command  directories mode 755 ( gwrite should be = false.)
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: only one
          value:
            variable: system-command-directories-variable
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
      filters:
      - action: exclude
        match:
          field: gwrite
          value: 'false'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: Mode 755 or less permissive (gwrite should be = false.)
        capability: unix.file
      - action: exclude
        match:
          field: type
          value: symbolic link
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: symbolic links
        capability: unix.file
      - action: exclude
        match:
          field: type
          value: file
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        capability: unix.file
      behaviors:
        recurse_direction: down
    all-system-command-directories-mode-755-owrite-should-false-collection:
      collection_title: All system-command  directories mode 755 (owrite should be = false.)
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: only one
          value:
            variable: system-command-directories-variable
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
      filters:
      - action: exclude
        match:
          field: owrite
          value: 'false'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: Mode 755 or less permissive (owrite should be = false.)
        capability: unix.file
      - action: exclude
        match:
          field: type
          value: symbolic link
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: symbolic links
        capability: unix.file
      - action: exclude
        match:
          field: type
          value: file
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        capability: unix.file
      behaviors:
        recurse_direction: down
  variables:
    system-command-directories-variable:
      title: system command directories
      kind: constant
      datatype: string
      expression:
        literal:
        - /bin
        - /sbin
        - /usr/bin
        - /usr/sbin
        - /usr/local/bin
        - /usr/local/sbin
  tests:
    test-system-command-directories-have-mode-755-or-less-permissive-gwrite:
      test_title: System command directories have mode 755 or less permissive. (gwrite should be = false)
      capability: unix.file
      collection: all-system-command-directories-mode-755-gwrite-should-false-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
    test-system-command-directories-have-mode-755-or-less-permissive-owrite:
      test_title: System command directories have mode 755 or less permissive.(owrite should be = false.)
      capability: unix.file
      collection: all-system-command-directories-mode-755-owrite-should-false-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
  evaluate:
    all:
    - test: test-system-command-directories-have-mode-755-or-less-permissive-gwrite
    - test: test-system-command-directories-have-mode-755-or-less-permissive-owrite
