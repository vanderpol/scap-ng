assessment:
  id: ng.shared.4d109f7bc71083f5d7aa90a6
  version: 1
  assessment_title: WN10-AU-000080 - The system must be configured to audit Logon/Logoff - Special Logon successes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-audit-special-logon-success-only:
      state_title: Audit - Special Logon - Success only
      capability: windows.auditeventpolicysubcategories
      state:
        field: special_logon
        value: AUDIT_SUCCESS
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-audit-special-logon-success-and-failure:
      state_title: Audit - Special Logon - Success and Failure
      capability: windows.auditeventpolicysubcategories
      state:
        field: special_logon
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-special-logon-success-only:
      test_title: Audit - Special Logon - Success only
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-audit-special-logon-success-only
    test-audit-special-logon-success-failure:
      test_title: Audit - Special Logon - Success and Failure
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-audit-special-logon-success-and-failure
  evaluate:
    any:
    - test: test-audit-special-logon-success-only
    - test: test-audit-special-logon-success-failure
