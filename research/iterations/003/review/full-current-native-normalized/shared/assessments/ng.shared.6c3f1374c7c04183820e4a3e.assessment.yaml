assessment:
  id: ng.shared.6c3f1374c7c04183820e4a3e
  version: 1
  assessment_title: The macOS system must configure audit log folders group to wheel.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured with audit log folders group-owned by wheel with the following command:
    /bin/ls -dn $(/usr/bin/grep ''^dir'' /etc/security/audit_control | /usr/bin/awk -F: ''{print $2}'') | /usr/bin/awk ''{print
    $4}'' If the result is not "0", this is a finding.'
  inputs: {}
  evidence: []
