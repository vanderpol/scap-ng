assessment:
  id: ng.shared.2ad5d46c1b57d475cc4209de
  version: 1
  assessment_title: WN19-DC-000230 - Windows Server 2019 must be configured to audit Account Management - Computer Account
    Management successes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-computer-account-management-is-set-to-success:
      state_title: '''Computer Account Management'' is set to ''Success'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: computer_account_management
        value: AUDIT_SUCCESS
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-computer-account-management-is-set-to-success-and-failur:
      state_title: '''Computer Account Management'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: computer_account_management
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-computer-account-management-set-success-or-success-failure:
      test_title: '''Computer Account Management'' is set to ''Success'' or ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-computer-account-management-is-set-to-success
      - state-computer-account-management-is-set-to-success-and-failur
  evaluate:
    test: test-computer-account-management-set-success-or-success-failure
