assessment:
  id: ng.shared.51616765c6e35d68b4fceaaa
  version: 1
  assessment_title: Standard user accounts must only have Read permissions to the Winlogon registry key.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Run "Regedit". Navigate to the following registry key: HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\
    Right-click on "WinLogon" and select "Permissions…". Select "Advanced". If the permissions are not as restrictive as the
    defaults listed below, this is a finding. The following are the same for each permission listed: Type - Allow Inherited
    from - MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion Applies to - This key and subkeys Columns: Principal - Access
    TrustedInstaller - Full Control SYSTEM - Full Control Administrators - Full Control Users - Read ALL APPLICATION PACKAGES
    - Read'
  inputs: {}
  evidence: []
