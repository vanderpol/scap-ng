assessment:
  id: ng.shared.a3aeb7db80303d8b3642b292
  version: 1
  assessment_title: The macOS system must be configured to disable Internet Sharing.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    system-settings-internet-sharing-disable-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.MCX'')\

            .objectForKey(''forceInternetSharingOff'').js

            EOS'
      object_title: system_settings_internet_sharing_disable_recommended_object
  states:
    state-system-settings-internet-sharing-disable-recommended-sta:
      state_title: system_settings_internet_sharing_disable_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: 'true'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-settings-internet-sharing-disable-recommended-test:
      test_title: system_settings_internet_sharing_disable_recommended_test
      capability: independent.shellcommand
      object: system-settings-internet-sharing-disable-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-system-settings-internet-sharing-disable-recommended-sta
  evaluate:
    test: test-system-settings-internet-sharing-disable-recommended-test
