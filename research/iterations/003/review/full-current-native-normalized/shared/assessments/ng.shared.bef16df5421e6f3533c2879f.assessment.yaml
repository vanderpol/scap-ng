assessment:
  id: ng.shared.bef16df5421e6f3533c2879f
  version: 1
  assessment_title: The SQL Server Browser service must be disabled unless specifically required and approved.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    sql-server-browser-service-object:
      capability: windows.service
      select:
        service_name:
          operation: equals
          datatype: string
          mask: false
          value: SQLBrowser
      object_title: SQL Server Browser Service
  states:
    state-sql-query-result-field-name-external-scripts-enabled-and:
      state_title: SQL query result field 'name' = 'external scripts enabled' and config_value = 0
      capability: windows.service
      state:
        all:
        - field: start_type
          value: SERVICE_DISABLED
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: current_state
          value: SERVICE_STOPPED
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-sql-server-browser-service-should-disabled-if-found:
      test_title: SQL Server Browser service should be Disabled if found
      capability: windows.service
      object: sql-server-browser-service-object
      check_existence: any_exist
      check: all
      states:
      - state-sql-query-result-field-name-external-scripts-enabled-and
  evaluate:
    test: test-sql-server-browser-service-should-disabled-if-found
