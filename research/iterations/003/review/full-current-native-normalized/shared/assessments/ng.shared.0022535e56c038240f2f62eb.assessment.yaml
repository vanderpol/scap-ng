assessment:
  id: ng.shared.0022535e56c038240f2f62eb
  version: 1
  assessment_title: OL09-00-002385 - OL 9 must be configured so that the kdump service is disabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-systemdunitproperty-object:
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          value: kdump.service
        property:
          operation: equals
          datatype: string
          value: LoadState
      object_title: null
    linux-systemdunitproperty-object-2:
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          value: kdump.service
        property:
          operation: equals
          datatype: string
          value: UnitFileState
      object_title: null
    linux-systemdunitproperty-object-3:
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          value: kdump.service
        property:
          operation: equals
          datatype: string
          value: ActiveState
      object_title: null
  states:
    state-linux-systemdunitproperty:
      state_title: null
      capability: linux.systemdunitproperty
      state:
        field: value
        value: masked
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-linux-systemdunitproperty-2:
      state_title: null
      capability: linux.systemdunitproperty
      state:
        field: value
        value: inactive
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-kdump-service-loadstate-masked-if-it-exists:
      test_title: kdump.service LoadState is masked if it exists.
      capability: linux.systemdunitproperty
      object: linux-systemdunitproperty-object
      check_existence: any_exist
      check: all
      states:
      - state-linux-systemdunitproperty
    test-kdump-service-unitfilestate-masked-if-it-exists:
      test_title: kdump.service UnitFileState is masked if it exists.
      capability: linux.systemdunitproperty
      object: linux-systemdunitproperty-object-2
      check_existence: any_exist
      check: all
      states:
      - state-linux-systemdunitproperty
    test-kdump-service-activestate-inactive-if-it-exists:
      test_title: kdump.service ActiveState is inactive if it exists.
      capability: linux.systemdunitproperty
      object: linux-systemdunitproperty-object-3
      check_existence: any_exist
      check: all
      states:
      - state-linux-systemdunitproperty-2
  evaluate:
    all:
    - test: test-kdump-service-loadstate-masked-if-it-exists
    - test: test-kdump-service-unitfilestate-masked-if-it-exists
    - test: test-kdump-service-activestate-inactive-if-it-exists
