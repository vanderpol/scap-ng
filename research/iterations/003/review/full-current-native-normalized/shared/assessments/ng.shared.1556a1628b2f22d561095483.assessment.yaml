  assessment_title: The system must be configured to ensure smart card devices can be redirected to the Remote Desktop session.
    (Remote Desktop Services Role).
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding: Registry
