assessment:
  id: ng.shared.10a873986b092da1ff299337
  version: 1
  assessment_title: Ubuntu 24.04 LTS must prevent a user from overriding the disabling of the graphical user interface autorun
    function.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    retrieve-gsettings-writable-org-gnome-desktop-media-handling-autorun-never-collection:
      collection_title: Retrieve gsettings writable org.gnome.desktop.media-handling autorun-never
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: gsettings writable org.gnome.desktop.media-handling autorun-never
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: .+
  tests:
    test-verify-gsettings-writable-org-gnome-desktop-media-handling-autorun-never:
      test_title: Verify gsettings writable org.gnome.desktop.media-handling autorun-never returns false
      capability: independent.shellcommand
      collection: retrieve-gsettings-writable-org-gnome-desktop-media-handling-autorun-never-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Verify command returns false
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: 'false'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-verify-gsettings-writable-org-gnome-desktop-media-handling-autorun-never
