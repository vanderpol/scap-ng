assessment:
  id: ng.shared.380885c9e673cbbd8aebd04f
  version: 1
  assessment_title: AZLX-23-002060 - Amazon Linux 2023 must be configured to off-load audit records onto a different system
    from the system being audited via syslog.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/plugins.d/syslog.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*active\s*=\s*(\w+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-etc-audit-plugins-d-syslog-conf-active-yes:
      test_title: '/etc/audit/plugins.d/syslog.conf: active = yes'
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: 'yes'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-etc-audit-plugins-d-syslog-conf-active-yes
