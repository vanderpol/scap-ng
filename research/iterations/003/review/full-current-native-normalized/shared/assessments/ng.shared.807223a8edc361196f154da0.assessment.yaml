assessment:
  id: ng.shared.807223a8edc361196f154da0
  version: 1
  assessment_title: Audit Backup and Restore Privileges
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\Currentcontrolset\Control\Lsa
        name:
          operation: equals
          datatype: string
          mask: false
          value: FullPrivilegeAuditing
  variables:
    audit-audit-use-backup-restore-privilege-variable:
      title: 'Audit: Audit the use of Backup and Restore privilege'
      kind: external
      datatype: binary
      input:
        required: true
        cardinality: one_or_more
        parameter: audit_use_backup_restore_privilege_var
        validation:
          alternatives:
          - literal: '00'
            hint: disabled
          - literal: '01'
            hint: enabled
  tests:
    test-audit-audit-use-backup-restore-privilege-set-disabled:
      test_title: '''Audit: Audit the use of Backup and Restore privilege'' is set to ''Disabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Binary type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_binary
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: audit-audit-use-backup-restore-privilege-variable
            operation: equals
            datatype: binary
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-audit-audit-use-backup-restore-privilege-set-disabled
