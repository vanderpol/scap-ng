assessment:
  id: ng.shared.52885c89311df345f5990977
  version: 1
  assessment_title: The .Xauthority files must not have extended ACLs.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If X Display Manager (XDM) is not used on the system, this is not applicable. Determine if XDM is running. Procedure:
    # ps -ef | grep xdm Check the file permissions for the .Xauthority files. # ls -lL .Xauthority If the permissions include
    a "+", the file has an extended ACL and this is a finding.'
  inputs: []
  evidence: []
