assessment:
  id: ng.shared.8a67f462ea3f94e911a6a2bd
  version: 1
  assessment_title: The Ubuntu operating system must disable all wireless network adapters.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    ubuntu-disable-all-wireless-network-adapters-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: grep -v -e 'Inter-|.*' -e ' face |' /proc/net/wireless
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .+
      object_title: Ubuntu must disable all wireless network adapters.
  states:
    state-ubuntu-must-disable-all-wireless-network-adapters:
      state_title: Ubuntu must disable all wireless network adapters.
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: .+
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-ubuntu-disable-all-wireless-network-adapters:
      test_title: Ubuntu must disable all wireless network adapters.
      capability: independent.shellcommand
      object: ubuntu-disable-all-wireless-network-adapters-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-ubuntu-must-disable-all-wireless-network-adapters
  evaluate:
    not:
      test: test-ubuntu-disable-all-wireless-network-adapters
