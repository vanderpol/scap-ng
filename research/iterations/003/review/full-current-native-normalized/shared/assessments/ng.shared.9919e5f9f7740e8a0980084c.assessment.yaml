assessment:
  id: ng.shared.9919e5f9f7740e8a0980084c
  version: 1
  assessment_title: The "Enable computer and user accounts to be trusted for delegation" user right must not be assigned to
    any groups or accounts on member servers.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This applies to member servers and standalone or nondomain-joined systems. A separate version applies to domain
    controllers. Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy
    >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment. If any
    accounts or groups are granted the "Enable computer and user accounts to be trusted for delegation" user right, this is
    a finding. For server core installations, run the following command: Secedit /Export /Areas User_Rights /cfg c:\path\filename.txt
    Review the text file. If any SIDs are granted the "SeEnableDelegationPrivilege" user right, this is a finding.'
  inputs: []
  evidence: []
