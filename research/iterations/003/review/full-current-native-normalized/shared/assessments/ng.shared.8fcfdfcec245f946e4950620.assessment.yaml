assessment:
  id: ng.shared.8fcfdfcec245f946e4950620
  version: 1
  assessment_title: OL 8 must prevent files with the setuid and setgid bit set from being executed on the /boot/efi directory.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: For systems that use BIOS, this is not applicable. Verify the /boot/efi directory is mounted with the
    "nosuid" option with the following command: $ sudo mount | grep ''\s/boot/efi\s'' /dev/sda1 on /boot/efi type vfat (rw,nosuid,relatime,fmask=0077,dmask=0077,codepage=437,iocharset=ascii,shortname=winnt,errors=remount-ro)
    If the /boot/efi file system does not have the "nosuid" option set, this is a finding.'
  inputs: []
  evidence: []
