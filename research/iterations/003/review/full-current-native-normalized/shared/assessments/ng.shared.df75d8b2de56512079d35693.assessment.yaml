assessment:
  id: ng.shared.df75d8b2de56512079d35693
  version: 1
  assessment_title: OL09-00-002541 - OL 9 /etc/gshadow- file must be owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-file-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          value: /etc
        filename:
          operation: equals
          datatype: string
          value: gshadow-
      object_title: null
  states:
    state-owned-by-root:
      state_title: owned by root
      capability: unix.file
      state:
        field: user_id
        value: '0'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-etc-gshadow-file-owned-by-root:
      test_title: /etc/gshadow- file is owned by root
      capability: unix.file
      object: unix-file-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-owned-by-root
  evaluate:
    test: test-etc-gshadow-file-owned-by-root
