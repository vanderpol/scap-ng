assessment:
  id: ng.shared.7dcc2b8323b093cc7e67a69a
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that the SSH daemon does not permit Kerberos authentication
    unless needed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the SSH daemon does not permit Kerberos to authenticate passwords unless approved. Check that the SSH
    daemon does not permit Kerberos to authenticate passwords with the following command: # grep -i kerberosauth /etc/ssh/sshd_config
    KerberosAuthentication no If the "KerberosAuthentication" keyword is missing, or is set to "yes" and is not documented
    with the Information System Security Officer (ISSO), or the returned line is commented out, this is a finding.'
  inputs: []
  evidence: []
