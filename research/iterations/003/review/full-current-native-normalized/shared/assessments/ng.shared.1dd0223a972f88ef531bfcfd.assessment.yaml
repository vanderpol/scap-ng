assessment:
  id: ng.shared.1dd0223a972f88ef531bfcfd
  version: 1
  assessment_title: WN10-CC-000300 - Basic authentication for RSS feeds over HTTP must not be used.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: Software\Policies\Microsoft\Internet Explorer\Feeds
        name:
          operation: equals
          datatype: string
          value: AllowBasicAuthInClear
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-turn-on-basic-feed-authentication-over-http-set-not-configured:
      test_title: '''Turn on Basic feed authentication over HTTP'' is set to ''Not Configured'' or ''Disabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: any_exist
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-turn-on-basic-feed-authentication-over-http-set-not-configured
