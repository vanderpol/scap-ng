assessment:
  id: ng.shared.df9bfcef69fe5e12e240eafc
  version: 1
  assessment_title: AZLX-23-002255 - Amazon Linux 2023 must generate audit records for all account creations, modifications,
    disabling, and termination events that affect /etc/shadow.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/audit.rules
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*-w\s+/etc/shadow(\s+-p\s*([rx]*w[rx]*a[rx]*|[rx]*a[rx]*w[rx]*))?(\s+(-k\s+|-F\s+key=)\w+)?\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-events-resulting-in-modifications-etc-shadow-audited:
      test_title: Events resulting in modifications to /etc/shadow are audited
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state: null
  evaluate:
    test: test-events-resulting-in-modifications-etc-shadow-audited
