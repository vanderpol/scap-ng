assessment:
  id: ng.shared.5a443b3fcf22fd10997e9f5a
  version: 1
  assessment_title: Name-Release Attacks
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Services\Netbt\Parameters
        name:
          operation: equals
          datatype: string
          mask: false
          value: NoNameReleaseOnDemand
  variables:
    mss-nonamereleaseondemand-allow-computer-ignore-netbios-name-release-requests-except-variable:
      title: 'MSS: (NoNameReleaseOnDemand) Allow computer to ignore NetBIOS name release requests except from WINS servers'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: no_name_release_on_demand_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-mss-nonamereleaseondemand-allow-computer-ignore-netbios-name-release-requests-except:
      test_title: '''MSS: (NoNameReleaseOnDemand) Allow computer to ignore NetBIOS name release requests except from WINS
        servers'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: mss-nonamereleaseondemand-allow-computer-ignore-netbios-name-release-requests-except-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-mss-nonamereleaseondemand-allow-computer-ignore-netbios-name-release-requests-except
