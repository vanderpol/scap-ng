assessment:
  id: ng.shared.225934ac72f17211a12fa2a5
  version: 1
  assessment_title: OL 8 file systems must not execute binary files that are imported via Network File System (NFS).
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: If no NFS mounts are configured, this requirement is Not Applicable. Verify file systems being imported
    via NFS are mounted with the "noexec" option with the following command: $ sudo grep nfs /etc/fstab | grep noexec UUID=e06097bb-cfcd-437b-9e4d-a691f5662a7d
    /store nfs rw,nosuid,nodev,noexec 0 0 If a file system found in "/etc/fstab" refers to NFS and it does not have the "noexec"
    option set, this is a finding.'
  inputs: {}
  evidence: []
