assessment:
  id: ng.shared.bbf525b4397e1c86af25047a
  version: 1
  assessment_title: Audit Access of Global System Objects
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\Currentcontrolset\Control\Lsa
        name:
          operation: equals
          datatype: string
          mask: false
          value: AuditBaseObjects
  variables:
    audit-audit-access-global-system-objects-variable:
      title: 'Audit: Audit the access of global system objects'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: audit_access_global_system_objects_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-audit-audit-access-global-system-objects-set-disabled:
      test_title: '''Audit: Audit the access of global system objects'' is set to ''Disabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: audit-audit-access-global-system-objects-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-audit-audit-access-global-system-objects-set-disabled
