assessment:
  id: ng.shared.78744bcefa0886b3f2ce1055
  version: 1
  assessment_title: The macOS system must restrict maximum password lifetime to 60 days.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    pwpolicy-max-lifetime-enforce-stig-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: zsh
        command:
          operation: equals
          datatype: string
          value: /usr/bin/pwpolicy -getaccountpolicies | /usr/bin/tail +2 | /usr/bin/xmllint --xpath '//dict/key[text()="policyAttributeExpiresEveryNDays"]/following-sibling::*[1]/text()'
            -
      object_title: pwpolicy_max_lifetime_enforce_stig_object
  states:
    state-pwpolicy-max-lifetime-enforce-stig-state:
      state_title: pwpolicy_max_lifetime_enforce_stig_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: '60'
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-pwpolicy-max-lifetime-enforce-stig-test:
      test_title: pwpolicy_max_lifetime_enforce_stig_test
      capability: independent.shellcommand
      object: pwpolicy-max-lifetime-enforce-stig-object-object
      check_existence: all_exist
      check: all
      states:
      - state-pwpolicy-max-lifetime-enforce-stig-state
  evaluate:
    test: test-pwpolicy-max-lifetime-enforce-stig-test
