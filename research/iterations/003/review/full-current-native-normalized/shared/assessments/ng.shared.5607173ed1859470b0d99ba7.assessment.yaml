assessment:
  id: ng.shared.5607173ed1859470b0d99ba7
  version: 1
  assessment_title: The Oracle Linux operating system must initiate a screensaver after a 15-minute period of inactivity for
    graphical user interfaces.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system initiates a screensaver after a 15-minute period of inactivity for graphical user
    interfaces. Note: If the system does not have GNOME installed, this requirement is Not Applicable. Check to see if GNOME
    is configured to display a screensaver after a 15 minute delay with the following command: # grep -i idle-delay /etc/dconf/db/local.d/*
    idle-delay=uint32 900 If the "idle-delay" setting is missing or is not set to "900" or less, this is a finding.'
  inputs: {}
  evidence: []
