assessment:
  id: ng.shared.2b7f76309c482598ef11843e
  version: 1
  assessment_title: AZLX-23-002350 - Amazon Linux 2023 system commands must be group-owned by root or a system account.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    all-files-in-system-command-directories-less-files-group-owned-collection:
      collection_title: All files in system command directories, less files group-owned by root or a system account
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: system-command-directories-including-usr-libexec-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
      filters:
      - action: exclude
        match:
          field: group_id
          value: '1000'
          operation: less than
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        capability: unix.file
      behaviors:
        recurse_direction: down
  variables:
    system-command-directories-including-usr-libexec-variable:
      title: system command directories (including /usr/libexec)
      kind: constant
      datatype: string
      expression:
        literal:
        - /bin
        - /sbin
        - /usr/bin
        - /usr/sbin
        - /usr/libexec
        - /usr/local/bin
        - /usr/local/sbin
  tests:
    test-no-system-commands-exist-except-those-group-owned-by-root:
      test_title: No system commands exist, except for those group-owned by root or a system account.
      capability: unix.file
      collection: all-files-in-system-command-directories-less-files-group-owned-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
  evaluate:
    test: test-no-system-commands-exist-except-those-group-owned-by-root
