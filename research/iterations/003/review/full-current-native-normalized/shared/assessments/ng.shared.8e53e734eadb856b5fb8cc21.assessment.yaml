assessment:
  id: ng.shared.8e53e734eadb856b5fb8cc21
  version: 1
  assessment_title: Servers must have a host-based Intrusion Detection System.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Determine whether there is a host-based Intrusion Detection System on each server. If the HIPS component of ESS
    is installed and active on the host and the Alerts of blocked activity are being logged and monitored, this will meet
    the requirement of this finding. A HID device is not required on a system that has the role as the Network Intrusion Device
    (NID). However, this exception needs to be documented with the site ISSO. If a host-based Intrusion Detection System is
    not installed on the system, this is a finding.
  inputs: []
  evidence: []
