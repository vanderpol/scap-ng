assessment:
  id: ng.shared.d26915749bf19497cd55c882
  version: 1
  assessment_title: AZLX-23-002005 - Amazon Linux 2023 must display the Standard Mandatory DOD Notice and Consent Banner before
    granting local or remote access to the system via a SSH logon.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    pull-value-etc-ssh-sshd-config-banner-collection:
      collection_title: Pull value of /etc/ssh/sshd_config:banner
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*(?i)banner(?-i)[ \t\"]+([\w\/]+)[\"\s]*(?:|(?:#.*))?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    pull-value-etc-ssh-sshd-config-d-banner-collection:
      collection_title: Pull value of /etc/ssh/sshd_config.d:banner
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .+
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*(?i)banner(?-i)[ \t\"]+([\w\/]+)[\"\s]*(?:|(?:#.*))?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    all-sshd-config-sshd-config-d-files-collection:
      collection_title: all sshd_config and sshd_config.d/* files
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - collection: pull-value-etc-ssh-sshd-config-banner-collection
        - collection: pull-value-etc-ssh-sshd-config-d-banner-collection
    pull-value-etc-ssh-sshd-config-banner-collection-2:
      collection_title: Pull value of /etc/ssh/sshd_config:banner
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*(?i)banner(?-i)[ \t]*(?:none[\s]*|(?:#.*))?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    pull-value-etc-ssh-sshd-config-d-banner-collection-2:
      collection_title: Pull value of /etc/ssh/sshd_config.d:banner
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .+
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*(?i)banner(?-i)[ \t]*(?:none[\s]*|(?:#.*))?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    all-sshd-config-sshd-config-d-files-collection-2:
      collection_title: all sshd_config and sshd_config.d/* files
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - collection: pull-value-etc-ssh-sshd-config-banner-collection-2
        - collection: pull-value-etc-ssh-sshd-config-d-banner-collection-2
  tests:
    test-etc-ssh-sshd-config-banner-etc-issue:
      test_title: /etc/ssh/sshd_config:banner == /etc/issue
      capability: independent.textfilecontent54
      collection: all-sshd-config-sshd-config-d-files-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: banner value is set to /etc/issue
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^\/.+$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-etc-ssh-sshd-config-banner-none:
      test_title: /etc/ssh/sshd_config:banner == none
      capability: independent.textfilecontent54
      collection: all-sshd-config-sshd-config-d-files-collection-2
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
  evaluate:
    all:
    - test: test-etc-ssh-sshd-config-banner-etc-issue
    - test: test-etc-ssh-sshd-config-banner-none
