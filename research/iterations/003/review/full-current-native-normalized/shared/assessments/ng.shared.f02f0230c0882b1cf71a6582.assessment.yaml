assessment:
  id: ng.shared.f02f0230c0882b1cf71a6582
  version: 1
  assessment_title: WN10-AU-000587 - Windows 10 must be configured to audit sensitive privileged use successes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-sensitive-privilege-use-is-set-to-success:
      state_title: '''Sensitive Privilege Use'' is set to ''Success'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: sensitive_privilege_use
        value: AUDIT_SUCCESS
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-sensitive-privilege-use-is-set-to-success-and-failure:
      state_title: '''Sensitive Privilege Use'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: sensitive_privilege_use
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-sensitive-privilege-use-set-success:
      test_title: '''Audit Sensitive Privilege Use'' is set to ''Success'''
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-sensitive-privilege-use-is-set-to-success
    test-audit-sensitive-privilege-use-set-success-failure:
      test_title: '''Audit Sensitive Privilege Use'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-sensitive-privilege-use-is-set-to-success-and-failure
  evaluate:
    any:
    - test: test-audit-sensitive-privilege-use-set-success
    - test: test-audit-sensitive-privilege-use-set-success-failure
