assessment:
  id: ng.shared.2db9adafbfaa3e628e68518d
  version: 1
  assessment_title: The macOS system must configure SSH ServerAliveInterval option set to 900.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    os-ssh-server-alive-interval-configure-stig-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: zsh
        command:
          operation: equals
          datatype: string
          value: "ret=\"pass\"\nfor u in $(/usr/bin/dscl . -list /Users UniqueID | /usr/bin/awk '$2 > 500 {print $1}'); do\n\
            \  sshCheck=$(/usr/bin/sudo -u $u /usr/bin/ssh -G . | /usr/bin/grep -c \"^serveraliveinterval 900\")\n  if [[\
            \ \"$sshCheck\" == \"0\" ]]; then\n    ret=\"fail\"\n    break\n  fi\ndone\n/bin/echo $ret"
      object_title: os_ssh_server_alive_interval_configure_stig_object
  states:
    state-os-ssh-server-alive-interval-configure-stig-state:
      state_title: os_ssh_server_alive_interval_configure_stig_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: pass
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-os-ssh-server-alive-interval-configure-stig-test:
      test_title: os_ssh_server_alive_interval_configure_stig_test
      capability: independent.shellcommand
      object: os-ssh-server-alive-interval-configure-stig-object-object
      check_existence: all_exist
      check: all
      states:
      - state-os-ssh-server-alive-interval-configure-stig-state
  evaluate:
    test: test-os-ssh-server-alive-interval-configure-stig-test
