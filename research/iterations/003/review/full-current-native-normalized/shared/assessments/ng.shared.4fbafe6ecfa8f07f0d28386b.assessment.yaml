assessment:
  id: ng.shared.4fbafe6ecfa8f07f0d28386b
  version: 1
  assessment_title: The macOS system must enable System Integrity Protection.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    os-sip-enable-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/csrutil status | /usr/bin/grep ''System Integrity Protection status: enabled.'''
      object_title: os_sip_enable_recommended_object
  states:
    state-os-sip-enable-recommended-state:
      state_title: os_sip_enable_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: .*
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-os-sip-enable-recommended-test:
      test_title: os_sip_enable_recommended_test
      capability: independent.shellcommand
      object: os-sip-enable-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-os-sip-enable-recommended-state
  evaluate:
    test: test-os-sip-enable-recommended-test
