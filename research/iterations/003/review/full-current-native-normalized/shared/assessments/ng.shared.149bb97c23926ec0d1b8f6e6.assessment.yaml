assessment:
  id: ng.shared.149bb97c23926ec0d1b8f6e6
  version: 1
  assessment_title: The Oracle Linux operating system must set the umask value to 077 for all local interactive user accounts.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that the default umask for all local interactive users is "077". Identify the locations of all local
    interactive user home directories by looking at the "/etc/passwd" file. Check all local interactive user initialization
    files for interactive users with the following command: Note: The example is for a system that is configured to create
    users home directories in the "/home" directory. $ sudo grep -ir ^umask /home | grep -v ''.bash_history'' If any local
    interactive user initialization files are found to have a umask statement that has a value less restrictive than "077",
    this is a finding.'
  inputs: {}
  evidence: []
