assessment:
  id: ng.shared.ee610cefb72bdee08a761329
  version: 1
  assessment_title: OL 8 system commands must be owned by root.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the system commands contained in the following directories are owned by "root" with the following command:
    $ sudo find -L /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin ! -user root -exec ls -l {} \; If any system
    commands are returned, this is a finding.'
  inputs: []
  evidence: []
