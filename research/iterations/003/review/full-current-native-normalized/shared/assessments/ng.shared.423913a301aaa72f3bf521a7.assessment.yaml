assessment:
  id: ng.shared.423913a301aaa72f3bf521a7
  version: 1
  assessment_title: Domain controllers must have a PKI server certificate.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: This applies to domain controllers. It is NA for other systems. Run "MMC". Select "Add/Remove Snap-in" from the
    "File" menu. Select "Certificates" in the left pane and click the "Add >" button. Select "Computer Account" and click
    "Next". Select the appropriate option for "Select the computer you want this snap-in to manage" and click "Finish". Click
    "OK". Select and expand the Certificates (Local Computer) entry in the left pane. Select and expand the Personal entry
    in the left pane. Select the Certificates entry in the left pane. If no certificate for the domain controller exists in
    the right pane, this is a finding.
  inputs: []
  evidence: []
