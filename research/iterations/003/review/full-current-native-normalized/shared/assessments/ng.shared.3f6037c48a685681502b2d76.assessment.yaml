assessment:
  id: ng.shared.3f6037c48a685681502b2d76
  version: 1
  assessment_title: Network interfaces configured on The Oracle Linux operating system must not be in promiscuous mode.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    all-interfaces-object:
      capability: unix.interface
      select:
        name:
          operation: pattern match
          datatype: string
          value: .*
      object_title: All Interfaces
  states:
    state-interface-is-not-in-promisc-mode:
      state_title: Interface is not in PROMISC mode
      capability: unix.interface
      state:
        field: flag
        value: (^|\s)PROMISC(\s|$)
        operation: pattern match
        datatype: string
        entity_check: none satisfy
        entity_existence: at_least_one_exists
  tests:
    test-no-network-interfaces-in-promiscuous-mode:
      test_title: no network interfaces are in promiscuous mode
      capability: unix.interface
      object: all-interfaces-object
      check_existence: any_exist
      check: all
      states:
      - state-interface-is-not-in-promisc-mode
  evaluate:
    test: test-no-network-interfaces-in-promiscuous-mode
