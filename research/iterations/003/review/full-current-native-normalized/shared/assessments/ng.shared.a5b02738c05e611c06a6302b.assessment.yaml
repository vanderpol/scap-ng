assessment:
  id: ng.shared.a5b02738c05e611c06a6302b
  version: 1
  assessment_title: The nobody access for RPC encryption key storage service must be disabled.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Determine if the rpc-authdes package is installed: # pkg list solaris/legacy/security/rpc-authdes If the output
    of this command is: pkg list: no packages matching ''solaris/legacy/security/rpc-authdes'' installed no further action
    is required. Determine if "nobody" access for keyserv is enabled. # grep "^ENABLE_NOBODY_KEYS=" /etc/default/keyserv If
    the output of the command is not: ENABLE_NOBODY_KEYS=NO this is a finding.'
  inputs: []
  evidence: []
