assessment:
  id: ng.shared.b39ffae648f4d5b217d40b62
  version: 1
  assessment_title: The Cisco router must be configured to terminate all network connections associated with device management
    after five minutes of inactivity.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Review the Cisco router configuration to verify that all network connections associated with a device management
    have an idle timeout value set to five minutes or less as shown in the following example: ip http secure-server ip http
    timeout-policy idle 300 life nnnn requests nn … … … line con 0 exec-timeout 5 0 line vty 0 1 exec-timeout 5 0 If the Cisco
    router is not configured to terminate all network connections associated with a device management after five minutes of
    inactivity, this is a finding.'
  inputs: []
  evidence: []
