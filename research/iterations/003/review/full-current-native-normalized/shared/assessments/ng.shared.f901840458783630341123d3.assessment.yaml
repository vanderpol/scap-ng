assessment:
  id: ng.shared.f901840458783630341123d3
  version: 1
  assessment_title: The macOS system must disable the guest account.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    system-settings-guest-account-disable-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: "/usr/bin/osascript -l JavaScript << EOS\nfunction run() {\n  let pref1 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.MCX')\\\
            \n.objectForKey('DisableGuestAccount'))\n  let pref2 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.MCX')\\\
            \n.objectForKey('EnableGuestAccount'))\n  if ( pref1 == true && pref2 == false ) {\n    return(\"true\")\n  }\
            \ else {\n    return(\"false\")\n  }\n}\nEOS"
      object_title: system_settings_guest_account_disable_recommended_object
  states:
    state-system-settings-guest-account-disable-recommended-state:
      state_title: system_settings_guest_account_disable_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: 'true'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-settings-guest-account-disable-recommended-test:
      test_title: system_settings_guest_account_disable_recommended_test
      capability: independent.shellcommand
      object: system-settings-guest-account-disable-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-system-settings-guest-account-disable-recommended-state
  evaluate:
    test: test-system-settings-guest-account-disable-recommended-test
