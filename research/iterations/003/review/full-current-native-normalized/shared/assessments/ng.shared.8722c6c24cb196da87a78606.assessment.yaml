assessment:
  id: ng.shared.8722c6c24cb196da87a78606
  version: 1
  assessment_title: The macOS system must initiate the session lock no more than five seconds after a screen saver is started.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    system-settings-screensaver-ask-password-delay-enforce-stig-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: "/usr/bin/osascript -l JavaScript << EOS\nfunction run() {\n  let delay = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.screensaver')\\\
            \n.objectForKey('askForPasswordDelay'))\n  if ( delay <= 5 ) {\n    return(\"true\")\n  } else {\n    return(\"\
            false\")\n  }\n}\nEOS"
      object_title: system_settings_screensaver_ask_for_password_delay_enforce_stig_object
  states:
    state-system-settings-screensaver-ask-for-password-delay-enfor:
      state_title: system_settings_screensaver_ask_for_password_delay_enforce_stig_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: 'true'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-settings-screensaver-ask-password-delay-enforce-stig-test:
      test_title: system_settings_screensaver_ask_for_password_delay_enforce_stig_test
      capability: independent.shellcommand
      object: system-settings-screensaver-ask-password-delay-enforce-stig-object-object
      check_existence: all_exist
      check: all
      states:
      - state-system-settings-screensaver-ask-for-password-delay-enfor
  evaluate:
    test: test-system-settings-screensaver-ask-password-delay-enforce-stig-test
