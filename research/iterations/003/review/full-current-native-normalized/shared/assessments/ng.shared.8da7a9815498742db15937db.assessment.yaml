assessment:
  id: ng.shared.8da7a9815498742db15937db
  version: 1
  assessment_title: The Cisco router must be configured to allocate audit record storage capacity in accordance with organization-defined
    audit record storage requirements.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    iosxe-line-collection:
      collection_title: null
      capability: iosxe.line
      select:
        show_subcommand:
          operation: equals
          datatype: string
          mask: false
          value: show running-config
  tests:
    test-check-see-if-logging-buffered-enabled:
      test_title: Check to see if logging buffered is enabled
      capability: iosxe.line
      collection: iosxe-line-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: Check to see if logging buffered is enabled
        state_capability: iosxe.line
        state:
          all:
          - field: show_subcommand
            value: show running-config
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: config_line
            value: \nlogging buffered \d+
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-check-see-if-logging-buffered-enabled
