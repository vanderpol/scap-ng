assessment:
  id: ng.shared.4caaa4cde463f57d9f36ea82
  version: 1
  assessment_title: Successful/unsuccessful uses of the crontab command in RHEL 8 must generate an audit record.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that an audit event is generated for any successful/unsuccessful use of the "crontab" command by performing
    the following command to check the file system rules in "/etc/audit/audit.rules": $ sudo grep -w crontab /etc/audit/audit.rules
    -a always,exit -F path=/usr/bin/crontab -F perm=x -F auid>=1000 -F auid!=unset -k privileged-crontab If the command does
    not return a line, or the line is commented out, this is a finding.'
  inputs: {}
  evidence: []
