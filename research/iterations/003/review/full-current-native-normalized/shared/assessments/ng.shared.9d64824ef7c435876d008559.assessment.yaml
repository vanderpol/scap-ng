assessment:
  id: ng.shared.9d64824ef7c435876d008559
  version: 1
  assessment_title: CISC-ND-000470 - The Cisco router must be configured to prohibit the use of all unnecessary and nonsecure
    functions and services.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    show-running-config-object:
      capability: iosxe.line
      select:
        show_subcommand:
          operation: equals
          datatype: string
          mask: false
          value: show running-config
      object_title: show running-config
  states:
    state-boot-network:
      state_title: boot network
      capability: iosxe.line
      state:
        field: config_line
        value: '[\r\n]\s*boot network[\r\n]'
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-ip-boot-server:
      state_title: ip boot server
      capability: iosxe.line
      state:
        field: config_line
        value: '[\r\n]\s*ip boot server[\r\n]'
