      collection_title: Retrieve configuration lines from /etc/aide.conf
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/aide.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*/usr/sbin/auditctl(\s+\S+)
