assessment:
  id: ng.shared.bec75500bfd43840b41f0776
  version: 1
  assessment_title: Optional Subsystems
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Control\Session Manager\SubSystems
        name:
          operation: equals
          datatype: string
          mask: false
          value: Optional
  tests:
    test-system-settings-optional-subsystems-blank:
      test_title: '''System Settings: Optional Subsystems'' is blank'
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Multi_Sz type and blank value
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_multi_sz
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: .+
            operation: pattern match
            datatype: string
            mask: false
            entity_check: none satisfy
            entity_existence: at_least_one_exists
  evaluate:
    test: test-system-settings-optional-subsystems-blank
