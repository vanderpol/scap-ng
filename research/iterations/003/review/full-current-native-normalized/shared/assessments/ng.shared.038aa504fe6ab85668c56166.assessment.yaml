assessment:
  id: ng.shared.038aa504fe6ab85668c56166
  version: 1
  assessment_title: AZLX-23-002285 - Amazon Linux 2023 library directories must have mode "755" or less permissive.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    all-group-writable-system-wide-library-directories-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          variable_check: only one
          value:
            variable: system-wide-shared-library-files-directories-variable
        filename:
          operation: equals
          datatype: string
          nil: true
          value: ''
      filters:
      - action: include
        state: state-unix-file
      - action: exclude
        state: state-not-group-writable
      behaviors:
        recurse_direction: down
      object_title: All group-writable system-wide library directories
    all-world-writable-system-wide-library-directories-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          variable_check: only one
          value:
            variable: system-wide-shared-library-files-directories-variable
        filename:
          operation: equals
          datatype: string
          nil: true
          value: ''
      filters:
      - action: include
        state: state-unix-file
      - action: exclude
        state: state-not-world-writable
      behaviors:
        recurse_direction: down
      object_title: All world-writable system-wide library directories
  variables:
    system-wide-shared-library-files-directories-variable:
      title: system-wide shared library files directories
      kind: constant
      datatype: string
      expression:
        literal:
        - /lib
        - /lib64
        - /usr/lib
        - /usr/lib64
  states:
    state-unix-file:
      state_title: null
      capability: unix.file
      state:
        field: type
        value: directory
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-not-group-writable:
      state_title: Not group-writable
      capability: unix.file
      state:
        field: gwrite
        value: 'false'
        operation: equals
        datatype: boolean
        entity_check: all
        entity_existence: at_least_one_exists
    state-not-world-writable:
      state_title: Not world-writable
      capability: unix.file
      state:
        field: owrite
        value: 'false'
        operation: equals
        datatype: boolean
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-no-group-writable-library-directories-exist:
      test_title: No group-writable library directories exist.
      capability: unix.file
      object: all-group-writable-system-wide-library-directories-object
      check_existence: none_exist
      check: all
    test-no-world-writable-library-directories-exist:
      test_title: No world-writable library directories exist.
      capability: unix.file
      object: all-world-writable-system-wide-library-directories-object
      check_existence: none_exist
      check: all
  evaluate:
    all:
    - test: test-no-group-writable-library-directories-exist
    - test: test-no-world-writable-library-directories-exist
