assessment:
  id: ng.shared.d63bfc582e4a3df765612e65
  version: 1
  assessment_title: The operating system must ensure unauthorized, security-relevant configuration changes detected are tracked.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The Audit Configuration profile is required. This check applies to the global zone only. Determine the zone
    currently being secured. # zonename If the command output is "global", this check applies. Determine the OS version currently
    being secured. # uname -v For Solaris 11, 11.1, 11.2, and 11.3: # pfexec auditconfig -getflags | grep active | cut -f2
    -d= If "as" audit flag is not included in the output, this is a finding. For Solaris 11.4 or newer: # pfexec auditconfig
    -t -getflags | cut -f2 -d= If "cusa,fm,fd,-fa,-ps,-ex" audit flags are not included in the output, this is a finding.
    Determine if auditing policy is set to collect command line arguments. # pfexec auditconfig -getpolicy | grep active |
    grep argv If the active audit policies line does not appear, this is a finding.'
  inputs: []
  evidence: []
