assessment:
  id: ng.shared.c098abe2e5b6c85d3f4be0d3
  version: 1
  assessment_title: AZLX-23-002430 - Amazon Linux 2023 must disable account identifiers (individuals, groups, roles, and devices)
    after 35 days of inactivity.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/default/useradd
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: (?i)^\s*INACTIVE\s*=\s*(-?\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-etc-default-useradd-inactive-set-35-or-less-but-not:
      test_title: '/etc/default/useradd: INACTIVE is set to 35 or less, but not -1'
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: AND
        states:
        - state_title: null
          capability: independent.textfilecontent54
          state:
            field: subexpression
            value: '0'
            operation: greater than or equal
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: independent.textfilecontent54
          state:
            field: subexpression
            value: '35'
            operation: less than or equal
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-etc-default-useradd-inactive-set-35-or-less-but-not
