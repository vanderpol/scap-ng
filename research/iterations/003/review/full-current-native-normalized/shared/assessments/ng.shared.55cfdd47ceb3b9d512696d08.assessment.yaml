assessment:
  id: ng.shared.55cfdd47ceb3b9d512696d08
  version: 1
  assessment_title: SOL-11.1-070130 - Reserved UIDs 0-99 must only be used by system accounts.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    uname-object:
      capability: unix.uname
      object_title: uname -a
    all-users-object:
      capability: unix.password
      select:
        username:
          operation: pattern match
          datatype: string
          value: ^[^-+].*$
      object_title: All users
    home-directories-all-user-accounts-object:
      capability: unix.password
      set:
        operator: union
        members:
        - object: all-users-object
        filters:
        - action: exclude
          state: state-system-accounts
        - action: exclude
          state: state-system-account
        - action: exclude
          state: state-system-account-2
        - action: exclude
          state: state-system-account-3
      object_title: The home directories of all user accounts.
    system-accounts-object:
      capability: unix.password
      set:
        operator: complement
        members:
        - object: all-users-object
        - object: home-directories-all-user-accounts-object
      object_title: System accounts
  variables:
    authorized-system-accounts-11-3-less-variable:
      title: authorized system accounts for 11.3 and less
      kind: constant
      datatype: string
      expression:
        literal:
        - adm
        - aiuser
        - bin
        - daemon
        - dhcpserv
        - dladm
        - ftp
        - gdm
        - ikeuser
        - lp
        - mysql
        - netadm
        - netcfg
        - noaccess
        - nobody
        - nobody4
        - nuucp
        - openldap
        - pkg5srv
        - polkitd
        - postgres
        - root
        - smmsp
        - sshd
        - svctag
        - sys
        - unknown
        - upnp
        - uucp
        - webservd
        - xvm
        - zfssnap
    authorized-system-accounts-11-4-newer-variable:
      title: authorized system accounts for 11.4 and newer
      kind: constant
      datatype: string
      expression:
        literal:
        - adm
        - aiuser
        - bin
        - daemon
        - dhcpserv
        - dladm
        - gdm
        - ikeuser
        - lp
        - mysql
        - netadm
        - netcfg
        - noaccess
        - nobody
        - nobody4
        - _ntp
        - nuucp
        - openldap
        - pkg5srv
        - _polkitd
        - postgres
        - root
        - smmsp
        - sshd
        - svctag
        - sys
        - unknown
        - upnp
        - uucp
        - webservd
        - xvm
        - zfssnap
  states:
    state-11-3-or-less:
      state_title: 11.3 or less.
      capability: unix.uname
      state:
        field: os_version
        value: ^11($|\.[0-3]\b)
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-authorized-11-3-and-older-system-accounts:
      state_title: authorized 11.3 and older system accounts
      capability: unix.password
      state:
        field: username
        value:
          variable: authorized-system-accounts-11-3-less-variable
        operation: equals
        datatype: string
        variable_check: at least one
        entity_check: all
        entity_existence: at_least_one_exists
    state-authorized-11-4-and-newer-system-accounts:
      state_title: authorized 11.4 and newer system accounts
      capability: unix.password
      state:
        field: username
        value:
          variable: authorized-system-accounts-11-4-newer-variable
        operation: equals
        datatype: string
        variable_check: at least one
        entity_check: all
        entity_existence: at_least_one_exists
    state-system-accounts:
      state_title: System accounts.
      capability: unix.password
      state:
        field: user_id
        value: '100'
        operation: less than
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
    state-system-account:
      state_title: System account.
      capability: unix.password
      state:
        field: user_id
        value: '60001'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
    state-system-account-2:
      state_title: System account.
      capability: unix.password
      state:
        field: user_id
        value: '60002'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
    state-system-account-3:
      state_title: System account.
      capability: unix.password
      state:
        field: user_id
        value: '65534'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-11-3-or-less:
      test_title: 11.3 or less?
      capability: unix.uname
      object: uname-object
      check_existence: any_exist
      check: all
      states:
      - state-11-3-or-less
    test-accounts-reserved-uids-match-known-11-3-older-system-accounts:
      test_title: accounts with reserved UIDs match known 11.3 and older system accounts
      capability: unix.password
      object: system-accounts-object
      check_existence: any_exist
      check: all
      states:
      - state-authorized-11-3-and-older-system-accounts
    test-accounts-reserved-uids-match-known-11-4-newer-system-accounts:
      test_title: accounts with reserved UIDs match known 11.4 and newer system accounts
      capability: unix.password
      object: system-accounts-object
      check_existence: any_exist
      check: all
      states:
      - state-authorized-11-4-and-newer-system-accounts
  evaluate:
    all:
    - any:
      - not:
          test: test-11-3-or-less
      - test: test-accounts-reserved-uids-match-known-11-3-older-system-accounts
    - any:
      - test: test-11-3-or-less
      - test: test-accounts-reserved-uids-match-known-11-4-newer-system-accounts
