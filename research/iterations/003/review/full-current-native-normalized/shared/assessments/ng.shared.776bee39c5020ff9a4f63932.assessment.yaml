assessment:
  id: ng.shared.776bee39c5020ff9a4f63932
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that all local interactive user home directories
    are owned by their respective users.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the assigned home directory of all local interactive users on the system exists. Check the home directory
    assignment for all local interactive users on the system with the following command: # ls -ld $(awk -F: ''($3>=1000)&&($7
    !~ /nologin/){print $6}'' /etc/passwd) -rwxr-x--- 1 smithj users 18 Mar 5 17:06 /home/smithj If any home directories referenced
    in "/etc/passwd" are not owned by the interactive user, this is a finding.'
  inputs: {}
  evidence: []
