assessment:
  id: ng.shared.dbb176c74ed6b74ae621d3bb
  version: 1
  assessment_title: OL07-00-020030 - The Oracle Linux operating system must be configured so that a file integrity tool verifies
    the baseline operating system configuration at least weekly.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-rpminfo-collection:
      collection_title: null
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: aide
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/crontab
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[ \t]*([\S]+[ \t]+[\S]+[ \t]+\*[ \t]+\*[ \t]+[\S]+)[ \t]+root[ \t]+\/usr\/sbin\/aide[ \t]+\-\-check(?:[\s]+|[\>\|]|$)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-textfilecontent54-collection-2:
