    test-aide-configured-run-daily-etc-crontab:
      test_title: AIDE is configured to run daily with /etc/crontab
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: The days of the week must be set
          capability: independent.textfilecontent54
          state:
            field: subexpression
            value: ((?:[0-5]?[0-9]|\*)[ \t]+(?:[01]?[0-9]|2[0-3]|\*)[ \t]+\*[ \t]+\*[ \t]+(?:[0-7]|sun|mon|tue|wed|thu|fri|sat))
