assessment:
  id: ng.shared.e36aa94cc93d438756298b61
  version: 1
  assessment_title: WN12-AU-000031
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    audit-event-subcategories-policy-collection:
      collection_title: Audit event subcategories policy
      capability: windows.auditeventpolicysubcategories
  tests:
    test-audit-account-lockout-set-failure:
      test_title: '''Audit Account Lockout'' is set to ''Failure'''
      capability: windows.auditeventpolicysubcategories
      collection: audit-event-subcategories-policy-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: '''Account Lockout'' is set to ''Failure'''
        state_capability: windows.auditeventpolicysubcategories
        state:
          field: account_lockout
          value: AUDIT_FAILURE
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-audit-account-lockout-set-success-failure:
      test_title: '''Audit Account Lockout'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      collection: audit-event-subcategories-policy-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: '''Account Lockout'' is set to ''Success'' and ''Failure'''
        state_capability: windows.auditeventpolicysubcategories
        state:
          field: account_lockout
          value: AUDIT_SUCCESS_FAILURE
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    any:
    - test: test-audit-account-lockout-set-failure
    - test: test-audit-account-lockout-set-success-failure
