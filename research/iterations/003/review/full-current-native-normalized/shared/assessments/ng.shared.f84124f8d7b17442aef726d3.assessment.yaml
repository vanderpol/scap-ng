assessment:
  id: ng.shared.f84124f8d7b17442aef726d3
  version: 1
  assessment_title: WN10-SO-000240 - The default permissions of global system objects must be increased.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Control\Session Manager
        name:
          operation: equals
          datatype: string
          mask: false
          value: ProtectionMode
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-system-objects-strengthen-default-permissions-internal-system-objects-e-g:
      test_title: '''System objects: Strengthen default permissions of internal system objects (e.g. Symbolic links)'' is
        set to ''Enabled''.'
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-system-objects-strengthen-default-permissions-internal-system-objects-e-g
