assessment:
  id: ng.shared.ee7deaf40e2724ac92df2e99
  version: 1
  assessment_title: CISC-ND-001200 - The Cisco router must be configured to use FIPS-validated Keyed-Hash Message Authentication
    Code (HMAC) to protect the integrity of remote maintenance sessions.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    show-running-config-object:
      capability: iosxe.line
      select:
        show_subcommand:
          operation: equals
          datatype: string
          mask: false
          value: show running-config
      object_title: show running-config
  states:
    state-ip-ssh-version-2:
      state_title: ip ssh version 2
      capability: iosxe.line
      state:
        field: config_line
        value: '[\r\n]\s*ip ssh version 2[\r\n]'
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-ip-ssh-server-algorithm-mac-hmac-sha2-256-hmac-sha2-512-:
      state_title: ip ssh server algorithm mac hmac-sha2-256, hmac-sha2-512, hmac-sha2-256-etm@openssh.com, and/or hmac-sha2-512-etm@openssh
      capability: iosxe.line
      state:
        field: config_line
        value: '[\r\n]\s*ip ssh server algorithm mac(?: hmac-sha2-256| hmac-sha2-512| hmac-sha2-256-etm@openssh\.com| hmac-sha2-512-etm@openssh\.com)+[\r\n]'
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-ip-ssh-version-2:
      test_title: ip ssh version 2
      capability: iosxe.line
      object: show-running-config-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-ip-ssh-version-2
    test-ip-ssh-server-algorithm-mac-hmac-sha2-256-or-stronger:
      test_title: ip ssh server algorithm mac hmac-sha2-256 or stronger FIPS-validated algorithms
      capability: iosxe.line
      object: show-running-config-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-ip-ssh-server-algorithm-mac-hmac-sha2-256-hmac-sha2-512-
  evaluate:
    all:
    - test: test-ip-ssh-version-2
    - test: test-ip-ssh-server-algorithm-mac-hmac-sha2-256-or-stronger
