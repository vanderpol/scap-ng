  version: 1
  assessment_title: SQL Server must associate organization-defined types of security labels having organization-defined security
    label values with information in process, transit, or storage.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: If security labeling is not required, this is not a finding. If security labeling requirements have been specified,
    but neither a third-party solution nor a SQL Server Row-Level security solution is implemented that reliably maintains
    labels on information, this is a finding.
