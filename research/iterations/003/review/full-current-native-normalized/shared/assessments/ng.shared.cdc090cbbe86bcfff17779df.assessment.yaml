assessment:
  id: ng.shared.cdc090cbbe86bcfff17779df
  version: 1
  assessment_title: UAC - Secure Desktop Mode
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Microsoft\Windows\CurrentVersion\Policies\System
        name:
          operation: equals
          datatype: string
          mask: false
          value: PromptOnSecureDesktop
  variables:
    switch-secure-desktop-when-prompting-elevation-variable:
      title: Switch to the secure desktop when prompting for elevation
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: switch_secure_desktop_prompting_elevation_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-user-account-control-switch-secure-desktop-when-prompting-elevation-set:
      test_title: '''User Account Control: Switch to the secure desktop when prompting for elevation'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: switch-secure-desktop-when-prompting-elevation-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-user-account-control-switch-secure-desktop-when-prompting-elevation-set
