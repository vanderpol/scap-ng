assessment:
  id: ng.shared.8af53f5646e2ecf21d02c3e3
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that when passwords are changed or new passwords
    are established, pwquality must be used.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system uses "pwquality" to enforce the password complexity rules. Check for the use of
    "pwquality" with the following command: # cat /etc/pam.d/system-auth | grep pam_pwquality password requisite pam_pwquality.so
    retry=3 If the command does not return an uncommented line containing the value "pam_pwquality.so" as shown, this is a
    finding. If the value of "retry" is set to "0" or greater than "3", this is a finding.'
  inputs: []
  evidence: []
