assessment:
  id: ng.shared.625ece0774eaeb11ae538518
  version: 1
  assessment_title: OL 9 interactive users must have a primary group that exists.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    return-any-user-who-does-not-have-valid-primary-group-collection:
      collection_title: Return any user who does not have a valid primary group
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: pwck -r
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: no group
  tests:
    test-interactive-users-have-primary-group-that-exists:
      test_title: Interactive users must have a primary group that exists.
      capability: independent.shellcommand
      collection: return-any-user-who-does-not-have-valid-primary-group-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Confirm no users are reported that have an invalid primary group
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: ''
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: none_exist
  evaluate:
    test: test-interactive-users-have-primary-group-that-exists
