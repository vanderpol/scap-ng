assessment:
  id: ng.shared.11a1441c49cb49e908e2ed45
  version: 1
  assessment_title: The Oracle Linux operating system must be configured to use the shadow file to store only encrypted representations
    of passwords.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the system''s shadow file is configured to store only encrypted representations of passwords. The strength
    of encryption that must be used to hash passwords for all accounts is SHA512. Check that the system is configured to create
    SHA512 hashed passwords with the following command: # grep -i encrypt /etc/login.defs ENCRYPT_METHOD SHA512 If the "/etc/login.defs"
    configuration file does not exist or allows for password hashes other than SHA512 to be used, this is a finding.'
  inputs: {}
  evidence: []
