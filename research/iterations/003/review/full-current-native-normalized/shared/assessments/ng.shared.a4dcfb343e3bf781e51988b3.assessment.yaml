assessment:
  id: ng.shared.a4dcfb343e3bf781e51988b3
  version: 1
  assessment_title: The System packages must be up to date with the most recent vendor updates and security fixes.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    pkg-update-n-collection:
      collection_title: pkg update -n
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: pkg update -n
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
  tests:
    test-system-packages-up-date-most-recent-vendor-updates-security-fixes:
      test_title: The System packages must be up to date with the most recent vendor updates and security fixes.
      capability: independent.shellcommand
      collection: pkg-update-n-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Check that a line returns No updates available for this image, and command exit status is 0
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: No updates available for this image.
            operation: equals
            datatype: string
            mask: false
            entity_check: at least one
            entity_existence: at_least_one_exists
  evaluate:
    test: test-system-packages-up-date-most-recent-vendor-updates-security-fixes
