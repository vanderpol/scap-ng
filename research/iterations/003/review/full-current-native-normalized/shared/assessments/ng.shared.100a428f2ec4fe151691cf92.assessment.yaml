assessment:
  id: ng.shared.100a428f2ec4fe151691cf92
  version: 1
  assessment_title: Windows Server 2019 must automatically remove or disable emergency accounts after the crisis is resolved
    or within 72 hours.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Determine if emergency administrator accounts are used and identify any that exist. If none exist, this is NA.
    If emergency administrator accounts cannot be configured with an expiration date due to an ongoing crisis, the accounts
    must be disabled or removed when the crisis is resolved. If emergency administrator accounts have not been configured
    with an expiration date or have not been disabled or removed following the resolution of a crisis, this is a finding.
    Domain Controllers: Open "PowerShell". Enter "Search-ADAccount -AccountExpiring | FT Name, AccountExpirationDate". If
    "AccountExpirationDate" has been defined and is not within 72 hours for an emergency administrator account, this is a
    finding. Member servers and standalone or nondomain-joined systems: Open "Command Prompt". Run "Net user [username]",
    where [username] is the name of the emergency account. If "Account expires" has been defined and is not within 72 hours
    for an emergency administrator account, this is a finding.'
  inputs: {}
  evidence: []
