assessment:
  id: ng.shared.f2ae6f8bafe3b040822dd70d
  version: 1
  assessment_title: Maximum Log Size - Setup
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SOFTWARE\Policies\Microsoft\Windows\EventLog\Setup
        name:
          operation: equals
          datatype: string
          value: MaxSize
      object_title: null
  variables:
    maximum-setup-log-size-variable:
      title: Maximum Setup Log Size
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: maximum_setup_log_size_var
        validation:
          alternatives:
          - literal: '16384'
            hint: enabled:16384_kb
          - literal: '32768'
            hint: enabled:32768_kb
          - literal: '81920'
            hint: enabled:81920_kb
  states:
    state-reg-dword-type-and-value-equals-or-is-greater-than-varia:
      state_title: Reg_Dword type and value equals or is greater than variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: maximum-setup-log-size-variable
          operation: greater than or equal
          datatype: int
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-specify-maximum-log-size-kb-set-at-minimum-enabled-32768:
      test_title: '''Specify the maximum log size (KB)'' is set at a minimum to ''Enabled:32768'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-or-is-greater-than-varia
  evaluate:
    test: test-specify-maximum-log-size-kb-set-at-minimum-enabled-32768
