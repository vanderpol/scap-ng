assessment:
  id: ng.shared.8a36531ac630539e9d531387
  version: 1
  assessment_title: The macOS system must enforce auto logout after 86400 seconds of inactivity.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    system-settings-automatic-logout-enforce-stig-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''.GlobalPreferences'')\

            .objectForKey(''com.apple.autologout.AutoLogOutDelay'').js

            EOS'
      object_title: system_settings_automatic_logout_enforce_stig_object
  states:
    state-system-settings-automatic-logout-enforce-stig-state:
      state_title: system_settings_automatic_logout_enforce_stig_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: '86400'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-settings-automatic-logout-enforce-stig-test:
      test_title: system_settings_automatic_logout_enforce_stig_test
      capability: independent.shellcommand
      object: system-settings-automatic-logout-enforce-stig-object-object
      check_existence: all_exist
      check: all
      states:
      - state-system-settings-automatic-logout-enforce-stig-state
  evaluate:
    test: test-system-settings-automatic-logout-enforce-stig-test
