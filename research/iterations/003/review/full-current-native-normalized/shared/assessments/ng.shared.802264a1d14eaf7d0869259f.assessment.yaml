assessment:
  id: ng.shared.802264a1d14eaf7d0869259f
  version: 1
  assessment_title: The Firefox New Tab page must not show Top Sites, Sponsored Top Sites, Pocket Recommendations, Sponsored
    Pocket Stories, Searches, Highlights, or Snippets.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Type "about:policies" in the browser address bar. If "FirefoxHome" is not displayed under Policy Name or the
    Policy Value does not have "Search" with a value of "false", this is a finding. If "FirefoxHome" is not displayed under
    Policy Name or the Policy Value does not have "TopSites" with a value of "false", this is a finding. If "FirefoxHome"
    is not displayed under Policy Name or the Policy Value does not have "SponsoredTopSites" with a value of "false", this
    is a finding. If "FirefoxHome" is not displayed under Policy Name or the Policy Value does not have "Pocket" with a value
    of "false", this is a finding. If "FirefoxHome" is not displayed under Policy Name or the Policy Value does not have "SponsoredPocket"
    with a value of "false", this is a finding. If "FirefoxHome" is not displayed under Policy Name or the Policy Value does
    not have "Highlights" with a value of "false", this is a finding. If "FirefoxHome" is not displayed under Policy Name
    or the Policy Value does not have "Snippets" with a value of "false", this is a finding. If "FirefoxHome" is not displayed
    under Policy Name or the Policy Value does not have "Locked" with a value of "true", this is a finding.
  inputs: {}
  evidence: []
