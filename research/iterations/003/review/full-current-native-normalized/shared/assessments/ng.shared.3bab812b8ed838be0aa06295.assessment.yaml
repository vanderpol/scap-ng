assessment:
  id: ng.shared.3bab812b8ed838be0aa06295
  version: 1
  assessment_title: The Cisco router must be configured to encrypt SNMP messages using a FIPS 140-2 approved algorithm.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Review the Cisco router configuration to verify that it is compliant with this requirement as shown in the example
    below. snmp-server group V3GROUP v3 priv read V3READ write V3WRITE snmp-server view V3READ iso included snmp-server view
    V3WRITE iso included snmp-server host x.x.x.x version 3 auth V3USER Encryption used by the SNMP users can be viewed via
    the show snmp user command as shown in the example below. R4#show snmp user User name: V3USER Engine ID: 800000090300C2042B540000
    storage-type: nonvolatile active Authentication Protocol: SHA Privacy Protocol: AES256 Group-name: V3GROUP If the Cisco
    router is not configured to encrypt SNMP messages using a FIPS 140-2 approved algorithm, this is a finding.'
  inputs: []
  evidence: []
