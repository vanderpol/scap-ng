assessment:
  id: ng.shared.ebb885749be5510f822301e3
  version: 1
  assessment_title: The Cisco switch must be configured to allocate audit record storage capacity in accordance with organization-defined
    audit record storage requirements.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that the Cisco switch is configured with a logging buffer size. The configuration should look like the
    example below: logging buffered xxxxxxxx informational If a logging buffer size is not configured, this is a finding.
    If the Cisco switch is not configured to allocate audit record storage capacity in accordance with organization-defined
    audit record storage requirements, this is a finding.'
  inputs: []
  evidence: []
