assessment:
  id: ng.shared.1760cb969c5573ca18362d04
  version: 1
  assessment_title: UBTU-18-010514 - The Ubuntu operating system must implement address space layout randomization to protect
    its memory from unauthorized code execution.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-sysctl-object:
      capability: unix.sysctl
      select:
        name:
          operation: equals
          datatype: string
          value: kernel.randomize_va_space
      object_title: null
    etc-sysctl-conf-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/sysctl.conf
        pattern:
          operation: pattern match
          datatype: string
          value: (?:^|.*\n)\s*kernel\.randomize_va_space\s*=\s*(\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: /etc/sysctl.conf
    other-sysctl-configuration-files-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          variable_check: at least one
          value:
            variable: other-sysctl-configuration-file-locations-variable
        filename:
          operation: pattern match
          datatype: string
          value: ^.*\.conf$
        pattern:
          operation: pattern match
          datatype: string
          value: (?:^|.*\n)\s*kernel\.randomize_va_space\s*=\s*(\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: other sysctl configuration files
    all-sysctl-configuration-files-object:
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - object: etc-sysctl-conf-object
        - object: other-sysctl-configuration-files-object
      object_title: all sysctl configuration files
  variables:
    other-sysctl-configuration-file-locations-variable:
      title: other sysctl configuration file locations
      kind: constant
      datatype: string
      expression:
        literal:
        - /etc/sysctl.d
        - /run/sysctl.d
        - /lib/sysctl.d
        - /usr/lib/sysctl.d
        - /usr/local/lib/sysctl.d
  states:
    state-unix-sysctl:
      state_title: null
      capability: unix.sysctl
      state:
        field: value
        value: '2'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '2'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-kernel-randomize-va-space-setting-in-kernel-set-2:
      test_title: kernel.randomize_va_space setting in kernel is set to 2
      capability: unix.sysctl
      object: unix-sysctl-object
      check_existence: all_exist
      check: all
      states:
      - state-unix-sysctl
    test-kernel-randomize-va-space-setting-in-sysctl-configuration-files-set:
      test_title: kernel.randomize_va_space setting in sysctl configuration files is set to 2, if it is set at all
      capability: independent.textfilecontent54
      object: all-sysctl-configuration-files-object
      check_existence: any_exist
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    all:
    - test: test-kernel-randomize-va-space-setting-in-kernel-set-2
    - test: test-kernel-randomize-va-space-setting-in-sysctl-configuration-files-set
