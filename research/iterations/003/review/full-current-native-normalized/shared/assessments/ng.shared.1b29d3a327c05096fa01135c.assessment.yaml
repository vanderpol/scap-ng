assessment:
  id: ng.shared.1b29d3a327c05096fa01135c
  version: 1
  assessment_title: The macOS system must enable security auditing.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    audit-auditd-enabled-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: "LAUNCHD_RUNNING=$(/bin/launchctl print system | /usr/bin/grep -c '\"com.apple.auditd\" => enabled')\nAUDITD_RUNNING=$(/usr/sbin/audit\
            \ -c | /usr/bin/grep -c \"AUC_AUDITING\")\nif [[ $LAUNCHD_RUNNING == 1 ]] && [[ -e /etc/security/audit_control\
            \ ]] && [[ $AUDITD_RUNNING == 1 ]]; then\n  echo \"pass\"\nelse\n  echo \"fail\"\nfi"
      object_title: audit_auditd_enabled_recommended_object
  states:
    state-audit-auditd-enabled-recommended-state:
      state_title: audit_auditd_enabled_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: pass
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-auditd-enabled-recommended-test:
      test_title: audit_auditd_enabled_recommended_test
      capability: independent.shellcommand
      object: audit-auditd-enabled-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-audit-auditd-enabled-recommended-state
  evaluate:
    test: test-audit-auditd-enabled-recommended-test
