assessment:
  id: ng.shared.ba9250b6786ed006d5f8a2a1
  version: 1
  assessment_title: The audit system must be configured to audit login, logout, and session initiation.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    auditconfig-t-getflags-cut-f2-d-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: auditconfig -t -getflags | cut -f2 -d=
        pattern:
          operation: pattern match
          datatype: string
          value: .*
      object_title: auditconfig -t -getflags | cut -f2 -d=
    auditconfig-t-getnaflags-cut-f2-d-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: auditconfig -t -getnaflags | cut -f2 -d=
        pattern:
          operation: pattern match
          datatype: string
          value: .*
      object_title: auditconfig -t -getnaflags | cut -f2 -d==
    auditconfig-getpolicy-filter-on-active-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: auditconfig -getpolicy
        pattern:
          operation: pattern match
          datatype: string
          value: active
      object_title: auditconfig -getpolicy and filter on active
  states:
    state-cusa-is-returned-in-the-output:
      state_title: cusa is returned in the output
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: cusa
          operation: pattern match
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
    state-ft-is-returned-in-the-output:
      state_title: ft is returned in the output
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: ft
          operation: pattern match
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
    state-lo-is-returned-in-the-output:
      state_title: lo is returned in the output
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: lo
          operation: pattern match
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
    state-ap-is-returned-in-the-output:
      state_title: ap is returned in the output
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: ap
          operation: pattern match
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
    state-ss-is-returned-in-the-output:
      state_title: ss is returned in the output
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: ss
          operation: pattern match
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
    state-ua-is-returned-in-the-output:
      state_title: ua is returned in the output
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: ua
          operation: pattern match
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
    state-pe-is-returned-in-the-output:
      state_title: pe is returned in the output
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: pe
          operation: pattern match
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
    state-na-is-returned-in-the-output:
      state_title: na is returned in the output
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: na
          operation: pattern match
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
    state-argv-is-returned-in-the-output:
      state_title: argv is returned in the output
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: argv
          operation: pattern match
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-audit-flag-cusa-enabled:
      test_title: audit flag cusa is enabled.
      capability: independent.shellcommand
      object: auditconfig-t-getflags-cut-f2-d-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-cusa-is-returned-in-the-output
    test-audit-flags-ft-lo-ap-ss-ua-pe-enabled:
      test_title: audit flags 'ft,lo,ap,ss,ua,pe' are enabled.
      capability: independent.shellcommand
      object: auditconfig-t-getflags-cut-f2-d-object
      check_existence: at_least_one_exists
      check: all
      state_operator: AND
      states:
      - state-ft-is-returned-in-the-output
      - state-lo-is-returned-in-the-output
      - state-ap-is-returned-in-the-output
      - state-ss-is-returned-in-the-output
      - state-ua-is-returned-in-the-output
      - state-pe-is-returned-in-the-output
    test-naflags-na-lo-enabled:
      test_title: naflags of na and lo are enabled
      capability: independent.shellcommand
      object: auditconfig-t-getnaflags-cut-f2-d-object
      check_existence: at_least_one_exists
      check: all
      state_operator: AND
      states:
      - state-na-is-returned-in-the-output
      - state-lo-is-returned-in-the-output
    test-active-audit-policy-includes-arg:
      test_title: The active audit policy includes arg
      capability: independent.shellcommand
      object: auditconfig-getpolicy-filter-on-active-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-argv-is-returned-in-the-output
  evaluate:
    all:
    - any:
      - test: test-audit-flag-cusa-enabled
      - test: test-audit-flags-ft-lo-ap-ss-ua-pe-enabled
    - test: test-naflags-na-lo-enabled
    - test: test-active-audit-policy-includes-arg
