assessment:
  id: ng.shared.7c6679d706336a8bde25d194
  version: 1
  assessment_title: The macOS system must enforce password complexity by requiring that at least one special character be
    used.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    pwpolicy-special-character-enforce-stig-object-collection:
      collection_title: pwpolicy_special_character_enforce_stig_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/bin/pwpolicy -getaccountpolicies 2>/dev/null | /usr/bin/tail -n +2 | /usr/bin/xmllint --xpath "//string[contains(text(),
            \"policyAttributePassword matches '(.*[^a-zA-Z0-9].*){\")]" - 2>/dev/null | /usr/bin/awk -F"{|}" '{if ($2 >= 1)
            {print "pass"} else {print "fail"}}'
  tests:
    test-pwpolicy-special-character-enforce-stig-test:
      test_title: pwpolicy_special_character_enforce_stig_test
      capability: independent.shellcommand
      collection: pwpolicy-special-character-enforce-stig-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: pwpolicy_special_character_enforce_stig_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: pass
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-pwpolicy-special-character-enforce-stig-test
