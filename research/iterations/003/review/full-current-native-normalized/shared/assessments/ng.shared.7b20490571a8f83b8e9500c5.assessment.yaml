assessment:
  id: ng.shared.7b20490571a8f83b8e9500c5
  version: 1
  assessment_title: UBTU-22-652010 - Ubuntu 22.04 LTS must be configured to preserve log records from failure events.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-dpkginfo-collection:
      collection_title: null
      capability: linux.dpkginfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: rsyslog
    linux-systemdunitproperty-collection:
      collection_title: null
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          mask: false
          value: rsyslog.service
        property:
          operation: equals
          datatype: string
          mask: false
          value: UnitFileState
    linux-systemdunitproperty-collection-2:
      collection_title: null
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          mask: false
          value: rsyslog.service
        property:
          operation: equals
          datatype: string
          mask: false
          value: ActiveState
  tests:
    test-rsyslog-package-installed:
      test_title: The rsyslog package is installed.
      capability: linux.dpkginfo
      collection: linux-dpkginfo-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
    test-rsyslog-service-enabled:
      test_title: rsyslog.service is enabled
      capability: linux.systemdunitproperty
      collection: linux-systemdunitproperty-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: linux.systemdunitproperty
        state:
          field: value
          value: enabled
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-rsyslog-service-active:
      test_title: rsyslog.service is active
      capability: linux.systemdunitproperty
      collection: linux-systemdunitproperty-collection-2
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: linux.systemdunitproperty
        state:
          field: value
          value: active
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-rsyslog-package-installed
    - test: test-rsyslog-service-enabled
    - test: test-rsyslog-service-active
