assessment:
  id: ng.shared.55d2c68970f40efd6cc5d223
  version: 1
  assessment_title: AZLX-23-002540 - Amazon Linux 2023 must enable kernel parameters to enforce discretionary access control
    on symlinks.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    unix-sysctl-collection:
      collection_title: null
      capability: unix.sysctl
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: fs.protected_symlinks
  tests:
    test-fs-protected-symlinks-setting-in-kernel-set-1:
      test_title: fs.protected_symlinks setting in kernel is set to 1
      capability: unix.sysctl
      collection: unix-sysctl-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: null
        state_capability: unix.sysctl
        state:
          field: value
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-fs-protected-symlinks-setting-in-kernel-set-1
