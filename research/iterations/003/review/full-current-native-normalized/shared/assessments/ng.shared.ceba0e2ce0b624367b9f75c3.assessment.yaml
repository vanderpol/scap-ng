assessment:
  id: ng.shared.ceba0e2ce0b624367b9f75c3
  version: 1
  assessment_title: The graphical login service provides the capability of logging into the system using an X-Windows type
    interface from the console. If graphical login access for the console is required, the service must be in local-only mode.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Determine if the X11 server system is providing remote services on the network. # svcprop -p options/tcp_listen
    svc:/application/x11/x11-server If the output of the command is "true" and network access to graphical user login is not
    required, this is a finding.'
  inputs: {}
  evidence: []
