assessment:
  id: ng.shared.b8a6347b649ea3e79b0debf1
  version: 1
  assessment_title: Windows Server 2016 built-in administrator account must be renamed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy
    >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> Security Options. If the value
    for "Accounts: Rename administrator account" is not set to a value other than "Administrator", this is a finding. For
    server core installations, run the following command: Secedit /Export /Areas SecurityPolicy /CFG C:\Path\FileName.Txt
    If "NewAdministratorName" is not something other than "Administrator" in the file, this is a finding.'
  inputs: {}
  evidence: []
