assessment:
  id: ng.shared.79d23817aada57902d5114df
  version: 1
  assessment_title: Kerberos encryption types must be configured to prevent the use of DES and RC4 encryption suites.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding. Registry
    Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Kerberos\Parameters\
    Value Name: SupportedEncryptionTypes Value Type: REG_DWORD Value: 0x7ffffff8 (2147483640) Note: Removing the previously
    allowed RC4_HMAC_MD5 encryption suite may have operational impacts and must be thoroughly tested for the environment before
    changing. This includes but is not limited to parent\child trusts where RC4 is still enabled; selecting "The other domain
    supports Kerberos AES Encryption" may be required on the domain trusts to allow client communication across the trust
    relationship.'
  inputs: {}
  evidence: []
