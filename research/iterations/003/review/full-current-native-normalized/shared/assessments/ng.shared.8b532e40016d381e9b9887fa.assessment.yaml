assessment:
  id: ng.shared.8b532e40016d381e9b9887fa
  version: 1
  assessment_title: SQL Server default account [sa] must have its name changed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the SQL Server default [sa] (system administrator) account name has been changed by executing the following
    query: USE master; GO SELECT * FROM sys.sql_logins WHERE [name] = ''sa'' OR [principal_id] = 1; GO If the login account
    name "SA" or "sa" appears in the query output, this is a finding.'
  inputs: []
  evidence: []
