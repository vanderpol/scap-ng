assessment:
  id: ng.shared.265bc0197687d5ff3c5fa229
  version: 1
  assessment_title: UBTU-18-010515 - The Ubuntu operating system must use a file integrity tool to verify correct operation
    of all security functions.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-dpkginfo-object:
      capability: linux.dpkginfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: aide
      object_title: null
    var-lib-aide-aide-db-object:
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /var/lib/aide/aide.db
      object_title: /var/lib/aide/aide.db
  states: {}
  tests:
    test-package-aide-installed:
      test_title: package aide is installed
      capability: linux.dpkginfo
      object: linux-dpkginfo-object
      check_existence: all_exist
      check: all
    test-package-aide-initialized:
      test_title: package aide is initialized
      capability: unix.file
      object: var-lib-aide-aide-db-object
      check_existence: all_exist
      check: all
  evaluate:
    all:
    - test: test-package-aide-installed
    - test: test-package-aide-initialized
