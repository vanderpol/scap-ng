assessment:
  id: ng.shared.0da836a3c709d0477ae21ce4
  version: 1
  assessment_title: Sharing and Security Model for Local Accounts
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Control\Lsa
        name:
          operation: equals
          datatype: string
          mask: false
          value: ForceGuest
  variables:
    network-access-sharing-security-model-local-accounts-variable:
      title: 'Network access: Sharing and security model for local accounts'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: sharing_and_security_model_for_local_accounts_var
        validation:
          alternatives:
          - literal: '0'
            hint: classic
          - literal: '1'
            hint: guests_only
  tests:
    test-network-access-sharing-security-model-local-accounts-set-classic-local:
      test_title: '''Network access: Sharing and security model for local accounts'' is set to ''Classic - local users authenticate
        as themselves'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: network-access-sharing-security-model-local-accounts-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-network-access-sharing-security-model-local-accounts-set-classic-local
