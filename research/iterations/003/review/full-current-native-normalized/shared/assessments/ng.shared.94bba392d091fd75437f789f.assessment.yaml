assessment:
  id: ng.shared.94bba392d091fd75437f789f
  version: 1
  assessment_title: The default umask for system and users must be 077.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The root role is required. Determine if the default umask is configured properly. # grep -i "^UMASK=" /etc/default/login
    If "UMASK=077" is not displayed, this is a finding. Check local initialization files: # cut -d: -f1 /etc/passwd | xargs
    -n1 -iUSER sh -c "grep umask ~USER/.*" If this command does not output a line indicating "umask 077" for each user, this
    is a finding.'
  inputs: []
  evidence: []
