assessment:
  id: ng.shared.cda80836f84c49ba88047f81
  version: 1
  assessment_title: WN10-SO-000160 - The system must be configured to prevent anonymous users from having the same rights
    as the Everyone group.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Control\Lsa
        name:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: EveryoneIncludesAnonymous
  tests:
    test-network-access-let-everyone-permissions-apply-anonymous-users-set-disabled:
      test_title: '''Network access: Let Everyone permissions apply to anonymous users'' is set to ''Disabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-network-access-let-everyone-permissions-apply-anonymous-users-set-disabled
