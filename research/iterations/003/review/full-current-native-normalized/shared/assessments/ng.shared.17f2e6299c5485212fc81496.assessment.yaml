assessment:
  id: ng.shared.17f2e6299c5485212fc81496
  version: 1
  assessment_title: The SUSE operating system must have system commands owned by root.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the system commands contained in the following directories are owned by root: /bin /sbin /usr/bin /usr/sbin
    /usr/local/bin /usr/local/sbin Use the following command for the check: > sudo find -L /bin /sbin /usr/bin /usr/sbin /usr/local/bin
    /usr/local/sbin ! -user root -type f -exec stat -c "%n %U" ''{}'' \; If any system commands are returned, this is a finding.'
  inputs: {}
  evidence: []
