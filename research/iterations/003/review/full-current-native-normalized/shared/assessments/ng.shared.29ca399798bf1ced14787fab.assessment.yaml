assessment:
  id: ng.shared.29ca399798bf1ced14787fab
  version: 1
  assessment_title: Exchange must have anti-spam filtering installed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    run-get-contentfilterconfig-see-if-data-returned-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: powershell
        command:
          operation: equals
          datatype: string
          value: add-pssnapin Microsoft.Exchange.Management.Powershell.Snapin;Get-ContentFilterConfig |Select-Object -Property
            Name, Enabled | Format-Table -HideTableHeaders | Out-String -Width 4096
        pattern:
          operation: equals
          datatype: string
          value: \w
      behaviors:
        error_if_stderr_exists: 'true'
      object_title: Run Get-ContentFilterConfig to see if data is returned
  states:
    state-verify-data-is-returned:
      state_title: Verify data is returned
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: \w
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-if-get-contentfilterconfig-returns-no-value-this-finding:
      test_title: If Get-ContentFilterConfig returns no value, this is a finding.
      capability: independent.shellcommand
      object: run-get-contentfilterconfig-see-if-data-returned-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-verify-data-is-returned
  evaluate:
    test: test-if-get-contentfilterconfig-returns-no-value-this-finding
