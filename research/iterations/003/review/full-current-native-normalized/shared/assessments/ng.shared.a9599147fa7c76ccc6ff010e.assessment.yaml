assessment:
  id: ng.shared.a9599147fa7c76ccc6ff010e
  version: 1
  assessment_title: Windows 10 domain-joined systems must have a Trusted Platform Module (TPM) enabled and ready for use.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    check-tpm-values-object:
      capability: windows.cmdlet
      select:
        module_name:
          operation: equals
          datatype: string
          value: TrustedPlatformModule
        module_id:
          operation: equals
          datatype: string
          nil: true
          value: ''
        module_version:
          operation: equals
          datatype: version
          nil: true
          value: ''
        verb:
          operation: equals
          datatype: string
          value: Get
        noun:
          operation: equals
          datatype: string
          value: Tpm
        parameters:
          operation: equals
          datatype: string
          nil: true
          value: ''
        select:
          operation: equals
          datatype: record
          value:
            record:
            - name: property
              value: tpmpresent,tpmready
              operation: equals
              datatype: string
              entity_check: all
      object_title: Check for TPM values
    check-tpm-specific-version-object:
      capability: windows.cmdlet
      select:
        module_name:
          operation: equals
          datatype: string
          value: CimCmdlets
        module_id:
          operation: equals
          datatype: string
          nil: true
          value: ''
        module_version:
          operation: equals
          datatype: version
          nil: true
          value: ''
        verb:
          operation: equals
          datatype: string
          value: Get
        noun:
          operation: equals
          datatype: string
          value: CimInstance
        parameters:
          operation: equals
          datatype: record
          value:
            record:
            - name: classname
              value: Win32_TPM
              operation: equals
              datatype: string
              entity_check: all
            - name: namespace
              value: root\cimv2\security\microsofttpm
              operation: equals
              datatype: string
              entity_check: all
        select:
          operation: equals
          datatype: record
          value:
            record:
            - name: property
              value: specversion
              operation: equals
              datatype: string
              entity_check: all
      object_title: Check for TPM Specific Version
  states:
    state-tpm-values-must-equal-true:
      state_title: TPM values must equal True
      capability: windows.cmdlet
      state:
        field: value
        value:
          record:
          - name: tpmpresent
            value: 'True'
            operation: equals
            datatype: string
            entity_check: all
          - name: tpmready
            value: 'True'
            operation: equals
            datatype: string
            entity_check: all
        operation: equals
        datatype: record
        entity_check: all
        entity_existence: at_least_one_exists
    state-specific-version-must-be-2-0-or-1-2:
      state_title: Specific Version must be 2.0 or 1.2
      capability: windows.cmdlet
      state:
        field: value
        value:
          record:
          - name: specversion
            value: \b(1\.2|2\.0)\b
            operation: pattern match
            datatype: string
            entity_check: all
        operation: equals
        datatype: record
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-windows-system-have-tpm-ready-use:
      test_title: Windows system must have TPM and must be ready to use
      capability: windows.cmdlet
      object: check-tpm-values-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-tpm-values-must-equal-true
    test-windows-system-tpm-specific-version-should-1-2-or-2:
      test_title: Windows system TPM specific version should be 1.2 or 2.0
      capability: windows.cmdlet
      object: check-tpm-specific-version-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-specific-version-must-be-2-0-or-1-2
  evaluate:
    all:
    - test: test-windows-system-have-tpm-ready-use
    - test: test-windows-system-tpm-specific-version-should-1-2-or-2
