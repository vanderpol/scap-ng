assessment:
  id: ng.shared.17d56901b295e41827927bd3
  version: 1
  assessment_title: The macOS system must enforce screen saver password.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to prompt users to enter a password to unlock the screen saver with the
    following command: /usr/bin/osascript -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.screensaver'')\
    .objectForKey(''askForPassword'').js EOS If the result is not "true", this is a finding.'
  inputs: []
  evidence: []
