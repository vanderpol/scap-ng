assessment:
  id: ng.shared.3f79536a5ff54b59b5fce0e9
  version: 1
  assessment_title: Windows Server 2016 must automatically remove or disable temporary user accounts after 72 hours.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Review temporary user accounts for expiration dates. Determine if temporary user accounts are used and identify
    any that exist. If none exist, this is NA. Domain Controllers: Open "PowerShell". Enter "Search-ADAccount -AccountExpiring
    | FT Name, AccountExpirationDate". If "AccountExpirationDate" has not been defined within 72 hours for any temporary user
    account, this is a finding. Member servers and standalone or nondomain-joined systems: Open "Command Prompt". Run "Net
    user [username]", where [username] is the name of the temporary user account. If "Account expires" has not been defined
    within 72 hours for any temporary user account, this is a finding.'
  inputs: []
  evidence: []
