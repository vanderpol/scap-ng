assessment:
  id: ng.shared.efa9a0b941350b4de857e39b
  version: 1
  assessment_title: The SUSE operating system must have system commands group-owned by root or a system account.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the system commands contained in the following directories are group-owned by root or a system account:
    /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin Run the check with the following command: > sudo find -L
    /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin ! -group root -type f -exec stat -c "%n %G" ''{}'' \; If
    any system commands are returned that are not Set Group ID upon execution (SGID) files and group-owned by a required system
    account, this is a finding.'
  inputs: {}
  evidence: []
