assessment:
  id: ng.shared.e299d3132a992ff5a26238ef
  version: 1
  assessment_title: UBTU-22-255010 - Ubuntu 22.04 LTS must have SSH installed.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-dpkginfo-collection:
      collection_title: null
      capability: linux.dpkginfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: openssh-server
  tests:
    test-package-ssh-installed:
      test_title: package ssh is installed
      capability: linux.dpkginfo
      collection: linux-dpkginfo-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    test: test-package-ssh-installed
