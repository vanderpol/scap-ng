assessment:
  id: ng.shared.8564ab0b299051a220dfea21
  version: 1
  assessment_title: LAN Manager Hash Value Stored
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: System\CurrentControlSet\Control\Lsa
        name:
          operation: equals
          datatype: string
          value: NoLMHash
      object_title: null
  variables:
    network-security-do-not-store-lan-manager-hash-value-on-variable:
      title: 'Network security: Do not store LAN Manager hash value on next password change'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: do_not_store_lan_manager_hash_value_on_next_password_change_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: network-security-do-not-store-lan-manager-hash-value-on-variable
          operation: equals
          datatype: int
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-network-security-do-not-store-lan-manager-hash-value-on:
      test_title: '''Network security: Do not store LAN Manager hash value on next password change'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-network-security-do-not-store-lan-manager-hash-value-on
