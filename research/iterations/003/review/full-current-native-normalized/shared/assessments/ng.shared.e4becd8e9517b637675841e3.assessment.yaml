assessment:
  id: ng.shared.e4becd8e9517b637675841e3
  version: 1
  assessment_title: The macOS system must authorize USB devices before allowing connection.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    system-settings-usb-restricted-mode-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: zsh
        command:
          operation: equals
          datatype: string
          value: "/usr/bin/osascript -l JavaScript << EOS\n  function run() {\n    let pref1 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.applicationaccess')\\\
            \n  .objectForKey('allowUSBRestrictedMode'))\n    if ( pref1 == false ) {\n      return(\"false\")\n    } else\
            \ {\n      return(\"true\")\n    }\n  }\nEOS"
      object_title: system_settings_usb_restricted_mode_recommended_object
  states:
    state-system-settings-usb-restricted-mode-recommended-state:
      state_title: system_settings_usb_restricted_mode_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: 'true'
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-settings-usb-restricted-mode-recommended-test:
      test_title: system_settings_usb_restricted_mode_recommended_test
      capability: independent.shellcommand
      object: system-settings-usb-restricted-mode-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-system-settings-usb-restricted-mode-recommended-state
  evaluate:
    test: test-system-settings-usb-restricted-mode-recommended-test
