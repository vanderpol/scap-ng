assessment:
  id: ng.shared.19291cf7fb2e1dac9a01f825
  version: 1
  assessment_title: Run control scripts library search paths must contain only authorized paths.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    find-etc-rc-etc-init-d-type-f-print-xargs-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: find /etc/rc* /etc/init.d -type f -print | xargs grep LD_LIBRARY_PATH
        pattern:
          operation: pattern match
          datatype: string
          value: .*
      object_title: find /etc/rc* /etc/init.d -type f -print | xargs grep LD_LIBRARY_PATH
  states:
    state-no-line-should-start-with-a-semicolon:
      state_title: No line should start with a semicolon
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: ^(?!;).*$
          operation: pattern match
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
    state-no-line-should-include-a-double-semicolon:
      state_title: No line should include a double semicolon
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: ^(?!;;).*$
          operation: pattern match
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
    state-all-lines-should-start-with-a-for-a-valid-path:
      state_title: All lines should start with a / for a valid path
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: ^/
          operation: pattern match
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
    state-no-line-should-have-a-alpahnum-character-after-a-paths-m:
      state_title: No line should have a alpahnum character after a ; (paths must start with /)
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: ^(?!.*;[a-zA-Z0-9];).*$
          operation: pattern match
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
    state-stdout-line-is-empty:
      state_title: stdout_line is empty
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: ''
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: none_exist
  tests:
    test-run-control-scripts-library-search-paths-not-start-semicolon:
      test_title: Run control scripts library search paths must not start with a semicolon
      capability: independent.shellcommand
      object: find-etc-rc-etc-init-d-type-f-print-xargs-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-no-line-should-start-with-a-semicolon
    test-run-control-scripts-library-search-paths-not-contain-double-semicolon:
      test_title: Run control scripts library search paths must not contain a double semicolon
      capability: independent.shellcommand
      object: find-etc-rc-etc-init-d-type-f-print-xargs-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-no-line-should-include-a-double-semicolon
    test-run-control-scripts-library-search-paths-start-valid-path:
      test_title: Run control scripts library search paths must start with a / for a valid path
      capability: independent.shellcommand
      object: find-etc-rc-etc-init-d-type-f-print-xargs-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-all-lines-should-start-with-a-for-a-valid-path
    test-run-control-scripts-library-search-not-have-alpahnum-character-after:
      test_title: Run control scripts library search must not have a alpahnum character after a ; (paths must start with /)
      capability: independent.shellcommand
      object: find-etc-rc-etc-init-d-type-f-print-xargs-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-no-line-should-have-a-alpahnum-character-after-a-paths-m
    test-run-control-scripts-search-path-empty:
      test_title: Run control scripts search path is empty
      capability: independent.shellcommand
      object: find-etc-rc-etc-init-d-type-f-print-xargs-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-stdout-line-is-empty
  evaluate:
    any:
    - all:
      - test: test-run-control-scripts-library-search-paths-not-start-semicolon
      - test: test-run-control-scripts-library-search-paths-not-contain-double-semicolon
      - test: test-run-control-scripts-library-search-paths-start-valid-path
      - test: test-run-control-scripts-library-search-not-have-alpahnum-character-after
    - test: test-run-control-scripts-search-path-empty
