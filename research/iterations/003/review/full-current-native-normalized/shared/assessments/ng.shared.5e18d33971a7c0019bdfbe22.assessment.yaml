assessment:
  id: ng.shared.5e18d33971a7c0019bdfbe22
  version: 1
  assessment_title: Name-Release Attacks
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Services\Netbt\Parameters
        name:
          operation: equals
          datatype: string
          mask: false
          value: NoNameReleaseOnDemand
      object_title: null
  variables:
    mss-nonamereleaseondemand-allow-computer-ignore-netbios-name-release-requests-except-variable:
      title: 'MSS: (NoNameReleaseOnDemand) Allow computer to ignore NetBIOS name release requests except from WINS servers'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: no_name_release_on_demand_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: mss-nonamereleaseondemand-allow-computer-ignore-netbios-name-release-requests-except-variable
          operation: equals
          datatype: int
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-mss-nonamereleaseondemand-allow-computer-ignore-netbios-name-release-requests-except:
      test_title: '''MSS: (NoNameReleaseOnDemand) Allow computer to ignore NetBIOS name release requests except from WINS
        servers'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-mss-nonamereleaseondemand-allow-computer-ignore-netbios-name-release-requests-except
