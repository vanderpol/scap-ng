assessment:
  id: ng.shared.2b8dcccf9a803fd3146eca83
  version: 1
  assessment_title: The operating system must limit the number of concurrent sessions for each account to an organization-defined
    number of sessions.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Identify the organizational requirements for maximum number of sessions and which users must be restricted.
    If there are no requirements to limit concurrent sessions, this item does not apply. For each user requiring concurrent
    session restrictions, determine if that user is in the user.[username] project where [username] is the user''s account
    username. # projects [username] | grep user If the output does not include the project user.[username], this is a finding.
    Determine the project membership for the user. # projects [username] If the user is a member of any project other than
    default, group.[groupname], or user.[username], this is a finding. Determine whether the max-tasks resource control is
    enabled properly. # projects -l user.[username] | grep attribs If the output does not include the text: attribs: project.max-tasks=(privileged,[MAX],deny)
    where [MAX] is the organization-defined maximum number of concurrent sessions, this is a finding.'
  inputs: {}
  evidence: []
