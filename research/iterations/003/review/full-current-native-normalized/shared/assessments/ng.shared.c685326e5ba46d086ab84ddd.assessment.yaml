assessment:
  id: ng.shared.c685326e5ba46d086ab84ddd
  version: 1
  assessment_title: The systems physical devices must not be assigned to non-global zones.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This check applies to the global zone only. Determine the zone that you are currently securing. # zonename If
    the command output is "global", this check applies. List the non-global zones on the system. # zoneadm list -vi | grep
    -v global List the configuration for each zone. # zonecfg -z [zonename] info | grep dev Check for device lines. If such
    a line exists and is not approved by security, this is a finding.'
  inputs: {}
  evidence: []
