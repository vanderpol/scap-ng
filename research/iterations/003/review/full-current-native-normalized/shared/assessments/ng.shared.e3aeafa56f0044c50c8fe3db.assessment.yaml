assessment:
  id: ng.shared.e3aeafa56f0044c50c8fe3db
  version: 1
  assessment_title: Ubuntu 20.04 LTS must restrict privilege elevation to authorized personnel.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    check-if-etc-sudoers-has-line-that-includes-all-all-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/sudoers
        pattern:
          operation: pattern match
          datatype: string
          value: ^([^#\n]+)
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      filters:
      - action: include
        state: state-filter-out-all-but-include-all-all-all-all-and-all-all-a
      behaviors:
        ignore_case: 'false'
        multiline: 'true'
        singleline: 'false'
      object_title: check if /etc/sudoers has line that includes ALL  ALL=(ALL) ALL and ALL ALL=(ALL:ALL) ALL
    check-if-file-in-etc-sudoers-d-that-include-all-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/sudoers.d
        filename:
          operation: pattern match
          datatype: string
          value: .*
        pattern:
          operation: pattern match
          datatype: string
          value: ^([^#\n]+)
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      filters:
      - action: include
        state: state-filter-out-all-but-include-all-all-all-all-and-all-all-a
      behaviors:
        ignore_case: 'false'
        multiline: 'true'
        singleline: 'false'
      object_title: check if file in /etc/sudoers.d that Include ALL  ALL=(ALL) ALL and ALL ALL=(ALL:ALL) ALL
  states:
    state-filter-out-all-but-include-all-all-all-all-and-all-all-a:
      state_title: Filter out all but - Include ALL  ALL=(ALL) ALL and ALL ALL=(ALL:ALL) ALL
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^\s*ALL\s+ALL=\(ALL(?:\:ALL){0,1}\)\s+ALL\s*
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-etc-sudoers-not-contain-all-all-all-all-or-all:
      test_title: '/etc/sudoers must not contain: ALL     ALL=(ALL) ALL ,  or: ALL     ALL=(ALL:ALL) ALL'
      capability: independent.textfilecontent54
      object: check-if-etc-sudoers-has-line-that-includes-all-all-object
      check_existence: none_exist
      check: all
    test-etc-sudoers-d-not-contain-file-all-all-all-all:
      test_title: '/etc/sudoers.d must not contain a file with: ALL     ALL=(ALL) ALL  or: ALL     ALL=(ALL:ALL) ALL'
      capability: independent.textfilecontent54
      object: check-if-file-in-etc-sudoers-d-that-include-all-object
      check_existence: none_exist
      check: all
  evaluate:
    all:
    - test: test-etc-sudoers-not-contain-all-all-all-all-or-all
    - test: test-etc-sudoers-d-not-contain-file-all-all-all-all
