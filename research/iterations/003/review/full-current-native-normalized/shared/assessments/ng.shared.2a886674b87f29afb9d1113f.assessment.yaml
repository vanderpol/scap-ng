assessment:
  id: ng.shared.2a886674b87f29afb9d1113f
  version: 1
  assessment_title: AZLX-23-002285 - Amazon Linux 2023 library directories must have mode "755" or less permissive.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    all-group-writable-system-wide-library-directories-collection:
      collection_title: All group-writable system-wide library directories
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: only one
          value:
            variable: system-wide-shared-library-files-directories-variable
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
      filters:
      - action: include
        match:
          field: type
          value: directory
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        capability: unix.file
      - action: exclude
        match:
          field: gwrite
          value: 'false'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: Not group-writable
        capability: unix.file
      behaviors:
        recurse_direction: down
    all-world-writable-system-wide-library-directories-collection:
      collection_title: All world-writable system-wide library directories
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: only one
          value:
            variable: system-wide-shared-library-files-directories-variable
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
      filters:
      - action: include
        match:
          field: type
          value: directory
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        capability: unix.file
      - action: exclude
        match:
          field: owrite
          value: 'false'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: Not world-writable
        capability: unix.file
      behaviors:
        recurse_direction: down
  variables:
    system-wide-shared-library-files-directories-variable:
      title: system-wide shared library files directories
      kind: constant
      datatype: string
      expression:
        literal:
        - /lib
        - /lib64
        - /usr/lib
        - /usr/lib64
  tests:
    test-no-group-writable-library-directories-exist:
      test_title: No group-writable library directories exist.
      capability: unix.file
      collection: all-group-writable-system-wide-library-directories-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
    test-no-world-writable-library-directories-exist:
      test_title: No world-writable library directories exist.
      capability: unix.file
      collection: all-world-writable-system-wide-library-directories-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
  evaluate:
    all:
    - test: test-no-group-writable-library-directories-exist
    - test: test-no-world-writable-library-directories-exist
