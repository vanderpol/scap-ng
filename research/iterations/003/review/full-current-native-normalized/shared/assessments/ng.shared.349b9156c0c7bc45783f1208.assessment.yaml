assessment:
  id: ng.shared.349b9156c0c7bc45783f1208
  version: 1
  assessment_title: Generic Security Services (GSS) must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    svcs-svc-network-ipsec-policy-default-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: svcs -Ho state svc:/network/rpc/gss
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
      object_title: svcs svc:/network/ipsec/policy:default
  states:
    state-check-that-the-output-does-not-report-online-and-has-an-:
      state_title: Check that the output does not report 'online' and has an exit status of 0
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: ^(?!.*online).*$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-generic-security-services-gss-disabled:
      test_title: Generic Security Services (GSS) must be disabled.
      capability: independent.shellcommand
      object: svcs-svc-network-ipsec-policy-default-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-check-that-the-output-does-not-report-online-and-has-an-
  evaluate:
    test: test-generic-security-services-gss-disabled
