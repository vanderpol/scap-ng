assessment:
  id: ng.shared.f21ab046511aa95f632c904d
  version: 1
  assessment_title: WN10-AU-000582 - Windows 10 must be configured to audit file system successes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-file-system-is-set-to-success:
      state_title: '''File System'' is set to ''Success'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: file_system
        value: AUDIT_SUCCESS
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-file-system-is-set-to-success-and-failure:
      state_title: '''File System'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: file_system
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-file-system-set-success:
      test_title: '''Audit File System'' is set to ''Success'''
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-file-system-is-set-to-success
    test-audit-file-system-set-success-failure:
      test_title: '''Audit File System'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-file-system-is-set-to-success-and-failure
  evaluate:
    any:
    - test: test-audit-file-system-set-success
    - test: test-audit-file-system-set-success-failure
