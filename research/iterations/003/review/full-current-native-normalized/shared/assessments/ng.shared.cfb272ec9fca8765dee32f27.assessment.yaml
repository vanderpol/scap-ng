assessment:
  id: ng.shared.cfb272ec9fca8765dee32f27
  version: 1
  assessment_title: Enable GNOME3 Screensaver Lock After Idle Period
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-rpminfo-collection:
      collection_title: null
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: dconf
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/dconf/profile/user
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^user-db:user\nsystem-db:local$
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
    independent-textfilecontent54-collection-2:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/dconf/db/
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[0-9].*$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\[org/gnome/desktop/screensaver\]([^\n]*\n+)+?lock-enabled\s*=\s*true\s*$
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
      behaviors:
        multiline: 'true'
        max_depth: '1'
        recurse_direction: down
  tests:
    test-package-dconf-installed:
      test_title: package dconf is installed
      capability: linux.rpminfo
      collection: linux-rpminfo-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state: null
    test-dconf-user-profile-exists:
      test_title: dconf user profile exists
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state: null
    test-screensaver-lock-enabled:
      test_title: screensaver lock is enabled
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection-2
      assertion:
        existence: all_exist
        item_quantifier: all
        state: null
  evaluate:
    any:
    - not:
        test: test-package-dconf-installed
    - all:
      - any:
        - not:
            test: test-package-dconf-installed
        - test: test-dconf-user-profile-exists
      - test: test-screensaver-lock-enabled
