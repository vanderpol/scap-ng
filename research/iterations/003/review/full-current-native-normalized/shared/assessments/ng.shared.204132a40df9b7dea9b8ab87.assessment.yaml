assessment:
  id: ng.shared.204132a40df9b7dea9b8ab87
  version: 1
  assessment_title: The Oracle Linux operating system must display the date and time of the last successful account logon
    upon an SSH logon.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify SSH provides users with feedback on when account accesses last occurred. Check that "PrintLastLog" keyword
    in the sshd daemon configuration file is used and set to "yes" with the following command: # grep -i printlastlog /etc/ssh/sshd_config
    PrintLastLog yes If the "PrintLastLog" keyword is set to "no", is missing, or is commented out, this is a finding.'
  inputs: {}
  evidence: []
