assessment:
  id: ng.shared.119602c0b8c5b7355032a09f
  version: 1
  assessment_title: The Oracle Linux operating system must generate audit records for all account creations, modifications,
    disabling, and termination events that affect /etc/group.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system must generate audit records for all account creations, modifications, disabling,
    and termination events that affect "/etc/group". Check the auditing rules in "/etc/audit/audit.rules" with the following
    command: # grep /etc/group /etc/audit/audit.rules -w /etc/group -p wa -k identity If the command does not return a line,
    or the line is commented out, this is a finding.'
  inputs: {}
  evidence: []
