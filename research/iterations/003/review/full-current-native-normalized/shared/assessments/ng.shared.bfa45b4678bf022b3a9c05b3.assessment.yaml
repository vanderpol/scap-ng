          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-audit-system-configured-audit-account-creation:
      test_title: The audit system must be configured to audit account creation.
      capability: independent.shellcommand
      object: auditconfig-t-getflags-cut-f2-d-object
      check_existence: at_least_one_exists
      check: all
      state_operator: AND
      states:
      - state-cusa-is-returned-in-the-output
      - state-fm-is-returned-in-the-output
      - state-fd-is-returned-in-the-output
      - state-fa-is-returned-in-the-output
      - state-ps-is-returned-in-the-output
      - state-ex-is-returned-in-the-output
    test-active-audit-policy-includes-arg:
      test_title: The active audit policy includes arg
      capability: independent.shellcommand
      object: auditconfig-getpolicy-filter-on-active-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-argv-is-returned-in-the-output
  evaluate:
    all:
    - test: test-audit-system-configured-audit-account-creation
    - test: test-active-audit-policy-includes-arg
