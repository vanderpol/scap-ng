assessment:
  id: ng.shared.bfa45b4678bf022b3a9c05b3
  version: 1
  assessment_title: The audit system must be configured to audit the loading and unloading of dynamic kernel modules.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    auditconfig-t-getflags-cut-f2-d-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: auditconfig -t -getflags | cut -f2 -d=
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
      object_title: auditconfig -t -getflags | cut -f2 -d=
    auditconfig-getpolicy-filter-on-active-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: auditconfig -getpolicy
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: active
      object_title: auditconfig -getpolicy and filter on active
  states:
    state-cusa-is-returned-in-the-output:
      state_title: cusa is returned in the output
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: cusa
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    state-fm-is-returned-in-the-output:
      state_title: fm is returned in the output
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: fm
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    state-fd-is-returned-in-the-output:
      state_title: fd is returned in the output
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: fd
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    state-fa-is-returned-in-the-output:
      state_title: -fa is returned in the output
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: -fa
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    state-ps-is-returned-in-the-output:
      state_title: -ps is returned in the output
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
