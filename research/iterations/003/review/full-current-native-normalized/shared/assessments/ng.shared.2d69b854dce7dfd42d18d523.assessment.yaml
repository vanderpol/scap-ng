assessment:
  id: ng.shared.2d69b854dce7dfd42d18d523
  version: 1
  assessment_title: The system must disable ICMP redirect messages.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    ipadm-show-prop-p-send-redirects-co-current-ipv4-collection:
      collection_title: ipadm show-prop -p send_redirects -co current ipv4
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: ipadm show-prop -p send_redirects -co current ipv4
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
    ipadm-show-prop-p-send-redirects-co-current-ipv6-collection:
      collection_title: ipadm show-prop -p send_redirects -co current ipv6
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: ipadm show-prop -p send_redirects -co current ipv6
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
  tests:
    test-system-disable-ipv4-icmp-redirect-messages:
      test_title: The system must disable ipv4 ICMP redirect messages.
      capability: independent.shellcommand
      collection: ipadm-show-prop-p-send-redirects-co-current-ipv4-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Check that line returns 'off' with an exit status of 0
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: 'off'
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-system-disable-ipv6-icmp-redirect-messages:
      test_title: The system must disable ipv6 ICMP redirect messages..
      capability: independent.shellcommand
      collection: ipadm-show-prop-p-send-redirects-co-current-ipv6-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Check that line returns 'off' with an exit status of 0
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: 'off'
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-system-disable-ipv4-icmp-redirect-messages
    - test: test-system-disable-ipv6-icmp-redirect-messages
