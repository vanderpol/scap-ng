assessment:
  id: ng.shared.5a733b3c2532848bdc6f1e46
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that the cron.allow file, if it exists, is group-owned
    by root.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that the "cron.allow" file is group-owned by root. Check the group owner of the "cron.allow" file with
    the following command: # ls -al /etc/cron.allow -rw------- 1 root root 6 Mar 5 2011 /etc/cron.allow If the "cron.allow"
    file exists and has a group owner other than root, this is a finding.'
  inputs: {}
  evidence: []
