assessment:
  id: ng.shared.830302df5a264fb74831fedc
  version: 1
  assessment_title: Software certificate installation files must be removed from Windows 2012/2012 R2.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Search all drives for *.p12 and *.pfx files. If any files with these extensions exist, this is a finding. This
    does not apply to server-based applications that have a requirement for certificate files or Adobe PreFlight certificate
    files. Some applications create files with extensions of .p12 that are not certificate installation files. Removal of
    non-certificate installation files from systems is not required. These must be documented with the ISSO.
  inputs: []
  evidence: []
