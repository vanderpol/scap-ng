  version: 1
  assessment_title: Users must not be presented with Privacy and Installation options on first use of Windows Media Player.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Windows Media Player is not installed by default. If it is not installed, this is NA. If the following registry
    value does not exist or is not configured as specified, this is a finding: Registry Hive: HKEY_LOCAL_MACHINE Registry
    Path: \Software\Policies\Microsoft\WindowsMediaPlayer\ Value Name: GroupPrivacyAcceptance Type: REG_DWORD Value: 1'
  inputs: {}
