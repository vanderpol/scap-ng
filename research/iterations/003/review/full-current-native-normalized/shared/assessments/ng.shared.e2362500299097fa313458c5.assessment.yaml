assessment:
  id: ng.shared.e2362500299097fa313458c5
  version: 1
  assessment_title: AZLX-23-000135 - Amazon Linux 2023 systemd-journald service must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-systemdunitproperty-object:
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          mask: false
          value: systemd-journald.service
        property:
          operation: equals
          datatype: string
          mask: false
          value: ActiveState
      object_title: null
  states:
    state-linux-systemdunitproperty:
      state_title: null
      capability: linux.systemdunitproperty
      state:
        field: value
        value: active
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-systemd-journald-service-active:
      test_title: The systemd-journald service is active.
      capability: linux.systemdunitproperty
      object: linux-systemdunitproperty-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-linux-systemdunitproperty
  evaluate:
    test: test-systemd-journald-service-active
