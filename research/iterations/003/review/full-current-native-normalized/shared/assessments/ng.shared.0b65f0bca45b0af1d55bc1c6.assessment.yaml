assessment:
  id: ng.shared.0b65f0bca45b0af1d55bc1c6
  version: 1
  assessment_title: SNMP default communities disabled
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-rpminfo-collection:
      collection_title: null
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: net-snmp
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/snmp/snmpd.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[\s]*(com2se|rocommunity|rwcommunity|createUser|authcommunity)[^#]*(public|private)
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
        multiline: 'true'
  tests:
    test-package-net-snmp-removed:
      test_title: package net-snmp is removed
      capability: linux.rpminfo
      collection: linux-rpminfo-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
    test-check-snmpd-configuration:
      test_title: Check snmpd configuration
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
  evaluate:
    any:
    - test: test-package-net-snmp-removed
    - test: test-check-snmpd-configuration
