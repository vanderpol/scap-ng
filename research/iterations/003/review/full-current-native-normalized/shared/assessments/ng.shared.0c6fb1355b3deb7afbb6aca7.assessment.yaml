assessment:
  id: ng.shared.0c6fb1355b3deb7afbb6aca7
  version: 1
  assessment_title: Ensure YUM Removes Previous Package Versions
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    clean-requirements-on-remove-set-in-etc-yum-conf-collection:
      collection_title: clean_requirements_on_remove set in /etc/yum.conf
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/yum.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*clean_requirements_on_remove\s*=\s*(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-check-value-clean-requirements-on-remove-in-etc-yum-conf:
      test_title: check value of clean_requirements_on_remove in /etc/yum.conf
      capability: independent.textfilecontent54
      collection: clean-requirements-on-remove-set-in-etc-yum-conf-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: clean_requirements_on_remove enabled
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^(1|True|yes)$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-check-value-clean-requirements-on-remove-in-etc-yum-conf
