assessment:
  id: ng.shared.9b310a50670ac0d5b438aad0
  version: 1
  assessment_title: UBTU-22-232035 - Ubuntu 22.04 LTS must configure audit tools with a mode of "755" or less permissive.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    audit-tools-object-2:
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: audit-tools-variable
      object_title: audit tools
    unix-file-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /sbin
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: audisp.*
      object_title: null
    audit-tools-object:
      capability: unix.file
      set:
        operator: union
        members:
        - object: audit-tools-object-2
        - object: unix-file-object
      object_title: audit tools
  variables:
    audit-tools-variable:
      title: audit tools
      kind: constant
      datatype: string
      expression:
        literal:
        - /sbin/auditctl
        - /sbin/aureport
        - /sbin/ausearch
        - /sbin/autrace
        - /sbin/auditd
        - /sbin/augenrules
  states:
    state-mode-0755-or-less-permissive:
      state_title: mode 0755 or less permissive
      capability: unix.file
      state:
        all:
        - field: suid
          value: 'false'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: sgid
          value: 'false'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: sticky
          value: 'false'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: gwrite
          value: 'false'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: owrite
          value: 'false'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-audit-tools-have-mode-0755-or-less-permissive:
      test_title: audit tools have a mode of 0755 or less permissive.
      capability: unix.file
      object: audit-tools-object
      check_existence: any_exist
      check: all
      states:
      - state-mode-0755-or-less-permissive
  evaluate:
    test: test-audit-tools-have-mode-0755-or-less-permissive
