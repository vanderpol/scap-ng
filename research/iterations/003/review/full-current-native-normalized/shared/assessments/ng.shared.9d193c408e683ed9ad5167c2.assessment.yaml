assessment:
  id: ng.shared.9d193c408e683ed9ad5167c2
  version: 1
  assessment_title: WN19-DC-000330 - Windows Server 2019 domain controllers must be configured to allow reset of machine account
    passwords.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: case insensitive equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: case insensitive equals
          datatype: string
          value: SYSTEM\CurrentControlSet\Services\Netlogon\Parameters
        name:
          operation: case insensitive equals
          datatype: string
          value: RefusePasswordChange
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-domain-controller-refuse-machine-account-password-changes-set-disabled:
      test_title: '''Domain controller: Refuse machine account password changes'' is set to ''Disabled''.'
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-domain-controller-refuse-machine-account-password-changes-set-disabled
