assessment:
  id: ng.shared.0c767fa177845048f01f7321
  version: 1
  assessment_title: The macOS system must prevent AdminHostInfo from being available at LoginWindow.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-loginwindow-adminhostinfo-undefined-recommended-object-collection:
      collection_title: os_loginwindow_adminhostinfo_undefined_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.loginwindow'')\

            .objectIsForcedForKey(''AdminHostInfo'')

            EOS'
  tests:
    test-os-loginwindow-adminhostinfo-undefined-recommended-test:
      test_title: os_loginwindow_adminhostinfo_undefined_recommended_test
      capability: independent.shellcommand
      collection: os-loginwindow-adminhostinfo-undefined-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: os_loginwindow_adminhostinfo_undefined_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: 'false'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-os-loginwindow-adminhostinfo-undefined-recommended-test
