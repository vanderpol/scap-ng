assessment:
  id: ng.shared.8dcd5b14bb3df11f5d2070a2
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that the delay between logon prompts following
    a failed console logon attempt is at least four seconds.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system enforces a delay of at least four seconds between console logon prompts following
    a failed logon attempt. Check the value of the "fail_delay" parameter in the "/etc/login.defs" file with the following
    command: # grep -i fail_delay /etc/login.defs FAIL_DELAY 4 If the value of "FAIL_DELAY" is not set to "4" or greater,
    or the line is commented out, this is a finding.'
  inputs: []
  evidence: []
