assessment:
  id: ng.shared.226c015c3a8415f836f84a8e
  version: 1
  assessment_title: The operating system must provide the capability for users to directly initiate session lock mechanisms.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Determine whether the lock screen function works correctly. For Solaris 11, 11.1, 11.2, and 11.3: In the GNOME
    2 desktop System >> Lock Screen. For Solaris 11.4 or newer: In the GNOME 3 desktop Status Menu (top right corner) >> Lock
    Icon, check that the screen locks and displays the "password" prompt. Check that "Disable Screensaver" is not selected
    in the GNOME Screensaver preferences. If the screen does not lock or the "Disable Screensaver" option is selected, this
    is a finding.'
  inputs: []
  evidence: []
