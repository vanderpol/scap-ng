assessment:
  id: ng.shared.7fb3053547efeb709ec1a054
  version: 1
  assessment_title: The macOS system must disable Network File System (NFS) service.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-nfsd-disable-recommended-object-collection:
      collection_title: os_nfsd_disable_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: "isDisabled=$(/sbin/nfsd status | /usr/bin/awk '/nfsd service/ {print $NF}')    \nif [[ \"$isDisabled\" ==\
            \ \"disabled\" ]] && [[ -z $(/usr/bin/pgrep nfsd) ]]; then\n  echo \"pass\"\nelse\n  echo \"fail\"\nfi"
  tests:
    test-os-nfsd-disable-recommended-test:
      test_title: os_nfsd_disable_recommended_test
      capability: independent.shellcommand
      collection: os-nfsd-disable-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: os_nfsd_disable_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: pass
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-os-nfsd-disable-recommended-test
