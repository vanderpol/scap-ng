assessment:
  id: ng.shared.87a29143a37c5ab9b2e3ddd2
  version: 1
  assessment_title: UBTU-22-651020 - Ubuntu 22.04 LTS must notify designated personnel if baseline configurations are changed
    in an unauthorized manner. The file integrity tool must notify the system administrator when changes to the baseline configuration
    or anomalies in the operation of any security functions are discovered.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/default/aide
        pattern:
          operation: pattern match
          datatype: string
          value: (?i)^\s*SILENTREPORTS\s*=\s*(\w+)\s*(?:#.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^(no|"no")$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-etc-default-aide-silentreports-no:
      test_title: '/etc/default/aide: SILENTREPORTS=no'
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    test: test-etc-default-aide-silentreports-no
