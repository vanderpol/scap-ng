assessment:
  id: ng.shared.110f63c45959a134f7cd7b99
  version: 1
  assessment_title: OL08-00-010570 - OL 8 must prevent files with the setuid and setgid bit set from being executed on file
    systems that contain user home directories.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-partition-collection:
      collection_title: null
      capability: linux.partition
      select:
        mount_point:
          operation: pattern match
          datatype: string
          mask: false
          value: .*\/home
  tests:
    test-home-mounted-nosuid-option:
      test_title: /home is mounted with the nosuid option.
      capability: linux.partition
      collection: linux-partition-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: linux.partition
        state:
          field: mount_options
          value: nosuid
          operation: equals
          datatype: string
          mask: false
          entity_check: at least one
          entity_existence: at_least_one_exists
  evaluate:
    test: test-home-mounted-nosuid-option
