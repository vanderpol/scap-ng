  assessment_title: The macOS system must disable root logon for SSH.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable root login for SSH with the following command: /usr/sbin/sshd
    -G | /usr/bin/awk ''/permitrootlogin/{print $2}'' If the result is not "no", this is a finding.'
  inputs: []
  evidence: []
