assessment:
  id: ng.shared.77dc93f978a93a43e5be151d
  version: 1
  assessment_title: CNTR-K8-000860 - The Kubernetes manifests must be owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    all-manifest-files-in-etc-kubernetes-manifests-collection:
      collection_title: All manifest files in /etc/kubernetes/manifests/*
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/kubernetes/manifests
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .+
  tests:
    test-check-etc-kubernetes-manifests-that-every-manifest-file-user-group:
      test_title: Check /etc/kubernetes/manifests/* that every manifest file is user and group owned by root
      capability: unix.file
      collection: all-manifest-files-in-etc-kubernetes-manifests-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: File is owned and group owned by root
        state_capability: unix.file
        state:
          all:
          - field: group_id
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: user_id
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-check-etc-kubernetes-manifests-that-every-manifest-file-user-group
