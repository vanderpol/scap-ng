  assessment_title: The macOS system must disable Airplay Receiver.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable Airplay Receiver with the following command: /usr/bin/osascript
    -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\ .objectForKey(''allowAirPlayIncomingRequests'').js
    EOS If the result is not "false", this is a finding.'
