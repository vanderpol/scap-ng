assessment:
  id: ng.shared.a5324a672b295286787e42f4
  version: 1
  assessment_title: UBTU-18-010139 - The Ubuntu operating system must have system commands set to a mode of 0755 or less permissive.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    all-files-in-system-command-directories-collection:
      collection_title: All files in system command directories
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: system-command-directories-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
    all-files-in-system-command-directories-less-symbolic-links-collection:
      collection_title: All files in system command directories, less symbolic links
      capability: unix.file
      set:
        operator: union
        members:
        - collection: all-files-in-system-command-directories-collection
        filters:
        - action: exclude
          match:
            field: type
            value: symbolic link
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: symbolic links
          capability: unix.file
  variables:
    system-command-directories-variable:
      title: system command directories
      kind: constant
      datatype: string
      expression:
        literal:
        - /bin
        - /sbin
        - /usr/bin
        - /usr/sbin
        - /usr/local/bin
        - /usr/local/sbin
  tests:
    test-system-command-files-have-mode-755-or-less-permissive:
      test_title: System command files have mode 755 or less permissive
      capability: unix.file
      collection: all-files-in-system-command-directories-less-symbolic-links-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: Mode 755 or less permissive
        state_capability: unix.file
        state:
          all:
          - field: gwrite
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: owrite
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-system-command-files-have-mode-755-or-less-permissive
