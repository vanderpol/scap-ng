assessment:
  id: ng.shared.9d26156d62fbe076fd533353
  version: 1
  assessment_title: The Oracle Linux operating system must immediately notify the System Administrator (SA) and Information
    System Security Officer (ISSO) (at a minimum) when the threshold for the repository maximum audit record storage capacity
    is reached.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system immediately notifies the SA and ISSO (at a minimum) via email when the threshold
    for the repository maximum audit record storage capacity is reached. Check what account the operating system emails when
    the threshold for the repository maximum audit record storage capacity is reached with the following command: # grep -i
    action_mail_acct /etc/audit/auditd.conf action_mail_acct = root If the value of the "action_mail_acct" keyword is not
    set to "root" and other accounts for security personnel, this is a finding.'
  inputs: []
  evidence: []
