  assessment_title: Systems requiring data at rest protections must employ cryptographic mechanisms to prevent unauthorized
    disclosure and modification of the information at rest.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify systems that require additional protections due to factors such as inadequate physical protection or sensitivity
    of the data employ encryption to protect the confidentiality and integrity of all information at rest. If it does not,
    this is a finding.
