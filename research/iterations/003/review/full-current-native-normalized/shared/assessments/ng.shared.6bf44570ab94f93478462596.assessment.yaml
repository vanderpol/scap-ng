assessment:
  id: ng.shared.6bf44570ab94f93478462596
  version: 1
  assessment_title: The macOS system must disable Bluetooth sharing.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    system-settings-bluetooth-sharing-disable-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: 'CURRENT_USER=$(/usr/bin/defaults read /Library/Preferences/com.apple.loginwindow.plist lastUserName)

            /usr/bin/sudo -u "$CURRENT_USER" /usr/bin/defaults -currentHost read com.apple.Bluetooth PrefKeyServicesEnabled'
      object_title: system_settings_bluetooth_sharing_disable_recommended_object
  states:
    state-system-settings-bluetooth-sharing-disable-recommended-st:
      state_title: system_settings_bluetooth_sharing_disable_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: '0'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-settings-bluetooth-sharing-disable-recommended-test:
      test_title: system_settings_bluetooth_sharing_disable_recommended_test
      capability: independent.shellcommand
      object: system-settings-bluetooth-sharing-disable-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-system-settings-bluetooth-sharing-disable-recommended-st
  evaluate:
    test: test-system-settings-bluetooth-sharing-disable-recommended-test
