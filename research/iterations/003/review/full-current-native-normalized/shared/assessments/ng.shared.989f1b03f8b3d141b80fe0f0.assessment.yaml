assessment:
  id: ng.shared.989f1b03f8b3d141b80fe0f0
  version: 1
  assessment_title: Windows Server 2019 must have the roles and features required by the system documented.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Required roles and features will vary based on the function of the individual system. Roles and features specifically
    required to be disabled per the STIG are identified in separate requirements. If the organization has not documented the
    roles and features required for the system(s), this is a finding. The PowerShell command "Get-WindowsFeature | Where-Object
    {$_. installstate -eq "Installed"} | Format-List Displayname, Name, Featuretype" will list all roles and features with
    an "Installed" state.
  inputs: []
  evidence: []
