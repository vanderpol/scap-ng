assessment:
  id: ng.shared.33be8d9dac29b9b7c6a2a259
  version: 1
  assessment_title: The Oracle Linux operating system must not allow an unattended or automatic logon to the system via a
    graphical user interface.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system does not allow an unattended or automatic logon to the system via a graphical user
    interface. Note: If the system does not have GNOME installed, this requirement is Not Applicable. Check for the value
    of the "AutomaticLoginEnable" in the "/etc/gdm/custom.conf" file with the following command: # grep -i automaticloginenable
    /etc/gdm/custom.conf AutomaticLoginEnable=false If the value of "AutomaticLoginEnable" is not set to "false", this is
    a finding.'
  inputs: {}
  evidence: []
