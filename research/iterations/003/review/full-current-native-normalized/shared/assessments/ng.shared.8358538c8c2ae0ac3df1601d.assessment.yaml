assessment:
  id: ng.shared.8358538c8c2ae0ac3df1601d
  version: 1
  assessment_title: The Ubuntu Operating system must disable the x86 Ctrl-Alt-Delete key sequence if a graphical user interface
    is installed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the Ubuntu operating system is not configured to reboot the system when Ctrl-Alt-Delete is pressed when
    using a graphical user interface. Check that the "logout" target is not bound to an action with the following command:
    # grep logout /etc/dconf/db/local.d/* logout='''' If the "logout" key is bound to an action, is commented out, or is missing,
    this is a finding.'
  inputs: []
  evidence: []
