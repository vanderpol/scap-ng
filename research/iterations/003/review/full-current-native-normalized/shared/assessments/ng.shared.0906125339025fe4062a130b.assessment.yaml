assessment:
  id: ng.shared.0906125339025fe4062a130b
  version: 1
  assessment_title: AZLX-23-002510 - Amazon Linux 2023 must terminate idle user sessions.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/systemd/logind.conf
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*StopIdleSessionSec\s*=\s*(-?\d*)\s*(?:#.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '600'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-terminates-idle-user-sessions:
      test_title: The system terminates idle user sessions.
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    test: test-system-terminates-idle-user-sessions
