assessment:
  id: ng.shared.16429461e4cef90a04c2a0d6
  version: 1
  assessment_title: Windows Installer - Vendor Signed Updates
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\Windows\Installer
        name:
          operation: equals
          datatype: string
          mask: false
          value: DisableLUAPatching
  variables:
    prohibit-non-administrators-from-applying-vendor-signed-updates-variable:
      title: Prohibit non-administrators from applying vendor signed updates
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: prohibit_non_administrators_install_signed_updates_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-prohibit-non-administrators-from-applying-vendor-signed-updates-set-enabled:
      test_title: '''Prohibit non-administrators from applying vendor signed updates'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: prohibit-non-administrators-from-applying-vendor-signed-updates-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-prohibit-non-administrators-from-applying-vendor-signed-updates-set-enabled
