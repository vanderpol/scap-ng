assessment:
  id: ng.shared.a1de5869e8bb542b157463d0
  version: 1
  assessment_title: UBTU-20-010134 - The Ubuntu operating system must permit only authorized accounts to own the audit configuration
    files.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-file-object:
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/audit/auditd.conf
      object_title: null
    unix-file-object-2:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/audit/rules.d
        filename:
          operation: pattern match
          datatype: string
          value: .rules$
      object_title: null
    unix-file-object-3:
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/audit/audit.rules
      object_title: null
  states:
    state-owned-by-root:
      state_title: owned by root
      capability: unix.file
      state:
        field: user_id
        value: '0'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-etc-audit-auditd-conf-owned-by-root:
      test_title: /etc/audit/auditd.conf are owned by root
      capability: unix.file
      object: unix-file-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-owned-by-root
    test-rules-files-in-etc-audit-rules-d-owned-by-root:
      test_title: .rules files in /etc/audit/rules.d are owned by root
      capability: unix.file
      object: unix-file-object-2
      check_existence: at_least_one_exists
      check: all
      states:
      - state-owned-by-root
    test-etc-audit-audit-rules-owned-by-root:
      test_title: /etc/audit/audit.rules is owned by root
      capability: unix.file
      object: unix-file-object-3
      check_existence: at_least_one_exists
      check: all
      states:
      - state-owned-by-root
  evaluate:
    all:
    - test: test-etc-audit-auditd-conf-owned-by-root
    - test: test-rules-files-in-etc-audit-rules-d-owned-by-root
    - test: test-etc-audit-audit-rules-owned-by-root
