assessment:
  id: ng.shared.db6d7401a4b3f5eb030e4a67
  version: 1
  assessment_title: Set Password Expiration Parameters
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/login.defs
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*PASS_MAX_DAYS\s+(\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  variables:
    maximum-password-age-variable:
      title: Maximum password age
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: var_accounts_maximum_age_login_defs
  tests:
    test-value-pass-max-days-should-set-appropriately-in-etc-login:
      test_title: The value of PASS_MAX_DAYS should be set appropriately in /etc/login.defs
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value:
            variable: maximum-password-age-variable
          operation: less than or equal
          datatype: int
          mask: false
          variable_check: at least one
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-value-pass-max-days-should-set-appropriately-in-etc-login
