assessment:
  id: ng.shared.4dd39c238758101079573044
  version: 1
  assessment_title: The Oracle Linux operating system must be configured to prevent overwriting of custom authentication configuration
    settings by the authconfig utility.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify "system-auth" and "password-auth" files are symbolic links pointing to "system-auth-local" and "password-auth-local":
    $ sudo ls -l /etc/pam.d/{password,system}-auth lrwxrwxrwx. 1 root root 30 Apr 1 11:59 /etc/pam.d/password-auth -> /etc/pam.d/password-auth-local
    lrwxrwxrwx. 1 root root 28 Apr 1 11:59 /etc/pam.d/system-auth -> /etc/pam.d/system-auth-local If system-auth and password-auth
    files are not symbolic links, this is a finding. If system-auth and password-auth are symbolic links but do not point
    to "system-auth-local" and "password-auth-local", this is a finding.'
  inputs: {}
  evidence: []
