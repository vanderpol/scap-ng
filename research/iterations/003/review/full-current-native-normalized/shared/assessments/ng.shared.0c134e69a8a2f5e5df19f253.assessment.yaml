assessment:
  id: ng.shared.0c134e69a8a2f5e5df19f253
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that the x86 Ctrl-Alt-Delete key sequence is disabled
    on the command line.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system is not configured to reboot the system when Ctrl-Alt-Delete is pressed. Check that
    the ctrl-alt-del.target is masked and not active with the following command: # systemctl status ctrl-alt-del.target ctrl-alt-del.target
    Loaded: masked (/dev/null; bad) Active: inactive (dead) If the ctrl-alt-del.target is not masked, this is a finding. If
    the ctrl-alt-del.target is active, this is a finding.'
  inputs: []
  evidence: []
