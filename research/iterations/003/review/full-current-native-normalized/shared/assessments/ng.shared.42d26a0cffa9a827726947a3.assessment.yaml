assessment:
  id: ng.shared.42d26a0cffa9a827726947a3
  version: 1
  assessment_title: The macOS system must generate audit records for all account creations, modifications, disabling, and
    termination events; privileged activities or other system-level access; all kernel module load, unload, and restart actions;
    all program initiations; and organizationally defined events for all nonlocal maintenance and diagnostic sessions.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    audit-flags-ad-configure-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: zsh
        command:
          operation: equals
          datatype: string
          value: /usr/bin/awk -F':' '/^flags/ { print $NF }' /etc/security/audit_control | /usr/bin/tr ',' '\n' | /usr/bin/grep
            -Ec 'ad'
      object_title: audit_flags_ad_configure_recommended_object
  states:
    state-audit-flags-ad-configure-recommended-state:
      state_title: audit_flags_ad_configure_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: '1'
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-flags-ad-configure-recommended-test:
      test_title: audit_flags_ad_configure_recommended_test
      capability: independent.shellcommand
      object: audit-flags-ad-configure-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-audit-flags-ad-configure-recommended-state
  evaluate:
    test: test-audit-flags-ad-configure-recommended-test
