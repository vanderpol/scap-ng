assessment:
  id: ng.shared.25c18f2b71fa0b47a731d850
  version: 1
  assessment_title: 'OL08-00-010020 - OL 8 must implement NIST FIPS-validated cryptography for the following: To provision
    digital signatures, to generate cryptographic hashes, and to protect data requiring data-at-rest protections in accordance
    with applicable federal laws, Executive Orders, directives, policies, regulations, and standards.'
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    proc-sys-crypto-fips-enabled-collection:
      collection_title: /proc/sys/crypto/fips_enabled
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /proc/sys/crypto/fips_enabled
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(\d+)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    boot-grub2-grubenv-kernelopts-collection:
      collection_title: /boot/grub2/grubenv:kernelopts
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /boot/grub2/grubenv
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*kernelopts=[^#]*fips=(\d+)\b
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-fips-enabled-1:
      test_title: fips_enabled == 1
      capability: independent.textfilecontent54
      collection: proc-sys-crypto-fips-enabled-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-boot-grub2-grubenv-kernelopts-contains-fips-1:
      test_title: /boot/grub2/grubenv:kernelopts contains fips=1
      capability: independent.textfilecontent54
      collection: boot-grub2-grubenv-kernelopts-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-fips-enabled-1
    - test: test-boot-grub2-grubenv-kernelopts-contains-fips-1
