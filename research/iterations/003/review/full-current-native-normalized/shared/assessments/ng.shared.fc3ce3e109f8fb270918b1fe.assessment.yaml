assessment:
  id: ng.shared.fc3ce3e109f8fb270918b1fe
  version: 1
  assessment_title: Secure Print Driver Installation
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: System\CurrentControlSet\Control\Print\Providers\LanMan Print Services\Servers
        name:
          operation: equals
          datatype: string
          value: AddPrinterDrivers
      object_title: null
  states:
    state-reg-dword-type-and-value-equals-1:
      state_title: Reg_Dword type and value equals 1
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-devices-prevent-users-from-installing-printer-drivers-set-enabled:
      test_title: '''Devices: Prevent users from installing printer drivers'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-1
  evaluate:
    test: test-devices-prevent-users-from-installing-printer-drivers-set-enabled
