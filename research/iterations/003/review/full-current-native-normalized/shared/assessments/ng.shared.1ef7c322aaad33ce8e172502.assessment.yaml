assessment:
  id: ng.shared.1ef7c322aaad33ce8e172502
  version: 1
  assessment_title: System start-up files must only execute programs owned by a privileged UID or an application.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Determine the programs executed by system start-up files. Determine the ownership of the executed programs.
    # cat /etc/rc* /etc/init.d/* | more Check the ownership of every program executed by the system start-up files. # ls -l
    <executed program> If any executed program is not owned by root, sys, bin, or in rare cases, an application account, this
    is a finding.'
  inputs: []
  evidence: []
