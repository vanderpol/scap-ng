assessment:
  id: ng.shared.098924ab722bb4f6c87057d7
  version: 1
  assessment_title: Audit - System Integrity - Success
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-auditeventpolicysubcategories-collection:
      collection_title: null
      capability: windows.auditeventpolicysubcategories
  tests:
    test-audit-system-integrity-success-only:
      test_title: Audit - System Integrity - Success only
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Audit - System Integrity - Success only
        state_capability: windows.auditeventpolicysubcategories
        state:
          field: system_integrity
          value: AUDIT_SUCCESS
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-audit-system-integrity-success-failure:
      test_title: Audit - System Integrity - Success and Failure
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Audit - System Integrity - Success and Failure
        state_capability: windows.auditeventpolicysubcategories
        state:
          field: system_integrity
          value: AUDIT_SUCCESS_FAILURE
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    any:
    - test: test-audit-system-integrity-success-only
    - test: test-audit-system-integrity-success-failure
