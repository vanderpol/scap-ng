assessment:
  id: ng.shared.e2bb1a0a1bc2e95f342cb894
  version: 1
  assessment_title: The Ubuntu operating system library files must be owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    all-system-library-files-not-owned-by-root-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: only one
          value:
            variable: system-wide-shared-library-files-directories-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: \.so(\.\d+)*$
      filters:
      - action: exclude
        state: state-owned-by-root
      - action: exclude
        state: state-symbolic-links
      - action: exclude
        state: state-unix-file
      behaviors:
        recurse_direction: down
      object_title: All system-library files not owned by root
  variables:
    system-wide-shared-library-files-directories-variable:
      title: system-wide shared library files directories
      kind: constant
      datatype: string
      expression:
        literal:
        - /lib
        - /lib64
        - /usr/lib
        - /usr/lib64
  states:
    state-owned-by-root:
      state_title: owned by root
      capability: unix.file
      state:
        field: user_id
        value: '0'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-symbolic-links:
      state_title: symbolic links
      capability: unix.file
      state:
        field: type
        value: symbolic link
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-unix-file:
      state_title: null
      capability: unix.file
      state:
        field: type
        value: directory
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-library-files-owned-by-root:
      test_title: System Library files are owned by root
      capability: unix.file
      object: all-system-library-files-not-owned-by-root-object
      check_existence: none_exist
      check: all
  evaluate:
    test: test-system-library-files-owned-by-root
