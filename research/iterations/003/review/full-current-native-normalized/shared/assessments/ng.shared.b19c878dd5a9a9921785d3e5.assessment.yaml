  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: x509/name
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54-2:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: (?i)(?:^|\n)[^#]*\btype\s*=\s*"omfwd"
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54-3:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: (?i)(?:^|\n)[^#]*\bStreamDriver\.?AuthMode\s*=\s*"x509/name"
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54-4:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: (?i)(?:^|\n)[^#]*\bStreamDriver\.?AuthMode\b
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-actionsendstreamdriverauthmode-x509-name:
      test_title: ActionSendStreamDriverAuthMode == x509/name
      capability: independent.textfilecontent54
      object: actionsendstreamdriverauthmode-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
    test-streamdriverauthmode-set-x509-name-advanced-syntax:
      test_title: StreamDriverAuthMode is set to x509/name (advanced syntax)
      capability: independent.textfilecontent54
      object: rsyslog-action-all-messages-object
      check_existence: at_least_one_exists
      check: at least one
      state_operator: AND
      states:
      - state-independent-textfilecontent54-2
      - state-independent-textfilecontent54-3
    test-streamdriverauthmode-not-set-in-module-block-advanced-syntax:
      test_title: StreamDriverAuthMode is not set in a module block (advanced syntax)
      capability: independent.textfilecontent54
      object: rsyslog-module-blocks-object
      check_existence: any_exist
      check: none satisfy
      states:
      - state-independent-textfilecontent54-4
  evaluate:
    all:
    - any:
      - test: test-actionsendstreamdriverauthmode-x509-name
      - test: test-streamdriverauthmode-set-x509-name-advanced-syntax
    - test: test-streamdriverauthmode-not-set-in-module-block-advanced-syntax
