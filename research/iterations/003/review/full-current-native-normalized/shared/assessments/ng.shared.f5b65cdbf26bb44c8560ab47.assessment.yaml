assessment:
  id: ng.shared.f5b65cdbf26bb44c8560ab47
  version: 1
  assessment_title: The audit system must identify in which zone an event occurred.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This check applies to the global zone only. Determine the zone that you are currently securing. # zonename If
    the command output is "global", this check applies. List the non-global zones on the system. # zoneadm list -vi | grep
    -v global The Audit Configuration profile is required. Determine whether the "zonename" auditing policy is in effect.
    # pfexec auditconfig -getpolicy | grep active | grep zonename If no output is returned, this is a finding.'
  inputs: {}
  evidence: []
