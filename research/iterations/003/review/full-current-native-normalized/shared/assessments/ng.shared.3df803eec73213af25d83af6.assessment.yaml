assessment:
  id: ng.shared.3df803eec73213af25d83af6
  version: 1
  assessment_title: The system must prevent the root account from directly logging in except from the system console.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    os-information-object:
      capability: unix.uname
      object_title: OS information
    etc-zones-index-object:
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/zones/index
      object_title: /etc/zones/index
    etc-zones-index-global-entry-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/zones/index
        pattern:
          operation: pattern match
          datatype: string
          value: '^global:'
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: /etc/zones/index global entry
    var-share-zones-index-json-object:
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          value: /var/share/zones/index.json
      object_title: /var/share/zones/index.json
    var-share-zones-index-json-path-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /var/share/zones/index.json
        pattern:
          operation: pattern match
          datatype: string
          value: '"path":\s+"/"'
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: /var/share/zones/index.json 'path:/'
    etc-default-login-console-setting-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/default/login
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*CONSOLE=(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: /etc/default/login CONSOLE setting
  states:
    state-11-3-or-less:
      state_title: 11.3 or less.
      capability: unix.uname
      state:
        field: os_version
        value: ^11($|\.[0-3]\b)
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-etc-default-login-console-setting:
      state_title: /etc/default/login CONSOLE setting
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: /dev/console
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-solaris-less-than-11-4:
      test_title: Solaris (less than) 11.4
      capability: unix.uname
      object: os-information-object
      check_existence: all_exist
      check: all
      states:
      - state-11-3-or-less
    test-etc-zones-index-does-not-exist:
      test_title: /etc/zones/index does not exist
      capability: unix.file
      object: etc-zones-index-object
      check_existence: none_exist
      check: all
    test-etc-zones-index-contains-global:
      test_title: /etc/zones/index contains global
      capability: independent.textfilecontent54
      object: etc-zones-index-global-entry-object
      check_existence: at_least_one_exists
      check: all
    test-var-share-zones-index-json-does-not-exist:
      test_title: /var/share/zones/index.json does not exist
      capability: unix.file
      object: var-share-zones-index-json-object
      check_existence: none_exist
      check: all
    test-var-share-zones-index-json-does-not-contain-path:
      test_title: /var/share/zones/index.json does not contain 'path:/'
      capability: independent.textfilecontent54
      object: var-share-zones-index-json-path-object
      check_existence: none_exist
      check: all
    test-etc-default-login-console-dev-console:
      test_title: /etc/default/login CONSOLE=/dev/console
      capability: independent.textfilecontent54
      object: etc-default-login-console-setting-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-etc-default-login-console-setting
  evaluate:
    any:
    - not:
        all:
        - any:
          - not:
              test: test-solaris-less-than-11-4
          - any:
            - test: test-etc-zones-index-does-not-exist
            - test: test-etc-zones-index-contains-global
        - any:
          - test: test-solaris-less-than-11-4
          - any:
            - test: test-var-share-zones-index-json-does-not-exist
            - test: test-var-share-zones-index-json-does-not-contain-path
    - test: test-etc-default-login-console-dev-console
