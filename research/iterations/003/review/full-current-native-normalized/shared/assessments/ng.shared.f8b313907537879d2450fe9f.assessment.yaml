assessment:
  id: ng.shared.f8b313907537879d2450fe9f
  version: 1
  assessment_title: The audit system must produce records containing sufficient information to establish the identity of any
    user/subject associated with the event.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The Audit Configuration profile is required. This check applies to the global zone only. Determine the zone
    to be secured. # zonename If the command output is "global", this check applies. Check the status of the audit system.
    It must be auditing. # pfexec auditconfig -getcond If this command does not report the following, this is a finding. audit
    condition = auditing'
  inputs: []
  evidence: []
