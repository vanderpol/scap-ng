assessment:
  id: ng.shared.62a5594dbac3f22cf9b745e1
  version: 1
  assessment_title: The macOS system must prohibit user installation of software into /users/.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to prohibit user installation of software into /users/ with the following
    command: /usr/bin/osascript -l JavaScript << EOS function run() { let pref1 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess.new'')\
    .objectForKey(''familyControlsEnabled'')) let pathlist = $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess.new'')\
    .objectForKey(''pathBlackList'').js for ( let app in pathlist ) { if ( ObjC.unwrap(pathlist[app]) == "/Users/" && pref1
    == true ){ return("true") } } return("false") } EOS If the result is not "true", this is a finding.'
  inputs: []
  evidence: []
