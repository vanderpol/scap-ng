assessment:
  id: ng.shared.6bf2547492cf20a16b1bc847
  version: 1
  assessment_title: The Service Master Key must be backed up and stored in a secure location that is not on the SQL Server.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Review procedures for and evidence of backup of the Server Service Master Key in the System Security Plan. If
    the procedures or evidence does not exist, this is a finding. If the procedures do not indicate that a backup of the Service
    Master Key is stored in a secure location that is not on the SQL Server, this is a finding. If procedures do not indicate
    access restrictions to the Service Master Key backup, this is a finding.
  inputs: {}
  evidence: []
