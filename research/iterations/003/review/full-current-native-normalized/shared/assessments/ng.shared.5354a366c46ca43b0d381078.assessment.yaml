assessment:
  id: ng.shared.5354a366c46ca43b0d381078
  version: 1
  assessment_title: The macOS system must disable hot corners.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable hot corners with the following command: /usr/bin/profiles -P
    -o stdout | /usr/bin/grep -Ec ''"wvous-bl-corner" = 0|"wvous-br-corner" = 0|"wvous-tl-corner" = 0|"wvous-tr-corner" =
    0'' If the result is not "4", this is a finding.'
  inputs: {}
  evidence: []
