assessment:
  id: ng.shared.789d51e4c07d223e3b13af1c
  version: 1
  assessment_title: CISC-ND-000210 - The Cisco device must be configured to audit all administrator activity.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    iosxe-line-object:
      capability: iosxe.line
      select:
        show_subcommand:
          operation: equals
          datatype: string
          value: show running-config
      object_title: null
    iosxe-global-object:
      capability: iosxe.global
      select:
        global_command:
          operation: equals
          datatype: string
          value: logging userinfo
      object_title: null
  states:
    state-iosxe-line:
      state_title: null
      capability: iosxe.line
      state:
        field: config_line
        value: \narchive\n log config\n(  \S+[^\n]*\n)*  logging enable\n
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-check-archive-log-config-logging-enable:
      test_title: Check for archive - log config - logging enable
      capability: iosxe.line
      object: iosxe-line-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-iosxe-line
    test-logging-userinfo:
      test_title: logging userinfo
      capability: iosxe.global
      object: iosxe-global-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    all:
    - test: test-check-archive-log-config-logging-enable
    - test: test-logging-userinfo
