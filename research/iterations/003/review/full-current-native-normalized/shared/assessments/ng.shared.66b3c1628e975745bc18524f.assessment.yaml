assessment:
  id: ng.shared.66b3c1628e975745bc18524f
  version: 1
  assessment_title: Device Install - Generic Driver Error Report
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\Windows\DeviceInstall\Settings
        name:
          operation: equals
          datatype: string
          mask: false
          value: DisableSendGenericDriverNotFoundToWER
  variables:
    do-not-send-windows-error-report-when-generic-driver-installed-variable:
      title: Do not send a Windows Error Report when a generic driver is installed on a device
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: do_not_send_windows_error_report_when_generic_driver_is_installed_on_device_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-do-not-send-windows-error-report-when-generic-driver-installed:
      test_title: '''Do not send a Windows error report when a generic driver is installed on a device'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: do-not-send-windows-error-report-when-generic-driver-installed-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-do-not-send-windows-error-report-when-generic-driver-installed
