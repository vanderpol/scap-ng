assessment:
  id: ng.shared.b42945e212973a0b68efed9d
  version: 1
  assessment_title: The Smart Card removal option must be configured to Force Logoff or Lock Workstation.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding: Registry
    Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\ Value Name: SCRemoveOption
    Value Type: REG_SZ Value: 1 (Lock Workstation) or 2 (Force Logoff) This can be left not configured or set to "No action"
    on workstations with the following conditions. This must be documented with the ISSO. -The setting cannot be configured
    due to mission needs, or because it interferes with applications. -Policy must be in place that users manually lock workstations
    when leaving them unattended. -The screen saver is properly configured to lock as required.'
  inputs: {}
  evidence: []
