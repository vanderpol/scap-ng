assessment:
  id: ng.shared.3911ce726c4c98f978159236
  version: 1
  assessment_title: UAC - Admin Approval Mode
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: Software\Microsoft\Windows\CurrentVersion\Policies\System
        name:
          operation: equals
          datatype: string
          value: FilterAdministratorToken
      object_title: null
  variables:
    admin-approval-mode-built-in-administrator-account-variable:
      title: Admin Approval Mode for the Built-in Administrator account
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: admin_approval_mode_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: admin-approval-mode-built-in-administrator-account-variable
          operation: equals
          datatype: int
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-user-account-control-admin-approval-mode-built-in-administrator-account:
      test_title: '''User Account Control: Admin Approval Mode for the Built-in Administrator account'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-user-account-control-admin-approval-mode-built-in-administrator-account
