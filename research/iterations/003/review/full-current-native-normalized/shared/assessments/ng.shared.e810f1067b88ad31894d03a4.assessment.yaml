assessment:
  id: ng.shared.e810f1067b88ad31894d03a4
  version: 1
  assessment_title: UBTU-18-010425 - The Ubuntu operating system, for PKI-based authentication, must validate certificates
    by constructing a certification path (which includes status information) to an accepted trust anchor.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    check-what-cert-policy-set-in-etc-pam-pkcs11-pam-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/pam_pkcs11/pam_pkcs11.conf
        pattern:
          operation: pattern match
          datatype: string
          value: ^[\s]*cert_policy[ \t]+=[ \t]+([\w\,"' ]+);\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: Check what cert_policy is set to in /etc/pam_pkcs11/pam_pkcs11.conf
  states:
    state-the-ca-option-is-present-in-the-collected-string:
      state_title: The ca option is present in the collected string
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^["']*ca["']*$|^["']*ca["',\s]|["',\s]ca["',\s]|["',\s]ca["']*$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-check-all-cert-policy-entries-set-ca-option-in-etc:
      test_title: Check all cert_policy entries are set with the ca option in /etc/pam_pkcs11/pam_pkcs11.conf
      capability: independent.textfilecontent54
      object: check-what-cert-policy-set-in-etc-pam-pkcs11-pam-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-the-ca-option-is-present-in-the-collected-string
  evaluate:
    test: test-check-all-cert-policy-entries-set-ca-option-in-etc
