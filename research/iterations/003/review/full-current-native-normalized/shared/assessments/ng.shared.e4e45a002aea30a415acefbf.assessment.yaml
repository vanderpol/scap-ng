assessment:
  id: ng.shared.e4e45a002aea30a415acefbf
  version: 1
  assessment_title: The macOS system must disable Airplay Receiver.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    system-settings-airplay-receiver-disable-recommended-object-collection:
      collection_title: system_settings_airplay_receiver_disable_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\

            .objectForKey(''allowAirPlayIncomingRequests'').js

            EOS'
  tests:
    test-system-settings-airplay-receiver-disable-recommended-test:
      test_title: system_settings_airplay_receiver_disable_recommended_test
      capability: independent.shellcommand
      collection: system-settings-airplay-receiver-disable-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: system_settings_airplay_receiver_disable_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: 'false'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-system-settings-airplay-receiver-disable-recommended-test
