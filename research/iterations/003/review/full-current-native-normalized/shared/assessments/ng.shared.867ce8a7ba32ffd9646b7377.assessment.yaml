assessment:
  id: ng.shared.867ce8a7ba32ffd9646b7377
  version: 1
  assessment_title: Windows Server 2019 "Deny log on locally" user right on domain-joined member servers must be configured
    to prevent access from highly privileged domain accounts and from unauthenticated access on all systems.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This applies to member servers and standalone or nondomain-joined systems. A separate version applies to domain
    controllers. Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy
    >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment. If the
    following accounts or groups are not defined for the "Deny log on locally" user right, this is a finding: Domain Systems
    Only: - Enterprise Admins Group - Domain Admins Group All Systems: - Guests Group For server core installations, run the
    following command: Secedit /Export /Areas User_Rights /cfg c:\path\filename.txt Review the text file. If the following
    SIDs are not defined for the "SeDenyInteractiveLogonRight" user right, this is a finding: Domain Systems Only: S-1-5-root
    domain-519 (Enterprise Admins) S-1-5-domain-512 (Domain Admins) All Systems: S-1-5-32-546 (Guests)'
  inputs: {}
  evidence: []
