assessment:
  id: ng.shared.5e1d1473665a6b4361d56dd5
  version: 1
  assessment_title: The Oracle Linux operating system must use a file integrity tool to verify correct operation of all security
    functions.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that Advanced Intrusion Detection Environment (AIDE) is installed and verifies the correct operation
    of all security functions. Check that the AIDE package is installed with the following command: $ sudo rpm -q aide aide-0.15.1-13.el7.x86_64
    If AIDE is not installed, ask the System Administrator how file integrity checks are performed on the system. If there
    is no application installed to perform integrity checks, this is a finding. If AIDE is installed, check if it has been
    initialized with the following command: $ sudo /usr/sbin/aide --check If the output is "Couldn''t open file /var/lib/aide/aide.db.gz
    for reading", this is a finding.'
  inputs: []
  evidence: []
