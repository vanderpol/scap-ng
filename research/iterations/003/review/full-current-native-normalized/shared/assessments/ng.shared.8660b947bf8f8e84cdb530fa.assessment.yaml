assessment:
  id: ng.shared.8660b947bf8f8e84cdb530fa
  version: 1
  assessment_title: The Oracle Linux operating system must audit all uses of the chage command.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system generates audit records when successful/unsuccessful attempts to use the "chage"
    command occur. Check the file system rule in "/etc/audit/audit.rules" with the following command: $ sudo grep -w "/usr/bin/chage"
    /etc/audit/audit.rules -a always,exit -F path=/usr/bin/chage -F perm=x -F auid>=1000 -F auid!=unset -k privileged-passwd
    If the command does not return any output, this is a finding.'
  inputs: {}
  evidence: []
