assessment:
  id: ng.shared.4be1022891572f3d4d1fa8b5
  version: 1
  assessment_title: UAC - UIAccess Application Elevation
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Microsoft\Windows\CurrentVersion\Policies\System
        name:
          operation: equals
          datatype: string
          mask: false
          value: EnableSecureUIAPaths
  variables:
    only-elevate-uiaccess-applications-that-installed-in-secure-locations-variable:
      title: Only elevate UIAccess applications that are installed in secure locations
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: only_elevate_uiaccess_applications_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-user-account-control-only-elevate-uiaccess-applications-that-installed-in:
      test_title: '''User Account Control: Only elevate UIAccess applications that are installed in secure locations'' is
        set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: only-elevate-uiaccess-applications-that-installed-in-secure-locations-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-user-account-control-only-elevate-uiaccess-applications-that-installed-in
