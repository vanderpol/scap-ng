assessment:
  id: ng.shared.9597a99e24208c9952bd9ec1
  version: 1
  assessment_title: The macOS system must disable Printer Sharing.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    system-settings-printer-sharing-disable-recommended-object-collection:
      collection_title: system_settings_printer_sharing_disable_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/sbin/cupsctl | /usr/bin/grep "_share_printers=0"
  tests:
    test-system-settings-printer-sharing-disable-recommended-test:
      test_title: system_settings_printer_sharing_disable_recommended_test
      capability: independent.shellcommand
      collection: system-settings-printer-sharing-disable-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: system_settings_printer_sharing_disable_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: .*
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-system-settings-printer-sharing-disable-recommended-test
