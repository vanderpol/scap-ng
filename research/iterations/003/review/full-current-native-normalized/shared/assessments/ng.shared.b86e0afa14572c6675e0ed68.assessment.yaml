assessment:
  id: ng.shared.b86e0afa14572c6675e0ed68
  version: 1
  assessment_title: The macOS system must configure install.log retention to 365.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    os-install-log-retention-configure-stig-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/sbin/aslmanager -dd 2>&1 | /usr/bin/awk '/\/var\/log\/install.log$/ {count++} /Processing module com.apple.install/,/Finished/
            { for (i=1;i<=NR;i++) { if ($i == "TTL" && $(i+2) >= 365) { ttl="True" }; if ($i == "MAX") {max="True"}}} END{if
            (count > 1) { print "Multiple config files for /var/log/install, manually remove the extra files"} else if (max
            == "True") { print "all_max setting is configured, must be removed" } if (ttl != "True") { print "TTL not configured"
            } else { print "Yes" }}'
      object_title: os_install_log_retention_configure_stig_object
  states:
    state-os-install-log-retention-configure-stig-state:
      state_title: os_install_log_retention_configure_stig_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: 'Yes'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-os-install-log-retention-configure-stig-test:
      test_title: os_install_log_retention_configure_stig_test
      capability: independent.shellcommand
      object: os-install-log-retention-configure-stig-object-object
      check_existence: all_exist
      check: all
      states:
      - state-os-install-log-retention-configure-stig-state
  evaluate:
    test: test-os-install-log-retention-configure-stig-test
