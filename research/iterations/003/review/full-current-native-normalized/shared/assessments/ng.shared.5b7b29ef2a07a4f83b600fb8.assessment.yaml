assessment:
  id: ng.shared.5b7b29ef2a07a4f83b600fb8
  version: 1
  assessment_title: Systems must employ cryptographic hashes for passwords using the SHA-2 family of algorithms or FIPS 140-2
    approved successors.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    crypt-default-set-collection:
      collection_title: CRYPT_DEFAULT is set
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/security
        filename:
          operation: equals
          datatype: string
          mask: false
          value: policy.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^CRYPT_DEFAULT=(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    crypt-algorithms-allow-set-collection:
      collection_title: CRYPT_ALGORITHMS_ALLOW is set
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/security
        filename:
          operation: equals
          datatype: string
          mask: false
          value: policy.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^CRYPT_ALGORITHMS_ALLOW=(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-crypt-default-set-6:
      test_title: CRYPT_DEFAULT is set to 6
      capability: independent.textfilecontent54
      collection: crypt-default-set-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: CRYPT_DEFAULT is set to 6
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: '6'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-crypt-algorithms-allow-set-5-6:
      test_title: CRYPT_ALGORITHMS_ALLOW is set to 5,6
      capability: independent.textfilecontent54
      collection: crypt-algorithms-allow-set-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: CRYPT_ALGORITHMS_ALLOW is set to 5,6
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: 5,6
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-crypt-default-set-6
    - test: test-crypt-algorithms-allow-set-5-6
