assessment:
  id: ng.shared.a8037a2e7cb72fcf94448ee4
  version: 1
  assessment_title: UBTU-22-653060 - Ubuntu 22.04 LTS must be configured so that the audit log directory is not write-accessible
    by unauthorized users.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/auditd.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*log_file\s*=\s*(\S+)/\S+\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'true'
    audit-log-directory-collection:
      collection_title: Audit log directory
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: audit-data-directory-from-etc-audit-auditd-conf-variable
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
  variables:
    audit-data-directory-from-etc-audit-auditd-conf-variable:
      title: audit data directory from /etc/audit/auditd.conf
      kind: local
      datatype: string
      expression:
        values:
          collection: independent-textfilecontent54-collection
          field: subexpression
  tests:
    test-audit-log-directory-mode-0750-or-less-permissive:
      test_title: Audit log directory is mode 0750 or less permissive
      capability: unix.file
      collection: audit-log-directory-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: mode 0750 or less permissive
        state_capability: unix.file
        state:
          all:
          - field: suid
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: sgid
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: sticky
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: gwrite
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: oread
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: owrite
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: oexec
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-audit-log-directory-mode-0750-or-less-permissive
