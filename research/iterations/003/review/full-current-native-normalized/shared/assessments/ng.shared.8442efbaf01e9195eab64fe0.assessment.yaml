assessment:
  id: ng.shared.8442efbaf01e9195eab64fe0
  version: 1
  assessment_title: Duplicate user names must not exist.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    get-any-duplicate-user-names-collection:
      collection_title: Get any duplicate user names
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: 'getent passwd | awk -F: ''{print $1}'' | uniq -d'
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
  tests:
    test-duplicate-user-names-not-exist:
      test_title: Duplicate user names must not exist.
      capability: independent.shellcommand
      collection: get-any-duplicate-user-names-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Nothing is returned and command exits with a status of 0
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: ''
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: none_exist
  evaluate:
    test: test-duplicate-user-names-not-exist
