assessment:
  id: ng.shared.9bdb975944e992d87441242f
  version: 1
  assessment_title: UBTU-18-010016 - Advance package Tool (APT) must be configured to prevent the installation of patches,
    service packs, device drivers, or Ubuntu operating system components without verification they have been digitally signed
    using a certificate that is recognized and approved by the organization.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    etc-apt-apt-conf-d-allowunauthenticated-setting-collection:
      collection_title: /etc/apt/apt.conf.d/* AllowUnauthenticated setting
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/apt/apt.conf.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\S+::AllowUnauthenticated\s+"true";$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-allowunauthenticaed-s-not-set-true:
      test_title: AllowUnauthenticaed s not set to true
      capability: independent.textfilecontent54
      collection: etc-apt-apt-conf-d-allowunauthenticated-setting-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
  evaluate:
    test: test-allowunauthenticaed-s-not-set-true
