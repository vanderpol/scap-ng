assessment:
  id: ng.shared.f59535901f2c98fa6ee39de1
  version: 1
  assessment_title: The Oracle Linux operating system must display the Standard Mandatory DoD Notice and Consent Banner immediately
    prior to, or as part of, remote access logon prompts.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify any publicly accessible connection to the operating system displays the Standard Mandatory DoD Notice
    and Consent Banner before granting access to the system. Check for the location of the banner file being used with the
    following command: # grep -i banner /etc/ssh/sshd_config banner /etc/issue This command will return the banner keyword
    and the name of the file that contains the ssh banner (in this case "/etc/issue"). If the line is commented out, this
    is a finding. View the file specified by the banner keyword to check that it matches the text of the Standard Mandatory
    DoD Notice and Consent Banner: "You are accessing a U.S. Government (USG) Information System (IS) that is provided for
    USG-authorized use only. By using this IS (which includes any device attached to this IS), you consent to the following
    conditions: -The USG routinely intercepts and monitors communications on this IS for purposes including, but not limited
    to, penetration testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement
    (LE), and counterintelligence (CI) investigations. -At any time, the USG may inspect and seize data stored on this IS.
    -Communications using, or data stored on, this IS are not private, are subject to routine monitoring, interception, and
    search, and may be disclosed or used for any USG-authorized purpose. -This IS includes security measures (e.g., authentication
    and access controls) to protect USG interests--not for your personal benefit or privacy. -Notwithstanding the above, using
    this IS does not constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged
    communications, or work product, related to personal representation or services by attorneys, psychotherapists, or clergy,
    and their assistants. Such communications and work product are private and confidential. See User Agreement for details."
    If the system does not display a graphical logon banner or the banner does not match the Standard Mandatory DoD Notice
    and Consent Banner, this is a finding. If the text in the file does not match the Standard Mandatory DoD Notice and Consent
    Banner, this is a finding.'
  inputs: []
  evidence: []
