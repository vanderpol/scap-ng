assessment:
  id: ng.shared.228bbf1e5b6c9700b63607ee
  version: 1
  assessment_title: The IIS 10.0 web server must maintain the confidentiality of controlled information during transmission
    through the use of an approved Transport Layer Security (TLS) version.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Review the web server documentation and deployed configuration to determine which version of TLS is being used.
    If the TLS version is not TLS 1.2 or higher, according to NIST SP 800-52, or if non-FIPS-approved algorithms are enabled,
    this is a finding.
  inputs: []
  evidence: []
