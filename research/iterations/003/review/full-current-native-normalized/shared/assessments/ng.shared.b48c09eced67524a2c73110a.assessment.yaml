assessment:
  id: ng.shared.b48c09eced67524a2c73110a
  version: 1
  assessment_title: The macOS system must remove password hints from user accounts.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-password-hint-remove-recommended-object-collection:
      collection_title: os_password_hint_remove_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: "HINT=$(/usr/bin/dscl . -list /Users hint | /usr/bin/awk '{ print $2 }')\n\nif [ -z \"$HINT\" ]; then\n \
            \ echo \"PASS\"\nelse\n  echo \"FAIL\"\nfi"
  tests:
    test-os-password-hint-remove-recommended-test:
      test_title: os_password_hint_remove_recommended_test
      capability: independent.shellcommand
      collection: os-password-hint-remove-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: os_password_hint_remove_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: PASS
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-os-password-hint-remove-recommended-test
