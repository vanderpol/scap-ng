assessment:
  id: ng.shared.b65c8fec68bf721dda50fe27
  version: 1
  assessment_title: OL08-00-020012 - OL 8 systems below version 8.2 must automatically lock an account when three unsuccessful
    logon attempts occur during a 15-minute time period.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/pam.d/system-auth
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*auth\s+required\s+pam_faillock\.so\s+preauth.*[ \t]+fail_interval=([0-9]+)(?:[ \t]+.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
    independent-textfilecontent54-object-2:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/pam.d/password-auth
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*auth\s+required\s+pam_faillock\.so\s+preauth.*[ \t]+fail_interval=([0-9]+)(?:[ \t]+.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '900'
        operation: less than or equal
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54-2:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '0'
        operation: not equal
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-pam-faillock-so-fail-interval-900-0-in-system-auth:
      test_title: pam_faillock.so fail_interval <= 900 and !=0 in system-auth
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: all_exist
      check: all
      state_operator: AND
      states:
      - state-independent-textfilecontent54
      - state-independent-textfilecontent54-2
    test-pam-faillock-so-fail-interval-900-0-in-password-auth:
      test_title: pam_faillock.so fail_interval <= 900 and !=0 in password-auth
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-2
      check_existence: all_exist
      check: all
      state_operator: AND
      states:
      - state-independent-textfilecontent54
      - state-independent-textfilecontent54-2
  evaluate:
    all:
    - test: test-pam-faillock-so-fail-interval-900-0-in-system-auth
    - test: test-pam-faillock-so-fail-interval-900-0-in-password-auth
