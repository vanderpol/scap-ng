assessment:
  id: ng.shared.5950dcf66dc186d205c6c17c
  version: 1
  assessment_title: The Deny log on as a service user right must be configured to include no accounts or groups (blank) on
    domain controllers.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This applies to domain controllers. A separate version applies to other systems. Verify the effective setting
    in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy >> Computer Configuration >> Windows
    Settings >> Security Settings >> Local Policies >> User Rights Assignment. If any accounts or groups are defined for the
    "Deny log on as a service" user right, this is a finding. For server core installations, run the following command: Secedit
    /Export /Areas User_Rights /cfg c:\path\filename.txt Review the text file. If any SIDs are granted the "SeDenyServiceLogonRight"
    user right, this is a finding.'
  inputs: {}
  evidence: []
