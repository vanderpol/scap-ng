assessment:
  id: ng.shared.09dfbe586aa5475604bea589
  version: 1
  assessment_title: OL 9 must require a unique superuser's name upon booting into single-user and maintenance modes.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    retrieve-any-configuration-lines-containing-root-admin-or-administrator-collection:
      collection_title: Retrieve any configuration lines containing root, admin, or administrator.
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/grub2.cfg
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\n*[\s#]*set\s+superusers="(root|admin|administrator)"
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-verify-boot-loader-password-not-set-root-admin-or-adminstrator:
      test_title: Verify the boot loader password is not set to root, admin, or adminstrator.
      capability: independent.textfilecontent54
      collection: retrieve-any-configuration-lines-containing-root-admin-or-administrator-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state_title: Include filter to capture non-compliant configuration lines containing root, admin, or administrator.
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^(root|admin|administrator)$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-verify-boot-loader-password-not-set-root-admin-or-adminstrator
