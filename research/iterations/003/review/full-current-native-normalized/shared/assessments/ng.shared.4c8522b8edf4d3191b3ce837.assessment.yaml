assessment:
  id: ng.shared.4c8522b8edf4d3191b3ce837
  version: 1
  assessment_title: AZLX-23-002390 - Amazon Linux 2023 must prevent the use of dictionary words for passwords.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/security/pwquality.conf
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*dictcheck\s*=\s*([-\d]+)\s*(?:#.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
    independent-textfilecontent54-object-2:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/security/pwquality.conf.d
        filename:
          operation: pattern match
          datatype: string
          value: \.conf$
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*dictcheck\s*=\s*([-\d]+)\s*(?:#.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
    all-pwquality-configuration-files-object:
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - object: independent-textfilecontent54-object
        - object: independent-textfilecontent54-object-2
      object_title: all pwquality configuration files
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '0'
        operation: not equal
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-passwords-not-dictionary-words:
      test_title: passwords must not be dictionary words
      capability: independent.textfilecontent54
      object: all-pwquality-configuration-files-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    test: test-passwords-not-dictionary-words
