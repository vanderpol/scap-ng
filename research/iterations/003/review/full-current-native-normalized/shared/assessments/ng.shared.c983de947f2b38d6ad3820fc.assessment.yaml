assessment:
  id: ng.shared.c983de947f2b38d6ad3820fc
  version: 1
  assessment_title: The Oracle Linux operating system must not forward Internet Protocol version 4 (IPv4) source-routed packets.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the system does not accept IPv4 source-routed packets. # grep -r net.ipv4.conf.all.accept_source_route
    /run/sysctl.d/* /etc/sysctl.d/* /usr/local/lib/sysctl.d/* /usr/lib/sysctl.d/* /lib/sysctl.d/* /etc/sysctl.conf 2> /dev/null
    net.ipv4.conf.all.accept_source_route = 0 If "net.ipv4.conf.all.accept_source_route" is not configured in the /etc/sysctl.conf
    file or in any of the other sysctl.d directories, is commented out, or does not have a value of "0", this is a finding.
    Check that the operating system implements the accept source route variable with the following command: # /sbin/sysctl
    -a | grep net.ipv4.conf.all.accept_source_route net.ipv4.conf.all.accept_source_route = 0 If the returned line does not
    have a value of "0", this is a finding. If conflicting results are returned, this is a finding.'
  inputs: []
  evidence: []
