assessment:
  id: ng.shared.bf7e61642f1b92a7fa9afb26
  version: 1
  assessment_title: The operating system must protect against an individual falsely denying having performed a particular
    action. In order to do so the system must be configured to send audit records to a remote audit server.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Audit Configuration rights profile is required. This check applies to the global zone only. Determine the zone
    that you are currently securing. # zonename If the command output is "global", this check applies. Check that the syslog
    audit plugin is enabled. # pfexec auditconfig -getplugin | grep audit_syslog If "inactive" appears, this is a finding.
    Determine which system-log service instance is online. # pfexec svcs system-log Check that the /etc/syslog.conf or /etc/rsyslog.conf
    file is configured properly: # grep audit.notice /etc/syslog.conf or # grep @@ /etc/rsyslog.conf If audit.notice @remotesystemname
    , audit.notice !remotesystemname (syslog configuration) or *.* @@remotesystemname (rsyslog configuration) points to an
    invalid remote system or is commented out, this is a finding. If no output is produced, this is a finding. Check the remote
    syslog host to ensure that audit records can be found for this host.'
  inputs: {}
  evidence: []
