assessment:
  id: ng.shared.18b9290c88c030ae455dd16a
  version: 1
  assessment_title: The macOS system must implement approved ciphers within the SSH client configuration to protect the confidentiality
    of SSH connections.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-ssh-fips-compliant-recommended-object-collection:
      collection_title: os_ssh_fips_compliant_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: 'fips_ssh_config="Host *

            Ciphers aes128-gcm@openssh.com

            HostbasedAcceptedAlgorithms ecdsa-sha2-nistp256,ecdsa-sha2-nistp256-cert-v01@openssh.com

            HostKeyAlgorithms ecdsa-sha2-nistp256,ecdsa-sha2-nistp256-cert-v01@openssh.com

            KexAlgorithms ecdh-sha2-nistp256

            MACs hmac-sha2-256

            PubkeyAcceptedAlgorithms ecdsa-sha2-nistp256,ecdsa-sha2-nistp256-cert-v01@openssh.com

            CASignatureAlgorithms ecdsa-sha2-nistp256"

            /usr/bin/grep "$fips_ssh_config" /etc/ssh/ssh_config.d/fips_ssh_config'
  tests:
    test-os-ssh-fips-compliant-recommended-test:
      test_title: os_ssh_fips_compliant_recommended_test
      capability: independent.shellcommand
      collection: os-ssh-fips-compliant-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: os_ssh_fips_compliant_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: .*
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-os-ssh-fips-compliant-recommended-test
