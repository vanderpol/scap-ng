assessment:
  id: ng.shared.b52f119474df137ae86d29bb
  version: 1
  assessment_title: The macOS system must ensure Secure Boot level is set to "full".
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    os-secure-boot-verify-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: zsh
        command:
          operation: equals
          datatype: string
          value: /usr/libexec/mdmclient QuerySecurityInfo 2>/dev/null | /usr/bin/grep "SecureBootLevel = full"
      object_title: os_secure_boot_verify_recommended_object
  states:
    state-os-secure-boot-verify-recommended-state:
      state_title: os_secure_boot_verify_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: .*
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-os-secure-boot-verify-recommended-test:
      test_title: os_secure_boot_verify_recommended_test
      capability: independent.shellcommand
      object: os-secure-boot-verify-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-os-secure-boot-verify-recommended-state
  evaluate:
    test: test-os-secure-boot-verify-recommended-test
