  version: 1
  assessment_title: OL08-00-010471 - OL 8 must enable the hardware random number generator entropy gatherer service.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-systemdunitproperty-object:
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          value: rngd.service
        property:
          operation: equals
          datatype: string
          value: UnitFileState
      object_title: null
    linux-systemdunitproperty-object-2:
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          value: rngd.service
        property:
          operation: equals
          datatype: string
          value: ActiveState
      object_title: null
  states:
    state-linux-systemdunitproperty:
      state_title: null
      capability: linux.systemdunitproperty
      state:
        field: value
        value: enabled
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-linux-systemdunitproperty-2:
      state_title: null
      capability: linux.systemdunitproperty
      state:
        field: value
        value: active
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-rngd-service-enabled:
      test_title: rngd.service is enabled
      capability: linux.systemdunitproperty
      object: linux-systemdunitproperty-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-linux-systemdunitproperty
    test-rngd-service-active:
      test_title: rngd.service is active
      capability: linux.systemdunitproperty
      object: linux-systemdunitproperty-object-2
      check_existence: at_least_one_exists
      check: all
      states:
      - state-linux-systemdunitproperty-2
  evaluate:
    all:
    - test: test-rngd-service-enabled
    - test: test-rngd-service-active
