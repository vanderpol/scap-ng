assessment:
  id: ng.shared.e6f0d4b850828e90939737e2
  version: 1
  assessment_title: WN10-SO-000255 - User Account Control must automatically deny elevation requests for standard users.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Microsoft\Windows\CurrentVersion\Policies\System
        name:
          operation: equals
          datatype: string
          mask: false
          value: ConsentPromptBehaviorUser
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-verifies-user-account-control-behavior-elevation-prompt-standard-users-set:
      test_title: 'Verifies ''User Account Control: Behavior of the elevation prompt for standard users'' is set to ''Automatically
        deny elevation requests'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-verifies-user-account-control-behavior-elevation-prompt-standard-users-set
