assessment:
  id: ng.shared.3d5a3642f1d85fc5326454a5
  version: 1
  assessment_title: Verify user who owns 'cron.allow' file
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    etc-cron-allow-object:
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/cron.allow
      object_title: /etc/cron.allow
  states:
    state-unix-file:
      state_title: null
      capability: unix.file
      state:
        field: user_id
        value: '0'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-testing-user-ownership-etc-cron-allow:
      test_title: Testing user ownership of /etc/cron.allow
      capability: unix.file
      object: etc-cron-allow-object
      check_existence: any_exist
      check: all
      states:
      - state-unix-file
  evaluate:
    test: test-testing-user-ownership-etc-cron-allow
