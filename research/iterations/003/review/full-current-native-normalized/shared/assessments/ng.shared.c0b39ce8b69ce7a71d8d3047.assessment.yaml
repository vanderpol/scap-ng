assessment:
  id: ng.shared.c0b39ce8b69ce7a71d8d3047
  version: 1
  assessment_title: AZLX-23-002255 - Amazon Linux 2023 must generate audit records for all account creations, modifications,
    disabling, and termination events that affect /etc/shadow.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/audit/audit.rules
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*-w\s+/etc/shadow(\s+-p\s*([rx]*w[rx]*a[rx]*|[rx]*a[rx]*w[rx]*))?(\s+(-k\s+|-F\s+key=)\w+)?\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states: {}
  tests:
    test-events-resulting-in-modifications-etc-shadow-audited:
      test_title: Events resulting in modifications to /etc/shadow are audited
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: all_exist
      check: all
  evaluate:
    test: test-events-resulting-in-modifications-etc-shadow-audited
