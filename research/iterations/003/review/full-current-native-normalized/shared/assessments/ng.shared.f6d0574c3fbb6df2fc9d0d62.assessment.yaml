assessment:
  id: ng.shared.f6d0574c3fbb6df2fc9d0d62
  version: 1
  assessment_title: CISC-ND-000380 - The Cisco router must be configured to protect audit information from unauthorized modification.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    iosxe-global-collection:
      collection_title: null
      capability: iosxe.global
      select:
        global_command:
          operation: pattern match
          datatype: string
          mask: false
          value: ^logging[ \t]+persistent\b
    iosxe-global-collection-2:
      collection_title: null
      capability: iosxe.global
      select:
        global_command:
          operation: pattern match
          datatype: string
          mask: false
          value: ^file[ \t]+privilege
    iosxe-global-collection-3:
      collection_title: null
      capability: iosxe.global
      select:
        global_command:
          operation: pattern match
          datatype: string
          mask: false
          value: ^file[ \t]+privilege[ \t]+15[ \t]*$
  tests:
    test-check-persistent-logging:
      test_title: Check for persistent logging
      capability: iosxe.global
      collection: iosxe-global-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
    test-check-file-privilege:
      test_title: Check for file privilege
      capability: iosxe.global
      collection: iosxe-global-collection-2
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
    test-check-file-privilege-15:
      test_title: Check for file privilege 15
      capability: iosxe.global
      collection: iosxe-global-collection-3
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    any:
    - not:
        test: test-check-persistent-logging
    - any:
      - not:
          test: test-check-file-privilege
      - test: test-check-file-privilege-15
