assessment:
  id: ng.shared.a6e9af888abce8dd7e575c23
  version: 1
  assessment_title: OL08-00-030302 - OL 8 must generate audit records for any use of the "mount" syscall.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/audit/audit.rules
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*-a\s+(always,exit|exit,always)\s+-F\s+arch=b32\s+(?:.*(-S\s+mount\s+|(\s+|,)mount(\s+|,))).*-F\s+auid>=1000\s+-F\s+auid!=(4294967295|-1|unset)(\s+(-k\s+|-F\s+key=)\S+)?\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
    independent-textfilecontent54-object-2:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/audit/audit.rules
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*-a\s+(always,exit|exit,always)\s+-F\s+arch=b64\s+(?:.*(-S\s+mount\s+|(\s+|,)mount(\s+|,))).*-F\s+auid>=1000\s+-F\s+auid!=(4294967295|-1|unset)(\s+(-k\s+|-F\s+key=)\S+)?\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states: {}
  tests:
    test-audit-32-bit-invocations-mount-syscall:
      test_title: Audit 32-bit invocations of mount syscall
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: all_exist
      check: all
    test-audit-64-bit-invocations-mount-syscall:
      test_title: Audit 64-bit invocations of mount syscall
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-2
      check_existence: all_exist
      check: all
  evaluate:
    all:
    - test: test-audit-32-bit-invocations-mount-syscall
    - test: test-audit-64-bit-invocations-mount-syscall
