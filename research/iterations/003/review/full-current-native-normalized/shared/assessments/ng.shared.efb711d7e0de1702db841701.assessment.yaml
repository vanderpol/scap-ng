  tests:
    test-winlogon-key-exists:
      test_title: Winlogon key exists
      capability: windows.registry
      object: hkey-local-machine-software-microsoft-windows-nt-currentversion-winlogon-key-object
      check_existence: at_least_one_exists
      check: at least one
    test-winlogon-key-has-no-bad-rights-non-users-group-administrators:
      test_title: Winlogon key has no bad rights for non-(Users group, Administrators group, SYSTEM, TrustedInstaller, ALL
        APPLICATION PACKAGES)
      capability: windows.regkeyeffectiverights53
      object: winlogon-rights-except-users-group-administrators-group-system-trustedinstaller-all-object
      check_existence: any_exist
      check: all
      states:
      - state-no-registry-rights
    test-winlogon-key-has-no-non-users-group-administrators-group-system:
      test_title: Winlogon key has no non-(Users group, Administrators group, SYSTEM, TrustedInstaller, ALL APPLICATION PACKAGES)
        rights to check
      capability: windows.regkeyeffectiverights53
      object: winlogon-rights-except-users-group-administrators-group-system-trustedinstaller-all-object
      check_existence: none_exist
      check: all
    test-winlogon-key-has-no-bad-rights-non-administrators-group-system:
      test_title: Winlogon key has no bad rights for non-(Administrators group, SYSTEM, TrustedInstaller)
      capability: windows.regkeyeffectiverights53
      object: winlogon-rights-except-administrators-group-system-trustedinstaller-object
      check_existence: any_exist
      check: all
      states:
      - state-qenr-registry-rights
    test-winlogon-key-has-no-non-administrators-group-system-trustedinstaller-rights:
