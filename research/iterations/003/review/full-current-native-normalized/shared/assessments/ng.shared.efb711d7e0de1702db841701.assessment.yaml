assessment:
  id: ng.shared.efb711d7e0de1702db841701
  version: 1
  assessment_title: Winlogon Registry Permissions
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    hkey-local-machine-software-microsoft-windows-nt-currentversion-winlogon-key-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon
        name:
          operation: equals
          datatype: string
          nil: true
          value: ''
      object_title: HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon key
    hkey-local-machine-software-microsoft-windows-nt-currentversion-winlogon-rights-object:
      capability: windows.regkeyeffectiverights53
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon
        trustee_sid:
          operation: pattern match
          datatype: string
          value: .*
      object_title: HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon rights
    winlogon-rights-except-users-group-administrators-group-system-trustedinstaller-all-object:
      capability: windows.regkeyeffectiverights53
      set:
        operator: union
        members:
        - object: hkey-local-machine-software-microsoft-windows-nt-currentversion-winlogon-rights-object
        filters:
        - action: exclude
          state: state-administrators-group
        - action: exclude
          state: state-trustedinstaller
        - action: exclude
          state: state-users-group
        - action: exclude
          state: state-system
        - action: exclude
          state: state-all-application-packages
      object_title: Winlogon rights, except for Users group, Administrators group, SYSTEM, TrustedInstaller, ALL APPLICATION
        PACKAGES
    winlogon-rights-except-administrators-group-system-trustedinstaller-object:
      capability: windows.regkeyeffectiverights53
      set:
        operator: union
        members:
        - object: hkey-local-machine-software-microsoft-windows-nt-currentversion-winlogon-rights-object
        filters:
        - action: exclude
          state: state-administrators-group
        - action: exclude
          state: state-trustedinstaller
        - action: exclude
          state: state-system
      object_title: Winlogon rights, except for Administrators group, SYSTEM, and TrustedInstaller
