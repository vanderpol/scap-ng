assessment:
  id: ng.shared.1734eeb6facba38002adc537
  version: 1
  assessment_title: The Cisco router must be configured to enforce the limit of three consecutive invalid logon attempts,
    after which time it must lock out the user account from accessing the device for 15 minutes.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Review the Cisco router configuration to verify that it enforces the limit of three consecutive invalid logon
    attempts as shown in the example below. login block-for 900 attempts 3 within 120 Note: The configuration example above
    will block any login attempt for 15 minutes after three consecutive invalid logon attempts within a two-minute period.
    If the Cisco router is not configured to enforce the limit of three consecutive invalid logon attempts, this is a finding.'
  inputs: []
  evidence: []
