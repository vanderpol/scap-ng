assessment:
  id: ng.shared.77e42d9ee4dc7bf0b688fd3a
  version: 1
  assessment_title: SQL Server must allocate audit record storage capacity in accordance with organization-defined audit record
    storage requirements.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: If the database is setup to write audit logs using APPLICATION or SECURITY event logs rather than writing to
    a file, this is Not Applicable. Check the server documentation for the SQL Audit file size configurations. Locate the
    Audit file path and drive. SELECT max_file_size, max_rollover_files, log_file_path AS "Audit Path" FROM sys.server_file_audits
    Calculate the space needed as the maximum file size and number of files from the SQL Audit File properties. If the calculated
    product of the "max_file_size" times the "max_rollover_files" exceeds the size of the storage location, this is a finding;
    OR if "max_file_size" is set to "0" (Unlimited), this is a finding; OR if "max_rollover_files" are set to "0" (None) or
    "2147483647" (Unlimited), this is a finding.
  inputs: {}
  evidence: []
