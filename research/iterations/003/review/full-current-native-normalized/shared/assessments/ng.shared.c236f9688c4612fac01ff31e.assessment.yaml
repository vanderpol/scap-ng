assessment:
  id: ng.shared.c236f9688c4612fac01ff31e
  version: 1
  assessment_title: WN10-AU-000070 - The system must be configured to audit Logon/Logoff - Logon failures.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-log-on-is-set-to-failure:
      state_title: '''Log On'' is set to ''Failure'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: logon
        value: AUDIT_FAILURE
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-log-on-is-set-to-success-and-failure:
      state_title: '''Log On'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: logon
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-logon-set-failure:
      test_title: '''Audit Logon'' is set to ''Failure'''
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-log-on-is-set-to-failure
    test-audit-logon-set-success-failure:
      test_title: '''Audit Logon'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-log-on-is-set-to-success-and-failure
  evaluate:
    any:
    - test: test-audit-logon-set-failure
    - test: test-audit-logon-set-success-failure
