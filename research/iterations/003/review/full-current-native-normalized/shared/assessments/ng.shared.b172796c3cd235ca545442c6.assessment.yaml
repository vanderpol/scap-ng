assessment:
  id: ng.shared.b172796c3cd235ca545442c6
  version: 1
  assessment_title: The macOS system must disable accounts after 35 days of inactivity.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    pwpolicy-account-inactivity-enforce-stig-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: zsh
        command:
          operation: equals
          datatype: string
          value: /usr/bin/pwpolicy -getaccountpolicies | /usr/bin/tail +2 | /usr/bin/xmllint --xpath '//dict/key[text()="policyAttributeInactiveDays"]/following-sibling::integer[1]/text()'
            -
      object_title: pwpolicy_account_inactivity_enforce_stig_object
  states:
    state-pwpolicy-account-inactivity-enforce-stig-state:
      state_title: pwpolicy_account_inactivity_enforce_stig_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: '35'
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-pwpolicy-account-inactivity-enforce-stig-test:
      test_title: pwpolicy_account_inactivity_enforce_stig_test
      capability: independent.shellcommand
      object: pwpolicy-account-inactivity-enforce-stig-object-object
      check_existence: all_exist
      check: all
      states:
      - state-pwpolicy-account-inactivity-enforce-stig-state
  evaluate:
    test: test-pwpolicy-account-inactivity-enforce-stig-test
