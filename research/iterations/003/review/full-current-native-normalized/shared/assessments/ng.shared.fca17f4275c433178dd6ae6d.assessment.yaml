assessment:
  id: ng.shared.fca17f4275c433178dd6ae6d
  version: 1
  assessment_title: OL 8 systems, version 8.4 and above, must ensure the password complexity module is configured for three
    retries or less.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    check-that-pwquality-conf-files-allow-maximum-3-retries-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/security/pwquality.conf
        pattern:
          operation: pattern match
          datatype: string
          value: ^(\s*retry\s*=\s*\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: Check that pwquality.conf files allow maximum of 3 retries.
    check-that-pwquality-files-allow-maximum-3-retries-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/security/pwquality.conf.d
        filename:
          operation: pattern match
          datatype: string
          value: .+
        pattern:
          operation: pattern match
          datatype: string
          value: ^(\s*retry\s*=\s*\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: Check that pwquality files allow maximum of 3 retries.
    check-that-pwquality-files-allow-maximum-3-retries-object-2:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/pam.d/system-auth
        pattern:
          operation: pattern match
          datatype: string
          value: ^[ \t]*password\s+(.*\sretry.*)$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: Check that pwquality files allow maximum of 3 retries.
    check-that-pwquality-files-allow-maximum-3-retries-object-3:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/pam.d/password-auth
        pattern:
          operation: pattern match
          datatype: string
          value: ^[ \t]*password\s+(.*\sretry.*)$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      behaviors:
        multiline: 'true'
      object_title: Check that pwquality files allow maximum of 3 retries.
  states:
    state-confirm-retry-value-is-1-3:
      state_title: Confirm retry value is 1-3.
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^\s*retry\s*=\s*[123]$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-check-that-pwquality-conf-file-configured-three-or-fewer-retries:
      test_title: Check that pwquality.conf file is configured for three or fewer retries.
      capability: independent.textfilecontent54
      object: check-that-pwquality-conf-files-allow-maximum-3-retries-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-confirm-retry-value-is-1-3
    test-check-that-files-in-etc-security-pwquality-conf-d-configured:
      test_title: Check that files in /etc/security/pwquality.conf.d are configured for three or fewer retries.
      capability: independent.textfilecontent54
      object: check-that-pwquality-files-allow-maximum-3-retries-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-confirm-retry-value-is-1-3
    test-no-retry-entries-allowed-in-etc-pam-d-system-auth:
      test_title: No 'retry' entries allowed in /etc/pam.d/system-auth or password-auth files.
      capability: independent.textfilecontent54
      object: check-that-pwquality-files-allow-maximum-3-retries-object-2
      check_existence: none_exist
      check: all
    test-no-retry-entries-allowed-in-etc-pam-d-system-auth-2:
      test_title: No 'retry' entries allowed in /etc/pam.d/system-auth or password-auth files.
      capability: independent.textfilecontent54
      object: check-that-pwquality-files-allow-maximum-3-retries-object-3
      check_existence: none_exist
      check: all
  evaluate:
    all:
    - any:
      - test: test-check-that-pwquality-conf-file-configured-three-or-fewer-retries
      - test: test-check-that-files-in-etc-security-pwquality-conf-d-configured
    - all:
      - test: test-no-retry-entries-allowed-in-etc-pam-d-system-auth
      - test: test-no-retry-entries-allowed-in-etc-pam-d-system-auth-2
