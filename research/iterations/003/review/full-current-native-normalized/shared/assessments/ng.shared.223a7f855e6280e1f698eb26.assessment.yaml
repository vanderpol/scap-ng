assessment:
  id: ng.shared.223a7f855e6280e1f698eb26
  version: 1
  assessment_title: The Lock pages in memory user right must not be assigned to any groups or accounts.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy
    >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment. If any
    accounts or groups are granted the "Lock pages in memory" user right, this is a finding. If an application requires this
    user right, this would not be a finding. Vendor documentation must support the requirement for having the user right.
    The requirement must be documented with the ISSO. The application account must meet requirements for application account
    passwords, such as length (WN12-00-000010) and required frequency of changes (WN12-00-000011).
  inputs: []
  evidence: []
