assessment:
  id: ng.shared.50c89d0123cfb2cd7591785e
  version: 1
  assessment_title: WINCC-000095
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\Windows\LocationAndSensors
        name:
          operation: equals
          datatype: string
          mask: false
          value: DisableLocation
      object_title: null
  states:
    state-reg-dword-type-and-value-equals-1:
      state_title: Reg_Dword type and value equals 1
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-turn-off-location-set-enabled:
      test_title: '''Turn off location'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-1
  evaluate:
    test: test-turn-off-location-set-enabled
