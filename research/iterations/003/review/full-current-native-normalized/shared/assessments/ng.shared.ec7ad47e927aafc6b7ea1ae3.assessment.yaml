assessment:
  id: ng.shared.ec7ad47e927aafc6b7ea1ae3
  version: 1
  assessment_title: Enable GNOME3 Login Warning Banner
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-rpminfo-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: dconf
      object_title: null
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/dconf/profile/user
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^user-db:user\nsystem-db:local$
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
      object_title: null
    independent-textfilecontent54-object-2:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/dconf/db
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[0-9].*$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\[org/gnome/login-screen\]([^\n]*\n+)+?banner-message-enable\s*=\s*true\s*$
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
      filters:
      - action: include
        state: state-independent-textfilecontent54
      behaviors:
        multiline: 'true'
        max_depth: '1'
        recurse_direction: down
      object_title: null
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: path
        value: ^/etc/dconf/db/[^/]+\.d/?$
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-package-dconf-installed:
      test_title: package dconf is installed
      capability: linux.rpminfo
      object: linux-rpminfo-object
      check_existence: all_exist
      check: all
    test-dconf-user-profile-exists:
      test_title: dconf user profile exists
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: all_exist
      check: all
    test-gui-banner-enabled:
      test_title: GUI banner is enabled
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-2
      check_existence: all_exist
      check: all
  evaluate:
    any:
    - not:
        test: test-package-dconf-installed
    - all:
      - any:
        - not:
            test: test-package-dconf-installed
        - test: test-dconf-user-profile-exists
      - test: test-gui-banner-enabled
