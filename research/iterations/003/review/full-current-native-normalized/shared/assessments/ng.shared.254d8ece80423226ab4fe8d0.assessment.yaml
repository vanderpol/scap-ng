assessment:
  id: ng.shared.254d8ece80423226ab4fe8d0
  version: 1
  assessment_title: The system must disable network routing unless required.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    routeadm-p-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: routeadm -p
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: 'routing |forwarding '
      object_title: routeadm -p
  states:
    state-check-that-line-includes-persistent-disabled-with-an-exi:
      state_title: Check that line includes 'persistent=disabled' with an exit status of 0
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: persistent=disabled
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    state-check-that-line-includes-current-disabled-with-an-exit-s:
      state_title: Check that line includes 'current=disabled' with an exit status of 0
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: current=disabled
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-system-disable-network-routing-unless-required:
      test_title: The system must disable network routing unless required.
      capability: independent.shellcommand
      object: routeadm-p-object
      check_existence: at_least_one_exists
      check: all
      state_operator: AND
      states:
      - state-check-that-line-includes-persistent-disabled-with-an-exi
      - state-check-that-line-includes-current-disabled-with-an-exit-s
  evaluate:
    test: test-system-disable-network-routing-unless-required
