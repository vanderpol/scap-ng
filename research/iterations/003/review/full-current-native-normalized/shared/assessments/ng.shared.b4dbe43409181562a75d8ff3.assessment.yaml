assessment:
  id: ng.shared.b4dbe43409181562a75d8ff3
  version: 1
  assessment_title: OL 8 must restrict privilege elevation to authorized personnel.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the "sudoers" file restricts sudo access to authorized personnel. $ sudo grep -iwR ''ALL'' /etc/sudoers
    /etc/sudoers.d/ | grep -v ''#'' If the either of the following entries are returned, this is a finding: ALL ALL=(ALL)
    ALL ALL ALL=(ALL:ALL) ALL'
  inputs: []
  evidence: []
