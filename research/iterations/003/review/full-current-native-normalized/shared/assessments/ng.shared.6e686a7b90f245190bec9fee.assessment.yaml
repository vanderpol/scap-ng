assessment:
  id: ng.shared.6e686a7b90f245190bec9fee
  version: 1
  assessment_title: Duplicate user names must not exist.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    get-any-duplicate-user-names-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: 'getent passwd | awk -F: ''{print $1}'' | uniq -d'
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
      object_title: Get any duplicate user names
  states:
    state-nothing-is-returned-and-command-exits-with-a-status-of-0:
      state_title: Nothing is returned and command exits with a status of 0
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: ''
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: none_exist
  tests:
    test-duplicate-user-names-not-exist:
      test_title: Duplicate user names must not exist.
      capability: independent.shellcommand
      object: get-any-duplicate-user-names-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-nothing-is-returned-and-command-exits-with-a-status-of-0
  evaluate:
    test: test-duplicate-user-names-not-exist
