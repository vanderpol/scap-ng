assessment:
  id: ng.shared.cc16a4fc80f9b053c0c2ae26
  version: 1
  assessment_title: Outgoing secure channel traffic must be signed when possible.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding: Registry
    Hive: HKEY_LOCAL_MACHINE Registry Path: \SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\ Value Name: SignSecureChannel
    Value Type: REG_DWORD Value: 1 If the value for "Domain Member: Digitally encrypt or sign secure channel data (always)"
    is set to "Enabled", this can be NA (see V-6831).'
  inputs: []
  evidence: []
