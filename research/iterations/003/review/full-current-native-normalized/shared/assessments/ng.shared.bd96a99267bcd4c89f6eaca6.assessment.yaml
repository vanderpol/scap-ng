  assessment_title: The macOS system must disable the built-in web server.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable the built-in web server with the following command: /bin/launchctl
    print-disabled system | /usr/bin/grep -c ''"org.apache.httpd" => disabled'' If the result is not "1", this is a finding.'
