assessment:
  id: ng.shared.4d2d59e561cf2d236cd3c1c2
  version: 1
  assessment_title: The operating system, upon successful logon, must display to the user the date and time of the last logon
    (access).
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    printlastlog-set-yes-in-etc-ssh-sshd-config-collection:
      collection_title: '"PrintLastLog" must be set to "yes" in /etc/ssh/sshd_config.'
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh
        filename:
          operation: equals
          datatype: string
          mask: false
          value: sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*[Pp][Rr][Ii][Nn][Tt][Ll][Aa][Ss][Tt][Ll][Oo][Gg]\s+(\S+)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-check-printlastlog-set-yes-or-nonexistent-in-etc-ssh-sshd:
      test_title: Check "PrintLastLog" is set to "yes" or nonexistent in /etc/ssh/sshd_config.
      capability: independent.textfilecontent54
      collection: printlastlog-set-yes-in-etc-ssh-sshd-config-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: PrintLastLog is set to yes
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: 'yes'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-check-printlastlog-set-yes-or-nonexistent-in-etc-ssh-sshd
