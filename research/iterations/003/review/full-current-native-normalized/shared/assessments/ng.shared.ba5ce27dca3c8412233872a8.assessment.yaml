assessment:
  id: ng.shared.ba5ce27dca3c8412233872a8
  version: 1
  assessment_title: UBTU-22-654150 - Ubuntu 22.04 LTS must generate audit records for all account creations, modifications,
    disabling, and termination events that affect /etc/shadow.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/audit.rules
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*-w\s+\/etc\/shadow(\s+-p\s*([rx]*w[rx]*a[rx]*|[rx]*a[rx]*w[rx]*))?(\s+(-k\s+|-F\s+key=)\w+)?\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-textfilecontent54-collection-2:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/audit.rules
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*-a\s+(?:always,exit|exit,always)\s+-F\s+path=\/etc\/shadow\s+-F\s+perm=(?:[rx]*w[rx]*a[rx]*|[rx]*a[rx]*w[rx]*)(?:\s+(?:-k\s+|-F\s+key=)\S+)*\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-events-resulting-in-modifications-etc-shadow-audited-use-file-watch:
      test_title: Events resulting in modifications to /etc/shadow are audited. Use file watch syntax.
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state: null
    test-audit-modifications-etc-shadow-use-system-call-syntax:
      test_title: Audit modifications to /etc/shadow.  Use system call syntax.
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection-2
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    any:
    - test: test-events-resulting-in-modifications-etc-shadow-audited-use-file-watch
    - test: test-audit-modifications-etc-shadow-use-system-call-syntax
