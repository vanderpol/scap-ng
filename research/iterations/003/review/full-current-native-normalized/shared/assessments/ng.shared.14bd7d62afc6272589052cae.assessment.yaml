assessment:
  id: ng.shared.14bd7d62afc6272589052cae
  version: 1
  assessment_title: 'WN22-SO-000170 - Windows Server 2022 setting Microsoft network client: Digitally sign communications
    (if server agrees) must be configured to Enabled.'
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    check-value-stored-at-hkey-local-machine-system-currentcontrolset-services-object:
      capability: windows.registry
      select:
        hive:
          operation: case insensitive equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: case insensitive equals
          datatype: string
          value: SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters
        name:
          operation: case insensitive equals
          datatype: string
          value: EnableSecuritySignature
      object_title: Check the value stored at HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\LanmanWorkstation\Parameters\EnableSecuritySignature
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-microsoft-network-client-digitally-sign-communications-if-server-agrees-set:
      test_title: '''Microsoft network client: Digitally sign communications (if server agrees)'' is set to ''Enabled'''
      capability: windows.registry
      object: check-value-stored-at-hkey-local-machine-system-currentcontrolset-services-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-microsoft-network-client-digitally-sign-communications-if-server-agrees-set
