assessment:
  id: ng.shared.2b9696ca8f4648704d068875
  version: 1
  assessment_title: Ensure Yum gpgcheck Globally Activated
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    gpgcheck-set-in-etc-yum-conf-collection:
      collection_title: gpgcheck set in /etc/yum.conf
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/yum.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*gpgcheck\s*=\s*(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-check-value-gpgcheck-in-etc-yum-conf:
      test_title: check value of gpgcheck in /etc/yum.conf
      capability: independent.textfilecontent54
      collection: gpgcheck-set-in-etc-yum-conf-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: gpgcheck enabled in /etc/yum.conf
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: '1'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-check-value-gpgcheck-in-etc-yum-conf
