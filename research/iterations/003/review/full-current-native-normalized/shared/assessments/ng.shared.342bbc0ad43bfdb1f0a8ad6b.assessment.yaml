assessment:
  id: ng.shared.342bbc0ad43bfdb1f0a8ad6b
  version: 1
  assessment_title: WN19-SO-000260 - Windows Server 2019 services using Local System that use Negotiate when reverting to
    NTLM authentication must use the computer identity instead of authenticating anonymously.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Control\LSA
        name:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: UseMachineId
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-network-security-allow-local-system-use-computer-identity-ntlm-set:
      test_title: '''Network security: Allow Local System to use computer identity for NTLM'' is set to ''Enabled''.'
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-network-security-allow-local-system-use-computer-identity-ntlm-set
