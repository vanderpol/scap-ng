assessment:
  id: ng.shared.2bfa253b3b91ce3650b92076
  version: 1
  assessment_title: WN19-AU-000320 - Windows Server 2019 must be configured to audit System - IPsec Driver successes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-audit-ipsec-driver-success-only:
      state_title: Audit - IPSec Driver - Success only
      capability: windows.auditeventpolicysubcategories
      state:
        field: ipsec_driver
        value: AUDIT_SUCCESS
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-audit-ipsec-driver-success-and-failure:
      state_title: Audit - IPSec Driver - Success and Failure
      capability: windows.auditeventpolicysubcategories
      state:
        field: ipsec_driver
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-ipsec-driver-success-only:
      test_title: Audit - IPSec Driver - Success only
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-audit-ipsec-driver-success-only
      - state-audit-ipsec-driver-success-and-failure
  evaluate:
    test: test-audit-ipsec-driver-success-only
