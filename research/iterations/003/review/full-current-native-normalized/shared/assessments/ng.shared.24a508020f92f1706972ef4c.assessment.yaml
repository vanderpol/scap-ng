assessment:
  id: ng.shared.24a508020f92f1706972ef4c
  version: 1
  assessment_title: The operating system must employ FIPS-validate or NSA-approved cryptography to implement digital signatures.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    cryptoadm-list-fips-140-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: cryptoadm list fips-140
        pattern:
          operation: pattern match
          datatype: string
          value: FIPS 140 mode
      object_title: cryptoadm list fips-140
  states:
    state-all-fips-140-modules-should-return-is-enabled:
      state_title: All FIPS 140 modules should return 'is enabled''
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: is enabled
          operation: pattern match
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-check-ensure-that-fips-140-encryption-mode-enabled:
      test_title: Check to ensure that FIPS-140 encryption mode is enabled.
      capability: independent.shellcommand
      object: cryptoadm-list-fips-140-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-all-fips-140-modules-should-return-is-enabled
  evaluate:
    test: test-check-ensure-that-fips-140-encryption-mode-enabled
