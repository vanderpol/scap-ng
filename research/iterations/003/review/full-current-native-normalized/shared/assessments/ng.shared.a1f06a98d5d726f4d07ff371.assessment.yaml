assessment:
  id: ng.shared.a1f06a98d5d726f4d07ff371
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so the x86 Ctrl-Alt-Delete key sequence is disabled
    in the Graphical User Interface.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: If the operating system does not have a graphical user interface installed, this requirement is Not Applicable.
    Verify the operating system is not configured to reboot the system when Ctrl-Alt-Delete is pressed. Check that the ctrl-alt-del.target
    is masked and not active in the graphical user interface with the following command: # grep logout /etc/dconf/db/local.d/*
    logout='''' If "logout" is not set to use two single quotations, or is missing, this is a finding.'
  inputs: []
  evidence: []
