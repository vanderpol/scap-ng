assessment:
  id: ng.shared.2143d3e94104a8b2efd02c03
  version: 1
  assessment_title: WN10-AU-000589 - Windows 10 must be configured to audit registry failures.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-registry-is-set-to-failure:
      state_title: '''Registry'' is set to ''Failure'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: registry
        value: AUDIT_FAILURE
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-registry-is-set-to-success-and-failure:
      state_title: '''Registry'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: registry
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-registry-set-failure:
      test_title: '''Audit Registry'' is set to ''Failure'''
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-registry-is-set-to-failure
    test-audit-registry-set-success-failure:
      test_title: '''Audit Registry'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-registry-is-set-to-success-and-failure
  evaluate:
    any:
    - test: test-audit-registry-set-failure
    - test: test-audit-registry-set-success-failure
