assessment:
  id: ng.shared.3582325f6b5de5d4b11f93ee
  version: 1
  assessment_title: The Oracle Linux operating system must not have a File Transfer Protocol (FTP) server package installed
    unless needed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify an FTP server has not been installed on the system. Check to see if an FTP server has been installed
    with the following commands: # yum list installed vsftpd vsftpd-3.0.2.el7.x86_64.rpm If "vsftpd" is installed and is not
    documented with the Information System Security Officer (ISSO) as an operational requirement, this is a finding.'
  inputs: []
  evidence: []
