assessment:
  id: ng.shared.67dead3c5a804de01d320dd8
  version: 1
  assessment_title: Audit - Credential Validation - Failure
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-auditeventpolicysubcategories-collection:
      collection_title: null
      capability: windows.auditeventpolicysubcategories
  tests:
    test-audit-credential-validation-failure-only:
      test_title: Audit - Credential Validation - Failure only
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Audit - Credential Validation - Failure only
        state_capability: windows.auditeventpolicysubcategories
        state:
          field: credential_validation
          value: AUDIT_FAILURE
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-audit-credential-validation-success-failure:
      test_title: Audit - Credential Validation - Success and Failure
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Audit - Credential Validation - Success and Failure
        state_capability: windows.auditeventpolicysubcategories
        state:
          field: credential_validation
          value: AUDIT_SUCCESS_FAILURE
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    any:
    - test: test-audit-credential-validation-failure-only
    - test: test-audit-credential-validation-success-failure
