assessment:
  id: ng.shared.edb974106e74bcc8e95d8461
  version: 1
  assessment_title: The finger daemon package must not be installed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    pkg-info-service-network-finger-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: pkg info service/network/finger
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
      object_title: pkg info service/network/finger
  states:
    state-stdout-line-should-not-exist:
      state_title: stdout_line should not exist
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: ''
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: none_exist
  tests:
    test-finger-daemon-package-not-installed:
      test_title: The finger daemon package must not be installed.
      capability: independent.shellcommand
      object: pkg-info-service-network-finger-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-stdout-line-should-not-exist
  evaluate:
    test: test-finger-daemon-package-not-installed
