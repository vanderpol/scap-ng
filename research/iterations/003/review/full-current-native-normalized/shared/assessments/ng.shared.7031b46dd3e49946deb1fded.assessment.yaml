assessment:
  id: ng.shared.7031b46dd3e49946deb1fded
  version: 1
  assessment_title: Gnome lock-delay setting lock
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-rpminfo-collection:
      collection_title: null
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: dconf
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/dconf/db/
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[0-9].*$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\[org/gnome/desktop/screensaver\]([^\n]*\n+)+?lock-delay\s*=\s*uint32\s+[0-5]\s*$
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
      behaviors:
        multiline: 'true'
        max_depth: '1'
        recurse_direction: down
    lock-delay-locks-collection:
      collection_title: lock-delay locks
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: lock-paths-databases-that-have-lock-delay-settings-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^.*$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^/org/gnome/desktop/screensaver/lock-delay$
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
      behaviors:
        multiline: 'true'
        max_depth: '1'
        recurse_direction: down
    lock-delay-entries-that-not-locked-collection:
      collection_title: lock-delay entries that are not locked
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - collection: independent-textfilecontent54-collection
        filters:
        - action: exclude
          match:
            field: path
            value:
              variable: paths-databases-that-have-lock-delay-locked-variable
            operation: equals
            datatype: string
            mask: false
            variable_check: at least one
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: match paths for databases that have lock-delay locked
          capability: independent.textfilecontent54
  variables:
    lock-paths-databases-that-have-lock-delay-settings-variable:
      title: lock paths for databases that have lock-delay settings
      kind: local
      datatype: string
      expression:
        concat:
        - values:
            collection: independent-textfilecontent54-collection
            field: path
        - literal:
            value: /locks
            datatype: string
    paths-databases-that-have-lock-delay-locked-variable:
      title: paths for databases that have lock-delay locked
      kind: local
      datatype: string
      expression:
        regex_capture:
          value:
            values:
              collection: lock-delay-locks-collection
              field: path
          pattern: ^(.*)/locks$
  tests:
    test-package-dconf-installed:
      test_title: package dconf is installed
      capability: linux.rpminfo
      collection: linux-rpminfo-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state: null
    test-lock-delay-configuration-present:
      test_title: lock-delay configuration is present
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
    test-lock-delay-lock-exists:
      test_title: lock-delay lock exists
      capability: independent.textfilecontent54
      collection: lock-delay-locks-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
    test-all-lock-delay-entries-locked:
      test_title: all lock-delay entries are locked
      capability: independent.textfilecontent54
      collection: lock-delay-entries-that-not-locked-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
  evaluate:
    any:
    - not:
        test: test-package-dconf-installed
    - all:
      - test: test-lock-delay-configuration-present
      - test: test-lock-delay-lock-exists
      - test: test-all-lock-delay-entries-locked
