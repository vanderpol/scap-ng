assessment:
  id: ng.shared.0a5b74938f1bd41f64af5a3b
  version: 1
  assessment_title: AZLX-23-002280 - Amazon Linux 2023 library directories must be group-owned by root or a system account.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    all-system-wide-library-directories-collection:
      collection_title: All system-wide library directories
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: only one
          value:
            variable: system-wide-shared-library-files-directories-variable
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
      filters:
      - action: include
        match:
          field: type
          value: directory
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        capability: unix.file
      - action: exclude
        match:
          field: group_id
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: group-owned by root
        capability: unix.file
      behaviors:
        recurse_direction: down
  variables:
    system-wide-shared-library-files-directories-variable:
      title: system-wide shared library files directories
      kind: constant
      datatype: string
      expression:
        literal:
        - /lib
        - /lib64
        - /usr/lib
        - /usr/lib64
  tests:
    test-no-system-wide-library-directories-exist-except-those-group-owned:
      test_title: No system-wide library directories exist except for those group-owned by root
      capability: unix.file
      collection: all-system-wide-library-directories-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
  evaluate:
    test: test-no-system-wide-library-directories-exist-except-those-group-owned
