assessment:
  id: ng.shared.5896e9bf3941de07d3932f6a
  version: 1
  assessment_title: Event Viewer must be protected from unauthorized modification and deletion.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify the permissions on Event Viewer only allow TrustedInstaller permissions to change or modify. If any groups
    or accounts other than TrustedInstaller have Full control or Modify, this is a finding. Navigate to "%SystemRoot%\SYSTEM32".
    View the permissions on "Eventvwr.exe". The default permissions below satisfy this requirement. TrustedInstaller - Full
    Control Administrators, SYSTEM, Users, ALL APPLICATION PACKAGES - Read & Execute
  inputs: []
  evidence: []
