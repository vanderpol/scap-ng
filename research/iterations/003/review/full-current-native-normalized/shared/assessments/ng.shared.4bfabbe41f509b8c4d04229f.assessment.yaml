assessment:
  id: ng.shared.4bfabbe41f509b8c4d04229f
  version: 1
  assessment_title: The macOS system must enable gatekeeper.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    os-gatekeeper-enable-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.systempolicy.control'')\

            .objectForKey(''EnableAssessment'').js

            EOS'
      object_title: os_gatekeeper_enable_recommended_object
  states:
    state-os-gatekeeper-enable-recommended-state:
      state_title: os_gatekeeper_enable_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: 'true'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-os-gatekeeper-enable-recommended-test:
      test_title: os_gatekeeper_enable_recommended_test
      capability: independent.shellcommand
      object: os-gatekeeper-enable-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-os-gatekeeper-enable-recommended-state
  evaluate:
    test: test-os-gatekeeper-enable-recommended-test
