assessment:
  id: ng.shared.9e466fe6cacc25d97026e338
  version: 1
  assessment_title: Shared user accounts must not be permitted on the system.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Determine whether any shared accounts exist. If no shared accounts exist, this is NA. Shared accounts, such as
    required by an application, may be approved by the organization. This must be documented with the ISSO. Documentation
    must include the reason for the account, who has access to the account, and how the risk of using the shared account is
    mitigated to include monitoring account activity. If unapproved shared accounts exist, this is a finding.
  inputs: {}
  evidence: []
