assessment:
  id: ng.shared.aee862f0bf6e6502ac73d04d
  version: 1
  assessment_title: CNTR-K8-000860 - The Kubernetes manifests must be owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    all-manifest-files-in-etc-kubernetes-manifests-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/kubernetes/manifests
        filename:
          operation: pattern match
          datatype: string
          value: .+
      object_title: All manifest files in /etc/kubernetes/manifests/*
  states:
    state-file-is-owned-and-group-owned-by-root:
      state_title: File is owned and group owned by root
      capability: unix.file
      state:
        all:
        - field: group_id
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: user_id
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-check-etc-kubernetes-manifests-that-every-manifest-file-user-group:
      test_title: Check /etc/kubernetes/manifests/* that every manifest file is user and group owned by root
      capability: unix.file
      object: all-manifest-files-in-etc-kubernetes-manifests-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-file-is-owned-and-group-owned-by-root
  evaluate:
    test: test-check-etc-kubernetes-manifests-that-every-manifest-file-user-group
