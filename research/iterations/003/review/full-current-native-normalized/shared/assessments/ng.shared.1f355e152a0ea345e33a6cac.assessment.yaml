assessment:
  id: ng.shared.1f355e152a0ea345e33a6cac
  version: 1
  assessment_title: The sshd server must bind the X11 forwarding server to the loopback address.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    grep-x11uselocalhost-etc-ssh-sshd-config-collection:
      collection_title: grep '^X11UseLocalhost' /etc/ssh/sshd_config
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: grep "^X11UseLocalhost" /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
  tests:
    test-sshd-server-bind-x11-forwarding-server-loopback-address:
      test_title: The sshd server must bind the X11 forwarding server to the loopback address.
      capability: independent.shellcommand
      collection: grep-x11uselocalhost-etc-ssh-sshd-config-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: stdout_line should return 'X11UseLocalhost yes'
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: X11UseLocalhost yes
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-sshd-server-bind-x11-forwarding-server-loopback-address
