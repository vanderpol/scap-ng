  version: 1
  assessment_title: The macOS system must disable sending audio recordings and transcripts to Apple.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable sending audio recordings and transcripts with the following
    command: /usr/bin/osascript -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.Accessibility'')\
    .objectForKey(''AXSAudioDonationSiriImprovementEnabled'').js EOS If the result is not "false", this is a finding.'
  inputs: []
  evidence: []
