assessment:
  id: ng.shared.0b11b3d3c7e453a72055670b
  version: 1
  assessment_title: The Exchange local machine policy must require signed scripts.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    run-get-executionpolicy-collection:
      collection_title: Run Get-ExecutionPolicy
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: add-pssnapin Microsoft.Exchange.Management.Powershell.Snapin;Get-ExecutionPolicy
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: \w
      behaviors:
        error_if_stderr_exists: 'true'
  tests:
    test-if-value-returned-not-remotesigned-this-finding:
      test_title: If the value returned is not RemoteSigned, this is a finding.
      capability: independent.shellcommand
      collection: run-get-executionpolicy-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Verify value is RemoteSigned
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: (?i)RemoteSigned\s*$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-if-value-returned-not-remotesigned-this-finding
