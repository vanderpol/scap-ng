assessment:
  id: ng.shared.01d445d2defaba57208f28e7
  version: 1
  assessment_title: The Oracle Linux operating system must prevent the installation of software, patches, service packs, device
    drivers, or operating system components from a repository without verification they have been digitally signed using a
    certificate that is issued by a Certificate Authority (CA) that is recognized and approved by the organization.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system prevents the installation of patches, service packs, device drivers, or operating
    system components from a repository without verification that they have been digitally signed using a certificate that
    is recognized and approved by the organization. Check that yum verifies the signature of packages from a repository prior
    to install with the following command: # grep gpgcheck /etc/yum.conf gpgcheck=1 If "gpgcheck" is not set to "1", or if
    options are missing or commented out, ask the System Administrator how the certificates for patches and other operating
    system components are verified. If there is no process to validate certificates that is approved by the organization,
    this is a finding.'
  inputs: []
  evidence: []
