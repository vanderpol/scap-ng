assessment:
  id: ng.shared.406e88119e62f58069911b12
  version: 1
  assessment_title: WN12-CC-000088
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\Windows\System
        name:
          operation: equals
          datatype: string
          mask: false
          value: EnableSmartScreen
      object_title: null
  states:
    state-reg-dword-type-and-value-equals-1:
      state_title: Reg_Dword type and value equals 1
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    state-reg-dword-type-and-value-equals-2:
      state_title: Reg_Dword type and value equals 2
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '2'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-configure-windows-smartscreen-set-enabled-give-user-warning-selected-or:
      test_title: '''Configure Windows SmartScreen'' is set to ''Enabled'' with ''Give user a warning...'' selected or ''Require
        approval from an administrator...'' selected'
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-reg-dword-type-and-value-equals-1
      - state-reg-dword-type-and-value-equals-2
  evaluate:
    test: test-configure-windows-smartscreen-set-enabled-give-user-warning-selected-or
