assessment:
  id: ng.shared.30aa3060b3185fee5d4d5843
  version: 1
  assessment_title: Strong Session Key
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Services\Netlogon\Parameters
        name:
          operation: equals
          datatype: string
          mask: false
          value: RequireStrongKey
  variables:
    require-strong-session-key-variable:
      title: Require Strong Session Key
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: require_strong_session_key_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-domain-member-require-strong-windows-2000-or-later-session-key:
      test_title: '''Domain member: Require strong (Windows 2000 or later) session key'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: require-strong-session-key-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-domain-member-require-strong-windows-2000-or-later-session-key
