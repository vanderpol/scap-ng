assessment:
  id: ng.shared.385f296aaad0202fd6a32de7
  version: 1
  assessment_title: OL 8 audit tools must have a mode of "0755" or less permissive.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the audit tools are protected from unauthorized access, deletion, or modification by checking the permissive
    mode. Check the octal permission of each audit tool by running the following command: $ sudo stat -c "%a %n" /sbin/auditctl
    /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /sbin/rsyslogd /sbin/augenrules 755 /sbin/auditctl 755 /sbin/aureport
    755 /sbin/ausearch 750 /sbin/autrace 755 /sbin/auditd 755 /sbin/rsyslogd 755 /sbin/augenrules If any of the audit tools
    has a mode more permissive than "0755", this is a finding.'
  inputs: {}
  evidence: []
