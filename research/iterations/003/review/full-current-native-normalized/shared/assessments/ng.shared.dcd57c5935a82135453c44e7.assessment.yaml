          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: '0'
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-system-disable-directed-broadcast-packet-forwarding:
      test_title: The system must disable directed broadcast packet forwarding.
      capability: independent.shellcommand
