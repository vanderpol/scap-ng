assessment:
  id: ng.shared.bd8947665216cb938ed17fa0
  version: 1
  assessment_title: The Oracle Linux operating system must audit all uses of the chcon command.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system generates audit records when successful/unsuccessful attempts to use the "chcon"
    command occur. Check the file system rule in "/etc/audit/audit.rules" with the following command: $ sudo grep -w "/usr/bin/chcon"
    /etc/audit/audit.rules -a always,exit -F path=/usr/bin/chcon -F perm=x -F auid>=1000 -F auid!=unset -k privileged-priv_change
    If the command does not return any output, this is a finding.'
  inputs: {}
  evidence: []
