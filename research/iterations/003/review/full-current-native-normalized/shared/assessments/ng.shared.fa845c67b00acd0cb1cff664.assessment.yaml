assessment:
  id: ng.shared.fa845c67b00acd0cb1cff664
  version: 1
  assessment_title: The OL 8 audit log directory must have a mode of 0700 or less permissive to prevent unauthorized read
    access.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the audit log directories have a mode of "0700" or less permissive by first determining where the audit
    logs are stored with the following command: $ sudo grep -iw log_file /etc/audit/auditd.conf log_file = /var/log/audit/audit.log
    Using the location of the audit log, determine the directory where the audit logs are stored (ex: "/var/log/audit"). Run
    the following command to determine the permissions for the audit log folder: $ sudo stat -c "%a %n" /var/log/audit 700
    /var/log/audit If the audit log directory has a mode more permissive than "0700", this is a finding.'
  inputs: {}
  evidence: []
