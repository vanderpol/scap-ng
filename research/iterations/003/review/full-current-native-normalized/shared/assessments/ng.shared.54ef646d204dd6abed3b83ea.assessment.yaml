assessment:
  id: ng.shared.54ef646d204dd6abed3b83ea
  version: 1
  assessment_title: Audit - Authentication Policy Change - Success
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-auditeventpolicysubcategories-collection:
      collection_title: null
      capability: windows.auditeventpolicysubcategories
  tests:
    test-audit-authentication-policy-change-success-only:
      test_title: Audit - Authentication Policy Change - Success only
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Audit - Authentication Policy Change - Success only
        state_capability: windows.auditeventpolicysubcategories
        state:
          field: authentication_policy_change
          value: AUDIT_SUCCESS
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-audit-authentication-policy-change-success-failure:
      test_title: Audit - Authentication Policy Change - Success and Failure
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Audit - Authentication Policy Change - Success and Failure
        state_capability: windows.auditeventpolicysubcategories
        state:
          field: authentication_policy_change
          value: AUDIT_SUCCESS_FAILURE
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    any:
    - test: test-audit-authentication-policy-change-success-only
    - test: test-audit-authentication-policy-change-success-failure
