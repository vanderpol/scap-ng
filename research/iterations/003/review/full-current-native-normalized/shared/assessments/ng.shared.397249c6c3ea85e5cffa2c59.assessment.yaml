assessment:
  id: ng.shared.397249c6c3ea85e5cffa2c59
  version: 1
  assessment_title: AZLX-23-002425 - Amazon Linux 2023 must be able to enforce a 60-day maximum password lifetime restriction.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    interactive-non-anonymous-users-collection:
      collection_title: interactive non-anonymous users
      capability: unix.password
      select:
        username:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
      filters:
      - action: include
        match:
          field: user_id
          value: '1000'
          operation: greater than or equal
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        capability: unix.password
      - action: include
        match:
          field: user_id
          value:
            variable: anonymous-uids-variable
          operation: not equal
          datatype: int
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: anonymous users
        capability: unix.password
    etc-shadow-max-password-ages-non-system-users-collection:
      collection_title: /etc/shadow max password ages for non-system users
      capability: unix.shadow
      select:
        username:
          operation: pattern match
          datatype: string
          mask: false
          value: .+
      filters:
      - action: include
        match:
          field: username
          value:
            variable: pattern-match-lines-starting-usernames-system-users-variable
          operation: pattern match
          datatype: string
          mask: false
          variable_check: at least one
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: Lines starting with usernames of system users
        capability: unix.shadow
    etc-shadow-max-password-age-root-collection:
      collection_title: /etc/shadow max password age for root
      capability: unix.shadow
      select:
        username:
          operation: equals
          datatype: string
          mask: false
          value: root
  variables:
    anonymous-uids-variable:
      title: anonymous UIDs
      kind: constant
      datatype: int
      expression:
        literal:
        - '65534'
        - '65535'
        - '4294967294'
        - '4294967295'
    pattern-match-lines-starting-usernames-system-users-variable:
      title: Pattern to match lines starting with usernames of system users
      kind: local
      datatype: string
      expression:
        concat:
        - literal:
            value: ^
            datatype: string
        - values:
            collection: interactive-non-anonymous-users-collection
            field: username
        - literal:
            value: $
            datatype: string
  tests:
    test-no-password-in-etc-shadow-has-maximum-password-age-0:
      test_title: No password in /etc/shadow has a maximum password age of 0 or greater than 60
      capability: unix.shadow
      collection: etc-shadow-max-password-ages-non-system-users-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_operator: AND
        states:
        - state_title: greater than zero
          capability: unix.shadow
          state:
            field: chg_req
            value: '0'
            operation: greater than
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: less than or equal to sixty
          capability: unix.shadow
          state:
            field: chg_req
            value: '60'
            operation: less than or equal
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-root-password-in-etc-shadow-does-not-have-maximum-password:
      test_title: Root password in /etc/shadow does not have a maximum password age of 0 or greater than 60
      capability: unix.shadow
      collection: etc-shadow-max-password-age-root-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_operator: AND
        states:
        - state_title: greater than zero
          capability: unix.shadow
          state:
            field: chg_req
            value: '0'
            operation: greater than
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: less than or equal to sixty
          capability: unix.shadow
          state:
            field: chg_req
            value: '60'
            operation: less than or equal
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-no-password-in-etc-shadow-has-maximum-password-age-0
    - test: test-root-password-in-etc-shadow-does-not-have-maximum-password
