assessment:
  id: ng.shared.9a60aea20acb8a91fa7107d8
  version: 1
  assessment_title: Exchange connectivity logging must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    run-get-transportservice-command-determine-if-connectivitylogenabled-set-true-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: powershell
        command:
          operation: equals
          datatype: string
          value: add-pssnapin Microsoft.Exchange.Management.Powershell.Snapin;Get-TransportService | Select-Object -Property
            Name, Identity, ConnectivityLogEnabled | Format-Table -HideTableHeaders
        pattern:
          operation: equals
          datatype: string
          value: \w
      behaviors:
        error_if_stderr_exists: 'true'
      object_title: Run Get-TransportService command to determine if ConnectivityLogEnabled is set to true.
  states:
    state-verify-value-is-true:
      state_title: Verify value is True
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: (?i)true$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-if-value-connectivitylogenabled-not-set-true-this-finding:
      test_title: If the value of ConnectivityLogEnabled is not set to True, this is a finding.
      capability: independent.shellcommand
      object: run-get-transportservice-command-determine-if-connectivitylogenabled-set-true-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-verify-value-is-true
  evaluate:
    test: test-if-value-connectivitylogenabled-not-set-true-this-finding
