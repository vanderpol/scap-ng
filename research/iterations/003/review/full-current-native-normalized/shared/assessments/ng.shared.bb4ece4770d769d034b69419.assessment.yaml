assessment:
  id: ng.shared.bb4ece4770d769d034b69419
  version: 1
  assessment_title: The macOS system must configure audit log files to not contain access control lists.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured without ACLs applied to log files with the following command: /bin/ls
    -le $(/usr/bin/grep ''^dir'' /etc/security/audit_control | /usr/bin/awk -F: ''{print $2}'') | /usr/bin/awk ''{print $1}''
    | /usr/bin/grep -c ":" If the result is not "0", this is a finding.'
  inputs: {}
  evidence: []
