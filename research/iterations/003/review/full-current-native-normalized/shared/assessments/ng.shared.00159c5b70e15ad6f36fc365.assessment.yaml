assessment:
  id: ng.shared.00159c5b70e15ad6f36fc365
  version: 1
  assessment_title: The macOS system must compare internal information system clocks at least every 24 hours with a server
    that is synchronized to one of the redundant United States Naval Observatory (USNO) time servers or a time server designated
    for the appropriate DOD network (NIPRNet/SIPRNet) and/or the Global Positioning System (GPS).
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-time-server-enabled-recommended-object-collection:
      collection_title: os_time_server_enabled_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /bin/launchctl print system | /usr/bin/grep com.apple.timed
  tests:
    test-os-time-server-enabled-recommended-test:
      test_title: os_time_server_enabled_recommended_test
      capability: independent.shellcommand
      collection: os-time-server-enabled-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: os_time_server_enabled_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: .*
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-os-time-server-enabled-recommended-test
