assessment:
  id: ng.shared.8e464249184a691e1490960e
  version: 1
  assessment_title: UBTU-22-232085 - Ubuntu 22.04 LTS must configure the directories used by the system journal to be group-owned
    by "systemd-journal".
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    run-log-journal-directory-subdirectories-collection:
      collection_title: /run/log/journal directory and subdirectories
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /run/log/journal
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
      filters:
      - action: include
        match:
          field: type
          value: directory
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        capability: unix.file
      behaviors:
        recurse_direction: down
        recurse_file_system: local
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/group
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: '^systemd-journal:[^:]*:([0-9]+):'
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    var-log-journal-directory-subdirectories-collection:
      collection_title: /var/log/journal directory and subdirectories
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /var/log/journal
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
      filters:
      - action: include
        match:
          field: type
          value: directory
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        capability: unix.file
      behaviors:
        recurse_direction: down
        recurse_file_system: local
  variables:
    gid-systemd-journal-variable:
      title: GID for systemd-journal
      kind: local
      datatype: int
      expression:
        values:
          collection: independent-textfilecontent54-collection
          field: subexpression
  tests:
    test-run-log-journal-subdirectories-thereof-group-owned-by-systemd-journal:
      test_title: /run/log/journal, and subdirectories thereof, are group-owned by systemd-journal
      capability: unix.file
      collection: run-log-journal-directory-subdirectories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: group id for systemd-journal
        state_capability: unix.file
        state:
          field: group_id
          value:
            variable: gid-systemd-journal-variable
          operation: equals
          datatype: int
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
    test-var-log-journal-subdirectories-thereof-group-owned-by-systemd-journal:
      test_title: /var/log/journal, and subdirectories thereof, are group-owned by systemd-journal
      capability: unix.file
      collection: var-log-journal-directory-subdirectories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: group id for systemd-journal
        state_capability: unix.file
        state:
          field: group_id
          value:
            variable: gid-systemd-journal-variable
          operation: equals
          datatype: int
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-run-log-journal-subdirectories-thereof-group-owned-by-systemd-journal
    - test: test-var-log-journal-subdirectories-thereof-group-owned-by-systemd-journal
