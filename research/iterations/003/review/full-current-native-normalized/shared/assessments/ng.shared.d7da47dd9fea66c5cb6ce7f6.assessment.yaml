assessment:
  id: ng.shared.d7da47dd9fea66c5cb6ce7f6
  version: 1
  assessment_title: UBTU-22-252020 - Ubuntu 22.04 LTS must record time stamps for audit records that can be mapped to Coordinated
    Universal Time (UTC).
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    unix-symlink-collection:
      collection_title: null
      capability: unix.symlink
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/localtime
  tests:
    test-time-zone-set-utc:
      test_title: time zone is set to UTC
      capability: unix.symlink
      collection: unix-symlink-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: unix.symlink
        state:
          field: canonical_path
          value: /usr/share/zoneinfo/Etc/UTC
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-time-zone-set-utc
