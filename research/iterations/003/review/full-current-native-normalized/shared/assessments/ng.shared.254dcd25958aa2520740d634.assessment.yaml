assessment:
  id: ng.shared.254dcd25958aa2520740d634
  version: 1
  assessment_title: AZLX-23-000135 - Amazon Linux 2023 systemd-journald service must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-systemdunitproperty-collection:
      collection_title: null
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          mask: false
          value: systemd-journald.service
        property:
          operation: equals
          datatype: string
          mask: false
          value: ActiveState
  tests:
    test-systemd-journald-service-active:
      test_title: The systemd-journald service is active.
      capability: linux.systemdunitproperty
      collection: linux-systemdunitproperty-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: linux.systemdunitproperty
        state:
          field: value
          value: active
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-systemd-journald-service-active
