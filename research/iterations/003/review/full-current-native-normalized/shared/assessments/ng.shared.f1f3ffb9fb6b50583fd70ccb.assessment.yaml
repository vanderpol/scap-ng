  version: 1
  assessment_title: AZLX-23-001050 - Amazon Linux 2023 must have the chrony package installed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-rpminfo-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: chrony
      object_title: null
  states: {}
  tests:
    test-chrony-package-installed:
      test_title: The chrony package is installed
      capability: linux.rpminfo
      object: linux-rpminfo-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    test: test-chrony-package-installed
