assessment:
  id: ng.shared.9cf36a8a6d951a06f6062777
  version: 1
  assessment_title: WN10-AU-000582 - Windows 10 must be configured to audit file system successes.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-auditeventpolicysubcategories-collection:
      collection_title: null
      capability: windows.auditeventpolicysubcategories
  tests:
    test-audit-file-system-set-success:
      test_title: '''Audit File System'' is set to ''Success'''
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: '''File System'' is set to ''Success'''
        state_capability: windows.auditeventpolicysubcategories
        state:
          field: file_system
          value: AUDIT_SUCCESS
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-audit-file-system-set-success-failure:
      test_title: '''Audit File System'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: '''File System'' is set to ''Success'' and ''Failure'''
        state_capability: windows.auditeventpolicysubcategories
        state:
          field: file_system
          value: AUDIT_SUCCESS_FAILURE
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    any:
    - test: test-audit-file-system-set-success
    - test: test-audit-file-system-set-success-failure
