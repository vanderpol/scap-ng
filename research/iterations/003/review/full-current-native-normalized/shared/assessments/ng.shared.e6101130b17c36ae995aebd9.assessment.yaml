assessment:
  id: ng.shared.e6101130b17c36ae995aebd9
  version: 1
  assessment_title: Linux krb5 server 1.17 or higher is not installed
  mode: automated
  class: inventory
  purpose: applicability
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    kerberos-server-package-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          value: krb5-server
      object_title: Kerberos server package
  states:
    state-1-17-18-or-newer-release:
      state_title: 1.17-18 or newer release
      capability: linux.rpminfo
      state:
        all:
        - field: release
          value: '18'
          operation: greater than or equal
          datatype: version
          entity_check: all
          entity_existence: at_least_one_exists
        - field: version
          value: '1.17'
          operation: equals
          datatype: version
          entity_check: all
          entity_existence: at_least_one_exists
    state-1-17-or-newer-version:
      state_title: 1.17 or newer version
      capability: linux.rpminfo
      state:
        field: version
        value: '1.17'
        operation: greater than
        datatype: version
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-krb5-server-1-17-18-el8-x86-64-or-newer:
      test_title: krb5-server-1.17-18.el8.x86_64 or newer is installed.
      capability: linux.rpminfo
      object: kerberos-server-package-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-1-17-18-or-newer-release
      - state-1-17-or-newer-version
  evaluate:
    not:
      test: test-krb5-server-1-17-18-el8-x86-64-or-newer
