assessment:
  id: ng.shared.9fe4c744c17a647733fdb4d4
  version: 1
  assessment_title: Windows 11 systems must have a Trusted Platform Module (TPM) enabled.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    check-tpm-values-collection:
      collection_title: Check for TPM values
      capability: windows.cmdlet
      select:
        module_name:
          operation: equals
          datatype: string
          mask: false
          value: TrustedPlatformModule
        module_id:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
        module_version:
          operation: equals
          datatype: version
          mask: false
          nil: true
          value: ''
        verb:
          operation: equals
          datatype: string
          mask: false
          value: Get
        noun:
          operation: equals
          datatype: string
          mask: false
          value: Tpm
        parameters:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
        select:
          operation: equals
          datatype: record
          mask: false
          value:
            record:
            - name: property
              value: tpmpresent,tpmready,tpmenabled
              operation: equals
              datatype: string
              mask: false
              entity_check: all
    check-tpm-specific-version-collection:
      collection_title: Check for TPM Specific Version
      capability: windows.cmdlet
      select:
        module_name:
          operation: equals
          datatype: string
          mask: false
          value: CimCmdlets
        module_id:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
        module_version:
          operation: equals
          datatype: version
          mask: false
          nil: true
          value: ''
        verb:
          operation: equals
          datatype: string
          mask: false
          value: Get
        noun:
          operation: equals
          datatype: string
          mask: false
          value: CimInstance
        parameters:
          operation: equals
          datatype: record
          mask: false
          value:
            record:
            - name: classname
              value: Win32_TPM
              operation: equals
              datatype: string
              mask: false
              entity_check: all
            - name: namespace
              value: root\cimv2\security\microsofttpm
              operation: equals
              datatype: string
              mask: false
              entity_check: all
        select:
          operation: equals
          datatype: record
          mask: false
          value:
            record:
            - name: property
              value: specversion
              operation: equals
              datatype: string
              mask: false
              entity_check: all
  tests:
    test-windows-have-tpm-ready-use:
      test_title: Windows must have TPM and must be ready to use
      capability: windows.cmdlet
      collection: check-tpm-values-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: TPM values must be equal to True
        state_capability: windows.cmdlet
        state:
          field: value
          value:
            record:
            - name: tpmpresent
              value: 'True'
              operation: equals
              datatype: string
              mask: false
              entity_check: all
            - name: tpmready
              value: 'True'
              operation: equals
              datatype: string
              mask: false
              entity_check: all
            - name: tpmenabled
              value: 'True'
              operation: equals
              datatype: string
              mask: false
              entity_check: all
          operation: equals
          datatype: record
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-windows-tpm-specific-version-should-version-2-0:
      test_title: Windows TPM Specific Version should be version 2.0
      capability: windows.cmdlet
      collection: check-tpm-specific-version-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: Specific Version must be 2.0
        state_capability: windows.cmdlet
        state:
          field: value
          value:
            record:
            - name: specversion
              value: 2\.0
              operation: pattern match
              datatype: string
              mask: false
              entity_check: all
          operation: equals
          datatype: record
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-windows-have-tpm-ready-use
    - test: test-windows-tpm-specific-version-should-version-2-0
