assessment:
  id: ng.shared.582751cc3e159fbd269c627b
  version: 1
  assessment_title: WN12-CC-000088
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\Windows\System
        name:
          operation: equals
          datatype: string
          mask: false
          value: EnableSmartScreen
  tests:
    test-configure-windows-smartscreen-set-enabled-give-user-warning-selected-or:
      test_title: '''Configure Windows SmartScreen'' is set to ''Enabled'' with ''Give user a warning...'' selected or ''Require
        approval from an administrator...'' selected'
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: Reg_Dword type and value equals 1
          capability: windows.registry
          state:
            all:
            - field: type
              value: reg_dword
              operation: equals
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            - field: value
              value: '1'
              operation: equals
              datatype: int
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
        - state_title: Reg_Dword type and value equals 2
          capability: windows.registry
          state:
            all:
            - field: type
              value: reg_dword
              operation: equals
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            - field: value
              value: '2'
              operation: equals
              datatype: int
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
  evaluate:
    test: test-configure-windows-smartscreen-set-enabled-give-user-warning-selected-or
