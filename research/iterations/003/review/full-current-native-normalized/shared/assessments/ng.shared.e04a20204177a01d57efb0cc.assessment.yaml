assessment:
  id: ng.shared.e04a20204177a01d57efb0cc
  version: 1
  assessment_title: The system must be configured to audit Policy Change - Authentication Policy Change successes.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Security Option "Audit: Force audit policy subcategory settings (Windows Vista or later) to override audit policy
    category settings" must be set to "Enabled" (V-14230) for the detailed auditing subcategories to be effective. Use the
    AuditPol tool to review the current Audit Policy configuration: -Open a Command Prompt with elevated privileges ("Run
    as Administrator"). -Enter "AuditPol /get /category:*". Compare the AuditPol settings with the following. If the system
    does not audit the following, this is a finding. Policy Change -> Authentication Policy Change - Success'
  inputs: []
  evidence: []
