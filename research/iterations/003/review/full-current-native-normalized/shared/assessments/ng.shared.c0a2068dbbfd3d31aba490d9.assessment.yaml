assessment:
  id: ng.shared.c0a2068dbbfd3d31aba490d9
  version: 1
  assessment_title: The Oracle Linux operating system must label all off-loaded audit logs before sending them to the central
    log server.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the audisp daemon is configured to label all off-loaded audit logs: # grep "name_format" /etc/audisp/audispd.conf
    name_format = hostname If the "name_format" option is not "hostname", "fqd", or "numeric", or the line is commented out,
    ask the System Administrator to indicate how the audit logs are off-loaded to a different system or storage media, and
    to indicate if the logs are labeled appropriately. If there is no evidence that the system is configured to off-load audit
    logs to a different system or storage media, or if the configuration does not appropriately label logs before they are
    off-loaded, this is a finding.'
  inputs: {}
  evidence: []
