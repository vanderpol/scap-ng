assessment:
  id: ng.shared.df0aff57e2f56803ac07e0cd
  version: 1
  assessment_title: UBTU-18-010031 - The Ubuntu operating system must enforce a delay of at least 4 seconds between logon
    prompts following a failed logon attempt.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/pam.d/common-auth
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*auth\s+required\s+pam_faildelay\.so\s+delay=(\d+)\s*(?:#.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-pam-faildelay-4-seconds-or-greater:
      test_title: pam_faildelay is 4 seconds or greater
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: '4000000'
          operation: greater than or equal
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-pam-faildelay-4-seconds-or-greater
