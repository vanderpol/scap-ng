assessment:
  id: ng.shared.69e8fcb717d4958cd15fbd82
  version: 1
  assessment_title: OL 8 systems below version 8.2 must ensure account lockouts persist.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    test-etc-pam-d-password-auth-pam-faillock-so-preauth-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/pam.d/password-auth
        pattern:
          operation: pattern match
          datatype: string
          value: \n*\s*auth\s+required\s+pam_faillock.so\s+preauth\s+.*?(dir=\S+)\s*.*?\b
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: Test /etc/pam.d/password-auth pam_faillock.so preauth line for dir parameter.
    test-etc-pam-d-password-auth-pam-faillock-so-authfail-object:
      capability: independent.textfilecontent54
