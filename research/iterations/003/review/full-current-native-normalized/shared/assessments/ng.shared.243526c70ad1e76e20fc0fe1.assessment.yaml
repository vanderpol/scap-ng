assessment:
  id: ng.shared.243526c70ad1e76e20fc0fe1
  version: 1
  assessment_title: The Security event log size must be configured to 196608 KB or greater.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the system is configured to write events directly to an audit server, this is NA. If the following registry
    value does not exist or is not configured as specified, this is a finding: Registry Hive: HKEY_LOCAL_MACHINE Registry
    Path: \SOFTWARE\Policies\Microsoft\Windows\EventLog\Security\ Value Name: MaxSize Type: REG_DWORD Value: 0x00030000 (196608)
    (or greater)'
  inputs: []
  evidence: []
