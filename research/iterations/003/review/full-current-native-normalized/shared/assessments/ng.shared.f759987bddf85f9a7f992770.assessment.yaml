assessment:
  id: ng.shared.f759987bddf85f9a7f992770
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that users must provide a password for privilege
    escalation.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system requires users to supply a password for privilege escalation. Check the configuration
    of the "/etc/sudoers" and "/etc/sudoers.d/*" files with the following command: $ sudo grep -ir nopasswd /etc/sudoers /etc/sudoers.d
    If any occurrences of "NOPASSWD" are returned from the command and have not been documented with the Information System
    Security Officer (ISSO) as an organizationally defined administrative group utilizing MFA, this is a finding.'
  inputs: {}
  evidence: []
