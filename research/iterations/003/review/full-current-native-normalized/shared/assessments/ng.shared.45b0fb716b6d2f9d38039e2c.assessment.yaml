assessment:
  id: ng.shared.45b0fb716b6d2f9d38039e2c
  version: 1
  assessment_title: The macOS system must disable Location Services.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable Location Services with the following command: /usr/bin/sudo
    -u _locationd /usr/bin/osascript -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.locationd'')\
    .objectForKey(''LocationServicesEnabled'').js EOS If the result is not "false", this is a finding.'
  inputs: {}
  evidence: []
