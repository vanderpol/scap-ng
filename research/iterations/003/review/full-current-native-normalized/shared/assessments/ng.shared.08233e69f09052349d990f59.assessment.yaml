assessment:
  id: ng.shared.08233e69f09052349d990f59
  version: 1
  assessment_title: Duplicate group names must not exist.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    get-any-duplicate-group-names-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: getent group | cut -f1 -d":" | sort -n | uniq -d
        pattern:
          operation: pattern match
          datatype: string
          value: .*
      object_title: Get any duplicate group names
  states:
    state-nothing-is-returned-and-command-exits-with-a-status-of-0:
      state_title: Nothing is returned and command exits with a status of 0
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: ''
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: none_exist
  tests:
    test-duplicate-group-names-not-exist:
      test_title: Duplicate group names must not exist.
      capability: independent.shellcommand
      object: get-any-duplicate-group-names-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-nothing-is-returned-and-command-exits-with-a-status-of-0
  evaluate:
    test: test-duplicate-group-names-not-exist
