assessment:
  id: ng.shared.5ecdc4b90570b7ebdbae094a
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that when passwords are changed the number of
    repeating consecutive characters must not be more than three characters.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The "maxrepeat" option sets the maximum number of allowed same consecutive characters in a new password. Check
    for the value of the "maxrepeat" option in "/etc/security/pwquality.conf" with the following command: # grep maxrepeat
    /etc/security/pwquality.conf maxrepeat = 3 If the value of "maxrepeat" is set to more than "3", this is a finding.'
  inputs: []
  evidence: []
