assessment:
  id: ng.shared.e3ddd57bcc8e406f95dcdb09
  version: 1
  assessment_title: The Add workstations to domain user right must only be assigned to the Administrators group.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This applies to domain controllers. It is NA for other systems. Verify the effective setting in Local Group
    Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security
    Settings >> Local Policies >> User Rights Assignment. If any accounts or groups other than the following are granted the
    "Add workstations to domain" right, this is a finding. - Administrators For server core installations, run the following
    command: Secedit /Export /Areas User_Rights /cfg c:\path\filename.txt Review the text file. If any SIDs other than the
    following are granted the "SeMachineAccountPrivilege" user right, this is a finding. S-1-5-32-544 (Administrators)'
  inputs: []
  evidence: []
