assessment:
  id: ng.shared.a2981e2674397d3677da645c
  version: 1
  assessment_title: The system must verify that package updates are digitally signed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    pkg-property-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: pkg property
        pattern:
          operation: pattern match
          datatype: string
          value: signature-policy
      object_title: pkg property
  states:
    state-check-that-line-returns-signature-policy-verify:
      state_title: Check that line returns signature-policy               verify
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: signature-policy               verify
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-determine-what-signature-policy-pkg-publishers:
      test_title: 'Determine what the signature policy is for pkg publishers:'
      capability: independent.shellcommand
      object: pkg-property-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-check-that-line-returns-signature-policy-verify
  evaluate:
    test: test-determine-what-signature-policy-pkg-publishers
