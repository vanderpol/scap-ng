assessment:
  id: ng.shared.8d9e88bfa6011a680f22b6d9
  version: 1
  assessment_title: The Create a pagefile user right must only be assigned to the Administrators group.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy
    >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment. If any
    accounts or groups other than the following are granted the "Create a pagefile" user right, this is a finding: Administrators'
  inputs: {}
  evidence: []
