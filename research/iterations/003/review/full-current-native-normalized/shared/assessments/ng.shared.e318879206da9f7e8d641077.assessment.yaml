  assessment_title: The macOS system must enforce time synchronization.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to enforce time synchronization with the following command: /usr/bin/osascript
    -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.timed'')\ .objectForKey(''TMAutomaticTimeOnlyEnabled'').js
    EOS If the result is not "true", this is a finding.'
