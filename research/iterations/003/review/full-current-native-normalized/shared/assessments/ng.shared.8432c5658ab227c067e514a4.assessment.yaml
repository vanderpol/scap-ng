assessment:
  id: ng.shared.8432c5658ab227c067e514a4
  version: 1
  assessment_title: The kernel core dump data directory must have mode 0700 or less permissive.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The root role is required. This check applies to the global zone only. Determine the zone that you are currently
    securing. # zonename If the command output is "global", this check applies. Determine the location of the system dump
    directory. # dumpadm | grep directory Check the permissions of the kernel core dump data directory. # ls -ld [savecore
    directory] If the directory has a mode more permissive than 0700 (rwx --- ---), this is a finding.'
  inputs: []
  evidence: []
