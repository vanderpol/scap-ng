assessment:
  id: ng.shared.e75b4df4fbc880e90302bdf4
  version: 1
  assessment_title: Active Directory Group Policy objects must be configured with proper audit settings.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    query-both-fail-success-auditing-settings-domain-organizational-unit-ou-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: powershell
        command:
          operation: equals
          datatype: string
          value: '$gGuid=''f30e3bc2-9ff0-11d1-b603-0000f80367c1''; $zGuid=''00000000-0000-0000-0000-000000000000''; $gpos=Get-ADObject
            -Filter "objectClass -eq ''groupPolicyContainer''" -SearchBase ("CN=Policies,CN=System,"+(Get-ADDomain).DistinguishedName)
            -Properties displayName; $results=foreach($gpo in $gpos){$path="AD:\$($gpo.DistinguishedName)"; $aud=(Get-Acl
            $path -Audit).Audit; $reasons=@(); $fRules=$aud|Where-Object{$_.IdentityReference -match ''Everyone|S-1-1-0''
            -and $_.AuditFlags -match ''Failure'' -and ($_.ActiveDirectoryRights -match ''GenericAll|FullControl|All'')};
            $vFail=$fRules|Where-Object{$_.InheritanceType -ne ''None'' -and ($_.InheritedObjectType.ToString() -eq $zGuid
            -or $_.InheritedObjectType.ToString() -eq $gGuid)}; if(-not $fRules){$reasons+=''MISSING: Everyone to Failure
            to GenericAll/FullControl audit policy''}elseif(-not $vFail){if($fRules|Where-Object{$_.InheritanceType -eq ''None''}){$reasons+=''INVALID
            SCOPE: Everyone to Failure policy is set to This Object Only (Requires Inheritance)''}else{$reasons+=''INVALID
            SCOPE: Everyone to Failure policy inherits to an incorrect object type (Must be All or groupPolicyContainer)''}};
            $sRules=$aud|Where-Object{$_.IdentityReference -match ''Everyone|S-1-1-0'' -and $_.AuditFlags -match ''Success''
            -and ($_.ActiveDirectoryRights -match ''ExtendedRight|WriteProperty'')}; $vSucc=$sRules|Where-Object{$_.InheritanceType
            -ne ''None'' -and ($_.InheritedObjectType.ToString() -eq $zGuid -or $_.InheritedObjectType.ToString() -eq $gGuid)};
            if(-not $sRules){$reasons+=''MISSING: Everyone to Success to ExtendedRight/WriteProperty audit policy''}elseif(-not
            $vSucc){if($sRules|Where-Object{$_.InheritanceType -eq ''None''}){$reasons+=''INVALID SCOPE: Everyone to Success
            policy is set to This Object Only (Requires Inheritance)''}else{$reasons+=''INVALID SCOPE: Everyone to Success
            policy inherits to an incorrect object type (Must be All or groupPolicyContainer)''}}; if($reasons.Count -gt 0){"Target_Object=$($gpo.displayName)
            | IdentityReference=Everyone (S-1-1-0) | Status=FAIL | Details=$($reasons -join '' - '')"}}; if($results){$results}else{"Target_Object=All
            GPOs | IdentityReference=Everyone (S-1-1-0) | Status=PASS | Details=All Active Directory GPO audit ACLs are STIG
            compliant with correct inheritance scopes."}'
        pattern:
          operation: equals
          datatype: string
          value: .+
      behaviors:
        error_if_stderr_exists: 'true'
      object_title: Query both Fail and Success auditing settings for Domain Organizational Unit (OU) but only return data
        back on missing or misconfigured OU's
  states:
    state-no-lines-shall-exist-listed-with-status-of-fail:
      state_title: No lines shall exist listed with status of 'FAIL'
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: '=FAIL '
        operation: pattern match
        datatype: string
        entity_check: none satisfy
        entity_existence: at_least_one_exists
  tests:
    test-windows-server-active-directory-domain-object-configured-proper-audit-settings:
      test_title: Windows Server Active Directory Domain object must be configured with proper audit settings.
      capability: independent.shellcommand
      object: query-both-fail-success-auditing-settings-domain-organizational-unit-ou-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-no-lines-shall-exist-listed-with-status-of-fail
  evaluate:
    test: test-windows-server-active-directory-domain-object-configured-proper-audit-settings
