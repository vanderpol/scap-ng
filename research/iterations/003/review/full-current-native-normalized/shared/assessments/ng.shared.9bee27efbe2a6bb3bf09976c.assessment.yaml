assessment:
  id: ng.shared.9bee27efbe2a6bb3bf09976c
  version: 1
  assessment_title: OL 8 must configure the use of the pam_faillock.so module in the /etc/pam.d/system-auth file.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    retrieve-configuration-from-file-etc-pam-d-system-auth-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/pam.d/system-auth
        pattern:
          operation: pattern match
          datatype: string
          value: .+
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      behaviors:
        ignore_case: 'false'
        multiline: 'true'
        singleline: 'true'
      object_title: 'Retrieve configuration from file: /etc/pam.d/system-auth.'
  states:
    state-check-that-auth-required-pam-faillock-so-preath-line-exi:
      state_title: Check that auth required pam_faillock.so preath line exists.
      capability: independent.textfilecontent54
      state:
        field: text
        value: \n\s*auth\s+required\s+pam_faillock.so\s+preauth\b
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-check-that-auth-required-pam-faillock-so-authfail-line-e:
      state_title: Check that auth required pam_faillock.so authfail line exists.
      capability: independent.textfilecontent54
      state:
        field: text
        value: \n\s*auth\s+required\s+pam_faillock.so\s+authfail\b
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-check-that-account-required-pam-faillock-so-line-exists:
      state_title: Check that account required pam_faillock.so line exists.
      capability: independent.textfilecontent54
      state:
        field: text
        value: \n\s*account\s+required\s+pam_faillock.so\b
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-check-that-auth-required-pam-faillock-so-preath-line-pre:
      state_title: Check that auth required pam_faillock.so preath line preceeds the pam_unix.so line.
      capability: independent.textfilecontent54
      state:
        field: text
        value: \n\s*auth\s+required\s+pam_faillock.so\s+preauth(.*\n)*auth\s+(required|sufficient|requisite)\s+pam_unix.so
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-verify-pam-faillock-so-module-present-in-etc-pam-d:
      test_title: Verify the pam_faillock.so module is present in the '/etc/pam.d/system-auth' file.
      capability: independent.textfilecontent54
      object: retrieve-configuration-from-file-etc-pam-d-system-auth-object
      check_existence: at_least_one_exists
      check: all
      state_operator: AND
      states:
      - state-check-that-auth-required-pam-faillock-so-preath-line-exi
      - state-check-that-auth-required-pam-faillock-so-authfail-line-e
      - state-check-that-account-required-pam-faillock-so-line-exists
      - state-check-that-auth-required-pam-faillock-so-preath-line-pre
  evaluate:
    test: test-verify-pam-faillock-so-module-present-in-etc-pam-d
