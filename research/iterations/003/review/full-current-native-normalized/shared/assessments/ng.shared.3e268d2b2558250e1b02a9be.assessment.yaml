  assessment_title: Windows Server 2019 local users on domain-joined member servers must not be enumerated.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This applies to member servers. For domain controllers and standalone or nondomain-joined systems, this is NA.
    If the following registry value does not exist or is not configured as specified, this is a finding: Registry Hive: HKEY_LOCAL_MACHINE
    Registry Path: \SOFTWARE\Policies\Microsoft\Windows\System\ Value Name: EnumerateLocalUsers Type: REG_DWORD Value: 0x00000000
    (0)'
