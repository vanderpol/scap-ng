assessment:
  id: ng.shared.6c11d37a299a3e4f231eab13
  version: 1
  assessment_title: UBTU-18-010122 - The Ubuntu operating system must configure the /var/log directory to be group-owned by
    syslog.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    var-log-directory-collection:
      collection_title: /var/log directory
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /var/log
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
    etc-group-syslog-collection:
      collection_title: /etc/group for syslog
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc
        filename:
          operation: equals
          datatype: string
          mask: false
          value: group
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: '^syslog:[^:]*:([0-9]+):'
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
  variables:
    gid-syslog-variable:
      title: GID for syslog
      kind: local
      datatype: int
      expression:
        values:
          collection: etc-group-syslog-collection
          field: subexpression
  tests:
    test-var-log-directory-group-owned-by-syslog:
      test_title: /var/log directory must be group-owned by syslog
      capability: unix.file
      collection: var-log-directory-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Group-owned by syslog
        state_capability: unix.file
        state:
          field: group_id
          value:
            variable: gid-syslog-variable
          operation: equals
          datatype: int
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-var-log-directory-group-owned-by-syslog
