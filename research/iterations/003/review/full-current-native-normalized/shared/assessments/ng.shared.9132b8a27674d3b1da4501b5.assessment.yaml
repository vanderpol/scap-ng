assessment:
  id: ng.shared.9132b8a27674d3b1da4501b5
  version: 1
  assessment_title: The Oracle Linux operating system must restrict privilege elevation to authorized personnel.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the "sudoers" file restricts sudo access to authorized personnel. $ sudo grep -iw ''ALL'' /etc/sudoers
    /etc/sudoers.d/* If the either of the following entries are returned, this is a finding: ALL ALL=(ALL) ALL ALL ALL=(ALL:ALL)
    ALL'
  inputs: {}
  evidence: []
