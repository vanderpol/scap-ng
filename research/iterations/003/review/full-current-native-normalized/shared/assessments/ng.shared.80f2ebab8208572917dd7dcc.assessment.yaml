assessment:
  id: ng.shared.80f2ebab8208572917dd7dcc
  version: 1
  assessment_title: WN10-AC-000015 - The period of time before the bad logon counter is reset must be configured to 15 minutes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-lockoutpolicy-object:
      capability: windows.lockoutpolicy
      object_title: null
  states:
    state-lockout-observation-window-is-greater-than-or-equal-to-v:
      state_title: Lockout Observation Window is greater than or equal to variable
      capability: windows.lockoutpolicy
      state:
        field: lockout_observation_window
        value: '900'
        operation: greater than or equal
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-lockout-threshold-is-greater-than-0:
      state_title: Lockout Threshold is greater than 0
      capability: windows.lockoutpolicy
      state:
        field: lockout_threshold
        value: '0'
        operation: greater than
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-reset-account-lockout-counter-after-set-at-least-required-value:
      test_title: '''Reset account lockout counter after'' is set to at least the required value'
      capability: windows.lockoutpolicy
      object: windows-lockoutpolicy-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-lockout-observation-window-is-greater-than-or-equal-to-v
    test-account-lockout-threshold-not-set-0:
      test_title: '''Account lockout threshold'' is not set to ''0'''
      capability: windows.lockoutpolicy
      object: windows-lockoutpolicy-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-lockout-threshold-is-greater-than-0
  evaluate:
    all:
    - test: test-reset-account-lockout-counter-after-set-at-least-required-value
    - test: test-account-lockout-threshold-not-set-0
