assessment:
  id: ng.shared.2fd6032ee667f7a0667aee68
  version: 1
  assessment_title: RHEL-08-040249 - RHEL 8 must not forward IPv4 source-routed packets by default.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    unix-sysctl-collection:
      collection_title: null
      capability: unix.sysctl
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: net.ipv4.conf.default.accept_source_route
    other-sysctl-configuration-files-collection:
      collection_title: other sysctl configuration files
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: directories-containing-sysctl-configuration-files-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: \.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: (?:^|\.*\n)\s*net\.ipv4\.conf\.default\.accept_source_route\s*=\s*(\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    etc-sysctl-conf-collection:
      collection_title: /etc/sysctl.conf
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/sysctl.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: (?:^|.*\n)\s*net\.ipv4\.conf\.default\.accept_source_route\s*=\s*(\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    all-sysctl-configuration-files-collection:
      collection_title: all sysctl configuration files
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - collection: other-sysctl-configuration-files-collection
        - collection: etc-sysctl-conf-collection
  variables:
    directories-containing-sysctl-configuration-files-variable:
      title: Directories containing sysctl configuration files
      kind: constant
      datatype: string
      expression:
        literal:
        - /etc/sysctl.d
        - /run/sysctl.d
        - /lib/sysctl.d
        - /usr/lib/sysctl.d
        - /usr/local/lib/sysctl.d
  tests:
    test-net-ipv4-conf-default-accept-source-route-setting-in-kernel:
      test_title: net.ipv4.conf.default.accept_source_route setting in kernel is set to 0
      capability: unix.sysctl
      collection: unix-sysctl-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: null
        state_capability: unix.sysctl
        state:
          field: value
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-net-ipv4-conf-default-accept-source-route-setting-in-acceptable:
      test_title: net.ipv4.conf.default.accept_source_route setting in acceptable directory is set to 0, and nothing else,
        and there are no conflicting settings in other files
      capability: independent.textfilecontent54
      collection: all-sysctl-configuration-files-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-net-ipv4-conf-default-accept-source-route-setting-in-kernel
    - test: test-net-ipv4-conf-default-accept-source-route-setting-in-acceptable
