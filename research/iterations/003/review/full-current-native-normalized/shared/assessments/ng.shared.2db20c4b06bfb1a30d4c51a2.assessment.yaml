assessment:
  id: ng.shared.2db20c4b06bfb1a30d4c51a2
  version: 1
  assessment_title: Windows Online Troubleshooting Service
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows\ScriptedDiagnosticsProvider\Policy
        name:
          operation: equals
          datatype: string
          mask: false
          value: EnableQueryRemoteServer
      object_title: null
  variables:
    troubleshooting-allow-user-access-online-troubleshooting-content-on-microsoft-servers-variable:
      title: 'Troubleshooting: Allow user to access online troubleshooting content on Microsoft servers from the Troubleshooting
        Control Panel (via Windows Online Troubleshooting Service - WOTS)'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: troubleshooting_allow_user_to_access_online_troubleshooting_content_on_microsoft_servers_from_the_troubleshooting_control_panel_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: troubleshooting-allow-user-access-online-troubleshooting-content-on-microsoft-servers-variable
          operation: equals
          datatype: int
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-troubleshooting-allow-users-access-online-troubleshooting-content-on-microsoft-servers:
      test_title: '''Troubleshooting: Allow users to access online troubleshooting content on Microsoft servers from the Troubleshooting
        Control Panel (via Windows Online Troubleshooting Service - WOTS)'' is set to ''Disabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-troubleshooting-allow-users-access-online-troubleshooting-content-on-microsoft-servers
