assessment:
  id: ng.shared.452fba89d92ea1e97031640d
  version: 1
  assessment_title: The macOS system must require that passwords contain a minimum of one numeric character.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to require that passwords contain a minimum of one numeric character with
    the following command: /usr/bin/pwpolicy -getaccountpolicies 2> /dev/null | /usr/bin/tail +2 | /usr/bin/xmllint --xpath
    ''//dict/key[text()="policyIdentifier"]/following-sibling::*[1]/text()'' - | /usr/bin/grep "requireAlphanumeric" -c If
    the result is not "1", this is a finding.'
  inputs: []
  evidence: []
