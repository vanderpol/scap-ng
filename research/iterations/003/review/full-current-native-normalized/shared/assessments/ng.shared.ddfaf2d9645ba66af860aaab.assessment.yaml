assessment:
  id: ng.shared.ddfaf2d9645ba66af860aaab
  version: 1
  assessment_title: RHEL-08-040261 - RHEL 8 must not accept router advertisements on all IPv6 interfaces.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-sysctl-object:
      capability: unix.sysctl
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: net.ipv6.conf.all.accept_ra
      object_title: null
    setting-net-ipv6-conf-all-accept-ra-in-sysctl-d-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: directories-containing-sysctl-configuration-files-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: \.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*net\.ipv6\.conf\.all\.accept_ra\s*=\s*(\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: Setting for net.ipv6.conf.all.accept_ra in sysctl.d directories.
    setting-net-ipv6-conf-all-accept-ra-in-etc-sysctl-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/sysctl.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*net\.ipv6\.conf\.all\.accept_ra\s*=\s*(\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: Setting for net.ipv6.conf.all.accept_ra in /etc/sysctl.conf.
    setting-net-ipv6-conf-all-accept-ra-in-all-sysctl-object:
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - object: setting-net-ipv6-conf-all-accept-ra-in-sysctl-d-object
        - object: setting-net-ipv6-conf-all-accept-ra-in-etc-sysctl-object
      object_title: Setting for net.ipv6.conf.all.accept_ra in all sysctl configuration files.
  variables:
    directories-containing-sysctl-configuration-files-variable:
      title: Directories containing sysctl configuration files
      kind: constant
      datatype: string
      expression:
        literal:
        - /etc/sysctl.d
        - /run/sysctl.d
        - /lib/sysctl.d
        - /usr/lib/sysctl.d
        - /usr/local/lib/sysctl.d
  states:
    state-unix-sysctl:
      state_title: null
      capability: unix.sysctl
      state:
        field: value
        value: '0'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '0'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-net-ipv6-conf-all-accept-ra-set-0-in-kernel:
      test_title: net.ipv6.conf.all.accept_ra is set to 0 in kernel
      capability: unix.sysctl
      object: unix-sysctl-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-unix-sysctl
    test-net-ipv6-conf-all-accept-ra-set-0-in-sysctl:
      test_title: net.ipv6.conf.all.accept_ra is set to 0 in the sysctl configuration files.
      capability: independent.textfilecontent54
      object: setting-net-ipv6-conf-all-accept-ra-in-all-sysctl-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    all:
    - test: test-net-ipv6-conf-all-accept-ra-set-0-in-kernel
    - test: test-net-ipv6-conf-all-accept-ra-set-0-in-sysctl
