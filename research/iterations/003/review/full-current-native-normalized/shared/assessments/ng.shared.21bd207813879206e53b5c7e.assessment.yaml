assessment:
  id: ng.shared.21bd207813879206e53b5c7e
  version: 1
  assessment_title: OL08-00-030120 - The OL 8 audit log directory must have a mode of 0700 or less permissive to prevent unauthorized
    read access.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/audit/auditd.conf
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*log_file\s*=\s*(\S+)/\S+\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      behaviors:
        ignore_case: 'true'
      object_title: null
    audit-log-directory-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          variable_check: all
          value:
            variable: audit-data-directory-from-etc-audit-auditd-conf-variable
        filename:
          operation: equals
          datatype: string
          nil: true
          value: ''
      object_title: Audit log directory
  variables:
    audit-data-directory-from-etc-audit-auditd-conf-variable:
      title: audit data directory from /etc/audit/auditd.conf
      kind: local
      datatype: string
      expression:
        values:
          object: independent-textfilecontent54-object
          field: subexpression
  states:
    state-mode-0700-or-less-permissive:
      state_title: Mode 0700 or less permissive
      capability: unix.file
      state:
        all:
        - field: suid
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: sgid
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: sticky
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: gread
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: gwrite
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: gexec
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: oread
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: owrite
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: oexec
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-audit-log-directory-has-mode-0700-or-less-permissive:
      test_title: audit log directory has a mode of 0700 or less permissive
      capability: unix.file
      object: audit-log-directory-object
      check_existence: all_exist
      check: all
      states:
      - state-mode-0700-or-less-permissive
  evaluate:
    test: test-audit-log-directory-has-mode-0700-or-less-permissive
