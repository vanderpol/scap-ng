assessment:
  id: ng.shared.db38cdcd5b3369eac0a8e0b5
  version: 1
  assessment_title: Only administrators responsible for the member server or standalone or nondomain-joined system must have
    Administrator rights on the system.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: This applies to member servers and standalone or nondomain-joined systems. A separate version applies to domain
    controllers. Open "Computer Management". Navigate to "Groups" under "Local Users and Groups". Review the local "Administrators"
    group. Only administrator groups or accounts responsible for administration of the system may be members of the group.
    For domain-joined member servers, the Domain Admins group must be replaced by a domain member server administrator group.
    Standard user accounts must not be members of the local Administrator group. If accounts that do not have responsibility
    for administration of the system are members of the local Administrators group, this is a finding. If the built-in Administrator
    account or other required administrative accounts are found on the system, this is not a finding.
  inputs: []
  evidence: []
