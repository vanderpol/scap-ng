assessment:
  id: ng.shared.62db4887ed4b76bdbaee379e
  version: 1
  assessment_title: The macOS system must initiate the session lock no more than five seconds after a screen saver is started.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    system-settings-screensaver-ask-password-delay-enforce-stig-object-collection:
      collection_title: system_settings_screensaver_ask_for_password_delay_enforce_stig_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: "/usr/bin/osascript -l JavaScript << EOS\nfunction run() {\n  let delay = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.screensaver')\\\
            \n.objectForKey('askForPasswordDelay'))\n  if ( delay <= 5 ) {\n    return(\"true\")\n  } else {\n    return(\"\
            false\")\n  }\n}\nEOS"
  tests:
    test-system-settings-screensaver-ask-password-delay-enforce-stig-test:
      test_title: system_settings_screensaver_ask_for_password_delay_enforce_stig_test
      capability: independent.shellcommand
      collection: system-settings-screensaver-ask-password-delay-enforce-stig-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: system_settings_screensaver_ask_for_password_delay_enforce_stig_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: 'true'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-system-settings-screensaver-ask-password-delay-enforce-stig-test
