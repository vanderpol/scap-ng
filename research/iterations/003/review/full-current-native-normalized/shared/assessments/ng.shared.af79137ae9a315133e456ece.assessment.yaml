assessment:
  id: ng.shared.af79137ae9a315133e456ece
  version: 1
  assessment_title: The macOS system must be configured to disable sending diagnostic and usage data to Apple.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    system-settings-improve-siri-dictation-disable-recommended-object-collection:
      collection_title: system_settings_improve_siri_dictation_disable_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.assistant.support'')\

            .objectForKey(''Siri Data Sharing Opt-In Status'').js

            EOS'
  tests:
    test-system-settings-improve-siri-dictation-disable-recommended-test:
      test_title: system_settings_improve_siri_dictation_disable_recommended_test
      capability: independent.shellcommand
      collection: system-settings-improve-siri-dictation-disable-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: system_settings_improve_siri_dictation_disable_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: '2'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-system-settings-improve-siri-dictation-disable-recommended-test
