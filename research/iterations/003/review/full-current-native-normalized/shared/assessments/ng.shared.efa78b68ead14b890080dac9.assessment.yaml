assessment:
  id: ng.shared.efa78b68ead14b890080dac9
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that user and group account administration utilities
    are configured to store only encrypted representations of passwords.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the user and group account administration utilities are configured to store only encrypted representations
    of passwords. The strength of encryption that must be used to hash passwords for all accounts is "SHA512". Check that
    the system is configured to create "SHA512" hashed passwords with the following command: # grep -i sha512 /etc/libuser.conf
    crypt_style = sha512 If the "crypt_style" variable is not set to "sha512", is not in the defaults section, is commented
    out, or does not exist, this is a finding.'
  inputs: []
  evidence: []
