  version: 1
  assessment_title: The macOS system must configure SSHD ClientAliveInterval to 900.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to set the SSHD ClientAliveInterval to 900 with the following command:
    /usr/sbin/sshd -G | /usr/bin/awk ''/clientaliveinterval/{print $2}'' If the result is not "900", this is a finding.'
  inputs: {}
  evidence: []
