assessment:
  id: ng.shared.647d449d0f88c494fcfd5fd8
  version: 1
  assessment_title: WN10-CC-000255 - The use of a hardware security device with Windows Hello for Business must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\PassportForWork
        name:
          operation: equals
          datatype: string
          mask: false
          value: RequireSecurityDevice
  tests:
    test-use-hardware-security-device-set-enabled-or-not-configured:
      test_title: '''Use a hardware security device'' is set to ''Enabled'' or ''Not Configured'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-use-hardware-security-device-set-enabled-or-not-configured
