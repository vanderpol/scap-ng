assessment:
  id: ng.shared.260a21edebbc6b19ebe6e5e8
  version: 1
  assessment_title: OL08-00-010161 - OL 8 must prevent system daemons from using Kerberos for authentication.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    etc-keytab-collection:
      collection_title: /etc/*.keytab
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: \.keytab$
  tests:
    test-etc-keytab-does-not-exist:
      test_title: /etc/*.keytab does not exist.
      capability: unix.file
      collection: etc-keytab-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
  evaluate:
    test: test-etc-keytab-does-not-exist
