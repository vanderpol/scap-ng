assessment:
  id: ng.shared.eeac990dbea95ddaba14a817
  version: 1
  assessment_title: WN19-SO-000390 - Windows Server 2019 UIAccess applications must not be allowed to prompt for elevation
    without using the secure desktop.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: case insensitive equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: case insensitive equals
          datatype: string
          value: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        name:
          operation: case insensitive equals
          datatype: string
          value: EnableUIADesktopToggle
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-uiaccess-applications-not-allowed-prompt-elevation-without-using-secure-desktop:
      test_title: UIAccess applications is not allowed to prompt for elevation without using the secure desktop.
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-uiaccess-applications-not-allowed-prompt-elevation-without-using-secure-desktop
