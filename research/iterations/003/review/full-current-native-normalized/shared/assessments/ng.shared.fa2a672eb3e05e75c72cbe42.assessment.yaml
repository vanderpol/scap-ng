assessment:
  id: ng.shared.fa2a672eb3e05e75c72cbe42
  version: 1
  assessment_title: Smart Card Removal Option
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Microsoft\Windows NT\CurrentVersion\Winlogon
        name:
          operation: equals
          datatype: string
          mask: false
          value: scremoveoption
  tests:
    test-interactive-logon-smart-card-removal-behavior-set-lock-workstation:
      test_title: '''Interactive logon: Smart card removal behavior'' is set to ''Lock Workstation'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Sz type and value equals 1
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_sz
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-interactive-logon-smart-card-removal-behavior-set-force-logoff:
      test_title: '''Interactive logon: Smart card removal behavior'' is set to ''Force Logoff'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Sz type and value equals 2
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_sz
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '2'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    any:
    - test: test-interactive-logon-smart-card-removal-behavior-set-lock-workstation
    - test: test-interactive-logon-smart-card-removal-behavior-set-force-logoff
