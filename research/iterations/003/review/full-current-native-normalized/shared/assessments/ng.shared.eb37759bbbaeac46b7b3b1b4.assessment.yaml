assessment:
  id: ng.shared.eb37759bbbaeac46b7b3b1b4
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that the SSH daemon does not allow authentication
    using known hosts authentication.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the SSH daemon does not allow authentication using known hosts authentication. To determine how the SSH
    daemon''s "IgnoreUserKnownHosts" option is set, run the following command: # grep -i IgnoreUserKnownHosts /etc/ssh/sshd_config
    IgnoreUserKnownHosts yes If the value is returned as "no", the returned line is commented out, or no output is returned,
    this is a finding.'
  inputs: {}
  evidence: []
