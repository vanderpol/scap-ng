assessment:
  id: ng.shared.2866f2d6c9eb5cebb3ade221
  version: 1
  assessment_title: The SUSE operating system must employ user passwords with a maximum lifetime of 60 days.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that the SUSE operating system enforces a maximum user password age of 60 days or less. Check that the
    SUSE operating system enforces 60 days or less as the maximum user password age with the following command: > sudo awk
    -F: ''$5 > 60 || $5 == "" {print $1 ":" $5}'' /etc/shadow If any results are returned that are not associated with a system
    account, this is a finding.'
  inputs: []
  evidence: []
