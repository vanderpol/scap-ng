assessment:
  id: ng.shared.de5b56fc80e07f675c8666e5
  version: 1
  assessment_title: Minimum Password Age
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    password-policy-collection:
      collection_title: Password policy
      capability: windows.passwordpolicy
  variables:
    minimum-password-age-variable:
      title: Minimum Password Age
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: password_minimum_age_var
        validation:
          alternatives:
          - literal: '86400'
            hint: 86400_seconds
          - literal: '172800'
            hint: 172800_seconds
          - literal: '432000'
            hint: 432000_seconds
  tests:
    test-minimum-password-age-set-at-least-1-day:
      test_title: '''Minimum Password Age'' is set to at least ''1'' day'
      capability: windows.passwordpolicy
      collection: password-policy-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Minimum Password Age is greater than or equal to variable
        state_capability: windows.passwordpolicy
        state:
          field: min_passwd_age
          value:
            variable: minimum-password-age-variable
          operation: greater than or equal
          datatype: int
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-minimum-password-age-set-at-least-1-day
