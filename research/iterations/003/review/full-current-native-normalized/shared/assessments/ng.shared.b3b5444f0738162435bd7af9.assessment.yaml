assessment:
  id: ng.shared.b3b5444f0738162435bd7af9
  version: 1
  assessment_title: The macOS system must disable AppleID and Internet Account modifications.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    os-account-modification-disable-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\

            .objectForKey(''allowAccountModification'').js

            EOS'
      object_title: os_account_modification_disable_recommended_object
  states:
    state-os-account-modification-disable-recommended-state:
      state_title: os_account_modification_disable_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: 'false'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-os-account-modification-disable-recommended-test:
      test_title: os_account_modification_disable_recommended_test
      capability: independent.shellcommand
      object: os-account-modification-disable-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-os-account-modification-disable-recommended-state
  evaluate:
    test: test-os-account-modification-disable-recommended-test
