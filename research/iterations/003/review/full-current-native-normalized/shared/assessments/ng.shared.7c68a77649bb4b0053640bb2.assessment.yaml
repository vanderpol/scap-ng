assessment:
  id: ng.shared.7c68a77649bb4b0053640bb2
  version: 1
  assessment_title: Caching of logon credentials
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Microsoft\Windows NT\CurrentVersion\Winlogon
        name:
          operation: equals
          datatype: string
          mask: false
          value: CachedLogonsCount
      object_title: null
    registry-path-determine-domain-membership-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Services\TCPIP\Parameters
        name:
          operation: equals
          datatype: string
          mask: false
          value: Domain
      object_title: Registry path to determine domain membership.
  states:
    state-reg-sz-type-and-value-equals-4-or-less:
      state_title: Reg_SZ type and value equals 4 or less
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_sz
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '4'
          operation: less than or equal
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    state-reg-sz-type-and-blank-value:
      state_title: Reg_Sz type and blank value
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_sz
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: ''
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-interactive-logon-number-previous-logons-cache-in-case-domain-controller:
      test_title: '''Interactive Logon: Number of previous logons to cache (in case domain controller is not available)''
        is set to ''4'' logons or less'
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-sz-type-and-value-equals-4-or-less
    test-system-not-member-domain:
      test_title: System is not a member of a domain
      capability: windows.registry
      object: registry-path-determine-domain-membership-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-sz-type-and-blank-value
  evaluate:
    any:
    - test: test-interactive-logon-number-previous-logons-cache-in-case-domain-controller
    - test: test-system-not-member-domain
