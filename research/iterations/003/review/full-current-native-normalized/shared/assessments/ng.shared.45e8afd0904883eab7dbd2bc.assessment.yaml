assessment:
  id: ng.shared.45e8afd0904883eab7dbd2bc
  version: 1
  assessment_title: Exchange Message size restrictions must be controlled on receive connectors.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    run-get-receiveconnector-display-maxmessagesize-configuration-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: powershell
        command:
          operation: equals
          datatype: string
          value: add-pssnapin Microsoft.Exchange.Management.Powershell.Snapin;Get-ReceiveConnector | Select-Object -Property
            Name, Identity, MaxMessageSize | Out-String -Width 4096
        pattern:
          operation: equals
          datatype: string
          value: ''
      behaviors:
        error_if_stderr_exists: 'true'
      object_title: Run Get-ReceiveConnector to display MaxMessageSize configuration
  states: {}
  tests:
    test-unknown-test-results-auditor-review-system-settings-gathered-stig-requirements:
      test_title: Unknown Test Results - An auditor must review system settings gathered and STIG requirements.
      capability: independent.unknown
    test-review-edsp-or-document-that-contains-this-information-determine-global:
      test_title: Review the EDSP or document that contains this information. Determine the global maximum message receive
        size and whether signoff with risk acceptance is documented for the Receive connector to have a different value. For
        each internet-facing Receive connector, if the value of MaxMessageSize is not the same as the global value, this is
        a finding. Or, if MaxMessageSize is set to a numeric value different from the global value and has signoff and risk
        acceptance in the EDSP, this is not a finding.
      capability: independent.shellcommand
      object: run-get-receiveconnector-display-maxmessagesize-configuration-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    all:
    - test: test-unknown-test-results-auditor-review-system-settings-gathered-stig-requirements
    - test: test-review-edsp-or-document-that-contains-this-information-determine-global
