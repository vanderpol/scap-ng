assessment:
  id: ng.shared.fededeb194df8eca5badfb37
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that the cryptographic hash of system files and
    commands matches vendor values.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the cryptographic hash of system files and commands match the vendor values. Check the cryptographic
    hash of system files and commands with the following command: Note: System configuration files (indicated by a "c" in
    the second column) are expected to change over time. Unusual modifications should be investigated through the system audit
    log. # rpm -Va --noconfig | grep ''^..5'' If there is any output from the command for system files or binaries, this is
    a finding.'
  inputs: {}
  evidence: []
