assessment:
  id: ng.shared.30f1504d68c4473dea6a89fc
  version: 1
  assessment_title: WN19-AU-000090 - Windows Server 2019 must be configured to audit Account Management - Other Account Management
    Events successes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-windows-auditeventpolicysubcategories:
      state_title: null
      capability: windows.auditeventpolicysubcategories
      state:
        field: other_account_management_events
        value: AUDIT_SUCCESS
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-auditeventpolicysubcategories-2:
      state_title: null
      capability: windows.auditeventpolicysubcategories
      state:
        field: other_account_management_events
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-other-account-management-events-success-only-or-success-failure:
      test_title: Audit - Other Account Management Events - 'Success only' or 'Success and Failure'
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-windows-auditeventpolicysubcategories
      - state-windows-auditeventpolicysubcategories-2
  evaluate:
    test: test-audit-other-account-management-events-success-only-or-success-failure
