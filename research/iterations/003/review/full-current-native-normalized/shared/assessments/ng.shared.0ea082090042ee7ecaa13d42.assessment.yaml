assessment:
  id: ng.shared.0ea082090042ee7ecaa13d42
  version: 1
  assessment_title: WN10-CC-000180 - Autoplay must be turned off for non-volume devices.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows\Explorer
        name:
          operation: equals
          datatype: string
          mask: false
          value: NoAutoplayfornonVolume
  tests:
    test-disallow-autoplay-non-volume-devices-set-enabled:
      test_title: '''Disallow Autoplay for non-volume devices'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-disallow-autoplay-non-volume-devices-set-enabled
