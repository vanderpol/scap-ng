assessment:
  id: ng.shared.860d288e4b9bdf2d6a3f0fcd
  version: 1
  assessment_title: WN19-UR-000120 - Windows Server 2019 Generate security audits user right must only be assigned to Local
    Service and Network Service.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-userright-collection:
      collection_title: null
      capability: windows.userright
      select:
        userright:
          operation: equals
          datatype: string
          mask: false
          value: SE_AUDIT_NAME
  tests:
    test-generate-security-audits-local-service-network-service:
      test_title: Generate security audits - LOCAL SERVICE, NETWORK SERVICE
      capability: windows.userright
      collection: windows-userright-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: null
          capability: windows.userright
          state:
            field: trustee_name
            value: ''
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: windows.userright
          state:
            field: trustee_name
            value: LOCAL SERVICE
            operation: case insensitive equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: windows.userright
          state:
            field: trustee_name
            value: NETWORK SERVICE
            operation: case insensitive equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-generate-security-audits-local-service-network-service
