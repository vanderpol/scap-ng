assessment:
  id: ng.shared.a3fbe74fd2fc4151baf249e3
  version: 1
  assessment_title: The macOS system must disable personalized advertising.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    system-settings-personalized-advertising-disable-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: zsh
        command:
          operation: equals
          datatype: string
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\

            .objectForKey(''allowApplePersonalizedAdvertising'').js

            EOS'
      object_title: system_settings_personalized_advertising_disable_recommended_object
  states:
    state-system-settings-personalized-advertising-disable-recomme:
      state_title: system_settings_personalized_advertising_disable_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: 'false'
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-settings-personalized-advertising-disable-recommended-test:
      test_title: system_settings_personalized_advertising_disable_recommended_test
      capability: independent.shellcommand
      object: system-settings-personalized-advertising-disable-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-system-settings-personalized-advertising-disable-recomme
  evaluate:
    test: test-system-settings-personalized-advertising-disable-recommended-test
