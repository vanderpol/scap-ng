assessment:
  id: ng.shared.f449390dc37357b045e77c9e
  version: 1
  assessment_title: The Oracle Linux operating system must prevent a user from overriding the screensaver lock-enabled setting
    for the graphical user interface.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system prevents a user from overriding the screensaver lock-enabled setting for the graphical
    user interface. Note: If the system does not have GNOME installed, this requirement is Not Applicable. Determine which
    profile the system database is using with the following command: # grep system-db /etc/dconf/profile/user system-db:local
    Check for the lock-enabled setting with the following command: Note: The example below is using the database "local" for
    the system, so the path is "/etc/dconf/db/local.d". This path must be modified if a database other than "local" is being
    used. # grep -i lock-enabled /etc/dconf/db/local.d/locks/* /org/gnome/desktop/screensaver/lock-enabled If the command
    does not return a result, this is a finding.'
  inputs: {}
  evidence: []
