assessment:
  id: ng.shared.8792e76f8d0e5d006b93296d
  version: 1
  assessment_title: The SUSE operating system audit tools must have the proper permissions configured to protect against unauthorized
    access.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that the SUSE operating system audit tools have the proper permissions configured in the permissions
    profile to protect from unauthorized access. Check that "permissions.local" file contains the correct permissions rules
    with the following command: > grep "^/usr/sbin/au" /etc/permissions.local /usr/sbin/audispd root:root 0750 /usr/sbin/auditctl
    root:root 0750 /usr/sbin/auditd root:root 0750 /usr/sbin/ausearch root:root 0755 /usr/sbin/aureport root:root 0755 /usr/sbin/autrace
    root:root 0750 /usr/sbin/augenrules root:root 0750 If the command does not return any output, this is a finding. Check
    that all of the audit information files and folders have the correct permissions with the following command: > sudo chkstat
    /etc/permissions.local If the command returns any output, this is a finding.'
  inputs: []
  evidence: []
