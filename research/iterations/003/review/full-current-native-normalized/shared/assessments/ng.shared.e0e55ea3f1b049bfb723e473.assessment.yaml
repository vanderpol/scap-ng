assessment:
  id: ng.shared.e0e55ea3f1b049bfb723e473
  version: 1
  assessment_title: Exchange Outbound Connection limit per Domain Count must be controlled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    run-get-transportservice-display-maxperdomainoutboundconnections-configuration-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: add-pssnapin Microsoft.Exchange.Management.Powershell.Snapin;Get-TransportService | Select-Object -Property
            Name, Identity, MaxPerDomainOutboundConnections | Format-Table -HideTableHeaders | Out-String -Width 4096
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: \w
      behaviors:
        error_if_stderr_exists: 'true'
      object_title: Run Get-TransportService to display MaxPerDomainOutboundConnections configuration
  states:
    state-verify-value-is-20:
      state_title: Verify value is 20
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: 20\s*$
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-if-value-maxperdomainoutboundconnections-not-set-20-this-finding:
      test_title: If the value of MaxPerDomainOutboundConnections is not set to 20, this is a finding
      capability: independent.shellcommand
      object: run-get-transportservice-display-maxperdomainoutboundconnections-configuration-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-verify-value-is-20
  evaluate:
    test: test-if-value-maxperdomainoutboundconnections-not-set-20-this-finding
