assessment:
  id: ng.shared.d26a0f122de17ab3e1e2c1ba
  version: 1
  assessment_title: When updates are applied to SQL Server software, any software components that have been replaced or made
    unnecessary must be removed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    sql-2016-bootstrap-setup-directory-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Microsoft SQL Server\130\Bootstrap
        name:
          operation: equals
          datatype: string
          mask: false
          value: BootstrapDir
      object_title: SQL 2016 Bootstrap Setup directory
    sql-2016-setup-bootstrap-log-exist-object:
      capability: windows.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: sql-2016-setup-bootstrap-log-summary-txt-file-variable
      object_title: SQL 2016 Setup Bootstrap Log must exist
    gather-sql-2016-installed-product-features-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: sql-2016-setup-bootstrap-log-summary-txt-file-variable
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^  SQL Server 2016      .*
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: Gather SQL 2016 Installed Product Features
    independent-sqlext-object:
      capability: independent.sqlext
      select:
        engine:
          operation: equals
          datatype: string
          mask: false
          value: sqlserver
        version:
          operation: pattern match
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: microsoft-sql-server-version-2016-2019-variable
        instance:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        database:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
        sql:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
      behaviors:
        context: instance
      object_title: null
    sql-2017-bootstrap-setup-log-directory-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Microsoft SQL Server\140\Bootstrap
        name:
          operation: equals
          datatype: string
          mask: false
          value: BootstrapDir
      object_title: SQL 2017 Bootstrap Setup Log directory
    sql-2017-setup-bootstrap-log-exist-object:
      capability: windows.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: sql-2017-setup-bootstrap-log-summary-txt-file-variable
      object_title: SQL 2017 Setup Bootstrap Log must exist
    gather-sql-2017-installed-product-features-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: sql-2017-setup-bootstrap-log-summary-txt-file-variable
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^  SQL Server 2017      .*
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: Gather SQL 2017 Installed Product Features
    independent-sqlext-object-2:
      capability: independent.sqlext
      select:
        engine:
          operation: equals
          datatype: string
          mask: false
          value: sqlserver
        version:
          operation: pattern match
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: microsoft-sql-server-version-2016-2019-variable
        instance:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        database:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
        sql:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
      behaviors:
        context: instance
      object_title: null
    sql-2019-bootstrap-setup-log-directory-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Microsoft SQL Server\150\Bootstrap
        name:
          operation: equals
          datatype: string
          mask: false
          value: BootstrapDir
      object_title: SQL 2019 Bootstrap Setup Log directory
    sql-2019-setup-bootstrap-log-exist-run-sql-server-installed-object:
      capability: windows.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: sql-2019-setup-bootstrap-log-summary-txt-file-variable
      object_title: SQL 2019 Setup Bootstrap Log must exist (run SQL Server 'Installed SQL Server features discovery report'
        if not found)
    gather-sql-2019-installed-product-features-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: sql-2019-setup-bootstrap-log-summary-txt-file-variable
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^  SQL Server 2019      .*
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: Gather SQL 2019 Installed Product Features
    independent-sqlext-object-3:
      capability: independent.sqlext
      select:
        engine:
          operation: equals
          datatype: string
          mask: false
          value: sqlserver
        version:
          operation: pattern match
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: microsoft-sql-server-version-2016-2019-variable
        instance:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        database:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
        sql:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
      behaviors:
        context: instance
      object_title: null
  variables:
    sql-2016-setup-bootstrap-log-summary-txt-file-variable:
      title: SQL 2016 Setup Bootstrap Log\Summary.txt file
      kind: local
      datatype: string
      expression:
        concat:
        - values:
            object: sql-2016-bootstrap-setup-directory-object
            field: value
        - literal:
            value: Log\Summary.txt
            datatype: string
    end-user-provided-list-required-approved-sql-components-variable:
      title: End user provided list of required and approved SQL components
      kind: external
      datatype: string
      input:
        required: true
        cardinality: one_or_more
    microsoft-sql-server-version-2016-2019-variable:
      title: Microsoft SQL Server version 2016-2019
      kind: constant
      datatype: string
      expression:
        literal: 2016|2017|2019
    sql-2017-setup-bootstrap-log-summary-txt-file-variable:
      title: SQL 2017 Setup Bootstrap Log\Summary.txt file
      kind: local
      datatype: string
      expression:
        concat:
        - values:
            object: sql-2017-bootstrap-setup-log-directory-object
            field: value
        - literal:
            value: Log\Summary.txt
            datatype: string
    sql-2019-setup-bootstrap-log-summary-txt-file-variable:
      title: SQL 2019 Setup Bootstrap Log\Summary.txt file
      kind: local
      datatype: string
      expression:
        concat:
        - values:
            object: sql-2019-bootstrap-setup-log-directory-object
            field: value
        - literal:
            value: Log\Summary.txt
            datatype: string
  states:
    state-check-sql-bootstrap-logs-for-user-approved-list-of-usern:
      state_title: Check SQL bootstrap logs for user approved list of usernames
      capability: independent.textfilecontent54
      state:
        field: text
        value:
          variable: end-user-provided-list-required-approved-sql-components-variable
        operation: pattern match
        datatype: string
        mask: false
        variable_check: at least one
        entity_check: all
        entity_existence: at_least_one_exists
    state-instance-is-sql-2016:
      state_title: Instance is SQL 2016
      capability: independent.sqlext
      state:
        field: version
        value: '2016'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-instance-is-sql-2017:
      state_title: Instance is SQL 2017
      capability: independent.sqlext
      state:
        field: version
        value: '2017'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-instance-is-sql-2019:
      state_title: Instance is SQL 2019
      capability: independent.sqlext
      state:
        field: version
        value: '2019'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-verify-sql-2016-setup-bootstrap-log-exist-run-installed-sql:
      test_title: Verify SQL 2016 Setup Bootstrap Log must exist (run 'Installed SQL 2016 Server features discovery report'
        if not found)
      capability: windows.file
      object: sql-2016-setup-bootstrap-log-exist-object
      check_existence: at_least_one_exists
      check: all
    test-compare-sql-2016-installed-features-against-system-documentation-run-installed:
      test_title: Compare SQL 2016 Installed Features against system documentation (run 'Installed SQL 2016 Server features
        discovery report' no features are found)
      capability: independent.textfilecontent54
      object: gather-sql-2016-installed-product-features-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-check-sql-bootstrap-logs-for-user-approved-list-of-usern
    test-verify-sql-instance-sql-2016:
      test_title: Verify SQL Instance is SQL 2016
      capability: independent.sqlext
      object: independent-sqlext-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-instance-is-sql-2016
    test-verify-sql-2017-setup-bootstrap-log-exist-run-installed-sql:
      test_title: Verify SQL 2017 Setup Bootstrap Log must exist (run 'Installed SQL 2017 Server features discovery report'
        if not found)
      capability: windows.file
      object: sql-2017-setup-bootstrap-log-exist-object
      check_existence: at_least_one_exists
      check: all
    test-compare-sql-2017-installed-features-against-system-documentation-run-installed:
      test_title: Compare SQL 2017 Installed Features against system documentation (run 'Installed SQL 2017 Server features
        discovery report' no features are found)
      capability: independent.textfilecontent54
      object: gather-sql-2017-installed-product-features-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-check-sql-bootstrap-logs-for-user-approved-list-of-usern
    test-verify-sql-instance-sql-2017:
      test_title: Verify SQL Instance is SQL 2017
      capability: independent.sqlext
      object: independent-sqlext-object-2
      check_existence: at_least_one_exists
      check: all
      states:
      - state-instance-is-sql-2017
    test-verify-sql-2019-setup-bootstrap-log-exist-run-installed-sql:
      test_title: Verify SQL 2019 Setup Bootstrap Log must exist (run 'Installed SQL 2019 Server features discovery report'
        if not found)
      capability: windows.file
      object: sql-2019-setup-bootstrap-log-exist-run-sql-server-installed-object
      check_existence: at_least_one_exists
      check: all
    test-compare-sql-2019-installed-features-against-system-documentation-run-installed:
      test_title: Compare SQL 2019 Installed Features against system documentation (run 'Installed SQL 2019 Server features
        discovery report' no features are found)
      capability: independent.textfilecontent54
      object: gather-sql-2019-installed-product-features-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-check-sql-bootstrap-logs-for-user-approved-list-of-usern
    test-verify-sql-instance-sql-2019:
      test_title: Verify SQL Instance is SQL 2019
      capability: independent.sqlext
      object: independent-sqlext-object-3
      check_existence: at_least_one_exists
      check: all
      states:
      - state-instance-is-sql-2019
  evaluate:
    any:
    - all:
      - test: test-verify-sql-2016-setup-bootstrap-log-exist-run-installed-sql
      - test: test-compare-sql-2016-installed-features-against-system-documentation-run-installed
      - test: test-verify-sql-instance-sql-2016
    - all:
      - test: test-verify-sql-2017-setup-bootstrap-log-exist-run-installed-sql
      - test: test-compare-sql-2017-installed-features-against-system-documentation-run-installed
      - test: test-verify-sql-instance-sql-2017
    - all:
      - test: test-verify-sql-2019-setup-bootstrap-log-exist-run-installed-sql
      - test: test-compare-sql-2019-installed-features-against-system-documentation-run-installed
      - test: test-verify-sql-instance-sql-2019
