assessment:
  id: ng.shared.63a61e9f3ccdea9f2f6e0d2f
  version: 1
  assessment_title: SQL Server must use NIST FIPS 140-2/140-3-validated cryptographic operations for encryption, hashing,
    and signing.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    determine-via-registry-that-fips-enabled-in-local-security-policy-collection:
      collection_title: Determine via the registry that FIPS is enabled in the Local security policy
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Control\Lsa\FipsAlgorithmPolicy
        name:
          operation: equals
          datatype: string
          mask: false
          value: Enabled
  tests:
    test-check-if-fips-compliant-algorithms-encryption-hashing-signing-disabled:
      test_title: Check if 'FIPS compliant algorithms for encryption, hashing, and signing' is disabled.
      capability: windows.registry
      collection: determine-via-registry-that-fips-enabled-in-local-security-policy-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Registry key dword value equals 1
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-check-if-fips-compliant-algorithms-encryption-hashing-signing-disabled
