  assessment_title: OL 8 network interfaces must not be in promiscuous mode.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify network interfaces are not in promiscuous mode unless approved by the ISSO and documented. Check for
    the status with the following command: $ sudo ip link | grep -i promisc If network interfaces are found on the system
    in promiscuous mode and their use has not been approved by the ISSO and documented, this is a finding.'
