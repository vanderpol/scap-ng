assessment:
  id: ng.shared.f37e1b42ac47c3027d16f635
  version: 1
  assessment_title: The SUSE operating system must have directories that contain system commands owned by root.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the system commands directories are owned by root: /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin
    Use the following command for the check: > sudo find -L /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin !
    -user root -type d -exec stat -c "%n %U" ''{}'' \; If any system commands directories are returned, this is a finding.'
  inputs: {}
  evidence: []
