  assessment_title: The location feature must be turned off.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding: Registry
    Hive: HKEY_LOCAL_MACHINE Registry Path: \Software\Policies\Microsoft\Windows\LocationAndSensors\ Value Name: DisableLocation
    Type: REG_DWORD Value: 1 (Enabled) If location services are approved for the system by the organization, this may be set
    to "Disabled" (0). This must be documented with the ISSO.'
