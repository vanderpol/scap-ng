assessment:
  id: ng.shared.08220a79eb6bbabfe83403a1
  version: 1
  assessment_title: Firefox must be configured to ask which certificate to present to a website when a certificate is required.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Type "about:policies" in the browser address bar. If "Preferences" is not displayed under Policy Name and the
    Policy Value does not include "security.default_personal_cert" with a value of "Ask Every Time" and status of "locked",
    this is a finding.
  inputs: []
  evidence: []
