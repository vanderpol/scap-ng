assessment:
  id: ng.shared.ca4fde6d36d371ecfba7e679
  version: 1
  assessment_title: WN19-DC-000330 - Windows Server 2019 domain controllers must be configured to allow reset of machine account
    passwords.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Services\Netlogon\Parameters
        name:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: RefusePasswordChange
  tests:
    test-domain-controller-refuse-machine-account-password-changes-set-disabled:
      test_title: '''Domain controller: Refuse machine account password changes'' is set to ''Disabled''.'
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-domain-controller-refuse-machine-account-password-changes-set-disabled
