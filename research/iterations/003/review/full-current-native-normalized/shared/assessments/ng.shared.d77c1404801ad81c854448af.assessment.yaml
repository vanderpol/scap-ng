  states:
    state-64-bit-architecture:
      state_title: 64 bit architecture
      capability: unix.uname
      state:
        field: processor_type
        value: x86_64
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-64-bit-architecture-2:
      state_title: 64 bit architecture
      capability: unix.uname
      state:
        field: processor_type
        value: ppc64
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-64-bit-architecture-3:
      state_title: 64 bit architecture
      capability: unix.uname
      state:
        field: processor_type
        value: ppc64le
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-augenrules:
      test_title: audit augenrules
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
    test-audit-augenrules-mount-32-bit:
      test_title: audit augenrules mount 32-bit
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-2
      check_existence: at_least_one_exists
      check: all
    test-audit-augenrules-bin-mount:
      test_title: audit augenrules /bin/mount
      capability: independent.textfilecontent54
      object: augenrules-audit-bin-mount-commands-object
      check_existence: at_least_one_exists
      check: all
    test-audit-augenrules-usr-bin-mount:
      test_title: audit augenrules /usr/bin/mount
      capability: independent.textfilecontent54
      object: augenrules-audit-usr-bin-mount-commands-object
      check_existence: at_least_one_exists
      check: all
    test-64-bit-architecture:
      test_title: 64 bit architecture
      capability: unix.uname
      object: 64-bit-architecture-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-64-bit-architecture
    test-64-bit-architecture-2:
      test_title: 64 bit architecture
      capability: unix.uname
      object: 64-bit-architecture-object-2
      check_existence: at_least_one_exists
      check: all
      states:
      - state-64-bit-architecture-2
    test-64-bit-architecture-3:
      test_title: 64 bit architecture
      capability: unix.uname
      object: 64-bit-architecture-object-3
      check_existence: at_least_one_exists
      check: all
      states:
      - state-64-bit-architecture-3
    test-audit-augenrules-mount-64-bit:
      test_title: audit augenrules mount 64-bit
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-3
      check_existence: at_least_one_exists
      check: all
    test-audit-auditctl:
      test_title: audit auditctl
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-4
      check_existence: at_least_one_exists
      check: all
    test-audit-auditctl-mount-32-bit:
      test_title: audit auditctl mount 32-bit
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-5
      check_existence: at_least_one_exists
      check: all
    test-audit-auditctl-bin-mount:
      test_title: audit auditctl /bin/mount
      capability: independent.textfilecontent54
      object: auditctl-audit-bin-mount-commands-object
      check_existence: at_least_one_exists
      check: all
    test-audit-auditctl-usr-bin-mount:
      test_title: audit auditctl /usr/bin/mount
      capability: independent.textfilecontent54
      object: auditctl-audit-usr-bin-mount-commands-object
      check_existence: at_least_one_exists
      check: all
    test-audit-auditctl-mount-64-bit:
      test_title: audit auditctl mount 64-bit
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-6
      check_existence: at_least_one_exists
      check: all
  evaluate:
    any:
    - all:
      - test: test-audit-augenrules
      - test: test-audit-augenrules-mount-32-bit
      - any:
        - test: test-audit-augenrules-bin-mount
        - test: test-audit-augenrules-usr-bin-mount
      - any:
        - not:
            any:
            - test: test-64-bit-architecture
            - any:
              - test: test-64-bit-architecture-2
              - test: test-64-bit-architecture-3
        - test: test-audit-augenrules-mount-64-bit
    - all:
      - test: test-audit-auditctl
      - test: test-audit-auditctl-mount-32-bit
      - any:
        - test: test-audit-auditctl-bin-mount
        - test: test-audit-auditctl-usr-bin-mount
      - any:
        - not:
            any:
            - test: test-64-bit-architecture
            - any:
              - test: test-64-bit-architecture-2
              - test: test-64-bit-architecture-3
        - test: test-audit-auditctl-mount-64-bit
