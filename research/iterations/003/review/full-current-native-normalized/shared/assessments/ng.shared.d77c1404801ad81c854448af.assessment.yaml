assessment:
  id: ng.shared.d77c1404801ad81c854448af
  version: 1
  assessment_title: The Oracle Linux operating system must audit all uses of the mount command and syscall.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /usr/lib/systemd/system/auditd.service
        pattern:
          operation: pattern match
          datatype: string
          value: ^ExecStartPost=\-\/sbin\/augenrules.*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
    independent-textfilecontent54-object-2:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/audit/rules.d
        filename:
          operation: pattern match
          datatype: string
          value: .*\.rules$
        pattern:
          operation: pattern match
          datatype: string
          value: ^\-a\s+always,exit\s+(\-F\s+arch=b32\s+)(?:.*(-S[\s]+mount[\s]+|([\s]+|[,])mount([\s]+|[,])))(?:.*-F\s+auid>=1000\s+\-F\s+auid!=(?:4294967295|-1|unset)\s+)(-k[\s]+|-F[\s]+key=)[-\w]+\s*$
        instance:
          operation: equals
          datatype: int
          value: '1'
      object_title: null
    augenrules-audit-bin-mount-commands-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/audit/rules.d
        filename:
          operation: pattern match
          datatype: string
          value: .*\.rules$
        pattern:
          operation: pattern match
          datatype: string
          value: ^\-a\s+always,exit\s+(?:(\-F[\s]+path=\/bin\/mount[\s]+))(-F\s+perm=([rwa]*x[rwa]*)\s+)?(?:-F\s+auid>=1000\s+\-F\s+auid!=(?:4294967295|-1|unset)\s+)(-k[\s]+|-F[\s]+key=)[-\w]+\s*$
        instance:
          operation: equals
          datatype: int
          value: '1'
      object_title: augenrules audit /bin/mount commands
    augenrules-audit-usr-bin-mount-commands-object:
