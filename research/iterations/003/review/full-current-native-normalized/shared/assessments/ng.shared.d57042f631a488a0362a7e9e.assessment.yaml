assessment:
  id: ng.shared.d57042f631a488a0362a7e9e
  version: 1
  assessment_title: UBTU-22-232135 - Ubuntu 22.04 LTS must configure the "/var/log/syslog" file to be group-owned by "adm".
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-file-object:
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /var/log/syslog
      object_title: null
    etc-group-adm-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/group
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: '^adm:[^:]*:([0-9]+):'
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
      object_title: /etc/group for adm
  variables:
    gid-adm-variable:
      title: GID for adm
      kind: local
      datatype: int
      expression:
        values:
          object: etc-group-adm-object
          field: subexpression
  states:
    state-group-owned-by-adm:
      state_title: Group-owned by adm
      capability: unix.file
      state:
        field: group_id
        value:
          variable: gid-adm-variable
        operation: equals
        datatype: int
        mask: false
        variable_check: all
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-var-log-syslog-file-group-owned-by-adm:
      test_title: /var/log/syslog file is group-owned by adm
      capability: unix.file
      object: unix-file-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-group-owned-by-adm
  evaluate:
    test: test-var-log-syslog-file-group-owned-by-adm
