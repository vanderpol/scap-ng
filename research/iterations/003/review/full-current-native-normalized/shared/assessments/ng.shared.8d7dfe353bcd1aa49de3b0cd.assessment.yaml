assessment:
  id: ng.shared.8d7dfe353bcd1aa49de3b0cd
  version: 1
  assessment_title: The operating system must not allow logins for users with blank passwords.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    passreq-lines-in-etc-default-login-collection:
      collection_title: PASSREQ lines in /etc/default/login
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/default
        filename:
          operation: equals
          datatype: string
          mask: false
          value: login
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^PASSREQ=(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-passreq-lines-in-etc-default-login:
      test_title: PASSREQ lines in /etc/default/login
      capability: independent.textfilecontent54
      collection: passreq-lines-in-etc-default-login-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: 'YES'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-passreq-lines-in-etc-default-login
