assessment:
  id: ng.shared.6b31236266f1db092d098afd
  version: 1
  assessment_title: The macOS system must limit consecutive failed log on attempts to three.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    pwpolicy-account-lockout-enforce-stig-object-collection:
      collection_title: pwpolicy_account_lockout_enforce_stig_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/bin/pwpolicy -getaccountpolicies | /usr/bin/tail +2 | /usr/bin/xmllint --xpath '//dict/key[text()="policyAttributeMaximumFailedAuthentications"]/following-sibling::integer[1]/text()'
            - | /usr/bin/awk '{ if ($1 <= 3) {print "yes"} else {print "no"}}' | /usr/bin/uniq
  tests:
    test-pwpolicy-account-lockout-enforce-stig-test:
      test_title: pwpolicy_account_lockout_enforce_stig_test
      capability: independent.shellcommand
      collection: pwpolicy-account-lockout-enforce-stig-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: pwpolicy_account_lockout_enforce_stig_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: 'yes'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-pwpolicy-account-lockout-enforce-stig-test
