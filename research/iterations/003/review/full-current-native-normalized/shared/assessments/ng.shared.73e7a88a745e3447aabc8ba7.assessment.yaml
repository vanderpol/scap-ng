assessment:
  id: ng.shared.73e7a88a745e3447aabc8ba7
  version: 1
  assessment_title: Handwriting Recognition Error Reporting
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\Windows\HandwritingErrorReports
        name:
          operation: equals
          datatype: string
          mask: false
          value: PreventHandwritingErrorReports
  variables:
    turn-off-handwriting-recognition-error-reporting-variable:
      title: Turn Off Handwriting Recognition Error Reporting
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: turn_off_handwriting_recognition_error_reporting_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-turn-off-handwriting-recognition-error-reporting-set-enabled:
      test_title: '''Turn off handwriting recognition error reporting'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: turn-off-handwriting-recognition-error-reporting-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-turn-off-handwriting-recognition-error-reporting-set-enabled
