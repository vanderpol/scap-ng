assessment:
  id: ng.shared.00e0c16b29ed672246b7a4b0
  version: 1
  assessment_title: Auditd Email Account to Notify Upon Action
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/auditd.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[ ]*action_mail_acct[ ]+=[ ]+(\S+)[ ]*$
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
  variables:
    audit-action-mail-acct-setting-variable:
      title: audit action_mail_acct setting
      kind: external
      datatype: string
      input:
        required: true
        cardinality: one_or_more
        parameter: var_auditd_action_mail_acct
  tests:
    test-email-account-actions:
      test_title: email account for actions
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value:
            variable: audit-action-mail-acct-setting-variable
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-email-account-actions
