assessment:
  id: ng.shared.360a2c147415c943ba0ab04b
  version: 1
  assessment_title: The use of FTP must be restricted.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The root role is required. Determine if the FTP server package is installed: # pkg list service/network/ftp
    If the output of this command is: pkg list: no packages matching ''service/network/ftp'' installed no further action is
    required. If the FTP server is installed, determine if FTP access is restricted. # for user in `logins -s | awk ''{ print
    $1 }''` \ aiuser noaccess nobody nobody4; do grep -w "${user}" /etc/ftpd/ftpusers >/dev/null 2>&1 if [ $? != 0 ]; then
    echo "User ''${user}'' not in /etc/ftpd/ftpusers." fi done If output is returned, this is a finding.'
  inputs: {}
  evidence: []
