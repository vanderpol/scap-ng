assessment:
  id: ng.shared.3ae159872547426fd7ba48b7
  version: 1
  assessment_title: The macOS system must enforce enrollment in mobile device management.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    os-mdm-require-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: zsh
        command:
          operation: equals
          datatype: string
          value: '/usr/bin/profiles status -type enrollment | /usr/bin/awk -F: ''/MDM enrollment/ {print $2}'' | /usr/bin/grep
            "Yes (User Approved)"'
      object_title: os_mdm_require_recommended_object
  states:
    state-os-mdm-require-recommended-state:
      state_title: os_mdm_require_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: .*
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-os-mdm-require-recommended-test:
      test_title: os_mdm_require_recommended_test
      capability: independent.shellcommand
      object: os-mdm-require-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-os-mdm-require-recommended-state
  evaluate:
    test: test-os-mdm-require-recommended-test
