assessment:
  id: ng.shared.c9f2baa0027056567f52f26c
  version: 1
  assessment_title: Directory Browsing on the IIS 10.0 website must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    get-directory-browsing-enabled-status-collection:
      collection_title: Get Directory Browsing enabled status.
      capability: windows.appcmdlistconfig
      select:
        identifier_type:
          operation: equals
          datatype: string
          mask: false
          value: Site
        identifier:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        section:
          operation: equals
          datatype: string
          mask: false
          value: directoryBrowse
        parameter:
          operation: equals
          datatype: string
          mask: false
          value: enabled
  tests:
    test-web-site-directory-browsing-not-enabled:
      test_title: The web-site Directory Browsing must not be enabled
      capability: windows.appcmdlistconfig
      collection: get-directory-browsing-enabled-status-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: appcmdlistconfig result must equal False.
        state_capability: windows.appcmdlistconfig
        state:
          field: result
          value: 'false'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-web-site-directory-browsing-not-enabled
