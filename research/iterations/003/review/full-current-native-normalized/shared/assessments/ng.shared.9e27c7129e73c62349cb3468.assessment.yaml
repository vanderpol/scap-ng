assessment:
  id: ng.shared.9e27c7129e73c62349cb3468
  version: 1
  assessment_title: OL 8 must display the Standard Mandatory DOD Notice and Consent Banner before granting local or remote
    access to the system via an SSH logon.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    retrieve-location-sshd-banner-text-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/sbin/sshd -dd 2>&1 | awk '/filename/ {print $4}' | tr -d '\r' | tr '\n' ' ' | xargs grep -iH '^\s*banner'
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: .*:[Bb]anner\s+(.+)
      object_title: Retrieve the location of the sshd banner text.
    retrieve-text-sshd-banner-file-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: retreive-location-banner-file-variable
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
      behaviors:
        singleline: 'true'
      object_title: Retrieve the text of the sshd banner file.
  variables:
    retreive-location-banner-file-variable:
      title: Retreive location of banner file.
      kind: local
      datatype: string
      expression:
        values:
          object: retrieve-location-sshd-banner-text-object
          field: subexpression
  states:
    state-confirm-capture-of-the-sshd-banner-setting-and-that-it-i:
      state_title: Confirm capture of the sshd banner setting and that it is compliant.
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: ^[^#]+[Bb]anner\s+\S+
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: only_one_exists
    state-confirm-sshd-banner-text-is-correct:
      state_title: Confirm sshd banner text is correct.
      capability: independent.textfilecontent54
      state:
        field: text
        value: You\s+are\s+accessing\s+a\s+U.S.\s+Government\s+\(USG\)\s+Information\s+System\s+\(IS\)\s+that\s+is\s+provided\s+for\s+USG-authorized\s+use\s+only.\s+By\s+using\s+this\s+IS\s+\(which\s+includes\s+any\s+device\s+attached\s+to\s+this\s+IS\),\s+you\s+consent\s+to\s+the\s+following\s+conditions:[\n\r
          \t]+-The\s+USG\s+routinely\s+intercepts\s+and\s+monitors\s+communications\s+on\s+this\s+IS\s+for\s+purposes\s+including,\s+but\s+not\s+limited\s+to,\s+penetration\s+testing,\s+COMSEC\s+monitoring,\s+network\s+operations\s+and\s+defense,\s+personnel\s+misconduct\s+\(PM\),\s+law\s+enforcement\s+\(LE\),\s+and\s+counterintelligence\s+\(CI\)\s+investigations.[\n\r
          \t]+-At\s+any\s+time,\s+the\s+USG\s+may\s+inspect\s+and\s+seize\s+data\s+stored\s+on\s+this\s+IS.[\n\r \t]+-Communications\s+using,\s+or\s+data\s+stored\s+on,\s+this\s+IS\s+are\s+not\s+private,\s+are\s+subject\s+to\s+routine\s+monitoring,\s+interception,\s+and\s+search,\s+and\s+may\s+be\s+disclosed\s+or\s+used\s+for\s+any\s+USG-authorized\s+purpose.[\n\r
          \t]+-This\s+IS\s+includes\s+security\s+measures\s+\(e.g.,\s+authentication\s+and\s+access\s+controls\)\s+to\s+protect\s+USG\s+interests[-][-]not\s+for\s+your\s+personal\s+benefit\s+or\s+privacy.[\n\r
          \t]+-Notwithstanding\s+the\s+above,\s+using\s+this\s+IS\s+does\s+not\s+constitute\s+consent\s+to\s+PM,\s+LE\s+or\s+CI\s+investigative\s+searching\s+or\s+monitoring\s+of\s+the\s+content\s+of\s+privileged\s+communications,\s+or\s+work\s+product,\s+related\s+to\s+personal\s+representation\s+or\s+services\s+by\s+attorneys,\s+psychotherapists,\s+or\s+clergy,\s+and\s+their\s+assistants.\s+Such\s+communications\s+and\s+work\s+product\s+are\s+private\s+and\s+confidential.\s+See\s+User\s+Agreement\s+for\s+details.[\n\r]*
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-find-check-configured-location-sshd-banner-file:
      test_title: Find and check the configured location of the sshd banner file.
      capability: independent.shellcommand
      object: retrieve-location-sshd-banner-text-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-confirm-capture-of-the-sshd-banner-setting-and-that-it-i
    test-confirm-sshd-banner-text-correct:
      test_title: Confirm the sshd banner text is correct.
      capability: independent.textfilecontent54
      object: retrieve-text-sshd-banner-file-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-confirm-sshd-banner-text-is-correct
  evaluate:
    all:
    - test: test-find-check-configured-location-sshd-banner-file
    - test: test-confirm-sshd-banner-text-correct
