assessment:
  id: ng.shared.4452fe4b45157ee7915a83d3
  version: 1
  assessment_title: The operating system must shut down by default upon audit failure (unless availability is an overriding
    concern).
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    hkey-local-machine-system-policies-microsoft-cryptography-forcekeyprotection-collection:
      collection_title: HKEY_LOCAL_MACHINE\System\Policies\Microsoft\Cryptography\ForceKeyProtection
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Cryptography
        name:
          operation: equals
          datatype: string
          mask: false
          value: ForceKeyProtection
  tests:
    test-hkey-local-machine-system-policies-microsoft-cryptography-forcekeyprotection-exists-equals:
      test_title: HKEY_LOCAL_MACHINE\System\Policies\Microsoft\Cryptography\ForceKeyProtection exists and equals 2
      capability: windows.registry
      collection: hkey-local-machine-system-policies-microsoft-cryptography-forcekeyprotection-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: Reg_Dword type and value equals 2
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '2'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-hkey-local-machine-system-policies-microsoft-cryptography-forcekeyprotection-exists-equals
