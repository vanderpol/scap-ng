  version: 1
  assessment_title: The operating system must employ malicious code protection mechanisms at workstations, servers, or mobile
    computing devices on the network to detect and eradicate malicious code transported by electronic mail, electronic mail
    attachments, web accesses, removable media, or other common means.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: The operator will ensure that anti-virus software is installed and operating. If the operator is unable to provide
    a documented configuration for an installed anti-virus software system or if not properly used, this is a finding.
