assessment:
  id: ng.shared.22f3326cc6fcb13b76401aee
  version: 1
  assessment_title: WN19-DC-000230 - Windows Server 2019 must be configured to audit Account Management - Computer Account
    Management successes.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-auditeventpolicysubcategories-collection:
      collection_title: null
      capability: windows.auditeventpolicysubcategories
  tests:
    test-computer-account-management-set-success-or-success-failure:
      test_title: '''Computer Account Management'' is set to ''Success'' or ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: '''Computer Account Management'' is set to ''Success'''
          capability: windows.auditeventpolicysubcategories
          state:
            field: computer_account_management
            value: AUDIT_SUCCESS
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: '''Computer Account Management'' is set to ''Success'' and ''Failure'''
          capability: windows.auditeventpolicysubcategories
          state:
            field: computer_account_management
            value: AUDIT_SUCCESS_FAILURE
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-computer-account-management-set-success-or-success-failure
