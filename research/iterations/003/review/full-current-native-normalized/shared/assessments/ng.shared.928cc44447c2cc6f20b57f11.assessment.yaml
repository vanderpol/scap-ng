assessment:
  id: ng.shared.928cc44447c2cc6f20b57f11
  version: 1
  assessment_title: The system must disable ICMP redirect messages.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    ipadm-show-prop-p-send-redirects-co-current-ipv4-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: ipadm show-prop -p send_redirects -co current ipv4
        pattern:
          operation: pattern match
          datatype: string
          value: .*
      object_title: ipadm show-prop -p send_redirects -co current ipv4
    ipadm-show-prop-p-send-redirects-co-current-ipv6-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: ipadm show-prop -p send_redirects -co current ipv6
        pattern:
          operation: pattern match
          datatype: string
          value: .*
      object_title: ipadm show-prop -p send_redirects -co current ipv6
  states:
    state-check-that-line-returns-off-with-an-exit-status-of-0:
      state_title: Check that line returns 'off' with an exit status of 0
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: 'off'
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-system-disable-ipv4-icmp-redirect-messages:
      test_title: The system must disable ipv4 ICMP redirect messages.
      capability: independent.shellcommand
      object: ipadm-show-prop-p-send-redirects-co-current-ipv4-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-check-that-line-returns-off-with-an-exit-status-of-0
    test-system-disable-ipv6-icmp-redirect-messages:
      test_title: The system must disable ipv6 ICMP redirect messages..
      capability: independent.shellcommand
      object: ipadm-show-prop-p-send-redirects-co-current-ipv6-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-check-that-line-returns-off-with-an-exit-status-of-0
  evaluate:
    all:
    - test: test-system-disable-ipv4-icmp-redirect-messages
    - test: test-system-disable-ipv6-icmp-redirect-messages
