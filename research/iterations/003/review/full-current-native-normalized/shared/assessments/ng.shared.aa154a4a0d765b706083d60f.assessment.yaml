assessment:
  id: ng.shared.aa154a4a0d765b706083d60f
  version: 1
  assessment_title: CISC-ND-000150 - The Cisco router must be configured to enforce the limit of three consecutive invalid
    logon attempts, after which time it must lock out the user account from accessing the device for 15 minutes.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    iosxe-global-collection:
      collection_title: null
      capability: iosxe.global
      select:
        global_command:
          operation: pattern match
          datatype: string
          mask: false
          value: ^login[ \t]+block-for[ \t]+\d+[ \t]+attempts[ \t]+(?:1|2|3)[ \t]+within[ \t]+\d+[ \t]*$
  tests:
    test-limit-three-consecutive-invalid-logon-attempts:
      test_title: limit of three consecutive invalid logon attempts
      capability: iosxe.global
      collection: iosxe-global-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    test: test-limit-three-consecutive-invalid-logon-attempts
