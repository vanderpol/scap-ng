assessment:
  id: ng.shared.4e6beec9193e0972b63f3867
  version: 1
  assessment_title: Media Player - First Use Dialog Boxes
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\WindowsMediaPlayer
        name:
          operation: equals
          datatype: string
          mask: false
          value: GroupPrivacyAcceptance
  tests:
    test-do-not-show-first-use-dialog-boxes-set-enabled:
      test_title: '''Do Not Show First Use Dialog Boxes'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals 1
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-do-not-show-first-use-dialog-boxes-set-enabled
