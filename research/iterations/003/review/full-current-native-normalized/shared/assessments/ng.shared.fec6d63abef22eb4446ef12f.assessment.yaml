assessment:
  id: ng.shared.fec6d63abef22eb4446ef12f
  version: 1
  assessment_title: Windows Server 2016 domain-joined systems must have a Trusted Platform Module (TPM) enabled and ready
    for use.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: For standalone or nondomain-joined systems, this is NA. Verify the system has a TPM and it is ready for use.
    Run "tpm.msc". Review the sections in the center pane. "Status" must indicate it has been configured with a message such
    as "The TPM is ready for use" or "The TPM is on and ownership has been taken". TPM Manufacturer Information - Specific
    Version = 2.0 or 1.2 If a TPM is not found or is not ready for use, this is a finding.
  inputs: {}
  evidence: []
