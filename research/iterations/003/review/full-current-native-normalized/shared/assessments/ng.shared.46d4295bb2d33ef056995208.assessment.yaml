assessment:
  id: ng.shared.46d4295bb2d33ef056995208
  version: 1
  assessment_title: The Cisco device must be configured to audit all administrator activity.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    iosxe-line-collection:
      collection_title: null
      capability: iosxe.line
      select:
        show_subcommand:
          operation: equals
          datatype: string
          mask: false
          value: show running-config
    iosxe-global-collection:
      collection_title: null
      capability: iosxe.global
      select:
        global_command:
          operation: equals
          datatype: string
          mask: false
          value: logging userinfo
  tests:
    test-check-archive-log-config-logging-enable-logging-size-1000-notify:
      test_title: Check for archive - log config - logging enable - logging size 1000 - notify syslog contenttype plaintext
        - hidekeys
      capability: iosxe.line
      collection: iosxe-line-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Check for archive\n log config\n  logging enable\  logging size 1000\n  notify syslog contenttype plaintext\n  hidekeys
        state_capability: iosxe.line
        state:
          field: config_line
          value: \narchive\n log config\n(  \S+[^\n]*\n)*  logging enable\n(  \S+[^\n]*\n)*  logging size 1000\n(  \S+[^\n]*\n)*  notify
            syslog contenttype plaintext\n(  \S+[^\n]*\n)*  hidekeys
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-logging-userinfo:
      test_title: logging userinfo
      capability: iosxe.global
      collection: iosxe-global-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    all:
    - test: test-check-archive-log-config-logging-enable-logging-size-1000-notify
    - test: test-logging-userinfo
