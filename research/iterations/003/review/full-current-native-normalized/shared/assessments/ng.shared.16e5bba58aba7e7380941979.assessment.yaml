assessment:
  id: ng.shared.16e5bba58aba7e7380941979
  version: 1
  assessment_title: Windows Installer - IE Security Prompt
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: Software\Policies\Microsoft\Windows\Installer
        name:
          operation: equals
          datatype: string
          value: SafeForScripting
      object_title: null
  states:
    state-reg-dword-type-and-value-equals-0:
      state_title: Reg_Dword type and value equals 0
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-prevent-internet-explorer-security-prompt-windows-installer-scripts-set-disabled:
      test_title: '''Prevent Internet Explorer security prompt for Windows Installer scripts'' is set to ''Disabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-0
  evaluate:
    test: test-prevent-internet-explorer-security-prompt-windows-installer-scripts-set-disabled
