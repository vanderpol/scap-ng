assessment:
  id: ng.shared.6877505871330512b1f1d9a4
  version: 1
  assessment_title: Disable IP Source Routing
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: System\CurrentControlSet\Services\Tcpip\Parameters
        name:
          operation: equals
          datatype: string
          value: DisableIPSourceRouting
      object_title: null
  variables:
    mss-disableipsourcerouting-ip-source-routing-protection-level-protects-against-packet-variable:
      title: 'MSS: (DisableIPSourceRouting) IP source routing protection level (protects against packet spoofing)'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: ip_source_routing_protection_level_var
        validation:
          alternatives:
          - literal: '0'
            hint: source_routing_packets_allowed
          - literal: '1'
            hint: source_routing_packets_ignored
          - literal: '2'
            hint: source_routing_packets_disabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: mss-disableipsourcerouting-ip-source-routing-protection-level-protects-against-packet-variable
          operation: equals
          datatype: int
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-mss-disableipsourcerouting-ip-source-routing-protection-level-protects-against-packet:
      test_title: '''MSS: (DisableIPSourceRouting) IP source routing protection level (protects against packet spoofing)''
        is set to ''Highest protection, source routing is completely disabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-mss-disableipsourcerouting-ip-source-routing-protection-level-protects-against-packet
