assessment:
  id: ng.shared.830d65130609f2d3ea6577bb
  version: 1
  assessment_title: The system must set maximum number of incoming connections to 1024.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    ipadm-show-prop-p-conn-req-max-q-co-current-collection:
      collection_title: ipadm show-prop -p _conn_req_max_q -co current tcp
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: ipadm show-prop -p _conn_req_max_q -co current tcp
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
  tests:
    test-system-set-maximum-number-incoming-connections-1024:
      test_title: The system must set maximum number of incoming connections to 1024.
      capability: independent.shellcommand
      collection: ipadm-show-prop-p-conn-req-max-q-co-current-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Check that line returns '1024' with an exit status of 0
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: '1024'
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-system-set-maximum-number-incoming-connections-1024
