assessment:
  id: ng.shared.334e996ddca775d1813f4a10
  version: 1
  assessment_title: The macOS system must be configured to disable SMB File Sharing unless it is required.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    system-settings-smbd-disable-recommended-object-collection:
      collection_title: system_settings_smbd_disable_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /bin/launchctl print-disabled system | /usr/bin/grep '"com.apple.smbd" => disabled'
  tests:
    test-system-settings-smbd-disable-recommended-test:
      test_title: system_settings_smbd_disable_recommended_test
      capability: independent.shellcommand
      collection: system-settings-smbd-disable-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: system_settings_smbd_disable_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: .*
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-system-settings-smbd-disable-recommended-test
