assessment:
  id: ng.shared.3481547eb6c34c154fbc44d5
  version: 1
  assessment_title: The macOS system must disable password authentication for SSH.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    auth-ssh-password-authentication-disable-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/sbin/sshd -G | /usr/bin/grep -Ec '^(passwordauthentication\s+no|kbdinteractiveauthentication\s+no)'
      object_title: auth_ssh_password_authentication_disable_recommended_object
  states:
    state-auth-ssh-password-authentication-disable-recommended-sta:
      state_title: auth_ssh_password_authentication_disable_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: '2'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-auth-ssh-password-authentication-disable-recommended-test:
      test_title: auth_ssh_password_authentication_disable_recommended_test
      capability: independent.shellcommand
      object: auth-ssh-password-authentication-disable-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-auth-ssh-password-authentication-disable-recommended-sta
  evaluate:
    test: test-auth-ssh-password-authentication-disable-recommended-test
