assessment:
  id: ng.shared.53e0dacf99463224aa846178
  version: 1
  assessment_title: The macOS system must disable password authentication for SSH.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable password authentication for SSH with the following command:
    /usr/sbin/sshd -G | /usr/bin/grep -Ec ''^(passwordauthentication\s+no|kbdinteractiveauthentication\s+no)'' If the result
    is not "2", this is a finding.'
  inputs: []
  evidence: []
