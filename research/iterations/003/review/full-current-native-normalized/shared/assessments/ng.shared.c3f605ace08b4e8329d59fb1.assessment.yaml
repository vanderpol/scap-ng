  assessment_title: The macOS system must enforce auto logout after 86400 seconds of inactivity.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to enforce auto logout after 86400 seconds of inactivity with the following
    command: /usr/bin/osascript -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''.GlobalPreferences'')\ .objectForKey(''com.apple.autologout.AutoLogOutDelay'').js
    EOS If the result is not "86400", this is a finding.'
