assessment:
  id: ng.shared.e52488a5259f3010f44f3ace
  version: 1
  assessment_title: The macOS system must configure audit_control owner to mode 440 or less permissive.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured with the audit_control to mode 440 or less with the following command:
    /bin/ls -l /etc/security/audit_control | /usr/bin/awk ''!/-r--[r-]-----|current|total/{print $1}'' | /usr/bin/wc -l |
    /usr/bin/xargs If the result is not "0", this is a finding.'
  inputs: {}
  evidence: []
