assessment:
  id: ng.shared.89d16ea5957c3bb4fc6a5901
  version: 1
  assessment_title: OL09-00-002120 - OL 9 must prevent a user from overriding the disabling of the graphical user interface
    automount function.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    check-that-etc-dconf-profile-user-system-db-at-minimum-collection:
      collection_title: check that /etc/dconf/profile/user:system-db is at minimum set to local
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/dconf/profile/user
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*system-db\s*:\s*local\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/dconf/db/local.d/locks
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^/org/gnome/desktop/media-handling/automount-open$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-check-that-etc-dconf-profile-user-system-db-at-minimum:
      test_title: check that /etc/dconf/profile/user:system-db is at minimum set to local
      capability: independent.textfilecontent54
      collection: check-that-etc-dconf-profile-user-system-db-at-minimum-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
    test-org-gnome-desktop-media-handling-automount-open-in-etc-dconf:
      test_title: /org/gnome/desktop/media-handling/automount-open in /etc/dconf/db/local.d/locks/*
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    all:
    - test: test-check-that-etc-dconf-profile-user-system-db-at-minimum
    - test: test-org-gnome-desktop-media-handling-automount-open-in-etc-dconf
