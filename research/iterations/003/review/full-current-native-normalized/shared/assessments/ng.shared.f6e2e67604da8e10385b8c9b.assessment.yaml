  version: 1
  assessment_title: The macOS system must enable firmware password.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'For Apple Silicon systems, this is not applicable. Verify the macOS system is configured with a firmware password
    with the following command: /usr/sbin/firmwarepasswd -check | /usr/bin/grep -c "Password Enabled: Yes" If the result is
    not "1", this is a finding.'
  inputs: {}
  evidence: []
