assessment:
  id: ng.shared.2df963ff54073c18626cd77a
  version: 1
  assessment_title: WN10-SO-000230 - The system must be configured to use FIPS-compliant algorithms for encryption, hashing,
    and signing.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Control\Lsa\FIPSAlgorithmPolicy
        name:
          operation: equals
          datatype: string
          mask: false
          value: Enabled
  tests:
    test-system-cryptography-use-fips-compliant-algorithms-encryption-hashing-signing-set:
      test_title: '''System cryptography: Use FIPS compliant algorithms for encryption, hashing, and signing'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-system-cryptography-use-fips-compliant-algorithms-encryption-hashing-signing-set
