assessment:
  id: ng.shared.6dba9b36eab7f6c5dacef066
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that the audit system takes appropriate action
    when there is an error sending audit records to a remote system.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    check-etc-audisp-audisp-remote-conf-value-assigned-network-failure-collection:
      collection_title: Check /etc/audisp/audisp-remote.conf for the value assigned to network_failure_action setting.
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audisp/audisp-remote.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: (?i)^\s*network_failure_action[ ]*=[ ]*([\w]+)\s*
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
  tests:
    test-check-value-assigned-network-failure-action-in-etc-audisp-audisp:
      test_title: Check the value assigned to network_failure_action in /etc/audisp/audisp-remote.conf
      capability: independent.textfilecontent54
      collection: check-etc-audisp-audisp-remote-conf-value-assigned-network-failure-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: The value is set to a case insensitive syslog, single, or halt
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: (?i)^syslog|single|halt$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-check-value-assigned-network-failure-action-in-etc-audisp-audisp
