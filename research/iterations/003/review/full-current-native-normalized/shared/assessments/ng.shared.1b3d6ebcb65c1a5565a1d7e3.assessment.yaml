assessment:
  id: ng.shared.1b3d6ebcb65c1a5565a1d7e3
  version: 1
  assessment_title: OL08-00-010140 - OL 8 operating systems booted with United Extensible Firmware Interface (UEFI) must require
    authentication upon booting into single-user mode and maintenance.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /boot/efi/EFI/redhat/grub.cfg
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*set\s+superusers\s*=\s*"(\w+)"\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-textfilecontent54-collection-2:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /boot/efi/EFI/redhat/user.cfg
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*GRUB2_PASSWORD=(\S+)\b
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-boot-efi-efi-redhat-grub-cfg-superusers-exists-has-name:
      test_title: /boot/efi/EFI/redhat/grub.cfg:superusers exists and has a name.
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^\S+$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-boot-efi-efi-redhat-user-cfg-grub2-password-exists-has:
      test_title: /boot/efi/EFI/redhat/user.cfg:GRUB2_PASSWORD exists and has a PBKDF2/SHA512 password assigned.
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection-2
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^grub\.pbkdf2\.sha512
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-boot-efi-efi-redhat-grub-cfg-superusers-exists-has-name
    - test: test-boot-efi-efi-redhat-user-cfg-grub2-password-exists-has
