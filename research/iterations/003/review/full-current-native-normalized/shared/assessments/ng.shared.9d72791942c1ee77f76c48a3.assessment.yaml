assessment:
  id: ng.shared.9d72791942c1ee77f76c48a3
  version: 1
  assessment_title: Anonymous access to the registry must be restricted.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Run "Regedit". Navigate to the following registry key: HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\SecurePipeServers\winreg\
    If the key does not exist, this is a finding. Right-click on "winreg" and select "Permissions…". Select "Advanced". If
    the permissions are not as restrictive as the defaults listed below, this is a finding. The following are the same for
    each permission listed: Type - Allow Inherited from - None Columns: Principal - Access - Applies to Administrators - Full
    Control - This key and subkeys Backup Operators - Read - This key only LOCAL SERVICE - Read - This key and subkeys'
  inputs: []
  evidence: []
