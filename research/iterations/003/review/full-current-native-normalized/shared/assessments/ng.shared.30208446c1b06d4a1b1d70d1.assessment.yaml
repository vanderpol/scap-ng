assessment:
  id: ng.shared.30208446c1b06d4a1b1d70d1
  version: 1
  assessment_title: Windows Server 2016 must have the period of time before the bad logon counter is reset configured to 15
    minutes or greater.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy
    >> Computer Configuration >> Windows Settings >> Security Settings >> Account Policies >> Account Lockout Policy. If the
    "Reset account lockout counter after" value is less than "15" minutes, this is a finding. For server core installations,
    run the following command: Secedit /Export /Areas SecurityPolicy /CFG C:\Path\FileName.Txt If "ResetLockoutCount" is less
    than "15" in the file, this is a finding.'
  inputs: {}
  evidence: []
