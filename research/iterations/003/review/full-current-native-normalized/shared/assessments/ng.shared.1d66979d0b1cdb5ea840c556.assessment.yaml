  assessment_title: The macOS system must disable iPhone Mirroring.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable iPhone Mirroring with the following command: /usr/bin/osascript
    -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\ .objectForKey(''allowiPhoneMirroring'').js
    EOS If the result is not "false", this is a finding.'
  inputs: {}
  evidence: []
