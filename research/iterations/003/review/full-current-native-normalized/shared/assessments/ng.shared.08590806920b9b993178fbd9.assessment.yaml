assessment:
  id: ng.shared.08590806920b9b993178fbd9
  version: 1
  assessment_title: The macOS system must monitor remote access methods and generate audit records when successful/unsuccessful
    attempts to access/modify privileges occur.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    audit-flags-lo-configure-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/bin/awk -F':' '/^flags/ { print $NF }' /etc/security/audit_control | /usr/bin/tr ',' '\n' | /usr/bin/grep
            -Ec '^lo'
      object_title: audit_flags_lo_configure_recommended_object
  states:
    state-audit-flags-lo-configure-recommended-state:
      state_title: audit_flags_lo_configure_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: '1'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-flags-lo-configure-recommended-test:
      test_title: audit_flags_lo_configure_recommended_test
      capability: independent.shellcommand
      object: audit-flags-lo-configure-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-audit-flags-lo-configure-recommended-state
  evaluate:
    test: test-audit-flags-lo-configure-recommended-test
