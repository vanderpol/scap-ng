assessment:
  id: ng.shared.a0c373ebb6e6b3b23780c37d
  version: 1
  assessment_title: WN19-00-000340 - Windows Server 2019 must not have the Peer Name Resolution Protocol installed.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-wmi57-collection:
      collection_title: null
      capability: windows.wmi57
      select:
        namespace:
          operation: equals
          datatype: string
          mask: false
          value: root\cimv2
        wql:
          operation: equals
          datatype: string
          mask: false
          value: SELECT startmode FROM Win32_Service WHERE name='PNRPSvc'
  tests:
    test-peer-name-resolution-protocol-server-feature-disabled-or-not-present:
      test_title: The Peer Name Resolution Protocol server feature is disabled or not present
      capability: windows.wmi57
      collection: windows-wmi57-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: null
        state_capability: windows.wmi57
        state:
          field: result
          value:
            record:
            - name: startmode
              value: Disabled
              operation: equals
              datatype: string
              mask: false
              entity_check: all
          operation: equals
          datatype: record
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-peer-name-resolution-protocol-server-feature-disabled-or-not-present
