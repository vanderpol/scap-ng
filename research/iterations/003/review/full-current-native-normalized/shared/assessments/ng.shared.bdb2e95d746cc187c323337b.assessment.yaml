assessment:
  id: ng.shared.bdb2e95d746cc187c323337b
  version: 1
  assessment_title: The macOS system must disable Media Sharing.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    system-settings-media-sharing-disabled-recommended-object-collection:
      collection_title: system_settings_media_sharing_disabled_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: "/usr/bin/osascript -l JavaScript << EOS\nfunction run() {\n  let pref1 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.applicationaccess')\\\
            \n.objectForKey('allowMediaSharing'))\n  let pref2 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.applicationaccess')\\\
            \n.objectForKey('allowMediaSharingModification'))\n  if ( pref1 == false && pref2 == false ) {\n    return(\"\
            true\")\n  } else {\n    return(\"false\")\n  }\n}\nEOS"
  tests:
    test-system-settings-media-sharing-disabled-recommended-test:
      test_title: system_settings_media_sharing_disabled_recommended_test
      capability: independent.shellcommand
      collection: system-settings-media-sharing-disabled-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: system_settings_media_sharing_disabled_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: 'true'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-system-settings-media-sharing-disabled-recommended-test
