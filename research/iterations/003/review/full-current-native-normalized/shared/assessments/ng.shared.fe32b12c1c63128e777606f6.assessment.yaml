assessment:
  id: ng.shared.fe32b12c1c63128e777606f6
  version: 1
  assessment_title: The macOS system must enable gatekeeper.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-gatekeeper-enable-recommended-object-collection:
      collection_title: os_gatekeeper_enable_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.systempolicy.control'')\

            .objectForKey(''EnableAssessment'').js

            EOS'
  tests:
    test-os-gatekeeper-enable-recommended-test:
      test_title: os_gatekeeper_enable_recommended_test
      capability: independent.shellcommand
      collection: os-gatekeeper-enable-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: os_gatekeeper_enable_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: 'true'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-os-gatekeeper-enable-recommended-test
