assessment:
  id: ng.shared.ebc14e8285af59042a4e1779
  version: 1
  assessment_title: Ubuntu 22.04 LTS must initiate a graphical session lock after 10 minutes of inactivity.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    ubuntu-retain-user-s-session-lock-until-that-user-reestablishes-collection:
      collection_title: Ubuntu must retain a user's session lock until that user reestablishes access using established identification
        and authentication procedures.
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: gsettings get org.gnome.desktop.screensaver lock-enabled
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: 'true'
    ubuntu-initiate-graphical-session-lock-after-15-minutes-inactivity-collection:
      collection_title: Ubuntu must initiate a graphical session lock after 15 minutes of inactivity.
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: 'gsettings get org.gnome.desktop.screensaver lock-delay '
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: uint32\s+(\d+)
  tests:
    test-check-that-screensaver-idle-lock-enabled:
      test_title: Check that screensaver idle lock is enabled.
      capability: independent.shellcommand
      collection: ubuntu-retain-user-s-session-lock-until-that-user-reestablishes-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Ubuntu must retain a user's session lock until that user reestablishes access using established identification
          and authentication procedures.
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: 'true'
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-ubuntu-initiate-graphical-session-lock-after-15-minutes-inactivity-lock:
      test_title: Ubuntu must initiate a graphical session lock after 15 minutes of inactivity.(Lock delay must be 0)
      capability: independent.shellcommand
      collection: ubuntu-initiate-graphical-session-lock-after-15-minutes-inactivity-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Ubuntu must initiate a graphical session lock after 15 minutes of inactivity.
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: subexpression
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-ubuntu-initiate-graphical-session-lock-after-15-minutes-inactivity-idle:
      test_title: Ubuntu must initiate a graphical session lock after 15 minutes of inactivity.(idle delay must be 15 mins
        or less)
      capability: independent.shellcommand
      collection: ubuntu-initiate-graphical-session-lock-after-15-minutes-inactivity-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Ubuntu must initiate a graphical session lock after 15 minutes of inactivity.
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: subexpression
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-check-that-screensaver-idle-lock-enabled
    - test: test-ubuntu-initiate-graphical-session-lock-after-15-minutes-inactivity-lock
    - test: test-ubuntu-initiate-graphical-session-lock-after-15-minutes-inactivity-idle
