assessment:
  id: ng.shared.17e935e2f74ba724f257dc7d
  version: 1
  assessment_title: The macOS system must use an approved antivirus program.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-config-data-install-enforce-recommended-object-collection:
      collection_title: os_config_data_install_enforce_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.SoftwareUpdate'')\

            .objectForKey(''ConfigDataInstall'').js

            EOS'
  tests:
    test-os-config-data-install-enforce-recommended-test:
      test_title: os_config_data_install_enforce_recommended_test
      capability: independent.shellcommand
      collection: os-config-data-install-enforce-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: os_config_data_install_enforce_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: 'true'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-os-config-data-install-enforce-recommended-test
