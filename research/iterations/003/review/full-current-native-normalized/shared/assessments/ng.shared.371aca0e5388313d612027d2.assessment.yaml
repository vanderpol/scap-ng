assessment:
  id: ng.shared.371aca0e5388313d612027d2
  version: 1
  assessment_title: AZLX-23-002350 - Amazon Linux 2023 system commands must be group-owned by root or a system account.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    all-files-in-system-command-directories-less-files-group-owned-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: system-command-directories-including-usr-libexec-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
      filters:
      - action: exclude
        state: state-unix-file
      behaviors:
        recurse_direction: down
      object_title: All files in system command directories, less files group-owned by root or a system account
  variables:
    system-command-directories-including-usr-libexec-variable:
      title: system command directories (including /usr/libexec)
      kind: constant
      datatype: string
      expression:
        literal:
        - /bin
        - /sbin
        - /usr/bin
        - /usr/sbin
        - /usr/libexec
        - /usr/local/bin
        - /usr/local/sbin
  states:
    state-unix-file:
      state_title: null
      capability: unix.file
      state:
        field: group_id
        value: '1000'
        operation: less than
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-no-system-commands-exist-except-those-group-owned-by-root:
      test_title: No system commands exist, except for those group-owned by root or a system account.
      capability: unix.file
      object: all-files-in-system-command-directories-less-files-group-owned-object
      check_existence: none_exist
      check: all
  evaluate:
    test: test-no-system-commands-exist-except-those-group-owned-by-root
