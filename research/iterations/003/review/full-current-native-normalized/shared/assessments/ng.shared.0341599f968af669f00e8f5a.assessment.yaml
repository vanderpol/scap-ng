assessment:
  id: ng.shared.0341599f968af669f00e8f5a
  version: 1
  assessment_title: The Oracle Linux operating system must audit all uses of the chmod, fchmod, and fchmodat syscalls.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system generates audit records upon successful/unsuccessful attempts to use the "chmod",
    "fchmod", and "fchmodat" syscalls. Check the file system rules in "/etc/audit/audit.rules" with the following command:
    # grep chmod /etc/audit/audit.rules -a always,exit -F arch=b32 -S chmod,fchmod,fchmodat -F auid>=1000 -F auid!=unset -k
    perm_mod -a always,exit -F arch=b64 -S chmod,fchmod,fchmodat -F auid>=1000 -F auid!=unset -k perm_mod If both the "b32"
    and "b64" audit rules are not defined for the "chmod", "fchmod", and "fchmodat" syscalls, this is a finding.'
  inputs: {}
  evidence: []
