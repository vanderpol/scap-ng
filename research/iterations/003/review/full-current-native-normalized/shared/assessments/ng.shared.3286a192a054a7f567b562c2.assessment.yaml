assessment:
  id: ng.shared.3286a192a054a7f567b562c2
  version: 1
  assessment_title: The audit system must be configured to audit file deletions.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    audit-system-configured-audit-file-deletions-collection:
      collection_title: The audit system must be configured to audit file deletions.
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: auditconfig -t -getflags | cut -f2 -d=
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
  tests:
    test-audit-system-configured-audit-file-deletions:
      test_title: The audit system must be configured to audit file deletions.
      capability: independent.shellcommand
      collection: audit-system-configured-audit-file-deletions-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: fd is returned in the output
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: fd
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-audit-system-configured-audit-file-deletions
