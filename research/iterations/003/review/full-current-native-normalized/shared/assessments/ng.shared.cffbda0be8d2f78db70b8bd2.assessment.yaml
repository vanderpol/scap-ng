assessment:
  id: ng.shared.cffbda0be8d2f78db70b8bd2
  version: 1
  assessment_title: The Oracle Linux operating system must use a separate file system for /tmp (or equivalent).
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that a separate file system/partition has been created for "/tmp". Check that a file system/partition
    has been created for "/tmp" with the following command: # systemctl is-enabled tmp.mount enabled If the "tmp.mount" service
    is not enabled, check to see if "/tmp" is defined in the fstab with a device and mount point: # grep -i /tmp /etc/fstab
    UUID=a411dc99-f2a1-4c87-9e05-184977be8539 /tmp ext4 rw,relatime,discard,data=ordered,nosuid,noexec, 0 0 If "tmp.mount"
    service is not enabled or the "/tmp" directory is not defined in the fstab with a device and mount point, this is a finding.'
  inputs: []
  evidence: []
