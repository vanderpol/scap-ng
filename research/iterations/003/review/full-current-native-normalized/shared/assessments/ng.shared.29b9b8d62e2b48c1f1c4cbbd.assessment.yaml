assessment:
  id: ng.shared.29b9b8d62e2b48c1f1c4cbbd
  version: 1
  assessment_title: AZLX-23-002105 - Amazon Linux 2023 must generate audit records for all account creations, modifications,
    disabling, and termination events that affect /etc/opasswd.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/audit.rules
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*-w\s+/etc/security/opasswd(\s+-p\s*([rx]*w[rx]*a[rx]*|[rx]*a[rx]*w[rx]*))?(\s+(-k\s+|-F\s+key=)\w+)?\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: null
  states: {}
  tests:
    test-audit-modifications-etc-security-opasswd:
      test_title: Audit modifications to /etc/security/opasswd
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: all_exist
      check: all
  evaluate:
    test: test-audit-modifications-etc-security-opasswd
