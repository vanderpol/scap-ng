assessment:
  id: ng.shared.fe0af77e88fbfe3f6ddf5562
  version: 1
  assessment_title: The macOS system must configure system log files to mode 640 or less permissive.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured with system log files set to mode 640 or less permissive with the following
    command: /usr/bin/stat -f ''%A:%N'' $(/usr/bin/grep -v ''^#'' /etc/newsyslog.conf | /usr/bin/awk ''{ print $1 }'') 2>
    /dev/null | /usr/bin/awk ''!/640/{print $1}'' | /usr/bin/wc -l | /usr/bin/tr -d '' '' If the result is not "0", this is
    a finding.'
  inputs: []
  evidence: []
