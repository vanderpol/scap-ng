assessment:
  id: ng.shared.9b374f5780945c69a51fd170
  version: 1
  assessment_title: OL08-00-020010 - OL 8 systems below version 8.2 must automatically lock an account when three unsuccessful
    logon attempts occur.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/pam.d/system-auth
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*deny\s*=\s*([\d]+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
    independent-textfilecontent54-object-2:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/pam.d/password-auth
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*deny\s*=\s*([\d]+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '3'
        operation: less than or equal
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54-2:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '0'
        operation: greater than
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-deny-set-3-or-less-but-not-0-in-etc:
      test_title: deny is set to 3 or less but not 0 in /etc/pam.d/system-auth
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
      state_operator: AND
      states:
      - state-independent-textfilecontent54
      - state-independent-textfilecontent54-2
    test-deny-set-3-or-less-but-not-0-in-etc-2:
      test_title: deny is set to 3 or less but not 0 in /etc/pam.d/password-auth
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-2
      check_existence: at_least_one_exists
      check: all
      state_operator: AND
      states:
      - state-independent-textfilecontent54
      - state-independent-textfilecontent54-2
  evaluate:
    all:
    - test: test-deny-set-3-or-less-but-not-0-in-etc
    - test: test-deny-set-3-or-less-but-not-0-in-etc-2
