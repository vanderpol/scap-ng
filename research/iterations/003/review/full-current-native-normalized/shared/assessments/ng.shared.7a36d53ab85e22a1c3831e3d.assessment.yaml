assessment:
  id: ng.shared.7a36d53ab85e22a1c3831e3d
  version: 1
  assessment_title: The operating system must automatically terminate temporary accounts within 72 hours.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The root role is required. Determine if an expiration date is set for temporary accounts. # logins -aox |awk
    -F: ''($14 == "0") {print}'' This command produces a list of accounts with no expiration date set. If any of these accounts
    are temporary accounts, this is a finding. # logins -aox |awk -F: ''($14 != "0") {print}'' This command produces a list
    of accounts with an expiration date set as defined in the last field. If any accounts have a date that is not within 72
    hours, this is a finding.'
  inputs: []
  evidence: []
