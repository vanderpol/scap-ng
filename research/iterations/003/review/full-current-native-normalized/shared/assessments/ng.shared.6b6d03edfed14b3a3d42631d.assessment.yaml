assessment:
  id: ng.shared.6b6d03edfed14b3a3d42631d
  version: 1
  assessment_title: WN10-AU-000560 - Windows 10 must be configured to audit other Logon/Logoff Events Successes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-log-on-is-set-to-success:
      state_title: '''Log On'' is set to ''Success'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: other_logon_logoff_events
        value: AUDIT_SUCCESS
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-log-on-is-set-to-success-and-failure:
      state_title: '''Log On'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: other_logon_logoff_events
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-logon-set-failure-succss-failure:
      test_title: '''Audit Logon'' is set to ''Failure'' and ''Succss and Failure'
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-log-on-is-set-to-success
      - state-log-on-is-set-to-success-and-failure
  evaluate:
    test: test-audit-logon-set-failure-succss-failure
