      test_title: net.ipv4.icmp_echo_ignore_broadcasts is set to 1 in kernel
      capability: unix.sysctl
      collection: unix-sysctl-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: unix.sysctl
        state:
          field: value
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-net-ipv4-icmp-echo-ignore-broadcasts-set-1-in-kernel
