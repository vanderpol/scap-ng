assessment:
  id: ng.shared.320e68dc975c7b267847430a
  version: 1
  assessment_title: WN10-SO-000190 - Kerberos encryption types must be configured to prevent the use of DES and RC4 encryption
    suites.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Kerberos\Parameters
        name:
          operation: equals
          datatype: string
          mask: false
          value: SupportedEncryptionTypes
  tests:
    test-network-security-configure-encryption-types-allowed-kerberos-set-enabled-aes128:
      test_title: '''Network Security: Configure encryption types allowed for Kerberos'' is set to ''Enabled'' with ''AES128_HMAC_SHA1'',
        ''AES256_HMAC_SHA1'', ''Future encryption types'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals 2147483640 for AES128_HMAC_SHA1, AES256_HMAC_SHA1, and Future_Encryption_Types
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '2147483640'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-network-security-configure-encryption-types-allowed-kerberos-set-enabled-aes128
