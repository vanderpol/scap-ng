assessment:
  id: ng.shared.16c0a029901379e7db369944
  version: 1
  assessment_title: The macOS system must configure sudo to log events.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-sudo-log-enforce-recommended-object-collection:
      collection_title: os_sudo_log_enforce_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/bin/sudo /usr/bin/sudo -V | /usr/bin/grep "Log when a command is allowed by sudoers"
  tests:
    test-os-sudo-log-enforce-recommended-test:
      test_title: os_sudo_log_enforce_recommended_test
      capability: independent.shellcommand
      collection: os-sudo-log-enforce-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: os_sudo_log_enforce_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: .*
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-os-sudo-log-enforce-recommended-test
