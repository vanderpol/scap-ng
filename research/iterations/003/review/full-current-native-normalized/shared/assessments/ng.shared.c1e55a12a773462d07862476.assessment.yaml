assessment:
  id: ng.shared.c1e55a12a773462d07862476
  version: 1
  assessment_title: The macOS system must disable the system settings pane for Siri.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable the system settings pane for Siri with the following command:
    /usr/bin/profiles show -output stdout-xml | /usr/bin/xmllint --xpath ''//key[text()="DisabledSystemSettings"]/following-sibling::*[1]''
    - | /usr/bin/grep -c com.apple.Siri-Settings.extension If the result is not "1", this is a finding.'
  inputs: []
  evidence: []
