assessment:
  id: ng.shared.c4bdd3fed012000eedbce12d
  version: 1
  assessment_title: The macOS system must disable sending audio recordings and transcripts to Apple.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    system-settings-improve-assistive-voice-disable-recommended-object-collection:
      collection_title: system_settings_improve_assistive_voice_disable_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.Accessibility'')\

            .objectForKey(''AXSAudioDonationSiriImprovementEnabled'').js

            EOS'
  tests:
    test-system-settings-improve-assistive-voice-disable-recommended-test:
      test_title: system_settings_improve_assistive_voice_disable_recommended_test
      capability: independent.shellcommand
      collection: system-settings-improve-assistive-voice-disable-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: system_settings_improve_assistive_voice_disable_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: 'false'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-system-settings-improve-assistive-voice-disable-recommended-test
