  assessment_title: A firewall must be active on OL 8.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that "firewalld" is active with the following commands: $ sudo systemctl is-active firewalld active If
    the "firewalld" package is not "active", ask the System Administrator if another firewall is installed. If no firewall
    is installed and active this is a finding.'
