assessment:
  id: ng.shared.0c7894e6fb42b3a5897cc3dd
  version: 1
  assessment_title: OL 8 must prevent the installation of software, patches, service packs, device drivers, or operating system
    components of local packages without verification they have been digitally signed using a certificate that is issued by
    a Certificate Authority (CA) that is recognized and approved by the organization.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system prevents the installation of patches, service packs, device drivers, or operating
    system components from a repository without verification that they have been digitally signed using a certificate that
    is recognized and approved by the organization. Determine if YUM is configured to perform a signature check on local packages
    with the following command: $ sudo grep -i localpkg_gpgcheck /etc/dnf/dnf.conf localpkg_gpgcheck=1 If "localpkg_gpgcheck"
    is not set to "1", "True", or "yes", is commented out, or is missing from "/etc/dnf/dnf.conf", this is a finding.'
  inputs: {}
  evidence: []
