assessment:
  id: ng.shared.86d4c34c8987f0d6239a447b
  version: 1
  assessment_title: Enable GNOME3 Screensaver Idle Activation
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-rpminfo-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: dconf
      object_title: null
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/dconf/profile/user
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^user-db:user\nsystem-db:local$
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
      object_title: null
    independent-textfilecontent54-object-2:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/dconf/db/
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[0-9].*$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\[org/gnome/desktop/screensaver\]([^\n]*\n+)+?idle-activation-enabled\s*=\s*true\s*$
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
      behaviors:
        multiline: 'true'
        max_depth: '1'
        recurse_direction: down
      object_title: null
  states: {}
  tests:
    test-package-dconf-installed:
      test_title: package dconf is installed
      capability: linux.rpminfo
      object: linux-rpminfo-object
      check_existence: all_exist
      check: all
    test-dconf-user-profile-exists:
      test_title: dconf user profile exists
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: all_exist
      check: all
    test-idle-delay-configured:
      test_title: idle delay is configured
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-2
      check_existence: all_exist
      check: all
  evaluate:
    any:
    - not:
        test: test-package-dconf-installed
    - all:
      - any:
        - not:
            test: test-package-dconf-installed
        - test: test-dconf-user-profile-exists
      - test: test-idle-delay-configured
