assessment:
  id: ng.shared.4070b1beb10c39ac9284cbbe
  version: 1
  assessment_title: Process core dumps must be disabled unless needed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    routeadm-p-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: coreadm
        pattern:
          operation: pattern match
          datatype: string
          value: enabled
      object_title: routeadm -p
  states:
    state-check-that-the-only-output-includes-logging-with-an-exit:
      state_title: Check that the only output includes 'logging' with an exit status of 0
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: logging
          operation: pattern match
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-process-core-dumps-disabled-unless-needed:
      test_title: Process core dumps must be disabled unless needed.
      capability: independent.shellcommand
      object: routeadm-p-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-check-that-the-only-output-includes-logging-with-an-exit
  evaluate:
    test: test-process-core-dumps-disabled-unless-needed
