assessment:
  id: ng.shared.56be27a21e6087480cccad9a
  version: 1
  assessment_title: CISC-ND-000280 - The Cisco router must produce audit records containing information to establish when
    (date and time) the events occurred.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    iosxe-global-collection:
      collection_title: null
      capability: iosxe.global
      select:
        global_command:
          operation: pattern match
          datatype: string
          mask: false
          value: ^service[ \t]+timestamps[ \t]+log[ \t]+datetime(?:[ \t]+localtime|[ \t]+msec|[ \t]+show-timezone|[ /t]+year){0,4}[
            \t]*$
  tests:
    test-audit-records-contain-date-time-when-events-occurred:
      test_title: Audit records contain the date and time of when the events occurred.
      capability: iosxe.global
      collection: iosxe-global-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    test: test-audit-records-contain-date-time-when-events-occurred
