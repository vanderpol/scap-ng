assessment:
  id: ng.shared.9d7f58b42589d06edef87700
  version: 1
  assessment_title: Disable ICMP Redirect
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Services\Tcpip\Parameters
        name:
          operation: equals
          datatype: string
          mask: false
          value: EnableICMPRedirect
  variables:
    mss-enableicmpredirect-allow-icmp-redirects-override-ospf-generated-routes-variable:
      title: 'MSS: (EnableICMPRedirect) Allow ICMP redirects to override OSPF generated routes'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: allow_icmp_redirects_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-mss-enableicmpredirect-allow-icmp-redirects-override-ospf-generated-routes-set:
      test_title: '''MSS: (EnableICMPRedirect) Allow ICMP redirects to override OSPF generated routes'' is set to ''Disabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: mss-enableicmpredirect-allow-icmp-redirects-override-ospf-generated-routes-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-mss-enableicmpredirect-allow-icmp-redirects-override-ospf-generated-routes-set
