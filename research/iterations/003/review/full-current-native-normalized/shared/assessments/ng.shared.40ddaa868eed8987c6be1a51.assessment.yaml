assessment:
  id: ng.shared.40ddaa868eed8987c6be1a51
  version: 1
  assessment_title: The operating system must provide the capability to automatically process audit records for events of
    interest based upon selectable, event criteria.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The Audit Configuration profile is required. This check applies to the global zone only. Determine the zone
    that you are currently securing. # zonename If the command output is "global", this check applies. Check the status of
    the audit system. It must be auditing. # pfexec auditconfig -getcond If this command does not report: audit condition
    = auditing this is a finding.'
  inputs: {}
  evidence: []
