assessment:
  id: ng.shared.f849ccf08cb726627097f33a
  version: 1
  assessment_title: SQL Server must maintain a separate execution domain for each executing process.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Review the server documentation to determine whether use of CLR assemblies is required. Run the following query
    to determine whether CLR is enabled for the instance: SELECT name, value, value_in_use FROM sys.configurations WHERE name
    = ''clr enabled'' If "value_in_use" is a "1" and CLR is not required, this is a finding.'
  inputs: {}
  evidence: []
