assessment:
  id: ng.shared.3fda260a5a2cdaa46aef804d
  version: 1
  assessment_title: Directory Browsing on the IIS 10.0 website must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    get-directory-browsing-enabled-status-object:
      capability: windows.appcmdlistconfig
      select:
        identifier_type:
          operation: equals
          datatype: string
          mask: false
          value: Site
        identifier:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        section:
          operation: equals
          datatype: string
          mask: false
          value: directoryBrowse
        parameter:
          operation: equals
          datatype: string
          mask: false
          value: enabled
      object_title: Get Directory Browsing enabled status.
  states:
    state-appcmdlistconfig-result-must-equal-false:
      state_title: appcmdlistconfig result must equal False.
      capability: windows.appcmdlistconfig
      state:
        field: result
        value: 'false'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-web-site-directory-browsing-not-enabled:
      test_title: The web-site Directory Browsing must not be enabled
      capability: windows.appcmdlistconfig
      object: get-directory-browsing-enabled-status-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-appcmdlistconfig-result-must-equal-false
  evaluate:
    test: test-web-site-directory-browsing-not-enabled
