assessment:
  id: ng.shared.a511a884574aed96bc5caff3
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that /etc/pam.d/passwd implements /etc/pam.d/system-auth
    when changing passwords.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that /etc/pam.d/passwd is configured to use /etc/pam.d/system-auth when changing passwords: # cat /etc/pam.d/passwd
    | grep -i substack | grep -i system-auth password substack system-auth If no results are returned, the line is commented
    out, this is a finding.'
  inputs: {}
  evidence: []
