assessment:
  id: ng.shared.26eb55b728442283ee6634c1
  version: 1
  assessment_title: Windows PowerShell 2.0 must not be installed on Windows 2012/2012 R2.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Windows PowerShell 2.0 is not installed by default. Open "Windows PowerShell". Enter "Get-WindowsFeature -Name
    PowerShell-v2". If "Installed State" is "Installed", this is a finding. An Installed State of "Available" or "Removed"
    is not a finding.
  inputs: {}
  evidence: []
