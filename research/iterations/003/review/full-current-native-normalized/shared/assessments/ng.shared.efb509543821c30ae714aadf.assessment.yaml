assessment:
  id: ng.shared.efb509543821c30ae714aadf
  version: 1
  assessment_title: UBTU-22-232080 - Ubuntu 22.04 LTS must configure the directories used by the system journal to be owned
    by "root".
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    run-log-journal-directory-subdirectories-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          value: /run/log/journal
        filename:
          operation: equals
          datatype: string
          nil: true
          value: ''
      filters:
      - action: include
        state: state-unix-file
      behaviors:
        recurse_direction: down
        recurse_file_system: local
      object_title: /run/log/journal directory and subdirectories
    var-log-journal-directory-subdirectories-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          value: /var/log/journal
        filename:
          operation: equals
          datatype: string
          nil: true
          value: ''
      filters:
      - action: include
        state: state-unix-file
      behaviors:
        recurse_direction: down
        recurse_file_system: local
      object_title: /var/log/journal directory and subdirectories
  states:
    state-owned-by-root:
      state_title: owned by root
      capability: unix.file
      state:
        field: user_id
        value: '0'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
    state-unix-file:
      state_title: null
      capability: unix.file
      state:
        field: type
        value: directory
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-run-log-journal-subdirectories-thereof-owned-by-root:
      test_title: /run/log/journal, and subdirectories thereof, are owned by root
      capability: unix.file
      object: run-log-journal-directory-subdirectories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-owned-by-root
    test-var-log-journal-subdirectories-thereof-owned-by-root:
      test_title: /var/log/journal, and subdirectories thereof, are owned by root
      capability: unix.file
      object: var-log-journal-directory-subdirectories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-owned-by-root
  evaluate:
    all:
    - test: test-run-log-journal-subdirectories-thereof-owned-by-root
    - test: test-var-log-journal-subdirectories-thereof-owned-by-root
