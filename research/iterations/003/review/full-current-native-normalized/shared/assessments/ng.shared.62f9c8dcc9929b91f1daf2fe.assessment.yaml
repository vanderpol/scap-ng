assessment:
  id: ng.shared.62f9c8dcc9929b91f1daf2fe
  version: 1
  assessment_title: Duplicate UIDs must not exist for multiple non-organizational users.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    logins-d-collection:
      collection_title: logins -d
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: logins -d
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
  tests:
    test-duplicate-user-ids-uids-not-exist-users-within-organization:
      test_title: Duplicate User IDs (UIDs) must not exist for users within the organization.
      capability: independent.shellcommand
      collection: logins-d-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Nothing is returned and command exits with a status of 0
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: ''
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: none_exist
  evaluate:
    test: test-duplicate-user-ids-uids-not-exist-users-within-organization
