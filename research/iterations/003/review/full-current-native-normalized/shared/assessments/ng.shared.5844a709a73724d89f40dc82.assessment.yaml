assessment:
  id: ng.shared.5844a709a73724d89f40dc82
  version: 1
  assessment_title: CISC-ND-001260 - The Cisco router must be configured to generate audit records when successful/unsuccessful
    logon attempts occur.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    iosxe-global-collection:
      collection_title: null
      capability: iosxe.global
      select:
        global_command:
          operation: equals
          datatype: string
          mask: false
          value: login on-failure log
    iosxe-global-collection-2:
      collection_title: null
      capability: iosxe.global
      select:
        global_command:
          operation: equals
          datatype: string
          mask: false
          value: login on-success log
  tests:
    test-generate-audit-records-when-unsuccessful-logon-attempts-occur:
      test_title: generate audit records when unsuccessful logon attempts occur
      capability: iosxe.global
      collection: iosxe-global-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
    test-generate-audit-records-when-successful-logon-attempts-occur:
      test_title: generate audit records when successful logon attempts occur
      capability: iosxe.global
      collection: iosxe-global-collection-2
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    all:
    - test: test-generate-audit-records-when-unsuccessful-logon-attempts-occur
    - test: test-generate-audit-records-when-successful-logon-attempts-occur
