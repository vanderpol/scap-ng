assessment:
  id: ng.shared.c4c4b1595b26ec19cfc97175
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that all local interactive users have a home directory
    assigned and defined in the /etc/passwd file.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify local interactive users on the system have a home directory assigned and the directory exists. Check
    the home directory assignment for all local interactive non-privileged users on the system with the following command:
    # awk -F: ''($3>=1000)&&($7 !~ /nologin/){print $1, $3, $6}'' /etc/passwd smithj 1001 /home/smithj Note: This may miss
    interactive users that have been assigned a privileged UID. Evidence of interactive use may be obtained from a number
    of log files containing system logon information. Check that all referenced home directories exist with the following
    command: # pwck -r user ''smithj'': directory ''/home/smithj'' does not exist If any home directories referenced in "/etc/passwd"
    are returned as not defined, or if any interactive users do not have a home directory assigned, this is a finding.'
  inputs: {}
  evidence: []
