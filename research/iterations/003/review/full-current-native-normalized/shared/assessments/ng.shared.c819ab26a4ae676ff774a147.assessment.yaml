assessment:
  id: ng.shared.c819ab26a4ae676ff774a147
  version: 1
  assessment_title: Windows 2012/2012 R2 manually managed application account passwords must be changed at least annually
    or when a system administrator with knowledge of the password leaves the organization.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Determine if manually managed application/service accounts exist. If none exist, this is NA. If passwords for
    manually managed application/service accounts are not changed at least annually or when an administrator with knowledge
    of the password leaves the organization, this is a finding. Identify manually managed application/service accounts. To
    determine the date a password was last changed: Domain controllers: Open "Windows PowerShell". Enter "Get-ADUser -Identity
    [application account name] -Properties PasswordLastSet | FL Name, PasswordLastSet", where [application account name] is
    the name of the manually managed application/service account. If the "PasswordLastSet" date is more than one year old,
    this is a finding. Member servers and standalone systems: Open "Windows PowerShell" or "Command Prompt". Enter ''Net User
    [application account name] | Find /i "Password Last Set"'', where [application account name] is the name of the manually
    managed application/service account. If the "Password Last Set" date is more than one year old, this is a finding.'
  inputs: []
  evidence: []
