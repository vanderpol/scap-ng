  version: 1
  assessment_title: The macOS system must enforce smart card authentication.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to enforce multifactor authentication with the following command: /usr/bin/osascript
    -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.security.smartcard'')\ .objectForKey(''enforceSmartCard'').js
    EOS If the result is not "true", this is a finding.'
  inputs: []
  evidence: []
