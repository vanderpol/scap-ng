assessment:
  id: ng.shared.5936762349894dc8a66366d8
  version: 1
  assessment_title: The system must be configured to have password protection take effect within a limited time frame when
    the screen saver becomes active.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding: Registry
    Hive: HKEY_LOCAL_MACHINE Registry Path: \Software\Microsoft\Windows NT\CurrentVersion\Winlogon\ Value Name: ScreenSaverGracePeriod
    Value Type: REG_SZ Value: 5 (or less)'
  inputs: {}
  evidence: []
