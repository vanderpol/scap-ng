assessment:
  id: ng.shared.a0bd92a34196b132434f6dc3
  version: 1
  assessment_title: The system must be configured to audit Object Access - Removable Storage failures.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    secure-boot-state-setting-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Control\LSA
        name:
          operation: equals
          datatype: string
          mask: false
          value: SCENoApplyLegacyAuditPolicy
      object_title: Secure Boot State Setting
    retrieves-auditeventpolicysubcategories-object-object:
      capability: windows.auditeventpolicysubcategories
      object_title: Retrieves a auditeventpolicysubcategories_object.
  variables:
    this-variable-represents-regular-expression-audit-failure-success-failure-which-variable:
      title: This variable represents the regular expression 'AUDIT_(FAILURE|SUCCESS_FAILURE)' which matches FAILURE audit.
      kind: constant
      datatype: string
      expression:
        literal: AUDIT_(FAILURE|SUCCESS_FAILURE)
  states:
    state-value-equal-to-1:
      state_title: Value Equal To 1
      capability: windows.registry
      state:
        field: value
        value: '1'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-removable-storage-subcategory-must-be-failure:
      state_title: removable storage subcategory must be Failure.
      capability: windows.auditeventpolicysubcategories
      state:
        field: removable_storage
        value:
          variable: this-variable-represents-regular-expression-audit-failure-success-failure-which-variable
        operation: pattern match
        datatype: string
        mask: false
        variable_check: all
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-force-audit-policy-subcategory-settings-override-audit-policy-category:
      test_title: 'Audit: Force audit policy subcategory settings to override audit policy category settings must be set to
        Enabled'
      capability: windows.registry
      object: secure-boot-state-setting-object
      check_existence: at_least_one_exists
      check: only one
      states:
      - state-value-equal-to-1
    test-removable-storage-failure:
      test_title: Removable Storage - Failure
      capability: windows.auditeventpolicysubcategories
      object: retrieves-auditeventpolicysubcategories-object-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-removable-storage-subcategory-must-be-failure
  evaluate:
    all:
    - test: test-audit-force-audit-policy-subcategory-settings-override-audit-policy-category
    - test: test-removable-storage-failure
