assessment:
  id: ng.shared.13c61d56594092199c98179c
  version: 1
  assessment_title: FTP servers must be configured to prevent access to the system drive.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    get-website-bindings-filter-applied-ones-that-include-ftp-object:
      capability: windows.appcmd
      select:
        identifier_type:
          operation: equals
          datatype: string
          mask: false
          value: Site
        identifier:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        parameter:
          operation: equals
          datatype: string
          mask: false
          value: bindings
      filters:
      - action: include
        state: state-results-include-ftp
      object_title: Get Website Bindings with filter applied for ones that include FTP
    get-boot-drive-object:
      capability: independent.environmentvariable58
      select:
        pid:
          operation: equals
          datatype: int
          mask: false
          nil: true
          value: ''
        name:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEMDRIVE
      object_title: Get boot drive
    if-site-includes-root-drive-this-finding-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: update-variable
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: ''
      filters:
      - action: include
        state: state-boot-drive-with-forward-slash-added
      object_title: If the site includes root of the drive this is a finding.
    get-program-files-directory-object:
      capability: independent.environmentvariable58
      select:
        pid:
          operation: equals
          datatype: int
          mask: false
          nil: true
          value: ''
        name:
          operation: equals
          datatype: string
          mask: false
          value: PROGRAMFILES
      object_title: Get the Program Files Directory
    if-site-includes-program-files-this-finding-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: update-variable
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: ''
      filters:
      - action: include
        state: state-program-files
      object_title: If the site includes Program Files this is a finding.
    get-program-files-x86-directory-object:
      capability: independent.environmentvariable58
      select:
        pid:
          operation: equals
          datatype: int
          mask: false
          nil: true
          value: ''
        name:
          operation: equals
          datatype: string
          mask: false
          value: PROGRAMFILES(X86)
      object_title: Get the Program Files(x86) Directory
    if-site-includes-program-files-x86-this-finding-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: update-variable
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: ''
      filters:
      - action: include
        state: state-program-files-x86
      object_title: If the site includes Program Files(x86) this is a finding.
    get-windows-directory-object:
      capability: independent.environmentvariable58
      select:
        pid:
          operation: equals
          datatype: int
          mask: false
          nil: true
          value: ''
        name:
          operation: equals
          datatype: string
          mask: false
          value: WINDIR
      object_title: Get the Windows Directory
    if-site-includes-windows-directory-this-finding-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: update-variable
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: ''
      filters:
      - action: include
        state: state-windows-directory
      object_title: If the site includes Windows Directory this is a finding.
  variables:
    constant-value-variable:
      title: ''''
      kind: constant
      datatype: string
      expression:
        literal: Get-Website '
    constant-value-variable-2:
      title: ''''
      kind: constant
      datatype: string
      expression:
        literal: ''' | Select-Object -ExpandProperty physicalPath'
    update-variable:
      title: update
      kind: local
      datatype: string
      expression:
        concat:
        - variable: constant-value-variable
        - values:
            object: get-website-bindings-filter-applied-ones-that-include-ftp-object
            field: identifier
        - variable: constant-value-variable-2
    forward-slash-variable:
      title: Forward Slash
      kind: constant
      datatype: string
      expression:
        literal: \
    boot-drive-forward-slash-added-variable:
      title: Boot Drive with Forward Slash Added
      kind: local
      datatype: string
      expression:
        concat:
        - values:
            object: get-boot-drive-object
            field: value
        - variable: forward-slash-variable
    program-files-variable:
      title: Program Files
      kind: local
      datatype: string
      expression:
        values:
          object: get-program-files-directory-object
          field: value
    program-files-x86-variable:
      title: Program Files(x86)
      kind: local
      datatype: string
      expression:
        values:
          object: get-program-files-x86-directory-object
          field: value
    windows-directory-variable:
      title: Windows Directory
      kind: local
      datatype: string
      expression:
        values:
          object: get-windows-directory-object
          field: value
  states:
    state-results-include-ftp:
      state_title: results include FTP
      capability: windows.appcmd
      state:
        field: result
        value: ftp
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-boot-drive-with-forward-slash-added:
      state_title: Boot Drive with Forward Slash Added
      capability: independent.shellcommand
      state:
        field: stdout_line
        value:
          variable: boot-drive-forward-slash-added-variable
        operation: case insensitive equals
        datatype: string
        mask: false
        variable_check: all
        entity_check: all
        entity_existence: at_least_one_exists
    state-program-files:
      state_title: Program Files
      capability: independent.shellcommand
      state:
        field: stdout_line
        value:
          variable: program-files-variable
        operation: case insensitive equals
        datatype: string
        mask: false
        variable_check: all
        entity_check: all
        entity_existence: at_least_one_exists
    state-program-files-x86:
      state_title: Program Files(x86)
      capability: independent.shellcommand
      state:
        field: stdout_line
        value:
          variable: program-files-x86-variable
        operation: case insensitive equals
        datatype: string
        mask: false
        variable_check: all
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-directory:
      state_title: Windows Directory
      capability: independent.shellcommand
      state:
        field: stdout_line
        value:
          variable: windows-directory-variable
        operation: case insensitive equals
        datatype: string
        mask: false
        variable_check: all
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-if-site-includes-root-drive-this-finding:
      test_title: If the site includes root of the drive this is a finding.
      capability: independent.shellcommand
      object: if-site-includes-root-drive-this-finding-object
      check_existence: none_exist
      check: all
    test-if-site-includes-program-files-this-finding:
      test_title: If the site includes Program Files this is a finding.
      capability: independent.shellcommand
      object: if-site-includes-program-files-this-finding-object
      check_existence: none_exist
      check: all
    test-if-site-includes-program-files-x86-this-finding:
      test_title: If the site includes Program Files(x86) this is a finding.
      capability: independent.shellcommand
      object: if-site-includes-program-files-x86-this-finding-object
      check_existence: none_exist
      check: all
    test-if-site-includes-windows-directory-this-finding:
      test_title: If the site includes Windows Directory this is a finding.
      capability: independent.shellcommand
      object: if-site-includes-windows-directory-this-finding-object
      check_existence: none_exist
      check: all
  evaluate:
    all:
    - test: test-if-site-includes-root-drive-this-finding
    - test: test-if-site-includes-program-files-this-finding
    - test: test-if-site-includes-program-files-x86-this-finding
    - test: test-if-site-includes-windows-directory-this-finding
