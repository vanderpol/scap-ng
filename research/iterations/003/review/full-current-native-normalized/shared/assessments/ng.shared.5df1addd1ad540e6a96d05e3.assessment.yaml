assessment:
  id: ng.shared.5df1addd1ad540e6a96d05e3
  version: 1
  assessment_title: WN10-CC-000305 - Indexing of encrypted files must be turned off.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows\Windows Search
        name:
          operation: equals
          datatype: string
          mask: false
          value: AllowIndexingEncryptedStoresOrItems
  tests:
    test-allow-indexing-encrypted-files-set-disabled:
      test_title: '''Allow indexing of encrypted files'' is set to ''Disabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-allow-indexing-encrypted-files-set-disabled
