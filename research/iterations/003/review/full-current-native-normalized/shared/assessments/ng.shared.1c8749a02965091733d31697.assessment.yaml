assessment:
  id: ng.shared.1c8749a02965091733d31697
  version: 1
  assessment_title: The macOS system must be configured to disable prompts to configure ScreenTime.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-skip-screen-time-prompt-enable-recommended-object-collection:
      collection_title: os_skip_screen_time_prompt_enable_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.SetupAssistant.managed'')\

            .objectForKey(''SkipScreenTime'').js

            EOS'
  tests:
    test-os-skip-screen-time-prompt-enable-recommended-test:
      test_title: os_skip_screen_time_prompt_enable_recommended_test
      capability: independent.shellcommand
      collection: os-skip-screen-time-prompt-enable-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: os_skip_screen_time_prompt_enable_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: 'true'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-os-skip-screen-time-prompt-enable-recommended-test
