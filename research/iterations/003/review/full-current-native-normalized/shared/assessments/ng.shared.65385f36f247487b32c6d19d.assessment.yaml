assessment:
  id: ng.shared.65385f36f247487b32c6d19d
  version: 1
  assessment_title: UAC - All Admin Approval Mode
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Microsoft\Windows\CurrentVersion\Policies\System
        name:
          operation: equals
          datatype: string
          mask: false
          value: EnableLUA
  variables:
    run-all-administrators-in-admin-approval-mode-variable:
      title: Run all administrators in Admin Approval Mode
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: run_administrators_admin_approval_mode_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-user-account-control-run-all-administrators-in-admin-approval-mode:
      test_title: '''User Account Control: Run all administrators in Admin Approval Mode'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: run-all-administrators-in-admin-approval-mode-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-user-account-control-run-all-administrators-in-admin-approval-mode
