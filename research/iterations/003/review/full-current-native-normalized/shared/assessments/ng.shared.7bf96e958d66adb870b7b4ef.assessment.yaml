assessment:
  id: ng.shared.7bf96e958d66adb870b7b4ef
  version: 1
  assessment_title: UAC - UIAccess Secure Desktop
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Microsoft\Windows\CurrentVersion\Policies\System
        name:
          operation: equals
          datatype: string
          mask: false
          value: EnableUIADesktopToggle
  tests:
    test-user-account-control-allow-uiaccess-applications-prompt-elevation-without-using:
      test_title: '''User Account Control: Allow UIAccess applications to prompt for elevation without using the secure desktop''
        is set to ''Disabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals 0
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-user-account-control-allow-uiaccess-applications-prompt-elevation-without-using
