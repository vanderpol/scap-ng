assessment:
  id: ng.shared.e42a86f12c095e471ff38231
  version: 1
  assessment_title: Windows 10 must be configured to audit file system successes.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that Audit File System auditing has been enabled: Computer Configuration >> Windows Settings >> Security
    Settings >> Advanced Audit Policy Configuration >> System Audit Policies >> Object Access >> Audit File System. If "Audit
    File System" is not set to "Success", this is a finding.'
  inputs: []
  evidence: []
