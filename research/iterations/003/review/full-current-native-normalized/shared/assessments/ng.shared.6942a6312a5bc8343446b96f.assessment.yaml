assessment:
  id: ng.shared.6942a6312a5bc8343446b96f
  version: 1
  assessment_title: The FTP service must display the DOD-approved system use notification message or banner before granting
    access to the system.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Determine if the FTP server package is installed: # pkg list service/network/ftp If the package is not installed,
    this check does not apply. # grep DisplayConnect /etc/proftpd.conf If: DisplayConnect /etc/issue does not appear, this
    is a finding. If /etc/issue does not contain the approved DOD text, this is a finding.'
  inputs: []
  evidence: []
