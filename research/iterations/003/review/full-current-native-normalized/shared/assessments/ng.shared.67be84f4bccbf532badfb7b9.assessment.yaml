assessment:
  id: ng.shared.67be84f4bccbf532badfb7b9
  version: 1
  assessment_title: The macOS system must enable System Integrity Protection.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-sip-enable-recommended-object-collection:
      collection_title: os_sip_enable_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/csrutil status | /usr/bin/grep ''System Integrity Protection status: enabled.'''
  tests:
    test-os-sip-enable-recommended-test:
      test_title: os_sip_enable_recommended_test
      capability: independent.shellcommand
      collection: os-sip-enable-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: os_sip_enable_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: .*
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-os-sip-enable-recommended-test
