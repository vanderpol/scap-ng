  version: 1
  assessment_title: The auditing system must not define a different auditing level for specific users.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This check applies to the global zone only. Determine the zone that you are currently securing. # zonename If
    the command output is "global", this check applies. For each user on the system (not including root), check to see if
    special auditing flag configurations are set. # userattr audit_flags [username] If any flags are returned, this is a finding.'
  inputs: {}
  evidence: []
