assessment:
  id: ng.shared.d2d77d86d00949b274853d31
  version: 1
  assessment_title: WN10-CC-000310 - Users must be prevented from changing installation options.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows\Installer
        name:
          operation: equals
          datatype: string
          mask: false
          value: EnableUserControl
  tests:
    test-allow-user-control-over-installs-set-disabled:
      test_title: '''Allow user control over installs'' is set to ''Disabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-allow-user-control-over-installs-set-disabled
