assessment:
  id: ng.shared.bfbdb9ae103c3a0830151b2a
  version: 1
  assessment_title: The Oracle Linux operating system must not forward IPv6 source-routed packets.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If IPv6 is not enabled, the key will not exist, and this is Not Applicable. Verify the system does not accept
    IPv6 source-routed packets. # grep -r net.ipv6.conf.all.accept_source_route /run/sysctl.d/* /etc/sysctl.d/* /usr/local/lib/sysctl.d/*
    /usr/lib/sysctl.d/* /lib/sysctl.d/* /etc/sysctl.conf 2> /dev/null net.ipv6.conf.all.accept_source_route = 0 If "net.ipv6.conf.all.accept_source_route"
    is not configured in the /etc/sysctl.conf file or in any of the other sysctl.d directories, is commented out or does not
    have a value of "0", this is a finding. Check that the operating system implements the accept source route variable with
    the following command: # /sbin/sysctl -a | grep net.ipv6.conf.all.accept_source_route net.ipv6.conf.all.accept_source_route
    = 0 If the returned lines do not have a value of "0", this is a finding. If conflicting results are returned, this is
    a finding.'
  inputs: {}
  evidence: []
