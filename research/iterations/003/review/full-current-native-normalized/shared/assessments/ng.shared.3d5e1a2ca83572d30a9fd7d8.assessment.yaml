assessment:
  id: ng.shared.3d5e1a2ca83572d30a9fd7d8
  version: 1
  assessment_title: TS/RDS - Prevent Password Saving
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services
        name:
          operation: equals
          datatype: string
          mask: false
          value: DisablePasswordSaving
  variables:
    do-not-allow-passwords-saved-variable:
      title: Do not allow passwords to be saved
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: do_not_allow_passwords_to_be_saved_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-do-not-allow-passwords-saved-set-enabled:
      test_title: '''Do not allow passwords to be saved'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: do-not-allow-passwords-saved-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-do-not-allow-passwords-saved-set-enabled
