assessment:
  id: ng.shared.6d11a5c0704d8954962c7818
  version: 1
  assessment_title: The number of allowed bad logon attempts must meet minimum requirements.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy
    -> Computer Configuration -> Windows Settings -> Security Settings -> Account Policies -> Account Lockout Policy. If the
    "Account lockout threshold" is "0" or more than "3" attempts, this is a finding.
  inputs: {}
  evidence: []
