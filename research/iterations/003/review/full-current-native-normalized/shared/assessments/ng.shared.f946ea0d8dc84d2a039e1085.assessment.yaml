assessment:
  id: ng.shared.f946ea0d8dc84d2a039e1085
  version: 1
  assessment_title: The macOS system must configure SSHD channel timeout to 900.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-sshd-channel-timeout-configure-stig-object-collection:
      collection_title: os_sshd_channel_timeout_configure_stig_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/sbin/sshd -G | /usr/bin/awk '/channeltimeout/{print $2}'
  tests:
    test-os-sshd-channel-timeout-configure-stig-test:
      test_title: os_sshd_channel_timeout_configure_stig_test
      capability: independent.shellcommand
      collection: os-sshd-channel-timeout-configure-stig-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: os_sshd_channel_timeout_configure_stig_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: session:*=900
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-os-sshd-channel-timeout-configure-stig-test
