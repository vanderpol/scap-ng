assessment:
  id: ng.shared.3bedbaf91c0b7f812471b061
  version: 1
  assessment_title: The system must require users to re-authenticate to unlock a graphical desktop environment.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    gdm-graphical-login-collection:
      collection_title: The gdm graphical-login.
      capability: solaris.smf
      select:
        fmri:
          operation: equals
          datatype: string
          mask: false
          value: svc://localhost/application/graphical-login/gdm:default
    xdm-graphical-login-collection:
      collection_title: The xdm graphical-login.
      capability: solaris.smf
      select:
        fmri:
          operation: equals
          datatype: string
          mask: false
          value: svc://localhost/application/graphical-login/xdm:default
    timeout-field-in-xscreensaver-collection:
      collection_title: timeout field in XScreenSaver.
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /usr/share/X11/app-defaults/XScreenSaver
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*\*timeout:\s*(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    locktimeout-field-in-xscreensaver-collection:
      collection_title: lockTimeout field in XScreenSaver.
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /usr/share/X11/app-defaults/XScreenSaver
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*\*lockTimeout:\s*(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    lock-field-in-xscreensaver-collection:
      collection_title: lock field in XScreenSaver.
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /usr/share/X11/app-defaults/XScreenSaver
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*\*lock:\s*(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    all-users-collection:
      collection_title: All users
      capability: unix.password
      select:
        username:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[^-+].*$
    home-directories-all-user-accounts-collection:
      collection_title: The home directories of all user accounts.
      capability: unix.password
      set:
        operator: union
        members:
        - collection: all-users-collection
        filters:
        - action: exclude
          match:
            field: user_id
            value: '100'
            operation: less than
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: System accounts.
          capability: unix.password
        - action: exclude
          match:
            field: user_id
            value: '60001'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: System account.
          capability: unix.password
        - action: exclude
          match:
            field: user_id
            value: '60002'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: System account.
          capability: unix.password
        - action: exclude
          match:
            field: user_id
            value: '65534'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: System account.
          capability: unix.password
    lock-field-in-xscreensaver-collection-2:
      collection_title: lock field in .xscreensaver.
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: home-directories-all-user-accounts-variable
        filename:
          operation: equals
          datatype: string
          mask: false
          value: .xscreensaver
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*lock:\s*(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    locktimeout-field-in-xscreensaver-collection-2:
      collection_title: lockTimeout field in .xscreensaver.
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: home-directories-all-user-accounts-variable
        filename:
          operation: equals
          datatype: string
          mask: false
          value: .xscreensaver
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*lockTimeout:\s*(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    timeout-field-in-xscreensaver-collection-2:
      collection_title: timeout field in .xscreensaver.
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: home-directories-all-user-accounts-variable
        filename:
          operation: equals
          datatype: string
          mask: false
          value: .xscreensaver
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*timeout:\s*(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  variables:
    home-directories-all-user-accounts-variable:
      title: The home directories of all user accounts.
      kind: local
      datatype: string
      expression:
        values:
          collection: home-directories-all-user-accounts-collection
          field: home_dir
  tests:
    test-check-see-if-xwindows-being-run-by-system-using-cdm:
      test_title: Check to see if XWindows is being run by the system, using CDM.
      capability: solaris.smf
      collection: gdm-graphical-login-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: gdm graphical-login is online.
        state_capability: solaris.smf
        state:
          field: service_state
          value: ONLINE
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-check-see-if-xwindows-being-run-by-system-using-xdm:
      test_title: Check to see if XWindows is being run by the system, using XDM.
      capability: solaris.smf
      collection: xdm-graphical-login-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: gdm graphical-login is online.
        state_capability: solaris.smf
        state:
          field: service_state
          value: ONLINE
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-xscreensaver-have-timeout-15-minutes:
      test_title: XScreenSaver must have a timeout of 15 minutes.
      capability: independent.textfilecontent54
      collection: timeout-field-in-xscreensaver-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: XScreenSaver 15 min or less timeout.
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: (?:0:15:00|0:1[0-4]:[0-5][0-9]|0:0[0-9]:[0-5][0-9])
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-xscreensaver-have-locktimeout-0-00-05:
      test_title: XScreenSaver must have a lockTimeout of 0:00:05.
      capability: independent.textfilecontent54
      collection: locktimeout-field-in-xscreensaver-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: XScreenSaver 0:00:05 or less lockTimeout.
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: 0:00:0[0-5]
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-xscreensaver-have-lock-field-set-true:
      test_title: XScreenSaver must have a lock field set to true.
      capability: independent.textfilecontent54
      collection: lock-field-in-xscreensaver-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: XScreenSaver true lock setting.
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: 'True'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-each-user-s-xscreensaver-have-lock-field-set-true:
      test_title: Each user's .xscreensaver must have a lock field set to true.
      capability: independent.textfilecontent54
      collection: lock-field-in-xscreensaver-collection-2
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: .xscreensaver true lock setting.
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: 'True'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-each-user-s-xscreensaver-have-locktimeout-5-seconds:
      test_title: Each user's .xscreensaver must have a lockTimeout of 5 seconds.
      capability: independent.textfilecontent54
      collection: locktimeout-field-in-xscreensaver-collection-2
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: .xscreensaver 5 second or less lockTimeout.
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: 0:00:0[0-5]
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-xscreensaver-have-timeout-15-minutes-2:
      test_title: XScreenSaver must have a timeout of 15 minutes.
      capability: independent.textfilecontent54
      collection: timeout-field-in-xscreensaver-collection-2
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: .xscreensaver 15 min or less timeout.
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: (?:0:15:00|0:1[0-4]:[0-5][0-9]|0:0[0-9]:[0-5][0-9])
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    any:
    - not:
        any:
        - test: test-check-see-if-xwindows-being-run-by-system-using-cdm
        - test: test-check-see-if-xwindows-being-run-by-system-using-xdm
    - all:
      - test: test-xscreensaver-have-timeout-15-minutes
      - test: test-xscreensaver-have-locktimeout-0-00-05
      - test: test-xscreensaver-have-lock-field-set-true
      - test: test-each-user-s-xscreensaver-have-lock-field-set-true
      - test: test-each-user-s-xscreensaver-have-locktimeout-5-seconds
      - test: test-xscreensaver-have-timeout-15-minutes-2
