assessment:
  id: ng.shared.15b530f688a0217c04ed15d1
  version: 1
  assessment_title: Windows Update Device Drive Searching
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows\DriverSearching
        name:
          operation: equals
          datatype: string
          mask: false
          value: DontSearchWindowsUpdate
  variables:
    turn-off-windows-update-device-driver-searching-variable:
      title: Turn off Windows Update device driver searching
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: turn_off_windows_update_device_driver_searching_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-turn-off-windows-update-device-driver-searching-set-enabled:
      test_title: '''Turn off Windows Update device driver searching'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: turn-off-windows-update-device-driver-searching-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-turn-off-windows-update-device-driver-searching-set-enabled
