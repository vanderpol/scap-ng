assessment:
  id: ng.shared.18ebeeb7e9fc533d80084fd9
  version: 1
  assessment_title: TCP Connection Keep-Alive Time
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Services\Tcpip\Parameters
        name:
          operation: equals
          datatype: string
          mask: false
          value: KeepAliveTime
  variables:
    mss-keepalivetime-how-often-keep-alive-packets-sent-in-milliseconds-variable:
      title: 'MSS: (KeepAliveTime)How often keep-alive packets are sent in milliseconds'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: keep_alive_time_var
        validation:
          alternatives:
          - literal: '300000'
            hint: 300000_seconds
  tests:
    test-mss-keepalivetime-how-often-keep-alive-packets-sent-in-milliseconds:
      test_title: '''MSS: (KeepAliveTime) How often keep-alive packets are sent in milliseconds'' is set to ''300000 or 5
        minutes (recommended)'' or less'
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: mss-keepalivetime-how-often-keep-alive-packets-sent-in-milliseconds-variable
            operation: less than or equal
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-mss-keepalivetime-how-often-keep-alive-packets-sent-in-milliseconds
