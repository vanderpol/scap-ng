assessment:
  id: ng.shared.e1e71e9a8cc286b9368dcb15
  version: 1
  assessment_title: The Ubuntu Operating system must disable the x86 Ctrl-Alt-Delete key sequence.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    systemctl-status-ctrl-alt-del-target-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: systemctl status ctrl-alt-del.target
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: 'Loaded:'
      object_title: systemctl status ctrl-alt-del.target
  states:
    state-if-the-ctrl-alt-del-target-is-not-masked-this-is-a-findi:
      state_title: If the ctrl-alt-del.target is not masked, this is a finding.
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: ': masked'
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-verify-operating-system-not-configured-reboot-system-when-ctrl-alt:
      test_title: Verify the operating system is not configured to reboot the system when Ctrl-Alt-Delete is pressed.
      capability: independent.shellcommand
      object: systemctl-status-ctrl-alt-del-target-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-if-the-ctrl-alt-del-target-is-not-masked-this-is-a-findi
  evaluate:
    test: test-verify-operating-system-not-configured-reboot-system-when-ctrl-alt
