assessment:
  id: ng.shared.63af1e8404d1ac45762367e5
  version: 1
  assessment_title: RHEL 8 must implement non-executable data to protect its memory from unauthorized code execution.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the NX (no-execution) bit flag is set on the system. Check that the no-execution bit flag is set with
    the following commands: $ sudo dmesg | grep NX [ 0.000000] NX (Execute Disable) protection: active If "dmesg" does not
    show "NX (Execute Disable) protection" active, check the cpuinfo settings with the following command: $ sudo less /proc/cpuinfo
    | grep -i flags flags : fpu vme de pse tsc ms nx rdtscp lm constant_tsc If "flags" does not contain the "nx" flag, this
    is a finding.'
  inputs: []
  evidence: []
