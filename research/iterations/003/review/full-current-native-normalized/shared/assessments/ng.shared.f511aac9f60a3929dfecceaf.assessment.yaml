assessment:
  id: ng.shared.f511aac9f60a3929dfecceaf
  version: 1
  assessment_title: Force Logoff When Logon Hours Expire
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    lockout-policy-collection:
      collection_title: Lockout policy
      capability: windows.lockoutpolicy
  variables:
    network-security-force-logoff-when-logon-hours-expire-variable:
      title: 'Network security: Force logoff when logon hours expire'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: force_logoff_when_logon_hours_expire_var
        validation:
          alternatives:
          - literal: '0'
            hint: enabled
          - literal: '1'
            hint: disabled
  tests:
    test-network-security-force-logoff-when-logon-hours-expire-set-enabled:
      test_title: '''Network security: Force logoff when logon hours expire'' is set to ''Enabled'''
      capability: windows.lockoutpolicy
      collection: lockout-policy-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Force Logoff equals variable
        state_capability: windows.lockoutpolicy
        state:
          field: force_logoff
          value:
            variable: network-security-force-logoff-when-logon-hours-expire-variable
          operation: equals
          datatype: int
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-network-security-force-logoff-when-logon-hours-expire-set-enabled
