assessment:
  id: ng.shared.7e37f38fdea02b93827db00e
  version: 1
  assessment_title: The macOS system must be configured to use an authorized time server.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    system-settings-time-server-configure-stig-object-collection:
      collection_title: system_settings_time_server_configure_stig_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.MCX'')\

            .objectForKey(''timeServer'').js

            EOS'
  tests:
    test-system-settings-time-server-configure-stig-test:
      test_title: system_settings_time_server_configure_stig_test
      capability: independent.shellcommand
      collection: system-settings-time-server-configure-stig-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: system_settings_time_server_configure_stig_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: time.nist.gov
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-system-settings-time-server-configure-stig-test
