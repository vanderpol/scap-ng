assessment:
  id: ng.shared.269f618cb285f50935f6e062
  version: 1
  assessment_title: WN10-SO-000180 - NTLM must be prevented from falling back to a Null session.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Control\LSA\MSV1_0
        name:
          operation: equals
          datatype: string
          mask: false
          value: allownullsessionfallback
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-network-security-allow-localsystem-null-session-fallback-set-disabled:
      test_title: '''Network security: Allow LocalSystem NULL session fallback'' is set to ''Disabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-network-security-allow-localsystem-null-session-fallback-set-disabled
