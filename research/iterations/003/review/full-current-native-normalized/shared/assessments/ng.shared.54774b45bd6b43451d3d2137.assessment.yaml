assessment:
  id: ng.shared.54774b45bd6b43451d3d2137
  version: 1
  assessment_title: OL08-00-040160 - All OL 8 networked systems must have and implement SSH to protect the confidentiality
    and integrity of transmitted and received information, as well as information during preparation for transmission.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-rpminfo-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          value: openssh-server
      object_title: null
    unix-process58-object:
      capability: unix.process58
      select:
        command_line:
          operation: pattern match
          datatype: string
          value: ^/usr/sbin/sshd\b
        pid:
          operation: greater than
          datatype: int
          value: '1'
      object_title: null
  states: {}
  tests:
    test-openssh-server-package-installed:
      test_title: The openssh-server package is installed
      capability: linux.rpminfo
      object: linux-rpminfo-object
      check_existence: at_least_one_exists
      check: all
    test-ssh-daemon-running:
      test_title: The ssh daemon is running.
      capability: unix.process58
      object: unix-process58-object
      check_existence: all_exist
      check: all
  evaluate:
    all:
    - test: test-openssh-server-package-installed
    - test: test-ssh-daemon-running
