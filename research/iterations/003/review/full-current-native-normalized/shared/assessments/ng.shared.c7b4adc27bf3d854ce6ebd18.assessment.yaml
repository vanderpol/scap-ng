assessment:
  id: ng.shared.c7b4adc27bf3d854ce6ebd18
  version: 1
  assessment_title: WN12-CC-000139
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit
        name:
          operation: pattern match
          datatype: string
          mask: false
          value: ProcessCreationIncludeCmdLine_Enabled
    windows-registry-collection-2:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Microsoft\Windows NT\CurrentVersion
        name:
          operation: equals
          datatype: string
          mask: false
          value: CurrentVersion
  tests:
    test-include-command-line-in-process-creation-events-set-enabled:
      test_title: '''Include command line in process creation events'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: REG_DWORD type and value equals 1
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-os-version-equal-6-2-windows-server-2012:
      test_title: The OS Version is equal to 6.2 (Windows Server 2012)
      capability: windows.registry
      collection: windows-registry-collection-2
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Sz type and value is equal to 6.2
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_sz
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '6.2'
            operation: equals
            datatype: version
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    any:
    - test: test-include-command-line-in-process-creation-events-set-enabled
    - test: test-os-version-equal-6-2-windows-server-2012
