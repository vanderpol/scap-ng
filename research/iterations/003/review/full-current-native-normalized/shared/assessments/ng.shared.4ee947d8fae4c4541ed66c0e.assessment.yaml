assessment:
  id: ng.shared.4ee947d8fae4c4541ed66c0e
  version: 1
  assessment_title: AZLX-23-002520 - Amazon Linux 2023 must allocate an audit_backlog_limit of sufficient size to capture
    processes that start prior to the audit daemon.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /boot/loader/entries
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^.*\.conf$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^options\s+.*\baudit_backlog_limit=(\d+)\b
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-boot-loader-specification-options-have-audit-backlog-limit-set-8192:
      test_title: The Boot Loader Specification options have audit_backlog_limit set to 8192 or greater.
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: '8192'
          operation: greater than or equal
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-boot-loader-specification-options-have-audit-backlog-limit-set-8192
