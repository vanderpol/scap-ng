assessment:
  id: ng.shared.f38d61434321ec0b085e0fdb
  version: 1
  assessment_title: The macOS system must enforce screen saver timeout.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to initiate the screen saver timeout after 15 minutes of inactivity with
    the following command: /usr/bin/osascript -l JavaScript << EOS function run() { let timeout = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName(''com.apple.screensaver'')\
    .objectForKey(''idleTime'')) if ( timeout <= 900 ) { return("true") } else { return("false") } } EOS If the result is
    not "true", this is a finding.'
  inputs: {}
  evidence: []
