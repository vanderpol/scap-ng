assessment:
  id: ng.shared.9c1fd0eec8218947c16b377d
  version: 1
  assessment_title: The macOS system must enforce time synchronization.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    system-settings-time-server-enforce-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: zsh
        command:
          operation: equals
          datatype: string
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.timed'')\

            .objectForKey(''TMAutomaticTimeOnlyEnabled'').js

            EOS'
      object_title: system_settings_time_server_enforce_recommended_object
  states:
    state-system-settings-time-server-enforce-recommended-state:
      state_title: system_settings_time_server_enforce_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: 'true'
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-settings-time-server-enforce-recommended-test:
      test_title: system_settings_time_server_enforce_recommended_test
      capability: independent.shellcommand
      object: system-settings-time-server-enforce-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-system-settings-time-server-enforce-recommended-state
  evaluate:
    test: test-system-settings-time-server-enforce-recommended-test
