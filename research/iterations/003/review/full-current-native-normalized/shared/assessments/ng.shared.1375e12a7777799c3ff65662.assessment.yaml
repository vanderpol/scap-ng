assessment:
  id: ng.shared.1375e12a7777799c3ff65662
  version: 1
  assessment_title: Windows Server 2019 Load and unload device drivers user right must only be assigned to the Administrators
    group.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy
    >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment. If any
    accounts or groups other than the following are granted the "Load and unload device drivers" user right, this is a finding:
    - Administrators For server core installations, run the following command: Secedit /Export /Areas User_Rights /cfg c:\path\filename.txt
    Review the text file. If any SIDs other than the following are granted the "SeLoadDriverPrivilege" user right, this is
    a finding: S-1-5-32-544 (Administrators)'
  inputs: {}
  evidence: []
