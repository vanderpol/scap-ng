assessment:
  id: ng.shared.eb9cc27018ed6c405f8950d4
  version: 1
  assessment_title: WN19-DC-000250 - Windows Server 2019 must be configured to audit DS Access - Directory Service Access
    failures.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-auditeventpolicysubcategories-collection:
      collection_title: null
      capability: windows.auditeventpolicysubcategories
  tests:
    test-audit-directory-service-access-failure:
      test_title: Audit - Directory Service Access - Failure
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: Audit - Directory Service Access - Failure only
          capability: windows.auditeventpolicysubcategories
          state:
            field: directory_service_access
            value: AUDIT_FAILURE
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: Audit - Directory Service Access - Success and Failure
          capability: windows.auditeventpolicysubcategories
          state:
            field: directory_service_access
            value: AUDIT_SUCCESS_FAILURE
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-audit-directory-service-access-failure
