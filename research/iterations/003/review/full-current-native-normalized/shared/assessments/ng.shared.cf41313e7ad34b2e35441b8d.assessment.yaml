assessment:
  id: ng.shared.cf41313e7ad34b2e35441b8d
  version: 1
  assessment_title: Windows 2016 systems must have Unified Extensible Firmware Interface (UEFI) firmware and be configured
    to run in UEFI mode, not Legacy BIOS.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Some older systems may not have UEFI firmware. This is currently a CAT III; it will be raised in severity at
    a future date when broad support of Windows hardware and firmware requirements are expected to be met. Devices that have
    UEFI firmware must run in "UEFI" mode. Verify the system firmware is configured to run in "UEFI" mode, not "Legacy BIOS".
    Run "System Information". Under "System Summary", if "BIOS Mode" does not display "UEFI", this is a finding.
  inputs: []
  evidence: []
