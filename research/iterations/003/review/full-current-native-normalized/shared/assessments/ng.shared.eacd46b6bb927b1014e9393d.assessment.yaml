assessment:
  id: ng.shared.eacd46b6bb927b1014e9393d
  version: 1
  assessment_title: The macOS system must be configured with audit log files set to mode 440 or less permissive.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    audit-files-mode-configure-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/bin/ls -l $(/usr/bin/grep ''^dir'' /etc/security/audit_control|/usr/bin/awk -F: ''{print $2}'')|/usr/bin/awk
            ''!/-r--r-----|current|total/{print $1}'''
      object_title: audit_files_mode_configure_recommended_object
  states:
    state-audit-files-mode-configure-recommended-state:
      state_title: audit_files_mode_configure_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: ''
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: none_exist
  tests:
    test-audit-files-mode-configure-recommended-test:
      test_title: audit_files_mode_configure_recommended_test
      capability: independent.shellcommand
      object: audit-files-mode-configure-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-audit-files-mode-configure-recommended-state
  evaluate:
    test: test-audit-files-mode-configure-recommended-test
