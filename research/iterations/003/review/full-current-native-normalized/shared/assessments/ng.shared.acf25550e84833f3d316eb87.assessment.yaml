assessment:
  id: ng.shared.acf25550e84833f3d316eb87
  version: 1
  assessment_title: AZLX-23-001185 - Amazon Linux 2023 must implement SSH to protect the confidentiality and integrity of
    transmitted and received information, as well as information during preparation for transmission.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    sshd-service-activestate-object:
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          value: sshd.service
        property:
          operation: equals
          datatype: string
          value: ActiveState
      object_title: sshd.service ActiveState
  states:
    state-linux-systemdunitproperty:
      state_title: null
      capability: linux.systemdunitproperty
      state:
        field: value
        value: active
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-check-if-ssh-in-active-state:
      test_title: Check if SSH is in 'active' state
      capability: linux.systemdunitproperty
      object: sshd-service-activestate-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-linux-systemdunitproperty
  evaluate:
    test: test-check-if-ssh-in-active-state
