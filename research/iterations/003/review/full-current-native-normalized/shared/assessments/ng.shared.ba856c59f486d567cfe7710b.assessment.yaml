assessment:
  id: ng.shared.ba856c59f486d567cfe7710b
  version: 1
  assessment_title: The Active Directory Infrastructure object must be configured with proper audit settings.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    query-both-fail-success-auditing-settings-infrastructure-organizational-unit-ou-collection:
      collection_title: Query both Fail and Success auditing settings for Infrastructure Organizational Unit (OU)
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: '$path = ''AD:\CN=Infrastructure,'' + (Get-ADDomain).DistinguishedName; $aud = (Get-Acl $path -Audit).Audit;
            $hasFail = [bool]($aud | Where-Object {$_.IdentityReference -match ''Everyone|S-1-1-0'' -and $_.AuditFlags -eq
            ''Failure'' -and ($_.ActiveDirectoryRights -match ''GenericAll|FullControl|All'')}); $hasSucc = [bool]($aud |
            Where-Object {$_.IdentityReference -match ''Everyone|S-1-1-0'' -and $_.AuditFlags -eq ''Success'' -and ($_.ActiveDirectoryRights
            -match ''ExtendedRight|WriteProperty'')}); . { if (-not $hasFail -or -not $hasSucc) { $reasons = @(); if (-not
            $hasFail) { $reasons += ''MISSING: Everyone -> Failure -> GenericAll/FullControl audit policy'' }; if (-not $hasSucc)
            { $reasons += ''MISSING: Everyone -> Success -> ExtendedRight/WriteProperty audit policy'' }; [PSCustomObject]@{
            Target_Object = $path.Replace(''AD:\'',''''); IdentityReference = ''Everyone (S-1-1-0)''; Status = ''FAIL''; Details
            = ($reasons -join '' | '') } } else { [PSCustomObject]@{ Target_Object = $path.Replace(''AD:\'',''''); IdentityReference
            = ''Everyone (S-1-1-0)''; Status = ''PASS''; Details = ''All mandatory Failure and Success audit policies are
            correctly configured per the STIG.'' } } } | Format-Table -AutoSize | Out-String -Width 4096'
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: .+
      behaviors:
        error_if_stderr_exists: 'true'
  tests:
    test-windows-server-active-directory-infrastructure-object-configured-proper-audit-settings:
      test_title: Windows Server Active Directory Infrastructure object must be configured with proper audit settings.
      capability: independent.shellcommand
      collection: query-both-fail-success-auditing-settings-infrastructure-organizational-unit-ou-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: No lines shall exist listed with status of 'FAIL'
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: ' FAIL '
          operation: pattern match
          datatype: string
          mask: false
          entity_check: none satisfy
          entity_existence: at_least_one_exists
  evaluate:
    test: test-windows-server-active-directory-infrastructure-object-configured-proper-audit-settings
