assessment:
  id: ng.shared.c4bcef4893c96179e0811d7e
  version: 1
  assessment_title: WN10-SO-000167 - Remote calls to the Security Account Manager (SAM) must be restricted to Administrators.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Control\Lsa
        name:
          operation: equals
          datatype: string
          mask: false
          value: RestrictRemoteSAM
  tests:
    test-allow-administrators-group-make-remote-calls-sam:
      test_title: Allow Administrators group to make remote calls to SAM
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Sz type and value equals O:BAG:BAD:(A;;RC;;;BA)
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_sz
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: O:BAG:BAD:(A;;RC;;;BA)
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-allow-administrators-group-make-remote-calls-sam
