assessment:
  id: ng.shared.0cd605329fc40672f37ceb8c
  version: 1
  assessment_title: UBTU-22-255055 - Ubuntu 22.04 LTS must configure the SSH daemon to use Message Authentication Codes (MACs)
    employing FIPS 140-3-approved cryptographic hashes to prevent the unauthorized disclosure of information and/or detect
    changes to information during transmission.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*MACs\s+(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-etc-ssh-sshd-config-macs-use-fips-140-3-validated:
      test_title: '/etc/ssh/sshd_config: MACs use FIPS 140-3 validated cryptographic hash algorithms'
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: null
          capability: independent.textfilecontent54
          state:
            field: subexpression
            value: hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: independent.textfilecontent54
          state:
            field: subexpression
            value: '"hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256"'
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-etc-ssh-sshd-config-macs-use-fips-140-3-validated
