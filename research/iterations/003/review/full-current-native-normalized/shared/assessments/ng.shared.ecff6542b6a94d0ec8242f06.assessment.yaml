assessment:
  id: ng.shared.ecff6542b6a94d0ec8242f06
  version: 1
  assessment_title: The macOS system must configure Apple System Log (ASL) files owned by root and group to wheel.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured with ASL files owned by root and group to wheel with the following command:
    /usr/bin/stat -f ''%Su:%Sg:%N'' $(/usr/bin/grep -e ''^>'' /etc/asl.conf /etc/asl/* | /usr/bin/awk ''{ print $2 }'') 2>
    /dev/null | /usr/bin/awk ''!/^root:wheel:/{print $1}'' | /usr/bin/wc -l | /usr/bin/tr -d '' '' If the result is not "0",
    this is a finding.'
  inputs: []
  evidence: []
