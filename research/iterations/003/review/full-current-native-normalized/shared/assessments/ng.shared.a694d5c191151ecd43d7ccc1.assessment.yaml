assessment:
  id: ng.shared.a694d5c191151ecd43d7ccc1
  version: 1
  assessment_title: Access to Non-Standard extended stored procedures must be disabled or restricted, unless specifically
    required and approved.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-sqlext-object:
      capability: independent.sqlext
      select:
        engine:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: microsoft-sql-server-dbms-variable
        version:
          operation: pattern match
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: microsoft-sql-server-version-2016-2022-variable
        instance:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        database:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
        sql:
          operation: equals
          datatype: string
          mask: false
          value: "\nDECLARE @xplist AS TABLE\n(\n       xp_name sysname,\n       source_dll nvarchar(255)\n)\nINSERT INTO\
            \ @xplist\nEXEC sp_helpextendedproc\n\nSELECT X.xp_name, X.source_dll, O.is_ms_shipped FROM @xplist X JOIN sys.all_objects\
            \ O ON X.xp_name = O.name WHERE O.is_ms_shipped = 0 ORDER BY X.xp_name"
      behaviors:
        context: instance
      object_title: null
  variables:
    microsoft-sql-server-dbms-variable:
      title: Microsoft SQL Server DBMS
      kind: constant
      datatype: string
      expression:
        literal: sqlserver
    microsoft-sql-server-version-2016-2022-variable:
      title: Microsoft SQL Server version 2016-2022
      kind: constant
      datatype: string
      expression:
        literal: 2016|2017|2019|2022
  states: {}
  tests:
    test-if-any-records-returned-review-system-documentation-determine-whether-use:
      test_title: If any records are returned, review the system documentation to determine whether the use of Non-Standard
        extended stored procedures are required and approved.
      capability: independent.sqlext
      object: independent-sqlext-object
      check_existence: none_exist
      check: all
  evaluate:
    test: test-if-any-records-returned-review-system-documentation-determine-whether-use
