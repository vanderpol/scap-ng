assessment:
  id: ng.shared.44beedc85c7b010131a0794b
  version: 1
  assessment_title: The macOS system must configure audit_control to not contain access control lists.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    audit-control-acls-configure-recommended-object-collection:
      collection_title: audit_control_acls_configure_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /bin/ls -le /etc/security/audit_control | /usr/bin/awk '{print $1}' | /usr/bin/grep ":"
  tests:
    test-audit-control-acls-configure-recommended-test:
      test_title: audit_control_acls_configure_recommended_test
      capability: independent.shellcommand
      collection: audit-control-acls-configure-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: audit_control_acls_configure_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: ''
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: none_exist
  evaluate:
    test: test-audit-control-acls-configure-recommended-test
