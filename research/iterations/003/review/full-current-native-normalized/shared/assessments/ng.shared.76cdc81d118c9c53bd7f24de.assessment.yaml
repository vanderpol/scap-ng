assessment:
  id: ng.shared.76cdc81d118c9c53bd7f24de
  version: 1
  assessment_title: The centralized process core dump data directory must have mode 0700 or less permissive.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Check the defined directory for process core dumps. # coreadm | grep "global core file pattern" Check the permissions
    of the directory. # ls -lLd [core file directory] If the directory has a mode more permissive than 0700 (rwx --- ---),
    this is a finding.'
  inputs: []
  evidence: []
