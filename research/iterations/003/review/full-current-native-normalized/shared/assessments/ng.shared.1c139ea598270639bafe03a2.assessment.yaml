assessment:
  id: ng.shared.1c139ea598270639bafe03a2
  version: 1
  assessment_title: OL09-00-002531 - OL 9 /boot/grub2/grub.cfg file must be owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    unix-file-collection:
      collection_title: null
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /boot/grub2/grub.cfg
  tests:
    test-boot-grub2-grub-cfg-file-owned-by-root:
      test_title: /boot/grub2/grub.cfg file is owned by root
      capability: unix.file
      collection: unix-file-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: owned by root
        state_capability: unix.file
        state:
          field: user_id
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-boot-grub2-grub-cfg-file-owned-by-root
