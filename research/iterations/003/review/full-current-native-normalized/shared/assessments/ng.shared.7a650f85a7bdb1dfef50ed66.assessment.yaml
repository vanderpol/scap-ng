assessment:
  id: ng.shared.7a650f85a7bdb1dfef50ed66
  version: 1
  assessment_title: The Oracle Linux operating system must have cron logging implemented.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that "rsyslog" is configured to log cron events. Check the configuration of "/etc/rsyslog.conf" or "/etc/rsyslog.d/*.conf"
    files for the cron facility with the following command: Note: If another logging package is used, substitute the utility
    configuration file for "/etc/rsyslog.conf" or "/etc/rsyslog.d/*.conf" files. # grep cron /etc/rsyslog.conf /etc/rsyslog.d/*.conf
    cron.* /var/log/cron If the command does not return a response, check for cron logging all facilities by inspecting the
    "/etc/rsyslog.conf" or "/etc/rsyslog.d/*.conf" files. Look for the following entry: *.* /var/log/messages If "rsyslog"
    is not logging messages for the cron facility or all facilities, this is a finding.'
  inputs: {}
  evidence: []
