assessment:
  id: ng.shared.37b0a4abd1400e010478f25c
  version: 1
  assessment_title: The Ubuntu operating system must, for networked systems, compare internal information system clocks at
    least every 24 hours with a server which is synchronized to one of the redundant United States Naval Observatory (USNO)
    time servers, or a time server designated for the appropriate DoD network (NIPRNet/SIPRNet), and/or the Global Positioning
    System (GPS).
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-networked-systems-etc-crony-conf-configure-maxpoll-less-than-collection:
      collection_title: 'Linux must, for networked systems:  /etc/crony.conf  configure maxpoll less than  17.'
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/chrony.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*server\s+\S+\s+iburst\s+maxpoll\s+(\d+)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'false'
        multiline: 'true'
        singleline: 'false'
    linux-networked-systems-etc-chrony-conf-authoratative-time-servers-configured-collection:
      collection_title: 'Linux must, for networked systems: /etc/chrony.conf - Authoratative time servers must be configured:(
        tick.usno.navy.mil or tock.usno.navy.mil or ntp2.usno.navy.mil) or a time server designated for the appropriate DOD
        network (NIPRNet/SIPRNet),'
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/chrony.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*server\s+(\S+)\s+iburst\s+maxpoll\s+\d+
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      behaviors:
        ignore_case: 'false'
        multiline: 'true'
        singleline: 'false'
    linux-networked-systems-etc-crony-sources-or-conf-configure-maxpoll-collection:
      collection_title: 'Linux must, for networked systems: /etc/crony/*(.sources or .conf) configure maxpoll less than 17.'
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/chrony
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .*\.(sources|conf)
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*server\s+\S+\s+iburst\s+maxpoll\s+(\d+)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    linux-networked-systems-etc-chrony-sources-or-conf-authoratative-time-collection:
      collection_title: 'Linux must, for networked systems: /etc/chrony/*(.sources or .conf) - Authoratative time servers
        must be configured:( tick.usno.navy.mil or tock.usno.navy.mil or ntp2.usno.navy.mil) or a time server designated for
        the appropriate DOD network (NIPRNet/SIPRNet), and/or the Global Positioning System (GPS).'
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/chrony
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .*\.(sources|conf)
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*server\s+(\S+)\s+iburst\s+maxpoll\s+\d+
        instance:
