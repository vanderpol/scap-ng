assessment:
  id: ng.shared.cc4cfeda088c6233fe67754d
  version: 1
  assessment_title: WN10-CC-000030 - The system must be configured to prevent Internet Control Message Protocol (ICMP) redirects
    from overriding Open Shortest Path First (OSPF) generated routes.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Services\Tcpip\Parameters
        name:
          operation: equals
          datatype: string
          mask: false
          value: EnableICMPRedirect
  tests:
    test-mss-enableicmpredirect-allow-icmp-redirects-override-ospf-generated-routes-set:
      test_title: '''MSS: (EnableICMPRedirect) Allow ICMP redirects to override OSPF generated routes'' is set to ''Disabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-mss-enableicmpredirect-allow-icmp-redirects-override-ospf-generated-routes-set
