assessment:
  id: ng.shared.a17025680c1a1710169efe79
  version: 1
  assessment_title: The macOS system must disable dictation.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-dictation-disable-recommended-object-collection:
      collection_title: os_dictation_disable_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\

            .objectForKey(''allowDictation'').js

            EOS'
  tests:
    test-os-dictation-disable-recommended-test:
      test_title: os_dictation_disable_recommended_test
      capability: independent.shellcommand
      collection: os-dictation-disable-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: os_dictation_disable_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: 'false'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-os-dictation-disable-recommended-test
