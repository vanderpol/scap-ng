assessment:
  id: ng.shared.490b446789e35aacad1aa555
  version: 1
  assessment_title: The Create global objects user right must only be assigned to Administrators, Service, Local Service,
    and Network Service.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy
    >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment. If any
    accounts or groups other than the following are granted the "Create global objects" user right, this is a finding: Administrators
    Service Local Service Network Service If an application requires this user right, this would not be a finding. Vendor
    documentation must support the requirement for having the user right. The requirement must be documented with the ISSO.
    The application account must meet requirements for application account passwords, such as length (WN12-00-000010) and
    required frequency of changes (WN12-00-000011).'
  inputs: {}
  evidence: []
