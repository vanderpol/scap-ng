assessment:
  id: ng.shared.c8ea2413fa4eaed3cc775275
  version: 1
  assessment_title: Windows v1803 or Later
  mode: automated
  class: inventory
  purpose: applicability
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SOFTWARE\Microsoft\Windows NT\CurrentVersion
        name:
          operation: equals
          datatype: string
          value: ReleaseId
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_sz
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1809'
          operation: greater than or equal
          datatype: version
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-windows-system-v1809-or-later:
      test_title: Windows system is v1809 or later
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-windows-system-v1809-or-later
