assessment:
  id: ng.shared.497e24325a881ee47b487cd7
  version: 1
  assessment_title: WN10-SO-000195 - The system must be configured to prevent the storage of the LAN Manager hash of passwords.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    check-contents-hklm-system-currentcontrolset-control-lsa-nolmhash-collection:
      collection_title: Check the contents of HKLM\System\CurrentControlSet\Control\Lsa\NoLMHash
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Control\Lsa
        name:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: NoLMHash
  tests:
    test-network-security-do-not-store-lan-manager-hash-value-on:
      test_title: '''Network security: Do not store LAN Manager hash value on next password change'' is set to ''Enabled'''
      capability: windows.registry
      collection: check-contents-hklm-system-currentcontrolset-control-lsa-nolmhash-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-network-security-do-not-store-lan-manager-hash-value-on
