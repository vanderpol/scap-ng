assessment:
  id: ng.shared.2d0b38a715e95de9808a1405
  version: 1
  assessment_title: WN19-UR-000090 - Windows Server 2019 Create symbolic links user right must only be assigned to the Administrators
    group.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-userright-collection:
      collection_title: null
      capability: windows.userright
      select:
        userright:
          operation: equals
          datatype: string
          mask: false
          value: SE_CREATE_SYMBOLIC_LINK_NAME
    windows-wmi57-collection:
      collection_title: null
      capability: windows.wmi57
      select:
        namespace:
          operation: equals
          datatype: string
          mask: false
          value: root\cimv2
        wql:
          operation: equals
          datatype: string
          mask: false
          value: SELECT ID FROM Win32_ServerFeature
  tests:
    test-create-symbolic-links-administrators:
      test_title: Create symbolic links - Administrators
      capability: windows.userright
      collection: windows-userright-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: null
          capability: windows.userright
          state:
            field: trustee_name
            value: ''
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: windows.userright
          state:
            field: trustee_name
            value: Administrators
            operation: case insensitive equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-create-symbolic-links-administrators-virtual-machines:
      test_title: Create symbolic links - Administrators, Virtual Machines
      capability: windows.userright
      collection: windows-userright-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: null
          capability: windows.userright
          state:
            field: trustee_name
            value: ''
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: windows.userright
          state:
            field: trustee_name
            value: Administrators
            operation: case insensitive equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: windows.userright
          state:
            field: trustee_name
            value: ^(?i)(NT VIRTUAL MACHINE\\)?Virtual Machines$
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-hyper-v-role-installed:
      test_title: Hyper-V Role is installed
      capability: windows.wmi57
      collection: windows-wmi57-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state: null
  evaluate:
    any:
    - test: test-create-symbolic-links-administrators
    - all:
      - test: test-create-symbolic-links-administrators-virtual-machines
      - test: test-hyper-v-role-installed
