assessment:
  id: ng.shared.95cd12c0625a97f256b84777
  version: 1
  assessment_title: The macOS system must disable iCloud Document synchronization.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    icloud-drive-disable-recommended-object-collection:
      collection_title: icloud_drive_disable_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\

            .objectForKey(''allowCloudDocumentSync'').js

            EOS'
  tests:
    test-icloud-drive-disable-recommended-test:
      test_title: icloud_drive_disable_recommended_test
      capability: independent.shellcommand
      collection: icloud-drive-disable-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: icloud_drive_disable_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: 'false'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-icloud-drive-disable-recommended-test
