assessment:
  id: ng.shared.80593bbd42a06bad612f46b2
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that all files and directories contained in local
    interactive user home directories have a mode of 0750 or less permissive.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    retrieve-home-directories-from-etc-passwd-file-interactive-users-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: 'ls -d $(awk -F: ''($3>=1000)&&($7 !~ /nologin/){print $6}'' /etc/passwd) 2>1'
      object_title: Retrieve home directories from the /etc/passwd file for interactive users.
    retrieve-noncompliant-files-from-user-home-directories-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: retreive-location-user-home-directories-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
      filters:
      - action: exclude
        state: state-filter-exclude-files-that-have-gexec-oread-owrite-and-oe
      - action: exclude
        state: state-filter-exclude-files-starting-with
      behaviors:
        recurse: directories
        recurse_file_system: local
        max_depth: '-1'
        recurse_direction: down
      object_title: Retrieve noncompliant files from user home directories.
  variables:
    retreive-location-user-home-directories-variable:
      title: Retreive location of user home directories.
      kind: local
      datatype: string
      expression:
        values:
          object: retrieve-home-directories-from-etc-passwd-file-interactive-users-object
          field: stdout_line
  states:
    state-filter-exclude-files-that-have-gexec-oread-owrite-and-oe:
      state_title: Filter exclude files that have gexec, oread, owrite, and oexec set to zero/false.
      capability: unix.file
      state:
        all:
        - field: gexec
          value: '0'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: oread
          value: '0'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: owrite
          value: '0'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: oexec
          value: '0'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    state-filter-exclude-files-starting-with:
      state_title: Filter exclude files starting with '.'.
      capability: unix.file
      state:
        field: filename
        value: ^\.
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-confirm-permissions-on-files-in-interactive-user-s-home-directories:
      test_title: Confirm permissions on files in interactive user's home directories are 0750 or less permissive.
      capability: unix.file
      object: retrieve-noncompliant-files-from-user-home-directories-object
      check_existence: none_exist
      check: all
  evaluate:
    test: test-confirm-permissions-on-files-in-interactive-user-s-home-directories
