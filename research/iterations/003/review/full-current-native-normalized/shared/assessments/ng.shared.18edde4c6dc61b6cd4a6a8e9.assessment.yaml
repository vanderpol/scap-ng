assessment:
  id: ng.shared.18edde4c6dc61b6cd4a6a8e9
  version: 1
  assessment_title: OL 8 must clear the page allocator to prevent use-after-free attacks.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    retrieve-grub-environment-list-collection:
      collection_title: Retrieve grub environment list.
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: grub2-editenv list | grep kernelopts=
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: page_poison=\d
    retrieve-grub-default-configuration-collection:
      collection_title: Retrieve grub default configuration.
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/default/grub
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\n*[\s#]*GRUB_CMDLINE_LINUX=(.*)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-check-that-grub-2-configured-enable-page-poisoning-mitigate-use:
      test_title: Check that GRUB 2 is configured to enable page poisoning to mitigate use-after-free vulnerabilities.
      capability: independent.shellcommand
      collection: retrieve-grub-environment-list-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Confirm correct page_poison setting.
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: ^kernelopts=[^#]*page_poison=1\s*
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-check-that-page-poisoning-enabled-by-default-persist-in-kernel:
      test_title: Check that page poisoning is enabled by default to persist in kernel updates.
      capability: independent.textfilecontent54
      collection: retrieve-grub-default-configuration-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Confirm correct page_poison setting.
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: page_poison=1\b
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-check-that-grub-2-configured-enable-page-poisoning-mitigate-use
    - test: test-check-that-page-poisoning-enabled-by-default-persist-in-kernel
