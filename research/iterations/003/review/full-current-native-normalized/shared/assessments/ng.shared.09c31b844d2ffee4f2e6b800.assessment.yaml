assessment:
  id: ng.shared.09c31b844d2ffee4f2e6b800
  version: 1
  assessment_title: The macOS system must disable AppleID and Internet Account modifications.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable account modification with the following command: /usr/bin/osascript
    -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\ .objectForKey(''allowAccountModification'').js
    EOS If the result is not "false", this is a finding.'
  inputs: []
  evidence: []
