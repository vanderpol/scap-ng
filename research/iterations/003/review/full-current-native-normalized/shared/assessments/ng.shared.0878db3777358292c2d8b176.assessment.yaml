assessment:
  id: ng.shared.0878db3777358292c2d8b176
  version: 1
  assessment_title: Format and Eject Removable Media
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: Software\Microsoft\Windows NT\CurrentVersion\Winlogon
        name:
          operation: equals
          datatype: string
          value: AllocateDASD
      object_title: null
  variables:
    devices-allow-only-administrators-format-eject-removable-media-variable:
      title: 'Devices: Allow only administrators to format and eject removable media'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: allow_format_eject_removable_media_var
        validation:
          alternatives:
          - literal: '0'
            hint: administrator_only
          - literal: '1'
            hint: administrator_and_powerusers_only
          - literal: '2'
            hint: administrator_and_interactiveuser_only
  states:
    state-reg-sz-type-and-value-is-less-than-or-equal-to-variable:
      state_title: Reg_Sz type and value is less than or equal to variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_sz
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: devices-allow-only-administrators-format-eject-removable-media-variable
          operation: less than or equal
          datatype: int
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-devices-allowed-format-eject-removable-media-set-administrators:
      test_title: '''Devices: Allowed to Format and Eject Removable Media'' is set to ''Administrators'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-sz-type-and-value-is-less-than-or-equal-to-variable
  evaluate:
    test: test-devices-allowed-format-eject-removable-media-set-administrators
