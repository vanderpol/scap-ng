assessment:
  id: ng.shared.a61501fe54811dc047eb0f6d
  version: 1
  assessment_title: Prevent device metadata retrieval from Internet
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SOFTWARE\Policies\Microsoft\Windows\Device Metadata
        name:
          operation: equals
          datatype: string
          value: PreventDeviceMetadataFromNetwork
      object_title: null
  variables:
    prevent-device-metadata-retrieval-from-internet-variable:
      title: Prevent device metadata retrieval from the Internet
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: prevent_device_metadata_retrieval_from_the_internet_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: prevent-device-metadata-retrieval-from-internet-variable
          operation: equals
          datatype: int
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-prevent-device-metadata-retrieval-from-internet-set-enabled:
      test_title: '''Prevent device metadata retrieval from the Internet'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-prevent-device-metadata-retrieval-from-internet-set-enabled
