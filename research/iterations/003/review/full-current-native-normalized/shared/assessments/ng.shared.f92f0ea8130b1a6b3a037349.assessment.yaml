  assessment_title: Run control scripts lists of preloaded libraries must contain only authorized paths.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify run control scripts'' library preload list. Procedure: # find /etc/rc* /etc/init.d -type f -print | xargs
    grep LD_PRELOAD This variable is formatted as a colon-separated list of paths. If there is an empty entry, such as a leading
    or trailing colon, or two consecutive colons, this is a finding. If an entry begins with a character other than a slash
    (/), or has not been documented with the ISSO, this is a finding.'
