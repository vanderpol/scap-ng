assessment:
  id: ng.shared.223d21a8733007c403e233e6
  version: 1
  assessment_title: The Manage auditing and security log user right must only be assigned to the Administrators group.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy
    >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment. If any
    groups or accounts other than the following are granted the "Manage auditing and security log" user right, this is a finding:
    Administrators If the organization has an "Auditors" group the assignment of this group to the user right would not be
    a finding.'
  inputs: []
  evidence: []
