assessment:
  id: ng.shared.c0b46f33bf7fd6e41611a5e2
  version: 1
  assessment_title: The operating system must prevent a user from overriding the screensaver idle-activation-enabled setting
    for the graphical user interface.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-rpminfo-object:
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: dconf
      object_title: null
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/dconf/db/
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[0-9].*$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\[org/gnome/desktop/screensaver\]([^\n]*\n+)+?idle-activation-enabled\s*=\s*(?:true|false)\s*$
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
      behaviors:
        multiline: 'true'
        max_depth: '1'
        recurse_direction: down
      object_title: null
    idle-activation-enabled-locks-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: lock-paths-databases-that-have-idle-activation-enabled-settings-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^.*$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^/org/gnome/desktop/screensaver/idle-activation-enabled\s*$
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
      behaviors:
        multiline: 'true'
        max_depth: '1'
        recurse_direction: down
      object_title: idle-activation-enabled locks
    idle-activation-enabled-entries-that-not-locked-object:
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - object: independent-textfilecontent54-object
        filters:
        - action: exclude
          state: state-match-paths-for-databases-that-have-idle-activation-enab
      object_title: idle-activation-enabled entries that are not locked
  variables:
    lock-paths-databases-that-have-idle-activation-enabled-settings-variable:
      title: lock paths for databases that have idle-activation-enabled settings
      kind: local
      datatype: string
      expression:
        concat:
        - values:
            object: independent-textfilecontent54-object
            field: path
        - literal:
            value: /locks
            datatype: string
    paths-databases-that-have-idle-activation-enabled-locked-variable:
      title: paths for databases that have idle-activation-enabled locked
      kind: local
      datatype: string
      expression:
        regex_capture:
          value:
            values:
              object: idle-activation-enabled-locks-object
              field: path
          pattern: ^(.*)/locks$
  states:
    state-match-paths-for-databases-that-have-idle-activation-enab:
      state_title: match paths for databases that have idle-activation-enabled locked
      capability: independent.textfilecontent54
      state:
        field: path
        value:
          variable: paths-databases-that-have-idle-activation-enabled-locked-variable
        operation: equals
        datatype: string
        mask: false
        variable_check: at least one
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-package-dconf-installed:
      test_title: package dconf is installed
      capability: linux.rpminfo
      object: linux-rpminfo-object
      check_existence: all_exist
      check: all
    test-idle-activation-enabled-configuration-present:
      test_title: idle-activation-enabled configuration is present
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
    test-idle-activation-enabled-lock-exists:
      test_title: idle-activation-enabled lock exists
      capability: independent.textfilecontent54
      object: idle-activation-enabled-locks-object
      check_existence: at_least_one_exists
      check: all
    test-all-idle-activation-enabled-entries-locked:
      test_title: all idle-activation-enabled entries are locked
      capability: independent.textfilecontent54
      object: idle-activation-enabled-entries-that-not-locked-object
      check_existence: none_exist
      check: all
  evaluate:
    any:
    - not:
        test: test-package-dconf-installed
    - all:
      - test: test-idle-activation-enabled-configuration-present
      - test: test-idle-activation-enabled-lock-exists
      - test: test-all-idle-activation-enabled-entries-locked
