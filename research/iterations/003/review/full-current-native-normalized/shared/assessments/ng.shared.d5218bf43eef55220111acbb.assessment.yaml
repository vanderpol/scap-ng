assessment:
  id: ng.shared.d5218bf43eef55220111acbb
  version: 1
  assessment_title: IPv6 TCP Data Retransmissions
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: System\CurrentControlSet\Services\Tcpip6\Parameters
        name:
          operation: equals
          datatype: string
          value: TcpMaxDataRetransmissions
      object_title: null
  variables:
    mss-tcpmaxdataretransmissions-ipv6-how-many-times-unacknowledged-data-retransmitted-3-variable:
      title: 'MSS: (TcpMaxDataRetransmissions IPv6) How many times unacknowledged data is retransmitted (3 recommended, 5
        is default)'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: MSS_tcp_max_data_retransmissions_ipv6_var
        validation:
          alternatives:
          - literal: '3'
            hint: value_of_3
          - literal: '5'
            hint: value_of_5
  states:
    state-reg-dword-type-and-value-is-less-than-or-equal-to-variab:
      state_title: Reg_Dword type and value is less than or equal to variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: mss-tcpmaxdataretransmissions-ipv6-how-many-times-unacknowledged-data-retransmitted-3-variable
          operation: less than or equal
          datatype: int
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-mss-tcpmaxdataretransmissions-ipv6-how-many-times-unacknowledged-data-retransmitted-3:
      test_title: '''MSS: (TcpMaxDataRetransmissions IPv6) How many times unacknowledged data is retransmitted (3 recommended,
        5 is the default)'' is set to ''3'' or less'
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-is-less-than-or-equal-to-variab
  evaluate:
    test: test-mss-tcpmaxdataretransmissions-ipv6-how-many-times-unacknowledged-data-retransmitted-3
