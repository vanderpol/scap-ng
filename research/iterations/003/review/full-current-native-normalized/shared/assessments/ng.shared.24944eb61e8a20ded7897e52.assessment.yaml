assessment:
  id: ng.shared.24944eb61e8a20ded7897e52
  version: 1
  assessment_title: The macOS system must disable Apple ID setup during Setup Assistant.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable Apple ID setup during Setup Assistant with the following command:
    /usr/bin/osascript -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.SetupAssistant.managed'')\
    .objectForKey(''SkipCloudSetup'').js EOS If the result is not "true", this is a finding.'
  inputs: {}
  evidence: []
