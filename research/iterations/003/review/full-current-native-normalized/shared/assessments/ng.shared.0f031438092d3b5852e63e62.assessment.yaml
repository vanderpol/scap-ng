assessment:
  id: ng.shared.0f031438092d3b5852e63e62
  version: 1
  assessment_title: World-writable files must not exist.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    files-that-world-writable-collection:
      collection_title: Files that are world-writable
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: 'find / \( -fstype nfs -o -fstype cachefs -o -fstype autofs \

            -o -fstype ctfs -o -fstype mntfs -o -fstype objfs \

            -o -fstype proc \) -prune -o -type f -perm -0002 -print'
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
  tests:
    test-files-that-world-writable-should-not-exist:
      test_title: Files that are world-writable should not exist
      capability: independent.shellcommand
      collection: files-that-world-writable-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: No stdout_line data should exist
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: ''
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: none_exist
  evaluate:
    test: test-files-that-world-writable-should-not-exist
