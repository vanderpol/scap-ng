assessment:
  id: ng.shared.f44f8d21f61905649190fe9a
  version: 1
  assessment_title: Address Space Layout Randomization (ASLR) must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    sxadm-status-p-o-status-aslr-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: sxadm status -p -o status aslr
        pattern:
          operation: pattern match
          datatype: string
          value: .*
      object_title: sxadm status -p -o status aslr
  states:
    state-must-include-enabled:
      state_title: must include 'enabled'
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: enabled
          operation: pattern match
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-address-space-layout-randomization-aslr-enabled:
      test_title: Address Space Layout Randomization (ASLR) must be enabled.
      capability: independent.shellcommand
      object: sxadm-status-p-o-status-aslr-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-must-include-enabled
  evaluate:
    test: test-address-space-layout-randomization-aslr-enabled
