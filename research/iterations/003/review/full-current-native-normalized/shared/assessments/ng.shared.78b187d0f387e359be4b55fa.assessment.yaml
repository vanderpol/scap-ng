assessment:
  id: ng.shared.78b187d0f387e359be4b55fa
  version: 1
  assessment_title: WN10-SO-000185 - PKU2U authentication using online identities must be prevented.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    check-registry-value-at-hkey-local-machine-system-currentcontrolset-control-collection:
      collection_title: Check the registry value at HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\LSA\pku2u\AllowOnlineID
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Control\LSA\pku2u
        name:
          operation: equals
          datatype: string
          mask: false
          value: AllowOnlineID
  tests:
    test-network-security-allow-pku2u-authentication-requests-this-computer-use-online:
      test_title: '''Network Security: Allow PKU2U authentication requests to this computer to use online identities'' is
        set to ''Disabled'''
      capability: windows.registry
      collection: check-registry-value-at-hkey-local-machine-system-currentcontrolset-control-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-network-security-allow-pku2u-authentication-requests-this-computer-use-online
