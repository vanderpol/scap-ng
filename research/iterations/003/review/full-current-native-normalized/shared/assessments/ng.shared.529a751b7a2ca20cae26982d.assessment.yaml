assessment:
  id: ng.shared.529a751b7a2ca20cae26982d
  version: 1
  assessment_title: SQL Server must limit privileges to change software modules, to include stored procedures, functions,
    and triggers, and links to software external to SQL Server.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Obtain a listing of schema ownership from the server documentation. Execute the following query to obtain a current
    listing of schema ownership. SELECT s.name AS schema_name, p.name AS owning_principal FROM sys.schemas s JOIN sys.database_principals
    p ON s.principal_id = p.principal_id WHERE p.name != 'dbo' AND (s.name != p.name or p.name not in ( 'db_accessadmin' ,
    'db_backupoperator' , 'db_datareader' , 'db_datawriter' , 'db_ddladmin' , 'db_denydatareader' , 'db_denydatawriter' ,
    'db_owner' , 'db_securityadmin' , 'guest' , 'INFORMATION_SCHEMA' , 'sys' , 'TargetServersRole' , 'SQLAgentUserRole' ,
    'SQLAgentReaderRole' , 'SQLAgentOperatorRole' , 'DatabaseMailUserRole' , 'db_ssisadmin' , 'db_ssisltduser' , 'db_ssisoperator'
    , 'replmonitor' , '##MS_SSISServerCleanupJobLogin##' ) ) ORDER BY schema_name If any schema is owned by an unauthorized
    database principal, this is a finding.
  inputs: {}
  evidence: []
