assessment:
  id: ng.shared.36818d766db6ebd7776f72a5
  version: 1
  assessment_title: Windows Server 2016 built-in guest account must be renamed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy
    >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> Security Options. If the value
    for "Accounts: Rename guest account" is not set to a value other than "Guest", this is a finding. For server core installations,
    run the following command: Secedit /Export /Areas SecurityPolicy /CFG C:\Path\FileName.Txt If "NewGuestName" is not something
    other than "Guest" in the file, this is a finding.'
  inputs: []
  evidence: []
