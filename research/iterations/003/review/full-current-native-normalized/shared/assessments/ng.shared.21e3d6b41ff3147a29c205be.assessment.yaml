assessment:
  id: ng.shared.21e3d6b41ff3147a29c205be
  version: 1
  assessment_title: All run control scripts must have mode 0755 or less permissive.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    etc-rc-etc-init-d-directories-collection-2:
      collection_title: The /etc/rc* and /etc/init.d directories.
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: run-control-scripts-dir-paths-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
    etc-rc-etc-init-d-directories-collection:
      collection_title: The /etc/rc* and /etc/init.d directories.
      capability: unix.file
      set:
        operator: union
        members:
        - collection: etc-rc-etc-init-d-directories-collection-2
        filters:
        - action: exclude
          match:
            field: type
            value: symbolic link
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: symbolic link
          capability: unix.file
    lib-svc-method-directory-collection:
      collection_title: The /lib/svc/method directory.
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /lib/svc/method
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
    etc-rc-etc-init-d-directories-collection-3:
      collection_title: The /etc/rc* and /etc/init.d directories.
      capability: unix.file
      set:
        operator: union
        members:
        - collection: lib-svc-method-directory-collection
        filters:
        - action: exclude
          match:
            field: type
            value: symbolic link
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: symbolic link
          capability: unix.file
  variables:
    run-control-scripts-dir-paths-variable:
      title: Run control scripts' dir paths.
      kind: constant
      datatype: string
      expression:
        literal:
        - /etc/init.d
        - /etc/rc0.d
        - /etc/rc1.d
        - /etc/rc2.d
        - /etc/rc3.d
        - /etc/rcS.d
        - /etc/rcm
  tests:
    test-all-files-under-etc-rc-etc-init-d-directories-have:
      test_title: All files under /etc/rc* and /etc/init.d directories must have file permissions of 0755 or less.
      capability: unix.file
      collection: etc-rc-etc-init-d-directories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: 0755 permissions or less permissive.
        state_capability: unix.file
        state:
          all:
          - field: suid
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: sgid
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: sticky
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: gwrite
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: owrite
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-all-files-under-lib-svc-method-directory-have-file-permissions:
      test_title: All files under the /lib/svc/method directory must have file permissions of 0755 or less.
      capability: unix.file
      collection: etc-rc-etc-init-d-directories-collection-3
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: 0755 permissions or less permissive.
        state_capability: unix.file
        state:
          all:
          - field: suid
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: sgid
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: sticky
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: gwrite
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: owrite
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-all-files-under-etc-rc-etc-init-d-directories-have
    - test: test-all-files-under-lib-svc-method-directory-have-file-permissions
