assessment:
  id: ng.shared.e83d6cd72593f7a5e1d90678
  version: 1
  assessment_title: Device Install Software Request Error Report
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: Software\Policies\Microsoft\Windows\DeviceInstall\Settings
        name:
          operation: equals
          datatype: string
          value: DisableSendRequestAdditionalSoftwareToWER
      object_title: null
  states:
    state-reg-dword-type-and-value-equals-1:
      state_title: Reg_Dword type and value equals 1
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-prevent-windows-from-sending-error-report-when-device-driver-requests:
      test_title: '''Prevent Windows from sending an error report when a device driver requests additional software during
        installation'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-1
  evaluate:
    test: test-prevent-windows-from-sending-error-report-when-device-driver-requests
