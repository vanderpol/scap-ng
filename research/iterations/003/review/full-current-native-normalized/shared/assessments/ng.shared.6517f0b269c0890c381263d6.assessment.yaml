assessment:
  id: ng.shared.6517f0b269c0890c381263d6
  version: 1
  assessment_title: The Debug programs user right must only be assigned to the Administrators group.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy
    >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment. If any
    groups or accounts other than the following are granted the "Debug Programs" user right, this is a finding: Administrators'
  inputs: []
  evidence: []
