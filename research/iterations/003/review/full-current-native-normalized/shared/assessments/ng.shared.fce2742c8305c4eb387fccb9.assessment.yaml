assessment:
  id: ng.shared.fce2742c8305c4eb387fccb9
  version: 1
  assessment_title: AZLX-23-000120 - Amazon Linux 2023 must check the GPG signature of software packages originating from
    external software repositories before installation.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    etc-dnf-dnf-conf-gpgcheck-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/dnf/dnf.conf
        pattern:
          operation: pattern match
          datatype: string
          value: ^gpgcheck=(.*)$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: /etc/dnf/dnf.conf gpgcheck
  states:
    state-etc-dnf-dnf-conf-gpgcheck-1:
      state_title: /etc/dnf/dnf.conf gpgcheck=1
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '1'
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-etc-dnf-dnf-conf-gpgcheck-1:
      test_title: /etc/dnf/dnf.conf gpgcheck=1
      capability: independent.textfilecontent54
      object: etc-dnf-dnf-conf-gpgcheck-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-etc-dnf-dnf-conf-gpgcheck-1
  evaluate:
    test: test-etc-dnf-dnf-conf-gpgcheck-1
