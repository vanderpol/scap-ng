assessment:
  id: ng.shared.dcb435a31c16a048e2977488
  version: 1
  assessment_title: The System packages must be up to date with the most recent vendor updates and security fixes.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The Software Installation Profile is required. An up-to-date Solaris repository must be accessible to the system.
    Enter the command: # pkg publisher to determine the current repository publisher. If a repository is not accessible, it
    may need to be locally installed and configured. Check for Solaris software package updates: # pfexec pkg update -n If
    the command does not report "No updates available for this image," this is a finding.'
  inputs: {}
  evidence: []
