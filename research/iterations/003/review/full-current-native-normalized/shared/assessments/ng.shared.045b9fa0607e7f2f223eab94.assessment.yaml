assessment:
  id: ng.shared.045b9fa0607e7f2f223eab94
  version: 1
  assessment_title: WN19-DC-000340 - Windows Server 2019 Access this computer from the network user right must only be assigned
    to the Administrators, Authenticated Users, and Enterprise Domain Controllers groups on domain controllers.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-userright-object:
      capability: windows.userright
      select:
        userright:
          operation: equals
          datatype: string
          value: SE_NETWORK_LOGON_NAME
      object_title: null
  states:
    state-windows-userright:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: ''
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-userright-2:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: Administrators
        operation: case insensitive equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-userright-3:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: Authenticated Users
        operation: case insensitive equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-userright-4:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: Enterprise Domain Controllers
        operation: case insensitive equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-access-this-computer-from-network-administrators-authenticated-users-enterprise-domain:
      test_title: Access this computer from the network - Administrators, Authenticated Users, Enterprise Domain Controllers
      capability: windows.userright
      object: windows-userright-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-windows-userright
      - state-windows-userright-2
      - state-windows-userright-3
      - state-windows-userright-4
  evaluate:
    test: test-access-this-computer-from-network-administrators-authenticated-users-enterprise-domain
