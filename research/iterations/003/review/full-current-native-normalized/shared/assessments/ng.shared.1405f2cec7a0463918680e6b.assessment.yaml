assessment:
  id: ng.shared.1405f2cec7a0463918680e6b
  version: 1
  assessment_title: Windows Customer Experience Improvement Program
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\SQMClient\Windows
        name:
          operation: equals
          datatype: string
          mask: false
          value: CEIPEnable
      object_title: null
  variables:
    turn-off-windows-customer-experience-improvement-program-variable:
      title: Turn off Windows Customer Experience Improvement Program
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: disable_the_windows_messenger_customer_experience_improvement_program_var
        validation:
          alternatives:
          - literal: '0'
            hint: enabled
          - literal: '1'
            hint: disabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: turn-off-windows-customer-experience-improvement-program-variable
          operation: equals
          datatype: int
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-turn-off-windows-customer-experience-improvement-program-set-disabled:
      test_title: '''Turn off Windows Customer Experience Improvement Program'' is set to ''Disabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-turn-off-windows-customer-experience-improvement-program-set-disabled
