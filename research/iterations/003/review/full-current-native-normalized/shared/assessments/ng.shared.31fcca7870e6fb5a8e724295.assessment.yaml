assessment:
  id: ng.shared.31fcca7870e6fb5a8e724295
  version: 1
  assessment_title: The macOS system must disable iCloud Notes.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable iCloud Notes with the following command: /usr/bin/osascript
    -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\ .objectForKey(''allowCloudNotes'').js
    EOS If the result is not "false", this is a finding.'
  inputs: []
  evidence: []
