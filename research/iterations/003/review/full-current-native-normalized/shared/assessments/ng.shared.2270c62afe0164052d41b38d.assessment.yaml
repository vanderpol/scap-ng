assessment:
  id: ng.shared.2270c62afe0164052d41b38d
  version: 1
  assessment_title: AZLX-23-000115 - Amazon Linux 2023 must check the GPG signature of locally installed software packages
    before installation.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/dnf/dnf.conf
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*localpkg_gpgcheck\s*=\s*(\w+)\b\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states:
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^(True|1|yes)$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-etc-dnf-dnf-conf-localpkg-gpgcheck-set-true-1-or:
      test_title: '/etc/dnf/dnf.conf: localpkg_gpgcheck is set to True, 1, or yes.'
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    test: test-etc-dnf-dnf-conf-localpkg-gpgcheck-set-true-1-or
