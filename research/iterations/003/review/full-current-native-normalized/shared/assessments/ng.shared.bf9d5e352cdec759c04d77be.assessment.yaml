assessment:
  id: ng.shared.bf9d5e352cdec759c04d77be
  version: 1
  assessment_title: WN10-CC-000200 - Administrator accounts must not be enumerated during elevation.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\CredUI
        name:
          operation: equals
          datatype: string
          mask: false
          value: EnumerateAdministrators
  tests:
    test-enumerate-administrator-accounts-on-elevation-set-disabled:
      test_title: '''Enumerate administrator accounts on elevation'' is set to ''Disabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-enumerate-administrator-accounts-on-elevation-set-disabled
