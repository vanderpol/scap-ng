assessment:
  id: ng.shared.f1d699c779ad81f8088e7fc6
  version: 1
  assessment_title: Permissions for the System event log must prevent access by nonprivileged accounts.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the permissions on the System event log (System.evtx). Standard user accounts or groups must not have
    greater than Read access. The default permissions listed below satisfy this requirement: Eventlog - Full Control SYSTEM
    - Full Control Administrators - Full Control The default location is the "%SystemRoot%\SYSTEM32\WINEVT\LOGS" directory.
    They may have been moved to another folder. If the permissions for these files are not as restrictive as the ACLs listed,
    this is a finding.'
  inputs: {}
  evidence: []
