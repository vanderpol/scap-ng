assessment:
  id: ng.shared.f13a3caa2a556c83c9d31e90
  version: 1
  assessment_title: OL08-00-010571 - OL 8 must prevent files with the setuid and setgid bit set from being executed on the
    /boot directory.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-partition-collection:
      collection_title: null
      capability: linux.partition
      select:
        mount_point:
          operation: equals
          datatype: string
          mask: false
          value: /boot
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/fstab
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*[^#\s]+\s+/boot\s+\S+\s+(\S+)\s+\S+\s+\S+\s*$
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
  tests:
    test-if-boot-mounted-it-mounted-nosuid-option:
      test_title: If /boot is mounted, it is mounted with the nosuid option
      capability: linux.partition
      collection: linux-partition-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: null
        state_capability: linux.partition
        state:
          field: mount_options
          value: nosuid
          operation: equals
          datatype: string
          mask: false
          entity_check: at least one
          entity_existence: at_least_one_exists
    test-if-boot-configured-in-etc-fstab-it-configured-nosuid-option:
      test_title: If /boot is configured in /etc/fstab, it is configured with the nosuid option
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: (?:^nosuid$|^nosuid,|,nosuid$|,nosuid,)
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-if-boot-mounted-it-mounted-nosuid-option
    - test: test-if-boot-configured-in-etc-fstab-it-configured-nosuid-option
