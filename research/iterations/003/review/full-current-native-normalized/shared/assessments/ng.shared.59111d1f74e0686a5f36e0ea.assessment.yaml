  version: 1
  assessment_title: Firefox must be configured to not delete data upon shutdown.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Type "about:policies" in the browser address bar. If "SanitizeOnShutdown" is not displayed under Policy Name
    or the Policy Value does not have {"Cache":false,"Cookies":false,"Downloads":false,"FormData":false,"Sessions":false,"History":false,"OfflineApps":false,"SiteSettings":false,"Locked":true},
    this is a finding.
  inputs: {}
  evidence: []
