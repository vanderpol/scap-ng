assessment:
  id: ng.shared.9071dd73a32ecc006d4c5caf
  version: 1
  assessment_title: The operating system must have the required packages for multifactor authentication installed.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    package-pam-pkcs11-collection:
      collection_title: package 'pam_pkcs11'
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: pam_pkcs11
  tests:
    test-package-pam-pkcs11-installed:
      test_title: package 'pam_pkcs11' is installed
      capability: linux.rpminfo
      collection: package-pam-pkcs11-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    test: test-package-pam-pkcs11-installed
