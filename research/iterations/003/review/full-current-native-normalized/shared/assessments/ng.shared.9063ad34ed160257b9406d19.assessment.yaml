assessment:
  id: ng.shared.9063ad34ed160257b9406d19
  version: 1
  assessment_title: Certificates in the trust store must be issued/signed by an approved CA.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'For the systemd Ubuntu OS, check the tomcat.service file to read the content of the JAVA_OPTS environment variable
    setting. sudo cat /etc/systemd/system/tomcat.service |grep -i truststore EXAMPLE output: set JAVA_OPTS="-Djavax.net.ssl.trustStore=/path/to/truststore"
    "-Djavax.net.ssl.trustStorePassword=************" If the variable is not set, use the default location command below.
    If the variable is set, use the alternate location command below and include the path and truststore file. -Default location:
    keytool -list -cacerts -v | grep -i issuer -Alternate location: keytool -list -keystore <location of trust store file>
    -v |grep -i issuer If there are no CA certificates issued by a Certificate Authority (CA) that is part of the DoD PKI/PKE,
    this is a finding.'
  inputs: []
  evidence: []
