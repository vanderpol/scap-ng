  version: 1
  assessment_title: SQL Server must provide an immediate real-time alert to appropriate support staff of all audit log failures.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Review SQL Server settings, OS, or third-party logging software settings to determine whether a real-time alert
    will be sent to the appropriate personnel when auditing fails for any reason. If real-time alerts are not sent upon auditing
    failure, this is a finding.
