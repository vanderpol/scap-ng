assessment:
  id: ng.shared.375e13235bd89f01bff195d7
  version: 1
  assessment_title: Windows Server 2022 Event Viewer must be protected from unauthorized modification and deletion.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This is not applicable for Windows Core Edition. Navigate to "%SystemRoot%\System32". View the permissions on
    "Eventvwr.exe". If any groups or accounts other than TrustedInstaller have "Full control" or "Modify" permissions, this
    is a finding. The default permissions below satisfy this requirement: TrustedInstaller - Full Control Administrators,
    SYSTEM, Users, ALL APPLICATION PACKAGES, ALL RESTRICTED APPLICATION PACKAGES - Read & Execute'
  inputs: {}
  evidence: []
