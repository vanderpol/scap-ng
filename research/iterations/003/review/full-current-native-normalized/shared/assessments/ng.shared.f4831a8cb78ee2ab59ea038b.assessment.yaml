assessment:
  id: ng.shared.f4831a8cb78ee2ab59ea038b
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that local initialization files do not execute
    world-writable programs.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that local initialization files do not execute world-writable programs. Check the system for world-writable
    files with the following command: # find / -xdev -perm -002 -type f -exec ls -ld {} \; | more For all files listed, check
    for their presence in the local initialization files with the following commands: Note: The example will be for a system
    that is configured to create users'' home directories in the "/home" directory. # grep <file> /home/*/.* If any local
    initialization files are found to reference world-writable files, this is a finding.'
  inputs: []
  evidence: []
