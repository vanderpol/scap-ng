assessment:
  id: ng.shared.93697bd5708aaecee9b8f58d
  version: 1
  assessment_title: The OL 8 SSH server must be configured to use only DOD-approved encryption ciphers employing FIPS 140-3
    validated cryptographic hash algorithms to protect the confidentiality of SSH server connections.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    rhel-8-operating-system-implement-dod-approved-encryption-protect-confidentiality-collection:
      collection_title: The RHEL 8 operating system must implement DoD-approved encryption to protect the confidentiality
        of SSH server connections.
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/crypto-policies/back-ends/opensshserver.config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[ \t]*CRYPTO_POLICY=.*-oCiphers=(\S+)['\s]*
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  variables:
    allowed-ciphers-in-various-orders-variable:
      title: Allowed ciphers in various orders.
      kind: constant
      datatype: string
      expression:
        literal:
        - aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes128-ctr
        - aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes128-ctr,aes256-ctr
        - aes256-gcm@openssh.com,aes256-ctr,aes128-gcm@openssh.com,aes128-ctr
        - aes256-gcm@openssh.com,aes256-ctr,aes128-ctr,aes128-gcm@openssh.com
        - aes256-gcm@openssh.com,aes128-ctr,aes128-gcm@openssh.com,aes256-ctr
        - aes256-gcm@openssh.com,aes128-ctr,aes256-ctr,aes128-gcm@openssh.com
        - aes128-gcm@openssh.com,aes256-ctr,aes128-ctr,aes256-gcm@openssh.com
        - aes128-gcm@openssh.com,aes256-ctr,aes256-gcm@openssh.com,aes128-ctr
        - aes128-gcm@openssh.com,aes128-ctr,aes256-ctr,aes256-gcm@openssh.com
        - aes128-gcm@openssh.com,aes128-ctr,aes256-gcm@openssh.com,aes256-ctr
        - aes128-gcm@openssh.com,aes256-gcm@openssh.com,aes256-ctr,aes128-ctr
        - aes128-gcm@openssh.com,aes256-gcm@openssh.com,aes128-ctr,aes256-ctr
        - aes256-ctr,aes128-gcm@openssh.com,aes128-ctr,aes256-gcm@openssh.com
        - aes256-ctr,aes128-gcm@openssh.com,aes256-gcm@openssh.com,aes128-ctr
        - aes256-ctr,aes128-ctr,aes128-gcm@openssh.com,aes256-gcm@openssh.com
        - aes256-ctr,aes128-ctr,aes256-gcm@openssh.com,aes128-gcm@openssh.com
        - aes256-ctr,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes128-ctr
        - aes256-ctr,aes256-gcm@openssh.com,aes128-ctr,aes128-gcm@openssh.com
        - aes128-ctr,aes128-gcm@openssh.com,aes256-ctr,aes256-gcm@openssh.com
        - aes128-ctr,aes128-gcm@openssh.com,aes256-gcm@openssh.com,aes256-ctr
        - aes128-ctr,aes256-ctr,aes128-gcm@openssh.com,aes256-gcm@openssh.com
        - aes128-ctr,aes256-ctr,aes256-gcm@openssh.com,aes128-gcm@openssh.com
        - aes128-ctr,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr
        - aes128-ctr,aes256-gcm@openssh.com,aes256-ctr,aes128-gcm@openssh.com
  tests:
    test-use-dod-approved-encryption-protect-confidentiality-ssh-server-connections:
      test_title: Must use DoD-approved encryption to protect the confidentiality of SSH server connections.
      capability: independent.textfilecontent54
      collection: rhel-8-operating-system-implement-dod-approved-encryption-protect-confidentiality-collection
      assertion:
        existence: only_one_exists
        item_quantifier: all
        state_title: Confirm the correct and only the correct ciphers are listed.
        state_capability: independent.textfilecontent54
        state:
          all:
          - field: instance
            value: '1'
            operation: greater than or equal
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: subexpression
            value:
              variable: allowed-ciphers-in-various-orders-variable
            operation: equals
            datatype: string
            mask: false
            variable_check: at least one
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-use-dod-approved-encryption-protect-confidentiality-ssh-server-connections
