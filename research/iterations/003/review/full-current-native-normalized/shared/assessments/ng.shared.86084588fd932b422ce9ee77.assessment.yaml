assessment:
  id: ng.shared.86084588fd932b422ce9ee77
  version: 1
  assessment_title: The system must implement non-executable program stacks.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Determine the OS version you are currently securing. # uname –v If the OS version is 11.3 or newer, this check
    applies to all zones and relies on the "sxadm" command. Determine if the system implements non-executable program stacks.
    # sxadm status -p nxstack | cut -d: -f2 enabled.all If the command output is not "enabled.all", this is a finding. For
    Solaris 11, 11.1, and 11.2, this check applies to the global zone only and the "/etc/system" file is inspected. Determine
    the zone that you are currently securing. # zonename If the command output is "global", determine if the system implements
    non-executable program stacks. # grep noexec_user_stack /etc/system If the noexec_user_stack is not set to 1, this is
    a finding.'
  inputs: []
  evidence: []
