assessment:
  id: ng.shared.1a88c6421643c2d1a86eed2c
  version: 1
  assessment_title: Exchange must not send customer experience reports to Microsoft.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    run-get-rpcclientaccess-command-determine-if-encryption-required-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: powershell
        command:
          operation: equals
          datatype: string
          value: add-pssnapin Microsoft.Exchange.Management.Powershell.Snapin;Get-OrganizationConfig
        pattern:
          operation: equals
          datatype: string
          value: ^CustomerFeedbackEnabled
      behaviors:
        error_if_stderr_exists: 'true'
      object_title: Run Get-RpcClientAccess command to determine if Encryption is Required.
  states:
    state-verify-value-is-false:
      state_title: Verify value is false
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: (?i)false
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-if-value-customerfeedbackenabled-not-set-false-this-finding:
      test_title: If the value for CustomerFeedbackEnabled is not set to False, this is a finding.
      capability: independent.shellcommand
      object: run-get-rpcclientaccess-command-determine-if-encryption-required-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-verify-value-is-false
  evaluate:
    test: test-if-value-customerfeedbackenabled-not-set-false-this-finding
