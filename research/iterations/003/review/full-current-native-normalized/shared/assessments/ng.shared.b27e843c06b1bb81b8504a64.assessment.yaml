assessment:
  id: ng.shared.b27e843c06b1bb81b8504a64
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that all local interactive user home directories
    are defined in the /etc/passwd file.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    users-username-object:
      capability: unix.password
      select:
        username:
          operation: pattern match
          datatype: string
          mask: false
          value: '[\w]+'
      object_title: Users with an username
    only-non-system-users-uid-999-home-dirs-object:
      capability: unix.password
      set:
        operator: complement
        members:
        - object: users-username-object
        filters:
        - action: exclude
          state: state-only-uids-1000
      object_title: only non-system users (uid>999) home-dirs
    only-root-users-uid-0-home-dirs-object:
      capability: unix.password
      set:
        operator: complement
        members:
        - object: users-username-object
        filters:
        - action: exclude
          state: state-only-uids-0
      object_title: only root users (uid=0) home-dirs
    non-null-home-directories-non-system-users-uid-999-object:
      capability: unix.password
      set:
        operator: union
        members:
        - object: only-non-system-users-uid-999-home-dirs-object
        filters:
        - action: include
          state: state-only-users-with-the-home-directory-defined
        - action: exclude
          state: state-the-root-directory
      object_title: non-null home directories for non-system users (uid>999)
    verify-all-non-system-user-home-directories-exist-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: home-directories-non-system-users-variable
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
      object_title: Verify all non-system user home directories exist
    non-null-home-directory-ies-root-user-s-uid-0-object:
      capability: unix.password
      set:
        operator: union
        members:
        - object: only-root-users-uid-0-home-dirs-object
        filters:
        - action: include
          state: state-only-users-with-the-home-directory-defined
      object_title: non-null home directory(ies?) for root user(s?) (uid=0)
    verify-all-root-users-home-directories-exist-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: home-directory-root-variable
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
      object_title: Verify all root users home directories exist
  variables:
    home-directories-non-system-users-variable:
      title: home directories of non-system users
      kind: local
      datatype: string
      expression:
        values:
          object: non-null-home-directories-non-system-users-uid-999-object
          field: home_dir
    home-directory-root-variable:
      title: home directory of root
      kind: local
      datatype: string
      expression:
        values:
          object: non-null-home-directory-ies-root-user-s-uid-0-object
          field: home_dir
  states:
    state-only-users-with-the-home-directory-defined:
      state_title: only users with the home directory defined
      capability: unix.password
      state:
        field: home_dir
        value: .+
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-only-uids-1000:
      state_title: only uids < 1000
      capability: unix.password
      state:
        field: user_id
        value: '1000'
        operation: less than
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-only-uids-0:
      state_title: only uids > 0
      capability: unix.password
      state:
        field: user_id
        value: '0'
        operation: greater than
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-the-root-directory:
      state_title: the root directory
      capability: unix.password
      state:
        field: home_dir
        value: /
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-check-users-without-home-directory-not-defined:
      test_title: check for users without a home directory not defined
      capability: unix.password
      object: only-non-system-users-uid-999-home-dirs-object
      check_existence: all_exist
      check: all
      states:
      - state-only-users-with-the-home-directory-defined
    test-check-if-root-s-home-directory-not-defined:
      test_title: check if root's home directory is not defined
      capability: unix.password
      object: only-root-users-uid-0-home-dirs-object
      check_existence: all_exist
      check: all
      states:
      - state-only-users-with-the-home-directory-defined
    test-verify-all-user-home-directories-exist:
      test_title: Verify all user home directories exist
      capability: unix.file
      object: verify-all-non-system-user-home-directories-exist-object
      check_existence: all_exist
      check: all
    test-verify-root-s-home-directory-exists:
      test_title: Verify root's home directory exists
      capability: unix.file
      object: verify-all-root-users-home-directories-exist-object
      check_existence: all_exist
      check: all
  evaluate:
    all:
    - all:
      - test: test-check-users-without-home-directory-not-defined
      - test: test-check-if-root-s-home-directory-not-defined
    - test: test-verify-all-user-home-directories-exist
    - test: test-verify-root-s-home-directory-exists
