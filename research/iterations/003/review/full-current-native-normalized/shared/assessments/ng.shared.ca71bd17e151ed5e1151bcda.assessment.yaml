assessment:
  id: ng.shared.ca71bd17e151ed5e1151bcda
  version: 1
  assessment_title: CISC-ND-000470 - The Cisco router must be configured to prohibit the use of all unnecessary and nonsecure
    functions and services.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    show-running-config-collection:
      collection_title: show running-config
      capability: iosxe.line
      select:
        show_subcommand:
          operation: equals
          datatype: string
          mask: false
          value: show running-config
  tests:
    test-boot-network:
      test_title: boot network
      capability: iosxe.line
      collection: show-running-config-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: none satisfy
        state_title: boot network
        state_capability: iosxe.line
        state:
          field: config_line
          value: '[\r\n]\s*boot network[\r\n]'
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-ip-boot-server:
