assessment:
  id: ng.shared.f3672b4017759ecaf00e1101
  version: 1
  assessment_title: WN12-00-000170
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters
        name:
          operation: equals
          datatype: string
          value: SMB1
      object_title: null
    smb-v1-protocol-win32-optionalfeature-object-object:
      capability: windows.wmi.query
      object_title: SMB v1 Protocol Win32_OptionalFeature object
      collect:
        namespace: root\cimv2
        query: SELECT installstate FROM win32_optionalfeature WHERE name = 'SMB1Protocol'
  states:
    state-reg-dword-type-and-value-equals-0:
      state_title: REG_DWORD type and value equals 0
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
    state-check-smb-v1-protocol-win32-optionalfeature-object-insta:
      state_title: Check SMB v1 Protocol Win32_OptionalFeature object InstallState is equal to 2
      capability: windows.wmi.query
      state:
        field: result
        record:
          mask: false
          match: all
          existence: some
          fields:
            installstate:
              value: '2'
              operation: equal
              datatype: string
              mask: false
              match: any
              existence: some
  tests:
    test-configure-smbv1-server-set-disabled:
      test_title: '''Configure SMBv1 Server'' is set to ''Disabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-0
    test-smb-1-0-cifs-file-sharing-support-feature-not-installed:
      test_title: '''SMB 1.0/CIFS File Sharing Support'' feature is not installed'
      capability: windows.wmi.query
      object: smb-v1-protocol-win32-optionalfeature-object-object
      states:
      - state-check-smb-v1-protocol-win32-optionalfeature-object-insta
      existence: all
      match: all
  evaluate:
    any:
    - test: test-configure-smbv1-server-set-disabled
    - test: test-smb-1-0-cifs-file-sharing-support-feature-not-installed
