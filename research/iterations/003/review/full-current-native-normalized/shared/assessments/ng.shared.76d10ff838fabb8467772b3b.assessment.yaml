assessment:
  id: ng.shared.76d10ff838fabb8467772b3b
  version: 1
  assessment_title: OL07-00-040530 - The Oracle Linux operating system must display the date and time of the last successful
    account logon upon logon.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/pam.d/postlogin
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*session\s+.+\s+pam_lastlog\.so\s+(?:\w+\s+)*showfailed\b\s*(?:\w+\b\s*)*\s*(?:#.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-textfilecontent54-collection-2:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/pam.d/postlogin
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*session\s+.+\s+pam_lastlog\.so\s+(?:\w+\s+)*silent\b\s*(?:\w+\b\s*)*\s*(?:#.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-pam-lastlog-configured-show-last-successful-logon:
      test_title: pam_lastlog is configured to show last successful logon
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
    test-pam-lastlog-not-used-silent-option:
      test_title: pam_lastlog is not used with the silent option
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection-2
      assertion:
        existence: none_exist
        item_quantifier: none satisfy
        state: null
  evaluate:
    all:
    - test: test-pam-lastlog-configured-show-last-successful-logon
    - test: test-pam-lastlog-not-used-silent-option
