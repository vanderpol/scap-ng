assessment:
  id: ng.shared.74fde496df73ac8a7e989d80
  version: 1
  assessment_title: SQL Server Mirroring endpoint must utilize AES encryption.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-sqlext-collection:
      collection_title: null
      capability: independent.sqlext
      select:
        engine:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: microsoft-sql-server-dbms-variable
        version:
          operation: pattern match
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: microsoft-sql-server-version-2016-2022-variable
        instance:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        database:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
        sql:
          operation: equals
          datatype: string
          mask: false
          value: "SELECT name, type_desc, encryption_algorithm_desc\nFROM sys.database_mirroring_endpoints\nWHERE encryption_algorithm\
            \ != 2\n\t\t\t\t\t"
      behaviors:
        context: instance
  variables:
    microsoft-sql-server-dbms-variable:
      title: Microsoft SQL Server DBMS
      kind: constant
      datatype: string
      expression:
        literal: sqlserver
    microsoft-sql-server-version-2016-2022-variable:
      title: Microsoft SQL Server version 2016-2022
      kind: constant
      datatype: string
      expression:
        literal: 2016|2017|2019|2022
  tests:
    test-if-any-records-returned-this-finding:
      test_title: If any records are returned, this is a finding.
      capability: independent.sqlext
      collection: independent-sqlext-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
  evaluate:
    test: test-if-any-records-returned-this-finding
