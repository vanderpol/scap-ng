assessment:
  id: ng.shared.ca530003934f4c67aacd36e8
  version: 1
  assessment_title: AZLX-23-002345 - Amazon Linux 2023 system commands must be owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    all-files-in-system-command-directories-less-files-owned-by-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          value:
            variable: system-command-directories-including-usr-libexec-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
      filters:
      - action: exclude
        state: state-owned-by-root
      behaviors:
        recurse_direction: down
      object_title: All files in system command directories, less files owned by root
  variables:
    system-command-directories-including-usr-libexec-variable:
      title: system command directories (including /usr/libexec)
      kind: constant
      datatype: string
      expression:
        literal:
        - /bin
        - /sbin
        - /usr/bin
        - /usr/sbin
        - /usr/libexec
        - /usr/local/bin
        - /usr/local/sbin
  states:
    state-owned-by-root:
      state_title: owned by root
      capability: unix.file
      state:
        field: user_id
        value: '0'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-no-system-command-files-exist-except-those-owned-by-root:
      test_title: No system command files exist except those owned by root
      capability: unix.file
      object: all-files-in-system-command-directories-less-files-owned-by-object
      check_existence: none_exist
      check: all
  evaluate:
    test: test-no-system-command-files-exist-except-those-owned-by-root
