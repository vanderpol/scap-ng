assessment:
  id: ng.shared.b5fd3a6187d4b5347f06680a
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that passwords for new users are restricted to
    a 60-day maximum lifetime.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If passwords are not being used for authentication, this is Not Applicable. Verify the operating system enforces
    a 60-day maximum password lifetime restriction for new user accounts. Check for the value of "PASS_MAX_DAYS" in "/etc/login.defs"
    with the following command: # grep -i pass_max_days /etc/login.defs PASS_MAX_DAYS 60 If the "PASS_MAX_DAYS" parameter
    value is not 60 or less, or is commented out, this is a finding.'
  inputs: {}
  evidence: []
