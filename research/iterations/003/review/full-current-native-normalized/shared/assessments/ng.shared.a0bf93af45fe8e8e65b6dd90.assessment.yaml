assessment:
  id: ng.shared.a0bf93af45fe8e8e65b6dd90
  version: 1
  assessment_title: Shutdown System When Auditing Failures Occur
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /usr/lib/systemd/system/auditd.service
        pattern:
          operation: pattern match
          datatype: string
          value: ^ExecStartPost=\-\/sbin\/augenrules.*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
    independent-textfilecontent54-object-2:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          value: /etc/audit/rules.d
        filename:
          operation: pattern match
          datatype: string
          value: .*\.rules$
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*\-f\s*2\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
    independent-textfilecontent54-object-3:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /usr/lib/systemd/system/auditd.service
        pattern:
          operation: pattern match
          datatype: string
          value: ^ExecStartPost=\-\/sbin\/auditctl.*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
    independent-textfilecontent54-object-4:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/audit/audit.rules
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*\-f\s*2\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states: {}
  tests:
    test-audit-augenrules:
      test_title: audit augenrules
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
    test-audit-augenrules-configuration-shutdown:
      test_title: audit augenrules configuration shutdown
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-2
      check_existence: at_least_one_exists
      check: all
    test-audit-auditctl:
      test_title: audit auditctl
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-3
      check_existence: at_least_one_exists
      check: all
    test-audit-auditctl-configuration-shutdown:
      test_title: audit auditctl configuration shutdown
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-4
      check_existence: at_least_one_exists
      check: all
  evaluate:
    any:
    - all:
      - test: test-audit-augenrules
      - test: test-audit-augenrules-configuration-shutdown
    - all:
      - test: test-audit-auditctl
      - test: test-audit-auditctl-configuration-shutdown
