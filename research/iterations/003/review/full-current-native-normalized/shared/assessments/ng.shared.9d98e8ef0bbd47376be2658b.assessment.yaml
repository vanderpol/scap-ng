  assessment_title: The Trivial File Transfer Protocol (TFTP) server package must not be installed if not required for OL
    8 operational support.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify a TFTP server has not been installed on the system with the following command: $ sudo yum list installed
    tftp-server tftp-server.x86_64 5.2-24.el8 If TFTP is installed and the requirement for TFTP is not documented with the
    ISSO, this is a finding.'
