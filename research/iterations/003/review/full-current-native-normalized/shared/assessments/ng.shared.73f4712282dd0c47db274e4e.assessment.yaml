assessment:
  id: ng.shared.73f4712282dd0c47db274e4e
  version: 1
  assessment_title: UBTU-20-010416 - The Ubuntu operating system must generate error messages that provide information necessary
    for corrective actions without revealing information that could be exploited by adversaries.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    all-files-in-var-log-except-var-log-btmp-var-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          value: /var/log
        filename:
          operation: pattern match
          datatype: string
          value: .*
      filters:
      - action: exclude
        state: state-var-log-btmp
      - action: exclude
        state: state-var-log-wtmp
      - action: exclude
        state: state-var-log-lastlog
      - action: exclude
        state: state-var-log-lastlog-2
      - action: exclude
        state: state-var-log-lastlog-3
      behaviors:
        max_depth: '-1'
        recurse: directories
        recurse_direction: down
        recurse_file_system: local
      object_title: All files in /var/log except /var/log/btmp, /var/log/lastlog, and /var/log/wtmp
  states:
    state-mode-0640-or-less-permissive:
      state_title: mode 0640 or less permissive
      capability: unix.file
      state:
        all:
        - field: suid
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: sgid
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: sticky
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: uexec
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: gwrite
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: gexec
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: oread
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: owrite
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: oexec
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
    state-var-log-btmp:
      state_title: /var/log/btmp
      capability: unix.file
      state:
        field: filepath
        value: /var/log/btmp
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-var-log-wtmp:
      state_title: /var/log/wtmp
      capability: unix.file
      state:
        field: filepath
        value: /var/log/wtmp
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-var-log-lastlog:
      state_title: /var/log/lastlog
      capability: unix.file
      state:
        field: filepath
        value: /var/log/lastlog
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-var-log-lastlog-2:
      state_title: /var/log/lastlog
      capability: unix.file
      state:
        field: filepath
        value: /var/log/history.log
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-var-log-lastlog-3:
      state_title: /var/log/lastlog
      capability: unix.file
      state:
        field: filepath
        value: /var/log/eipp.log.xz
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-all-files-in-var-log-except-var-log-btmp-var:
      test_title: All files in /var/log except /var/log/btmp, /var/log/lastlog, and /var/log/wtmp are mode 640 or less permissive
      capability: unix.file
      object: all-files-in-var-log-except-var-log-btmp-var-object
      check_existence: any_exist
      check: all
      states:
      - state-mode-0640-or-less-permissive
  evaluate:
    test: test-all-files-in-var-log-except-var-log-btmp-var
