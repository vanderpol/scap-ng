assessment:
  id: ng.shared.c867879f630584593aa3dca2
  version: 1
  assessment_title: WN10-CC-000068 - Windows 10 must be configured to enable Remote host allows delegation of non-exportable
    credentials.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows\CredentialsDelegation
        name:
          operation: equals
          datatype: string
          mask: false
          value: AllowProtectedCreds
  tests:
    test-remote-host-allows-delegation-non-exportable-credentials-set-enabled:
      test_title: '''Remote host allows delegation of non-exportable credentials'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-remote-host-allows-delegation-non-exportable-credentials-set-enabled
