assessment:
  id: ng.shared.d2d7d5d757fb275dc3cb97c9
  version: 1
  assessment_title: Exchange software must be installed on a separate partition from the OS.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    location-exchange-instatallation-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: (Get-ItemProperty -Path 'HKLM:SOFTWARE\Microsoft\ExchangeServer\v15\Setup' -Name 'MsiInstallPath').MsiInstallPath
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: \w
      behaviors:
        error_if_stderr_exists: 'true'
      object_title: Location of Exchange Instatallation
    boot-drive-object:
      capability: windows.wmi
      select:
        namespace:
          operation: equals
          datatype: string
          mask: false
          value: root\cimv2
        wql:
          operation: equals
          datatype: string
          mask: false
          value: SELECT SystemDrive FROM Win32_OperatingSystem
      object_title: Boot Drive
    boot-drive-letter-object:
      capability: independent.variable
      select:
        var_ref:
          operation: equals
          datatype: string
          mask: false
          value:
            variable: windows-drive-letter-variable
      object_title: Boot Drive Letter
    search-directory-exchange-resides-on-other-executables-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: powershell-command-search-executables-while-excluding-exchange-installation-directory-variable
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: \w
      object_title: Search Directory Exchange resides on for other Executables.
  variables:
    windows-drive-letter-variable:
      title: Windows Drive Letter
      kind: local
      datatype: string
      expression:
        substring:
          value:
            values:
              object: boot-drive-object
              field: result
          start: '1'
          length: '1'
    exchange-installation-drive-letter-variable:
      title: Exchange Installation Drive Letter
      kind: local
      datatype: string
      expression:
        substring:
          value:
            values:
              object: location-exchange-instatallation-object
              field: stdout_line
          start: '1'
          length: '1'
    exchange-installation-location-without-drive-letter-variable:
      title: 'Exchange Installation Location without drive letter and :'
      kind: local
      datatype: string
      expression:
        substring:
          value:
            values:
              object: location-exchange-instatallation-object
              field: stdout_line
          start: '3'
          length: '-1'
    powershell-command-search-executables-while-excluding-exchange-installation-directory-variable:
      title: Powershell command to search for Executables while excluding exchange installation directory
      kind: local
      datatype: string
      expression:
        concat:
        - literal:
            value: 'get-childitem -path '
            datatype: string
        - variable: exchange-installation-drive-letter-variable
        - literal:
            value: :\ -Filter *.exe -Recurse -File -ErrorAction SilentlyContinue | Where-Object {$_.FullName -notlike '*
            datatype: string
        - variable: exchange-installation-location-without-drive-letter-variable
        - literal:
            value: '*'' } | select-object -First 200 Fullname | Format-Table -HideTableHeaders | Out-String -Width 4096'
            datatype: string
  states:
    state-verify-directories-are-not-the-same:
      state_title: verify directories are not the same
      capability: independent.variable
      state:
        field: value
        value:
          variable: exchange-installation-drive-letter-variable
        operation: not equal
        datatype: string
        mask: false
        variable_check: all
        entity_check: all
        entity_existence: at_least_one_exists
    state-no-executables-should-exist:
      state_title: No executables should exist
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: ''
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: none_exist
  tests:
    test-determine-installation-directory-exchange:
      test_title: Determine Installation Directory Of Exchange.
      capability: independent.shellcommand
      object: location-exchange-instatallation-object
      check_existence: at_least_one_exists
      check: all
    test-if-exchange-resides-on-partition-other-than-that-os-this:
      test_title: If Exchange resides on a partition other than that of the OS, this is not a finding.
      capability: independent.variable
      object: boot-drive-letter-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-verify-directories-are-not-the-same
    test-if-exchange-resides-on-partition-other-applications-installed-this-finding:
      test_title: If Exchange resides on a partition with other applications installed, this is a finding.
      capability: independent.shellcommand
      object: search-directory-exchange-resides-on-other-executables-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-no-executables-should-exist
  evaluate:
    all:
    - test: test-determine-installation-directory-exchange
    - test: test-if-exchange-resides-on-partition-other-than-that-os-this
    - test: test-if-exchange-resides-on-partition-other-applications-installed-this-finding
