assessment:
  id: ng.shared.e6e2d139aed301388f771a79
  version: 1
  assessment_title: The Oracle Linux operating system must immediately notify the System Administrator (SA) and Information
    System Security Officer (ISSO) (at a minimum) via email when the threshold for the repository maximum audit record storage
    capacity is reached.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system immediately notifies the SA and ISSO (at a minimum) via email when the allocated
    audit record storage volume reaches 75 percent of the repository maximum audit record storage capacity. Check what action
    the operating system takes when the threshold for the repository maximum audit record storage capacity is reached with
    the following command: # grep -i space_left_action /etc/audit/auditd.conf space_left_action = email If the value of the
    "space_left_action" keyword is not set to "email", this is a finding.'
  inputs: {}
  evidence: []
