assessment:
  id: ng.shared.3c66d39430e4a7d65da8f438
  version: 1
  assessment_title: The operating system must alert designated organizational officials in the event of an audit processing
    failure.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This check applies to the global zone only. Determine the zone that you are currently securing. # zonename If
    the command output is "global", this check applies. The root role is required. Verify the presence of an audit_warn entry
    in /etc/mail/aliases. # /usr/lib/sendmail -bv audit_warn If the response is: audit_warn... User unknown this is a finding.
    Review the output of the command and verify that the audit_warn alias notifies the appropriate users in this form: audit_warn:user1,user2
    If an appropriate user is not listed, this is a finding.'
  inputs: {}
  evidence: []
