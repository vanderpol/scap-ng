assessment:
  id: ng.shared.c319cbb3737ee65492c18ae6
  version: 1
  assessment_title: Run control scripts must not execute world writable programs or scripts.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Check the permissions on the files or scripts executed from system startup scripts to see if they are world
    writable. Create a list of all potential run command level scripts. # ls -l /etc/init.d/* /etc/rc* | tr ''\011'' '' ''
    | tr -s '' '' | cut -f 9,9 -d " " Create a list of world writable files. # find / -perm -002 -type f >> WorldWritableFileList
    Determine if any of the world writeable files in "WorldWritableFileList" are called from the run command level scripts.
    Note: Depending upon the number of scripts vs. world writable files, it may be easier to inspect the scripts manually.
    # more `ls -l /etc/init.d/* /etc/rc* | tr ''\011'' '' '' | tr -s '' '' | cut -f 9,9 -d " "` If any system startup script
    executes any file or script that is world writable, this is a finding.'
  inputs: {}
  evidence: []
