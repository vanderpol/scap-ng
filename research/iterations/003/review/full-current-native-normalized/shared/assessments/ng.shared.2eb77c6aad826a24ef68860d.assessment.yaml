assessment:
  id: ng.shared.2eb77c6aad826a24ef68860d
  version: 1
  assessment_title: WN10-AU-000155 - The system must be configured to audit System - System Integrity failures.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-auditeventpolicysubcategories-collection:
      collection_title: null
      capability: windows.auditeventpolicysubcategories
  tests:
    test-audit-system-integrity-failure-only:
      test_title: Audit - System Integrity - Failure only
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Audit - System Integrity - Failure only
        state_capability: windows.auditeventpolicysubcategories
        state:
          field: system_integrity
          value: AUDIT_FAILURE
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-audit-system-integrity-success-failure:
      test_title: Audit - System Integrity - Success and Failure
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Audit - System Integrity - Success and Failure
        state_capability: windows.auditeventpolicysubcategories
        state:
          field: system_integrity
          value: AUDIT_SUCCESS_FAILURE
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    any:
    - test: test-audit-system-integrity-failure-only
    - test: test-audit-system-integrity-success-failure
