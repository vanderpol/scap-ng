assessment:
  id: ng.shared.2c873be10373c98226e18da1
  version: 1
  assessment_title: Safe DLL Search Mode
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SYSTEM\CurrentControlSet\Control\Session Manager
        name:
          operation: equals
          datatype: string
          value: SafeDllSearchMode
      object_title: null
  variables:
    mss-safedllsearchmode-enable-safe-dll-search-mode-recommended-variable:
      title: 'MSS: (SafeDllSearchMode) Enable Safe DLL search mode (recommended)'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: safe_dll_search_mode_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: mss-safedllsearchmode-enable-safe-dll-search-mode-recommended-variable
          operation: equals
          datatype: int
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-mss-safedllsearchmode-enable-safe-dll-search-mode-recommended-set-enabled:
      test_title: '''MSS: (SafeDllSearchMode) Enable Safe DLL search mode (recommended)'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-mss-safedllsearchmode-enable-safe-dll-search-mode-recommended-set-enabled
