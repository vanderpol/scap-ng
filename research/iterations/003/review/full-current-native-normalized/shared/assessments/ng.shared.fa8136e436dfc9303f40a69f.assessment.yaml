assessment:
  id: ng.shared.fa8136e436dfc9303f40a69f
  version: 1
  assessment_title: UBTU-22-251015 - Ubuntu 22.04 LTS must enable and run the Uncomplicated Firewall (ufw).
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    linux-systemdunitproperty-object:
      capability: linux.systemdunitproperty
      select:
        unit:
          operation: equals
          datatype: string
          mask: false
          value: ufw.service
        property:
          operation: equals
          datatype: string
          mask: false
          value: ActiveState
      object_title: null
  states:
    state-linux-systemdunitproperty:
      state_title: null
      capability: linux.systemdunitproperty
      state:
        field: value
        value: active
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-ufw-service-active:
      test_title: ufw.service is active
      capability: linux.systemdunitproperty
      object: linux-systemdunitproperty-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-linux-systemdunitproperty
  evaluate:
    test: test-ufw-service-active
