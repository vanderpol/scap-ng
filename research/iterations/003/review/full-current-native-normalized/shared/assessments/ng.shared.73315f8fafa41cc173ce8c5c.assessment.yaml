assessment:
  id: ng.shared.73315f8fafa41cc173ce8c5c
  version: 1
  assessment_title: The RHEL 8 SSH private host key files must have mode 0600 or less permissive.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the SSH private host key files have mode "0600" or less permissive with the following command: $ sudo
    ls -l /etc/ssh/ssh_host*key -rw------- 1 root ssh_keys 668 Nov 28 06:43 ssh_host_dsa_key -rw------- 1 root ssh_keys 582
    Nov 28 06:43 ssh_host_key -rw------- 1 root ssh_keys 887 Nov 28 06:43 ssh_host_rsa_key If any private host key file has
    a mode more permissive than "0600", this is a finding.'
  inputs: []
  evidence: []
