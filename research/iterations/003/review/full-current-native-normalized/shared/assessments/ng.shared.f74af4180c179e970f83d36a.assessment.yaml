assessment:
  id: ng.shared.f74af4180c179e970f83d36a
  version: 1
  assessment_title: The OL 8 audit system must protect auditing rules from unauthorized change.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the audit system prevents unauthorized changes with the following command: $ sudo grep "^\s*[^#]" /etc/audit/audit.rules
    | tail -1 -e 2 If the audit system is not set to be immutable by adding the "-e 2" option to the "/etc/audit/audit.rules",
    this is a finding.'
  inputs: {}
  evidence: []
