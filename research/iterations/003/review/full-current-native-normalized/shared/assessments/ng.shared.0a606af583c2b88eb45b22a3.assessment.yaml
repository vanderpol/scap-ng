assessment:
  id: ng.shared.0a606af583c2b88eb45b22a3
  version: 1
  assessment_title: Windows 2012/2012 R2 passwords must be configured to expire.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Review the password never expires status for enabled user accounts. Open "Windows PowerShell" with elevated
    privileges (run as administrator). Domain Controllers: Enter "Search-ADAccount -PasswordNeverExpires -UsersOnly | Where
    PasswordNeverExpires -eq True | FT Name, PasswordNeverExpires, Enabled". Exclude application accounts and disabled accounts
    (e.g., Guest). If any enabled user accounts are returned with a "PasswordNeverExpires" status of "True", this is a finding.
    Member servers and standalone systems: Enter ''Get-CimInstance -Class Win32_Useraccount -Filter "PasswordExpires=False
    and LocalAccount=True" | FT Name, PasswordExpires, Disabled, LocalAccount''. Exclude application accounts and disabled
    accounts (e.g., Guest). If any enabled user accounts are returned with a "PasswordExpires" status of "False", this is
    a finding.'
  inputs: {}
  evidence: []
