assessment:
  id: ng.shared.19c9283afbee23100d27483b
  version: 1
  assessment_title: SQL Server must generate audit records when successful and unsuccessful attempts to add privileges/permissions
    occur.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Check that SQL Server Audit is being used for the STIG compliant audit. Determine if an audit is configured
    and started by executing the following query: SELECT name AS ''Audit Name'', status_desc AS ''Audit Status'', audit_file_path
    AS ''Current Audit File'' FROM sys.dm_server_audit_status Execute the following query to verify the required audit actions
    are included in the server audit specification: SELECT a.name AS ''AuditName'', s.name AS ''SpecName'', d.audit_action_name
    AS ''ActionName'', d.audited_result AS ''Result'' FROM sys.server_audit_specifications s JOIN sys.server_audits a ON s.audit_guid
    = a.audit_guid JOIN sys.server_audit_specification_details d ON s.server_specification_id = d.server_specification_id
    WHERE a.is_state_enabled = 1 AND d.audit_action_name IN (''DATABASE_OBJECT_OWNERSHIP_CHANGE_GROUP'' ,''DATABASE_OBJECT_PERMISSION_CHANGE_GROUP''
    ,''DATABASE_OWNERSHIP_CHANGE_GROUP'' ,''DATABASE_PERMISSION_CHANGE_GROUP'' ,''DATABASE_ROLE_MEMBER_CHANGE_GROUP'' ,''SCHEMA_OBJECT_OWNERSHIP_CHANGE_GROUP''
    ,''SCHEMA_OBJECT_PERMISSION_CHANGE_GROUP'' ,''SERVER_OBJECT_OWNERSHIP_CHANGE_GROUP'' ,''SERVER_OBJECT_PERMISSION_CHANGE_GROUP''
    ,''SERVER_PERMISSION_CHANGE_GROUP'' ,''SERVER_ROLE_MEMBER_CHANGE_GROUP'') If the any of the following audit actions are
    not returned in an active audit, this is a finding. DATABASE_OBJECT_OWNERSHIP_CHANGE_GROUP DATABASE_OBJECT_PERMISSION_CHANGE_GROUP
    DATABASE_OWNERSHIP_CHANGE_GROUP DATABASE_PERMISSION_CHANGE_GROUP DATABASE_ROLE_MEMBER_CHANGE_GROUP SCHEMA_OBJECT_OWNERSHIP_CHANGE_GROUP
    SCHEMA_OBJECT_PERMISSION_CHANGE_GROUP SERVER_OBJECT_OWNERSHIP_CHANGE_GROUP SERVER_OBJECT_PERMISSION_CHANGE_GROUP SERVER_PERMISSION_CHANGE_GROUP
    SERVER_ROLE_MEMBER_CHANGE_GROUP If no records are returned, this is a finding.'
  inputs: {}
  evidence: []
