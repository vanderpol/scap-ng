assessment:
  id: ng.shared.38828737af60b118a7298af1
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that all files and directories have a valid owner.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify all files and directories on the system have a valid owner. Check the owner of all files and directories
    with the following command: Note: The value after -fstype must be replaced with the filesystem type. XFS is used as an
    example. # find / -fstype xfs -nouser If any files on the system do not have an assigned owner, this is a finding.'
  inputs: []
  evidence: []
