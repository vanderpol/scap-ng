assessment:
  id: ng.shared.f6f457799689b59c0d36d7ee
  version: 1
  assessment_title: WN10-AC-000020 - The password history must be configured to 24 passwords remembered.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-passwordpolicy-object:
      capability: windows.passwordpolicy
      object_title: null
  states:
    state-password-history-length-is-greater-than-or-equal-to-vari:
      state_title: Password History Length is greater than or equal to variable
      capability: windows.passwordpolicy
      state:
        field: password_hist_len
        value: '24'
        operation: greater than or equal
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-enforce-password-history-set-24-passwords-or-more:
      test_title: '''Enforce password history'' is set to ''24'' passwords or more'
      capability: windows.passwordpolicy
      object: windows-passwordpolicy-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-password-history-length-is-greater-than-or-equal-to-vari
  evaluate:
    test: test-enforce-password-history-set-24-passwords-or-more
