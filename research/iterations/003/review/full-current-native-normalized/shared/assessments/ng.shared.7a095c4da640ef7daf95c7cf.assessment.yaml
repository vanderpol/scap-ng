assessment:
  id: ng.shared.7a095c4da640ef7daf95c7cf
  version: 1
  assessment_title: The Oracle Linux operating system must disable the file system automounter unless required.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system disables the ability to automount devices. Check to see if automounter service is
    active with the following command: # systemctl status autofs autofs.service - Automounts filesystems on demand Loaded:
    loaded (/usr/lib/systemd/system/autofs.service; disabled) Active: inactive (dead) If the "autofs" status is set to "active"
    and is not documented with the Information System Security Officer (ISSO) as an operational requirement, this is a finding.'
  inputs: []
  evidence: []
