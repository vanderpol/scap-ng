assessment:
  id: ng.shared.8dd80165ebee118cfba51150
  version: 1
  assessment_title: WN19-AU-000270 - Windows Server 2019 must be configured to audit Policy Change - Audit Policy Change failures.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-auditeventpolicysubcategories-collection:
      collection_title: null
      capability: windows.auditeventpolicysubcategories
  tests:
    test-audit-policy-change-failure-only-or-success-failure:
      test_title: Audit Policy Change - 'Failure only' or 'Success and Failure'
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: '''Audit Policy Change'' is set to ''Success'' and ''Failure'''
          capability: windows.auditeventpolicysubcategories
          state:
            field: audit_policy_change
            value: AUDIT_SUCCESS_FAILURE
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: windows.auditeventpolicysubcategories
          state:
            field: audit_policy_change
            value: AUDIT_FAILURE
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-audit-policy-change-failure-only-or-success-failure
