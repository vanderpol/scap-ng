assessment:
  id: ng.shared.e6c30b9bdef4346ef1a34d53
  version: 1
  assessment_title: Exchange must not send customer experience reports to Microsoft.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    run-get-rpcclientaccess-command-determine-if-encryption-required-collection:
      collection_title: Run Get-RpcClientAccess command to determine if Encryption is Required.
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: add-pssnapin Microsoft.Exchange.Management.Powershell.Snapin;Get-OrganizationConfig
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: ^CustomerFeedbackEnabled
      behaviors:
        error_if_stderr_exists: 'true'
  tests:
    test-if-value-customerfeedbackenabled-not-set-false-this-finding:
      test_title: If the value for CustomerFeedbackEnabled is not set to False, this is a finding.
      capability: independent.shellcommand
      collection: run-get-rpcclientaccess-command-determine-if-encryption-required-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Verify value is false
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: (?i)false
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-if-value-customerfeedbackenabled-not-set-false-this-finding
