assessment:
  id: ng.shared.7788fc87e2b06d7688c7c1d0
  version: 1
  assessment_title: The macOS system must retain the session lock until the user reestablishes access using established identification
    and authentication procedures.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    system-settings-screensaver-password-enforce-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.screensaver'')\

            .objectForKey(''askForPassword'').js

            EOS'
      object_title: system_settings_screensaver_password_enforce_recommended_object
  states:
    state-system-settings-screensaver-password-enforce-recommended:
      state_title: system_settings_screensaver_password_enforce_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: 'true'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-settings-screensaver-password-enforce-recommended-test:
      test_title: system_settings_screensaver_password_enforce_recommended_test
      capability: independent.shellcommand
      object: system-settings-screensaver-password-enforce-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-system-settings-screensaver-password-enforce-recommended
  evaluate:
    test: test-system-settings-screensaver-password-enforce-recommended-test
