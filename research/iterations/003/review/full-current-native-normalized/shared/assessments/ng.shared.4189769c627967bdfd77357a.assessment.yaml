assessment:
  id: ng.shared.4189769c627967bdfd77357a
  version: 1
  assessment_title: The password for the krbtgt account on a domain must be reset at least every 180 days.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    run-user-get-aduser-krbtgt-properties-passwordlastset-datetime-now-user-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: powershell
        command:
          operation: equals
          datatype: string
          value: $user = Get-ADUser krbtgt -properties passwordlastset; ([datetime]::Now - $user.PasswordLastSet).Days
        pattern:
          operation: equals
          datatype: string
          value: ''
      object_title: Run $user = Get-ADUser krbtgt -properties passwordlastset; ([datetime]::Now - $user.PasswordLastSet).Days
        command via PowerShell
  states:
    state-password-for-krbtgt-account-should-be-180-or-less-days-o:
      state_title: Password for krbtgt account should be 180 or less days old
      capability: independent.shellcommand
      state:
        all:
        - field: command
          value: $user = Get-ADUser krbtgt -properties passwordlastset; ([datetime]::Now - $user.PasswordLastSet).Days
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: '180'
          operation: less than or equal
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-password-krbtgt-account-on-domain-reset-at-least-every-180:
      test_title: The password for the krbtgt account on a domain must be reset at least every 180 days.
      capability: independent.shellcommand
      object: run-user-get-aduser-krbtgt-properties-passwordlastset-datetime-now-user-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-password-for-krbtgt-account-should-be-180-or-less-days-o
  evaluate:
    test: test-password-krbtgt-account-on-domain-reset-at-least-every-180
