assessment:
  id: ng.shared.82d6e49b36266e860bf7f268
  version: 1
  assessment_title: Prevent Windows Update for device driver search
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\Windows\DriverSearching
        name:
          operation: equals
          datatype: string
          mask: false
          value: SearchOrderConfig
  variables:
    specify-search-order-device-driver-source-locations-variable:
      title: Specify Search Order for device driver source locations
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: specify_search_order_for_device_driver_source_locations_var
        validation:
          alternatives:
          - literal: '0'
            hint: do_not_search_windows_update
          - literal: '1'
            hint: search_windows_update_first
          - literal: '2'
            hint: search_windows_update_last
  tests:
    test-specify-search-order-device-driver-source-locations-set-enabled-do:
      test_title: '''Specify search order for device driver source locations'' is set to ''Enabled: Do not search Windows
        Update'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: specify-search-order-device-driver-source-locations-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-specify-search-order-device-driver-source-locations-set-enabled-do
