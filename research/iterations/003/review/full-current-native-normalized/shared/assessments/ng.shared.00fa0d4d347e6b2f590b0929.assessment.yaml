assessment:
  id: ng.shared.00fa0d4d347e6b2f590b0929
  version: 1
  assessment_title: WN19-DC-000040 - Windows Server 2019 Kerberos user ticket lifetime must be limited to 10 hours or less.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-wmi57-object:
      capability: windows.wmi57
      select:
        namespace:
          operation: equals
          datatype: string
          value: root\rsop\computer
        wql:
          operation: equals
          datatype: string
          value: SELECT setting FROM RSOP_SecuritySettingNumeric WHERE KeyName='MaxTicketAge'
      object_title: null
  states:
    state-windows-wmi57:
      state_title: null
      capability: windows.wmi57
      state:
        field: result
        value:
          record:
          - name: setting
            value: '10'
            operation: less than or equal
            datatype: int
            entity_check: all
        operation: equals
        datatype: record
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-wmi57-2:
      state_title: null
      capability: windows.wmi57
      state:
        field: result
        value:
          record:
          - name: setting
            value: '0'
            operation: greater than
            datatype: int
            entity_check: all
        operation: equals
        datatype: record
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-kerberos-policy-maximum-lifetime-user-ticket-10-hours-or-less:
      test_title: Kerberos Policy - Maximum lifetime for user ticket - 10 hours or less, but greater than 0
      capability: windows.wmi57
      object: windows-wmi57-object
      check_existence: at_least_one_exists
      check: all
      state_operator: AND
      states:
      - state-windows-wmi57
      - state-windows-wmi57-2
  evaluate:
    test: test-kerberos-policy-maximum-lifetime-user-ticket-10-hours-or-less
