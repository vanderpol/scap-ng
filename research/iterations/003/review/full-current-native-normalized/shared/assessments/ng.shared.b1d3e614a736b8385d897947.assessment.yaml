assessment:
  id: ng.shared.b1d3e614a736b8385d897947
  version: 1
  assessment_title: WN10-AC-000020 - The password history must be configured to 24 passwords remembered.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-passwordpolicy-collection:
      collection_title: null
      capability: windows.passwordpolicy
  tests:
    test-enforce-password-history-set-24-passwords-or-more:
      test_title: '''Enforce password history'' is set to ''24'' passwords or more'
      capability: windows.passwordpolicy
      collection: windows-passwordpolicy-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Password History Length is greater than or equal to variable
        state_capability: windows.passwordpolicy
        state:
          field: password_hist_len
          value: '24'
          operation: greater than or equal
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-enforce-password-history-set-24-passwords-or-more
