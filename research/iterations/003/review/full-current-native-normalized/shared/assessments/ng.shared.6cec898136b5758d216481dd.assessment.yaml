assessment:
  id: ng.shared.6cec898136b5758d216481dd
  version: 1
  assessment_title: The macOS system must enforce multifactor authentication for logon.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to enforce multifactor authentication for login with the following command:
    /usr/bin/grep -Ec ''^(auth\s+sufficient\s+pam_smartcard.so|auth\s+required\s+pam_deny.so)'' /etc/pam.d/login If the result
    is not "2", this is a finding.'
  inputs: {}
  evidence: []
