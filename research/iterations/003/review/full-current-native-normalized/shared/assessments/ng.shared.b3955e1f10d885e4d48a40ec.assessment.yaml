assessment:
  id: ng.shared.b3955e1f10d885e4d48a40ec
  version: 1
  assessment_title: Audit User/Group Modification (/etc/shadow)
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /usr/lib/systemd/system/auditd.service
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^ExecStartPost=\-\/sbin\/augenrules.*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: null
    independent-textfilecontent54-object-2:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/rules.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .*\.rules$
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\-w[\s]+/etc/shadow[\s]+\-p[\s]+\b([rx]*w[rx]*a[rx]*|[rx]*a[rx]*w[rx]*)\b[\s]+(-k[\s]+|-F[\s]+key=)\w+[\s]*$
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
      object_title: null
    independent-textfilecontent54-object-3:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /usr/lib/systemd/system/auditd.service
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^ExecStartPost=\-\/sbin\/auditctl.*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: null
    independent-textfilecontent54-object-4:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/audit.rules
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\-w[\s]+/etc/shadow[\s]+\-p[\s]+\b([rx]*w[rx]*a[rx]*|[rx]*a[rx]*w[rx]*)\b[\s]+(-k[\s]+|-F[\s]+key=)\w+[\s]*$
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
      object_title: null
  states: {}
  tests:
    test-audit-augenrules:
      test_title: audit augenrules
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
    test-audit-augenrules-etc-shadow:
      test_title: audit augenrules /etc/shadow
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-2
      check_existence: at_least_one_exists
      check: all
    test-audit-auditctl:
      test_title: audit auditctl
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-3
      check_existence: at_least_one_exists
      check: all
    test-audit-etc-shadow:
      test_title: audit /etc/shadow
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-4
      check_existence: at_least_one_exists
      check: all
  evaluate:
    any:
    - all:
      - test: test-audit-augenrules
      - test: test-audit-augenrules-etc-shadow
    - all:
      - test: test-audit-auditctl
      - test: test-audit-etc-shadow
