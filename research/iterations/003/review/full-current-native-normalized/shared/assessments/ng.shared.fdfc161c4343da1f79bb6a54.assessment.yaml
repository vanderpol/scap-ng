assessment:
  id: ng.shared.fdfc161c4343da1f79bb6a54
  version: 1
  assessment_title: SNMP default community strings and passphrases must be changed from vendor defaults.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the Solaris 11 system does not use default SNMP community strings or passphrases. The root role is required.
    Find any occurrences of the snmpd.conf file delivered with Solaris packages: # pkg search -l -Ho path snmpd.conf | awk
    ''{ print "/"$1 }'' /etc/net-snmp/snmp/snmpd.conf For each listed file, use the following command to review its contents:
    # more [filename] Review SNMP trap configurations for default community strings: # grep trap /etc/net-snmp/snmp/snmpd.conf
    Identify any community names, trap communities, or user password configurations set to default values. Examples: public,
    private, trap, public@localhost, password If any default values are present, this is a finding.'
  inputs: {}
  evidence: []
