assessment:
  id: ng.shared.bcd38c9c4be97eecdb1d62bc
  version: 1
  assessment_title: OL08-00-020010 - OL 8 systems below version 8.2 must automatically lock an account when three unsuccessful
    logon attempts occur.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/pam.d/system-auth
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*deny\s*=\s*([\d]+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-textfilecontent54-collection-2:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/pam.d/password-auth
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*deny\s*=\s*([\d]+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-deny-set-3-or-less-but-not-0-in-etc:
      test_title: deny is set to 3 or less but not 0 in /etc/pam.d/system-auth
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: AND
        states:
        - state_title: null
          capability: independent.textfilecontent54
          state:
            field: subexpression
            value: '3'
            operation: less than or equal
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: independent.textfilecontent54
          state:
            field: subexpression
            value: '0'
            operation: greater than
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-deny-set-3-or-less-but-not-0-in-etc-2:
      test_title: deny is set to 3 or less but not 0 in /etc/pam.d/password-auth
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection-2
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: AND
        states:
        - state_title: null
          capability: independent.textfilecontent54
          state:
            field: subexpression
            value: '3'
            operation: less than or equal
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: independent.textfilecontent54
          state:
            field: subexpression
            value: '0'
            operation: greater than
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-deny-set-3-or-less-but-not-0-in-etc
    - test: test-deny-set-3-or-less-but-not-0-in-etc-2
