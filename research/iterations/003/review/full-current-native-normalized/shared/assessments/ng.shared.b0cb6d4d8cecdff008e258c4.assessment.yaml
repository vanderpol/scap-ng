assessment:
  id: ng.shared.b0cb6d4d8cecdff008e258c4
  version: 1
  assessment_title: OL08-00-020022 - OL 8 systems below version 8.2 must include root when automatically locking an account
    until the locked account is released by an administrator when three unsuccessful logon attempts occur during a 15-minute
    time period.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/pam.d/system-auth
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*auth\s+required\s+pam_faillock\.so\s+preauth.*[ \t]+even_deny_root(?:[ \t]+.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
    independent-textfilecontent54-object-2:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/pam.d/password-auth
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*auth\s+required\s+pam_faillock\.so\s+preauth.*[ \t]+even_deny_root(?:[ \t]+.*)?$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states: {}
  tests:
    test-pam-faillock-so-preauth-even-deny-root-in-etc-pam:
      test_title: pam_faillock.so preauth even_deny_root is in /etc/pam.d/system-auth
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: all_exist
      check: all
    test-pam-faillock-so-preauth-even-deny-root-set-in-etc:
      test_title: pam_faillock.so preauth even_deny_root is set in /etc/pam.d/password-auth (preauth)
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object-2
      check_existence: all_exist
      check: all
  evaluate:
    all:
    - test: test-pam-faillock-so-preauth-even-deny-root-in-etc-pam
    - test: test-pam-faillock-so-preauth-even-deny-root-set-in-etc
