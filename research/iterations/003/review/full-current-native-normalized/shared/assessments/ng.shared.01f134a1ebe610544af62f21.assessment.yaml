assessment:
  id: ng.shared.01f134a1ebe610544af62f21
  version: 1
  assessment_title: The SQL Server default account [sa] must be disabled.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Check SQL Server settings to determine if the [sa] (system administrator) account has been disabled by executing
    the following query: USE master; GO SELECT name, is_disabled FROM sys.sql_logins WHERE principal_id = 1; GO Verify that
    the "name" column contains the current name of the [sa] database server account. If the "is_disabled" column is not set
    to "1", this is a finding.'
  inputs: []
  evidence: []
