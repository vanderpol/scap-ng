assessment:
  id: ng.shared.f500b9069515b0465eb15528
  version: 1
  assessment_title: Disable PerfTrack
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows\WDI\{9c5a40da-b965-4fc3-8781-88dd50a6299d}
        name:
          operation: equals
          datatype: string
          mask: false
          value: ScenarioExecutionEnabled
  variables:
    enable-disable-perftrack-variable:
      title: Enable/Disable PerfTrack
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: enable_disable_perftrack_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-enable-disable-perftrack-set-disabled:
      test_title: '''Enable/Disable PerfTrack'' is set to ''Disabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: enable-disable-perftrack-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-enable-disable-perftrack-set-disabled
