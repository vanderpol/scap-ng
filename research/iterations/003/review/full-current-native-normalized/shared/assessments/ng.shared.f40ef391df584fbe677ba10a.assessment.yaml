assessment:
  id: ng.shared.f40ef391df584fbe677ba10a
  version: 1
  assessment_title: The macOS system must configure audit log folders to not contain access control lists.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured without ACLs applied to log folders with the following command: /bin/ls
    -lde /var/audit | /usr/bin/awk ''{print $1}'' | /usr/bin/grep -c ":" If the result is not "0", this is a finding.'
  inputs: []
  evidence: []
