assessment:
  id: ng.shared.abab31d9ab9519959c9b2022
  version: 1
  assessment_title: UBTU-22-654045 - Ubuntu 22.04 LTS must generate audit records for successful/unsuccessful attempts to
    use the fdisk command.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/audit.rules
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*-w\s+/usr/sbin/fdisk(?:\s+-p\s+[rwa]*x[rwa]*)?(?:\s+(?:-k\s+|-F\s+key=)\S+)*\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    independent-textfilecontent54-collection-2:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/audit/audit.rules
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*-a\s+(?:always,exit|exit,always)(?:\s+-S\s+all)?\s+-F\s+path=/usr/sbin/fdisk\s+-F\s+perm=[rwa]*x[rwa]*(?:\s+(?:-k\s+|-F\s+key=)\S+)*\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-audit-invocations-usr-sbin-fdisk-use-file-watch-syntax:
      test_title: Audit invocations of /usr/sbin/fdisk. Use file watch syntax.
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
    test-audit-invocations-usr-sbin-fdisk-use-system-call-syntax:
      test_title: Audit invocations of /usr/sbin/fdisk. Use system call syntax.
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection-2
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    any:
    - test: test-audit-invocations-usr-sbin-fdisk-use-file-watch-syntax
    - test: test-audit-invocations-usr-sbin-fdisk-use-system-call-syntax
