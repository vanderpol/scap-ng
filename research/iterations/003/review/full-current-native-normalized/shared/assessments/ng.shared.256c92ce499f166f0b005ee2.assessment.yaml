assessment:
  id: ng.shared.256c92ce499f166f0b005ee2
  version: 1
  assessment_title: Driver Install - Device Driver Search Prompt
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\Windows\DriverSearching
        name:
          operation: equals
          datatype: string
          mask: false
          value: DontPromptForWindowsUpdate
      object_title: null
  variables:
    turn-off-windows-update-device-driver-search-prompt-variable:
      title: Turn off Windows Update device driver search prompt
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: turn_off_windows_update_device_driver_search_prompt_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: turn-off-windows-update-device-driver-search-prompt-variable
          operation: equals
          datatype: int
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-turn-off-windows-update-device-driver-search-prompt-set-enabled:
      test_title: '''Turn off Windows Update device driver search prompt'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-turn-off-windows-update-device-driver-search-prompt-set-enabled
