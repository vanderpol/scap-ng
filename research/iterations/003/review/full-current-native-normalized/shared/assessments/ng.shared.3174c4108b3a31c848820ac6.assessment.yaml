assessment:
  id: ng.shared.3174c4108b3a31c848820ac6
  version: 1
  assessment_title: Reserved UIDs 0-99 must only be used by system accounts.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The root role is required. Check that reserved UIDs are not assigned to non-system users. Determine the OS version
    you are currently securing: # uname –v For Solaris 11, 11.1, 11.2, and 11.3: # logins -so | awk -F: ''{ print $1 }'' |
    while read user; do found=0 for tUser in root daemon bin sys adm dladm netadm netcfg \ ftp dhcpserv sshd smmsp gdm zfssnap
    aiuser \ polkitd ikeuser lp openldap webservd unknown \ uucp nuucp upnp xvm mysql postgres svctag \ pkg5srv nobody noaccess
    nobody4; do if [ ${user} = ${tUser} ]; then found=1 fi done if [ $found -eq 0 ]; then echo "Invalid User with Reserved
    UID: ${user}" fi done If output is produced without justification and documentation in accordance with site policy, this
    is a finding. For Solaris 11.4 or newer: # logins -so | awk -F: ''{ print $1 }'' | while read user; do found=0 for tUser
    in root daemon bin sys adm dladm netadm \ netcfg dhcpserv sshd smmsp gdm zfssnap aiuser _polkitd \ ikeuser lp openldap
    webservd unknown \ uucp nuucp upnp xvm mysql postgres svctag \ pkg5srv nobody noaccess nobody4 _ntp; do if [ ${user} =
    ${tUser} ]; then found=1 fi done if [ $found -eq 0 ]; then echo "Invalid User with Reserved UID: ${user}" fi done If output
    is produced without justification and documentation in accordance with site policy, this is a finding.'
  inputs: {}
  evidence: []
