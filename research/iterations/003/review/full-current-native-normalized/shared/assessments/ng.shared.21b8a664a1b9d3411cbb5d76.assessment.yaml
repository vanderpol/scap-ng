assessment:
  id: ng.shared.21b8a664a1b9d3411cbb5d76
  version: 1
  assessment_title: Microsoft Strong Password Filtering
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    password-policy-collection:
      collection_title: Password policy
      capability: windows.passwordpolicy
  variables:
    enforce-password-complexity-variable:
      title: Enforce Password Complexity
      kind: external
      datatype: boolean
      input:
        required: true
        cardinality: one_or_more
        parameter: password_complexity_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-password-meet-complexity-requirements-set-enabled:
      test_title: '''Password must meet complexity requirements'' is set to ''Enabled'''
      capability: windows.passwordpolicy
      collection: password-policy-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Password Complexity equals variable
        state_capability: windows.passwordpolicy
        state:
          field: password_complexity
          value:
            variable: enforce-password-complexity-variable
          operation: equals
          datatype: boolean
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-password-meet-complexity-requirements-set-enabled
