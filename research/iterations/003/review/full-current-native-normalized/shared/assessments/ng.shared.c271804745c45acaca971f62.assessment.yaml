assessment:
  id: ng.shared.c271804745c45acaca971f62
  version: 1
  assessment_title: UBTU-18-010515 - The Ubuntu operating system must use a file integrity tool to verify correct operation
    of all security functions.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-dpkginfo-collection:
      collection_title: null
      capability: linux.dpkginfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: aide
    var-lib-aide-aide-db-collection:
      collection_title: /var/lib/aide/aide.db
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /var/lib/aide/aide.db
  tests:
    test-package-aide-installed:
      test_title: package aide is installed
      capability: linux.dpkginfo
      collection: linux-dpkginfo-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state: null
    test-package-aide-initialized:
      test_title: package aide is initialized
      capability: unix.file
      collection: var-lib-aide-aide-db-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state: null
  evaluate:
    all:
    - test: test-package-aide-installed
    - test: test-package-aide-initialized
