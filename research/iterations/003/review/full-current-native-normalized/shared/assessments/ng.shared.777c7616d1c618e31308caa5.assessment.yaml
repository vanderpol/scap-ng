assessment:
  id: ng.shared.777c7616d1c618e31308caa5
  version: 1
  assessment_title: The macOS system must disable the guest account.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    system-settings-guest-account-disable-recommended-object-collection:
      collection_title: system_settings_guest_account_disable_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: "/usr/bin/osascript -l JavaScript << EOS\nfunction run() {\n  let pref1 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.MCX')\\\
            \n.objectForKey('DisableGuestAccount'))\n  let pref2 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.MCX')\\\
            \n.objectForKey('EnableGuestAccount'))\n  if ( pref1 == true && pref2 == false ) {\n    return(\"true\")\n  }\
            \ else {\n    return(\"false\")\n  }\n}\nEOS"
  tests:
    test-system-settings-guest-account-disable-recommended-test:
      test_title: system_settings_guest_account_disable_recommended_test
      capability: independent.shellcommand
      collection: system-settings-guest-account-disable-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: system_settings_guest_account_disable_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: 'true'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-system-settings-guest-account-disable-recommended-test
