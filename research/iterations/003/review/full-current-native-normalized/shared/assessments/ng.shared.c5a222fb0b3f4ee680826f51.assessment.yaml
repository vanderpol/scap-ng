assessment:
  id: ng.shared.c5a222fb0b3f4ee680826f51
  version: 1
  assessment_title: UBTU-22-253010 - Ubuntu 22.04 LTS must be configured to use TCP syncookies.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-sysctl-object:
      capability: unix.sysctl
      select:
        name:
          operation: equals
          datatype: string
          value: net.ipv4.tcp_syncookies
      object_title: null
    independent-textfilecontent54-object-2:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/sysctl.conf
        pattern:
          operation: pattern match
          datatype: string
          value: (?:^|.*\n)\s*net\.ipv4\.tcp_syncookies\s*=\s*(\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
    independent-textfilecontent54-object-3:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          variable_check: at least one
          value:
            variable: directories-containing-sysctl-configuration-files-variable
        filename:
          operation: pattern match
          datatype: string
          value: ^.*\.conf$
        pattern:
          operation: pattern match
          datatype: string
          value: (?:^|.*\n)\s*net\.ipv4\.tcp_syncookies\s*=\s*(\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      set:
        operator: union
        members:
        - object: independent-textfilecontent54-object-2
        - object: independent-textfilecontent54-object-3
      object_title: null
  variables:
    directories-containing-sysctl-configuration-files-variable:
      title: Directories containing sysctl configuration files
      kind: constant
      datatype: string
      expression:
        literal:
        - /etc/sysctl.d
        - /run/sysctl.d
        - /lib/sysctl.d
        - /usr/lib/sysctl.d
        - /usr/local/lib/sysctl.d
  states:
    state-unix-sysctl:
      state_title: null
      capability: unix.sysctl
      state:
        field: value
        value: '1'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '1'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-net-ipv4-tcp-syncookies-setting-in-kernel-set-1:
      test_title: net.ipv4.tcp_syncookies setting in kernel is set to 1
      capability: unix.sysctl
      object: unix-sysctl-object
      check_existence: all_exist
      check: all
      states:
      - state-unix-sysctl
    test-net-ipv4-tcp-syncookies-setting-in-sysctl-configuration-files-set:
      test_title: net.ipv4.tcp_syncookies setting in sysctl configuration files is set to 1
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    all:
    - test: test-net-ipv4-tcp-syncookies-setting-in-kernel-set-1
    - test: test-net-ipv4-tcp-syncookies-setting-in-sysctl-configuration-files-set
