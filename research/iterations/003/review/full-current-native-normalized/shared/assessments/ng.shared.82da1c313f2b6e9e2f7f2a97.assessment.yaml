assessment:
  id: ng.shared.82da1c313f2b6e9e2f7f2a97
  version: 1
  assessment_title: The system must prevent local applications from generating source-routed packets.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    pfctl-s-rules-grep-allow-opts-collection:
      collection_title: pfctl -s rules | grep allow-opts
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: pfctl -s rules
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: grep allow-opts
  tests:
    test-system-prevent-local-applications-from-generating-source-routed-packets:
      test_title: The system must prevent local applications from generating source-routed packets.
      capability: independent.shellcommand
      collection: pfctl-s-rules-grep-allow-opts-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: No stdout_lines should exist
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: ''
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: none_exist
  evaluate:
    test: test-system-prevent-local-applications-from-generating-source-routed-packets
