assessment:
  id: ng.shared.ae21f4c3d5325003a240134e
  version: 1
  assessment_title: LDAP Client Signing
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Services\LDAP
        name:
          operation: equals
          datatype: string
          mask: false
          value: LDAPClientIntegrity
  variables:
    network-security-ldap-client-signing-requirements-variable:
      title: 'Network Security: LDAP client signing requirements'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: ldap_client_signing_requirements_var
        validation:
          alternatives:
          - literal: '0'
            hint: none
          - literal: '1'
            hint: negotiate_signing
          - literal: '2'
            hint: require_signing
  tests:
    test-network-security-ldap-client-signing-requirements-set-at-minimum-negotiate:
      test_title: '''Network security: LDAP client signing requirements'' is set to at a minimum ''Negotiate signing'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value is greater than or equal to variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: network-security-ldap-client-signing-requirements-variable
            operation: greater than or equal
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-network-security-ldap-client-signing-requirements-set-at-minimum-negotiate
