  version: 1
  assessment_title: The operating system must have no unowned files.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The root role is required. Identify all files that are owned by a user or group not listed in /etc/passwd or
    /etc/group # find / \( -fstype nfs -o -fstype cachefs -o -fstype autofs \ -o -fstype ctfs -o -fstype mntfs -o -fstype
    objfs \ -o -fstype proc \) -prune \( -nouser -o -nogroup \) -ls If output is produced, this is a finding.'
  inputs: []
  evidence: []
