assessment:
  id: ng.shared.5c52116b7e8c267eee900438
  version: 1
  assessment_title: The macOS system must be configured to audit all login and logout events.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to audit all login and logout events with the following command: /usr/bin/awk
    -F'':'' ''/^flags/ { print $NF }'' /etc/security/audit_control | /usr/bin/tr '','' ''\n'' | /usr/bin/grep -Ec ''^lo''
    If the result is not "1", this is a finding.'
  inputs: {}
  evidence: []
