assessment:
  id: ng.shared.467b9dbe5603b7427f35372b
  version: 1
  assessment_title: Windows Server 2019 maximum age for machine account passwords must be configured to 30 days or less.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This is the default configuration for this setting (30 days). If the following registry value does not exist
    or is not configured as specified, this is a finding: Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\
    Value Name: MaximumPasswordAge Value Type: REG_DWORD Value: 0x0000001e (30) (or less, but not 0)'
  inputs: {}
  evidence: []
