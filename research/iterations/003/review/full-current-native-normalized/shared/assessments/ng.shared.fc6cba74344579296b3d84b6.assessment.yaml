assessment:
  id: ng.shared.fc6cba74344579296b3d84b6
  version: 1
  assessment_title: The Perform volume maintenance tasks user right must only be assigned to the Administrators group.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy
    >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment. If any
    groups or accounts other than the following are granted the "Perform volume maintenance tasks" user right, this is a finding:
    Administrators'
  inputs: {}
  evidence: []
