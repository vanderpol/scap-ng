assessment:
  id: ng.shared.70f69a82ce39503ccba2a944
  version: 1
  assessment_title: Global System Objects Permission Strength
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Control\Session Manager
        name:
          operation: equals
          datatype: string
          mask: false
          value: ProtectionMode
  variables:
    system-objects-strengthen-default-permissions-internal-system-objects-variable:
      title: 'System objects: Strengthen default permissions of internal system objects'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: system_objects_strengthen_default_permissions_internal_system_objects_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  tests:
    test-system-objects-strengthen-default-permissions-internal-system-objects-e-g:
      test_title: '''System objects: Strengthen default permissions of internal system objects (e.g. Symbolic Links)'' is
        set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: system-objects-strengthen-default-permissions-internal-system-objects-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-system-objects-strengthen-default-permissions-internal-system-objects-e-g
