assessment:
  id: ng.shared.a96e4deef92ad7539abdbb8e
  version: 1
  assessment_title: The .Xauthority utility must only permit access to authorized hosts.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If X Display Manager (XDM) is not used on the system, this is not applicable. Determine if XDM is running. Procedure:
    # ps -ef | grep xdm Check the X Window system access is limited to authorized clients. Procedure: # xauth xauth> list
    Ask the SA if the clients listed are authorized. If any are not, this is a finding.'
  inputs: []
  evidence: []
