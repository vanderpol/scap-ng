assessment:
  id: ng.shared.b375aaa8d63c3602a47823fa
  version: 1
  assessment_title: The macOS system must display the Standard Mandatory DOD Notice and Consent Banner before granting remote
    access to the operating system.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    os-policy-banner-ssh-configure-stig-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: 'bannerText="You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized
            use only.


            By using this IS (which includes any device attached to this IS), you consent to the following conditions:


            -The USG routinely intercepts and monitors communications on this IS for purposes including, but not limited to,
            penetration testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement
            (LE), and counterintelligence (CI) investigations.


            -At any time, the USG may inspect and seize data stored on this IS.


            -Communications using, or data stored on, this IS are not private, are subject to routine monitoring, interception,
            and search, and may be disclosed or used for any USG-authorized purpose.


            -This IS includes security measures (e.g., authentication and access controls) to protect USG interests--not for
            your personal benefit or privacy.


            -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI investigative searching
            or monitoring of the content of privileged communications, or work product, related to personal representation
            or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work product
            are private and confidential. See User Agreement for details."

            test "$(cat /etc/banner)" = "$bannerText" && echo "1" || echo "0"'
      object_title: os_policy_banner_ssh_configure_stig_object
  states:
    state-os-policy-banner-ssh-configure-stig-state:
      state_title: os_policy_banner_ssh_configure_stig_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: '1'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-os-policy-banner-ssh-configure-stig-test:
      test_title: os_policy_banner_ssh_configure_stig_test
      capability: independent.shellcommand
      object: os-policy-banner-ssh-configure-stig-object-object
      check_existence: all_exist
      check: all
      states:
      - state-os-policy-banner-ssh-configure-stig-state
  evaluate:
    test: test-os-policy-banner-ssh-configure-stig-test
