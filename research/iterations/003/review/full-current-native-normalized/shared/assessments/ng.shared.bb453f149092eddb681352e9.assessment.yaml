assessment:
  id: ng.shared.bb453f149092eddb681352e9
  version: 1
  assessment_title: The Ubuntu operating system must disable all wireless network adapters.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    ubuntu-disable-all-wireless-network-adapters-collection:
      collection_title: Ubuntu must disable all wireless network adapters.
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: grep -v -e 'Inter-|.*' -e ' face |' /proc/net/wireless
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .+
  tests:
    test-ubuntu-disable-all-wireless-network-adapters:
      test_title: Ubuntu must disable all wireless network adapters.
      capability: independent.shellcommand
      collection: ubuntu-disable-all-wireless-network-adapters-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Ubuntu must disable all wireless network adapters.
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: .+
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    not:
      test: test-ubuntu-disable-all-wireless-network-adapters
