assessment:
  id: ng.shared.85b36a319453c1bbe07a849a
  version: 1
  assessment_title: The password history must be configured to 24 passwords remembered.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy
    >> Computer Configuration >> Windows Settings >> Security Settings >> Account Policies >> Password Policy. If the value
    for "Enforce password history" is less than "24" passwords remembered, this is a finding.
  inputs: []
  evidence: []
