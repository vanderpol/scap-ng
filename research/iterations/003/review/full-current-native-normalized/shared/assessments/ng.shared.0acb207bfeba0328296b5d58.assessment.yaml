assessment:
  id: ng.shared.0acb207bfeba0328296b5d58
  version: 1
  assessment_title: The system must require passwords to not have more than 3 consecutive repeating characters.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    default-passwd-file-etc-default-passwd-collection:
      collection_title: The default passwd file (/etc/default/passwd).
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/default
        filename:
          operation: equals
          datatype: string
          mask: false
          value: passwd
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*MAXREPEATS=(\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-check-system-default-password-maxrepeats-setting:
      test_title: Check the system default password MAXREPEATS setting.
      capability: independent.textfilecontent54
      collection: default-passwd-file-etc-default-passwd-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Greater than or equal to one.
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: '3'
          operation: less than or equal
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-check-system-default-password-maxrepeats-setting
