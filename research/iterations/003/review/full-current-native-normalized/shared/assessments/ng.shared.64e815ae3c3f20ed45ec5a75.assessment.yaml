assessment:
  id: ng.shared.64e815ae3c3f20ed45ec5a75
  version: 1
  assessment_title: Group Policy - Do Not Turn off Background Refresh (Windows 2012)
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Microsoft\Windows\CurrentVersion\Policies\system
        name:
          operation: equals
          datatype: string
          mask: false
          value: DisableBkGndGroupPolicy
      object_title: null
  states:
    state-reg-dword-type-and-value-equals-0:
      state_title: Reg_Dword type and value equals 0
      capability: windows.registry
      state:
        field: value
        value: '0'
        operation: equals
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-verifies-turn-off-background-refresh-group-policy-set-disabled:
      test_title: Verifies 'Turn Off Background Refresh of Group Policy' is set to 'Disabled'
      capability: windows.registry
      object: windows-registry-object
      check_existence: none_exist
      check: all
    test-verifies-disablebkgndgrouppolicy-registry-value-set-0:
      test_title: Verifies 'DisableBkGndGroupPolicy' registry value is set to '0'
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-0
  evaluate:
    any:
    - test: test-verifies-turn-off-background-refresh-group-policy-set-disabled
    - test: test-verifies-disablebkgndgrouppolicy-registry-value-set-0
