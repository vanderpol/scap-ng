assessment:
  id: ng.shared.f046c8d85be5e1364cc3d25a
  version: 1
  assessment_title: The macOS system must enforce on device dictation.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-on-device-dictation-enforce-recommended-object-collection:
      collection_title: os_on_device_dictation_enforce_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\

            .objectForKey(''forceOnDeviceOnlyDictation'').js

            EOS'
  tests:
    test-os-on-device-dictation-enforce-recommended-test:
      test_title: os_on_device_dictation_enforce_recommended_test
      capability: independent.shellcommand
      collection: os-on-device-dictation-enforce-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: os_on_device_dictation_enforce_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: 'true'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-os-on-device-dictation-enforce-recommended-test
