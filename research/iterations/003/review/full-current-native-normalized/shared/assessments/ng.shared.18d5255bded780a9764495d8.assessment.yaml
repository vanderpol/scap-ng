assessment:
  id: ng.shared.18d5255bded780a9764495d8
  version: 1
  assessment_title: Zone information must be preserved when saving attachments.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-explorer-nopreviewpane-setting-collection:
      collection_title: Windows Explorer NoPreviewPane Setting
      capability: windows.ntuser
      select:
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Attachments
        name:
          operation: equals
          datatype: string
          mask: false
          value: SaveZoneInformation
      filters:
      - action: exclude
        match:
          field: enabled
          value: 'false'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: Exclude Disabled Accounts
        capability: windows.ntuser
      - action: exclude
        match:
          field: type
          value:
            variable: empty-value-variable
          operation: equals
          datatype: string
          mask: false
          variable_check: at least one
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: This state filters out all items where the type and value were not collected
        capability: windows.ntuser
  variables:
    empty-value-variable:
      title: Empty value
      kind: constant
      datatype: string
      expression:
        literal: ''
  tests:
    test-zone-information-preserved-when-saving-attachments:
      test_title: Zone information must be preserved when saving attachments.
      capability: windows.ntuser
      collection: windows-explorer-nopreviewpane-setting-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: Value equals 2
        state_capability: windows.ntuser
        state:
          field: value
          value: '2'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-zone-information-preserved-when-saving-attachments
