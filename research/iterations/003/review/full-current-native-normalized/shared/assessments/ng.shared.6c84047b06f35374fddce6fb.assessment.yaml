  version: 1
  assessment_title: The macOS system must require a minimum password length of 14 characters.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to enforce a minimum 14-character password length with the following command:
    /usr/bin/pwpolicy -getaccountpolicies 2> /dev/null | /usr/bin/tail +2 | /usr/bin/xmllint --xpath ''boolean(//*[contains(text(),"policyAttributePassword
    matches ''\''''.{14,}''\''''")])'' - If the result is not "true", this is a finding.'
  inputs: {}
  evidence: []
