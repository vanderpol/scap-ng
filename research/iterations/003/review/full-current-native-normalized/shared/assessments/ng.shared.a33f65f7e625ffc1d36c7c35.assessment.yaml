assessment:
  id: ng.shared.a33f65f7e625ffc1d36c7c35
  version: 1
  assessment_title: All OL 8 world-writable directories must be group-owned by root, sys, bin, or an application group.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The following command will discover and print world-writable directories that are not group-owned by a system
    account, given the assumption that only system accounts have a gid lower than 1000. Run it once for each local partition
    [PART]: $ sudo find [PART] -xdev -type d -perm -0002 -gid +999 -print If there is output, this is a finding.'
  inputs: []
  evidence: []
