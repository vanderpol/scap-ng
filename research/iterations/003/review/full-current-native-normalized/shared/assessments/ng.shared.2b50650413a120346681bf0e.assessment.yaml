    Registry Path: \SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit\ Value Name: ProcessCreationIncludeCmdLine_Enabled
    Value Type: REG_DWORD Value: 0x00000001 (1)'
