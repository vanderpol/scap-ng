  version: 1
  assessment_title: The Cisco router must be configured to enforce password complexity by requiring that at least one numeric
    character be used.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Review the Cisco router configuration to verify that it is compliant with this requirement as shown in the example
    below. aaa new-model ! ! aaa common-criteria policy PASSWORD_POLICY numeric-count 1 If the Cisco router is not configured
    to enforce password complexity by requiring that at least one numeric character be used, this is a finding.
  inputs: []
  evidence: []
