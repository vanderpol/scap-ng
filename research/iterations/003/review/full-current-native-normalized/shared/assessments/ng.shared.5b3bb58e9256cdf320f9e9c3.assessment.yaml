assessment:
  id: ng.shared.5b3bb58e9256cdf320f9e9c3
  version: 1
  assessment_title: The Cisco router must be configured to limit privileges to change the software resident within software
    libraries.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that the router is not configured with a privilege level other than "15" to allow access to the file
    system as shown in the example below. file privilege 10 Note: The default privilege level required for access to the file
    system is "15"; hence, the command file privilege "15" will not be shown in the configuration. If the router is configured
    with a privilege level other than "15" to allow access to the file system, this is a finding.'
  inputs: []
  evidence: []
