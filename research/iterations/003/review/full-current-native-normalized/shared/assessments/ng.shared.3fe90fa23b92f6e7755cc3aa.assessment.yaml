assessment:
  id: ng.shared.3fe90fa23b92f6e7755cc3aa
  version: 1
  assessment_title: Display Shutdown Button
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        name:
          operation: equals
          datatype: string
          value: ShutdownWithoutLogon
      object_title: null
  variables:
    shutdown-allow-system-shut-down-without-having-log-on-variable:
      title: 'Shutdown: Allow System to be Shut Down Without Having to Log On'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: shutdown_allow_system_shutdown_without_having_logon_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: shutdown-allow-system-shut-down-without-having-log-on-variable
          operation: equals
          datatype: int
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-shutdown-allow-system-shutdown-without-having-log-on-set-disabled:
      test_title: '''Shutdown: Allow system to be shutdown without having to log on'' is set to ''Disabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-shutdown-allow-system-shutdown-without-having-log-on-set-disabled
