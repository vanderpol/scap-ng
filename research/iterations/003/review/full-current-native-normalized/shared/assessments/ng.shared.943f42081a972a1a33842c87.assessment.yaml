assessment:
  id: ng.shared.943f42081a972a1a33842c87
  version: 1
  assessment_title: The Ubuntu operating system SSH server must be configured to use only FIPS-validated key exchange algorithms.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    ssh-server-configured-use-only-fips-validated-key-exchange-algorithms-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/ssh/sshd_config
        pattern:
          operation: pattern match
          datatype: string
          value: ^KexAlgorithms\s+ecdh-sha2-nistp256\s*,\s*ecdh-sha2-nistp384\s*,\s*ecdh-sha2-nistp521\s*,\s*diffie-hellman-group-exchange-sha256$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: SSH server must be configured to use only FIPS-validated key exchange algorithms.
  states: {}
  tests:
    test-ssh-server-configured-use-only-fips-validated-key-exchange-algorithms:
      test_title: SSH server must be configured to use only FIPS-validated key exchange algorithms.
      capability: independent.textfilecontent54
      object: ssh-server-configured-use-only-fips-validated-key-exchange-algorithms-object
      check_existence: only_one_exists
      check: all
  evaluate:
    test: test-ssh-server-configured-use-only-fips-validated-key-exchange-algorithms
