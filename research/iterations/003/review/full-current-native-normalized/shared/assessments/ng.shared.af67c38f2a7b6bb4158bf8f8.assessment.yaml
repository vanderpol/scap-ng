assessment:
  id: ng.shared.af67c38f2a7b6bb4158bf8f8
  version: 1
  assessment_title: Ubuntu 24.04 LTS must prevent a user from overriding the disabling of the graphical user interface autorun
    function.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    retrieve-gsettings-writable-org-gnome-desktop-media-handling-autorun-never-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: gsettings writable org.gnome.desktop.media-handling autorun-never
        pattern:
          operation: equals
          datatype: string
          value: .+
      object_title: Retrieve gsettings writable org.gnome.desktop.media-handling autorun-never
  states:
    state-verify-command-returns-false:
      state_title: Verify command returns false
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: 'false'
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-verify-gsettings-writable-org-gnome-desktop-media-handling-autorun-never:
      test_title: Verify gsettings writable org.gnome.desktop.media-handling autorun-never returns false
      capability: independent.shellcommand
      object: retrieve-gsettings-writable-org-gnome-desktop-media-handling-autorun-never-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-verify-command-returns-false
  evaluate:
    test: test-verify-gsettings-writable-org-gnome-desktop-media-handling-autorun-never
