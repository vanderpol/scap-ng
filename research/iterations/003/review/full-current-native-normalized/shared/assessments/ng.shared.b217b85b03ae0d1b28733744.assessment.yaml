assessment:
  id: ng.shared.b217b85b03ae0d1b28733744
  version: 1
  assessment_title: The system must require at least eight characters be changed between the old and new passwords during
    a password change.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    etc-default-passwd-mindiff-setting-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/default/passwd
        pattern:
          operation: pattern match
          datatype: string
          value: ^MINDIFF=(\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: /etc/default/passwd MINDIFF setting
  states:
    state-etc-default-passwd-mindiff-setting-8:
      state_title: /etc/default/passwd MINDIFF setting >= 8
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '8'
        operation: greater than or equal
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-etc-default-passwd-mindiff-setting-8:
      test_title: /etc/default/passwd MINDIFF setting >= 8
      capability: independent.textfilecontent54
      object: etc-default-passwd-mindiff-setting-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-etc-default-passwd-mindiff-setting-8
  evaluate:
    test: test-etc-default-passwd-mindiff-setting-8
