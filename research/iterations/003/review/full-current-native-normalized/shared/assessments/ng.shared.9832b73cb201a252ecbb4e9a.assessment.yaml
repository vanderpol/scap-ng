assessment:
  id: ng.shared.9832b73cb201a252ecbb4e9a
  version: 1
  assessment_title: WN19-MS-000090 - Windows Server 2019 "Deny log on as a batch job" user right on domain-joined member servers
    must be configured to prevent access from highly privileged domain accounts and from unauthenticated access on all systems.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-wmi57-collection:
      collection_title: null
      capability: windows.wmi57
      select:
        namespace:
          operation: equals
          datatype: string
          mask: false
          value: root\cimv2
        wql:
          operation: equals
          datatype: string
          mask: false
          value: SELECT DomainRole FROM win32_computersystem
    windows-userright-collection:
      collection_title: null
      capability: windows.userright
      select:
        userright:
          operation: equals
          datatype: string
          mask: false
          value: SE_DENY_BATCH_LOGON_NAME
  tests:
    test-system-windows-domain-member-server:
      test_title: The system is a Windows Domain Member Server
      capability: windows.wmi57
      collection: windows-wmi57-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Domain Member Server
        state_capability: windows.wmi57
        state:
          field: result
          value:
            record:
            - name: domainrole
              value: '3'
              operation: equals
              datatype: string
              mask: false
              entity_check: all
          operation: equals
          datatype: record
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-deny-log-on-as-batch-job-domain-admins:
      test_title: Deny log on as a batch job - Domain Admins
      capability: windows.userright
      collection: windows-userright-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: null
        state_capability: windows.userright
        state:
          field: trustee_name
          value: ^(?i)(.+\\)?Domain Admins$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-deny-log-on-as-batch-job-enterprise-admins:
      test_title: Deny log on as a batch job - Enterprise Admins
      capability: windows.userright
      collection: windows-userright-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: null
        state_capability: windows.userright
        state:
          field: trustee_name
          value: ^(?i)(.+\\)?Enterprise Admins$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-deny-log-on-as-batch-job-guests:
      test_title: Deny log on as a batch job - Guests
      capability: windows.userright
      collection: windows-userright-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: null
        state_capability: windows.userright
        state:
          field: trustee_name
          value: Guests
          operation: case insensitive equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-system-windows-standalone-server:
      test_title: The system is a Windows Standalone Server
      capability: windows.wmi57
      collection: windows-wmi57-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Standalone Server
        state_capability: windows.wmi57
        state:
          field: result
          value:
            record:
            - name: domainrole
              value: '2'
              operation: equals
              datatype: string
              mask: false
              entity_check: all
          operation: equals
          datatype: record
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    any:
    - all:
      - test: test-system-windows-domain-member-server
      - test: test-deny-log-on-as-batch-job-domain-admins
      - test: test-deny-log-on-as-batch-job-enterprise-admins
      - test: test-deny-log-on-as-batch-job-guests
    - all:
      - test: test-system-windows-standalone-server
      - test: test-deny-log-on-as-batch-job-guests
