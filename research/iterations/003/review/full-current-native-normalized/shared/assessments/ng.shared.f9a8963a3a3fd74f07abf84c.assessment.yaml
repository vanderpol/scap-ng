          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: standard_read_control
          value: 'true'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: standard_write_dac
          value: 'true'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: standard_write_owner
          value: 'true'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: standard_synchronize
          value: 'true'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: generic_read
          value: 'true'
