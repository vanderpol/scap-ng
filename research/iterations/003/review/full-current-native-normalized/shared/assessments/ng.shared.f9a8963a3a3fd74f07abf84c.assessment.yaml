    test-dsa-working-directory-nt-authority-system-has-full-control:
      test_title: 'DSA Working Directory: NT Authority\SYSTEM has full control'
      capability: windows.fileeffectiverights53
      object: files-in-dsa-working-directory-system-permissions-object
