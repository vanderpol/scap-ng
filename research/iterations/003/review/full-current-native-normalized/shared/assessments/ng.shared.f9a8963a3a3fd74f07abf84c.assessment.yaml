assessment:
  id: ng.shared.f9a8963a3a3fd74f07abf84c
  version: 1
  assessment_title: WN16-DC-000070 - Permissions on the Active Directory data files must only allow System and Administrators
    access.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    database-log-files-path-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Services\NTDS\Parameters
        name:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: Database log files path
      object_title: Database log files path
    database-log-files-system-permissions-object:
      capability: windows.fileeffectiverights53
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: database-log-files-path-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(.*)$
        trustee_sid:
          operation: equals
          datatype: string
          mask: false
          value: S-1-5-18
      object_title: Database log files - SYSTEM permissions
    database-log-files-administrators-permissions-object:
      capability: windows.fileeffectiverights53
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: database-log-files-path-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(.*)$
        trustee_sid:
          operation: equals
          datatype: string
          mask: false
          value: S-1-5-32-544
      object_title: Database log files - Administrators permissions
    database-log-files-other-permissions-object:
      capability: windows.fileeffectiverights53
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: database-log-files-path-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(.*)$
        trustee_sid:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
      filters:
      - action: exclude
        state: state-administrators-rights
      - action: exclude
        state: state-local-system-rights
      - action: exclude
        state: state-no-rights
      object_title: Database log files - Other permissions
    dsa-database-file-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Services\NTDS\Parameters
        name:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: DSA Database file
      object_title: DSA Database file
    files-in-same-directory-as-dsa-database-system-permissions-object:
      capability: windows.fileeffectiverights53
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: dsa-database-working-path-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(.*)$
        trustee_sid:
          operation: equals
          datatype: string
          mask: false
          value: S-1-5-18
      object_title: Files in the same directory as the DSA Database - SYSTEM permissions
    files-in-same-directory-as-dsa-database-administrators-permissions-object:
      capability: windows.fileeffectiverights53
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: dsa-database-working-path-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(.*)$
        trustee_sid:
          operation: equals
          datatype: string
          mask: false
          value: S-1-5-32-544
      object_title: Files in the same directory as the DSA Database - Administrators permissions
    files-in-same-directory-as-dsa-database-other-permissions-object:
      capability: windows.fileeffectiverights53
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: dsa-database-working-path-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(.*)$
        trustee_sid:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
      filters:
      - action: exclude
        state: state-administrators-rights
      - action: exclude
        state: state-local-system-rights
      - action: exclude
        state: state-no-rights
      object_title: Files in the same directory as the DSA Database - Other permissions
    dsa-working-directory-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Services\NTDS\Parameters
        name:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: DSA Working Directory
      object_title: DSA Working Directory
    files-in-dsa-working-directory-system-permissions-object:
      capability: windows.fileeffectiverights53
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: dsa-working-directory-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(.*)$
        trustee_sid:
          operation: equals
          datatype: string
          mask: false
          value: S-1-5-18
      object_title: Files in the DSA Working Directory - SYSTEM permissions
    files-in-dsa-working-directory-administrators-permissions-object:
      capability: windows.fileeffectiverights53
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: dsa-working-directory-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(.*)$
        trustee_sid:
          operation: equals
          datatype: string
          mask: false
          value: S-1-5-32-544
      object_title: Files in the DSA Working Directory - Administrators permissions
    files-in-dsa-working-directory-other-permissions-object:
      capability: windows.fileeffectiverights53
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          variable_check: all
          value:
            variable: dsa-working-directory-variable
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: ^(.*)$
        trustee_sid:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
      filters:
      - action: exclude
        state: state-administrators-rights
      - action: exclude
        state: state-local-system-rights
      - action: exclude
        state: state-no-rights
      object_title: Files in the DSA Working Directory - Other permissions
  variables:
    database-log-files-path-variable:
      title: Database log files path
      kind: local
      datatype: string
      expression:
        values:
          object: database-log-files-path-object
          field: value
    dsa-database-working-path-variable:
      title: DSA Database working path
      kind: local
      datatype: string
      expression:
        regex_capture:
          value:
            values:
              object: dsa-database-file-object
              field: value
          pattern: ^(.+)\\
    dsa-working-directory-variable:
      title: DSA Working Directory
      kind: local
      datatype: string
      expression:
        values:
          object: dsa-working-directory-object
          field: value
  states:
