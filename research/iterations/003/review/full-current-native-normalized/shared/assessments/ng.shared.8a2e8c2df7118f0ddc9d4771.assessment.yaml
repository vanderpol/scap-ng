assessment:
  id: ng.shared.8a2e8c2df7118f0ddc9d4771
  version: 1
  assessment_title: The operating system must require individuals to be authenticated with an individual authenticator prior
    to using a group authenticator.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the root user is configured as a role, rather than a normal user. # userattr type root If the command
    does not return the word "role", this is a finding. Verify at least one local user has been assigned the root role. #
    grep ''[:;]roles=root[^;]*'' /etc/user_attr If no lines are returned, or no users are permitted to assume the root role,
    this is a finding.'
  inputs: []
  evidence: []
