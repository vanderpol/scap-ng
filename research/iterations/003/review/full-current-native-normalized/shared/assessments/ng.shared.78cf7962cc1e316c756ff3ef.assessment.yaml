assessment:
  id: ng.shared.78cf7962cc1e316c756ff3ef
  version: 1
  assessment_title: The macOS system must configure Apple System Log (ASL) files to mode 640 or less permissive.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured with ASL files to mode 640 or less permissive with the following command:
    /usr/bin/stat -f ''%A:%N'' $(/usr/bin/grep -e ''^>'' /etc/asl.conf /etc/asl/* | /usr/bin/awk ''{ print $2 }'') 2> /dev/null
    | /usr/bin/awk ''!/640/{print $1}'' | /usr/bin/wc -l | /usr/bin/tr -d '' '' If the result is not "0", this is a finding.'
  inputs: {}
  evidence: []
