assessment:
  id: ng.shared.d2093c9f7d9eefde0369a30c
  version: 1
  assessment_title: The macOS system must cover or disable the built-in or attached camera when not in use.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-camera-disable-recommended-object-collection:
      collection_title: os_camera_disable_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\

            .objectForKey(''allowCamera'').js

            EOS'
  tests:
    test-os-camera-disable-recommended-test:
      test_title: os_camera_disable_recommended_test
      capability: independent.shellcommand
      collection: os-camera-disable-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: os_camera_disable_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: 'false'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-os-camera-disable-recommended-test
