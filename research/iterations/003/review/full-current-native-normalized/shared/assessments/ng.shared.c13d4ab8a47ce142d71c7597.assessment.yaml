assessment:
  id: ng.shared.c13d4ab8a47ce142d71c7597
  version: 1
  assessment_title: The SUSE operating system must reauthenticate users when changing authenticators, roles, or escalating
    privileges.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that the SUSE operating system requires reauthentication when changing authenticators, roles, or escalating
    privileges. Check that "/etc/sudoers" has no occurrences of "NOPASSWD" or "!authenticate" with the following command:
    > sudo egrep -i ''(nopasswd|!authenticate)'' /etc/sudoers If any uncommented lines containing "!authenticate", or "NOPASSWD"
    are returned and active accounts on the system have valid passwords, this is a finding.'
  inputs: {}
  evidence: []
