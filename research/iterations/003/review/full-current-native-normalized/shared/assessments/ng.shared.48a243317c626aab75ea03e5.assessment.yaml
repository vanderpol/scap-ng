assessment:
  id: ng.shared.48a243317c626aab75ea03e5
  version: 1
  assessment_title: The macOS system must be configured to use an authorized time server.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to use an authorized time server with the following command: /usr/bin/osascript
    -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.MCX'')\ .objectForKey(''timeServer'').js EOS
    If the result is not an authoritative time server that is synchronized with redundant USNO time servers as designated
    for the appropriate DOD network, this is a finding.'
  inputs: {}
  evidence: []
