assessment:
  id: ng.shared.643562ca4e24894388a44673
  version: 1
  assessment_title: UBTU-22-612035 - Ubuntu 22.04 LTS for PKI-based authentication, must implement a local cache of revocation
    data in case of the inability to access revocation information via the network.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    check-what-cert-policy-set-in-etc-pam-pkcs11-pam-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/pam_pkcs11/pam_pkcs11.conf
        pattern:
          operation: pattern match
          datatype: string
          value: ^[\s]*cert_policy[ \t]+=[ \t]+([\w\,"' ]+);\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: Check what cert_policy is set to in /etc/pam_pkcs11/pam_pkcs11.conf
  states:
    state-the-crl-auto-option-is-present-in-the-collected-string:
      state_title: The crl_auto option is present in the collected string
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^["']*crl_auto["']*$|^["']*crl_auto["',\s]|["',\s]crl_auto["',\s]|["',\s]crl_auto["']*$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-the-crl-offline-option-is-present-in-the-collected-strin:
      state_title: The crl_offline option is present in the collected string
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: ^["']*crl_offline["']*$|^["']*crl_offline["',\s]|["',\s]crl_offline["',\s]|["',\s]crl_offline["']*$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-check-pam-pkcs11-conf-has-all-cert-policy-set-include:
      test_title: Check pam_pkcs11.conf has all cert_policy set to include the crl_auto or crl_offline option
      capability: independent.textfilecontent54
      object: check-what-cert-policy-set-in-etc-pam-pkcs11-pam-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-the-crl-auto-option-is-present-in-the-collected-string
      - state-the-crl-offline-option-is-present-in-the-collected-strin
  evaluate:
    test: test-check-pam-pkcs11-conf-has-all-cert-policy-set-include
