assessment:
  id: ng.shared.70b06672aa8a6a20abfdb5ed
  version: 1
  assessment_title: The Oracle Linux operating system must disable the graphical user interface automounter unless required.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: If the operating system does not have a graphical user interface installed, this requirement is Not Applicable.
    Verify the operating system disables the ability to automount devices in a graphical user interface. Note: The example
    below is using the database "local" for the system, so the path is "/etc/dconf/db/local.d". This path must be modified
    if a database other than "local" is being used. Check to see if automounter service is disabled with the following commands:
    # cat /etc/dconf/db/local.d/00-No-Automount [org/gnome/desktop/media-handling] automount=false automount-open=false autorun-never=true
    If the output does not match the example above, this is a finding. # cat /etc/dconf/db/local.d/locks/00-No-Automount /org/gnome/desktop/media-handling/automount
    /org/gnome/desktop/media-handling/automount-open /org/gnome/desktop/media-handling/autorun-never If the output does not
    match the example, this is a finding.'
  inputs: {}
  evidence: []
