assessment:
  id: ng.shared.be889fd9931ccea01fde4cb1
  version: 1
  assessment_title: Password Uniqueness
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    password-policy-collection:
      collection_title: Password policy
      capability: windows.passwordpolicy
  variables:
    enforce-password-history-variable:
      title: Enforce Password History
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: password_enforce_history_var
        validation:
          alternatives:
          - literal: '5'
            hint: 5_passwords
          - literal: '24'
            hint: 24_passwords
  tests:
    test-enforce-password-history-set-5-passwords-or-more:
      test_title: '''Enforce password history'' is set to ''5'' passwords or more'
      capability: windows.passwordpolicy
      collection: password-policy-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Password History Length is greater than or equal to variable
        state_capability: windows.passwordpolicy
        state:
          field: password_hist_len
          value:
            variable: enforce-password-history-variable
          operation: greater than or equal
          datatype: int
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-enforce-password-history-set-5-passwords-or-more
