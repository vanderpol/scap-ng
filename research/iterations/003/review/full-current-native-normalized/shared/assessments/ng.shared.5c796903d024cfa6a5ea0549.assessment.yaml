  assessment_title: The macOS system must disable Bonjour multicast.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable Bonjour multicast with the following command: /usr/bin/osascript
    -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.mDNSResponder'')\ .objectForKey(''NoMulticastAdvertisements'').js
    EOS If the result is not "true", this is a finding.'
