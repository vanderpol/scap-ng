assessment:
  id: ng.shared.3a78e5d63191fe16b82422a4
  version: 1
  assessment_title: Lockout Duration
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    lockout-policy-object:
      capability: windows.lockoutpolicy
      object_title: Lockout policy
  states:
    state-lockout-duration-equals-1:
      state_title: Lockout Duration equals -1
      capability: windows.lockoutpolicy
      state:
        field: lockout_duration
        value: '0'
        operation: less than or equal
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
    state-lockout-duration-is-forever-option2:
      state_title: lockout duration is forever,option2
      capability: windows.lockoutpolicy
      state:
        field: lockout_duration
        value: '4294967295'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
    state-lockout-threshold-is-greater-than-0:
      state_title: Lockout Threshold is greater than 0
      capability: windows.lockoutpolicy
      state:
        field: lockout_threshold
        value: '0'
        operation: greater than
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
    state-lockout-duration-is-greater-than-or-equal-to-15-minutes:
      state_title: Lockout Duration is greater than or equal to 15 minutes
      capability: windows.lockoutpolicy
      state:
        field: lockout_duration
        value: '900'
        operation: greater than or equal
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-account-lockout-duration-set-0:
      test_title: '''Account lockout duration'' is set to ''0'''
      capability: windows.lockoutpolicy
      object: lockout-policy-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-lockout-duration-equals-1
      - state-lockout-duration-is-forever-option2
    test-account-lockout-threshold-not-set-0:
      test_title: '''Account lockout threshold'' is not set to ''0'''
      capability: windows.lockoutpolicy
      object: lockout-policy-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-lockout-threshold-is-greater-than-0
    test-account-lockout-duration-set-15-or-greater:
      test_title: '''Account lockout duration'' is set to ''15 or greater'''
      capability: windows.lockoutpolicy
      object: lockout-policy-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-lockout-duration-is-greater-than-or-equal-to-15-minutes
  evaluate:
    any:
    - all:
      - test: test-account-lockout-duration-set-0
      - test: test-account-lockout-threshold-not-set-0
    - all:
      - test: test-account-lockout-duration-set-15-or-greater
      - test: test-account-lockout-threshold-not-set-0
