assessment:
  id: ng.shared.4e5bbfcd9b02d321dbe67d35
  version: 1
  assessment_title: Prevent Windows Update for device driver search
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: Software\Policies\Microsoft\Windows\DriverSearching
        name:
          operation: equals
          datatype: string
          value: SearchOrderConfig
      object_title: null
  variables:
    specify-search-order-device-driver-source-locations-variable:
      title: Specify Search Order for device driver source locations
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: specify_search_order_for_device_driver_source_locations_var
        validation:
          alternatives:
          - literal: '0'
            hint: do_not_search_windows_update
          - literal: '1'
            hint: search_windows_update_first
          - literal: '2'
            hint: search_windows_update_last
  states:
    state-reg-dword-type-and-value-equals-variable:
      state_title: Reg_Dword type and value equals variable
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value:
            variable: specify-search-order-device-driver-source-locations-variable
          operation: equals
          datatype: int
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-specify-search-order-device-driver-source-locations-set-enabled-do:
      test_title: '''Specify search order for device driver source locations'' is set to ''Enabled: Do not search Windows
        Update'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-variable
  evaluate:
    test: test-specify-search-order-device-driver-source-locations-set-enabled-do
