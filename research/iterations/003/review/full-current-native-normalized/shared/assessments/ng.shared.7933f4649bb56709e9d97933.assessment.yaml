assessment:
  id: ng.shared.7933f4649bb56709e9d97933
  version: 1
  assessment_title: UBTU-18-010139 - The Ubuntu operating system must have system commands set to a mode of 0755 or less permissive.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    all-files-in-system-command-directories-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          variable_check: at least one
          value:
            variable: system-command-directories-variable
        filename:
          operation: pattern match
          datatype: string
          value: .*
      object_title: All files in system command directories
    all-files-in-system-command-directories-less-symbolic-links-object:
      capability: unix.file
      set:
        operator: union
        members:
        - object: all-files-in-system-command-directories-object
        filters:
        - action: exclude
          state: state-symbolic-links
      object_title: All files in system command directories, less symbolic links
  variables:
    system-command-directories-variable:
      title: system command directories
      kind: constant
      datatype: string
      expression:
        literal:
        - /bin
        - /sbin
        - /usr/bin
        - /usr/sbin
        - /usr/local/bin
        - /usr/local/sbin
  states:
    state-mode-755-or-less-permissive:
      state_title: Mode 755 or less permissive
      capability: unix.file
      state:
        all:
        - field: gwrite
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
        - field: owrite
          value: 'false'
          operation: equals
          datatype: boolean
          entity_check: all
          entity_existence: at_least_one_exists
    state-symbolic-links:
      state_title: symbolic links
      capability: unix.file
      state:
        field: type
        value: symbolic link
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-command-files-have-mode-755-or-less-permissive:
      test_title: System command files have mode 755 or less permissive
      capability: unix.file
      object: all-files-in-system-command-directories-less-symbolic-links-object
      check_existence: all_exist
      check: all
      states:
      - state-mode-755-or-less-permissive
  evaluate:
    test: test-system-command-files-have-mode-755-or-less-permissive
