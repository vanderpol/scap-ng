assessment:
  id: ng.shared.f7994389fd97bdf80f641c39
  version: 1
  assessment_title: Exchange connectivity logging must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    run-get-transportservice-command-determine-if-connectivitylogenabled-set-true-collection:
      collection_title: Run Get-TransportService command to determine if ConnectivityLogEnabled is set to true.
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: add-pssnapin Microsoft.Exchange.Management.Powershell.Snapin;Get-TransportService | Select-Object -Property
            Name, Identity, ConnectivityLogEnabled | Format-Table -HideTableHeaders
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: \w
      behaviors:
        error_if_stderr_exists: 'true'
  tests:
    test-if-value-connectivitylogenabled-not-set-true-this-finding:
      test_title: If the value of ConnectivityLogEnabled is not set to True, this is a finding.
      capability: independent.shellcommand
      collection: run-get-transportservice-command-determine-if-connectivitylogenabled-set-true-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Verify value is True
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: (?i)true$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-if-value-connectivitylogenabled-not-set-true-this-finding
