assessment:
  id: ng.shared.83d6ec029237f98ffdc86059
  version: 1
  assessment_title: WN10-CC-000365 - Windows 10 must be configured to prevent Windows apps from being activated by voice while
    the system is locked.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SOFTWARE\Policies\Microsoft\Windows\AppPrivacy
        name:
          operation: equals
          datatype: string
          value: LetAppsActivateWithVoice
      object_title: null
    windows-registry-object-2:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SOFTWARE\Policies\Microsoft\Windows\AppPrivacy
        name:
          operation: equals
          datatype: string
          value: LetAppsActivateWithVoiceAboveLock
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '2'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-let-windows-apps-activate-voice-set-enabled-default-all-apps:
      test_title: '''Let Windows apps activate with voice'' is set to ''Enabled'' with ''Default for all Apps'' set to ''Force
        Deny'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
    test-let-windows-apps-activate-voice-while-system-locked-set-enabled:
      test_title: '''Let Windows apps activate with voice while the system is locked'' is set to ''Enabled'' with ''Default
        for all Apps'' set to ''Force Deny'''
      capability: windows.registry
      object: windows-registry-object-2
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    any:
    - test: test-let-windows-apps-activate-voice-set-enabled-default-all-apps
    - test: test-let-windows-apps-activate-voice-while-system-locked-set-enabled
