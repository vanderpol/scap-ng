assessment:
  id: ng.shared.136acd096850bc32ac1e9ef5
  version: 1
  assessment_title: The macOS system must provide an immediate real-time alert to the System Administrator (SA) and Information
    System Security Officer (ISSO), at a minimum, of all audit failure events requiring real-time alerts.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    audit-settings-failure-notify-recommended-object-collection:
      collection_title: audit_settings_failure_notify_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/bin/grep "logger -s -p" /etc/security/audit_warn
  tests:
    test-audit-settings-failure-notify-recommended-test:
      test_title: audit_settings_failure_notify_recommended_test
      capability: independent.shellcommand
      collection: audit-settings-failure-notify-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: audit_settings_failure_notify_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: .*
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-audit-settings-failure-notify-recommended-test
