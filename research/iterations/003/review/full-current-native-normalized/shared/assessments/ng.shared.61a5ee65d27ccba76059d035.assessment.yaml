  version: 1
  assessment_title: The macOS system must disable iCloud Document Sync.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable iCloud Document Sync with the following command: /usr/bin/osascript
    -l JavaScript << EOS $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\ .objectForKey(''allowCloudDocumentSync'').js
    EOS If the result is not "false", this is a finding.'
  inputs: {}
  evidence: []
