assessment:
  id: ng.shared.1426e2b7e0ddf4bf545e635c
  version: 1
  assessment_title: The SUSE operating system must have directories that contain system commands group-owned by root.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the system commands directories are group-owned by root: /bin /sbin /usr/bin /usr/sbin /usr/local/bin
    /usr/local/sbin Run the check with the following command: > sudo find -L /bin /sbin /usr/bin /usr/sbin /usr/local/bin
    /usr/local/sbin ! -group root -type d -exec stat -c "%n %G" ''{}'' \; If any system commands directories are returned
    that are not Set Group ID up on execution (SGID) files and owned by a privileged account, this is a finding.'
  inputs: []
  evidence: []
