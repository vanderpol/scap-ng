  version: 1
  assessment_title: The macOS system must configure audit_control group to wheel.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured with the audit_control group to wheel with the following command: /bin/ls
    -dn /etc/security/audit_control | /usr/bin/awk ''{print $4}'' If the result is not "0", this is a finding.'
  inputs: []
  evidence: []
