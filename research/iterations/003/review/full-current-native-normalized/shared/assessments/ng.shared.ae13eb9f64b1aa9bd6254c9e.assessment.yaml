assessment:
  id: ng.shared.ae13eb9f64b1aa9bd6254c9e
  version: 1
  assessment_title: UBTU-22-211015 - Ubuntu 22.04 LTS must disable the x86 Ctrl-Alt-Delete key sequence.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-symlink-object:
      capability: unix.symlink
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/systemd/system/ctrl-alt-del.target
      object_title: null
  states:
    state-unix-symlink:
      state_title: null
      capability: unix.symlink
      state:
        field: canonical_path
        value: /dev/null
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-ctrl-alt-del-target-unit-masked:
      test_title: The ctrl-alt-del.target unit is masked.
      capability: unix.symlink
      object: unix-symlink-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-unix-symlink
  evaluate:
    test: test-ctrl-alt-del-target-unit-masked
