assessment:
  id: ng.shared.9d897a109411a8b48935b565
  version: 1
  assessment_title: The Oracle Linux operating system must not respond to Internet Protocol version 4 (IPv4) Internet Control
    Message Protocol (ICMP) echoes sent to a broadcast address.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the system does not respond to IPv4 ICMP echoes sent to a broadcast address. # grep -r net.ipv4.icmp_echo_ignore_broadcasts
    /run/sysctl.d/* /etc/sysctl.d/* /usr/local/lib/sysctl.d/* /usr/lib/sysctl.d/* /lib/sysctl.d/* /etc/sysctl.conf 2> /dev/null
    If "net.ipv4.icmp_echo_ignore_broadcasts" is not configured in the /etc/sysctl.conf file or in any of the other sysctl.d
    directories, is commented out, or does not have a value of "1", this is a finding. Check that the operating system implements
    the "icmp_echo_ignore_broadcasts" variable with the following command: # /sbin/sysctl -a | grep net.ipv4.icmp_echo_ignore_broadcasts
    net.ipv4.icmp_echo_ignore_broadcasts = 1 If the returned line does not have a value of "1", this is a finding. If conflicting
    results are returned, this is a finding.'
  inputs: []
  evidence: []
