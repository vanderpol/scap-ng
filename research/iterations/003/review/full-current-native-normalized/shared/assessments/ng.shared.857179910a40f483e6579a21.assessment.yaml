assessment:
  id: ng.shared.857179910a40f483e6579a21
  version: 1
  assessment_title: Audit - User Account Management - Success
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-auditeventpolicysubcategories-collection:
      collection_title: null
      capability: windows.auditeventpolicysubcategories
  tests:
    test-audit-user-account-management-success-only:
      test_title: Audit - User Account Management - Success only
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Audit - User Account Management - Success only
        state_capability: windows.auditeventpolicysubcategories
        state:
          field: user_account_management
          value: AUDIT_SUCCESS
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-audit-user-account-management-success-failure:
      test_title: Audit - User Account Management - Success and Failure
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Audit - User Account Management - Success and Failure
        state_capability: windows.auditeventpolicysubcategories
        state:
          field: user_account_management
          value: AUDIT_SUCCESS_FAILURE
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    any:
    - test: test-audit-user-account-management-success-only
    - test: test-audit-user-account-management-success-failure
