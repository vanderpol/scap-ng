  version: 1
  assessment_title: The Oracle Linux operating system must not have the Trivial File Transfer Protocol (TFTP) server package
    installed if not required for operational support.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify a TFTP server has not been installed on the system. Check to see if a TFTP server has been installed
    with the following command: # yum list installed tftp-server tftp-server-0.49-9.el7.x86_64.rpm If TFTP is installed and
    the requirement for TFTP is not documented with the ISSO, this is a finding.'
  inputs: {}
  evidence: []
