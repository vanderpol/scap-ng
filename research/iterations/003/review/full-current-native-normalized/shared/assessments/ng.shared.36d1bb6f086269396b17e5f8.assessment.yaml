  version: 1
  assessment_title: The OL 8 "/var/log" directory must have mode 0755 or less permissive.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that the "/var/log" directory has a mode of "0755" or less with the following command: $ sudo stat -c
    "%a %n" /var/log 755 /var/log If a value of "0755" or less permissive is not returned, this is a finding.'
  inputs: []
  evidence: []
