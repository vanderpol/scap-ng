assessment:
  id: ng.shared.466962d23a20cfaef5e8fc71
  version: 1
  assessment_title: The operating system must protect against an individual falsely denying having performed a particular
    action. In order to do so the system must be configured to send audit records to a remote audit server.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    os-information-object:
      capability: unix.uname
      object_title: OS information
    etc-zones-index-object:
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/zones/index
      object_title: /etc/zones/index
    etc-zones-index-global-entry-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/zones/index
        pattern:
          operation: pattern match
          datatype: string
          value: '^global:'
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: /etc/zones/index global entry
    var-share-zones-index-json-object:
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          value: /var/share/zones/index.json
      object_title: /var/share/zones/index.json
    var-share-zones-index-json-path-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /var/share/zones/index.json
        pattern:
          operation: pattern match
          datatype: string
          value: '"path":\s+"/"'
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: /var/share/zones/index.json 'path:/'
    audit-warn-entry-in-etc-mail-aliases-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/mail/aliases
        pattern:
          operation: pattern match
          datatype: string
          value: ^audit_warn:\s*\S+\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: The audit_warn entry in /etc/mail/aliases.
  states:
    state-11-3-or-less:
      state_title: 11.3 or less.
      capability: unix.uname
      state:
        field: os_version
        value: ^11($|\.[0-3]\b)
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-solaris-less-than-11-4:
      test_title: Solaris (less than) 11.4
      capability: unix.uname
      object: os-information-object
      check_existence: all_exist
      check: all
      states:
      - state-11-3-or-less
    test-etc-zones-index-does-not-exist:
      test_title: /etc/zones/index does not exist
      capability: unix.file
      object: etc-zones-index-object
      check_existence: none_exist
      check: all
    test-etc-zones-index-contains-global:
      test_title: /etc/zones/index contains global
      capability: independent.textfilecontent54
      object: etc-zones-index-global-entry-object
      check_existence: at_least_one_exists
      check: all
    test-var-share-zones-index-json-does-not-exist:
      test_title: /var/share/zones/index.json does not exist
      capability: unix.file
      object: var-share-zones-index-json-object
      check_existence: none_exist
      check: all
    test-var-share-zones-index-json-does-not-contain-path:
      test_title: /var/share/zones/index.json does not contain 'path:/'
      capability: independent.textfilecontent54
      object: var-share-zones-index-json-path-object
      check_existence: none_exist
      check: all
    test-there-audit-warn-entry-listed-in-etc-mail-aliases:
      test_title: There must be an audit_warn entry listed in /etc/mail/aliases.
      capability: independent.textfilecontent54
      object: audit-warn-entry-in-etc-mail-aliases-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    any:
    - not:
        all:
        - any:
          - not:
              test: test-solaris-less-than-11-4
          - any:
            - test: test-etc-zones-index-does-not-exist
            - test: test-etc-zones-index-contains-global
        - any:
          - test: test-solaris-less-than-11-4
          - any:
            - test: test-var-share-zones-index-json-does-not-exist
            - test: test-var-share-zones-index-json-does-not-contain-path
    - test: test-there-audit-warn-entry-listed-in-etc-mail-aliases
