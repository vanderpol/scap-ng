assessment:
  id: ng.shared.a3cb29a7dd28b17bf574fa69
  version: 1
  assessment_title: Direct logins must not be permitted to shared, default, application, or utility accounts.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The Audit Review profile is required. This check applies to the global zone only. Determine the zone that you
    are currently securing. # zonename If the command output is "global", this check applies. Use the "auditreduce" command
    to check for multiple accesses to an account # auditreduce -c lo -u [shared_user_name] | praudit -l If users log directly
    into accounts, rather than using the "su" command from their own named account to access them, this is a finding. Also,
    ask the SA or the IAO if shared accounts are logged into directly or if users log into an individual account and switch
    user to the shared account.'
  inputs: []
  evidence: []
