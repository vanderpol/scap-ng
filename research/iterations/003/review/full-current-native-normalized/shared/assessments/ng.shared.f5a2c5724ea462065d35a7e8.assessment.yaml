assessment:
  id: ng.shared.f5a2c5724ea462065d35a7e8
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that when passwords are changed the number of
    repeating characters of the same character class must not be more than four characters.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The "maxclassrepeat" option sets the maximum number of allowed same consecutive characters in the same class
    in the new password. Check for the value of the "maxclassrepeat" option in "/etc/security/pwquality.conf" with the following
    command: $ sudo grep maxclassrepeat /etc/security/pwquality.conf maxclassrepeat = 4 If the value of "maxclassrepeat" is
    set to "0", more than "4" or is commented out, this is a finding.'
  inputs: []
  evidence: []
