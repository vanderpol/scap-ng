assessment:
  id: ng.shared.2d289e38442d9214352b170a
  version: 1
  assessment_title: The macOS system must disable FaceTime.app.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable FaceTime.app with the following command: /usr/bin/osascript
    -l JavaScript << EOS function run() { let pref1 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess.new'')\
    .objectForKey(''familyControlsEnabled'')) let pathlist = $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess.new'')\
    .objectForKey(''pathBlackList'').js for ( let app in pathlist ) { if ( ObjC.unwrap(pathlist[app]) == "/Applications/FaceTime.app"
    && pref1 == true ){ return("true") } } return("false") } EOS If the result is not "true", this is a finding.'
  inputs: []
  evidence: []
