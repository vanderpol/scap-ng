assessment:
  id: ng.shared.48ae63d334f180aae86418d5
  version: 1
  assessment_title: The Cisco router must be configured to require that when a password is changed, the characters are changed
    in at least eight of the positions within the password.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Review the Cisco router configuration to verify that it is compliant with this requirement as shown in the example
    below. aaa new-model ! ! aaa common-criteria policy PASSWORD_POLICY char-changes 8 If the Cisco router is not configured
    to require that when a password is changed, the characters are changed in at least eight of the positions within the password,
    this is a finding.
  inputs: []
  evidence: []
