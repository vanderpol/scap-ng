assessment:
  id: ng.shared.43151dac0723f7049da85602
  version: 1
  assessment_title: AZLX-23-002445 - Amazon Linux 2023 must enable the SELinux targeted policy.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    sys-fs-selinux-object:
      capability: linux.partition
      select:
        mount_point:
          operation: equals
          datatype: string
          value: /sys/fs/selinux
      object_title: /sys/fs/selinux
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/selinux/config
        pattern:
          operation: pattern match
          datatype: string
          value: ^\s*SELINUXTYPE\s*=\s*(\w+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
  states:
    state-linux-partition:
      state_title: null
      capability: linux.partition
      state:
        field: fs_type
        value: selinuxfs
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-independent-textfilecontent54:
      state_title: null
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: targeted
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-selinux-active:
      test_title: selinux is active
      capability: linux.partition
      object: sys-fs-selinux-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-linux-partition
    test-etc-selinux-config-selinuxtype-targeted:
      test_title: '/etc/selinux/config: SELINUXTYPE=targeted'
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-independent-textfilecontent54
  evaluate:
    all:
    - test: test-selinux-active
    - test: test-etc-selinux-config-selinuxtype-targeted
