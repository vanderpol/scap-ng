assessment:
  id: ng.shared.9a4c9d96b3813caa0b5ec98b
  version: 1
  assessment_title: The built-in Windows password complexity policy must be enabled.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy
    >> Computer Configuration >> Windows Settings >> Security Settings >> Account Policies >> Password Policy. If the value
    for "Password must meet complexity requirements" is not set to "Enabled", this is a finding. Note: If an external password
    filter is in use that enforces all 4 character types and requires this setting be set to "Disabled", this would not be
    considered a finding. If this setting does not affect the use of an external password filter, it must be enabled for fallback
    purposes.'
  inputs: []
  evidence: []
