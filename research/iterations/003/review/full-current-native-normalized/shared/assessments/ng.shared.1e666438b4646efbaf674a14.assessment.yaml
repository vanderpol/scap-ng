assessment:
  id: ng.shared.1e666438b4646efbaf674a14
  version: 1
  assessment_title: OL09-00-002064 - OL 9 must mount /var/log/audit with the nodev option.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-partition-collection:
      collection_title: null
      capability: linux.partition
      select:
        mount_point:
          operation: equals
          datatype: string
          mask: false
          value: /var/log/audit
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/fstab
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*[^#\s]+\s+/var/log/audit\s+\S+\s+(\S+)\s+\S+\s+\S+\s*$
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
    independent-variable-collection:
      collection_title: null
      capability: independent.variable
      select:
        var_ref:
          operation: equals
          datatype: string
          mask: false
          value:
            variable: mount-options-var-log-audit-in-etc-fstab-variable
  variables:
    mount-options-var-log-audit-in-etc-fstab-variable:
      title: Mount options for /var/log/audit in /etc/fstab
      kind: local
      datatype: string
      expression:
        split:
          value:
            values:
              collection: independent-textfilecontent54-collection
              field: subexpression
          delimiter: ','
  tests:
    test-var-log-audit-mounted-nodev-option:
      test_title: /var/log/audit is mounted with the nodev option
      capability: linux.partition
      collection: linux-partition-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: linux.partition
        state:
          field: mount_options
          value: nodev
          operation: equals
          datatype: string
          mask: false
          entity_check: at least one
          entity_existence: at_least_one_exists
    test-var-log-audit-configured-nodev-option-in-etc-fstab:
      test_title: /var/log/audit is configured with the nodev option in /etc/fstab
      capability: independent.variable
      collection: independent-variable-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: independent.variable
        state:
          field: value
          value: nodev
          operation: equals
          datatype: string
          mask: false
          entity_check: at least one
          entity_existence: at_least_one_exists
    test-var-log-audit-configured-in-etc-fstab:
      test_title: /var/log/audit is configured in /etc/fstab
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    all:
    - test: test-var-log-audit-mounted-nodev-option
    - test: test-var-log-audit-configured-nodev-option-in-etc-fstab
    - test: test-var-log-audit-configured-in-etc-fstab
