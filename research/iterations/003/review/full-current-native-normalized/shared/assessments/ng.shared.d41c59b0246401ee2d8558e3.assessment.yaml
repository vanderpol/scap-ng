assessment:
  id: ng.shared.d41c59b0246401ee2d8558e3
  version: 1
  assessment_title: The Oracle Linux operating system must audit all uses of the gpasswd command.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system generates audit records when successful/unsuccessful attempts to use the "gpasswd"
    command occur. Check the file system rule in "/etc/audit/audit.rules" with the following command: $ sudo grep -w "/usr/bin/gpasswd"
    /etc/audit/audit.rules -a always,exit -F path=/usr/bin/gpasswd -F perm=x -F auid>=1000 -F auid!=unset -k privileged-passwd
    If the command does not return any output, this is a finding.'
  inputs: []
  evidence: []
