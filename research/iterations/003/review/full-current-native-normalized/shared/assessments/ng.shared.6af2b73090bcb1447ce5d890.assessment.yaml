assessment:
  id: ng.shared.6af2b73090bcb1447ce5d890
  version: 1
  assessment_title: The macOS system must limit SSHD to FIPS-compliant connections.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    os-sshd-fips-compliant-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: zsh
        command:
          operation: equals
          datatype: string
          value: "fips_sshd_config=(\"Ciphers aes128-gcm@openssh.com\" \"HostbasedAcceptedAlgorithms ecdsa-sha2-nistp256,ecdsa-sha2-nistp256-cert-v01@openssh.com\"\
            \ \"HostKeyAlgorithms ecdsa-sha2-nistp256-cert-v01@openssh.com,sk-ecdsa-sha2-nistp256-cert-v01@openssh.com,ecdsa-sha2-nistp256,sk-ecdsa-sha2-nistp256@openssh.com\"\
            \ \"KexAlgorithms ecdh-sha2-nistp256\" \"MACs hmac-sha2-256-etm@openssh.com,hmac-sha2-256\" \"PubkeyAcceptedAlgorithms\
            \ ecdsa-sha2-nistp256,ecdsa-sha2-nistp256-cert-v01@openssh.com,sk-ecdsa-sha2-nistp256-cert-v01@openssh.com\" \"\
            CASignatureAlgorithms ecdsa-sha2-nistp256,sk-ecdsa-sha2-nistp256@openssh.com\")\ntotal=0\nfor config in $fips_sshd_config;\
            \ do\n  total=$(expr $(/usr/sbin/sshd -G | /usr/bin/grep -i -c \"$config\") + $total)\ndone\n\necho $total"
      object_title: os_sshd_fips_compliant_recommended_object
  states:
    state-os-sshd-fips-compliant-recommended-state:
      state_title: os_sshd_fips_compliant_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: '7'
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-os-sshd-fips-compliant-recommended-test:
      test_title: os_sshd_fips_compliant_recommended_test
      capability: independent.shellcommand
      object: os-sshd-fips-compliant-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-os-sshd-fips-compliant-recommended-state
  evaluate:
    test: test-os-sshd-fips-compliant-recommended-test
