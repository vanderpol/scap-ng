assessment:
  id: ng.shared.300f85825529ab71b78891e0
  version: 1
  assessment_title: UBTU-22-213020 - Ubuntu 22.04 LTS must implement address space layout randomization to protect its memory
    from unauthorized code execution.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    unix-sysctl-collection:
      collection_title: null
      capability: unix.sysctl
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: kernel.randomize_va_space
    admin-sysctl-configuration-files-kernel-randomize-va-space-collection:
      collection_title: admin sysctl configuration files - kernel.randomize_va_space
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/sysctl.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*kernel\.randomize_va_space\s*=\s*(\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    system-sysctl-configuration-files-kernel-randomize-va-space-collection:
      collection_title: system sysctl configuration files - kernel.randomize_va_space
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/sysctl.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*kernel\.randomize_va_space\s*=\s*(\d+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-kernel-randomize-va-space-setting-in-kernel-set-2:
      test_title: kernel.randomize_va_space setting in kernel is set to 2
      capability: unix.sysctl
      collection: unix-sysctl-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: null
        state_capability: unix.sysctl
        state:
          field: value
          value: '2'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-kernel-randomize-va-space-setting-in-etc-sysctl-conf-if:
      test_title: kernel.randomize_va_space setting in /etc/sysctl.conf, if set, is set to 2
      capability: independent.textfilecontent54
      collection: admin-sysctl-configuration-files-kernel-randomize-va-space-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: '2'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-kernel-randomize-va-space-setting-in-etc-sysctl-d-if:
      test_title: kernel.randomize_va_space setting in /etc/sysctl.d/*, if set, is set to 2
      capability: independent.textfilecontent54
      collection: system-sysctl-configuration-files-kernel-randomize-va-space-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: '2'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-kernel-randomize-va-space-setting-in-kernel-set-2
    - test: test-kernel-randomize-va-space-setting-in-etc-sysctl-conf-if
    - test: test-kernel-randomize-va-space-setting-in-etc-sysctl-d-if
