assessment:
  id: ng.shared.5a40e664c8e38b750f6fa850
  version: 1
  assessment_title: The SUSE operating system must use the invoking user's password for privilege escalation when using "sudo".
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify that the sudoers security policy is configured to use the invoking user's password for privilege escalation.
    > sudo egrep -ir '(rootpw|targetpw|runaspw)' /etc/sudoers /etc/sudoers.d* | grep -v '#' /etc/sudoers:Defaults !targetpw
    /etc/sudoers:Defaults !rootpw /etc/sudoers:Defaults !runaspw If conflicting results are returned, this is a finding. If
    "Defaults !targetpw" is not defined, this is a finding. If "Defaults !rootpw" is not defined, this is a finding. If "Defaults
    !runaspw" is not defined, this is a finding.
  inputs: []
  evidence: []
