assessment:
  id: ng.shared.8ea6600237f42f88dbc97427
  version: 1
  assessment_title: The Windows DNS Server log must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    run-command-get-dnsserverdiagnostics-computername-env-computername-eventloglevel-collection:
      collection_title: Run command:(Get-DnsServerDiagnostics -ComputerName $env:COMPUTERNAME).EventLogLevel
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: (Get-DnsServerDiagnostics -ComputerName $env:COMPUTERNAME).EventLogLevel
  tests:
    test-verify-errors-warnings-or-all-events-selected:
      test_title: Verify 'Errors and warnings' or 'All events' is selected
      capability: independent.shellcommand
      collection: run-command-get-dnsserverdiagnostics-computername-env-computername-eventloglevel-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: AND
        states:
        - state_title: Verify EventLogLevel is not equal to 0 (No Events)
          capability: independent.shellcommand
          state:
            field: stdout_line
            value: '0'
            operation: not equal
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: Verify EventLogLevel is not equal to 1 (Errors Only)
          capability: independent.shellcommand
          state:
            field: stdout_line
            value: '1'
            operation: not equal
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-verify-errors-warnings-or-all-events-selected
