assessment:
  id: ng.shared.e0bd8d4a008cedaf00a77d24
  version: 1
  assessment_title: WN10-SO-000251 - Windows 10 must use multifactor authentication for local and network access to privileged
    and non-privileged accounts.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: pattern match
          datatype: string
          mask: false
          value: SOFTWARE\\Microsoft\\Cryptography\\Calais\\Readers\\\S+
        name:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
    windows-registry-collection-2:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: pattern match
          datatype: string
          mask: false
          value: SOFTWARE\\Microsoft\\Cryptography\\Calais\\SmartCards\\\S+
        name:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
  tests:
    test-hklm-software-microsoft-cryptography-calais-readers-exists-contains-at-least:
      test_title: HKLM\SOFTWARE\Microsoft\Cryptography\Calais\Readers exists and contains at least one key.
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
    test-hklm-software-microsoft-cryptography-calais-smartcards-exists-contains-at-least:
      test_title: HKLM\SOFTWARE\Microsoft\Cryptography\Calais\SmartCards exists and contains at least one key.
      capability: windows.registry
      collection: windows-registry-collection-2
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    all:
    - test: test-hklm-software-microsoft-cryptography-calais-readers-exists-contains-at-least
    - test: test-hklm-software-microsoft-cryptography-calais-smartcards-exists-contains-at-least
