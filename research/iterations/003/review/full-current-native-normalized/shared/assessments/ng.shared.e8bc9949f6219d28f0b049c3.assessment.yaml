assessment:
  id: ng.shared.e8bc9949f6219d28f0b049c3
  version: 1
  assessment_title: The macOS system must disable Screen Sharing and Apple Remote Desktop.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable Screen Sharing and Apple Remote Desktop with the following
    command: /bin/launchctl print-disabled system | /usr/bin/grep -c ''"com.apple.screensharing" => disabled'' If the result
    is not "1", this is a finding.'
  inputs: {}
  evidence: []
