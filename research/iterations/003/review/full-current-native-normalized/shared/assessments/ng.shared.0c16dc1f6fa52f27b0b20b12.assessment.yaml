assessment:
  id: ng.shared.0c16dc1f6fa52f27b0b20b12
  version: 1
  assessment_title: The macOS system must have the security assessment policy subsystem enabled.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-gatekeeper-enable-recommended-object-collection:
      collection_title: os_gatekeeper_enable_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/sbin/spctl --status | /usr/bin/grep "assessments enabled"
  tests:
    test-os-gatekeeper-enable-recommended-test:
      test_title: os_gatekeeper_enable_recommended_test
      capability: independent.shellcommand
      collection: os-gatekeeper-enable-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: os_gatekeeper_enable_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: .*
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-os-gatekeeper-enable-recommended-test
