assessment:
  id: ng.shared.faf0f7bad0b4728985968047
  version: 1
  assessment_title: The macOS system must require users to reauthenticate for privilege escalation when using the "sudo" command.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    os-sudo-timeout-configure-stig-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/sudo /usr/bin/sudo -V | /usr/bin/grep "Authentication timestamp timeout: 0.0 minutes"'
      object_title: os_sudo_timeout_configure_stig_object
  states:
    state-os-sudo-timeout-configure-stig-state:
      state_title: os_sudo_timeout_configure_stig_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: .*
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-os-sudo-timeout-configure-stig-test:
      test_title: os_sudo_timeout_configure_stig_test
      capability: independent.shellcommand
      object: os-sudo-timeout-configure-stig-object-object
      check_existence: all_exist
      check: all
      states:
      - state-os-sudo-timeout-configure-stig-state
  evaluate:
    test: test-os-sudo-timeout-configure-stig-test
