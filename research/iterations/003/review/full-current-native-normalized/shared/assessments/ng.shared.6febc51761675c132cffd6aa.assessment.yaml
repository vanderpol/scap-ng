assessment:
  id: ng.shared.6febc51761675c132cffd6aa
  version: 1
  assessment_title: WN19-00-000320 - Windows Server 2019 must not have the Fax Server role installed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    fax-server-object:
      capability: windows.wmi57
      select:
        namespace:
          operation: equals
          datatype: string
          mask: false
          value: root\cimv2
        wql:
          operation: equals
          datatype: string
          mask: false
          value: SELECT startmode FROM Win32_Service WHERE name='fax'
      object_title: Fax Server
  states:
    state-startmode-is-disabled:
      state_title: StartMode is Disabled
      capability: windows.wmi57
      state:
        field: result
        value:
          record:
          - name: startmode
            value: Disabled
            operation: equals
            datatype: string
            mask: false
            entity_check: all
        operation: equals
        datatype: record
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-fax-server-role-not-installed:
      test_title: The Fax server role is not installed.
      capability: windows.wmi57
      object: fax-server-object
      check_existence: any_exist
      check: all
      states:
      - state-startmode-is-disabled
  evaluate:
    test: test-fax-server-role-not-installed
