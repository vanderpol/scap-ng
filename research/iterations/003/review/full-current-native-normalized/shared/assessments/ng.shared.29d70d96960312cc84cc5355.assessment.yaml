assessment:
  id: ng.shared.29d70d96960312cc84cc5355
  version: 1
  assessment_title: The Deny log on locally user right on workstations must be configured to prevent access from highly privileged
    domain accounts on domain systems and unauthenticated access on all systems.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy
    >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment. If the
    following groups or accounts are not defined for the "Deny log on locally" right, this is a finding. Domain Systems Only:
    Enterprise Admins Group Domain Admins Group Privileged Access Workstations (PAWs) dedicated to the management of Active
    Directory are exempt from denying the Enterprise Admins and Domain Admins groups. (See the Windows Privileged Access Workstation
    STIG for PAW requirements.) All Systems: Guests Group'
  inputs: []
  evidence: []
