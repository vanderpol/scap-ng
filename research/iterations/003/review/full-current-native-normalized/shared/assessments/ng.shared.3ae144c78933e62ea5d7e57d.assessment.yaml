assessment:
  id: ng.shared.3ae144c78933e62ea5d7e57d
  version: 1
  assessment_title: SLES-12-010883 - The SUSE operating system must have directories that contain system commands group-owned
    by root.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    unix-file-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          variable_check: at least one
          value:
            variable: system-command-directories-variable
        filename:
          operation: equals
          datatype: string
          nil: true
          value: ''
      filters:
      - action: include
        state: state-unix-file-2
      behaviors:
        recurse_direction: down
      object_title: null
  variables:
    system-command-directories-variable:
      title: system command directories
      kind: constant
      datatype: string
      expression:
        literal:
        - /bin
        - /sbin
        - /usr/bin
        - /usr/sbin
        - /usr/local/bin
        - /usr/local/sbin
  states:
    state-unix-file:
      state_title: null
      capability: unix.file
      state:
        field: group_id
        value: '0'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
    state-unix-file-2:
      state_title: null
      capability: unix.file
      state:
        field: type
        value: directory
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-directories-that-contain-system-commands-group-owned-by-root:
      test_title: Directories that contain system commands are group-owned by root
      capability: unix.file
      object: unix-file-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-unix-file
  evaluate:
    test: test-directories-that-contain-system-commands-group-owned-by-root
