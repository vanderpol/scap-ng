assessment:
  id: ng.shared.69b523079da1b5a13896a65a
  version: 1
  assessment_title: Systems must employ cryptographic hashes for passwords using the SHA-2 family of algorithms or FIPS 140-2
    approved successors.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    crypt-default-set-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/security
        filename:
          operation: equals
          datatype: string
          mask: false
          value: policy.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^CRYPT_DEFAULT=(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: CRYPT_DEFAULT is set
    crypt-algorithms-allow-set-object:
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/security
        filename:
          operation: equals
          datatype: string
          mask: false
          value: policy.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^CRYPT_ALGORITHMS_ALLOW=(\S+)\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
      object_title: CRYPT_ALGORITHMS_ALLOW is set
  states:
    state-crypt-default-is-set-to-6:
      state_title: CRYPT_DEFAULT is set to 6
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: '6'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-crypt-algorithms-allow-is-set-to-5-6:
      state_title: CRYPT_ALGORITHMS_ALLOW is set to 5,6
      capability: independent.textfilecontent54
      state:
        field: subexpression
        value: 5,6
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-crypt-default-set-6:
      test_title: CRYPT_DEFAULT is set to 6
      capability: independent.textfilecontent54
      object: crypt-default-set-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-crypt-default-is-set-to-6
    test-crypt-algorithms-allow-set-5-6:
      test_title: CRYPT_ALGORITHMS_ALLOW is set to 5,6
      capability: independent.textfilecontent54
      object: crypt-algorithms-allow-set-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-crypt-algorithms-allow-is-set-to-5-6
  evaluate:
    all:
    - test: test-crypt-default-set-6
    - test: test-crypt-algorithms-allow-set-5-6
