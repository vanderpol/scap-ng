  version: 1
  assessment_title: The network selection user interface (UI) must not be displayed on the logon screen (Windows 2012 R2).
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This requirement is NA for the initial release of Windows 2012. It is applicable to Windows 2012 R2. Verify
    the registry value below. If it does not exist or is not configured as specified, this is a finding. Registry Hive: HKEY_LOCAL_MACHINE
    Registry Path: \SOFTWARE\Policies\Microsoft\Windows\System\ Value Name: DontDisplayNetworkSelectionUI Value Type: REG_DWORD
    Value: 1'
  inputs: {}
  evidence: []
