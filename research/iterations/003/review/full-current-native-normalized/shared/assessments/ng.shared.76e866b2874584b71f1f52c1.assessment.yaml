assessment:
  id: ng.shared.76e866b2874584b71f1f52c1
  version: 1
  assessment_title: The macOS system must disable Find My service.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system is configured to disable Find My service with the following command: /usr/bin/osascript
    -l JavaScript << EOS function run() { let pref1 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\
    .objectForKey(''allowFindMyDevice'')) let pref2 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\
    .objectForKey(''allowFindMyFriends'')) let pref3 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName(''com.apple.icloud.managed'')\
    .objectForKey(''DisableFMMiCloudSetting'')) if ( pref1 == false && pref2 == false && pref3 == true ) { return("true")
    } else { return("false") } } EOS If the result is not "true", this is a finding.'
  inputs: {}
  evidence: []
