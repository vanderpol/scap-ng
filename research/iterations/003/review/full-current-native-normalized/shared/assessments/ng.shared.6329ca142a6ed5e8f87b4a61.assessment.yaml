assessment:
  id: ng.shared.6329ca142a6ed5e8f87b4a61
  version: 1
  assessment_title: The Oracle Linux operating system must generate audit records for all account creations, modifications,
    disabling, and termination events that affect /etc/gshadow.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system must generate audit records for all account creations, modifications, disabling,
    and termination events that affect "/etc/gshadow". Check the auditing rules in "/etc/audit/audit.rules" with the following
    command: # grep /etc/gshadow /etc/audit/audit.rules -w /etc/gshadow -p wa -k identity If the command does not return a
    line, or the line is commented out, this is a finding.'
  inputs: []
  evidence: []
