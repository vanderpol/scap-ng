assessment:
  id: ng.shared.528e81f342828bd333fad776
  version: 1
  assessment_title: OL09-00-002508 - OL 9 SSH server configuration file must be owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    unix-file-collection:
      collection_title: null
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config
    unix-file-collection-2:
      collection_title: null
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config.d
        filename:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
      behaviors:
        recurse: directories
        recurse_direction: down
    unix-file-collection-3:
      collection_title: null
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/ssh/sshd_config.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
      behaviors:
        recurse: directories
        recurse_direction: down
  tests:
    test-etc-ssh-sshd-config-file-owned-by-root:
      test_title: The /etc/ssh/sshd_config file is owned by root.
      capability: unix.file
      collection: unix-file-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: owned by root
        state_capability: unix.file
        state:
          field: user_id
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-etc-ssh-sshd-config-d-directory-sub-directories-owned-by:
      test_title: The /etc/ssh/sshd_config.d directory and sub-directories are owned by root.
      capability: unix.file
      collection: unix-file-collection-2
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: owned by root
        state_capability: unix.file
        state:
          field: user_id
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-etc-ssh-sshd-config-d-files-owned-by-root:
      test_title: The /etc/ssh/sshd_config.d files are owned by root.
      capability: unix.file
      collection: unix-file-collection-3
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: owned by root
        state_capability: unix.file
        state:
          field: user_id
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-etc-ssh-sshd-config-file-owned-by-root
    - test: test-etc-ssh-sshd-config-d-directory-sub-directories-owned-by
    - test: test-etc-ssh-sshd-config-d-files-owned-by-root
