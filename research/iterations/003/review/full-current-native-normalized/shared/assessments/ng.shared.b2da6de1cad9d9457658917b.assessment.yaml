      kind: constant
      datatype: string
      expression:
        literal: ^\s*-a\s+(?:always,exit|exit,always)
    audit-32-bit-architecture-variable:
      title: Audit 32-bit architecture
      kind: constant
      datatype: string
      expression:
        literal: \s+-F\s+arch=b32
    allow-multiple-s-fields-variable:
      title: Allow for multiple -S fields
      kind: constant
      datatype: string
      expression:
        literal: \s+(?:-S\s+[,\w]+\s+)*
