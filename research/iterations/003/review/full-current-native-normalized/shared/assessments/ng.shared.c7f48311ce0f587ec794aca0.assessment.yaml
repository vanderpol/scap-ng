assessment:
  id: ng.shared.c7f48311ce0f587ec794aca0
  version: 1
  assessment_title: The Oracle Linux operating system must audit all uses of the kmod command.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system generates audit records when successful/unsuccessful attempts to use the "kmod"
    command occur. Check the auditing rules in "/etc/audit/audit.rules" with the following command: $ sudo grep "/usr/bin/kmod"
    /etc/audit/audit.rules -a always,exit -F path=/usr/bin/kmod -F perm=x -F auid>=1000 -F auid!=unset -k modules If the command
    does not return any output, this is a finding.'
  inputs: {}
  evidence: []
