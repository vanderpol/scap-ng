assessment:
  id: ng.shared.bc2c463e69a3afa4fe6987f6
  version: 1
  assessment_title: Format and Eject Removable Media
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Microsoft\Windows NT\CurrentVersion\Winlogon
        name:
          operation: equals
          datatype: string
          mask: false
          value: AllocateDASD
  variables:
    devices-allow-only-administrators-format-eject-removable-media-variable:
      title: 'Devices: Allow only administrators to format and eject removable media'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: allow_format_eject_removable_media_var
        validation:
          alternatives:
          - literal: '0'
            hint: administrator_only
          - literal: '1'
            hint: administrator_and_powerusers_only
          - literal: '2'
            hint: administrator_and_interactiveuser_only
  tests:
    test-devices-allowed-format-eject-removable-media-set-administrators:
      test_title: '''Devices: Allowed to Format and Eject Removable Media'' is set to ''Administrators'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Sz type and value is less than or equal to variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_sz
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: devices-allow-only-administrators-format-eject-removable-media-variable
            operation: less than or equal
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-devices-allowed-format-eject-removable-media-set-administrators
