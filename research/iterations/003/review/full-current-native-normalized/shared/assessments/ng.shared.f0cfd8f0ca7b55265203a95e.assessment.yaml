assessment:
  id: ng.shared.f0cfd8f0ca7b55265203a95e
  version: 1
  assessment_title: The macOS system must configure audit_control to mode 440 or less permissive.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    audit-control-mode-configure-recommended-object-collection:
      collection_title: audit_control_mode_configure_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /bin/ls -l /etc/security/audit_control|/usr/bin/awk '!/-r--[r-]-----|current|total/{print $1}'
  tests:
    test-audit-control-mode-configure-recommended-test:
      test_title: audit_control_mode_configure_recommended_test
      capability: independent.shellcommand
      collection: audit-control-mode-configure-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: audit_control_mode_configure_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: ''
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: none_exist
  evaluate:
    test: test-audit-control-mode-configure-recommended-test
