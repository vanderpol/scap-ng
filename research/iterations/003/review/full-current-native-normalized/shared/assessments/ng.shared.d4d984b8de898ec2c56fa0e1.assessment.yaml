assessment:
  id: ng.shared.d4d984b8de898ec2c56fa0e1
  version: 1
  assessment_title: UBTU-22-232030 - Ubuntu 22.04 LTS must configure "/var/log/syslog" file with mode "640" or less permissive.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    unix-file-collection:
      collection_title: null
      capability: unix.file
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /var/log/syslog
  tests:
    test-mode-var-log-syslog-file-0640-or-less-permissive:
      test_title: Mode of /var/log/syslog file is 0640 or less permissive
      capability: unix.file
      collection: unix-file-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: mode 0640 or less permissive
        state_capability: unix.file
        state:
          all:
          - field: suid
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: sgid
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: sticky
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: uexec
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: gwrite
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: gexec
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: oread
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: owrite
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: oexec
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-mode-var-log-syslog-file-0640-or-less-permissive
