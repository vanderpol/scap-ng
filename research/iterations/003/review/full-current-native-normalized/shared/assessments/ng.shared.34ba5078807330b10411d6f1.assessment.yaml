assessment:
  id: ng.shared.34ba5078807330b10411d6f1
  version: 1
  assessment_title: The macOS system must enforce SSH to display the Standard Mandatory DOD Notice and Consent Banner.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    os-policy-banner-ssh-enforce-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/sbin/sshd -G | /usr/bin/grep -c "^banner /etc/banner"
      object_title: os_policy_banner_ssh_enforce_recommended_object
  states:
    state-os-policy-banner-ssh-enforce-recommended-state:
      state_title: os_policy_banner_ssh_enforce_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: '1'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-os-policy-banner-ssh-enforce-recommended-test:
      test_title: os_policy_banner_ssh_enforce_recommended_test
      capability: independent.shellcommand
      object: os-policy-banner-ssh-enforce-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-os-policy-banner-ssh-enforce-recommended-state
  evaluate:
    test: test-os-policy-banner-ssh-enforce-recommended-test
