assessment:
  id: ng.shared.0732d22b95d64b0f568a4318
  version: 1
  assessment_title: Event Viewer Events.asp Links
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\EventViewer
        name:
          operation: equals
          datatype: string
          mask: false
          value: MicrosoftEventVwrDisableLinks
  tests:
    test-turn-off-event-viewer-events-asp-set-enabled:
      test_title: '''Turn off Event Viewer “Events.asp'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals 1
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-turn-off-event-viewer-events-asp-set-enabled
