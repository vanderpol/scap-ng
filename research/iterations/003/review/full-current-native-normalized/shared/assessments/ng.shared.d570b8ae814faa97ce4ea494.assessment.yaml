assessment:
  id: ng.shared.d570b8ae814faa97ce4ea494
  version: 1
  assessment_title: The macOS system must be configured with system log files set to mode 640 or less permissive.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    os-newsyslog-files-permissions-configure-recommended-object-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/bin/stat -f '%A:%N' $(/usr/bin/grep -v '^#' /etc/newsyslog.conf|/usr/bin/awk '{ print $1 }')|/usr/bin/awk
            '!/640/{print $1}'
      object_title: os_newsyslog_files_permissions_configure_recommended_object
  states:
    state-os-newsyslog-files-permissions-configure-recommended-sta:
      state_title: os_newsyslog_files_permissions_configure_recommended_state
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: ''
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: none_exist
  tests:
    test-os-newsyslog-files-permissions-configure-recommended-test:
      test_title: os_newsyslog_files_permissions_configure_recommended_test
      capability: independent.shellcommand
      object: os-newsyslog-files-permissions-configure-recommended-object-object
      check_existence: all_exist
      check: all
      states:
      - state-os-newsyslog-files-permissions-configure-recommended-sta
  evaluate:
    test: test-os-newsyslog-files-permissions-configure-recommended-test
