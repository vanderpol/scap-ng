assessment:
  id: ng.shared.8459daae2e05a362e31e80f3
  version: 1
  assessment_title: UBTU-22-232085 - Ubuntu 22.04 LTS must configure the directories used by the system journal to be group-owned
    by "systemd-journal".
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    run-log-journal-directory-subdirectories-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          value: /run/log/journal
        filename:
          operation: equals
          datatype: string
          nil: true
          value: ''
      filters:
      - action: include
        state: state-unix-file
      behaviors:
        recurse_direction: down
        recurse_file_system: local
      object_title: /run/log/journal directory and subdirectories
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          value: /etc/group
        pattern:
          operation: pattern match
          datatype: string
          value: '^systemd-journal:[^:]*:([0-9]+):'
        instance:
          operation: greater than or equal
          datatype: int
          value: '1'
      object_title: null
    var-log-journal-directory-subdirectories-object:
      capability: unix.file
      select:
        path:
          operation: equals
          datatype: string
          value: /var/log/journal
        filename:
          operation: equals
          datatype: string
          nil: true
          value: ''
      filters:
      - action: include
        state: state-unix-file
      behaviors:
        recurse_direction: down
        recurse_file_system: local
      object_title: /var/log/journal directory and subdirectories
  variables:
    gid-systemd-journal-variable:
      title: GID for systemd-journal
      kind: local
      datatype: int
      expression:
        values:
          object: independent-textfilecontent54-object
          field: subexpression
  states:
    state-group-id-for-systemd-journal:
      state_title: group id for systemd-journal
      capability: unix.file
      state:
        field: group_id
        value:
          variable: gid-systemd-journal-variable
        operation: equals
        datatype: int
        variable_check: all
        entity_check: all
        entity_existence: at_least_one_exists
    state-unix-file:
      state_title: null
      capability: unix.file
      state:
        field: type
        value: directory
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-run-log-journal-subdirectories-thereof-group-owned-by-systemd-journal:
      test_title: /run/log/journal, and subdirectories thereof, are group-owned by systemd-journal
      capability: unix.file
      object: run-log-journal-directory-subdirectories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-group-id-for-systemd-journal
    test-var-log-journal-subdirectories-thereof-group-owned-by-systemd-journal:
      test_title: /var/log/journal, and subdirectories thereof, are group-owned by systemd-journal
      capability: unix.file
      object: var-log-journal-directory-subdirectories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-group-id-for-systemd-journal
  evaluate:
    all:
    - test: test-run-log-journal-subdirectories-thereof-group-owned-by-systemd-journal
    - test: test-var-log-journal-subdirectories-thereof-group-owned-by-systemd-journal
