assessment:
  id: ng.shared.18422abe6df89989fdf6ed30
  version: 1
  assessment_title: WN19-DC-000420 - Windows Server 2019 Enable computer and user accounts to be trusted for delegation user
    right must only be assigned to the Administrators group on domain controllers.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-userright-object:
      capability: windows.userright
      select:
        userright:
          operation: equals
          datatype: string
          mask: false
          value: SE_ENABLE_DELEGATION_NAME
      object_title: null
  states:
    state-windows-userright:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: ''
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-userright-2:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: Administrators
        operation: case insensitive equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-enable-computer-user-accounts-trusted-delegation-administrators:
      test_title: Enable computer and user accounts to be trusted for delegation - Administrators
      capability: windows.userright
      object: windows-userright-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-windows-userright
      - state-windows-userright-2
  evaluate:
    test: test-enable-computer-user-accounts-trusted-delegation-administrators
