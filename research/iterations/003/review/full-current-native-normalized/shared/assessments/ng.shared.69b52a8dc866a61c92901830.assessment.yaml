assessment:
  id: ng.shared.69b52a8dc866a61c92901830
  version: 1
  assessment_title: The system must be configured to audit Object Access - Removable Storage failures.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Security Option "Audit: Force audit policy subcategory settings (Windows Vista or later) to override audit policy
    category settings" must be set to "Enabled" (V-14230) for the detailed auditing subcategories to be effective. Use the
    AuditPol tool to review the current Audit Policy configuration: -Open a Command Prompt with elevated privileges ("Run
    as Administrator"). -Enter "AuditPol /get /category:*" Compare the AuditPol settings with the following. If the system
    does not audit the following, this is a finding. Object Access >> Removable Storage - Failure Virtual machines or systems
    that use network attached storage may generate excessive audit events for secondary virtual drives or the network attached
    storage when this setting is enabled. This may be set to Not Configured in such cases and would not be a finding.'
  inputs: []
  evidence: []
