assessment:
  id: ng.shared.daee4bb0a0cbf796b816c536
  version: 1
  assessment_title: The Ubuntu operating system must be configured to use AppArmor.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    ubuntu-configured-use-apparmor-apparmor-enaabled-collection:
      collection_title: Ubuntu must be configured to use AppArmor. AppArmor is enaabled.
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: 'systemctl is-enabled apparmor.service '
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: enabled
    ubuntu-configured-use-apparmor-apparmor-active-collection:
      collection_title: Ubuntu must be configured to use AppArmor. AppArmor is active.
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: systemctl is-active apparmor.service
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: active
    ubuntu-configured-use-apparmor-apparmor-profiles-loaded-enforcing-collection:
      collection_title: Ubuntu must be configured to use AppArmor. Apparmor profiles are loaded and enforcing.
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: apparmor_status | grep -i profile
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*(\d+)\s+profiles\s+are\s+in\s+enforce\s+mode\s*
    ubuntu-configured-use-apparmor-apparmor-profiles-loaded-enforcing-collection-2:
      collection_title: Ubuntu must be configured to use AppArmor. Apparmor profiles are loaded and enforcing.
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: apparmor_status | grep -i profile
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*(\d+)\s+profiles\s+are\s+loaded\s*
  tests:
    test-ubuntu-configured-use-apparmor-apparmor-enabled:
      test_title: Ubuntu must be configured to use AppArmor.AppArmor is enabled.
      capability: independent.shellcommand
      collection: ubuntu-configured-use-apparmor-apparmor-enaabled-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Ubuntu must be configured to use AppArmor. Apparmor is enabled .
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: ^\s*enabled
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-ubuntu-configured-use-apparmor-apparmor-active:
      test_title: Ubuntu must be configured to use AppArmor. AppArmor is Active.
      capability: independent.shellcommand
      collection: ubuntu-configured-use-apparmor-apparmor-active-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Ubuntu must be configured to use AppArmor. Apparmor is active .
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: ^\s*active
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-ubuntu-configured-use-apparmor-apparmor-profiles-enforcing:
      test_title: Ubuntu must be configured to use AppArmor. AppArmor profiles are enforcing.
      capability: independent.shellcommand
      collection: ubuntu-configured-use-apparmor-apparmor-profiles-loaded-enforcing-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Ubuntu must be configured to use AppArmor. Apparmor profiles are loaded and enforcing.
        state_capability: independent.shellcommand
        state:
          field: subexpression
          value: '1'
          operation: greater than or equal
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-ubuntu-configured-use-apparmor-apparmor-profiles-loaded:
      test_title: Ubuntu must be configured to use AppArmor. AppArmor profiles are loaded.
      capability: independent.shellcommand
      collection: ubuntu-configured-use-apparmor-apparmor-profiles-loaded-enforcing-collection-2
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Ubuntu must be configured to use AppArmor. Apparmor profiles are loaded and enforcing.
        state_capability: independent.shellcommand
        state:
          field: subexpression
          value: '1'
          operation: greater than or equal
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-ubuntu-configured-use-apparmor-apparmor-enabled
    - test: test-ubuntu-configured-use-apparmor-apparmor-active
    - test: test-ubuntu-configured-use-apparmor-apparmor-profiles-enforcing
    - test: test-ubuntu-configured-use-apparmor-apparmor-profiles-loaded
