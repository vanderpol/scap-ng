assessment:
  id: ng.shared.86296558927da845571af764
  version: 1
  assessment_title: The macOS system must require users to reauthenticate for privilege escalation when using the "sudo" command.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the macOS system requires reauthentication when using the "sudo" command to elevate privileges with the
    following command: /usr/bin/sudo /usr/bin/sudo -V | /usr/bin/grep -c "Authentication timestamp timeout: 0.0 minutes" If
    the result is not "1", this is a finding.'
  inputs: []
  evidence: []
