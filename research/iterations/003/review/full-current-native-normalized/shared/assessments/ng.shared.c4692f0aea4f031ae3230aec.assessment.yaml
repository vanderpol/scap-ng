assessment:
  id: ng.shared.c4692f0aea4f031ae3230aec
  version: 1
  assessment_title: All .Xauthority files must have mode 0600 or less permissive.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If X Display Manager (XDM) is not used on the system, this is not applicable. Determine if XDM is running. Procedure:
    # ps -ef | grep xdm Check the file permissions for the .Xauthority files in the home directories of users of X. Procedure:
    # cd ~<X user> # ls -lL .Xauthority If the file mode is more permissive than 0600, this is finding.'
  inputs: []
  evidence: []
