              value: pe
              operation: pattern match
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
    test-naflags-na-lo-enabled:
      test_title: naflags of na and lo are enabled
      capability: independent.shellcommand
      collection: auditconfig-t-getnaflags-cut-f2-d-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: AND
        states:
        - state_title: na is returned in the output
          capability: independent.shellcommand
          state:
            all:
            - field: exit_status
              value: '0'
              operation: equals
              datatype: int
              mask: false
