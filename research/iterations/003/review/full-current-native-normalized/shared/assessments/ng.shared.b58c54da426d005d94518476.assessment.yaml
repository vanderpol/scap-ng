assessment:
  id: ng.shared.b58c54da426d005d94518476
  version: 1
  assessment_title: The audit system must be configured to audit login, logout, and session initiation.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    auditconfig-t-getflags-cut-f2-d-collection:
      collection_title: auditconfig -t -getflags | cut -f2 -d=
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: auditconfig -t -getflags | cut -f2 -d=
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
    auditconfig-t-getnaflags-cut-f2-d-collection:
      collection_title: auditconfig -t -getnaflags | cut -f2 -d==
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: auditconfig -t -getnaflags | cut -f2 -d=
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
    auditconfig-getpolicy-filter-on-active-collection:
      collection_title: auditconfig -getpolicy and filter on active
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: auditconfig -getpolicy
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: active
  tests:
    test-audit-flag-cusa-enabled:
      test_title: audit flag cusa is enabled.
      capability: independent.shellcommand
      collection: auditconfig-t-getflags-cut-f2-d-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: cusa is returned in the output
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: cusa
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-audit-flags-ft-lo-ap-ss-ua-pe-enabled:
      test_title: audit flags 'ft,lo,ap,ss,ua,pe' are enabled.
      capability: independent.shellcommand
      collection: auditconfig-t-getflags-cut-f2-d-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: AND
        states:
        - state_title: ft is returned in the output
          capability: independent.shellcommand
          state:
            all:
            - field: exit_status
              value: '0'
              operation: equals
              datatype: int
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            - field: stdout_line
              value: ft
              operation: pattern match
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
        - state_title: lo is returned in the output
          capability: independent.shellcommand
          state:
            all:
            - field: exit_status
              value: '0'
              operation: equals
              datatype: int
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            - field: stdout_line
              value: lo
              operation: pattern match
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
        - state_title: ap is returned in the output
          capability: independent.shellcommand
          state:
            all:
            - field: exit_status
              value: '0'
              operation: equals
              datatype: int
