              entity_existence: at_least_one_exists
            - field: stdout_line
              value: ap
              operation: pattern match
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
        - state_title: ss is returned in the output
          capability: independent.shellcommand
          state:
            all:
            - field: exit_status
              value: '0'
              operation: equals
              datatype: int
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            - field: stdout_line
              value: ss
              operation: pattern match
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
        - state_title: ua is returned in the output
          capability: independent.shellcommand
          state:
            all:
            - field: exit_status
              value: '0'
              operation: equals
              datatype: int
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            - field: stdout_line
              value: ua
              operation: pattern match
              datatype: string
