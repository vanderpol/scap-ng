assessment:
  id: ng.shared.beb4ffa46aa038d50774cb7f
  version: 1
  assessment_title: Disable Router Discovery
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Services\Tcpip\Parameters
        name:
          operation: equals
          datatype: string
          mask: false
          value: PerformRouterDiscovery
  variables:
    mss-performrouterdiscovery-allow-irdp-detect-configure-defaultgateway-addresses-could-lead-variable:
      title: 'MSS: (PerformRouterDiscovery) Allow IRDP to detect and configure DefaultGateway addresses (could lead to DoS)'
      kind: external
      datatype: int
      input:
        required: true
        cardinality: one_or_more
        parameter: router_discovery_var
        validation:
          alternatives:
          - literal: '0'
            hint: disabled
          - literal: '1'
            hint: enabled
          - literal: '2'
            hint: enabled_only_if_dhcp_sends_perform_router_discovery_option
  tests:
    test-mss-performrouterdiscovery-allow-irdp-detect-configure-default-gateway-addresses-could:
      test_title: '''MSS: (PerformRouterDiscovery) Allow IRDP to detect and configure Default Gateway addresses (could lead
        to DoS)'' is set to ''Disabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals variable
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value:
              variable: mss-performrouterdiscovery-allow-irdp-detect-configure-defaultgateway-addresses-could-lead-variable
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-mss-performrouterdiscovery-allow-irdp-detect-configure-default-gateway-addresses-could
