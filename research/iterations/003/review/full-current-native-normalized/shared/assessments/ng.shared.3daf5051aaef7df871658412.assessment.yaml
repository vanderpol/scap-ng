assessment:
  id: ng.shared.3daf5051aaef7df871658412
  version: 1
  assessment_title: The SUSE operating system must not have unnecessary account capabilities.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify all non-interactive SUSE operating system accounts do not have an interactive shell assigned to them.
    Obtain the list of authorized system accounts from the Information System Security Officer (ISSO). Check the system accounts
    on the system with the following command: > awk -F: ''($7 !~ "/sbin/nologin" && $7 !~ "/bin/false"){print $1 ":" $3 ":"
    $7}'' /etc/passwd root:0:/bin/bash nobody:65534:/bin/bash If a non-interactive accounts such as "games" or "nobody" is
    listed with an interactive shell, this is a finding.'
  inputs: []
  evidence: []
