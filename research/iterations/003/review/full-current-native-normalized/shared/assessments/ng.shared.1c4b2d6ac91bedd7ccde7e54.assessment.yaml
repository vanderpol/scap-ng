assessment:
  id: ng.shared.1c4b2d6ac91bedd7ccde7e54
  version: 1
  assessment_title: The IIS 10.0 website must be configured to limit the maxURL.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    get-website-request-filtering-maxurl-setting-object:
      capability: windows.appcmdlistconfig
      select:
        identifier_type:
          operation: equals
          datatype: string
          mask: false
          value: Site
        identifier:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        section:
          operation: equals
          datatype: string
          mask: false
          value: requestfiltering
        parameter:
          operation: equals
          datatype: string
          mask: false
          value: requestLimits.maxUrl
      object_title: Get Website Request Filtering maxUrl setting
  states:
    state-appcmdlistconfig-result-must-equal-or-less-than-4096:
      state_title: appcmdlistconfig result must equal or less than 4096
      capability: windows.appcmdlistconfig
      state:
        field: result
        value: '4096'
        operation: less than or equal
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-web-site-request-filtering-maxurl-value-4096-or-less:
      test_title: The web-site Request Filtering maxUrl value must be 4096 or less
      capability: windows.appcmdlistconfig
      object: get-website-request-filtering-maxurl-setting-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-appcmdlistconfig-result-must-equal-or-less-than-4096
  evaluate:
    test: test-web-site-request-filtering-maxurl-value-4096-or-less
