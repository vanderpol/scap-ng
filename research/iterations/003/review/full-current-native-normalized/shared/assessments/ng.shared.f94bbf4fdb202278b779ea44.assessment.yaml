assessment:
  id: ng.shared.f94bbf4fdb202278b779ea44
  version: 1
  assessment_title: The sticky bit must be set on all world writable directories.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The root role is required. Identify all world-writable directories without the "sticky bit" set. # find / \(
    -fstype nfs -o -fstype cachefs -o -fstype autofs \ -o -fstype ctfs -o -fstype mntfs -o -fstype objfs \ -o -fstype proc
    \) -prune -o -type d \( -perm -0002 \ -a ! -perm -1000 \) -ls Output of this command identifies world-writable directories
    without the "sticky bit" set. If output is created, this is a finding.'
  inputs: {}
  evidence: []
