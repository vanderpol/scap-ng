assessment:
  id: ng.shared.f8077e7b6a1cfcbabd3caf72
  version: 1
  assessment_title: The IIS 10.0 web server must have Web Distributed Authoring and Versioning (WebDAV) disabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    verify-iis-webdav-authoring-rules-not-installed-via-registry-test-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: Software\Microsoft\InetStp\Components
        name:
          operation: equals
          datatype: string
          value: WebDAV
      object_title: Verify IIS WebDAV Authoring Rules is not installed via registry test
  states: {}
  tests:
    test-verify-iis-webdav-authoring-rules-not-installed-via-registry-test:
      test_title: Verify IIS WebDAV Authoring Rules is not installed via registry test
      capability: windows.registry
      object: verify-iis-webdav-authoring-rules-not-installed-via-registry-test-object
      check_existence: none_exist
      check: all
  evaluate:
    test: test-verify-iis-webdav-authoring-rules-not-installed-via-registry-test
