assessment:
  id: ng.shared.e1a944d946f118a24dac9b3b
  version: 1
  assessment_title: User passwords must be changed at least every 60 days.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    gather-non-root-unlocked-users-passwords-greater-than-60-days-collection:
      collection_title: Gather non-root, unlocked users with passwords greater than 60 days
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: 'logins -ox |awk -F: ''( $1 != "root" && $8 != "LK" && $8 != "NL" && ($11 > "60"|| $11 < "1")) { print }'''
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
    check-etc-default-passwd-maxdays-setting-collection:
      collection_title: Check /etc/default/passwd for MAXDAYS setting
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/default/passwd
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^MAXDAYS=(.*)
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
    check-etc-default-passwd-ensure-maxweeks-not-defined-collection:
      collection_title: Check /etc/default/passwd to ensure MAXWEEKS is not defined
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/default/passwd
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^MAXWEEKS=
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
  tests:
    test-check-etc-passwd-users-password-age-greater-than-60-days:
      test_title: Check /etc/passwd for users with password age greater than 60 days
      capability: independent.shellcommand
      collection: gather-non-root-unlocked-users-passwords-greater-than-60-days-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: stdout_line should not return any users
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: ''
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: none_exist
    test-check-etc-default-passwd-maxdays-setting:
      test_title: Check /etc/default/passwd for MAXDAYS setting
      capability: independent.textfilecontent54
      collection: check-etc-default-passwd-maxdays-setting-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: MAXDAYS is 60 or less
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: '60'
          operation: less than or equal
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-check-etc-default-passwd-ensure-maxweeks-not-defined:
      test_title: Check /etc/default/passwd to ensure MAXWEEKS is not defined
      capability: independent.textfilecontent54
      collection: check-etc-default-passwd-ensure-maxweeks-not-defined-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
  evaluate:
    all:
    - test: test-check-etc-passwd-users-password-age-greater-than-60-days
    - test: test-check-etc-default-passwd-maxdays-setting
    - test: test-check-etc-default-passwd-ensure-maxweeks-not-defined
