assessment:
  id: ng.shared.30fdcfa04edd174cb591ffc0
  version: 1
  assessment_title: OL08-00-040350 - If the Trivial File Transfer Protocol (TFTP) server is required, the OL 8 TFTP daemon
    must be configured to operate in secure mode.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    linux-rpminfo-collection:
      collection_title: null
      capability: linux.rpminfo
      select:
        name:
          operation: equals
          datatype: string
          mask: false
          value: tftp-server
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/xinetd.d/tftp
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^server_args[ \t]*=[ \t]*-s[ \t]+/\S+[ \t]*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-tftp-server-package-absent:
      test_title: The tftp-server package is absent.
      capability: linux.rpminfo
      collection: linux-rpminfo-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
    test-etc-xinetd-d-tftp-server-args-has-s-option-subdirectory:
      test_title: '/etc/xinetd.d/tftp: server_args has a -s option with a subdirectory assigned'
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    any:
    - test: test-tftp-server-package-absent
    - test: test-etc-xinetd-d-tftp-server-args-has-s-option-subdirectory
