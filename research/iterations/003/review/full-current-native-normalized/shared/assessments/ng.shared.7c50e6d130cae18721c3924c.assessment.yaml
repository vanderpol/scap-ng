assessment:
  id: ng.shared.7c50e6d130cae18721c3924c
  version: 1
  assessment_title: The Ubuntu operating system must implement non-executable data to protect its memory from unauthorized
    code execution.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    ubuntu-implement-nonexecutable-data-protect-its-memory-from-unauthorized-code-collection:
      collection_title: Ubuntu must implement nonexecutable data to protect its memory from unauthorized code execution.
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: dmesg | grep -i "execute disable"
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: NX
    ubuntu-implement-nonexecutable-data-protect-its-memory-from-unauthorized-code-collection-2:
      collection_title: Ubuntu must implement nonexecutable data to protect its memory from unauthorized code execution.
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: grep flags /proc/cpuinfo | grep -o nx | sort -u
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: nx
  tests:
    test-ubuntu-implement-nonexecutable-data-protect-its-memory-from-unauthorized-code:
      test_title: Ubuntu must implement nonexecutable data to protect its memory from unauthorized code execution. Check NX
        (noexec) configured.
      capability: independent.shellcommand
      collection: ubuntu-implement-nonexecutable-data-protect-its-memory-from-unauthorized-code-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Ubuntu must implement nonexecutable data to protect its memory from unauthorized code execution.
        state_capability: independent.shellcommand
        state:
          all:
          - field: command
            value: dmesg | grep -i "execute disable"
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: NX\s+\(Execute Disable\)\s+protection:\s+active
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-ubuntu-implement-nonexecutable-data-protect-its-memory-from-unauthorized-code-2:
      test_title: Ubuntu must implement nonexecutable data to protect its memory from unauthorized code execution. Check CPU
        supports NX
      capability: independent.shellcommand
      collection: ubuntu-implement-nonexecutable-data-protect-its-memory-from-unauthorized-code-collection-2
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Ubuntu must implement nonexecutable data to protect its memory from unauthorized code execution.
        state_capability: independent.shellcommand
        state:
          all:
          - field: command
            value: grep flags /proc/cpuinfo | grep -o nx | sort -u
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: nx
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-ubuntu-implement-nonexecutable-data-protect-its-memory-from-unauthorized-code
    - test: test-ubuntu-implement-nonexecutable-data-protect-its-memory-from-unauthorized-code-2
