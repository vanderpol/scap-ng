assessment:
  id: ng.shared.3e93a55a9b6d4fdb78bbd0f7
  version: 1
  assessment_title: Data files owned by users must be on a different logical partition from the directory server data files.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: This applies to domain controllers. It is NA for other systems. Run "Regedit". Navigate to "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\NTDS\Parameters".
    Note the directory locations in the values for "DSA Database file". Open "Command Prompt". Enter "net share". Note the
    logical drive(s) or file system partition for any organization-created data shares. Ignore system shares (e.g., NETLOGON,
    SYSVOL, and administrative shares ending in $). User shares that are hidden (ending with $) should not be ignored. If
    user shares are located on the same logical partition as the directory server data files, this is a finding.
  inputs: {}
  evidence: []
