assessment:
  id: ng.shared.83cbc4889114eebae0312ca4
  version: 1
  assessment_title: The macOS system must be configured to prevent Apple Watch from terminating a session lock.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    system-settings-apple-watch-unlock-disable-recommended-object-collection:
      collection_title: system_settings_apple_watch_unlock_disable_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/osascript -l JavaScript << EOS

            $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\

            .objectForKey(''allowAutoUnlock'').js

            EOS'
  tests:
    test-system-settings-apple-watch-unlock-disable-recommended-test:
      test_title: system_settings_apple_watch_unlock_disable_recommended_test
      capability: independent.shellcommand
      collection: system-settings-apple-watch-unlock-disable-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: system_settings_apple_watch_unlock_disable_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: 'false'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-system-settings-apple-watch-unlock-disable-recommended-test
