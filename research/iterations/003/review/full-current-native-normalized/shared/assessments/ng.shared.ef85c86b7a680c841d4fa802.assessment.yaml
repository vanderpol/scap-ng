assessment:
  id: ng.shared.ef85c86b7a680c841d4fa802
  version: 1
  assessment_title: The Oracle Linux operating system must enable the SELinux targeted policy.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system verifies correct operation of all security functions. Check if "SELinux" is active
    and is enforcing the targeted policy with the following command: # sestatus SELinux status: enabled SELinuxfs mount: /selinux
    SELinux root directory: /etc/selinux Loaded policy name: targeted Current mode: enforcing Mode from config file: enforcing
    Policy MLS status: enabled Policy deny_unknown status: allowed Max kernel policy version: 28 If the "Loaded policy name"
    is not set to "targeted", this is a finding. Verify that the /etc/selinux/config file is configured to the "SELINUXTYPE"
    to "targeted": # grep -i "selinuxtype" /etc/selinux/config | grep -v ''^#'' SELINUXTYPE = targeted If no results are returned
    or "SELINUXTYPE" is not set to "targeted", this is a finding.'
  inputs: {}
  evidence: []
