assessment:
  id: ng.shared.016cc33eed2bd580fe1ec009
  version: 1
  assessment_title: The Oracle Linux operating system must be configured so that the file integrity tool is configured to
    verify Access Control Lists (ACLs).
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the file integrity tool is configured to verify ACLs. Note: AIDE is highly configurable at install time.
    These commands assume the "aide.conf" file is under the "/etc" directory. Use the following command to determine if the
    file is in another location: # find / -name aide.conf Check the "aide.conf" file to determine if the "acl" rule has been
    added to the rule list being applied to the files and directories selection lists. An example rule that includes the "acl"
    rule is below: All= p+i+n+u+g+s+m+S+sha512+acl+xattrs+selinux /bin All # apply the custom rule to the files in bin /sbin
    All # apply the same custom rule to the files in sbin If the "acl" rule is not being used on all uncommented selection
    lines in the "/etc/aide.conf" file, or ACLs are not being checked by another file integrity tool, this is a finding.'
  inputs: []
  evidence: []
