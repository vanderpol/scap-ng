assessment:
  id: ng.shared.2a695ed9427043edf1431a47
  version: 1
  assessment_title: Anonymous Access to Network Shares
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Services\LanManServer\Parameters
        name:
          operation: equals
          datatype: string
          mask: false
          value: NullSessionShares
  tests:
    test-network-access-shares-that-can-accessed-anonymously-blank:
      test_title: '''Network access: Shares that can be accessed anonymously'' is blank'
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Multi_Sz type and value is blank
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_multi_sz
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: .+
            operation: pattern match
            datatype: string
            mask: false
            entity_check: none satisfy
            entity_existence: at_least_one_exists
    test-network-access-shares-that-can-accessed-anonymously-not-configured:
      test_title: '''Network access: Shares that can be accessed anonymously'' is not configured'
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
  evaluate:
    any:
    - test: test-network-access-shares-that-can-accessed-anonymously-blank
    - test: test-network-access-shares-that-can-accessed-anonymously-not-configured
