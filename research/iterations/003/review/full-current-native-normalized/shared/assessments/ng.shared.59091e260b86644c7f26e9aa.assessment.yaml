assessment:
  id: ng.shared.59091e260b86644c7f26e9aa
  version: 1
  assessment_title: The Oracle Linux operating system must implement certificate status checking for PKI authentication.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    check-what-cert-policy-set-in-etc-pam-pkcs11-pam-collection:
      collection_title: Check what cert_policy is set to in /etc/pam_pkcs11/pam_pkcs11.conf
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/pam_pkcs11/pam_pkcs11.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[\s]*cert_policy[ \t]+=[ \t]+([\w\,"' ]+);\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    there-3-or-more-cert-policy-ocsp-on-option-set-collection:
      collection_title: There are 3 or more cert_policy with the ocsp_on option set in /etc/pam_pkcs11/pam_pkcs11.conf
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/pam_pkcs11/pam_pkcs11.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[\s]*cert_policy[ \t]+=[ \t]+([\w\,"' ]*ocsp_on[\w\,"' ]*);\s*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '3'
  tests:
    test-check-all-cert-policy-entries-set-ocsp-on-option-in:
      test_title: Check all cert_policy entries are set with the ocsp_on option in /etc/pam_pkcs11/pam_pkcs11.conf
      capability: independent.textfilecontent54
      collection: check-what-cert-policy-set-in-etc-pam-pkcs11-pam-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: The ocsp_on option is present in the collected string
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^["']*ocsp_on["']*$|^["']*ocsp_on["',\s]|["',\s]ocsp_on["',\s]|["',\s]ocsp_on["']*$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-check-cert-policy-set-ocsp-on-option-3-or-more:
      test_title: Check cert_policy is set with the ocsp_on option 3 or more times in /etc/pam_pkcs11/pam_pkcs11.conf
      capability: independent.textfilecontent54
      collection: there-3-or-more-cert-policy-ocsp-on-option-set-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    all:
    - test: test-check-all-cert-policy-entries-set-ocsp-on-option-in
    - test: test-check-cert-policy-set-ocsp-on-option-3-or-more
