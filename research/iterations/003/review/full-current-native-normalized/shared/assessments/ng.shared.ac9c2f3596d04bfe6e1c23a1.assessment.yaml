assessment:
  id: ng.shared.ac9c2f3596d04bfe6e1c23a1
  version: 1
  assessment_title: AZLX-23-001206 - The Amazon Linux 2023 SSH client must be configured to use only DOD-approved encryption
    ciphers employing FIPS 140-3-validated cryptographic hash algorithms to protect the confidentiality of SSH client connections.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    independent-textfilecontent54-collection:
      collection_title: null
      capability: independent.textfilecontent54
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/crypto-policies/back-ends/openssh.config
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*(?i)Ciphers(?-i)[ \t]+(\S+)[\s]*(?:|(?:#.*))?$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-openssh-config-ciphers-correct:
      test_title: openssh.config ciphers correct
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: null
          capability: independent.textfilecontent54
          state:
            field: subexpression
            value: aes256-gcm@openssh.com,aes256-ctr,aes128-gcm@openssh.com,aes128-ctr
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: independent.textfilecontent54
          state:
            field: subexpression
            value: '"aes256-gcm@openssh.com,aes256-ctr,aes128-gcm@openssh.com,aes128-ctr"'
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-openssh-config-ciphers-correct
