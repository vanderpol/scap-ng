assessment:
  id: ng.shared.1ae95146d1305c37991eeee5
  version: 1
  assessment_title: The .rhosts file must not be supported in PAM.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    check-files-pam-rhosts-auth-so-1-line-in-etc-collection:
      collection_title: check for files with pam_rhosts_auth.so.1 line in /etc/pam.d/
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc/pam.d
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[^#]*pam_rhosts_auth\.so\.1.*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    check-pam-rhosts-auth-so-1-line-in-etc-pam-collection:
      collection_title: check for pam_rhosts_auth.so.1 line in /etc/pam.conf
      capability: independent.textfilecontent54
      select:
        path:
          operation: equals
          datatype: string
          mask: false
          value: /etc
        filename:
          operation: equals
          datatype: string
          mask: false
          value: pam.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^[^#]*pam_rhosts_auth\.so\.1.*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  tests:
    test-no-files-contain-pam-rhosts-auth-so-1-line-s:
      test_title: No files contain pam_rhosts_auth.so.1 line(s) in /etc/pam.d/
      capability: independent.textfilecontent54
      collection: check-files-pam-rhosts-auth-so-1-line-in-etc-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
    test-no-pam-rhosts-auth-so-1-line-s-in-etc:
      test_title: No pam_rhosts_auth.so.1 line(s) in /etc/pam.conf
      capability: independent.textfilecontent54
      collection: check-pam-rhosts-auth-so-1-line-in-etc-pam-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
  evaluate:
    all:
    - test: test-no-files-contain-pam-rhosts-auth-so-1-line-s
    - test: test-no-pam-rhosts-auth-so-1-line-s-in-etc
