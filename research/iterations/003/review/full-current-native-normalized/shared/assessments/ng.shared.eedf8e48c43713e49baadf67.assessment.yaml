assessment:
  id: ng.shared.eedf8e48c43713e49baadf67
  version: 1
  assessment_title: WN19-MS-000080 - Windows Server 2019 "Deny access to this computer from the network" user right on domain-joined
    member servers must be configured to prevent access from highly privileged domain accounts and local accounts and from
    unauthenticated access on all systems.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-wmi57-object:
      capability: windows.wmi57
      select:
        namespace:
          operation: equals
          datatype: string
          mask: false
          value: root\cimv2
        wql:
          operation: equals
          datatype: string
          mask: false
          value: SELECT DomainRole FROM win32_computersystem
      object_title: null
    windows-userright-object:
      capability: windows.userright
      select:
        userright:
          operation: equals
          datatype: string
          mask: false
          value: SE_DENY_NETWORK_LOGON_NAME
      object_title: null
  states:
    state-domain-member-server:
      state_title: Domain Member Server
      capability: windows.wmi57
      state:
        field: result
        value:
          record:
          - name: domainrole
            value: '3'
            operation: equals
            datatype: string
            mask: false
            entity_check: all
        operation: equals
        datatype: record
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-userright:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: Guests
        operation: case insensitive equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-userright-2:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: ^(?i)(.+\\)?Domain Admins$
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-userright-3:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: ^(?i)(.+\\)?Enterprise Admins$
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-userright-4:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: ^(?i)(NT Authority\\)?Local account$
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-userright-5:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: ^(?i)(NT Authority\\)?Local account and member of Administrators group$
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-standalone-server:
      state_title: Standalone Server
      capability: windows.wmi57
      state:
        field: result
        value:
          record:
          - name: domainrole
            value: '2'
            operation: equals
            datatype: string
            mask: false
            entity_check: all
        operation: equals
        datatype: record
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-windows-domain-member-server:
      test_title: The system is a Windows Domain Member Server
      capability: windows.wmi57
      object: windows-wmi57-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-domain-member-server
    test-deny-access-this-computer-from-network-guests:
      test_title: Deny access to this computer from the network - Guests
      capability: windows.userright
      object: windows-userright-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-windows-userright
    test-deny-access-this-computer-from-network-domain-admins:
      test_title: Deny access to this computer from the network - Domain Admins
      capability: windows.userright
      object: windows-userright-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-windows-userright-2
    test-deny-access-this-computer-from-network-enterprise-admins:
      test_title: Deny access to this computer from the network - Enterprise Admins
      capability: windows.userright
      object: windows-userright-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-windows-userright-3
    test-deny-access-this-computer-from-network-local-account:
      test_title: Deny access to this computer from the network - Local account
      capability: windows.userright
      object: windows-userright-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-windows-userright-4
    test-deny-access-this-computer-from-network-local-account-member-administrators:
      test_title: Deny access to this computer from the network - Local account and member of Administrators
      capability: windows.userright
      object: windows-userright-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-windows-userright-5
    test-system-windows-standalone-server:
      test_title: The system is a Windows Standalone Server
      capability: windows.wmi57
      object: windows-wmi57-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-standalone-server
  evaluate:
    any:
    - all:
      - test: test-system-windows-domain-member-server
      - test: test-deny-access-this-computer-from-network-guests
      - test: test-deny-access-this-computer-from-network-domain-admins
      - test: test-deny-access-this-computer-from-network-enterprise-admins
      - any:
        - test: test-deny-access-this-computer-from-network-local-account
        - test: test-deny-access-this-computer-from-network-local-account-member-administrators
    - all:
      - test: test-system-windows-standalone-server
      - test: test-deny-access-this-computer-from-network-guests
