assessment:
  id: ng.shared.c6580904f7a81da686aa1de8
  version: 1
  assessment_title: The Oracle Linux operating system must generate audit records for all account creations, modifications,
    disabling, and termination events that affect /etc/shadow.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the operating system must generate audit records for all account creations, modifications, disabling,
    and termination events that affect /etc/shadow. Check the auditing rules in "/etc/audit/audit.rules" with the following
    command: # grep /etc/shadow /etc/audit/audit.rules -w /etc/shadow -p wa -k identity If the command does not return a line,
    or the line is commented out, this is a finding.'
  inputs: []
  evidence: []
