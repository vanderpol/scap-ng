assessment:
  id: ng.shared.5ec11fe2ff02c213f004fd2b
  version: 1
  assessment_title: OL09-00-003051 - OL 9 system accounts must not have an interactive login shell.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    unix-password-collection:
      collection_title: null
      capability: unix.password
      select:
        username:
          operation: pattern match
          datatype: string
          mask: false
          value: .+
    only-system-accounts-collection:
      collection_title: only system accounts
      capability: unix.password
      set:
        operator: union
        members:
        - collection: unix-password-collection
        filters:
        - action: exclude
          match:
            field: user_id
            value: '1000'
            operation: greater than or equal
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          capability: unix.password
        - action: exclude
          match:
            field: user_id
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          capability: unix.password
  tests:
    test-system-accounts-in-etc-passwd-use-sbin-nologin:
      test_title: The system accounts in /etc/passwd use /sbin/nologin.
      capability: unix.password
      collection: only-system-accounts-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: unix.password
        state:
          field: login_shell
          value: /sbin/nologin|/usr/sbin/nologin
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-system-accounts-in-etc-passwd-use-sbin-nologin
