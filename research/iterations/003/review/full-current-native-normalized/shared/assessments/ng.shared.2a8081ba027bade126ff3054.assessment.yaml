assessment:
  id: ng.shared.2a8081ba027bade126ff3054
  version: 1
  assessment_title: Exchange internal Receive connectors must not allow anonymous connections.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    run-get-receiveconnector-display-permissiongroups-configuration-collection:
      collection_title: Run Get-ReceiveConnector to display PermissionGroups configuration
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: add-pssnapin Microsoft.Exchange.Management.Powershell.Snapin;Get-ReceiveConnector | Select-Object -Property
            Name, Identity, PermissionGroups |  Format-Table -HideTableHeaders | Out-String -Width 4096
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: \w
      behaviors:
        error_if_stderr_exists: 'true'
  tests:
    test-each-receive-connector-if-value-permissiongroups-anonymoususers-any-receive-connector:
      test_title: For each Receive connector, if the value of PermissionGroups is AnonymousUsers for any receive connector,
        this is a finding.
      capability: independent.shellcommand
      collection: run-get-receiveconnector-display-permissiongroups-configuration-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Verify AnonymousUsers is not found
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: (?i)AnonymousUsers
          operation: pattern match
          datatype: string
          mask: false
          entity_check: none satisfy
          entity_existence: at_least_one_exists
  evaluate:
    test: test-each-receive-connector-if-value-permissiongroups-anonymoususers-any-receive-connector
