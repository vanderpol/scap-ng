assessment:
  id: ng.shared.8b73d2a3e11ee99b044830a6
  version: 1
  assessment_title: OL09-00-002072 - OL 9 must prevent code from being executed on file systems that contain user home directories.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    home-object:
      capability: linux.partition
      select:
        mount_point:
          operation: pattern match
          datatype: string
          value: .*\/home
      object_title: /home
  states:
    state-linux-partition:
      state_title: null
      capability: linux.partition
      state:
        field: mount_options
        value: noexec
        operation: equals
        datatype: string
        entity_check: at least one
        entity_existence: at_least_one_exists
  tests:
    test-home-has-noexec-option:
      test_title: /home has noexec option
      capability: linux.partition
      object: home-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-linux-partition
  evaluate:
    test: test-home-has-noexec-option
