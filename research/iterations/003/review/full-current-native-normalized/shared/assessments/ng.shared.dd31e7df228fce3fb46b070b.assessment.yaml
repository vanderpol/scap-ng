assessment:
  id: ng.shared.dd31e7df228fce3fb46b070b
  version: 1
  assessment_title: The system must set maximum number of incoming connections to 1024.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Determine if the maximum number of incoming connections is set to 1024. # ipadm show-prop -p _conn_req_max_q
    -co current tcp If the value returned is smaller than "1024", this is a finding. In environments where connection numbers
    are high, such as a busy web server, this value may need to be increased.'
  inputs: []
  evidence: []
