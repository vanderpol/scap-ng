assessment:
  id: ng.shared.7b585ee2d9ed37c05e47d845
  version: 1
  assessment_title: The Cisco switch must be configured to prohibit the use of all unnecessary and nonsecure functions and
    services.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that the switch does not have any unnecessary or nonsecure ports, protocols, and services enabled. For
    example, the following commands should not be in the configuration: boot network ip boot server ip bootp server ip dns
    server ip identd ip finger ip http server ip rcmd rcp-enable ip rcmd rsh-enable service config service finger service
    tcp-small-servers service udp-small-servers service pad service call-home Note: Certain legacy devices may require ''service
    call-home'' be enabled to support Smart Licensing as they do not support the newer smart transport configuration. Those
    devices do not incur a finding for having call-home enabled for Smart Licensing. If any unnecessary or nonsecure ports,
    protocols, or services are enabled, this is a finding.'
  inputs: {}
  evidence: []
