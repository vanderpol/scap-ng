assessment:
  id: ng.shared.ba768b95a2f3994fcd85d8f0
  version: 1
  assessment_title: The macOS system must provide an immediate warning to the System Administrator (SA) and Information System
    Security Officer (ISSO) (at a minimum) when allocated audit record storage volume reaches 75 percent of repository maximum
    audit record storage capacity.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    audit-configure-capacity-notify-stig-object-collection:
      collection_title: audit_configure_capacity_notify_stig_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: '/usr/bin/awk -F: ''/^minfree/{print $2}'' /etc/security/audit_control'
  tests:
    test-audit-configure-capacity-notify-stig-test:
      test_title: audit_configure_capacity_notify_stig_test
      capability: independent.shellcommand
      collection: audit-configure-capacity-notify-stig-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: audit_configure_capacity_notify_stig_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: '25'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-audit-configure-capacity-notify-stig-test
