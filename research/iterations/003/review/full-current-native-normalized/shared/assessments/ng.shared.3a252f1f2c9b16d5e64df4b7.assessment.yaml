assessment:
  id: ng.shared.3a252f1f2c9b16d5e64df4b7
  version: 1
  assessment_title: The Server Message Block (SMB) v1 protocol must be disabled on the SMB client.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This requirement specifically applies to Windows 2012 but can also be used for Windows 2012 R2. Different methods
    are available to disable SMBv1 on Windows 2012 R2, if V-73805 is configured on Windows 2012 R2, this is NA. If the following
    registry value is not configured as specified, this is a finding: Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SYSTEM\CurrentControlSet\Services\mrxsmb10\
    Value Name: Start Type: REG_DWORD Value: 0x00000004 (4) If the following registry value includes MRxSmb10, this is a finding:
    Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SYSTEM\CurrentControlSet\Services\LanmanWorkstation\ Value Name: DependOnService
    Type: REG_MULTI_SZ Value: Default values after removing MRxSmb10 include the following, which are not a finding: Bowser
    MRxSmb20 NSI'
  inputs: []
  evidence: []
