assessment:
  id: ng.shared.c34ed260847b7c0fa6be303b
  version: 1
  assessment_title: The macOS system must enforce SSH to display the Standard Mandatory DOD Notice and Consent Banner.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    os-policy-banner-ssh-enforce-recommended-object-collection:
      collection_title: os_policy_banner_ssh_enforce_recommended_object
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: zsh
        command:
          operation: equals
          datatype: string
          mask: false
          value: /usr/sbin/sshd -G | /usr/bin/grep -c "^banner /etc/banner"
  tests:
    test-os-policy-banner-ssh-enforce-recommended-test:
      test_title: os_policy_banner_ssh_enforce_recommended_test
      capability: independent.shellcommand
      collection: os-policy-banner-ssh-enforce-recommended-object-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: os_policy_banner_ssh_enforce_recommended_state
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: '1'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-os-policy-banner-ssh-enforce-recommended-test
