assessment:
  id: ng.shared.8b0fdeeb262a47a68ff98547
  version: 1
  assessment_title: The audit system must identify in which zone an event occurred.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    auditconfig-getpolicy-matching-active-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: bash
        command:
          operation: equals
          datatype: string
          value: auditconfig -getpolicy
        pattern:
          operation: pattern match
          datatype: string
          value: active
      object_title: auditconfig -getpolicy matching active
  states:
    state-zonename-should-be-returned:
      state_title: zonename should be returned
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: zonename
          operation: pattern match
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-audit-system-identify-in-which-zone-event-occurred:
      test_title: The audit system must identify in which zone an event occurred.
      capability: independent.shellcommand
      object: auditconfig-getpolicy-matching-active-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-zonename-should-be-returned
  evaluate:
    test: test-audit-system-identify-in-which-zone-event-occurred
