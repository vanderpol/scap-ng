rule:
  id: SV-253481
  version: r958726
  title: The "Act as part of the operating system" user right must not be assigned to any groups or accounts.
  severity: high
  role: full
  weight: 10.0
  discussion: Inappropriate granting of user rights can provide system, administrative, and other high-level capabilities.
    Accounts with the "Act as part of the operating system" user right can assume the identity of any user and gain
    access to resources that user is authorized to access. Any accounts with this right can take complete control
    of a system.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-UR-000015
  - scheme: vulnerability
    value: V-253481
  - scheme: cci
    value: CCI-002235
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> User Rights Assignment >> "Act as part of the operating system" to be defined but containing
      no entries (blank).
