rule:
  id: SV-253412
  version: r991589
  title: Users must be notified if a web-based program attempts to install software.
  severity: medium
  role: full
  weight: 10.0
  discussion: Web-based programs may attempt to install malicious software on a system. Ensuring users are notified
    if a web-based program attempts to install software allows them to refuse the installation.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000320
  - scheme: vulnerability
    value: V-253412
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: The default behavior is for Internet Explorer to warn users and select whether to allow or refuse
      installation when a web-based program attempts to install software on the system. To correct this, configure
      the policy value for Computer Configuration >> Administrative Templates >> Windows Components >> Windows Installer
      >> "Prevent Internet Explorer security prompt for Windows Installer scripts" to "Not Configured" or "Disabled".
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253412.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253412.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253412.manual.assessment.yaml
  default_assessment_choice: default
