rule:
  id: SV-253377
  version: r991589
  title: Systems must at least attempt device authentication using certificates.
  severity: medium
  role: full
  weight: 10.0
  discussion: Using certificates to authenticate devices to the domain provides increased security over passwords.
    By default systems will attempt to authenticate using certificates and fall back to passwords if the domain
    controller does not support certificates for devices. This may also be configured to always use certificates
    for device authentication.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000115
  - scheme: vulnerability
    value: V-253377
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability:
  - windows11-stig-current-full.condition.windows-domain-member-workstation
  parameters: {}
  remediation:
    guidance: This requirement is applicable to domain-joined systems, for standalone systems this is NA. The default
      behavior for "Support device authentication using certificate" is "Automatic". To correct this, configured
      the policy value for Computer Configuration >> Administrative Templates >> System >> Kerberos >> "Support
      device authentication using certificate" to "Not Configured or "Enabled" with either option selected in "Device
      authentication behavior using certificate:".
  organizational_input_requirements: {}
