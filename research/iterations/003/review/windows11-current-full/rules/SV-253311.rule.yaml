    value: WN11-AU-000045
  - scheme: vulnerability
    value: V-253311
  - scheme: cci
    value: CCI-000172
  - scheme: cci
    value: CCI-003938
  - scheme: cci
    value: CCI-001814
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Computer Configuration >> Windows Settings >> Advanced Audit Policy Configuration >> System Audit
      Policies >> Detailed Tracking >> "Audit PNP Activity" with "Success" selected.
