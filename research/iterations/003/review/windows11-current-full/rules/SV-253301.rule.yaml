rule:
  id: SV-253301
  version: r1051042
  title: The maximum password age must be configured to 60 days or less.
  severity: medium
  role: full
  weight: 10.0
  discussion: The longer a password is in use, the greater the opportunity for someone to gain unauthorized knowledge
    of the passwords. Scheduled changing of passwords hinders the ability of unauthorized system users to crack
    passwords and gain access to a system.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-AC-000025
  - scheme: vulnerability
    value: V-253301
  - scheme: cci
    value: CCI-004066
  - scheme: cci
    value: CCI-000199
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Account Policies >> Password Policy >> "Maximum Password Age" to "60" days or less (excluding "0" which is
      unacceptable).
  organizational_input_requirements: {}
  assessment_choices:
