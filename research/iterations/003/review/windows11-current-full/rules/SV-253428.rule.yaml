rule:
  id: SV-253428
  version: r1256659
  title: The External Root CA certificates must be installed in the Trusted Root Store on unclassified systems.
  severity: medium
  role: full
  weight: 10.0
  discussion: To ensure secure websites protected with External Certificate Authority (ECA) server certificates
    are properly validated, the system must trust the ECA Root CAs. The ECA root certificates will ensure the trust
    chain is established for server certificates issued from the External CAs. This requirement applies only to
    unclassified systems.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-PK-000010
  - scheme: vulnerability
    value: V-253428
  - scheme: cci
    value: CCI-000185
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Install valid (unexpired) ECA Root CA certificates on unclassified systems. The list below is not
      to be treated as exhaustive. The STIG should not be used as a definitive resource for the organizationally
      approved certificates for the systems. ECA Root CA 4 ECA Root CA 5 The InstallRoot tool is available on Cyber
      Exchange at https://cyber.mil/pki-pke/tools-configuration-files. Certificate bundles published by the PKI
      can be found at https://crl.gds.disa.mil/.
