rule:
  id: SV-253379
  version: r958478
  title: Local users on domain-joined computers must not be enumerated.
  severity: medium
  role: full
  weight: 10.0
  discussion: The username is one part of logon credentials that could be used to gain access to a system. Preventing
    the enumeration of users limits this information to authorized personnel.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000130
  - scheme: vulnerability
    value: V-253379
  - scheme: cci
    value: CCI-000381
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability:
  - condition.windows-domain-member-workstation
  parameters: {}
  remediation:
    guidance: This requirement is applicable to domain-joined systems, for standalone systems this is NA. Configure
      the policy value for Computer Configuration >> Administrative Templates >> System >> Logon >> "Enumerate local
      users on domain-joined computers" to "Disabled".
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253379.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253379.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253379.manual.assessment.yaml
  default_assessment_choice: default
