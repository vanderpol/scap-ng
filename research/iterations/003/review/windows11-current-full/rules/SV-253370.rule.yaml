rule:
  id: SV-253370
  version: r1210290
  title: Credential Guard must be running on Windows 11 systems.
  severity: high
  role: full
  weight: 10.0
  discussion: Credential Guard uses virtualization-based security to protect information that could be used in credential
    theft attacks if compromised. This authentication information, which was stored in the Local Security Authority
    (LSA) in previous versions of Windows, is isolated from the rest of operating system and can only be accessed
    by privileged system software.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000075
  - scheme: vulnerability
    value: V-253370
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Administrative Templates >> System >> Device
      Guard >> "Turn On virtualization-based Security" to "Enabled" with "Enabled with UEFI lock" selected for "Credential
      Guard Configuration:". A Microsoft TechNet article on Credential Guard, including system requirement details,
      can be found at the following link: https://docs.microsoft.com/en-us/windows/access-protection/credential-guard/credential-guard'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253370.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253370.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253370.manual.assessment.yaml
  default_assessment_choice: default
