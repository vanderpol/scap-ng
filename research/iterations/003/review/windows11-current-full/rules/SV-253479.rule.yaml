rule:
  id: SV-253479
  version: r958726
  title: The "Access Credential Manager as a trusted caller" user right must not be assigned to any groups or accounts.
  severity: medium
  role: full
  weight: 10.0
  discussion: Inappropriate granting of user rights can provide system, administrative, and other high-level capabilities.
    Accounts with the "Access Credential Manager as a trusted caller" user right may be able to retrieve the credentials
    of other accounts from Credential Manager.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-UR-000005
  - scheme: vulnerability
    value: V-253479
  - scheme: cci
    value: CCI-002235
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> User Rights Assignment >> "Access Credential Manager as a trusted caller" to be defined
      but containing no entries (blank).
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253479.automated.assessment.yaml
    automated:
