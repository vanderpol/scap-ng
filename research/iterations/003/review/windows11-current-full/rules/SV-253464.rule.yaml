rule:
  id: SV-253464
  version: r991589
  title: The system must be configured to meet the minimum session security requirement for NTLM SSP based clients.
  severity: medium
  role: full
  weight: 10.0
  discussion: Microsoft has implemented a variety of security support providers for use with RPC sessions. All of
    the options must be enabled to ensure the maximum security level.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000215
  - scheme: vulnerability
    value: V-253464
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> Security Options >> "Network security: Minimum session security for NTLM SSP based (including
      secure RPC) clients" to "Require NTLMv2 session security" and "Require 128-bit encryption" (all options selected).'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/windows11-stig-current-full.SV-253464.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/windows11-stig-current-full.SV-253464.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/windows11-stig-current-full.SV-253464.manual.assessment.yaml
  default_assessment_choice: default
