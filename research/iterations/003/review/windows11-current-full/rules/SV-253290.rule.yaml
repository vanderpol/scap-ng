rule:
  id: SV-253290
  version: r991589
  title: Orphaned security identifiers (SIDs) must be removed from user rights on Windows 11.
  severity: medium
  role: full
  weight: 10.0
  discussion: Accounts or groups given rights on a system may show up as unresolved SIDs for various reasons including
    deletion of the accounts or groups. If the account or group objects are reanimated, there is a potential they
    may still have rights no longer intended. Valid domain accounts or groups may also show up as unresolved SIDs
    if a connection to the domain cannot be established for some reason.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-00-000190
  - scheme: vulnerability
    value: V-253290
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Remove any unresolved SIDs found in User Rights assignments and determined to not be for currently
      valid accounts or groups by removing the accounts or groups from the appropriate group policy.
  organizational_input_requirements: {}
