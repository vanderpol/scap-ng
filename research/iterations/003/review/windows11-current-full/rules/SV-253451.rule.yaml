rule:
  id: SV-253451
  version: r958908
  title: The Windows SMB server must be configured to always perform SMB packet signing.
  severity: medium
  role: full
  weight: 10.0
  discussion: The server message block (SMB) protocol provides the basis for many network operations. Digitally
    signed SMB packets aid in preventing man-in-the-middle attacks. If this policy is enabled, the SMB server will
    only communicate with an SMB client that performs SMB packet signing.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000120
  - scheme: vulnerability
    value: V-253451
  - scheme: cci
    value: CCI-002418
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> Security Options >> "Microsoft network server: Digitally sign communications (always)" to
      "Enabled".'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253451.automated.assessment.yaml
    automated:
