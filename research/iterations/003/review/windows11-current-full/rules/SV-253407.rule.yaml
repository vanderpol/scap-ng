rule:
  id: SV-253407
  version: r991589
  title: Attachments must be prevented from being downloaded from RSS feeds.
  severity: medium
  role: full
  weight: 10.0
  discussion: Attachments from RSS feeds may not be secure. This setting will prevent attachments from being downloaded
    from RSS feeds.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000295
  - scheme: vulnerability
    value: V-253407
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components
      >> RSS Feeds >> "Prevent downloading of enclosures" to "Enabled".
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253407.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253407.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253407.manual.assessment.yaml
  default_assessment_choice: default
