rule:
  id: SV-253446
  version: r958586
  title: The Windows message title for the legal notice must be configured.
  severity: low
  role: full
  weight: 10.0
  discussion: Failure to display the logon banner prior to a logon attempt will negate legal proceedings resulting
    from unauthorized access to system resources.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000080
  - scheme: vulnerability
    value: V-253446
  - scheme: cci
    value: CCI-000048
  - scheme: cci
    value: CCI-001384
  - scheme: cci
    value: CCI-001385
  - scheme: cci
    value: CCI-001386
  - scheme: cci
    value: CCI-001387
  - scheme: cci
    value: CCI-001388
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> Security Options >> "Interactive logon: Message title for users attempting to log on" to
      "DoD Notice and Consent Banner", "US Department of Defense Warning Statement", or a site-defined equivalent.
      If a site-defined title is used, it can in no case contravene or modify the language of the banner text required
      in WN11-SO-000075.'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253446.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253446.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253446.manual.assessment.yaml
  default_assessment_choice: default
