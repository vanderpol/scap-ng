rule:
  id: SV-253388
  version: r958804
  title: Autoplay must be disabled for all drives.
  severity: high
  role: full
  weight: 10.0
  discussion: Allowing autoplay to execute may introduce malicious code to a system. Autoplay begins reading from
    a drive as soon as media is inserted in the drive. As a result, the setup file of programs or music on audio
    media may start. By default, autoplay is disabled on removable drives, such as the floppy disk drive (but not
    the CD-ROM drive) and on network drives. If this policy is enabled, autoplay can be disabled on all drives.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000190
  - scheme: vulnerability
    value: V-253388
  - scheme: cci
    value: CCI-001764
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components
      >> AutoPlay Policies >> "Turn off AutoPlay" to "Enabled:All Drives".
  organizational_input_requirements: {}
