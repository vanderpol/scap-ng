rule:
  id: SV-253505
  version: r958726
  title: The "Restore files and directories" user right must only be assigned to the Administrators group.
  severity: medium
  role: full
  weight: 10.0
  discussion: Inappropriate granting of user rights can provide system, administrative, and other high-level capabilities.
    Accounts with the "Restore files and directories" user right can circumvent file and directory permissions and
    could allow access to sensitive data. It could also be used to over-write more current data.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-UR-000160
  - scheme: vulnerability
    value: V-253505
  - scheme: cci
    value: CCI-002235
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> User Rights Assignment >> "Restore files and directories" to only include the following
      groups or accounts: Administrators'
  organizational_input_requirements: {}
  assessment_choices:
