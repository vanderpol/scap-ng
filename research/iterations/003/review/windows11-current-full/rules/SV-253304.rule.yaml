rule:
  id: SV-253304
  version: r1051045
  title: The built-in Microsoft password complexity filter must be enabled.
  severity: medium
  role: full
  weight: 10.0
  discussion: The use of complex passwords increases their strength against guessing and brute-force attacks. This
    setting configures the system to verify that newly created passwords conform to the Windows password complexity
    policy.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-AC-000040
  - scheme: vulnerability
    value: V-253304
  - scheme: cci
    value: CCI-004066
  - scheme: cci
    value: CCI-000192
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Account Policies >> Password Policy >> "Password must meet complexity requirements" to "Enabled".
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253304.automated.assessment.yaml
    automated:
