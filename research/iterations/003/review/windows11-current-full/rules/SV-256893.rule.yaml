rule:
  id: SV-256893
  version: r958552
  title: Internet Explorer must be disabled for Windows 11.
  severity: medium
  role: full
  weight: 10.0
  discussion: Internet Explorer 11 (IE11) is not supported on Windows 11 semi-annual channel.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000391
  - scheme: vulnerability
    value: V-256893
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'For Windows 11 semi-annual channel, remove or disable the IE11 application. To disable IE11 as a
      standalone browser: Set the policy value for "Computer Configuration/Administrative Templates/Windows Components/Internet
      Explorer/Disable Internet Explorer 11 as a standalone browser" to "Enabled" with the option value set to "Never".'
