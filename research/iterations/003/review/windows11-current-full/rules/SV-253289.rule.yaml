rule:
  id: SV-253289
  version: r958478
  title: The Secondary Logon service must be disabled on Windows 11.
  severity: medium
  role: full
  weight: 10.0
  discussion: The Secondary Logon service provides a means for entering alternate credentials, typically used to
    run commands with elevated privileges. Using privileged credentials in a standard user session can expose those
    credentials to theft.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-00-000175
  - scheme: vulnerability
    value: V-253289
  - scheme: cci
    value: CCI-000381
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the "Secondary Logon" service "Startup Type" to "Disabled".
