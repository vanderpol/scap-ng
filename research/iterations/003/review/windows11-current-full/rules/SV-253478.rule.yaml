rule:
  id: SV-253478
  version: r991589
  title: Zone information must be preserved when saving attachments.
  severity: medium
  role: full
  weight: 10.0
  discussion: Preserving zone of origin (internet, intranet, local, restricted) information on file attachments
    allows Windows to determine risk.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-UC-000020
  - scheme: vulnerability
    value: V-253478
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: The default behavior is for Windows to mark file attachments with their zone information. To correct
      this, configure the policy value for User Configuration >> Administrative Templates >> Windows Components
      >> Attachment Manager >> "Do not preserve zone information in file attachments" to "Not Configured" or "Disabled".
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/windows11-stig-current-full.SV-253478.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/windows11-stig-current-full.SV-253478.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/windows11-stig-current-full.SV-253478.manual.assessment.yaml
  default_assessment_choice: default
