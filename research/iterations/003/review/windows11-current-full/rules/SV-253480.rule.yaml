rule:
  id: SV-253480
  version: r1137691
  title: The "Access this computer from the network" user right must only be assigned to the Administrators and
    Remote Desktop Users groups.
  severity: medium
  role: full
  weight: 10.0
  discussion: Inappropriate granting of user rights can provide system, administrative, and other high-level capabilities.
    Accounts with the "Access this computer from the network" user right may access resources on the system, and
    must be limited to those that require it.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-UR-000010
  - scheme: vulnerability
    value: V-253480
  - scheme: cci
    value: CCI-000213
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> User Rights Assignment >> "Access this computer from the network" to only include the following
      groups or accounts: Administrators Remote Desktop Users'
  organizational_input_requirements: {}
  assessment_choices:
