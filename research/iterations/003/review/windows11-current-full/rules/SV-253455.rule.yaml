rule:
  id: SV-253455
  version: r991589
  title: The system must be configured to prevent anonymous users from having the same rights as the Everyone group.
  severity: medium
  role: full
  weight: 10.0
  discussion: Access by anonymous users must be restricted. If this setting is enabled, then anonymous users have
    the same rights and permissions as the built-in Everyone group. Anonymous users must not have these permissions
    or rights.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000160
  - scheme: vulnerability
    value: V-253455
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> Security Options >> "Network access: Let Everyone permissions apply to anonymous users"
      to "Disabled".'
  organizational_input_requirements: {}
  assessment_choices:
    default:
