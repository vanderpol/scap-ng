rule:
  id: SV-253273
  version: r1051040
  title: Accounts must be configured to require password expiration.
  severity: medium
  role: full
  weight: 10.0
  discussion: Passwords that do not expire increase exposure with a greater probability of being discovered or cracked.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-00-000090
  - scheme: vulnerability
    value: V-253273
  - scheme: cci
    value: CCI-004066
  - scheme: cci
    value: CCI-000199
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure all passwords to expire. Run "Computer Management". Navigate to System Tools >> Local Users
      and Groups >> Users. Double-click each active account. Ensure "Password never expires" is not checked on all
      active accounts.
  organizational_input_requirements: {}
  assessment_choices:
