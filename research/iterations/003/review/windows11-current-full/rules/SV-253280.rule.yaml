rule:
  id: SV-253280
  version: r991589
  title: Software certificate installation files must be removed from Windows 11.
  severity: medium
  role: full
  weight: 10.0
  discussion: Use of software certificates and their accompanying installation files for end users to access resources
    is less secure than the use of hardware-based certificates.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-00-000130
  - scheme: vulnerability
    value: V-253280
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Remove any certificate installation files (*.p12 and *.pfx) found on a system. Note: This does not
      apply to server-based applications that have a requirement for .p12 certificate files (e.g., Oracle Wallet
      Manager) or Adobe PreFlight certificate files.'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253280.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253280.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253280.manual.assessment.yaml
  default_assessment_choice: default
