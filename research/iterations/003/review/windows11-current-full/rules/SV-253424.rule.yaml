rule:
  id: SV-253424
  version: r1210299
  title: Windows Ink Workspace must be configured to disallow access above the lock.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'This action secures Windows Ink, which contains applications and features oriented toward pen computing.
    Note: A different registry location is needed when systems are managed by Intune versus GPO.'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000385
  - scheme: vulnerability
    value: V-253424
  - scheme: cci
    value: CCI-000060
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Disable the convenience PIN sign-in. For GPO-managed systems: Configure the policy value for Computer
      Configuration >> Administrative Templates >> Windows Components >> Windows Ink Workspace >> Set "Allow Windows
      Ink Workspace" to "Enabled and set Options On, but disallow access above lock". For Intune-managed systems:
      Set the Windows Ink Workspace Policy to disallow access above lock.'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253424.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253424.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253424.manual.assessment.yaml
  default_assessment_choice: default
