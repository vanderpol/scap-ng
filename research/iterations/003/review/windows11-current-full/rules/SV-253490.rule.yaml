rule:
  id: SV-253490
  version: r958726
  title: The "Debug programs" user right must only be assigned to the Administrators group.
  severity: high
  role: full
  weight: 10.0
  discussion: Inappropriate granting of user rights can provide system, administrative, and other high-level capabilities.
    Accounts with the "Debug Programs" user right can attach a debugger to any process or to the kernel, providing
    complete access to sensitive and critical operating system components. This right is given to Administrators
    in the default configuration.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-UR-000065
  - scheme: vulnerability
    value: V-253490
  - scheme: cci
    value: CCI-002235
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> User Rights Assignment >> "Debug programs" to only include the following groups or accounts:
      Administrators'
  organizational_input_requirements: {}
