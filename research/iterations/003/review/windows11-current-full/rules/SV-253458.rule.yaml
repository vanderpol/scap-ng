rule:
  id: SV-253458
  version: r991589
  title: NTLM must be prevented from falling back to a Null session.
  severity: medium
  role: full
  weight: 10.0
  discussion: NTLM sessions that are allowed to fall back to Null (unauthenticated) sessions may gain unauthorized
    access.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000180
  - scheme: vulnerability
    value: V-253458
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> Security Options >> "Network security: Allow LocalSystem NULL session fallback" to "Disabled".'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253458.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253458.automated.assessment.yaml
    manual:
