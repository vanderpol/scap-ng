rule:
  id: SV-253271
  version: r958702
  title: Only authorized user accounts must be allowed to create or run virtual machines on Windows 11 systems.
  severity: medium
  role: full
  weight: 10.0
  discussion: Allowing other operating systems to run on a secure system may allow users to circumvent security.
    For Hyper-V, preventing unauthorized users from being assigned to the Hyper-V Administrators group will prevent
    them from accessing or creating virtual machines on the system. The Hyper-V Hypervisor is used by virtualization-based
    Security features such as Credential Guard on Windows 11; however, it is not the full Hyper-V installation.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-00-000080
  - scheme: vulnerability
    value: V-253271
  - scheme: cci
    value: CCI-002165
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: For Hyper-V, remove any unauthorized groups or user accounts from the "Hyper-V Administrators" group.
      For hosted hypervisors other than Hyper-V, restrict access to create or run virtual machines to authorized
      user accounts only.
  assessment_choices:
