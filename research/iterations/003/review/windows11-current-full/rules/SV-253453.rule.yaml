rule:
  id: SV-253453
  version: r991589
  title: Anonymous enumeration of SAM accounts must not be allowed.
  severity: high
  role: full
  weight: 10.0
  discussion: Anonymous enumeration of SAM accounts allows anonymous log on users (null session connections) to
    list all accounts names, thus providing a list of potential points to attack the system.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000145
  - scheme: vulnerability
    value: V-253453
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> Security Options >> "Network access: Do not allow anonymous enumeration of SAM accounts"
      to "Enabled".'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253453.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253453.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253453.manual.assessment.yaml
  default_assessment_choice: default
