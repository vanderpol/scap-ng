rule:
  id: SV-253395
  version: r958478
  title: The Microsoft Defender SmartScreen for Explorer must be enabled.
  severity: medium
  role: full
  weight: 10.0
  discussion: Microsoft Defender SmartScreen helps protect systems from programs downloaded from the internet that
    may be malicious. Enabling Microsoft Defender SmartScreen will warn or prevent users from running potentially
    malicious programs.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000210
  - scheme: vulnerability
    value: V-253395
  - scheme: cci
    value: CCI-000381
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components
      >> File Explorer >> "Configure Windows Defender SmartScreen" to "Enabled" with "Warn and prevent bypass" selected.
      Windows 11 includes duplicate policies for this setting. It can also be configured under Computer Configuration
      >> Administrative Templates >> Windows Components >> Windows Defender SmartScreen >> Explorer.
  organizational_input_requirements: {}
