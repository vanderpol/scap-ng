rule:
  id: SV-253476
  version: r1210304
  title: Passwords for enabled local Administrator accounts must be changed at least every 60 days.
  severity: medium
  role: full
  weight: 10.0
  discussion: The longer a password is in use, the greater the opportunity for someone to gain unauthorized knowledge
    of the password. A local Administrator account is not generally used and its password may not be changed as
    frequently as necessary. Changing the password for enabled Administrator accounts on a regular basis will limit
    their exposure. Windows LAPS must be used to change the built-in Administrator account password. Operational
    limitations preventing the use of Windows Local Administrator Password Solution (LAPS) must be approved by the
    authorizing official (AO).
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
