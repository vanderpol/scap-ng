rule:
  id: SV-253452
  version: r991589
  title: Anonymous SID/Name translation must not be allowed.
  severity: high
  role: full
  weight: 10.0
  discussion: Allowing anonymous SID/Name translation can provide sensitive information for accessing a system.
    Only authorized users must be able to perform such translations.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000140
  - scheme: vulnerability
    value: V-253452
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> Security Options >> "Network access: Allow anonymous SID/Name translation" to "Disabled".'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253452.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253452.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253452.manual.assessment.yaml
  default_assessment_choice: default
