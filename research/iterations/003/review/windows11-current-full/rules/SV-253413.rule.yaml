rule:
  id: SV-253413
  version: r991591
  title: Automatically signing in the last interactive user after a system-initiated restart must be disabled.
  severity: medium
  role: full
  weight: 10.0
  discussion: Windows can be configured to automatically sign the user back in after a Windows Update restart. Some
    protections are in place to help ensure this is done in a secure fashion; however, disabling this will prevent
    the caching of credentials for this purpose and also ensure the user is aware of the restart.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000325
  - scheme: vulnerability
    value: V-253413
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components
      >> Windows Logon Options >> "Sign-in last interactive user automatically after a system-initiated restart"
      to "Disabled".
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253413.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253413.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253413.manual.assessment.yaml
  default_assessment_choice: default
