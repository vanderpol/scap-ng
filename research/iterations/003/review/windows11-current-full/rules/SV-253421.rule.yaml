rule:
  id: SV-253421
  version: r958510
  title: The Windows Remote Management (WinRM) client must not use Digest authentication.
  severity: medium
  role: full
  weight: 10.0
  discussion: Digest authentication is not as strong as other options and may be subject to man-in-the-middle attacks.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000360
  - scheme: vulnerability
    value: V-253421
  - scheme: cci
    value: CCI-000877
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components
      >> Windows Remote Management (WinRM) >> WinRM Client >> "Disallow Digest authentication" to "Enabled".
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253421.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253421.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253421.manual.assessment.yaml
  default_assessment_choice: default
