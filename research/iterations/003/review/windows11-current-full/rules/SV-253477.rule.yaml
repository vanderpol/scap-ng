rule:
  id: SV-253477
  version: r958478
  title: Toast notifications to the lock screen must be turned off.
  severity: low
  role: full
  weight: 10.0
  discussion: Toast notifications that are displayed on the lock screen could display sensitive information to unauthorized
    personnel. Turning off this feature will limit access to the information to a logged on user.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-UC-000015
  - scheme: vulnerability
    value: V-253477
  - scheme: cci
    value: CCI-000381
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for User Configuration >> Administrative Templates >> Start Menu and Taskbar
      >> Notifications >> "Turn off toast notifications on the lock screen" to "Enabled".
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253477.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253477.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253477.manual.assessment.yaml
  default_assessment_choice: default
