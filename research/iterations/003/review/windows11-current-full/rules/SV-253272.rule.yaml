rule:
  id: SV-253272
  version: r1210286
  title: Standard local user accounts must not exist on a system in a domain.
  severity: low
  role: full
  weight: 10.0
  discussion: To minimize potential points of attack, local user accounts, other than built-in accounts and local
    administrator accounts, must not exist on a workstation in a domain. Users must log on to workstations in a
    domain with their domain accounts.
  rationale: null
  extensions:
    disa_stig:
