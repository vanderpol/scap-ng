rule:
  id: SV-253347
  version: r958412
  title: Windows 11 must be configured to audit Detailed File Share Failures.
  severity: medium
  role: full
  weight: 10.0
  discussion: Maintaining an audit trail of system activity logs can help identify configuration errors, troubleshoot
    service disruptions, and analyze compromises that have occurred, as well as detect attacks. Audit logs are necessary
    to provide a trail of evidence in case the system or network is compromised. Collecting this data is essential
    for analyzing the security of information assets and detecting signs of suspicious and unexpected behavior.
    Audit Detailed File Share allows the user to audit attempts to access files and folders on a shared folder.
    The Detailed File Share setting logs an event every time a file or folder is accessed, whereas the File Share
    setting only records one event for any connection established between a client and file share. Detailed File
    Share audit events include detailed information about the permissions or other criteria used to grant or deny
    access.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-AU-000570
  - scheme: vulnerability
    value: V-253347
  - scheme: cci
    value: CCI-000130
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Advanced Audit Policy Configuration >> System Audit Policies >> Object Access >> Audit Detailed File Share"
      with "Failure" selected.
