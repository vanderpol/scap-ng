rule:
  id: SV-253425
  version: r958478
  title: Windows 11 must be configured to prevent users from receiving suggestions for third-party or additional
    applications.
  severity: low
  role: full
  weight: 10.0
  discussion: Windows spotlight features may suggest apps and content from third-party software publishers in addition
    to Microsoft apps and content.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000390
  - scheme: vulnerability
    value: V-253425
  - scheme: cci
    value: CCI-000381
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for User Configuration >> Administrative Templates. >> Windows Components
      >> Cloud Content >> "Do not suggest third-party content in Windows spotlight" to "Enabled".
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253425.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253425.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253425.manual.assessment.yaml
  default_assessment_choice: default
