rule:
  id: SV-253426
  version: r991580
  title: Windows 11 Kernel (Direct Memory Access) DMA Protection must be enabled.
  severity: medium
  role: full
  weight: 10.0
  discussion: Kernel DMA Protection to protect PCs against drive-by Direct Memory Access (DMA) attacks using PCI
    hot plug devices connected to Thunderbolt 3 ports. Drive-by DMA attacks can lead to disclosure of sensitive
    information residing on a PC, or even injection of malware that allows attackers to bypass the lock screen or
    control PCs remotely.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-EP-000310
  - scheme: vulnerability
    value: V-253426
  - scheme: cci
    value: CCI-000172
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> System >> Kernel
      DMA Protection >> "Enumeration policy for external devices incompatible with Kernel DMA Protection" to "Enabled"
      with "Enumeration Policy" set to "Block All".
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/windows11-stig-current-full.SV-253426.automated.assessment.yaml
    automated:
