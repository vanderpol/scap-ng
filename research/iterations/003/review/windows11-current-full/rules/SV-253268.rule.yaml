rule:
  id: SV-253268
  version: r1051039
  title: Unused accounts must be disabled or removed from the system after 35 days of inactivity.
  severity: low
  role: full
  weight: 10.0
  discussion: 'Outdated or unused accounts provide penetration points that may go undetected. Inactive accounts
    must be deleted if no longer necessary or, if still required, disable until needed. Satisfies: SRG-OS-000468-GPOS-00212,
    SRG-OS-000118-GPOS-00060'
