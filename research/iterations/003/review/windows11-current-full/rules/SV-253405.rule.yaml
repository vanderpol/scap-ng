rule:
  id: SV-253405
  version: r991554
  title: The Remote Desktop Session Host must require secure RPC communications.
  severity: medium
  role: full
  weight: 10.0
  discussion: Allowing unsecure RPC communication exposes the system to man in the middle attacks and data disclosure
    attacks. A man in the middle attack occurs when an intruder captures packets between a client and server and
    modifies them before allowing the packets to be exchanged. Usually the attacker will modify the information
    in the packets in an attempt to cause either the client or server to reveal sensitive information.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000285
  - scheme: vulnerability
    value: V-253405
  - scheme: cci
    value: CCI-001453
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components
      >> Remote Desktop Services >> Remote Desktop Session Host >> Security "Require secure RPC communication" to
      "Enabled".
  organizational_input_requirements: {}
