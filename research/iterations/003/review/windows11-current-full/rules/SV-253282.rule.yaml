rule:
  id: SV-253282
  version: r991593
  title: Inbound exceptions to the firewall on Windows 11 domain workstations must only allow authorized remote
    management hosts.
  severity: medium
  role: full
  weight: 10.0
  discussion: Allowing inbound access to domain workstations from other systems may allow lateral movement across
    systems if credentials are compromised. Limiting inbound connections only from authorized remote management
    systems will help limit this exposure.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-00-000140
  - scheme: vulnerability
    value: V-253282
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure firewall exceptions to inbound connections on domain workstations to include only authorized
      remote management hosts. Configure only inbound connection exceptions for authorized remote management hosts.
      Computer Configuration >> Windows Settings >> Security Settings >> Windows Defender Firewall with Advanced
      Security >> Windows Defender Firewall with Advanced Security >> Inbound Rules (this link will be in the right
      pane) For any inbound rules that allow connections, configure the Scope for Remote IP address to those of
      authorized remote management hosts. This may be defined as an IP address, subnet or range. Apply the rule
      to all firewall profiles. If a third-party firewall is used, configure inbound exceptions to only include
      authorized remote management hosts.
  assessment_choices:
    default:
      assessment: ../assessments/manual/SV-253282.manual.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253282.manual.assessment.yaml
  default_assessment_choice: default
