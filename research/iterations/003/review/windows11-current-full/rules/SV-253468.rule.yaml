rule:
  id: SV-253468
  version: r1051057
  title: User Account Control approval mode for the built-in Administrator must be enabled.
  severity: medium
  role: full
  weight: 10.0
  discussion: User Account Control (UAC) is a security mechanism for limiting the elevation of privileges, including
    administrative accounts, unless authorized. This setting configures the built-in Administrator account so that
    it runs in Admin Approval Mode.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000245
  - scheme: vulnerability
    value: V-253468
  - scheme: cci
    value: CCI-002038
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> Security Options >> "User Account Control: Admin Approval Mode for the Built-in Administrator
      account" to "Enabled".'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253468.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253468.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253468.manual.assessment.yaml
  default_assessment_choice: default
