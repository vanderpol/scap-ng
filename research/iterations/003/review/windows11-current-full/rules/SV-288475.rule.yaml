rule:
  id: SV-288475
  version: r1256669
  title: All Wi-Fi Direct adapters must be disabled on the system.
  severity: medium
  role: full
  weight: 10.0
  discussion: Wi-Fi Direct establishes a peer-to-peer (P2P) connection that lacks robust authentication. Due to
    its vulnerability to several types of attacks (including SSID spoofing and unauthorized network bridge), there
    is potential for sensitive information to be compromised.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-00-000400
  - scheme: vulnerability
    value: V-288475
  - scheme: cci
    value: CCI-000382
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Remove existing Wi-Fi Direct adapters from the system. Open PowerShell with elevated privileges (run
      as administrator). Enter the following command: Get-NetAdapter -InterfaceDescription "Microsoft Wi-Fi Direct*"
      -IncludeHidden | Disable-NetAdapter -Confirm:$false".'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/manual/SV-288475.manual.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-288475.manual.assessment.yaml
  default_assessment_choice: default
