rule:
  id: SV-253475
  version: r958518
  title: User Account Control must virtualize file and registry write failures to per-user locations.
  severity: medium
  role: full
  weight: 10.0
  discussion: User Account Control (UAC) is a security mechanism for limiting the elevation of privileges, including
    administrative accounts, unless authorized. This setting configures non-UAC compliant applications to run in
    virtualized file and registry entries in per-user locations, allowing them to run.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000275
  - scheme: vulnerability
    value: V-253475
  - scheme: cci
    value: CCI-001084
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> Security Options >> "User Account Control: Virtualize file and registry write failures to
      per-user locations" to "Enabled".'
  assessment_choices:
    default:
