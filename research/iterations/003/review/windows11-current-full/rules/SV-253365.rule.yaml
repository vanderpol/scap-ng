rule:
  id: SV-253365
  version: r991589
  title: Connections to non-domain networks when connected to a domain authenticated network must be blocked.
  severity: medium
  role: full
  weight: 10.0
  discussion: Multiple network connections can provide additional attack vectors to a system and must be limited.
    When connected to a domain, communication must go through the domain connection.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000060
  - scheme: vulnerability
    value: V-253365
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> Network >> Windows
      Connection Manager >> "Prohibit connection to non-domain networks when connected to domain authenticated network"
      to "Enabled".
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253365.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253365.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253365.manual.assessment.yaml
  default_assessment_choice: default
