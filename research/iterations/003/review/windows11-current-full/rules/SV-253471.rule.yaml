rule:
  id: SV-253471
  version: r1051058
  title: User Account Control must automatically deny elevation requests for standard users.
  severity: medium
  role: full
  weight: 10.0
  discussion: User Account Control (UAC) is a security mechanism for limiting the elevation of privileges, including
    administrative accounts, unless authorized. Denying elevation requests from standard user accounts requires
    tasks that need elevation to be initiated by accounts with administrative privileges. This ensures correct accounts
    are used on the system for privileged tasks to help mitigate credential theft.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000255
  - scheme: vulnerability
    value: V-253471
  - scheme: cci
    value: CCI-002038
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> Security Options >> "User Account Control: Behavior of the elevation prompt for standard
      users" to "Automatically deny elevation requests".'
  organizational_input_requirements: {}
