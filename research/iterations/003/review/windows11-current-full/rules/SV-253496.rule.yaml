rule:
  id: SV-253496
  version: r958726
  title: The "Enable computer and user accounts to be trusted for delegation" user right must not be assigned to
    any groups or accounts.
  severity: medium
  role: full
  weight: 10.0
  discussion: Inappropriate granting of user rights can provide system, administrative, and other high-level capabilities.
    The "Enable computer and user accounts to be trusted for delegation" user right allows the "Trusted for Delegation"
    setting to be changed. This could potentially allow unauthorized users to impersonate other users.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-UR-000095
  - scheme: vulnerability
    value: V-253496
  - scheme: cci
    value: CCI-002235
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> User Rights Assignment >> "Enable computer and user accounts to be trusted for delegation"
      to be defined but containing no entries (blank).
  organizational_input_requirements: {}
