rule:
  id: SV-253410
  version: r1051053
  title: Users must be prevented from changing installation options.
  severity: medium
  role: full
  weight: 10.0
  discussion: Installation options for applications are typically controlled by administrators. This setting prevents
    users from changing installation options that may bypass security features.
  rationale: null
