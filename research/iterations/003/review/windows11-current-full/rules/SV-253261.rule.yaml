rule:
  id: SV-253261
  version: r1210284
  title: Windows 11 systems must use a BitLocker PIN with a minimum length of six digits for pre-boot authentication.
  severity: medium
  role: full
  weight: 10.0
  discussion: If data at rest is unencrypted, it is vulnerable to disclosure. Even if the operating system enforces
    permissions on data access, an adversary can remove nonvolatile memory and read it directly, thereby circumventing
    operating system controls. Encrypting the data ensures that confidentiality is protected even when the operating
    system is not running. Pre-boot authentication prevents unauthorized users from accessing encrypted drives.
    Increasing the pin length requires a greater number of guesses for an attacker.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-00-000032
  - scheme: vulnerability
    value: V-253261
  - scheme: cci
    value: CCI-000804
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components
      >> BitLocker Drive Encryption >> Operating System Drives "Configure minimum PIN length for startup" to "Enabled"
      with "Minimum characters:" set to "6" or greater.
  organizational_input_requirements: {}
