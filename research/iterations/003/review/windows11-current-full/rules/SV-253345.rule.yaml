rule:
  id: SV-253345
  version: r958412
  title: Windows 11 must be configured to audit other Logon/Logoff Events Successes.
  severity: medium
  role: full
  weight: 10.0
  discussion: Maintaining an audit trail of system activity logs can help identify configuration errors, troubleshoot
    service disruptions, and analyze compromises that have occurred, as well as detect attacks. Audit logs are necessary
    to provide a trail of evidence in case the system or network is compromised. Collecting this data is essential
    for analyzing the security of information assets and detecting signs of suspicious and unexpected behavior.
    Audit Other Logon/Logoff Events determines whether Windows generates audit events for other logon or logoff
    events. Logon events are essential to understanding user activity and detecting potential attacks.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-AU-000560
  - scheme: vulnerability
    value: V-253345
  - scheme: cci
    value: CCI-000130
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Advanced Audit Policy Configuration >> System Audit Policies >> Logon/Logoff >> "Audit Other Logon/Logoff
      Events" with "Success" selected.
