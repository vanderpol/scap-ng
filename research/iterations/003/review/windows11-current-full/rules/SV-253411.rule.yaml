rule:
  id: SV-253411
  version: r1051054
  title: The Windows Installer feature "Always install with elevated privileges" must be disabled.
  severity: high
  role: full
  weight: 10.0
  discussion: Standard user accounts must not be granted elevated privileges. Enabling Windows Installer to elevate
    privileges when installing applications can allow malicious persons and applications to gain full control of
    a system.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000315
  - scheme: vulnerability
    value: V-253411
  - scheme: cci
    value: CCI-003980
  - scheme: cci
    value: CCI-001812
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components
      >> Windows Installer >> "Always install with elevated privileges" to "Disabled".
  organizational_input_requirements: {}
  assessment_choices:
