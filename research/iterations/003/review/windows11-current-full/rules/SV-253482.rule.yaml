rule:
  id: SV-253482
  version: r1137691
  title: The "Allow log on locally" user right must only be assigned to the Administrators and Users groups.
  severity: medium
  role: full
  weight: 10.0
  discussion: Inappropriate granting of user rights can provide system, administrative, and other high-level capabilities.
    Accounts with the "Allow log on locally" user right can log on interactively to a system.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-UR-000025
  - scheme: vulnerability
    value: V-253482
  - scheme: cci
    value: CCI-000213
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> User Rights Assignment >> "Allow log on locally" to only include the following groups or
      accounts: Administrators Users'
  organizational_input_requirements: {}
  assessment_choices:
