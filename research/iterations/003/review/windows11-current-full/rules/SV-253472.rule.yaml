rule:
  id: SV-253472
  version: r958518
  title: User Account Control must be configured to detect application installations and prompt for elevation.
  severity: medium
  role: full
  weight: 10.0
  discussion: User Account Control (UAC) is a security mechanism for limiting the elevation of privileges, including
    administrative accounts, unless authorized. This setting requires Windows to respond to application installation
    requests by prompting for credentials.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000260
  - scheme: vulnerability
    value: V-253472
  - scheme: cci
    value: CCI-001084
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> Security Options >> "User Account Control: Detect application installations and prompt for
      elevation" to "Enabled".'
  organizational_input_requirements: {}
  assessment_choices:
