rule:
  id: SV-253487
  version: r958726
  title: The "Create global objects" user right must only be assigned to Administrators, Service, Local Service,
    and Network Service.
  severity: medium
  role: full
  weight: 10.0
  discussion: Inappropriate granting of user rights can provide system, administrative, and other high-level capabilities.
    Accounts with the "Create global objects" user right can create objects that are available to all sessions,
    which could affect processes in other users' sessions.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-UR-000050
  - scheme: vulnerability
    value: V-253487
  - scheme: cci
    value: CCI-002235
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> User Rights Assignment >> "Create global objects" to only include the following groups or
      accounts: Administrators LOCAL SERVICE NETWORK SERVICE SERVICE'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253487.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253487.automated.assessment.yaml
    manual:
