rule:
  id: SV-253394
  version: r1256679
  title: Windows Update must not obtain updates from other PCs on the internet.
  severity: low
  role: full
  weight: 10.0
  discussion: Windows 11 allows Windows Update to obtain updates from additional sources instead of Microsoft. In
    addition to Microsoft, updates can be obtained from and sent to PCs on the local network as well as on the internet.
    This is part of the Windows Update trusted process; however, to minimize outside exposure, obtaining updates
    from or sending to systems on the internet must be prevented.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000206
  - scheme: vulnerability
    value: V-253394
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components
      >> Delivery Optimization >> "Download Mode" to "Enabled" with any option except "Internet" selected. Acceptable
      selections include: Bypass (100) Group (2) HTTP only (0) LAN (1) Simple (99)'
  organizational_input_requirements: {}
