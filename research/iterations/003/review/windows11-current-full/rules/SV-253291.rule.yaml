rule:
  id: SV-253291
  version: r1153422
  title: Bluetooth must be turned off unless approved by the organization.
  severity: medium
  role: full
  weight: 10.0
  discussion: If not configured properly, Bluetooth may allow rogue devices to communicate with a system. If a rogue
    device is paired with a system, there is potential for sensitive information to be compromised.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-00-000210
  - scheme: vulnerability
    value: V-253291
  - scheme: cci
    value: CCI-000381
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability:
  - windows11-stig-current-full.condition.bluetooth-installation
  parameters: {}
  remediation:
    guidance: 'Turn off Bluetooth radios not organizationally approved. For systems managed by Intune, apply the
      DOD Windows 11 STIG Settings Catalog (or equivalent Intune policy) found in the Intune policy package available
      on cyber.mil. Steps to create an Intune policy: 1. Sign in to the Intune admin center >> Devices >> Configuration
      >> Create >> New Policy. 2. Platform: Windows 10 and later. Profile type: Settings Catalog, then click "Create".
      3. Basics: Provide a Name and Description of the profile, then click "Next". 4. Configuration settings: Click
      "+ Add settings" and search for connectivity under the Settings picker. Under the Connectivity category, check
      the box next to Allow Bluetooth setting. Choose the first option, "Disallow Bluetooth", then click "Next".
      5. Scope tags: (optional), then click "Next". 6. Assignments: Assign the policy to Entra security groups that
      contain the target users or devices, then click "Next". 7. Review + create: Review the deployment summary,
      then click "Create".'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/windows11-stig-current-full.SV-253291.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/windows11-stig-current-full.SV-253291.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/windows11-stig-current-full.SV-253291.manual.assessment.yaml
  default_assessment_choice: default
