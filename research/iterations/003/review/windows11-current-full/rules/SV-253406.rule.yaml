rule:
  id: SV-253406
  version: r958408
  title: Remote Desktop Services must be configured with the client connection encryption set to the required level.
  severity: medium
  role: full
  weight: 10.0
  discussion: Remote connections must be encrypted to prevent interception of data or sensitive information. Selecting
    "High Level" will ensure encryption of Remote Desktop Services sessions in both directions.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000290
  - scheme: vulnerability
    value: V-253406
  - scheme: cci
    value: CCI-000068
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components
      >> Remote Desktop Services >> Remote Desktop Session Host >> Security >> "Set client connection encryption
      level" to "Enabled" and "High Level".
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253406.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253406.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253406.manual.assessment.yaml
  default_assessment_choice: default
