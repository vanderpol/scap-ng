rule:
  id: SV-253286
  version: r958478
  title: The Server Message Block (SMB) v1 protocol must be disabled on the system.
  severity: medium
  role: full
  weight: 10.0
  discussion: SMBv1 is a legacy protocol that uses the MD5 algorithm as part of SMB. MD5 is known to be vulnerable
    to a number of attacks such as collision and preimage attacks as well as not being FIPS compliant. Disabling
    SMBv1 support may prevent access to file or print sharing resources with systems or devices that only support
    SMBv1. File shares and print services hosted on Windows Server 2003 are an example, however Windows Server 2003
    is no longer a supported operating system. Some older Network Attached Storage (NAS) devices may only support
    SMBv1.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-00-000160
  - scheme: vulnerability
    value: V-253286
  - scheme: cci
    value: CCI-000381
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Disable the SMBv1 protocol. Run "Windows PowerShell" with elevated privileges (run as administrator).
      Enter the following: Disable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol Alternately: Search
      for "Features". Select "Turn Windows features on or off". De-select "SMB 1.0/CIFS File Sharing Support".'
  assessment_choices:
