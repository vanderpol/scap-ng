rule:
  id: SV-253373
  version: r991589
  title: Group Policy objects must be reprocessed even if they have not changed.
  severity: medium
  role: full
  weight: 10.0
  discussion: Enabling this setting and then selecting the "Process even if the Group Policy objects have not changed"
    option ensures that the policies will be reprocessed even if none have been changed. This way, any unauthorized
    changes are forced to match the domain-based group policy settings again.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000090
  - scheme: vulnerability
    value: V-253373
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> System >> Group
      Policy >> "Configure registry policy processing" to "Enabled" and select the option "Process even if the Group
      Policy objects have not changed".
