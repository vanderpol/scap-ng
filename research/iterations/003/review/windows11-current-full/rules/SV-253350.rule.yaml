rule:
  id: SV-253350
  version: r958478
  title: Camera access from the lock screen must be disabled.
  severity: medium
  role: full
  weight: 10.0
  discussion: Enabling camera access from the lock screen could allow for unauthorized use. Requiring logon will
    ensure the device is only used by authorized personnel.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000005
  - scheme: vulnerability
    value: V-253350
  - scheme: cci
    value: CCI-000381
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability:
  - windows11-stig-current-full.condition.camera-installation
  parameters: {}
  remediation:
    guidance: If the device does not have a camera, this is NA. Configure the policy value for Computer Configuration
      >> Administrative Templates >> Control Panel >> Personalization >> "Prevent enabling lock screen camera" to
      "Enabled".
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/windows11-stig-current-full.SV-253350.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/windows11-stig-current-full.SV-253350.automated.assessment.yaml
    manual:
