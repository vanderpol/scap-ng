rule:
  id: SV-253447
  version: r991589
  title: Caching of logon credentials must be limited.
  severity: low
  role: full
  weight: 10.0
  discussion: The default Windows configuration caches the last logon credentials for users who log on interactively
    to a system. This feature is provided for system availability reasons, such as the user's machine being disconnected
    from the network or domain controllers being unavailable. Even though the credential cache is well-protected,
    if a system is attacked, an unauthorized individual may isolate the password to a domain user account using
    a password-cracking program and gain access to the domain.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000085
  - scheme: vulnerability
    value: V-253447
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability:
  - windows11-stig-current-full.condition.windows-domain-member-workstation
  parameters: {}
  remediation:
    guidance: 'This is the default configuration for this setting (10 logons to cache). Configure the policy value
      for Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> Security Options
      >> "Interactive logon: Number of previous logons to cache (in case domain controller is not available)" to
      "10" logons or less. This setting only applies to domain-joined systems, however, it is configured by default
      on all systems.'
  organizational_input_requirements: {}
