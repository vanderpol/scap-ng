rule:
  id: SV-253302
  version: r1051043
  title: The minimum password age must be configured to at least 1 day.
  severity: medium
  role: full
  weight: 10.0
  discussion: Permitting passwords to be changed in immediate succession within the same day allows users to cycle
    passwords through their history database. This enables users to effectively negate the purpose of mandating
    periodic password changes.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-AC-000030
  - scheme: vulnerability
    value: V-253302
  - scheme: cci
    value: CCI-004066
  - scheme: cci
    value: CCI-000198
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Account Policies >> Password Policy >> "Minimum Password Age" to at least "1" day.
  organizational_input_requirements: {}
