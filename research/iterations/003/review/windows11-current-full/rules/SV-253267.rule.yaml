rule:
  id: SV-253267
  version: r1137695
  title: Non-system-created file shares on a system must limit access to groups that require it.
  severity: medium
  role: full
  weight: 10.0
  discussion: Shares which provide network access, must not exist on a workstation except for system-created administrative
    shares, and could potentially expose sensitive information. If a share is necessary, share permissions, as well
    as NTFS permissions, must be reconfigured to give the minimum access to those accounts that require it.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-00-000060
  - scheme: vulnerability
    value: V-253267
  - scheme: cci
    value: CCI-001090
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: If a non-system-created share is required on a system, configure the share and NTFS permissions to
      limit access to the specific groups or accounts that require it. Remove any unnecessary non-system-created
      shares.
