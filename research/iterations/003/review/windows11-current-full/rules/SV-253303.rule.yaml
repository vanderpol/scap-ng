rule:
  id: SV-253303
  version: r1051044
  title: Passwords must, at a minimum, be 14 characters.
  severity: medium
  role: full
  weight: 10.0
  discussion: Information systems not protected with strong password schemes (including passwords of minimum length)
    provide the opportunity for anyone to crack the password, thus gaining access to the system and compromising
    the device, information, or the local network.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-AC-000035
  - scheme: vulnerability
    value: V-253303
  - scheme: cci
    value: CCI-004066
  - scheme: cci
    value: CCI-000205
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Account Policies >> Password Policy >> "Minimum password length" to "14" characters.
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253303.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253303.automated.assessment.yaml
    manual:
