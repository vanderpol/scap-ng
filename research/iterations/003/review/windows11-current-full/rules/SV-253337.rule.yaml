rule:
  id: SV-253337
  version: r958752
  title: The Application event log size must be configured to 32768 KB or greater.
  severity: medium
  role: full
  weight: 10.0
  discussion: Inadequate log size will cause the log to fill up quickly. This may prevent audit events from being
    recorded properly and require frequent attention by administrative personnel.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-AU-000500
  - scheme: vulnerability
    value: V-253337
  - scheme: cci
    value: CCI-001849
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: If the system is configured to send audit records directly to an audit server, this is NA. This must
      be documented with the ISSO. Configure the policy value for Computer Configuration >> Administrative Templates
      >> Windows Components >> Event Log Service >> Application >> "Specify the maximum log file size (KB)" to "Enabled"
      with a "Maximum Log Size (KB)" of "32768" or greater.
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253337.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253337.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253337.manual.assessment.yaml
  default_assessment_choice: default
