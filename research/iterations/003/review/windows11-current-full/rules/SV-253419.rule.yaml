rule:
  id: SV-253419
  version: r958850
  title: The Windows Remote Management (WinRM) service must not allow unencrypted traffic.
  severity: medium
  role: full
  weight: 10.0
  discussion: Unencrypted remote access to a system can allow sensitive information to be compromised. Windows remote
    management connections must be encrypted to prevent this.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000350
  - scheme: vulnerability
    value: V-253419
  - scheme: cci
    value: CCI-003123
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components
      >> Windows Remote Management (WinRM) >> WinRM Service >> "Allow unencrypted traffic" to "Disabled".
  organizational_input_requirements: {}
  assessment_choices:
