rule:
  id: SV-253392
  version: r991589
  title: Enhanced diagnostic data must be limited to the minimum required to support Windows Analytics.
  severity: medium
  role: full
  weight: 10.0
  discussion: Some features may communicate with the vendor, sending system information or downloading data or components
    for the feature. Limiting this capability will prevent potentially sensitive information from being sent outside
    the enterprise. The "Enhanced" level for telemetry includes additional information beyond "Security" and "Basic"
    on how Windows and apps are used and advanced reliability data. Windows Analytics can use a "limited enhanced"
    level to provide information such as health data for devices.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000204
  - scheme: vulnerability
    value: V-253392
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components
      >> Data Collection and Preview Builds >> "Limit optional diagnostic data for Windows Analytics" to "Enabled"
      with "Enable Desktop Analytics collection" selected in "Options:".
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253392.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253392.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253392.manual.assessment.yaml
  default_assessment_choice: default
