rule:
  id: SV-253314
  version: r991570
  title: The system must be configured to audit Logon/Logoff - Group Membership successes.
  severity: medium
  role: full
  weight: 10.0
  discussion: Maintaining an audit trail of system activity logs can help identify configuration errors, troubleshoot
    service disruptions, and analyze compromises that have occurred, as well as detect attacks. Audit logs are necessary
    to provide a trail of evidence in case the system or network is compromised. Collecting this data is essential
    for analyzing the security of information assets and detecting signs of suspicious and unexpected behavior.
    Audit Group Membership records information related to the group membership of a user's logon token.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-AU-000060
  - scheme: vulnerability
    value: V-253314
  - scheme: cci
    value: CCI-000172
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Windows Settings >> Advanced Audit Policy
      Configuration >> System Audit Policies >> Logon/Logoff >> "Audit Group Membership" with "Success" selected.
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253314.automated.assessment.yaml
    automated:
