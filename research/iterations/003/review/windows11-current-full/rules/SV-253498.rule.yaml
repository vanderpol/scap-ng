rule:
  id: SV-253498
  version: r1138526
  title: The "Impersonate a client after authentication" user right must only be assigned to Administrators, Service,
    Local Service, and Network Service.
  severity: medium
  role: full
  weight: 10.0
  discussion: Inappropriate granting of user rights can provide system, administrative, and other high-level capabilities.
    The "Impersonate a client after authentication" user right allows a program to impersonate another user or account
    to run on their behalf. An attacker could potentially use this to elevate privileges.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-UR-000110
  - scheme: vulnerability
    value: V-253498
  - scheme: cci
    value: CCI-002235
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> User Rights Assignment >> "Impersonate a client after authentication" to only include the
      following groups or accounts: Administrators LOCAL SERVICE NETWORK SERVICE RESTRICTED SERVICES\PrintSpoolerService
      SERVICE'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253498.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253498.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253498.manual.assessment.yaml
  default_assessment_choice: default
