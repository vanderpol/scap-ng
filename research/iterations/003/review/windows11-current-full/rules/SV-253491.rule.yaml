rule:
  id: SV-253491
  version: r1137691
  title: The "Deny access to this computer from the network" user right on workstations must be configured to prevent
    access from highly privileged domain accounts and local accounts on domain systems and unauthenticated access
    on all systems.
  severity: medium
  role: full
  weight: 10.0
  discussion: Inappropriate granting of user rights can provide system, administrative, and other high-level capabilities.
    The "Deny access to this computer from the network" right defines the accounts that are prevented from logging
    on from the network. In an Active Directory Domain, denying logons to the Enterprise Admins and Domain Admins
    groups on lower trust systems helps mitigate the risk of privilege escalation from credential theft attacks,
    which could lead to the compromise of an entire domain. Local accounts on domain-joined systems must also be
    assigned this right to decrease the risk of lateral movement resulting from credential theft attacks. The Guests
    group must be assigned this right to prevent unauthenticated access.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-UR-000070
  - scheme: vulnerability
    value: V-253491
  - scheme: cci
    value: CCI-000213
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> User Rights Assignment >> "Deny access to this computer from the network" to include the
      following: Domain Systems Only: Enterprise Admins group Domain Admins group Local account (see Note below)
      All Systems: Guests group Privileged Access Workstations (PAWs) dedicated to the management of Active Directory
      are exempt from denying the Enterprise Admins and Domain Admins groups. (See the Windows Privileged Access
      Workstation STIG for PAW requirements.) Note: "Local account" is a built-in security group used to assign
      user rights and permissions to all local accounts.'
  assessment_choices:
