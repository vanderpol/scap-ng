rule:
  id: SV-253501
  version: r958434
  title: The "Manage auditing and security log" user right must only be assigned to the Administrators group.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'Inappropriate granting of user rights can provide system, administrative, and other high-level capabilities.
    Accounts with the "Manage auditing and security log" user right can manage the security log and change auditing
    configurations. This could be used to clear evidence of tampering. Satisfies: SRG-OS-000057-GPOS-00027, SRG-OS-000063-GPOS-00032'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-UR-000130
  - scheme: vulnerability
    value: V-253501
  - scheme: cci
    value: CCI-000162
  - scheme: cci
    value: CCI-000171
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> User Rights Assignment >> "Manage auditing and security log" to only include the following
      groups or accounts: Administrators'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253501.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253501.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253501.manual.assessment.yaml
  default_assessment_choice: default
