rule:
  id: SV-253299
  version: r958388
  title: The period of time before the bad logon counter is reset must be configured to 15 minutes.
  severity: medium
  role: full
  weight: 10.0
  discussion: The account lockout feature, when enabled, prevents brute-force password attacks on the system. This
    parameter specifies the period of time that must pass after failed logon attempts before the counter is reset
    to 0. The smaller this value is, the less effective the account lockout feature will be in protecting the local
    system.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-AC-000015
  - scheme: vulnerability
    value: V-253299
  - scheme: cci
    value: CCI-000044
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Account Policies >> Account Lockout Policy >> "Reset account lockout counter after" to "15" minutes.
