rule:
  id: SV-268317
  version: r1135320
  title: Copilot must be disabled for Windows 11.
  severity: medium
  role: full
  weight: 10.0
  discussion: Some features may communicate with the vendor, sending system information or downloading data or components
    for the feature. Turning off this capability will prevent potentially sensitive information from being sent
    outside the enterprise and uncontrolled updates to the system.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-00-000125
  - scheme: vulnerability
    value: V-268317
  - scheme: cci
    value: CCI-000382
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Open PowerShell as an administrator. Run the following command: Get-AppxPackage -AllUsers *CoPilot*
      | Remove-AppxPackage -AllUsers'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-268317.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-268317.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-268317.manual.assessment.yaml
  default_assessment_choice: default
