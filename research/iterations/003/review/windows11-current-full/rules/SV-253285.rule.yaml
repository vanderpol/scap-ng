rule:
  id: SV-253285
  version: r1153425
  title: The Windows PowerShell 2.0 feature must be disabled on the system.
  severity: medium
  role: full
  weight: 10.0
  discussion: Windows PowerShell 5.0 added advanced logging features, which can provide additional detail when malware
    has been run on a system. Disabling the Windows PowerShell 2.0 mitigates against a downgrade attack that evades
    the Windows PowerShell 5.0 script block logging feature.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-00-000155
  - scheme: vulnerability
    value: V-253285
  - scheme: cci
    value: CCI-000381
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability:
  - condition.windows-prior-v24h2
  parameters: {}
  remediation:
    guidance: 'Disable "Windows PowerShell 2.0" on the system. Run "Windows PowerShell" with elevated privileges
      (run as administrator). Enter the following: Disable-WindowsOptionalFeature -Online -FeatureName MicrosoftWindowsPowerShellV2Root
      This command must disable both "MicrosoftWindowsPowerShellV2Root" and "MicrosoftWindowsPowerShellV2", which
      correspond to "Windows PowerShell 2.0" and "Windows PowerShell 2.0 Engine" respectively in "Turn Windows features
      on or off". Alternately: Search for "Features". Select "Turn Windows features on or off". De-select "Windows
      PowerShell 2.0".'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253285.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253285.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253285.manual.assessment.yaml
  default_assessment_choice: default
