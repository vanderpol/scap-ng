rule:
  id: SV-253448
  version: r991589
  title: The Smart Card removal option must be configured to Force Logoff or Lock Workstation.
  severity: medium
  role: full
  weight: 10.0
  discussion: Unattended systems are susceptible to unauthorized use and must be locked. Configuring a system to
    lock when a smart card is removed will ensure the system is inaccessible when unattended.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000095
  - scheme: vulnerability
    value: V-253448
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> Security Options >> "Interactive logon: Smart card removal behavior" to "Lock Workstation"
      or "Force Logoff".'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253448.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253448.automated.assessment.yaml
    manual:
