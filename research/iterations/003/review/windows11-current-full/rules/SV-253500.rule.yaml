rule:
  id: SV-253500
  version: r958726
  title: The "Lock pages in memory" user right must not be assigned to any groups or accounts.
  severity: medium
  role: full
  weight: 10.0
  discussion: Inappropriate granting of user rights can provide system, administrative, and other high-level capabilities.
    The "Lock pages in memory" user right allows physical memory to be assigned to processes, which could cause
    performance issues or a DoS.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-UR-000125
  - scheme: vulnerability
    value: V-253500
  - scheme: cci
    value: CCI-002235
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> User Rights Assignment >> "Lock pages in memory" to be defined but containing no entries
      (blank).
  organizational_input_requirements: {}
