rule:
  id: SV-253423
  version: r958478
  title: The convenience PIN for Windows 11 must be disabled.
  severity: medium
  role: full
  weight: 10.0
  discussion: This policy controls whether a domain user can sign in using a convenience PIN to prevent enabling
    (Password Stuffer).
  rationale: null
  extensions:
