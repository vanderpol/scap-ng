rule:
  id: SV-253456
  version: r1137695
  title: Anonymous access to Named Pipes and Shares must be restricted.
  severity: high
  role: full
  weight: 10.0
  discussion: 'Allowing anonymous access to named pipes or shares provides the potential for unauthorized system
    access. This setting restricts access to those defined in "Network access: Named Pipes that can be accessed
    anonymously" and "Network access: Shares that can be accessed anonymously", both of which must be blank under
    other requirements.'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000165
  - scheme: vulnerability
    value: V-253456
  - scheme: cci
    value: CCI-001090
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> Security Options >> "Network access: Restrict anonymous access to Named Pipes and Shares"
      to "Enabled".'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253456.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253456.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253456.manual.assessment.yaml
  default_assessment_choice: default
