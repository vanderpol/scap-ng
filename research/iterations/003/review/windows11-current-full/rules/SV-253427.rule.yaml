rule:
  id: SV-253427
  version: r1256656
  title: The DoW Root CA certificates must be installed in the Trusted Root Store.
  severity: medium
  role: full
  weight: 10.0
  discussion: To ensure secure DoW websites and DoW-signed code are properly validated, the system must trust the
    DoW Root Certificate Authorities (CAs). The DoW root certificates will ensure that the trust chain is established
    for server certificates issued from the DoW CAs.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-PK-000005
  - scheme: vulnerability
    value: V-253427
  - scheme: cci
    value: CCI-000185
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Install valid (unexpired) DoW Root CA certificates. The list below is not to be treated as exhaustive.
      The STIG should not be used as a definitive resource for the organizationally approved certificates for the
      systems. DoD Root CA 3 DoD Root CA 5 DoD Root CA 6 The InstallRoot tool is available on Cyber Exchange at
      https://cyber.mil/pki-pke/tools-configuration-files. Certificate bundles published by the PKI can be found
      at https://crl.gds.disa.mil/.
