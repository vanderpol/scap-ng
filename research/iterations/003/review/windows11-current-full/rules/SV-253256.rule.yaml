rule:
  id: SV-253256
  version: r1210280
  title: Windows 11 systems must have Unified Extensible Firmware Interface (UEFI) firmware and be configured to
    run in UEFI mode, not Legacy BIOS.
  severity: medium
  role: full
  weight: 10.0
  discussion: UEFI provides additional security features in comparison to legacy BIOS firmware, including Secure
    Boot. UEFI is required to support additional security features in Windows 11, including virtualization-based
    Security and Credential Guard. Systems with UEFI that are operating in Legacy BIOS mode will not support these
    security features.
