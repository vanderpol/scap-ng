rule:
  id: SV-253362
  version: r991589
  title: Hardened UNC Paths must be defined to require mutual authentication and integrity for at least the \\*\SYSVOL
    and \\*\NETLOGON shares.
  severity: medium
  role: full
  weight: 10.0
  discussion: Additional security requirements are applied to Universal Naming Convention (UNC) paths specified
    in Hardened UNC paths before allowing access them. This aids in preventing tampering with or spoofing of connections
    to these paths.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000050
  - scheme: vulnerability
    value: V-253362
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability:
  - windows11-stig-current-full.condition.windows-domain-member-workstation
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Administrative Templates >> Network >> Network
      Provider >> "Hardened UNC Paths" to "Enabled" with at least the following configured in "Hardened UNC Paths:"
      (click the "Show" button to display). Value Name: \\*\SYSVOL Value: RequireMutualAuthentication=1, RequireIntegrity=1
      Value Name: \\*\NETLOGON Value: RequireMutualAuthentication=1, RequireIntegrity=1'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/windows11-stig-current-full.SV-253362.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/windows11-stig-current-full.SV-253362.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/windows11-stig-current-full.SV-253362.manual.assessment.yaml
  default_assessment_choice: default
