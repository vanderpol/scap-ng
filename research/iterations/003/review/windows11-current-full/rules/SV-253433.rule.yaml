rule:
  id: SV-253433
  version: r958504
  title: The built-in guest account must be disabled.
  severity: medium
  role: full
  weight: 10.0
  discussion: A system faces an increased vulnerability threat if the built-in guest account is not disabled. This
    account is a known account that exists on all Windows systems and cannot be deleted. This account is initialized
    during the installation of the operating system with no password assigned.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000010
  - scheme: vulnerability
    value: V-253433
  - scheme: cci
    value: CCI-000804
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> Security Options >> "Accounts: Guest account status" to "Disabled".'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/windows11-stig-current-full.SV-253433.automated.assessment.yaml
    automated:
