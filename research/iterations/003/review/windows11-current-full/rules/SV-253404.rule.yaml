rule:
  id: SV-253404
  version: r1051052
  title: Remote Desktop Services must always prompt a client for passwords upon connection.
  severity: medium
  role: full
  weight: 10.0
  discussion: This setting controls the ability of users to supply passwords automatically as part of their remote
    desktop connection. Disabling this setting would allow anyone to use the stored credentials in a connection
    item to connect to the terminal server.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000280
  - scheme: vulnerability
    value: V-253404
  - scheme: cci
    value: CCI-002038
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components
      >> Remote Desktop Services >> Remote Desktop Session Host >> Security >> "Always prompt for password upon
      connection" to "Enabled".
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253404.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253404.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253404.manual.assessment.yaml
  default_assessment_choice: default
