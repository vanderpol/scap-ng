rule:
  id: SV-253294
  version: r991589
  title: Administrative accounts must not be used with applications that access the internet, such as web browsers,
    or with potential internet sources, such as email.
  severity: high
  role: full
  weight: 10.0
  discussion: Using applications that access the internet or have potential internet sources using administrative
    privileges exposes a system to compromise. If a flaw in an application is exploited while running as a privileged
    user, the entire system could be compromised. Web browsers and email are common attack vectors for introducing
    malicious code and must not be run with an administrative account. Since administrative accounts may generally
    change or work around technical restrictions for running a web browser or other applications, it is essential
    that policy requires administrative accounts to not access the internet or use applications, such as email.
    The policy must define specific exceptions for local service administration. These exceptions may include HTTP(S)-based
    tools that are used for the administration of the local system, services, or attached devices. Technical means
    such as application allowlisting can be used to enforce the policy to ensure compliance.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
