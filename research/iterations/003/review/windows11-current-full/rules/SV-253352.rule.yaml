rule:
  id: SV-253352
  version: r958478
  title: The display of slide shows on the lock screen must be disabled.
  severity: medium
  role: full
  weight: 10.0
  discussion: Slide shows that are displayed on the lock screen could display sensitive information to unauthorized
    personnel. Turning off this feature will limit access to the information to a logged on user.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000010
  - scheme: vulnerability
    value: V-253352
  - scheme: cci
    value: CCI-000381
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> Control Panel
      >> Personalization >> "Prevent enabling lock screen slide show" to "Enabled".
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253352.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253352.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253352.manual.assessment.yaml
  default_assessment_choice: default
