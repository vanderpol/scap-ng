rule:
  id: SV-253384
  version: r991589
  title: The setting to allow Microsoft accounts to be optional for modern style apps must be enabled.
  severity: low
  role: full
  weight: 10.0
  discussion: Control of credentials and the system must be maintained within the enterprise. Enabling this setting
    allows enterprise credentials to be used with modern style apps that support this, instead of Microsoft accounts.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000170
  - scheme: vulnerability
    value: V-253384
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components
      >> App Runtime >> "Allow Microsoft accounts to be optional" to "Enabled".
  organizational_input_requirements: {}
