rule:
  id: SV-253338
  version: r1186375
  title: The security event log size must be configured to a value that holds at least one week's worth of audit
    records.
  severity: medium
  role: full
  weight: 10.0
  discussion: Inadequate log size will cause the log to fill up quickly. This may prevent audit events from being
    recorded properly and require frequent attention by administrative personnel. System Administrators (SAs) must
    monitor the volume of security event audit records and increase the registry value for the log size as needed.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-AU-000505
  - scheme: vulnerability
    value: V-253338
  - scheme: cci
    value: CCI-001849
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components
      >> Event Log Service >> Security >> "Specify the maximum log file size (KB)" to "Enabled" with a "Maximum
      Log Size (KB)" of a value that will contain one week of audit records or greater. If the system is configured
      to send audit records directly to an audit server, this must be documented with the ISSO.
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253338.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253338.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253338.manual.assessment.yaml
  default_assessment_choice: default
