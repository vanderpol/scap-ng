rule:
  id: SV-253431
  version: r958726
  title: Default permissions for the HKEY_LOCAL_MACHINE registry hive must be maintained.
  severity: medium
  role: full
  weight: 10.0
  discussion: The registry is integral to the function, security, and stability of the Windows system. Changing
    the system's registry permissions allows the possibility of unauthorized and anonymous modification to the operating
    system.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-RG-000005
  - scheme: vulnerability
    value: V-253431
  - scheme: cci
    value: CCI-002235
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Maintain the default permissions for the HKEY_LOCAL_MACHINE registry hive. The default permissions
      of the higher level keys are noted below. HKEY_LOCAL_MACHINE\SECURITY Type - "Allow" for all Inherited from
      - "None" for all Principal - Access - Applies to SYSTEM - Full Control - This key and subkeys Administrators
      - Special - This key and subkeys HKEY_LOCAL_MACHINE\SOFTWARE Type - "Allow" for all Inherited from - "None"
      for all Principal - Access - Applies to Users - Read - This key and subkeys Administrators - Full Control
      - This key and subkeys SYSTEM - Full Control - This key and subkeys CREATOR OWNER - Full Control - This key
      and subkeys ALL APPLICATION PACKAGES - Read - This key and subkeys HKEY_LOCAL_MACHINE\SYSTEM Type - "Allow"
      for all Inherited from - "None" for all Principal - Access - Applies to Users - Read - This key and subkeys
      Administrators - Full Control - This key and subkeys SYSTEM - Full Control - This key and subkeys CREATOR
      OWNER - Full Control - This key and subkeys ALL APPLICATION PACKAGES - Read - This key and subkeys Microsoft
      has also given read permission to the SOFTWARE and SYSTEM registry keys in later versions of Windows 11 to
      the following SID. S-1-15-3-1024-1065365936-1281604716-3511738428-1654721687-432734479-3232135806-4053264122-3456934681
  assessment_choices:
