rule:
  id: SV-253359
  version: r958478
  title: Run as different user must be removed from context menus.
  severity: medium
  role: full
  weight: 10.0
  discussion: The "Run as different user" selection from context menus allows the use of credentials other than
    the currently logged on user. Using privileged credentials in a standard user session can expose those credentials
    to theft. Removing this option from context menus helps prevent this from occurring.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000039
  - scheme: vulnerability
    value: V-253359
  - scheme: cci
    value: CCI-000381
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> MS Security Guide
      >> "Remove "Run as Different User" from context menus" to "Enabled". This policy setting requires the installation
      of the SecGuide custom templates included with the STIG package. "SecGuide.admx" and "SecGuide.adml" must
      be copied to the \Windows\PolicyDefinitions and \Windows\PolicyDefinitions\en-US directories respectively.
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253359.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253359.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253359.manual.assessment.yaml
  default_assessment_choice: default
