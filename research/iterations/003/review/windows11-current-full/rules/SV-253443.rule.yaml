rule:
  id: SV-253443
  version: r958908
  title: The system must be configured to require a strong session key.
  severity: medium
  role: full
  weight: 10.0
  discussion: A computer connecting to a domain controller will establish a secure channel. Requiring strong session
    keys enforces 128-bit encryption between systems.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000060
  - scheme: vulnerability
    value: V-253443
  - scheme: cci
    value: CCI-002418
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> Security Options >> "Domain member: Require strong (Windows 2000 or Later) session key"
      to "Enabled".'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253443.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253443.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253443.manual.assessment.yaml
  default_assessment_choice: default
