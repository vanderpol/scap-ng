rule:
  id: SV-253361
  version: r958478
  title: Internet connection sharing must be disabled.
  severity: medium
  role: full
  weight: 10.0
  discussion: Internet connection sharing makes it possible for an existing internet connection, such as through
    wireless, to be shared and used by other systems essentially creating a mobile hotspot. This exposes the system
    sharing the connection to others with potentially malicious purpose.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000044
  - scheme: vulnerability
    value: V-253361
  - scheme: cci
    value: CCI-000381
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> Network >> Network
      Connections >> "Prohibit use of Internet Connection Sharing on your DNS domain network" to "Enabled".
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253361.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253361.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253361.manual.assessment.yaml
  default_assessment_choice: default
