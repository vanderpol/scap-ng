rule:
  id: SV-253276
  version: r958480
  title: Simple Network Management Protocol (SNMP) must not be installed on the system.
  severity: medium
  role: full
  weight: 10.0
  discussion: '"SNMP" is not installed by default. Some protocols and services do not support required security
    features, such as encrypting passwords or traffic.'
  rationale: null
