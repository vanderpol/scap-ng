    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Uninstall "Internet Information Services" or "Internet Information Services Hostable Web Core" from
      the system.
  organizational_input_requirements: {}
