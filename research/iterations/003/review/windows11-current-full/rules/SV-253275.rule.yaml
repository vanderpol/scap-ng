rule:
  id: SV-253275
  version: r958478
  title: Internet Information System (IIS) or its subcomponents must not be installed on a workstation.
  severity: high
  role: full
  weight: 10.0
  discussion: IIS is not installed by default. Installation of Internet Information System (IIS) may allow unauthorized
    internet services to be hosted. Websites must only be hosted on servers that have been designed for that purpose
    and can be adequately secured.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
