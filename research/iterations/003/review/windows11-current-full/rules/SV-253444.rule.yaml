rule:
  id: SV-253444
  version: r958636
  title: The machine inactivity limit must be set to 15 minutes, locking the system with the screensaver.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'Unattended systems are susceptible to unauthorized use and must be locked when unattended. The screen
    saver must be set at a maximum of 15 minutes and be password protected. This protects critical and sensitive
    data from exposure to unauthorized personnel with physical access to the computer. Satisfies: SRG-OS-000279-GPOS-00109,
    SRG-OS-000163-GPOS-00072'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000070
  - scheme: vulnerability
    value: V-253444
  - scheme: cci
    value: CCI-001133
  - scheme: cci
    value: CCI-002361
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> Security Options >> "Interactive logon: Machine inactivity limit" to "900" seconds" or less,
      excluding "0" which is effectively disabled.'
