rule:
  id: SV-253298
  version: r958388
  title: The number of allowed bad logon attempts must be configured to three or less.
  severity: medium
  role: full
  weight: 10.0
  discussion: The account lockout feature, when enabled, prevents brute-force password attacks on the system. The
    higher this value is, the less effective the account lockout feature will be in protecting the local system.
    The number of bad logon attempts must be reasonably small to minimize the possibility of a successful password
    attack, while allowing for honest errors made during a normal user logon.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-AC-000010
  - scheme: vulnerability
    value: V-253298
  - scheme: cci
    value: CCI-000044
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Account Policies >> Account Lockout Policy >> "Account lockout threshold" to "3" or less invalid logon attempts
      (excluding "0" which is unacceptable).
  organizational_input_requirements: {}
