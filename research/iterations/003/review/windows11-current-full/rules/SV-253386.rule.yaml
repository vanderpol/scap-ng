rule:
  id: SV-253386
  version: r958804
  title: Autoplay must be turned off for non-volume devices.
  severity: high
  role: full
  weight: 10.0
  discussion: Allowing autoplay to execute may introduce malicious code to a system. Autoplay begins reading from
    a drive as soon as media is inserted in the drive. As a result, the setup file of programs or music on audio
    media may start. This setting will disable autoplay for non-volume devices (such as Media Transfer Protocol
    (MTP) devices).
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000180
  - scheme: vulnerability
    value: V-253386
  - scheme: cci
    value: CCI-001764
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components
      >> AutoPlay Policies >> "Disallow Autoplay for non-volume devices" to "Enabled".
  organizational_input_requirements: {}
  assessment_choices:
