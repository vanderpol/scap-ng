rule:
  id: SV-253438
  version: r958908
  title: Outgoing secure channel traffic must be encrypted or signed.
  severity: medium
  role: full
  weight: 10.0
  discussion: Requests sent on the secure channel are authenticated, and sensitive information (such as passwords)
    is encrypted, but not all information is encrypted. If this policy is enabled, outgoing secure channel traffic
    will be encrypted and signed.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000035
  - scheme: vulnerability
    value: V-253438
  - scheme: cci
    value: CCI-002418
  - scheme: cci
    value: CCI-002421
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> Security Options >> "Domain member: Digitally encrypt or sign secure channel data (always)"
      to "Enabled".'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253438.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253438.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253438.manual.assessment.yaml
  default_assessment_choice: default
