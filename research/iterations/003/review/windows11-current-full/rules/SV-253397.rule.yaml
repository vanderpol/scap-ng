rule:
  id: SV-253397
  version: r958902
  title: File Explorer heap termination on corruption must be disabled.
  severity: low
  role: full
  weight: 10.0
  discussion: Legacy plug-in applications may continue to function when a File Explorer session has become corrupt.
    Disabling this feature will prevent this.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000220
  - scheme: vulnerability
    value: V-253397
  - scheme: cci
    value: CCI-002385
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: The default behavior is for File Explorer heap termination on corruption to be enabled. To correct
      this, configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components
      >> File Explorer >> "Turn off heap termination on corruption" to "Not Configured" or "Disabled".
  organizational_input_requirements: {}
