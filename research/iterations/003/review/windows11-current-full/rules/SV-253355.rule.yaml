rule:
  id: SV-253355
  version: r991589
  title: The system must be configured to prevent Internet Control Message Protocol (ICMP) redirects from overriding
    Open Shortest Path First (OSPF) generated routes.
  severity: low
  role: full
  weight: 10.0
  discussion: Allowing ICMP redirect of routes can lead to traffic not being routed properly. When disabled, this
    forces ICMP to be routed via shortest path first.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000030
  - scheme: vulnerability
    value: V-253355
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Administrative Templates >> MSS (Legacy)
      >> "MSS: (EnableICMPRedirect) Allow ICMP redirects to override OSPF generated routes" to "Disabled". This
      policy setting requires the installation of the MSS-Legacy custom templates included with the STIG package.
      "MSS-Legacy.admx" and "MSS-Legacy.adml" must be copied to the \Windows\PolicyDefinitions and \Windows\PolicyDefinitions\en-US
      directories respectively.'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253355.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253355.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253355.manual.assessment.yaml
  default_assessment_choice: default
