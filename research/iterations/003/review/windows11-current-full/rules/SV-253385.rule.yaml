rule:
  id: SV-253385
  version: r958478
  title: The Application Compatibility Program Inventory must be prevented from collecting data and sending the
    information to Microsoft.
  severity: low
  role: full
  weight: 10.0
  discussion: Some features may communicate with the vendor, sending system information or downloading data or components
    for the feature. Turning off this capability will prevent potentially sensitive information from being sent
    outside the enterprise and uncontrolled updates to the system. This setting will prevent the Program Inventory
    from collecting data about a system and sending the information to Microsoft.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000175
  - scheme: vulnerability
    value: V-253385
  - scheme: cci
    value: CCI-000381
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components
      >> Application Compatibility >> "Turn off Inventory Collector" to "Enabled".
  organizational_input_requirements: {}
