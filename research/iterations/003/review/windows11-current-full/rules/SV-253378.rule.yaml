rule:
  id: SV-253378
  version: r958478
  title: The network selection user interface (UI) must not be displayed on the logon screen.
  severity: medium
  role: full
  weight: 10.0
  discussion: Enabling interaction with the network selection UI allows users to change connections to available
    networks without signing into Windows.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000120
  - scheme: vulnerability
    value: V-253378
  - scheme: cci
    value: CCI-000381
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> System >> Logon
      >> "Do not display network selection UI" to "Enabled".
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253378.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253378.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253378.manual.assessment.yaml
  default_assessment_choice: default
