rule:
  id: SV-253371
  version: r1210291
  title: Virtualization-based protection of code integrity must be enabled.
  severity: medium
  role: full
  weight: 10.0
  discussion: Virtualization-based protection of code integrity enforces kernel mode memory protections as well
    as protecting Code Integrity validation paths. This isolates the processes from the rest of the operating system
    and can only be accessed by privileged system software.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000080
  - scheme: vulnerability
    value: V-253371
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> System >> Device
      Guard >> "Turn On virtualization-based Security" to "Enabled" with "Enabled with UEFI lock" or "Enabled without
      lock" selected for "virtualization-based Protection of Code Integrity:". "Enabled with UEFI lock" is preferred
      as more secure; however, it cannot be turned off remotely through a group policy change if there is an issue.
      "Enabled without lock" will allow this to be turned off remotely while testing for issues.
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/windows11-stig-current-full.SV-253371.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/windows11-stig-current-full.SV-253371.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/windows11-stig-current-full.SV-253371.manual.assessment.yaml
  default_assessment_choice: default
