rule:
  id: SV-253387
  version: r958804
  title: The default autorun behavior must be configured to prevent autorun commands.
  severity: high
  role: full
  weight: 10.0
  discussion: Allowing autorun commands to execute may introduce malicious code to a system. Configuring this setting
    prevents autorun commands from executing.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000185
  - scheme: vulnerability
    value: V-253387
  - scheme: cci
    value: CCI-001764
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components
      >> AutoPlay Policies >> "Set the default behavior for AutoRun" to "Enabled:Do not execute any autorun commands".
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253387.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253387.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253387.manual.assessment.yaml
  default_assessment_choice: default
