rule:
  id: SV-253363
  version: r971535
  title: Windows 11 must be configured to prioritize ECC Curves with longer key lengths first.
  severity: medium
  role: full
  weight: 10.0
  discussion: Use of weak or untested encryption algorithms undermines the purposes of utilizing encryption to protect
    data. By default Windows uses ECC curves with shorter key lengths first. Requiring ECC curves with longer key
    lengths to be prioritized first helps ensure more secure algorithms are used.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000052
  - scheme: vulnerability
    value: V-253363
  - scheme: cci
    value: CCI-000803
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Administrative Templates >> Network >> SSL
      Configuration Settings >> "ECC Curve Order" to "Enabled" with "ECC Curve Order:" including the following in
      the order listed: NistP384 NistP256'
  organizational_input_requirements: {}
