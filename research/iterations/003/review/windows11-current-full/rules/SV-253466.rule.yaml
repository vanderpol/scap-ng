rule:
  id: SV-253466
  version: r1210303
  title: The system must be configured to use FIPS-compliant algorithms for encryption, hashing, and signing.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'This setting ensures the system uses algorithms that are FIPS compliant for encryption, hashing,
    and signing. FIPS-compliant algorithms meet specific standards established by the U.S. Government and must be
    the algorithms used for all OS encryption functions. Note: A different registry location is needed when systems
    are managed by Intune versus GPO.'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000230
  - scheme: vulnerability
    value: V-253466
  - scheme: cci
    value: CCI-002450
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'For GPO-managed systems: Configure the policy value for Computer Configuration >> Windows Settings
      >> Security Settings >> Local Policies >> Security Options >> "System cryptography: Use FIPS compliant algorithms
      for encryption, hashing, and signing" to "Enabled". For Intune-managed systems: Set the Intune System Cryptography
      Policy to use FIPS-compliant algorithms for encryption, hashing, and signing.'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253466.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253466.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253466.manual.assessment.yaml
  default_assessment_choice: default
