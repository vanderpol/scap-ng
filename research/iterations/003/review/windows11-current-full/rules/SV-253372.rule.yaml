rule:
  id: SV-253372
  version: r991589
  title: Early Launch Antimalware, Boot-Start Driver Initialization Policy must prevent boot drivers.
  severity: medium
  role: full
  weight: 10.0
  discussion: The default behavior is for Early Launch Antimalware - Boot-Start Driver Initialization policy is
    to enforce "Good, unknown and bad but critical" (preventing "bad"). By being launched first by the kernel, ELAM
    ( Early Launch Antimalware) is ensured to be launched before any third-party software, and is therefore able
    to detect malware in the boot process and prevent it from initializing.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000085
  - scheme: vulnerability
    value: V-253372
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Ensure that Early Launch Antimalware - Boot-Start Driver Initialization policy is set to enforce "Good,
      unknown and bad but critical" (preventing "bad"). To correct this, configure the policy value for Computer
      Configuration >> Administrative Templates >> System >> Early Launch Antimalware >> "Boot-Start Driver Initialization
      Policy" to "Enabled with "Good, unknown and bad but critical" selected.
  organizational_input_requirements: {}
