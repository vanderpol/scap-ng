rule:
  id: SV-253255
  version: r1210279
  title: Windows 11 systems must have a Trusted Platform Module (TPM) enabled.
  severity: medium
  role: full
  weight: 10.0
  discussion: Credential Guard uses virtualization-based security to protect information that could be used in credential
    theft attacks if compromised. There are a number of system requirements that must be met in order for Credential
    Guard to be configured and enabled properly. Without a TPM enabled and ready for use, Credential Guard keys
    are stored in a less secure method using software.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-00-000010
  - scheme: vulnerability
    value: V-253255
  - scheme: cci
    value: CCI-002421
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Ensure systems have a TPM that is configured for use. (Versions 2.0 supports Credential Guard.) The
      TPM must be enabled in the firmware. Run "tpm.msc" for configuration options in Windows.
  organizational_input_requirements: {}
