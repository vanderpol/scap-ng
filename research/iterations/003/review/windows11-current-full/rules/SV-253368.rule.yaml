rule:
  id: SV-253368
  version: r991589
  title: Windows 11 must be configured to enable Remote host allows delegation of non-exportable credentials.
  severity: medium
  role: full
  weight: 10.0
  discussion: An exportable version of credentials is provided to remote hosts when using credential delegation
    which exposes them to theft on the remote host. Restricted Admin mode or Remote Credential Guard allow delegation
    of non-exportable credentials providing additional protection of the credentials. Enabling this configures the
    host to support Restricted Admin mode or Remote Credential Guard.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000068
  - scheme: vulnerability
    value: V-253368
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> System >> Credentials
      Delegation >> "Remote host allows delegation of non-exportable credentials" to "Enabled".
  organizational_input_requirements: {}
