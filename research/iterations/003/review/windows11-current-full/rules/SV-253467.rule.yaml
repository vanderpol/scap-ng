rule:
  id: SV-253467
  version: r991589
  title: The default permissions of global system objects must be increased.
  severity: low
  role: full
  weight: 10.0
  discussion: Windows systems maintain a global list of shared system resources such as DOS device names, mutexes,
    and semaphores. Each type of object is created with a default DACL that specifies who can access the objects
    with what permissions. If this policy is enabled, the default DACL is stronger, allowing non-admin users to
    read shared objects, but not modify shared objects that they did not create.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000240
  - scheme: vulnerability
    value: V-253467
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> Security Options >> "System objects: Strengthen default permissions of internal system objects
      (e.g. Symbolic links)" to "Enabled".'
  organizational_input_requirements: {}
