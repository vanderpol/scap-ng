rule:
  id: SV-253341
  version: r958434
  title: Windows 11 permissions for the Security event log must prevent access by non-privileged accounts.
  severity: medium
  role: full
  weight: 10.0
  discussion: Maintaining an audit trail of system activity logs can help identify configuration errors, troubleshoot
    service disruptions, and analyze compromises that have occurred, as well as detect attacks. Audit logs are necessary
    to provide a trail of evidence in case the system or network is compromised. The Security event log may disclose
    sensitive information or be susceptible to tampering if proper permissions are not applied.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-AU-000520
  - scheme: vulnerability
    value: V-253341
  - scheme: cci
    value: CCI-000162
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Ensure the permissions on the Security event log (Security.evtx) are configured to prevent standard
      user accounts or groups from having access. The default permissions listed below satisfy this requirement.
      Eventlog - Full Control SYSTEM - Full Control Administrators - Full Control The default location is the "%SystemRoot%\SYSTEM32\WINEVT\LOGS"
      directory. If the location of the logs has been changed, when adding Eventlog to the permissions, it must
      be entered as "NT Service\Eventlog".
  organizational_input_requirements: {}
