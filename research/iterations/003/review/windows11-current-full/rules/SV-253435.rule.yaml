rule:
  id: SV-253435
  version: r991589
  title: The built-in administrator account must be renamed.
  severity: medium
  role: full
  weight: 10.0
  discussion: The built-in administrator account is a well-known account subject to attack. Renaming this account
    to an unidentified name improves the protection of this account and the system.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000020
  - scheme: vulnerability
    value: V-253435
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> Security Options >> "Accounts: Rename administrator account" to a name other than "Administrator".'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253435.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253435.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253435.manual.assessment.yaml
  default_assessment_choice: default
