rule:
  id: SV-253401
  version: r1210296
  title: Windows 11 must be configured to require a minimum PIN length of six characters or greater.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'Windows allows the use of PINs and biometrics for authentication without sending a password to a
    network or website where it could be compromised. Longer minimum PIN lengths increase the available combinations
    an attacker would have to attempt. Shorter minimum length significantly reduces the strength. Note: A different
    registry location is needed when systems are managed by Intune versus GPO.'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000260
  - scheme: vulnerability
    value: V-253401
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'For GPO-managed systems: Configure the policy value for Computer Configuration >> Administrative
      Templates >> System >> PIN Complexity >> "Minimum PIN length" to "6" or greater. For Intune-managed systems:
      Revise the Intune policy to set the minimum PIN length to "6" or greater.'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253401.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253401.automated.assessment.yaml
    manual:
