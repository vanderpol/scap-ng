rule:
  id: SV-253499
  version: r958726
  title: The "Load and unload device drivers" user right must only be assigned to the Administrators group.
  severity: medium
  role: full
  weight: 10.0
  discussion: Inappropriate granting of user rights can provide system, administrative, and other high-level capabilities.
    The "Load and unload device drivers" user right allows device drivers to dynamically be loaded on a system by
    a user. This could potentially be used to install malicious code by an attacker.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-UR-000120
  - scheme: vulnerability
    value: V-253499
  - scheme: cci
    value: CCI-002235
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> User Rights Assignment >> "Load and unload device drivers" to only include the following
      groups or accounts: Administrators'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253499.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253499.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253499.manual.assessment.yaml
  default_assessment_choice: default
