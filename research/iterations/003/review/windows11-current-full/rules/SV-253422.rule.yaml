rule:
  id: SV-253422
  version: r1256685
  title: Windows 11 must be configured to prevent Windows apps from being activated by voice while the system is
    locked.
  severity: medium
  role: full
  weight: 10.0
  discussion: Allowing Windows apps to be activated by voice from the lock screen could allow for unauthorized use.
    Requiring logon will ensure the apps are used only by authorized personnel.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000365
  - scheme: vulnerability
    value: V-253422
  - scheme: cci
    value: CCI-000056
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components
      >> App Privacy >> "Let Windows apps activate with voice while the system is locked" to "Enabled" with Default
      for all Apps: set to Force Deny. The requirement is NA if the policy value for Computer Configuration >> Administrative
      Templates >> Windows Components >> App Privacy >> "Let Windows apps activate with voice" is configured to
      "Enabled" with Default for all Apps: set to Force Deny.'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253422.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253422.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253422.manual.assessment.yaml
  default_assessment_choice: default
