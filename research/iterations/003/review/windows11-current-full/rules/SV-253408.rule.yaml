rule:
  id: SV-253408
  version: r958478
  title: Basic authentication for RSS feeds over HTTP must not be used.
  severity: medium
  role: full
  weight: 10.0
  discussion: Basic authentication uses plain text passwords that could be used to compromise a system.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000300
  - scheme: vulnerability
    value: V-253408
  - scheme: cci
    value: CCI-000381
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: The default behavior is for the Windows RSS platform to not use Basic authentication over HTTP connections.
      To correct this, configure the policy value for Computer Configuration >> Administrative Templates >> Windows
      Components >> RSS Feeds >> "Turn on Basic feed authentication over HTTP" to "Not Configured" or "Disabled".
