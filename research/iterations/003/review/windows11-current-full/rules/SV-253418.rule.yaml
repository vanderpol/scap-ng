rule:
  id: SV-253418
  version: r958510
  title: The Windows Remote Management (WinRM) service must not use Basic authentication.
  severity: high
  role: full
  weight: 10.0
  discussion: Basic authentication uses plain text passwords that could be used to compromise a system.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000345
  - scheme: vulnerability
    value: V-253418
  - scheme: cci
    value: CCI-000877
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components
      >> Windows Remote Management (WinRM) >> WinRM Service >> "Allow Basic authentication" to "Disabled". Severity
      Override Guidance: The AO can allow the severity override if they have reviewed the overall protection. This
      would only be allowed temporarily for implementation as documented and approved. .... Allowing Basic authentication
      to be used for the sole creation of Office 365 DoD tenants. .... A documented mechanism and or script that
      can disable Basic authentication once administration completes. .... Use of a Privileged Access Workstation
      (PAW) and adherence to the Clean Source principle for administration.'
  organizational_input_requirements: {}
