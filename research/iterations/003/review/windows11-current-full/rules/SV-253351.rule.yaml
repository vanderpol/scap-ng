rule:
  id: SV-253351
  version: r1106508
  title: Windows 11 must cover or disable the built-in or attached camera when not in use.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'It is detrimental for operating systems to provide, or install by default, functionality exceeding
    requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore
    may remain unsecured. They increase the risk to the platform by providing additional attack vectors. Failing
    to disconnect from collaborative computing devices (i.e. cameras) can result in subsequent compromises of organizational
    information. Providing easy methods to physically disconnect from such devices after a collaborative computing
    session helps to ensure that participants actually carry out the disconnect activity without having to go through
    complex and tedious procedures. Satisfies: SRG-OS-000095-GPOS-00049, SRG-OS-000370-GPOS-00155'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000007
  - scheme: vulnerability
    value: V-253351
  - scheme: cci
    value: CCI-000381
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability:
  - windows11-stig-current-full.condition.camera-installation
  parameters: {}
  remediation:
    guidance: 'If the camera is not disconnected or covered, the following registry entry is required. Registry
      Hive: HKEY_LOCAL_MACHINE RegistryPath\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\webcam
      Value Name: Value Value Data: Deny'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/manual/windows11-stig-current-full.SV-253351.manual.assessment.yaml
    manual:
      assessment: ../assessments/manual/windows11-stig-current-full.SV-253351.manual.assessment.yaml
  default_assessment_choice: default
