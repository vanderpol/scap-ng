rule:
  id: SV-253296
  version: r1256651
  title: The Windows 11 time service must synchronize with an appropriate DoW time source.
  severity: low
  role: full
  weight: 10.0
  discussion: The Windows Time Service controls time synchronization settings. Time synchronization is essential
    for authentication and auditing purposes. If the Windows Time Service is used, it must synchronize with a secure,
    authorized time source. Domain-joined systems are automatically configured to synchronize with domain controllers.
    If an NTP server is configured, it must synchronize with a secure, authorized time source.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
