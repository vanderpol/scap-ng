    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the system to synchronize time with an appropriate DoW time source. Domain-joined systems
      use NT5DS to synchronize time from other systems in the domain by default. If the system needs to be configured
      to an NTP server, configure the system to point to an authorized time server by setting the policy value for
      Computer Configuration >> Administrative Templates >> System >> Windows Time Service >> Time Providers >>
      "Configure Windows NTP Client" to "Enabled", and configure the "NtpServer" field to point to an appropriate
      DoW time server. The US Naval Observatory operates stratum 1 time servers, identified at https://www.cnmoc.usff.navy.mil/Our-Commands/United-States-Naval-Observatory/Precise-Time-Department/Network-Time-Protocol-NTP/.
      Time synchronization will occur through a hierarchy of time servers down to the local level. Clients and lower-level
      servers will synchronize with an authorized time server in the hierarchy.
  organizational_input_requirements: {}
