rule:
  id: SV-253436
  version: r991589
  title: The built-in guest account must be renamed.
  severity: medium
  role: full
  weight: 10.0
  discussion: The built-in guest account is a well-known user account on all Windows systems and, as initially installed,
    does not require a password. This can allow access to system resources by unauthorized users. Renaming this
    account to an unidentified name improves the protection of this account and the system.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000025
  - scheme: vulnerability
    value: V-253436
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> Security Options >> "Accounts: Rename guest account" to a name other than "Guest".'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/windows11-stig-current-full.SV-253436.automated.assessment.yaml
    automated:
