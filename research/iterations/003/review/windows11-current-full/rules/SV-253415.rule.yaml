rule:
  id: SV-253415
  version: r958420
  title: PowerShell Transcription must be enabled on Windows 11.
  severity: medium
  role: full
  weight: 10.0
  discussion: Maintaining an audit trail of system activity logs can help identify configuration errors, troubleshoot
    service disruptions, and analyze compromises that have occurred, as well as detect attacks. Audit logs are necessary
    to provide a trail of evidence in case the system or network is compromised. Collecting this data is essential
    for analyzing the security of information assets and detecting signs of suspicious and unexpected behavior.
    Enabling PowerShell Transcription will record detailed information from the processing of PowerShell commands
    and scripts. This can provide additional detail when malware has run on a system.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000327
  - scheme: vulnerability
    value: V-253415
  - scheme: cci
    value: CCI-000134
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components
      >> Windows PowerShell >> "Turn on PowerShell Transcription" to "Enabled". Specify the Transcript output directory
      to point to a Central Log Server or another secure location to prevent user access.
  organizational_input_requirements: {}
