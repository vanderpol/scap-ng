rule:
  id: SV-253442
  version: r991589
  title: The maximum age for machine account passwords must be configured to 30 days or less.
  severity: low
  role: full
  weight: 10.0
  discussion: Computer account passwords are changed automatically on a regular basis. This setting controls the
    maximum password age that a machine account may have. This setting must be set to no more than 30 days, ensuring
    the machine changes its password monthly.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000055
  - scheme: vulnerability
    value: V-253442
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'This is the default configuration for this setting (30 days). Configure the policy value for Computer
      Configuration >> Windows Settings >> Security Settings >> Local Policies >> Security Options >> "Domain member:
      Maximum machine account password age" to "30" or less (excluding 0 which is unacceptable).'
  organizational_input_requirements: {}
  assessment_choices:
