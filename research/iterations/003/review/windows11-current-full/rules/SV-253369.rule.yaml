rule:
  id: SV-253369
  version: r1210289
  title: Virtualization-Based Security (VBS) must be enabled on Windows 11 with the platform security level configured
    to Secure Boot or Secure Boot with DMA Protection.
  severity: medium
  role: full
  weight: 10.0
  discussion: VBS provides the platform for the additional security features, Credential Guard, and virtualization-based
    protection of code integrity. Secure Boot is the minimum security level, with DMA protection providing additional
    memory protection. DMA Protection requires a CPU that supports input/output memory management unit (IOMMU).
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000070
  - scheme: vulnerability
    value: V-253369
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> System >> Device
      Guard >> "Turn On virtualization-based Security" to "Enabled" with "Secure Boot" or "Secure Boot and DMA Protection"
      selected for "Select Platform Security Level:". A Microsoft article on Credential Guard system requirement
      can be found at the following link. https://technet.microsoft.com/en-us/itpro/windows/keep-secure/credential-guard-requirements
  organizational_input_requirements: {}
