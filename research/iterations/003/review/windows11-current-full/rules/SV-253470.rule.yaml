rule:
  id: SV-253470
  version: r1256666
  title: Windows 11 must use multifactor authentication for local and network access to privileged and nonprivileged
    accounts.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'Without the use of multifactor authentication, the ease of access to privileged and nonprivileged
    functions is greatly increased. All domain accounts must be enabled for multifactor authentication with the
    exception of local emergency accounts. Multifactor authentication requires using two or more factors to achieve
    authentication. Factors include: 1) Something a user knows (e.g., password/PIN); 2) Something a user has (e.g.,
    cryptographic identification device, token); and 3) Something a user is (e.g., biometric). A privileged account
    is defined as an information system account with authorizations of a privileged user. Network access is defined
    as access to an information system by a user (or a process acting on behalf of a user) communicating through
    a network (e.g., local area network, wide area network, or the internet). Local access is defined as access
    to an organizational information system by a user (or process acting on behalf of a user) communicating through
    a direct connection without the use of a network. The DoW CAC with DoW-approved PKI is an example of multifactor
    authentication. Satisfies: SRG-OS-000106-GPOS-00053, SRG-OS-000107-GPOS-00054, SRG-OS-000108-GPOS-00055'
  rationale: null
  extensions:
    disa_stig:
