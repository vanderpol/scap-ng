rule:
  id: SV-253416
  version: r958510
  title: The Windows Remote Management (WinRM) client must not use Basic authentication.
  severity: high
  role: full
  weight: 10.0
  discussion: Basic authentication uses plain text passwords that could be used to compromise a system.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
