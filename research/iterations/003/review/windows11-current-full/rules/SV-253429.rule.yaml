rule:
  id: SV-253429
  version: r1256662
  title: The DoW Interoperability Root CA cross-certificates must be installed in the Untrusted Certificates Store
    on unclassified systems.
  severity: medium
  role: full
  weight: 10.0
  discussion: To ensure users do not experience denial of service when performing certificate-based authentication
    to DoW websites due to the system chaining to a root other than DoW Root CAs, the DoW Interoperability Root
    CA cross-certificates must be installed in the Untrusted Certificate Store. This requirement only applies to
    unclassified systems.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-PK-000015
  - scheme: vulnerability
    value: V-253429
  - scheme: cci
    value: CCI-002470
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Install valid (unexpired) DoW Interoperability Root CA cross-certificates on unclassified systems.
      The list below is not to be treated as exhaustive. The STIG should not be used as a definitive resource for
      the organizationally approved certificates for the systems. DoD Interoperability Root CA 2 The certificates
      can be installed using the InstallRoot tool. The tool and user guide are available on Cyber Exchange at https://cyber.mil/pki-pke/tools-configuration-files.
      Certificate bundles published by the PKI can be found at https://crl.gds.disa.mil/.
  assessment_choices:
