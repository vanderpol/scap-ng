rule:
  id: SV-253277
  version: r958478
  title: Simple TCP/IP Services must not be installed on the system.
  severity: medium
  role: full
  weight: 10.0
  discussion: '"Simple TCP/IP Services" is not installed by default. Some protocols and services do not support
    required security features, such as encrypting passwords or traffic.'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-00-000110
  - scheme: vulnerability
    value: V-253277
  - scheme: cci
    value: CCI-000381
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Uninstall "Simple TCPIP Services (i.e. echo, daytime etc.)" from the system. Run "Programs and Features".
      Select "Turn Windows Features on or off". De-select "Simple TCPIP Services (i.e. echo, daytime etc.)".
