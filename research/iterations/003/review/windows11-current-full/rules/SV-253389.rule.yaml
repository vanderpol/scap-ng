rule:
  id: SV-253389
  version: r1256673
  title: Enhanced anti-spoofing for facial recognition must be enabled on Windows 11.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'Enhanced anti-spoofing provides additional protections when using facial recognition with devices
    that support it. Note: A different registry location is needed when systems are managed by Intune versus GPO.'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000195
  - scheme: vulnerability
    value: V-253389
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'For GPO-managed systems: Configure the policy value for Computer Configuration >> Administrative
      Templates >> Windows Components >> Biometrics >> Facial Features >> "Configure enhanced anti-spoofing" to
      "Enabled". For Intune-managed systems: Revise the Intune policy to enable enhanced anti-spoofing for Facial
      Features.'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253389.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253389.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253389.manual.assessment.yaml
  default_assessment_choice: default
