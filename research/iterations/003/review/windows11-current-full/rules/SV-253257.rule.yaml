rule:
  id: SV-253257
  version: r1210281
  title: Secure Boot must be enabled on Windows 11 systems.
  severity: medium
  role: full
  weight: 10.0
  discussion: Secure Boot is a standard that ensures systems boot only to a trusted operating system. Secure Boot
    is required to support additional security features in Windows 11, including virtualization-based Security and
    Credential Guard. If Secure Boot is turned off, these security features will not function.
