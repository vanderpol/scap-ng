rule:
  id: SV-253460
  version: r971535
  title: Kerberos encryption types must be configured to prevent the use of DES and RC4 encryption suites.
  severity: medium
  role: full
  weight: 10.0
  discussion: Certain encryption types are no longer considered secure. This setting configures a minimum encryption
    type for Kerberos, preventing the use of the DES and RC4 encryption suites.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000190
  - scheme: vulnerability
    value: V-253460
  - scheme: cci
    value: CCI-000803
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> Security Options >> "Network security: Configure encryption types allowed for Kerberos"
      to "Enabled" with only the following selected: AES128_HMAC_SHA1 AES256_HMAC_SHA1 Future encryption types'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253460.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253460.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253460.manual.assessment.yaml
  default_assessment_choice: default
