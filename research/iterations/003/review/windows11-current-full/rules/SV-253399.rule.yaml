rule:
  id: SV-253399
  version: r1256682
  title: Windows 11 must be configured to disable Windows Game Recording and Broadcasting.
  severity: medium
  role: full
  weight: 10.0
  discussion: Windows Game Recording and Broadcasting is intended for use with games; however, it could record screenshots
    of other applications and expose sensitive data. Disabling the feature will prevent this from occurring.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000252
  - scheme: vulnerability
    value: V-253399
  - scheme: cci
    value: CCI-000381
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability:
  - condition.windows-enterprise-ltsc
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components
      >> Windows Game Recording and Broadcasting >> "Enables or disables Windows Game Recording and Broadcasting"
      to "Disabled".
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253399.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253399.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253399.manual.assessment.yaml
  default_assessment_choice: default
