rule:
  id: SV-253391
  version: r958518
  title: Administrator accounts must not be enumerated during elevation.
  severity: medium
  role: full
  weight: 10.0
  discussion: Enumeration of administrator accounts when elevating can provide part of the logon information to
    an unauthorized user. This setting configures the system to always require users to type in a username and password
    to elevate a running application.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000200
  - scheme: vulnerability
    value: V-253391
  - scheme: cci
    value: CCI-001084
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components
      >> Credential User Interface >> "Enumerate administrator accounts on elevation" to "Disabled".
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253391.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253391.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253391.manual.assessment.yaml
  default_assessment_choice: default
