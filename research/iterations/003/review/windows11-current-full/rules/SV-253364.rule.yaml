rule:
  id: SV-253364
  version: r958358
  title: Simultaneous connections to the internet or a Windows domain must be limited.
  severity: medium
  role: full
  weight: 10.0
  discussion: Multiple network connections can provide additional attack vectors to a system and must be limited.
    The "Minimize the number of simultaneous connections to the Internet or a Windows Domain" setting prevents systems
    from automatically establishing multiple connections. When both wired and wireless connections are available,
    for example, the less preferred connection (typically wireless) will be disconnected.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000055
  - scheme: vulnerability
    value: V-253364
  - scheme: cci
    value: CCI-002418
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: The default behavior for "Minimize the number of simultaneous connections to the Internet or a Windows
      Domain" is "Enabled". If this needs to be corrected, configure the policy value for Computer Configuration
      >> Administrative Templates >> Network >> Windows Connection Manager >> "Minimize the number of simultaneous
      connections to the Internet or a Windows Domain" to "Enabled". Under "Options", set "Minimize Policy Options"
      to "3 = Prevent Wi-Fi When on Ethernet".
  organizational_input_requirements: {}
