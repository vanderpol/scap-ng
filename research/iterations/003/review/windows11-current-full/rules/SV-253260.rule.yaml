rule:
  id: SV-253260
  version: r1210283
  title: Windows 11 systems must use a BitLocker PIN for pre-boot authentication.
  severity: high
  role: full
  weight: 10.0
  discussion: If data at rest is unencrypted, it is vulnerable to disclosure. Even if the operating system enforces
    permissions on data access, an adversary can remove nonvolatile memory and read it directly, thereby circumventing
    operating system controls. Encrypting the data ensures that confidentiality is protected even when the operating
    system is not running. Pre-boot authentication prevents unauthorized users from accessing encrypted drives.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-00-000031
  - scheme: vulnerability
    value: V-253260
  - scheme: cci
    value: CCI-002476
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components
      >> BitLocker Drive Encryption >> Operating System Drives "Require additional authentication at startup" to
      "Enabled" with "Configure TPM Startup PIN:" set to "Require startup PIN with TPM" or with "Configure TPM startup
      key and PIN:" set to "Require startup key and PIN with TPM". If Network Unlock is active, select "Configure
      TPM startup PIN:" and set to "Require startup PIN with TPM". If Network Unlock is not active, select "Configure
      TPM startup key and PIN:" and set to "Require startup key and PIN with TPM".
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253260.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253260.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253260.manual.assessment.yaml
  default_assessment_choice: default
