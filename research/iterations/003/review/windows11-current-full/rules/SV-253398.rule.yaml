rule:
  id: SV-253398
  version: r991589
  title: File Explorer shell protocol must run in protected mode.
  severity: medium
  role: full
  weight: 10.0
  discussion: The shell protocol will limit the set of folders applications can open when run in protected mode.
    Restricting files an application can open, to a limited set of folders, increases the security of Windows.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000225
  - scheme: vulnerability
    value: V-253398
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: The default behavior is for shell protected mode to be turned on for file explorer. To correct this,
      configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components >>
      File Explorer >> "Turn off shell protocol protected mode" to "Not Configured" or "Disabled".
  organizational_input_requirements: {}
