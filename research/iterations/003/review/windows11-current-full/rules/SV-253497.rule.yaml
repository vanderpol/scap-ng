rule:
  id: SV-253497
  version: r958726
  title: The "Force shutdown from a remote system" user right must only be assigned to the Administrators group.
  severity: medium
  role: full
  weight: 10.0
  discussion: Inappropriate granting of user rights can provide system, administrative, and other high-level capabilities.
    Accounts with the "Force shutdown from a remote system" user right can remotely shut down a system which could
    result in a DoS.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-UR-000100
  - scheme: vulnerability
    value: V-253497
  - scheme: cci
    value: CCI-002235
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> User Rights Assignment >> "Force shutdown from a remote system" to only include the following
      groups or accounts: Administrators'
  organizational_input_requirements: {}
