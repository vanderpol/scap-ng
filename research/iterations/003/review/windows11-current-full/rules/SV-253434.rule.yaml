rule:
  id: SV-253434
  version: r991589
  title: Local accounts with blank passwords must be restricted to prevent access from the network.
  severity: medium
  role: full
  weight: 10.0
  discussion: An account without a password can allow unauthorized access to a system as only the username would
    be required. Password policies must prevent accounts with blank passwords from existing on a system. However,
    if a local account with a blank password did exist, enabling this setting will prevent network access, limiting
    the account to local console logon only.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000015
  - scheme: vulnerability
    value: V-253434
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> Security Options >> "Accounts: Limit local account use of blank passwords to console logon
      only" to "Enabled".'
  organizational_input_requirements: {}
  assessment_choices:
