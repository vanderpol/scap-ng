rule:
  id: SV-253269
  version: r958702
  title: Only accounts responsible for the administration of a system must have Administrator rights on the system.
  severity: high
  role: full
  weight: 10.0
  discussion: An account that does not have Administrator duties must not have Administrator rights. Such rights
    would allow the account to bypass or modify required security restrictions on that machine and make it vulnerable
    to attack. System administrators must log on to systems only using accounts with the minimum level of authority
    necessary. For domain-joined workstations, the Domain Admins group must be replaced by a domain workstation
    administrator group (see V-36434 in the Active Directory Domain STIG). Restricting highly privileged accounts
    from the local Administrators group helps mitigate the risk of privilege escalation resulting from credential
    theft attacks. Standard user accounts must not be members of the local administrators group.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-00-000070
  - scheme: vulnerability
    value: V-253269
  - scheme: cci
    value: CCI-002165
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the system to include only administrator groups or accounts that are responsible for the
      system in the local Administrators group. For domain-joined workstations, the Domain Admins group must be
      replaced by a domain workstation administrator group. Remove any standard user accounts.
