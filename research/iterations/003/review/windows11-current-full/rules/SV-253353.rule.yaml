rule:
  id: SV-253353
  version: r991589
  title: IPv6 source routing must be configured to highest protection.
  severity: medium
  role: full
  weight: 10.0
  discussion: Configuring the system to disable IPv6 source routing protects against spoofing.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000020
  - scheme: vulnerability
    value: V-253353
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Administrative Templates >> MSS (Legacy)
      >> "MSS: (DisableIPSourceRouting IPv6) IP source routing protection level (protects against packet spoofing)"
      to "Highest protection, source routing is completely disabled". This policy setting requires the installation
      of the MSS-Legacy custom templates included with the STIG package. "MSS-Legacy.admx" and "MSS-Legacy.adml"
      must be copied to the \Windows\PolicyDefinitions and \Windows\PolicyDefinitions\en-US directories respectively.'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253353.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253353.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253353.manual.assessment.yaml
  default_assessment_choice: default
