rule:
  id: SV-253382
  version: r1137695
  title: Solicited Remote Assistance must not be allowed.
  severity: high
  role: full
  weight: 10.0
  discussion: Remote assistance allows another user to view or take control of the local session of a user. Solicited
    assistance is help that is specifically requested by the local user. This may allow unauthorized parties access
    to the resources on the computer.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000155
  - scheme: vulnerability
    value: V-253382
  - scheme: cci
    value: CCI-001090
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> System >> Remote
      Assistance >> "Configure Solicited Remote Assistance" to "Disabled".
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253382.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253382.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253382.manual.assessment.yaml
  default_assessment_choice: default
