rule:
  id: SV-253396
  version: r958928
  title: Explorer Data Execution Prevention must be enabled.
  severity: medium
  role: full
  weight: 10.0
  discussion: Data Execution Prevention (DEP) provides additional protection by performing checks on memory to help
    prevent malicious code from running. This setting will prevent Data Execution Prevention from being turned off
    for File Explorer.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000215
  - scheme: vulnerability
    value: V-253396
  - scheme: cci
    value: CCI-002824
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: The default behavior is for data execution prevention to be turned on for file explorer. To correct
      this, configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components
      >> File Explorer >> "Turn off Data Execution Prevention for Explorer" to "Not Configured" or "Disabled".
  organizational_input_requirements: {}
