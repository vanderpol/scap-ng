rule:
  id: SV-253358
  version: r958478
  title: WDigest Authentication must be disabled.
  severity: medium
  role: full
  weight: 10.0
  discussion: When the WDigest Authentication protocol is enabled, plain text passwords are stored in the Local
    Security Authority Subsystem Service (LSASS) exposing them to theft. WDigest is disabled by default in Windows
    11. This setting ensures this is enforced.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000038
  - scheme: vulnerability
    value: V-253358
  - scheme: cci
    value: CCI-000381
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> MS Security Guide
      >> "WDigest Authentication (disabling may require KB2871997)" to "Disabled". The patch referenced in the policy
      title is not required for Windows 11. This policy setting requires the installation of the SecGuide custom
      templates included with the STIG package. "SecGuide.admx" and "SecGuide.adml" must be copied to the \Windows\PolicyDefinitions
      and \Windows\PolicyDefinitions\en-US directories respectively.
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253358.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253358.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253358.manual.assessment.yaml
  default_assessment_choice: default
