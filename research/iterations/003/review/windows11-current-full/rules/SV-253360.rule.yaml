rule:
  id: SV-253360
  version: r991589
  title: Insecure logons to an SMB server must be disabled.
  severity: medium
  role: full
  weight: 10.0
  discussion: Insecure guest logons allow unauthenticated access to shared folders. Shared resources on a system
    must require authentication to establish proper access.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000040
  - scheme: vulnerability
    value: V-253360
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> Network >> Lanman
      Workstation >> "Enable insecure guest logons" to "Disabled".
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253360.automated.assessment.yaml
    automated:
