rule:
  id: SV-253483
  version: r958726
  title: The "Back up files and directories" user right must only be assigned to the Administrators group.
  severity: medium
  role: full
  weight: 10.0
  discussion: Inappropriate granting of user rights can provide system, administrative, and other high-level capabilities.
    Accounts with the "Back up files and directories" user right can circumvent file and directory permissions and
    could allow access to sensitive data."
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-UR-000030
  - scheme: vulnerability
    value: V-253483
  - scheme: cci
    value: CCI-002235
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> User Rights Assignment >> "Back up files and directories" to only include the following
      groups or accounts: Administrators'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253483.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253483.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253483.manual.assessment.yaml
  default_assessment_choice: default
