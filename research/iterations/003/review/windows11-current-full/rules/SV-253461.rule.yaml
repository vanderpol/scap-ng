rule:
  id: SV-253461
  version: r1051056
  title: The system must be configured to prevent the storage of the LAN Manager hash of passwords.
  severity: high
  role: full
  weight: 10.0
  discussion: The LAN Manager hash uses a weak encryption algorithm and there are several tools available that use
    this hash to retrieve account passwords. This setting controls whether or not a LAN Manager hash of the password
    is stored in the SAM the next time the password is changed.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000195
  - scheme: vulnerability
    value: V-253461
  - scheme: cci
    value: CCI-004062
  - scheme: cci
    value: CCI-000196
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> Security Options >> "Network security: Do not store LAN Manager hash value on next password
      change" to "Enabled".'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253461.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253461.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253461.manual.assessment.yaml
  default_assessment_choice: default
