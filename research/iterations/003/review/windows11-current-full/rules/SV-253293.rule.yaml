rule:
  id: SV-253293
  version: r991589
  title: The system must notify the user when a Bluetooth device attempts to connect.
  severity: medium
  role: full
  weight: 10.0
  discussion: If not configured properly, Bluetooth may allow rogue devices to communicate with a system. If a rogue
    device is paired with a system, there is potential for sensitive information to be compromised.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-00-000230
  - scheme: vulnerability
    value: V-253293
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability:
  - windows11-stig-current-full.condition.bluetooth-installation
  parameters: {}
  remediation:
    guidance: Configure Bluetooth to notify users if devices attempt to connect. View Bluetooth Settings. Ensure
      "Alert me when a new Bluetooth device wants to connect" is checked.
  organizational_input_requirements: {}
