rule:
  id: SV-253462
  version: r991589
  title: The LanMan authentication level must be set to send NTLMv2 response only, and to refuse LM and NTLM.
  severity: high
  role: full
  weight: 10.0
  discussion: The Kerberos v5 authentication protocol is the default for authentication of users who are logging
    on to domain accounts. NTLM, which is less secure, is retained in later Windows versions for compatibility with
    clients and servers that are running earlier versions of Windows or applications that still use it. It is also
    used to authenticate logons to stand-alone computers that are running later versions.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000205
  - scheme: vulnerability
    value: V-253462
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> Security Options >> "Network security: LAN Manager authentication level" to "Send NTLMv2
      response only. Refuse LM & NTLM".'
  organizational_input_requirements: {}
