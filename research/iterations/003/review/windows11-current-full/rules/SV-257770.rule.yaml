rule:
  id: SV-257770
  version: r958412
  title: Windows 11 must have command line process auditing events enabled for failures.
  severity: medium
  role: full
  weight: 10.0
  discussion: When this policy setting is enabled, the operating system generates audit events when a process fails
    to start and the name of the program or user that created it. These audit events can assist in understanding
    how a computer is being used and tracking user activity.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-AU-000585
  - scheme: vulnerability
    value: V-257770
  - scheme: cci
    value: CCI-002234
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Go to Computer Configuration >> Windows Settings >>Security Settings>> Advanced Audit Policy Configuration
      >> System Audit Policies >> Detailed Tracking >> Set "Audit Process Creation" to "Failure".
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-257770.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-257770.automated.assessment.yaml
    manual:
