rule:
  id: SV-253473
  version: r958518
  title: User Account Control must only elevate UIAccess applications that are installed in secure locations.
  severity: medium
  role: full
  weight: 10.0
  discussion: User Account Control (UAC) is a security mechanism for limiting the elevation of privileges, including
    administrative accounts, unless authorized. This setting configures Windows to only allow applications installed
    in a secure location on the file system, such as the Program Files or the Windows\System32 folders, to run with
    elevated privileges.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000265
  - scheme: vulnerability
    value: V-253473
  - scheme: cci
    value: CCI-001084
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> Security Options >> "User Account Control: Only elevate UIAccess applications that are installed
      in secure locations" to "Enabled".'
  organizational_input_requirements: {}
