rule:
  id: SV-253463
  version: r991589
  title: The system must be configured to the required LDAP client signing level.
  severity: medium
  role: full
  weight: 10.0
  discussion: This setting controls the signing requirements for LDAP clients. This setting must be set to Negotiate
    signing or Require signing, depending on the environment and type of LDAP server in use.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000210
  - scheme: vulnerability
    value: V-253463
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> Security Options >> "Network security: LDAP client signing requirements" to "Negotiate signing"
      at a minimum.'
  organizational_input_requirements: {}
