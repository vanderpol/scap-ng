rule:
  id: SV-253259
  version: r1210282
  title: Windows 11 information systems must use BitLocker to encrypt all disks to protect the confidentiality and
    integrity of all information at rest.
  severity: high
  role: full
  weight: 10.0
  discussion: If data at rest is unencrypted, it is vulnerable to disclosure. Even if the operating system enforces
    permissions on data access, an adversary can remove nonvolatile memory and read it directly, thereby circumventing
    operating system controls. Encrypting the data ensures that confidentiality is protected even when the operating
    system is not running.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-00-000030
  - scheme: vulnerability
    value: V-253259
  - scheme: cci
    value: CCI-002475
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Enable full disk encryption on all information systems (including SIPRNet) using BitLocker. BitLocker,
      included in Windows, can be enabled in the Control Panel under "BitLocker Drive Encryption" as well as other
      management tools. Note: An alternate encryption application may be used in lieu of BitLocker providing it
      is configured for full disk encryption and satisfies the pre-boot authentication requirements (WN11-00-000031
      and WN11-00-000032).'
  organizational_input_requirements: {}
