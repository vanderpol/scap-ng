rule:
  id: SV-253445
  version: r1210302
  title: The required legal notice must be configured to display before console logon.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'Failure to display the logon banner prior to a logon attempt will negate legal proceedings resulting
    from unauthorized access to system resources. Satisfies: SRG-OS-000024-GPOS-00007, SRG-OS-000228-GPOS-00088,
    SRG-OS-000024-GPOS-00007'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000075
  - scheme: vulnerability
    value: V-253445
  - scheme: cci
    value: CCI-000044
  - scheme: cci
    value: CCI-000048
  - scheme: cci
    value: CCI-000050
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> Security Options >> "Interactive logon: Message text for users attempting to log on" to
      the following. You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized
      use only. By using this IS (which includes any device attached to this IS), you consent to the following conditions:
      -The USG routinely intercepts and monitors communications on this IS for purposes including, but not limited
      to, penetration testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law
      enforcement (LE), and counterintelligence (CI) investigations. -At any time, the USG may inspect and seize
      data stored on this IS. -Communications using, or data stored on, this IS are not private, are subject to
      routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized purpose.
      -This IS includes security measures (e.g., authentication and access controls) to protect USG interests--not
      for your personal benefit or privacy. -Notwithstanding the above, using this IS does not constitute consent
      to PM, LE or CI investigative searching or monitoring of the content of privileged communications, or work
      product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their
      assistants. Such communications and work product are private and confidential. See User Agreement for details.
      Note: For MDM/Intune implementation, when configuring this policy via a Policy Configuration Service Provider
      (CSP), both the "Message text" and the "Interactive logon: Message title for users attempting to log on" must
      be configured to enable the legal notice to be displayed. It is recommended to set the "Message title" to
      a non-blank value, such as "U.S. Government Warning" or a period (".").'
  organizational_input_requirements: {}
  assessment_choices:
