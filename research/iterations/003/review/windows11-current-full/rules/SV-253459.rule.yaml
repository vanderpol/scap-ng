rule:
  id: SV-253459
  version: r991589
  title: PKU2U authentication using online identities must be prevented.
  severity: medium
  role: full
  weight: 10.0
  discussion: PKU2U is a peer-to-peer authentication protocol. This setting prevents online identities from authenticating
    to domain-joined systems. Authentication will be centrally managed with Windows user accounts.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000185
  - scheme: vulnerability
    value: V-253459
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> Security Options >> "Network security: Allow PKU2U authentication requests to this computer
      to use online identities" to "Disabled".'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253459.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253459.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253459.manual.assessment.yaml
  default_assessment_choice: default
