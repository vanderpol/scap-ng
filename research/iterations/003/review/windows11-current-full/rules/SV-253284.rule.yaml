rule:
  id: SV-253284
  version: r958928
  title: Structured Exception Handling Overwrite Protection (SEHOP) must be enabled.
  severity: high
  role: full
  weight: 10.0
  discussion: Attackers are constantly looking for vulnerabilities in systems and applications. Structured Exception
    Handling Overwrite Protection (SEHOP) blocks exploits that use the Structured Exception Handling overwrite technique,
    a common buffer overflow attack.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-00-000150
  - scheme: vulnerability
    value: V-253284
  - scheme: cci
    value: CCI-002824
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> MS Security Guide
      >> "Enable Structured Exception Handling Overwrite Protection (SEHOP)" to "Enabled". This policy setting requires
      the installation of the SecGuide custom templates included with the STIG package. "SecGuide.admx" and "SecGuide.adml"
      must be copied to the \Windows\PolicyDefinitions and \Windows\PolicyDefinitions\en-US directories respectively.
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253284.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253284.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253284.manual.assessment.yaml
  default_assessment_choice: default
