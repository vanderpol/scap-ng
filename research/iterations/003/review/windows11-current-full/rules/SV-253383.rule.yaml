rule:
  id: SV-253383
  version: r971545
  title: Unauthenticated RPC clients must be restricted from connecting to the RPC server.
  severity: medium
  role: full
  weight: 10.0
  discussion: Configuring RPC to restrict unauthenticated RPC clients from connecting to the RPC server will prevent
    anonymous connections.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000165
  - scheme: vulnerability
    value: V-253383
  - scheme: cci
    value: CCI-001967
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> System >> Remote
      Procedure Call >> "Restrict Unauthenticated RPC clients" to "Enabled" and "Authenticated".
  organizational_input_requirements: {}
