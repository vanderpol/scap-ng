rule:
  id: SV-253381
  version: r1051050
  title: The user must be prompted for a password on resume from sleep (plugged in).
  severity: medium
  role: full
  weight: 10.0
  discussion: Authentication must always be required when accessing a system. This setting ensures the user is prompted
    for a password on resume from sleep (plugged in).
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000150
  - scheme: vulnerability
    value: V-253381
  - scheme: cci
    value: CCI-002038
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> System >> Power
      Management >> Sleep Settings >> "Require a password when a computer wakes (plugged in)" to "Enabled".
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253381.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253381.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253381.manual.assessment.yaml
  default_assessment_choice: default
