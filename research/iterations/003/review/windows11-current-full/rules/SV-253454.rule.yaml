rule:
  id: SV-253454
  version: r1137695
  title: Anonymous enumeration of shares must be restricted.
  severity: high
  role: full
  weight: 10.0
  discussion: Allowing anonymous logon users (null session connections) to list all account names and enumerate
    all shared resources can provide a map of potential points to attack the system.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000150
  - scheme: vulnerability
    value: V-253454
  - scheme: cci
    value: CCI-001090
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> Security Options >> "Network access: Do not allow anonymous enumeration of SAM accounts
      and shares" to "Enabled".'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253454.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253454.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253454.manual.assessment.yaml
  default_assessment_choice: default
