  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the following Group Policy: Computer Configuration >> Administrative Templates >> Windows
      Components >> Microsoft Account "block all consumer Microsoft account user authentication" to "Enabled". For
      systems managed by Intune, apply the DoW Windows 11 STIG Settings Catalog (or equivalent Intune policy) found
      in the Intune policy package available on cyber.mil. Steps to create an Intune policy: 1. Sign in to the Intune
      admin center >> Devices >> Configuration >> Create >> New Policy. 2. Platform: Windows 10 and later. Profile
      type: Settings Catalog, then click "Create". 3. Basics: Provide a Name and Description of the profile, then
      click "Next". 4. Configuration settings: Click "+ Add settings" and search for consumer under the Settings
      picker. Under the Administrative Templates\Windows Components\Microsoft account category, check the box next
      to "Block all consumer Microsoft account user authentication". Click the Enabled radio button, then click
      "Next". 5. Scope tags: (optional), then click "Next". 6. Assignments: Assign the policy to Entra security
      groups that contain the target users or devices, then click "Next". 7. Review + create: Review the deployment
      summary, then click "Create".'
