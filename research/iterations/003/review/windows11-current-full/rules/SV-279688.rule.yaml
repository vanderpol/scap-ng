rule:
  id: SV-279688
  version: r1256671
  title: Windows 11 systems must block consumer account user authentication.
  severity: medium
  role: full
  weight: 10.0
  discussion: It is detrimental for operating systems to provide, or install by default, functionality exceeding
    requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore,
    may remain unsecured. They increase the risk to the platform by providing additional attack vectors. Operating
    systems are capable of providing a wide variety of functions and services. Some of the functions and services,
    provided by default, may not be necessary to support essential organizational operations (e.g., key missions,
    functions). The Copilot Rewrite functionality within Notepad and Image Generation within Paint is dependent
    upon the use of AI credits from a Microsoft 365 Personal or Family subscription. Organizational users must not
    use personal accounts to login to applications on enterprise machines.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
