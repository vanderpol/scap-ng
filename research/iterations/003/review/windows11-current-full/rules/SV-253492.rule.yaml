rule:
  id: SV-253492
  version: r1137691
  title: The "Deny log on as a batch job" user right on domain-joined workstations must be configured to prevent
    access from highly privileged domain accounts.
  severity: medium
  role: full
  weight: 10.0
  discussion: Inappropriate granting of user rights can provide system, administrative, and other high-level capabilities.
    The "Deny log on as a batch job" right defines accounts that are prevented from logging on to the system as
    a batch job, such as Task Scheduler. In an Active Directory Domain, denying logons to the Enterprise Admins
    and Domain Admins groups on lower trust systems helps mitigate the risk of privilege escalation from credential
    theft attacks which could lead to the compromise of an entire domain.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-UR-000075
  - scheme: vulnerability
    value: V-253492
  - scheme: cci
    value: CCI-000213
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability:
  - condition.windows-domain-member-workstation
  parameters: {}
  remediation:
    guidance: 'This requirement is applicable to domain-joined systems, for standalone systems this is NA. Configure
      the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >>
      User Rights Assignment >> "Deny log on as a batch job" to include the following: Domain Systems Only: Enterprise
      Admin Group Domain Admin Group'
  organizational_input_requirements: {}
