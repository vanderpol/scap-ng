rule:
  id: SV-253441
  version: r991589
  title: The computer account password must not be prevented from being reset.
  severity: low
  role: full
  weight: 10.0
  discussion: Computer account passwords are changed automatically on a regular basis. Disabling automatic password
    changes can make the system more vulnerable to malicious access. Frequent password changes can be a significant
    safeguard for the system. A new password for the computer account will be generated every 30 days.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000050
  - scheme: vulnerability
    value: V-253441
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> Security Options >> "Domain member: Disable machine account password changes" to "Disabled".'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253441.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253441.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253441.manual.assessment.yaml
  default_assessment_choice: default
