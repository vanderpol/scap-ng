rule:
  id: SV-253402
  version: r1051051
  title: Passwords must not be saved in the Remote Desktop Client.
  severity: medium
  role: full
  weight: 10.0
  discussion: Saving passwords in the Remote Desktop Client could allow an unauthorized user to establish a remote
    desktop session to another system. The system must be configured to prevent users from saving passwords in the
    Remote Desktop Client.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000270
  - scheme: vulnerability
    value: V-253402
  - scheme: cci
    value: CCI-002038
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components
      >> Remote Desktop Services >> Remote Desktop Connection Client >> "Do not allow passwords to be saved" to
      "Enabled".
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/windows11-stig-current-full.SV-253402.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/windows11-stig-current-full.SV-253402.automated.assessment.yaml
    manual:
