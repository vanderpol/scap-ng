rule:
  id: SV-253484
  version: r958726
  title: The "Change the system time" user right must only be assigned to Administrators and Local Service.
  severity: medium
  role: full
  weight: 10.0
  discussion: Inappropriate granting of user rights can provide system, administrative, and other high-level capabilities.
    Accounts with the "Change the system time" user right can change the system time, which can impact authentication,
    as well as affect time stamps on event log entries.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-UR-000035
  - scheme: vulnerability
    value: V-253484
  - scheme: cci
    value: CCI-002235
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> User Rights Assignment >> "Change the system time" to only include the following groups
      or accounts: Administrators LOCAL SERVICE'
  organizational_input_requirements: {}
