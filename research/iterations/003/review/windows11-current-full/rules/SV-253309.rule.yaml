rule:
  id: SV-253309
  version: r958566
  title: The system must be configured to audit Account Management - User Account Management failures.
  severity: medium
  role: full
  weight: 10.0
  discussion: Maintaining an audit trail of system activity logs can help identify configuration errors, troubleshoot
    service disruptions, and analyze compromises that have occurred, as well as detect attacks. Audit logs are necessary
    to provide a trail of evidence in case the system or network is compromised. Collecting this data is essential
    for analyzing the security of information assets and detecting signs of suspicious and unexpected behavior.
    User Account Management records events such as creating, changing, deleting, renaming, disabling, or enabling
    user accounts.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-AU-000035
  - scheme: vulnerability
    value: V-253309
  - scheme: cci
    value: CCI-001314
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Advanced Audit Policy Configuration >> System Audit Policies >> Account Management >> "Audit User Account
      Management" with "Failure" selected.
