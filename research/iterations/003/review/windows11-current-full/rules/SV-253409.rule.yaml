rule:
  id: SV-253409
  version: r1210297
  title: Indexing of encrypted files must be turned off.
  severity: medium
  role: full
  weight: 10.0
  discussion: 'Indexing of encrypted files may expose sensitive data. This setting prevents encrypted files from
    being indexed. Note: A different registry location is needed when systems are managed by Intune versus GPO.'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000305
  - scheme: vulnerability
    value: V-253409
  - scheme: cci
    value: CCI-000381
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'For GPO-managed systems: Configure the policy value for Computer Configuration >> Administrative
      Templates >> Windows Components >> Search >> "Allow indexing of encrypted files" to "Disabled". For Intune-managed
      systems: Revise the Intune policy to disable indexing of encrypted files.'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253409.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253409.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253409.manual.assessment.yaml
  default_assessment_choice: default
