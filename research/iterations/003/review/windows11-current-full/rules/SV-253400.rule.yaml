rule:
  id: SV-253400
  version: r991589
  title: The use of a hardware security device with Windows Hello for Business must be enabled.
  severity: medium
  role: full
  weight: 10.0
  discussion: The use of a Trusted Platform Module (TPM) to store keys for Windows Hello for Business provides additional
    security. Keys stored in the TPM may only be used on that system while keys stored using software are more susceptible
    to compromise and could be used on other systems.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000255
  - scheme: vulnerability
    value: V-253400
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components
      >> Windows Hello for Business >> "Use a hardware security device" to "Enabled".
  organizational_input_requirements: {}
