rule:
  id: SV-253376
  version: r958478
  title: Printing over HTTP must be prevented.
  severity: medium
  role: full
  weight: 10.0
  discussion: Some features may communicate with the vendor, sending system information or downloading data or components
    for the feature. Turning off this capability will prevent potentially sensitive information from being sent
    outside the enterprise and uncontrolled updates to the system. This setting prevents the client computer from
    printing over HTTP, which allows the computer to print to printers on the intranet as well as the internet.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000110
  - scheme: vulnerability
    value: V-253376
  - scheme: cci
    value: CCI-000381
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> System >> Internet
      Communication Management >> Internet Communication settings >> "Turn off printing over HTTP" to "Enabled".
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253376.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253376.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253376.manual.assessment.yaml
  default_assessment_choice: default
