rule:
  id: SV-253469
  version: r958518
  title: User Account Control must prompt administrators for consent on the secure desktop.
  severity: medium
  role: full
  weight: 10.0
  discussion: User Account Control (UAC) is a security mechanism for limiting the elevation of privileges, including
    administrative accounts, unless authorized. This setting configures the elevation requirements for logged on
    administrators to complete a task that requires raised privileges.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000250
  - scheme: vulnerability
    value: V-253469
  - scheme: cci
    value: CCI-001084
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> Security Options >> "User Account Control: Behavior of the elevation prompt for administrators
      in Admin Approval Mode" to "Prompt for consent on the secure desktop".'
  organizational_input_requirements: {}
  assessment_choices:
