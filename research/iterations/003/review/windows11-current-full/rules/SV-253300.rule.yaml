rule:
  id: SV-253300
  version: r1256653
  title: The password history must be configured to 24 passwords remembered.
  severity: medium
  role: full
  weight: 10.0
  discussion: A system is more vulnerable to unauthorized access when system users recycle the same password several
    times without being required to change a password to a unique password on a regularly scheduled basis. This
    enables users to effectively negate the purpose of mandating periodic password changes. The default value is
    24 for Windows domain systems. DoW has determined this is the appropriate value for all Windows systems.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-AC-000020
  - scheme: vulnerability
    value: V-253300
  - scheme: cci
    value: CCI-004061
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'For GPO-managed systems: Configure the policy value for Computer Configuration >> Windows Settings
      >> Security Settings >> Account Policies >> Password Policy >> "Enforce password history" to "24" passwords
      remembered. For Intune-managed systems: Revise the Intune policy to set password history policy to "24" passwords
      remembered.'
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253300.automated.assessment.yaml
    automated:
