rule:
  id: SV-253420
  version: r1051055
  title: The Windows Remote Management (WinRM) service must not store RunAs credentials.
  severity: medium
  role: full
  weight: 10.0
  discussion: Storage of administrative credentials could allow unauthorized access. Disallowing the storage of
    RunAs credentials for Windows Remote Management will prevent them from being used with plug-ins.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-CC-000355
  - scheme: vulnerability
    value: V-253420
  - scheme: cci
    value: CCI-002038
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components
      >> Windows Remote Management (WinRM) >> WinRM Service >> "Disallow WinRM from storing RunAs credentials" to
      "Enabled".
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253420.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253420.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253420.manual.assessment.yaml
  default_assessment_choice: default
