rule:
  id: SV-253262
  version: r958808
  title: The operating system must employ a deny-all, permit-by-exception policy to allow the execution of authorized
    software programs.
  severity: medium
  role: full
  weight: 10.0
  discussion: Utilizing an allowlist provides a configuration management method for allowing the execution of only
    authorized software. Using only authorized software decreases risk by limiting the number of potential vulnerabilities.
    The organization must identify authorized software programs and only permit execution of authorized software.
    The process used to identify software programs that are authorized to execute on organizational information
    systems is commonly referred to as allowlisting.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-00-000035
  - scheme: vulnerability
    value: V-253262
  - scheme: cci
    value: CCI-001774
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure an application allowlisting program to employ a deny-all, permit-by-exception policy to
      allow the execution of authorized software programs. Configuration of allowlisting applications will vary
      by the program. AppLocker is an allowlisting application built into Windows 11 Enterprise. If AppLocker is
      used, it is configured through group policy in Computer Configuration >> Windows Settings >> Security Settings
      >> Application Control Policies >> AppLocker. Implementation guidance for AppLocker is available in the NSA
      paper "Application allowlisting using Microsoft AppLocker" at the following link: https://docs.microsoft.com/en-us/windows/security/threat-protection/windows-defender-application-control/applocker/applocker-policies-deployment-guide'
  assessment_choices:
    default:
      assessment: ../assessments/manual/SV-253262.manual.assessment.yaml
    manual:
