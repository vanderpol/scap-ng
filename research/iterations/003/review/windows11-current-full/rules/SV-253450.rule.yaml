rule:
  id: SV-253450
  version: r987796
  title: Unencrypted passwords must not be sent to third-party SMB Servers.
  severity: medium
  role: full
  weight: 10.0
  discussion: Some non-Microsoft SMB servers only support unencrypted (plain text) password authentication. Sending
    plain text passwords across the network, when authenticating to an SMB server, reduces the overall security
    of the environment. Check with the vendor of the SMB server to see if there is a way to support encrypted password
    authentication.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: WN11-SO-000110
  - scheme: vulnerability
    value: V-253450
  - scheme: cci
    value: CCI-000197
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >>
      Local Policies >> Security Options >> "Microsoft network client: Send unencrypted password to third-party
      SMB servers" to "Disabled".'
  organizational_input_requirements: {}
  assessment_choices:
    default:
      assessment: ../assessments/automated/SV-253450.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-253450.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-253450.manual.assessment.yaml
  default_assessment_choice: default
