rule:
  id: SV-253270
  version: r991589
  title: Only accounts responsible for the backup operations must be members of the Backup Operators group.
  severity: medium
  role: full
  weight: 10.0
  discussion: Backup Operators are able to read and write to any file in the system, regardless of the rights assigned
    to it. Backup and restore rights permit users to circumvent the file access restrictions present on NTFS disk
    drives for backup and restore purposes. Members of the Backup Operators group must have separate logon accounts
    for performing backup duties.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
