assessment:
  id: windows11-stig-current-full.SV-253282.manual
  version: 1
  assessment_title: Inbound exceptions to the firewall on Windows 11 domain workstations must only allow authorized
    remote management hosts.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify firewall exceptions to inbound connections on domain workstations include only authorized remote
    management hosts. If allowed inbound exceptions are not limited to authorized remote management hosts, this
    is a finding. Review inbound firewall exceptions. Computer Configuration >> Windows Settings >> Security Settings
    >> Windows Defender Firewall with Advanced Security >> Windows Defender Firewall with Advanced Security >> Inbound
    Rules (this link will be in the right pane) For any inbound rules that allow connections view the Scope for
    Remote IP address. This may be defined as an IP address, subnet, or range. The rule must apply to all firewall
    profiles. If a third-party firewall is used, ensure comparable settings are in place.
  inputs: {}
  evidence: []
