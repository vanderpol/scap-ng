assessment:
  id: windows11-stig-current-full.SV-253371.manual
  version: 1
  assessment_title: Virtualization-based protection of code integrity must be enabled.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Confirm virtualization-based protection of code integrity. If there are documented operational mission
    needs to disable code integrity, this may be reduced to a CAT II finding. Run "PowerShell" with elevated privileges
    (run as administrator). Enter the following: "Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard"
    If "SecurityServicesRunning" does not include a value of "2" (e.g., "{1, 2}"), this is a finding. Alternately:
    Run "System Information". Under "System Summary", verify the following: If "Virtualization-based Security Services
    Running" does not list "Hypervisor enforced Code Integrity", this is a finding. The policy settings referenced
    in the Fix section will configure the following registry value. However, due to hardware requirements, the registry
    value alone does not ensure proper function. Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\
    Value Name: HypervisorEnforcedCodeIntegrity Value Type: REG_DWORD Value: 0x00000001 (1) (Enabled with UEFI lock),
    or 0x00000002 (2) (Enabled without lock)'
  inputs: {}
  evidence: []
