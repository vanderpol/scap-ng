assessment:
  id: SV-253362.manual
  version: 1
  assessment_title: Hardened UNC Paths must be defined to require mutual authentication and integrity for at least
    the \\*\SYSVOL and \\*\NETLOGON shares.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This requirement is applicable to domain-joined systems, for standalone systems this is NA. If the
    following registry values do not exist or are not configured as specified, this is a finding. Registry Hive:
    HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows\NetworkProvider\HardenedPaths\ Value
    Name: \\*\NETLOGON Value Type: REG_SZ Value: RequireMutualAuthentication=1, RequireIntegrity=1 Value Name: \\*\SYSVOL
    Value Type: REG_SZ Value: RequireMutualAuthentication=1, RequireIntegrity=1 Additional entries would not be
    a finding.'
  inputs: []
  evidence: []
