assessment:
  id: SV-253347.manual
  version: 1
  assessment_title: Windows 11 must be configured to audit Detailed File Share Failures.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Use the AuditPol tool to review the current Audit Policy configuration: Open a Command Prompt with
    elevated privileges ("Run as Administrator"). Enter "AuditPol /get /category:*". Compare the AuditPol settings
    with the following. If the system does not audit the following, this is a finding: Object Access >> Detailed
    File Share - Failure'
  inputs: []
  evidence: []
