assessment:
  id: SV-253286.manual
  version: 1
  assessment_title: The Server Message Block (SMB) v1 protocol must be disabled on the system.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Different methods are available to disable SMBv1 on Windows 11. This is the preferred method, however
    if WN11-00-000165 and WN11-00-000170 are configured, this is NA. Run "Windows PowerShell" with elevated privileges
    (run as administrator). Enter the following: Get-WindowsOptionalFeature -Online | Where FeatureName -eq SMB1Protocol
    If "State : Enabled" is returned, this is a finding. Alternately: Search for "Features". Select "Turn Windows
    features on or off". If "SMB 1.0/CIFS File Sharing Support" is selected, this is a finding.'
  inputs: []
  evidence: []
