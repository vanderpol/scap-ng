assessment:
  id: windows11-stig-current-full.SV-253395.manual
  version: 1
  assessment_title: The Microsoft Defender SmartScreen for Explorer must be enabled.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This is applicable to unclassified systems, for other systems this is NA. If the following registry
    values do not exist or are not configured as specified, this is a finding: Registry Hive: HKEY_LOCAL_MACHINE
    Registry Path: \SOFTWARE\Policies\Microsoft\Windows\System\ Value Name: EnableSmartScreen Value Type: REG_DWORD
    Value: 0x00000001 (1) And Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows\System\
    Value Name: ShellSmartScreenLevel Value Type: REG_SZ Value: Block'
  inputs: {}
  evidence: []
