assessment:
  id: windows11-stig-current-full.SV-253255.manual
  version: 1
  assessment_title: Windows 11 systems must have a Trusted Platform Module (TPM) enabled.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify the system has a TPM and is ready for use. Run "tpm.msc". Review the sections in the center
    pane. "Status" must indicate it has been configured with a message such as "The TPM is ready for use" or "The
    TPM is on and ownership has been taken". TPM Manufacturer Information - Specific Version = 2.0 If a TPM is not
    found or is not ready for use, this is a finding.
  inputs: {}
  evidence: []
