assessment:
  id: SV-253275.manual
  version: 1
  assessment_title: Internet Information System (IIS) or its subcomponents must not be installed on a workstation.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify it has not been installed on the system. Run "Programs and Features". Select "Turn Windows features
    on or off". If the entries for "Internet Information Services" or "Internet Information Services Hostable Web
    Core" are selected, this is a finding. If an application requires IIS or a subset to be installed to function,
    this needs be documented with the ISSO. In addition, any applicable requirements from the IIS STIG must be addressed.
  inputs: {}
  evidence: []
