assessment:
  id: SV-253409.manual
  version: 1
  assessment_title: Indexing of encrypted files must be turned off.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding:
    Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows\Windows Search\ (For GPO-managed
    systems) Or Registry Path: \Software\Microsoft\Policymanager\current\device\search (For Intune-managed systems)
    Value Name: AllowIndexingEncryptedStoresOrItems Value Type: REG_DWORD Value: 0'
  inputs: {}
  evidence: []
