assessment:
  id: windows11-stig-current-full.SV-288475.manual
  version: 1
  assessment_title: All Wi-Fi Direct adapters must be disabled on the system.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Determine whether any Wi-Fi Direct adapters exist on the system. Open PowerShell with elevated privileges
    (run as administrator). Enter the following command: Get-NetAdapter -InterfaceDescription "Microsoft Wi-Fi Direct*"
    -IncludeHidden If there are no Wi-Fi Direct adapters configured on the system, no adapter information will display.
    If any Wi-Fi Direct adapters are listed, this is a finding.'
  inputs: {}
  evidence: []
