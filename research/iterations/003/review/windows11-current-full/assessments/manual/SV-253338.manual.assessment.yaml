assessment:
  id: SV-253338.manual
  version: 1
  assessment_title: The security event log size must be configured to a value that holds at least one week's worth
    of audit records.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the system is configured to send audit records directly to an audit server, this requirement is
    not applicable. This must be documented with the information system security officer (ISSO). The registry configuration
    setting below must be set (at least) to a value equal to the size needed to contain one week''s worth of audit
    records in the security event log. The value used below is an example that assumes a typical week’s log size
    of 5GB. If the following registry value does not exist or is not configured as specified, this is a finding:
    NOTE: The following registry entry is an example; the value must equal at least one week''s worth of records.
    Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows\EventLog\Security\ Value
    Name: MaxSize Value Type: REG_DWORD Value:0x49960800 (5120000) (or greater)'
  inputs: {}
  evidence: []
