assessment:
  id: windows11-stig-current-full.SV-253477.manual
  version: 1
  assessment_title: Toast notifications to the lock screen must be turned off.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding:
    Registry Hive: HKEY_CURRENT_USER Registry Path: \SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\PushNotifications\
    Value Name: NoToastApplicationNotificationOnLockScreen Value Type: REG_DWORD Value: 1'
  inputs: {}
  evidence: []
