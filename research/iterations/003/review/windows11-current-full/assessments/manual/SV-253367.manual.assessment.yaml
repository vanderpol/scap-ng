assessment:
  id: SV-253367.manual
  version: 1
  assessment_title: Command line data must be included in process creation events.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding:
    Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit\
    Value Name: ProcessCreationIncludeCmdLine_Enabled Value Type: REG_DWORD Value: 1'
  inputs: {}
  evidence: []
