assessment:
  id: SV-253452.manual
  version: 1
  assessment_title: Anonymous SID/Name translation must not be allowed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer
    Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> Security Options.
    If the value for "Network access: Allow anonymous SID/Name translation" is not set to "Disabled", this is a
    finding.'
  inputs: []
  evidence: []
