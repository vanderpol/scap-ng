assessment:
  id: windows11-stig-current-full.SV-253484.manual
  version: 1
  assessment_title: The "Change the system time" user right must only be assigned to Administrators and Local Service.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer
    Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment.
    If any groups or accounts other than the following are granted the "Change the system time" user right, this
    is a finding: Administrators LOCAL SERVICE'
  inputs: {}
  evidence: []
