assessment:
  id: windows11-stig-current-full.SV-253285.manual
  version: 1
  assessment_title: The Windows PowerShell 2.0 feature must be disabled on the system.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'For Windows 11 version 24H2 and newer, this requirement is Not Applicable. Run "Windows PowerShell"
    with elevated privileges (run as administrator). Enter the following: Get-WindowsOptionalFeature -Online | Where
    FeatureName -like *PowerShellv2* If either of the following have a "State" of "Enabled", this is a finding.
    FeatureName : MicrosoftWindowsPowerShellV2 State : Enabled FeatureName : MicrosoftWindowsPowerShellV2Root State
    : Enabled Alternately: Search for "Features". Select "Turn Windows features on or off". If "Windows PowerShell
    2.0" (whether the subcategory of "Windows PowerShell 2.0 Engine" is selected or not) is selected, this is a
    finding.'
  inputs: {}
  evidence: []
