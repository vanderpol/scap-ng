  assessment_title: PowerShell Transcription must be enabled on Windows 11.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding:
    Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows\PowerShell\Transcription\
    Value Name: EnableTranscripting Value Type: REG_DWORD Value: 1'
