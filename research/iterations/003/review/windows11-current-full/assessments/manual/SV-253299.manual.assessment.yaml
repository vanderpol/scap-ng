assessment:
  id: SV-253299.manual
  version: 1
  assessment_title: The period of time before the bad logon counter is reset must be configured to 15 minutes.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer
    Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Account Policies >> Account Lockout
    Policy. If the "Reset account lockout counter after" value is less than "15" minutes, this is a finding.
  inputs: []
  evidence: []
