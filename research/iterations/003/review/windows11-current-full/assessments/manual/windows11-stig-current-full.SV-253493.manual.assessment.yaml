assessment:
  id: windows11-stig-current-full.SV-253493.manual
  version: 1
  assessment_title: The "Deny log on as a service" user right on Windows 11 domain-joined workstations must be configured
    to prevent access from highly privileged domain accounts.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This requirement is applicable to domain-joined systems, for standalone systems this is NA. Verify
    the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy >> Computer
    Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment. If the following
    groups or accounts are not defined for the "Deny log on as a service" right , this is a finding: Domain Systems
    Only: Enterprise Admins Group Domain Admins Group'
  inputs: {}
  evidence: []
