assessment:
  id: SV-279688.manual
  version: 1
  assessment_title: Windows 11 systems must block consumer account user authentication.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the "block all consumer Microsoft account user authentication" is enabled. Registry Hive: HKEY_LOCAL_MACHINE
    Registry Path: \SOFTWARE\Policies\Microsoft\MicrosoftAccount Value Name: DisableUserAuth Value Type: REG_DWORD
    Value: 0x00000001 (1) If the registry value is not "1", this is a finding.'
  inputs: []
  evidence: []
