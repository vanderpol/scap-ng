assessment:
  id: SV-253496.manual
  version: 1
  assessment_title: The "Enable computer and user accounts to be trusted for delegation" user right must not be
    assigned to any groups or accounts.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer
    Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment.
    If any groups or accounts are granted the "Enable computer and user accounts to be trusted for delegation" user
    right, this is a finding.
  inputs: []
  evidence: []
