assessment:
  id: windows11-stig-current-full.SV-253443.manual
  version: 1
  assessment_title: The system must be configured to require a strong session key.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding:
    Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\ Value
    Name: RequireStrongKey Value Type: REG_DWORD Value: 1 Warning: This setting may prevent a system from being
    joined to a domain if not configured consistently between systems.'
  inputs: {}
  evidence: []
