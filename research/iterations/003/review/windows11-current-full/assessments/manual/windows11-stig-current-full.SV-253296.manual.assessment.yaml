assessment:
  id: windows11-stig-current-full.SV-253296.manual
  version: 1
  assessment_title: The Windows 11 time service must synchronize with an appropriate DoW time source.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Review the Windows time service configuration. Open an elevated "Command Prompt" (run as administrator).
    Enter "W32tm /query /configuration". Domain-joined systems (excluding the domain controller with the PDC emulator
    role): If the value for "Type" under "NTP Client" is not "NT5DS", this is a finding.'
  inputs: {}
  evidence: []
