assessment:
  id: SV-253401.manual
  version: 1
  assessment_title: Windows 11 must be configured to require a minimum PIN length of six characters or greater.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding:
    Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\PassportForWork\PINComplexity\
    (For GPO-managed systems) Or Registry Path: \SOFTWARE\Microsoft\Policies\PassportForWork\[guid]\device\policies\PINComplexity
    (For Intune-managed systems) Value Name: MinimumPINLength Type: REG_DWORD Value: 6 (or greater)'
  inputs: {}
  evidence: []
