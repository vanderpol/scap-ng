assessment:
  id: SV-253476.manual
  version: 1
  assessment_title: Passwords for enabled local Administrator accounts must be changed at least every 60 days.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If there are no enabled local Administrator accounts, this is Not Applicable. Use of an enabled built-in
    account without management by LAPS must be documented and supplied to the information system security manager
    (ISSM)/information system security officer (ISSO) for their risk acceptance. An alternative process to LAPS
    is acceptable if it is documented and produces evidence that passwords for Administrator accounts are changed
    at least every 60 days. Review the password last set date for the enabled local Administrator account. On the
    standalone or domain-joined workstation: Open "PowerShell". Enter "Get-LocalUser -Name * | Select-Object *".
    If the "PasswordLastSet" date is greater than "60" days old for the local Administrator account for administering
    the computer/domain, this is a finding. Verify LAPS is configured and operational. Navigate to Local Computer
    Policy >> Computer Configuration >> Administrative Templates >> System >> LAPS >> Password Settings >> Set to
    enabled. Password Complexity, large letters + small letters + numbers + special, Password Length 14, Password
    Age 60. If not configured as shown, this is a finding. Verify LAPS Operational logs >> Event Viewer >> Applications
    and Services Logs >> Microsoft >> Windows >> LAPS >> Operational. Verify LAPS policy process is completing.
    If it is not, this is a finding.'
  inputs: []
  evidence: []
