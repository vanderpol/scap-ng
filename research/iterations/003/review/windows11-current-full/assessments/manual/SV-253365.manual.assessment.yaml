assessment:
  id: SV-253365.manual
  version: 1
  assessment_title: Connections to non-domain networks when connected to a domain authenticated network must be
    blocked.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding:
    Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows\WcmSvc\GroupPolicy\ Value
    Name: fBlockNonDomain Value Type: REG_DWORD Value: 1'
  inputs: {}
