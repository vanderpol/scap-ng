assessment:
  id: SV-253287.manual
  version: 1
  assessment_title: The Server Message Block (SMB) v1 protocol must be disabled on the SMB server.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Different methods are available to disable SMBv1 on Windows 11, if WN11-00-000160 is configured, this
    is NA. If the following registry value does not exist or is not configured as specified, this is a finding:
    Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters\
    Value Name: SMB1 Type: REG_DWORD Value: 0x00000000 (0)'
  inputs: {}
  evidence: []
