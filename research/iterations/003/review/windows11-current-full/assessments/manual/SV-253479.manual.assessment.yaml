assessment:
  id: SV-253479.manual
  version: 1
  assessment_title: The "Access Credential Manager as a trusted caller" user right must not be assigned to any groups
    or accounts.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer
    Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment.
    If any groups or accounts are granted the "Access Credential Manager as a trusted caller" user right, this is
    a finding.
  inputs: []
  evidence: []
