assessment:
  id: SV-253393.manual
  version: 1
  assessment_title: Windows Telemetry must not be configured to Full.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding:
    Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows\DataCollection\ Value
    Name: AllowTelemetry Type: REG_DWORD Value: 0x00000000 (0) (Security) 0x00000001 (1) (Basic)'
  inputs: []
  evidence: []
