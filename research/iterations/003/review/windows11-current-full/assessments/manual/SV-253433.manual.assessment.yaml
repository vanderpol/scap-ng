assessment:
  id: SV-253433.manual
  version: 1
  assessment_title: The built-in guest account must be disabled.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer
    Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> Security Options.
    If the value for "Accounts: Guest account status" is not set to "Disabled", this is a finding.'
  inputs: []
  evidence: []
