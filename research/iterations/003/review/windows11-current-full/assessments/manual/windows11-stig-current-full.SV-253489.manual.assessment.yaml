assessment:
  id: windows11-stig-current-full.SV-253489.manual
  version: 1
  assessment_title: The "Create symbolic links" user right must only be assigned to the Administrators group.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer
    Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment.
    If any groups or accounts other than the following are granted the "Create symbolic links" user right, this
    is a finding: Administrators If the workstation has an approved use of Hyper-V, such as being used as a dedicated
    admin workstation using Hyper-V to separate administration and standard user functions, "NT VIRTUAL MACHINES\VIRTUAL
    MACHINE" may be assigned this user right and is not a finding.'
  inputs: {}
  evidence: []
