assessment:
  id: SV-253502.manual
  version: 1
  assessment_title: The "Modify firmware environment values" user right must only be assigned to the Administrators
    group.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer
    Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment.
    If any groups or accounts other than the following are granted the "Modify firmware environment values" user
    right, this is a finding: Administrators'
  inputs: []
  evidence: []
