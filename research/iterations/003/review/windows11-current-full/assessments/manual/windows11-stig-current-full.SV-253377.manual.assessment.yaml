assessment:
  id: windows11-stig-current-full.SV-253377.manual
  version: 1
  assessment_title: Systems must at least attempt device authentication using certificates.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This requirement is applicable to domain-joined systems, for standalone systems this is NA. The default
    behavior for "Support device authentication using certificate" is "Automatic". If it exists and is configured
    with a value of "0", this is a finding. Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Kerberos\Parameters\
    Value Name: DevicePKInitEnabled Value Type: REG_DWORD Value: 1 (or if the Value Name does not exist)'
  inputs: {}
  evidence: []
