assessment:
  id: SV-253478.manual
  version: 1
  assessment_title: Zone information must be preserved when saving attachments.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The default behavior is for Windows to mark file attachments with their zone information. If it exists
    and is configured with a value of "1", this is a finding. Registry Hive: HKEY_CURRENT_USER Registry Path: \SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Attachments\
    Value Name: SaveZoneInformation Value Type: REG_DWORD Value: 0x00000002 (2) (or if the Value Name does not exist)'
  inputs: {}
  evidence: []
