assessment:
  id: SV-253481.manual
  version: 1
  assessment_title: The "Act as part of the operating system" user right must not be assigned to any groups or accounts.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer
    Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment.
    If any groups or accounts (to include administrators), are granted the "Act as part of the operating system"
    user right, this is a finding.
  inputs: {}
  evidence: []
