assessment:
  id: SV-257592.manual
  version: 1
  assessment_title: Windows 11 must not have portproxy enabled or in use.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Check the registry key for existence of proxied ports: HKLM\SYSTEM\CurrentControlSet\Services\PortProxy\.
    If the key contains v4tov4\tcp\ or is populated v4tov4\tcp\, this is a finding. Run "netsh interface portproxy
    show all". If the command displays any results, this is a finding.'
  inputs: {}
  evidence: []
