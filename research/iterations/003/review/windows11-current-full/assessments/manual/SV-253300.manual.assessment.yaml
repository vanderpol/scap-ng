assessment:
  id: SV-253300.manual
  version: 1
  assessment_title: The password history must be configured to 24 passwords remembered.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". For GPO-managed systems,
    navigate to: Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Account
    Policies >> Password Policy. Or For Intune-managed systems, navigate to: HKLM:\SOFTWARE\Microsoft\PolicyManager\current\device\DeviceLock!DevicePasswordHistory
    If the value for "Enforce password history" is less than "24" passwords remembered, this is a finding.'
  inputs: {}
  evidence: []
