assessment:
  id: SV-253457.manual
  version: 1
  assessment_title: Remote calls to the Security Account Manager (SAM) must be restricted to Administrators.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding:
    Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SYSTEM\CurrentControlSet\Control\Lsa\ Value Name: RestrictRemoteSAM
    Value Type: REG_SZ Value: O:BAG:BAD:(A;;RC;;;BA) If a domain application account such as for a management tool
    requires this user right, this would not be a finding. Vendor documentation must support the requirement for
    having the user right. The requirement must be documented with the ISSO.'
  inputs: []
  evidence: []
