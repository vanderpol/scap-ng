assessment:
  id: SV-253379.manual
  version: 1
  assessment_title: Local users on domain-joined computers must not be enumerated.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'This requirement is applicable to domain-joined systems, for standalone systems this is NA. If the
    following registry value does not exist or is not configured as specified, this is a finding: Registry Hive:
    HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows\System\ Value Name: EnumerateLocalUsers
    Value Type: REG_DWORD Value: 0'
  inputs: []
  evidence: []
