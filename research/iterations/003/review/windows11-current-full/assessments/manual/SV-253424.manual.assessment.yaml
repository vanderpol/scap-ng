assessment:
  id: SV-253424.manual
  version: 1
  assessment_title: Windows Ink Workspace must be configured to disallow access above the lock.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding:
    Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\WindowsInkWorkspace (For GPO-managed
    systems) Or Registry Path: \SOFTWARE\Microsoft\PolicyManager\current\device\WindowsInkWorkspace (For Intune-managed
    systems) Value Name: AllowWindowsInkWorkspace Value Type: REG_DWORD Value data: 1'
  inputs: []
  evidence: []
