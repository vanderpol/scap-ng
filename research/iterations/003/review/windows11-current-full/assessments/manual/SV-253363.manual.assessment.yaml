assessment:
  id: SV-253363.manual
  version: 1
  assessment_title: Windows 11 must be configured to prioritize ECC Curves with longer key lengths first.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding:
    Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Cryptography\Configuration\SSL\00010002\
    Value Name: EccCurves Value Type: REG_MULTI_SZ Value: NistP384 NistP256'
  inputs: {}
  evidence: []
