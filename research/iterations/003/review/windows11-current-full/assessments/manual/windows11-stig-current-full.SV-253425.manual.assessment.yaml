assessment:
  id: windows11-stig-current-full.SV-253425.manual
  version: 1
  assessment_title: Windows 11 must be configured to prevent users from receiving suggestions for third-party or
    additional applications.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding:
    Registry Hive: HKEY_CURRENT_USER Registry Path: \SOFTWARE\Policies\Microsoft\Windows\CloudContent\ Value Name:
    DisableThirdPartySuggestions Type: REG_DWORD Value: 0x00000001 (1)'
  inputs: {}
  evidence: []
