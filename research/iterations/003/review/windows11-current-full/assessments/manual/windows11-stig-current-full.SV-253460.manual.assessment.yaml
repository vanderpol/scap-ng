  version: 1
  assessment_title: Kerberos encryption types must be configured to prevent the use of DES and RC4 encryption suites.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding:
    Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Kerberos\Parameters\
    Value Name: SupportedEncryptionTypes Value Type: REG_DWORD Value: 0x7ffffff8 (2147483640)'
