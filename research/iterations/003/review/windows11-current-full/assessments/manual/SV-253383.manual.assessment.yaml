assessment:
  id: SV-253383.manual
  version: 1
  assessment_title: Unauthenticated RPC clients must be restricted from connecting to the RPC server.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding:
    Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows NT\Rpc\ Value Name: RestrictRemoteClients
    Value Type: REG_DWORD Value: 1'
  inputs: {}
  evidence: []
