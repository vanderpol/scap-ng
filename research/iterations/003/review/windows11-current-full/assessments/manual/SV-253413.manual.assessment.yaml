assessment:
  id: SV-253413.manual
  version: 1
  assessment_title: Automatically signing in the last interactive user after a system-initiated restart must be
    disabled.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding:
    Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\
    Value Name: DisableAutomaticRestartSignOn Value Type: REG_DWORD Value: 1'
  inputs: []
  evidence: []
