assessment:
  id: SV-253408.manual
  version: 1
  assessment_title: Basic authentication for RSS feeds over HTTP must not be used.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The default behavior is for the Windows RSS platform to not use Basic authentication over HTTP connections.
    If it exists and is configured with a value of "1", this is a finding. Registry Hive: HKEY_LOCAL_MACHINE Registry
    Path: \SOFTWARE\Policies\Microsoft\Internet Explorer\Feeds\ Value Name: AllowBasicAuthInClear Value Type: REG_DWORD
    Value: 0 (or if the Value Name does not exist)'
  inputs: []
  evidence: []
