assessment:
  id: SV-253446.manual
  version: 1
  assessment_title: The Windows message title for the legal notice must be configured.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding:
    Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\
    Value Name: LegalNoticeCaption Value Type: REG_SZ Value: See message title above "DoD Notice and Consent Banner",
    "US Department of Defense Warning Statement" or a site-defined equivalent, this is a finding. If a site-defined
    title is used, it can in no case contravene or modify the language of the banner text required in WN11-SO-000075.'
  inputs: []
  evidence: []
