assessment:
  id: SV-253385.manual
  version: 1
  assessment_title: The Application Compatibility Program Inventory must be prevented from collecting data and sending
    the information to Microsoft.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding:
    Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows\AppCompat\ Value Name:
    DisableInventory Value Type: REG_DWORD Value: 1'
  inputs: {}
  evidence: []
