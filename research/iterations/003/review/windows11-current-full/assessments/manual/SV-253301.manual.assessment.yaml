assessment:
  id: SV-253301.manual
  version: 1
  assessment_title: The maximum password age must be configured to 60 days or less.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer
    Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Account Policies >> Password Policy.
    If the value for the "Maximum password age" is greater than "60" days, this is a finding. If the value is set
    to "0" (never expires), this is a finding.
  inputs: {}
  evidence: []
