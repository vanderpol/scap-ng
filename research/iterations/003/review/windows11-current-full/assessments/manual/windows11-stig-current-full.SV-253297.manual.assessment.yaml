assessment:
  id: windows11-stig-current-full.SV-253297.manual
  version: 1
  assessment_title: Windows 11 account lockout duration must be configured to 15 minutes or greater.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer
    Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Account Policies >> Account Lockout
    Policy. If the "Account lockout duration" is less than "15" minutes (excluding "0"), this is a finding. Configuring
    this to "0", requiring an administrator to unlock the account, is more restrictive and is not a finding.
  inputs: {}
  evidence: []
