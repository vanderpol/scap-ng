assessment:
  id: SV-253384.manual
  version: 1
  assessment_title: The setting to allow Microsoft accounts to be optional for modern style apps must be enabled.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding:
    Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\
    Value Name: MSAOptional Value Type: REG_DWORD Value: 0x00000001 (1)'
  inputs: []
  evidence: []
