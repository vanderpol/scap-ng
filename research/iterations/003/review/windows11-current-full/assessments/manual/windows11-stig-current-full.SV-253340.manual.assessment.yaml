assessment:
  id: windows11-stig-current-full.SV-253340.manual
  version: 1
  assessment_title: Windows 11 permissions for the Application event log must prevent access by non-privileged accounts.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the permissions on the Application event log (Application.evtx). Standard user accounts or
    groups must not have access. The default permissions listed below satisfy this requirement. Eventlog - Full
    Control SYSTEM - Full Control Administrators - Full Control The default location is the "%SystemRoot%\SYSTEM32\WINEVT\LOGS"
    directory. They may have been moved to another folder. If the permissions for these files are not as restrictive
    as the ACLs listed, this is a finding. Note: If "APPLICATION PACKAGE AUTHORITY\ALL APPLICATION PACKAGES" has
    Special Permissions, this would not be a finding.'
  inputs: {}
  evidence: []
