assessment:
  id: SV-253350.manual
  version: 1
  assessment_title: Camera access from the lock screen must be disabled.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the device does not have a camera, this is NA. If the following registry value does not exist or
    is not configured as specified, this is a finding: Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows\Personalization\
    Value Name: NoLockScreenCamera Value Type: REG_DWORD Value: 1'
  inputs: []
  evidence: []
