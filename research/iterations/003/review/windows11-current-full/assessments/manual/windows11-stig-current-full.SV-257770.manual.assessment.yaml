assessment:
  id: windows11-stig-current-full.SV-257770.manual
  version: 1
  assessment_title: Windows 11 must have command line process auditing events enabled for failures.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Ensure Audit Process Creation auditing has been enabled: Computer Configuration >> Windows Settings
    >> Security Settings >> Advanced Audit Policy Configuration >> System Audit Policy >> Detailed Tracking >> Audit
    Process Creation. If "Audit Process Creation" is not set to "Failure", this is a finding.'
  inputs: {}
  evidence: []
