assessment:
  id: windows11-stig-current-full.SV-253302.manual
  version: 1
  assessment_title: The minimum password age must be configured to at least 1 day.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer
    Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Account Policies >> Password Policy.
    If the value for the "Minimum password age" is less than "1" day, this is a finding.
  inputs: {}
  evidence: []
