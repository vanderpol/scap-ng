assessment:
  id: windows11-stig-current-full.SV-253320.manual
  version: 1
  assessment_title: Windows 11 must be configured to audit Object Access - File Share successes.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Security Option "Audit: Force audit policy subcategory settings (Windows Vista or later) to override
    audit policy category settings" must be set to "Enabled" (WN11-SO-000030) for the detailed auditing subcategories
    to be effective. Use the AuditPol tool to review the current Audit Policy configuration: Open PowerShell or
    a Command Prompt with elevated privileges ("Run as Administrator"). Enter "AuditPol /get /category:*" Compare
    the AuditPol settings with the following: Object Access >> File Share - Success If the system does not audit
    the above, this is a finding.'
  inputs: {}
  evidence: []
