assessment:
  id: SV-253364.manual
  version: 1
  assessment_title: Simultaneous connections to the internet or a Windows domain must be limited.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The default behavior for "Minimize the number of simultaneous connections to the Internet or a Windows
    Domain" is "Enabled". If it exists and is configured with a value of "0", this is a finding. Registry Hive:
    HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows\WcmSvc\GroupPolicy\ Value Name: fMinimizeConnections
    Value Type: REG_DWORD Value: 3 (or if the Value Name does not exist)'
  inputs: []
  evidence: []
