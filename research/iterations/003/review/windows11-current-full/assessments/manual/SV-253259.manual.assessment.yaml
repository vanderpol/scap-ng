assessment:
  id: SV-253259.manual
  version: 1
  assessment_title: Windows 11 information systems must use BitLocker to encrypt all disks to protect the confidentiality
    and integrity of all information at rest.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'For AVD implementations with no data at rest, this is NA. Verify all Windows 11 information systems
    (including SIPRNet) employ BitLocker for full disk encryption. If full disk encryption using BitLocker is not
    implemented, this is a finding. Verify BitLocker is turned on for the operating system drive and any fixed data
    drives. Open "BitLocker Drive Encryption" from the Control Panel. If the operating system drive or any fixed
    data drives have "Turn on BitLocker", this is a finding. Note: An alternate encryption application may be used
    in lieu of BitLocker providing it is configured for full disk encryption and satisfies the pre-boot authentication
    requirements (WN11-00-000031 and WN11-00-000032).'
  inputs: []
  evidence: []
