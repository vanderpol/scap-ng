assessment:
  id: SV-278930.manual
  version: 1
  assessment_title: Windows 11 must be configured to audit registry failures.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that Audit Registry auditing has been enabled: Computer Configuration >> Windows Settings >>
    Security Settings >> Advanced Audit Policy Configuration >> System Audit Policies >> Object Access >> Audit
    Registry. If "Audit Registry" is not set to "Failure", this is a finding.'
  inputs: []
  evidence: []
