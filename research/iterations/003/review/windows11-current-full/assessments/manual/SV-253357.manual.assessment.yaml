assessment:
  id: SV-253357.manual
  version: 1
  assessment_title: Local administrator accounts must have their privileged token filtered to prevent elevated privileges
    from being used over the network on domain systems.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the system is not a member of a domain, this is NA. If the following registry value does not exist
    or is not configured as specified, this is a finding: Registry Hive: HKEY_LOCAL_MACHINE Registry Path: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\
    Value Name: LocalAccountTokenFilterPolicy Value Type: REG_DWORD Value: 0x00000000 (0)'
  inputs: {}
  evidence: []
