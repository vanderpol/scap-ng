assessment:
  id: windows11-stig-current-full.SV-253256.manual
  version: 1
  assessment_title: Windows 11 systems must have Unified Extensible Firmware Interface (UEFI) firmware and be configured
    to run in UEFI mode, not Legacy BIOS.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify the system firmware is configured to run in UEFI mode, not Legacy BIOS. Run "System Information".
    Under "System Summary", if "BIOS Mode" does not display "UEFI", this is a finding.
  inputs: {}
  evidence: []
