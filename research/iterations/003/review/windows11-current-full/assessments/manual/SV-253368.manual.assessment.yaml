assessment:
  id: SV-253368.manual
  version: 1
  assessment_title: Windows 11 must be configured to enable Remote host allows delegation of non-exportable credentials.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding:
    Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows\CredentialsDelegation\
    Value Name: AllowProtectedCreds Type: REG_DWORD Value: 0x00000001 (1)'
  inputs: {}
  evidence: []
