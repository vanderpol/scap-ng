assessment:
  id: SV-253392.manual
  version: 1
  assessment_title: Enhanced diagnostic data must be limited to the minimum required to support Windows Analytics.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If "Enhanced" level is enabled for telemetry, this must be configured. If "Security" or "Basic" are
    configured, this is NA. (See WN11-CC-000205). If the following registry value does not exist or is not configured
    as specified, this is a finding: Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows\DataCollection\
    Value Name: LimitEnhancedDiagnosticDataWindowsAnalytics Type: REG_DWORD Value: 0x00000001 (1)'
  inputs: {}
  evidence: []
