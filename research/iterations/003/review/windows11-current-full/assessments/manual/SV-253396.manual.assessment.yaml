assessment:
  id: SV-253396.manual
  version: 1
  assessment_title: Explorer Data Execution Prevention must be enabled.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'The default behavior is for data execution prevention to be turned on for file explorer. If it exists
    and is configured with a value of "1", this is a finding. Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows\Explorer\
    Value Name: NoDataExecutionPrevention Value Type: REG_DWORD Value: 0 (or if the Value Name does not exist)'
  inputs: {}
  evidence: []
