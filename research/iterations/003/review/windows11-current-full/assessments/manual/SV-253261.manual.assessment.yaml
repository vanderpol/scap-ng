assessment:
  id: SV-253261.manual
  version: 1
  assessment_title: Windows 11 systems must use a BitLocker PIN with a minimum length of six digits for pre-boot
    authentication.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'For AVD implementations with no data at rest, this is NA. If the following registry value does not
    exist or is not configured as specified, this is a finding: Registry Hive: HKEY_LOCAL_MACHINE Registry Path:
    \SOFTWARE\Policies\Microsoft\FVE\ Value Name: MinimumPIN Type: REG_DWORD Value: 0x00000006 (6) or greater'
  inputs: []
  evidence: []
