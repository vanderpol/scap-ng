assessment:
  id: SV-253269.manual
  version: 1
  assessment_title: Only accounts responsible for the administration of a system must have Administrator rights
    on the system.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Run "Computer Management". Navigate to System Tools >> Local Users and Groups >> Groups. Review the
    members of the Administrators group. Only the appropriate administrator groups or accounts responsible for administration
    of the system may be members of the group. For domain-joined workstations, the Domain Admins group must be replaced
    by a domain workstation administrator group. Standard user accounts must not be members of the local administrator
    group. If prohibited accounts are members of the local administrators group, this is a finding. The built-in
    Administrator account or other required administrative accounts would not be a finding.
  inputs: []
  evidence: []
