assessment:
  id: SV-253504.manual
  version: 1
  assessment_title: The "Profile single process" user right must only be assigned to the Administrators group.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer
    Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment.
    If any groups or accounts other than the following are granted the "Profile single process" user right, this
    is a finding: Administrators'
  inputs: {}
  evidence: []
