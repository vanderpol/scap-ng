assessment:
  id: SV-253370.manual
  version: 1
  assessment_title: Credential Guard must be running on Windows 11 systems.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Confirm Credential Guard is running. Run "PowerShell" with elevated privileges (run as administrator).
    Enter the following: "Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard"
    If "SecurityServicesRunning" does not include a value of "1" (e.g., "{1, 2}"), this is a finding. Alternately:
    Run "System Information". Under "System Summary", verify the following: If "virtualization-based Services Running"
    does not list "Credential Guard", this is a finding. The policy settings referenced in the Fix section will
    configure the following registry value. However, due to hardware requirements, the registry value alone does
    not ensure proper function. Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\
    Value Name: LsaCfgFlags Value Type: REG_DWORD Value: 0x00000001 (1) (Enabled with UEFI lock)'
  inputs: {}
  evidence: []
