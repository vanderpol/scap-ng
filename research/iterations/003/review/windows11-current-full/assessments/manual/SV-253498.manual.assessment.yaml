assessment:
  id: SV-253498.manual
  version: 1
  assessment_title: The "Impersonate a client after authentication" user right must only be assigned to Administrators,
    Service, Local Service, and Network Service.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer
    Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment.
    If any groups or accounts other than the following are granted the "Impersonate a client after authentication"
    user right, this is a finding: Administrators LOCAL SERVICE NETWORK SERVICE RESTRICTED SERVICES\PrintSpoolerService
    SERVICE'
  inputs: {}
  evidence: []
