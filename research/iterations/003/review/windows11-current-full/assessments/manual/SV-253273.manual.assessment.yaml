assessment:
  id: SV-253273.manual
  version: 1
  assessment_title: Accounts must be configured to require password expiration.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Run "Computer Management". Navigate to System Tools >> Local Users and Groups >> Users. Double-click
    each active account. If "Password never expires" is selected for any account, this is a finding.
  inputs: []
  evidence: []
