assessment:
  id: windows11-stig-current-full.SV-253436.manual
  version: 1
  assessment_title: The built-in guest account must be renamed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer
    Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> Security Options.
    If the value for "Accounts: Rename guest account" is set to "Guest", this is a finding.'
  inputs: {}
  evidence: []
