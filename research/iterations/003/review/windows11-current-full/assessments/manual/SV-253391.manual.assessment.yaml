assessment:
  id: SV-253391.manual
  version: 1
  assessment_title: Administrator accounts must not be enumerated during elevation.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding:
    Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\CredUI\
    Value Name: EnumerateAdministrators Value Type: REG_DWORD Value: 0'
  inputs: []
  evidence: []
