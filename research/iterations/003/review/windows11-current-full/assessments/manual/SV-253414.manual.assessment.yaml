assessment:
  id: SV-253414.manual
  version: 1
  assessment_title: PowerShell script block logging must be enabled on Windows 11.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding:
    Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging\
    Value Name: EnableScriptBlockLogging Value Type: REG_DWORD Value: 1'
  inputs: {}
  evidence: []
