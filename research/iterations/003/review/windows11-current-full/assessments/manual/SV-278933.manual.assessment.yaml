assessment:
  id: SV-278933.manual
  version: 1
  assessment_title: Windows 11 must be configured to audit sensitive privilege use failures.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that Audit Sensitive Privilege Use auditing has been enabled: Computer Configuration >> Windows
    Settings >> Security Settings >> Advanced Audit Policy Configuration >> System Audit Policies >> Privilege Use
    >> Audit Sensitive Privilege Use. If "Audit Sensitive Privilege Use" is not set to "Failure", this is a finding.'
  inputs: {}
  evidence: []
