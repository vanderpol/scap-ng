assessment:
  id: SV-253455.automated
  version: 2
  assessment_title: WN11-SO-000160 - The system must be configured to prevent anonymous users from having the same
    rights as the Everyone group.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Control\Lsa
        name:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: EveryoneIncludesAnonymous
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-network-access-let-everyone-permissions-apply-anonymous-users-set-disabled:
      test_title: '''Network access: Let Everyone permissions apply to anonymous users'' is set to ''Disabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-network-access-let-everyone-permissions-apply-anonymous-users-set-disabled
