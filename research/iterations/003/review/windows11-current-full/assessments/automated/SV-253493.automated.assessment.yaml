assessment:
  id: SV-253493.automated
  version: 2
  assessment_title: WN11-UR-000080 - The "Deny log on as a service" user right on Windows 11 domain-joined workstations
    must be configured to prevent access from highly privileged domain accounts.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-userright-object:
      capability: windows.userright
      select:
        userright:
          operation: equals
          datatype: string
          value: SE_DENY_SERVICE_LOGON_NAME
      object_title: null
  states:
    state-windows-userright:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: ^(?i)(.+\\)?Domain Admins$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-userright-2:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: ^(?i)(.+\\)?Enterprise Admins$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-deny-log-on-as-service-domain-admins:
      test_title: Deny log on as a service - Domain Admins
      capability: windows.userright
      object: windows-userright-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-windows-userright
    test-deny-log-on-as-service-enterprise-admins:
      test_title: Deny log on as a service - Enterprise Admins
      capability: windows.userright
      object: windows-userright-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-windows-userright-2
  evaluate:
    all:
    - test: test-deny-log-on-as-service-domain-admins
    - test: test-deny-log-on-as-service-enterprise-admins
