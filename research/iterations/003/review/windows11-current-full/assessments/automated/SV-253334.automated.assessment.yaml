assessment:
  id: SV-253334.automated
  version: 2
  assessment_title: WN11-AU-000150 - The system must be configured to audit System - Security System Extension successes.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-auditeventpolicysubcategories-collection:
      collection_title: null
      capability: windows.auditeventpolicysubcategories
  tests:
    test-audit-security-system-extension-set-success:
      test_title: '''Audit Security System Extension'' is set to ''Success'''
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: '''Security System Extension'' is set to ''Success'''
        state_capability: windows.auditeventpolicysubcategories
        state:
          field: security_system_extension
          value: AUDIT_SUCCESS
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-audit-security-system-extension-set-success-failure:
      test_title: '''Audit Security System Extension'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: '''Security System Extension'' is set to ''Success'' and ''Failure'''
        state_capability: windows.auditeventpolicysubcategories
        state:
          field: security_system_extension
          value: AUDIT_SUCCESS_FAILURE
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    any:
    - test: test-audit-security-system-extension-set-success
    - test: test-audit-security-system-extension-set-success-failure
