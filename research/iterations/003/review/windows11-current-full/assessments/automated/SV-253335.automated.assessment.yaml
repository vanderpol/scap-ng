assessment:
  id: SV-253335.automated
  version: 2
  assessment_title: WN11-AU-000155 - The system must be configured to audit System - System Integrity failures.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-audit-system-integrity-failure-only:
      state_title: Audit - System Integrity - Failure only
      capability: windows.auditeventpolicysubcategories
      state:
        field: system_integrity
        value: AUDIT_FAILURE
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-audit-system-integrity-success-and-failure:
      state_title: Audit - System Integrity - Success and Failure
      capability: windows.auditeventpolicysubcategories
      state:
        field: system_integrity
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-system-integrity-failure-only:
      test_title: Audit - System Integrity - Failure only
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-audit-system-integrity-failure-only
    test-audit-system-integrity-success-failure:
      test_title: Audit - System Integrity - Success and Failure
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-audit-system-integrity-success-and-failure
  evaluate:
    any:
    - test: test-audit-system-integrity-failure-only
    - test: test-audit-system-integrity-success-failure
