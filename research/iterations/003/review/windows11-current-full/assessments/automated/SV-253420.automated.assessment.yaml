assessment:
  id: SV-253420.automated
  version: 2
  assessment_title: WN11-CC-000355 - The Windows Remote Management (WinRM) service must not store RunAs credentials.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\Windows\WinRM\Service
        name:
          operation: equals
          datatype: string
          mask: false
          value: DisableRunAs
  tests:
    test-disallow-winrm-from-storing-runas-credentials-set-enabled:
      test_title: '''Disallow WinRM from storing RunAs credentials'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-disallow-winrm-from-storing-runas-credentials-set-enabled
