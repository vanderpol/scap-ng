assessment:
  id: SV-253284.automated
  version: 2
  assessment_title: WN11-00-000150 - Structured Exception Handling Overwrite Protection (SEHOP) must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Control\Session Manager\kernel
        name:
          operation: equals
          datatype: string
          mask: false
          value: DisableExceptionChainValidation
  tests:
    test-sehop-turned-on-properly-configured:
      test_title: SEHOP is turned on and properly configured
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: null
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-sehop-turned-on-properly-configured
