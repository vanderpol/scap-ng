assessment:
  id: SV-253281.automated
  version: 18
  assessment_title: A host-based firewall must be installed and enabled on the system.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    gather-firewallproduct-from-securitycenter2-collection:
      collection_title: Gather FirewallProduct from SecurityCenter2
      capability: windows.cmdlet
      select:
        module_name:
          operation: equals
          datatype: string
          mask: false
          value: CimCmdlets
        module_id:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
        module_version:
          operation: equals
          datatype: version
          mask: false
          nil: true
          value: ''
        verb:
          operation: equals
          datatype: string
          mask: false
          value: Get
        noun:
          operation: equals
          datatype: string
          mask: false
          value: CimInstance
        parameters:
          operation: equals
          datatype: record
          mask: false
          value:
            record:
            - name: classname
              value: firewallproduct
              operation: equals
              datatype: string
              mask: false
              entity_check: all
            - name: namespace
              value: root\securitycenter2
              operation: equals
              datatype: string
              mask: false
              entity_check: all
        select:
          operation: equals
          datatype: record
          mask: false
          value:
            record:
            - name: property
              value: displayname,productstate
              operation: equals
              datatype: string
              mask: false
              entity_check: all
    gather-firewallproduct-from-netsecurity-collection:
      collection_title: Gather FirewallProduct from NetSecurity
      capability: windows.cmdlet
      select:
        module_name:
          operation: equals
          datatype: string
          mask: false
          value: NetSecurity
        module_id:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
        module_version:
          operation: equals
          datatype: version
          mask: false
          nil: true
          value: ''
        verb:
          operation: equals
          datatype: string
          mask: false
          value: Get
        noun:
          operation: equals
          datatype: string
          mask: false
          value: NetFirewallProfile
        parameters:
          operation: equals
          datatype: record
          mask: false
          value:
            record:
            - name: policystore
              value: ActiveStore
              operation: equals
              datatype: string
              mask: false
              entity_check: all
        select:
          operation: equals
          datatype: record
          mask: false
          value:
            record:
            - name: property
              value: name,enabled,defaultinboundaction,defaultoutboundaction,logfilename
              operation: equals
              datatype: string
              mask: false
              entity_check: all
  tests:
    test-verify-3rd-party-firewall-installed-enabled-via-security-center:
      test_title: Verify a 3rd party firewall is installed and enabled via Security Center.
      capability: windows.cmdlet
      collection: gather-firewallproduct-from-securitycenter2-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: Product State must be 397568 (enabled)
        state_capability: windows.cmdlet
        state:
          field: value
          value:
            record:
            - name: productstate
              value: '266240'
              operation: equals
              datatype: string
              mask: false
              entity_check: all
          operation: equals
          datatype: record
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-verify-windows-defender-firewall-enabled:
      test_title: Verify Windows defender firewall is enabled.
      capability: windows.cmdlet
      collection: gather-firewallproduct-from-netsecurity-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: Enabled must be 'True')
        state_capability: windows.cmdlet
        state:
          field: value
          value:
            record:
            - name: enabled
              value: 'True'
              operation: equals
              datatype: string
              mask: false
              entity_check: all
          operation: equals
          datatype: record
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    any:
    - test: test-verify-3rd-party-firewall-installed-enabled-via-security-center
    - test: test-verify-windows-defender-firewall-enabled
