assessment:
  id: SV-279688.automated
  version: 1
  assessment_title: WN11-00-000126 - Windows 11 systems must block consumer account user authentication.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\MicrosoftAccount
        name:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: DisableUserAuth
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-prevent-enabling-lock-screen-camera-set-enabled:
      test_title: '''Prevent enabling lock screen camera'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-prevent-enabling-lock-screen-camera-set-enabled
