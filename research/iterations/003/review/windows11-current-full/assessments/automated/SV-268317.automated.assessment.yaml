assessment:
  id: SV-268317.automated
  version: 18
  assessment_title: Copilot must be disabled for Windows 11.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    get-appxpackage-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: Get-AppxPackage -AllUsers | Where-Object { $_.Name -like '*Copilot*' }
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: ''
      object_title: Get-AppxPackage
  states:
    state-stdout-line-does-not-exist:
      state_title: stdout_line does not exist
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: ''
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: none_exist
  tests:
    test-run-powershell-command-determine-if-copilot-in-use-if-microsoft:
      test_title: Run a PowerShell command to determine if copilot is in use. If Microsoft.Copilot displays, this
        is a finding.
      capability: independent.shellcommand
      object: get-appxpackage-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-stdout-line-does-not-exist
  evaluate:
    test: test-run-powershell-command-determine-if-copilot-in-use-if-microsoft
