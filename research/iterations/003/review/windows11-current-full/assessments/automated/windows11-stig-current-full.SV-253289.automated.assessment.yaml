assessment:
  id: windows11-stig-current-full.SV-253289.automated
  version: 2
  assessment_title: WN11-00-000175 - The Secondary Logon service must be disabled on Windows 11.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    secondary-logon-service-startup-type-object:
      capability: windows.wmi.query
      object_title: Secondary Logon Service Startup Type
      collect:
        namespace: root\cimv2
        query: SELECT startmode FROM Win32_Service WHERE name='seclogon'
  states:
    state-service-startup-type-is-disabled:
      state_title: Service Startup Type is Disabled
      capability: windows.wmi.query
      state:
        field: result
        record:
          mask: false
          match: all
          existence: some
          fields:
            startmode:
              value: Disabled
              operation: equal
              datatype: string
              mask: false
              match: all
              existence: some
  tests:
    test-secondary-logon-service-startup-type-disabled-or-service-uninstalled:
      test_title: The Secondary Logon service Startup Type is Disabled or the service is uninstalled
      capability: windows.wmi.query
      object: secondary-logon-service-startup-type-object
      states:
      - state-service-startup-type-is-disabled
      existence: optional
      match: any
  evaluate:
    test: test-secondary-logon-service-startup-type-disabled-or-service-uninstalled
