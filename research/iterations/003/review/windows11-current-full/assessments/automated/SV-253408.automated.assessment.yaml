assessment:
  id: SV-253408.automated
  version: 2
  assessment_title: WN11-CC-000300 - Basic authentication for RSS feeds over HTTP must not be used.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\Internet Explorer\Feeds
        name:
          operation: equals
          datatype: string
          mask: false
          value: AllowBasicAuthInClear
  tests:
    test-turn-on-basic-feed-authentication-over-http-set-not-configured:
      test_title: '''Turn on Basic feed authentication over HTTP'' is set to ''Not Configured'' or ''Disabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: null
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-turn-on-basic-feed-authentication-over-http-set-not-configured
