assessment:
  id: windows11-stig-current-full.SV-253312.automated
  version: 2
  assessment_title: WN11-AU-000050 - The system must be configured to audit Detailed Tracking - Process Creation
    successes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-audit-process-creation-success-only:
      state_title: Audit - Process Creation - Success only
      capability: windows.auditeventpolicysubcategories
      state:
        field: process_creation
        value: AUDIT_SUCCESS
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-audit-process-creation-success-and-failure:
      state_title: Audit - Process Creation - Success and Failure
      capability: windows.auditeventpolicysubcategories
      state:
        field: process_creation
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-process-creation-success-only:
      test_title: Audit - Process Creation - Success only
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-audit-process-creation-success-only
    test-audit-process-creation-success-failure:
      test_title: Audit - Process Creation - Success and Failure
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-audit-process-creation-success-and-failure
  evaluate:
    any:
    - test: test-audit-process-creation-success-only
    - test: test-audit-process-creation-success-failure
