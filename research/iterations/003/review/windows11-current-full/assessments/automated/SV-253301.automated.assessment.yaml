assessment:
  id: SV-253301.automated
  version: 2
  assessment_title: WN11-AC-000025 - The maximum password age must be configured to 60 days or less.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-passwordpolicy-object:
      capability: windows.passwordpolicy
      object_title: null
  states:
    state-windows-passwordpolicy:
      state_title: null
      capability: windows.passwordpolicy
      state:
        field: max_passwd_age
        value: '5184000'
        operation: less than or equal
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-passwordpolicy-2:
      state_title: null
      capability: windows.passwordpolicy
      state:
        field: max_passwd_age
        value: '0'
        operation: greater than
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-maximum-password-age-set-60-days-or-less-but-greater:
      test_title: Maximum Password Age is set to 60 days or less, but greater than 0.
      capability: windows.passwordpolicy
      object: windows-passwordpolicy-object
      check_existence: at_least_one_exists
      check: all
      state_operator: AND
      states:
      - state-windows-passwordpolicy
      - state-windows-passwordpolicy-2
  evaluate:
    test: test-maximum-password-age-set-60-days-or-less-but-greater
