assessment:
  id: SV-253505.automated
  version: 2
  assessment_title: WN11-UR-000160 - The "Restore files and directories" user right must only be assigned to the
    Administrators group.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-userright-collection:
      collection_title: null
      select:
        userright:
          operation: equals
          datatype: string
          mask: false
          value: SE_RESTORE_NAME
  tests:
    test-restore-files-directories-administrators:
      test_title: Restore files and directories - Administrators
      capability: windows.userright
      collection: windows-userright-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: null
          state:
            field: trustee_name
            value: ''
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          state:
            field: trustee_name
            value: Administrators
            operation: case insensitive equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-restore-files-directories-administrators
