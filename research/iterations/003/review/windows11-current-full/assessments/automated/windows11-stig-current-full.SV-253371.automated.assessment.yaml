assessment:
  id: windows11-stig-current-full.SV-253371.automated
  version: 18
  assessment_title: Virtualization-based protection of code integrity must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    deviceguard-securityservicesrunning-object:
      capability: windows.cmdlet
      select:
        module_name:
          operation: equals
          datatype: string
          value: CimCmdlets
        module_id:
          operation: equals
          datatype: string
          nil: true
          value: ''
        module_version:
          operation: equals
          datatype: version
          nil: true
          value: ''
        verb:
          operation: equals
          datatype: string
          value: Get
        noun:
          operation: equals
          datatype: string
          value: CimInstance
        parameters:
          operation: equals
          datatype: record
          value:
            record:
            - name: classname
              value: Win32_DeviceGuard
              operation: equals
              datatype: string
              entity_check: all
            - name: namespace
              value: root\Microsoft\Windows\DeviceGuard
              operation: equals
              datatype: string
              entity_check: all
        select:
          operation: equals
          datatype: record
          value:
            record:
            - name: property
              value: securityservicesrunning
              operation: equals
              datatype: string
              entity_check: all
      object_title: DeviceGuard SecurityServicesRunning
  states:
    state-securityservicesrunning-equal-to-2-as-formatted-array-el:
      state_title: SecurityServicesRunning equal to 2 as formatted array element
      capability: windows.cmdlet
      state:
        field: value
        value:
          record:
          - name: securityservicesrunning
            value: '2'
            operation: pattern match
            datatype: string
            entity_check: all
        operation: equals
        datatype: record
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-verify-securityservicesrunning-includes-value-2:
      test_title: Verify SecurityServicesRunning includes a value of 2
      capability: windows.cmdlet
      object: deviceguard-securityservicesrunning-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-securityservicesrunning-equal-to-2-as-formatted-array-el
  evaluate:
    test: test-verify-securityservicesrunning-includes-value-2
