assessment:
  id: SV-253426.automated
  version: 2
  assessment_title: WN11-EP-000310 - Windows 11 Kernel (Direct Memory Access) DMA Protection must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows\Kernel DMA Protection
        name:
          operation: equals
          datatype: string
          mask: false
          value: DeviceEnumerationPolicy
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-enumeration-policy-external-devices-incompatible-kernel-dma-protection-set-enabled:
      test_title: '''Enumeration policy for external devices incompatible with Kernel DMA Protection'' is set to
        ''Enabled'' with ''Enumeration Policy'' set to ''Block All'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-enumeration-policy-external-devices-incompatible-kernel-dma-protection-set-enabled
