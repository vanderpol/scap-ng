assessment:
  id: SV-253264.automated
  version: 18
  assessment_title: The Windows 11 system must use an antivirus program.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    gather-antivirusproduct-from-securitycenter2-object:
      capability: windows.cmdlet
      select:
        module_name:
          operation: equals
          datatype: string
          mask: false
          value: CimCmdlets
        module_id:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
        module_version:
          operation: equals
          datatype: version
          mask: false
          nil: true
          value: ''
        verb:
          operation: equals
          datatype: string
          mask: false
          value: Get
        noun:
          operation: equals
          datatype: string
          mask: false
          value: CimInstance
        parameters:
          operation: equals
          datatype: record
          mask: false
          value:
            record:
            - name: classname
              value: antivirusproduct
              operation: equals
              datatype: string
              mask: false
              entity_check: all
            - name: namespace
              value: root\securitycenter2
              operation: equals
              datatype: string
              mask: false
              entity_check: all
        select:
          operation: equals
          datatype: record
          mask: false
          value:
            record:
            - name: property
              value: displayname,productstate
              operation: equals
              datatype: string
              mask: false
              entity_check: all
      object_title: Gather AntivirusProduct from SecurityCenter2
  states:
    state-an-antivirus-program-must-be-installed-and-running:
      state_title: An antivirus program must be installed and running
      capability: windows.cmdlet
      state:
        field: value
        value:
          record:
          - name: productstate
            value: '4096'
            operation: bitwise and
            datatype: int
            mask: false
            entity_check: all
        operation: equals
        datatype: record
        mask: false
        entity_check: at least one
        entity_existence: at_least_one_exists
  tests:
    test-windows-use-antivirus-program:
      test_title: Windows must use an antivirus program
      capability: windows.cmdlet
      object: gather-antivirusproduct-from-securitycenter2-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-an-antivirus-program-must-be-installed-and-running
  evaluate:
    test: test-windows-use-antivirus-program
