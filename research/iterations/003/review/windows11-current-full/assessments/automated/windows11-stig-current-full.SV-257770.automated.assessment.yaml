assessment:
  id: windows11-stig-current-full.SV-257770.automated
  version: 1
  assessment_title: WN11-AU-000585 - Windows 11 must have command line process auditing events enabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-audit-process-creation-failure-only:
      state_title: Audit - Process Creation - Failure only
      capability: windows.auditeventpolicysubcategories
      state:
        field: process_creation
        value: AUDIT_FAILURE
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-audit-process-creation-success-and-failure:
      state_title: Audit - Process Creation - Success and Failure
      capability: windows.auditeventpolicysubcategories
      state:
        field: process_creation
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-process-creation-failure-only:
      test_title: Audit - Process Creation - Failure only
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-audit-process-creation-failure-only
    test-audit-process-creation-success-failure:
      test_title: Audit - Process Creation - Success and Failure
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-audit-process-creation-success-and-failure
  evaluate:
    any:
    - test: test-audit-process-creation-failure-only
    - test: test-audit-process-creation-success-failure
