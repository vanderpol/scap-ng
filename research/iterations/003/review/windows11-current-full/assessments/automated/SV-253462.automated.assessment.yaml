assessment:
  id: SV-253462.automated
  version: 2
  assessment_title: WN11-SO-000205 - The LanMan authentication level must be set to send NTLMv2 response only, and
    to refuse LM and NTLM.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Control\Lsa
        name:
          operation: equals
          datatype: string
          mask: false
          value: LmCompatibilityLevel
  tests:
    test-network-security-lan-manager-authentication-level-set-send-ntlmv2-response:
      test_title: '''Network security: LAN Manager authentication level'' is set to ''Send NTLMv2 response only.
        Refuse LM & NTLM'' (Level 5)'
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals 5
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '5'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-network-security-lan-manager-authentication-level-set-send-ntlmv2-response
