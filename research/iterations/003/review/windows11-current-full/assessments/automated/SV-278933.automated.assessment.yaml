assessment:
  id: SV-278933.automated
  version: 2
  assessment_title: WN11-AU-000588 - Windows 11 must be configured to audit sensitive privileged use failures.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-sensitive-privilege-use-is-set-to-failure:
      state_title: '''Sensitive Privilege Use'' is set to ''Failure'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: sensitive_privilege_use
        value: AUDIT_FAILURE
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-sensitive-privilege-use-is-set-to-success-and-failure:
      state_title: '''Sensitive Privilege Use'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: sensitive_privilege_use
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-sensitive-privilege-use-set-failure:
      test_title: '''Audit Sensitive Privilege Use'' is set to ''Failure'''
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-sensitive-privilege-use-is-set-to-failure
    test-audit-sensitive-privilege-use-set-success-failure:
      test_title: '''Audit Sensitive Privilege Use'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-sensitive-privilege-use-is-set-to-success-and-failure
  evaluate:
    any:
    - test: test-audit-sensitive-privilege-use-set-failure
    - test: test-audit-sensitive-privilege-use-set-success-failure
