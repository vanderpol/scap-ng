assessment:
  id: SV-253383.automated
  version: 2
  assessment_title: WN11-CC-000165 - Unauthenticated RPC clients must be restricted from connecting to the RPC server.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows NT\Rpc
        name:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: RestrictRemoteClients
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-restrict-unauthenticated-rpc-clients-set-enabled-authenticated:
      test_title: '''Restrict Unauthenticated RPC clients'' is set to ''Enabled'' and ''Authenticated'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-restrict-unauthenticated-rpc-clients-set-enabled-authenticated
