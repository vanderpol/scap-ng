assessment:
  id: SV-253383.automated
  version: 2
  assessment_title: WN11-CC-000165 - Unauthenticated RPC clients must be restricted from connecting to the RPC server.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      select:
        hive:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows NT\Rpc
        name:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: RestrictRemoteClients
  tests:
    test-restrict-unauthenticated-rpc-clients-set-enabled-authenticated:
      test_title: '''Restrict Unauthenticated RPC clients'' is set to ''Enabled'' and ''Authenticated'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-restrict-unauthenticated-rpc-clients-set-enabled-authenticated
