assessment:
  id: SV-253254.automated
  version: 2
  assessment_title: WN11-00-000005 - Domain-joined systems must use Windows 11 Enterprise Edition 64-bit version.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    editionid-collection:
      collection_title: EditionID
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Windows NT\CurrentVersion
        name:
          operation: equals
          datatype: string
          mask: false
          value: EditionId
  tests:
    test-editionid-enterprise-or-enterprises:
      test_title: EditionID is Enterprise or EnterpriseS
      capability: windows.registry
      collection: editionid-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: EditionID = Enterprise (reg_sz)
          capability: windows.registry
          state:
            all:
            - field: type
              value: reg_sz
              operation: equals
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            - field: value
              value: Enterprise
              operation: equals
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
        - state_title: EditionID = EnterpriseS (reg_sz)
          capability: windows.registry
          state:
            all:
            - field: type
              value: reg_sz
              operation: equals
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            - field: value
              value: EnterpriseS
              operation: equals
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
  evaluate:
    test: test-editionid-enterprise-or-enterprises
