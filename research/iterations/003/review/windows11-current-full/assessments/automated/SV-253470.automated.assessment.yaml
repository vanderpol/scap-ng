assessment:
  id: SV-253470.automated
  version: 3
  assessment_title: WN11-SO-000251 - Windows 11 must use multifactor authentication for local and network access
    to privileged and non-privileged accounts.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: pattern match
          datatype: string
          value: SOFTWARE\\Microsoft\\Cryptography\\Calais\\Readers\\\S+
        name:
          operation: equals
          datatype: string
          nil: true
          value: ''
      object_title: null
    windows-registry-object-2:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: pattern match
          datatype: string
          value: SOFTWARE\\Microsoft\\Cryptography\\Calais\\SmartCards\\\S+
        name:
          operation: equals
          datatype: string
          nil: true
          value: ''
      object_title: null
  states: {}
  tests:
    test-hklm-software-microsoft-cryptography-calais-readers-exists-contains-at-least:
      test_title: HKLM\SOFTWARE\Microsoft\Cryptography\Calais\Readers exists and contains at least one key.
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
    test-hklm-software-microsoft-cryptography-calais-smartcards-exists-contains-at-least:
      test_title: HKLM\SOFTWARE\Microsoft\Cryptography\Calais\SmartCards exists and contains at least one key.
      capability: windows.registry
      object: windows-registry-object-2
      check_existence: at_least_one_exists
      check: all
  evaluate:
    all:
    - test: test-hklm-software-microsoft-cryptography-calais-readers-exists-contains-at-least
    - test: test-hklm-software-microsoft-cryptography-calais-smartcards-exists-contains-at-least
