assessment:
  id: windows11-stig-current-full.SV-253275.automated
  version: 2
  assessment_title: WN11-00-000100 - Internet Information System (IIS) or its subcomponents must not be installed
    on a workstation.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-wmi57-object:
      capability: windows.wmi.query
      object_title: null
      collect:
        namespace: root\cimv2
        query: SELECT installstate FROM win32_optionalfeature WHERE name = 'IIS-WebServerRole'
    windows-wmi57-object-2:
      capability: windows.wmi.query
      object_title: null
      collect:
        namespace: root\cimv2
        query: SELECT installstate FROM win32_optionalfeature WHERE name = 'IIS-HostableWebCore'
  states:
    state-installstate-is-equal-to-2:
      state_title: InstallState is equal to 2
      capability: windows.wmi.query
      state:
        field: result
        record:
          mask: false
          match: all
          existence: some
          fields:
            installstate:
              value: '2'
              operation: equal
              datatype: string
              mask: false
              match: any
              existence: some
  tests:
    test-internet-information-services-feature-not-installed:
      test_title: '''Internet Information Services'' feature is not installed'
      capability: windows.wmi.query
      object: windows-wmi57-object
      states:
      - state-installstate-is-equal-to-2
      existence: all
      match: all
    test-internet-information-services-hostable-web-core-feature-not-installed:
      test_title: '''Internet Information Services Hostable Web Core'' feature is not installed'
      capability: windows.wmi.query
      object: windows-wmi57-object-2
      states:
      - state-installstate-is-equal-to-2
      existence: all
      match: all
  evaluate:
    all:
    - test: test-internet-information-services-feature-not-installed
    - test: test-internet-information-services-hostable-web-core-feature-not-installed
