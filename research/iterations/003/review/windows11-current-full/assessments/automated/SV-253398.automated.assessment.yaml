assessment:
  id: SV-253398.automated
  version: 2
  assessment_title: WN11-CC-000225 - File Explorer shell protocol must run in protected mode.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer
        name:
          operation: equals
          datatype: string
          mask: false
          value: PreXPSP2ShellProtocolBehavior
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-turn-off-shell-protocol-protected-mode-set-disabled:
      test_title: '''Turn off shell protocol protected mode'' is set to ''Disabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: any_exist
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-turn-off-shell-protocol-protected-mode-set-disabled
