assessment:
  id: windows11-stig-current-full.SV-253327.automated
  version: 2
  assessment_title: WN11-AU-000107 - The system must be configured to audit Policy Change - Authorization Policy
    Change successes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-audit-audit-policy-change-success-only:
      state_title: Audit - Audit Policy Change - Success only
      capability: windows.auditeventpolicysubcategories
      state:
        field: authorization_policy_change
        value: AUDIT_SUCCESS
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-audit-audit-policy-change-success-and-failure:
      state_title: Audit - Audit Policy Change - Success and Failure
      capability: windows.auditeventpolicysubcategories
      state:
        field: authorization_policy_change
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-audit-policy-change-success-only:
      test_title: Audit - Audit Policy Change - Success only
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-audit-audit-policy-change-success-only
    test-audit-audit-policy-change-success-failure:
      test_title: Audit - Audit Policy Change - Success and Failure
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-audit-audit-policy-change-success-and-failure
  evaluate:
    any:
    - test: test-audit-audit-policy-change-success-only
    - test: test-audit-audit-policy-change-success-failure
