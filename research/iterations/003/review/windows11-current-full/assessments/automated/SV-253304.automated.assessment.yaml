assessment:
  id: SV-253304.automated
  version: 2
  assessment_title: WN11-AC-000040 - The built-in Microsoft password complexity filter must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-passwordpolicy-object:
      capability: windows.passwordpolicy
      object_title: null
  states:
    state-windows-passwordpolicy:
      state_title: null
      capability: windows.passwordpolicy
      state:
        field: password_complexity
        value: '1'
        operation: equals
        datatype: boolean
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-password-meet-complexity-requirements-set-enabled:
      test_title: '''Password must meet complexity requirements'' is set to ''Enabled'''
      capability: windows.passwordpolicy
      object: windows-passwordpolicy-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-passwordpolicy
  evaluate:
    test: test-password-meet-complexity-requirements-set-enabled
