assessment:
  id: SV-253304.automated
  version: 2
  assessment_title: WN11-AC-000040 - The built-in Microsoft password complexity filter must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-passwordpolicy-collection:
      collection_title: null
      capability: windows.passwordpolicy
  tests:
    test-password-meet-complexity-requirements-set-enabled:
      test_title: '''Password must meet complexity requirements'' is set to ''Enabled'''
      capability: windows.passwordpolicy
      collection: windows-passwordpolicy-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.passwordpolicy
        state:
          field: password_complexity
          value: '1'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-password-meet-complexity-requirements-set-enabled
