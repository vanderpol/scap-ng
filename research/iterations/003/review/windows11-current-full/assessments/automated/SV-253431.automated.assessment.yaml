assessment:
  id: SV-253431.automated
  version: 18
  assessment_title: Default permissions for the HKEY_LOCAL_MACHINE registry hive must be maintained.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    gather-permissions-hkey-local-machine-security-registry-collection:
      collection_title: Gather permissions for the HKEY_LOCAL_MACHINE\SECURITY registry
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: '([Microsoft.Win32.Registry]::LocalMachine.OpenSubKey("Security", [System.Security.AccessControl.RegistryRights]::ReadPermissions)).GetAccessControl().Access
            |  Where-Object { $_.RegistryRights -notmatch ''\d+'' } | ForEach-Object { "Identity:$($_.IdentityReference),
            Rights: $($_.RegistryRights), Access: $($_.AccessControlType), IsInherited: $($_.IsInherited), InheritanceFlags:
            $($_.InheritanceFlags), PropagationFlags: $($_.PropagationFlags)" }'
    gather-permissions-hkey-local-machine-software-registry-collection:
      collection_title: Gather permissions for the HKEY_LOCAL_MACHINE\SOFTWARE registry
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: '([Microsoft.Win32.Registry]::LocalMachine.OpenSubKey("Software", [System.Security.AccessControl.RegistryRights]::ReadPermissions)).GetAccessControl().Access
            | Where-Object { $_.RegistryRights -notmatch ''\d+'' } | ForEach-Object { "Identity:$($_.IdentityReference),
            Rights: $($_.RegistryRights), Access: $($_.AccessControlType), IsInherited: $($_.IsInherited), InheritanceFlags:
            $($_.InheritanceFlags), PropagationFlags: $($_.PropagationFlags)" }'
    gather-permissions-hkey-local-machine-software-registry-collection-2:
      collection_title: Gather permissions for the HKEY_LOCAL_MACHINE\SOFTWARE registry
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: '([Microsoft.Win32.Registry]::LocalMachine.OpenSubKey("System", [System.Security.AccessControl.RegistryRights]::ReadPermissions)).GetAccessControl().Access
            | Where-Object { $_.RegistryRights -notmatch ''\d+'' } | ForEach-Object { "Identity:$($_.IdentityReference),
            Rights: $($_.RegistryRights), Access: $($_.AccessControlType), IsInherited: $($_.IsInherited), InheritanceFlags:
            $($_.InheritanceFlags), PropagationFlags: $($_.PropagationFlags)" }'
  tests:
    test-default-permissions-hkey-local-machine-security-registry-key-maintained:
      test_title: Default permissions for the HKEY_LOCAL_MACHINE\SECURITY registry key must be maintained.
      capability: independent.shellcommand
      collection: gather-permissions-hkey-local-machine-security-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: System Full, Administrators ReadPermission and ChangePermissions
        state:
          field: stdout_line
          value: '^Identity:NT AUTHORITY\\SYSTEM, Rights: FullControl, Access: Allow, IsInherited: False, InheritanceFlags:
            ContainerInherit, PropagationFlags: None$|^Identity:BUILTIN\\Administrators, Rights: ReadPermissions,
            ChangePermissions, Access: Allow, IsInherited: False, InheritanceFlags: ContainerInherit, PropagationFlags:
            None$'
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-default-permissions-hkey-local-machine-software-registry-key-maintained:
      test_title: Default permissions for the HKEY_LOCAL_MACHINE\SOFTWARE registry key must be maintained.
      capability: independent.shellcommand
      collection: gather-permissions-hkey-local-machine-software-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: 'System, Creator Owner, Admnistrators = Full; ALL APPLICATION PACKAGES, Users, S-1-15-3-1024-1065365936-1281604716-3511738428-1654721687-432734479-3232135806-4053264122-3456934681:
          Read'
        state:
          field: stdout_line
          value: '^Identity:CREATOR OWNER, Rights: FullControl, Access: Allow, IsInherited: False, InheritanceFlags:
            ContainerInherit, PropagationFlags: (None|InheritOnly)$|^Identity:(NT AUTHORITY\\SYSTEM|BUILTIN\\Administrators),
            Rights: FullControl, Access: Allow, IsInherited: False, InheritanceFlags: ContainerInherit, PropagationFlags:
            None$|^Identity:(BUILTIN\\Users|APPLICATION PACKAGE AUTHORITY\\ALL APPLICATION PACKAGES|S-1-15-3-1024-1065365936-1281604716-3511738428-1654721687-432734479-3232135806-4053264122-3456934681),
            Rights: ReadKey, Access: Allow, IsInherited: False, InheritanceFlags: ContainerInherit, PropagationFlags:
            None$'
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-default-permissions-hkey-local-machine-system-registry-key-maintained:
      test_title: Default permissions for the HKEY_LOCAL_MACHINE\SYSTEM registry key must be maintained.
      capability: independent.shellcommand
      collection: gather-permissions-hkey-local-machine-software-registry-collection-2
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: 'System, Creator Owner, Admnistrators = Full; ALL APPLICATION PACKAGES, Users, S-1-15-3-1024-1065365936-1281604716-3511738428-1654721687-432734479-3232135806-4053264122-3456934681:
          Read'
        state:
          field: stdout_line
          value: '^Identity:CREATOR OWNER, Rights: FullControl, Access: Allow, IsInherited: False, InheritanceFlags:
            ContainerInherit, PropagationFlags: (None|InheritOnly)$|^Identity:(NT AUTHORITY\\SYSTEM|BUILTIN\\Administrators),
            Rights: FullControl, Access: Allow, IsInherited: False, InheritanceFlags: ContainerInherit, PropagationFlags:
            None$|^Identity:(BUILTIN\\Users|APPLICATION PACKAGE AUTHORITY\\ALL APPLICATION PACKAGES|S-1-15-3-1024-1065365936-1281604716-3511738428-1654721687-432734479-3232135806-4053264122-3456934681),
            Rights: ReadKey, Access: Allow, IsInherited: False, InheritanceFlags: ContainerInherit, PropagationFlags:
            None$'
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-default-permissions-hkey-local-machine-security-registry-key-maintained
    - test: test-default-permissions-hkey-local-machine-software-registry-key-maintained
    - test: test-default-permissions-hkey-local-machine-system-registry-key-maintained
