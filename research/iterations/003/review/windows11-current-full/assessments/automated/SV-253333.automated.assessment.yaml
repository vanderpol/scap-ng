assessment:
  id: SV-253333.automated
  version: 2
  assessment_title: WN11-AU-000140 - The system must be configured to audit System - Security State Change successes.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-audit-security-state-change-success-only:
      state_title: Audit - Security State Change - Success only
      capability: windows.auditeventpolicysubcategories
      state:
        field: security_state_change
        value: AUDIT_SUCCESS
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-audit-security-state-change-success-and-failure:
      state_title: Audit - Security State Change - Success and Failure
      capability: windows.auditeventpolicysubcategories
      state:
        field: security_state_change
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-security-state-change-success-only:
      test_title: Audit - Security State Change - Success only
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-audit-security-state-change-success-only
    test-audit-security-state-change-success-failure:
      test_title: Audit - Security State Change - Success and Failure
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-audit-security-state-change-success-and-failure
  evaluate:
    any:
    - test: test-audit-security-state-change-success-only
    - test: test-audit-security-state-change-success-failure
