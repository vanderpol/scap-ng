assessment:
  id: windows11-stig-current-full.SV-253442.automated
  version: 2
  assessment_title: WN11-SO-000055 - The maximum age for machine account passwords must be configured to 30 days
    or less.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SYSTEM\CurrentControlSet\Services\Netlogon\Parameters
        name:
          operation: equals
          datatype: string
          value: MaximumPasswordAge
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '0'
          operation: greater than
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
    state-windows-registry-2:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '30'
          operation: less than or equal
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-domain-member-maximum-machine-account-password-age-set-30-or:
      test_title: '''Domain member: Maximum machine account password age'' is set to 30 or less (but not 0).'
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      state_operator: AND
      states:
      - state-windows-registry
      - state-windows-registry-2
  evaluate:
    test: test-domain-member-maximum-machine-account-password-age-set-30-or
