assessment:
  id: SV-253277.automated
  version: 2
  assessment_title: WN11-00-000110 - Simple TCP/IP Services must not be installed on the system.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    simple-tcp-ip-services-collection:
      collection_title: Simple TCP/IP Services
      select:
        namespace:
          operation: equals
          datatype: string
          mask: false
          value: root\cimv2
        wql:
          operation: equals
          datatype: string
          mask: false
          value: SELECT startmode FROM Win32_Service WHERE name='simptcp'
  tests:
    test-check-make-sure-simple-tcp-ip-services-server-feature-not:
      test_title: Check to make sure the Simple TCP/IP Services server feature is not present.
      capability: windows.wmi57
      collection: simple-tcp-ip-services-collection
      assertion:
        existence: none_exist
        item_quantifier: at least one
        state: null
  evaluate:
    test: test-check-make-sure-simple-tcp-ip-services-server-feature-not
