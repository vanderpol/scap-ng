assessment:
  id: SV-253330.automated
  version: 2
  assessment_title: WN11-AU-000120 - The system must be configured to audit System - IPsec Driver failures.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-audit-ipsec-driver-failure-only:
      state_title: Audit - IPSec Driver - Failure only
      capability: windows.auditeventpolicysubcategories
      state:
        field: ipsec_driver
        value: AUDIT_FAILURE
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-audit-ipsec-driver-success-and-failure:
      state_title: Audit - IPSec Driver - Success and Failure
      capability: windows.auditeventpolicysubcategories
      state:
        field: ipsec_driver
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-ipsec-driver-failure-only:
      test_title: Audit - IPSec Driver - Failure only
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-audit-ipsec-driver-failure-only
    test-audit-ipsec-driver-success-failure:
      test_title: Audit - IPSec Driver - Success and Failure
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-audit-ipsec-driver-success-and-failure
  evaluate:
    any:
    - test: test-audit-ipsec-driver-failure-only
    - test: test-audit-ipsec-driver-success-failure
