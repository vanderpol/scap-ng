assessment:
  id: SV-253324.automated
  version: 2
  assessment_title: WN11-AU-000090 - The system must be configured to audit Object Access - Removable Storage successes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-audit-removable-storage-is-set-to-success:
      state_title: '''Audit Removable Storage'' is set to ''Success'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: removable_storage
        value: AUDIT_SUCCESS
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-audit-removable-storage-is-set-to-success-and-failure:
      state_title: '''Audit Removable Storage'' is set to ''Success and Failure'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: removable_storage
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-object-access-removable-storage-success-only:
      test_title: Audit - Object Access - Removable Storage - Success Only
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-audit-removable-storage-is-set-to-success
    test-audit-object-access-removable-storage-success-failure:
      test_title: Audit - Object Access - Removable Storage - Success and Failure
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-audit-removable-storage-is-set-to-success-and-failure
  evaluate:
    any:
    - test: test-audit-object-access-removable-storage-success-only
    - test: test-audit-object-access-removable-storage-success-failure
