assessment:
  id: SV-253467.automated
  version: 2
  assessment_title: WN11-SO-000240 - The default permissions of global system objects must be increased.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Control\Session Manager
        name:
          operation: equals
          datatype: string
          mask: false
          value: ProtectionMode
  tests:
    test-system-objects-strengthen-default-permissions-internal-system-objects-e-g:
      test_title: '''System objects: Strengthen default permissions of internal system objects (e.g. Symbolic links)''
        is set to ''Enabled''.'
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-system-objects-strengthen-default-permissions-internal-system-objects-e-g
