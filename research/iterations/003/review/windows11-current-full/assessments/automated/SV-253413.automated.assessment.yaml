assessment:
  id: SV-253413.automated
  version: 2
  assessment_title: WN11-CC-000325 - Automatically signing in the last interactive user after a system-initiated
    restart must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        name:
          operation: equals
          datatype: string
          mask: false
          value: DisableAutomaticRestartSignOn
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-verifies-sign-in-last-interactive-user-automatically-after-system-initiated:
      test_title: Verifies 'Sign-in last interactive user automatically after a system-initiated restart' is set
        to 'Disabled'
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-verifies-sign-in-last-interactive-user-automatically-after-system-initiated
