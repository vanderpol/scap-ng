assessment:
  id: SV-253399.automated
  version: 3
  assessment_title: WN11-CC-000252 - Windows 11 must be configured to disable Windows Game Recording and Broadcasting.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    group-policy-registry-entry-allowgamedvr-collection:
      collection_title: Group Policy registry entry for AllowGameDVR
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows\GameDVR
        name:
          operation: equals
          datatype: string
          mask: false
          value: AllowGameDVR
    intune-registry-entry-allowgamedvr-collection:
      collection_title: Intune registry entry for AllowGameDVR
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\PolicyManager\current\device\ApplicationManagement
        name:
          operation: equals
          datatype: string
          mask: false
          value: AllowGameDVR
    registry-entries-allowgamedvr-collection:
      collection_title: Registry entries for AllowGameDVR
      set:
        operator: union
        members:
        - collection: group-policy-registry-entry-allowgamedvr-collection
        - collection: intune-registry-entry-allowgamedvr-collection
  tests:
    test-allowgamedvr-disabled:
      test_title: AllowGameDVR is disabled
      capability: windows.registry
      collection: registry-entries-allowgamedvr-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-allowgamedvr-disabled
