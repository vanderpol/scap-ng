assessment:
  id: SV-253501.automated
  version: 2
  assessment_title: WN11-UR-000130 - The "Manage auditing and security log" user right must only be assigned to
    the Administrators group.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-userright-object:
      capability: windows.userright
      select:
        userright:
          operation: equals
          datatype: string
          value: SE_SECURITY_NAME
      object_title: null
  states:
    state-windows-userright:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: ''
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-userright-2:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: Administrators
        operation: case insensitive equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-manage-auditing-security-log-administrators:
      test_title: Manage auditing and security log - Administrators
      capability: windows.userright
      object: windows-userright-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-windows-userright
      - state-windows-userright-2
  evaluate:
    test: test-manage-auditing-security-log-administrators
