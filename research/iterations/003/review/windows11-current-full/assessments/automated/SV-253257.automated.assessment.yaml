assessment:
  id: SV-253257.automated
  version: 18
  assessment_title: Secure Boot must be enabled on Windows 11 systems.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    run-powershell-command-determine-if-secure-boot-enabled-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: Confirm-SecureBootUEFI
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: ''
      object_title: Run a PowerShell command to determine if secure boot is enabled
  states:
    state-verify-true-is-returned-to-stdout:
      state_title: Verify True is returned to stdout
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: 'True'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-run-powershell-command-determine-if-secure-boot-enabled:
      test_title: Run a PowerShell command to determine if Secure Boot must be enabled.
      capability: independent.shellcommand
      object: run-powershell-command-determine-if-secure-boot-enabled-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-verify-true-is-returned-to-stdout
  evaluate:
    test: test-run-powershell-command-determine-if-secure-boot-enabled
