assessment:
  id: SV-253257.automated
  version: 18
  assessment_title: Secure Boot must be enabled on Windows 11 systems.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    run-powershell-command-determine-if-secure-boot-enabled-collection:
      collection_title: Run a PowerShell command to determine if secure boot is enabled
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: Confirm-SecureBootUEFI
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: ''
  tests:
    test-run-powershell-command-determine-if-secure-boot-enabled:
      test_title: Run a PowerShell command to determine if Secure Boot must be enabled.
      capability: independent.shellcommand
      collection: run-powershell-command-determine-if-secure-boot-enabled-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Verify True is returned to stdout
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: 'True'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-run-powershell-command-determine-if-secure-boot-enabled
