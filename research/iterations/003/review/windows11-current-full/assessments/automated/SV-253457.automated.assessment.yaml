assessment:
  id: SV-253457.automated
  version: 2
  assessment_title: WN11-SO-000167 - Remote calls to the Security Account Manager (SAM) must be restricted to Administrators.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Control\Lsa
        name:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: RestrictRemoteSAM
      object_title: null
  states:
    state-reg-sz-type-and-value-equals-o-bag-bad-a-rc-ba:
      state_title: Reg_Sz type and value equals O:BAG:BAD:(A;;RC;;;BA)
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_sz
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: O:BAG:BAD:(A;;RC;;;BA)
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-allow-administrators-group-make-remote-calls-sam:
      test_title: Allow Administrators group to make remote calls to SAM
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-sz-type-and-value-equals-o-bag-bad-a-rc-ba
  evaluate:
    test: test-allow-administrators-group-make-remote-calls-sam
