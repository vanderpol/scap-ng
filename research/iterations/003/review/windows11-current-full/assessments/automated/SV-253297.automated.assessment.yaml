assessment:
  id: SV-253297.automated
  version: 2
  assessment_title: WN11-AC-000005 - Windows 11 account lockout duration must be configured to 15 minutes or greater.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-lockoutpolicy-object:
      capability: windows.lockoutpolicy
      object_title: null
  states:
    state-lockout-threshold-is-greater-than-0:
      state_title: Lockout Threshold is greater than 0
      capability: windows.lockoutpolicy
      state:
        field: lockout_threshold
        value: '0'
        operation: greater than
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
    state-lockout-duration-equals-1:
      state_title: Lockout Duration equals -1
      capability: windows.lockoutpolicy
      state:
        field: lockout_duration
        value: '0'
        operation: less than or equal
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
    state-lockout-duration-equals-4294967295:
      state_title: Lockout Duration equals 4294967295
      capability: windows.lockoutpolicy
      state:
        field: lockout_duration
        value: '4294967295'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
    state-lockout-duration-greater-than-or-equals-900:
      state_title: Lockout Duration greater than or equals 900
      capability: windows.lockoutpolicy
      state:
        field: lockout_duration
        value: '900'
        operation: greater than or equal
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-account-lockout-threshold-not-set-0:
      test_title: '''Account lockout threshold'' is not set to ''0'''
      capability: windows.lockoutpolicy
      object: windows-lockoutpolicy-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-lockout-threshold-is-greater-than-0
    test-account-lockout-duration-set-0:
      test_title: '''Account lockout duration'' is set to ''0'''
      capability: windows.lockoutpolicy
      object: windows-lockoutpolicy-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-lockout-duration-equals-1
      - state-lockout-duration-equals-4294967295
    test-account-lockout-duration-set-15-minutes-or-greater:
      test_title: '''Account lockout duration'' is set to ''15 minutes'' or greater'
      capability: windows.lockoutpolicy
      object: windows-lockoutpolicy-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-lockout-duration-greater-than-or-equals-900
  evaluate:
    all:
    - test: test-account-lockout-threshold-not-set-0
    - any:
      - test: test-account-lockout-duration-set-0
      - test: test-account-lockout-duration-set-15-minutes-or-greater
