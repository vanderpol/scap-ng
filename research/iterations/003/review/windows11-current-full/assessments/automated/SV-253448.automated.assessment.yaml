assessment:
  id: SV-253448.automated
  version: 2
  assessment_title: WN11-SO-000095 - The Smart Card removal option must be configured to Force Logoff or Lock Workstation.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon
        name:
          operation: equals
          datatype: string
          mask: false
          value: SCRemoveOption
  tests:
    test-interactive-logon-smart-card-removal-behavior-set-lock-workstation-or:
      test_title: '''Interactive logon: Smart card removal behavior'' is set to ''Lock Workstation'' or ''Force
        Logoff'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: null
          state:
            all:
            - field: type
              value: reg_sz
              operation: equals
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            - field: value
              value: '1'
              operation: equals
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
        - state_title: null
          state:
            all:
            - field: type
              value: reg_sz
              operation: equals
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            - field: value
              value: '2'
              operation: equals
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
  evaluate:
    test: test-interactive-logon-smart-card-removal-behavior-set-lock-workstation-or
