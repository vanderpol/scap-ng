assessment:
  id: SV-253289.automated
  version: 2
  assessment_title: WN11-00-000175 - The Secondary Logon service must be disabled on Windows 11.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    secondary-logon-service-startup-type-object:
      capability: windows.wmi57
      select:
        namespace:
          operation: equals
          datatype: string
          value: root\cimv2
        wql:
          operation: equals
          datatype: string
          value: SELECT startmode FROM Win32_Service WHERE name='seclogon'
      object_title: Secondary Logon Service Startup Type
  states:
    state-service-startup-type-is-disabled:
      state_title: Service Startup Type is Disabled
      capability: windows.wmi57
      state:
        field: result
        value:
          record:
          - name: startmode
            value: Disabled
            operation: equals
            datatype: string
            entity_check: all
        operation: equals
        datatype: record
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-secondary-logon-service-startup-type-disabled-or-service-uninstalled:
      test_title: The Secondary Logon service Startup Type is Disabled or the service is uninstalled
      capability: windows.wmi57
      object: secondary-logon-service-startup-type-object
      check_existence: any_exist
      check: at least one
      states:
      - state-service-startup-type-is-disabled
  evaluate:
    test: test-secondary-logon-service-startup-type-disabled-or-service-uninstalled
