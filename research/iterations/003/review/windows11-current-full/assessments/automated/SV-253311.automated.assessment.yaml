assessment:
  id: SV-253311.automated
  version: 2
  assessment_title: WN11-AU-000045 - The system must be configured to audit Detailed Tracking - PNP Activity successes.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-auditeventpolicysubcategories-collection:
      collection_title: null
      capability: windows.auditeventpolicysubcategories
  tests:
    test-audit-detailed-tracking-pnp-activity-success-only:
      test_title: Audit - Detailed Tracking - PNP Activity - Success Only
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: '''Plug and Play Events'' is set to ''Success'''
        state_capability: windows.auditeventpolicysubcategories
        state:
          field: pnp_activity
          value: AUDIT_SUCCESS
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-audit-detailed-tracking-pnp-activity-success-failure:
      test_title: Audit - Detailed Tracking - PNP Activity - Success and Failure
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: '''Plug and Play Events'' is set to ''Success and Failure'''
        state_capability: windows.auditeventpolicysubcategories
        state:
          field: pnp_activity
          value: AUDIT_SUCCESS_FAILURE
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    any:
    - test: test-audit-detailed-tracking-pnp-activity-success-only
    - test: test-audit-detailed-tracking-pnp-activity-success-failure
