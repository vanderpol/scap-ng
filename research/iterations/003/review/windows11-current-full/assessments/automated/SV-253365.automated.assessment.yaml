assessment:
  id: SV-253365.automated
  version: 2
  assessment_title: WN11-CC-000060 - Connections to non-domain networks when connected to a domain authenticated
    network must be blocked.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\Windows\WcmSvc\GroupPolicy\
        name:
          operation: equals
          datatype: string
          mask: false
          value: fBlockNonDomain
  tests:
    test-prohibit-connection-non-domain-networks-when-connected-domain-authenticated-network:
      test_title: '''Prohibit connection to non-domain networks when connected to domain authenticated network''
        is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-prohibit-connection-non-domain-networks-when-connected-domain-authenticated-network
