assessment:
  id: windows11-stig-current-full.SV-253425.automated
  version: 2
  assessment_title: WN11-CC-000390 - Windows 11 must be configured to prevent users from receiving suggestions for
    third-party or additional applications.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-ntuser-object:
      capability: windows.ntuser
      select:
        key:
          operation: equals
          datatype: string
          value: SOFTWARE\Policies\Microsoft\Windows\CloudContent
        name:
          operation: equals
          datatype: string
          value: DisableThirdPartySuggestions
      filters:
      - action: exclude
        state: state-windows-ntuser-2
      - action: exclude
        state: state-windows-ntuser-3
      object_title: null
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_CURRENT_USER
        key:
          operation: equals
          datatype: string
          value: SOFTWARE\Policies\Microsoft\Windows\CloudContent
        name:
          operation: equals
          datatype: string
          value: DisableThirdPartySuggestions
      object_title: null
  states:
    state-windows-ntuser:
      state_title: null
      capability: windows.ntuser
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
    state-windows-ntuser-2:
      state_title: null
      capability: windows.ntuser
      state:
        field: enabled
        value: 'false'
        operation: equals
        datatype: boolean
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-ntuser-3:
      state_title: null
      capability: windows.ntuser
      state:
        field: days_since_modified
        value: '35'
        operation: greater than
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-do-not-suggest-third-party-content-in-windows-spotlight-set:
      test_title: '''Do not suggest third-party content in Windows spotlight'' is set to ''Enabled'''
      capability: windows.ntuser
      object: windows-ntuser-object
      check_existence: all_exist
      check: all
      states:
      - state-windows-ntuser
    test-current-user-do-not-suggest-third-party-content-in-windows:
      test_title: For the current user, 'Do not suggest third-party content in Windows spotlight' is set to 'Enabled'
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    all:
    - test: test-do-not-suggest-third-party-content-in-windows-spotlight-set
    - test: test-current-user-do-not-suggest-third-party-content-in-windows
