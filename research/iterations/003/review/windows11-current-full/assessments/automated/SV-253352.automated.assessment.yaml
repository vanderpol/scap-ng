assessment:
  id: SV-253352.automated
  version: 2
  assessment_title: WN11-CC-000010 - The display of slide shows on the lock screen must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    registry-object-hkey-local-machine-software-policies-microsoft-windows-personalization-collection:
      collection_title: Registry object for HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\Personalization\NoLockScreenSlideshow
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows\Personalization
        name:
          operation: equals
          datatype: string
          mask: false
          value: NoLockScreenSlideshow
  tests:
    test-verifies-prevent-enabling-lock-screen-slide-show-set-enabled:
      test_title: Verifies 'Prevent enabling lock screen slide show' is set to 'Enabled'
      capability: windows.registry
      collection: registry-object-hkey-local-machine-software-policies-microsoft-windows-personalization-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-verifies-prevent-enabling-lock-screen-slide-show-set-enabled
