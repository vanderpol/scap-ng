assessment:
  id: windows11-stig-current-full.SV-253284.automated
  version: 2
  assessment_title: WN11-00-000150 - Structured Exception Handling Overwrite Protection (SEHOP) must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SYSTEM\CurrentControlSet\Control\Session Manager\kernel
        name:
          operation: equals
          datatype: string
          value: DisableExceptionChainValidation
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-sehop-turned-on-properly-configured:
      test_title: SEHOP is turned on and properly configured
      capability: windows.registry
      object: windows-registry-object
      check_existence: all_exist
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-sehop-turned-on-properly-configured
