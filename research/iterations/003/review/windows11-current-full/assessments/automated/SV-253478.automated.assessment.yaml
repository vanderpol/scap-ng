assessment:
  id: SV-253478.automated
  version: 2
  assessment_title: WN11-UC-000020 - Zone information must be preserved when saving attachments.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-ntuser-object:
      capability: windows.ntuser
      select:
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Microsoft\Windows\CurrentVersion\Policies\Attachments
        name:
          operation: equals
          datatype: string
          mask: false
          value: SaveZoneInformation
      filters:
      - action: exclude
        state: state-windows-ntuser-2
      - action: exclude
        state: state-windows-ntuser-3
      object_title: null
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_CURRENT_USER
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Microsoft\Windows\CurrentVersion\Policies\Attachments
        name:
          operation: equals
          datatype: string
          mask: false
          value: SaveZoneInformation
      object_title: null
  states:
    state-windows-ntuser:
      state_title: null
      capability: windows.ntuser
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '2'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '2'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    state-windows-ntuser-2:
      state_title: null
      capability: windows.ntuser
      state:
        field: enabled
        value: 'false'
        operation: equals
        datatype: boolean
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-ntuser-3:
      state_title: null
      capability: windows.ntuser
      state:
        field: days_since_modified
        value: '35'
        operation: greater than
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-do-not-preserve-zone-information-in-file-attachments-set-not:
      test_title: '''Do not preserve zone information in file attachments'' is set to ''Not Configured'' or ''Disabled'''
      capability: windows.ntuser
      object: windows-ntuser-object
      check_existence: any_exist
      check: all
      states:
      - state-windows-ntuser
    test-current-user-do-not-preserve-zone-information-in-file-attachments:
      test_title: For the current user, 'Do not preserve zone information in file attachments' is set to 'Not Configured'
        or 'Disabled'
      capability: windows.registry
      object: windows-registry-object
      check_existence: any_exist
      check: all
      states:
      - state-windows-registry
  evaluate:
    all:
    - test: test-do-not-preserve-zone-information-in-file-attachments-set-not
    - test: test-current-user-do-not-preserve-zone-information-in-file-attachments
