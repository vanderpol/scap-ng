assessment:
  id: SV-253378.automated
  version: 2
  assessment_title: WN11-CC-000120 - The network selection user interface (UI) must not be displayed on the logon
    screen.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    hklm-software-policies-microsoft-windows-system-dontdisplaynetworkselectionui-collection:
      collection_title: HKLM\SOFTWARE\Policies\Microsoft\Windows\System\DontDisplayNetworkSelectionUI
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows\System
        name:
          operation: equals
          datatype: string
          mask: false
          value: DontDisplayNetworkSelectionUI
  tests:
    test-verifies-do-not-display-network-selection-ui-set-enabled:
      test_title: Verifies 'Do not display network selection UI' is set to 'Enabled'
      capability: windows.registry
      collection: hklm-software-policies-microsoft-windows-system-dontdisplaynetworkselectionui-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-verifies-do-not-display-network-selection-ui-set-enabled
