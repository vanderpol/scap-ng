assessment:
  id: SV-253378.automated
  version: 2
  assessment_title: WN11-CC-000120 - The network selection user interface (UI) must not be displayed on the logon
    screen.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    hklm-software-policies-microsoft-windows-system-dontdisplaynetworkselectionui-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SOFTWARE\Policies\Microsoft\Windows\System
        name:
          operation: equals
          datatype: string
          value: DontDisplayNetworkSelectionUI
      object_title: HKLM\SOFTWARE\Policies\Microsoft\Windows\System\DontDisplayNetworkSelectionUI
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-verifies-do-not-display-network-selection-ui-set-enabled:
      test_title: Verifies 'Do not display network selection UI' is set to 'Enabled'
      capability: windows.registry
      object: hklm-software-policies-microsoft-windows-system-dontdisplaynetworkselectionui-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-verifies-do-not-display-network-selection-ui-set-enabled
