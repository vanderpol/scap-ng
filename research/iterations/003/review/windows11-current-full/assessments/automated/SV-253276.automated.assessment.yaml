assessment:
  id: SV-253276.automated
  version: 18
  assessment_title: Simple Network Management Protocol (SNMP) must not be installed on the system.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    snmp-service-collection:
      collection_title: SNMP Service
      capability: windows.service
      select:
        service_name:
          operation: equals
          datatype: string
          mask: false
          value: SNMP
  tests:
    test-snmp-shall-not-installed:
      test_title: SNMP Shall Not Be Installed
      capability: windows.service
      collection: snmp-service-collection
      assertion:
        existence: none_exist
        item_quantifier: all
        state: null
  evaluate:
    test: test-snmp-shall-not-installed
