assessment:
  id: SV-253276.automated
  version: 18
  assessment_title: Simple Network Management Protocol (SNMP) must not be installed on the system.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    snmp-service-object:
      capability: windows.service
      select:
        service_name:
          operation: equals
          datatype: string
          mask: false
          value: SNMP
      object_title: SNMP Service
  states: {}
  tests:
    test-snmp-shall-not-installed:
      test_title: SNMP Shall Not Be Installed
      capability: windows.service
      object: snmp-service-object
      check_existence: none_exist
      check: all
  evaluate:
    test: test-snmp-shall-not-installed
