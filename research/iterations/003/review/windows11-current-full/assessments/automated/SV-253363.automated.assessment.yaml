assessment:
  id: SV-253363.automated
  version: 18
  assessment_title: Windows 11 must be configured to prioritize ECC Curves with longer key lengths first.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    ssl-ecccurves-setting-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Cryptography\Configuration\SSL\00010002\
        name:
          operation: equals
          datatype: string
          mask: false
          value: EccCurves
      object_title: SSL - EccCurves Setting
    independent-variable-object:
      capability: independent.variable
      select:
        var_ref:
          operation: equals
          datatype: string
          mask: false
          value:
            variable: merged-multi-string-ssl-ecccurves-setting-variable
      object_title: null
  variables:
    merged-multi-string-ssl-ecccurves-setting-variable:
      title: Merged Multi-String SSL - EccCurves Setting
      kind: local
      datatype: string
      expression:
        merge:
          values:
            values:
              object: ssl-ecccurves-setting-object
              field: value
          delimiter: ''
          sort: document
          order: ascending
  states:
    state-independent-variable:
      state_title: null
      capability: independent.variable
      state:
        field: value
        value: ^NistP384\s*NistP256$
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-prioritize-ecc-curves-longer-key-lengths-first-nistp384-requirement:
      test_title: Prioritize ECC Curves with longer key lengths first. NistP384 Requirement
      capability: independent.variable
      object: independent-variable-object
      check_existence: at_least_one_exists
      check: only one
      states:
      - state-independent-variable
  evaluate:
    test: test-prioritize-ecc-curves-longer-key-lengths-first-nistp384-requirement
