assessment:
  id: windows11-stig-current-full.SV-253303.automated
  version: 3
  assessment_title: WN11-AC-000035 - Passwords must, at a minimum, be 14 characters.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-passwordpolicy-object:
      capability: windows.passwordpolicy
      object_title: null
  states:
    state-minimum-password-length-is-greater-than-or-equal-to-14:
      state_title: Minimum Password Length is greater than or equal to 14
      capability: windows.passwordpolicy
      state:
        field: min_passwd_len
        value: '14'
        operation: greater than or equal
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-minimum-password-length-set-at-least-14-characters:
      test_title: '''Minimum password length'' is set to at least ''14'' characters'
      capability: windows.passwordpolicy
      object: windows-passwordpolicy-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-minimum-password-length-is-greater-than-or-equal-to-14
  evaluate:
    test: test-minimum-password-length-set-at-least-14-characters
