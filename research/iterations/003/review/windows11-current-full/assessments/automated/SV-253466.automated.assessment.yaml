assessment:
  id: SV-253466.automated
  version: 3
  assessment_title: WN11-SO-000230 - The system must be configured to use FIPS-compliant algorithms for encryption,
    hashing, and signing.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    gpo-registry-entry-fips-compliant-algorithms-collection:
      collection_title: GPO registry entry for FIPS-compliant algorithms
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Control\Lsa\FIPSAlgorithmPolicy
        name:
          operation: equals
          datatype: string
          mask: false
          value: Enabled
    intune-registry-entry-fips-compliant-algorithms-collection:
      collection_title: Intune registry entry for FIPS-compliant algorithms
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\PolicyManager\current\device\Cryptography
        name:
          operation: equals
          datatype: string
          mask: false
          value: AllowFipsAlgorithmPolicy_ProviderSet
    registry-entries-fips-compliant-algorithms-collection:
      collection_title: Registry entries for FIPS-compliant algorithms
      capability: windows.registry
      set:
        operator: union
        members:
        - collection: gpo-registry-entry-fips-compliant-algorithms-collection
        - collection: intune-registry-entry-fips-compliant-algorithms-collection
  tests:
    test-fips-compliant-algorithms-enabled:
      test_title: FIPS-compliant algorithms are enabled
      capability: windows.registry
      collection: registry-entries-fips-compliant-algorithms-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-fips-compliant-algorithms-enabled
