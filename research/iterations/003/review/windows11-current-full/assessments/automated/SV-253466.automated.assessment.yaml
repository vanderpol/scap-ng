assessment:
  id: SV-253466.automated
  version: 3
  assessment_title: WN11-SO-000230 - The system must be configured to use FIPS-compliant algorithms for encryption,
    hashing, and signing.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    gpo-registry-entry-fips-compliant-algorithms-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Control\Lsa\FIPSAlgorithmPolicy
        name:
          operation: equals
          datatype: string
          mask: false
          value: Enabled
      object_title: GPO registry entry for FIPS-compliant algorithms
    intune-registry-entry-fips-compliant-algorithms-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\PolicyManager\current\device\Cryptography
        name:
          operation: equals
          datatype: string
          mask: false
          value: AllowFipsAlgorithmPolicy_ProviderSet
      object_title: Intune registry entry for FIPS-compliant algorithms
    registry-entries-fips-compliant-algorithms-object:
      capability: windows.registry
      set:
        operator: union
        members:
        - object: gpo-registry-entry-fips-compliant-algorithms-object
        - object: intune-registry-entry-fips-compliant-algorithms-object
      object_title: Registry entries for FIPS-compliant algorithms
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-fips-compliant-algorithms-enabled:
      test_title: FIPS-compliant algorithms are enabled
      capability: windows.registry
      object: registry-entries-fips-compliant-algorithms-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-fips-compliant-algorithms-enabled
