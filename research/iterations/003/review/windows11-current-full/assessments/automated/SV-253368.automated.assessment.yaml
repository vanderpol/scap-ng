assessment:
  id: SV-253368.automated
  version: 2
  assessment_title: WN11-CC-000068 - Windows 11 must be configured to enable Remote host allows delegation of non-exportable
    credentials.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows\CredentialsDelegation
        name:
          operation: equals
          datatype: string
          mask: false
          value: AllowProtectedCreds
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-remote-host-allows-delegation-non-exportable-credentials-set-enabled:
      test_title: '''Remote host allows delegation of non-exportable credentials'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-remote-host-allows-delegation-non-exportable-credentials-set-enabled
