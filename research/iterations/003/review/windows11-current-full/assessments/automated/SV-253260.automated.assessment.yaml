assessment:
  id: SV-253260.automated
  version: 2
  assessment_title: WN11-00-000031 - Windows 11 systems must use a BitLocker PIN for pre-boot authentication.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\FVE
        name:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: UseAdvancedStartup
    windows-registry-collection-2:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\FVE
        name:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: OSManageNKP
    windows-registry-collection-3:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\FVE
        name:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: UseTPMPIN
    windows-registry-collection-4:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\FVE
        name:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: UseTPMKeyPIN
  tests:
    test-require-additional-authentication-at-startup-enabled:
      test_title: '''Require additional authentication at startup'' is Enabled.'
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-allow-network-unlock-at-startup-enabled:
      test_title: '''Allow network unlock at startup'' is Enabled.'
      capability: windows.registry
      collection: windows-registry-collection-2
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-configure-tpm-startup-pin-set-require-startup-pin-tpm:
      test_title: '''Configure TPM startup PIN'' is set to ''Require startup PIN with TPM''.'
      capability: windows.registry
      collection: windows-registry-collection-3
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-configure-tpm-startup-key-pin-set-require-startup-key-pin:
      test_title: '''Configure TPM startup key and PIN'' is set to ''Require startup key and PIN with TPM''.'
      capability: windows.registry
      collection: windows-registry-collection-4
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-configure-tpm-startup-pin-set-allow-startup-pin-tpm:
      test_title: '''Configure TPM startup PIN'' is set to ''Allow startup PIN with TPM''.'
      capability: windows.registry
      collection: windows-registry-collection-3
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '2'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-configure-tpm-startup-key-pin-set-allow-startup-key-pin:
      test_title: '''Configure TPM startup key and PIN'' is set to ''Allow startup key and PIN with TPM''.'
      capability: windows.registry
      collection: windows-registry-collection-4
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '2'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-require-additional-authentication-at-startup-enabled
    - any:
      - all:
        - not:
            test: test-allow-network-unlock-at-startup-enabled
        - any:
          - test: test-configure-tpm-startup-pin-set-require-startup-pin-tpm
          - test: test-configure-tpm-startup-key-pin-set-require-startup-key-pin
      - all:
        - test: test-allow-network-unlock-at-startup-enabled
        - any:
          - test: test-configure-tpm-startup-pin-set-allow-startup-pin-tpm
          - test: test-configure-tpm-startup-key-pin-set-allow-startup-key-pin
