assessment:
  id: windows11-stig-current-full.SV-278931.automated
  version: 2
  assessment_title: WN11-AU-000586 - Windows 11 must be configured to audit registry successes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-registry-is-set-to-success:
      state_title: '''Registry'' is set to ''Success'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: registry
        value: AUDIT_SUCCESS
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-registry-is-set-to-success-and-failure:
      state_title: '''Registry'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: registry
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-registry-set-success:
      test_title: '''Audit Registry'' is set to ''Success'''
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-registry-is-set-to-success
    test-audit-registry-set-success-failure:
      test_title: '''Audit Registry'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-registry-is-set-to-success-and-failure
  evaluate:
    any:
    - test: test-audit-registry-set-success
    - test: test-audit-registry-set-success-failure
