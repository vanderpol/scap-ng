assessment:
  id: SV-253412.automated
  version: 2
  assessment_title: WN11-CC-000320 - Users must be notified if a web-based program attempts to install software.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\Windows\Installer
        name:
          operation: equals
          datatype: string
          mask: false
          value: SafeForScripting
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-prevent-internet-explorer-security-prompt-windows-installer-scripts-set-not:
      test_title: '''Prevent Internet Explorer security prompt for Windows Installer scripts'' is set to ''Not Configured''
        or ''Disabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: any_exist
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-prevent-internet-explorer-security-prompt-windows-installer-scripts-set-not
