assessment:
  id: SV-253471.automated
  version: 2
  assessment_title: WN11-SO-000255 - User Account Control must automatically deny elevation requests for standard
    users.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Microsoft\Windows\CurrentVersion\Policies\System
        name:
          operation: equals
          datatype: string
          mask: false
          value: ConsentPromptBehaviorUser
  tests:
    test-verifies-user-account-control-behavior-elevation-prompt-standard-users-set:
      test_title: 'Verifies ''User Account Control: Behavior of the elevation prompt for standard users'' is set
        to ''Automatically deny elevation requests'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-verifies-user-account-control-behavior-elevation-prompt-standard-users-set
