assessment:
  id: SV-253438.automated
  version: 2
  assessment_title: WN11-SO-000035 - Outgoing secure channel traffic must be encrypted or signed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Services\Netlogon\Parameters
        name:
          operation: equals
          datatype: string
          mask: false
          value: RequireSignOrSeal
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-domain-member-digitally-encrypt-or-sign-secure-channel-data-always:
      test_title: '''Domain member: Digitally encrypt or sign secure channel data (always)'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-domain-member-digitally-encrypt-or-sign-secure-channel-data-always
