assessment:
  id: SV-257592.automated
  version: 18
  assessment_title: Windows 11 must not have portproxy enabled or in use.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    ensure-no-portproxies-configured-collection:
      collection_title: Ensure no portproxies are configured.
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: pattern match
          datatype: string
          mask: false
          value: SYSTEM\\CurrentControlSet\\Services\\PortProxy\\v.tov.\\.*
        name:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
    check-registry-existence-v4tov4-tcp-collection:
      collection_title: Check registry for existence of v4tov4\tcp
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Services\PortProxy\v4tov4\tcp
        name:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
  tests:
    test-windows-11-not-have-portproxy-enabled-or-in-use:
      test_title: Windows 11 must not have portproxy enabled or in use.
      capability: windows.registry
      collection: ensure-no-portproxies-configured-collection
      assertion:
        existence: none_exist
        item_quantifier: only one
        state: null
    test-windows-11-not-have-portproxy-enabled-or-in-use-2:
      test_title: Windows 11 must not have portproxy enabled or in use.
      capability: windows.registry
      collection: check-registry-existence-v4tov4-tcp-collection
      assertion:
        existence: none_exist
        item_quantifier: only one
        state: null
  evaluate:
    all:
    - test: test-windows-11-not-have-portproxy-enabled-or-in-use
    - test: test-windows-11-not-have-portproxy-enabled-or-in-use-2
