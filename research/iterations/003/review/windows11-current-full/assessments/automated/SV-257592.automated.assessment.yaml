assessment:
  id: SV-257592.automated
  version: 18
  assessment_title: Windows 11 must not have portproxy enabled or in use.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    ensure-no-portproxies-configured-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: pattern match
          datatype: string
          mask: false
          value: SYSTEM\\CurrentControlSet\\Services\\PortProxy\\v.tov.\\.*
        name:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
      object_title: Ensure no portproxies are configured.
    check-registry-existence-v4tov4-tcp-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Services\PortProxy\v4tov4\tcp
        name:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
      object_title: Check registry for existence of v4tov4\tcp
  states: {}
  tests:
    test-windows-11-not-have-portproxy-enabled-or-in-use:
      test_title: Windows 11 must not have portproxy enabled or in use.
      capability: windows.registry
      object: ensure-no-portproxies-configured-object
      check_existence: none_exist
      check: only one
    test-windows-11-not-have-portproxy-enabled-or-in-use-2:
      test_title: Windows 11 must not have portproxy enabled or in use.
      capability: windows.registry
      object: check-registry-existence-v4tov4-tcp-object
      check_existence: none_exist
      check: only one
  evaluate:
    all:
    - test: test-windows-11-not-have-portproxy-enabled-or-in-use
    - test: test-windows-11-not-have-portproxy-enabled-or-in-use-2
