assessment:
  id: SV-253353.automated
  version: 2
  assessment_title: WN11-CC-000020 - IPv6 source routing must be configured to highest protection.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Services\Tcpip6\Parameters
        name:
          operation: equals
          datatype: string
          mask: false
          value: DisableIPSourceRouting
  tests:
    test-mss-disableipsourcerouting-ipv6-ip-source-routing-protection-level-protects-against:
      test_title: '''MSS: (DisableIPSourceRouting IPv6) IP source routing protection level (protects against packet
        spoofing)'' is set to ''Highest protection, source routing is completely disabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '2'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-mss-disableipsourcerouting-ipv6-ip-source-routing-protection-level-protects-against
