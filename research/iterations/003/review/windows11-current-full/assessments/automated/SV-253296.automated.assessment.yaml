assessment:
  id: SV-253296.automated
  version: 18
  assessment_title: The Windows 11 time service must synchronize with an appropriate DoW time source.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    review-windows-time-service-configuration-via-powershell-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: W32tm /query /configuration
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: '^Type:'
      object_title: Review the Windows time service configuration via PowerShell
  states:
    state-confirm-exitstatus-is-0-and-stdout-is-nt5ds:
      state_title: Confirm ExitStatus is 0 and stdout is NT5DS
      capability: independent.shellcommand
      state:
        all:
        - field: command
          value: W32tm /query /configuration
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: pattern
          value: '^Type:'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: NT5DS
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-review-windows-time-service-configuration-via-powershell:
      test_title: Review the Windows time service configuration via PowerShell
      capability: independent.shellcommand
      object: review-windows-time-service-configuration-via-powershell-object
      check_existence: only_one_exists
      check: only one
      states:
      - state-confirm-exitstatus-is-0-and-stdout-is-nt5ds
  evaluate:
    test: test-review-windows-time-service-configuration-via-powershell
