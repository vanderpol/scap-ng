assessment:
  id: SV-253494.automated
  version: 2
  assessment_title: WN11-UR-000085 - The "Deny log on locally" user right on workstations must be configured to
    prevent access from highly privileged domain accounts on domain systems and unauthenticated access on all systems.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-wmi57-collection:
      collection_title: null
      capability: windows.wmi57
      select:
        namespace:
          operation: equals
          datatype: string
          mask: false
          value: root\cimv2
        wql:
          operation: equals
          datatype: string
          mask: false
          value: SELECT DomainRole FROM win32_computersystem
    windows-userright-collection:
      collection_title: null
      capability: windows.userright
      select:
        userright:
          operation: equals
          datatype: string
          mask: false
          value: SE_DENY_INTERACTIVE_LOGON_NAME
  tests:
    test-system-non-dc-domain-joined-windows-server-or-workstation:
      test_title: The system is a non-DC domain-joined Windows server or workstation
      capability: windows.wmi57
      collection: windows-wmi57-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: Domain Member Workstation
          capability: windows.wmi57
          state:
            field: result
            value:
              record:
              - name: domainrole
                value: '1'
                operation: equals
                datatype: string
                mask: false
                entity_check: all
            operation: equals
            datatype: record
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: Domain Member Server
          capability: windows.wmi57
          state:
            field: result
            value:
              record:
              - name: domainrole
                value: '3'
                operation: equals
                datatype: string
                mask: false
                entity_check: all
            operation: equals
            datatype: record
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-deny-log-on-locally-domain-admins:
      test_title: Deny log on locally - Domain Admins
      capability: windows.userright
      collection: windows-userright-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: null
        state_capability: windows.userright
        state:
          field: trustee_name
          value: ^(?i)(.+\\)?Domain Admins$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-deny-log-on-locally-enterprise-admins:
      test_title: Deny log on locally - Enterprise Admins
      capability: windows.userright
      collection: windows-userright-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: null
        state_capability: windows.userright
        state:
          field: trustee_name
          value: ^(?i)(.+\\)?Enterprise Admins$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-deny-log-on-locally-guests:
      test_title: Deny log on locally - Guests
      capability: windows.userright
      collection: windows-userright-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: null
        state_capability: windows.userright
        state:
          field: trustee_name
          value: Guests
          operation: case insensitive equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-system-standalone-windows-server-or-workstation:
      test_title: The system is a standalone Windows server or workstation
      capability: windows.wmi57
      collection: windows-wmi57-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: Standalone Workstation
          capability: windows.wmi57
          state:
            field: result
            value:
              record:
              - name: domainrole
                value: '0'
                operation: equals
                datatype: string
                mask: false
                entity_check: all
            operation: equals
            datatype: record
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: Standalone Server
          capability: windows.wmi57
          state:
            field: result
            value:
              record:
              - name: domainrole
                value: '2'
                operation: equals
                datatype: string
                mask: false
                entity_check: all
            operation: equals
            datatype: record
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    any:
    - all:
      - test: test-system-non-dc-domain-joined-windows-server-or-workstation
      - test: test-deny-log-on-locally-domain-admins
      - test: test-deny-log-on-locally-enterprise-admins
      - test: test-deny-log-on-locally-guests
    - all:
      - test: test-system-standalone-windows-server-or-workstation
      - test: test-deny-log-on-locally-guests
