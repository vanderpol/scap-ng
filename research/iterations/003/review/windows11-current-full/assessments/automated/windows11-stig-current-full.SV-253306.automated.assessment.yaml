assessment:
  id: windows11-stig-current-full.SV-253306.automated
  version: 2
  assessment_title: WN11-AU-000005 - The system must be configured to audit Account Logon - Credential Validation
    failures.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-credential-validation-is-set-to-failure:
      state_title: '''Credential Validation'' is set to ''Failure'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: credential_validation
        value: AUDIT_FAILURE
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-credential-validation-is-set-to-success-and-failure:
      state_title: '''Credential Validation'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: credential_validation
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-credential-validation-set-failure:
      test_title: '''Audit Credential Validation'' is set to ''Failure'''
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-credential-validation-is-set-to-failure
    test-audit-credential-validation-set-success-failure:
      test_title: '''Audit Credential Validation'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-credential-validation-is-set-to-success-and-failure
  evaluate:
    any:
    - test: test-audit-credential-validation-set-failure
    - test: test-audit-credential-validation-set-success-failure
