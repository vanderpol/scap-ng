assessment:
  id: SV-253424.automated
  version: 3
  assessment_title: WN11-CC-000385 - Allow Windows Ink Workspace is Enabled with the option 'On, but disallow access
    above lock'
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    group-policy-registry-entry-windows-ink-workspace-collection:
      collection_title: Group Policy registry entry for Windows Ink Workspace
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\WindowsInkWorkspace
        name:
          operation: equals
          datatype: string
          mask: false
          value: AllowWindowsInkWorkspace
    intune-registry-entry-windows-ink-workspace-collection:
      collection_title: Intune registry entry for Windows Ink Workspace
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\PolicyManager\current\device\WindowsInkWorkspace
        name:
          operation: equals
          datatype: string
          mask: false
          value: AllowWindowsInkWorkspace
    registry-entries-windows-ink-workspace-collection:
      collection_title: Registry entries for Windows Ink Workspace
      set:
        operator: union
        members:
        - collection: group-policy-registry-entry-windows-ink-workspace-collection
        - collection: intune-registry-entry-windows-ink-workspace-collection
  tests:
    test-windows-ink-workspace-disallows-access-above-lock:
      test_title: Windows Ink Workspace disallows access above the lock
      capability: windows.registry
      collection: registry-entries-windows-ink-workspace-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-windows-ink-workspace-disallows-access-above-lock
