assessment:
  id: SV-253424.automated
  version: 3
  assessment_title: WN11-CC-000385 - Allow Windows Ink Workspace is Enabled with the option 'On, but disallow access
    above lock'
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    group-policy-registry-entry-windows-ink-workspace-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\WindowsInkWorkspace
        name:
          operation: equals
          datatype: string
          mask: false
          value: AllowWindowsInkWorkspace
      object_title: Group Policy registry entry for Windows Ink Workspace
    intune-registry-entry-windows-ink-workspace-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\PolicyManager\current\device\WindowsInkWorkspace
        name:
          operation: equals
          datatype: string
          mask: false
          value: AllowWindowsInkWorkspace
      object_title: Intune registry entry for Windows Ink Workspace
    registry-entries-windows-ink-workspace-object:
      capability: windows.registry
      set:
        operator: union
        members:
        - object: group-policy-registry-entry-windows-ink-workspace-object
        - object: intune-registry-entry-windows-ink-workspace-object
      object_title: Registry entries for Windows Ink Workspace
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-windows-ink-workspace-disallows-access-above-lock:
      test_title: Windows Ink Workspace disallows access above the lock
      capability: windows.registry
      object: registry-entries-windows-ink-workspace-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-windows-ink-workspace-disallows-access-above-lock
