assessment:
  id: SV-253339.automated
  version: 2
  assessment_title: WN11-AU-000510 - The System event log size must be configured to 32768 KB or greater.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      select:
        hive:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows\EventLog\System
        name:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: MaxSize
  tests:
    test-system-event-log-size-configured-32768-kb-or-greater:
      test_title: The System event log size is configured to 32768 KB or greater
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '32768'
            operation: greater than or equal
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-system-event-log-size-configured-32768-kb-or-greater
