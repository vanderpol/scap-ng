assessment:
  id: SV-253336.automated
  version: 2
  assessment_title: WN11-AU-000160 - The system must be configured to audit System - System Integrity successes.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-auditeventpolicysubcategories-collection:
      collection_title: null
      capability: windows.auditeventpolicysubcategories
  tests:
    test-audit-system-integrity-success-only:
      test_title: Audit - System Integrity - Success only
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: Audit - System Integrity - Success only
          capability: windows.auditeventpolicysubcategories
          state:
            field: system_integrity
            value: AUDIT_SUCCESS
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: Audit - System Integrity - Success and Failure
          capability: windows.auditeventpolicysubcategories
          state:
            field: system_integrity
            value: AUDIT_SUCCESS_FAILURE
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-audit-system-integrity-success-only
