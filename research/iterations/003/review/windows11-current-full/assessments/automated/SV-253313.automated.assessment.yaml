assessment:
  id: SV-253313.automated
  version: 2
  assessment_title: WN11-AU-000054 - The system must be configured to audit Logon/Logoff - Account Lockout failures.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-auditeventpolicysubcategories-collection:
      collection_title: null
  tests:
    test-audit-account-lockout-set-failure:
      test_title: '''Audit Account Lockout'' is set to ''Failure'''
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: '''Account Lockout'' is set to ''Failure'''
        state:
          field: account_lockout
          value: AUDIT_FAILURE
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-audit-account-lockout-set-success-failure:
      test_title: '''Audit Account Lockout'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: '''Account Lockout'' is set to ''Success'' and ''Failure'''
        state:
          field: account_lockout
          value: AUDIT_SUCCESS_FAILURE
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    any:
    - test: test-audit-account-lockout-set-failure
    - test: test-audit-account-lockout-set-success-failure
