assessment:
  id: SV-253445.automated
  version: 18
  assessment_title: The required legal notice must be configured to display before console logon.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    legal-notice-text-collection:
      collection_title: Legal notice text
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        name:
          operation: equals
          datatype: string
          mask: false
          value: LegalNoticeText
  tests:
    test-required-legal-notice-configured-display-before-console-logon-message-content:
      test_title: The required legal notice must be configured to display before console logon - Message Content
        1
      capability: windows.registry
      collection: legal-notice-text-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: only one
        state_title: Warning Banner - You are accessing a U.S. Government (USG) Information System (IS) that is
          provided for USG-authorized use only.
        state_capability: windows.registry
        state:
          field: value
          value: You are accessing a U.S. Government \(USG\) Information System \(IS\) that is provided for USG-authorized
            use only.
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-required-legal-notice-configured-display-before-console-logon-message-content-2:
      test_title: The required legal notice must be configured to display before console logon - Message Content
        2
      capability: windows.registry
      collection: legal-notice-text-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: only one
        state_title: 'Warning Banner - By using this IS (which includes any device attached to this IS), you consent
          to the following conditions:'
        state_capability: windows.registry
        state:
          field: value
          value: 'By using this IS \(which includes any device attached to this IS\), you consent to the following
            conditions:'
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-required-legal-notice-configured-display-before-console-logon-message-content-3:
      test_title: The required legal notice must be configured to display before console logon - Message Content
        3
      capability: windows.registry
      collection: legal-notice-text-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: only one
        state_title: Warning Banner - -The USG routinely intercepts and monitors communications on this IS for purposes
          including, but not limited to, penetration testing, COMSEC monitoring, network operations and defense,
          personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations.
        state_capability: windows.registry
        state:
          field: value
          value: -The USG routinely intercepts and monitors communications on this IS for purposes including, but
            not limited to, penetration testing, COMSEC monitoring, network operations and defense, personnel misconduct
            \(PM\), law enforcement \(LE\), and counterintelligence \(CI\) investigations.
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-required-legal-notice-configured-display-before-console-logon-message-content-4:
      test_title: The required legal notice must be configured to display before console logon - Message Content
        4
      capability: windows.registry
      collection: legal-notice-text-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: only one
        state_title: Warning Banner - -At any time, the USG may inspect and seize data stored on this IS.
        state_capability: windows.registry
        state:
          field: value
          value: -At any time, the USG may inspect and seize data stored on this IS.
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-required-legal-notice-configured-display-before-console-logon-message-content-5:
      test_title: The required legal notice must be configured to display before console logon - Message Content
        5
      capability: windows.registry
      collection: legal-notice-text-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: only one
        state_title: Warning Banner - -Communications using, or data stored on, this IS are not private, are subject
          to routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized purpose.
        state_capability: windows.registry
        state:
          field: value
          value: -Communications using, or data stored on, this IS are not private, are subject to routine monitoring,
            interception, and search, and may be disclosed or used for any USG-authorized purpose.
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-required-legal-notice-configured-display-before-console-logon-message-content-6:
      test_title: The required legal notice must be configured to display before console logon - Message Content
        6
      capability: windows.registry
      collection: legal-notice-text-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: only one
        state_title: Warning Banner - -This IS includes security measures (e.g., authentication and access controls)
          to protect USG interests--not for your personal benefit or privacy.
        state_capability: windows.registry
        state:
          field: value
          value: -This IS includes security measures \(e.g., authentication and access controls\) to protect USG
            interests--not for your personal benefit or privacy.
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-required-legal-notice-configured-display-before-console-logon-message-content-7:
      test_title: The required legal notice must be configured to display before console logon - Message Content
        7
      capability: windows.registry
      collection: legal-notice-text-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: only one
        state_title: Warning Banner - -Notwithstanding the above, using this IS does not constitute consent to PM,
          LE or CI investigative searching or monitoring of the content of privileged communications, or work product,
          related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants.
          Such communications and work product are private and confidential. See User Agreement for details.
        state_capability: windows.registry
        state:
          field: value
          value: -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI investigative
            searching or monitoring of the content of privileged communications, or work product, related to personal
            representation or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications
            and work product are private and confidential. See User Agreement for details.
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-required-legal-notice-configured-display-before-console-logon-message-content
    - test: test-required-legal-notice-configured-display-before-console-logon-message-content-2
    - test: test-required-legal-notice-configured-display-before-console-logon-message-content-3
    - test: test-required-legal-notice-configured-display-before-console-logon-message-content-4
    - test: test-required-legal-notice-configured-display-before-console-logon-message-content-5
    - test: test-required-legal-notice-configured-display-before-console-logon-message-content-6
    - test: test-required-legal-notice-configured-display-before-console-logon-message-content-7
