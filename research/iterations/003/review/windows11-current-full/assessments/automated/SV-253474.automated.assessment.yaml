assessment:
  id: SV-253474.automated
  version: 2
  assessment_title: WN11-SO-000270 - User Account Control must run all administrators in Admin Approval Mode, enabling
    UAC.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Microsoft\Windows\CurrentVersion\Policies\System
        name:
          operation: equals
          datatype: string
          mask: false
          value: EnableLUA
  tests:
    test-verifies-user-account-control-run-all-administrators-in-admin-approval:
      test_title: 'Verifies ''User Account Control: Run all administrators in Admin Approval Mode'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-verifies-user-account-control-run-all-administrators-in-admin-approval
