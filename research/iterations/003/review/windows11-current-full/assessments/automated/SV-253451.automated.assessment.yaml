assessment:
  id: SV-253451.automated
  version: 2
  assessment_title: WN11-SO-000120 - The Windows SMB server must be configured to always perform SMB packet signing.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SYSTEM\CurrentControlSet\Services\LanManServer\Parameters
        name:
          operation: equals
          datatype: string
          value: RequireSecuritySignature
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-microsoft-network-server-digitally-sign-communications-always-set-enabled:
      test_title: '''Microsoft network server: Digitally sign communications (always)'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-microsoft-network-server-digitally-sign-communications-always-set-enabled
