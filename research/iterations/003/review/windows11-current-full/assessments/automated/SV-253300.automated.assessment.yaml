assessment:
  id: SV-253300.automated
  version: 4
  assessment_title: WN11-AC-000020 - The password history must be configured to 24 passwords remembered.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-passwordpolicy-object:
      capability: windows.passwordpolicy
      object_title: null
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SOFTWARE\Microsoft\PolicyManager\current\device\DeviceLock
        name:
          operation: equals
          datatype: string
          value: DevicePasswordHistory
      object_title: null
  states:
    state-password-history-length-is-greater-than-or-equal-to-vari:
      state_title: Password History Length is greater than or equal to variable
      capability: windows.passwordpolicy
      state:
        field: password_hist_len
        value: '24'
        operation: greater than or equal
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '24'
          operation: greater than or equal
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-enforce-password-history-set-24-passwords-or-more:
      test_title: '''Enforce password history'' is set to ''24'' passwords or more'
      capability: windows.passwordpolicy
      object: windows-passwordpolicy-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-password-history-length-is-greater-than-or-equal-to-vari
    test-enforce-password-history-set-24-passwords-or-more-through-intune:
      test_title: '''Enforce password history'' is set to ''24'' passwords or more through Intune'
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    any:
    - test: test-enforce-password-history-set-24-passwords-or-more
    - test: test-enforce-password-history-set-24-passwords-or-more-through-intune
