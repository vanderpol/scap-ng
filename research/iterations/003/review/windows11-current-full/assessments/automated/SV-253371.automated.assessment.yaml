assessment:
  id: SV-253371.automated
  version: 18
  assessment_title: Virtualization-based protection of code integrity must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    deviceguard-securityservicesrunning-collection:
      collection_title: DeviceGuard SecurityServicesRunning
      select:
        module_name:
          operation: equals
          datatype: string
          mask: false
          value: CimCmdlets
        module_id:
          operation: equals
          datatype: string
          mask: false
          nil: true
          value: ''
        module_version:
          operation: equals
          datatype: version
          mask: false
          nil: true
          value: ''
        verb:
          operation: equals
          datatype: string
          mask: false
          value: Get
        noun:
          operation: equals
          datatype: string
          mask: false
          value: CimInstance
        parameters:
          operation: equals
          datatype: record
          mask: false
          value:
            record:
            - name: classname
              value: Win32_DeviceGuard
              operation: equals
              datatype: string
              mask: false
              entity_check: all
            - name: namespace
              value: root\Microsoft\Windows\DeviceGuard
              operation: equals
              datatype: string
              mask: false
              entity_check: all
        select:
          operation: equals
          datatype: record
          mask: false
          value:
            record:
            - name: property
              value: securityservicesrunning
              operation: equals
              datatype: string
              mask: false
              entity_check: all
  tests:
    test-verify-securityservicesrunning-includes-value-2:
      test_title: Verify SecurityServicesRunning includes a value of 2
      capability: windows.cmdlet
      collection: deviceguard-securityservicesrunning-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: SecurityServicesRunning equal to 2 as formatted array element
        state:
          field: value
          value:
            record:
            - name: securityservicesrunning
              value: '2'
              operation: pattern match
              datatype: string
              mask: false
              entity_check: all
          operation: equals
          datatype: record
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-verify-securityservicesrunning-includes-value-2
