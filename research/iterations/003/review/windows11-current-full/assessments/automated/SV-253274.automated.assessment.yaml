assessment:
  id: SV-253274.automated
  version: 18
  assessment_title: Permissions for system files and directories must conform to minimum requirements.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    everyoneincludesanonymous-configured-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SYSTEM\CurrentControlSet\Control\Lsa
        name:
          operation: equals
          datatype: string
          value: everyoneincludesanonymous
      object_title: everyoneincludesanonymous must be configured
    run-icacls-command-against-system-drive-root-directory-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: powershell
        command:
          operation: equals
          datatype: string
          value: icacls($env:SystemDrive + '\')
        pattern:
          operation: equals
          datatype: string
          value: ':'
      object_title: Run Icacls command against system drive root directory
    run-icacls-command-against-windows-install-directory-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: powershell
        command:
          operation: equals
          datatype: string
          value: icacls($env:windir)
        pattern:
          operation: equals
          datatype: string
          value: ':'
      object_title: Run Icacls command against Windows install directory
    run-icacls-command-against-program-files-directory-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: powershell
        command:
          operation: equals
          datatype: string
          value: icacls (Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion" -Name ProgramFilesDir).ProgramFilesDir
        pattern:
          operation: equals
          datatype: string
          value: ':'
      object_title: Run Icacls command against Program Files directory
    run-icacls-command-against-program-files-x86-directory-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: powershell
        command:
          operation: equals
          datatype: string
          value: icacls (Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion" -Name 'ProgramFilesDir
            (x86)').'ProgramFilesDir (x86)'
        pattern:
          operation: equals
          datatype: string
          value: ':'
      object_title: Run Icacls command against Program Files (x86) directory
  variables:
    required-permissions-variable:
      title: Required Permissions
      kind: constant
      datatype: string
      expression:
        literal:
        - (?i)S-1-15-3-65536-1888954469-739942743-1668119174-2468466756-4239452838-1296943325-355587736-700089176:\(S,RD,X,RA\)
        - (?i)NT AUTHORITY\\SYSTEM:\(OI\)\(CI\)\(F\)
        - (?i)BUILTIN\\Administrators:\(OI\)\(CI\)\(F\)
        - (?i)BUILTIN\\Users:\(OI\)\(CI\)\(RX\)
        - (?i)NT AUTHORITY\\Authenticated Users:\(OI\)\(CI\)\(IO\)\(M\)
        - (?i)NT AUTHORITY\\Authenticated Users:\(AD\)
        - (?i)Mandatory Label\\High Mandatory Level:\(OI\)\(NP\)\(IO\)\(NW\)
    required-permissions-variable-2:
      title: Required Permissions
      kind: constant
      datatype: string
      expression:
        literal:
        - (?i)NT SERVICE\\TrustedInstaller:\(F\)
        - (?i)NT SERVICE\\TrustedInstaller:\(CI\)\(IO\)\(F\)
        - (?i)NT AUTHORITY\\SYSTEM:\(M\)
        - (?i)NT AUTHORITY\\SYSTEM:\(OI\)\(CI\)\(IO\)\(F\)
        - (?i)BUILTIN\\Administrators:\(M\)
        - (?i)BUILTIN\\Administrators:\(OI\)\(CI\)\(IO\)\(F\)
        - (?i)BUILTIN\\Users:\(RX\)
        - (?i)BUILTIN\\Users:\(OI\)\(CI\)\(IO\)\(GR,GE\)
        - (?i)CREATOR OWNER:\(OI\)\(CI\)\(IO\)\(F\)
        - (?i)APPLICATION PACKAGE AUTHORITY\\ALL APPLICATION PACKAGES:\(RX\)
        - (?i)APPLICATION PACKAGE AUTHORITY\\ALL APPLICATION PACKAGES:\(OI\)\(CI\)\(IO\)\(GR,GE\)
        - (?i)APPLICATION PACKAGE AUTHORITY\\ALL RESTRICTED APPLICATION PACKAGES:\(RX\)
        - (?i)APPLICATION PACKAGE AUTHORITY\\ALL RESTRICTED APPLICATION PACKAGES:\(OI\)\(CI\)\(IO\)\(GR,GE\)
  states:
    state-value-must-be-equal-to-0:
      state_title: Value must be equal to 0
      capability: windows.registry
      state:
        field: value
        value: '0'
        operation: equals
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
    state-permissions-must-equal-expected-output:
      state_title: Permissions must equal expected output
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value:
            variable: required-permissions-variable
          operation: pattern match
          datatype: string
          variable_check: at least one
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stderr_line
          value: ''
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: none_exist
    state-permissions-must-equal-expected-output-2:
      state_title: Permissions must equal expected output
      capability: independent.shellcommand
      state:
        all:
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value:
            variable: required-permissions-variable-2
          operation: pattern match
          datatype: string
          variable_check: at least one
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stderr_line
          value: ''
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: none_exist
  tests:
    test-network-access-let-everyone-permissions-apply-anonymous-users-set-disabled:
      test_title: 'Network access: Let Everyone permissions apply to anonymous users is set to ''Disabled'''
      capability: windows.registry
      object: everyoneincludesanonymous-configured-object
      check_existence: at_least_one_exists
      check: only one
      states:
      - state-value-must-be-equal-to-0
    test-system-drive-root-directory-permissions-conform-minimum-requirements:
      test_title: System drive root directory permissions must conform to minimum requirements.
      capability: independent.shellcommand
      object: run-icacls-command-against-system-drive-root-directory-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-permissions-must-equal-expected-output
    test-windows-installation-directory-permissions-conform-minimum-requirements:
      test_title: Windows installation directory permissions must conform to minimum requirements.
      capability: independent.shellcommand
      object: run-icacls-command-against-windows-install-directory-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-permissions-must-equal-expected-output-2
    test-program-files-directory-permissions-conform-minimum-requirements:
      test_title: Program Files directory permissions must conform to minimum requirements.
      capability: independent.shellcommand
      object: run-icacls-command-against-program-files-directory-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-permissions-must-equal-expected-output-2
    test-program-files-x86-directory-permissions-conform-minimum-requirements:
      test_title: Program Files (x86) directory permissions must conform to minimum requirements.
      capability: independent.shellcommand
      object: run-icacls-command-against-program-files-x86-directory-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-permissions-must-equal-expected-output-2
  evaluate:
    all:
    - test: test-network-access-let-everyone-permissions-apply-anonymous-users-set-disabled
    - test: test-system-drive-root-directory-permissions-conform-minimum-requirements
    - test: test-windows-installation-directory-permissions-conform-minimum-requirements
    - test: test-program-files-directory-permissions-conform-minimum-requirements
    - test: test-program-files-x86-directory-permissions-conform-minimum-requirements
