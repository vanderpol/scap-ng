assessment:
  id: windows11-stig-current-full.SV-253477.automated
  version: 2
  assessment_title: WN11-UC-000015 - Toast notifications to the lock screen must be turned off.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-ntuser-object:
      capability: windows.ntuser
      select:
        key:
          operation: equals
          datatype: string
          value: Software\Policies\Microsoft\Windows\CurrentVersion\PushNotifications
        name:
          operation: equals
          datatype: string
          value: NoToastApplicationNotificationOnLockScreen
      filters:
      - action: exclude
        state: state-windows-ntuser-2
      - action: exclude
        state: state-windows-ntuser-3
      object_title: null
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_CURRENT_USER
        key:
          operation: equals
          datatype: string
          value: Software\Policies\Microsoft\Windows\CurrentVersion\PushNotifications
        name:
          operation: equals
          datatype: string
          value: NoToastApplicationNotificationOnLockScreen
      object_title: null
  states:
    state-windows-ntuser:
      state_title: null
      capability: windows.ntuser
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
    state-windows-ntuser-2:
      state_title: null
      capability: windows.ntuser
      state:
        field: enabled
        value: 'false'
        operation: equals
        datatype: boolean
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-ntuser-3:
      state_title: null
      capability: windows.ntuser
      state:
        field: days_since_modified
        value: '35'
        operation: greater than
        datatype: int
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-turn-off-toast-notifications-on-lock-screen-set-enabled:
      test_title: '''Turn off toast notifications on the lock screen'' is set to ''Enabled'''
      capability: windows.ntuser
      object: windows-ntuser-object
      check_existence: all_exist
      check: all
      states:
      - state-windows-ntuser
    test-current-user-turn-off-toast-notifications-on-lock-screen-set:
      test_title: For the current user, 'Turn off toast notifications on the lock screen' is set to 'Enabled'
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    all:
    - test: test-turn-off-toast-notifications-on-lock-screen-set-enabled
    - test: test-current-user-turn-off-toast-notifications-on-lock-screen-set
