assessment:
  id: SV-278928.automated
  version: 2
  assessment_title: WN11-AU-000583 - Windows 11 must be configured to audit handle manipulation failures.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-auditeventpolicysubcategories-collection:
      collection_title: null
      capability: windows.auditeventpolicysubcategories
  tests:
    test-audit-handle-manipulation-set-failure:
      test_title: '''Audit Handle Manipulation'' is set to ''Failure'''
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: '''Handle Manipulation'' is set to ''Failure'''
        state_capability: windows.auditeventpolicysubcategories
        state:
          field: handle_manipulation
          value: AUDIT_FAILURE
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-audit-handle-manipulation-set-success-failure:
      test_title: '''Audit Handle Manipulation'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: '''Handle Manipulation'' is set to ''Success'' and ''Failure'''
        state_capability: windows.auditeventpolicysubcategories
        state:
          field: handle_manipulation
          value: AUDIT_SUCCESS_FAILURE
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    any:
    - test: test-audit-handle-manipulation-set-failure
    - test: test-audit-handle-manipulation-set-success-failure
