assessment:
  id: SV-253435.automated
  version: 2
  assessment_title: WN11-SO-000020 - The built-in administrator account must be renamed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    built-in-administrator-sid-object:
      capability: windows.sid_sid
      select:
        trustee_sid:
          operation: pattern match
          datatype: string
          value: ^S-1-5-[0-9-]+-500$
      object_title: Built-in Administrator SID
  variables:
    localdomain-administrator-variable:
      title: localdomain\Administrator
      kind: local
      datatype: string
      expression:
        concat:
        - values:
            object: built-in-administrator-sid-object
            field: trustee_domain
        - literal:
            value: \Administrator
            datatype: string
  states:
    state-not-administrator:
      state_title: Not Administrator
      capability: windows.sid_sid
      state:
        field: trustee_name
        value: Administrator
        operation: case insensitive not equal
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-not-localdomain-administrator:
      state_title: Not localdomain\Administrator
      capability: windows.sid_sid
      state:
        field: trustee_name
        value:
          variable: localdomain-administrator-variable
        operation: case insensitive not equal
        datatype: string
        variable_check: all
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-accounts-rename-administrator-account-not-set-administrator-or-localdomain-administrator:
      test_title: '''Accounts: Rename administrator account'' is not set to ''Administrator'' or ''localdomain\Administrator'''
      capability: windows.sid_sid
      object: built-in-administrator-sid-object
      check_existence: any_exist
      check: all
      state_operator: AND
      states:
      - state-not-administrator
      - state-not-localdomain-administrator
  evaluate:
    test: test-accounts-rename-administrator-account-not-set-administrator-or-localdomain-administrator
