assessment:
  id: windows11-stig-current-full.SV-253279.automated
  version: 2
  assessment_title: WN11-00-000120 - The TFTP Client must not be installed on the system.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-wmi57-object:
      capability: windows.wmi57
      select:
        namespace:
          operation: equals
          datatype: string
          value: root\cimv2
        wql:
          operation: equals
          datatype: string
          value: SELECT installstate FROM win32_optionalfeature WHERE name = 'TFTP'
      object_title: null
  states:
    state-windows-wmi57:
      state_title: null
      capability: windows.wmi57
      state:
        field: result
        value:
          record:
          - name: installstate
            value: '2'
            operation: equals
            datatype: string
            entity_check: all
        operation: equals
        datatype: record
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-tftp-client-not-installed-on-system:
      test_title: The TFTP Client is not installed on the system
      capability: windows.wmi57
      object: windows-wmi57-object
      check_existence: any_exist
      check: all
      states:
      - state-windows-wmi57
  evaluate:
    test: test-tftp-client-not-installed-on-system
