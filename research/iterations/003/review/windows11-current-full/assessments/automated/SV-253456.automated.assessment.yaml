assessment:
  id: SV-253456.automated
  version: 2
  assessment_title: WN11-SO-000165 - Anonymous access to Named Pipes and Shares must be restricted.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters
        name:
          operation: equals
          datatype: string
          mask: false
          value: restrictnullsessaccess
  tests:
    test-network-access-restrict-anonymous-access-named-pipes-shares-set-enabled:
      test_title: '''Network access: Restrict anonymous access to Named Pipes and Shares'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-network-access-restrict-anonymous-access-named-pipes-shares-set-enabled
