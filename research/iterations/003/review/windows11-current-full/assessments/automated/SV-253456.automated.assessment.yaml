assessment:
  id: SV-253456.automated
  version: 2
  assessment_title: WN11-SO-000165 - Anonymous access to Named Pipes and Shares must be restricted.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters
        name:
          operation: equals
          datatype: string
          mask: false
          value: restrictnullsessaccess
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-network-access-restrict-anonymous-access-named-pipes-shares-set-enabled:
      test_title: '''Network access: Restrict anonymous access to Named Pipes and Shares'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-network-access-restrict-anonymous-access-named-pipes-shares-set-enabled
