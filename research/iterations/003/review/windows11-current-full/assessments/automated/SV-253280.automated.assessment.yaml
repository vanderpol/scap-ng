assessment:
  id: SV-253280.automated
  version: 18
  assessment_title: Software certificate installation files must be removed from Windows 11.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    search-p12-files-object:
      capability: windows.file
      select:
        path:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: \.[Pp]12$
      filters:
      - action: exclude
        state: state-preflight-p12-adobe-file-should-not-report-failure
      - action: exclude
        state: state-ewallet-p12-oracle-wallet-manager-should-not-report-fail
      behaviors:
        max_depth: '-1'
        recurse_direction: down
      object_title: Search for .p12 files
    search-pfx-files-object:
      capability: windows.file
      select:
        path:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
        filename:
          operation: pattern match
          datatype: string
          mask: false
          value: \.[Pp][Ff][Xx]$
      behaviors:
        max_depth: '-1'
        recurse_direction: down
      object_title: Search for .pfx files
  states:
    state-preflight-p12-adobe-file-should-not-report-failure:
      state_title: Preflight.p12 Adobe file should not report failure
      capability: windows.file
      state:
        field: filepath
        value: '[Aa]dobe.+Preflight\.p12$'
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-ewallet-p12-oracle-wallet-manager-should-not-report-fail:
      state_title: ewallet.p12 Oracle Wallet Manager should not report failure
      capability: windows.file
      state:
        field: filepath
        value: '[Ee]wallet\.p12$'
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-software-certificate-installation-files-removed-p12-files:
      test_title: Software certificate installation files must be removed. .p12 files
      capability: windows.file
      object: search-p12-files-object
      check_existence: none_exist
      check: all
    test-software-certificate-installation-files-removed-pfx-files:
      test_title: Software certificate installation files must be removed. .pfx files
      capability: windows.file
      object: search-pfx-files-object
      check_existence: none_exist
      check: all
  evaluate:
    all:
    - test: test-software-certificate-installation-files-removed-p12-files
    - test: test-software-certificate-installation-files-removed-pfx-files
