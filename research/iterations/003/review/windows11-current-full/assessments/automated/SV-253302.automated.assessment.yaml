assessment:
  id: SV-253302.automated
  version: 2
  assessment_title: WN11-AC-000030 - The minimum password age must be configured to at least 1 day.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-passwordpolicy-collection:
      collection_title: null
  tests:
    test-minimum-password-age-set-at-least-1-day:
      test_title: '''Minimum Password Age'' is set to at least ''1'' day'
      capability: windows.passwordpolicy
      collection: windows-passwordpolicy-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          field: min_passwd_age
          value: '86400'
          operation: greater than or equal
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-minimum-password-age-set-at-least-1-day
