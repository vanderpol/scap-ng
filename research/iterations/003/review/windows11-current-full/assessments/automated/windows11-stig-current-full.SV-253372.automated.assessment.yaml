assessment:
  id: windows11-stig-current-full.SV-253372.automated
  version: 2
  assessment_title: WN11-CC-000085 - Early Launch Antimalware, Boot-Start Driver Initialization Policy must prevent
    boot drivers.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: System\CurrentControlSet\Policies\EarlyLaunch
        name:
          operation: equals
          datatype: string
          value: DriverLoadPolicy
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
    state-windows-registry-2:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '3'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
    state-reg-dword-type-and-value-equals-8:
      state_title: Reg_Dword type and value equals 8
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '8'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-boot-start-driver-initialization-policy-not-set-enabled-all-selected:
      test_title: '''Boot-Start Driver Initialization Policy'' is not set to ''Enabled'' with ''All'' selected'
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-windows-registry
      - state-windows-registry-2
      - state-reg-dword-type-and-value-equals-8
  evaluate:
    test: test-boot-start-driver-initialization-policy-not-set-enabled-all-selected
