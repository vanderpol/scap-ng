assessment:
  id: SV-253397.automated
  version: 2
  assessment_title: WN11-CC-000220 - File Explorer heap termination on corruption must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows\Explorer
        name:
          operation: equals
          datatype: string
          mask: false
          value: NoHeapTerminationOnCorruption
  tests:
    test-turn-off-heap-termination-on-corruption-set-not-configured-or:
      test_title: '''Turn off heap termination on corruption'' is set to ''Not Configured'' or ''Disabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: null
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-turn-off-heap-termination-on-corruption-set-not-configured-or
