assessment:
  id: SV-253350.automated
  version: 18
  assessment_title: Camera access from the lock screen must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    prevent-enabling-lock-screen-camera-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows\Personalization
        name:
          operation: equals
          datatype: string
          mask: false
          value: NoLockScreenCamera
      object_title: Prevent enabling lock screen camera
  states:
    state-value-equal-to-1:
      state_title: Value Equal To 1
      capability: windows.registry
      state:
        field: value
        value: '1'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-camera-access-from-lock-screen-disabled:
      test_title: Camera access from the lock screen must be disabled.
      capability: windows.registry
      object: prevent-enabling-lock-screen-camera-object
      check_existence: at_least_one_exists
      check: only one
      states:
      - state-value-equal-to-1
  evaluate:
    test: test-camera-access-from-lock-screen-disabled
