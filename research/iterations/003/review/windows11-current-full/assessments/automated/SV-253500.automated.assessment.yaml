assessment:
  id: SV-253500.automated
  version: 2
  assessment_title: WN11-UR-000125 - The "Lock pages in memory" user right must not be assigned to any groups or
    accounts.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-userright-object:
      capability: windows.userright
      select:
        userright:
          operation: equals
          datatype: string
          mask: false
          value: SE_LOCK_MEMORY_NAME
      object_title: null
  states:
    state-windows-userright:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: ''
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-lock-pages-in-memory-none:
      test_title: Lock pages in memory - None
      capability: windows.userright
      object: windows-userright-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-userright
  evaluate:
    test: test-lock-pages-in-memory-none
