assessment:
  id: SV-253500.automated
  version: 2
  assessment_title: WN11-UR-000125 - The "Lock pages in memory" user right must not be assigned to any groups or
    accounts.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-userright-collection:
      collection_title: null
      select:
        userright:
          operation: equals
          datatype: string
          mask: false
          value: SE_LOCK_MEMORY_NAME
  tests:
    test-lock-pages-in-memory-none:
      test_title: Lock pages in memory - None
      capability: windows.userright
      collection: windows-userright-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          field: trustee_name
          value: ''
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-lock-pages-in-memory-none
