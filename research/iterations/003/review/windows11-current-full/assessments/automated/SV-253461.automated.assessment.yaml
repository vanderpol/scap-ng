assessment:
  id: SV-253461.automated
  version: 2
  assessment_title: WN11-SO-000195 - The system must be configured to prevent the storage of the LAN Manager hash
    of passwords.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    check-contents-hklm-system-currentcontrolset-control-lsa-nolmhash-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Control\Lsa
        name:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: NoLMHash
      object_title: Check the contents of HKLM\System\CurrentControlSet\Control\Lsa\NoLMHash
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-network-security-do-not-store-lan-manager-hash-value-on:
      test_title: '''Network security: Do not store LAN Manager hash value on next password change'' is set to ''Enabled'''
      capability: windows.registry
      object: check-contents-hklm-system-currentcontrolset-control-lsa-nolmhash-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-network-security-do-not-store-lan-manager-hash-value-on
