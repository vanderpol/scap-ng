assessment:
  id: SV-253495.automated
  version: 2
  assessment_title: WN11-UR-000090 - The "Deny log on through Remote Desktop Services" user right on Windows 11
    workstations must be configured to prevent access from highly privileged domain accounts and local accounts
    on domain systems and unauthenticated access on all systems.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-wmi57-object:
      capability: windows.wmi57
      select:
        namespace:
          operation: equals
          datatype: string
          mask: false
          value: root\cimv2
        wql:
          operation: equals
          datatype: string
          mask: false
          value: SELECT DomainRole FROM win32_computersystem
      object_title: null
    windows-userright-object:
      capability: windows.userright
      select:
        userright:
          operation: equals
          datatype: string
          mask: false
          value: SE_DENY_REMOTE_INTERACTIVE_LOGON_NAME
      object_title: null
  states:
    state-domain-member-workstation:
      state_title: Domain Member Workstation
      capability: windows.wmi57
      state:
        field: result
        value:
          record:
          - name: domainrole
            value: '1'
            operation: equals
            datatype: string
            mask: false
            entity_check: all
        operation: equals
        datatype: record
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-domain-member-server:
      state_title: Domain Member Server
      capability: windows.wmi57
      state:
        field: result
        value:
          record:
          - name: domainrole
            value: '3'
            operation: equals
            datatype: string
            mask: false
            entity_check: all
        operation: equals
        datatype: record
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-userright:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: ^(?i)(NT Authority\\)?Local account$
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-userright-2:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: Guests
        operation: case insensitive equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-userright-3:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: ^(?i)(.+\\)?Domain Admins$
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-userright-4:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: ^(?i)(.+\\)?Enterprise Admins$
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-standalone-workstation:
      state_title: Standalone Workstation
      capability: windows.wmi57
      state:
        field: result
        value:
          record:
          - name: domainrole
            value: '0'
            operation: equals
            datatype: string
            mask: false
            entity_check: all
        operation: equals
        datatype: record
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-standalone-server:
      state_title: Standalone Server
      capability: windows.wmi57
      state:
        field: result
        value:
          record:
          - name: domainrole
            value: '2'
            operation: equals
            datatype: string
            mask: false
            entity_check: all
        operation: equals
        datatype: record
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-userright-5:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: Everyone
        operation: case insensitive equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-non-dc-domain-joined-windows-server-or-workstation:
      test_title: The system is a non-DC domain-joined Windows server or workstation
      capability: windows.wmi57
      object: windows-wmi57-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-domain-member-workstation
      - state-domain-member-server
    test-deny-log-on-through-remote-desktop-services-local-account:
      test_title: Deny log on through Remote Desktop Services - Local account
      capability: windows.userright
      object: windows-userright-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-windows-userright
    test-deny-log-on-through-remote-desktop-services-guests:
      test_title: Deny log on through Remote Desktop Services - Guests
      capability: windows.userright
      object: windows-userright-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-windows-userright-2
    test-deny-log-on-through-remote-desktop-services-domain-admins:
      test_title: Deny log on through Remote Desktop Services - Domain Admins
      capability: windows.userright
      object: windows-userright-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-windows-userright-3
    test-deny-log-on-through-remote-desktop-services-enterprise-admins:
      test_title: Deny log on through Remote Desktop Services - Enterprise Admins
      capability: windows.userright
      object: windows-userright-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-windows-userright-4
    test-system-standalone-windows-server-or-workstation:
      test_title: The system is a standalone Windows server or workstation
      capability: windows.wmi57
      object: windows-wmi57-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-standalone-workstation
      - state-standalone-server
    test-deny-log-on-through-remote-desktop-services-everyone:
      test_title: Deny log on through Remote Desktop Services - Everyone
      capability: windows.userright
      object: windows-userright-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-windows-userright-5
  evaluate:
    any:
    - all:
      - test: test-system-non-dc-domain-joined-windows-server-or-workstation
      - test: test-deny-log-on-through-remote-desktop-services-local-account
      - test: test-deny-log-on-through-remote-desktop-services-guests
      - test: test-deny-log-on-through-remote-desktop-services-domain-admins
      - test: test-deny-log-on-through-remote-desktop-services-enterprise-admins
    - all:
      - test: test-system-standalone-windows-server-or-workstation
      - test: test-deny-log-on-through-remote-desktop-services-guests
    - test: test-deny-log-on-through-remote-desktop-services-everyone
