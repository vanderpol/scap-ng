assessment:
  id: SV-253314.automated
  version: 2
  assessment_title: WN11-AU-000060 - The system must be configured to audit Logon/Logoff - Group Membership successes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-audit-group-membership-is-set-to-success:
      state_title: '''Audit Group Membership'' is set to ''Success'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: group_membership
        value: AUDIT_SUCCESS
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-audit-group-membership-is-set-to-success-and-failure:
      state_title: '''Audit Group Membership'' is set to ''Success and Failure'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: group_membership
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-logon-logoff-group-membership-success-only:
      test_title: Audit - Logon/Logoff - Group Membership - Success Only
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-audit-group-membership-is-set-to-success
    test-audit-logon-logoff-group-membership-success-failure:
      test_title: Audit - Logon/Logoff - Group Membership - Success and Failure
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-audit-group-membership-is-set-to-success-and-failure
  evaluate:
    any:
    - test: test-audit-logon-logoff-group-membership-success-only
    - test: test-audit-logon-logoff-group-membership-success-failure
