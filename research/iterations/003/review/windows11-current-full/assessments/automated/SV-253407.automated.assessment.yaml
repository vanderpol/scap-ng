assessment:
  id: SV-253407.automated
  version: 2
  assessment_title: WN11-CC-000295 - Attachments must be prevented from being downloaded from RSS feeds.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Internet Explorer\Feeds
        name:
          operation: equals
          datatype: string
          mask: false
          value: DisableEnclosureDownload
  tests:
    test-prevent-downloading-enclosures-set-enabled:
      test_title: '''Prevent downloading of enclosures'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-prevent-downloading-enclosures-set-enabled
