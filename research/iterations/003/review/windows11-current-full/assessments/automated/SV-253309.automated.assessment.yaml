assessment:
  id: SV-253309.automated
  version: 2
  assessment_title: WN11-AU-000035 - The system must be configured to audit Account Management - User Account Management
    failures.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-user-account-management-is-set-to-failure:
      state_title: '''User Account Management'' is set to ''Failure'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: user_account_management
        value: AUDIT_FAILURE
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-user-account-management-is-set-to-success-and-failure:
      state_title: '''User Account Management'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: user_account_management
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-user-account-management-set-failure:
      test_title: '''Audit User Account Management'' is set to ''Failure'''
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-user-account-management-is-set-to-failure
    test-audit-user-account-management-set-success-failure:
      test_title: '''Audit User Account Management'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-user-account-management-is-set-to-success-and-failure
  evaluate:
    any:
    - test: test-audit-user-account-management-set-failure
    - test: test-audit-user-account-management-set-success-failure
