assessment:
  id: SV-253422.automated
  version: 2
  assessment_title: WN11-CC-000365 - Windows 11 must be configured to prevent Windows apps from being activated
    by voice while the system is locked.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows\AppPrivacy
        name:
          operation: equals
          datatype: string
          mask: false
          value: LetAppsActivateWithVoice
    windows-registry-collection-2:
      collection_title: null
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows\AppPrivacy
        name:
          operation: equals
          datatype: string
          mask: false
          value: LetAppsActivateWithVoiceAboveLock
  tests:
    test-let-windows-apps-activate-voice-set-enabled-default-all-apps:
      test_title: '''Let Windows apps activate with voice'' is set to ''Enabled'' with ''Default for all Apps''
        set to ''Force Deny'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '2'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-let-windows-apps-activate-voice-while-system-locked-set-enabled:
      test_title: '''Let Windows apps activate with voice while the system is locked'' is set to ''Enabled'' with
        ''Default for all Apps'' set to ''Force Deny'''
      capability: windows.registry
      collection: windows-registry-collection-2
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '2'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    any:
    - test: test-let-windows-apps-activate-voice-set-enabled-default-all-apps
    - test: test-let-windows-apps-activate-voice-while-system-locked-set-enabled
