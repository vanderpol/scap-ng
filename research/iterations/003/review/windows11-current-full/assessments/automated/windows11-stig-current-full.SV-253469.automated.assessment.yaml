assessment:
  id: windows11-stig-current-full.SV-253469.automated
  version: 2
  assessment_title: WN11-SO-000250 - User Account Control must prompt administrators for consent on the secure desktop.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        name:
          operation: equals
          datatype: string
          value: ConsentPromptBehaviorAdmin
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '2'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-user-account-control-behavior-elevation-prompt-administrators-in-admin-approval:
      test_title: '''User Account Control: Behavior of the elevation prompt for administrators in Admin Approval
        Mode'' is set to ''Prompt for consent on the secure desktop'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-user-account-control-behavior-elevation-prompt-administrators-in-admin-approval
