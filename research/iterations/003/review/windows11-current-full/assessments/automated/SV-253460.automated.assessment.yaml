assessment:
  id: SV-253460.automated
  version: 2
  assessment_title: WN11-SO-000190 - Kerberos encryption types must be configured to prevent the use of DES and
    RC4 encryption suites.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Kerberos\Parameters
        name:
          operation: equals
          datatype: string
          value: SupportedEncryptionTypes
      object_title: null
  states:
    state-reg-dword-type-and-value-equals-2147483640-for-aes128-hm:
      state_title: Reg_Dword type and value equals 2147483640 for AES128_HMAC_SHA1, AES256_HMAC_SHA1, and Future_Encryption_Types
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '2147483640'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-network-security-configure-encryption-types-allowed-kerberos-set-enabled-aes128:
      test_title: '''Network Security: Configure encryption types allowed for Kerberos'' is set to ''Enabled'' with
        ''AES128_HMAC_SHA1'', ''AES256_HMAC_SHA1'', ''Future encryption types'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-dword-type-and-value-equals-2147483640-for-aes128-hm
  evaluate:
    test: test-network-security-configure-encryption-types-allowed-kerberos-set-enabled-aes128
