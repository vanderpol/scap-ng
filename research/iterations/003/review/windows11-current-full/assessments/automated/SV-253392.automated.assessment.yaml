assessment:
  id: SV-253392.automated
  version: 18
  assessment_title: Enhanced diagnostic data must be limited to the minimum required to support Windows Analytics.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    datacollection-limitenhanceddiagnosticdatawindowsanalytics-setting-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows\DataCollection
        name:
          operation: equals
          datatype: string
          mask: false
          value: LimitEnhancedDiagnosticDataWindowsAnalytics
      object_title: DataCollection LimitEnhancedDiagnosticDataWindowsAnalytics Setting
    datacollection-allowtelemetry-setting-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows\DataCollection
        name:
          operation: equals
          datatype: string
          mask: false
          value: AllowTelemetry
      object_title: DataCollection AllowTelemetry Setting
  states:
    state-value-equal-to-1:
      state_title: Value Equal To 1
      capability: windows.registry
      state:
        field: value
        value: '1'
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-value-equal-to-1-2:
      state_title: Value Equal To 1
      capability: windows.registry
      state:
        field: value
        value: '1'
        operation: less than or equal
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-enhanced-diagnostic-data-limited-minimum-required-support-windows-analytics:
      test_title: Enhanced diagnostic data must be limited to the minimum required to support Windows Analytics.
      capability: windows.registry
      object: datacollection-limitenhanceddiagnosticdatawindowsanalytics-setting-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-value-equal-to-1
    test-enhanced-diagnostic-data-limited-minimum-required-support-windows-analytics-2:
      test_title: Enhanced diagnostic data must be limited to the minimum required to support Windows Analytics.
      capability: windows.registry
      object: datacollection-allowtelemetry-setting-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-value-equal-to-1-2
  evaluate:
    any:
    - test: test-enhanced-diagnostic-data-limited-minimum-required-support-windows-analytics
    - test: test-enhanced-diagnostic-data-limited-minimum-required-support-windows-analytics-2
