assessment:
  id: SV-253392.automated
  version: 18
  assessment_title: Enhanced diagnostic data must be limited to the minimum required to support Windows Analytics.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    datacollection-limitenhanceddiagnosticdatawindowsanalytics-setting-collection:
      collection_title: DataCollection LimitEnhancedDiagnosticDataWindowsAnalytics Setting
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows\DataCollection
        name:
          operation: equals
          datatype: string
          mask: false
          value: LimitEnhancedDiagnosticDataWindowsAnalytics
    datacollection-allowtelemetry-setting-collection:
      collection_title: DataCollection AllowTelemetry Setting
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows\DataCollection
        name:
          operation: equals
          datatype: string
          mask: false
          value: AllowTelemetry
  tests:
    test-enhanced-diagnostic-data-limited-minimum-required-support-windows-analytics:
      test_title: Enhanced diagnostic data must be limited to the minimum required to support Windows Analytics.
      capability: windows.registry
      collection: datacollection-limitenhanceddiagnosticdatawindowsanalytics-setting-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: Value Equal To 1
        state:
          field: value
          value: '1'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-enhanced-diagnostic-data-limited-minimum-required-support-windows-analytics-2:
      test_title: Enhanced diagnostic data must be limited to the minimum required to support Windows Analytics.
      capability: windows.registry
      collection: datacollection-allowtelemetry-setting-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: at least one
        state_title: Value Equal To 1
        state:
          field: value
          value: '1'
          operation: less than or equal
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    any:
    - test: test-enhanced-diagnostic-data-limited-minimum-required-support-windows-analytics
    - test: test-enhanced-diagnostic-data-limited-minimum-required-support-windows-analytics-2
