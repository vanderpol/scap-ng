assessment:
  id: SV-253348.automated
  version: 2
  assessment_title: WN11-AU-000575 - Windows 11 must be configured to audit MPSSVC Rule-Level Policy Change Successes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-mpssvc-rule-level-policy-change-is-set-to-success:
      state_title: '''MPSSVC Rule-Level Policy Change'' is set to ''Success'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: mpssvc_rule_level_policy_change
        value: AUDIT_SUCCESS
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-mpssvc-rule-level-policy-change-is-set-to-success-and-fa:
      state_title: '''MPSSVC Rule-Level Policy Change'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: mpssvc_rule_level_policy_change
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-mpssvc-rule-level-policy-change-set-success-or-success:
      test_title: '''Audit MPSSVC Rule-Level Policy Change'' is set to ''Success'' or ''Success and Failure'''
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-mpssvc-rule-level-policy-change-is-set-to-success
      - state-mpssvc-rule-level-policy-change-is-set-to-success-and-fa
  evaluate:
    test: test-audit-mpssvc-rule-level-policy-change-set-success-or-success
