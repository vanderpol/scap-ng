assessment:
  id: windows11-stig-current-full.SV-253370.automated
  version: 18
  assessment_title: Credential Guard must be running on Windows 11 systems.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    deviceguard-securityservicesrunning-object:
      capability: windows.cmdlet
      select:
        module_name:
          operation: equals
          datatype: string
          value: CimCmdlets
        module_id:
          operation: equals
          datatype: string
          nil: true
          value: ''
        module_version:
          operation: equals
          datatype: version
          nil: true
          value: ''
        verb:
          operation: equals
          datatype: string
          value: Get
        noun:
          operation: equals
          datatype: string
          value: CimInstance
        parameters:
          operation: equals
          datatype: record
          value:
            record:
            - name: classname
              value: Win32_DeviceGuard
              operation: equals
              datatype: string
              entity_check: all
            - name: namespace
              value: root\Microsoft\Windows\DeviceGuard
              operation: equals
              datatype: string
              entity_check: all
        select:
          operation: equals
          datatype: record
          value:
            record:
            - name: property
              value: securityservicesrunning
              operation: equals
              datatype: string
              entity_check: all
      object_title: DeviceGuard securityservicesrunning
  states:
    state-securityservicesrunning-contains-1-in-array-element:
      state_title: securityservicesrunning contains 1 in array element
      capability: windows.cmdlet
      state:
        field: value
        value:
          record:
          - name: securityservicesrunning
            value: '1'
            operation: pattern match
            datatype: string
            entity_check: all
        operation: equals
        datatype: record
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-credential-guard-running-on-windows-11-domain-joined-systems:
      test_title: Credential Guard must be running on Windows 11 domain-joined systems.
      capability: windows.cmdlet
      object: deviceguard-securityservicesrunning-object
      check_existence: at_least_one_exists
      check: only one
      states:
      - state-securityservicesrunning-contains-1-in-array-element
  evaluate:
    test: test-credential-guard-running-on-windows-11-domain-joined-systems
