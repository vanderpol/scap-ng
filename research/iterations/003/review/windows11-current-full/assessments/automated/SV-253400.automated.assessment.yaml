assessment:
  id: SV-253400.automated
  version: 2
  assessment_title: WN11-CC-000255 - The use of a hardware security device with Windows Hello for Business must
    be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SOFTWARE\Policies\Microsoft\PassportForWork
        name:
          operation: equals
          datatype: string
          value: RequireSecurityDevice
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-use-hardware-security-device-set-enabled-or-not-configured:
      test_title: '''Use a hardware security device'' is set to ''Enabled'' or ''Not Configured'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: any_exist
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-use-hardware-security-device-set-enabled-or-not-configured
