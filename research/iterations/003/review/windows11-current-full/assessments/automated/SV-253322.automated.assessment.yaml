assessment:
  id: SV-253322.automated
  version: 2
  assessment_title: WN11-AU-000084 - Windows 11 must be configured to audit Object Access - Other Object Access
    Events failures.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-auditeventpolicysubcategories-collection:
      collection_title: null
  tests:
    test-audit-other-object-access-events-set-failure:
      test_title: '''Audit Other Object Access Events'' is set to ''Failure'''
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: '''Other Object Access Events'' is set to ''Failure'''
        state:
          field: other_object_access_events
          value: AUDIT_FAILURE
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-audit-other-object-access-events-set-success-failure:
      test_title: '''Audit Other Object Access Events'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: '''Other Object Access Events'' is set to ''Success'' and ''Failure'''
        state:
          field: other_object_access_events
          value: AUDIT_SUCCESS_FAILURE
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    any:
    - test: test-audit-other-object-access-events-set-failure
    - test: test-audit-other-object-access-events-set-success-failure
