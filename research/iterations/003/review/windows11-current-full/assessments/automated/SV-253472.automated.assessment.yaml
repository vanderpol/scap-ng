assessment:
  id: SV-253472.automated
  version: 2
  assessment_title: WN11-SO-000260 - User Account Control must be configured to detect application installations
    and prompt for elevation.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        name:
          operation: equals
          datatype: string
          mask: false
          value: EnableInstallerDetection
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-user-account-control-detect-application-installations-prompt-elevation-set-enabled:
      test_title: '''User Account Control: Detect application installations and prompt for elevation'' is set to
        ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-user-account-control-detect-application-installations-prompt-elevation-set-enabled
