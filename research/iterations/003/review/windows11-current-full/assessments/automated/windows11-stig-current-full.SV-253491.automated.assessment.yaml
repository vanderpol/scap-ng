assessment:
  id: windows11-stig-current-full.SV-253491.automated
  version: 2
  assessment_title: WN11-UR-000070 - The "Deny access to this computer from the network" user right on workstations
    must be configured to prevent access from highly privileged domain accounts and local accounts on domain systems
    and unauthenticated access on all systems.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-wmi57-object:
      capability: windows.wmi.query
      object_title: null
      collect:
        namespace: root\cimv2
        query: SELECT DomainRole FROM win32_computersystem
    windows-userright-object:
      capability: windows.userright
      select:
        userright:
          operation: equals
          datatype: string
          value: SE_DENY_NETWORK_LOGON_NAME
      object_title: null
  states:
    state-domain-member-workstation:
      state_title: Domain Member Workstation
      capability: windows.wmi.query
      state:
        field: result
        record:
          mask: false
          match: all
          existence: some
          fields:
            domainrole:
              value: '1'
              operation: equal
              datatype: string
              mask: false
              match: all
              existence: some
    state-windows-userright:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: ^(?i)(NT Authority\\)?Local account$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-userright-2:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: Guests
        operation: case insensitive equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-userright-3:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: ^(?i)(.+\\)?Domain Admins$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-userright-4:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: ^(?i)(.+\\)?Enterprise Admins$
        operation: pattern match
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-standalone-workstation:
      state_title: Standalone Workstation
      capability: windows.wmi.query
      state:
        field: result
        record:
          mask: false
          match: all
          existence: some
          fields:
            domainrole:
              value: '0'
              operation: equal
              datatype: string
              mask: false
              match: all
              existence: some
  tests:
    test-system-windows-domain-member-workstation:
      test_title: The system is a Windows Domain Member Workstation
      capability: windows.wmi.query
      object: windows-wmi57-object
      states:
      - state-domain-member-workstation
      existence: some
      match: all
    test-deny-access-this-computer-from-network-local-account:
      test_title: Deny access to this computer from the network - Local account
      capability: windows.userright
      object: windows-userright-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-windows-userright
    test-deny-access-this-computer-from-network-guests:
      test_title: Deny access to this computer from the network - Guests
      capability: windows.userright
      object: windows-userright-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-windows-userright-2
    test-deny-access-this-computer-from-network-domain-admins:
      test_title: Deny access to this computer from the network - Domain Admins
      capability: windows.userright
      object: windows-userright-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-windows-userright-3
    test-deny-access-this-computer-from-network-enterprise-admins:
      test_title: Deny access to this computer from the network - Enterprise Admins
      capability: windows.userright
      object: windows-userright-object
      check_existence: at_least_one_exists
      check: at least one
      states:
      - state-windows-userright-4
    test-system-windows-standalone-workstation:
      test_title: The system is a Windows Standalone Workstation
      capability: windows.wmi.query
      object: windows-wmi57-object
      states:
      - state-standalone-workstation
      existence: some
      match: all
  evaluate:
    any:
    - all:
      - test: test-system-windows-domain-member-workstation
      - test: test-deny-access-this-computer-from-network-local-account
      - test: test-deny-access-this-computer-from-network-guests
      - test: test-deny-access-this-computer-from-network-domain-admins
      - test: test-deny-access-this-computer-from-network-enterprise-admins
    - all:
      - test: test-system-windows-standalone-workstation
      - test: test-deny-access-this-computer-from-network-guests
