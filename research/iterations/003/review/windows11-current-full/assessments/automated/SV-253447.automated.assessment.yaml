assessment:
  id: SV-253447.automated
  version: 2
  assessment_title: WN11-SO-000085 - Caching of logon credentials must be limited.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: case insensitive equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: case insensitive equals
          datatype: string
          value: SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon
        name:
          operation: case insensitive equals
          datatype: string
          value: CachedLogonsCount
      object_title: null
  states:
    state-reg-sz-value-of-10-or-less:
      state_title: Reg_sz value of 10 or less
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_sz
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '10'
          operation: less than or equal
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-interactive-logon-number-previous-logons-cache-set-10-or-less:
      test_title: '''Interactive logon: Number of previous logons to cache'' is set to 10 or less'
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-reg-sz-value-of-10-or-less
  evaluate:
    test: test-interactive-logon-number-previous-logons-cache-set-10-or-less
