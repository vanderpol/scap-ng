assessment:
  id: SV-253447.automated
  version: 2
  assessment_title: WN11-SO-000085 - Caching of logon credentials must be limited.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon
        name:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: CachedLogonsCount
  tests:
    test-interactive-logon-number-previous-logons-cache-set-10-or-less:
      test_title: '''Interactive logon: Number of previous logons to cache'' is set to 10 or less'
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_sz value of 10 or less
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_sz
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '10'
            operation: less than or equal
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-interactive-logon-number-previous-logons-cache-set-10-or-less
