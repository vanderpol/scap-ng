assessment:
  id: SV-253362.automated
  version: 2
  assessment_title: WN11-CC-000050 - Hardened UNC Paths must be defined to require mutual authentication and integrity
    for at least the \\*\SYSVOL and \\*\NETLOGON shares.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    hardened-path-config-sysvol-collection:
      collection_title: Hardened Path Config for \\*\SYSVOL
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows\NetworkProvider\HardenedPaths
        name:
          operation: equals
          datatype: string
          mask: false
          value: \\*\SYSVOL
    hardened-path-config-netlogon-collection:
      collection_title: Hardened Path Config for \\*\NETLOGON
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows\NetworkProvider\HardenedPaths
        name:
          operation: equals
          datatype: string
          mask: false
          value: \\*\NETLOGON
  tests:
    test-mutual-authentication-integrity-sysvol:
      test_title: Mutual Authentication and Integrity for \\*\SYSVOL
      capability: windows.registry
      collection: hardened-path-config-sysvol-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: AND
        states:
        - state_title: RequireMutualAuthentication=1
          capability: windows.registry
          state:
            all:
            - field: type
              value: reg_sz
              operation: equals
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            - field: value
              value: (^| *, *)RequireMutualAuthentication=1( *, *|$)
              operation: pattern match
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
        - state_title: No RequireMutualAuthentication!=1
          capability: windows.registry
          state:
            all:
            - field: type
              value: reg_sz
              operation: equals
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            - field: value
              value: (^|[ *, *])RequireMutualAuthentication=(?!1( *, *|$))
              operation: pattern match
              datatype: string
              mask: false
              entity_check: none satisfy
              entity_existence: at_least_one_exists
        - state_title: RequireIntegrity=1
          capability: windows.registry
          state:
            all:
            - field: type
              value: reg_sz
              operation: equals
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            - field: value
              value: (^| *, *)RequireIntegrity=1( *, *|$)
              operation: pattern match
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
        - state_title: No RequireIntegrity!=1
          capability: windows.registry
          state:
            all:
            - field: type
              value: reg_sz
              operation: equals
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            - field: value
              value: (^| *, *)RequireIntegrity=(?!1( *, *|$))
              operation: pattern match
              datatype: string
              mask: false
              entity_check: none satisfy
              entity_existence: at_least_one_exists
    test-mutual-authentication-integrity-netlogon:
      test_title: Mutual Authentication and Integrity for \\*\NETLOGON
      capability: windows.registry
      collection: hardened-path-config-netlogon-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: AND
        states:
        - state_title: RequireMutualAuthentication=1
          capability: windows.registry
          state:
            all:
            - field: type
              value: reg_sz
              operation: equals
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            - field: value
              value: (^| *, *)RequireMutualAuthentication=1( *, *|$)
              operation: pattern match
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
        - state_title: No RequireMutualAuthentication!=1
          capability: windows.registry
          state:
            all:
            - field: type
              value: reg_sz
              operation: equals
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            - field: value
              value: (^|[ *, *])RequireMutualAuthentication=(?!1( *, *|$))
              operation: pattern match
              datatype: string
              mask: false
              entity_check: none satisfy
              entity_existence: at_least_one_exists
        - state_title: RequireIntegrity=1
          capability: windows.registry
          state:
            all:
            - field: type
              value: reg_sz
              operation: equals
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            - field: value
              value: (^| *, *)RequireIntegrity=1( *, *|$)
              operation: pattern match
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
        - state_title: No RequireIntegrity!=1
          capability: windows.registry
          state:
            all:
            - field: type
              value: reg_sz
              operation: equals
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            - field: value
              value: (^| *, *)RequireIntegrity=(?!1( *, *|$))
              operation: pattern match
              datatype: string
              mask: false
              entity_check: none satisfy
              entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-mutual-authentication-integrity-sysvol
    - test: test-mutual-authentication-integrity-netlogon
