assessment:
  id: SV-253414.automated
  version: 2
  assessment_title: WN11-CC-000326 - PowerShell script block logging must be enabled on Windows 11.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging
        name:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: EnableScriptBlockLogging
  tests:
    test-turn-on-powershell-script-block-logging-set-enabled:
      test_title: '''Turn on PowerShell Script Block Logging'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-turn-on-powershell-script-block-logging-set-enabled
