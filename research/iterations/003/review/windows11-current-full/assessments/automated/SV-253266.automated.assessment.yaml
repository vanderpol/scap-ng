assessment:
  id: SV-253266.automated
  version: 18
  assessment_title: Alternate operating systems must not be permitted on the same system.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    review-installed-os-via-powershell-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: powershell
        command:
          operation: equals
          datatype: string
          value: bcdedit /enum
        pattern:
          operation: equals
          datatype: string
          value: ^description
      object_title: Review Installed OS via PowerShell
  states:
    state-boot-loader-description-must-be-only-windows-11-note-win:
      state_title: Boot Loader Description must be only Windows 11 (note Windows Boot Manager entry can be ignored)
      capability: independent.shellcommand
      state:
        all:
        - field: command
          value: bcdedit /enum
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: pattern
          value: ^description
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: exit_status
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
        - field: stdout_line
          value: ^description(\s*)Windows (11|Boot Manager)$
          operation: pattern match
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-review-installed-os-via-powershell:
      test_title: Review Installed OS via PowerShell
      capability: independent.shellcommand
      object: review-installed-os-via-powershell-object
      check_existence: only_one_exists
      check: only one
      states:
      - state-boot-loader-description-must-be-only-windows-11-note-win
  evaluate:
    test: test-review-installed-os-via-powershell
