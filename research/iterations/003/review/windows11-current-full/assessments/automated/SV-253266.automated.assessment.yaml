assessment:
  id: SV-253266.automated
  version: 18
  assessment_title: Alternate operating systems must not be permitted on the same system.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    review-installed-os-via-powershell-collection:
      collection_title: Review Installed OS via PowerShell
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: powershell
        command:
          operation: equals
          datatype: string
          mask: false
          value: bcdedit /enum
        pattern:
          operation: equals
          datatype: string
          mask: false
          value: ^description
  tests:
    test-review-installed-os-via-powershell:
      test_title: Review Installed OS via PowerShell
      capability: independent.shellcommand
      collection: review-installed-os-via-powershell-collection
      assertion:
        existence: only_one_exists
        item_quantifier: only one
        state_title: Boot Loader Description must be only Windows 11 (note Windows Boot Manager entry can be ignored)
        state:
          all:
          - field: command
            value: bcdedit /enum
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: pattern
            value: ^description
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: ^description(\s*)Windows (11|Boot Manager)$
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-review-installed-os-via-powershell
