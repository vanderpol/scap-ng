assessment:
  id: SV-253317.automated
  version: 2
  assessment_title: WN11-AU-000075 - The system must be configured to audit Logon/Logoff - Logon successes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-log-on-is-set-to-success:
      state_title: '''Log On'' is set to ''Success'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: logon
        value: AUDIT_SUCCESS
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-log-on-is-set-to-success-and-failure:
      state_title: '''Log On'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: logon
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-logon-set-success:
      test_title: '''Audit Logon'' is set to ''Success'''
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-log-on-is-set-to-success
    test-audit-logon-set-success-failure:
      test_title: '''Audit Logon'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-log-on-is-set-to-success-and-failure
  evaluate:
    any:
    - test: test-audit-logon-set-success
    - test: test-audit-logon-set-success-failure
