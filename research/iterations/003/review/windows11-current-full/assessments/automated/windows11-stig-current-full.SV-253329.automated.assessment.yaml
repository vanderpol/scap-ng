assessment:
  id: windows11-stig-current-full.SV-253329.automated
  version: 2
  assessment_title: WN11-AU-000115 - The system must be configured to audit Privilege Use - Sensitive Privilege
    Use successes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-windows-auditeventpolicysubcategories:
      state_title: null
      capability: windows.auditeventpolicysubcategories
      state:
        field: sensitive_privilege_use
        value: AUDIT_SUCCESS
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-auditeventpolicysubcategories-2:
      state_title: null
      capability: windows.auditeventpolicysubcategories
      state:
        field: sensitive_privilege_use
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-sensitive-privilege-use-set-success-or-success-failure:
      test_title: '''Sensitive Privilege Use'' is set to ''Success'' or ''Success and Failure'''
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-windows-auditeventpolicysubcategories
      - state-windows-auditeventpolicysubcategories-2
  evaluate:
    test: test-sensitive-privilege-use-set-success-or-success-failure
