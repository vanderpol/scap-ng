assessment:
  id: SV-253463.automated
  version: 2
  assessment_title: WN11-SO-000210 - The system must be configured to the required LDAP client signing level.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Services\LDAP
        name:
          operation: equals
          datatype: string
          mask: false
          value: LDAPClientIntegrity
  tests:
    test-network-security-ldap-client-signing-requirements-set-negotiate-signing-or:
      test_title: '''Network security: LDAP client signing requirements'' is set to ''Negotiate signing'' or ''Require
        signing'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: null
          state:
            all:
            - field: type
              value: reg_dword
              operation: equals
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            - field: value
              value: '1'
              operation: equals
              datatype: int
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
        - state_title: null
          state:
            all:
            - field: type
              value: reg_dword
              operation: equals
              datatype: string
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            - field: value
              value: '2'
              operation: equals
              datatype: int
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
  evaluate:
    test: test-network-security-ldap-client-signing-requirements-set-negotiate-signing-or
