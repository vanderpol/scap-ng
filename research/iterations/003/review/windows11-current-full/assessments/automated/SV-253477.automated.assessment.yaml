assessment:
  id: SV-253477.automated
  version: 2
  assessment_title: WN11-UC-000015 - Toast notifications to the lock screen must be turned off.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-ntuser-collection:
      collection_title: null
      select:
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\Windows\CurrentVersion\PushNotifications
        name:
          operation: equals
          datatype: string
          mask: false
          value: NoToastApplicationNotificationOnLockScreen
      filters:
      - action: exclude
        match:
          field: enabled
          value: 'false'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
      - action: exclude
        match:
          field: days_since_modified
          value: '35'
          operation: greater than
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    windows-registry-collection:
      collection_title: null
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_CURRENT_USER
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\Windows\CurrentVersion\PushNotifications
        name:
          operation: equals
          datatype: string
          mask: false
          value: NoToastApplicationNotificationOnLockScreen
  tests:
    test-turn-off-toast-notifications-on-lock-screen-set-enabled:
      test_title: '''Turn off toast notifications on the lock screen'' is set to ''Enabled'''
      capability: windows.ntuser
      collection: windows-ntuser-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: null
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-current-user-turn-off-toast-notifications-on-lock-screen-set:
      test_title: For the current user, 'Turn off toast notifications on the lock screen' is set to 'Enabled'
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-turn-off-toast-notifications-on-lock-screen-set-enabled
    - test: test-current-user-turn-off-toast-notifications-on-lock-screen-set
