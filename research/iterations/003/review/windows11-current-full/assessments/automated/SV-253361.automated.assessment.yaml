assessment:
  id: SV-253361.automated
  version: 2
  assessment_title: WN11-CC-000044 - Internet connection sharing must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows\Network Connections
        name:
          operation: equals
          datatype: string
          mask: false
          value: NC_ShowSharedAccessUI
  tests:
    test-prohibit-use-internet-connection-sharing-on-your-dns-domain-network:
      test_title: '''Prohibit use of Internet Connection Sharing on your DNS domain network'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-prohibit-use-internet-connection-sharing-on-your-dns-domain-network
