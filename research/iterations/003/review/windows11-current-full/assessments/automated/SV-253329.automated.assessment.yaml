assessment:
  id: SV-253329.automated
  version: 2
  assessment_title: WN11-AU-000115 - The system must be configured to audit Privilege Use - Sensitive Privilege
    Use successes.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-auditeventpolicysubcategories-collection:
      collection_title: null
      capability: windows.auditeventpolicysubcategories
  tests:
    test-sensitive-privilege-use-set-success-or-success-failure:
      test_title: '''Sensitive Privilege Use'' is set to ''Success'' or ''Success and Failure'''
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: null
          capability: windows.auditeventpolicysubcategories
          state:
            field: sensitive_privilege_use
            value: AUDIT_SUCCESS
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: windows.auditeventpolicysubcategories
          state:
            field: sensitive_privilege_use
            value: AUDIT_SUCCESS_FAILURE
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-sensitive-privilege-use-set-success-or-success-failure
