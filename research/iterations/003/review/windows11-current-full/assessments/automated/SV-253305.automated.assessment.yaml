assessment:
  id: SV-253305.automated
  version: 2
  assessment_title: WN11-AC-000045 - Reversible password encryption must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-passwordpolicy-collection:
      collection_title: null
      capability: windows.passwordpolicy
  tests:
    test-store-password-using-reversible-encryption-set-disabled:
      test_title: '''Store password using reversible encryption'' is set to ''Disabled'''
      capability: windows.passwordpolicy
      collection: windows-passwordpolicy-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.passwordpolicy
        state:
          field: reversible_encryption
          value: '0'
          operation: equals
          datatype: boolean
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-store-password-using-reversible-encryption-set-disabled
