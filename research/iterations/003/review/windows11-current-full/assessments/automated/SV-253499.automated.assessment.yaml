assessment:
  id: SV-253499.automated
  version: 2
  assessment_title: WN11-UR-000120 - The "Load and unload device drivers" user right must only be assigned to the
    Administrators group.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-userright-collection:
      collection_title: null
      capability: windows.userright
      select:
        userright:
          operation: equals
          datatype: string
          mask: false
          value: SE_LOAD_DRIVER_NAME
  tests:
    test-load-unload-device-drivers-administrators:
      test_title: Load and unload device drivers - Administrators
      capability: windows.userright
      collection: windows-userright-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: null
          capability: windows.userright
          state:
            field: trustee_name
            value: ''
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: windows.userright
          state:
            field: trustee_name
            value: Administrators
            operation: case insensitive equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-load-unload-device-drivers-administrators
