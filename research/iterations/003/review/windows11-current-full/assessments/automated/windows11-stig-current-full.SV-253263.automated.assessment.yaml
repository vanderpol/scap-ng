assessment:
  id: windows11-stig-current-full.SV-253263.automated
  version: 2
  assessment_title: WN11-00-000040 - Windows 11 systems must be maintained at a supported servicing level.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SOFTWARE\Microsoft\Windows NT\CurrentVersion
        name:
          operation: equals
          datatype: string
          value: CurrentVersion
      object_title: null
    windows-registry-object-2:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SOFTWARE\Microsoft\Windows NT\CurrentVersion
        name:
          operation: equals
          datatype: string
          value: CurrentBuildNumber
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_sz
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '6.3'
          operation: greater than or equal
          datatype: version
          entity_check: all
          entity_existence: at_least_one_exists
    state-windows-registry-2:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_sz
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '22621'
          operation: greater than or equal
          datatype: version
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-os-version-equal-or-greater-than-6-3:
      test_title: The OS Version is equal to or greater than 6.3
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
    test-os-build-equal-or-greater-than-22621:
      test_title: The OS Build is equal to or greater than 22621
      capability: windows.registry
      object: windows-registry-object-2
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry-2
  evaluate:
    all:
    - test: test-os-version-equal-or-greater-than-6-3
    - test: test-os-build-equal-or-greater-than-22621
