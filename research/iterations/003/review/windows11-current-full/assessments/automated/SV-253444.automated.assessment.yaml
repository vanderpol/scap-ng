assessment:
  id: SV-253444.automated
  version: 2
  assessment_title: WN11-SO-000070 - The machine inactivity limit must be set to 15 minutes, locking the system
    with the screensaver.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: case insensitive equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: case insensitive equals
          datatype: string
          value: Software\Microsoft\Windows\CurrentVersion\Policies\System
        name:
          operation: case insensitive equals
          datatype: string
          value: InactivityTimeoutSecs
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '900'
          operation: less than or equal
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
    state-windows-registry-2:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '0'
          operation: greater than
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-machine-inactivity-limit-set-15-minutes-or-less:
      test_title: The machine inactivity limit is set to 15 minutes or less
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      state_operator: AND
      states:
      - state-windows-registry
      - state-windows-registry-2
  evaluate:
    test: test-machine-inactivity-limit-set-15-minutes-or-less
