assessment:
  id: SV-253356.automated
  version: 2
  assessment_title: WN11-CC-000035 - The system must be configured to ignore NetBIOS name release requests except
    from WINS servers.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Services\Netbt\Parameters
        name:
          operation: equals
          datatype: string
          mask: false
          value: NoNameReleaseOnDemand
  tests:
    test-mss-nonamereleaseondemand-allow-computer-ignore-netbios-name-release-requests-except:
      test_title: '''MSS: (NoNameReleaseOnDemand) Allow computer to ignore NetBIOS name release requests except
        from WINS servers'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-mss-nonamereleaseondemand-allow-computer-ignore-netbios-name-release-requests-except
