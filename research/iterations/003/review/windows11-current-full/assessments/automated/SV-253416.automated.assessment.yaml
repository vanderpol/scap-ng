assessment:
  id: SV-253416.automated
  version: 2
  assessment_title: WN11-CC-000330 - The Windows Remote Management (WinRM) client must not use Basic authentication.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\Windows\WinRM\Client
        name:
          operation: equals
          datatype: string
          mask: false
          value: AllowBasic
  tests:
    test-allow-basic-authentication-set-disabled:
      test_title: '''Allow Basic authentication'' is set to ''Disabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-allow-basic-authentication-set-disabled
