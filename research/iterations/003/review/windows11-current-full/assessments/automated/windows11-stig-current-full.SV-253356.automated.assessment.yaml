assessment:
  id: windows11-stig-current-full.SV-253356.automated
  version: 2
  assessment_title: WN11-CC-000035 - The system must be configured to ignore NetBIOS name release requests except
    from WINS servers.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: System\CurrentControlSet\Services\Netbt\Parameters
        name:
          operation: equals
          datatype: string
          value: NoNameReleaseOnDemand
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-mss-nonamereleaseondemand-allow-computer-ignore-netbios-name-release-requests-except:
      test_title: '''MSS: (NoNameReleaseOnDemand) Allow computer to ignore NetBIOS name release requests except
        from WINS servers'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-mss-nonamereleaseondemand-allow-computer-ignore-netbios-name-release-requests-except
