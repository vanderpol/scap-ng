assessment:
  id: SV-253449.automated
  version: 2
  assessment_title: WN11-SO-000100 - The Windows SMB client must be configured to always perform SMB packet signing.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    check-registry-value-store-at-hkey-local-machine-system-currentcontrolset-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: System\CurrentControlSet\Services\LanmanWorkstation\Parameters
        name:
          operation: equals
          datatype: string
          mask: false
          value: RequireSecuritySignature
      object_title: Check the registry value store at HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\LanmanWorkstation\Parameters\RequireSecuritySignature
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-microsoft-network-client-digitally-sign-communications-always-set-enabled:
      test_title: '''Microsoft Network Client: Digitally sign communications (always)'' is set to ''Enabled'''
      capability: windows.registry
      object: check-registry-value-store-at-hkey-local-machine-system-currentcontrolset-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-microsoft-network-client-digitally-sign-communications-always-set-enabled
