assessment:
  id: SV-253437.automated
  version: 2
  assessment_title: WN11-SO-000030 - Audit policy using subcategories must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      select:
        hive:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Control\Lsa
        name:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: SCENoApplyLegacyAuditPolicy
  tests:
    test-audit-policy-using-subcategories-enabled:
      test_title: Audit policy using subcategories is enabled.
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-audit-policy-using-subcategories-enabled
