assessment:
  id: SV-253406.automated
  version: 2
  assessment_title: WN11-CC-000290 - Remote Desktop Services must be configured with the client connection encryption
    set to the required level.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: Software\Policies\Microsoft\Windows NT\Terminal Services
        name:
          operation: equals
          datatype: string
          mask: false
          value: MinEncryptionLevel
  tests:
    test-set-client-connection-encryption-level-set-enabled-high-level:
      test_title: '''Set client connection encryption level'' is set to ''Enabled'' and ''High Level'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '3'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-set-client-connection-encryption-level-set-enabled-high-level
