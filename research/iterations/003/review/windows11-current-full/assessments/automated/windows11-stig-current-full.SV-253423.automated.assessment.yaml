assessment:
  id: windows11-stig-current-full.SV-253423.automated
  version: 2
  assessment_title: WN11-CC-000370 - The convenience PIN for Windows 11 must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: Software\Policies\Microsoft\Windows\System
        name:
          operation: equals
          datatype: string
          value: AllowDomainPINLogon
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '0'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-turn-on-convenience-pin-sign-in-disabled:
      test_title: '''Turn on convenience PIN sign-in'' is ''Disabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: all_exist
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-turn-on-convenience-pin-sign-in-disabled
