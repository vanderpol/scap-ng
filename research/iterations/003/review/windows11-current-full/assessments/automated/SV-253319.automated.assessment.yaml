assessment:
  id: SV-253319.automated
  version: 2
  assessment_title: WN11-AU-000081 - Windows 11 must be configured to audit Object Access - File Share failures.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-file-share-is-set-to-failure:
      state_title: '''File Share'' is set to ''Failure'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: file_share
        value: AUDIT_FAILURE
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
    state-file-share-is-set-to-success-and-failure:
      state_title: '''File Share'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: file_share
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-file-share-set-failure:
      test_title: '''Audit File Share'' is set to ''Failure'''
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-file-share-is-set-to-failure
    test-audit-file-share-set-success-failure:
      test_title: '''Audit File Share'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-file-share-is-set-to-success-and-failure
  evaluate:
    any:
    - test: test-audit-file-share-set-failure
    - test: test-audit-file-share-set-success-failure
