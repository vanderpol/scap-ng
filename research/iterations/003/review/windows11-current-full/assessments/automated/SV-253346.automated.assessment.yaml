assessment:
  id: SV-253346.automated
  version: 2
  assessment_title: WN11-AU-000565 - Windows 11 must be configured to audit other Logon/Logoff Events Failures.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-auditeventpolicysubcategories-object:
      capability: windows.auditeventpolicysubcategories
      object_title: null
  states:
    state-log-on-is-set-to-failure:
      state_title: '''Log On'' is set to ''Failure'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: other_logon_logoff_events
        value: AUDIT_FAILURE
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-log-on-is-set-to-success-and-failure:
      state_title: '''Log On'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      state:
        field: other_logon_logoff_events
        value: AUDIT_SUCCESS_FAILURE
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-audit-logon-set-failure-succss-failure:
      test_title: '''Audit Logon'' is set to ''Failure'' and ''Succss and Failure'
      capability: windows.auditeventpolicysubcategories
      object: windows-auditeventpolicysubcategories-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-log-on-is-set-to-failure
      - state-log-on-is-set-to-success-and-failure
  evaluate:
    test: test-audit-logon-set-failure-succss-failure
