assessment:
  id: SV-253346.automated
  version: 2
  assessment_title: WN11-AU-000565 - Windows 11 must be configured to audit other Logon/Logoff Events Failures.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-auditeventpolicysubcategories-collection:
      collection_title: null
  tests:
    test-audit-logon-set-failure-succss-failure:
      test_title: '''Audit Logon'' is set to ''Failure'' and ''Succss and Failure'
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: '''Log On'' is set to ''Failure'''
          state:
            field: other_logon_logoff_events
            value: AUDIT_FAILURE
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: '''Log On'' is set to ''Success'' and ''Failure'''
          state:
            field: other_logon_logoff_events
            value: AUDIT_SUCCESS_FAILURE
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-audit-logon-set-failure-succss-failure
