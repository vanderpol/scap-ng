assessment:
  id: SV-253375.automated
  version: 2
  assessment_title: WN11-CC-000105 - Web publishing and online ordering wizards must be prevented from downloading
    a list of providers.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer
        name:
          operation: equals
          datatype: string
          mask: false
          value: NoWebServices
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-turn-off-internet-download-web-publishing-online-ordering-wizards-set:
      test_title: '''Turn off Internet download for Web publishing and online ordering wizards'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-turn-off-internet-download-web-publishing-online-ordering-wizards-set
