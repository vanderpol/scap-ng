assessment:
  id: SV-253367.automated
  version: 2
  assessment_title: WN11-CC-000066 - Command line data must be included in process creation events.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit
        name:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: ProcessCreationIncludeCmdLine_Enabled
  tests:
    test-include-command-line-in-process-creation-events-set-enabled:
      test_title: '''Include command line in process creation events'' is set to ''Enabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-include-command-line-in-process-creation-events-set-enabled
