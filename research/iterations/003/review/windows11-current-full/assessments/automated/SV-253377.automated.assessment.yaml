assessment:
  id: SV-253377.automated
  version: 2
  assessment_title: WN11-CC-000115 - Systems must at least attempt device authentication using certificates.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Kerberos\Parameters
        name:
          operation: equals
          datatype: string
          mask: false
          value: DevicePKInitEnabled
  tests:
    test-if-devicepkinitenabled-exists-it-set-1:
      test_title: If 'DevicePKInitEnabled' exists, it is set to 1.
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-if-devicepkinitenabled-exists-it-set-1
