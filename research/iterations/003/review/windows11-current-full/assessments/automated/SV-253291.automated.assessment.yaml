assessment:
  id: SV-253291.automated
  version: 18
  assessment_title: Bluetooth must be turned off unless approved by the organization.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    verify-bluetooth-radio-turned-off-collection:
      collection_title: Verify the Bluetooth radio is turned off
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\PolicyManager\current\device\Connectivity
        name:
          operation: equals
          datatype: string
          mask: false
          value: AllowBluetooth
  tests:
    test-bluetooth-radio-turned-off:
      test_title: Bluetooth radio must be turned off.
      capability: windows.registry
      collection: verify-bluetooth-radio-turned-off-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: only one
        state_title: Value Equal To 0
        state_capability: windows.registry
        state:
          field: value
          value: '0'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-bluetooth-radio-turned-off
