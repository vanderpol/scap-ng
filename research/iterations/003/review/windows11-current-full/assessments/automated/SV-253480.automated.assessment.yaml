assessment:
  id: SV-253480.automated
  version: 2
  assessment_title: WN11-UR-000010 - The "Access this computer from the network" user right must only be assigned
    to the Administrators and Remote Desktop Users groups.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-userright-collection:
      collection_title: null
      capability: windows.userright
      select:
        userright:
          operation: equals
          datatype: string
          mask: false
          value: SE_NETWORK_LOGON_NAME
  tests:
    test-access-this-computer-from-network-administrators-remote-desktop-users:
      test_title: Access this computer from the network - Administrators, Remote Desktop Users
      capability: windows.userright
      collection: windows-userright-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: null
          capability: windows.userright
          state:
            field: trustee_name
            value: ''
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: windows.userright
          state:
            field: trustee_name
            value: Administrators
            operation: case insensitive equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: windows.userright
          state:
            field: trustee_name
            value: Remote Desktop Users
            operation: case insensitive equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-access-this-computer-from-network-administrators-remote-desktop-users
