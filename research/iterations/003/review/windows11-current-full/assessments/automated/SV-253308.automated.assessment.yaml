assessment:
  id: SV-253308.automated
  version: 2
  assessment_title: WN11-AU-000030 - The system must be configured to audit Account Management - Security Group
    Management successes.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-auditeventpolicysubcategories-collection:
      collection_title: null
  tests:
    test-audit-security-group-management-set-success-or-success-failure:
      test_title: '''Audit Security Group Management'' is set to ''Success'' or ''Success and Failure'''
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_operator: OR
        states:
        - state_title: null
          state:
            field: security_group_management
            value: AUDIT_SUCCESS
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          state:
            field: security_group_management
            value: AUDIT_SUCCESS_FAILURE
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-audit-security-group-management-set-success-or-success-failure
