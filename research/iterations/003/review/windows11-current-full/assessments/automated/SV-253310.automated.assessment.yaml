assessment:
  id: SV-253310.automated
  version: 2
  assessment_title: WN11-AU-000040 - The system must be configured to audit Account Management - User Account Management
    successes.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-auditeventpolicysubcategories-collection:
      collection_title: null
      capability: windows.auditeventpolicysubcategories
  tests:
    test-audit-user-account-management-set-success:
      test_title: '''Audit User Account Management'' is set to ''Success'''
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: '''User Account Management'' is set to ''Success'''
        state_capability: windows.auditeventpolicysubcategories
        state:
          field: user_account_management
          value: AUDIT_SUCCESS
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-audit-user-account-management-set-success-failure:
      test_title: '''Audit User Account Management'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      collection: windows-auditeventpolicysubcategories-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: '''User Account Management'' is set to ''Success'' and ''Failure'''
        state_capability: windows.auditeventpolicysubcategories
        state:
          field: user_account_management
          value: AUDIT_SUCCESS_FAILURE
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    any:
    - test: test-audit-user-account-management-set-success
    - test: test-audit-user-account-management-set-success-failure
