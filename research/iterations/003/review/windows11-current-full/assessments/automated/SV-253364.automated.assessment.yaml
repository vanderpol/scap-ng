assessment:
  id: SV-253364.automated
  version: 2
  assessment_title: WN11-CC-000055 - Simultaneous connections to the internet or a Windows domain must be limited.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows\WcmSvc\GroupPolicy
        name:
          operation: equals
          datatype: string
          mask: false
          value: fMinimizeConnections
  tests:
    test-simultaneous-connections-internet-or-windows-domain-limited:
      test_title: Simultaneous connections to the internet or a Windows domain are limited
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: null
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '3'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-simultaneous-connections-internet-or-windows-domain-limited
