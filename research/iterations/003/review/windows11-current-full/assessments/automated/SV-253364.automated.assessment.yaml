assessment:
  id: SV-253364.automated
  version: 2
  assessment_title: WN11-CC-000055 - Simultaneous connections to the internet or a Windows domain must be limited.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SOFTWARE\Policies\Microsoft\Windows\WcmSvc\GroupPolicy
        name:
          operation: equals
          datatype: string
          value: fMinimizeConnections
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '3'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-simultaneous-connections-internet-or-windows-domain-limited:
      test_title: Simultaneous connections to the internet or a Windows domain are limited
      capability: windows.registry
      object: windows-registry-object
      check_existence: any_exist
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-simultaneous-connections-internet-or-windows-domain-limited
