assessment:
  id: SV-253261.automated
  version: 2
  assessment_title: WN11-00-000032 - Windows 11 systems must use a BitLocker PIN with a minimum length of six digits
    for pre-boot authentication.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    check-bitlocker-minimumpin-collection:
      collection_title: Check for BitLocker MinimumPIN
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\FVE
        name:
          operation: case insensitive equals
          datatype: string
          mask: false
          value: MinimumPIN
  tests:
    test-bitlocker-6-digits-or-more:
      test_title: BitLocker must be 6 digits or more.
      capability: windows.registry
      collection: check-bitlocker-minimumpin-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '6'
            operation: greater than or equal
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-bitlocker-6-digits-or-more
