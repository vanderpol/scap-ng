assessment:
  id: windows11-stig-current-full.SV-253443.automated
  version: 2
  assessment_title: WN11-SO-000060 - The system must be configured to require a strong session key.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SYSTEM\CurrentControlSet\Services\Netlogon\Parameters
        name:
          operation: equals
          datatype: string
          value: RequireStrongKey
      object_title: null
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-domain-member-require-strong-windows-2000-or-later-session-key:
      test_title: '''Domain member: Require strong (Windows 2000 or Later) session key'' is set to ''Enabled'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-domain-member-require-strong-windows-2000-or-later-session-key
