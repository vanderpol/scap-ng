assessment:
  id: SV-253497.automated
  version: 2
  assessment_title: WN11-UR-000100 - The "Force shutdown from a remote system" user right must only be assigned
    to the Administrators group.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-userright-object:
      capability: windows.userright
      select:
        userright:
          operation: equals
          datatype: string
          mask: false
          value: SE_REMOTE_SHUTDOWN_NAME
      object_title: null
  states:
    state-windows-userright:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: ''
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-userright-2:
      state_title: null
      capability: windows.userright
      state:
        field: trustee_name
        value: Administrators
        operation: case insensitive equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-force-shutdown-from-remote-system-administrators:
      test_title: Force shutdown from a remote system - Administrators
      capability: windows.userright
      object: windows-userright-object
      check_existence: at_least_one_exists
      check: all
      state_operator: OR
      states:
      - state-windows-userright
      - state-windows-userright-2
  evaluate:
    test: test-force-shutdown-from-remote-system-administrators
