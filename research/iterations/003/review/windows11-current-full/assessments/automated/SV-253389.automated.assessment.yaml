assessment:
  id: SV-253389.automated
  version: 3
  assessment_title: WN11-CC-000195 - Enhanced anti-spoofing for facial recognition must be enabled on Windows 11.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    group-policy-registry-entry-facial-recognition-enhanced-anti-spoofing-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Biometrics\FacialFeatures
        name:
          operation: equals
          datatype: string
          mask: false
          value: EnhancedAntiSpoofing
      object_title: Group Policy registry entry for facial recognition enhanced anti-spoofing
    intune-registry-entry-facial-recognition-enhanced-anti-spoofing-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Policies\PassportForWork\Biometrics
        name:
          operation: equals
          datatype: string
          mask: false
          value: FacialFeaturesUseEnhancedAntiSpoofing
      object_title: Intune registry entry for facial recognition enhanced anti-spoofing
    registry-entries-facial-recognition-enhanced-anti-spoofing-object:
      capability: windows.registry
      set:
        operator: union
        members:
        - object: group-policy-registry-entry-facial-recognition-enhanced-anti-spoofing-object
        - object: intune-registry-entry-facial-recognition-enhanced-anti-spoofing-object
      object_title: Registry entries for facial recognition enhanced anti-spoofing
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-enhanced-anti-spoofing-facial-recognition-enabled:
      test_title: Enhanced anti-spoofing for facial recognition must be enabled
      capability: windows.registry
      object: registry-entries-facial-recognition-enhanced-anti-spoofing-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-enhanced-anti-spoofing-facial-recognition-enabled
