assessment:
  id: SV-253389.automated
  version: 3
  assessment_title: WN11-CC-000195 - Enhanced anti-spoofing for facial recognition must be enabled on Windows 11.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    group-policy-registry-entry-facial-recognition-enhanced-anti-spoofing-collection:
      collection_title: Group Policy registry entry for facial recognition enhanced anti-spoofing
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Biometrics\FacialFeatures
        name:
          operation: equals
          datatype: string
          mask: false
          value: EnhancedAntiSpoofing
    intune-registry-entry-facial-recognition-enhanced-anti-spoofing-collection:
      collection_title: Intune registry entry for facial recognition enhanced anti-spoofing
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Policies\PassportForWork\Biometrics
        name:
          operation: equals
          datatype: string
          mask: false
          value: FacialFeaturesUseEnhancedAntiSpoofing
    registry-entries-facial-recognition-enhanced-anti-spoofing-collection:
      collection_title: Registry entries for facial recognition enhanced anti-spoofing
      capability: windows.registry
      set:
        operator: union
        members:
        - collection: group-policy-registry-entry-facial-recognition-enhanced-anti-spoofing-collection
        - collection: intune-registry-entry-facial-recognition-enhanced-anti-spoofing-collection
  tests:
    test-enhanced-anti-spoofing-facial-recognition-enabled:
      test_title: Enhanced anti-spoofing for facial recognition must be enabled
      capability: windows.registry
      collection: registry-entries-facial-recognition-enhanced-anti-spoofing-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '1'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-enhanced-anti-spoofing-facial-recognition-enabled
