assessment:
  id: SV-253458.automated
  version: 2
  assessment_title: WN11-SO-000180 - NTLM must be prevented from falling back to a Null session.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Control\LSA\MSV1_0
        name:
          operation: equals
          datatype: string
          mask: false
          value: allownullsessionfallback
  tests:
    test-network-security-allow-localsystem-null-session-fallback-set-disabled:
      test_title: '''Network security: Allow LocalSystem NULL session fallback'' is set to ''Disabled'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-network-security-allow-localsystem-null-session-fallback-set-disabled
