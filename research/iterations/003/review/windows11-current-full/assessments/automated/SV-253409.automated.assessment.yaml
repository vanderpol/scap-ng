assessment:
  id: SV-253409.automated
  version: 3
  assessment_title: WN11-CC-000305 - Indexing of encrypted files must be turned off.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    registry-entry-allowindexingencryptedstoresoritems-used-by-group-policy-collection:
      collection_title: Registry entry for AllowIndexingEncryptedStoresOrItems used by Group Policy
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows\Windows Search
        name:
          operation: equals
          datatype: string
          mask: false
          value: AllowIndexingEncryptedStoresOrItems
    registry-entry-allowindexingencryptedstoresoritems-used-by-intune-collection:
      collection_title: Registry entry for AllowIndexingEncryptedStoresOrItems used by Intune
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Policymanager\current\device\search
        name:
          operation: equals
          datatype: string
          mask: false
          value: AllowIndexingEncryptedStoresOrItems
    registry-entries-allowindexingencryptedstoresoritems-collection:
      collection_title: Registry entries for AllowIndexingEncryptedStoresOrItems
      set:
        operator: union
        members:
        - collection: registry-entry-allowindexingencryptedstoresoritems-used-by-group-policy-collection
        - collection: registry-entry-allowindexingencryptedstoresoritems-used-by-intune-collection
  tests:
    test-allowindexingencryptedstoresoritems-disabled:
      test_title: AllowIndexingEncryptedStoresOrItems is disabled
      capability: windows.registry
      collection: registry-entries-allowindexingencryptedstoresoritems-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-allowindexingencryptedstoresoritems-disabled
