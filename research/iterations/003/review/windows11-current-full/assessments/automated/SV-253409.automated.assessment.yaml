assessment:
  id: SV-253409.automated
  version: 3
  assessment_title: WN11-CC-000305 - Indexing of encrypted files must be turned off.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    registry-entry-allowindexingencryptedstoresoritems-used-by-group-policy-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Policies\Microsoft\Windows\Windows Search
        name:
          operation: equals
          datatype: string
          mask: false
          value: AllowIndexingEncryptedStoresOrItems
      object_title: Registry entry for AllowIndexingEncryptedStoresOrItems used by Group Policy
    registry-entry-allowindexingencryptedstoresoritems-used-by-intune-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Policymanager\current\device\search
        name:
          operation: equals
          datatype: string
          mask: false
          value: AllowIndexingEncryptedStoresOrItems
      object_title: Registry entry for AllowIndexingEncryptedStoresOrItems used by Intune
    registry-entries-allowindexingencryptedstoresoritems-object:
      capability: windows.registry
      set:
        operator: union
        members:
        - object: registry-entry-allowindexingencryptedstoresoritems-used-by-group-policy-object
        - object: registry-entry-allowindexingencryptedstoresoritems-used-by-intune-object
      object_title: Registry entries for AllowIndexingEncryptedStoresOrItems
  states:
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-allowindexingencryptedstoresoritems-disabled:
      test_title: AllowIndexingEncryptedStoresOrItems is disabled
      capability: windows.registry
      object: registry-entries-allowindexingencryptedstoresoritems-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    test: test-allowindexingencryptedstoresoritems-disabled
