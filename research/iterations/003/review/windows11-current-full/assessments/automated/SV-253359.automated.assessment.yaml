  tests:
    test-remove-run-as-different-user-from-context-menus-set-enabled:
      test_title: '''Remove ''Run as Different User'' from context menus'' is set to ''Enabled'' (batfile)'
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Reg_Dword type and value equals 4096
        state_capability: windows.registry
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
