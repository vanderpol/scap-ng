assessment:
  id: SV-253436.automated
  version: 2
  assessment_title: WN11-SO-000025 - The built-in guest account must be renamed.
  mode: automated
  class: compliance
  purpose: assessment
  objects:
    built-in-guest-sid-object:
      capability: windows.sid_sid
      select:
        trustee_sid:
          operation: pattern match
          datatype: string
          mask: false
          value: ^S-1-5-[0-9-]+-501$
      object_title: Built-in Guest SID
  variables:
    localdomain-guest-variable:
      title: localdomain\Guest
      kind: local
      datatype: string
      expression:
        concat:
        - values:
            object: built-in-guest-sid-object
            field: trustee_domain
        - literal:
            value: \Guest
            datatype: string
  states:
    state-not-guest:
      state_title: Not Guest
      capability: windows.sid_sid
      state:
        field: trustee_name
        value: Guest
        operation: case insensitive not equal
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-not-localdomain-guest:
      state_title: Not localdomain\Guest
      capability: windows.sid_sid
      state:
        field: trustee_name
        value:
          variable: localdomain-guest-variable
        operation: case insensitive not equal
        datatype: string
        mask: false
        variable_check: all
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-accounts-rename-guest-account-not-set-guest-or-localdomain-guest:
      test_title: '''Accounts: Rename Guest account'' is not set to ''Guest'' or ''localdomain\Guest'''
      capability: windows.sid_sid
      object: built-in-guest-sid-object
      check_existence: any_exist
      check: all
      state_operator: AND
      states:
      - state-not-guest
      - state-not-localdomain-guest
  evaluate:
    test: test-accounts-rename-guest-account-not-set-guest-or-localdomain-guest
