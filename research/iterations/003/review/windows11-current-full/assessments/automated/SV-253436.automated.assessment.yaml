assessment:
  id: SV-253436.automated
  version: 2
  assessment_title: WN11-SO-000025 - The built-in guest account must be renamed.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    built-in-guest-sid-collection:
      collection_title: Built-in Guest SID
      select:
        trustee_sid:
          operation: pattern match
          datatype: string
          mask: false
          value: ^S-1-5-[0-9-]+-501$
  variables:
    localdomain-guest-variable:
      title: localdomain\Guest
      kind: local
      datatype: string
      expression:
        concat:
        - values:
            collection: built-in-guest-sid-collection
            field: trustee_domain
        - literal:
            value: \Guest
            datatype: string
  tests:
    test-accounts-rename-guest-account-not-set-guest-or-localdomain-guest:
      test_title: '''Accounts: Rename Guest account'' is not set to ''Guest'' or ''localdomain\Guest'''
      capability: windows.sid_sid
      collection: built-in-guest-sid-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_operator: AND
        states:
        - state_title: Not Guest
          state:
            field: trustee_name
            value: Guest
            operation: case insensitive not equal
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: Not localdomain\Guest
          state:
            field: trustee_name
            value:
              variable: localdomain-guest-variable
            operation: case insensitive not equal
            datatype: string
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-accounts-rename-guest-account-not-set-guest-or-localdomain-guest
