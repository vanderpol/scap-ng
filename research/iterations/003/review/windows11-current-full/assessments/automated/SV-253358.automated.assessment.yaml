assessment:
  id: SV-253358.automated
  version: 2
  assessment_title: WN11-CC-000038 - WDigest Authentication must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Control\SecurityProviders\Wdigest
        name:
          operation: equals
          datatype: string
          mask: false
          value: UseLogonCredential
  tests:
    test-wdigest-authentication-disabled:
      test_title: WDigest Authentication is disabled
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-wdigest-authentication-disabled
