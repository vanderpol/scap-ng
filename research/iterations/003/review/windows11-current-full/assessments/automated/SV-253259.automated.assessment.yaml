assessment:
  id: SV-253259.automated
  version: 2
  assessment_title: WN11-00-000030 - Windows 11 information systems must use BitLocker to encrypt all disks to protect
    the confidentiality and integrity of all information at rest.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    bitlocker-status-collection:
      collection_title: BitLocker status
      capability: windows.wmi57
      select:
        namespace:
          operation: equals
          datatype: string
          mask: false
          value: root\cimv2\security\microsoftvolumeencryption
        wql:
          operation: equals
          datatype: string
          mask: false
          value: SELECT protectionstatus FROM win32_encryptablevolume
  tests:
    test-bitlocker-enabled-on-all-fixed-drives:
      test_title: BitLocker must be enabled on all fixed drives.
      capability: windows.wmi57
      collection: bitlocker-status-collection
      assertion:
        existence: all_exist
        item_quantifier: all
        state_title: BitLocker status is Protected
        state_capability: windows.wmi57
        state:
          field: result
          value:
            record:
            - name: protectionstatus
              value: '1'
              operation: equals
              datatype: string
              mask: false
              entity_check: all
          operation: equals
          datatype: record
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-bitlocker-enabled-on-all-fixed-drives
