assessment:
  id: SV-253465.automated
  version: 2
  assessment_title: WN11-SO-000220 - The system must be configured to meet the minimum session security requirement
    for NTLM SSP based servers.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-registry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          value: SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0
        name:
          operation: equals
          datatype: string
          value: NTLMMinServerSec
      object_title: null
  states:
    state-value-bitwise-and-537395200:
      state_title: Value bitwise and 537395200
      capability: windows.registry
      state:
        all:
        - field: type
          value: reg_dword
          operation: equals
          datatype: string
          entity_check: all
          entity_existence: at_least_one_exists
        - field: value
          value: '537395200'
          operation: equals
          datatype: int
          entity_check: all
          entity_existence: at_least_one_exists
  tests:
    test-network-security-minimum-session-security-ntlm-ssp-based-including-secure:
      test_title: '''Network security: Minimum session security for NTLM SSP based (including secure RPC) servers''
        is set to ''Require NTLMv2 session security'' and ''Require 128-bit encryption'''
      capability: windows.registry
      object: windows-registry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-value-bitwise-and-537395200
  evaluate:
    test: test-network-security-minimum-session-security-ntlm-ssp-based-including-secure
