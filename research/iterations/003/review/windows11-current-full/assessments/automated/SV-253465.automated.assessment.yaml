assessment:
  id: SV-253465.automated
  version: 2
  assessment_title: WN11-SO-000220 - The system must be configured to meet the minimum session security requirement
    for NTLM SSP based servers.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    windows-registry-collection:
      collection_title: null
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0
        name:
          operation: equals
          datatype: string
          mask: false
          value: NTLMMinServerSec
  tests:
    test-network-security-minimum-session-security-ntlm-ssp-based-including-secure:
      test_title: '''Network security: Minimum session security for NTLM SSP based (including secure RPC) servers''
        is set to ''Require NTLMv2 session security'' and ''Require 128-bit encryption'''
      capability: windows.registry
      collection: windows-registry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Value bitwise and 537395200
        state:
          all:
          - field: type
            value: reg_dword
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: '537395200'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    test: test-network-security-minimum-session-security-ntlm-ssp-based-including-secure
