assessment:
  id: windows11-stig-current-full.condition.camera-installation.assessment
  version: 18
  assessment_title: Camera Installation
  mode: automated
  class: inventory
  purpose: applicability
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    run-command-get-pnpdevice-class-camera-status-ok-class-object:
      capability: independent.shellcommand
      select:
        shell:
          operation: equals
          datatype: string
          value: powershell
        command:
          operation: equals
          datatype: string
          value: (Get-PnpDevice -class camera -status OK).class
      filters:
      - action: include
        state: state-check-if-get-pnpdevice-command-returned-any-items-with-c
      object_title: 'Run command: (Get-PnpDevice -class camera -status OK).class'
  states:
    state-check-if-get-pnpdevice-command-returned-any-items-with-c:
      state_title: Check if Get-PnpDevice command returned any items with class 'Camera'
      capability: independent.shellcommand
      state:
        field: stdout_line
        value: Camera
        operation: case insensitive equals
        datatype: string
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-report-true-if-camera-installed:
      test_title: Report true if camera installed.
      capability: independent.shellcommand
      object: run-command-get-pnpdevice-class-camera-status-ok-class-object
      check_existence: at_least_one_exists
      check: all
  evaluate:
    test: test-report-true-if-camera-installed
