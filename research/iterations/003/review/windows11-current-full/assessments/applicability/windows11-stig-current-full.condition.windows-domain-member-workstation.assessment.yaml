assessment:
  id: windows11-stig-current-full.condition.windows-domain-member-workstation.assessment
  version: 2
  assessment_title: Windows Domain Member Workstation
  mode: automated
  class: inventory
  purpose: applicability
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    windows-wmi57-object:
      capability: windows.wmi57
      select:
        namespace:
          operation: equals
          datatype: string
          value: root\cimv2
        wql:
          operation: equals
          datatype: string
          value: SELECT DomainRole FROM win32_computersystem
      object_title: null
  states:
    state-domain-member-workstation:
      state_title: Domain Member Workstation
      capability: windows.wmi57
      state:
        field: result
        value:
          record:
          - name: domainrole
            value: '1'
            operation: equals
            datatype: string
            entity_check: all
        operation: equals
        datatype: record
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-system-windows-domain-member-workstation:
      test_title: The system is a Windows Domain Member Workstation
      capability: windows.wmi57
      object: windows-wmi57-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-domain-member-workstation
  evaluate:
    test: test-system-windows-domain-member-workstation
