assessment:
  id: condition.windows-enterprise-ltsc.assessment
  version: 1
  assessment_title: Windows Enterprise LTSC
  mode: automated
  class: inventory
  purpose: applicability
  collections:
    editionid-collection:
      collection_title: EditionID
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Windows NT\CurrentVersion
        name:
          operation: equals
          datatype: string
          mask: false
          value: EditionId
  tests:
    test-os-windows-enterprise-ltsc:
      test_title: The OS is Windows Enterprise LTSC
      capability: windows.registry
      collection: editionid-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: EditionID = EnterpriseS (reg_sz)
        state:
          all:
          - field: type
            value: reg_sz
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: value
            value: EnterpriseS
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    not:
      test: test-os-windows-enterprise-ltsc
