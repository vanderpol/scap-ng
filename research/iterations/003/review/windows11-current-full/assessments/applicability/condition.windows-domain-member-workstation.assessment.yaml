assessment:
  id: condition.windows-domain-member-workstation.assessment
  version: 2
  assessment_title: Windows Domain Member Workstation
  mode: automated
  class: inventory
  purpose: applicability
  collections:
    windows-wmi57-collection:
      collection_title: null
      select:
        namespace:
          operation: equals
          datatype: string
          mask: false
          value: root\cimv2
        wql:
          operation: equals
          datatype: string
          mask: false
          value: SELECT DomainRole FROM win32_computersystem
  tests:
    test-system-windows-domain-member-workstation:
      test_title: The system is a Windows Domain Member Workstation
      capability: windows.wmi57
      collection: windows-wmi57-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Domain Member Workstation
        state:
          field: result
          value:
            record:
            - name: domainrole
              value: '1'
              operation: equals
              datatype: string
              mask: false
              entity_check: all
          operation: equals
          datatype: record
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    test: test-system-windows-domain-member-workstation
