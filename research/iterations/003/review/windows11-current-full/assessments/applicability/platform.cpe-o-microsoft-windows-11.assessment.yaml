assessment:
  id: platform.cpe-o-microsoft-windows-11.assessment
  version: 2
  assessment_title: Microsoft Windows 11
  mode: automated
  class: inventory
  purpose: applicability
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.1.0
  objects:
    os-family-object:
      capability: independent.family
      object_title: OS family
    productname-registry-entry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Windows NT\CurrentVersion
        name:
          operation: equals
          datatype: string
          mask: false
          value: ProductName
      object_title: ProductName registry entry
    currentbuildnumber-registry-entry-object:
      capability: windows.registry
      select:
        hive:
          operation: equals
          datatype: string
          mask: false
          value: HKEY_LOCAL_MACHINE
        key:
          operation: equals
          datatype: string
          mask: false
          value: SOFTWARE\Microsoft\Windows NT\CurrentVersion
        name:
          operation: equals
          datatype: string
          mask: false
          value: CurrentBuildNumber
      object_title: CurrentBuildNumber registry entry
  states:
    state-microsoft-windows-family:
      state_title: Microsoft Windows family
      capability: independent.family
      state:
        field: family
        value: windows
        operation: equals
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-10-or-windows-11:
      state_title: Windows 10 or Windows 11
      capability: windows.registry
      state:
        field: value
        value: ^[Ww][Ii][Nn][Dd][Oo][Ww][Ss] 1[01].*$
        operation: pattern match
        datatype: string
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
    state-windows-registry:
      state_title: null
      capability: windows.registry
      state:
        field: value
        value: '22000'
        operation: greater than or equal
        datatype: int
        mask: false
        entity_check: all
        entity_existence: at_least_one_exists
  tests:
    test-installed-operating-system-belongs-microsoft-windows-family:
      test_title: The installed operating system belongs to the Microsoft Windows family
      capability: independent.family
      object: os-family-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-microsoft-windows-family
    test-installed-operating-system-windows-10-or-11:
      test_title: The installed operating system is Windows 10 or 11
      capability: windows.registry
      object: productname-registry-entry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-10-or-windows-11
    test-current-build-number-22000-or-greater:
      test_title: The current build number is 22000 or greater.
      capability: windows.registry
      object: currentbuildnumber-registry-entry-object
      check_existence: at_least_one_exists
      check: all
      states:
      - state-windows-registry
  evaluate:
    all:
    - test: test-installed-operating-system-belongs-microsoft-windows-family
    - test: test-installed-operating-system-windows-10-or-11
    - test: test-current-build-number-22000-or-greater
