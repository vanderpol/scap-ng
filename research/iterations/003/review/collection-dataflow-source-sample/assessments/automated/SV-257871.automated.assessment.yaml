assessment:
  id: SV-257871.automated
  version: 1
  assessment_title: RHEL-09-231150 - RHEL 9 must mount /var/log with the noexec option.
  mode: automated
  class: compliance
  purpose: assessment
  tests:
    test-var-log-mounted-noexec-option:
      test_title: /var/log is mounted with the noexec option
      capability: linux.partition
      collection: linux-partition-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          field: mount_options
          value: noexec
          operation: equals
          datatype: string
          mask: false
          entity_check: at least one
          entity_existence: at_least_one_exists
    test-var-log-configured-noexec-option-in-etc-fstab:
      test_title: /var/log is configured with the noexec option in /etc/fstab
      capability: independent.variable
      collection: independent-variable-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: null
        state:
          field: value
          value: noexec
          operation: equals
          datatype: string
          mask: false
          entity_check: at least one
          entity_existence: at_least_one_exists
    test-var-log-configured-in-etc-fstab:
      test_title: /var/log is configured in /etc/fstab
      capability: independent.textfilecontent54
      collection: independent-textfilecontent54-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
  evaluate:
    all:
    - test: test-var-log-mounted-noexec-option
    - test: test-var-log-configured-noexec-option-in-etc-fstab
    - test: test-var-log-configured-in-etc-fstab
  variables:
    mount-options-var-log-in-etc-fstab-variable:
      title: Mount options for /var/log in /etc/fstab
      kind: local
      datatype: string
      expression:
        split:
          value:
            values:
              collection: independent-textfilecontent54-collection
              field: subexpression
          delimiter: ','
  collections:
    linux-partition-collection:
      collection_title: null
      select:
        mount_point:
          operation: equals
          datatype: string
          mask: false
          value: /var/log
    independent-textfilecontent54-collection:
      collection_title: null
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/fstab
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*[^#\s]+\s+/var/log\s+\S+\s+(\S+)\s+\S+\s+\S+\s*$
        instance:
          operation: equals
          datatype: int
          mask: false
          value: '1'
    independent-variable-collection:
      collection_title: null
      select:
        var_ref:
          operation: equals
          datatype: string
          mask: false
          value:
            variable: mount-options-var-log-in-etc-fstab-variable
