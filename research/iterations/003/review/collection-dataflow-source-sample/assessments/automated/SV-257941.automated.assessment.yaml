assessment:
  id: SV-257941.automated
  version: 1
  assessment_title: RHEL-09-251040 - RHEL 9 network interfaces must not be in promiscuous mode.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    all-interfaces-collection:
      collection_title: All Interfaces
      select:
        name:
          operation: pattern match
          datatype: string
          mask: false
          value: .*
  tests:
    test-no-network-interfaces-in-promiscuous-mode:
      test_title: no network interfaces are in promiscuous mode
      capability: unix.interface
      collection: all-interfaces-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: Interface is not in PROMISC mode
        state:
          field: flag
          value: (^|\s)PROMISC(\s|$)
          operation: pattern match
          datatype: string
          mask: false
          entity_check: none satisfy
          entity_existence: at_least_one_exists
  evaluate:
    test: test-no-network-interfaces-in-promiscuous-mode
