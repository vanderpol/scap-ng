assessment:
  id: SV-257948.automated
  version: 1
  assessment_title: RHEL-09-252035 - RHEL 9 systems using Domain Name Servers (DNS) resolution must have at least
    two name servers configured.
  mode: automated
  class: compliance
  purpose: assessment
  tests:
    test-system-using-dns:
      test_title: The system is using DNS
      capability: independent.textfilecontent54
      collection: etc-nsswitch-conf-hosts-entry-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: hosts entry contains dns
        state:
          field: subexpression
          value: (^|\s)dns(\s|$)
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-etc-resolv-conf-contains-at-least-one-nameserver-entry:
      test_title: /etc/resolv.conf contains at least one nameserver entry
      capability: independent.textfilecontent54
      collection: etc-resolv-conf-nameserver-entries-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state: null
    test-etc-resolv-conf-configured-at-least-two-name-servers:
      test_title: /etc/resolv.conf is configured with at least two name servers
      capability: independent.variable
      collection: count-unique-name-servers-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: /etc/resolv.conf is configured with at least two name servers
        state:
          field: value
          value: '2'
          operation: greater than or equal
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    any:
    - not:
        test: test-system-using-dns
    - all:
      - test: test-system-using-dns
      - test: test-etc-resolv-conf-contains-at-least-one-nameserver-entry
      - test: test-etc-resolv-conf-configured-at-least-two-name-servers
  variables:
    count-unique-name-servers-variable:
      title: count of unique name servers
      kind: local
      datatype: int
      expression:
        count:
          unique:
            values:
              collection: etc-resolv-conf-nameserver-entries-collection
              field: subexpression
  collections:
    etc-nsswitch-conf-hosts-entry-collection:
      collection_title: /etc/nsswitch.conf hosts entry
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/nsswitch.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*hosts:\s*(.*)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    etc-resolv-conf-nameserver-entries-collection:
      collection_title: /etc/resolv.conf nameserver entries
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/resolv.conf
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^nameserver\s+(.*)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    count-unique-name-servers-collection:
      collection_title: count of unique name servers
      select:
        var_ref:
          operation: equals
          datatype: string
          mask: false
          value:
            variable: count-unique-name-servers-variable
