assessment:
  id: SV-258241.automated
  version: 13
  assessment_title: RHEL 9 must implement a FIPS 140-3-compliant systemwide cryptographic policy.
  mode: automated
  class: compliance
  purpose: assessment
  collections:
    retrieve-system-wide-crypto-policy-ies-collection:
      collection_title: Retrieve system wide crypto policy(ies).
      select:
        shell:
          operation: equals
          datatype: string
          mask: false
          value: bash
        command:
          operation: equals
          datatype: string
          mask: false
          value: update-crypto-policies --show
    retrieve-current-minimum-crypto-policy-configuration-collection:
      collection_title: Retrieve the current minimum crypto-policy configuration.
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/crypto-policies/state/CURRENT.pol
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^hash\s*=\s*.*$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    retrieve-current-minimum-crypto-policy-configuration-hash-values-subexpression-collection:
      collection_title: Retrieve the current minimum crypto-policy configuration with hash values subexpression.
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/crypto-policies/state/CURRENT.pol
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^hash\s*=\s*([^#\n]+)$
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
    retrieve-current-minimum-rsa-size-collection:
      collection_title: Retrieve the current minimum rsa size.
      select:
        filepath:
          operation: equals
          datatype: string
          mask: false
          value: /etc/crypto-policies/state/CURRENT.pol
        pattern:
          operation: pattern match
          datatype: string
          mask: false
          value: ^\s*min_rsa_size\s*=\s*(\d+)
        instance:
          operation: greater than or equal
          datatype: int
          mask: false
          value: '1'
  variables:
    allowed-fips-algorithms-variable:
      title: Allowed FIPS algorithms.
      kind: constant
      datatype: string
      expression:
        literal:
        - SHA2-256
        - SHA2-384
        - SHA2-512
        - SHA2-224
        - SHA3-256
        - SHA3-384
        - SHA3-384
        - SHA3-512
        - SHAKE-256
  tests:
    test-verify-rhel-9-set-use-fips-140-3-compliant-systemwide:
      test_title: Verify RHEL 9 is set to use a FIPS 140-3-compliant systemwide cryptographic policy.
      capability: independent.shellcommand
      collection: retrieve-system-wide-crypto-policy-ies-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Confirm system wide crypto policy(ies) are correct.
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: ^FIPS:*
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    test-verify-current-minimum-crypto-policy-configuration:
      test_title: Verify the current minimum crypto-policy configuration.
      capability: independent.textfilecontent54
      collection: retrieve-current-minimum-crypto-policy-configuration-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Confirm correct algorithms.
        state:
          field: text
          value:
            variable: allowed-fips-algorithms-variable
          operation: pattern match
          datatype: string
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
    test-verify-no-sha1-algorithms-employed:
      test_title: Verify no SHA1 algorithms are employed.
      capability: independent.textfilecontent54
      collection: retrieve-current-minimum-crypto-policy-configuration-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: Check for existence of SHA1 algorithms (negated at criterion level).
        state:
          field: text
          value: SHA1-\d
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-verify-minimum-hash-values-224:
      test_title: Verify minimum hash values of 224.
      capability: independent.textfilecontent54
      collection: retrieve-current-minimum-crypto-policy-configuration-hash-values-subexpression-collection
      assertion:
        existence: any_exist
        item_quantifier: all
        state_title: Confirm minimum hash values of 224.
        state:
          field: subexpression
          value: \b[A-Z]+\d*-((\d{1,2}\b)|(1\d\d\b)|(21\d\b)|(22[1-3]\b))
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    test-verify-minimum-rsa-size-2048:
      test_title: Verify minimum rsa size of 2048.
      capability: independent.textfilecontent54
      collection: retrieve-current-minimum-rsa-size-collection
      assertion:
        existence: at_least_one_exists
        item_quantifier: all
        state_title: Confirm minimum rsa size of 2048.
        state:
          field: subexpression
          value: '2048'
          operation: greater than or equal
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - test: test-verify-rhel-9-set-use-fips-140-3-compliant-systemwide
    - test: test-verify-current-minimum-crypto-policy-configuration
    - not:
        test: test-verify-no-sha1-algorithms-employed
    - not:
        test: test-verify-minimum-hash-values-224
    - test: test-verify-minimum-rsa-size-2048
