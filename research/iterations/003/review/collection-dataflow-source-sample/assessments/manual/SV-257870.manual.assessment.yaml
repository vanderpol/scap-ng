  purpose: assessment
  class: compliance
  procedure: 'Verify "/var/log" is mounted with the "nodev" option: $ mount | grep /var/log /dev/mapper/rhel-var-log
    on /var/log type xfs (rw,nodev,nosuid,noexec,seclabel) If the "/var/log" file system is mounted without the
    "nodev" option, this is a finding.'
