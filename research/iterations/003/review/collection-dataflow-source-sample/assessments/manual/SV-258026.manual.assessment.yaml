assessment:
  id: SV-258026.manual
  version: 1
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: This requirement assumes the use of the RHEL 9 default graphical user interface, the GNOME desktop
    environment. If the system does not have any graphical user interface installed, this requirement is Not Applicable.
    Verify RHEL 9 prevents a user from overriding settings for graphical user interfaces. $ gsettings writable org.gnome.desktop.screensaver
    lock-delay false If "lock-delay" is writable and the result is "true", this is a finding.'
  inputs: []
  evidence: []
