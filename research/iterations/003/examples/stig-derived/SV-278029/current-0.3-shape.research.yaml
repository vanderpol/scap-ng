# Research: closest current 0.3.0 authored shape.
# NOT validated/tested, NOT a lossless conversion or compliant publisher policy.
# The final not_applicable arm is a diagnostic placeholder, not a settled STIG disposition.
# The existing domain-joined dependency is OLD-format source and the PDC dependency is UNSATISFIED.
assessment:
  id: example.sv-278029-windows-time
  version: 1
  assessment_title: Windows Server 2025 time synchronization configuration
  mode: automated
  class: compliance
  purpose: assessment
  inputs:
    authorized-time-sources-input:
      datatype: string
      cardinality: one_or_more
      required: true
      description: Publisher-delegated approved DoW time source identifiers.

  # An existing legacy applicability Assessment can be upgraded and reused.
  # A dedicated PDC Emulator holder Assessment is a RESEARCH DEPENDENCY:
  # it is not implemented and cannot be treated as resolved.
  dependencies:
    domain-joined:
      assessment: ../../../../../../research/assessment-simplification/samples/ms_windows_server_2025/assessments/applicability/niwc.ms_windows_server_2025.condition.windows-domain-member-server-or-domain-controller.assessment.yaml
      expected_id: niwc.ms_windows_server_2025.condition.windows-domain-member-server-or-domain-controller.assessment
      expected_version: 1
      purpose: applicability
    local-pdc-emulator:
      assessment: RESEARCH-ONLY-NOT-IMPLEMENTED/pdc-emulator-holder.assessment.yaml
      expected_id: research.windows.local-pdc-emulator-holder
      expected_version: 1
      purpose: applicability

  tests:
    time-type-nt5ds-test:
      test_title: Time configuration uses NT5DS
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive: {value: HKEY_LOCAL_MACHINE, operation: equals, datatype: string}
          key: {value: SYSTEM\\CurrentControlSet\\Services\\W32Time\\Parameters, operation: equals, datatype: string}
          name: {value: Type, operation: equals, datatype: string}
      states:
        - capability: windows.registry
          state:
            field: value
            value: NT5DS
            operation: equals
            datatype: string
            match: one_or_more
            existence: one_or_more
      reported_elements: all
      existence: one_or_more
      match: all

    time-type-ntp-test:
      test_title: Time configuration uses NTP
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive: {value: HKEY_LOCAL_MACHINE, operation: equals, datatype: string}
          key: {value: SYSTEM\\CurrentControlSet\\Services\\W32Time\\Parameters, operation: equals, datatype: string}
          name: {value: Type, operation: equals, datatype: string}
      states:
        - capability: windows.registry
          state:
            field: value
            value: NTP
            operation: equals
            datatype: string
            match: one_or_more
            existence: one_or_more
      reported_elements: all
      existence: one_or_more
      match: all

    authorized-ntp-peers-test:
      test_title: Raw NtpServer registry value matches authorized values
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive: {value: HKEY_LOCAL_MACHINE, operation: equals, datatype: string}
          key: {value: SYSTEM\\CurrentControlSet\\Services\\W32Time\\Parameters, operation: equals, datatype: string}
          name: {value: NtpServer, operation: equals, datatype: string}
      states:
        - capability: windows.registry
          state:
            field: value
            operation: equals
            datatype: string
            variable_match: one_or_more
            match: one_or_more
            existence: one_or_more
            value: {input: authorized-time-sources-input}
      reported_elements: all
      existence: one_or_more
      match: all

  evaluate:
    if:
      all:
        - assessment: domain-joined
        - not: {assessment: local-pdc-emulator}
    then: {test: time-type-nt5ds-test}
    else:
      if: {test: time-type-ntp-test}
      then: {test: authorized-ntp-peers-test}
      else:
        not_applicable:
          reason: "RESEARCH PLACEHOLDER: source does not resolve other time Type values"
