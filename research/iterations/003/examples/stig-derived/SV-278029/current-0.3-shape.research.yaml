# Research: closest current 0.3.0 authored shape.
# NOT validated/tested, NOT a lossless conversion or compliant publisher policy.
# The final not_applicable arm is a diagnostic placeholder, not a settled STIG disposition.
assessment:
  id: example.sv-278029-windows-time
  version: 1
  assessment_title: Windows Server 2025 time synchronization configuration
  mode: automated
  class: compliance
  purpose: assessment
  inputs:
    authorized-time-sources-input:
      datatype: string
      cardinality: one_or_more
      required: true
      description: Publisher-delegated approved DoW time source identifiers.

  tests:
    domain-member-not-pdc-test:
      test_title: System is domain joined and is not the PDC Emulator
      capability: windows.wmi.query
      object:
        capability: windows.wmi.query
        collect:
          namespace: root\\cimv2
          query: SELECT DomainRole FROM Win32_ComputerSystem
      states:
        - capability: windows.wmi.query
          state:
            field: result
            record:
              match: all
              existence: one_or_more
              fields:
                domainrole:
                  value: [1, 3, 4]
                  operation: equals
                  datatype: integer
                  variable_match: one_or_more
                  match: one_or_more
                  existence: one_or_more
      reported_elements: all
      existence: one_or_more
      match: all

    time-type-nt5ds-test:
      test_title: Time configuration uses NT5DS
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive: {value: HKEY_LOCAL_MACHINE, operation: equals, datatype: string}
          key: {value: SYSTEM\\CurrentControlSet\\Services\\W32Time\\Parameters, operation: equals, datatype: string}
          name: {value: Type, operation: equals, datatype: string}
      states:
        - capability: windows.registry
          state:
            field: value
            value: NT5DS
            operation: equals
            datatype: string
            match: one_or_more
            existence: one_or_more
      reported_elements: all
      existence: one_or_more
      match: all

    time-type-ntp-test:
      test_title: Time configuration uses NTP
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive: {value: HKEY_LOCAL_MACHINE, operation: equals, datatype: string}
          key: {value: SYSTEM\\CurrentControlSet\\Services\\W32Time\\Parameters, operation: equals, datatype: string}
          name: {value: Type, operation: equals, datatype: string}
      states:
        - capability: windows.registry
          state:
            field: value
            value: NTP
            operation: equals
            datatype: string
            match: one_or_more
            existence: one_or_more
      reported_elements: all
      existence: one_or_more
      match: all

    authorized-ntp-peers-test:
      test_title: Raw NtpServer registry value matches authorized values
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive: {value: HKEY_LOCAL_MACHINE, operation: equals, datatype: string}
          key: {value: SYSTEM\\CurrentControlSet\\Services\\W32Time\\Parameters, operation: equals, datatype: string}
          name: {value: NtpServer, operation: equals, datatype: string}
      states:
        - capability: windows.registry
          state:
            field: value
            operation: equals
            datatype: string
            variable_match: one_or_more
            match: one_or_more
            existence: one_or_more
            value: {input: authorized-time-sources-input}
      reported_elements: all
      existence: one_or_more
      match: all

  evaluate:
    if: {test: domain-member-not-pdc-test}
    then: {test: time-type-nt5ds-test}
    else:
      if: {test: time-type-ntp-test}
      then: {test: authorized-ntp-peers-test}
      else:
        not_applicable:
          reason: "RESEARCH PLACEHOLDER: source does not resolve other time Type values"
