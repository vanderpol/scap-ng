    - id: test-load-state
      source_oval_test_id: oval:mil.disa.stig.linux:tst:23031000
      test_title: kdump.service LoadState is masked if it exists.
      capability: linux.systemdunitproperty
      outcome: false
      existence: any_exist
      check: all
      object_ref: object-load-state
      state_refs: [state-masked]
      item_refs: [item-1]
      decisive_explanation:
        reason: value_mismatch
        actual: loaded
        expected: masked
        message: kdump.service LoadState is "loaded"; expected "masked".

    - id: test-unit-file-state
      source_oval_test_id: oval:mil.disa.stig.linux:tst:23031001
