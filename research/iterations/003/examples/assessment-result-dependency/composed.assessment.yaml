    id: scap-ng.pre-alpha.assessment
    version: "0.1.0"
  id: example.composed-assessment
  version: 1
  assessment_title: Example composed Assessment
  mode: automated
  class: compliance
  purpose: assessment

  dependencies:
    platform_applicable:
      assessment: ../applicability/example-platform.assessment.yaml
      expected_id: example.platform-applicable
      expected_version: 1
      purpose: applicability

  objects: {}
  variables: {}
  states: {}

  tests:
    local-setting-correct:
      test_title: Local setting is correct
      capability: independent.unknown
      result: unknown

  evaluate:
    all:
      - assessment: platform_applicable
