rule:
  id: EXAMPLE-ORG-INPUT-001
  assessment_choices:
    automated:
      assessment: time-source.assessment.yaml
      inputs:
        required_time_sources:
          parameter: approved_time_sources
  default_assessment_choice: automated
  organizational_input_requirements:
    automated:
      - input: approved_time_sources
        required: true
        uses:
          - test: test-time-sources
            state: state-source-approved
            state_slot: hostname
