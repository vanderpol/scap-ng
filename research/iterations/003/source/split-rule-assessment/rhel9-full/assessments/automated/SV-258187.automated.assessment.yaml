assessment:
  id: SV-258187.automated
  version: 1
  assessment_title: RHEL-09-654065 - RHEL 9 must audit all uses of the rename, unlink, rmdir, renameat,
    and unlinkat system calls.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    audit-32-bit-invocations-rename:
      test_title: Audit 32-bit invocations of rename
      collect:
        object_title: 32-bit rename command
        capability: independent.textfilecontent54
        select:
          filepath: /etc/audit/audit.rules
          pattern:
            operation: pattern match
            value: ^\s*-a\s+(always,exit|exit,always)\s+-F\s+arch=b32\s+(?:.*(-S\s+rename\s+|(\s+|,)rename(\s+|,))).*-F\s+auid>=1000\s+-F\s+auid!=(4294967295|-1|unset)(\s+(-k\s+|-F\s+key=)[-\w]+)*\s*$
          instance:
            operation: greater than or equal
            datatype: int
            value: '1'
      assert:
        existence: all_exist
        check: all
        state: null
    audit-64-bit-invocations-rename:
