assessment:
  id: SV-258122.automated
  version: 1
  assessment_title: RHEL-09-611165 - RHEL 9 must enable certificate based smart card authentication.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    sssd-conf-pam-cert-auth-true:
      test_title: 'sssd.conf: pam_cert_auth = True'
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: 'sssd.conf: pam_cert_auth'
              capability: independent.textfilecontent54
              select:
                filepath:
                  operation: equals
                  datatype: string
                  mask: false
                  value: /etc/sssd/sssd.conf
                pattern:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: ^\s*pam_cert_auth\s*=\s*(.*)\s*$
                instance:
                  operation: greater than or equal
                  datatype: int
                  mask: false
                  value: '1'
          - collect:
              object_title: '/etc/sssd/conf.d: pam_cert_auth'
              capability: independent.textfilecontent54
              select:
                path:
                  operation: equals
                  datatype: string
                  mask: false
                  value: /etc/sssd/conf.d
                filename:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: .+
                pattern:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: ^\s*pam_cert_auth\s*=\s*(.*)\s*$
                instance:
                  operation: greater than or equal
                  datatype: int
                  mask: false
                  value: '1'
              behaviors:
                recurse_direction: down
      assert:
        existence: at_least_one_exists
        check: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: 'true'
          operation: case insensitive equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    check: sssd-conf-pam-cert-auth-true
