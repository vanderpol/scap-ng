assessment:
  id: SV-257994.automated
  version: 1
  assessment_title: RHEL-09-255090 - RHEL 9 must force a frequent session key renegotiation for SSH connections
    to the server.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    etc-ssh-sshd-config-rekeylimit-max-data-time-greater-than:
      test_title: /etc/ssh/sshd_config:RekeyLimit max data and time are greater than zero.
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/ssh/sshd_config
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^\s*RekeyLimit\s+\d+[kmg]?\s+\d+[smdhw]?\s*
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
        behaviors:
          ignore_case: 'true'
      assert:
        existence: all_exist
        check: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: text
          value: ^(?i)\s*RekeyLimit\s+[1-9][0-9]*[kmg]?\s+([1-9][0-9]*[smhdw]?)+\s*$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    sshd-config-includes-sshd-config-d:
      test_title: sshd_config includes sshd_config.d
      capability: independent.textfilecontent54
      collect:
        object_title: sshd_config includes
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/ssh/sshd_config
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^\s*include\s+(.*)\s*$
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
        behaviors:
          ignore_case: 'true'
      assert:
        existence: at_least_one_exists
        check: at least one
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: /etc/ssh/sshd_config.d/*.conf
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    etc-ssh-sshd-config-d-rekeylimit-max-data-time-greater:
      test_title: /etc/ssh/sshd_config.d:RekeyLimit max data and time are greater than zero.
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          path:
            operation: equals
            datatype: string
            mask: false
            value: /etc/ssh/sshd_config.d
          filename:
            operation: pattern match
            datatype: string
            mask: false
            value: ^.+\.conf$
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^\s*RekeyLimit\s+\d+[kmg]?\s+\d+[smdhw]?\s*
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
        behaviors:
          ignore_case: 'true'
      assert:
        existence: all_exist
        check: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: text
          value: ^(?i)\s*RekeyLimit\s+[1-9][0-9]*[kmg]?\s+([1-9][0-9]*[smhdw]?)+\s*$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    any:
    - check: etc-ssh-sshd-config-rekeylimit-max-data-time-greater-than
    - all:
      - check: sshd-config-includes-sshd-config-d
      - check: etc-ssh-sshd-config-d-rekeylimit-max-data-time-greater
