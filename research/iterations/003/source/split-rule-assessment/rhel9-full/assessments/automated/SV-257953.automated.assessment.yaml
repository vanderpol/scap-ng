assessment:
  id: SV-257953.automated
  version: 1
  assessment_title: RHEL-09-252060 - RHEL 9 must forward mail from postmaster to the root account using
    a postfix alias.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    etc-aliases-contains-postmaster-root:
      test_title: '/etc/aliases contains ''postmaster: root'''
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          path:
            operation: equals
            datatype: string
            mask: false
            value: /etc/
          filename:
            operation: pattern match
            datatype: string
            mask: false
            value: aliases
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^\s*postmaster:\s*root\s*$
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state: null
  evaluate:
    check: etc-aliases-contains-postmaster-root
