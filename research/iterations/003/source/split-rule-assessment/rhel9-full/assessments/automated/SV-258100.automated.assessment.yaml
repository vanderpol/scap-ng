assessment:
  id: SV-258100.automated
  version: 1
  assessment_title: RHEL-09-611055 - RHEL 9 system-auth must be configured to use a sufficient number
    of hashing rounds.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    pam-unix-module-included-in-system-auth-configured-100000-or:
      test_title: The pam_unix module is included in system-auth and configured for 100000 or more rounds.
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/pam.d/system-auth
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^\s*password\s+sufficient\s+pam_unix\.so\s+[^#\n]*\brounds=(\d+)\b
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: subexpression
          value: '100000'
          operation: greater than or equal
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_capability: independent.textfilecontent54
  evaluate:
    check: pam-unix-module-included-in-system-auth-configured-100000-or
