assessment:
  id: SV-257797.automated
  version: 2
  assessment_title: RHEL-09-213010 - RHEL 9 must restrict access to the kernel message buffer.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    kernel-dmesg-restrict-setting-in-kernel-set-1:
      test_title: kernel.dmesg_restrict setting in kernel is set to 1
      collect:
        object_title: null
        capability: unix.sysctl
        select:
          name: kernel.dmesg_restrict
      assert:
        existence: all_exist
        check: all
        state:
          field: value
          operation: equals
          value: '1'
          datatype: int
  evaluate:
    check: kernel-dmesg-restrict-setting-in-kernel-set-1
