assessment:
  id: SV-258118.automated
  version: 2
  assessment_title: RHEL-09-611145 - RHEL 9 must not be configured to bypass password requirements for
    privilege escalation.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    pam-succeed-if-not-present-in-etc-pam-d-sudo:
      test_title: pam_succeed_if is not present in /etc/pam.d/sudo
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath: /etc/pam.d/sudo
          pattern:
            operation: pattern match
            value: ^\s*[^#\n]*\bpam_succeed_if\b
          instance:
            operation: greater than or equal
            value: '1'
      assert:
        state_title: null
        existence: none_exist
        check: all
        state: null
  evaluate:
    check: pam-succeed-if-not-present-in-etc-pam-d-sudo
