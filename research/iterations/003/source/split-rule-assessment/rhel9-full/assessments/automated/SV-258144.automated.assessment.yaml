assessment:
  id: SV-258144.automated
  version: 2
  assessment_title: RHEL-09-652030 - All RHEL 9 remote access methods must be monitored.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    rsyslog-auth-configured-logged:
      test_title: 'rsyslog: auth.* is configured to be logged'
      collect:
        object_title: null
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                filepath: /etc/rsyslog.conf
                pattern:
                  operation: pattern match
                  value: ^[ \t]*(?:\S+;auth\.\*|auth\.\*;\S+|auth\.\*|\S+;auth\.\*;\S+)[ \t]+\S+\s*$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                path: /etc/rsyslog.d
                filename:
                  operation: pattern match
                  value: ^.*\.conf$
                pattern:
                  operation: pattern match
                  value: ^[ \t]*(?:\S+;auth\.\*|auth\.\*;\S+|auth\.\*|\S+;auth\.\*;\S+)[ \t]+\S+\s*$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
      assert:
        state_title: null
        existence: at_least_one_exists
        check: all
        state: null
    rsyslog-authpriv-configured-logged:
      test_title: 'rsyslog: authpriv.* is configured to be logged'
      collect:
        object_title: null
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                filepath: /etc/rsyslog.conf
                pattern:
                  operation: pattern match
                  value: ^[ \t]*(?:\S+;authpriv\.\*|authpriv\.\*;\S+|authpriv\.\*|\S+;authpriv\.\*;\S+)[
                    \t]+\S+\s*$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                path: /etc/rsyslog.d
                filename:
                  operation: pattern match
                  value: ^.*\.conf$
                pattern:
                  operation: pattern match
                  value: ^[ \t]*(?:\S+;authpriv\.\*|authpriv\.\*;\S+|authpriv\.\*|\S+;authpriv\.\*;\S+)[
                    \t]+\S+\s*$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
      assert:
        state_title: null
        existence: at_least_one_exists
        check: all
        state: null
    rsyslog-daemon-configured-logged:
      test_title: 'rsyslog: daemon.* is configured to be logged'
      collect:
        object_title: null
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                filepath: /etc/rsyslog.conf
                pattern:
                  operation: pattern match
                  value: ^[ \t]*(?:\S+;daemon\.\*|daemon\.\*;\S+|daemon\.\*|\S+;daemon\.\*;\S+)[ \t]+\S+\s*$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                path: /etc/rsyslog.d
                filename:
                  operation: pattern match
                  value: ^.*\.conf$
                pattern:
                  operation: pattern match
                  value: ^[ \t]*(?:\S+;daemon\.\*|daemon\.\*;\S+|daemon\.\*|\S+;daemon\.\*;\S+)[ \t]+\S+\s*$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
      assert:
        state_title: null
        existence: at_least_one_exists
        check: all
        state: null
  evaluate:
