assessment:
  id: SV-257806.automated
  version: 2
  assessment_title: RHEL-09-213055 - RHEL 9 must be configured to disable the FireWire kernel module.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    etc-modprobe-d-contains-file-that-contains-install-firewire-core:
      test_title: /etc/modprobe.d contains a file that contains 'install firewire-core /bin/false'
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          path: /etc/modprobe.d
          filename:
            operation: pattern match
            value: .*
          pattern:
            operation: pattern match
            value: ^[ \t]*install[ \t]+firewire-core[ \t]+/bin/false[ \t]*$
          instance:
            operation: greater than or equal
            value: '1'
      assert:
        state_title: null
        existence: at_least_one_exists
        check: all
        state: null
    etc-modprobe-d-contains-file-that-contains-blacklist-firewire-core:
      test_title: /etc/modprobe.d contains a file that contains 'blacklist firewire-core'
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          path: /etc/modprobe.d
          filename:
            operation: pattern match
            value: .*
          pattern:
            operation: pattern match
            value: ^[ \t]*blacklist[ \t]+firewire-core[ \t]*$
          instance:
            operation: greater than or equal
            value: '1'
      assert:
        state_title: null
        existence: at_least_one_exists
        check: all
        state: null
    etc-modprobe-conf-contains-install-firewire-core-bin-false:
      test_title: /etc/modprobe.conf contains 'install firewire-core /bin/false'
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath: /etc/modprobe.conf
          pattern:
            operation: pattern match
            value: ^[ \t]*install[ \t]+firewire-core[ \t]+/bin/false[ \t]*$
          instance: '1'
      assert:
        state_title: null
        existence: at_least_one_exists
        check: all
        state: null
    etc-modprobe-conf-contains-blacklist-firewire-core:
      test_title: /etc/modprobe.conf contains 'blacklist firewire-core'
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath: /etc/modprobe.conf
          pattern:
            operation: pattern match
            value: ^[ \t]*blacklist[ \t]+firewire-core[ \t]*$
          instance: '1'
      assert:
        state_title: null
        existence: at_least_one_exists
        check: all
        state: null
  evaluate:
    any:
    - all:
      - check: etc-modprobe-d-contains-file-that-contains-install-firewire-core
      - check: etc-modprobe-d-contains-file-that-contains-blacklist-firewire-core
    - all:
      - check: etc-modprobe-conf-contains-install-firewire-core-bin-false
      - check: etc-modprobe-conf-contains-blacklist-firewire-core
