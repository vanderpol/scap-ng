assessment:
  id: SV-258091.automated
  version: 2
  assessment_title: RHEL-09-611010 - RHEL 9 must ensure the password complexity module in the system-auth
    file is configured for three retries or less.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    etc-security-pwquality-conf-retry-not-greater-than-3-not:
      test_title: /etc/security/pwquality.conf:retry not greater than 3 and not 0
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: in /etc/security/pwquality.conf check for pam_pwquality.so retry equals value
              capability: independent.textfilecontent54
              select:
                filepath: /etc/security/pwquality.conf
                pattern:
                  operation: pattern match
                  value: ^\s*retry\s*=\s*(-?\d*)\s*(?:#.*)?$
                instance:
                  datatype: int
                  value: '1'
          - collect:
              object_title: in /etc/security/pwquality.conf check for pam_pwquality.so retry equals value
              capability: independent.textfilecontent54
              select:
                path: /etc/security/pwquality.conf.d
                filename:
                  operation: pattern match
                  value: \.conf$
                pattern:
                  operation: pattern match
                  value: ^\s*retry\s*=\s*(-?\d*)\s*(?:#.*)?$
                instance:
                  datatype: int
                  value: '1'
              behaviors:
                recurse_direction: down
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: subexpression
          operation: pattern match
          value: ^[123]$
          datatype: string
        state_capability: independent.textfilecontent54
  evaluate:
    check: etc-security-pwquality-conf-retry-not-greater-than-3-not
