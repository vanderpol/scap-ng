assessment:
  id: SV-270175.automated
  version: 1
  assessment_title: RHEL-09-232103 - RHEL 9 "/etc/audit/" must be owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    etc-audit-directory-owned-by-root:
      test_title: /etc/audit directory is owned by root
      collect:
        object_title: /etc/audit directory
        capability: unix.file
        select:
          path: /etc/audit
      assert:
        state_title: owned by root
        existence: at_least_one_exists
        check: all
        state:
          field: user_id
          operation: equals
          value: '0'
          datatype: int
  evaluate:
    check: etc-audit-directory-owned-by-root
