assessment:
  id: SV-257927.automated
  version: 1
  assessment_title: RHEL-09-232235 - RHEL 9 cron configuration files directory must be group-owned by
    root.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    cron-configuration-files-group-owned-by-root:
      test_title: cron configuration files are group-owned by root
      capability: unix.file
      collect:
        object_title: null
        capability: unix.file
        select:
          path:
            operation: equals
            datatype: string
            mask: false
            value: /etc
          filename:
            operation: pattern match
            datatype: string
            mask: false
            value: ^cron.*
        behaviors:
          max_depth: '-1'
          recurse_direction: down
      assert:
        existence: at_least_one_exists
        check: all
        state_title: group-owned by root
        state_capability: unix.file
        state:
          field: group_id
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    check: cron-configuration-files-group-owned-by-root
