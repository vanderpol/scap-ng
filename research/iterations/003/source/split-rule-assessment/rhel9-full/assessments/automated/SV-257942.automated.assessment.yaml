assessment:
  id: SV-257942.automated
  version: 2
  assessment_title: RHEL-09-251045 - RHEL 9 must enable hardening for the Berkeley Packet Filter just-in-time
    compiler.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    net-core-bpf-jit-harden-set-2-in-kernel:
      test_title: net.core.bpf_jit_harden is set to 2 in kernel
      collect:
        object_title: null
        capability: unix.sysctl
        select:
          name: net.core.bpf_jit_harden
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: value
          operation: equals
          value: '2'
          datatype: int
  evaluate:
    check: net-core-bpf-jit-harden-set-2-in-kernel
