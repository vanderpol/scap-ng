assessment:
  id: SV-258074.automated
  version: 1
  assessment_title: RHEL-09-412065 - RHEL 9 must define default permissions for all authenticated users
    in such a way that the user can only read and modify their own files.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    etc-login-defs-umask-077:
      test_title: /etc/login.defs:UMASK == 077
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/login.defs
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^\s*UMASK\s+([^#\s]+)
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: subexpression
          value: '077'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_capability: independent.textfilecontent54
  evaluate:
    check: etc-login-defs-umask-077
