assessment:
  id: SV-258178.automated
  version: 1
  assessment_title: RHEL-09-654020 - RHEL 9 must audit all uses of the chown, fchown, fchownat, and lchown
    system calls.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    audit-32-bit-invocations-chown-syscall:
      test_title: Audit 32-bit invocations of chown syscall
      collect:
        object_title: 32-bit chown syscall
        capability: independent.textfilecontent54
        select:
          filepath: /etc/audit/audit.rules
          pattern:
            operation: pattern match
            value: ^\s*-a\s+(always,exit|exit,always)\s+-F\s+arch=b32\s+(?:.*(-S\s+chown\s+|(\s+|,)chown(\s+|,))).*-F\s+auid>=1000\s+-F\s+auid!=(4294967295|-1|unset)(\s+(-k\s+|-F\s+key=)[-\w]+)*\s*$
          instance:
            operation: greater than or equal
            datatype: int
            value: '1'
      assert:
        state_title: null
        existence: all_exist
        check: all
        state: null
    audit-64-bit-invocations-chown-syscall:
