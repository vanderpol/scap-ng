assessment:
  id: SV-258038.automated
  version: 13
  assessment_title: RHEL 9 must block unauthorized peripherals before establishing a connection.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    verify-usbguard-has-policy-configured:
      test_title: Verify the USBGuard has a policy configured.
      capability: independent.shellcommand
      collect:
        object_title: Retrieve usbguard rules list.
        capability: independent.shellcommand
        select:
          shell:
            operation: equals
            datatype: string
            mask: false
            value: bash
          command:
            operation: equals
            datatype: string
            mask: false
            value: usbguard list-rules
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: stdout_line
          value: ''
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: Confirm the existence of usbguard rules.
        state_capability: independent.shellcommand
  evaluate:
    check: verify-usbguard-has-policy-configured
