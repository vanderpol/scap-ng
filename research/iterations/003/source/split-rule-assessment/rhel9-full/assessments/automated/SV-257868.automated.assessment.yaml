assessment:
  id: SV-257868.automated
  version: 1
  assessment_title: RHEL-09-231135 - RHEL 9 must mount /tmp with the nosuid option.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    tmp-mounted-nosuid-option:
      test_title: /tmp is mounted with the nosuid option
      capability: linux.partition
      collect:
        object_title: null
        capability: linux.partition
        select:
          mount_point:
            operation: equals
            datatype: string
            mask: false
            value: /tmp
      assert:
        existence: at_least_one_exists
        check: all
        state_title: null
        state_capability: linux.partition
        state:
          field: mount_options
          value: nosuid
          operation: equals
          datatype: string
          mask: false
          entity_check: at least one
          entity_existence: at_least_one_exists
    tmp-configured-nosuid-option-in-etc-fstab:
      test_title: /tmp is configured with the nosuid option in /etc/fstab
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/fstab
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^\s*[^#\s]+\s+/tmp\s+\S+\s+(\S+)\s+\S+\s+\S+\s*$
          instance:
            operation: equals
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^.*nosuid.*$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - check: tmp-mounted-nosuid-option
    - check: tmp-configured-nosuid-option-in-etc-fstab
