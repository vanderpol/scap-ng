assessment:
  id: SV-257936.automated
  version: 2
  assessment_title: RHEL-09-251015 - The firewalld service on RHEL 9 must be active.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    check-if-firewalld-in-active-state:
      test_title: Check if firewalld is in 'active' state
      capability: linux.systemdunitproperty
      collect:
        object_title: firewalld.service ActiveState
        capability: linux.systemdunitproperty
        select:
          unit:
            operation: equals
            datatype: string
            mask: false
            value: firewalld.service
          property:
            operation: equals
            datatype: string
            mask: false
            value: ActiveState
      assert:
        existence: at_least_one_exists
        check: all
        state_title: null
        state_capability: linux.systemdunitproperty
        state:
          field: value
          value: active
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    check: check-if-firewalld-in-active-state
