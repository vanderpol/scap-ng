assessment:
  id: SV-257984.automated
  version: 2
  assessment_title: RHEL-09-255040 - RHEL 9 SSHD must not allow blank passwords.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    etc-ssh-sshd-config-or-etc-ssh-sshd-config-d:
      test_title: /etc/ssh/sshd_config or /etc/ssh/sshd_config.d/*:PermitEmptyPasswords == no
      collect:
        object_title: PermitEmptyPasswords in all sshd_config and sshd_config.d/* files
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                filepath: /etc/ssh/sshd_config
                pattern:
                  operation: pattern match
                  value: ^(?i)\s*PermitEmptyPasswords\s+(\w+)$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                path: /etc/ssh/sshd_config.d
                filename:
                  operation: pattern match
                  value: .+
                pattern:
                  operation: pattern match
                  value: ^(?i)\s*PermitEmptyPasswords\s+(\w+)$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: subexpression
          operation: pattern match
          value: ^(no|"no")$
          datatype: string
  evaluate:
    check: etc-ssh-sshd-config-or-etc-ssh-sshd-config-d
