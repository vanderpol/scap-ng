assessment:
  id: SV-257974.automated
  version: 2
  assessment_title: RHEL-09-254025 - RHEL 9 must not enable IPv6 packet forwarding unless the system is
    a router.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    net-ipv6-conf-all-forwarding-setting-in-kernel-set-0:
      test_title: net.ipv6.conf.all.forwarding setting in kernel is set to 0
      capability: unix.sysctl
      collect:
        object_title: null
        capability: unix.sysctl
        select:
          name:
            operation: equals
            datatype: string
            mask: false
            value: net.ipv6.conf.all.forwarding
      assert:
        existence: all_exist
        check: all
        state_title: null
        state_capability: unix.sysctl
        state:
          field: value
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    check: net-ipv6-conf-all-forwarding-setting-in-kernel-set-0
