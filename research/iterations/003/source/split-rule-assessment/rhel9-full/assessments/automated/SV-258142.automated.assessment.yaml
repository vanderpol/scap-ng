assessment:
  id: SV-258142.automated
  version: 2
  assessment_title: RHEL-09-652020 - The rsyslog service on RHEL 9 must be active.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    rsyslog-service-active:
      test_title: rsyslog.service is active
      capability: linux.systemdunitproperty
      collect:
        object_title: null
        capability: linux.systemdunitproperty
        select:
          unit:
            operation: equals
            datatype: string
            mask: false
            value: rsyslog.service
          property:
            operation: equals
            datatype: string
            mask: false
            value: ActiveState
      assert:
        existence: at_least_one_exists
        check: all
        state_title: null
        state_capability: linux.systemdunitproperty
        state:
          field: value
          value: active
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    check: rsyslog-service-active
