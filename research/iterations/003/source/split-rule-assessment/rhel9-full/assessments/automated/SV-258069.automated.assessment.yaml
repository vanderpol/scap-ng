assessment:
  id: SV-258069.automated
  version: 1
  assessment_title: RHEL-09-412040 - RHEL 9 must limit the number of concurrent sessions to ten for all
    accounts and/or account types.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    limits-conf-limits-d-conf-maxlogins-set-10-or-less:
      test_title: limits.conf and limits.d/*.conf:maxlogins is set to 10 or less by default
      collect:
        object_title: all default maxlogins settings in /etc/security/limits.conf and /etc/security/limits.d/*.conf
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: default maxlogins in /etc/security/limits.conf
              capability: independent.textfilecontent54
              select:
                filepath: /etc/security/limits.conf
                pattern:
                  operation: pattern match
                  value: ^\s*\*\s+(?:(?:hard)|(?:-))\s+maxlogins\s+(\d+)\s*$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
          - collect:
              object_title: default maxlogins in /etc/security/limits.d/*.conf
              capability: independent.textfilecontent54
              select:
                path: /etc/security/limits.d
                filename:
                  operation: pattern match
                  value: .*\.conf$
                pattern:
                  operation: pattern match
                  value: ^\s*\*\s+(?:(?:hard)|(?:-))\s+maxlogins\s+(\d+)\s*$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: subexpression
          operation: less than or equal
          value: '10'
          datatype: int
    limits-conf-limits-d-conf-maxlogins-set-10-or-less-2:
      test_title: limits.conf and limits.d/*.conf:maxlogins is set to 10 or less for non-default domains
      collect:
        object_title: all non-default maxlogins settings in /etc/security/limits.conf and /etc/security/limits.d/*.conf
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: non-default maxlogins in /etc/security/limits.conf
              capability: independent.textfilecontent54
              select:
                filepath: /etc/security/limits.conf
                pattern:
                  operation: pattern match
                  value: ^\s*[^#*\s]+\s+(?:(?:hard)|(?:-))\s+maxlogins\s+(\d+)\s*$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
          - collect:
              object_title: non-default maxlogins in /etc/security/limits.d/*.conf
              capability: independent.textfilecontent54
              select:
                path: /etc/security/limits.d
                filename:
                  operation: pattern match
                  value: .*\.conf$
                pattern:
                  operation: pattern match
                  value: ^\s*[^#*\s]+\s+(?:(?:hard)|(?:-))\s+maxlogins\s+(\d+)\s*$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
      assert:
        existence: any_exist
        check: all
        state:
          field: subexpression
          operation: less than or equal
          value: '10'
          datatype: int
  evaluate:
    all:
    - check: limits-conf-limits-d-conf-maxlogins-set-10-or-less
    - check: limits-conf-limits-d-conf-maxlogins-set-10-or-less-2
