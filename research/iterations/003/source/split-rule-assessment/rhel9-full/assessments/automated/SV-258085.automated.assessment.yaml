assessment:
  id: SV-258085.automated
  version: 1
  assessment_title: RHEL-09-432020 - RHEL 9 must use the invoking user's password for privilege escalation
    when using "sudo".
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    defaults-targetpw-in-etc-sudoers:
      test_title: Defaults !targetpw in /etc/sudoers
      capability: independent.textfilecontent54
      collect:
        object_title: /etc/sudoers Defaults !targetpw
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/sudoers
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^\s*Defaults\s+!targetpw\s*$
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state: null
    defaults-rootpw-in-etc-sudoers:
      test_title: Defaults !rootpw in /etc/sudoers
      capability: independent.textfilecontent54
      collect:
        object_title: /etc/sudoers Defaults !rootpw
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/sudoers
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^\s*Defaults\s+!rootpw\s*$
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state: null
    defaults-runaspw-in-etc-sudoers:
      test_title: Defaults !runaspw in /etc/sudoers
      capability: independent.textfilecontent54
      collect:
        object_title: /etc/sudoers Defaults !runaspw
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/sudoers
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^\s*Defaults\s+!runaspw\s*$
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state: null
    etc-sudoers-d-included-in-etc-sudoers:
      test_title: /etc/sudoers.d included in /etc/sudoers
      capability: independent.textfilecontent54
      collect:
        object_title: /etc/sudoers includedir
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/sudoers
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^\s*[#@]includedir\s+(\S+)\s*$
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: at least one
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: /etc/sudoers.d
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    defaults-targetpw-in-etc-sudoers-d:
      test_title: Defaults !targetpw in /etc/sudoers.d
      capability: independent.textfilecontent54
      collect:
        object_title: /etc/sudoers.d Defaults !targetpw
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            variable_check: at least one
            value:
              variable: sudoers-d-config-files
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^\s*Defaults\s+!targetpw\s*$
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state: null
    defaults-rootpw-in-etc-sudoers-d:
      test_title: Defaults !rootpw in /etc/sudoers.d
      capability: independent.textfilecontent54
      collect:
        object_title: /etc/sudoers.d Defaults !rootpw
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            variable_check: at least one
            value:
              variable: sudoers-d-config-files
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^\s*Defaults\s+!rootpw\s*$
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state: null
    defaults-runaspw-in-etc-sudoers-d:
      test_title: Defaults !runaspw in /etc/sudoers.d
      capability: independent.textfilecontent54
      collect:
        object_title: /etc/sudoers.d Defaults !runaspw
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            variable_check: at least one
            value:
              variable: sudoers-d-config-files
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^\s*Defaults\s+!runaspw\s*$
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state: null
  evaluate:
    any:
    - all:
      - check: defaults-targetpw-in-etc-sudoers
      - check: defaults-rootpw-in-etc-sudoers
      - check: defaults-runaspw-in-etc-sudoers
    - all:
      - check: etc-sudoers-d-included-in-etc-sudoers
      - check: defaults-targetpw-in-etc-sudoers-d
      - check: defaults-rootpw-in-etc-sudoers-d
      - check: defaults-runaspw-in-etc-sudoers-d
  variables:
    sudoers-d-config-files:
      title: sudoers.d config files
      kind: local
      datatype: string
      expression:
        object_values:
          collect:
            object_title: /etc/sudoers.d config files, excluding files ending with ~ or containing .
            capability: unix.file
            select:
              path:
                operation: equals
                datatype: string
                mask: false
                value: /etc/sudoers.d
              filename:
                operation: pattern match
                datatype: string
                mask: false
                value: ^[^.]*[^.~]$
          field: filepath
