assessment:
  id: SV-257807.automated
  version: 2
  assessment_title: RHEL-09-213060 - RHEL 9 must disable the Stream Control Transmission Protocol (SCTP)
    kernel module.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    etc-modprobe-d-contains-file-that-contains-install-sctp-bin:
      test_title: /etc/modprobe.d contains a file that contains 'install sctp /bin/false'
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          path:
            operation: equals
            datatype: string
            mask: false
            value: /etc/modprobe.d
          filename:
            operation: pattern match
            datatype: string
            mask: false
            value: .*
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^[ \t]*install[ \t]+sctp[ \t]+/bin/false[ \t]*$
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state: null
    etc-modprobe-d-contains-file-that-contains-blacklist-sctp:
      test_title: /etc/modprobe.d contains a file that contains 'blacklist sctp'
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          path:
            operation: equals
            datatype: string
            mask: false
            value: /etc/modprobe.d
          filename:
            operation: pattern match
            datatype: string
            mask: false
            value: .*
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^[ \t]*blacklist[ \t]+sctp[ \t]*$
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state: null
    etc-modprobe-conf-contains-install-sctp-bin-false:
      test_title: /etc/modprobe.conf contains 'install sctp /bin/false'
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/modprobe.conf
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^[ \t]*install[ \t]+sctp[ \t]+/bin/false[ \t]*$
          instance:
            operation: equals
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state: null
    etc-modprobe-conf-contains-blacklist-sctp:
      test_title: /etc/modprobe.conf contains 'blacklist sctp'
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/modprobe.conf
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^[ \t]*blacklist[ \t]+sctp[ \t]*$
          instance:
            operation: equals
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state: null
  evaluate:
    any:
    - all:
      - check: etc-modprobe-d-contains-file-that-contains-install-sctp-bin
      - check: etc-modprobe-d-contains-file-that-contains-blacklist-sctp
    - all:
      - check: etc-modprobe-conf-contains-install-sctp-bin-false
      - check: etc-modprobe-conf-contains-blacklist-sctp
