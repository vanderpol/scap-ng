assessment:
  id: SV-258107.automated
  version: 1
  assessment_title: RHEL-09-611090 - RHEL 9 passwords must be created with a minimum of 15 characters.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    passwords-have-minimum-15-characters:
      test_title: passwords must have a minimum of 15 characters
      collect:
        object_title: null
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                filepath: /etc/security/pwquality.conf
                pattern:
                  operation: pattern match
                  value: ^\s*minlen\s*=\s*(-?\d*)\s*(?:#.*)?$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                path: /etc/security/pwquality.conf.d
                filename:
                  operation: pattern match
                  value: \.conf$
                pattern:
                  operation: pattern match
                  value: ^\s*minlen\s*=\s*(-?\d*)\s*(?:#.*)?$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
              behaviors:
                recurse_direction: down
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: subexpression
          operation: greater than or equal
          value: '15'
          datatype: int
  evaluate:
    check: passwords-have-minimum-15-characters
