assessment:
  id: SV-257919.automated
  version: 13
  assessment_title: RHEL 9 system commands must be group-owned by root or a system account.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    files-in-system-command-directories-owned-by-root-group-or:
      test_title: Files in System command directories are owned by root-group or a system group gid less
        than 1000.
      capability: unix.file
      collect:
        object_title: All system-command files not owned by root-group or system-group (id less than 1000)
        capability: unix.file
        select:
          path:
            operation: equals
            datatype: string
            mask: false
            variable_check: only one
            value:
              variable: system-command-directories
          filename:
            operation: pattern match
            datatype: string
            mask: false
            value: .*
        filters:
        - action: exclude
          match:
            field: group_id
            value: '1000'
            operation: less than
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: owned by root-group or system-group ( gid less than 1000)
          capability: unix.file
        - action: exclude
          match:
            field: type
            value: symbolic link
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: symbolic links
          capability: unix.file
        - action: exclude
          match:
            field: type
            value: directory
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          capability: unix.file
        behaviors:
          recurse_direction: down
      assert:
        existence: none_exist
        check: all
        state: null
  evaluate:
    check: files-in-system-command-directories-owned-by-root-group-or
  variables:
    system-command-directories:
      title: system command directories
      kind: constant
      datatype: string
      expression:
        literal:
        - /bin
        - /sbin
        - /usr/bin
        - /usr/libexec
        - /usr/sbin
        - /usr/local/bin
        - /usr/local/sbin
