assessment:
  id: SV-257918.automated
  version: 13
  assessment_title: RHEL 9 system commands must be owned by root.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    files-in-system-command-directories-owned-by-root:
      test_title: Files in System command directories are owned by root
      capability: unix.file
      collect:
        object_title: All system-command files not owned by root
        capability: unix.file
        select:
          path:
            operation: equals
            datatype: string
            mask: false
            variable_check: only one
            value:
              variable: system-command-directories
          filename:
            operation: pattern match
            datatype: string
            mask: false
            value: .*
        filters:
        - action: exclude
          match:
            field: user_id
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: owned by root
          capability: unix.file
        - action: exclude
          match:
            field: type
            value: symbolic link
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: symbolic links
          capability: unix.file
        - action: exclude
          match:
            field: type
            value: directory
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          capability: unix.file
        behaviors:
          recurse_direction: down
      assert:
        existence: none_exist
        check: all
        state: null
  evaluate:
    check: files-in-system-command-directories-owned-by-root
  variables:
    system-command-directories:
      title: system command directories
      datatype: string
      kind: constant
      expression:
        literal:
        - /bin
        - /sbin
        - /usr/bin
        - /usr/libexec
        - /usr/sbin
        - /usr/local/bin
        - /usr/local/sbin
