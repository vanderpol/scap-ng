assessment:
  id: SV-257812.automated
  version: 1
  assessment_title: RHEL-09-213085 - RHEL 9 must disable core dump backtraces.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    core-dump-backtraces-disabled:
      test_title: core dump backtraces are disabled
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath: /etc/systemd/coredump.conf
          pattern:
            operation: pattern match
            value: ^\s*ProcessSizeMax\s*=\s*(\w*)\s*(?:#.*)?$
          instance:
            operation: greater than or equal
            value: '1'
      assert:
        state_title: null
        existence: at_least_one_exists
        check: all
        state:
          field: subexpression
          operation: equals
          value: '0'
  evaluate:
    check: core-dump-backtraces-disabled
