assessment:
  id: SV-258059.automated
  version: 3
  assessment_title: RHEL-09-411100 - The root account must be the only account having unrestricted access
    to RHEL 9 system.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    only-root-account-has-uid-zero:
      test_title: Only the root account has a UID of zero.
      collect:
        object_title: null
        capability: unix.password
        select:
          username:
            operation: not equal
            value: root
      assert:
        state_title: null
        existence: at_least_one_exists
        check: all
        state:
          field: user_id
          operation: not equal
          value: '0'
          datatype: int
  evaluate:
    check: only-root-account-has-uid-zero
