assessment:
  id: SV-258147.automated
  version: 1
  assessment_title: RHEL-09-652045 - RHEL 9 must encrypt the transfer of audit records offloaded onto
    a different system or media from the system being audited via rsyslog.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    actionsendstreamdrivermode-1:
      test_title: ActionSendStreamDriverMode == 1
      collect:
        object_title: ActionSendStreamDriverMode
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: 'rsyslog.conf: ActionSendStreamDriverMode'
              capability: independent.textfilecontent54
              select:
                filepath:
                  datatype: string
                  value: /etc/rsyslog.conf
                pattern:
                  operation: pattern match
                  value: ^\$ActionSendStreamDriverMode\s+(\S+)\s*$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
              behaviors:
                ignore_case: 'true'
          - collect:
              object_title: 'rsyslog.d/*.conf: ActionSendStreamDriverMode'
              capability: independent.textfilecontent54
              select:
                path: /etc/rsyslog.d
                filename:
                  operation: pattern match
                  value: ^.*\.conf$
                pattern:
                  operation: pattern match
                  value: ^\$ActionSendStreamDriverMode\s+(\S+)\s*$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
              behaviors:
                ignore_case: 'true'
      assert:
        state_title: null
        existence: at_least_one_exists
        check: all
        state:
          field: subexpression
          operation: equals
          value: '1'
          datatype: int
    streamdrivermode-1-advanced-syntax:
      test_title: StreamDriverMode == 1 (advanced syntax)
      collect:
        object_title: 'rsyslog: action for all messages'
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: 'rsyslog.conf: action for all messages'
              capability: independent.textfilecontent54
              select:
                filepath:
                  datatype: string
                  value: /etc/rsyslog.conf
                pattern:
                  operation: pattern match
                  value: ^\*\.\*\s+action\((\s*(?:[^#\)]*(?:#.*$)?\n)*[^#\)]*)\)
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
              behaviors:
                ignore_case: 'true'
          - collect:
              object_title: 'rsyslog.d/*.conf: action for all messages'
              capability: independent.textfilecontent54
              select:
                path: /etc/rsyslog.d
                filename:
                  operation: pattern match
                  value: ^.*\.conf$
                pattern:
                  operation: pattern match
                  value: ^\*\.\*\s+action\((\s*(?:[^#\)]*(?:#.*$)?\n)*[^#\)]*)\)
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
              behaviors:
                ignore_case: 'true'
      assert:
        state_title: null
        existence: at_least_one_exists
        check: at least one
        state:
          all:
          - field: subexpression
            operation: pattern match
            value: (?i)(?:^|\n)[^#]*\btype\s*=\s*"omfwd"
            datatype: string
          - field: subexpression
            operation: pattern match
            value: (?i)(?:^|\n)[^#]*\bStreamDriver\.?Mode\s*=\s*"1"
            datatype: string
    streamdrivermode-not-set-in-module-block-advanced-syntax:
      test_title: StreamDriverMode is not set in a module block (advanced syntax)
      collect:
        object_title: 'rsyslog: module blocks'
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: 'rsyslog.conf: module blocks'
              capability: independent.textfilecontent54
              select:
                filepath:
                  datatype: string
                  value: /etc/rsyslog.conf
                pattern:
                  operation: pattern match
                  value: ^\s*module\((\s*(?:[^#\)]*(?:#.*$)?\n)*[^#\)]*)\)
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
              behaviors:
                ignore_case: 'true'
          - collect:
              object_title: 'rsyslog.d/*.conf: module blocks'
              capability: independent.textfilecontent54
              select:
                path: /etc/rsyslog.d
                filename:
                  operation: pattern match
                  value: ^.*\.conf$
                pattern:
                  operation: pattern match
                  value: ^\s*module\((\s*(?:[^#\)]*(?:#.*$)?\n)*[^#\)]*)\)
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
              behaviors:
                ignore_case: 'true'
      assert:
        state_title: null
        existence: any_exist
        check: none satisfy
        state:
          field: subexpression
          operation: pattern match
          value: (?i)(?:^|\n)[^#]*\bStreamDriver\.?Mode\b
          datatype: string
  evaluate:
    all:
    - any:
      - check: actionsendstreamdrivermode-1
      - check: streamdrivermode-1-advanced-syntax
    - check: streamdrivermode-not-set-in-module-block-advanced-syntax
