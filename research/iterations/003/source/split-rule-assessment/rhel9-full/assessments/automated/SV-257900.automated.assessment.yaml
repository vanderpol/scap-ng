assessment:
  id: SV-257900.automated
  version: 1
  assessment_title: RHEL-09-232100 - RHEL 9 /etc/group- file must be owned by root.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    etc-group-file-owned-by-root:
      test_title: /etc/group- file is owned by root
      capability: unix.file
      collect:
        object_title: null
        capability: unix.file
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/group-
      assert:
        existence: at_least_one_exists
        check: all
        state_title: owned by root
        state_capability: unix.file
        state:
          field: user_id
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    check: etc-group-file-owned-by-root
