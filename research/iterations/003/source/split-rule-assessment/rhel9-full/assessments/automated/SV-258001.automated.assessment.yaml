assessment:
  id: SV-258001.automated
  version: 1
  assessment_title: RHEL-09-255125 - RHEL 9 SSH public host key files must have mode 0644 or less permissive.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    ssh-daemon-public-host-key-files-have-mode-0644-or:
      test_title: The SSH daemon public host key files have mode 0644 or less permissive
      capability: unix.file
      collect:
        object_title: null
        capability: unix.file
        select:
          path: /etc/ssh
          filename:
            operation: pattern match
            value: ^.*\.pub$
        behaviors:
          max_depth: '-1'
          recurse_direction: down
      assert:
        existence: any_exist
        check: all
        state:
          all:
          - field: suid
            operation: equals
            value: 'false'
            datatype: boolean
          - field: sgid
            operation: equals
            value: 'false'
            datatype: boolean
          - field: sticky
            operation: equals
            value: 'false'
            datatype: boolean
          - field: uexec
            operation: equals
            value: 'false'
            datatype: boolean
          - field: gwrite
            operation: equals
            value: 'false'
            datatype: boolean
          - field: gexec
            operation: equals
            value: 'false'
            datatype: boolean
          - field: owrite
            operation: equals
            value: 'false'
            datatype: boolean
          - field: oexec
            operation: equals
            value: 'false'
            datatype: boolean
        state_title: File permissions is 644 or more restrictive
        state_capability: unix.file
  evaluate:
    check: ssh-daemon-public-host-key-files-have-mode-0644-or
