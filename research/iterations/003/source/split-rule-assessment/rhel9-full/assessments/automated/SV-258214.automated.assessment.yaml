assessment:
  id: SV-258214.automated
  version: 1
  assessment_title: RHEL-09-654200 - Successful/unsuccessful uses of the shutdown command in RHEL 9 must
    generate an audit record.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    audit-invocations-usr-sbin-shutdown:
      test_title: Audit invocations of /usr/sbin/shutdown
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath: /etc/audit/audit.rules
          pattern:
            operation: pattern match
            value: ^\s*-a\s+(always,exit|exit,always)(?:\s+-S\s+all)?\s+-F\s+path=/usr/sbin/shutdown\s+(-F\s+perm=([rwa]*x[rwa]*)\s+)?-F\s+auid>=1000\s+-F\s+auid!=(4294967295|-1|unset)(\s+(-k\s+|-F\s+key=)\S+)?\s*$
          instance:
            operation: greater than or equal
            datatype: int
            value: '1'
      assert:
        existence: all_exist
        check: all
        state: null
  evaluate:
    check: audit-invocations-usr-sbin-shutdown
