assessment:
  id: SV-258079.automated
  version: 1
  assessment_title: RHEL-09-431015 - RHEL 9 must enable the SELinux targeted policy.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    selinux-active:
      test_title: selinux is active
      capability: linux.partition
      collect:
        object_title: /sys/fs/selinux
        capability: linux.partition
        select:
          mount_point:
            operation: equals
            datatype: string
            mask: false
            value: /sys/fs/selinux
      assert:
        existence: at_least_one_exists
        check: all
        state_title: null
        state_capability: linux.partition
        state:
          field: fs_type
          value: selinuxfs
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    etc-selinux-config-selinuxtype-targeted:
      test_title: '/etc/selinux/config: SELINUXTYPE=targeted'
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/selinux/config
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^\s*SELINUXTYPE\s*=\s*(\w+)\s*$
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: targeted
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - check: selinux-active
    - check: etc-selinux-config-selinuxtype-targeted
