assessment:
  id: SV-257948.automated
  version: 1
  assessment_title: RHEL-09-252035 - RHEL 9 systems using Domain Name Servers (DNS) resolution must have
    at least two name servers configured.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    system-using-dns:
      test_title: The system is using DNS
      capability: independent.textfilecontent54
      collect:
        object_title: /etc/nsswitch.conf hosts entry
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/nsswitch.conf
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^\s*hosts:\s*(.*)$
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: subexpression
          value: (^|\s)dns(\s|$)
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: hosts entry contains dns
        state_capability: independent.textfilecontent54
    etc-resolv-conf-contains-at-least-one-nameserver-entry:
      test_title: /etc/resolv.conf contains at least one nameserver entry
      capability: independent.textfilecontent54
      collect:
        object_title: /etc/resolv.conf nameserver entries
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/resolv.conf
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^nameserver\s+(.*)$
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state: null
    etc-resolv-conf-configured-at-least-two-name-servers:
      test_title: /etc/resolv.conf is configured with at least two name servers
      capability: independent.variable
      collect:
        object_title: count of unique name servers
        capability: independent.variable
        select:
          var_ref:
            operation: equals
            datatype: string
            mask: false
            value:
              variable: count-unique-name-servers
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: value
          value: '2'
          operation: greater than or equal
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: /etc/resolv.conf is configured with at least two name servers
        state_capability: independent.variable
  evaluate:
    any:
    - not:
        check: system-using-dns
    - all:
      - check: system-using-dns
      - check: etc-resolv-conf-contains-at-least-one-nameserver-entry
      - check: etc-resolv-conf-configured-at-least-two-name-servers
  variables:
    count-unique-name-servers:
      title: count of unique name servers
      datatype: int
      kind: local
      expression:
        count:
          unique:
            object_values:
              collect:
                object_title: /etc/resolv.conf nameserver entries
                capability: independent.textfilecontent54
                select:
                  filepath:
                    operation: equals
                    datatype: string
                    mask: false
                    value: /etc/resolv.conf
                  pattern:
                    operation: pattern match
                    datatype: string
                    mask: false
                    value: ^nameserver\s+(.*)$
                  instance:
                    operation: greater than or equal
                    datatype: int
                    mask: false
                    value: '1'
              field: subexpression
