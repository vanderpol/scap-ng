assessment:
  id: SV-257890.automated
  version: 2
  assessment_title: RHEL-09-232050 - All RHEL 9 local interactive user home directories must have mode
    0750 or less permissive.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    all-local-interactive-user-home-directories-0750-or-less:
      test_title: All local interactive user home directories are 0750 or less
      capability: unix.file
      collect:
        object_title: home directories of local interactive users without nologin
        capability: unix.file
        select:
          path:
            operation: equals
            datatype: string
            mask: false
            variable_check: at least one
            value:
              variable: home-directories-local-interactive-users-without-nologin
          filename:
            operation: equals
            datatype: string
            mask: false
            nil: true
            value: ''
      assert:
        existence: any_exist
        check: all
        state_title: mode 0750 or less permissive
        state_capability: unix.file
        state:
          all:
          - field: suid
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: sgid
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: sticky
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: gwrite
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: oread
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: owrite
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: oexec
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    check: all-local-interactive-user-home-directories-0750-or-less
  variables:
    home-directories-local-interactive-users-without-nologin:
      title: home directories of local interactive users without nologin
      kind: local
      datatype: string
      expression:
        object_values:
          collect:
            object_title: Local interactive users without nologin
            capability: unix.password
            select:
              username:
                operation: pattern match
                datatype: string
                mask: false
                value: .*
            filters:
            - action: exclude
              match:
                field: login_shell
                value: ^.*nologin.*$
                operation: pattern match
                datatype: string
                mask: false
                entity_check: all
                entity_existence: at_least_one_exists
              state_title: nologin shell
              capability: unix.password
            - action: exclude
              match:
                field: user_id
                value: '1000'
                operation: less than
                datatype: int
                mask: false
                entity_check: all
                entity_existence: at_least_one_exists
              state_title: uid < 1000
              capability: unix.password
            - action: exclude
              match:
                field: user_id
                value: '65534'
                operation: equals
                datatype: int
                mask: false
                entity_check: all
                entity_existence: at_least_one_exists
              state_title: uid = 65534 (nobody)
              capability: unix.password
          field: home_dir
