assessment:
  id: SV-257814.automated
  version: 3
  assessment_title: RHEL-09-213095 - RHEL 9 must disable core dumps for all users.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    global-domain-core-set-0:
      test_title: For the global domain, core is set to 0.
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                filepath:
                  operation: equals
                  datatype: string
                  mask: false
                  value: /etc/security/limits.conf
                pattern:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: ^[ \t]*\*[ \t]+(?:hard|soft|-)[ \t]+core[ \t]+(\d+)[ \t]*(?:#.*)?$
                instance:
                  operation: greater than or equal
                  datatype: int
                  mask: false
                  value: '1'
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                path:
                  operation: equals
                  datatype: string
                  mask: false
                  value: /etc/security/limits.d
                filename:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: \.conf$
                pattern:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: ^[ \t]*\*[ \t]+(?:hard|soft|-)[ \t]+core[ \t]+(\d+)[ \t]*(?:#.*)?$
                instance:
                  operation: greater than or equal
                  datatype: int
                  mask: false
                  value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    if-core-set-any-specific-domains-it-set-0:
      test_title: If core is set for any specific domains, it is set to 0.
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                filepath:
                  operation: equals
                  datatype: string
                  mask: false
                  value: /etc/security/limits.conf
                pattern:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: ^[ \t]*[^#*\s]+[ \t]+(?:hard|soft|-)[ \t]+core[ \t]+(\d+)[ \t]*(?:#.*)?$
                instance:
                  operation: greater than or equal
                  datatype: int
                  mask: false
                  value: '1'
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                path:
                  operation: equals
                  datatype: string
                  mask: false
                  value: /etc/security/limits.d
                filename:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: \.conf$
                pattern:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: ^[ \t]*[^#*\s]+[ \t]+(?:hard|soft|-)[ \t]+core[ \t]+(\d+)[ \t]*(?:#.*)?$
                instance:
                  operation: greater than or equal
                  datatype: int
                  mask: false
                  value: '1'
      assert:
        existence: any_exist
        check: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - check: global-domain-core-set-0
    - check: if-core-set-any-specific-domains-it-set-0
