assessment:
  id: SV-258188.automated
  version: 1
  assessment_title: RHEL-09-654070 - RHEL 9 must audit all uses of the truncate, ftruncate, creat, open,
    openat, and open_by_handle_at system calls.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    audit-32-bit-invocations-truncate-syscall-exit-eperm:
      test_title: Audit 32-bit invocations of truncate syscall with exit EPERM
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/audit/audit.rules
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^\s*-a\s+(always,exit|exit,always)\s+-F\s+arch=b32\s+(?:.*(-S\s+truncate\s+|(\s+|,)truncate(\s+|,))).*-F\s+exit=-EPERM\s+-F\s+auid>=1000\s+-F\s+auid!=(4294967295|-1|unset)(\s+(-k\s+|-F\s+key=)[-\w]+)*\s*$
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state: null
    audit-64-bit-invocations-truncate-syscall-exit-eperm:
      test_title: Audit 64-bit invocations of truncate syscall with exit EPERM
      capability: independent.textfilecontent54
