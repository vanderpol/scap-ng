assessment:
  id: SV-257959.automated
  version: 3
  assessment_title: RHEL-09-253020 - RHEL 9 must not forward Internet Protocol version 4 (IPv4) source-routed
    packets.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    net-ipv4-conf-all-accept-source-routesetting-in-kernel-set:
      test_title: net.ipv4.conf.all.accept_source_routesetting in kernel is set to 0
      capability: unix.sysctl
      collect:
        object_title: null
        capability: unix.sysctl
        select:
          name:
            operation: equals
            datatype: string
            mask: false
            value: net.ipv4.conf.all.accept_source_route
      assert:
        existence: all_exist
        check: all
        state:
          field: value
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_capability: unix.sysctl
  evaluate:
    check: net-ipv4-conf-all-accept-source-routesetting-in-kernel-set
