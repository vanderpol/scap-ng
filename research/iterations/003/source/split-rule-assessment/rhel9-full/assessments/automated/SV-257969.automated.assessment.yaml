assessment:
  id: SV-257969.automated
  version: 2
  assessment_title: RHEL-09-253070 - RHEL 9 must not allow interfaces to perform Internet Control Message
    Protocol (ICMP) redirects by default.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    net-ipv4-conf-default-send-redirects-set-0-in-kernel:
      test_title: net.ipv4.conf.default.send_redirects is set to 0 in kernel
      capability: unix.sysctl
      collect:
        object_title: null
        capability: unix.sysctl
        select:
          name:
            operation: equals
            datatype: string
            mask: false
            value: net.ipv4.conf.default.send_redirects
      assert:
        existence: at_least_one_exists
        check: all
        state_title: null
        state_capability: unix.sysctl
        state:
          field: value
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    check: net-ipv4-conf-default-send-redirects-set-0-in-kernel
