assessment:
  id: SV-257961.automated
  version: 2
  assessment_title: RHEL-09-253030 - RHEL 9 must log IPv4 packets with impossible addresses by default.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    net-ipv4-conf-default-log-martians-setting-in-kernel-set:
      test_title: net.ipv4.conf.default.log_martians setting in kernel is set to 1
      capability: unix.sysctl
      collect:
        object_title: null
        capability: unix.sysctl
        select:
          name: net.ipv4.conf.default.log_martians
      assert:
        existence: all_exist
        check: all
        state:
          field: value
          operation: equals
          value: '1'
          datatype: int
        state_capability: unix.sysctl
  evaluate:
    check: net-ipv4-conf-default-log-martians-setting-in-kernel-set
