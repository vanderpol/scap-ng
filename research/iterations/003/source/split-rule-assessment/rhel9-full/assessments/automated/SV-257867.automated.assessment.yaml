assessment:
  id: SV-257867.automated
  version: 2
  assessment_title: RHEL-09-231130 - RHEL 9 must mount /tmp with the noexec option.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    tmp-mounted-noexec-option:
      test_title: /tmp is mounted with the noexec option
      collect:
        object_title: null
        capability: linux.partition
        select:
          mount_point: /tmp
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: mount_options
          operation: equals
          value: noexec
          entity_check: at least one
  evaluate:
    check: tmp-mounted-noexec-option
