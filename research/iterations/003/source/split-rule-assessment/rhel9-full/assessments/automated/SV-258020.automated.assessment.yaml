assessment:
  id: SV-258020.automated
  version: 1
  assessment_title: RHEL-09-271050 - RHEL 9 must prevent a user from overriding the disabling of the graphical
    user smart card removal action.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    dconf-user-database-s-exist:
      test_title: dconf user database(s) exist
      capability: independent.textfilecontent54
      collect:
        object_title: dconf user databases
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/dconf/profile/user
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^system-db:(\S+)\s*$
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state: null
    org-gnome-settings-daemon-peripherals-smartcard-removal-action-in-dconf:
      test_title: /org/gnome/settings-daemon/peripherals/smartcard/removal-action in dconf user database
        locks directories exists
      capability: independent.textfilecontent54
      collect:
        object_title: /org/gnome/settings-daemon/peripherals/smartcard/removal-action in dconf user database
          locks directories
        capability: independent.textfilecontent54
        select:
          path:
            operation: equals
            datatype: string
            mask: false
            variable_check: at least one
            value:
              variable: dconf-user-database-locks-directories
          filename:
            operation: pattern match
            datatype: string
            mask: false
            value: .*
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^/org/gnome/settings-daemon/peripherals/smartcard/removal-action$
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state: null
  evaluate:
    all:
    - check: dconf-user-database-s-exist
    - check: org-gnome-settings-daemon-peripherals-smartcard-removal-action-in-dconf
  variables:
    dconf-user-database-locks-directories:
      title: dconf user database locks directories
      kind: local
      datatype: string
      expression:
        concat:
        - literal:
            value: /etc/dconf/db/
            datatype: string
        - object_values:
            collect:
              object_title: dconf user databases
              capability: independent.textfilecontent54
              select:
                filepath:
                  operation: equals
                  datatype: string
                  mask: false
                  value: /etc/dconf/profile/user
                pattern:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: ^system-db:(\S+)\s*$
                instance:
                  operation: greater than or equal
                  datatype: int
                  mask: false
                  value: '1'
            field: subexpression
        - literal:
            value: .d/locks
            datatype: string
