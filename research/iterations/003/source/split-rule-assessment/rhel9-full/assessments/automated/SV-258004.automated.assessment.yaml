assessment:
  id: SV-258004.automated
  version: 2
  assessment_title: RHEL-09-255140 - RHEL 9 SSH daemon must not allow Kerberos authentication.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    etc-ssh-sshd-config-kerberosauthentication-no:
      test_title: /etc/ssh/sshd_config:KerberosAuthentication == no
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath: /etc/ssh/sshd_config
          pattern:
            operation: pattern match
            value: ^\s*(?i)KerberosAuthentication(?-i)\s+("?\w+"?)\s*(?:|(?:#.*))?$
          instance:
            operation: greater than or equal
            datatype: int
            value: '1'
      assert:
        existence: all_exist
        check: all
        state:
          field: subexpression
          operation: pattern match
          value: ^(no|"no")$
          datatype: string
    sshd-config-includes-sshd-config-d:
      test_title: sshd_config includes sshd_config.d
      collect:
        object_title: sshd_config includes
        capability: independent.textfilecontent54
        select:
          filepath:
            datatype: string
            value: /etc/ssh/sshd_config
          pattern:
            operation: pattern match
            value: ^\s*include\s+(.*)\s*$
          instance:
            operation: greater than or equal
            datatype: int
            value: '1'
        behaviors:
          ignore_case: 'true'
      assert:
        existence: at_least_one_exists
        check: at least one
        state:
          field: subexpression
          operation: equals
          value: /etc/ssh/sshd_config.d/*.conf
          datatype: string
    etc-ssh-sshd-config-sshd-config-d-kerberosauthentication-no:
      test_title: /etc/ssh/sshd_config + sshd_config.d:KerberosAuthentication == no
      collect:
        object_title: null
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                filepath: /etc/ssh/sshd_config
                pattern:
                  operation: pattern match
                  value: ^\s*(?i)KerberosAuthentication(?-i)\s+("?\w+"?)\s*(?:|(?:#.*))?$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                path: /etc/ssh/sshd_config.d
                filename:
                  operation: pattern match
                  value: ^.*\.conf$
                pattern:
                  operation: pattern match
                  value: ^\s*(?i)KerberosAuthentication(?-i)\s+("?\w+"?)\s*(?:|(?:#.*))?$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: subexpression
          operation: pattern match
          value: ^(no|"no")$
          datatype: string
  evaluate:
    any:
    - all:
      - check: etc-ssh-sshd-config-kerberosauthentication-no
      - not:
          check: sshd-config-includes-sshd-config-d
    - all:
      - check: sshd-config-includes-sshd-config-d
      - check: etc-ssh-sshd-config-sshd-config-d-kerberosauthentication-no
