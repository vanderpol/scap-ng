assessment:
  id: SV-257997.automated
  version: 1
  assessment_title: RHEL-09-255105 - RHEL 9 SSH server configuration file must be group-owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    etc-ssh-sshd-config-file-group-owned-by-root:
      test_title: The /etc/ssh/sshd_config file is group-owned by root.
      collect:
        object_title: null
        capability: unix.file
        select:
          filepath: /etc/ssh/sshd_config
      assert:
        state_title: group-owned by root
        existence: at_least_one_exists
        check: all
        state:
          field: group_id
          operation: equals
          value: '0'
          datatype: int
    etc-ssh-sshd-config-d-directory-sub-directories-group-owned:
      test_title: The /etc/ssh/sshd_config.d directory and sub-directories are group-owned by root.
      collect:
        object_title: null
        capability: unix.file
        select:
          path: /etc/ssh/sshd_config.d
          filename: ''
        behaviors:
          recurse: directories
          recurse_direction: down
      assert:
        state_title: group-owned by root
        existence: at_least_one_exists
        check: all
        state:
          field: group_id
          operation: equals
          value: '0'
          datatype: int
    etc-ssh-sshd-config-d-files-group-owned-by-root:
      test_title: The /etc/ssh/sshd_config.d files are group-owned by root.
      collect:
        object_title: null
        capability: unix.file
        select:
          path: /etc/ssh/sshd_config.d
          filename:
            operation: pattern match
            value: .*
        behaviors:
          recurse: directories
          recurse_direction: down
      assert:
        state_title: group-owned by root
        existence: at_least_one_exists
        check: all
        state:
          field: group_id
          operation: equals
          value: '0'
          datatype: int
  evaluate:
    all:
    - check: etc-ssh-sshd-config-file-group-owned-by-root
    - check: etc-ssh-sshd-config-d-directory-sub-directories-group-owned
    - check: etc-ssh-sshd-config-d-files-group-owned-by-root
