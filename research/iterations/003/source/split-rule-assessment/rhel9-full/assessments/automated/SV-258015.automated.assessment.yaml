assessment:
  id: SV-258015.automated
  version: 1
  assessment_title: RHEL-09-271025 - RHEL 9 must prevent a user from overriding the disabling of the graphical
    user interface automount function.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    check-that-etc-dconf-profile-user-system-db-at-minimum:
      test_title: check that /etc/dconf/profile/user:system-db is at minimum set to local
      capability: independent.textfilecontent54
      collect:
        object_title: check that /etc/dconf/profile/user:system-db is at minimum set to local
        capability: independent.textfilecontent54
        select:
          filepath: /etc/dconf/profile/user
          pattern:
            operation: pattern match
            value: ^\s*system-db\s*:\s*local\s*$
          instance:
            operation: greater than or equal
            datatype: int
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state: null
    org-gnome-desktop-media-handling-automount-open-in-etc-dconf:
      test_title: /org/gnome/desktop/media-handling/automount-open in /etc/dconf/db/local.d/locks/*
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          path: /etc/dconf/db/local.d/locks
          filename:
            operation: pattern match
            value: .*
          pattern:
            operation: pattern match
            value: ^/org/gnome/desktop/media-handling/automount-open$
          instance:
            operation: greater than or equal
            datatype: int
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state: null
  evaluate:
    all:
    - check: check-that-etc-dconf-profile-user-system-db-at-minimum
    - check: org-gnome-desktop-media-handling-automount-open-in-etc-dconf
