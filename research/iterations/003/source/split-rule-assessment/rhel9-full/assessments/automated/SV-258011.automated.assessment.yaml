assessment:
  id: SV-258011.automated
  version: 1
  assessment_title: RHEL-09-255175 - RHEL 9 SSH daemon must prevent remote hosts from connecting to the
    proxy display.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    sshd-config-x11uselocalhost-set-yes:
      test_title: sshd_config X11UseLocalhost is set to yes.
      collect:
        object_title: sshd_config X11UseLocalhost
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: sshd_config X11UseLocalhost
              capability: independent.textfilecontent54
              select:
                filepath:
                  datatype: string
                  value: /etc/ssh/sshd_config
                pattern:
                  operation: pattern match
                  value: ^\s*(?i)X11useLocalhost(?-i)[ \t]+([\w\"]+)[\s]*(?:|(?:#.*))?$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                path: /etc/ssh/sshd_config.d
                filename:
                  operation: pattern match
                  value: ^.+\.conf$
                pattern:
                  operation: pattern match
                  value: ^\s*(?i)X11useLocalhost(?-i)[ \t]+([\w\"]+)[\s]*(?:|(?:#.*))?$
                instance:
                  datatype: int
                  value: '1'
              behaviors:
                max_depth: '-1'
                recurse_direction: down
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: subexpression
          operation: pattern match
          value: ^(yes|"yes")$
          datatype: string
  evaluate:
    check: sshd-config-x11uselocalhost-set-yes
