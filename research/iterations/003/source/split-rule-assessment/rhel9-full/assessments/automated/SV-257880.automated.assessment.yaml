assessment:
  id: SV-257880.automated
  version: 1
  assessment_title: RHEL-09-231195 - RHEL 9 must disable mounting of cramfs.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    etc-modprobe-d-contains-file-that-contains-install-cramfs-bin:
      test_title: /etc/modprobe.d contains a file that contains 'install cramfs /bin/false'
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          path: /etc/modprobe.d
          filename:
            operation: pattern match
            value: .*
          pattern:
            operation: pattern match
            value: ^[ \t]*install[ \t]+cramfs[ \t]+/bin/false[ \t]*$
          instance:
            operation: greater than or equal
            datatype: int
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state: null
    etc-modprobe-d-contains-file-that-contains-blacklist-cramfs:
      test_title: /etc/modprobe.d contains a file that contains 'blacklist cramfs'
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          path: /etc/modprobe.d
          filename:
            operation: pattern match
            value: .*
          pattern:
            operation: pattern match
            value: ^[ \t]*blacklist[ \t]+cramfs[ \t]*$
          instance:
            operation: greater than or equal
            datatype: int
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state: null
    etc-modprobe-conf-contains-install-cramfs-bin-false:
      test_title: /etc/modprobe.conf contains 'install cramfs /bin/false'
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath: /etc/modprobe.conf
          pattern:
            operation: pattern match
            value: ^[ \t]*install[ \t]+cramfs[ \t]+/bin/false[ \t]*$
          instance:
            datatype: int
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state: null
    etc-modprobe-conf-contains-blacklist-cramfs:
      test_title: /etc/modprobe.conf contains 'blacklist cramfs'
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath: /etc/modprobe.conf
          pattern:
            operation: pattern match
            value: ^[ \t]*blacklist[ \t]+cramfs[ \t]*$
          instance:
            datatype: int
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state: null
  evaluate:
    any:
    - all:
      - check: etc-modprobe-d-contains-file-that-contains-install-cramfs-bin
      - check: etc-modprobe-d-contains-file-that-contains-blacklist-cramfs
    - all:
      - check: etc-modprobe-conf-contains-install-cramfs-bin-false
      - check: etc-modprobe-conf-contains-blacklist-cramfs
