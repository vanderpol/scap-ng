assessment:
  id: SV-257801.automated
  version: 2
  assessment_title: RHEL-09-213030 - RHEL 9 must enable kernel parameters to enforce discretionary access
    control on hardlinks.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    fs-protected-hardlinks-setting-in-kernel-set-1:
      test_title: fs.protected_hardlinks setting in kernel is set to 1
      collect:
        object_title: null
        capability: unix.sysctl
        select:
          name: fs.protected_hardlinks
      assert:
        existence: all_exist
        check: all
        state:
          field: value
          operation: equals
          value: '1'
          datatype: int
  evaluate:
    check: fs-protected-hardlinks-setting-in-kernel-set-1
