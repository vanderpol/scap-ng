assessment:
  id: SV-257985.automated
  version: 1
  assessment_title: RHEL-09-255045 - RHEL 9 must not permit direct logons to the root account using remote
    access via SSH.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    etc-ssh-sshd-config-permitrootlogin-no:
      test_title: /etc/ssh/sshd_config:PermitRootLogin == no
      collect:
        object_title: all sshd_config and sshd_config.d/* files
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                filepath: /etc/ssh/sshd_config
                pattern:
                  operation: pattern match
                  value: ^\s*(?i)PermitRootLogin(?-i)[ \t]+([\w\"]+)[\s]*(?:|(?:#.*))?$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                path: /etc/ssh/sshd_config.d
                filename:
                  operation: pattern match
                  value: .+
                pattern:
                  operation: pattern match
                  value: ^\s*(?i)PermitRootLogin(?-i)[ \t]+([\w\"]+)[\s]*(?:|(?:#.*))?$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
      assert:
        state_title: null
        existence: at_least_one_exists
        check: all
        state:
          field: subexpression
          operation: pattern match
          value: ^(no|"no")$
          datatype: string
  evaluate:
    check: etc-ssh-sshd-config-permitrootlogin-no
