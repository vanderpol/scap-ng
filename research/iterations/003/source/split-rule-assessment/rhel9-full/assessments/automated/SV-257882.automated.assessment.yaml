assessment:
  id: SV-257882.automated
  version: 13
  assessment_title: RHEL 9 system commands must have mode 755 or less permissive.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    files-in-system-command-dirs-have-mode-755-or-less:
      test_title: Files in System command dirs have mode 755 or less permissive (gwrite should be = false.)
      collect:
        object_title: All files in system command directories with mode 755 (gwrite should be = false.)
        capability: unix.file
        select:
          path:
            variable_check: only one
            datatype: string
            value:
              variable: system-command-directories
          filename:
            operation: pattern match
            datatype: string
            value: .*
        filters:
        - action: exclude
          match:
            field: gwrite
            operation: equals
            value: 'false'
            datatype: boolean
          state_title: Mode 755 or less permissive (gwrite should be = false.)
        - action: exclude
          match:
            field: type
            operation: equals
            value: symbolic link
          state_title: symbolic links
        - action: exclude
          match:
            field: type
            operation: equals
            value: directory
      assert:
        state_title: null
        existence: none_exist
        check: all
        state: null
    files-in-system-command-dirs-have-mode-755-or-less-2:
      test_title: Files in System command dirs have mode 755 or less permissive (owrite should be = false.)
      collect:
        object_title: All files in system command directories with mode 755 (owrite should be = false.)
        capability: unix.file
        select:
          path:
            variable_check: only one
            datatype: string
            value:
              variable: system-command-directories
          filename:
            operation: pattern match
            datatype: string
            value: .*
        filters:
        - action: exclude
          match:
            field: owrite
            operation: equals
            value: 'false'
            datatype: boolean
          state_title: Mode 755 or less permissive (owrite should be = false.)
        - action: exclude
          match:
            field: type
            operation: equals
            value: symbolic link
          state_title: symbolic links
        - action: exclude
          match:
            field: type
            operation: equals
            value: directory
      assert:
        state_title: null
        existence: none_exist
        check: all
        state: null
  evaluate:
    all:
    - check: files-in-system-command-dirs-have-mode-755-or-less
    - check: files-in-system-command-dirs-have-mode-755-or-less-2
  variables:
    system-command-directories:
      title: system command directories
      datatype: string
      expression:
        literal:
        - /bin
        - /sbin
        - /usr/bin
        - /usr/libexec
        - /usr/sbin
        - /usr/local/bin
        - /usr/local/sbin
