assessment:
  id: SV-257986.automated
  version: 1
  assessment_title: RHEL-09-255050 - RHEL 9 must enable the Pluggable Authentication Module (PAM) interface
    for SSHD.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    etc-ssh-sshd-config-or-etc-ssh-sshd-config-d:
      test_title: /etc/ssh/sshd_config or /etc/ssh/sshd_config.d/*:UsePAM == yes
      collect:
        object_title: UsePAM in all sshd_config and sshd_config.d/* files
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                filepath: /etc/ssh/sshd_config
                pattern:
                  operation: pattern match
                  value: ^\s*UsePAM\s+(\w*)
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                path: /etc/ssh/sshd_config.d
                filename:
                  operation: pattern match
                  value: ^.+\.conf$
                pattern:
                  operation: pattern match
                  value: ^\s*UsePAM\s+(\w*)
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: subexpression
          operation: equals
          value: 'yes'
  evaluate:
    check: etc-ssh-sshd-config-or-etc-ssh-sshd-config-d
