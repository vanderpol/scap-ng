assessment:
  id: SV-270176.automated
  version: 1
  assessment_title: RHEL-09-232104 - RHEL 9 "/etc/audit/" must be group-owned by root.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    etc-audit-directory-owned-by-root:
      test_title: /etc/audit directory is owned by root
      capability: unix.file
      collect:
        object_title: /etc/audit directory
        capability: unix.file
        select:
          path:
            operation: equals
            datatype: string
            mask: false
            value: /etc/audit
          filename:
            operation: equals
            datatype: string
            mask: false
            nil: true
            value: ''
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: group_id
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: group-owned by root
        state_capability: unix.file
  evaluate:
    check: etc-audit-directory-owned-by-root
