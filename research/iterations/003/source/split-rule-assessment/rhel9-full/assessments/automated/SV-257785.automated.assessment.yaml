assessment:
  id: SV-257785.automated
  version: 1
  assessment_title: RHEL-09-211050 - The x86 Ctrl-Alt-Delete key sequence must be disabled on RHEL 9.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    ctrl-alt-del-target-unit-masked:
      test_title: The ctrl-alt-del.target unit is masked.
      collect:
        object_title: null
        capability: unix.symlink
        select:
          filepath: /etc/systemd/system/ctrl-alt-del.target
      assert:
        state_title: null
        existence: at_least_one_exists
        check: all
        state:
          field: canonical_path
          operation: equals
          value: /dev/null
  evaluate:
    check: ctrl-alt-del-target-unit-masked
