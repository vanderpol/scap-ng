assessment:
  id: SV-258114.automated
  version: 1
  assessment_title: RHEL-09-611125 - RHEL 9 must require the maximum number of repeating characters be
    limited to three when passwords are changed.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    maximum-number-repeating-characters-limited-three-when-passwords-changed:
      test_title: The maximum number of repeating characters is limited to three when passwords are changed.
      collect:
        object_title: null
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                filepath: /etc/security/pwquality.conf
                pattern:
                  operation: pattern match
                  value: ^\s*maxrepeat\s*=\s*(-?\d*)\s*(?:#.*)?$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                path: /etc/security/pwquality.conf.d
                filename:
                  operation: pattern match
                  value: \.conf$
                pattern:
                  operation: pattern match
                  value: ^\s*maxrepeat\s*=\s*(-?\d*)\s*(?:#.*)?$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
              behaviors:
                recurse_direction: down
      assert:
        state_title: null
        existence: at_least_one_exists
        check: all
        state:
          all:
          - field: subexpression
            operation: less than or equal
            value: '3'
            datatype: int
          - field: subexpression
            operation: greater than
            value: '0'
            datatype: int
  evaluate:
    check: maximum-number-repeating-characters-limited-three-when-passwords-changed
