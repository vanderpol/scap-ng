assessment:
  id: SV-258051.automated
  version: 2
  assessment_title: RHEL-09-411060 - All RHEL 9 local interactive users must have a home directory assigned
    in the /etc/passwd file.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    check-users-without-home-directory-not-defined:
      test_title: check for users without a home directory not defined
      capability: unix.password
      collect:
        object_title: only non-system users (uid>999) home-dirs
        capability: unix.password
        set:
          operator: complement
          members:
          - collect:
              object_title: Users with an username
              capability: unix.password
              select:
                username:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: '[\w]+'
          filters:
          - action: exclude
            match:
              field: user_id
              value: '1000'
              operation: less than
              datatype: int
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            state_title: only uids < 1000
            capability: unix.password
      assert:
        existence: all_exist
        check: all
        state:
          field: home_dir
          value: .+
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: only users with the home directory defined
        state_capability: unix.password
    check-if-root-s-home-directory-not-defined:
      test_title: check if root's home directory is not defined
      capability: unix.password
      collect:
        object_title: only root users (uid=0) home-dirs
        capability: unix.password
        set:
          operator: complement
          members:
          - collect:
              object_title: Users with an username
              capability: unix.password
              select:
                username:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: '[\w]+'
          filters:
          - action: exclude
            match:
              field: user_id
              value: '0'
              operation: greater than
              datatype: int
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            state_title: only uids > 0
            capability: unix.password
      assert:
        existence: all_exist
        check: all
        state:
          field: home_dir
          value: .+
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: only users with the home directory defined
        state_capability: unix.password
  evaluate:
    all:
    - check: check-users-without-home-directory-not-defined
    - check: check-if-root-s-home-directory-not-defined
