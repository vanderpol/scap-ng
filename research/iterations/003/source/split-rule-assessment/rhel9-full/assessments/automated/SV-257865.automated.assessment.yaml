assessment:
  id: SV-257865.automated
  version: 1
  assessment_title: RHEL-09-231120 - RHEL 9 must mount /dev/shm with the nosuid option.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    if-dev-shm-mounted-it-mounted-nosuid-option:
      test_title: If /dev/shm is mounted, it is mounted with the nosuid option
      collect:
        object_title: null
        capability: linux.partition
        select:
          mount_point: /dev/shm
      assert:
        state_title: null
        existence: any_exist
        check: all
        state:
          field: mount_options
          operation: equals
          value: nosuid
          entity_check: at least one
    if-dev-shm-configured-in-etc-fstab-it-configured-nosuid:
      test_title: If /dev/shm is configured in /etc/fstab, it is configured with the nosuid option
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath: /etc/fstab
          pattern:
            operation: pattern match
            value: ^\s*[^#\s]+\s+/dev/shm\s+\S+\s+(\S+)\s+\S+\s+\S+\s*$
          instance: '1'
      assert:
        state_title: null
        existence: any_exist
        check: all
        state:
          field: subexpression
          operation: pattern match
          value: (?:^nosuid$|^nosuid,|,nosuid$|,nosuid,)
  evaluate:
    all:
    - check: if-dev-shm-mounted-it-mounted-nosuid-option
    - check: if-dev-shm-configured-in-etc-fstab-it-configured-nosuid
