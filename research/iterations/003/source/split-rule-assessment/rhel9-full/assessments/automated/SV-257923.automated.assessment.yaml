assessment:
  id: SV-257923.automated
  version: 13
  assessment_title: RHEL 9 library directories must be group-owned by root or a system account.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    system-library-directories-group-by-root-group:
      test_title: System Library directories are group by root group.
      capability: unix.file
      collect:
        object_title: All system-wide Library directories not owned by root-group
        capability: unix.file
        select:
          path:
            variable_check: only one
            value:
              variable: system-wide-shared-library-files-directories
          filename:
            nil: true
            value: ''
        filters:
        - action: exclude
          match:
            field: group_id
            operation: less than
            value: '1000'
            datatype: int
          state_title: Group Owned by root or System group (gid less than 1000)
          capability: unix.file
        - action: exclude
          match:
            field: type
            operation: equals
            value: file
          capability: unix.file
        - action: exclude
          match:
            field: type
            operation: equals
            value: symbolic link
          state_title: symbolic links
          capability: unix.file
        behaviors:
          recurse_direction: down
      assert:
        existence: none_exist
        check: all
        state: null
  evaluate:
    check: system-library-directories-group-by-root-group
  variables:
    system-wide-shared-library-files-directories:
      title: system-wide shared library files directories
      datatype: string
      kind: constant
      expression:
        literal:
        - /lib
        - /lib64
        - /usr/lib
        - /usr/lib64
