assessment:
  id: SV-258148.automated
  version: 1
  assessment_title: RHEL-09-652050 - RHEL 9 must encrypt via the gtls driver the transfer of audit records
    offloaded onto a different system or media from the system being audited via rsyslog.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    defaultnetstreamdriver-gtls:
      test_title: DefaultNetstreamDriver == gtls
      capability: independent.textfilecontent54
      collect:
        object_title: DefaultNetstreamDriver
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: 'rsyslog.conf: DefaultNetstreamDriver'
              capability: independent.textfilecontent54
              select:
                filepath:
                  operation: equals
                  datatype: string
                  mask: false
                  value: /etc/rsyslog.conf
                pattern:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: ^\$DefaultNetstreamDriver\s+(\S+)\s*$
                instance:
                  operation: greater than or equal
                  datatype: int
                  mask: false
                  value: '1'
              behaviors:
                ignore_case: 'true'
          - collect:
              object_title: 'rsyslog.d/*.conf: DefaultNetstreamDriver'
              capability: independent.textfilecontent54
              select:
                path:
                  operation: equals
                  datatype: string
                  mask: false
                  value: /etc/rsyslog.d
                filename:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: ^.*\.conf$
                pattern:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: ^\$DefaultNetstreamDriver\s+(\S+)\s*$
                instance:
                  operation: greater than or equal
                  datatype: int
                  mask: false
                  value: '1'
              behaviors:
                ignore_case: 'true'
      assert:
        existence: at_least_one_exists
        check: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: gtls
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    streamdriver-gtls-advanced-syntax:
      test_title: StreamDriver == gtls (advanced syntax)
      capability: independent.textfilecontent54
      collect:
        object_title: 'rsyslog: action for all messages'
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: 'rsyslog.conf: action for all messages'
              capability: independent.textfilecontent54
              select:
                filepath:
                  operation: equals
                  datatype: string
                  mask: false
                  value: /etc/rsyslog.conf
                pattern:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: ^\*\.\*\s+action\((\s*(?:[^#\)]*(?:#.*$)?\n)*[^#\)]*)\)
                instance:
                  operation: greater than or equal
                  datatype: int
                  mask: false
                  value: '1'
              behaviors:
                ignore_case: 'true'
          - collect:
              object_title: 'rsyslog.d/*.conf: action for all messages'
              capability: independent.textfilecontent54
              select:
                path:
                  operation: equals
                  datatype: string
                  mask: false
                  value: /etc/rsyslog.d
                filename:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: ^.*\.conf$
                pattern:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: ^\*\.\*\s+action\((\s*(?:[^#\)]*(?:#.*$)?\n)*[^#\)]*)\)
                instance:
                  operation: greater than or equal
                  datatype: int
                  mask: false
                  value: '1'
              behaviors:
                ignore_case: 'true'
      assert:
        existence: at_least_one_exists
        check: at least one
        state_operator: AND
        states:
        - state_title: null
          capability: independent.textfilecontent54
          state:
            field: subexpression
            value: (?i)(?:^|\n)[^#]*\btype\s*=\s*"omfwd"
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: independent.textfilecontent54
          state:
            field: subexpression
            value: (?i)(?:^|\n)[^#]*\bStreamDriver(?:\.Name)?\s*=\s*"gtls"
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    streamdriver-not-set-in-module-block-advanced-syntax:
      test_title: StreamDriver is not set in a module block (advanced syntax)
      capability: independent.textfilecontent54
      collect:
        object_title: 'rsyslog: module blocks'
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: 'rsyslog.conf: module blocks'
              capability: independent.textfilecontent54
              select:
                filepath:
                  operation: equals
                  datatype: string
                  mask: false
                  value: /etc/rsyslog.conf
                pattern:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: ^\s*module\((\s*(?:[^#\)]*(?:#.*$)?\n)*[^#\)]*)\)
                instance:
                  operation: greater than or equal
                  datatype: int
                  mask: false
                  value: '1'
              behaviors:
                ignore_case: 'true'
          - collect:
              object_title: 'rsyslog.d/*.conf: module blocks'
              capability: independent.textfilecontent54
              select:
                path:
                  operation: equals
                  datatype: string
                  mask: false
                  value: /etc/rsyslog.d
                filename:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: ^.*\.conf$
                pattern:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: ^\s*module\((\s*(?:[^#\)]*(?:#.*$)?\n)*[^#\)]*)\)
                instance:
                  operation: greater than or equal
                  datatype: int
                  mask: false
                  value: '1'
              behaviors:
                ignore_case: 'true'
      assert:
        existence: any_exist
        check: none satisfy
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: (?i)(?:^|\n)[^#]*\bStreamDriver(?:\.Name)?\b
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - any:
      - check: defaultnetstreamdriver-gtls
      - check: streamdriver-gtls-advanced-syntax
    - check: streamdriver-not-set-in-module-block-advanced-syntax
