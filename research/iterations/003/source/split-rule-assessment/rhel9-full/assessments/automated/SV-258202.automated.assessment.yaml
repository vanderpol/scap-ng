assessment:
  id: SV-258202.automated
  version: 1
  assessment_title: RHEL-09-654140 - RHEL 9 must audit all uses of the ssh-keysign command.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    audit-invocations-usr-libexec-openssh-ssh-keysign:
      test_title: Audit invocations of /usr/libexec/openssh/ssh-keysign
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath: /etc/audit/audit.rules
          pattern:
            operation: pattern match
            value: ^\s*-a\s+(always,exit|exit,always)(?:\s+-S\s+all)?\s+-F\s+path=/usr/libexec/openssh/ssh-keysign\s+(-F\s+perm=([rwa]*x[rwa]*)\s+)?-F\s+auid>=1000\s+-F\s+auid!=(4294967295|-1|unset)(\s+(-k\s+|-F\s+key=)\S+)?\s*$
          instance:
            operation: greater than or equal
            value: '1'
      assert:
        state_title: null
        existence: all_exist
        check: all
        state: null
  evaluate:
    check: audit-invocations-usr-libexec-openssh-ssh-keysign
