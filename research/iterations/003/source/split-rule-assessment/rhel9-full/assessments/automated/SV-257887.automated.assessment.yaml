assessment:
  id: SV-257887.automated
  version: 1
  assessment_title: RHEL-09-232035 - RHEL 9 audit tools must have a mode of 0755 or less permissive.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    audit-tools-have-mode-0755-or-less-permissive:
      test_title: audit tools have a mode of 0755 or less permissive.
      collect:
        object_title: audit tools
        capability: unix.file
        select:
          filepath:
            variable_check: at least one
            datatype: string
            value:
              variable: audit-tools
      assert:
        existence: all_exist
        check: all
        state:
          all:
          - field: suid
            operation: equals
            value: 'false'
            datatype: boolean
          - field: sgid
            operation: equals
            value: 'false'
            datatype: boolean
          - field: sticky
            operation: equals
            value: 'false'
            datatype: boolean
          - field: gwrite
            operation: equals
            value: 'false'
            datatype: boolean
          - field: owrite
            operation: equals
            value: 'false'
            datatype: boolean
        state_title: mode 0755 or less permissive
  evaluate:
    check: audit-tools-have-mode-0755-or-less-permissive
  variables:
    audit-tools:
      title: audit tools
      datatype: string
      kind: constant
      expression:
        literal:
        - /sbin/auditctl
        - /sbin/aureport
        - /sbin/ausearch
        - /sbin/autrace
        - /sbin/auditd
        - /sbin/rsyslogd
        - /sbin/augenrules
