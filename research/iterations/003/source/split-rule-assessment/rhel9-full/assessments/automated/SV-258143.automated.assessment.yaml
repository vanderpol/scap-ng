assessment:
  id: SV-258143.automated
  version: 2
  assessment_title: RHEL-09-652025 - RHEL 9 must be configured so that the rsyslog daemon does not accept
    log messages from other servers unless the server is being used for log aggregation.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    no-remote-log-acceptance:
      test_title: no remote log acceptance
      collect:
        object_title: remote log acceptance config
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: 'rsyslog.conf: remote log acceptance config'
              capability: independent.textfilecontent54
              select:
                filepath:
                  datatype: string
                  value: /etc/rsyslog.conf
                pattern:
                  operation: pattern match
                  variable_check: at least one
                  value:
                    variable: patterns-remote-log-acceptance-config
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
              behaviors:
                ignore_case: 'true'
          - collect:
              object_title: 'rsyslog.d/*.conf: remote log acceptance config'
              capability: independent.textfilecontent54
              select:
                path: /etc/rsyslog.d
                filename:
                  operation: pattern match
                  value: ^.*\.conf$
                pattern:
                  operation: pattern match
                  variable_check: at least one
                  value:
                    variable: patterns-remote-log-acceptance-config
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
              behaviors:
                ignore_case: 'true'
      assert:
        state_title: null
        existence: none_exist
        check: all
        state: null
  evaluate:
    check: no-remote-log-acceptance
  variables:
    patterns-remote-log-acceptance-config:
      title: Patterns for remote log acceptance config
      datatype: string
      expression:
        literal:
        - ^[^#]*InputTCPServerRun
        - ^[^#]*UDPServerRun
        - ^[^#]*RELPServerRun
        - ^[^#]*module\s*\(.*\bload\s*=\s*"imtcp".*\)
        - ^[^#]*module\s*\(.*\bload\s*=\s*"imudp".*\)
        - ^[^#]*module\s*\(.*\bload\s*=\s*"imrelp".*\)
        - ^[^#]*input\s*\(.*\btype\b\s*=\s*"imtcp"\s*\bport\b\s*=\s*"514".*\)
        - ^[^#]*input\s*\(.*\btype\b\s*=\s*"imudp"\s*\bport\b\s*=\s*"514".*\)
        - ^[^#]*input\s*\(.*\btype\b\s*=\s*"imrelp"\s*\bport\b\s*=\s*"514".*\)
