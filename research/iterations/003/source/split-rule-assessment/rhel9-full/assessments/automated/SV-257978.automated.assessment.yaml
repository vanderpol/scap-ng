assessment:
  id: SV-257978.automated
  version: 1
  assessment_title: RHEL-09-255010 - All RHEL 9 networked systems must have SSH installed.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    openssh-server-package-installed:
      test_title: openssh-server package is installed
      capability: linux.rpminfo
      collect:
        object_title: null
        capability: linux.rpminfo
        select:
          name:
            operation: equals
            datatype: string
            mask: false
            value: openssh-server
      assert:
        existence: at_least_one_exists
        check: all
        state: null
  evaluate:
    check: openssh-server-package-installed
