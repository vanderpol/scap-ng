assessment:
  id: SV-258115.automated
  version: 3
  assessment_title: RHEL-09-611130 - RHEL 9 must require the change of at least four character classes
    when passwords are changed.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    passwords-contain-at-least-four-character-classes:
      test_title: Passwords contain at least four character classes.
      collect:
        object_title: null
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                filepath: /etc/security/pwquality.conf
                pattern:
                  operation: pattern match
                  value: ^\s*minclass\s*=\s*(-?\d*)\s*(?:#.*)?$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                path: /etc/security/pwquality.conf.d
                filename:
                  operation: pattern match
                  value: \.conf$
                pattern:
                  operation: pattern match
                  value: ^\s*minclass\s*=\s*(-?\d*)\s*(?:#.*)?$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
              behaviors:
                recurse_direction: down
      assert:
        state_title: null
        existence: at_least_one_exists
        check: all
        state:
          field: subexpression
          operation: greater than or equal
          value: '4'
          datatype: int
  evaluate:
    check: passwords-contain-at-least-four-character-classes
