assessment:
  id: SV-257777.automated
  version: 1
  assessment_title: RHEL-09-211010 - RHEL 9 must be a vendor-supported release.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    rhel-9-minor-version-supported:
      test_title: The RHEL 9 minor version is supported.
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          path:
            operation: equals
            datatype: string
            mask: false
            value: /etc
          filename:
            operation: equals
            datatype: string
            mask: false
            value: redhat-release
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^\s*Red Hat Enterprise Linux release 9\.(\d+)
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state_operator: OR
        states:
        - state_title: null
          capability: independent.textfilecontent54
          state:
            field: subexpression
            value: '7'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: independent.textfilecontent54
          state:
            field: subexpression
            value: '8'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: independent.textfilecontent54
          state:
            field: subexpression
            value: '9'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: independent.textfilecontent54
          state:
            field: subexpression
            value: '10'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    check: rhel-9-minor-version-supported
