assessment:
  id: SV-257995.automated
  version: 2
  assessment_title: RHEL-09-255095 - RHEL 9 must be configured so that all network connections associated
    with SSH traffic terminate after becoming unresponsive.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    etc-ssh-sshd-config-clientalivecountmax-1:
      test_title: /etc/ssh/sshd_config:ClientAliveCountMax = 1
      capability: independent.textfilecontent54
      collect:
        object_title: all sshd_config and sshd_config.d/* files
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                filepath:
                  operation: equals
                  datatype: string
                  mask: false
                  value: /etc/ssh/sshd_config
                pattern:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: ^\s*(?i)ClientAliveCountMax(?-i)\s+"?(\d+)"?\s*(?:|(?:#.*))?$
                instance:
                  operation: greater than or equal
                  datatype: int
                  mask: false
                  value: '1'
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                path:
                  operation: equals
                  datatype: string
                  mask: false
                  value: /etc/ssh/sshd_config.d
                filename:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: .+
                pattern:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: ^\s*(?i)ClientAliveCountMax(?-i)\s+"?(\d+)"?\s*(?:|(?:#.*))?$
                instance:
                  operation: greater than or equal
                  datatype: int
                  mask: false
                  value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    check: etc-ssh-sshd-config-clientalivecountmax-1
