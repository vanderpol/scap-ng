assessment:
  id: SV-257848.automated
  version: 1
  assessment_title: RHEL-09-231035 - RHEL 9 must use a separate file system for /var/tmp.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    var-tmp-mounted:
      test_title: /var/tmp is mounted
      collect:
        object_title: /var/tmp
        capability: linux.partition
        select:
          mount_point: /var/tmp
      assert:
        existence: at_least_one_exists
        check: all
        state: null
  evaluate:
    check: var-tmp-mounted
