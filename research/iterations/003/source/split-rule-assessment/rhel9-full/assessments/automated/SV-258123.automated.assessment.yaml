assessment:
  id: SV-258123.automated
  version: 2
  assessment_title: RHEL-09-611170 - RHEL 9 must implement certificate status checking for multifactor
    authentication.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    sssd-config-certificate-verification-ocsp-dgst-sha512:
      test_title: 'sssd config: certificate_verification: ocsp_dgst=sha512'
      capability: independent.textfilecontent54
      collect:
        object_title: 'sssd config: certificate_verification'
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: 'sssd.conf: certificate_verification'
              capability: independent.textfilecontent54
              select:
                filepath:
                  operation: equals
                  datatype: string
                  mask: false
                  value: /etc/sssd/sssd.conf
                pattern:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: ^\s*certificate_verification\s*=\s*(.*)\s*$
                instance:
                  operation: greater than or equal
                  datatype: int
                  mask: false
                  value: '1'
          - collect:
              object_title: '/etc/sssd/conf.d/*.conf: certificate_verification'
              capability: independent.textfilecontent54
              select:
                path:
                  operation: equals
                  datatype: string
                  mask: false
                  value: /etc/sssd/conf.d
                filename:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: ^[^.].*\.conf$
                pattern:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: ^\s*certificate_verification\s*=\s*(.*)\s*$
                instance:
                  operation: greater than or equal
                  datatype: int
                  mask: false
                  value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: (?i)(^|,)ocsp_dgst=sha512(,|$)
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    check: sssd-config-certificate-verification-ocsp-dgst-sha512
