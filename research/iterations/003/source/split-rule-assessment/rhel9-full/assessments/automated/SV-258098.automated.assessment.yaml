assessment:
  id: SV-258098.automated
  version: 1
  assessment_title: RHEL-09-611045 - RHEL 9 must ensure the password complexity module is enabled in the
    system-auth file.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    system-auth-pam-pwquality:
      test_title: system-auth pam_pwquality
      collect:
        object_title: system-auth password required, requisite
        capability: independent.textfilecontent54
        select:
          filepath:
            datatype: string
            value: /etc/pam.d/system-auth
          pattern:
            operation: pattern match
            value: ^\s*password\s+(?:required|requisite)\s+(.*)$
          instance:
            operation: greater than or equal
            datatype: int
            value: '1'
        behaviors:
          ignore_case: 'true'
      assert:
        existence: at_least_one_exists
        check: at least one
        state:
          field: subexpression
          operation: pattern match
          value: ^pam_pwquality.so(\s|$)
          datatype: string
  evaluate:
    check: system-auth-pam-pwquality
