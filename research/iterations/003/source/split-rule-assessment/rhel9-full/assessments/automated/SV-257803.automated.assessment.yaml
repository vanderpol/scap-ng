assessment:
  id: SV-257803.automated
  version: 1
  assessment_title: RHEL-09-213040 - RHEL 9 must disable the kernel.core_pattern.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    kernel-core-pattern-setting-in-kernel-set-bin-false:
      test_title: kernel.core_pattern setting in kernel is set to |/bin/false
      capability: unix.sysctl
      collect:
        object_title: null
        capability: unix.sysctl
        select:
          name:
            operation: equals
            datatype: string
            mask: false
            value: kernel.core_pattern
      assert:
        existence: all_exist
        check: all
        state_title: null
        state_capability: unix.sysctl
        state:
          field: value
          value: '|/bin/false'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    check: kernel-core-pattern-setting-in-kernel-set-bin-false
