assessment:
  id: SV-258241.automated
  version: 13
  assessment_title: RHEL 9 must implement a FIPS 140-3-compliant systemwide cryptographic policy.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    verify-rhel-9-set-use-fips-140-3-compliant-systemwide:
      test_title: Verify RHEL 9 is set to use a FIPS 140-3-compliant systemwide cryptographic policy.
      capability: independent.shellcommand
      collect:
        object_title: Retrieve system wide crypto policy(ies).
        capability: independent.shellcommand
        select:
          shell:
            operation: equals
            datatype: string
            mask: false
            value: bash
          command:
            operation: equals
            datatype: string
            mask: false
            value: update-crypto-policies --show
      assert:
        existence: at_least_one_exists
        check: all
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: ^FIPS:*
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        state_title: Confirm system wide crypto policy(ies) are correct.
        state_capability: independent.shellcommand
    verify-current-minimum-crypto-policy-configuration:
      test_title: Verify the current minimum crypto-policy configuration.
      capability: independent.textfilecontent54
      collect:
        object_title: Retrieve the current minimum crypto-policy configuration.
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/crypto-policies/state/CURRENT.pol
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^hash\s*=\s*.*$
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: text
          value:
            variable: allowed-fips-algorithms
          operation: pattern match
          datatype: string
          mask: false
          variable_check: all
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: Confirm correct algorithms.
        state_capability: independent.textfilecontent54
    verify-no-sha1-algorithms-employed:
      test_title: Verify no SHA1 algorithms are employed.
      capability: independent.textfilecontent54
      collect:
        object_title: Retrieve the current minimum crypto-policy configuration.
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/crypto-policies/state/CURRENT.pol
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^hash\s*=\s*.*$
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: any_exist
        check: all
        state:
          field: text
          value: SHA1-\d
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: Check for existence of SHA1 algorithms (negated at criterion level).
        state_capability: independent.textfilecontent54
    verify-minimum-hash-values-224:
      test_title: Verify minimum hash values of 224.
      capability: independent.textfilecontent54
      collect:
        object_title: Retrieve the current minimum crypto-policy configuration with hash values subexpression.
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/crypto-policies/state/CURRENT.pol
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^hash\s*=\s*([^#\n]+)$
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: any_exist
        check: all
        state:
          field: subexpression
          value: \b[A-Z]+\d*-((\d{1,2}\b)|(1\d\d\b)|(21\d\b)|(22[1-3]\b))
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: Confirm minimum hash values of 224.
        state_capability: independent.textfilecontent54
    verify-minimum-rsa-size-2048:
      test_title: Verify minimum rsa size of 2048.
      capability: independent.textfilecontent54
      collect:
        object_title: Retrieve the current minimum rsa size.
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/crypto-policies/state/CURRENT.pol
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^\s*min_rsa_size\s*=\s*(\d+)
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: subexpression
          value: '2048'
          operation: greater than or equal
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: Confirm minimum rsa size of 2048.
        state_capability: independent.textfilecontent54
  evaluate:
    all:
    - check: verify-rhel-9-set-use-fips-140-3-compliant-systemwide
    - check: verify-current-minimum-crypto-policy-configuration
    - not:
        check: verify-no-sha1-algorithms-employed
    - not:
        check: verify-minimum-hash-values-224
    - check: verify-minimum-rsa-size-2048
  variables:
    allowed-fips-algorithms:
      title: Allowed FIPS algorithms.
      datatype: string
      kind: constant
      expression:
        literal:
        - SHA2-256
        - SHA2-384
        - SHA2-512
        - SHA2-224
        - SHA3-256
        - SHA3-384
        - SHA3-384
        - SHA3-512
        - SHAKE-256
