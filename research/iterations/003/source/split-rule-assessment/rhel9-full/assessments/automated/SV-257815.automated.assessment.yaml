assessment:
  id: SV-257815.automated
  version: 1
  assessment_title: RHEL-09-213100 - RHEL 9 must disable acquiring, saving, and processing core dumps.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    systemd-coredump-socket-loadstate-masked-if-exists:
      test_title: systemd-coredump.socket LoadState is masked if exists
      capability: linux.systemdunitproperty
      collect:
        object_title: systemd-coredump.socket LoadState
        capability: linux.systemdunitproperty
        select:
          unit:
            operation: equals
            datatype: string
            mask: false
            value: systemd-coredump.socket
          property:
            operation: equals
            datatype: string
            mask: false
            value: LoadState
      assert:
        existence: any_exist
        check: all
        state:
          field: value
          value: masked
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_capability: linux.systemdunitproperty
    systemd-coredump-socket-unitfilestate-masked-if-exists:
      test_title: systemd-coredump.socket UnitFileState is masked if exists
      capability: linux.systemdunitproperty
      collect:
        object_title: systemd-coredump.socket UnitFileState
        capability: linux.systemdunitproperty
        select:
          unit:
            operation: equals
            datatype: string
            mask: false
            value: systemd-coredump.socket
          property:
            operation: equals
            datatype: string
            mask: false
            value: UnitFileState
      assert:
        existence: any_exist
        check: all
        state:
          field: value
          value: masked
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_capability: linux.systemdunitproperty
  evaluate:
    all:
    - check: systemd-coredump-socket-loadstate-masked-if-exists
    - check: systemd-coredump-socket-unitfilestate-masked-if-exists
