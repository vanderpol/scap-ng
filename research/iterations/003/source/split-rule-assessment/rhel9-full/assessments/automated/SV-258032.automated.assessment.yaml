assessment:
  id: SV-258032.automated
  version: 1
  assessment_title: RHEL-09-271110 - RHEL 9 must prevent a user from overriding the Ctrl-Alt-Del sequence
    settings for the graphical user interface.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    org-gnome-settings-daemon-plugins-media-keys-logout-locked-in:
      test_title: /org/gnome/settings-daemon/plugins/media-keys/logout is locked in /etc/dconf/db/local.d/locks/*
      capability: independent.textfilecontent54
      collect:
        object_title: /org/gnome/settings-daemon/plugins/media-keys/logout in /etc/dconf/db/local.d/locks/*
        capability: independent.textfilecontent54
        select:
          path:
            operation: equals
            datatype: string
            mask: false
            value: /etc/dconf/db/local.d/locks
          filename:
            operation: pattern match
            datatype: string
            mask: false
            value: .*
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^/org/gnome/settings-daemon/plugins/media-keys/logout$
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state: null
  evaluate:
    check: org-gnome-settings-daemon-plugins-media-keys-logout-locked-in
