assessment:
  id: SV-258072.automated
  version: 1
  assessment_title: RHEL-09-412055 - RHEL 9 must define default permissions for the bash shell.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    umask-set-077-in-etc-bashrc:
      test_title: UMASK is set to 077 in /etc/bashrc
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/bashrc
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^[^#]*\s*(?i)umask\s*(\d+)\s*$
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: all_exist
        check: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: '077'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    check: umask-set-077-in-etc-bashrc
