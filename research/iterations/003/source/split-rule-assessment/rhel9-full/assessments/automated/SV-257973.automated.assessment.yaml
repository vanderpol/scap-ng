assessment:
  id: SV-257973.automated
  version: 2
  assessment_title: RHEL-09-254020 - RHEL 9 must not forward IPv6 source-routed packets.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    net-ipv6-conf-all-accept-source-route-setting-in-kernel:
      test_title: net.ipv6.conf.all.accept_source_route setting in kernel is set to 0
      collect:
        object_title: null
        capability: unix.sysctl
        select:
          name: net.ipv6.conf.all.accept_source_route
      assert:
        existence: all_exist
        check: all
        state:
          field: value
          operation: equals
          value: '0'
          datatype: int
  evaluate:
    check: net-ipv6-conf-all-accept-source-route-setting-in-kernel
