assessment:
  id: SV-258158.automated
  version: 1
  assessment_title: RHEL-09-653045 - RHEL 9 must take action when allocated audit record storage volume
    reaches 95 percent of the audit record storage capacity.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    etc-audit-auditd-conf-admin-space-left-5:
      test_title: '/etc/audit/auditd.conf: admin_space_left = 5%'
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/audit/auditd.conf
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: (?i)^\s*admin_space_left\s*=\s*(\S+)\s*(?:#.*)?$
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: 5%
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    check: etc-audit-auditd-conf-admin-space-left-5
