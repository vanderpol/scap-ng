assessment:
  id: SV-257793.automated
  version: 1
  assessment_title: RHEL-09-212040 - RHEL 9 must clear the page allocator to prevent use-after-free attacks.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    bls-options-contain-page-poison-1:
      test_title: BLS options contain page_poison=1
      collect:
        object_title: BLS options
        capability: independent.textfilecontent54
        select:
          path: /boot/loader/entries
          filename:
            operation: pattern match
            value: ^.*\.conf$
          pattern:
            operation: pattern match
            value: ^options\s+(.*)$
          instance:
            operation: greater than or equal
            value: '1'
      assert:
        state_title: null
        existence: at_least_one_exists
        check: all
        state:
          field: subexpression
          operation: pattern match
          value: (^|\s)page_poison=1(\s|$)
    etc-default-grub-page-poison-1:
      test_title: /etc/default/grub page_poison=1
      collect:
        object_title: /etc/default/grub GRUB_CMDLINE_LINUX
        capability: independent.textfilecontent54
        select:
          filepath: /etc/default/grub
          pattern:
            operation: pattern match
            value: ^GRUB_CMDLINE_LINUX="(.*)"
          instance:
            operation: greater than or equal
            value: '1'
      assert:
        state_title: null
        existence: at_least_one_exists
        check: all
        state:
          field: subexpression
          operation: pattern match
          value: (^|\s)page_poison=1(\s|$)
  evaluate:
    all:
    - check: bls-options-contain-page-poison-1
    - check: etc-default-grub-page-poison-1
