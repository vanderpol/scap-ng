assessment:
  id: SV-257863.automated
  version: 1
  assessment_title: RHEL-09-231110 - RHEL 9 must mount /dev/shm with the nodev option.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    if-dev-shm-mounted-it-mounted-nodev-option:
      test_title: If /dev/shm is mounted, it is mounted with the nodev option.
      collect:
        object_title: null
        capability: linux.partition
        select:
          mount_point: /dev/shm
      assert:
        existence: any_exist
        check: all
        state:
          field: mount_options
          operation: equals
          value: nodev
          entity_check: at least one
    if-dev-shm-configured-in-etc-fstab-it-configured-nodev:
      test_title: If /dev/shm is configured in /etc/fstab, it is configured with the nodev option.
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath: /etc/fstab
          pattern:
            operation: pattern match
            value: ^\s*[^#\s]+\s+/dev/shm\s+\S+\s+(\S+)\s+\S+\s+\S+\s*$
          instance:
            datatype: int
            value: '1'
      assert:
        existence: any_exist
        check: all
        state:
          field: subexpression
          operation: pattern match
          value: (?:^nodev$|^nodev,|,nodev$|,nodev,)
  evaluate:
    all:
    - check: if-dev-shm-mounted-it-mounted-nodev-option
    - check: if-dev-shm-configured-in-etc-fstab-it-configured-nodev
