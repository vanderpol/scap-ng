assessment:
  id: SV-258128.automated
  version: 1
  assessment_title: RHEL-09-611195 - RHEL 9 must require authentication to access emergency mode.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    emergency-service-config-correct:
      test_title: emergency.service config correct
      capability: independent.textfilecontent54
      collect:
        object_title: /usr/lib/systemd/system/emergency.service ExecStart
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /usr/lib/systemd/system/emergency.service
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^ExecStart=(.*)$
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: all_exist
        check: all
        state_title: emergency.service ExecStart
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: -/usr/lib/systemd/systemd-sulogin-shell emergency
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    check: emergency-service-config-correct
