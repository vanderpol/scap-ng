assessment:
  id: SV-257917.automated
  version: 1
  assessment_title: RHEL-09-232185 - RHEL 9 /var/log/messages file must be group-owned by root.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    var-log-messages-file-owned-by-root:
      test_title: /var/log/messages file is owned by root
      capability: unix.file
      collect:
        object_title: null
        capability: unix.file
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /var/log/messages
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: group_id
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: group-owned by root
        state_capability: unix.file
  evaluate:
    check: var-log-messages-file-owned-by-root
