assessment:
  id: SV-257944.automated
  version: 1
  assessment_title: RHEL-09-252015 - RHEL 9 chronyd service must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    chronyd-service-active:
      test_title: chronyd service is active
      capability: linux.systemdunitproperty
      collect:
        object_title: null
        capability: linux.systemdunitproperty
        select:
          unit:
            operation: equals
            datatype: string
            mask: false
            value: chronyd.service
          property:
            operation: equals
            datatype: string
            mask: false
            value: ActiveState
      assert:
        existence: at_least_one_exists
        check: all
        state_title: null
        state_capability: linux.systemdunitproperty
        state:
          field: value
          value: active
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    check: chronyd-service-active
