assessment:
  id: SV-257944.automated
  version: 1
  assessment_title: RHEL-09-252015 - RHEL 9 chronyd service must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    chronyd-service-active:
      test_title: chronyd service is active
      collect:
        object_title: null
        capability: linux.systemdunitproperty
        select:
          unit: chronyd.service
          property: ActiveState
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: value
          operation: equals
          value: active
  evaluate:
    check: chronyd-service-active
