assessment:
  id: SV-258177.automated
  version: 1
  assessment_title: RHEL-09-654015 - RHEL 9 must audit all uses of the chmod, fchmod, and fchmodat system
    calls.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    audit-32-bit-invocations-chmod-syscall:
      test_title: Audit 32-bit invocations of chmod syscall
      capability: independent.textfilecontent54
      collect:
        object_title: 32-bit chmod syscall
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/audit/audit.rules
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^\s*-a\s+(always,exit|exit,always)\s+-F\s+arch=b32\s+(?:.*(-S\s+chmod\s+|(\s+|,)chmod(\s+|,))).*-F\s+auid>=1000\s+-F\s+auid!=(4294967295|-1|unset)(\s+(-k\s+|-F\s+key=)[-\w]+)*\s*$
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: all_exist
        check: all
        state: null
    audit-64-bit-invocations-chmod-syscall:
