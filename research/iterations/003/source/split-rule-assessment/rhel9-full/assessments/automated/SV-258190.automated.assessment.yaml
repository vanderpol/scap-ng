assessment:
  id: SV-258190.automated
  version: 1
  assessment_title: RHEL-09-654080 - RHEL 9 must audit all uses of the init_module and finit_module system
    calls.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    audit-32-bit-invocations-init-module-syscall:
      test_title: Audit 32-bit invocations of init_module syscall
      collect:
        object_title: 32-bit init_module syscall
        capability: independent.textfilecontent54
        select:
          filepath: /etc/audit/audit.rules
          pattern:
            operation: pattern match
            value: ^\s*-a\s+(always,exit|exit,always)\s+-F\s+arch=b32\s+(?:.*(-S\s+init_module\s+|(\s+|,)init_module(\s+|,))).*-F\s+auid>=1000\s+-F\s+auid!=(4294967295|-1|unset)(\s+(-k\s+|-F\s+key=)[-\w]+)*\s*$
          instance:
            operation: greater than or equal
            value: '1'
      assert:
        state_title: null
        existence: all_exist
        check: all
        state: null
    audit-64-bit-invocations-init-module-syscall:
      test_title: Audit 64-bit invocations of init_module syscall
      collect:
        object_title: 64-bit init_module syscall
        capability: independent.textfilecontent54
        select:
          filepath: /etc/audit/audit.rules
          pattern:
            operation: pattern match
            value: ^\s*-a\s+(always,exit|exit,always)\s+-F\s+arch=b64\s+(?:.*(-S\s+init_module\s+|(\s+|,)init_module(\s+|,))).*-F\s+auid>=1000\s+-F\s+auid!=(4294967295|-1|unset)(\s+(-k\s+|-F\s+key=)[-\w]+)*\s*$
          instance:
            operation: greater than or equal
            value: '1'
      assert:
        state_title: null
        existence: all_exist
        check: all
        state: null
    audit-32-bit-invocations-finit-module-syscall:
      test_title: Audit 32-bit invocations of finit_module syscall
      collect:
        object_title: 32-bit finit_module syscall
        capability: independent.textfilecontent54
        select:
          filepath: /etc/audit/audit.rules
          pattern:
            operation: pattern match
            value: ^\s*-a\s+(always,exit|exit,always)\s+-F\s+arch=b32\s+(?:.*(-S\s+finit_module\s+|(\s+|,)finit_module(\s+|,))).*-F\s+auid>=1000\s+-F\s+auid!=(4294967295|-1|unset)(\s+(-k\s+|-F\s+key=)[-\w]+)*\s*$
          instance:
            operation: greater than or equal
            value: '1'
      assert:
        state_title: null
        existence: all_exist
        check: all
        state: null
    audit-64-bit-invocations-finit-module-syscall:
      test_title: Audit 64-bit invocations of finit_module syscall
      collect:
        object_title: 64-bit finit_module syscall
        capability: independent.textfilecontent54
        select:
          filepath: /etc/audit/audit.rules
          pattern:
            operation: pattern match
            value: ^\s*-a\s+(always,exit|exit,always)\s+-F\s+arch=b64\s+(?:.*(-S\s+finit_module\s+|(\s+|,)finit_module(\s+|,))).*-F\s+auid>=1000\s+-F\s+auid!=(4294967295|-1|unset)(\s+(-k\s+|-F\s+key=)[-\w]+)*\s*$
          instance:
            operation: greater than or equal
            value: '1'
      assert:
        state_title: null
        existence: all_exist
        check: all
        state: null
  evaluate:
    all:
    - check: audit-32-bit-invocations-init-module-syscall
    - check: audit-64-bit-invocations-init-module-syscall
    - check: audit-32-bit-invocations-finit-module-syscall
    - check: audit-64-bit-invocations-finit-module-syscall
