assessment:
  id: SV-258165.automated
  version: 1
  assessment_title: RHEL-09-653080 - RHEL 9 audit logs must be group-owned by root or by a restricted
    logging group to prevent unauthorized read access.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    audit-logs-group-owned-by-root:
      test_title: audit logs are group-owned by root
      capability: unix.file
      collect:
        object_title: Audit log file location
        capability: unix.file
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            variable_check: all
            value:
              variable: audit-data-directory-from-etc-audit-auditd-conf
      assert:
        existence: at_least_one_exists
        check: all
        state_title: group-owned by root
        state_capability: unix.file
        state:
          field: group_id
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    check: audit-logs-group-owned-by-root
  variables:
    audit-data-directory-from-etc-audit-auditd-conf:
      title: audit data directory from /etc/audit/auditd.conf
      kind: local
      datatype: string
      expression:
        object_values:
          collect:
            object_title: null
            capability: independent.textfilecontent54
            select:
              filepath:
                operation: equals
                datatype: string
                mask: false
                value: /etc/audit/auditd.conf
              pattern:
                operation: pattern match
                datatype: string
                mask: false
                value: ^\s*log_file\s*=\s*(\S+)\s*(?:#.*)?$
              instance:
                operation: greater than or equal
                datatype: int
                mask: false
                value: '1'
          field: subexpression
