assessment:
  id: SV-258165.automated
  version: 1
  assessment_title: RHEL-09-653080 - RHEL 9 audit logs must be group-owned by root or by a restricted
    logging group to prevent unauthorized read access.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    audit-logs-group-owned-by-root:
      test_title: audit logs are group-owned by root
      collect:
        object_title: Audit log file location
        capability: unix.file
        select:
          filepath:
            variable: audit-data-directory-from-etc-audit-auditd-conf
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: group_id
          operation: equals
          value: '0'
          datatype: int
        state_title: group-owned by root
  evaluate:
    check: audit-logs-group-owned-by-root
  variables:
    audit-data-directory-from-etc-audit-auditd-conf:
      title: audit data directory from /etc/audit/auditd.conf
      datatype: string
      kind: local
      expression:
        object_values:
          collect:
            object_title: null
            capability: independent.textfilecontent54
            select:
              filepath: /etc/audit/auditd.conf
              pattern:
                operation: pattern match
                value: ^\s*log_file\s*=\s*(\S+)\s*(?:#.*)?$
              instance:
                operation: greater than or equal
                datatype: int
                value: '1'
          field: subexpression
