assessment:
  id: SV-258105.automated
  version: 1
  assessment_title: RHEL-09-611080 - RHEL 9 passwords must have a 24 hours minimum password lifetime restriction
    in /etc/shadow.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    root-does-not-have-minimum-password-age-0-or-blank:
      test_title: Root does not have a minimum password age of 0 or blank
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/shadow
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: '^root:[^:]*:[^:]*:0*:'
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: none_exist
        check: all
        state: null
    non-system-users-do-not-have-minimum-password-age-0:
      test_title: Non-system users do not have a minimum password age of 0 or blank
      capability: unix.password
      collect:
        object_title: Users with a password age of zero minus system users
        capability: unix.password
        select:
          username:
            operation: equals
            datatype: string
            mask: false
            variable_check: at least one
            value:
              variable: usernames-users-minimum-password-age-0-or-blank
        filters:
        - action: exclude
          match:
            field: user_id
            value: '1000'
            operation: less than
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          capability: unix.password
        - action: exclude
          match:
            field: user_id
            value:
              variable: uid-user-nobody
            operation: equals
            datatype: int
            mask: false
            variable_check: all
            entity_check: all
            entity_existence: at_least_one_exists
          capability: unix.password
      assert:
        existence: none_exist
        check: all
        state: null
  evaluate:
    all:
    - check: root-does-not-have-minimum-password-age-0-or-blank
    - check: non-system-users-do-not-have-minimum-password-age-0
  variables:
    usernames-users-minimum-password-age-0-or-blank:
      title: Usernames of users with a minimum password age of 0 or blank
      kind: local
      datatype: string
      expression:
        object_values:
          collect:
            object_title: null
            capability: independent.textfilecontent54
            select:
              filepath:
                operation: equals
                datatype: string
                mask: false
                value: /etc/shadow
              pattern:
                operation: pattern match
                datatype: string
                mask: false
                value: '^([^:]*):[^:]*:[^:]*:0*:'
              instance:
                operation: greater than or equal
                datatype: int
                mask: false
                value: '1'
          field: subexpression
    uid-user-nobody:
      title: UID for user nobody
      kind: local
      datatype: int
      expression:
        object_values:
          collect:
            object_title: null
            capability: independent.textfilecontent54
            select:
              filepath:
                operation: equals
                datatype: string
                mask: false
                value: /etc/passwd
              pattern:
                operation: pattern match
                datatype: string
                mask: false
                value: '^nobody:[^:]*:([0-9]+):'
              instance:
                operation: equals
                datatype: int
                mask: false
                value: '1'
          field: subexpression
