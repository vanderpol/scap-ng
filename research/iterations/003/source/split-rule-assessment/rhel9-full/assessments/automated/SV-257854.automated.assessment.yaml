assessment:
  id: SV-257854.automated
  version: 2
  assessment_title: RHEL-09-231065 - RHEL 9 must prevent special devices on file systems that are imported
    via Network File System (NFS).
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    nfs-mounts-mounted-nodev:
      test_title: NFS mounts are mounted with nodev
      collect:
        object_title: /etc/fstab, uncommented, nfs, capturing options
        capability: independent.textfilecontent54
        select:
          filepath: /etc/fstab
          pattern:
            operation: pattern match
            value: ^\s*[^#\s][^\s]*\s+[^\s]+\s+nfs[^\s]*\s+([^\s]+)
          instance:
            operation: greater than or equal
            datatype: int
            value: '1'
      assert:
        state_title: nodev option
        existence: at_least_one_exists
        check: all
        state:
          field: subexpression
          operation: pattern match
          value: (^|,)nodev(,|$)
          datatype: string
  evaluate:
    check: nfs-mounts-mounted-nodev
