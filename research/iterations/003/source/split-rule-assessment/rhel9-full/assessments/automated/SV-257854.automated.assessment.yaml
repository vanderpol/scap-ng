assessment:
  id: SV-257854.automated
  version: 2
  assessment_title: RHEL-09-231065 - RHEL 9 must prevent special devices on file systems that are imported
    via Network File System (NFS).
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    nfs-mounts-mounted-nodev:
      test_title: NFS mounts are mounted with nodev
      capability: independent.textfilecontent54
      collect:
        object_title: /etc/fstab, uncommented, nfs, capturing options
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/fstab
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^\s*[^#\s][^\s]*\s+[^\s]+\s+nfs[^\s]*\s+([^\s]+)
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state_title: nodev option
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: (^|,)nodev(,|$)
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    check: nfs-mounts-mounted-nodev
