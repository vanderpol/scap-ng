assessment:
  id: SV-257981.automated
  version: 2
  assessment_title: RHEL-09-255025 - RHEL 9 must display the Standard Mandatory DOD Notice and Consent
    Banner before granting local or remote access to the system via a SSH logon.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    etc-ssh-sshd-config-banner-etc-issue:
      test_title: /etc/ssh/sshd_config:banner == /etc/issue
      collect:
        object_title: all sshd_config and sshd_config.d/* files
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: Pull value of /etc/ssh/sshd_config:banner
              capability: independent.textfilecontent54
              select:
                filepath: /etc/ssh/sshd_config
                pattern:
                  operation: pattern match
                  value: ^\s*(?i)banner(?-i)[ \t\"]+([\w\/]+)[\"\s]*(?:|(?:#.*))?$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
          - collect:
              object_title: Pull value of /etc/ssh/sshd_config.d:banner
              capability: independent.textfilecontent54
              select:
                path: /etc/ssh/sshd_config.d
                filename:
                  operation: pattern match
                  value: .+
                pattern:
                  operation: pattern match
                  value: ^\s*(?i)banner(?-i)[ \t\"]+([\w\/]+)[\"\s]*(?:|(?:#.*))?$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: subexpression
          operation: pattern match
          value: ^\/.+$
          datatype: string
        state_title: banner value is set to /etc/issue
    etc-ssh-sshd-config-banner-none:
      test_title: /etc/ssh/sshd_config:banner == none
      collect:
        object_title: all sshd_config and sshd_config.d/* files
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: Pull value of /etc/ssh/sshd_config:banner
              capability: independent.textfilecontent54
              select:
                filepath: /etc/ssh/sshd_config
                pattern:
                  operation: pattern match
                  value: ^\s*(?i)banner(?-i)[ \t]*(?:none[\s]*|(?:#.*))?$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
          - collect:
              object_title: Pull value of /etc/ssh/sshd_config.d:banner
              capability: independent.textfilecontent54
              select:
                path: /etc/ssh/sshd_config.d
                filename:
                  operation: pattern match
                  value: .+
                pattern:
                  operation: pattern match
                  value: ^\s*(?i)banner(?-i)[ \t]*(?:none[\s]*|(?:#.*))?$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
      assert:
        existence: none_exist
        check: all
        state: null
  evaluate:
    all:
    - check: etc-ssh-sshd-config-banner-etc-issue
    - check: etc-ssh-sshd-config-banner-none
