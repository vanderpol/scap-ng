assessment:
  id: SV-257920.automated
  version: 13
  assessment_title: RHEL 9 library files must be owned by root.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    system-library-files-owned-by-root:
      test_title: System Library files are owned by root
      capability: unix.file
      collect:
        object_title: All system-library files not owned by root
        capability: unix.file
        select:
          path:
            operation: equals
            datatype: string
            mask: false
            variable_check: only one
            value:
              variable: system-wide-shared-library-files-directories
          filename:
            operation: pattern match
            datatype: string
            mask: false
            value: \.so(\.\d+)*$
        filters:
        - action: exclude
          match:
            field: user_id
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: owned by root
          capability: unix.file
        - action: exclude
          match:
            field: type
            value: symbolic link
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: symbolic links
          capability: unix.file
        - action: exclude
          match:
            field: type
            value: directory
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          capability: unix.file
        behaviors:
          recurse_direction: down
      assert:
        existence: none_exist
        check: all
        state: null
  evaluate:
    check: system-library-files-owned-by-root
  variables:
    system-wide-shared-library-files-directories:
      title: system-wide shared library files directories
      datatype: string
      kind: constant
      expression:
        literal:
        - /lib
        - /lib64
        - /usr/lib
        - /usr/lib64
