assessment:
  id: SV-257810.automated
  version: 2
  assessment_title: RHEL-09-213075 - RHEL 9 must disable access to network bpf system call from nonprivileged
    processes.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    kernel-unprivileged-bpf-disabled-setting-in-kernel-set-1:
      test_title: kernel.unprivileged_bpf_disabled setting in kernel is set to 1
      capability: unix.sysctl
      collect:
        object_title: null
        capability: unix.sysctl
        select:
          name: kernel.unprivileged_bpf_disabled
      assert:
        existence: all_exist
        check: all
        state:
          field: value
          operation: equals
          value: '1'
          datatype: int
        state_capability: unix.sysctl
  evaluate:
    check: kernel-unprivileged-bpf-disabled-setting-in-kernel-set-1
