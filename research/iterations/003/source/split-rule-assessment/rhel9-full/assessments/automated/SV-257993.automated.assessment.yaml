assessment:
  id: SV-257993.automated
  version: 2
  assessment_title: RHEL-09-255085 - RHEL 9 must not allow users to override SSH environment variables.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    permituserenvironment-option-not-set-yes-in-etc-ssh-sshd-config:
      test_title: The PermitUserEnvironment option is not set to yes in /etc/ssh/sshd_config and /etc/ssh/sshd_config.d/*.conf.
      collect:
        object_title: null
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                filepath: /etc/ssh/sshd_config
                pattern:
                  operation: pattern match
                  value: ^(?i)\s*PermitUserEnvironment\s+(\w+)$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                path: /etc/ssh/sshd_config.d
                filename:
                  operation: pattern match
                  value: ^.+\.conf$
                pattern:
                  operation: pattern match
                  value: ^(?i)\s*PermitUserEnvironment\s+(\w+)$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
              behaviors:
                max_depth: '-1'
                recurse_direction: down
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: subexpression
          operation: pattern match
          value: ^(no|"no")$
          datatype: string
  evaluate:
    check: permituserenvironment-option-not-set-yes-in-etc-ssh-sshd-config
