assessment:
  id: SV-257845.automated
  version: 1
  assessment_title: RHEL-09-231020 - RHEL 9 must use a separate file system for /var.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    there-separate-file-system-var:
      test_title: There is a separate file system for /var.
      capability: linux.partition
      collect:
        object_title: null
        capability: linux.partition
        select:
          mount_point:
            operation: equals
            datatype: string
            mask: false
            value: /var
      assert:
        existence: all_exist
        check: all
        state: null
    there-separate-file-system-configured-var:
      test_title: There is a separate file system configured for /var.
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/fstab
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^[^# \t]+\s+/var\s+
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: all_exist
        check: all
        state: null
  evaluate:
    all:
    - check: there-separate-file-system-var
    - check: there-separate-file-system-configured-var
