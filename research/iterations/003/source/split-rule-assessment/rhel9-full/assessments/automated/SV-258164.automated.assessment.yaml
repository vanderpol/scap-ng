assessment:
  id: SV-258164.automated
  version: 1
  assessment_title: RHEL-09-653075 - RHEL 9 audit system must audit local events.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    etc-audit-auditd-conf-local-events-yes:
      test_title: '/etc/audit/auditd.conf: local_events = yes'
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath: /etc/audit/auditd.conf
          pattern:
            operation: pattern match
            value: (?i)^\s*local_events\s*=\s*(\w+)\s*(?:#.*)?$
          instance:
            operation: greater than or equal
            datatype: int
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: subexpression
          operation: pattern match
          value: (?i)^yes$
          datatype: string
        state_capability: independent.textfilecontent54
  evaluate:
    check: etc-audit-auditd-conf-local-events-yes
