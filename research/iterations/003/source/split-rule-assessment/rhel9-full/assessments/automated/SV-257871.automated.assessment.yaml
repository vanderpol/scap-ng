assessment:
  id: SV-257871.automated
  version: 1
  assessment_title: RHEL-09-231150 - RHEL 9 must mount /var/log with the noexec option.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    var-log-mounted-noexec-option:
      test_title: /var/log is mounted with the noexec option
      collect:
        object_title: null
        capability: linux.partition
        select:
          mount_point: /var/log
      assert:
        state_title: null
        existence: at_least_one_exists
        check: all
        state:
          field: mount_options
          operation: equals
          value: noexec
          entity_check: at least one
    var-log-configured-noexec-option-in-etc-fstab:
      test_title: /var/log is configured with the noexec option in /etc/fstab
      collect:
        object_title: null
        capability: independent.variable
        select:
          var_ref:
            variable: mount-options-var-log-in-etc-fstab
      assert:
        state_title: null
        existence: at_least_one_exists
        check: all
        state:
          field: value
          operation: equals
          value: noexec
          entity_check: at least one
    var-log-configured-in-etc-fstab:
      test_title: /var/log is configured in /etc/fstab
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath: /etc/fstab
          pattern:
            operation: pattern match
            value: ^\s*[^#\s]+\s+/var/log\s+\S+\s+(\S+)\s+\S+\s+\S+\s*$
          instance:
            datatype: int
            value: '1'
      assert:
        state_title: null
        existence: at_least_one_exists
        check: all
        state: null
  evaluate:
    all:
    - check: var-log-mounted-noexec-option
    - check: var-log-configured-noexec-option-in-etc-fstab
    - check: var-log-configured-in-etc-fstab
  variables:
    mount-options-var-log-in-etc-fstab:
      title: Mount options for /var/log in /etc/fstab
      datatype: string
      kind: local
      expression:
        split:
          value:
            object_values:
              collect:
                object_title: null
                capability: independent.textfilecontent54
                select:
                  filepath: /etc/fstab
                  pattern:
                    operation: pattern match
                    value: ^\s*[^#\s]+\s+/var/log\s+\S+\s+(\S+)\s+\S+\s+\S+\s*$
                  instance:
                    datatype: int
                    value: '1'
              field: subexpression
          delimiter: ','
