assessment:
  id: SV-257992.automated
  version: 1
  assessment_title: RHEL-09-255080 - RHEL 9 must not allow a noncertificate trusted host SSH logon to
    the system.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    hostbasedauthentication-option-not-set-yes-in-etc-ssh-sshd-config:
      test_title: HostbasedAuthentication option is not set to yes in /etc/ssh/sshd_config and /etc/ssh/sshd_config.d/*.conf.
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                filepath: /etc/ssh/sshd_config
                pattern:
                  operation: pattern match
                  value: ^(?i)\s*HostbasedAuthentication\s+(\w+)$
                instance:
                  datatype: int
                  value: '1'
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                path: /etc/ssh/sshd_config.d
                filename:
                  operation: pattern match
                  value: ^.+\.conf$
                pattern:
                  operation: pattern match
                  value: ^(?i)\s*HostbasedAuthentication\s+(\w+)$
                instance:
                  datatype: int
                  value: '1'
              behaviors:
                max_depth: '-1'
                recurse_direction: down
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: subexpression
          operation: pattern match
          value: ^(no|"no")$
          datatype: string
        state_capability: independent.textfilecontent54
  evaluate:
    check: hostbasedauthentication-option-not-set-yes-in-etc-ssh-sshd-config
