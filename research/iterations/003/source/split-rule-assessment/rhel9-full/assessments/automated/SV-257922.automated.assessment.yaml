assessment:
  id: SV-257922.automated
  version: 13
  assessment_title: RHEL 9 library directories must be owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    system-library-directories-owned-by-root:
      test_title: System Library directories are owned by root.
      collect:
        object_title: All system-wide Library directories not owned by root
        capability: unix.file
        select:
          path:
            variable_check: only one
            value:
              variable: system-wide-shared-library-files-directories
          filename:
            nil: true
            value: ''
        filters:
        - action: exclude
          match:
            field: type
            operation: equals
            value: symbolic link
          state_title: symbolic links
        - action: exclude
          match:
            field: user_id
            operation: equals
            value: '0'
            datatype: int
          state_title: owned by root
        - action: exclude
          match:
            field: type
            operation: equals
            value: file
        behaviors:
          recurse_direction: down
      assert:
        existence: none_exist
        check: all
        state: null
  evaluate:
    check: system-library-directories-owned-by-root
  variables:
    system-wide-shared-library-files-directories:
      title: system-wide shared library files directories
      datatype: string
      kind: constant
      expression:
        literal:
        - /lib
        - /lib64
        - /usr/lib
        - /usr/lib64
