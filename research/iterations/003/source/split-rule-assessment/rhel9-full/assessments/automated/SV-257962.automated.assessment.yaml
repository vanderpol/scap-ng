assessment:
  id: SV-257962.automated
  version: 2
  assessment_title: RHEL-09-253035 - RHEL 9 must use reverse path filtering on all IPv4 interfaces.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    net-ipv4-conf-all-rp-filter-setting-in-kernel-set:
      test_title: net.ipv4.conf.all.rp_filter setting in kernel is set to 1
      capability: unix.sysctl
      collect:
        object_title: null
        capability: unix.sysctl
        select:
          name:
            operation: equals
            datatype: string
            mask: false
            value: net.ipv4.conf.all.rp_filter
      assert:
        existence: all_exist
        check: all
        state:
          field: value
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_capability: unix.sysctl
  evaluate:
    check: net-ipv4-conf-all-rp-filter-setting-in-kernel-set
