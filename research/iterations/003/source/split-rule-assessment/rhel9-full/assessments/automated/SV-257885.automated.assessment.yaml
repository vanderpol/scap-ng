assessment:
  id: SV-257885.automated
  version: 1
  assessment_title: RHEL-09-232025 - RHEL 9 /var/log directory must have mode 0755 or less permissive.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    var-log-directory-has-mode-0755-or-less-permissive:
      test_title: /var/log directory has mode 0755 or less permissive.
      capability: unix.file
      collect:
        object_title: null
        capability: unix.file
        select:
          path:
            operation: equals
            datatype: string
            mask: false
            value: /var/log
          filename:
            operation: equals
            datatype: string
            mask: false
            nil: true
            value: ''
      assert:
        existence: at_least_one_exists
        check: all
        state_title: mode 0755 or less permissive
        state_capability: unix.file
        state:
          all:
          - field: suid
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: sgid
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: sticky
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: gwrite
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: owrite
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    check: var-log-directory-has-mode-0755-or-less-permissive
