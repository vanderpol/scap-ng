assessment:
  id: SV-258112.automated
  version: 4
  assessment_title: RHEL-09-611115 - RHEL 9 must require the change of at least eight characters when
    passwords are changed.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    at-least-8-characters-change-when-passwords-changed:
      test_title: at least 8 characters must change when passwords are changed
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                filepath:
                  operation: equals
                  datatype: string
                  mask: false
                  value: /etc/security/pwquality.conf
                pattern:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: ^\s*difok\s*=\s*(-?\d*)\s*(?:#.*)?$
                instance:
                  operation: greater than or equal
                  datatype: int
                  mask: false
                  value: '1'
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                path:
                  operation: equals
                  datatype: string
                  mask: false
                  value: /etc/security/pwquality.conf.d
                filename:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: \.conf$
                pattern:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: ^\s*difok\s*=\s*(-?\d*)\s*(?:#.*)?$
                instance:
                  operation: greater than or equal
                  datatype: int
                  mask: false
                  value: '1'
              behaviors:
                recurse_direction: down
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: subexpression
          value: '8'
          operation: greater than or equal
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_capability: independent.textfilecontent54
  evaluate:
    check: at-least-8-characters-change-when-passwords-changed
