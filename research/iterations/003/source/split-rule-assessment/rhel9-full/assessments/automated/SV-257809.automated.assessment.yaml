assessment:
  id: SV-257809.automated
  version: 2
  assessment_title: RHEL-09-213070 - RHEL 9 must implement address space layout randomization (ASLR) to
    protect its memory from unauthorized code execution.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    kernel-randomize-va-space-setting-in-kernel-set-2:
      test_title: kernel.randomize_va_space setting in kernel is set to 2
      collect:
        object_title: null
        capability: unix.sysctl
        select:
          name: kernel.randomize_va_space
      assert:
        existence: all_exist
        check: all
        state:
          field: value
          operation: equals
          value: '2'
          datatype: int
  evaluate:
    check: kernel-randomize-va-space-setting-in-kernel-set-2
