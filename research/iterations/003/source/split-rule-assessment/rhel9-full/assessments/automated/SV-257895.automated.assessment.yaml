assessment:
  id: SV-257895.automated
  version: 1
  assessment_title: RHEL-09-232075 - RHEL 9 /etc/passwd file must have mode 0644 or less permissive to
    prevent unauthorized access.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    etc-passwd-file-has-mode-0644-or-less-permissive:
      test_title: The /etc/passwd file has mode 0644 or less permissive.
      collect:
        object_title: null
        capability: unix.file
        select:
          filepath: /etc/passwd
      assert:
        state_title: File permissions is 644 or more restrictive
        existence: at_least_one_exists
        check: all
        state:
          all:
          - field: suid
            operation: equals
            value: 'false'
            datatype: boolean
          - field: sgid
            operation: equals
            value: 'false'
            datatype: boolean
          - field: sticky
            operation: equals
            value: 'false'
            datatype: boolean
          - field: uexec
            operation: equals
            value: 'false'
            datatype: boolean
          - field: gwrite
            operation: equals
            value: 'false'
            datatype: boolean
          - field: gexec
            operation: equals
            value: 'false'
            datatype: boolean
          - field: owrite
            operation: equals
            value: 'false'
            datatype: boolean
          - field: oexec
            operation: equals
            value: 'false'
            datatype: boolean
  evaluate:
    check: etc-passwd-file-has-mode-0644-or-less-permissive
