assessment:
  id: SV-257872.automated
  version: 1
  assessment_title: RHEL-09-231155 - RHEL 9 must mount /var/log with the nosuid option.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    var-log-mounted-nosuid-option:
      test_title: /var/log is mounted with the nosuid option
      capability: linux.partition
      collect:
        object_title: null
        capability: linux.partition
        select:
          mount_point:
            operation: equals
            datatype: string
            mask: false
            value: /var/log
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: mount_options
          value: nosuid
          operation: equals
          datatype: string
          mask: false
          entity_check: at least one
          entity_existence: at_least_one_exists
        state_capability: linux.partition
    var-log-configured-nosuid-option-in-etc-fstab:
      test_title: /var/log is configured with the nosuid option in /etc/fstab
      capability: independent.variable
      collect:
        object_title: null
        capability: independent.variable
        select:
          var_ref:
            operation: equals
            datatype: string
            mask: false
            value:
              variable: mount-options-var-log-in-etc-fstab
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: value
          value: nosuid
          operation: equals
          datatype: string
          mask: false
          entity_check: at least one
          entity_existence: at_least_one_exists
        state_capability: independent.variable
    var-log-configured-in-etc-fstab:
      test_title: /var/log is configured in /etc/fstab
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/fstab
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^\s*[^#\s]+\s+/var/log\s+\S+\s+(\S+)\s+\S+\s+\S+\s*$
          instance:
            operation: equals
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state: null
  evaluate:
    all:
    - check: var-log-mounted-nosuid-option
    - check: var-log-configured-nosuid-option-in-etc-fstab
    - check: var-log-configured-in-etc-fstab
  variables:
    mount-options-var-log-in-etc-fstab:
      title: Mount options for /var/log in /etc/fstab
      datatype: string
      kind: local
      expression:
        split:
          value:
            object_values:
              collect:
                object_title: null
                capability: independent.textfilecontent54
                select:
                  filepath:
                    operation: equals
                    datatype: string
                    mask: false
                    value: /etc/fstab
                  pattern:
                    operation: pattern match
                    datatype: string
                    mask: false
                    value: ^\s*[^#\s]+\s+/var/log\s+\S+\s+(\S+)\s+\S+\s+\S+\s*$
                  instance:
                    operation: equals
                    datatype: int
                    mask: false
                    value: '1'
              field: subexpression
          delimiter: ','
