assessment:
  id: SV-258223.automated
  version: 2
  assessment_title: RHEL-09-654245 - RHEL 9 must generate audit records for all account creations, modifications,
    disabling, and termination events that affect /etc/shadow.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    audit-32-bit-invocations-etc-shadow:
      test_title: Audit 32-bit invocations of /etc/shadow
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath: /etc/audit/audit.rules
          pattern:
            operation: pattern match
            value: ^\s*-a\s+(always,exit|exit,always)\s+-F\s+arch=b32?\s+-F\s+path=/etc/shadow\s+-F\s*perm=([rx]*w[rx]*a[rx]*|[rx]*a[rx]*w[rx]*)(\s+(-k\s+|-F\s+key=)\S+)?\s*$
          instance:
            operation: greater than or equal
            datatype: int
            value: '1'
      assert:
        state_title: null
        existence: all_exist
        check: all
        state: null
    audit-64-bit-invocations-etc-shadow:
      test_title: Audit 64-bit invocations of /etc/shadow
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath: /etc/audit/audit.rules
          pattern:
            operation: pattern match
            value: ^\s*-a\s+(always,exit|exit,always)\s+-F\s+arch=b64?\s+-F\s+path=/etc/shadow\s+-F\s*perm=([rx]*w[rx]*a[rx]*|[rx]*a[rx]*w[rx]*)(\s+(-k\s+|-F\s+key=)\S+)?\s*$
          instance:
            operation: greater than or equal
            datatype: int
            value: '1'
      assert:
        state_title: null
        existence: all_exist
        check: all
        state: null
  evaluate:
    all:
    - check: audit-32-bit-invocations-etc-shadow
    - check: audit-64-bit-invocations-etc-shadow
