assessment:
  id: SV-257786.automated
  version: 1
  assessment_title: RHEL-09-211055 - RHEL 9 debug-shell systemd service must be disabled.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    debug-shell-service-loadstate-masked-if-it-exists:
      test_title: debug-shell.service LoadState is masked if it exists.
      capability: linux.systemdunitproperty
      collect:
        object_title: null
        capability: linux.systemdunitproperty
        select:
          unit:
            operation: equals
            datatype: string
            mask: false
            value: debug-shell.service
          property:
            operation: equals
            datatype: string
            mask: false
            value: LoadState
      assert:
        existence: any_exist
        check: all
        state_title: null
        state_capability: linux.systemdunitproperty
        state:
          field: value
          value: masked
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    debug-shell-service-unitfilestate-masked-if-it-exists:
      test_title: debug-shell.service UnitFileState is masked if it exists.
      capability: linux.systemdunitproperty
      collect:
        object_title: null
        capability: linux.systemdunitproperty
        select:
          unit:
            operation: equals
            datatype: string
            mask: false
            value: debug-shell.service
          property:
            operation: equals
            datatype: string
            mask: false
            value: UnitFileState
      assert:
        existence: any_exist
        check: all
        state_title: null
        state_capability: linux.systemdunitproperty
        state:
          field: value
          value: masked
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - check: debug-shell-service-loadstate-masked-if-it-exists
    - check: debug-shell-service-unitfilestate-masked-if-it-exists
