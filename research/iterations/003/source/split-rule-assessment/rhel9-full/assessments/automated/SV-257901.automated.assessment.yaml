assessment:
  id: SV-257901.automated
  version: 1
  assessment_title: RHEL-09-232105 - RHEL 9 /etc/group- file must be group-owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    etc-group-file-group-owned-by-root:
      test_title: The /etc/group- file is group-owned by root.
      collect:
        object_title: null
        capability: unix.file
        select:
          filepath: /etc/group-
      assert:
        state_title: group-owned by root
        existence: at_least_one_exists
        check: all
        state:
          field: group_id
          operation: equals
          value: '0'
          datatype: int
  evaluate:
    check: etc-group-file-group-owned-by-root
