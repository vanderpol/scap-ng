assessment:
  id: SV-257957.automated
  version: 3
  assessment_title: RHEL-09-253010 - RHEL 9 must be configured to use TCP syncookies.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    net-ipv4-tcp-syncookies-setting-in-kernel-set-1:
      test_title: net.ipv4.tcp_syncookies setting in kernel is set to 1
      capability: unix.sysctl
      collect:
        object_title: null
        capability: unix.sysctl
        select:
          name:
            operation: equals
            datatype: string
            mask: false
            value: net.ipv4.tcp_syncookies
      assert:
        existence: all_exist
        check: all
        state:
          field: value
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_capability: unix.sysctl
  evaluate:
    check: net-ipv4-tcp-syncookies-setting-in-kernel-set-1
