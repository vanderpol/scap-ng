assessment:
  id: SV-257835.automated
  version: 2
  assessment_title: RHEL-09-215060 - The Trivial File Transfer Protocol (TFTP) server must not be installed
    unless it is required, and if required, the RHEL 9 TFTP daemon must be configured to operate in secure
    mode.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    usr-lib-systemd-system-tftp-service-execstart-has-s-option:
      test_title: '/usr/lib/systemd/system/tftp.service: ExecStart has a -s option with a subdirectory
        assigned'
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /usr/lib/systemd/system/tftp.service
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^ExecStart[ \t]*=[ \t]*\/usr\/sbin\/in\.tftpd[ \t]*-s[ \t]+/\S+[ \t]*$
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state: null
  evaluate:
    check: usr-lib-systemd-system-tftp-service-execstart-has-s-option
