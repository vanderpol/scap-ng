assessment:
  id: SV-258170.automated
  version: 1
  assessment_title: RHEL-09-653105 - RHEL 9 must write audit records to disk.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    etc-audit-auditd-conf-write-logs-yes:
      test_title: '/etc/audit/auditd.conf: write_logs = yes'
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath: /etc/audit/auditd.conf
          pattern:
            operation: pattern match
            value: (?i)^\s*write_logs\s*=\s*(\w+)\s*(?:#.*)?$
          instance:
            operation: greater than or equal
            value: '1'
      assert:
        state_title: null
        existence: at_least_one_exists
        check: all
        state:
          field: subexpression
          operation: pattern match
          value: (?i)^yes$
          datatype: string
  evaluate:
    check: etc-audit-auditd-conf-write-logs-yes
