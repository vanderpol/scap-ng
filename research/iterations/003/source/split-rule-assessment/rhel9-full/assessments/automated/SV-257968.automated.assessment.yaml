assessment:
  id: SV-257968.automated
  version: 2
  assessment_title: RHEL-09-253065 - RHEL 9 must not send Internet Control Message Protocol (ICMP) redirects.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    net-ipv4-conf-all-send-redirects-setting-in-kernel-set:
      test_title: net.ipv4.conf.all.send_redirects setting in kernel is set to 0
      collect:
        object_title: null
        capability: unix.sysctl
        select:
          name: net.ipv4.conf.all.send_redirects
      assert:
        existence: all_exist
        check: all
        state:
          field: value
          operation: equals
          value: '0'
          datatype: int
  evaluate:
    check: net-ipv4-conf-all-send-redirects-setting-in-kernel-set
