assessment:
  id: SV-258101.automated
  version: 1
  assessment_title: RHEL-09-611060 - RHEL 9 must enforce password complexity rules for the root account.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    password-complexity-rules-enforced-root-account:
      test_title: Password complexity rules are enforced for the root account
      collect:
        object_title: null
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                filepath: /etc/security/pwquality.conf
                pattern:
                  operation: pattern match
                  value: ^\s*enforce_for_root\s*(?:#.*)?$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                path: /etc/security/pwquality.conf.d
                filename:
                  operation: pattern match
                  value: \.conf$
                pattern:
                  operation: pattern match
                  value: ^\s*enforce_for_root\s*(?:#.*)?$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
              behaviors:
                recurse_direction: down
      assert:
        existence: at_least_one_exists
        check: all
        state: null
  evaluate:
    check: password-complexity-rules-enforced-root-account
