assessment:
  id: SV-257892.automated
  version: 1
  assessment_title: RHEL-09-232060 - RHEL 9 /etc/group- file must have mode 0644 or less permissive to
    prevent unauthorized access.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    etc-group-file-has-mode-0644-or-less-permissive:
      test_title: The /etc/group- file has mode 0644 or less permissive
      collect:
        object_title: null
        capability: unix.file
        select:
          filepath: /etc/group-
      assert:
        state_title: File permissions is 644 or more restrictive
        existence: any_exist
        check: all
        state:
          all:
          - field: suid
            operation: equals
            value: 'false'
            datatype: boolean
          - field: sgid
            operation: equals
            value: 'false'
            datatype: boolean
          - field: sticky
            operation: equals
            value: 'false'
            datatype: boolean
          - field: uexec
            operation: equals
            value: 'false'
            datatype: boolean
          - field: gwrite
            operation: equals
            value: 'false'
            datatype: boolean
          - field: gexec
            operation: equals
            value: 'false'
            datatype: boolean
          - field: owrite
            operation: equals
            value: 'false'
            datatype: boolean
          - field: oexec
            operation: equals
            value: 'false'
            datatype: boolean
  evaluate:
    check: etc-group-file-has-mode-0644-or-less-permissive
