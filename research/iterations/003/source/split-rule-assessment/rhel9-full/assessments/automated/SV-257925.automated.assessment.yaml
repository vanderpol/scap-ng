assessment:
  id: SV-257925.automated
  version: 1
  assessment_title: RHEL-09-232225 - RHEL 9 audit tools must be group-owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    audit-tools-group-owned-by-root:
      test_title: The audit tools are group-owned by root.
      collect:
        object_title: audit tools
        capability: unix.file
        select:
          filepath:
            variable_check: at least one
            datatype: string
            value:
              variable: audit-tools
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: group_id
          operation: equals
          value: '0'
          datatype: int
        state_title: group-owned by root
  evaluate:
    check: audit-tools-group-owned-by-root
  variables:
    audit-tools:
      title: audit tools
      datatype: string
      kind: constant
      expression:
        literal:
        - /sbin/auditctl
        - /sbin/aureport
        - /sbin/ausearch
        - /sbin/autrace
        - /sbin/auditd
        - /sbin/rsyslogd
        - /sbin/augenrules
