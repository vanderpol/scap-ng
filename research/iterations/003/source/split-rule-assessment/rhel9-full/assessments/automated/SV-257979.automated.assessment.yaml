assessment:
  id: SV-257979.automated
  version: 2
  assessment_title: RHEL-09-255015 - All RHEL 9 networked systems must have and implement SSH to protect
    the confidentiality and integrity of transmitted and received information, as well as information
    during preparation for transmission.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    check-if-ssh-in-active-state:
      test_title: Check if SSH is in 'active' state
      capability: linux.systemdunitproperty
      collect:
        object_title: sshd.service ActiveState
        capability: linux.systemdunitproperty
        select:
          unit:
            operation: equals
            datatype: string
            mask: false
            value: sshd.service
          property:
            operation: equals
            datatype: string
            mask: false
            value: ActiveState
      assert:
        existence: at_least_one_exists
        check: all
        state_title: null
        state_capability: linux.systemdunitproperty
        state:
          field: value
          value: active
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    check: check-if-ssh-in-active-state
