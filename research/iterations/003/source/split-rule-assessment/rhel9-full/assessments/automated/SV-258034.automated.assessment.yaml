assessment:
  id: SV-258034.automated
  version: 1
  assessment_title: RHEL-09-291010 - RHEL 9 must be configured to disable USB mass storage.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    etc-modprobe-d-contains-file-that-contains-install-usb-storage:
      test_title: /etc/modprobe.d contains a file that contains 'install usb-storage /bin/false'
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          path: /etc/modprobe.d
          filename:
            operation: pattern match
            value: .*
          pattern:
            operation: pattern match
            value: ^[ \t]*install[ \t]+usb-storage[ \t]+/bin/false[ \t]*$
          instance:
            operation: greater than or equal
            value: '1'
      assert:
        state_title: null
        existence: at_least_one_exists
        check: all
        state: null
    etc-modprobe-d-contains-file-that-contains-blacklist-usb-storage:
      test_title: /etc/modprobe.d contains a file that contains 'blacklist usb-storage'
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          path: /etc/modprobe.d
          filename:
            operation: pattern match
            value: .*
          pattern:
            operation: pattern match
            value: ^[ \t]*blacklist[ \t]+usb-storage[ \t]*$
          instance:
            operation: greater than or equal
            value: '1'
      assert:
        state_title: null
        existence: at_least_one_exists
        check: all
        state: null
  evaluate:
    all:
    - check: etc-modprobe-d-contains-file-that-contains-install-usb-storage
    - check: etc-modprobe-d-contains-file-that-contains-blacklist-usb-storage
