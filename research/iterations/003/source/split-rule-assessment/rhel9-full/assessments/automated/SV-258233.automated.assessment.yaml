assessment:
  id: SV-258233.automated
  version: 1
  assessment_title: RHEL-09-671025 - RHEL 9 pam_unix.so module must be configured in the password-auth
    file to use a FIPS 140-3 approved cryptographic hashing algorithm for system authentication.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    etc-pam-d-password-auth-password-includes-pam-unix-so:
      test_title: /etc/pam.d/password-auth:password includes pam_unix.so sha512
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          path: /etc/pam.d
          filename: password-auth
          pattern:
            operation: pattern match
            value: ^[ \t]*password[ \t]+sufficient[ \t]+pam_unix\.so(?:[ \t]+|(?:[ \t][^#\r\f\n]+[ \t]))sha512(?:[
              \t]|$)
          instance:
            operation: greater than or equal
            value: '1'
      assert:
        state_title: null
        existence: only_one_exists
        check: all
        state: null
  evaluate:
    check: etc-pam-d-password-auth-password-includes-pam-unix-so
