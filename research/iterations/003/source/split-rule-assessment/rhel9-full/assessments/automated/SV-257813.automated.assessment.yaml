assessment:
  id: SV-257813.automated
  version: 1
  assessment_title: RHEL-09-213090 - RHEL 9 must disable storing core dumps.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    usr-systemd-coredump-conf-storage-set-none:
      test_title: /usr/systemd/coredump.conf:Storage is set to none.
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath: /etc/systemd/coredump.conf
          pattern:
            operation: pattern match
            value: ^\s*Storage\s*=\s*(\w*)\s*(?:#.*)?$
          instance:
            operation: greater than or equal
            datatype: int
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: subexpression
          operation: equals
          value: none
          datatype: string
  evaluate:
    check: usr-systemd-coredump-conf-storage-set-none
