assessment:
  id: SV-257783.automated
  version: 1
  assessment_title: RHEL-09-211040 - RHEL 9 systemd-journald service must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    systemd-journald-service-active:
      test_title: The systemd-journald service is active.
      collect:
        object_title: null
        capability: linux.systemdunitproperty
        select:
          unit: systemd-journald.service
          property: ActiveState
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: value
          operation: equals
          value: active
  evaluate:
    check: systemd-journald-service-active
