assessment:
  id: SV-257783.automated
  version: 1
  assessment_title: RHEL-09-211040 - RHEL 9 systemd-journald service must be enabled.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    systemd-journald-service-active:
      test_title: The systemd-journald service is active.
      capability: linux.systemdunitproperty
      collect:
        object_title: null
        capability: linux.systemdunitproperty
        select:
          unit:
            operation: equals
            datatype: string
            mask: false
            value: systemd-journald.service
          property:
            operation: equals
            datatype: string
            mask: false
            value: ActiveState
      assert:
        existence: at_least_one_exists
        check: all
        state_title: null
        state_capability: linux.systemdunitproperty
        state:
          field: value
          value: active
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    check: systemd-journald-service-active
