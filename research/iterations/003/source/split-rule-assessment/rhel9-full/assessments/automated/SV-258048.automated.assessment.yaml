assessment:
  id: SV-258048.automated
  version: 13
  assessment_title: All RHEL 9 interactive users must have a primary group that exists.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    interactive-users-have-primary-group-that-exists:
      test_title: Interactive users must have a primary group that exists.
      capability: independent.shellcommand
      collect:
        object_title: Return any user who does not have a valid primary group
        capability: independent.shellcommand
        select:
          shell:
            operation: equals
            datatype: string
            mask: false
            value: bash
          command:
            operation: equals
            datatype: string
            mask: false
            value: pwck -r
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: no group
      assert:
        existence: at_least_one_exists
        check: all
        state_title: Confirm no users are reported that have an invalid primary group
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: ''
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: none_exist
  evaluate:
    check: interactive-users-have-primary-group-that-exists
