assessment:
  id: SV-257926.automated
  version: 1
  assessment_title: RHEL-09-232230 - RHEL 9 cron configuration files directory must be owned by root.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    etc-cron-files-owned-by-root:
      test_title: /etc/cron* files owned by root
      capability: unix.file
      collect:
        object_title: /etc/cron* files
        capability: unix.file
        select:
          path:
            operation: equals
            datatype: string
            mask: false
            value: /etc
          filename:
            operation: pattern match
            datatype: string
            mask: false
            value: ^cron.*$
      assert:
        existence: any_exist
        check: all
        state_title: owned by root
        state_capability: unix.file
        state:
          field: user_id
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    etc-cron-directories-owned-by-root:
      test_title: /etc/cron* directories owned by root
      capability: unix.file
      collect:
        object_title: /etc/cron* directories
        capability: unix.file
        select:
          path:
            operation: pattern match
            datatype: string
            mask: false
            value: ^/etc/cron.*$
          filename:
            operation: equals
            datatype: string
            mask: false
            nil: true
            value: ''
      assert:
        existence: any_exist
        check: all
        state_title: owned by root
        state_capability: unix.file
        state:
          field: user_id
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - check: etc-cron-files-owned-by-root
    - check: etc-cron-directories-owned-by-root
