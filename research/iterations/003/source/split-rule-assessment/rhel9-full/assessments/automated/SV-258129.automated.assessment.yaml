assessment:
  id: SV-258129.automated
  version: 2
  assessment_title: RHEL-09-611200 - RHEL 9 must require authentication to access single-user mode.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    usr-lib-systemd-system-rescue-service-execstart-set-usr-lib:
      test_title: /usr/lib/systemd/system/rescue.service:ExecStart is set to -/usr/lib/systemd/systemd-sulogin-shell
        rescue
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          path:
            operation: equals
            value: /usr/lib/systemd/system
          filename:
            operation: equals
            value: rescue.service
          pattern:
            operation: pattern match
            value: ^\s*ExecStart=-\/usr\/lib\/systemd\/systemd-sulogin-shell\srescue$
          instance:
            operation: greater than or equal
            value: '1'
      assert:
        state_title: null
        existence: at_least_one_exists
        check: all
        state: null
    etc-systemd-system-rescue-service-d-conf-execstart-set-usr:
      test_title: /etc/systemd/system/rescue.service.d/*.conf:ExecStart is set to -/usr/lib/systemd/systemd-sulogin-shell
        rescue
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          path:
            operation: equals
            value: /etc/systemd/system/rescue.service.d
          filename:
            operation: pattern match
            value: ^.+\.conf$
          pattern:
            operation: pattern match
            value: ^\s*ExecStart=-\/usr\/lib\/systemd\/systemd-sulogin-shell\srescue$
          instance:
            operation: greater than or equal
            value: '1'
      assert:
        state_title: null
        existence: at_least_one_exists
        check: all
        state: null
  evaluate:
    any:
    - check: usr-lib-systemd-system-rescue-service-execstart-set-usr-lib
    - check: etc-systemd-system-rescue-service-d-conf-execstart-set-usr
