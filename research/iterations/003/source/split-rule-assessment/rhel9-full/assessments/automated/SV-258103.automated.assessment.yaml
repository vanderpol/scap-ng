assessment:
  id: SV-258103.automated
  version: 1
  assessment_title: RHEL-09-611070 - RHEL 9 must enforce password complexity by requiring that at least
    one numeric character be used.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    at-least-one-numeric-character-required:
      test_title: at least one numeric character is required
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                filepath:
                  operation: equals
                  datatype: string
                  mask: false
                  value: /etc/security/pwquality.conf
                pattern:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: ^\s*dcredit\s*=\s*(-?\d*)\s*(?:#.*)?$
                instance:
                  operation: greater than or equal
                  datatype: int
                  mask: false
                  value: '1'
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                path:
                  operation: equals
                  datatype: string
                  mask: false
                  value: /etc/security/pwquality.conf.d
                filename:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: \.conf$
                pattern:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: ^\s*dcredit\s*=\s*(-?\d*)\s*(?:#.*)?$
                instance:
                  operation: greater than or equal
                  datatype: int
                  mask: false
                  value: '1'
              behaviors:
                recurse_direction: down
      assert:
        existence: at_least_one_exists
        check: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: '0'
          operation: less than
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    check: at-least-one-numeric-character-required
