assessment:
  id: SV-258103.automated
  version: 1
  assessment_title: RHEL-09-611070 - RHEL 9 must enforce password complexity by requiring that at least
    one numeric character be used.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    at-least-one-numeric-character-required:
      test_title: at least one numeric character is required
      collect:
        object_title: null
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                filepath: /etc/security/pwquality.conf
                pattern:
                  operation: pattern match
                  value: ^\s*dcredit\s*=\s*(-?\d*)\s*(?:#.*)?$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                path: /etc/security/pwquality.conf.d
                filename:
                  operation: pattern match
                  value: \.conf$
                pattern:
                  operation: pattern match
                  value: ^\s*dcredit\s*=\s*(-?\d*)\s*(?:#.*)?$
                instance:
                  operation: greater than or equal
                  datatype: int
                  value: '1'
              behaviors:
                recurse_direction: down
      assert:
        state_title: null
        existence: at_least_one_exists
        check: all
        state:
          field: subexpression
          operation: less than
          value: '0'
          datatype: int
  evaluate:
    check: at-least-one-numeric-character-required
