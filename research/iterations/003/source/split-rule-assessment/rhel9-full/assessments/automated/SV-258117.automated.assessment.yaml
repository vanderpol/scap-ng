assessment:
  id: SV-258117.automated
  version: 1
  assessment_title: RHEL-09-611140 - RHEL 9 must be configured to use the shadow file to store only encrypted
    representations of passwords.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    etc-login-defs-encrypt-method-sha512:
      test_title: /etc/login.defs:ENCRYPT_METHOD >= SHA512
      capability: independent.textfilecontent54
      collect:
        object_title: /etc/login.defs:ENCRYPT_METHOD
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/login.defs
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^\s*ENCRYPT_METHOD\s+([^#\r\n]*)
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: SHA512
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    check: etc-login-defs-encrypt-method-sha512
