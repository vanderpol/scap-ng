assessment:
  id: SV-257972.automated
  version: 2
  assessment_title: RHEL-09-254015 - RHEL 9 must ignore IPv6 Internet Control Message Protocol (ICMP)
    redirect messages.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    net-ipv6-conf-all-accept-redirects-setting-in-kernel-set:
      test_title: net.ipv6.conf.all.accept_redirects setting in kernel is set to 0
      collect:
        object_title: null
        capability: unix.sysctl
        select:
          name: net.ipv6.conf.all.accept_redirects
      assert:
        existence: all_exist
        check: all
        state:
          field: value
          operation: equals
          value: '0'
          datatype: int
  evaluate:
    check: net-ipv6-conf-all-accept-redirects-setting-in-kernel-set
