assessment:
  id: SV-257883.automated
  version: 13
  assessment_title: RHEL 9 library directories must have mode 755 or less permissive.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    system-library-directories-have-mode-755-or-less-permissive-gwrite:
      test_title: System Library directories have mode 755 or less permissive.(gwrite should be = false.)
      capability: unix.file
      collect:
        object_title: All system-wide Library Directories have 755 or better (gwrite should be = false.)
        capability: unix.file
        select:
          path:
            operation: equals
            datatype: string
            mask: false
            variable_check: only one
            value:
              variable: system-wide-shared-library-files-directories
          filename:
            operation: equals
            datatype: string
            mask: false
            nil: true
            value: ''
        filters:
        - action: exclude
          match:
            field: gwrite
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: Mode 755 or less permissive (gwrite should be = false.)
          capability: unix.file
        - action: exclude
          match:
            field: type
            value: symbolic link
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: symbolic links
          capability: unix.file
        - action: exclude
          match:
            field: type
            value: file
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          capability: unix.file
        behaviors:
          recurse_direction: down
      assert:
        existence: none_exist
        check: all
        state: null
    system-library-directories-have-mode-755-or-less-permissive-owrite:
      test_title: System Library directories have mode 755 or less permissive (owrite should be = false.)
      capability: unix.file
      collect:
        object_title: All system-wide Library Directories have 755 or better (owrite should be = false.)
        capability: unix.file
        select:
          path:
            operation: equals
            datatype: string
            mask: false
            variable_check: only one
            value:
              variable: system-wide-shared-library-files-directories
          filename:
            operation: equals
            datatype: string
            mask: false
            nil: true
            value: ''
        filters:
        - action: exclude
          match:
            field: owrite
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: Mode 755 or less permissive (owrite should be = false.)
          capability: unix.file
        - action: exclude
          match:
            field: type
            value: symbolic link
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: symbolic links
          capability: unix.file
        - action: exclude
          match:
            field: type
            value: file
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          capability: unix.file
        behaviors:
          recurse_direction: down
      assert:
        existence: none_exist
        check: all
        state: null
  evaluate:
    all:
    - check: system-library-directories-have-mode-755-or-less-permissive-gwrite
    - check: system-library-directories-have-mode-755-or-less-permissive-owrite
  variables:
    system-wide-shared-library-files-directories:
      title: system-wide shared library files directories
      kind: constant
      datatype: string
      expression:
        literal:
        - /lib
        - /lib64
        - /usr/lib
        - /usr/lib64
