assessment:
  id: SV-258167.automated
  version: 1
  assessment_title: RHEL-09-653090 - RHEL 9 audit logs file must have mode 0600 or less permissive to
    prevent unauthorized access to the audit log.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    audit-log-mode-0600-or-less-permissive:
      test_title: Audit log is mode 0600 or less permissive
      collect:
        object_title: Audit log file location
        capability: unix.file
        select:
          filepath:
            variable: audit-log-location-from-etc-audit-auditd-conf
      assert:
        state_title: Mode 0600 or less permissive
        existence: at_least_one_exists
        check: all
        state:
          all:
          - field: suid
            operation: equals
            value: 'false'
            datatype: boolean
          - field: sgid
            operation: equals
            value: 'false'
            datatype: boolean
          - field: sticky
            operation: equals
            value: 'false'
            datatype: boolean
          - field: uexec
            operation: equals
            value: 'false'
            datatype: boolean
          - field: gread
            operation: equals
            value: 'false'
            datatype: boolean
          - field: gwrite
            operation: equals
            value: 'false'
            datatype: boolean
          - field: gexec
            operation: equals
            value: 'false'
            datatype: boolean
          - field: oread
            operation: equals
            value: 'false'
            datatype: boolean
          - field: owrite
            operation: equals
            value: 'false'
            datatype: boolean
          - field: oexec
            operation: equals
            value: 'false'
            datatype: boolean
  evaluate:
    check: audit-log-mode-0600-or-less-permissive
  variables:
    audit-log-location-from-etc-audit-auditd-conf:
      title: Audit log location from /etc/audit/auditd.conf
      datatype: string
      expression:
        object_values:
          collect:
            object_title: Audit log file
            capability: independent.textfilecontent54
            select:
              filepath: /etc/audit/auditd.conf
              pattern:
                operation: pattern match
                value: ^\s*log_file\s*=\s*(\S+)\s*(?:#.*)?$
              instance:
                operation: greater than or equal
                datatype: int
                value: '1'
          field: subexpression
