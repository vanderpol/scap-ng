assessment:
  id: SV-258167.automated
  version: 1
  assessment_title: RHEL-09-653090 - RHEL 9 audit logs file must have mode 0600 or less permissive to
    prevent unauthorized access to the audit log.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    audit-log-mode-0600-or-less-permissive:
      test_title: Audit log is mode 0600 or less permissive
      capability: unix.file
      collect:
        object_title: Audit log file location
        capability: unix.file
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            variable_check: all
            value:
              variable: audit-log-location-from-etc-audit-auditd-conf
      assert:
        existence: at_least_one_exists
        check: all
        state_title: Mode 0600 or less permissive
        state_capability: unix.file
        state:
          all:
          - field: suid
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: sgid
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: sticky
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: uexec
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: gread
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: gwrite
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: gexec
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: oread
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: owrite
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: oexec
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    check: audit-log-mode-0600-or-less-permissive
  variables:
    audit-log-location-from-etc-audit-auditd-conf:
      title: Audit log location from /etc/audit/auditd.conf
      kind: local
      datatype: string
      expression:
        object_values:
          collect:
            object_title: Audit log file
            capability: independent.textfilecontent54
            select:
              filepath:
                operation: equals
                datatype: string
                mask: false
                value: /etc/audit/auditd.conf
              pattern:
                operation: pattern match
                datatype: string
                mask: false
                value: ^\s*log_file\s*=\s*(\S+)\s*(?:#.*)?$
              instance:
                operation: greater than or equal
                datatype: int
                mask: false
                value: '1'
          field: subexpression
