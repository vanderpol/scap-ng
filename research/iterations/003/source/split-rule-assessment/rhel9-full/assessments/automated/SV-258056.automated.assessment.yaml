assessment:
  id: SV-258056.automated
  version: 2
  assessment_title: RHEL-09-411085 - RHEL 9 must automatically lock an account when three unsuccessful
    logon attempts occur during a 15-minute time period.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    etc-security-faillock-conf-fail-interval-900-0:
      test_title: /etc/security/faillock.conf:fail_interval <=900 and !=0
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/security/faillock.conf
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^\s*fail_interval\s*=\s*([\d]+)\s*$
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state: null
        state_operator: AND
        states:
        - state:
            field: subexpression
            value: '900'
            operation: less than or equal
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: null
          capability: independent.textfilecontent54
        - state:
            field: subexpression
            value: '0'
            operation: not equal
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: null
          capability: independent.textfilecontent54
  evaluate:
    check: etc-security-faillock-conf-fail-interval-900-0
