assessment:
  id: SV-258056.automated
  version: 2
  assessment_title: RHEL-09-411085 - RHEL 9 must automatically lock an account when three unsuccessful
    logon attempts occur during a 15-minute time period.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    etc-security-faillock-conf-fail-interval-900-0:
      test_title: /etc/security/faillock.conf:fail_interval <=900 and !=0
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath: /etc/security/faillock.conf
          pattern:
            operation: pattern match
            value: ^\s*fail_interval\s*=\s*([\d]+)\s*$
          instance:
            operation: greater than or equal
            value: '1'
      assert:
        state_title: null
        existence: at_least_one_exists
        check: all
        state:
          all:
          - field: subexpression
            operation: less than or equal
            value: '900'
            datatype: int
          - field: subexpression
            operation: not equal
            value: '0'
            datatype: int
  evaluate:
    check: etc-security-faillock-conf-fail-interval-900-0
