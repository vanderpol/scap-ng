assessment:
  id: SV-258137.automated
  version: 1
  assessment_title: RHEL-09-651025 - RHEL 9 must use cryptographic mechanisms to protect the integrity
    of audit tools.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    etc-aide-conf-has-selection-line-usr-sbin-auditctl:
      test_title: /etc/aide.conf has a selection line for /usr/sbin/auditctl.
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath: /etc/aide.conf
          pattern:
            operation: pattern match
            value: ^\s*/usr/sbin/auditctl\s+\S+
          instance:
            operation: greater than or equal
            datatype: int
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state: null
    etc-aide-conf-has-selection-line-usr-sbin-auditd:
