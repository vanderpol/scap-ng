assessment:
  id: SV-258025.automated
  version: 13
  assessment_title: RHEL 9 must initiate a session lock for graphical user interfaces when the screensaver
    is activated.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    verify-os-initiates-session-lock-graphical-user-interfaces-when-screensaver:
      test_title: Verify the OS initiates a session lock for graphical user interfaces when the screensaver
        is activated.
      capability: independent.shellcommand
      collect:
        object_title: Retrieve the gnome screensaver lock-delay setting.
        capability: independent.shellcommand
        select:
          shell:
            operation: equals
            datatype: string
            mask: false
            value: bash
          command:
            operation: equals
            datatype: string
            mask: false
            value: gsettings get org.gnome.desktop.screensaver lock-delay
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: uint32\s(\d+)$
      assert:
        existence: at_least_one_exists
        check: all
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: subexpression
            value: '5'
            operation: less than or equal
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        state_title: Confirm value is set to 5 or greater.
        state_capability: independent.shellcommand
  evaluate:
    check: verify-os-initiates-session-lock-graphical-user-interfaces-when-screensaver
