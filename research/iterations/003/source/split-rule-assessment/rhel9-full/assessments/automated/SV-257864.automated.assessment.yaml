assessment:
  id: SV-257864.automated
  version: 1
  assessment_title: RHEL-09-231115 - RHEL 9 must mount /dev/shm with the noexec option.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    if-dev-shm-mounted-it-mounted-noexec-option:
      test_title: If /dev/shm is mounted, it is mounted with the noexec option
      capability: linux.partition
      collect:
        object_title: null
        capability: linux.partition
        select:
          mount_point:
            operation: equals
            datatype: string
            mask: false
            value: /dev/shm
      assert:
        existence: any_exist
        check: all
        state_title: null
        state_capability: linux.partition
        state:
          field: mount_options
          value: noexec
          operation: equals
          datatype: string
          mask: false
          entity_check: at least one
          entity_existence: at_least_one_exists
    if-dev-shm-configured-in-etc-fstab-it-configured-noexec:
      test_title: If /dev/shm is configured in /etc/fstab, it is configured with the noexec option
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/fstab
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^\s*[^#\s]+\s+/dev/shm\s+\S+\s+(\S+)\s+\S+\s+\S+\s*$
          instance:
            operation: equals
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: any_exist
        check: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: (?:^noexec$|^noexec,|,noexec$|,noexec,)
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - check: if-dev-shm-mounted-it-mounted-noexec-option
    - check: if-dev-shm-configured-in-etc-fstab-it-configured-noexec
