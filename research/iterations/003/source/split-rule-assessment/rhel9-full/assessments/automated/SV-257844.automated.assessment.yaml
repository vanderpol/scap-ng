assessment:
  id: SV-257844.automated
  version: 1
  assessment_title: RHEL-09-231015 - RHEL 9 must use a separate file system for /tmp.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    there-separate-file-system-tmp:
      test_title: There is a separate file system for /tmp.
      collect:
        object_title: null
        capability: linux.partition
        select:
          mount_point: /tmp
      assert:
        state_title: null
        existence: all_exist
        check: all
        state: null
    there-separate-file-system-configured-tmp:
      test_title: There is a separate file system configured for /tmp.
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath: /etc/fstab
          pattern:
            operation: pattern match
            value: ^[^# \t]+\s+/tmp\s+
          instance:
            operation: greater than or equal
            value: '1'
      assert:
        state_title: null
        existence: all_exist
        check: all
        state: null
  evaluate:
    all:
    - check: there-separate-file-system-tmp
    - check: there-separate-file-system-configured-tmp
