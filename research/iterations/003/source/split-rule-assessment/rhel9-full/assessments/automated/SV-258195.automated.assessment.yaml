assessment:
  id: SV-258195.automated
  version: 1
  assessment_title: RHEL-09-654105 - RHEL 9 must audit all uses of the kmod command.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    audit-invocations-usr-bin-kmod:
      test_title: Audit invocations of /usr/bin/kmod
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/audit/audit.rules
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^\s*-a\s+(always,exit|exit,always)(?:\s+-S\s+all)?\s+-F\s+path=/usr/bin/kmod\s+(-F\s+perm=([rwa]*x[rwa]*)\s+)?-F\s+auid>=1000\s+-F\s+auid!=(4294967295|-1|unset)(\s+(-k\s+|-F\s+key=)\S+)?\s*$
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: all_exist
        check: all
        state: null
  evaluate:
    check: audit-invocations-usr-bin-kmod
