assessment:
  id: SV-257826.automated
  version: 2
  assessment_title: RHEL-09-215015 - RHEL 9 must not have a File Transfer Protocol (FTP) server package
    installed.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    no-file-transfer-protocol-ftp-server-packages-installed:
      test_title: No File Transfer Protocol (FTP) server packages are installed
      capability: linux.rpminfo
      collect:
        object_title: null
        capability: linux.rpminfo
        select:
          name:
            operation: pattern match
            datatype: string
            mask: false
            value: ftp
      assert:
        existence: none_exist
        check: all
        state: null
  evaluate:
    check: no-file-transfer-protocol-ftp-server-packages-installed
