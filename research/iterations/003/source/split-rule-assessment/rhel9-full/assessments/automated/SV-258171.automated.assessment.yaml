assessment:
  id: SV-258171.automated
  version: 1
  assessment_title: RHEL-09-653110 - RHEL 9 must allow only the information system security manager (ISSM)
    (or individuals or roles appointed by the ISSM) to select which auditable events are to be audited.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    etc-audit-auditd-conf-has-mode-0600-or-less-permissive:
      test_title: /etc/audit/auditd.conf has mode 0600 or less permissive
      capability: unix.file
      collect:
        object_title: null
        capability: unix.file
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/audit/auditd.conf
      assert:
        existence: at_least_one_exists
        check: all
        state_title: Mode 0600 or less permissive
        state_capability: unix.file
        state:
          all:
          - field: suid
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: sgid
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: sticky
            value: 'false'
