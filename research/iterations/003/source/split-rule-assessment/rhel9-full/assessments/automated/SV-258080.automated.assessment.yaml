assessment:
  id: SV-258080.automated
  version: 1
  assessment_title: RHEL-09-431020 - RHEL 9 must configure SELinux context type to allow the use of a
    nondefault faillock tally directory.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    configured-faillock-directory-has-correct-selinux-context:
      test_title: configured faillock directory has correct selinux context
      capability: linux.selinuxsecuritycontext
      collect:
        object_title: configured faillock directory selinux context
        capability: linux.selinuxsecuritycontext
        select:
          path:
            operation: equals
            datatype: string
            mask: false
            variable_check: all
            value:
              variable: faillock-directory
          filename:
            operation: equals
            datatype: string
            mask: false
            nil: true
            value: ''
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: type
          value: faillog_t
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: configured faillock directory selinux context correct
        state_capability: linux.selinuxsecuritycontext
    etc-security-faillock-conf-dir-option-exists:
      test_title: /etc/security/faillock.conf dir option exists
      capability: independent.textfilecontent54
      collect:
        object_title: /etc/security/faillock.conf dir
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/security/faillock.conf
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^\s*dir\s*=\s*(.*)\s*$
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state: null
  evaluate:
    all:
    - check: configured-faillock-directory-has-correct-selinux-context
    - check: etc-security-faillock-conf-dir-option-exists
  variables:
    faillock-directory:
      title: faillock directory
      datatype: string
      kind: local
      expression:
        object_values:
          collect:
            object_title: /etc/security/faillock.conf dir
            capability: independent.textfilecontent54
            select:
              filepath:
                operation: equals
                datatype: string
                mask: false
                value: /etc/security/faillock.conf
              pattern:
                operation: pattern match
                datatype: string
                mask: false
                value: ^\s*dir\s*=\s*(.*)\s*$
              instance:
                operation: greater than or equal
                datatype: int
                mask: false
                value: '1'
          field: subexpression
