assessment:
  id: SV-258080.automated
  version: 1
  assessment_title: RHEL-09-431020 - RHEL 9 must configure SELinux context type to allow the use of a
    nondefault faillock tally directory.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    configured-faillock-directory-has-correct-selinux-context:
      test_title: configured faillock directory has correct selinux context
      collect:
        object_title: configured faillock directory selinux context
        capability: linux.selinuxsecuritycontext
        select:
          path:
            variable: faillock-directory
          filename:
            nil: true
            value: ''
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: type
          operation: equals
          value: faillog_t
        state_title: configured faillock directory selinux context correct
    etc-security-faillock-conf-dir-option-exists:
      test_title: /etc/security/faillock.conf dir option exists
      collect:
        object_title: /etc/security/faillock.conf dir
        capability: independent.textfilecontent54
        select:
          filepath: /etc/security/faillock.conf
          pattern:
            operation: pattern match
            value: ^\s*dir\s*=\s*(.*)\s*$
          instance:
            operation: greater than or equal
            datatype: int
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state: null
  evaluate:
    all:
    - check: configured-faillock-directory-has-correct-selinux-context
    - check: etc-security-faillock-conf-dir-option-exists
  variables:
    faillock-directory:
      title: faillock directory
      datatype: string
      kind: local
      expression:
        object_values:
          collect:
            object_title: /etc/security/faillock.conf dir
            capability: independent.textfilecontent54
            select:
              filepath: /etc/security/faillock.conf
              pattern:
                operation: pattern match
                value: ^\s*dir\s*=\s*(.*)\s*$
              instance:
                operation: greater than or equal
                datatype: int
                value: '1'
          field: subexpression
