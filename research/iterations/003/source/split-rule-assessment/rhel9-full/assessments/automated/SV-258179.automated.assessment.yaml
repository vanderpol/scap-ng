  variables:
    append-audit-rule:
      title: Append an audit rule
      datatype: string
      kind: constant
      expression:
        literal: ^\s*-a\s+(?:always,exit|exit,always)
    audit-32-bit-architecture:
      title: Audit 32-bit architecture
      datatype: string
      kind: constant
      expression:
        literal: \s+-F\s+arch=b32
    allow-multiple-s-fields:
      title: Allow for multiple -S fields
      datatype: string
      kind: constant
      expression:
        literal: \s+(?:-S\s+[,\w]+\s+)*
    allow-leading-syscalls:
      title: Allow for leading syscalls
      datatype: string
      kind: constant
      expression:
        literal: -S\s+[,\w]*\b
    allow-trailing-syscalls:
      title: Allow for trailing syscalls
      datatype: string
      kind: constant
      expression:
        literal: \b[,\w]*
    filter-out-system-uids:
      title: Filter out system UIDs
      datatype: string
      kind: constant
      expression:
        literal: -F\s+auid>=1000\s+-F\s+auid!=(?:4294967295|-1|unset)
    key-field:
      title: Key field
      datatype: string
      kind: constant
      expression:
        literal: (?:\s+(?:-k\s+|-F\s+key=)[-\w]+)*\s*$
    pattern-audit-rule-32-bit-invocations-lsetxattr-system-call:
      title: Pattern for audit rule for 32-bit invocations of lsetxattr system call.
      datatype: string
      kind: local
      expression:
        concat:
        - variable: append-audit-rule
        - variable: audit-32-bit-architecture
        - variable: allow-multiple-s-fields
        - variable: allow-leading-syscalls
        - literal: lsetxattr
        - variable: allow-trailing-syscalls
        - variable: allow-multiple-s-fields
        - variable: filter-out-system-uids
        - variable: key-field
    audit-64-bit-architecture:
