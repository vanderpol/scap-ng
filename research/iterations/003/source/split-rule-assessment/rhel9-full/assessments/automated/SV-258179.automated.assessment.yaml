assessment:
  id: SV-258179.automated
  version: 1
  assessment_title: RHEL-09-654025 - RHEL 9 must audit all uses of the setxattr, fsetxattr, lsetxattr,
    removexattr, fremovexattr, and lremovexattr system calls.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    audit-32-bit-invocations-fsetxattr-syscall-auid-1000:
      test_title: Audit 32-bit invocations of fsetxattr syscall (auid>=1000)
      collect:
        object_title: 32-bit fsetxattr syscall
        capability: independent.textfilecontent54
        select:
          filepath: /etc/audit/audit.rules
          pattern:
            operation: pattern match
            value: ^\s*-a\s+(always,exit|exit,always)\s+-F\s+arch=b32\s+(?:.*(-S\s+fsetxattr\s+|(\s+|,)fsetxattr(\s+|,))).*-F\s+auid>=1000\s+-F\s+auid!=(4294967295|-1|unset)(\s+(-k\s+|-F\s+key=)[-\w]+)*\s*$
          instance:
            operation: greater than or equal
            datatype: int
            value: '1'
      assert:
        existence: all_exist
        check: all
        state: null
    audit-64-bit-invocations-fsetxattr-syscall-auid-1000:
