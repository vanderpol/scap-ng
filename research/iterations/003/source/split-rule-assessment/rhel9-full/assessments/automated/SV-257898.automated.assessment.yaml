assessment:
  id: SV-257898.automated
  version: 1
  assessment_title: RHEL-09-232090 - RHEL 9 /etc/group file must be owned by root.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    etc-group-file-owned-by-root:
      test_title: /etc/group file is owned by root
      collect:
        object_title: null
        capability: unix.file
        select:
          filepath: /etc/group
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: user_id
          operation: equals
          value: '0'
          datatype: int
        state_title: owned by root
  evaluate:
    check: etc-group-file-owned-by-root
