assessment:
  id: SV-258242.automated
  version: 1
  assessment_title: RHEL-09-672050 - RHEL 9 must implement DOD-approved encryption in the bind package.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    named-conf-includes-crypto-policy:
      test_title: named.conf includes crypto-policy
      collect:
        object_title: named.conf includes
        capability: independent.textfilecontent54
        select:
          filepath: /etc/named.conf
          pattern:
            operation: pattern match
            value: ^\s*include\s+"(.*)"\s*;\s*$
          instance:
            operation: greater than or equal
            datatype: int
            value: '1'
      assert:
        existence: at_least_one_exists
        check: at least one
        state:
          field: subexpression
          operation: equals
          value: /etc/crypto-policies/back-ends/bind.config
  evaluate:
    check: named-conf-includes-crypto-policy
