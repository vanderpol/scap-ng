assessment:
  id: SV-258049.automated
  version: 1
  assessment_title: RHEL-09-411050 - RHEL 9 must disable account identifiers (individuals, groups, roles,
    and devices) after 35 days of inactivity.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    etc-default-useradd-inactive-set-35-or-less-but-not:
      test_title: '/etc/default/useradd: INACTIVE is set to 35 or less, but not -1'
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/default/useradd
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: (?i)^\s*INACTIVE\s*=\s*(-?\d+)\s*$
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state_operator: AND
        states:
        - state_title: null
          capability: independent.textfilecontent54
          state:
            field: subexpression
            value: '0'
            operation: greater than or equal
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: independent.textfilecontent54
          state:
            field: subexpression
            value: '35'
            operation: less than or equal
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    check: etc-default-useradd-inactive-set-35-or-less-but-not
