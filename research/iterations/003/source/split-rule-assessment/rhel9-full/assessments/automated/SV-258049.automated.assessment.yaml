assessment:
  id: SV-258049.automated
  version: 1
  assessment_title: RHEL-09-411050 - RHEL 9 must disable account identifiers (individuals, groups, roles,
    and devices) after 35 days of inactivity.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    etc-default-useradd-inactive-set-35-or-less-but-not:
      test_title: '/etc/default/useradd: INACTIVE is set to 35 or less, but not -1'
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath: /etc/default/useradd
          pattern:
            operation: pattern match
            value: (?i)^\s*INACTIVE\s*=\s*(-?\d+)\s*$
          instance:
            operation: greater than or equal
            value: '1'
      assert:
        state_title: null
        existence: at_least_one_exists
        check: all
        state:
          all:
          - field: subexpression
            operation: greater than or equal
            value: '0'
            datatype: int
          - field: subexpression
            operation: less than or equal
            value: '35'
            datatype: int
  evaluate:
    check: etc-default-useradd-inactive-set-35-or-less-but-not
