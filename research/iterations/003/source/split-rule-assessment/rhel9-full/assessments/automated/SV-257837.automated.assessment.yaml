assessment:
  id: SV-257837.automated
  version: 1
  assessment_title: RHEL-09-215070 - A graphical display manager must not be installed on RHEL 9 unless
    approved.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    graphical-display-manager-absent:
      test_title: The graphical display manager is absent.
      capability: linux.rpminfo
      collect:
        object_title: null
        capability: linux.rpminfo
        select:
          name:
            operation: equals
            datatype: string
            mask: false
            value: xorg-x11-server-common
      assert:
        existence: none_exist
        check: all
        state: null
  evaluate:
    check: graphical-display-manager-absent
