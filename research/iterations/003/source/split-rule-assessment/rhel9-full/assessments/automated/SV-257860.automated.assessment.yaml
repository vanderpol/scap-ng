assessment:
  id: SV-257860.automated
  version: 1
  assessment_title: RHEL-09-231095 - RHEL 9 must mount /boot with the nodev option.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    boot-has-nodev-option:
      test_title: /boot has nodev option
      capability: linux.partition
      collect:
        object_title: /boot
        capability: linux.partition
        select:
          mount_point:
            operation: equals
            datatype: string
            mask: false
            value: /boot
      assert:
        existence: at_least_one_exists
        check: all
        state_title: null
        state_capability: linux.partition
        state:
          field: mount_options
          value: nodev
          operation: equals
          datatype: string
          mask: false
          entity_check: at least one
          entity_existence: at_least_one_exists
  evaluate:
    check: boot-has-nodev-option
