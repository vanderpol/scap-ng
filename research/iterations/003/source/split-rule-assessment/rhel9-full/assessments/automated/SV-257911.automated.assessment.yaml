assessment:
  id: SV-257911.automated
  version: 1
  assessment_title: RHEL-09-232155 - RHEL 9 /etc/shadow file must be group-owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    etc-shadow-file-owned-by-root:
      test_title: /etc/shadow file is owned by root
      collect:
        object_title: null
        capability: unix.file
        select:
          filepath: /etc/shadow
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: group_id
          operation: equals
          value: '0'
          datatype: int
        state_title: group-owned by root
  evaluate:
    check: etc-shadow-file-owned-by-root
