assessment:
  id: SV-257911.automated
  version: 1
  assessment_title: RHEL-09-232155 - RHEL 9 /etc/shadow file must be group-owned by root.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    etc-shadow-file-owned-by-root:
      test_title: /etc/shadow file is owned by root
      capability: unix.file
      collect:
        object_title: null
        capability: unix.file
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/shadow
      assert:
        existence: at_least_one_exists
        check: all
        state_title: group-owned by root
        state_capability: unix.file
        state:
          field: group_id
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    check: etc-shadow-file-owned-by-root
