  mode: automated
  class: compliance
  purpose: assessment
  checks:
    etc-profile-umask-077:
      test_title: /etc/profile:umask == 077
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/profile
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^(?i)\s*umask\s+([^#\s]+)
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: '077'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
