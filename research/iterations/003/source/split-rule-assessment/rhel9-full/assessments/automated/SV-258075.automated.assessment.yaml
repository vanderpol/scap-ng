assessment:
  id: SV-258075.automated
  version: 1
  assessment_title: RHEL-09-412070 - RHEL 9 must define default permissions for the system default profile.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    etc-profile-umask-077:
      test_title: /etc/profile:umask == 077
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath: /etc/profile
          pattern:
            operation: pattern match
            value: ^(?i)\s*umask\s+([^#\s]+)
          instance:
            operation: greater than or equal
            value: '1'
      assert:
        state_title: null
        existence: at_least_one_exists
        check: all
        state:
          field: subexpression
          operation: equals
          value: '077'
          datatype: string
  evaluate:
    check: etc-profile-umask-077
