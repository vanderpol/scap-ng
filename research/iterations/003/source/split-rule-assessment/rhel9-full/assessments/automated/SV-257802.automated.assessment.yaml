assessment:
  id: SV-257802.automated
  version: 3
  assessment_title: RHEL-09-213035 - RHEL 9 must enable kernel parameters to enforce discretionary access
    control on symlinks.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    fs-protected-symlinks-setting-in-kernel-set-1:
      test_title: fs.protected_symlinks setting in kernel is set to 1
      collect:
        object_title: null
        capability: unix.sysctl
        select:
          name: fs.protected_symlinks
      assert:
        existence: all_exist
        check: all
        state:
          field: value
          operation: equals
          value: '1'
          datatype: int
  evaluate:
    check: fs-protected-symlinks-setting-in-kernel-set-1
