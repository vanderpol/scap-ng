assessment:
  id: SV-257795.automated
  version: 1
  assessment_title: RHEL-09-212050 - RHEL 9 must enable mitigations against processor-based vulnerabilities.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    bls-options-contain-pti-on:
      test_title: BLS options contain pti=on
      capability: independent.textfilecontent54
      collect:
        object_title: BLS options
        capability: independent.textfilecontent54
        select:
          path:
            operation: equals
            datatype: string
            mask: false
            value: /boot/loader/entries
          filename:
            operation: pattern match
            datatype: string
            mask: false
            value: ^.*\.conf$
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^options\s+(.*)$
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: (^|\s)pti=on(\s|$)
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
    grub-cmdline-linux-arguments-in-etc-default-grub-contain-pti:
      test_title: The GRUB_CMDLINE_LINUX arguments in /etc/default/grub contain pti=on
      capability: independent.textfilecontent54
      collect:
        object_title: /etc/default/grub GRUB_CMDLINE_LINUX
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/default/grub
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^GRUB_CMDLINE_LINUX="(.*)"
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: (^|\s)pti=on(\s|$)
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    all:
    - check: bls-options-contain-pti-on
    - check: grub-cmdline-linux-arguments-in-etc-default-grub-contain-pti
