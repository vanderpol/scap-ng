assessment:
  id: SV-258042.automated
  version: 2
  assessment_title: RHEL-09-411015 - RHEL 9 user account passwords must have a 60-day maximum password
    lifetime restriction.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    no-password-in-etc-shadow-has-maximum-password-age-0:
      test_title: No password in /etc/shadow has a maximum password age of 0 or greater than 60
      capability: unix.shadow
      collect:
        object_title: /etc/shadow max password ages for non-system users
        capability: unix.shadow
        select:
          username:
            operation: pattern match
            datatype: string
            mask: false
            value: .+
        filters:
        - action: include
          match:
            field: username
            value:
              variable: pattern-match-lines-starting-usernames-system-users
            operation: pattern match
            datatype: string
            mask: false
            variable_check: at least one
            entity_check: all
            entity_existence: at_least_one_exists
          state_title: Lines starting with usernames of system users
          capability: unix.shadow
      assert:
        existence: any_exist
        check: all
        state_operator: AND
        states:
        - state_title: greater than zero
          capability: unix.shadow
          state:
            field: chg_req
            value: '0'
            operation: greater than
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: less than or equal to sixty
          capability: unix.shadow
          state:
            field: chg_req
            value: '60'
            operation: less than or equal
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
    root-password-in-etc-shadow-does-not-have-maximum-password:
      test_title: Root password in /etc/shadow does not have a maximum password age of 0 or greater than
        60
      capability: unix.shadow
      collect:
        object_title: /etc/shadow max password age for root
        capability: unix.shadow
        select:
          username:
            operation: equals
            datatype: string
            mask: false
            value: root
      assert:
        existence: all_exist
        check: all
        state_operator: AND
        states:
        - state_title: greater than zero
          capability: unix.shadow
          state:
            field: chg_req
            value: '0'
            operation: greater than
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: less than or equal to sixty
          capability: unix.shadow
          state:
            field: chg_req
            value: '60'
            operation: less than or equal
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    all:
    - check: no-password-in-etc-shadow-has-maximum-password-age-0
    - check: root-password-in-etc-shadow-does-not-have-maximum-password
  variables:
    anonymous-uids:
      title: anonymous UIDs
      kind: constant
      datatype: int
      expression:
        literal:
        - '65534'
        - '65535'
        - '4294967294'
        - '4294967295'
    pattern-match-lines-starting-usernames-system-users:
      title: Pattern to match lines starting with usernames of system users
      kind: local
      datatype: string
      expression:
        concat:
        - literal:
            value: ^
            datatype: string
        - object_values:
            collect:
              object_title: interactive non-anonymous users
              capability: unix.password
              select:
                username:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: .*
              filters:
              - action: include
                match:
                  field: user_id
                  value: '1000'
                  operation: greater than or equal
                  datatype: int
                  mask: false
                  entity_check: all
                  entity_existence: at_least_one_exists
                capability: unix.password
              - action: include
                match:
                  field: user_id
                  value:
                    variable: anonymous-uids
                  operation: not equal
                  datatype: int
                  mask: false
                  variable_check: all
                  entity_check: all
                  entity_existence: at_least_one_exists
                state_title: anonymous users
                capability: unix.password
            field: username
        - literal:
            value: $
            datatype: string
