assessment:
  id: SV-258005.automated
  version: 2
  assessment_title: RHEL-09-255145 - RHEL 9 SSH daemon must not allow rhosts authentication.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    etc-ssh-sshd-config-ignorerhosts-yes:
      test_title: /etc/ssh/sshd_config:IgnoreRhosts == yes
      capability: independent.textfilecontent54
      collect:
        object_title: Ignore Rhosts is set to 'yes' in both /etc/ssh/sshd_config and /etc/ssh/sshd_config.d/*
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: Pull value of /etc/ssh/sshd_config:IgnoreRhosts
              capability: independent.textfilecontent54
              select:
                filepath:
                  operation: equals
                  datatype: string
                  mask: false
                  value: /etc/ssh/sshd_config
                pattern:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: ^\s*(?i)IgnoreRhosts(?-i)[ \t]+([\w\"]+)[\s]*(?:|(?:#.*))?$
                instance:
                  operation: greater than or equal
                  datatype: int
                  mask: false
                  value: '1'
          - collect:
              object_title: Pull value of /etc/ssh/sshd_config.d:IgnoreRhosts
              capability: independent.textfilecontent54
              select:
                path:
                  operation: equals
                  datatype: string
                  mask: false
                  value: /etc/ssh/sshd_config.d
                filename:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: ^.*$
                pattern:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: ^\s*(?i)IgnoreRhosts(?-i)[ \t]+([\w\"]+)[\s]*(?:|(?:#.*))?$
                instance:
                  operation: greater than or equal
                  datatype: int
                  mask: false
                  value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state_title: null
        state_capability: independent.textfilecontent54
        state:
          field: subexpression
          value: ^(yes|"yes")$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    check: etc-ssh-sshd-config-ignorerhosts-yes
