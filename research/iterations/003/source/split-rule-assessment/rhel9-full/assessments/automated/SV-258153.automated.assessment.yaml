assessment:
  id: SV-258153.automated
  version: 1
  assessment_title: RHEL-09-653020 - RHEL 9 audit system must take appropriate action when an error writing
    to the audit storage volume occurs.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    etc-audit-auditd-conf-disk-error-action-syslog-single-or:
      test_title: '/etc/audit/auditd.conf: disk_error_action = SYSLOG, SINGLE, or HALT'
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/audit/auditd.conf
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: (?i)^\s*disk_error_action\s*=\s*(\w+)\s*(?:#.*)?$
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state_operator: OR
        states:
        - state_title: null
          capability: independent.textfilecontent54
          state:
            field: subexpression
            value: (?i)^syslog$
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: independent.textfilecontent54
          state:
            field: subexpression
            value: (?i)^single$
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        - state_title: null
          capability: independent.textfilecontent54
          state:
            field: subexpression
            value: (?i)^halt$
            operation: pattern match
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    check: etc-audit-auditd-conf-disk-error-action-syslog-single-or
