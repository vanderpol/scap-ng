assessment:
  id: SV-257964.automated
  version: 2
  assessment_title: RHEL-09-253045 - RHEL 9 must not forward IPv4 source-routed packets by default.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    net-ipv4-conf-default-accept-source-route-setting-in-kernel:
      test_title: net.ipv4.conf.default.accept_source_route setting in kernel is set to 0
      capability: unix.sysctl
      collect:
        object_title: null
        capability: unix.sysctl
        select:
          name:
            operation: equals
            datatype: string
            mask: false
            value: net.ipv4.conf.default.accept_source_route
      assert:
        existence: all_exist
        check: all
        state_title: null
        state_capability: unix.sysctl
        state:
          field: value
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    check: net-ipv4-conf-default-accept-source-route-setting-in-kernel
