assessment:
  id: SV-258017.automated
  version: 13
  assessment_title: RHEL 9 must prevent a user from overriding the disabling of the graphical user interface
    autorun function.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    verify-gsettings-writable-org-gnome-desktop-media-handling-autorun-never:
      test_title: Verify gsettings writable org.gnome.desktop.media-handling autorun-never returns false
      capability: independent.shellcommand
      collect:
        object_title: Retrieve gsettings writable org.gnome.desktop.media-handling autorun-never
        capability: independent.shellcommand
        select:
          shell:
            operation: equals
            datatype: string
            mask: false
            value: bash
          command:
            operation: equals
            datatype: string
            mask: false
            value: gsettings writable org.gnome.desktop.media-handling autorun-never
          pattern:
            operation: equals
            datatype: string
            mask: false
            value: .+
      assert:
        existence: at_least_one_exists
        check: all
        state_title: Verify command returns false
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: 'false'
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    check: verify-gsettings-writable-org-gnome-desktop-media-handling-autorun-never
