assessment:
  id: SV-257913.automated
  version: 1
  assessment_title: RHEL-09-232165 - RHEL 9 /etc/shadow- file must be group-owned by root.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    etc-shadow-file-group-owned-by-root:
      test_title: The /etc/shadow- file is group-owned by root.
      capability: unix.file
      collect:
        object_title: null
        capability: unix.file
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/shadow-
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: group_id
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_title: group-owned by root
        state_capability: unix.file
  evaluate:
    check: etc-shadow-file-group-owned-by-root
