assessment:
  id: SV-257914.automated
  version: 1
  assessment_title: RHEL-09-232170 - RHEL 9 /var/log directory must be owned by root.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    var-log-directory-owned-by-root:
      test_title: /var/log directory is owned by root
      capability: unix.file
      collect:
        object_title: null
        capability: unix.file
        select:
          path:
            operation: equals
            datatype: string
            mask: false
            value: /var/log
          filename:
            operation: equals
            datatype: string
            mask: false
            nil: true
            value: ''
      assert:
        existence: at_least_one_exists
        check: all
        state_title: owned by root
        state_capability: unix.file
        state:
          field: user_id
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    check: var-log-directory-owned-by-root
