assessment:
  id: SV-258055.automated
  version: 1
  assessment_title: RHEL-09-411080 - RHEL 9 must automatically lock the root account until the root account
    is released by an administrator when three unsuccessful logon attempts occur during a 15-minute time
    period.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    check-etc-security-faillock-conf-even-deny-root-setting:
      test_title: check /etc/security/faillock.conf for the even_deny_root setting
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath: /etc/security/faillock.conf
          pattern:
            operation: pattern match
            value: ^\s*even_deny_root\s*$
          instance:
            operation: greater than or equal
            value: '1'
      assert:
        state_title: null
        existence: all_exist
        check: all
        state: null
  evaluate:
    check: check-etc-security-faillock-conf-even-deny-root-setting
