assessment:
  id: SV-257904.automated
  version: 1
  assessment_title: RHEL-09-232120 - RHEL 9 /etc/gshadow- file must be owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    etc-gshadow-file-owned-by-root:
      test_title: /etc/gshadow- file is owned by root
      collect:
        object_title: null
        capability: unix.file
        select:
          path: /etc
          filename: gshadow-
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: user_id
          operation: equals
          value: '0'
          datatype: int
        state_title: owned by root
  evaluate:
    check: etc-gshadow-file-owned-by-root
