assessment:
  id: SV-257891.automated
  version: 1
  assessment_title: RHEL-09-232055 - RHEL 9 /etc/group file must have mode 0644 or less permissive to
    prevent unauthorized access.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    etc-group-file-has-mode-0644-or-less-permissive:
      test_title: The /etc/group file has mode 0644 or less permissive
      capability: unix.file
      collect:
        object_title: null
        capability: unix.file
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/group
      assert:
        existence: any_exist
        check: all
        state:
          all:
          - field: suid
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: sgid
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: sticky
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: uexec
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: gwrite
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: gexec
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: owrite
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: oexec
            value: 'false'
            operation: equals
            datatype: boolean
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
        state_title: File permissions is 644 or more restrictive
        state_capability: unix.file
  evaluate:
    check: etc-group-file-has-mode-0644-or-less-permissive
