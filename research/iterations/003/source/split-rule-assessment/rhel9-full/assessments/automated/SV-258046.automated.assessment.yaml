assessment:
  id: SV-258046.automated
  version: 1
  assessment_title: RHEL-09-411035 - RHEL 9 system accounts must not have an interactive login shell.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    system-accounts-in-etc-passwd-use-sbin-nologin:
      test_title: The system accounts in /etc/passwd use /sbin/nologin.
      capability: unix.password
      collect:
        object_title: only system accounts
        capability: unix.password
        set:
          operator: union
          members:
          - collect:
              object_title: null
              capability: unix.password
              select:
                username:
                  operation: pattern match
                  datatype: string
                  mask: false
                  value: .+
          filters:
          - action: exclude
            match:
              field: user_id
              value: '1000'
              operation: greater than or equal
              datatype: int
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            capability: unix.password
          - action: exclude
            match:
              field: user_id
              value: '0'
              operation: equals
              datatype: int
              mask: false
              entity_check: all
              entity_existence: at_least_one_exists
            capability: unix.password
      assert:
        existence: at_least_one_exists
        check: all
        state_title: null
        state_capability: unix.password
        state:
          field: login_shell
          value: /sbin/nologin|/usr/sbin/nologin
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    check: system-accounts-in-etc-passwd-use-sbin-nologin
