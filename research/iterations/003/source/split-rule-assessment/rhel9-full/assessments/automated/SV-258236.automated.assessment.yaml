assessment:
  id: SV-258236.automated
  version: 1
  assessment_title: RHEL-09-672020 - RHEL 9 crypto policy must not be overridden.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    bind:
      test_title: bind
      collect:
        object_title: bind
        capability: unix.symlink
        select:
          filepath: /etc/crypto-policies/back-ends/bind.config
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: canonical_path
          operation: equals
          value: /usr/share/crypto-policies/FIPS/bind.txt
        state_title: bind
    gnutls:
      test_title: gnutls
      collect:
        object_title: gnutls
        capability: unix.symlink
        select:
          filepath: /etc/crypto-policies/back-ends/gnutls.config
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: canonical_path
          operation: equals
          value: /usr/share/crypto-policies/FIPS/gnutls.txt
        state_title: gnutls
    java:
      test_title: java
      collect:
        object_title: java
        capability: unix.symlink
        select:
          filepath: /etc/crypto-policies/back-ends/java.config
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: canonical_path
          operation: equals
          value: /usr/share/crypto-policies/FIPS/java.txt
        state_title: java
    javasystem:
      test_title: javasystem
      collect:
        object_title: javasystem
        capability: unix.symlink
        select:
          filepath: /etc/crypto-policies/back-ends/javasystem.config
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: canonical_path
          operation: equals
          value: /usr/share/crypto-policies/FIPS/javasystem.txt
        state_title: javasystem
    krb5:
      test_title: krb5
      collect:
        object_title: krb5
        capability: unix.symlink
        select:
          filepath: /etc/crypto-policies/back-ends/krb5.config
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: canonical_path
          operation: equals
          value: /usr/share/crypto-policies/FIPS/krb5.txt
        state_title: krb5
    libreswan:
      test_title: libreswan
      collect:
        object_title: libreswan
        capability: unix.symlink
        select:
          filepath: /etc/crypto-policies/back-ends/libreswan.config
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: canonical_path
          operation: equals
          value: /usr/share/crypto-policies/FIPS/libreswan.txt
        state_title: libreswan
    libssh:
      test_title: libssh
      collect:
        object_title: libssh
        capability: unix.symlink
        select:
          filepath: /etc/crypto-policies/back-ends/libssh.config
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: canonical_path
          operation: equals
          value: /usr/share/crypto-policies/FIPS/libssh.txt
        state_title: libssh
    nss:
      test_title: nss
      collect:
        object_title: nss
        capability: unix.file
        select:
          filepath: /etc/crypto-policies/back-ends/nss.config
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: type
          operation: equals
          value: regular
        state_title: Ensure nss is a regular file
    openssh:
      test_title: openssh
      collect:
        object_title: openssh
        capability: unix.symlink
        select:
          filepath: /etc/crypto-policies/back-ends/openssh.config
      assert:
