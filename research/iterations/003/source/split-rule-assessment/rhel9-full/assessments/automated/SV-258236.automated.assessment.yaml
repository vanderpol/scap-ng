        state:
          field: canonical_path
          operation: equals
          value: /usr/share/crypto-policies/FIPS/openssl.txt
        state_title: openssl
  evaluate:
    all:
    - check: bind
    - check: gnutls
    - check: java
    - check: javasystem
    - check: krb5
    - check: libreswan
    - check: libssh
    - check: nss
    - check: openssh
    - check: opensshserver
    - check: opensslcnf
    - check: openssl
