          field: canonical_path
          operation: equals
          value: /usr/share/crypto-policies/FIPS/openssh.txt
        state_title: openssh
    opensshserver:
      test_title: opensshserver
      collect:
        object_title: opensshserver
        capability: unix.symlink
        select:
          filepath: /etc/crypto-policies/back-ends/opensshserver.config
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: canonical_path
          operation: equals
          value: /usr/share/crypto-policies/FIPS/opensshserver.txt
        state_title: opensshserver
    opensslcnf:
      test_title: opensslcnf
      collect:
        object_title: opensslcnf
        capability: unix.symlink
        select:
          filepath: /etc/crypto-policies/back-ends/opensslcnf.config
      assert:
        existence: at_least_one_exists
