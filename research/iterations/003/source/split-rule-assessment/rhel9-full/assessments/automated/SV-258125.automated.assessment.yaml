assessment:
  id: SV-258125.automated
  version: 1
  assessment_title: RHEL-09-611180 - The pcscd service on RHEL 9 must be active.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    pcscd-socket-active:
      test_title: The pcscd socket is active.
      capability: linux.systemdunitproperty
      collect:
        object_title: null
        capability: linux.systemdunitproperty
        select:
          unit:
            operation: equals
            datatype: string
            mask: false
            value: pcscd.socket
          property:
            operation: equals
            datatype: string
            mask: false
            value: ActiveState
      assert:
        existence: at_least_one_exists
        check: all
        state_title: null
        state_capability: linux.systemdunitproperty
        state:
          field: value
          value: active
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    check: pcscd-socket-active
