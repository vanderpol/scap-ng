assessment:
  id: SV-257830.automated
  version: 13
  assessment_title: RHEL 9 must not install packages from the Extra Packages for Enterprise Linux (EPEL)
    repository.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    os-not-install-packages-from-extra-packages-enterprise-linux-epel:
      test_title: The OS must not install packages from the Extra Packages for Enterprise Linux (EPEL)
        repository.
      capability: independent.shellcommand
      collect:
        object_title: Retrieve dnf repolist, filter on those that contain 'epel'
        capability: independent.shellcommand
        select:
          shell:
            operation: equals
            datatype: string
            mask: false
            value: bash
          command:
            operation: equals
            datatype: string
            mask: false
            value: dnf repolist
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: epel
      assert:
        existence: at_least_one_exists
        check: all
        state_title: Confirm no repositories contain the word 'epel'
        state_capability: independent.shellcommand
        state:
          field: stdout_line
          value: ''
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: none_exist
  evaluate:
    check: os-not-install-packages-from-extra-packages-enterprise-linux-epel
