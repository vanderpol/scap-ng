assessment:
  id: SV-258216.automated
  version: 1
  assessment_title: RHEL-09-654210 - Successful/unsuccessful uses of the umount2 system call in RHEL 9
    must generate an audit record.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    audit-32-bit-invocations-umount2-syscall:
      test_title: Audit 32-bit invocations of umount2 syscall
      collect:
        object_title: 32-bit umount2 syscall
        capability: independent.textfilecontent54
        select:
          filepath: /etc/audit/audit.rules
          pattern:
            operation: pattern match
            value: ^\s*-a\s+(always,exit|exit,always)\s+-F\s+arch=b32\s+(?:.*(-S\s+umount2\s+|(\s+|,)umount2(\s+|,))).*-F\s+auid>=1000\s+-F\s+auid!=(4294967295|-1|unset)(\s+(-k\s+|-F\s+key=)[-\w]+)*\s*$
          instance:
            operation: greater than or equal
            datatype: int
            value: '1'
      assert:
        existence: all_exist
        check: all
        state: null
    audit-64-bit-invocations-umount2-syscall:
      test_title: Audit 64-bit invocations of umount2 syscall
      collect:
        object_title: 64-bit umount2 syscall
        capability: independent.textfilecontent54
        select:
          filepath: /etc/audit/audit.rules
          pattern:
            operation: pattern match
            value: ^\s*-a\s+(always,exit|exit,always)\s+-F\s+arch=b64\s+(?:.*(-S\s+umount2\s+|(\s+|,)umount2(\s+|,))).*-F\s+auid>=1000\s+-F\s+auid!=(4294967295|-1|unset)(\s+(-k\s+|-F\s+key=)[-\w]+)*\s*$
          instance:
            operation: greater than or equal
            datatype: int
            value: '1'
      assert:
        existence: all_exist
        check: all
        state: null
  evaluate:
    all:
    - check: audit-32-bit-invocations-umount2-syscall
    - check: audit-64-bit-invocations-umount2-syscall
