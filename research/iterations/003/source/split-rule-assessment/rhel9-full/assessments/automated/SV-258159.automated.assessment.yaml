assessment:
  id: SV-258159.automated
  version: 1
  assessment_title: RHEL-09-653050 - RHEL 9 must take action when allocated audit record storage volume
    reaches 95 percent of the repository maximum audit record storage capacity.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    etc-audit-auditd-conf-admin-space-left-action-single:
      test_title: '/etc/audit/auditd.conf: admin_space_left_action = SINGLE'
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /etc/audit/auditd.conf
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: (?i)^\s*admin_space_left_action\s*=\s*(\w+)\s*(?:#.*)?$
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: subexpression
          value: (?i)^single$
          operation: pattern match
          datatype: string
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_capability: independent.textfilecontent54
  evaluate:
    check: etc-audit-auditd-conf-admin-space-left-action-single
