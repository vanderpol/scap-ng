assessment:
  id: SV-258159.automated
  version: 1
  assessment_title: RHEL-09-653050 - RHEL 9 must take action when allocated audit record storage volume
    reaches 95 percent of the repository maximum audit record storage capacity.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    etc-audit-auditd-conf-admin-space-left-action-single:
      test_title: '/etc/audit/auditd.conf: admin_space_left_action = SINGLE'
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath: /etc/audit/auditd.conf
          pattern:
            operation: pattern match
            value: (?i)^\s*admin_space_left_action\s*=\s*(\w+)\s*(?:#.*)?$
          instance:
            operation: greater than or equal
            value: '1'
      assert:
        state_title: null
        existence: at_least_one_exists
        check: all
        state:
          field: subexpression
          operation: pattern match
          value: (?i)^single$
  evaluate:
    check: etc-audit-auditd-conf-admin-space-left-action-single
