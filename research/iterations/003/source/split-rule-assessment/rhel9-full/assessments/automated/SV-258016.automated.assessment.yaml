assessment:
  id: SV-258016.automated
  version: 13
  assessment_title: RHEL 9 must disable the graphical user interface autorun function unless required.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    verify-rhel-9-disables-graphical-user-interface-autorun-function:
      test_title: Verify RHEL 9 disables the graphical user interface autorun function.
      capability: independent.shellcommand
      collect:
        object_title: Retrieve the gsettings autorun-never setting.
        capability: independent.shellcommand
        select:
          shell:
            operation: equals
            datatype: string
            mask: false
            value: bash
          command:
            operation: equals
            datatype: string
            mask: false
            value: gsettings get org.gnome.desktop.media-handling autorun-never
      assert:
        existence: at_least_one_exists
        check: all
        state_title: Confirm value is 'true'.
        state_capability: independent.shellcommand
        state:
          all:
          - field: exit_status
            value: '0'
            operation: equals
            datatype: int
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
          - field: stdout_line
            value: 'true'
            operation: equals
            datatype: string
            mask: false
            entity_check: all
            entity_existence: at_least_one_exists
  evaluate:
    check: verify-rhel-9-disables-graphical-user-interface-autorun-function
