assessment:
  id: SV-257976.automated
  version: 2
  assessment_title: RHEL-09-254035 - RHEL 9 must prevent IPv6 Internet Control Message Protocol (ICMP)
    redirect messages from being accepted.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    net-ipv6-conf-default-accept-redirects-set-0-in-kernel:
      test_title: net.ipv6.conf.default.accept_redirects is set to 0 in kernel
      collect:
        object_title: null
        capability: unix.sysctl
        select:
          name: net.ipv6.conf.default.accept_redirects
      assert:
        state_title: null
        existence: at_least_one_exists
        check: all
        state:
          field: value
          operation: equals
          value: '0'
          datatype: int
  evaluate:
    check: net-ipv6-conf-default-accept-redirects-set-0-in-kernel
