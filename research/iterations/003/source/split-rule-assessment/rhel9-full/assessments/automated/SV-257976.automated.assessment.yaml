assessment:
  id: SV-257976.automated
  version: 2
  assessment_title: RHEL-09-254035 - RHEL 9 must prevent IPv6 Internet Control Message Protocol (ICMP)
    redirect messages from being accepted.
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    net-ipv6-conf-default-accept-redirects-set-0-in-kernel:
      test_title: net.ipv6.conf.default.accept_redirects is set to 0 in kernel
      capability: unix.sysctl
      collect:
        object_title: null
        capability: unix.sysctl
        select:
          name:
            operation: equals
            datatype: string
            mask: false
            value: net.ipv6.conf.default.accept_redirects
      assert:
        existence: at_least_one_exists
        check: all
        state_title: null
        state_capability: unix.sysctl
        state:
          field: value
          value: '0'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
  evaluate:
    check: net-ipv6-conf-default-accept-redirects-set-0-in-kernel
