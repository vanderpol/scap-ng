  purpose: assessment
  procedure: 'Verify all local initialization files have a mode of "0740" or less permissive with the
    following command: Note: The example will be for the "disauser" user, who has a home directory of
    "/home/disauser". $ sudo find /home /root -maxdepth 2 -type f -name ".*" -perm /037 -ls 755 /home/disauser/.somepermissivefile
    If any local initialization files are returned, this indicates a mode more permissive than "0740",
    and this is a finding.'
