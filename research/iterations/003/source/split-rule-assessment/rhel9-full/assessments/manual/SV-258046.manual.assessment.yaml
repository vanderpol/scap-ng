assessment:
  id: SV-258046.manual
  version: 1
  assessment_title: null
  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'Verify that system accounts must not have an interactive login shell with the following
    command: $ awk -F: ''($3<1000){print $1 ":" $3 ":" $7}'' /etc/passwd root:0:/bin/bash bin:1:/sbin/nologin
    daemon:2:/sbin/nologin adm:3:/sbin/nologin lp:4:/sbin/nologin Identify the system accounts from this
    listing that do not have a nologin shell. If any system account (other than the root account) has
    a login shell and it is not documented with the information system security officer (ISSO), this is
    a finding.'
  inputs: []
  evidence: []
