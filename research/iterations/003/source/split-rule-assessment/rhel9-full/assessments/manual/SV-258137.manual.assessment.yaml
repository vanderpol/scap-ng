assessment:
  id: SV-258137.manual
  version: 1
  assessment_title: null
  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'Check that AIDE is properly configured to protect the integrity of the audit tools with
    the following command: $ sudo grep /usr/sbin/au /etc/aide.conf /usr/sbin/auditctl p+i+n+u+g+s+b+acl+xattrs+sha512
    /usr/sbin/auditd p+i+n+u+g+s+b+acl+xattrs+sha512 /usr/sbin/ausearch p+i+n+u+g+s+b+acl+xattrs+sha512
    /usr/sbin/aureport p+i+n+u+g+s+b+acl+xattrs+sha512 /usr/sbin/autrace p+i+n+u+g+s+b+acl+xattrs+sha512
    /usr/sbin/augenrules p+i+n+u+g+s+b+acl+xattrs+sha512 If AIDE is not installed, ask the system administrator
    (SA) how file integrity checks are performed on the system. If any of the audit tools listed above
    do not have a corresponding line, ask the SA to indicate what cryptographic mechanisms are being used
    to protect the integrity of the audit tools. If there is no evidence of integrity protection, this
    is a finding.'
  inputs: []
  evidence: []
