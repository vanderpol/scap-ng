assessment:
  id: SV-258156.manual
  version: 1
  assessment_title: null
  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'Verify RHEL 9 takes action when allocated audit record storage volume reaches 75 percent
    of the repository maximum audit record storage capacity with the following command: $ sudo grep -w
    space_left /etc/audit/auditd.conf space_left = 25% If the value of the "space_left" keyword is not
    set to 25 percent or greater of the storage volume allocated to audit logs, or if the line is commented
    out, ask the system administrator (SA) to indicate how the system is providing real-time alerts to
    the SA and ISSO. If the "space_left" value is not configured to the value 25 percent or more, this
    is a finding.'
  inputs: []
  evidence: []
