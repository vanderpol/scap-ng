  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'Note: If no NFS mounts are configured, this requirement is Not Applicable. Verify RHEL 9
    has the "noexec" option configured for all NFS mounts with the following command: $ grep nfs /etc/fstab
    192.168.22.2:/mnt/export /data nfs4 rw,nosuid,nodev,noexec,sync,soft,sec=krb5:krb5i:krb5p If the system
    is mounting file systems via NFS and the "noexec" option is missing, this is a finding.'
