  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'Verify that RHEL 9 is configured to audit the execution of the "chsh" command with the following
    command: $ sudo auditctl -l | grep chsh -a always,exit -S all -F path=/usr/bin/chsh -F perm=x -F auid>=1000
    -F auid!=-1 -F key=priv_cmd If the command does not return a line, or the line is commented out, this
    is a finding.'
