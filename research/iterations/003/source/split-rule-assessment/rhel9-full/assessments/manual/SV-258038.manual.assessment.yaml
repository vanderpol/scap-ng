assessment:
  id: SV-258038.manual
  version: 1
  assessment_title: null
  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'Note: If the system is virtual machine with no virtual or physical USB peripherals attached,
    this is Not Applicable. Verify the USBGuard has a policy configured with the following command: $
    sudo usbguard list-rules allow id 1d6b:0001 serial If the command does not return results or an error
    is returned, ask the SA to indicate how unauthorized peripherals are being blocked. If there is no
    evidence that unauthorized peripherals are being blocked before establishing a connection, this is
    a finding.'
  inputs: []
  evidence: []
