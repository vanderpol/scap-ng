  purpose: assessment
  procedure: 'Verify the system-wide shared library directories have mode "755" or less permissive with
    the following command: $ sudo find -L /lib /lib64 /usr/lib /usr/lib64 -perm /022 -type d -exec ls
    -l {} \; If any system-wide shared library file is found to be group-writable or world-writable, this
    is a finding.'
