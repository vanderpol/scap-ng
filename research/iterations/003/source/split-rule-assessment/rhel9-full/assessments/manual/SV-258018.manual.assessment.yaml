assessment:
  id: SV-258018.manual
  version: 1
  assessment_title: null
  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'Note: This requirement assumes the use of the RHEL 9 default graphical user interface, the
    GNOME desktop environment. If the system does not have any graphical user interface installed, this
    requirement is Not Applicable. Verify RHEL 9 does not allow an unattended or automatic logon to the
    system via a graphical user interface. Check for the value of the "AutomaticLoginEnable" in the "/etc/gdm/custom.conf"
    file with the following command: $ grep -i automaticlogin /etc/gdm/custom.conf AutomaticLoginEnable=false
    If the value of "AutomaticLoginEnable" is not set to "false", this is a finding.'
  inputs: []
  evidence: []
