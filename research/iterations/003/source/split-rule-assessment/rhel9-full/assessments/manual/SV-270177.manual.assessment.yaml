assessment:
  id: SV-270177.manual
  version: 1
  assessment_title: null
  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'Verify the SSH client is configured to use only ciphers employing FIPS 140-3 approved algorithms.
    To verify the ciphers in the systemwide SSH configuration file, use the following command: $ grep
    -i Ciphers /etc/crypto-policies/back-ends/openssh.config Ciphers aes256-gcm@openssh.com,aes256-ctr,aes128-gcm@openssh.com,aes128-ctr
    If the cipher entries in the "openssh.config" file have any ciphers other than "aes256-gcm@openssh.com,aes256-ctr,aes128-gcm@openssh.com,aes128-ctr",
    or they are missing or commented out, this is a finding.'
  inputs: []
  evidence: []
