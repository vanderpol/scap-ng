assessment:
  id: SV-258040.manual
  version: 1
  assessment_title: null
  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'Verify there are no wireless interfaces configured on the system with the following command:
    Note: This requirement is Not Applicable for systems that do not have physical wireless network radios.
    $ nmcli device status DEVICE TYPE STATE CONNECTION virbr0 bridge connected virbr0 wlp7s0 wifi connected
    wifiSSID enp6s0 ethernet disconnected -- p2p-dev-wlp7s0 wifi-p2p disconnected -- lo loopback unmanaged
    -- virbr0-nic tun unmanaged -- If a wireless interface is configured and has not been documented and
    approved by the information system security officer (ISSO), this is a finding.'
  inputs: []
  evidence: []
