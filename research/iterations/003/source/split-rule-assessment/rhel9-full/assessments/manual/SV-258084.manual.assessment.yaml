  purpose: assessment
  procedure: 'Verify RHEL 9 requires reauthentication when using the "sudo" command to elevate privileges
    with the following command: $ sudo grep -ir ''timestamp_timeout'' /etc/sudoers /etc/sudoers.d/ /etc/sudoers:Defaults
    timestamp_timeout=0 If results are returned from more than one file location, this is a finding. If
    "timestamp_timeout" is set to a negative number, is commented out, or no results are returned, this
    is a finding.'
