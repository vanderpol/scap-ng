assessment:
  id: SV-257981.manual
  version: 1
  assessment_title: null
  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'Verify any SSH connection to RHEL 9 displays the Standard Mandatory DOD Notice and Consent
    Banner before granting access to the system. Check for the location of the banner file being used
    with the following command: $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d
    ''\r'' | tr ''\n'' '' '' | xargs sudo grep -iH ''^\s*banner'' /etc/ssh/sshd_config.d/80-bannerPointer.conf:Banner
    /etc/issue This command will return the banner keyword and the name of the file that contains the
    SSH banner (in this case "/etc/issue"). If the line is commented out, this is a finding.'
  inputs: []
  evidence: []
