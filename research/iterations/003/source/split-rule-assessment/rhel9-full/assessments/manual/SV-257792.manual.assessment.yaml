assessment:
  id: SV-257792.manual
  version: 1
  assessment_title: null
  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'Verify the current GRUB 2 configuration disables virtual system calls with the following
    command: $ sudo grubby --info=ALL | grep args | grep -v ''vsyscall=none'' If any output is returned,
    this is a finding. Check that virtual system calls are disabled by default to persist in kernel updates
    with the following command: $ sudo grep vsyscall /etc/default/grub GRUB_CMDLINE_LINUX="vsyscall=none"
    If "vsyscall" is not set to "none", is missing or commented out, and is not documented with the information
    system security officer (ISSO) as an operational requirement, this is a finding.'
  inputs: []
  evidence: []
