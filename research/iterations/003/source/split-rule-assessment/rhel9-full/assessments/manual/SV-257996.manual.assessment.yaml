assessment:
  id: SV-257996.manual
  version: 1
  assessment_title: null
  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'Verify the "ClientAliveInterval" variable is set to a value of "600" or less by performing
    the following command: $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r''
    | tr ''\n'' '' '' | xargs sudo grep -iH ''^\s*clientaliveinterval'' /etc/ssh/sshd_config.d/ClientAliveInterval.conf:ClientAliveInterval
    600 Verify the runtime value of "ClientAliveInterval" with the following command: $ sudo sshd -T |
    grep -i clientaliveinterval clientaliveinterval 600 If "ClientAliveInterval" does not exist, does
    not have a value of "600" or less in "/etc/ssh/sshd_config", or is commented out, this is a finding.'
  inputs: []
  evidence: []
