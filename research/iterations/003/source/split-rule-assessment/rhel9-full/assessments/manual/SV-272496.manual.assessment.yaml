assessment:
  id: SV-272496.manual
  version: 1
  assessment_title: null
  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'Verify RHEL 9 elevates the SELinux context when an administrator calls the sudo command
    with the following command: This command must be run as root: # grep -r sysadm_r /etc/sudoers /etc/sudoers.d
    %{designated_group_or_user_name} ALL=(ALL) TYPE=sysadm_t ROLE=sysadm_r ALL If a designated sudoers
    administrator group or account(s) is not configured to elevate the SELinux type and role to "sysadm_t"
    and "sysadm_r" with the use of the sudo command, this is a finding.'
  inputs: []
  evidence: []
