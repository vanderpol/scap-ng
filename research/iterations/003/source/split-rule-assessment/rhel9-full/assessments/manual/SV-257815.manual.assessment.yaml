assessment:
  id: SV-257815.manual
  version: 1
  assessment_title: null
  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'Note: If kernel dumps are disabled in accordance with RHEL-09-213040, this requirement is
    not applicable. Verify RHEL 9 is not configured to acquire, save, or process core dumps with the following
    command: $ sudo systemctl status systemd-coredump.socket systemd-coredump.socket Loaded: masked (Reason:
    Unit systemd-coredump.socket is masked.) Active: inactive (dead) If the "systemd-coredump.socket"
    is loaded and not masked, and the need for core dumps is not documented with the information system
    security officer (ISSO) as an operational requirement, this is a finding.'
  inputs: []
  evidence: []
