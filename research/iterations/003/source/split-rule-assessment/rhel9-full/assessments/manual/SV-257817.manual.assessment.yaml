  version: 1
  assessment_title: null
  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'Verify ExecShield is enabled on 64-bit RHEL 9 systems. Run the following command: $ grep
    ^flags /proc/cpuinfo | grep -Ev ''([^[:alnum:]])(nx)([^[:alnum:]]|$)'' If any output is returned,
    this is a finding. Next, run the following command: $ sudo grubby --info=ALL | grep args | grep -E
    ''([^[:alnum:]])(noexec)([^[:alnum:]])'' If any output is returned, this is a finding.'
