assessment:
  id: SV-257951.manual
  version: 1
  assessment_title: null
  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'If postfix is not installed, this is Not Applicable. Verify RHEL 9 is configured to prevent
    unrestricted mail relaying with the following command: $ postconf -n smtpd_client_restrictions smtpd_client_restrictions
    = permit_mynetworks,reject If the "smtpd_client_restrictions" parameter contains any entries other
    than "permit_mynetworks" and "reject", and the additional entries have not been documented with the
    information system security officer (ISSO), this is a finding.'
  inputs: []
  evidence: []
