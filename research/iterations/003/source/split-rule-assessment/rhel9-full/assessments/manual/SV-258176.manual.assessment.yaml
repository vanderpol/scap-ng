assessment:
  id: SV-258176.manual
  version: 1
  assessment_title: null
  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'Verify RHEL 9 is configured to audit the execution of the "execve" system call with the
    following command: $ sudo auditctl -l | grep execve -a always,exit -F arch=b32 -S execve -C uid!=euid
    -F euid=0 -k execpriv -a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -k execpriv -a always,exit
    -F arch=b32 -S execve -C gid!=egid -F egid=0 -k execpriv -a always,exit -F arch=b64 -S execve -C gid!=egid
    -F egid=0 -k execpriv If the command does not return all lines, or the lines are commented out, this
    is a finding.'
  inputs: []
  evidence: []
