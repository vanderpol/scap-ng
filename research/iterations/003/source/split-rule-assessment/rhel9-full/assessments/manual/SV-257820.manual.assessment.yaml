assessment:
  id: SV-257820.manual
  version: 1
  assessment_title: null
  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'Verify that dnf always checks the GPG signature of software packages originating from external
    software repositories before installation: $ grep -w gpgcheck /etc/dnf/dnf.conf gpgcheck=1 If "gpgcheck"
    is not set to "1", or if the option is missing or commented out, ask the system administrator how
    the GPG signatures of software packages are being verified. If there is no process to verify GPG signatures
    that is approved by the organization, this is a finding.'
  inputs: []
  evidence: []
