assessment:
  id: SV-257971.manual
  version: 1
  assessment_title: null
  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'Verify RHEL 9 does not accept router advertisements on all IPv6 interfaces, unless the system
    is a router. Note: If IPv6 is disabled on the system, this requirement is Not Applicable. Check that
    "net.ipv6.conf.all.accept_ra" is set to not accept router advertisements by using the following command:
    $ sudo sysctl net.ipv6.conf.all.accept_ra net.ipv6.conf.all.accept_ra = 0 If "net.ipv6.conf.all.accept_ra"
    is not set to "0" or is missing, this is a finding.'
  inputs: []
  evidence: []
