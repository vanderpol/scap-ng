assessment:
  id: SV-257890.manual
  version: 1
  assessment_title: null
  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'Verify the assigned home directory of all local interactive users has a mode of "0750" or
    less permissive with the following command: Note: This may miss interactive users that have been assigned
    a privileged user identifier (UID). Evidence of interactive use may be obtained from a number of log
    files containing system logon information. $ stat -L -c ''%a %n'' $(awk -F: ''($3>=1000)&&($7 !~ /nologin/){print
    $6}'' /etc/passwd) 2>/dev/null 700 /home/disauser If home directories referenced in "/etc/passwd"
    do not have a mode of "0750" or less permissive, this is a finding.'
  inputs: []
  evidence: []
