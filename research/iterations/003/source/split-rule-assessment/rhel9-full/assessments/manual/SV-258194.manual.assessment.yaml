  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'Verify that RHEL 9 is configured to audit the execution of the "gpasswd" command with the
    following command: $ sudo auditctl -l | grep gpasswd -a always,exit -S all -F path=/usr/bin/gpasswd
    -F perm=x -F auid>=1000 -F auid!=-1 -F key=privileged-gpasswd If the command does not return a line,
    or the line is commented out, this is a finding.'
