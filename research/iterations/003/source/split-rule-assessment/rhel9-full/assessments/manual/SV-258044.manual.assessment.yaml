assessment:
  id: SV-258044.manual
  version: 1
  assessment_title: null
  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'Verify that the default umask for all local interactive users is "077". Identify the locations
    of all local interactive user home directories by looking at the "/etc/passwd" file. Check all local
    interactive user initialization files for interactive users with the following command: Note: The
    example is for a system that is configured to create users home directories in the "/home" directory.
    $ sudo find /home -maxdepth 2 -type f -name ".[^.]*" -exec grep -iH -d skip --exclude=.bash_history
    umask {} \; /home/disauser/.bash_history:grep -i umask /etc/bashrc /etc/csh.cshrc /etc/profile /home/disauser/.bash_history:grep
    -i umask /etc/login.defs If any local interactive user initialization files are found to have a umask
    statement that sets a value less restrictive than "077", this is a finding.'
  inputs: []
  evidence: []
