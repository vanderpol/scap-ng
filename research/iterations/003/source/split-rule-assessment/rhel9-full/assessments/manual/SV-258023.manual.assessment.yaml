assessment:
  id: SV-258023.manual
  version: 1
  assessment_title: null
  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'Verify RHEL 9 initiates a session lock after a 10-minute period of inactivity for graphical
    user interfaces with the following command: Note: This requirement assumes the use of the RHEL 9 default
    graphical user interface, the GNOME desktop environment. If the system does not have any graphical
    user interface installed, this requirement is Not Applicable. $ sudo gsettings get org.gnome.desktop.session
    idle-delay uint32 600 If "idle-delay" is set to "0" or a value greater than "600", this is a finding.'
  inputs: []
  evidence: []
