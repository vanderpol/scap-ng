  purpose: assessment
  procedure: 'Verify the SSH daemon provides users with feedback on when account accesses last occurred
    with the following command: $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d
    ''\r'' | tr ''\n'' '' '' | xargs sudo grep -iH ''^\s*printlastlog'' PrintLastLog yes If the "PrintLastLog"
    keyword is set to "no", the returned line is commented out, or no output is returned, this is a finding.'
