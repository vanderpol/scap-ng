assessment:
  id: linux.postfix-installed.assessment
  version: 1
  assessment_title: Linux with postfix installed
  mode: automated
  class: inventory
  purpose: applicability
  checks:
    postfix-package-installed:
      test_title: The postfix package is installed
      collect:
        object_title: null
        capability: linux.rpminfo
        select:
          name: postfix
      assert:
        state_title: null
        existence: at_least_one_exists
        check: all
        state: null
  evaluate:
    check: postfix-package-installed
