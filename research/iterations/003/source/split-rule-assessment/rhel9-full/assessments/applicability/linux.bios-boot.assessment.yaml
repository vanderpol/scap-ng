assessment:
  id: linux.bios-boot.assessment
  version: 6
  assessment_title: Linux BIOS Boot
  mode: automated
  class: inventory
  purpose: applicability
  checks:
    sys-firmware-efi-does-not-exist:
      test_title: /sys/firmware/efi does not exist
      collect:
        object_title: null
        capability: unix.file
        select:
          path:
            datatype: string
            value: /sys/firmware/efi
          filename:
            nil: true
            value: ''
      assert:
        existence: none_exist
        check: all
        state: null
  evaluate:
    check: sys-firmware-efi-does-not-exist
