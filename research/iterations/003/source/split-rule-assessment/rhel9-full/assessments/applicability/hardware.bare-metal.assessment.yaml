assessment:
  id: hardware.bare-metal.assessment
  version: 13
  assessment_title: Host appears to be bare metal, not virtual.
  mode: automated
  class: compliance
  deprecated: false
  purpose: applicability
  checks:
    query-lscpu-indication-hypervisor-vendor:
      test_title: Query lscpu for indication of a hypervisor vendor.
      capability: independent.shellcommand
      collect:
        object_title: Retrieve usbguard rules list.
        capability: independent.shellcommand
        select:
          shell:
            operation: equals
            datatype: string
            mask: false
            value: bash
          command:
            operation: equals
            datatype: string
            mask: false
            value: lscpu | grep -P '(?i)hypervisor\s+vendor:\s+\S'
      assert:
        existence: at_least_one_exists
        check: at least one
        state:
          field: stdout_line
          value: ''
          operation: equals
          datatype: string
          mask: false
          entity_check: all
          entity_existence: none_exist
        state_title: Confirm the existence of hypervisor line.
        state_capability: independent.shellcommand
  evaluate:
    check: query-lscpu-indication-hypervisor-vendor
