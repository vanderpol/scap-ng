assessment:
  id: linux.libreswan-installed.assessment
  version: 1
  assessment_title: Linux with Libreswan installed
  mode: automated
  class: inventory
  purpose: applicability
  checks:
    libreswan-package-installed:
      test_title: The libreswan package is installed.
      collect:
        object_title: null
        capability: linux.rpminfo
        select:
          name: libreswan
      assert:
        existence: at_least_one_exists
        check: all
        state: null
  evaluate:
    check: libreswan-package-installed
