assessment:
  id: linux.fips-disabled.assessment
  version: 4
  assessment_title: RHEL9 and Not FIPS
  mode: automated
  class: compliance
  purpose: applicability
  checks:
    fips-enabled-1:
      test_title: fips_enabled == 1
      collect:
        object_title: /proc/sys/crypto/fips_enabled
        capability: independent.textfilecontent54
        select:
          filepath:
            datatype: string
            value: /proc/sys/crypto/fips_enabled
          pattern:
            operation: pattern match
            value: ^(\d+)$
          instance:
            operation: greater than or equal
            datatype: int
            value: '1'
      assert:
        existence: all_exist
        check: all
        state:
          field: subexpression
          operation: equals
          value: '1'
          datatype: int
  evaluate:
    not:
      check: fips-enabled-1
