assessment:
  id: linux.tftp-installed.assessment
  version: 1
  assessment_title: Linux with TFTP installed
  mode: automated
  class: compliance
  deprecated: false
  purpose: applicability
  checks:
    tftp-server-package-iinstalled:
      test_title: The tftp-server package is iinstalled.
      collect:
        object_title: null
        capability: linux.rpminfo
        select:
          name: tftp-server
      assert:
        existence: at_least_one_exists
        check: all
        state: null
  evaluate:
    check: tftp-server-package-iinstalled
