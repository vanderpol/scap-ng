assessment:
  id: linux.bind-installed.assessment
  version: 1
  assessment_title: Linux with BIND installed
  mode: automated
  class: inventory
  purpose: applicability
  checks:
    bind-installed:
      test_title: BIND installed
      collect:
        object_title: bind
        capability: linux.rpminfo
        select:
          name: bind
      assert:
        state_title: null
        existence: at_least_one_exists
        check: all
        state: null
  evaluate:
    check: bind-installed
