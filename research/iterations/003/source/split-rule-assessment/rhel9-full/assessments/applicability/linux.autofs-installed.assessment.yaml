assessment:
  id: linux.autofs-installed.assessment
  version: 1
  assessment_title: Linux with autofs installed
  mode: automated
  class: inventory
  purpose: applicability
  checks:
    autofs-package-installed:
      test_title: The autofs package is installed.
      collect:
        object_title: null
        capability: linux.rpminfo
        select:
          name: autofs
      assert:
        existence: at_least_one_exists
        check: all
        state: null
  evaluate:
    check: autofs-package-installed
