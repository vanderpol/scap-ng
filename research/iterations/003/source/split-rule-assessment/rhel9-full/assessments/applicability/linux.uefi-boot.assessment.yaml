assessment:
  id: linux.uefi-boot.assessment
  version: 6
  assessment_title: Linux UEFI Boot
  mode: automated
  class: inventory
  purpose: applicability
  checks:
    sys-firmware-efi-exists:
      test_title: /sys/firmware/efi exists
      collect:
        object_title: null
        capability: unix.file
