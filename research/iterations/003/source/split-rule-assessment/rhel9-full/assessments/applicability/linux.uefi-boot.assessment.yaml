assessment:
  id: linux.uefi-boot.assessment
  version: 6
  assessment_title: Linux UEFI Boot
  mode: automated
  class: inventory
  purpose: applicability
  checks:
    sys-firmware-efi-exists:
      test_title: /sys/firmware/efi exists
      capability: unix.file
      collect:
        object_title: null
        capability: unix.file
        select:
          path:
            operation: equals
            datatype: string
            mask: false
            value: /sys/firmware/efi
          filename:
            operation: equals
            datatype: string
            mask: false
            nil: true
            value: ''
      assert:
        existence: all_exist
        check: all
        state: null
  evaluate:
    check: sys-firmware-efi-exists
