    value: CCI-000381
  - scheme: disa-stig-id
    value: RHEL-09-215040
  - scheme: disa-vulnerability-id
    value: V-257831
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Remove the telnet-server package with the following command: $ sudo dnf remove telnet-server'
  checks:
