rule:
  id: SV-258068
  version: r1101950
  title: RHEL 9 must automatically exit interactive command shell user sessions after 10 minutes of inactivity.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'Terminating an idle interactive command shell user session within a short time period reduces
    the window of opportunity for unauthorized personnel to take control of it when left unattended in
    a virtual terminal or physical console. Satisfies: SRG-OS-000163-GPOS-00072, SRG-OS-000029-GPOS-00010'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000057
  - scheme: cci
    value: CCI-001133
  - scheme: disa-stig-id
    value: RHEL-09-412035
  - scheme: disa-vulnerability-id
    value: V-258068
  - scheme: disa-srg-id
    value: SRG-OS-000163-GPOS-00072
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to exit interactive command shell user sessions after 10 minutes of inactivity.
      Add or edit the following line in "/etc/profile.d/tmout.sh": #!/bin/bash declare -xr TMOUT=600'
  checks:
    default: SV-258068.automated
    automated: SV-258068.automated
    manual: SV-258068.manual
  default_check: default
