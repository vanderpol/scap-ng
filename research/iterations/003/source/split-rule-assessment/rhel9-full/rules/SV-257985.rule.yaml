rule:
  id: SV-257985
  version: r1069364
  title: RHEL 9 must not permit direct logons to the root account using remote access via SSH.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'Even though the communications channel may be encrypted, an additional layer of security
    is gained by extending the policy of not logging directly on as root. In addition, logging in with
    a user-specific account provides individual accountability of actions performed on the system and
    also helps to minimize direct attack attempts on root''s password. Satisfies: SRG-OS-000109-GPOS-00056,
    SRG-OS-000480-GPOS-00227'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-004045
  - scheme: cci
    value: CCI-000770
  - scheme: disa-stig-id
    value: RHEL-09-255045
  - scheme: disa-vulnerability-id
    value: V-257985
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'To configure the system to prevent SSH users from logging on directly as root add or modify
      the following line in "/etc/ssh/sshd_config" or in a file in "/etc/ssh/sshd_config.d". PermitRootLogin
      no Restart the SSH daemon for the settings to take effect: $ sudo systemctl restart sshd.service'
  checks:
    manual: SV-257985.manual
  default_check: manual
