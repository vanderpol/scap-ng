rule:
  id: SV-257789
  version: r1137691
  title: RHEL 9 must require a unique superusers name upon booting into single-user and maintenance modes.
  severity: high
  role: null
  weight: 10.0
  discussion: Having a nondefault grub superuser username makes password-guessing attacks less effective.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000213
  - scheme: disa-stig-id
    value: RHEL-09-212020
  - scheme: disa-vulnerability-id
    value: V-257789
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to have a unique username for the grub superuser account. Edit the "/etc/grub.d/01_users"
      file and add or modify the following lines with a nondefault username for the superuser account:
      set superusers="<accountname>" export superusers Once the superuser account has been added, update
      the grub.cfg file by running: In RHEL 9.0, 9.1 and 9.2: sudo grub2-mkconfig -o /boot/grub2/grub.cfg
      In RHEL 9.3 and later: sudo grub2-mkconfig -o /boot/grub2/grub.cfg --update-bls-cmdline'
  checks:
    default: SV-257789.automated
    automated: SV-257789.automated
    manual: SV-257789.manual
  default_check: default
