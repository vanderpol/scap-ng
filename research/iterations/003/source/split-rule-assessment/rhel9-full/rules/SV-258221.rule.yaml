  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to generate audit records for all account creations, modifications, disabling,
      and termination events that affect "/etc/security/opasswd". Add or update the following file system
      rule to "/etc/audit/rules.d/audit.rules": -a always,exit -F arch=b32 -F path=/etc/opasswd -F perm=wa
      -k identity -a always,exit -F arch=b64 -F path=/etc/opasswd -F perm=wa -k identity To load the rules
      to the kernel immediately, use the following command: $ sudo augenrules --load'
  checks:
    manual: SV-258221.manual
  default_check: manual
