rule:
  id: SV-257823
  version: r1155641
  title: RHEL 9 must be configured so that the cryptographic hashes of system files match vendor values.
  severity: medium
  role: null
  weight: 10.0
  discussion: The hashes of important files such as system executables should match the information given
    by the RPM database. Executables with erroneous hashes could be a sign of nefarious activity on the
    system. If the Check Text command returns results from third-party software vendors, it is an indication
    that the vendor is not implementing their rpm packages correctly and this must be corrected by the
    software vendor.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-214030
  - scheme: disa-vulnerability-id
    value: V-257823
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 so that the cryptographic hashes of system files match vendor values.
      Given output from the check command, identify the package that provides the output and reinstall
      it. The following trimmed example output shows a package that has failed verification, been identified,
      and been reinstalled: $ sudo rpm -Va --noconfig | awk ''$1 ~ /..5/ && $2 != "c"'' S.5....T. /usr/bin/znew
      $ sudo dnf provides /usr/bin/znew [...] gzip-1.10-8.el9.x86_64 : The GNU data compression program
      [...] $ sudo dnf -y reinstall gzip [...] $ sudo rpm -Va --noconfig | awk ''$1 ~ /..5/ && $2 != "c"''
      [no output]'
  checks:
    default: SV-257823.automated
    automated: SV-257823.automated
    manual: SV-257823.manual
  default_check: default
