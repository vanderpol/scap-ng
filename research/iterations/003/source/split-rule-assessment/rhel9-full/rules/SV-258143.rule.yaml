rule:
  id: SV-258143
  version: r1184329
  title: RHEL 9 must be configured so that the rsyslog daemon does not accept log messages from other
    servers unless the server is being used for log aggregation.
  severity: medium
  role: null
  weight: 10.0
  discussion: Unintentionally running a rsyslog server accepting remote messages puts the system at increased
    risk. Malicious rsyslog messages sent to the server could exploit vulnerabilities in the server software
    itself, could introduce misleading information into the system's logs, or could fill the system's
    storage leading to a denial of service. If the system is intended to be a log aggregation server,
    its use must be documented with the information system security officer (ISSO).
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-652025
  - scheme: disa-vulnerability-id
    value: V-258143
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to not receive remote logs using rsyslog. Remove the lines in /etc/rsyslog.conf
      and any files in the /etc/rsyslog.d directory that match any of the following: InputTCPServerRun
      UDPServerRun RELPServerRun module(load="imtcp") module(load="imudp") module(load="imrelp") input(type="imudp"
      port="514") input(type="imtcp" port="514") input(type="imrelp" port="514") The rsyslog daemon must
      be restarted for the changes to take effect: $ sudo systemctl restart rsyslog.service'
  checks:
    default: SV-258143.automated
    automated: SV-258143.automated
    manual: SV-258143.manual
  default_check: default
