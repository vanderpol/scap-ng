rule:
  id: SV-258158
  version: r971542
  title: RHEL 9 must take action when allocated audit record storage volume reaches 95 percent of the
    audit record storage capacity.
  severity: medium
  role: null
  weight: 10.0
  discussion: If action is not taken when storage volume reaches 95 percent utilization, the auditing
    system may fail when the storage volume reaches capacity.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-001855
  - scheme: disa-stig-id
    value: RHEL-09-653045
  - scheme: disa-vulnerability-id
    value: V-258158
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure RHEL 9 to initiate an action when allocated audit record storage volume reaches
      95 percent of the repository maximum audit record storage capacity by adding/modifying the following
      line in the /etc/audit/auditd.conf file. admin_space_left = 5%
  checks:
    default: SV-258158.automated
    automated: SV-258158.automated
    manual: SV-258158.manual
  default_check: default
