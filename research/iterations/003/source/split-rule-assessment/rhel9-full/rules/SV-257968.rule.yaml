rule:
  id: SV-257968
  version: r1155748
  title: RHEL 9 must not send Internet Control Message Protocol (ICMP) redirects.
  severity: medium
  role: null
  weight: 10.0
  discussion: ICMP redirect messages are used by routers to inform hosts that a more direct route exists
    for a particular destination. These messages contain information from the system's route table possibly
    revealing portions of the network topology. The ability to send ICMP redirects is only appropriate
    for systems acting as routers. The sysctl --system command will load settings from all system configuration
    files. All configuration files are sorted by their filename in lexicographical order, regardless of
    the directories in which they reside. If multiple files specify the same option, the entry in the
    file with the lexicographically latest name will take precedence. Files are read from directories
    in the following list from top to bottom. Once a file of a given filename is loaded, any file of the
    same name in subsequent directories is ignored. /etc/sysctl.d/*.conf /run/sysctl.d/*.conf /usr/local/lib/sysctl.d/*.conf
    /usr/lib/sysctl.d/*.conf /lib/sysctl.d/*.conf /etc/sysctl.conf
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-253065
  - scheme: disa-vulnerability-id
    value: V-257968
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to not allow interfaces to perform IPv4 ICMP redirects. Create a configuration
      file if it does not already exist: $ sudo vi /etc/sysctl.d/ipv4_send_redirects.conf Add the following
      line to the file: net.ipv4.conf.all.send_redirects = 0 Reload settings from all system configuration
      files with the following command: $ sudo sysctl --system'
  checks:
    manual: SV-257968.manual
  default_check: manual
