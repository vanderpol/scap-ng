rule:
  id: SV-257982
  version: r1045021
  title: RHEL 9 must log SSH connection attempts and failures to the server.
  severity: medium
  role: null
  weight: 10.0
  discussion: SSH provides several logging levels with varying amounts of verbosity. "DEBUG" is specifically
    not recommended other than strictly for debugging SSH communications since it provides so much data
    that it is difficult to identify important security information. "INFO" or "VERBOSE" level is the
    basic level that only records login activity of SSH users. In many situations, such as Incident Response,
    it is important to determine when a particular user was active on a system. The logout record can
    eliminate those users who disconnected, which helps narrow the field.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000067
  - scheme: disa-stig-id
    value: RHEL-09-255030
  - scheme: disa-vulnerability-id
    value: V-257982
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to log connection attempts add or modify the following line in "/etc/ssh/sshd_config"
      or in a file in "/etc/ssh/sshd_config.d". LogLevel VERBOSE Restart the SSH daemon for the settings
      to take effect: $ sudo systemctl restart sshd.service'
  checks:
    manual: SV-257982.manual
  default_check: manual
