rule:
  id: SV-257843
  version: r991589
  title: A separate RHEL 9 file system must be used for user home directories (such as /home or an equivalent).
  severity: medium
  role: null
  weight: 10.0
  discussion: Ensuring that "/home" is mounted on its own partition enables the setting of more restrictive
    mount options, and also helps ensure that users cannot trivially fill partitions used for log or audit
    data storage.
