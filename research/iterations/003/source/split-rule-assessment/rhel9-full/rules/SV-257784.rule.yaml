rule:
  id: SV-257784
  version: r1208766
  title: The systemd Ctrl-Alt-Delete burst key sequence in RHEL 9 must be disabled.
  severity: high
  role: null
  weight: 10.0
  discussion: 'A locally logged-on user who presses Ctrl-Alt-Delete when at the console can reboot the
    system. If accidentally pressed, as could happen in the case of a mixed OS environment, this can create
    the risk of short-term loss of availability of systems due to unintentional reboot. In a graphical
    user environment, risk of unintentional reboot from the Ctrl-Alt-Delete sequence is reduced because
    the user will be prompted before any action is taken. Satisfies: SRG-OS-000324-GPOS-00125, SRG-OS-000480-GPOS-00227'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-002235
  - scheme: disa-stig-id
    value: RHEL-09-211045
  - scheme: disa-vulnerability-id
    value: V-257784
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to disable the CtrlAltDelBurstAction by adding it to a drop file in a
      "/etc/systemd/system.conf.d/" configuration file: If no drop file exists, create one with the following
      command: $ sudo mkdir -p /etc/systemd/system.conf.d && sudo vi /etc/systemd/system.conf.d/55-CtrlAltDel-BurstAction.conf
      Edit the file to contain the setting by adding the following text: CtrlAltDelBurstAction=none Reload
      the daemon for this change to take effect. $ sudo systemctl daemon-reload'
  checks:
    default: SV-257784.automated
    automated: SV-257784.automated
    manual: SV-257784.manual
  default_check: default
