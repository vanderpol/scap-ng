rule:
  id: SV-257993
  version: r1045049
  title: RHEL 9 must not allow users to override SSH environment variables.
  severity: medium
  role: null
  weight: 10.0
  discussion: SSH environment options potentially allow users to bypass access restriction in some configurations.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-255085
  - scheme: disa-vulnerability-id
    value: V-257993
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the RHEL 9 SSH daemon to not allow unattended or automatic logon to the system
      by editing the following line in the "/etc/ssh/sshd_config" or in a file in "/etc/ssh/sshd_config.d":
      PermitUserEnvironment no Restart the SSH daemon for the setting to take effect: $ sudo systemctl
      restart sshd.service'
  checks:
    default: SV-257993.automated
    automated: SV-257993.automated
    manual: SV-257993.manual
  default_check: default
