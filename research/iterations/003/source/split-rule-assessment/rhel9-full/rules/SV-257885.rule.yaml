    value: RHEL-09-232025
  - scheme: disa-vulnerability-id
    value: V-257885
  - scheme: disa-srg-id
    value: SRG-OS-000206-GPOS-00084
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the "/var/log" directory to a mode of "0755" by running the following command:
      $ sudo chmod 0755 /var/log'
