  parameters: {}
  remediation:
    guidance: Configure RHEL 9 to securely compare internal information system clocks at least every 24
      hours with an NTP server by adding/modifying the following line in the /etc/chrony.conf file. server
      [ntp.server.name] iburst maxpoll 16
