  title: RHEL 9 must have the sudo package installed.
  severity: medium
  role: null
  weight: 10.0
  discussion: '"sudo" is a program designed to allow a system administrator to give limited root privileges
    to users and log root activity. The basic philosophy is to give as few privileges as possible but
