rule:
  id: SV-257995
  version: r1045053
  title: RHEL 9 must be configured so that all network connections associated with SSH traffic terminate
    after becoming unresponsive.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'Terminating an unresponsive SSH session within a short time period reduces the window of
    opportunity for unauthorized personnel to take control of a management session enabled on the console
    or console port that has been left unattended. In addition, quickly terminating an idle SSH session
    will also free up resources committed by the managed network element. Terminating network connections
    associated with communications sessions includes, for example, deallocating associated TCP/IP address/port
    pairs at the operating system level and deallocating networking assignments at the application level
    if multiple application sessions are using a single operating system-level network connection. This
    does not mean the operating system terminates all sessions or network access; it only ends the unresponsive
    session and releases the resources associated with that session. RHEL 9 utilizes /etc/ssh/sshd_config
    for configurations of OpenSSH. Within the sshd_config, the product of the values of "ClientAliveInterval"
    and "ClientAliveCountMax" are used to establish the inactivity threshold. The "ClientAliveInterval"
    is a timeout interval in seconds, after which if no data has been received from the client, sshd will
    send a message through the encrypted channel to request a response from the client. The "ClientAliveCountMax"
    is the number of client alive messages that may be sent without sshd receiving any messages back from
    the client. If this threshold is met, sshd will disconnect the client. For more information on these
    settings and others, refer to the sshd_config man pages. Satisfies: SRG-OS-000163-GPOS-00072, SRG-OS-000279-GPOS-00109'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-001133
  - scheme: cci
    value: CCI-002361
  - scheme: disa-stig-id
    value: RHEL-09-255095
  - scheme: disa-vulnerability-id
    value: V-257995
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Note: This setting must be applied in conjunction with RHEL-09-255100 to function correctly.
      Configure the SSH server to terminate a user session automatically after the SSH client has become
      unresponsive. Modify or append the following lines in the "/etc/ssh/sshd_config" or in a file in
      "/etc/ssh/sshd_config.d": ClientAliveCountMax 1 For the changes to take effect, the SSH daemon must
      be restarted. $ sudo systemctl restart sshd.service'
  checks:
    default: SV-257995.automated
    automated: SV-257995.automated
    manual: SV-257995.manual
  default_check: default
