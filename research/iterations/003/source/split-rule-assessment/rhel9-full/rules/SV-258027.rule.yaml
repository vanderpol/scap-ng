rule:
  id: SV-258027
  version: r1045106
  title: RHEL 9 must conceal, via the session lock, information previously visible on the display with
    a publicly viewable image.
  severity: medium
  role: null
  weight: 10.0
  discussion: Setting the screensaver mode to blank-only conceals the contents of the display from passersby.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000060
  - scheme: disa-stig-id
    value: RHEL-09-271085
  - scheme: disa-vulnerability-id
    value: V-258027
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability:
  - linux.gnome-installed
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to prevent a user from overriding the picture-uri setting for graphical
      user interfaces. In the file "/etc/dconf/db/local.d/00-security-settings", add or update the following
      lines: [org/gnome/desktop/screensaver] picture-uri='''' Prevent user modification by adding the
      following line to "/etc/dconf/db/local.d/locks/00-security-settings-lock": /org/gnome/desktop/screensaver/picture-uri
      Update the dconf system databases: $ sudo dconf update'
  checks:
    manual: SV-258027.manual
  default_check: manual
