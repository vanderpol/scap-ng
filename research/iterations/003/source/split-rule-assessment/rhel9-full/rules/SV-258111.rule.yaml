rule:
  id: SV-258111
  version: r1045226
  title: RHEL 9 must enforce password complexity by requiring that at least one uppercase character be
    used.
  severity: medium
  role: null
  weight: 10.0
  discussion: Use of a complex password helps to increase the time and resources required to compromise
    the password. Password complexity, or strength, is a measure of the effectiveness of a password in
    resisting attempts at guessing and brute-force attacks. Password complexity is one factor of several
    that determines how long it takes to crack a password. The more complex the password, the greater
    the number of possible combinations that need to be tested before the password is compromised. Requiring
    a minimum number of uppercase characters makes password guessing attacks more difficult by ensuring
    a larger search space.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-004066
  - scheme: cci
    value: CCI-000192
  - scheme: disa-stig-id
    value: RHEL-09-611110
  - scheme: disa-vulnerability-id
    value: V-258111
  - scheme: disa-srg-id
    value: SRG-OS-000069-GPOS-00037
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to enforce password complexity by requiring that at least one uppercase
      character be used by setting the "ucredit" option. Add or update the following line in the "/etc/security/pwquality.conf"
      file or a configuration file in the "/etc/security/pwquality.conf.d/" directory to contain the "ucredit"
      parameter: ucredit = -1'
  checks:
    default: SV-258111.automated
    automated: SV-258111.automated
