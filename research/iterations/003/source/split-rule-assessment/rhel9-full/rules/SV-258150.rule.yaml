rule:
  id: SV-258150
  version: r1045296
  title: RHEL 9 must use cron logging.
  severity: medium
  role: null
  weight: 10.0
  discussion: Cron logging can be used to trace the successful or unsuccessful execution of cron jobs.
    It can also be used to spot intrusions into the use of the cron facility by unauthorized and malicious
    users.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-652060
  - scheme: disa-vulnerability-id
    value: V-258150
  - scheme: disa-srg-id
    value: SRG-OS-000480-GPOS-00227
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure "rsyslog" to log all cron messages by adding or updating the following line to
      "/etc/rsyslog.conf" or a configuration file in the /etc/rsyslog.d/ directory: cron.* /var/log/cron
      The rsyslog daemon must be restarted for the changes to take effect: $ sudo systemctl restart rsyslog.service'
  checks:
    default: SV-258150.manual
    manual: SV-258150.manual
  default_check: default
