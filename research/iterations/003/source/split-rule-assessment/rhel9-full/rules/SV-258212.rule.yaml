rule:
  id: SV-258212
  version: r1045421
  title: Successful/unsuccessful uses of the poweroff command in RHEL 9 must generate an audit record.
  severity: medium
  role: null
  weight: 10.0
  discussion: Misuse of the poweroff command may cause availability issues for the system.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000172
  - scheme: disa-stig-id
    value: RHEL-09-654190
  - scheme: disa-vulnerability-id
    value: V-258212
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the audit system to generate an audit event for any successful/unsuccessful uses
      of the "poweroff" command by adding or updating the following rule in the "/etc/audit/rules.d/audit.rules"
      file: -a always,exit -F path=/usr/sbin/poweroff -F perm=x -F auid>=1000 -F auid!=unset -k privileged-poweroff
      To load the rules to the kernel immediately, use the following command: $ sudo augenrules --load'
  checks:
    default: SV-258212.automated
    automated: SV-258212.automated
    manual: SV-258212.manual
  default_check: default
