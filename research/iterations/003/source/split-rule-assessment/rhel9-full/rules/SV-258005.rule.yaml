rule:
  id: SV-258005
  version: r1045069
  title: RHEL 9 SSH daemon must not allow rhosts authentication.
  severity: medium
  role: null
  weight: 10.0
  discussion: SSH trust relationships mean a compromise on one host can allow an attacker to move trivially
    to other hosts.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-255145
  - scheme: disa-vulnerability-id
    value: V-258005
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the SSH daemon to not allow rhosts authentication. Add the following line to
      "/etc/ssh/sshd_config" or to a file in "/etc/ssh/sshd_config.d", or uncomment the line and set the
      value to "yes": IgnoreRhosts yes The SSH service must be restarted for changes to take effect: $
      sudo systemctl restart sshd.service'
  checks:
    manual: SV-258005.manual
  default_check: manual
