rule:
  id: SV-257944
  version: r1038944
  title: RHEL 9 chronyd service must be enabled.
  severity: medium
  role: null
  weight: 10.0
  discussion: Inaccurate time stamps make it more difficult to correlate events and can lead to an inaccurate
    analysis. Determining the correct time a particular event occurred on a system is critical when conducting
    forensic analysis and investigating system events. Sources outside the configured acceptable allowance
    (drift) may be inaccurate. Synchronizing internal information system clocks provides uniformity of
    time stamps for information systems with multiple system clocks and systems connected over a network.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
