rule:
  id: SV-258147
  version: r1045290
  title: RHEL 9 must encrypt the transfer of audit records offloaded onto a different system or media
    from the system being audited via rsyslog.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'Information stored in one location is vulnerable to accidental or incidental deletion or
    alteration. Offloading is a common process in information systems with limited audit storage capacity.
    RHEL 9 installation media provides "rsyslogd", a system utility providing support for message logging.
    Support for both internet and Unix domain sockets enables this utility to support both local and remote
    logging. Coupling this utility with "gnutls" (a secure communications library implementing the SSL,
    TLS and DTLS protocols) creates a method to securely encrypt and offload auditing. "Rsyslog" supported
    authentication modes include: anon - anonymous authentication x509/fingerprint - certificate fingerprint
    authentication x509/certvalid - certificate validation only x509/name - certificate validation and
    subject name authentication Satisfies: SRG-OS-000342-GPOS-00133, SRG-OS-000479-GPOS-00224'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-001851
  - scheme: disa-stig-id
    value: RHEL-09-652045
  - scheme: disa-vulnerability-id
    value: V-258147
  - scheme: disa-srg-id
    value: SRG-OS-000342-GPOS-00133
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to encrypt offloaded audit records via rsyslog by setting the following
      options in "/etc/rsyslog.conf" or "/etc/rsyslog.d/[customfile].conf": $ActionSendStreamDriverMode
      1'
  checks:
    default: SV-258147.automated
    automated: SV-258147.automated
    manual: SV-258147.manual
  default_check: default
