rule:
  id: SV-258174
  version: r958424
  title: RHEL 9 must have mail aliases to notify the information system security officer (ISSO) and system
    administrator (SA) (at a minimum) in the event of an audit processing failure.
  severity: medium
  role: null
  weight: 10.0
  discussion: It is critical for the appropriate personnel to be aware if a system is at risk of failing
    to process audit logs as required. Without this notification, the security personnel may be unaware
    of an impending failure of the audit capability, and system operation may be adversely affected. Audit
    processing failures include software/hardware errors, failures in the audit capturing mechanisms,
    and audit storage capacity being reached or exceeded. This requirement applies to each audit data
    storage repository (i.e., distinct information system component where audit records are stored), the
    centralized audit storage capacity of organizations (i.e., all audit data storage repositories combined),
    or both.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000139
  - scheme: disa-stig-id
    value: RHEL-09-653125
  - scheme: disa-vulnerability-id
    value: V-258174
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Edit the aliases map file (by default /etc/aliases) used by Postfix and configure a root
      alias (using the user ISSO as an example): root: ISSO and then update the aliases database with
      the command: $ sudo newaliases'
  checks:
    manual: SV-258174.manual
  default_check: manual
