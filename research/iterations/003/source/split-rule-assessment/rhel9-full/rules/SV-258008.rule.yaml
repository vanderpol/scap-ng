rule:
  id: SV-258008
  version: r1045075
  title: RHEL 9 SSH daemon must perform strict mode checking of home directory configuration files.
  severity: medium
  role: null
  weight: 10.0
  discussion: If other users have access to modify user-specific SSH configuration files, they may be
    able to log into the system as another user.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-255160
  - scheme: disa-vulnerability-id
    value: V-258008
  - scheme: disa-srg-id
    value: SRG-OS-000480-GPOS-00227
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the SSH daemon to perform strict mode checking of home directory configuration
      files. Add the following line to "/etc/ssh/sshd_config" or to a file in "/etc/ssh/sshd_config.d",
      or uncomment the line and set the value to "yes": StrictModes yes The SSH service must be restarted
      for changes to take effect: $ sudo systemctl restart sshd.service'
  checks:
    default: SV-258008.automated
    automated: SV-258008.automated
    manual: SV-258008.manual
  default_check: default
