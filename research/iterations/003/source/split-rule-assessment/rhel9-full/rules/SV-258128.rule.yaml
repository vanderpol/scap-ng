rule:
  id: SV-258128
  version: r1155626
  title: RHEL 9 must require authentication to access emergency mode.
  severity: medium
  role: null
  weight: 10.0
  discussion: To mitigate the risk of unauthorized access to sensitive information by entities that have
    been issued certificates by DOD-approved PKIs, all DOD systems (e.g., web servers and web portals)
    must be properly configured to incorporate access control methods that do not rely solely on the possession
    of a certificate for access. Successful authentication must not automatically give an entity access
    to an asset or security boundary. Authorization procedures and controls must be implemented to ensure
    each authenticated entity also has a validated and current authorization. Authorization is the process
    of determining whether an entity, once authenticated, is permitted to access a specific asset. Information
    systems use access control policies and enforcement mechanisms to implement this requirement. This
    requirement prevents attackers with physical access from trivially bypassing security on the machine
    and gaining root access. Such accesses are further prevented by configuring the bootloader password.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000213
  - scheme: disa-stig-id
    value: RHEL-09-611195
  - scheme: disa-vulnerability-id
    value: V-258128
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
