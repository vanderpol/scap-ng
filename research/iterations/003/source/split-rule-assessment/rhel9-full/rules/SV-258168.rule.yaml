rule:
  id: SV-258168
  version: r958428
  title: RHEL 9 must periodically flush audit records to disk to prevent the loss of audit records.
  severity: medium
  role: null
  weight: 10.0
  discussion: If option "freq" is not set to a value that requires audit records being written to disk
    after a threshold number is reached, then audit records may be lost.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000154
  - scheme: disa-stig-id
    value: RHEL-09-653095
  - scheme: disa-vulnerability-id
    value: V-258168
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to flush audit to disk by adding or updating the following rule in "/etc/audit/auditd.conf":
      freq = 100 The audit daemon must be restarted for the changes to take effect.'
  checks:
    manual: SV-258168.manual
  default_check: manual
