rule:
  id: SV-257896
  version: r991589
  title: RHEL 9 /etc/passwd- file must have mode 0644 or less permissive to prevent unauthorized access.
  severity: medium
  role: null
  weight: 10.0
  discussion: The "/etc/passwd-" file is a backup file of "/etc/passwd", and as such, contains information
    about the users that are configured on the system. Protection of this file is critical for system
    security.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-232080
  - scheme: disa-vulnerability-id
    value: V-257896
  - scheme: disa-srg-id
    value: SRG-OS-000480-GPOS-00227
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Change the mode of the file "/etc/passwd-" to "0644" by running the following command:
      $ sudo chmod 0644 /etc/passwd-'
  checks:
    default: SV-257896.automated
    automated: SV-257896.automated
    manual: SV-257896.manual
  default_check: default
