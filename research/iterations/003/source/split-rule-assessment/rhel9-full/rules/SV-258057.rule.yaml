rule:
  id: SV-258057
  version: r1045146
  title: RHEL 9 must maintain an account lock until the locked account is released by an administrator.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'By limiting the number of failed logon attempts the risk of unauthorized system access
    via user password guessing, otherwise known as brute-forcing, is reduced. Limits are imposed by locking
    the account. Satisfies: SRG-OS-000329-GPOS-00128, SRG-OS-000021-GPOS-00005'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000044
  - scheme: cci
    value: CCI-002238
  - scheme: disa-stig-id
    value: RHEL-09-411090
  - scheme: disa-vulnerability-id
    value: V-258057
  - scheme: disa-srg-id
    value: SRG-OS-000329-GPOS-00128
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to lock an account until released by an administrator after three unsuccessful
      logon attempts with the command: $ sudo authselect enable-feature with-faillock Edit the "/etc/security/faillock.conf"
      file as follows: unlock_time = 0'
  checks:
    default: SV-258057.automated
    automated: SV-258057.automated
    manual: SV-258057.manual
  default_check: default
