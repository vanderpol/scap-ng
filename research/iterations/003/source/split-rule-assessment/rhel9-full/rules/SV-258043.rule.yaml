rule:
  id: SV-258043
  version: r991589
  title: All RHEL 9 local interactive user accounts must be assigned a home directory upon creation.
  severity: medium
  role: null
  weight: 10.0
  discussion: If local interactive users are not assigned a valid home directory, there is no place for
    the storage and control of files they should own.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
