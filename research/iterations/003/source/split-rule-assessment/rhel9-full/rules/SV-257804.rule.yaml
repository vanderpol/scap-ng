rule:
  id: SV-257804
  version: r1044853
  title: RHEL 9 must be configured to disable the Asynchronous Transfer Mode kernel module.
  severity: medium
  role: null
  weight: 10.0
  discussion: Disabling Asynchronous Transfer Mode (ATM) protects the system against exploitation of any
    flaws in its implementation.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000381
  - scheme: disa-stig-id
    value: RHEL-09-213045
  - scheme: disa-vulnerability-id
    value: V-257804
  - scheme: disa-srg-id
    value: SRG-OS-000095-GPOS-00049
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'To configure the system to prevent the atm kernel module from being loaded, add the following
      line to the file /etc/modprobe.d/atm.conf (or create atm.conf if it does not exist): install atm
      /bin/false blacklist atm'
  checks:
    default: SV-257804.automated
    automated: SV-257804.automated
    manual: SV-257804.manual
  default_check: default
