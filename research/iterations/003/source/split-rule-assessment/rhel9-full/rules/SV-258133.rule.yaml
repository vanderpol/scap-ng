rule:
  id: SV-258133
  version: r1045263
  title: RHEL 9 must prohibit the use of cached authenticators after one day.
  severity: medium
  role: null
  weight: 10.0
  discussion: If cached authentication information is out-of-date, the validity of the authentication
    information may be questionable.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-002007
  - scheme: disa-stig-id
    value: RHEL-09-631020
  - scheme: disa-vulnerability-id
    value: V-258133
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the SSSD to prohibit the use of cached authentications after one day. Edit the
      file "/etc/sssd/sssd.conf" or a configuration file in "/etc/sssd/conf.d" and add or edit the following
      line just below the line [pam]: offline_credentials_expiration = 1'
  checks:
    default: SV-258133.automated
    automated: SV-258133.automated
    manual: SV-258133.manual
  default_check: default
