rule:
  id: SV-258229
  version: r958434
  title: RHEL 9 audit system must protect auditing rules from unauthorized change.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'Unauthorized disclosure of audit records can reveal system and configuration data to attackers,
    thus compromising its confidentiality. Audit information includes all information (e.g., audit records,
    audit settings, audit reports) needed to successfully audit RHEL 9 system activity. In immutable mode,
    unauthorized users cannot execute changes to the audit system to potentially hide malicious activity
    and then put the audit rules back. A system reboot would be noticeable, and a system administrator
    could then investigate the unauthorized changes. Satisfies: SRG-OS-000057-GPOS-00027, SRG-OS-000058-GPOS-00028,
    SRG-OS-000059-GPOS-00029'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000162
  - scheme: cci
    value: CCI-000163
  - scheme: cci
    value: CCI-000164
  - scheme: disa-stig-id
    value: RHEL-09-654275
  - scheme: disa-vulnerability-id
    value: V-258229
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the audit system to set the audit rules to be immutable by adding the following
      line to end of "/etc/audit/rules.d/audit.rules" -e 2 The audit daemon must be restarted for the
      changes to take effect.
  checks:
    manual: SV-258229.manual
  default_check: manual
