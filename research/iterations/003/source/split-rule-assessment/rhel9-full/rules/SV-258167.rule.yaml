rule:
  id: SV-258167
  version: r1155630
  title: RHEL 9 audit logs file must have mode 0600 or less permissive to prevent unauthorized access
    to the audit log.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'Only authorized personnel should be aware of errors and the details of the errors. Error
    messages are an indicator of an organization''s operational state or can identify the RHEL 9 system
    or platform. Additionally, Personally Identifiable Information (PII) and operational information must
    not be revealed through error messages to unauthorized personnel or their designated representatives.
    The structure and content of error messages must be carefully considered by the organization and development
    team. The extent to which the information system is able to identify and handle error conditions is
    guided by organizational policy and operational requirements. Satisfies: SRG-OS-000057-GPOS-00027,
    SRG-OS-000058-GPOS-00028, SRG-OS-000059-GPOS-00029, SRG-OS-000206-GPOS-00084'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000162
  - scheme: cci
    value: CCI-000163
  - scheme: cci
    value: CCI-000164
  - scheme: cci
    value: CCI-001314
  - scheme: disa-stig-id
    value: RHEL-09-653090
  - scheme: disa-vulnerability-id
    value: V-258167
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
