  remediation:
    guidance: 'Document the use of virtual system calls with the ISSO as an operational requirement or
      disable them with the following command: $ sudo grubby --update-kernel=ALL --args="vsyscall=none"
      Add or modify the following line in "/etc/default/grub" to ensure the configuration survives kernel
      updates: GRUB_CMDLINE_LINUX="vsyscall=none"'
