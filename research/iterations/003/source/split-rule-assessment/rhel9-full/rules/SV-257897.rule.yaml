rule:
  id: SV-257897
  version: r991589
  title: RHEL 9 /etc/shadow- file must have mode 0000 or less permissive to prevent unauthorized access.
  severity: medium
  role: null
  weight: 10.0
  discussion: The "/etc/shadow-" file is a backup file of "/etc/shadow", and as such, contains the list
    of local system accounts and password hashes. Protection of this file is critical for system security.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-232085
  - scheme: disa-vulnerability-id
    value: V-257897
  - scheme: disa-srg-id
    value: SRG-OS-000480-GPOS-00227
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Change the mode of the file "/etc/shadow-" to "0000" by running the following command:
      $ sudo chmod 0000 /etc/shadow-'
  checks:
    default: SV-257897.automated
    automated: SV-257897.automated
    manual: SV-257897.manual
  default_check: default
