rule:
  id: SV-257879
  version: r1045454
  title: RHEL 9 local disk partitions must implement cryptographic mechanisms to prevent unauthorized
    disclosure or modification of all information that requires at rest protection.
  severity: high
  role: null
  weight: 10.0
  discussion: 'RHEL 9 systems handling data requiring "data at rest" protections must employ cryptographic
    mechanisms to prevent unauthorized disclosure and modification of the information at rest. Selection
    of a cryptographic mechanism is based on the need to protect the integrity of organizational information.
    The strength of the mechanism is commensurate with the security category and/or classification of
    the information. Organizations have the flexibility to either encrypt all information on storage devices
    (i.e., full disk encryption) or encrypt specific data structures (e.g., files, records, or fields).
    Satisfies: SRG-OS-000405-GPOS-00184, SRG-OS-000185-GPOS-00079, SRG-OS-000404-GPOS-00183'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
