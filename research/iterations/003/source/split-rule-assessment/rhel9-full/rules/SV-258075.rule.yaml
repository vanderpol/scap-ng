rule:
  id: SV-258075
  version: r1184324
  title: RHEL 9 must define default permissions for the system default profile.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'The umask controls the default access mode assigned to newly created files. A umask of
    077 limits new files to mode 600 or less permissive. Although umask can be represented as a four-digit
    number, the first digit representing special access modes is typically ignored or required to be "0".
    This requirement applies to the globally configured system defaults and the local interactive user
    defaults for each account on the system. Satisfies: SRG-OS-000480-GPOS-00228, SRG-OS-000480-GPOS-00227'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-412070
  - scheme: disa-vulnerability-id
    value: V-258075
  - scheme: disa-srg-id
    value: SRG-OS-000480-GPOS-00228
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to define default permissions for all authenticated users in such a way
      that the user can only read and modify their own files. Add or edit the lines for the "umask" parameter
      in the "/etc/profile" file to "077": umask 077'
  checks:
    default: SV-258075.automated
    automated: SV-258075.automated
    manual: SV-258075.manual
  default_check: default
