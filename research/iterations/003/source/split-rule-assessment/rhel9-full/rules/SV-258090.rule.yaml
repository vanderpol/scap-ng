rule:
  id: SV-258090
  version: r958808
  title: RHEL 9 fapolicy module must be enabled.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'The organization must identify authorized software programs and permit execution of authorized
    software. The process used to identify software programs that are authorized to execute on organizational
    information systems is commonly referred to as allowlisting. Utilizing an allowlist provides a configuration
    management method for allowing the execution of only authorized software. Using only authorized software
    decreases risk by limiting the number of potential vulnerabilities. Verification of allowlisted software
    occurs prior to execution or at system startup. User home directories/folders may contain information
    of a sensitive nature. Nonprivileged users should coordinate any sharing of information with an SA
    through shared resources. RHEL 9 ships with many optional packages. One such package is a file access
    policy daemon called "fapolicyd". "fapolicyd" is a userspace daemon that determines access rights
    to files based on attributes of the process and file. It can be used to either blocklist or allowlist
    processes or file access. Proceed with caution with enforcing the use of this daemon. Improper configuration
    may render the system nonfunctional. The "fapolicyd" API is not namespace aware and can cause issues
    when launching or running containers. Satisfies: SRG-OS-000370-GPOS-00155, SRG-OS-000368-GPOS-00154'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-001764
  - scheme: cci
    value: CCI-001774
