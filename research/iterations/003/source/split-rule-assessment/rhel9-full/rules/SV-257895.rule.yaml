    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Change the mode of the file "/etc/passwd" to "0644" by running the following command: $
      sudo chmod 0644 /etc/passwd'
  checks:
    default: SV-257895.automated
