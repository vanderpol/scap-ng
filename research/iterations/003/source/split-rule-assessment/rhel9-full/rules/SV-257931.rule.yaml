rule:
  id: SV-257931
  version: r991589
  title: All RHEL 9 local files and directories must have a valid owner.
  severity: medium
  role: null
  weight: 10.0
  discussion: Unowned files and directories may be unintentionally inherited if a user is assigned the
    same user identifier "UID" as the UID of the unowned files.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-232255
  - scheme: disa-vulnerability-id
    value: V-257931
  - scheme: disa-srg-id
    value: SRG-OS-000480-GPOS-00227
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Either remove all files and directories from the system that do not have a valid user,
      or assign a valid user to all unowned files and directories on RHEL 9 with the "chown" command:
      $ sudo chown <user> <file>'
  checks:
    default: SV-257931.automated
    automated: SV-257931.automated
    manual: SV-257931.manual
  default_check: default
