rule:
  id: SV-270178
  version: r1184310
  title: The RHEL 9 SSH client must be configured to use only DOD-approved Message Authentication Codes
    (MACs) employing FIPS 140-3 validated cryptographic hash algorithms to protect the confidentiality
    of SSH client connections.
  severity: high
  role: null
  weight: 10.0
  discussion: Without cryptographic integrity protections, information can be altered by unauthorized
    users without detection. Remote access (e.g., RDP) is access to DOD nonpublic information systems
    by an authorized user (or an information system) communicating through an external, nonorganization-controlled
    network. Remote access methods include, for example, dial-up, broadband, and wireless. Cryptographic
    mechanisms used for protecting the integrity of information include, for example, signed hash functions
    using asymmetric cryptography, enabling distribution of the public key to verify the hash information
    while maintaining the confidentiality of the secret key used to generate the hash. RHEL 9 incorporates
    systemwide crypto policies by default. The SSH configuration file has no effect on the ciphers, MACs,
    or algorithms unless specifically defined in the /etc/sysconfig/sshd file. The employed algorithms
    can be viewed in the /etc/crypto-policies/back-ends/openssh.config file.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-001453
  - scheme: disa-stig-id
    value: RHEL-09-255070
  - scheme: disa-vulnerability-id
    value: V-270178
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the SSH client to use only MACs employing FIPS 140-3 approved algorithms. Reinstall
      crypto-policies with the following command: $ sudo dnf -y reinstall crypto-policies Set the crypto-policy
      to FIPS with the following command: $ sudo update-crypto-policies --set FIPS Setting system policy
      to FIPS Note: Systemwide crypto policies are applied on application startup. It is recommended to
      restart the system for the change of policies to fully take place.'
  checks:
    manual: SV-270178.manual
  default_check: manual
