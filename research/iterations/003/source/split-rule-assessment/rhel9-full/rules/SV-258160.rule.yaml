rule:
  id: SV-258160
  version: r1038966
  title: RHEL 9 audit system must take appropriate action when the audit files have reached maximum size.
  severity: medium
  role: null
  weight: 10.0
  discussion: It is critical that when the operating system is at risk of failing to process audit logs
    as required, it takes action to mitigate the failure. Audit processing failures include software/hardware
    errors; failures in the audit capturing mechanisms; and audit storage capacity being reached or exceeded.
    Responses to audit failure depend upon the nature of the failure mode.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000140
  - scheme: disa-stig-id
    value: RHEL-09-653055
  - scheme: disa-vulnerability-id
    value: V-258160
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to rotate the audit log when it reaches maximum size. Add or update the
      following line in "/etc/audit/auditd.conf" file: max_log_file_action = ROTATE'
  checks:
    default: SV-258160.automated
    automated: SV-258160.automated
    manual: SV-258160.manual
  default_check: default
