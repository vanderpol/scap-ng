rule:
  id: SV-258120
  version: r991589
  title: RHEL 9 must not have accounts configured with blank or null passwords.
  severity: medium
  role: null
  weight: 10.0
  discussion: If an account has an empty password, anyone could log in and run commands with the privileges
    of that account. Accounts with empty passwords should never be used in operational environments.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-611155
  - scheme: disa-vulnerability-id
    value: V-258120
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure all accounts on RHEL 9 to have a password or lock the account with the following
      commands: Perform a password reset: $ sudo passwd [username] To lock an account: $ sudo passwd -l
      [username]'
  checks:
    manual: SV-258120.manual
  default_check: manual
