rule:
  id: SV-257948
  version: r1045004
  title: RHEL 9 systems using Domain Name Servers (DNS) resolution must have at least two name servers
    configured.
  severity: medium
  role: null
  weight: 10.0
  discussion: To provide availability for name resolution services, multiple redundant name servers are
    mandated. A failure in name resolution could lead to the failure of security functions requiring name
    resolution, which may include time synchronization, centralized authentication, and remote system
    logging.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-252035
  - scheme: disa-vulnerability-id
    value: V-257948
  - scheme: disa-srg-id
    value: SRG-OS-000480-GPOS-00227
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the operating system to use two or more name servers for DNS resolution based
      on the DNS mode of the system. If the NetworkManager DNS mode is set to "none", add the following
      lines to "/etc/resolv.conf": nameserver [name server 1] nameserver [name server 2] Replace [name
      server 1] and [name server 2] with the IPs of two different DNS resolvers. If the NetworkManager
      DNS mode is set to "default", add two DNS servers to a NetworkManager connection using the following
      command: $ nmcli connection modify [connection name] ipv4.dns [name server 1],[name server 2] Replace
      [name server 1] and [name server 2] with the IPs of two different DNS resolvers. Replace [connection
      name] with a valid NetworkManager connection name on the system. Replace ipv4 with ipv6 if IPv6
      DNS servers are used.'
  checks:
    default: SV-257948.automated
    automated: SV-257948.automated
    manual: SV-257948.manual
  default_check: default
