rule:
  id: SV-257790
  version: r991589
  title: RHEL 9 /boot/grub2/grub.cfg file must be group-owned by root.
  severity: medium
  role: null
  weight: 10.0
  discussion: The "root" group is a highly privileged group. Furthermore, the group-owner of this file
    should not have any access privileges anyway.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-212025
  - scheme: disa-vulnerability-id
    value: V-257790
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Change the group of the file /boot/grub2/grub.cfg to root by running the following command:
      $ sudo chgrp root /boot/grub2/grub.cfg'
  checks:
    default: SV-257790.automated
    automated: SV-257790.automated
    manual: SV-257790.manual
