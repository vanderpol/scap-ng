rule:
  id: SV-257818
  version: r1044876
  title: The kdump service on RHEL 9 must be disabled.
  severity: medium
  role: null
  weight: 10.0
  discussion: Kernel core dumps may contain the full contents of system memory at the time of the crash.
    Kernel core dumps consume a considerable amount of disk space and may result in denial of service
    by exhausting the available space on the target file system partition. Unless the system is used for
    kernel development or testing, there is little need to run the kdump service.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-213115
  - scheme: disa-vulnerability-id
    value: V-257818
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Disable and mask the kdump service on RHEL 9. To disable the kdump service run the following
      command: $ sudo systemctl disable --now kdump To mask the kdump service run the following command:
      $ sudo systemctl mask --now kdump'
  checks:
    manual: SV-257818.manual
  default_check: manual
