rule:
  id: SV-257862
  version: r1184295
  title: RHEL 9 must prevent files with the setuid and setgid bit set from being executed on the /boot/efi
    directory.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'The "nosuid" mount option causes the system not to execute "setuid" and "setgid" files
    with owner privileges. This option must be used for mounting any file system not containing approved
    "setuid" and "setguid" files. Executing files from untrusted file systems increases the opportunity
    for nonprivileged users to attain unauthorized administrative access. Satisfies: SRG-OS-000368-GPOS-00154,
    SRG-OS-000480-GPOS-00227'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-001764
  - scheme: disa-stig-id
    value: RHEL-09-231105
  - scheme: disa-vulnerability-id
    value: V-257862
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability:
  - linux.uefi-boot
  parameters: {}
  remediation:
    guidance: Modify "/etc/fstab" to use the "nosuid" option on the "/boot/efi" directory.
  checks:
    manual: SV-257862.manual
  default_check: manual
