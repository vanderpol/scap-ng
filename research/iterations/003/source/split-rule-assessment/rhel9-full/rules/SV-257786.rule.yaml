rule:
  id: SV-257786
  version: r1044834
  title: RHEL 9 debug-shell systemd service must be disabled.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'The debug-shell requires no authentication and provides root privileges to anyone who has
    physical access to the machine. While this feature is disabled by default, masking it adds an additional
    layer of assurance that it will not be enabled via a dependency in systemd. This also prevents attackers
    with physical access from trivially bypassing security on the machine through valid troubleshooting
    configurations and gaining root access when the system is rebooted. Satisfies: SRG-OS-000324-GPOS-00125,
    SRG-OS-000480-GPOS-00227'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-002235
  - scheme: disa-stig-id
    value: RHEL-09-211055
  - scheme: disa-vulnerability-id
    value: V-257786
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to mask the debug-shell systemd service with the following command: $
      sudo systemctl disable --now debug-shell.service $ sudo systemctl mask --now debug-shell.service'
  checks:
    default: SV-257786.automated
    automated: SV-257786.automated
    manual: SV-257786.manual
  default_check: default
