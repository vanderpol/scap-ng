rule:
  id: SV-258031
  version: r1134920
  title: RHEL 9 must disable the ability of a user to accidentally press Ctrl-Alt-Del and cause a system
    to shut down or reboot.
  severity: medium
  role: null
  weight: 10.0
  discussion: A locally logged-in user who presses Ctrl-Alt-Del, when at the console, can reboot the system.
    If accidentally pressed, as could happen in the case of mixed OS environment, this can create the
    risk of short-term loss of availability of systems due to unintentional reboot.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-271105
  - scheme: disa-vulnerability-id
    value: V-258031
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to ignore the Ctrl-Alt-Del sequence in the GNOME desktop. Run the following
      command to set the media-keys logout setting: $ gsettings set org.gnome.settings-daemon.plugins.media-keys
      logout "['''']" Run the following command to update the database: $ sudo dconf update'
  checks:
    default: SV-258031.automated
    automated: SV-258031.automated
    manual: SV-258031.manual
  default_check: default
