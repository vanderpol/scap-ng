rule:
  id: SV-258105
  version: r1045212
  title: RHEL 9 passwords must have a 24 hours minimum password lifetime restriction in /etc/shadow.
  severity: medium
  role: null
  weight: 10.0
  discussion: Enforcing a minimum password lifetime helps to prevent repeated password changes to defeat
    the password reuse or history enforcement requirement. If users are allowed to immediately and continually
    change their password, the password could be repeatedly changed in a short period of time to defeat
    the organization's policy regarding password reuse.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-004066
  - scheme: cci
    value: CCI-000198
  - scheme: disa-stig-id
    value: RHEL-09-611080
  - scheme: disa-vulnerability-id
    value: V-258105
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure noncompliant accounts to enforce a 24 hour minimum password lifetime: $ sudo
      passwd -n 1 [user]'
  checks:
    default: SV-258105.automated
    automated: SV-258105.automated
    manual: SV-258105.manual
  default_check: default
