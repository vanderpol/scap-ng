rule:
  id: SV-257924
  version: r991557
  title: RHEL 9 audit tools must be owned by root.
  severity: medium
  role: null
  weight: 10.0
  discussion: Protecting audit information also includes identifying and protecting the tools used to
    view and manipulate log data. Therefore, protecting audit tools is necessary to prevent unauthorized
    operation on audit information. RHEL 9 systems providing tools to interface with audit information
    will leverage user permissions and roles identifying the user accessing the tools, and the corresponding
    rights the user enjoys, to make access decisions regarding the access to audit tools. Audit tools
    include, but are not limited to, vendor-provided and open source audit tools needed to successfully
    view and manipulate audit information system activity and records. Audit tools include custom queries
    and report generators.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-001493
  - scheme: disa-stig-id
    value: RHEL-09-232220
  - scheme: disa-vulnerability-id
    value: V-257924
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the audit tools to be owned by "root" by running the following command: $ sudo
      chown root [audit_tool] Replace "[audit_tool]" with each audit tool not owned by "root".'
  checks:
    default: SV-257924.automated
    automated: SV-257924.automated
    manual: SV-257924.manual
  default_check: default
