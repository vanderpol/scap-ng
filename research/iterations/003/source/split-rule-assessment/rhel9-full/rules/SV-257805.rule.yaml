rule:
  id: SV-257805
  version: r1044856
  title: RHEL 9 must be configured to disable the Controller Area Network kernel module.
  severity: medium
  role: null
  weight: 10.0
  discussion: Disabling Controller Area Network (CAN) protects the system against exploitation of any
    flaws in its implementation.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
