    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'To configure the system to prevent the can kernel module from being loaded, add the following
      lines to the file /etc/modprobe.d/can.conf (or create can.conf if it does not exist): install can
      /bin/false blacklist can'
