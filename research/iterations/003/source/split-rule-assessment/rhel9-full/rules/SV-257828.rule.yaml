rule:
  id: SV-257828
  version: r1044894
  title: RHEL 9 must not have the nfs-utils package installed.
  severity: medium
  role: null
  weight: 10.0
  discussion: '"nfs-utils" provides a daemon for the kernel NFS server and related tools. This package
    also contains the "showmount" program. "showmount" queries the mount daemon on a remote host for information
    about the Network File System (NFS) server on the remote host. For example, "showmount" can display
    the clients that are mounted on that host.'
  rationale: null
