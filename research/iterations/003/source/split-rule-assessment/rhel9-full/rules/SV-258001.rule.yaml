rule:
  id: SV-258001
  version: r991589
  title: RHEL 9 SSH public host key files must have mode 0644 or less permissive.
  severity: medium
  role: null
  weight: 10.0
  discussion: If a public host key file is modified by an unauthorized user, the SSH service may be compromised.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-255125
  - scheme: disa-vulnerability-id
    value: V-258001
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Change the mode of public host key files under "/etc/ssh" to "0644" with the following
      command: $ sudo chmod 0644 /etc/ssh/*key.pub Restart the SSH daemon for the changes to take effect:
      $ sudo systemctl restart sshd.service'
  checks:
    default: SV-258001.automated
    automated: SV-258001.automated
    manual: SV-258001.manual
  default_check: default
