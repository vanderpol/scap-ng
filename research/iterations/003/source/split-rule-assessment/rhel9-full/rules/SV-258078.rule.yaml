rule:
  id: SV-258078
  version: r958944
  title: RHEL 9 must use a Linux Security Module configured to enforce limits on system services.
  severity: high
  role: null
  weight: 10.0
  discussion: 'Without verification of the security functions, security functions may not operate correctly
    and the failure may go unnoticed. Security function is defined as the hardware, software, and/or firmware
    of the information system responsible for enforcing the system security policy and supporting the
    isolation of code and data on which the protection is based. Security functionality includes, but
    is not limited to, establishing system accounts, configuring access authorizations (i.e., permissions,
    privileges), setting events to be audited, and setting intrusion detection parameters. This requirement
    applies to operating systems performing security function verification/testing and/or systems and
    environments that require this functionality. Satisfies: SRG-OS-000445-GPOS-00199, SRG-OS-000134-GPOS-00068'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-001084
  - scheme: cci
    value: CCI-002696
  - scheme: disa-stig-id
    value: RHEL-09-431010
  - scheme: disa-vulnerability-id
    value: V-258078
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to verify correct operation of security functions. Edit the file "/etc/selinux/config"
      and add or modify the following line: SELINUX=enforcing A reboot is required for the changes to
      take effect.'
  checks:
    default: SV-258078.automated
    automated: SV-258078.automated
    manual: SV-258078.manual
  default_check: default
