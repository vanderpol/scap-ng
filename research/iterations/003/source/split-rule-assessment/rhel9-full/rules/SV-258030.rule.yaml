rule:
  id: SV-258030
  version: r1045112
  title: RHEL 9 must prevent a user from overriding the disable-restart-buttons setting for the graphical
    user interface.
  severity: medium
  role: null
  weight: 10.0
  discussion: A user who is at the console can reboot the system at the login screen. If restart or shutdown
    buttons are pressed at the login screen, this can create the risk of short-term loss of availability
    of systems due to reboot.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-271100
  - scheme: disa-vulnerability-id
    value: V-258030
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability:
  - linux.gnome-installed
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to prevent a user from overriding the disable-restart-buttons setting
      for graphical user interfaces. Create a database to contain the systemwide graphical user logon
      settings (if it does not already exist) with the following command: $ sudo touch /etc/dconf/db/local.d/locks/session
      Add the following line to prevent nonprivileged users from modifying it: /org/gnome/login-screen/disable-restart-buttons
      Run the following command to update the database: $ sudo dconf update'
  checks:
    manual: SV-258030.manual
  default_check: manual
