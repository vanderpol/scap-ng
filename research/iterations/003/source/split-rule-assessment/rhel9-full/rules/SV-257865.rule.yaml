rule:
  id: SV-257865
  version: r1184297
  title: RHEL 9 must mount /dev/shm with the nosuid option.
  severity: medium
  role: null
  weight: 10.0
  discussion: The "nosuid" mount option causes the system to not execute "setuid" and "setgid" files with
    owner privileges. This option must be used for mounting any file system not containing approved "setuid"
    and "setguid" files. Executing files from untrusted file systems increases the opportunity for nonprivileged
    users to attain unauthorized administrative access.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-001764
  - scheme: disa-stig-id
    value: RHEL-09-231120
  - scheme: disa-vulnerability-id
    value: V-257865
  - scheme: disa-srg-id
    value: SRG-OS-000368-GPOS-00154
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure "/dev/shm" to mount with the "nosuid" option. Modify "/etc/fstab" to use the
      "nosuid" option on the "/dev/shm" file system. To reload all implicit mount units and update the
      dependency graph so that new options will apply correctly at next remount, run the following command:
      $ sudo systemctl daemon-reload Use the following command to apply the changes immediately without
      a reboot: $ sudo mount -o remount /dev/shm'
  checks:
    default: SV-257865.automated
    automated: SV-257865.automated
    manual: SV-257865.manual
  default_check: default
