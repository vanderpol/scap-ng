rule:
  id: SV-257826
  version: r1208770
  title: RHEL 9 must not have a File Transfer Protocol (FTP) server package installed.
  severity: high
  role: null
  weight: 10.0
  discussion: 'The FTP service provides an unencrypted remote access that does not provide for the confidentiality
    and integrity of user passwords or the remote session. If a privileged user were to log on using this
    service, the privileged user password could be compromised. SSH or other encrypted file transfer methods
    must be used in place of this service. Removing the "vsftpd" package decreases the risk of accidental
    activation. If FTP is required for operational support (such as transmission of router configurations),
    its use must be documented with the information systems security manager (ISSM), restricted to only
    authorized personnel, and have access control rules established. Satisfies: SRG-OS-000074-GPOS-00042,
    SRG-OS-000095-GPOS-00049, SRG-OS-000480-GPOS-00227'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000197
  - scheme: cci
    value: CCI-000381
  - scheme: disa-stig-id
    value: RHEL-09-215015
  - scheme: disa-vulnerability-id
    value: V-257826
  references:
