rule:
  id: SV-258151
  version: r1045298
  title: RHEL 9 audit package must be installed.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'Without establishing what type of events occurred, the source of events, where events occurred,
    and the outcome of events, it would be difficult to establish, correlate, and investigate the events
    leading up to an outage or attack. Audit record content that may be necessary to satisfy this requirement
    includes, for example, time stamps, source and destination addresses, user/process identifiers, event
    descriptions, success/fail indications, filenames involved, and access control or flow control rules
    invoked. Associating event types with detected events in audit logs provides a means of investigating
    an attack, recognizing resource utilization or capacity thresholds, or identifying an improperly configured
    RHEL 9 system. Satisfies: SRG-OS-000062-GPOS-00031, SRG-OS-000037-GPOS-00015, SRG-OS-000038-GPOS-00016,
    SRG-OS-000039-GPOS-00017, SRG-OS-000040-GPOS-00018, SRG-OS-000041-GPOS-00019, SRG-OS-000042-GPOS-00021,
    SRG-OS-000051-GPOS-00024, SRG-OS-000054-GPOS-00025, SRG-OS-000122-GPOS-00063, SRG-OS-000254-GPOS-00095,
    SRG-OS-000255-GPOS-00096, SRG-OS-000337-GPOS-00129, SRG-OS-000348-GPOS-00136, SRG-OS-000349-GPOS-00137,
    SRG-OS-000350-GPOS-00138, SRG-OS-000351-GPOS-00139, SRG-OS-000352-GPOS-00140, SRG-OS-000353-GPOS-00141,
    SRG-OS-000354-GPOS-00142, SRG-OS-000358-GPOS-00145, SRG-OS-000365-GPOS-00152, SRG-OS-000392-GPOS-00172,
    SRG-OS-000475-GPOS-00220, SRG-OS-000055-GPOS-00026'
