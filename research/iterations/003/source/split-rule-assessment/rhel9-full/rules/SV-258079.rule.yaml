rule:
  id: SV-258079
  version: r1045159
  title: RHEL 9 must enable the SELinux targeted policy.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'Setting the SELinux policy to "targeted" or a more specialized policy ensures the system
    will confine processes that are likely to be targeted for exploitation, such as network or system
    services. Note: During the development or debugging of SELinux modules, it is common to temporarily
    place nonproduction systems in "permissive" mode. In such temporary cases, SELinux policies should
    be developed, and once work is completed, the system should be reconfigured to "targeted".'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-002696
  - scheme: disa-stig-id
    value: RHEL-09-431015
  - scheme: disa-vulnerability-id
    value: V-258079
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to use the targetd SELINUX policy. Edit the file "/etc/selinux/config"
      and add or modify the following line: SELINUXTYPE=targeted A reboot is required for the changes
      to take effect.'
  checks:
    manual: SV-258079.manual
  default_check: manual
