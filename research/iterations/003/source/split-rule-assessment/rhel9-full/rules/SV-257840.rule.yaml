  version: r991589
  title: RHEL 9 must have the nss-tools package installed.
  severity: medium
  role: null
  weight: 10.0
  discussion: Network Security Services (NSS) is a set of libraries designed to support cross-platform
    development of security-enabled client and server applications. Install the "nss-tools" package to
    install command-line tools to manipulate the NSS certificate and key database.
