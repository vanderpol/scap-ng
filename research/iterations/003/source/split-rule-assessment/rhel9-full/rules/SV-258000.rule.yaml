rule:
  id: SV-258000
  version: r1208772
  title: RHEL 9 SSH private host key files must have mode 0600 or less permissive.
  severity: medium
  role: null
  weight: 10.0
  discussion: If an unauthorized user obtains the private SSH host key file, the host could be impersonated.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-255120
  - scheme: disa-vulnerability-id
    value: V-258000
  - scheme: disa-srg-id
    value: SRG-OS-000480-GPOS-00227
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the mode of SSH private host key files under "/etc/ssh" to "0600" with the following
      command: $ sudo chmod 0600 /etc/ssh/ssh_host*key Restart the SSH daemon for the changes to take
      effect: $ sudo systemctl restart sshd.service'
  checks:
    default: SV-258000.automated
    automated: SV-258000.automated
    manual: SV-258000.manual
  default_check: default
