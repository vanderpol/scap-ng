rule:
  id: SV-257983
  version: r1045024
  title: RHEL 9 SSHD must accept public key authentication.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'Without the use of multifactor authentication, the ease of access to privileged functions
    is greatly increased. Multifactor authentication requires using two or more factors to achieve authentication.
    A privileged account is defined as an information system account with authorizations of a privileged
    user. A DOD common access card (CAC) with DOD-approved PKI is an example of multifactor authentication.
    Satisfies: SRG-OS-000105-GPOS-00052, SRG-OS-000106-GPOS-00053, SRG-OS-000107-GPOS-00054, SRG-OS-000108-GPOS-00055'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000765
  - scheme: cci
    value: CCI-000766
  - scheme: cci
    value: CCI-000767
  - scheme: cci
    value: CCI-000768
  - scheme: disa-stig-id
    value: RHEL-09-255035
  - scheme: disa-vulnerability-id
    value: V-257983
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'To configure the system, add or modify the following line in "/etc/ssh/sshd_config" or
      in a file in "/etc/ssh/sshd_config.d". PubkeyAuthentication yes Restart the SSH daemon for the settings
      to take effect: $ sudo systemctl restart sshd.service'
  checks:
