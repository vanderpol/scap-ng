rule:
  id: SV-258015
  version: r1045086
  title: RHEL 9 must prevent a user from overriding the disabling of the graphical user interface automount
    function.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'A nonprivileged account is any operating system account with authorizations of a nonprivileged
    user. Satisfies: SRG-OS-000114-GPOS-00059, SRG-OS-000378-GPOS-00163, SRG-OS-000480-GPOS-00227'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000778
  - scheme: cci
    value: CCI-001958
  - scheme: disa-stig-id
    value: RHEL-09-271025
  - scheme: disa-vulnerability-id
    value: V-258015
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability:
  - linux.gnome-installed
  parameters: {}
  remediation:
    guidance: 'Configure the GNOME desktop to not allow a user to change the setting that disables automated
      mounting of removable media. Add the following line to "/etc/dconf/db/local.d/locks/00-security-settings-lock"
      to prevent user modification: /org/gnome/desktop/media-handling/automount-open Then update the dconf
      system databases: $ sudo dconf update'
  checks:
    manual: SV-258015.manual
  default_check: manual
