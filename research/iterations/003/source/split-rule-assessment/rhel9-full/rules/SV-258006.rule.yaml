rule:
  id: SV-258006
  version: r1045071
  title: RHEL 9 SSH daemon must not allow known hosts authentication.
  severity: medium
  role: null
  weight: 10.0
  discussion: Configuring the IgnoreUserKnownHosts setting for the SSH daemon provides additional assurance
    that remote login via SSH will require a password, even in the event of misconfiguration elsewhere.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-255150
  - scheme: disa-vulnerability-id
    value: V-258006
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the SSH daemon to not allow known hosts authentication. Add the following line
      to "/etc/ssh/sshd_config" or to a file in "/etc/ssh/sshd_config.d", or uncomment the line and set
      the value to "yes": IgnoreUserKnownHosts yes The SSH service must be restarted for changes to take
      effect: $ sudo systemctl restart sshd.service'
  checks:
    default: SV-258006.automated
    automated: SV-258006.automated
    manual: SV-258006.manual
  default_check: default
