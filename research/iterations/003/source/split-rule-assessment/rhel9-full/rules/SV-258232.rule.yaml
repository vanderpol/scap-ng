rule:
  id: SV-258232
  version: r1184335
  title: RHEL 9 IP tunnels must use FIPS 140-3 approved cryptographic algorithms.
  severity: high
  role: null
  weight: 10.0
  discussion: Overriding the system crypto policy makes the behavior of the Libreswan service violate
    expectations, and makes system configuration more fragmented.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000068
  - scheme: disa-stig-id
    value: RHEL-09-671020
  - scheme: disa-vulnerability-id
    value: V-258232
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability:
  - linux.libreswan-installed
  parameters: {}
  remediation:
    guidance: 'Configure Libreswan to use the system cryptographic policy. Add the following line to "/etc/ipsec.conf":
      include /etc/crypto-policies/back-ends/libreswan.config'
  checks:
    manual: SV-258232.manual
  default_check: manual
