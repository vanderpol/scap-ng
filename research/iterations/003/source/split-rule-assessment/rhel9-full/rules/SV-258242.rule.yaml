rule:
  id: SV-258242
  version: r1184336
  title: RHEL 9 must implement DOD-approved encryption in the bind package.
  severity: high
  role: null
  weight: 10.0
  discussion: 'Without cryptographic integrity protections, information can be altered by unauthorized
    users without detection. Cryptographic mechanisms used for protecting the integrity of information
    include, for example, signed hash functions using asymmetric cryptography enabling distribution of
    the public key to verify the hash information while maintaining the confidentiality of the secret
    key used to generate the hash. RHEL 9 incorporates system-wide crypto policies by default. The employed
    algorithms can be viewed in the /etc/crypto-policies/back-ends/ directory. Satisfies: SRG-OS-000423-GPOS-00187,
    SRG-OS-000426-GPOS-00190'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-002418
  - scheme: cci
    value: CCI-002422
  - scheme: disa-stig-id
    value: RHEL-09-672050
  - scheme: disa-vulnerability-id
    value: V-258242
  - scheme: disa-srg-id
    value: SRG-OS-000423-GPOS-00187
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability:
  - linux.bind-installed
  parameters: {}
  remediation:
    guidance: 'Configure BIND to use the system crypto policy. Add the following line to the "options"
      section in "/etc/named.conf": include "/etc/crypto-policies/back-ends/bind.config";'
  checks:
    default: SV-258242.automated
    automated: SV-258242.automated
    manual: SV-258242.manual
  default_check: default
