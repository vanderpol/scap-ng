rule:
  id: SV-258046
  version: r991589
  title: RHEL 9 system accounts must not have an interactive login shell.
  severity: medium
  role: null
  weight: 10.0
  discussion: Ensuring shells are not given to system accounts upon login makes it more difficult for
    attackers to make use of system accounts.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-411035
  - scheme: disa-vulnerability-id
    value: V-258046
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 so that all noninteractive accounts on the system do not have an interactive
      shell assigned to them. If the system account needs a shell assigned for mission operations, document
      the need with the information system security officer (ISSO). Run the following command to disable
      the interactive shell for a specific noninteractive user account: Replace <user> with the user that
      has a login shell. $ sudo usermod --shell /sbin/nologin <user> Do not perform the steps in this
      section on the root account. Doing so will cause the system to become inaccessible.'
  checks:
    default: SV-258046.automated
    automated: SV-258046.automated
    manual: SV-258046.manual
  default_check: default
