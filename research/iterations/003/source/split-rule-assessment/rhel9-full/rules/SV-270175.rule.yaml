rule:
  id: SV-270175
  version: r1137691
  title: RHEL 9 "/etc/audit/" must be owned by root.
  severity: medium
  role: null
  weight: 10.0
  discussion: The "/etc/audit/" directory contains files that ensure the proper auditing of command execution,
    privilege escalation, file manipulation, and more. Protection of this directory is critical for system
    security.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
