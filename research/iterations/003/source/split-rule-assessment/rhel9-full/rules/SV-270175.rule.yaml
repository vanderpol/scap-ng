  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Change the owner of the file "/etc/audit/" to "root" by running the following command:
      $ sudo chown root /etc/audit/'
  checks:
    default: SV-270175.automated
