rule:
  id: SV-257829
  version: r1044896
  title: RHEL 9 must not have the ypserv package installed.
  severity: medium
  role: null
  weight: 10.0
  discussion: The NIS service provides an unencrypted authentication service, which does not provide for
    the confidentiality and integrity of user passwords or the remote session. Removing the "ypserv" package
    decreases the risk of the accidental (or intentional) activation of NIS or NIS+ services.
  rationale: null
