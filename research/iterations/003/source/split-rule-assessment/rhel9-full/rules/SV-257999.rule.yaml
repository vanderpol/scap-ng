rule:
  id: SV-257999
  version: r1155686
  title: RHEL 9 SSH server configuration files' permissions must not be modified.
  severity: medium
  role: null
  weight: 10.0
  discussion: Service configuration files enable or disable features of their respective services, that
    if configured incorrectly, can lead to insecure and vulnerable configurations. Therefore, service
    configuration files must have correct permissions (owner, group owner, mode) to prevent unauthorized
    changes.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-255115
  - scheme: disa-vulnerability-id
    value: V-257999
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Run the following commands to restore the correct permissions of OpenSSH server configuration
      files: $ sudo rpm --setugids openssh-server $ sudo rpm --setperms openssh-server'
  checks:
    manual: SV-257999.manual
  default_check: manual
