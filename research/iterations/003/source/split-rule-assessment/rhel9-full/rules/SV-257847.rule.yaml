rule:
  id: SV-257847
  version: r1044924
  title: RHEL 9 must use a separate file system for the system audit data path.
  severity: low
  role: null
  weight: 10.0
  discussion: 'Placing "/var/log/audit" in its own partition enables better separation between audit files
    and other system files, and helps ensure that auditing cannot be halted due to the partition running
    out of space. Satisfies: SRG-OS-000341-GPOS-00132, SRG-OS-000480-GPOS-00227'
  rationale: null
