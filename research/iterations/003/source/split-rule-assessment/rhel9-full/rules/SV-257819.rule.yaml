rule:
  id: SV-257819
  version: r1015075
  title: RHEL 9 must ensure cryptographic verification of vendor software packages.
  severity: medium
  role: null
  weight: 10.0
  discussion: Cryptographic verification of vendor software packages ensures that all software packages
    are obtained from a valid source and protects against spoofing that could lead to installation of
    malware on the system. Red Hat cryptographically signs all software packages, which includes updates,
    with a GPG key to verify that they are valid.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-003992
  - scheme: cci
    value: CCI-001749
  - scheme: disa-stig-id
    value: RHEL-09-214010
  - scheme: disa-vulnerability-id
    value: V-257819
  - scheme: disa-srg-id
    value: SRG-OS-000366-GPOS-00153
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Install Red Hat package-signing keys on the system and verify their fingerprints match
      vendor values. Insert RHEL 9 installation disc or attach RHEL 9 installation image to the system.
      Mount the disc or image to make the contents accessible inside the system. Assuming the mounted
      location is "/media/cdrom", use the following command to copy Red Hat GPG key file onto the system:
      $ sudo cp /media/cdrom/RPM-GPG-KEY-redhat-release /etc/pki/rpm-gpg/ Import Red Hat GPG keys from
      key file into system keyring: $ sudo rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release Using
      the steps listed in the Check Text, confirm the newly imported keys show as installed on the system
      and verify their fingerprints match vendor values.'
  checks:
    default: SV-257819.automated
    automated: SV-257819.automated
    manual: SV-257819.manual
  default_check: default
