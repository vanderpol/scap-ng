rule:
  id: SV-257813
  version: r1134899
  title: RHEL 9 must disable storing core dumps.
  severity: medium
  role: null
  weight: 10.0
  discussion: A core dump includes a memory image taken at the time the operating system terminates an
    application. The memory image could contain sensitive data and is generally useful only for developers
    or system operators trying to debug problems. Enabling core dumps on production systems is not recommended;
    however, there may be overriding operational requirements to enable advanced debugging. Permitting
    temporary enablement of core dumps during such situations must be reviewed through local needs and
    policy.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-213090
  - scheme: disa-vulnerability-id
    value: V-257813
  - scheme: disa-srg-id
    value: SRG-OS-000480-GPOS-00227
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability:
  - linux.kernel-dumps-enabled
  parameters: {}
  remediation:
    guidance: 'Configure the operating system to disable storing core dumps for all users. Add or modify
      the following line in /etc/systemd/coredump.conf: Storage=none'
  checks:
    default: SV-257813.automated
    automated: SV-257813.automated
    manual: SV-257813.manual
  default_check: default
