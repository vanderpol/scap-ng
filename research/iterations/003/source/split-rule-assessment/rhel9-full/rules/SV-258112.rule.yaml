rule:
  id: SV-258112
  version: r1045229
  title: RHEL 9 must require the change of at least eight characters when passwords are changed.
  severity: medium
  role: null
  weight: 10.0
  discussion: Use of a complex password helps to increase the time and resources required to compromise
    the password. Password complexity, or strength, is a measure of the effectiveness of a password in
    resisting attempts at guessing and brute-force attacks. Password complexity is one factor of several
    that determines how long it takes to crack a password. The more complex the password, the greater
    the number of possible combinations that need to be tested before the password is compromised. Requiring
    a minimum number of different characters during password changes ensures that newly changed passwords
    will not resemble previously compromised ones. Note that passwords changed on compromised systems
    will still be compromised.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-004066
  - scheme: cci
    value: CCI-000195
  - scheme: disa-stig-id
    value: RHEL-09-611115
  - scheme: disa-vulnerability-id
    value: V-258112
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to require the change of at least eight of the total number of characters
      when passwords are changed by setting the "difok" option. Add or update the following line in the
      "/etc/security/pwquality.conf" file or a configuration file in the "/etc/security/pwquality.conf.d/"
      directory to contain the "difok" parameter: difok = 8'
  checks:
    manual: SV-258112.manual
  default_check: manual
