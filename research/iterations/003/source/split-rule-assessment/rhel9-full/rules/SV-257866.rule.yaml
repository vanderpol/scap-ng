rule:
  id: SV-257866
  version: r958804
  title: RHEL 9 must mount /tmp with the nodev option.
  severity: medium
  role: null
  weight: 10.0
  discussion: The "nodev" mount option causes the system to not interpret character or block special devices.
    Executing character or block special devices from untrusted file systems increases the opportunity
    for nonprivileged users to attain unauthorized administrative access. The only legitimate location
    for device files is the "/dev" directory located on the root partition, with the exception of chroot
    jails if implemented.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-001764
  - scheme: disa-stig-id
    value: RHEL-09-231125
  - scheme: disa-vulnerability-id
    value: V-257866
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Modify "/etc/fstab" to use the "nodev" option on the "/tmp" directory.
  checks:
    manual: SV-257866.manual
  default_check: manual
