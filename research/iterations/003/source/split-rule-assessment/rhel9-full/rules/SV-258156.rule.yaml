rule:
  id: SV-258156
  version: r1106364
  title: RHEL 9 must take action when allocated audit record storage volume reaches 75 percent of the
    repository maximum audit record storage capacity.
  severity: medium
  role: null
  weight: 10.0
  discussion: If security personnel are not notified immediately when storage volume reaches a maximum
    of 75 percent utilization, they are unable to plan for audit record storage capacity expansion. The
    notification can be set to trigger at lower utilization thresholds at the information system security
    officer's (ISSO's) discretion.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-001855
  - scheme: disa-stig-id
    value: RHEL-09-653035
  - scheme: disa-vulnerability-id
    value: V-258156
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure RHEL 9 to initiate an action to notify the SA and ISSO (at a minimum) when allocated
      audit record storage volume reaches (at most) 75 percent of the repository maximum audit record
      storage capacity by adding/modifying the following line in the /etc/audit/auditd.conf file. space_left
      = 25%
  checks:
    default: SV-258156.automated
    automated: SV-258156.automated
    manual: SV-258156.manual
  default_check: default
