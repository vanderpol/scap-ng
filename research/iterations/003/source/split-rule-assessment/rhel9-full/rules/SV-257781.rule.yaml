rule:
  id: SV-257781
  version: r991589
  title: The graphical display manager must not be the default target on RHEL 9 unless approved.
  severity: medium
  role: null
  weight: 10.0
  discussion: Unnecessary service packages must not be installed to decrease the attack surface of the
    system. Graphical display managers have a long history of security vulnerabilities and must not be
    used, unless approved and documented.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-211030
  - scheme: disa-vulnerability-id
    value: V-257781
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Document the requirement for a graphical user interface with the ISSO or set the default
      target to multi-user with the following command: $ sudo systemctl set-default multi-user.target'
  checks:
    manual: SV-257781.manual
  default_check: manual
