rule:
  id: SV-258134
  version: r1155620
  title: RHEL 9 must have the AIDE package installed.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'Without verification of the security functions, security functions may not operate correctly,
    and the failure may go unnoticed. Security function is defined as the hardware, software, and/or firmware
    of the information system responsible for enforcing the system security policy and supporting the
    isolation of code and data on which the protection is based. Security functionality includes, but
    is not limited to, establishing system accounts, configuring access authorizations (i.e., permissions,
    privileges), setting events to be audited, and setting intrusion detection parameters. Selection lines
    in the aide.conf file determine which files and directories AIDE will monitor for changes. They follow
    this format: <path> <rules> The <path> specifies a file, directory or wildcard pattern to monitor.
    The <rules>define which attributes (hashes, permissions, timestamps, etc.) to check. Satisfies: SRG-OS-000363-GPOS-00150,
    SRG-OS-000445-GPOS-00199'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-001744
  - scheme: cci
    value: CCI-002696
  - scheme: disa-stig-id
    value: RHEL-09-651010
  - scheme: disa-vulnerability-id
    value: V-258134
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Install AIDE, initialize it, and perform a manual check. Install AIDE: $ sudo dnf install
      aide Initialize AIDE: $ sudo /usr/sbin/aide --init Example output: Start timestamp: 2023-06-05 10:09:04
      -0600 (AIDE 0.16) AIDE initialized database at /var/lib/aide/aide.db.new.gz Number of entries: 86833
      --------------------------------------------------- The attributes of the (uncompressed) database(s):
      --------------------------------------------------- /var/lib/aide/aide.db.new.gz MD5 : coZUtPHhoFoeD7+k54fUvQ==
      SHA1 : DVpOEMWJwo0uPgrKZAygIUgSxeM= SHA256 : EQiZH0XNEk001tcDmJa+5STFEjDb4MPE TGdBJ/uvZKc= SHA512
      : 86KUqw++PZhoPK0SZvT3zuFq9yu9nnPP toei0nENVELJ1LPurjoMlRig6q69VR8l +44EwO9eYyy9nnbzQsfG1g== End
      timestamp: 2023-06-05 10:09:57 -0600 (run time: 0m 53s) The new database will need to be renamed
      to be read by AIDE: $ sudo mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz Perform a manual
      check: $ sudo /usr/sbin/aide --check Example output: 2023-06-05 10:16:08 -0600 (AIDE 0.16) AIDE
      found NO differences between database and filesystem. Looks okay!! ...'
  checks:
    default: SV-258134.automated
    automated: SV-258134.automated
    manual: SV-258134.manual
  default_check: default
