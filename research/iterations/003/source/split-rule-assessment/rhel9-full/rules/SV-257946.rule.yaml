rule:
  id: SV-257946
  version: r1184307
  title: RHEL 9 must disable the chrony daemon from acting as a server.
  severity: low
  role: null
  weight: 10.0
  discussion: 'Minimizing the exposure of the server functionality of the chrony daemon diminishes the
    attack surface. Satisfies: SRG-OS-000096-GPOS-00050, SRG-OS-000095-GPOS-00049'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
