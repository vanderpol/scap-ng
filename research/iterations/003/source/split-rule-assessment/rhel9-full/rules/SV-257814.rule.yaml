rule:
  id: SV-257814
  version: r1156057
  title: RHEL 9 must disable core dumps for all users.
  severity: medium
  role: null
  weight: 10.0
  discussion: A core dump includes a memory image taken at the time the operating system terminates an
    application. The memory image could contain sensitive data and is generally useful only for developers
    trying to debug problems.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-213095
  - scheme: disa-vulnerability-id
    value: V-257814
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability:
  - linux.kernel-dumps-enabled
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to disable core dumps for all users. Add the following line to the top
      of the /etc/security/limits.conf or in a single ".conf" file defined in /etc/security/limits.d/:
      * hard core 0 Remove or comment out any entries for users or groups with a value set to anything
      other than "0".'
  checks:
    default: SV-257814.automated
    automated: SV-257814.automated
    manual: SV-257814.manual
  default_check: default
