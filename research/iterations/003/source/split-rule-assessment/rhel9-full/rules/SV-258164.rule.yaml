rule:
  id: SV-258164
  version: r1045301
  title: RHEL 9 audit system must audit local events.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'Without establishing what type of events occurred, the source of events, where events occurred,
    and the outcome of events, it would be difficult to establish, correlate, and investigate the events
    leading up to an outage or attack. If option "local_events" isn''t set to "yes" only events from network
    will be aggregated. Satisfies: SRG-OS-000062-GPOS-00031, SRG-OS-000480-GPOS-00227'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000169
  - scheme: disa-stig-id
    value: RHEL-09-653075
  - scheme: disa-vulnerability-id
    value: V-258164
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to generate audit records for local events by adding or updating the following
      line in "/etc/audit/auditd.conf": local_events = yes The audit daemon must be restarted for the
      changes to take effect.'
  checks:
    default: SV-258164.automated
    automated: SV-258164.automated
    manual: SV-258164.manual
  default_check: default
