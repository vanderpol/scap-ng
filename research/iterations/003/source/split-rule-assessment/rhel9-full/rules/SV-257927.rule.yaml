rule:
  id: SV-257927
  version: r991589
  title: RHEL 9 cron configuration files directory must be group-owned by root.
  severity: medium
  role: null
  weight: 10.0
  discussion: Service configuration files enable or disable features of their respective services that
    if configured incorrectly can lead to insecure and vulnerable configurations; therefore, service configuration
    files should be owned by the correct group to prevent unauthorized changes.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-232235
  - scheme: disa-vulnerability-id
    value: V-257927
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure any cron configuration not group-owned by root with the following command: $
      sudo chgrp root [cron config file]'
  checks:
    default: SV-257927.automated
    automated: SV-257927.automated
    manual: SV-257927.manual
  default_check: default
