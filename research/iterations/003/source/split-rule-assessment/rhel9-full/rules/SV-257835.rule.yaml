rule:
  id: SV-257835
  version: r1155679
  title: The Trivial File Transfer Protocol (TFTP) server must not be installed unless it is required,
    and if required, the RHEL 9 TFTP daemon must be configured to operate in secure mode.
  severity: high
  role: null
  weight: 10.0
  discussion: Removing the "tftp-server" package decreases the risk of the accidental (or intentional)
    activation of tftp services. If TFTP is required for operational support (such as transmission of
    router configurations), its use must be documented with the information systems security manager (ISSM),
    restricted to only authorized personnel, and have access control rules established. Restricting TFTP
    to a specific directory prevents remote users from copying, transferring, or overwriting system files.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-215060
  - scheme: disa-vulnerability-id
    value: V-257835
  - scheme: disa-srg-id
    value: SRG-OS-000480-GPOS-00227
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability:
  - linux.tftp-installed
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 so that TFTP operates in secure mode if installed. If TFTP server is not
      required, remove it with the following command: $ sudo dnf -y remove tftp-server Configure the TFTP
      daemon to operate in secure mode with the following command: $ sudo systemctl edit tftp.service
      In the editor, enter: [Service] ExecStart=/usr/sbin/in.tftpd -s /var/lib/tftpboot After making changes,
      reload the systemd daemon and restart the TFTP service as follows: $ sudo systemctl daemon-reload
      $ sudo systemctl restart tftp.service If the "-s" option is not present in the "ExecStart" line
      or if the line is missing, this is a finding.'
  checks:
    default: SV-257835.automated
    automated: SV-257835.automated
    manual: SV-257835.manual
  default_check: default
