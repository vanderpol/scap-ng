rule:
  id: SV-258086
  version: r1102063
  title: RHEL 9 must require users to reauthenticate for privilege escalation.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'Without reauthentication, users may access resources or perform tasks for which they do
    not have authorization. When operating systems provide the capability to escalate a functional capability,
    it is critical that the user reauthenticate. Satisfies: SRG-OS-000373-GPOS-00156, SRG-OS-000373-GPOS-00157,
    SRG-OS-000373-GPOS-00158'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-004895
  - scheme: cci
    value: CCI-002038
  - scheme: disa-stig-id
    value: RHEL-09-432025
  - scheme: disa-vulnerability-id
    value: V-258086
  - scheme: disa-srg-id
    value: SRG-OS-000373-GPOS-00156
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure RHEL 9 to not allow users to execute privileged actions without authenticating.
      Remove any occurrence of "!authenticate" found in "/etc/sudoers" file or files in the "/etc/sudoers.d"
      directory. $ sudo sed -i '/\!authenticate/ s/^/# /g' /etc/sudoers /etc/sudoers.d/*
  checks:
    default: SV-258086.automated
    automated: SV-258086.automated
    manual: SV-258086.manual
  default_check: default
