    value: RHEL-09-231080
  - scheme: disa-vulnerability-id
    value: V-257857
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the "/etc/fstab" to use the "noexec" option on file systems that are associated
      with removable media.
