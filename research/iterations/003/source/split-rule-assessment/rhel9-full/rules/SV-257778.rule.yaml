    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Install RHEL 9 security patches and updates at the organizationally defined frequency.
      If system updates are installed via a centralized repository that is configured on the system, all
      updates can be installed with the following command: $ sudo dnf update'
