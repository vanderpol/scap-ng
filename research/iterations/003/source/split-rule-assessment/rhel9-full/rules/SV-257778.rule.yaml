rule:
  id: SV-257778
  version: r1134892
  title: RHEL 9 vendor packaged system security patches and updates must be installed and up to date.
  severity: medium
  role: null
  weight: 10.0
  discussion: Installing software updates is a fundamental mitigation against the exploitation of publicly
    known vulnerabilities. If the most recent security patches and updates are not installed, unauthorized
    users may take advantage of weaknesses in the unpatched software. The lack of prompt attention to
    patching could result in a system compromise.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
