rule:
  id: SV-257821
  version: r1015077
  title: RHEL 9 must check the GPG signature of locally installed software packages before installation.
  severity: high
  role: null
  weight: 10.0
  discussion: Changes to any software components can have significant effects on the overall security
    of the operating system. This requirement ensures the software has not been tampered with and that
    it has been provided by a trusted vendor. All software packages must be signed with a cryptographic
    key recognized and approved by the organization. Verifying the authenticity of software prior to installation
    validates the integrity of the software package received from a vendor. This verifies the software
    has not been tampered with and that it has been provided by a trusted vendor.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-003992
  - scheme: cci
    value: CCI-001749
  - scheme: disa-stig-id
    value: RHEL-09-214020
  - scheme: disa-vulnerability-id
    value: V-257821
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure dnf to always check the GPG signature of local software packages before installation.
      Add or update the following line in the [main] section of the /etc/dnf/dnf.conf file: localpkg_gpgcheck=1'
  checks:
    default: SV-257821.automated
    automated: SV-257821.automated
    manual: SV-257821.manual
  default_check: default
