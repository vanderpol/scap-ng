rule:
  id: SV-257904
  version: r991589
  title: RHEL 9 /etc/gshadow- file must be owned by root.
  severity: medium
  role: null
  weight: 10.0
  discussion: The "/etc/gshadow-" file is a backup of "/etc/gshadow", and as such, contains group password
    hashes. Protection of this file is critical for system security.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-232120
  - scheme: disa-vulnerability-id
    value: V-257904
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Change the owner of the file /etc/gshadow- to root by running the following command: $
      sudo chown root /etc/gshadow-'
  checks:
    default: SV-257904.automated
    automated: SV-257904.automated
    manual: SV-257904.manual
  default_check: default
