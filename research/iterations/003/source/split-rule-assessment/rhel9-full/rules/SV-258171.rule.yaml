rule:
  id: SV-258171
  version: r1208777
  title: RHEL 9 must allow only the information system security manager (ISSM) (or individuals or roles
    appointed by the ISSM) to select which auditable events are to be audited.
  severity: medium
  role: null
  weight: 10.0
  discussion: Without the capability to restrict the roles and individuals that can select which events
    are audited, unauthorized personnel may be able to prevent the auditing of critical events. Misconfigured
    audits may degrade the system's performance by overwhelming the audit log. Misconfigured audits may
    also make it more difficult to establish, correlate, and investigate the events relating to an incident
    or identify those responsible for one.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000171
  - scheme: disa-stig-id
    value: RHEL-09-653110
  - scheme: disa-vulnerability-id
    value: V-258171
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the files in directory "/etc/audit/rules.d/" and the "/etc/audit/auditd.conf"
      file to have a mode of "0600" with the following commands: $ sudo chmod 0600 /etc/audit/rules.d/audit.rules
      $ sudo chmod 0600 /etc/audit/rules.d/[customrulesfile].rules $ sudo chmod 0600 /etc/audit/auditd.conf'
  checks:
    manual: SV-258171.manual
  default_check: manual
