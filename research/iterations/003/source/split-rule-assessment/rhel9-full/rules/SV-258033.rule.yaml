rule:
  id: SV-258033
  version: r1045120
  title: RHEL 9 must disable the user list at logon for graphical user interfaces.
  severity: medium
  role: null
  weight: 10.0
  discussion: Leaving the user list enabled is a security risk since it allows anyone with physical access
    to the system to enumerate known user accounts without authenticated access to the system.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-271115
  - scheme: disa-vulnerability-id
    value: V-258033
  - scheme: disa-srg-id
    value: SRG-OS-000480-GPOS-00227
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability:
  - linux.gnome-installed
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to disable the user list at logon for graphical user interfaces. Create
      a database to contain the systemwide screensaver settings (if it does not already exist) with the
      following command: Note: The example below is using the database "local" for the system. If the
      system is using another database in "/etc/dconf/profile/user", the file should be created under
      the appropriate subdirectory. $ sudo touch /etc/dconf/db/local.d/02-login-screen [org/gnome/login-screen]
      disable-user-list=true Update the system databases: $ sudo dconf update'
  checks:
    default: SV-258033.automated
    automated: SV-258033.automated
    manual: SV-258033.manual
  default_check: default
