rule:
  id: SV-257901
  version: r991589
  title: RHEL 9 /etc/group- file must be group-owned by root.
  severity: medium
  role: null
  weight: 10.0
  discussion: The "/etc/group-" file is a backup file of "/etc/group", and as such, contains information
    regarding groups that are configured on the system. Protection of this file is important for system
    security.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-232105
  - scheme: disa-vulnerability-id
    value: V-257901
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Change the group of the file /etc/group- to root by running the following command: $ sudo
      chgrp root /etc/group-'
  checks:
    default: SV-257901.automated
    automated: SV-257901.automated
    manual: SV-257901.manual
  default_check: default
