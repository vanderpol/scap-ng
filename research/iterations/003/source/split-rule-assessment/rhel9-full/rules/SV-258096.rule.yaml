rule:
  id: SV-258096
  version: r1045191
  title: RHEL 9 must configure the use of the pam_faillock.so module in the /etc/pam.d/password-auth file.
  severity: medium
  role: null
  weight: 10.0
  discussion: If the pam_faillock.so module is not loaded, the system will not correctly lockout accounts
    to prevent password guessing attacks.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000044
  - scheme: disa-stig-id
    value: RHEL-09-611035
  - scheme: disa-vulnerability-id
    value: V-258096
  - scheme: disa-srg-id
    value: SRG-OS-000021-GPOS-00005
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to include the use of the pam_faillock.so module in the /etc/pam.d/password-auth
      file. If PAM is managed with authselect, enable the feature with the following command: $ sudo authselect
      enable-feature with-faillock Otherwise, add/modify the appropriate sections of the "/etc/pam.d/password-auth"
      file to match the following lines: Note: The "preauth" line must be listed before pam_unix.so. auth
      required pam_faillock.so preauth auth required pam_faillock.so authfail account required pam_faillock.so'
  checks:
    default: SV-258096.manual
    manual: SV-258096.manual
  default_check: default
