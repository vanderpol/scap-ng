    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Modify "/etc/fstab" to use the "nosuid" option on the "/var/tmp" directory.
