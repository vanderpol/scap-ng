rule:
  id: SV-258061
  version: r958482
  title: RHEL 9 groups must have unique Group ID (GID).
  severity: medium
  role: null
  weight: 10.0
  discussion: To ensure accountability and prevent unauthenticated access, groups must be identified uniquely
    to prevent potential misuse and compromise of the system.
  rationale: null
