rule:
  id: SV-257998
  version: r1082181
  title: The RHEL 9 SSH server configuration file must be owned by root.
  severity: medium
  role: null
  weight: 10.0
  discussion: Service configuration files enable or disable features of their respective services, which
    if configured incorrectly, can lead to insecure and vulnerable configurations. Therefore, service
    configuration files must be owned by the correct group to prevent unauthorized changes.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-255110
  - scheme: disa-vulnerability-id
    value: V-257998
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the "/etc/ssh/sshd_config" file and the contents of "/etc/ssh/sshd_config.d"
      to be owned by root with the following command: $ sudo chown -R root /etc/ssh/sshd_config /etc/ssh/sshd_config.d'
  checks:
    manual: SV-257998.manual
  default_check: manual
