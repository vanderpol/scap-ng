rule:
  id: SV-257779
  version: r958390
  title: RHEL 9 must display the Standard Mandatory DOD Notice and Consent Banner before granting local
    or remote access to the system via a command line user logon.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'Display of a standardized and approved use notification before granting access to the operating
    system ensures privacy and security notification verbiage used is consistent with applicable federal
    laws, Executive Orders, directives, policies, regulations, standards, and guidance. System use notifications
    are required only for access via login interfaces with human users and are not required when such
    human interfaces do not exist. Satisfies: SRG-OS-000023-GPOS-00006, SRG-OS-000228-GPOS-00088'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000048
  - scheme: cci
    value: CCI-001384
  - scheme: cci
    value: CCI-001385
  - scheme: cci
    value: CCI-001386
  - scheme: cci
    value: CCI-001387
  - scheme: cci
    value: CCI-001388
  - scheme: disa-stig-id
    value: RHEL-09-211020
  - scheme: disa-vulnerability-id
    value: V-257779
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to display the Standard Mandatory DOD Notice and Consent Banner before
      granting access to the system via command line logon. Edit the "/etc/issue" file to replace the
      default text with the Standard Mandatory DOD Notice and Consent Banner. The DOD-required text is:
      "You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized
      use only. By using this IS (which includes any device attached to this IS), you consent to the following
      conditions: -The USG routinely intercepts and monitors communications on this IS for purposes including,
      but not limited to, penetration testing, COMSEC monitoring, network operations and defense, personnel
      misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations. -At any time,
      the USG may inspect and seize data stored on this IS. -Communications using, or data stored on,
      this IS are not private, are subject to routine monitoring, interception, and search, and may be
      disclosed or used for any USG-authorized purpose. -This IS includes security measures (e.g., authentication
      and access controls) to protect USG interests -- not for your personal benefit or privacy. -Notwithstanding
      the above, using this IS does not constitute consent to PM, LE or CI investigative searching or
      monitoring of the content of privileged communications, or work product, related to personal representation
      or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications
      and work product are private and confidential. See User Agreement for details."'
  checks:
    manual: SV-257779.manual
  default_check: manual
