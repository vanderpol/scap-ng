rule:
  id: SV-257845
  version: r1044920
  title: RHEL 9 must use a separate file system for /var.
  severity: low
  role: null
  weight: 10.0
  discussion: Ensuring that "/var" is mounted on its own partition enables the setting of more restrictive
    mount options. This helps protect system services such as daemons or other programs which use it.
    It is not uncommon for the "/var" directory to contain world-writable directories installed by other
    software packages.
  rationale: null
