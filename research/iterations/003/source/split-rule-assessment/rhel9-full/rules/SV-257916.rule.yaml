rule:
  id: SV-257916
  version: r1101916
  title: RHEL 9 /var/log/messages file must be owned by root.
  severity: medium
  role: null
  weight: 10.0
  discussion: Only authorized personnel should be aware of errors and the details of the errors. Error
    messages are an indicator of an organization's operational state or can identify the RHEL 9 system
    or platform. Additionally, personally identifiable information (PII) and operational information must
    not be revealed through error messages to unauthorized personnel or their designated representatives.
    The structure and content of error messages must be carefully considered by the organization and development
    team. The extent to which the information system is able to identify and handle error conditions is
    guided by organizational policy and operational requirements.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-001314
  - scheme: disa-stig-id
    value: RHEL-09-232180
  - scheme: disa-vulnerability-id
    value: V-257916
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Change the owner of the "/var/log/messages" file to "root" by running the following command:
      $ sudo chown root /var/log/messages'
  checks:
    default: SV-257916.automated
    automated: SV-257916.automated
    manual: SV-257916.manual
  default_check: default
