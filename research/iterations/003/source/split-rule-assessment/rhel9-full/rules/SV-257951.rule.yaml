rule:
  id: SV-257951
  version: r1014843
  title: RHEL 9 must be configured to prevent unrestricted mail relaying.
  severity: medium
  role: null
  weight: 10.0
  discussion: If unrestricted mail relaying is permitted, unauthorized senders could use this host as
    a mail relay for the purpose of sending spam or other unauthorized activity.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-252050
  - scheme: disa-vulnerability-id
    value: V-257951
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability:
  - linux.postfix-installed
  parameters: {}
  remediation:
    guidance: 'Modify the postfix configuration file to restrict client connections to the local network
      with the following command: $ sudo postconf -e ''smtpd_client_restrictions = permit_mynetworks,reject'''
  checks:
    default: SV-257951.automated
    automated: SV-257951.automated
    manual: SV-257951.manual
  default_check: default
