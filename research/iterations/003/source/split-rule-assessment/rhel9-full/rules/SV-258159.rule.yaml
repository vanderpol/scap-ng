rule:
  id: SV-258159
  version: r971542
  title: RHEL 9 must take action when allocated audit record storage volume reaches 95 percent of the
    repository maximum audit record storage capacity.
  severity: medium
  role: null
  weight: 10.0
  discussion: If action is not taken when storage volume reaches 95 percent utilization, the auditing
    system may fail when the storage volume reaches capacity.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-001855
  - scheme: disa-stig-id
    value: RHEL-09-653050
  - scheme: disa-vulnerability-id
    value: V-258159
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure "auditd" service to take action in the event of allocated audit record storage
      volume reaches 95 percent of the repository maximum audit record storage capacity. Edit the following
      line in "/etc/audit/auditd.conf" to ensure that the system is forced into single user mode in the
      event the audit record storage volume is about to reach maximum capacity: admin_space_left_action
      = single The audit daemon must be restarted for changes to take effect.'
  checks:
    manual: SV-258159.manual
  default_check: manual
