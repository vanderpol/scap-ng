rule:
  id: SV-257994
  version: r1045051
  title: RHEL 9 must force a frequent session key renegotiation for SSH connections to the server.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'Without protection of the transmitted information, confidentiality and integrity may be
    compromised because unprotected communications can be intercepted and either read or altered. This
    requirement applies to both internal and external networks and all types of information system components
    from which information can be transmitted (e.g., servers, mobile devices, notebook computers, printers,
    copiers, scanners, and facsimile machines). Communication paths outside the physical protection of
    a controlled boundary are exposed to the possibility of interception and modification. Protecting
    the confidentiality and integrity of organizational information can be accomplished by physical means
    (e.g., employing physical distribution systems) or by logical means (e.g., employing cryptographic
    techniques). If physical means of protection are employed, then logical means (cryptography) do not
    have to be employed, and vice versa. Session key regeneration limits the chances of a session key
    becoming compromised. Satisfies: SRG-OS-000423-GPOS-00187, SRG-OS-000033-GPOS-00014, SRG-OS-000424-GPOS-00188'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000068
  - scheme: cci
    value: CCI-002418
  - scheme: cci
    value: CCI-002421
  - scheme: disa-stig-id
    value: RHEL-09-255090
  - scheme: disa-vulnerability-id
    value: V-257994
  - scheme: disa-srg-id
    value: SRG-OS-000423-GPOS-00187
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to force a frequent session key renegotiation for SSH connections to the
      server by adding or modifying the following line in the "/etc/ssh/sshd_config" or in a file in "/etc/ssh/sshd_config.d":
      RekeyLimit 1G 1h Restart the SSH daemon for the settings to take effect. $ sudo systemctl restart
      sshd.service'
  checks:
    default: SV-257994.automated
    automated: SV-257994.automated
    manual: SV-257994.manual
  default_check: default
