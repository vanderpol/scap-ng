  discussion: 'The use of PIV credentials facilitates standardization and reduces the risk of unauthorized
    access. The DOD has mandated the use of the common access card (CAC) to support identity management
    and personal authentication for systems covered under Homeland Security Presidential Directive (HSPD)
    12, as well as making the CAC a primary component of layered protection for national security systems.
