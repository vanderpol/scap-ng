rule:
  id: SV-258153
  version: r1038966
  title: RHEL 9 audit system must take appropriate action when an error writing to the audit storage volume
    occurs.
  severity: medium
  role: null
  weight: 10.0
  discussion: It is critical that when the operating system is at risk of failing to process audit logs
    as required, it takes action to mitigate the failure. Audit processing failures include software/hardware
    errors; failures in the audit capturing mechanisms; and audit storage capacity being reached or exceeded.
    Responses to audit failure depend upon the nature of the failure mode.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000140
  - scheme: disa-stig-id
    value: RHEL-09-653020
  - scheme: disa-vulnerability-id
    value: V-258153
  - scheme: disa-srg-id
    value: SRG-OS-000047-GPOS-00023
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to shut down by default upon audit failure (unless availability is an
      overriding concern). Add or update the following line (depending on configuration "disk_error_action"
      can be set to "SYSLOG" or "SINGLE" depending on configuration) in "/etc/audit/auditd.conf" file:
      disk_error_action = HALT If availability has been determined to be more important, and this decision
      is documented with the information system security officer (ISSO), configure the operating system
      to notify SA staff and ISSO staff in the event of an audit processing failure by setting the "disk_error_action"
      to "SYSLOG".'
  checks:
    default: SV-258153.automated
    automated: SV-258153.automated
    manual: SV-258153.manual
  default_check: default
