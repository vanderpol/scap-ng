rule:
  id: RHEL-09-211030
  title: The graphical display manager must not be the default target on RHEL 9 unless approved.
  severity: medium
  role: null
  weight: 10.0
  discussion: Unnecessary service packages must not be installed to decrease the attack surface of the
    system. Graphical display managers have a long history of security vulnerabilities and must not be
    used, unless approved and documented.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  references:
  - text: DPMS Target Red Hat Enterprise Linux 9 DISA DPMS Target Red Hat Enterprise Linux 9 5551
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Document the requirement for a graphical user interface with the ISSO or set the default
      target to multi-user with the following command: $ sudo systemctl set-default multi-user.target'
  checks:
    default: RHEL-09-211030.automated
    automated: RHEL-09-211030.automated
    manual: RHEL-09-211030.manual
  default_check: default
