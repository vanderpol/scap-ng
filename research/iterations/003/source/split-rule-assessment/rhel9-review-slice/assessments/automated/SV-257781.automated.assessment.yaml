assessment:
  id: SV-257781.automated
  version: 1
  assessment_title: null
  mode: automated
  class: compliance
  purpose: assessment
  checks:
    default-target-symlinked-multi-user-target:
      test_title: default.target is symlinked to multi-user.target
      collect:
        object_title: null
        capability: unix.symlink
        select:
          filepath: /etc/systemd/system/default.target
      assert:
        state_title: null
        existence: all_exist
        check: all
        state:
          field: canonical_path
          operation: pattern match
          value: '[\S]*\/multi\-user\.target$'
  evaluate:
    check: default-target-symlinked-multi-user-target
