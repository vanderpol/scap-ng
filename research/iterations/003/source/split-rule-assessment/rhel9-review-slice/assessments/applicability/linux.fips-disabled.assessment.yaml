assessment:
  id: linux.fips-disabled.assessment
  version: 4
  assessment_title: RHEL9 and Not FIPS
  mode: automated
  class: compliance
  deprecated: false
  purpose: applicability
  checks:
    fips-enabled-1:
      test_title: fips_enabled == 1
      capability: independent.textfilecontent54
      collect:
        object_title: /proc/sys/crypto/fips_enabled
        capability: independent.textfilecontent54
        select:
          filepath:
            operation: equals
            datatype: string
            mask: false
            value: /proc/sys/crypto/fips_enabled
          pattern:
            operation: pattern match
            datatype: string
            mask: false
            value: ^(\d+)$
          instance:
            operation: greater than or equal
            datatype: int
            mask: false
            value: '1'
      assert:
        existence: all_exist
        check: all
        state:
          field: subexpression
          value: '1'
          operation: equals
          datatype: int
          mask: false
          entity_check: all
          entity_existence: at_least_one_exists
        state_capability: independent.textfilecontent54
  evaluate:
    not:
      check: fips-enabled-1
