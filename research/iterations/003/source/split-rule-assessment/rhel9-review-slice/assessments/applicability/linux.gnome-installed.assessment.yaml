assessment:
  id: linux.gnome-installed.assessment
  version: 2
  assessment_title: Gnome-shell Package
  mode: automated
  class: inventory
  purpose: applicability
  checks:
    gnome-installed:
      test_title: Gnome is installed
      collect:
        object_title: null
        capability: linux.rpminfo
        select:
          name: gnome-shell
      assert:
        existence: all_exist
        check: all
        state: null
    gnome-installed-2:
      test_title: Gnome is installed
      collect:
        object_title: null
        capability: linux.dpkginfo
        select:
          name: gnome-shell
      assert:
        existence: all_exist
        check: all
        state: null
  evaluate:
    any:
    - check: gnome-installed
    - check: gnome-installed-2
