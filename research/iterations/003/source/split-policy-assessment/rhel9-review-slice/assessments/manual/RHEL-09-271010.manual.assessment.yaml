assessment:
  id: RHEL-09-271010.manual
  assessment_title: Manual assessment for RHEL-09-271010
  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'Verify RHEL 9 displays the Standard Mandatory DOD Notice and Consent Banner before granting
    access to the operating system via a graphical user logon. Note: This requirement assumes the use
    of the RHEL 9 default graphical user interface, the GNOME desktop environment. If the system does
    not have any graphical user interface installed, this requirement is Not Applicable. Determine if
    the operating system displays a banner at the logon screen with the following command: $ gsettings
    get org.gnome.login-screen banner-message-enable true If the result is "false", this is a finding.'
  inputs: []
  evidence: []
