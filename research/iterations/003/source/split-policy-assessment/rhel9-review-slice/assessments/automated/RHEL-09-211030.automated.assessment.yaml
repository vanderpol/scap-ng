assessment:
  id: RHEL-09-211030.automated
  title: null
  mode: automated
  checks:
    default-target-symlinked-multi-user-target:
      title: default.target is symlinked to multi-user.target
      collect:
        title: null
        capability: unix.symlink
        select:
          filepath: /etc/systemd/system/default.target
      assert:
        title: null
        existence: all_exist
        check: all
        state:
          field: canonical_path
          operation: pattern match
          value: '[\S]*\/multi\-user\.target$'
  evaluate:
    check: default-target-symlinked-multi-user-target
