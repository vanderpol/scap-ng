assessment:
  id: RHEL-09-211040.automated
  title: null
  mode: automated
  checks:
    systemd-journald-service-active:
      title: The systemd-journald service is active.
      collect:
        title: null
        capability: linux.systemdunitproperty
        select:
          unit: systemd-journald.service
          property: ActiveState
      assert:
        title: null
        existence: at_least_one_exists
        check: all
        state:
          field: value
          operation: equals
          value: active
  evaluate:
    check: systemd-journald-service-active
