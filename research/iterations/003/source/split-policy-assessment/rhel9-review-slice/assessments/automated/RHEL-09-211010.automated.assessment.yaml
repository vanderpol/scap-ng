assessment:
  id: RHEL-09-211010.automated
  title: null
  mode: automated
  checks:
    rhel-9-minor-version-supported:
      title: The RHEL 9 minor version is supported.
      collect:
        title: null
        capability: independent.textfilecontent54
        select:
          path: /etc
          filename: redhat-release
          pattern:
            operation: pattern match
            value: ^\s*Red Hat Enterprise Linux release 9\.(\d+)
          instance:
            operation: greater than or equal
            value: '1'
      assert:
        title: null
        existence: at_least_one_exists
        check: all
        state:
          any:
          - field: subexpression
            operation: equals
            value: '7'
            datatype: int
          - field: subexpression
            operation: equals
            value: '8'
            datatype: int
          - field: subexpression
            operation: equals
            value: '9'
            datatype: int
          - field: subexpression
            operation: equals
            value: '10'
            datatype: int
  evaluate:
    check: rhel-9-minor-version-supported
