assessment:
  id: linux.gnome-installed.assessment
  title: Gnome-shell Package
  mode: automated
  checks:
    gnome-installed:
      title: Gnome is installed
      collect:
        title: null
        capability: linux.rpminfo
        select:
          name: gnome-shell
      assert:
        title: null
        existence: all_exist
        check: all
        state: null
    gnome-installed-2:
      title: Gnome is installed
      collect:
        title: null
        capability: linux.dpkginfo
        select:
          name: gnome-shell
      assert:
        title: null
        existence: all_exist
        check: all
        state: null
  evaluate:
    any:
    - check: gnome-installed
    - check: gnome-installed-2
  purpose: applicability
