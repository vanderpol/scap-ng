assessment:
  id: platform.rhel-9.assessment
  title: Red Hat Enterprise Linux 9
  mode: automated
  purpose: applicability
  checks:
    operating-system-identity:
      title: Red Hat Enterprise Linux 9
      collect:
        title: Operating system identity
        capability: linux.os-release
        select: {}
      assert:
        title: Red Hat Enterprise Linux 9
        existence: at_least_one_exists
        check: all
        state:
          all:
          - any:
            - field: id
              operation: equals
              value: rhel
          - field: version_id
            operation: pattern match
            value: ^9(?:\.|$)
  evaluate:
    check: operating-system-identity
