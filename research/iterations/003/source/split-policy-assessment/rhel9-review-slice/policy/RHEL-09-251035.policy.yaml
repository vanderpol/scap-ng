policy:
  id: RHEL-09-251035
  title: RHEL 9 must be configured to prohibit or restrict the use of functions, ports, protocols, and/or
    services, as defined in the Ports, Protocols, and Services Management (PPSM) Category Assignments
    List (CAL) and vulnerability assessments.
  severity: medium
  role: null
  weight: 10.0
  discussion: To prevent unauthorized connection of devices, unauthorized transfer of information, or
    unauthorized tunneling (i.e., embedding of data types within data types), organizations must disable
    or restrict unused or unnecessary ports, protocols, and services on information systems.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000382
  references:
  - text: DPMS Target Red Hat Enterprise Linux 9 DISA DPMS Target Red Hat Enterprise Linux 9 5551
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Update the host''s firewall settings and/or running services to comply with the PPSM CLSA
      for the site or program and the PPSM CAL. Then run the following command to load the newly created
      rule(s): $ sudo firewall-cmd --reload'
  checks:
    default: RHEL-09-251035.manual
    manual: RHEL-09-251035.manual
  default_check: default
