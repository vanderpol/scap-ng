policy:
  id: RHEL-09-211040
  title: RHEL 9 systemd-journald service must be enabled.
  severity: medium
  role: null
  weight: 10.0
  discussion: In the event of a system failure, RHEL 9 must preserve any information necessary to determine
    cause of failure and any information necessary to return to operations with least disruption to system
    processes.
  rationale: null
  documentable: false
  false_positives: null
  false_negatives: null
  mitigations: null
  potential_impacts: null
  responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-001665
  references:
  - text: DPMS Target Red Hat Enterprise Linux 9 DISA DPMS Target Red Hat Enterprise Linux 9 5551
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'To enable the systemd-journald service, run the following command: $ sudo systemctl enable
      --now systemd-journald'
  checks:
    default: RHEL-09-211040.automated
    automated: RHEL-09-211040.automated
    manual: RHEL-09-211040.manual
  default_check: default
