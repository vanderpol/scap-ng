  version: 1
  assessment_title: null
  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'Verify RHEL 9 does not accept IPv6 source-routed packets. Note: If IPv6 is disabled on the
    system, this requirement is Not Applicable. Check the value of the "net.ipv6.conf.all.accept_source_route"
    variable with the following command: $ sudo sysctl net.ipv6.conf.all.accept_source_route net.ipv6.conf.all.accept_source_route
    = 0 If "net.ipv6.conf.all.accept_source_route" is not set to "0" or is missing, this is a finding.'
