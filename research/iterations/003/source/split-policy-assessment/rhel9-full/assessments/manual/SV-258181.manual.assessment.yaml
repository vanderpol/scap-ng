  purpose: assessment
  procedure: 'Verify that RHEL 9 is configured to audit the execution of the "chacl" command with the
    following command: $ sudo auditctl -l | grep chacl -a always,exit -S all -F path=/usr/bin/chacl -F
    perm=x -F auid>=1000 -F auid!=-1 -F key=perm_mod If the command does not return a line, or the line
    is commented out, this is a finding.'
