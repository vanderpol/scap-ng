  class: compliance
  purpose: assessment
  procedure: 'Verify that the pam_unix.so module is configured to use sha512 in /etc/pam.d/password-auth
    with the following command: $ grep "^password.*pam_unix.so.*sha512" /etc/pam.d/password-auth password
    sufficient pam_unix.so sha512 If "sha512" is missing, or the line is commented out, this is a finding.
    If the system administrator (SA) can demonstrate that the required configuration is contained in a
    PAM configuration file included or substacked from the system-auth file, this is not a finding.'
