  version: 1
  assessment_title: null
  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'To verify that Linux Audit logging is enabled for the USBGuard daemon with the following
    command: $ sudo grep AuditBackend /etc/usbguard/usbguard-daemon.conf AuditBackend=LinuxAudit If "AuditBackend"
    is not set to "LinuxAudit", this is a finding. If the system is virtual machine with no virtual or
    physical USB peripherals attached, this is not a finding.'
