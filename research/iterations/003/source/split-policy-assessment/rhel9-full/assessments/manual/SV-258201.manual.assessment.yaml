  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'Verify that RHEL 9 is configured to audit the execution of the "ssh-agent" command with
    the following command: $ sudo auditctl -l | grep ssh-agent -a always,exit -S all -F path=/usr/bin/ssh-agent
    -F perm=x -F auid>=1000 -F auid!=-1 -F key=privileged-ssh If the command does not return a line, or
    the line is commented out, this is a finding.'
