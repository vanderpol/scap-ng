  assessment_title: null
  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'Verify that RHEL 9 is configured to audit the execution of the "poweroff" command with the
    following command: $ sudo auditctl -l | grep poweroff -a always,exit -S all -F path=/usr/sbin/poweroff
    -F perm=x -F auid>=1000 -F auid!=-1 -F key=privileged-poweroff If the command does not return a line,
    or the line is commented out, this is a finding.'
