assessment:
  id: SV-257862.manual
  version: 1
  assessment_title: null
  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'Note: For systems that use BIOS, this is not applicable. Verify the /boot/efi directory
    is mounted with the "nosuid" option with the following command: $ mount | grep ''\s/boot/efi\s'' /dev/sda1
    on /boot/efi type vfat (rw,nosuid,relatime,fmask=0077,dmask=0077,codepage=437,iocharset=ascii,shortname=winnt,errors=remount-ro)
    If the /boot/efi file system does not have the "nosuid" option set, this is a finding. Note: This
    control is not applicable to vfat file systems.'
  inputs: []
  evidence: []
