assessment:
  id: SV-258058.manual
  version: 1
  assessment_title: null
  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'Verify that there are no unauthorized interactive user accounts with the following command:
    $ less /etc/passwd root:x:0:0:root:/root:/bin/bash ... games:x:12:100:games:/usr/games:/sbin/nologin
    scsaustin:x:1001:1001:scsaustin:/home/scsaustin:/bin/bash djohnson:x:1002:1002:djohnson:/home/djohnson:/bin/bash
    Interactive user accounts generally will have a user identifier (UID) of 1000 or greater, a home directory
    in a specific partition, and an interactive shell. Obtain the list of interactive user accounts authorized
    to be on the system from the system administrator or information system security officer (ISSO) and
    compare it to the list of local interactive user accounts on the system. If there are unauthorized
    local user accounts on the system, this is a finding.'
  inputs: []
  evidence: []
