assessment:
  id: SV-258189.manual
  version: 1
  assessment_title: null
  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'Verify RHEL 9 is configured to audit the execution of the "delete_module" system call with
    the following command: $ sudo auditctl -l | grep delete_module -a always,exit -F arch=b32 -S delete_module
    -F auid>=1000 -F auid!=-1 -F key=module_chng -a always,exit -F arch=b64 -S delete_module -F auid>=1000
    -F auid!=-1 -F key=module_chng If both the "b32" and "b64" audit rules are not defined for the "delete_module"
    system call, or any of the lines returned are commented out, this is a finding.'
  inputs: []
  evidence: []
