assessment:
  id: SV-258017.manual
  version: 1
  assessment_title: null
  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'Note: This requirement assumes the use of the RHEL 9 default graphical user interface, the
    GNOME desktop environment. If the system does not have any graphical user interface installed, this
    requirement is Not Applicable. Verify RHEL 9 disables ability of the user to override the graphical
    user interface autorun setting. Check that the autorun setting is set to prevent user modification
    with the following command: $ gsettings writable org.gnome.desktop.media-handling autorun-never false
    If "autorun-never" is writable, the result is "true". If this is not documented with the information
    system security officer (ISSO) as an operational requirement, this is a finding.'
  inputs: []
  evidence: []
