assessment:
  id: SV-258098.manual
  version: 1
  assessment_title: null
  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'Verify RHEL 9 uses "pwquality" to enforce the password complexity rules in the system-auth
    file with the following command: $ grep pam_pwquality /etc/pam.d/system-auth password required pam_pwquality.so
    If the command does not return a line containing the value "pam_pwquality.so", or the line is commented
    out, this is a finding. If the system administrator (SA) can demonstrate that the required configuration
    is contained in a PAM configuration file included or substacked from the system-auth file, this is
    not a finding.'
  inputs: []
  evidence: []
