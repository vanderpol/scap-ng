assessment:
  id: SV-270178.manual
  version: 1
  assessment_title: null
  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'Verify the SSH client is configured to use only MACs employing FIPS 140-3 approved algorithms.
    To verify the MACs in the systemwide SSH configuration file, use the following command: $ grep -i
    MACs /etc/crypto-policies/back-ends/openssh.config MACs hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,hmac-sha2-256,hmac-sha2-512
    If the MACs entries in the "openssh.config" file have any hashes other than "hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,hmac-sha2-256,hmac-sha2-512",
    or they are missing or commented out, this is a finding.'
  inputs: []
  evidence: []
