  class: compliance
  purpose: assessment
  procedure: 'Verify RHEL 9 remote access using SSH prevents users from logging on directly as "root"
    with the following command: $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d
    ''\r'' | tr ''\n'' '' '' | xargs sudo grep -iH ''^\s*permitrootlogin'' PermitRootLogin no If the "PermitRootLogin"
    keyword is set to any value other than "no", is missing, or is commented out, this is a finding.'
