assessment:
  id: SV-257945.manual
  version: 1
  assessment_title: null
  mode: manual
  class: compliance
  purpose: assessment
  procedure: 'Verify RHEL 9 is securely comparing internal information system clocks at least every 24
    hours with an NTP server with the following commands: $ sudo grep maxpoll /etc/chrony.conf server
    0.us.pool.ntp.mil iburst maxpoll 16 If the "maxpoll" option is set to a number greater than 16 or
    the line is commented out, this is a finding. Verify the "chrony.conf" file is configured to an authoritative
    DOD time source by running the following command: $ sudo grep -i server /etc/chrony.conf server 0.us.pool.ntp.mil
    If the parameter "server" is not set or is not set to an authoritative DOD time source, this is a
    finding.'
  inputs: []
  evidence: []
