assessment:
  id: SV-257966.automated
  version: 2
  assessment_title: RHEL-09-253055 - RHEL 9 must not respond to Internet Control Message Protocol (ICMP)
    echoes sent to a broadcast address.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    net-ipv4-icmp-echo-ignore-broadcasts-set-1-in-kernel:
      test_title: net.ipv4.icmp_echo_ignore_broadcasts is set to 1 in kernel
      capability: unix.sysctl
      collect:
        object_title: null
        capability: unix.sysctl
        select:
          name: net.ipv4.icmp_echo_ignore_broadcasts
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: value
          operation: equals
          value: '1'
          datatype: int
        state_capability: unix.sysctl
  evaluate:
    check: net-ipv4-icmp-echo-ignore-broadcasts-set-1-in-kernel
