assessment:
  id: SV-257808.automated
  version: 3
  assessment_title: RHEL-09-213065 - RHEL 9 must disable the Transparent Inter Process Communication (TIPC)
    kernel module.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    etc-modprobe-d-contains-file-that-contains-install-tipc-bin:
      test_title: /etc/modprobe.d contains a file that contains 'install tipc /bin/false'
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          path: /etc/modprobe.d
          filename:
            operation: pattern match
            value: .*
          pattern:
            operation: pattern match
            value: ^[ \t]*install[ \t]+tipc[ \t]+/bin/false[ \t]*$
          instance:
            operation: greater than or equal
            datatype: int
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state: null
    etc-modprobe-d-contains-file-that-contains-blacklist-tipc:
      test_title: /etc/modprobe.d contains a file that contains 'blacklist tipc'
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          path: /etc/modprobe.d
          filename:
            operation: pattern match
            value: .*
          pattern:
            operation: pattern match
            value: ^[ \t]*blacklist[ \t]+tipc[ \t]*$
          instance:
            operation: greater than or equal
            datatype: int
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state: null
  evaluate:
    all:
    - check: etc-modprobe-d-contains-file-that-contains-install-tipc-bin
    - check: etc-modprobe-d-contains-file-that-contains-blacklist-tipc
