assessment:
  id: SV-257947.automated
  version: 1
  assessment_title: RHEL-09-252030 - RHEL 9 must disable network management of the chrony daemon.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    etc-chrony-conf-cmdport-option-set-0:
      test_title: '/etc/chrony.conf: cmdport option is set to 0'
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath: /etc/chrony.conf
          pattern:
            operation: pattern match
            value: ^[ \t]*cmdport[ \t]+0[ \t]*$
          instance:
            operation: greater than or equal
            datatype: int
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state: null
  evaluate:
    check: etc-chrony-conf-cmdport-option-set-0
