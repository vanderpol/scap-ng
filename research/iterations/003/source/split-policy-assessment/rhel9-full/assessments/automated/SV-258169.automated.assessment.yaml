assessment:
  id: SV-258169.automated
  version: 1
  assessment_title: RHEL-09-653100 - RHEL 9 must produce audit records containing information to establish
    the identity of any individual or process associated with the event.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    etc-audit-auditd-conf-log-format-enriched:
      test_title: '/etc/audit/auditd.conf: log_format = enriched'
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath: /etc/audit/auditd.conf
          pattern:
            operation: pattern match
            value: (?i)^\s*log_format\s*=\s*(\w+)\s*(?:#.*)?$
          instance:
            operation: greater than or equal
            datatype: int
            value: '1'
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: subexpression
          operation: pattern match
          value: (?i)^enriched$
        state_capability: independent.textfilecontent54
  evaluate:
    check: etc-audit-auditd-conf-log-format-enriched
