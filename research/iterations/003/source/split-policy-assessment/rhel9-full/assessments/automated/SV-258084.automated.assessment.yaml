assessment:
  id: SV-258084.automated
  version: 2
  assessment_title: RHEL-09-432015 - RHEL 9 must require reauthentication when using the "sudo" command.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    defaults-timestamp-timeout-configured-0-in-etc-sudoers-or-etc:
      test_title: Defaults timestamp_timeout is configured to 0 in /etc/sudoers or /etc/sudoers.d.
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        set:
          operator: union
          members:
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                filepath: /etc/sudoers
                pattern:
                  operation: pattern match
                  value: ^\s*Defaults\s+timestamp_timeout\s*=\s*([-\d]+)\s*$
                instance:
                  datatype: int
                  value: '1'
              behaviors:
                ignore_case: 'true'
          - collect:
              object_title: null
              capability: independent.textfilecontent54
              select:
                path: /etc/sudoers.d
                filename:
                  operation: pattern match
                  value: ^.*$
                pattern:
                  operation: pattern match
                  value: ^\s*Defaults\s+timestamp_timeout\s*=\s*([-\d]+)\s*$
                instance:
                  datatype: int
                  value: '1'
              behaviors:
                ignore_case: 'true'
                max_depth: '-1'
                recurse_direction: down
      assert:
        existence: only_one_exists
        check: all
        state:
          field: subexpression
          operation: equals
          value: '0'
          datatype: int
        state_capability: independent.textfilecontent54
  evaluate:
    check: defaults-timestamp-timeout-configured-0-in-etc-sudoers-or-etc
