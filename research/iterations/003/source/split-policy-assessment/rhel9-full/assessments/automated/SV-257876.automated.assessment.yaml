assessment:
  id: SV-257876.automated
  version: 1
  assessment_title: RHEL-09-231175 - RHEL 9 must mount /var/tmp with the nodev option.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    if-var-tmp-mounted-it-mounted-nodev-option:
      test_title: If /var/tmp is mounted, it is mounted with the nodev option
      capability: linux.partition
      collect:
        object_title: null
        capability: linux.partition
        select:
          mount_point: /var/tmp
      assert:
        existence: any_exist
        check: all
        state:
          field: mount_options
          operation: equals
          value: nodev
          entity_check: at least one
        state_capability: linux.partition
    if-var-tmp-configured-in-etc-fstab-it-configured-nodev:
      test_title: If /var/tmp is configured in /etc/fstab, it is configured with the nodev option
      capability: independent.textfilecontent54
      collect:
        object_title: null
        capability: independent.textfilecontent54
        select:
          filepath: /etc/fstab
          pattern:
            operation: pattern match
            value: ^\s*[^#\s]+\s+/var/tmp\s+\S+\s+(\S+)\s+\S+\s+\S+\s*$
          instance:
            datatype: int
            value: '1'
      assert:
        existence: any_exist
        check: all
        state:
          field: subexpression
          operation: pattern match
          value: (?:^nodev$|^nodev,|,nodev$|,nodev,)
        state_capability: independent.textfilecontent54
  evaluate:
    all:
    - check: if-var-tmp-mounted-it-mounted-nodev-option
    - check: if-var-tmp-configured-in-etc-fstab-it-configured-nodev
