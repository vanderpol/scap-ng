assessment:
  id: SV-257897.automated
  version: 1
  assessment_title: RHEL-09-232085 - RHEL 9 /etc/shadow- file must have mode 0000 or less permissive to
    prevent unauthorized access.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    etc-shadow-file-has-mode-0000-or-less-permissive:
      test_title: The /etc/shadow- file has mode 0000 or less permissive
      capability: unix.file
      collect:
        object_title: null
        capability: unix.file
        select:
          filepath: /etc/shadow-
      assert:
        existence: any_exist
        check: all
        state:
          all:
          - field: suid
            operation: equals
            value: 'false'
            datatype: boolean
          - field: sgid
            operation: equals
            value: 'false'
            datatype: boolean
          - field: sticky
            operation: equals
            value: 'false'
            datatype: boolean
          - field: uread
            operation: equals
            value: 'false'
            datatype: boolean
          - field: uwrite
            operation: equals
            value: 'false'
            datatype: boolean
          - field: uexec
            operation: equals
            value: 'false'
            datatype: boolean
          - field: gread
            operation: equals
            value: 'false'
            datatype: boolean
          - field: gwrite
            operation: equals
            value: 'false'
            datatype: boolean
          - field: gexec
            operation: equals
            value: 'false'
            datatype: boolean
          - field: oread
            operation: equals
            value: 'false'
            datatype: boolean
          - field: owrite
            operation: equals
            value: 'false'
            datatype: boolean
          - field: oexec
            operation: equals
            value: 'false'
            datatype: boolean
        state_title: mode 0000 or less permissive
        state_capability: unix.file
  evaluate:
    check: etc-shadow-file-has-mode-0000-or-less-permissive
