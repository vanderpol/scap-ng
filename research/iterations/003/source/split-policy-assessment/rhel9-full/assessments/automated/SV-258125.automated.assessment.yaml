assessment:
  id: SV-258125.automated
  version: 1
  assessment_title: RHEL-09-611180 - The pcscd service on RHEL 9 must be active.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    pcscd-socket-active:
      test_title: The pcscd socket is active.
      capability: linux.systemdunitproperty
      collect:
        object_title: null
        capability: linux.systemdunitproperty
        select:
          unit: pcscd.socket
          property: ActiveState
      assert:
        existence: at_least_one_exists
        check: all
        state:
          field: value
          operation: equals
          value: active
        state_capability: linux.systemdunitproperty
  evaluate:
    check: pcscd-socket-active
