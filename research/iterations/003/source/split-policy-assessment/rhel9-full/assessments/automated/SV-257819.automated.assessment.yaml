assessment:
  id: SV-257819.automated
  version: 13
  assessment_title: RHEL 9 must ensure cryptographic verification of vendor software packages.
  mode: automated
  class: compliance
  deprecated: false
  purpose: assessment
  checks:
    confirm-red-hat-package-signing-key-release-installed-on-system:
      test_title: Confirm Red Hat package-signing key (release) is installed on the system.
      capability: independent.shellcommand
      collect:
        object_title: Retrieve package-signing release key name.
        capability: independent.shellcommand
        select:
          shell: bash
          command: rpm -q --queryformat "%{SUMMARY}\n" gpg-pubkey | grep -i "red hat"
          pattern: release key
      assert:
        existence: at_least_one_exists
        check: at least one
        state:
          field: stdout_line
          operation: pattern match
          value: release key 2
        state_title: Confirm correct release key.
        state_capability: independent.shellcommand
    confirm-red-hat-package-signing-key-auxillary-installed-on-system:
      test_title: Confirm Red Hat package-signing key (auxillary) is installed on the system.
      capability: independent.shellcommand
      collect:
        object_title: Retrieve package-signing auxillary key name.
        capability: independent.shellcommand
        select:
          shell: bash
          command: rpm -q --queryformat "%{SUMMARY}\n" gpg-pubkey | grep -i "red hat"
          pattern: auxiliary key
      assert:
        existence: at_least_one_exists
        check: at least one
        state:
          field: stdout_line
          operation: pattern match
          value: auxiliary key 3
        state_title: Confirm correct auxilary key.
        state_capability: independent.shellcommand
    confirm-red-hat-package-signing-release-key-fingerprint-matches-vendor:
      test_title: Confirm Red Hat package-signing 'release' key fingerprint matches vendor values.
      capability: independent.shellcommand
      collect:
        object_title: Retrieve package-signing 'release' key fingerprint.
        capability: independent.shellcommand
        select:
          shell: bash
          command: gpg -q --keyid-format short --with-fingerprint /etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release
            | grep -P 'release key' -B 1
          pattern:
            operation: pattern match
            value: Key fingerprint\s*=\s*(.*)
      assert:
        existence: at_least_one_exists
        check: at least one
        state:
          field: subexpression
          operation: pattern match
          value: ^567E\s+347A\s+D004\s+4ADE\s+55BA\s+8A5F\s+199E\s+2F91\s+FD43\s+1D51$
        state_title: Confirm 'release' key finger print.
        state_capability: independent.shellcommand
    confirm-red-hat-package-signing-auxiliary-key-fingerprint-matches-vendor:
      test_title: Confirm Red Hat package-signing 'auxiliary' key fingerprint matches vendor values.
      capability: independent.shellcommand
      collect:
        object_title: Retrieve package-signing 'auxiliary' key fingerprint.
        capability: independent.shellcommand
        select:
          shell: bash
          command: gpg -q --keyid-format short --with-fingerprint /etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release
            | grep -P 'auxiliary key' -B 1
          pattern:
            operation: pattern match
            value: Key fingerprint\s*=\s*(.*)
      assert:
        existence: at_least_one_exists
        check: at least one
        state:
          field: subexpression
          operation: pattern match
          value: ^7E46\s+2425\s+8C40\s+6535\s+D56D\s+6F13\s+5054\s+E4A4\s+5A63\s+40B3$
        state_title: Confirm 'auxiliary' key fingerprint.
        state_capability: independent.shellcommand
  evaluate:
    all:
    - check: confirm-red-hat-package-signing-key-release-installed-on-system
    - check: confirm-red-hat-package-signing-key-auxillary-installed-on-system
    - check: confirm-red-hat-package-signing-release-key-fingerprint-matches-vendor
    - check: confirm-red-hat-package-signing-auxiliary-key-fingerprint-matches-vendor
