rule:
  id: SV-257928
  version: r1155576
  title: All RHEL 9 world-writable directories must be owned by root, sys, bin, or an application user.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'If a world-writable directory is not owned by root, sys, bin, or an application user identifier (UID),
    unauthorized users may be able to modify files created by others. The only authorized public directories are
    those temporary directories supplied with the system or those designed to be temporary file repositories. The
    setting is normally reserved for directories used by the system and by users for temporary file storage, (e.g.,
    /tmp), and for directories requiring global read/write access. Satisfies: SRG-OS-000480-GPOS-00227, SRG-OS-000138-GPOS-00069'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-001090
  - scheme: disa-stig-id
    value: RHEL-09-232240
  - scheme: disa-vulnerability-id
    value: V-257928
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure all RHEL 9 public directories to be owned by root or a system account to prevent unauthorized
      and unintended information transferred via shared system resources. Use the following command template to
      set ownership of public directories to root or a system account: $ sudo chown [root or system account] [Public
      Directory]'
  policy: ../policies/SV-257928.policy.yaml
