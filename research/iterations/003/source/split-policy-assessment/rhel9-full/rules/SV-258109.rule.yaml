rule:
  id: SV-258109
  version: r1045220
  title: RHEL 9 must enforce password complexity by requiring that at least one special character be used.
  severity: medium
  role: null
  weight: 10.0
  discussion: Use of a complex password helps to increase the time and resources required to compromise the password.
    Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing
    and brute-force attacks. Password complexity is one factor of several that determines how long it takes to crack
    a password. The more complex the password, the greater the number of possible combinations that need to be tested
    before the password is compromised. RHEL 9 utilizes "pwquality" as a mechanism to enforce password complexity.
    Note that to require special characters without degrading the "minlen" value, the credit value must be expressed
    as a negative number in "/etc/security/pwquality.conf".
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-004066
  - scheme: cci
    value: CCI-001619
  - scheme: disa-stig-id
    value: RHEL-09-611100
  - scheme: disa-vulnerability-id
    value: V-258109
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to enforce password complexity by requiring at least one special character be used
      by setting the "ocredit" option. Add or update the following line in the "/etc/security/pwquality.conf" file
      or a configuration file in the "/etc/security/pwquality.conf.d/" directory to contain the "ocredit" parameter:
      ocredit = -1'
  policy: ../policies/SV-258109.policy.yaml
