rule:
  id: SV-257832
  version: r1155653
  title: RHEL 9 must not have the gssproxy package installed.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'It is detrimental for operating systems to provide, or install by default, functionality exceeding
    requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore,
    may remain unsecured. They increase the risk to the platform by providing additional attack vectors. Operating
    systems are capable of providing a wide variety of functions and services. Some of the functions and services
    provided by default may not be necessary to support essential organizational operations (e.g., key missions,
    functions). The gssproxy package is a proxy for GSS API credential handling and could expose secrets on some
    networks. It is not needed for normal function of the OS. Satisfies: SRG-OS-000095-GPOS-00049, SRG-OS-000480-GPOS-00227'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000381
  - scheme: disa-stig-id
    value: RHEL-09-215045
  - scheme: disa-vulnerability-id
    value: V-257832
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability:
  - linux.nfs-mounted
  parameters: {}
  remediation:
    guidance: 'Remove the gssproxy package with the following command: $ sudo dnf remove gssproxy'
  policy: ../policies/SV-257832.policy.yaml
