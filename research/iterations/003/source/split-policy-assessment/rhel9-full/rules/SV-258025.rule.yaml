rule:
  id: SV-258025
  version: r958402
  title: RHEL 9 must initiate a session lock for graphical user interfaces when the screensaver is activated.
  severity: medium
  role: null
  weight: 10.0
  discussion: A session lock is a temporary action taken when a user stops work and moves away from the immediate
    physical vicinity of the information system but does not want to logout because of the temporary nature of the
    absence.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000057
  - scheme: disa-stig-id
    value: RHEL-09-271075
  - scheme: disa-vulnerability-id
    value: V-258025
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability:
  - linux.gnome-installed
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to initiate a session lock for graphical user interfaces when a screensaver is activated.
      Create a database to contain the system-wide screensaver settings (if it does not already exist) with the
      following command: Note: The example below is using the database "local" for the system, so if the system
      is using another database in "/etc/dconf/profile/user", the file should be created under the appropriate subdirectory.
      $ sudo touch /etc/dconf/db/local.d/00-screensaver [org/gnome/desktop/screensaver] lock-delay=uint32 5 The
      "uint32" must be included along with the integer key values as shown. Update the system databases: $ sudo
      dconf update'
  policy: policies/SV-258025.policy.yaml
