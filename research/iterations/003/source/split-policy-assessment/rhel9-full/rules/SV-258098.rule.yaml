rule:
  id: SV-258098
  version: r1045195
  title: RHEL 9 must ensure the password complexity module is enabled in the system-auth file.
  severity: medium
  role: null
  weight: 10.0
  discussion: Enabling PAM password complexity permits enforcement of strong passwords and consequently makes the
    system less prone to dictionary attacks.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-611045
  - scheme: disa-vulnerability-id
    value: V-258098
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to use "pwquality" to enforce password complexity rules. Add the following line
      to the "/etc/pam.d/system-auth" file(or modify the line to have the required value): password required pam_pwquality.so'
  policy: ../policies/SV-258098.policy.yaml
