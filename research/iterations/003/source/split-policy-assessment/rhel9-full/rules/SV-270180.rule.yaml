rule:
  id: SV-270180
  version: r1184327
  title: The RHEL 9 fapolicy module must be configured to employ a deny-all, permit-by-exception policy to allow
    the execution of authorized software programs.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'The organization must identify authorized software programs and permit execution of authorized software.
    The process used to identify software programs that are authorized to execute on organizational information
    systems is commonly referred to as allow listing. Using an allow list provides a configuration management method
    for allowing the execution of only authorized software. Using only authorized software decreases risk by limiting
    the number of potential vulnerabilities. Verification of allow listed software occurs prior to execution or
    at system startup. User home directories/folders may contain information of a sensitive nature. Nonprivileged
    users should coordinate any sharing of information with an SA through shared resources. RHEL 9 ships with many
    optional packages. One such package is a file access policy daemon called "fapolicyd". "fapolicyd" is a userspace
    daemon that determines access rights to files based on attributes of the process and file. It can be used to
    either block list or allow list processes or file access. Proceed with caution with enforcing the use of this
    daemon. Improper configuration may render the system nonfunctional. The "fapolicyd" API is not namespace aware
    and can cause issues when launching or running containers. Satisfies: SRG-OS-000368-GPOS-00154, SRG-OS-000370-GPOS-00155,
    SRG-OS-000480-GPOS-00232'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-001764
  - scheme: disa-stig-id
    value: RHEL-09-433016
  - scheme: disa-vulnerability-id
    value: V-270180
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to employ a deny-all, permit-by-exception application allow listing policy with
      "fapolicyd". With the "fapolicyd" installed and enabled, configure the daemon to function in permissive mode
      until the allow list is built correctly to avoid system lockout. Do this by editing the "/etc/fapolicyd/fapolicyd.conf"
      file with the following line: permissive = 1 Build the allow list in a file within the "/etc/fapolicyd/rules.d"
      directory, ensuring the last rule implements a deny-all policy, such as "deny perm=any all : all". Once it
      is determined the allow list is built correctly, set the "fapolicyd" to enforcing mode by editing the "permissive"
      line in the /etc/fapolicyd/fapolicyd.conf file. permissive = 0'
  policy: ../policies/SV-270180.policy.yaml
