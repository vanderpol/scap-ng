    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to enforce a minimum 15-character password length. Add or update the following line
      in the "/etc/security/pwquality.conf" file or a configuration file in the "/etc/security/pwquality.conf.d/"
      directory to contain the "minlen" parameter: minlen = 15'
  policy: ../policies/SV-258107.policy.yaml
