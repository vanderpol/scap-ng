rule:
  id: SV-258231
  version: r1208790
  title: RHEL 9 must employ FIPS 140-3-approved cryptographic hashing algorithms for all stored passwords.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'The system must use a strong hashing algorithm to store the password. Passwords need to be protected
    at all times, and encryption is the standard method for protecting passwords. If passwords are not encrypted,
    they can be plainly read (i.e., clear text) and easily compromised. Satisfies: SRG-OS-000073-GPOS-00041, SRG-OS-000120-GPOS-00061'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-004062
  - scheme: cci
    value: CCI-000803
  - scheme: cci
    value: CCI-000196
  - scheme: disa-stig-id
    value: RHEL-09-671015
  - scheme: disa-vulnerability-id
    value: V-258231
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Lock all interactive user accounts not using SHA-512 hashing until the passwords can be regenerated
      with SHA-512.
  policy: ../policies/SV-258231.policy.yaml
