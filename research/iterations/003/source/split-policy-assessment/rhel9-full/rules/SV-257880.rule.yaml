rule:
  id: SV-257880
  version: r1044951
  title: RHEL 9 must disable mounting of cramfs.
  severity: low
  role: null
  weight: 10.0
  discussion: It is detrimental for operating systems to provide, or install by default, functionality exceeding
    requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore
    may remain unsecured. They increase the risk to the platform by providing additional attack vectors. Removing
    support for unneeded filesystem types reduces the local attack surface of the server. Compressed ROM/RAM file
    system (or cramfs) is a read-only file system designed for simplicity and space-efficiency. It is mainly used
    in embedded and small-footprint systems.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000381
  - scheme: disa-stig-id
    value: RHEL-09-231195
  - scheme: disa-vulnerability-id
    value: V-257880
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'To configure the system to prevent the cramfs kernel module from being loaded, add the following
      lines to the file /etc/modprobe.d/blacklist.conf (or create blacklist.conf if it does not exist): install
      cramfs /bin/false blacklist cramfs'
  policy: policies/SV-257880.policy.yaml
