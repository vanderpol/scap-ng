rule:
  id: SV-257941
  version: r991589
  title: RHEL 9 network interfaces must not be in promiscuous mode.
  severity: medium
  role: null
  weight: 10.0
  discussion: Network interfaces in promiscuous mode allow for the capture of all network traffic visible to the
    system. If unauthorized individuals can access these applications, it may allow them to collect information
    such as logon IDs, passwords, and key exchanges between systems. If the system is being used to perform a network
    troubleshooting function, the use of these tools must be documented with the information systems security officer
    (ISSO) and restricted to only authorized personnel.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-251040
  - scheme: disa-vulnerability-id
    value: V-257941
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure network interfaces to turn off promiscuous mode unless approved by the ISSO and documented.
      Set the promiscuous mode of an interface to off with the following command: $ sudo ip link set dev <devicename>
      multicast off promisc off'
  policy: policies/SV-257941.policy.yaml
