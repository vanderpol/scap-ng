rule:
  id: SV-257827
  version: r1044892
  title: RHEL 9 must not have the sendmail package installed.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'The sendmail software was not developed with security in mind, and its design prevents it from being
    effectively contained by SELinux. Postfix must be used instead. Satisfies: SRG-OS-000480-GPOS-00227, SRG-OS-000095-GPOS-00049'
