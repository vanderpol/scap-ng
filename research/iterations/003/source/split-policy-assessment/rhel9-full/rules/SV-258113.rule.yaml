rule:
  id: SV-258113
  version: r1045232
  title: RHEL 9 must require the maximum number of repeating characters of the same character class be limited to
    four when passwords are changed.
  severity: medium
  role: null
  weight: 10.0
  discussion: Use of a complex password helps to increase the time and resources required to compromise the password.
    Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing
    and brute-force attacks. Password complexity is one factor of several that determines how long it takes to crack
    a password. The more complex a password, the greater the number of possible combinations that need to be tested
    before the password is compromised.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-004066
  - scheme: cci
    value: CCI-000195
  - scheme: disa-stig-id
    value: RHEL-09-611120
  - scheme: disa-vulnerability-id
    value: V-258113
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to require the change of the number of repeating characters of the same character
      class when passwords are changed by setting the "maxclassrepeat" option. Add or update the following line
      in the "/etc/security/pwquality.conf" file or a configuration file in the "/etc/security/pwquality.conf.d/"
      directory to contain the "maxclassrepeat" parameter: maxclassrepeat = 4'
  policy: ../policies/SV-258113.policy.yaml
