rule:
  id: SV-257984
  version: r1045026
  title: RHEL 9 SSHD must not allow blank passwords.
  severity: high
  role: null
  weight: 10.0
  discussion: 'If an account has an empty password, anyone could log on and run commands with the privileges of
    that account. Accounts with empty passwords should never be used in operational environments. Satisfies: SRG-OS-000106-GPOS-00053,
    SRG-OS-000480-GPOS-00229, SRG-OS-000480-GPOS-00227'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000766
  - scheme: disa-stig-id
    value: RHEL-09-255040
  - scheme: disa-vulnerability-id
    value: V-257984
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'To configure the system to prevent SSH users from logging on with blank passwords edit the following
      line in "/etc/ssh/sshd_config" or in a file in "/etc/ssh/sshd_config.d": PermitEmptyPasswords no Restart the
      SSH daemon for the settings to take effect: $ sudo systemctl restart sshd.service'
  policy: policies/SV-257984.policy.yaml
