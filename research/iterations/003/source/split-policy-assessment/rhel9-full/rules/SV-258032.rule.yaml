rule:
  id: SV-258032
  version: r1045117
  title: RHEL 9 must prevent a user from overriding the Ctrl-Alt-Del sequence settings for the graphical user interface.
  severity: medium
  role: null
  weight: 10.0
  discussion: A locally logged-in user who presses Ctrl-Alt-Del, when at the console, can reboot the system. If
    accidentally pressed, as could happen in the case of mixed OS environment, this can create the risk of short-term
    loss of availability of systems due to unintentional reboot.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-271110
  - scheme: disa-vulnerability-id
    value: V-258032
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability:
  - linux.gnome-installed
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to disallow the user changing the Ctrl-Alt-Del sequence in the GNOME desktop. Create
      a database to contain the systemwide graphical user logon settings (if it does not already exist) with the
      following command: $ sudo touch /etc/dconf/db/local.d/locks/session Add the following line to the session
      locks file to prevent nonprivileged users from modifying the Ctrl-Alt-Del setting: /org/gnome/settings-daemon/plugins/media-keys/logout
      Run the following command to update the database: $ sudo dconf update'
  policy: ../policies/SV-258032.policy.yaml
