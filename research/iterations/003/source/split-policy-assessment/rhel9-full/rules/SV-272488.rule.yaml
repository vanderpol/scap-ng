rule:
  id: SV-272488
  version: r1155665
  title: RHEL 9 must have the Postfix package installed.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'Postfix is a free, open-source mail transfer agent (MTA) that sends and receives emails. It is a
    server-side application that can be used to set up a local mail server, create a null-client mail relay, use
    a Postfix server as a destination for multiple domains, or choose an LDAP directory instead of files for lookups.
    Postfix supports protocols such as LDAP, SMTP AUTH (SASL), and TLS. It uses the Simple Mail Transfer Protocol
    (SMTP) to transfer emails between servers. Satisfies: SRG-OS-000304-GPOS-00121, SRG-OS-000343-GPOS-00134, SRG-OS-000363-GPOS-00150,
    SRG-OS-000447-GPOS-00201'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000015
  - scheme: disa-stig-id
    value: RHEL-09-215101
  - scheme: disa-vulnerability-id
    value: V-272488
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Install the Postfix package with the following command: $ sudo dnf install postfix'
