rule:
  id: SV-258071
  version: r991588
  title: RHEL 9 must enforce a delay of at least four seconds between logon prompts following a failed logon attempt.
  severity: medium
  role: null
  weight: 10.0
  discussion: Increasing the time between a failed authentication attempt and reprompting to enter credentials helps
    to slow a single-threaded brute force attack.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-412050
  - scheme: disa-vulnerability-id
    value: V-258071
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the RHEL 9 to enforce a delay of at least four seconds between logon prompts following
      a failed console logon attempt. Modify the "/etc/login.defs" file to set the "FAIL_DELAY" parameter to 4 or
      greater: FAIL_DELAY 4'
  policy: policies/SV-258071.policy.yaml
