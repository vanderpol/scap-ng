    value: CCI-001084
  - scheme: disa-stig-id
    value: RHEL-09-431025
  - scheme: disa-vulnerability-id
    value: V-258081
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
