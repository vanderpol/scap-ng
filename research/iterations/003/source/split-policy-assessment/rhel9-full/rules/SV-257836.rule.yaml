rule:
  id: SV-257836
  version: r1044908
  title: RHEL 9 must not have the quagga package installed.
  severity: medium
  role: null
  weight: 10.0
  discussion: Quagga is a network routing software suite providing implementations of Open Shortest Path First (OSPF),
    Routing Information Protocol (RIP), Border Gateway Protocol (BGP) for Unix and Linux platforms. If there is
    no need to make the router software available, removing it provides a safeguard against its activation.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-215065
  - scheme: disa-vulnerability-id
    value: V-257836
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Remove the quagga package with the following command: $ sudo dnf remove quagga'
  policy: ../policies/SV-257836.policy.yaml
