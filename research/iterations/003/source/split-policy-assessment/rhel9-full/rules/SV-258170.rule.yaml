rule:
  id: SV-258170
  version: r991589
  title: RHEL 9 must write audit records to disk.
  severity: medium
  role: null
  weight: 10.0
  discussion: Audit data should be synchronously written to disk to ensure log integrity. This setting assures that
    all audit event data is written disk.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-653105
  - scheme: disa-vulnerability-id
    value: V-258170
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the audit system to write log files to the disk. Edit the /etc/audit/auditd.conf file and
      add or update the "write_logs" option to "yes": write_logs = yes The audit daemon must be restarted for changes
      to take effect.'
  policy: policies/SV-258170.policy.yaml
