rule:
  id: SV-258029
  version: r1045109
  title: RHEL 9 must disable the ability of a user to restart the system from the login screen.
  severity: medium
  role: null
  weight: 10.0
  discussion: A user who is at the console can reboot the system at the login screen. If restart or shutdown buttons
    are pressed at the login screen, this can create the risk of short-term loss of availability of systems due
    to reboot.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-271095
  - scheme: disa-vulnerability-id
    value: V-258029
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability:
  - linux.gnome-installed
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to disable a user''s ability to restart the system. $ gsettings set org.gnome.login-screen
      disable-restart-buttons true Update the dconf system databases: $ sudo dconf update'
  policy: ../policies/SV-258029.policy.yaml
