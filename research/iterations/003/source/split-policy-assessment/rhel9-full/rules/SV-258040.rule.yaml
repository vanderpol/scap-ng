rule:
  id: SV-258040
  version: r991568
  title: RHEL 9 wireless network adapters must be disabled.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'This requirement applies to wireless peripheral technologies (e.g., wireless mice, keyboards, displays,
    etc.) used with RHEL 9 systems. Wireless peripherals (e.g., Wi-Fi/Bluetooth/IR keyboards, mice and pointing
    devices, and near field communications [NFC]) present a unique challenge by creating an open, unsecured port
    on a computer. Wireless peripherals must meet DOD requirements for wireless data transmission and be approved
    for use by the Authorizing Official (AO). Even though some wireless peripherals, such as mice and pointing devices,
    do not ordinarily carry information that need to be protected, modification of communications with these wireless
    peripherals may be used to compromise the RHEL 9 operating system. Satisfies: SRG-OS-000299-GPOS-00117, SRG-OS-000300-GPOS-00118,
    SRG-OS-000424-GPOS-00188, SRG-OS-000481-GPOS-00481'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-001443
  - scheme: cci
    value: CCI-001444
  - scheme: cci
    value: CCI-002418
  - scheme: cci
    value: CCI-002421
