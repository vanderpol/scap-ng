rule:
  id: SV-257867
  version: r958804
  title: RHEL 9 must mount /tmp with the noexec option.
  severity: medium
  role: null
  weight: 10.0
  discussion: The "noexec" mount option causes the system to not execute binary files. This option must be used
    for mounting any file system not containing approved binary files, as they may be incompatible. Executing files
    from untrusted file systems increases the opportunity for nonprivileged users to attain unauthorized administrative
    access.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-001764
  - scheme: disa-stig-id
    value: RHEL-09-231130
  - scheme: disa-vulnerability-id
    value: V-257867
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Modify "/etc/fstab" to use the "noexec" option on the "/tmp" directory.
  policy: policies/SV-257867.policy.yaml
