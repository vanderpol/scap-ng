rule:
  id: SV-258084
  version: r1050789
  title: RHEL 9 must require reauthentication when using the "sudo" command.
  severity: medium
  role: null
  weight: 10.0
  discussion: Without reauthentication, users may access resources or perform tasks for which they do not have authorization.
    When operating systems provide the capability to escalate a functional capability, it is critical the organization
    requires the user to reauthenticate when using the "sudo" command. If the value is set to an integer less than
    "0", the user's time stamp will not expire and the user will not have to reauthenticate for privileged actions
    until the user's session is terminated.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-004895
  - scheme: cci
    value: CCI-002038
  - scheme: disa-stig-id
    value: RHEL-09-432015
  - scheme: disa-vulnerability-id
    value: V-258084
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to reauthenticate "sudo" commands after the specified timeout: Add the following
      line to "/etc/sudoers" or a file in "/etc/sudoers.d": Defaults timestamp_timeout=0'
  policy: policies/SV-258084.policy.yaml
