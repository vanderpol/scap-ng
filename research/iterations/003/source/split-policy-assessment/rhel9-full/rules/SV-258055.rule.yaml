rule:
  id: SV-258055
  version: r1045140
  title: RHEL 9 must automatically lock the root account until the root account is released by an administrator
    when three unsuccessful logon attempts occur during a 15-minute time period.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'By limiting the number of failed logon attempts, the risk of unauthorized system access via user
    password guessing, also known as brute-forcing, is reduced. Limits are imposed by locking the account. Satisfies:
    SRG-OS-000329-GPOS-00128, SRG-OS-000021-GPOS-00005'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000044
  - scheme: cci
    value: CCI-002238
  - scheme: disa-stig-id
    value: RHEL-09-411080
  - scheme: disa-vulnerability-id
    value: V-258055
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'To configure RHEL 9 to lock out the "root" account after a number of incorrect logon attempts using
      "pam_faillock.so", first enable the feature using the following command: $ sudo authselect enable-feature
      with-faillock Edit the "/etc/security/faillock.conf" by uncommenting or adding the following line: even_deny_root'
  policy: policies/SV-258055.policy.yaml
