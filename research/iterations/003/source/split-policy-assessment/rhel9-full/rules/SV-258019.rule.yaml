rule:
  id: SV-258019
  version: r1045092
  title: RHEL 9 must be able to initiate directly a session lock for all connection types using smart card when
    the smart card is removed.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'A session lock is a temporary action taken when a user stops work and moves away from the immediate
    physical vicinity of the information system but does not want to log out because of the temporary nature of
    the absence. The session lock is implemented at the point where session activity can be determined. Rather than
    be forced to wait for a period of time to expire before the user session can be locked, RHEL 9 needs to provide
    users with the ability to manually invoke a session lock so users can secure their session if it is necessary
    to temporarily vacate the immediate physical vicinity. Satisfies: SRG-OS-000028-GPOS-00009, SRG-OS-000030-GPOS-00011'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000056
  - scheme: cci
    value: CCI-000057
  - scheme: cci
    value: CCI-000058
  - scheme: disa-stig-id
    value: RHEL-09-271045
  - scheme: disa-vulnerability-id
    value: V-258019
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability:
  - linux.gnome-installed
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to enable a user''s session lock until that user re-establishes access using established
      identification and authentication procedures. Select or create an authselect profile and incorporate the "with-smartcard-lock-on-removal"
      feature with the following example: $ sudo authselect select sssd with-smartcard with-smartcard-lock-on-removal
      Alternatively, the dconf settings can be edited in the /etc/dconf/db/* location. Add or update the [org/gnome/settings-daemon/peripherals/smartcard]
      section of the /etc/dconf/db/local.d/00-security-settings" database file and add or update the following lines:
      [org/gnome/settings-daemon/peripherals/smartcard] removal-action=''lock-screen'' Then update the dconf system
      databases: $ sudo dconf update'
  policy: policies/SV-258019.policy.yaml
