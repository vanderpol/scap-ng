rule:
  id: SV-257900
  version: r991589
  title: RHEL 9 /etc/group- file must be owned by root.
  severity: medium
  role: null
  weight: 10.0
  discussion: The "/etc/group-" file is a backup file of "/etc/group", and as such, contains information regarding
    groups that are configured on the system. Protection of this file is important for system security.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-232100
  - scheme: disa-vulnerability-id
    value: V-257900
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Change the owner of the file /etc/group- to root by running the following command: $ sudo chown root
      /etc/group-'
  policy: policies/SV-257900.policy.yaml
