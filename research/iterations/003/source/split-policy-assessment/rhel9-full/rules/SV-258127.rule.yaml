rule:
  id: SV-258127
  version: r1155648
  title: RHEL 9, for PKI-based authentication, must enforce authorized access to the corresponding private key.
  severity: medium
  role: null
  weight: 10.0
  discussion: If the private key is discovered, an attacker can use the key to authenticate as an authorized user
    and gain access to the network infrastructure. The cornerstone of the PKI is the private key used to encrypt
    or digitally sign information. If the private key is stolen, this will lead to the compromise of the authentication
    and nonrepudiation gained through PKI because the attacker can use the private key to digitally sign documents
    and pretend to be the authorized user. Both the holders of a digital certificate and the issuing authority must
    protect the computers, storage devices, or whatever they use to keep the private keys.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000186
  - scheme: disa-stig-id
    value: RHEL-09-611190
  - scheme: disa-vulnerability-id
    value: V-258127
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Create a new private and public key pair that utilizes a passcode with the following command: $ sudo
      ssh-keygen -N [passphrase]'
