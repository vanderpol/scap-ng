rule:
  id: SV-258045
  version: r958482
  title: RHEL 9 duplicate User IDs (UIDs) must not exist for interactive users.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'To ensure accountability and prevent unauthenticated access, interactive users must be identified
    and authenticated to prevent potential misuse and compromise of the system. Satisfies: SRG-OS-000104-GPOS-00051,
    SRG-OS-000121-GPOS-00062, SRG-OS-000042-GPOS-00020'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000135
  - scheme: cci
    value: CCI-000764
  - scheme: cci
    value: CCI-000804
  - scheme: disa-stig-id
    value: RHEL-09-411030
  - scheme: disa-vulnerability-id
    value: V-258045
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Edit the file "/etc/passwd" and provide each interactive user account that has a duplicate UID with
      a unique UID.
  policy: ../policies/SV-258045.policy.yaml
