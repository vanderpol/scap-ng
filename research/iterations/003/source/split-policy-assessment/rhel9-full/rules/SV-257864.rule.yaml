rule:
  id: SV-257864
  version: r1155639
  title: RHEL 9 must mount /dev/shm with the noexec option.
  severity: medium
  role: null
  weight: 10.0
  discussion: The "noexec" mount option causes the system to not execute binary files. This option must be used
    for mounting any file system not containing approved binary files, as they may be incompatible. Executing files
    from untrusted file systems increases the opportunity for nonprivileged users to attain unauthorized administrative
    access.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-001764
  - scheme: disa-stig-id
    value: RHEL-09-231115
  - scheme: disa-vulnerability-id
    value: V-257864
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure "/dev/shm" to mount with the "noexec" option. Modify "/etc/fstab" to use the "noexec" option
      on the "/dev/shm" file system. To reload all implicit mount units and update the dependency graph so that
      new options will apply correctly at next remount, run the following command: $ sudo systemctl daemon-reload
      Use the following command to apply the changes immediately without a reboot: $ sudo mount -o remount /dev/shm'
  policy: ../policies/SV-257864.policy.yaml
