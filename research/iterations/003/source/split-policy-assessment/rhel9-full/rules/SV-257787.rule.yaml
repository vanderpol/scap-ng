rule:
  id: SV-257787
  version: r1184288
  title: RHEL 9 must require a boot loader superuser password.
  severity: medium
  role: null
  weight: 10.0
  discussion: To mitigate the risk of unauthorized access to sensitive information by entities that have been issued
    certificates by DOD-approved PKIs, all DOD systems (e.g., web servers and web portals) must be properly configured
    to incorporate access control methods that do not rely solely on the possession of a certificate for access.
    Successful authentication must not automatically give an entity access to an asset or security boundary. Authorization
    procedures and controls must be implemented to ensure each authenticated entity also has a validated and current
    authorization. Authorization is the process of determining whether an entity, once authenticated, is permitted
    to access a specific asset. Information systems use access control policies and enforcement mechanisms to implement
    this requirement. Password protection on the boot loader configuration ensures users with physical access cannot
    trivially alter important bootloader settings. These include which kernel to use, and whether to enter single-user
    mode.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000213
  - scheme: disa-stig-id
    value: RHEL-09-212010
  - scheme: disa-vulnerability-id
    value: V-257787
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability:
  - linux.bios-boot
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to require a grub bootloader password for the grub superuser account. Generate an
      encrypted grub2 password for the grub superuser account with the following command: $ sudo grub2-setpassword
      Enter password: Confirm password:'
  policy: ../policies/SV-257787.policy.yaml
