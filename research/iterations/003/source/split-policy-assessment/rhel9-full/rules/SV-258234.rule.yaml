rule:
  id: SV-258234
  version: r1184292
  title: RHEL 9 must have the crypto-policies package installed.
  severity: high
  role: null
  weight: 10.0
  discussion: 'Centralized cryptographic policies simplify applying secure ciphers across an operating system and
    the applications that run on that operating system. Use of weak or untested encryption algorithms undermines
    the purposes of using encryption to protect data. Satisfies: SRG-OS-000396-GPOS-00176, SRG-OS-000393-GPOS-00173,
    SRG-OS-000394-GPOS-00174'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-002450
  - scheme: cci
    value: CCI-002890
  - scheme: cci
    value: CCI-003123
  - scheme: disa-stig-id
    value: RHEL-09-215100
  - scheme: disa-vulnerability-id
    value: V-258234
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Install the crypto-policies package (if the package is not already installed) with the following
      command: $ sudo dnf -y install crypto-policies'
