rule:
  id: SV-258122
  version: r1045246
  title: RHEL 9 must enable certificate based smart card authentication.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'Without the use of multifactor authentication, the ease of access to privileged functions is greatly
    increased. Multifactor authentication requires using two or more factors to achieve authentication. A privileged
    account is defined as an information system account with authorizations of a privileged user. The DOD Common
    Access Card (CAC) with DOD-approved PKI is an example of multifactor authentication. Satisfies: SRG-OS-000375-GPOS-00160,
    SRG-OS-000105-GPOS-00052'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000765
  - scheme: cci
    value: CCI-004046
  - scheme: cci
    value: CCI-004047
  - scheme: cci
    value: CCI-001948
  - scheme: disa-stig-id
    value: RHEL-09-611165
  - scheme: disa-vulnerability-id
    value: V-258122
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Edit the file "/etc/sssd/sssd.conf" or a configuration file in "/etc/sssd/conf.d" and add or edit
      the following line: pam_cert_auth = True'
  policy: policies/SV-258122.policy.yaml
