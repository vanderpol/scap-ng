rule:
  id: SV-258074
  version: r991590
  title: RHEL 9 must define default permissions for all authenticated users in such a way that the user can only
    read and modify their own files.
  severity: medium
  role: null
  weight: 10.0
  discussion: Setting the most restrictive default permissions ensures that when new accounts are created, they
    do not have unnecessary access.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-412065
  - scheme: disa-vulnerability-id
    value: V-258074
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to define default permissions for all authenticated users in such a way that the
      user can only read and modify their own files. Add or edit the lines for the "UMASK" parameter in the "/etc/login.defs"
      file to "077": UMASK 077'
  policy: ../policies/SV-258074.policy.yaml
