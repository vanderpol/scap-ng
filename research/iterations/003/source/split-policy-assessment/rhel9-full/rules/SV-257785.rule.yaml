rule:
  id: SV-257785
  version: r1044833
  title: The x86 Ctrl-Alt-Delete key sequence must be disabled on RHEL 9.
  severity: high
  role: null
  weight: 10.0
  discussion: 'A locally logged-on user who presses Ctrl-Alt-Delete when at the console can reboot the system. If
    accidentally pressed, as could happen in the case of a mixed OS environment, this can create the risk of short-term
    loss of availability of systems due to unintentional reboot. In a graphical user environment, risk of unintentional
    reboot from the Ctrl-Alt-Delete sequence is reduced because the user will be prompted before any action is taken.
    Satisfies: SRG-OS-000324-GPOS-00125, SRG-OS-000480-GPOS-00227'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-002235
  - scheme: disa-stig-id
    value: RHEL-09-211050
  - scheme: disa-vulnerability-id
    value: V-257785
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to disable the ctrl-alt-del.target with the following command: $ sudo systemctl
      disable --now ctrl-alt-del.target $ sudo systemctl mask --now ctrl-alt-del.target'
  policy: policies/SV-257785.policy.yaml
