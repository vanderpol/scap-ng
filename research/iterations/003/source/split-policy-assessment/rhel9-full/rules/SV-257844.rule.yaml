rule:
  id: SV-257844
  version: r1044918
  title: RHEL 9 must use a separate file system for /tmp.
  severity: medium
  role: null
  weight: 10.0
  discussion: The "/tmp" partition is used as temporary storage by many programs. Placing "/tmp" in its own partition
    enables the setting of more restrictive mount options, which can help protect programs that use it.
  rationale: null
  extensions:
    disa_stig:
