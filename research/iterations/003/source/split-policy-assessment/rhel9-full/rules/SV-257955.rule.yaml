rule:
  id: SV-257955
  version: r991589
  title: There must be no shosts.equiv files on RHEL 9.
  severity: high
  role: null
  weight: 10.0
  discussion: The shosts.equiv files are used to configure host-based authentication for the system via SSH. Host-based
    authentication is not sufficient for preventing unauthorized access to the system, as it does not require interactive
    identification and authentication of a connection request, or for the use of two-factor authentication.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-252070
  - scheme: disa-vulnerability-id
    value: V-257955
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Remove any found "shosts.equiv" files from the system. $ sudo rm /[path]/[to]/[file]/shosts.equiv
  policy: ../policies/SV-257955.policy.yaml
