rule:
  id: SV-258012
  version: r1014855
  title: RHEL 9 must display the Standard Mandatory DOD Notice and Consent Banner before granting local or remote
    access to the system via a graphical user logon.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'Display of a standardized and approved use notification before granting access to the operating system
    ensures privacy and security notification verbiage used is consistent with applicable federal laws, Executive
    Orders, directives, policies, regulations, standards, and guidance. For U.S. Government systems, system use
    notifications are required only for access via login interfaces with human users and are not required when such
    human interfaces do not exist. Satisfies: SRG-OS-000023-GPOS-00006, SRG-OS-000228-GPOS-00088'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000048
  - scheme: cci
    value: CCI-001384
  - scheme: cci
    value: CCI-001385
  - scheme: cci
    value: CCI-001386
  - scheme: cci
    value: CCI-001387
  - scheme: cci
    value: CCI-001388
  - scheme: disa-stig-id
    value: RHEL-09-271010
  - scheme: disa-vulnerability-id
    value: V-258012
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability:
  - linux.gnome-installed
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to display the Standard Mandatory DOD Notice and Consent Banner before granting
      access to the system via a graphical user logon. Create a database to contain the system-wide graphical user
      logon settings (if it does not already exist) with the following command: $ sudo touch /etc/dconf/db/local.d/01-banner-message
      Add the following lines to the [org/gnome/login-screen] section of the "/etc/dconf/db/local.d/01-banner-message":
      [org/gnome/login-screen] banner-message-enable=true Run the following command to update the database: $ sudo
      dconf update'
  policy: ../policies/SV-258012.policy.yaml
