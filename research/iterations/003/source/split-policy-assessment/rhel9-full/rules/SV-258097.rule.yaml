rule:
  id: SV-258097
  version: r1045193
  title: RHEL 9 must ensure the password complexity module is enabled in the password-auth file.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'Enabling PAM password complexity permits enforcement of strong passwords and consequently makes the
    system less prone to dictionary attacks. Satisfies: SRG-OS-000069-GPOS-00037, SRG-OS-000070-GPOS-00038, SRG-OS-000480-GPOS-00227'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-004066
  - scheme: cci
    value: CCI-000192
  - scheme: cci
    value: CCI-000193
  - scheme: disa-stig-id
    value: RHEL-09-611040
  - scheme: disa-vulnerability-id
    value: V-258097
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to use "pwquality" to enforce password complexity rules. Add the following line
      to the "/etc/pam.d/password-auth" file (or modify the line to have the required value): password required
      pam_pwquality.so'
  policy: ../policies/SV-258097.policy.yaml
