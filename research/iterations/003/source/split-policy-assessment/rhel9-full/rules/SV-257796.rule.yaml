rule:
  id: SV-257796
  version: r1044847
  title: RHEL 9 must enable auditing of processes that start prior to the audit daemon.
  severity: low
  role: null
  weight: 10.0
  discussion: 'Without the capability to generate audit records, it would be difficult to establish, correlate,
    and investigate the events relating to an incident or identify those responsible for one. If auditing is enabled
    late in the startup process, the actions of some startup processes may not be audited. Some audit systems also
    maintain state information only available if auditing is enabled before a given process is created. Satisfies:
    SRG-OS-000037-GPOS-00015, SRG-OS-000042-GPOS-00020, SRG-OS-000062-GPOS-00031, SRG-OS-000392-GPOS-00172, SRG-OS-000462-GPOS-00206,
    SRG-OS-000471-GPOS-00215, SRG-OS-000473-GPOS-00218, SRG-OS-000254-GPOS-00095'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000130
  - scheme: cci
    value: CCI-000135
  - scheme: cci
    value: CCI-000169
  - scheme: cci
    value: CCI-000172
  - scheme: cci
    value: CCI-001464
  - scheme: cci
    value: CCI-002884
  - scheme: disa-stig-id
    value: RHEL-09-212055
  - scheme: disa-vulnerability-id
    value: V-257796
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Enable auditing of processes that start prior to the audit daemon with the following command: $ sudo
      grubby --update-kernel=ALL --args="audit=1" Add or modify the following line in "/etc/default/grub" to ensure
      the configuration survives kernel updates: GRUB_CMDLINE_LINUX="audit=1"'
  policy: ../policies/SV-257796.policy.yaml
