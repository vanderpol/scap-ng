rule:
  id: SV-258149
  version: r1155580
  title: RHEL 9 must be configured to forward audit records via TCP to a different system or media from the system
    being audited via rsyslog.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'Information stored in one location is vulnerable to accidental or incidental deletion or alteration.
    Off-loading is a common process in information systems with limited audit storage capacity. RHEL 9 installation
    media provides "rsyslogd", a system utility providing support for message logging. Support for both internet
    and Unix domain sockets enables this utility to support both local and remote logging. Coupling this utility
    with "gnutls" (a secure communications library implementing the SSL, TLS and DTLS protocols) creates a method
    to securely encrypt and off-load auditing. Rsyslog provides three ways to forward message: the traditional UDP
    transport, which is extremely lossy but standard; the plain TCP based transport, which loses messages only during
    certain situations but is widely available; and the RELP transport, which does not lose messages but is currently
    available only as part of the rsyslogd 3.15.0 and above. Examples of each configuration: UDP *.* @remotesystemname
    TCP *.* @@remotesystemname RELP *.* :omrelp:remotesystemname:2514 Note that a port number was given as there
    is no standard port for RELP. Satisfies: SRG-OS-000479-GPOS-00224, SRG-OS-000480-GPOS-00227, SRG-OS-000342-GPOS-00133'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-001851
  - scheme: disa-stig-id
    value: RHEL-09-652055
  - scheme: disa-vulnerability-id
    value: V-258149
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to off-load audit records onto a different system or media from the system being
      audited via TCP using rsyslog by specifying the remote logging server in "/etc/rsyslog.conf" or "/etc/rsyslog.d/[customfile].conf"
      with the name or IP address of the log aggregation server. The following are examples of the configuration
      for the legacy syntax and for the newer Rainer script. Only one should be used. Using legacy ''@host:port"
      syntax example: *.* @@[remoteloggingserver]:[port] Using Rainer script example: action( type="omfwd" target="logserver.example.com"
      port="514" protocol="tcp" action.resumeRetryCount="-1" queue.type="linkedList" que.size="10000" ) Note: The
      Rainer Script above does not contain the required encryption settings.'
  policy: ../policies/SV-258149.policy.yaml
