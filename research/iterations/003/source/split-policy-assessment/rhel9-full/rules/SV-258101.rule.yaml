  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to enforce password complexity on the root account. Add or update the following
      line in the "/etc/security/pwquality.conf" file or a configuration file in the "/etc/security/pwquality.conf.d/"
      directory to contain the "enforce_for_root" parameter: enforce_for_root'
