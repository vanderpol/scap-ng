rule:
  id: SV-258104
  version: r1015104
  title: RHEL 9 passwords for new users or password changes must have a 24 hours minimum password lifetime restriction
    in /etc/login.defs.
  severity: medium
  role: null
  weight: 10.0
  discussion: Enforcing a minimum password lifetime helps to prevent repeated password changes to defeat the password
    reuse or history enforcement requirement. If users are allowed to immediately and continually change their password,
    then the password could be repeatedly changed in a short period of time to defeat the organization's policy
    regarding password reuse. Setting the minimum password age protects against users cycling back to a favorite
    password after satisfying the password reuse requirement.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-004066
  - scheme: cci
    value: CCI-000198
  - scheme: disa-stig-id
    value: RHEL-09-611075
  - scheme: disa-vulnerability-id
    value: V-258104
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to enforce 24 hours as the minimum password lifetime. Add the following line in
      "/etc/login.defs" (or modify the line to have the required value): PASS_MIN_DAYS 1'
  policy: policies/SV-258104.policy.yaml
