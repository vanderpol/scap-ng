rule:
  id: SV-257909
  version: r991589
  title: RHEL 9 /etc/passwd- file must be group-owned by root.
  severity: medium
  role: null
  weight: 10.0
  discussion: The "/etc/passwd-" file is a backup file of "/etc/passwd", and as such, contains information about
    the users that are configured on the system. Protection of this file is critical for system security.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-232145
  - scheme: disa-vulnerability-id
    value: V-257909
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Change the group of the file /etc/passwd- to root by running the following command: $ sudo chgrp
      root /etc/passwd-'
  policy: ../policies/SV-257909.policy.yaml
