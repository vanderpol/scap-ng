rule:
  id: SV-258140
  version: r1106460
  title: RHEL 9 must have the rsyslog package installed.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'rsyslogd is a system utility providing support for message logging. Support for both internet and
    Unix domain sockets enables this utility to support both local and remote logging. Couple this utility with
    "gnutls" (which is a secure communications library implementing the SSL, TLS, and DTLS protocols), to create
    a method to securely encrypt and offload auditing. Satisfies: SRG-OS-000479-GPOS-00224, SRG-OS-000051-GPOS-00024,
    SRG-OS-000480-GPOS-00227'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000154
  - scheme: cci
    value: CCI-001851
  - scheme: disa-stig-id
    value: RHEL-09-652010
  - scheme: disa-vulnerability-id
    value: V-258140
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Install the rsyslog package with the following command: $ sudo dnf install rsyslog'
