rule:
  id: SV-257834
  version: r1044904
  title: RHEL 9 must not have the tuned package installed.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'It is detrimental for operating systems to provide, or install by default, functionality exceeding
    requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore
    may remain unsecured. They increase the risk to the platform by providing additional attack vectors. Operating
    systems are capable of providing a wide variety of functions and services. Some of the functions and services,
    provided by default, may not be necessary to support essential organizational operations (e.g., key missions,
    functions). The tuned package contains a daemon that tunes the system settings dynamically. It does so by monitoring
    the usage of several system components periodically. Based on that information, components will then be put
    into lower or higher power savings modes to adapt to the current usage. The tuned package is not needed for
    normal OS operations. Satisfies: SRG-OS-000095-GPOS-00049, SRG-OS-000480-GPOS-00227'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000381
  - scheme: disa-stig-id
    value: RHEL-09-215055
  - scheme: disa-vulnerability-id
    value: V-257834
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Remove the tuned package with the following command: $ sudo dnf remove tuned'
  policy: ../policies/SV-257834.policy.yaml
