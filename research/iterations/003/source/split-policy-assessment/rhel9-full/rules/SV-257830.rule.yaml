rule:
  id: SV-257830
  version: r1134906
  title: RHEL 9 must not install packages from the Extra Packages for Enterprise Linux (EPEL) repository.
  severity: medium
  role: null
  weight: 10.0
  discussion: The EPEL is a repository of high-quality open-source packages for enterprise-class Linux distributions
    such as RHEL, CentOS, AlmaLinux, Rocky Linux, and Oracle Linux. These packages are not part of the official
    distribution but are built using the same Fedora build system to ensure compatibility and maintain quality standards.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000381
  - scheme: disa-stig-id
    value: RHEL-09-215035
  - scheme: disa-vulnerability-id
    value: V-257830
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'The repo package can be manually removed with the following command: $ sudo dnf remove epel-release
      Configure the operating system to disable use of the EPEL repository with the following command: $ sudo dnf
      config-manager --set-disabled epel'
  policy: policies/SV-257830.policy.yaml
