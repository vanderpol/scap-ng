rule:
  id: SV-258028
  version: r991589
  title: RHEL 9 effective dconf policy must match the policy keyfiles.
  severity: medium
  role: null
  weight: 10.0
  discussion: Unlike text-based keyfiles, the binary database is impossible to check through most automated and
    all manual means; therefore, in order to evaluate dconf configuration, both have to be true at the same time
    - configuration files have to be compliant, and the database needs to be more recent than those keyfiles, which
    gives confidence that it reflects them.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
