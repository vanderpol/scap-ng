rule:
  id: SV-257889
  version: r1184302
  title: All RHEL 9 local initialization files must have mode 0740 or less permissive.
  severity: medium
  role: null
  weight: 10.0
  discussion: Local initialization files are used to configure the user's shell environment upon logon. Malicious
    modification of these files could compromise accounts upon logon.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-232045
  - scheme: disa-vulnerability-id
    value: V-257889
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Set the mode of the local initialization files to "0740" with the following command: Note: The example
      will be for the disauser user, who has a home directory of "/home/disauser". $ sudo chmod 0740 /home/disauser/.<INIT_FILE>'
  policy: policies/SV-257889.policy.yaml
