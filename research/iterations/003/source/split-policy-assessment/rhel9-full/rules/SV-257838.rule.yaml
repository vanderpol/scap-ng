rule:
  id: SV-257838
  version: r1044912
  title: RHEL 9 must have the openssl-pkcs11 package installed.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'Without the use of multifactor authentication, the ease of access to privileged functions is greatly
    increased. Multifactor authentication requires using two or more factors to achieve authentication. A privileged
    account is defined as an information system account with authorizations of a privileged user. The DOD common
    access card (CAC) with DOD-approved PKI is an example of multifactor authentication. Satisfies: SRG-OS-000105-GPOS-00052,
    SRG-OS-000375-GPOS-00160, SRG-OS-000376-GPOS-00161, SRG-OS-000377-GPOS-00162'
  rationale: null
