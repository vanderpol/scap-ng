rule:
  id: SV-258162
  version: r1184331
  title: RHEL 9 must take appropriate action when the internal event queue is full.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'The audit system should have an action setup in the event the internal event queue becomes full so
    that no data is lost. Information stored in one location is vulnerable to accidental or incidental deletion
    or alteration. Offloading is a common process in information systems with limited audit storage capacity. Satisfies:
    SRG-OS-000342-GPOS-00133, SRG-OS-000479-GPOS-00224'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-001851
  - scheme: disa-stig-id
    value: RHEL-09-653065
  - scheme: disa-vulnerability-id
    value: V-258162
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Edit the /etc/audit/auditd.conf file and add or update the "overflow_action" option: overflow_action
      = syslog The audit daemon must be restarted for changes to take effect.'
  policy: policies/SV-258162.policy.yaml
