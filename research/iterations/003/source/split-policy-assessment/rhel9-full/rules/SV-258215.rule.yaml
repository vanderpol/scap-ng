rule:
  id: SV-258215
  version: r1155611
  title: Successful/unsuccessful uses of the umount system call in RHEL 9 must generate an audit record.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'The changing of file permissions could indicate that a user is attempting to gain access to information
    that would otherwise be disallowed. Auditing DAC modifications can facilitate the identification of patterns
    of abuse among both authorized and unauthorized users. Satisfies: SRG-OS-000037-GPOS-00015, SRG-OS-000062-GPOS-00031,
    SRG-OS-000392-GPOS-00172, SRG-OS-000462-GPOS-00206, SRG-OS-000471-GPOS-00215'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000130
  - scheme: cci
    value: CCI-000169
  - scheme: cci
    value: CCI-000172
  - scheme: cci
    value: CCI-002884
  - scheme: disa-stig-id
    value: RHEL-09-654205
  - scheme: disa-vulnerability-id
    value: V-258215
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the audit system to generate an audit event for any successful/unsuccessful use of the
      "umount" system call by adding or updating the following rules in "/etc/audit/audit.rules" and adding the
      following rules to "/etc/audit/rules.d/perm_mod.rules" or updating the existing rules in files in the "/etc/audit/rules.d/"
      directory: -a always,exit -F arch=b32 -S umount -F auid>=1000 -F auid!=unset -k privileged-umount To load
      the rules to the kernel immediately, use the following command: $ sudo augenrules --load'
  policy: policies/SV-258215.policy.yaml
