rule:
  id: SV-258017
  version: r1155688
  title: RHEL 9 must prevent a user from overriding the disabling of the graphical user interface autorun function.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'Techniques used to address this include protocols using nonces (e.g., numbers generated for a specific
    one-time use) or challenges (e.g., TLS, WS_Security). Additional techniques include time-synchronous or challenge-response
    one-time authenticators. Satisfies: SRG-OS-000114-GPOS-00059, SRG-OS-000378-GPOS-00163, SRG-OS-000480-GPOS-00227'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000778
  - scheme: cci
    value: CCI-001958
  - scheme: disa-stig-id
    value: RHEL-09-271035
  - scheme: disa-vulnerability-id
    value: V-258017
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability:
  - linux.gnome-installed
  parameters: {}
  remediation:
    guidance: 'Configure the GNOME desktop to not allow a user to change the setting that disables autorun on removable
      media. Add the following line to "/etc/dconf/db/local.d/locks/00-security-settings-lock" to prevent user modification:
      /org/gnome/desktop/media-handling/autorun-never Then update the dconf system databases: $ sudo dconf update'
  policy: policies/SV-258017.policy.yaml
