rule:
  id: SV-258225
  version: r1210927
  title: RHEL 9 must generate audit records for all account creations, modifications, disabling, and termination
    events that affect /var/log/lastlog.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'Without generating audit records specific to the security and mission needs of the organization,
    it would be difficult to establish, correlate, and investigate the events relating to an incident or identify
    those responsible for one. Satisfies: SRG-OS-000037-GPOS-00015, SRG-OS-000042-GPOS-00020, SRG-OS-000062-GPOS-00031,
    SRG-OS-000392-GPOS-00172, SRG-OS-000462-GPOS-00206, SRG-OS-000471-GPOS-00215, SRG-OS-000473-GPOS-00218, SRG-OS-000470-GPOS-00214'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000130
  - scheme: cci
    value: CCI-000135
  - scheme: cci
    value: CCI-000169
  - scheme: cci
    value: CCI-000172
  - scheme: cci
    value: CCI-002884
  - scheme: disa-stig-id
    value: RHEL-09-654255
  - scheme: disa-vulnerability-id
    value: V-258225
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to generate audit records for all account creations, modifications, disabling, and
      termination events that affect "/var/log/lastlog". Add or update the following file system rule to "/etc/audit/rules.d/audit.rules":
      -a always,exit -F arch=b32 -F path=/var/log/lastlog -F perm=wa -F auid>=1000 -F auid!=unset -k logins -a always,exit
      -F arch=b64 -F path=/var/log/lastlog -F perm=wa -F auid>=1000 -F auid!=unset -k logins To load the rules to
      the kernel immediately, use the following command: $ sudo augenrules --load'
  policy: ../policies/SV-258225.policy.yaml
