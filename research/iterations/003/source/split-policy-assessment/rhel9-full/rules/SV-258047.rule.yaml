rule:
  id: SV-258047
  version: r1101951
  title: RHEL 9 must automatically expire temporary accounts within 72 hours.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'Temporary accounts are privileged or nonprivileged accounts that are established during pressing
    circumstances, such as new software or hardware configuration or an incident response, where the need for prompt
    account activation requires bypassing normal account authorization procedures. If any inactive temporary accounts
    are left enabled on the system and are not either manually removed or automatically expired within 72 hours,
    the security posture of the system will be degraded and exposed to exploitation by unauthorized users or insider
    threat actors. Temporary accounts are different from emergency accounts. Emergency accounts, also known as "last
    resort" or "break glass" accounts, are local logon accounts enabled on the system for emergency use by authorized
    system administrators to manage a system when standard logon methods are failing or not available. Emergency
    accounts are not subject to manual removal or scheduled expiration requirements. The automatic expiration of
    temporary accounts may be extended as needed by the circumstances but it must not be extended indefinitely.
    A documented permanent account should be established for privileged users who need long-term maintenance accounts.
    Satisfies: SRG-OS-000123-GPOS-00064, SRG-OS-000002-GPOS-00002'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000016
  - scheme: cci
    value: CCI-001682
  - scheme: disa-stig-id
    value: RHEL-09-411040
  - scheme: disa-vulnerability-id
    value: V-258047
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the operating system to expire temporary accounts after 72 hours with the following command:
      $ sudo chage -E $(date -d +3days +%Y-%m-%d) <temporary_account_name>'
  policy: ../policies/SV-258047.policy.yaml
