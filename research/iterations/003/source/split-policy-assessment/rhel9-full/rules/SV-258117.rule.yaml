rule:
  id: SV-258117
  version: r1015116
  title: RHEL 9 must be configured to use the shadow file to store only encrypted representations of passwords.
  severity: medium
  role: null
  weight: 10.0
  discussion: Passwords need to be protected at all times, and encryption is the standard method for protecting
    passwords. If passwords are not encrypted, they can be plainly read (i.e., clear text) and easily compromised.
    Passwords that are encrypted with a weak algorithm are no more protected than if they are kept in plain text.
    This setting ensures user and group account administration utilities are configured to store only encrypted
    representations of passwords. Additionally, the "crypt_style" configuration option ensures the use of a strong
    hashing algorithm that makes password cracking attacks more difficult.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-004062
  - scheme: cci
    value: CCI-000196
  - scheme: disa-stig-id
    value: RHEL-09-611140
  - scheme: disa-vulnerability-id
    value: V-258117
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to store only SHA512 encrypted representations of passwords. Add or update the following
      line in the "/etc/login.defs" file: ENCRYPT_METHOD SHA512'
  policy: ../policies/SV-258117.policy.yaml
