rule:
  id: SV-257807
  version: r1044862
  title: RHEL 9 must disable the Stream Control Transmission Protocol (SCTP) kernel module.
  severity: medium
  role: null
  weight: 10.0
  discussion: It is detrimental for operating systems to provide, or install by default, functionality exceeding
    requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore
    may remain unsecured. They increase the risk to the platform by providing additional attack vectors. Failing
    to disconnect unused protocols can result in a system compromise. The Stream Control Transmission Protocol (SCTP)
    is a transport layer protocol, designed to support the idea of message-oriented communication, with several
    streams of messages within one connection. Disabling SCTP protects the system against exploitation of any flaws
    in its implementation.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000381
  - scheme: disa-stig-id
    value: RHEL-09-213060
  - scheme: disa-vulnerability-id
    value: V-257807
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'To configure the system to prevent the sctp kernel module from being loaded, add the following lines
      to the file /etc/modprobe.d/sctp.conf (or create sctp.conf if it does not exist): install sctp /bin/false
      blacklist sctp'
  policy: ../policies/SV-257807.policy.yaml
