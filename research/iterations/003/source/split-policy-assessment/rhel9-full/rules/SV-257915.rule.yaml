rule:
  id: SV-257915
  version: r1044971
  title: RHEL 9 /var/log directory must be group-owned by root.
  severity: medium
  role: null
  weight: 10.0
  discussion: Only authorized personnel should be aware of errors and the details of the errors. Error messages
    are an indicator of an organization's operational state or can identify the RHEL 9 system or platform. Additionally,
    personally identifiable information (PII) and operational information must not be revealed through error messages
    to unauthorized personnel or their designated representatives. The structure and content of error messages must
    be carefully considered by the organization and development team. The extent to which the information system
    is able to identify and handle error conditions is guided by organizational policy and operational requirements.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-001314
  - scheme: disa-stig-id
    value: RHEL-09-232175
  - scheme: disa-vulnerability-id
    value: V-257915
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the group owner of the directory "/var/log" to "root" by running the following command:
      $ sudo chgrp root /var/log'
  policy: ../policies/SV-257915.policy.yaml
