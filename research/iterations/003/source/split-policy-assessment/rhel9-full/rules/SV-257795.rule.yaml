rule:
  id: SV-257795
  version: r1044845
  title: RHEL 9 must enable mitigations against processor-based vulnerabilities.
  severity: low
  role: null
  weight: 10.0
  discussion: 'Kernel page-table isolation is a kernel feature that mitigates the Meltdown security vulnerability
    and hardens the kernel against attempts to bypass kernel address space layout randomization (KASLR). Satisfies:
    SRG-OS-000433-GPOS-00193, SRG-OS-000095-GPOS-00049'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000381
  - scheme: cci
    value: CCI-002824
  - scheme: disa-stig-id
    value: RHEL-09-212050
  - scheme: disa-vulnerability-id
    value: V-257795
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to enable kernel page-table isolation with the following command: $ sudo grubby
      --update-kernel=ALL --args="pti=on" Add or modify the following line in "/etc/default/grub" to ensure the
      configuration survives kernel updates: GRUB_CMDLINE_LINUX="pti=on"'
  policy: policies/SV-257795.policy.yaml
