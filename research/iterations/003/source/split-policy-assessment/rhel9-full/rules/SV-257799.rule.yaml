rule:
  id: SV-257799
  version: r1155697
  title: RHEL 9 must prevent the loading of a new kernel for later execution.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'Changes to any software components can have significant effects on the overall security of the operating
    system. This requirement ensures the software has not been tampered with and that it has been provided by a
    trusted vendor. Disabling kexec_load prevents an unsigned kernel image (that could be a windows kernel or modified
    vulnerable kernel) from being loaded. Kexec can be used subvert the entire secureboot process and should be
    avoided at all costs especially since it can load unsigned kernel images. The sysctl --system command will load
    settings from all system configuration files. All configuration files are sorted by their filename in lexicographical
    order, regardless of the directories in which they reside. If multiple files specify the same option, the entry
    in the file with the lexicographically latest name will take precedence. Files are read from directories in
    the following list from top to bottom. Once a file of a given filename is loaded, any file of the same name
    in subsequent directories is ignored. /etc/sysctl.d/*.conf /run/sysctl.d/*.conf /usr/local/lib/sysctl.d/*.conf
    /usr/lib/sysctl.d/*.conf /lib/sysctl.d/*.conf /etc/sysctl.conf Satisfies: SRG-OS-000480-GPOS-00227, SRG-OS-000366-GPOS-00153'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-003992
  - scheme: cci
    value: CCI-001749
  - scheme: disa-stig-id
    value: RHEL-09-213020
  - scheme: disa-vulnerability-id
    value: V-257799
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to disable kernel image loading. Create a drop-in if it does not already exist:
      $ sudo vi /etc/sysctl.d/99-kernel_kexec_load_disabled.conf Add the following to the file: kernel.kexec_load_disabled
      = 1 Reload settings from all system configuration files with the following command: $ sudo sysctl --system'
  policy: ../policies/SV-257799.policy.yaml
