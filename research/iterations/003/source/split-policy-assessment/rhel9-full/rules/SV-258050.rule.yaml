rule:
  id: SV-258050
  version: r1045137
  title: Executable search paths within the initialization files of all local interactive RHEL 9 users must only
    contain paths that resolve to the system default or the users home directory.
  severity: medium
  role: null
  weight: 10.0
  discussion: The executable search path (typically the PATH environment variable) contains a list of directories
    for the shell to search to find executables. If this path includes the current working directory (other than
    the users home directory), executables in these directories may be executed instead of system commands. This
    variable is formatted as a colon-separated list of directories. If there is an empty entry, such as a leading
    or trailing colon or two consecutive colons, this is interpreted as the current working directory. If deviations
    from the default system search path for the local interactive user are required, they must be documented with
    the information system security officer (ISSO).
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-411055
  - scheme: disa-vulnerability-id
    value: V-258050
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Edit the local interactive user initialization files to change any PATH variable statements that reference
      directories other than their home directory. If a local interactive user requires path variables to reference
      a directory owned by the application, it must be documented with the ISSO.
