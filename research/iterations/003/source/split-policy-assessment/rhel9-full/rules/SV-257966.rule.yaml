rule:
  id: SV-257966
  version: r1155742
  title: RHEL 9 must not respond to Internet Control Message Protocol (ICMP) echoes sent to a broadcast address.
  severity: medium
  role: null
  weight: 10.0
  discussion: Responding to broadcast (ICMP) echoes facilitates network mapping and provides a vector for amplification
    attacks. Ignoring ICMP echo requests (pings) sent to broadcast or multicast addresses makes the system slightly
    more difficult to enumerate on the network. There are notable differences between Internet Protocol version
    4 (IPv4) and Internet Protocol version 6 (IPv6). IPv6 does not implement the same method of broadcast as IPv4.
    Instead, IPv6 uses multicast addressing to the all-hosts multicast group. Refer to RFC4294 for an explanation
    of "IPv6 Node Requirements", which resulted in this difference between IPv4 and IPv6. The sysctl --system command
    will load settings from all system configuration files. All configuration files are sorted by their filename
    in lexicographical order, regardless of the directories in which they reside. If multiple files specify the
    same option, the entry in the file with the lexicographically latest name will take precedence. Files are read
    from directories in the following list from top to bottom. Once a file of a given filename is loaded, any file
    of the same name in subsequent directories is ignored. /etc/sysctl.d/*.conf /run/sysctl.d/*.conf /usr/local/lib/sysctl.d/*.conf
    /usr/lib/sysctl.d/*.conf /lib/sysctl.d/*.conf /etc/sysctl.conf
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-253055
  - scheme: disa-vulnerability-id
    value: V-257966
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to ignore IPv4 ICMP echoes sent to a broadcast address. Create a configuration file
      if it does not already exist: $ sudo vi /etc/sysctl.d/ipv4_icmp_echo_ignore_broadcasts.conf Add the following
      line to the file: net.ipv4.icmp_echo_ignore_broadcasts = 1 Reload settings from all system configuration files
      with the following command: $ sudo sysctl --system'
  policy: ../policies/SV-257966.policy.yaml
