rule:
  id: SV-258157
  version: r1134932
  title: RHEL 9 must notify the system administrator (SA) and information system security officer (ISSO) (at a minimum)
    when allocated audit record storage volume reaches 75 percent utilization.
  severity: medium
  role: null
  weight: 10.0
  discussion: If security personnel are not notified immediately when storage volume reaches 75 percent utilization,
    they are unable to plan for audit record storage capacity expansion.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-001855
  - scheme: disa-stig-id
    value: RHEL-09-653040
  - scheme: disa-vulnerability-id
    value: V-258157
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure RHEL 9 to initiate an action to notify the SA and ISSO (at a minimum) when allocated audit
      record storage volume reaches 75 percent of the repository maximum audit record storage capacity by adding/modifying
      the following line in the /etc/audit/auditd.conf file. space_left_action = email
  policy: ../policies/SV-258157.policy.yaml
