rule:
  id: SV-258003
  version: r1045065
  title: RHEL 9 SSH daemon must not allow GSSAPI authentication.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'Generic Security Service Application Program Interface (GSSAPI) authentication is used to provide
    additional authentication mechanisms to applications. Allowing GSSAPI authentication through SSH exposes the
    system''s GSSAPI to remote hosts, increasing the attack surface of the system. Satisfies: SRG-OS-000364-GPOS-00151,
    SRG-OS-000480-GPOS-00227'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-001813
  - scheme: disa-stig-id
    value: RHEL-09-255135
  - scheme: disa-vulnerability-id
    value: V-258003
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure the SSH daemon to not allow GSSAPI authentication. Add or uncomment the following line
      to "/etc/ssh/sshd_config" or to a file in "/etc/ssh/sshd_config.d" and set the value to "no": GSSAPIAuthentication
      no The SSH service must be restarted for changes to take effect: $ sudo systemctl restart sshd.service'
  policy: policies/SV-258003.policy.yaml
