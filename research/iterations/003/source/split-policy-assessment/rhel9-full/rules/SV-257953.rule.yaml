rule:
  id: SV-257953
  version: r958424
  title: RHEL 9 must forward mail from postmaster to the root account using a postfix alias.
  severity: medium
  role: null
  weight: 10.0
  discussion: It is critical for the appropriate personnel to be aware if a system is at risk of failing to process
    audit logs as required. Without this notification, the security personnel may be unaware of an impending failure
    of the audit capability, and system operation may be adversely affected. Audit processing failures include software/hardware
    errors, failures in the audit capturing mechanisms, and audit storage capacity being reached or exceeded.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000139
  - scheme: disa-stig-id
    value: RHEL-09-252060
  - scheme: disa-vulnerability-id
    value: V-257953
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure a valid email address as an alias for the root account. Append the following line to "/etc/aliases":
      postmaster: root Then, run the following command: $ sudo newaliases'
  policy: policies/SV-257953.policy.yaml
