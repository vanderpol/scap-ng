rule:
  id: SV-257816
  version: r1155715
  title: RHEL 9 must disable the use of user namespaces.
  severity: medium
  role: null
  weight: 10.0
  discussion: It is detrimental for operating systems to provide, or install by default, functionality exceeding
    requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore,
    may remain unsecured. They increase the risk to the platform by providing additional attack vectors. The sysctl
    --system command will load settings from all system configuration files. All configuration files are sorted
    by their filename in lexicographical order, regardless of the directories in which they reside. If multiple
    files specify the same option, the entry in the file with the lexicographically latest name will take precedence.
    Files are read from directories in the following list from top to bottom. Once a file of a given filename is
    loaded, any file of the same name in subsequent directories is ignored. /etc/sysctl.d/*.conf /run/sysctl.d/*.conf
    /usr/local/lib/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf /lib/sysctl.d/*.conf /etc/sysctl.conf
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-213105
  - scheme: disa-vulnerability-id
    value: V-257816
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to disable the use of user namespaces. Create the drop-in if it does not already
      exist: $ sudo vi /etc/sysctl.d/99-user_max_user_namespaces.conf Add the following line to the file: user.max_user_namespaces
      = 0 Reload settings from all system configuration files with the following command: $ sudo sysctl --system'
  policy: policies/SV-257816.policy.yaml
