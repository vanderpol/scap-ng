rule:
  id: SV-257992
  version: r1045047
  title: RHEL 9 must not allow a noncertificate trusted host SSH logon to the system.
  severity: medium
  role: null
  weight: 10.0
  discussion: SSH trust relationships mean a compromise on one host can allow an attacker to move trivially to other
    hosts.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-255080
  - scheme: disa-vulnerability-id
    value: V-257992
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'To configure RHEL 9 to not allow a noncertificate trusted host SSH logon to the system, add or modify
      the following line in "/etc/ssh/sshd_config" or in a file in "/etc/ssh/sshd_config.d". HostbasedAuthentication
      no Restart the SSH daemon for the settings to take effect: $ sudo systemctl restart sshd.service'
  policy: ../policies/SV-257992.policy.yaml
