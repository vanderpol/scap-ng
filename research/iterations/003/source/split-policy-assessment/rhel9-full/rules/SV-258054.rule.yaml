rule:
  id: SV-258054
  version: r958736
  title: RHEL 9 must automatically lock an account when three unsuccessful logon attempts occur.
  severity: medium
  role: null
  weight: 10.0
  discussion: 'By limiting the number of failed logon attempts, the risk of unauthorized system access via user
    password guessing, otherwise known as brute-force attacks, is reduced. Limits are imposed by locking the account.
    Satisfies: SRG-OS-000329-GPOS-00128, SRG-OS-000021-GPOS-00005'
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000044
  - scheme: cci
    value: CCI-002238
  - scheme: disa-stig-id
    value: RHEL-09-411075
  - scheme: disa-vulnerability-id
    value: V-258054
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to lock an account when three unsuccessful logon attempts occur. Add/modify the
      "/etc/security/faillock.conf" file to match the following line: deny = 3'
  policy: ../policies/SV-258054.policy.yaml
