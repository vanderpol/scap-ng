rule:
  id: SV-257803
  version: r1155668
  title: RHEL 9 must disable the kernel.core_pattern.
  severity: medium
  role: null
  weight: 10.0
  discussion: A core dump includes a memory image taken at the time the operating system terminates an application.
    The memory image could contain sensitive data and is generally useful only for developers trying to debug problems.
    The sysctl --system command will load settings from all system configuration files. All configuration files
    are sorted by their filename in lexicographical order, regardless of the directories in which they reside. If
    multiple files specify the same option, the entry in the file with the lexicographically latest name will take
    precedence. Files are read from directories in the following list from top to bottom. Once a file of a given
    filename is loaded, any file of the same name in subsequent directories is ignored. /etc/sysctl.d/*.conf /run/sysctl.d/*.conf
    /usr/local/lib/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf /lib/sysctl.d/*.conf /etc/sysctl.conf
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: cci
    value: CCI-000366
  - scheme: disa-stig-id
    value: RHEL-09-213040
  - scheme: disa-vulnerability-id
    value: V-257803
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to disable storing core dumps. Create a drop-in if it does not already exist: $
      sudo vi /etc/sysctl.d/99-kernel_core_pattern.conf Add the following to the file: kernel.core_pattern = |/bin/false
      Reload settings from all system configuration files with the following command: $ sudo sysctl --system'
  policy: ../policies/SV-257803.policy.yaml
