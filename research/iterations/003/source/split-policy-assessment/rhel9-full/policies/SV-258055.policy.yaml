policy:
  id: policy.rhel9.SV-258055
  version: r1045140
  title: RHEL 9 must automatically lock the root account until the root account is released by an administrator
    when three unsuccessful logon attempts occur during a 15-minute time period.
  checks:
    default:
      assessment: ../assessments/automated/SV-258055.automated.assessment.yaml
    automated:
      assessment: ../assessments/automated/SV-258055.automated.assessment.yaml
    manual:
      assessment: ../assessments/manual/SV-258055.manual.assessment.yaml
  default_check: default
