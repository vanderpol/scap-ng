policy:
  id: policy.rhel9.SV-270178
  version: r1184310
  title: The RHEL 9 SSH client must be configured to use only DOD-approved Message Authentication Codes (MACs) employing
    FIPS 140-3 validated cryptographic hash algorithms to protect the confidentiality of SSH client connections.
