scap_ng: "0.1-prototype"
prototype: true
model: combined-rule

rule:
  id: NG-DEMO-WIN-MANUAL-001
  title: "Illustrative Windows security configuration must be reviewed"
  severity: medium

  references:
    source: "illustrative DISA-style policy-only example"
    cci:
      - CCI-DEMO-0001

  discussion: |
    This rule exists to demonstrate policy-only SCAP-NG content.
    No automated assessment is defined.

  check: |
    Review the applicable Windows security configuration and verify the
    organization-defined setting is configured as required. Record the
    observed setting and any supporting evidence.

  fix: |
    Configure the applicable Windows security setting in accordance with
    organizational policy.

  provenance:
    classification: illustrative
    official_disa_content: false
