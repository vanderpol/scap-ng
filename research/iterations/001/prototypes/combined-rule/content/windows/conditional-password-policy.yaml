scap_ng: "0.1-prototype"
prototype: true
model: combined-rule

rule:
  id: NG-DEMO-WIN-001
  title: "Illustrative Windows password policy must meet role-specific requirements"
  severity: high

  discussion: |
    Demonstrates native conditional logic. Domain controllers and member
    servers have different illustrative minimum-length requirements.

  check: |
    Determine the Windows system role. If the system is a domain controller,
    verify the effective minimum password length is at least 15 characters
    and password history is at least 24. If the system is a member server,
    verify the effective minimum password length is at least 14 characters
    and password history is at least 24. Other roles are not applicable.

  fix: |
    Configure the effective password policy for the applicable system role.

  assessment:
    collect:
      system_role:
        capability: windows.system-role
      password_policy:
        capability: auth.password-policy
        fields:
          - minimum_length
          - history_count

    assert:
      if:
        when:
          compare:
            actual: "$system_role.role"
            op: eq
            expected: domain_controller
        then:
          all:
            - compare:
                subject: minimum_password_length
                actual: "$password_policy.minimum_length"
                op: ge
                expected: 15
            - compare:
                subject: password_history
                actual: "$password_policy.history_count"
                op: ge
                expected: 24

        elif:
          - when:
              compare:
                actual: "$system_role.role"
                op: eq
                expected: member_server
            then:
              all:
                - compare:
                    subject: minimum_password_length
                    actual: "$password_policy.minimum_length"
                    op: ge
                    expected: 14
                - compare:
                    subject: password_history
                    actual: "$password_policy.history_count"
                    op: ge
                    expected: 24

        else:
          outcome: not_applicable

    diagnostics:
      max_failure_causes: 3
