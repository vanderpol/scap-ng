scap_ng: 0.1-prototype
prototype: true
model: combined-rule
rule:
  id: NG-DEMO-WC-002
  title: Illustrative Windows client platform protections must satisfy required alternatives
  severity: high
  references:
    source: illustrative Windows Client STIG-like policy
    cci: [CCI-DEMO-WC-002]
  discussion: The client must satisfy a nested set of disk encryption, TPM/exception, Secure Boot, and advanced protection requirements.
  check: Verify BitLocker is enabled; verify either TPM 2.0 is present and ready or an approved virtualization exception exists; verify Secure Boot is enabled and either Credential Guard or approved application control is enabled.
  fix: Correct each failed platform-security condition or document the applicable approved exception.
