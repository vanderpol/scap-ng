scap_ng: 0.1-prototype
prototype: true
model: combined-rule
rule:
  id: NG-DEMO-WC-006
  title: Illustrative Windows client trusted publisher certificate requirement must be satisfied
  severity: medium
  references:
    source: illustrative Windows Client STIG-like policy
    cci: [CCI-DEMO-WC-006]
  discussion: This rule also exercises explicit collection-error behavior when the certificate store cannot be read.
  check: Review the machine TrustedPublisher store and verify the illustrative publisher certificate is present.
  fix: Correct certificate-store permissions and configure the required trust state.
  assessment:
    id: demo.windows.trusted-publisher-store
    version: 1
    collect:
      store: {capability: windows.certificate-store, scope: machine, store: TrustedPublisher}
    assert:
      exists:
        subject: illustrative_required_certificate
        in: "$store.certificates"
        where: {field: subject, op: eq, value: "CN=Illustrative Publisher"}
