scap_ng: 0.1-prototype
prototype: true
model: combined-rule
rule:
  id: NG-DEMO-WC-003
  title: Illustrative Windows client anti-malware real-time protection must be enabled
  severity: high
  references:
    source: illustrative Windows Client STIG-like policy
    cci: [CCI-DEMO-WC-003]
  discussion: Real-time anti-malware protection reduces exposure to malicious content on Windows clients.
  check: Verify Microsoft Defender real-time protection is enabled.
  fix: Enable Microsoft Defender real-time protection.
  assessment:
    id: demo.windows.defender-realtime
    version: 1
    collect:
      defender: {capability: windows.defender.status, fields: [realtime_protection_enabled]}
    assert:
      compare: {subject: realtime_protection_enabled, actual: "$defender.realtime_protection_enabled", op: eq, expected: true}
