scap_ng: 0.1-prototype
prototype: true
model: combined-rule
rule:
  id: NG-DEMO-WC-005
  title: Illustrative Windows client Credential Guard must be enabled when VBS is available
  severity: medium
  references:
    source: illustrative Windows Client STIG-like policy
    cci: [CCI-DEMO-WC-005]
  discussion: This client-specific requirement demonstrates applicability that may result in Not Applicable.
  check: If virtualization-based security is supported and enabled for the client, verify Credential Guard is enabled.
  fix: Enable Credential Guard when the client supports the required virtualization-based security features.
  applicability_text: Applicable only when the required virtualization-based security capability is available.
