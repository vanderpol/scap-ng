scap_ng: 0.1-prototype
prototype: true
model: combined-rule
rule:
  id: NG-DEMO-LNX-002
  title: Illustrative SSH daemon effective configuration must prohibit direct root login and password authentication
  severity: high
  references:
    source: illustrative Linux STIG-like policy
    cci: [CCI-DEMO-LNX-002]
  discussion: The effective SSH configuration may be assembled from multiple files and Include directives; the scanner should return effective values.
  check: Verify the effective sshd configuration sets PermitRootLogin to no and PasswordAuthentication to no.
  fix: Configure sshd so the effective settings prohibit direct root login and password authentication.
  assessment:
    id: demo.linux.sshd-effective-baseline
    version: 1
    collect:
      sshd: {capability: linux.sshd.effective-config, fields: [permit_root_login, password_authentication], include_resolution: true}
    assert:
      all:
        - compare: {subject: permit_root_login, actual: "$sshd.permit_root_login", op: eq, expected: "no"}
        - compare: {subject: password_authentication, actual: "$sshd.password_authentication", op: eq, expected: "no"}
