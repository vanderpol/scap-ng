scap_ng: 0.1-prototype
prototype: true
model: combined-rule
benchmark:
  id: demo.linux.iteration001.policy-only.combined-rule
  title: SCAP-NG Iteration 001 Linux Policy-Only Benchmark (combined-rule)
  version: '001'
  status: research-prototype
  platform: linux
  rule_count: 7
  rules:
  - NG-DEMO-LNX-001
  - NG-DEMO-LNX-002
  - NG-DEMO-LNX-003
  - NG-DEMO-LNX-004
  - NG-DEMO-LNX-005
  - NG-DEMO-LNX-006
  - NG-DEMO-LNX-MANUAL-001
  notes: Illustrative content only; not an official security baseline.
profile:
  id: demo.linux.full
  title: Full prototype profile
  select:
  - NG-DEMO-LNX-001
  - NG-DEMO-LNX-002
  - NG-DEMO-LNX-003
