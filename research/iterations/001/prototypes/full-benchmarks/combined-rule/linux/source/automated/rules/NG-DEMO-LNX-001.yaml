scap_ng: 0.1-prototype
prototype: true
model: combined-rule
rule:
  id: NG-DEMO-LNX-001
  title: Illustrative Linux files in the protected scope must have valid owners
  severity: medium
  references:
    source: illustrative Linux STIG-like policy
    cci: [CCI-DEMO-LNX-001]
  discussion: This rule may evaluate millions of filesystem entries and is used to exercise bounded evidence and early termination.
  check: Examine files and directories beneath /usr. Every entry must resolve to a valid local or directory-service owner.
  fix: Assign a valid owner to each reported file or directory.
  assessment:
    id: demo.linux.filesystem-valid-owner
    version: 1
    parameters:
      root: /usr
      max_evidence: 50
      stop_after: 50
    collect:
      protected_entries:
        capability: filesystem.entries
        root: /usr
        recursive: true
        fields: [path, uid, owner_name, owner_resolves]
    assert:
      every:
        item: "$protected_entries"
        condition:
          compare: {subject: owner_resolves, actual: "$item.owner_resolves", op: eq, expected: true}
    evidence:
      max_records: 50
    evaluation:
      stop_after_violations: 50
