scap_ng: 0.1-prototype
prototype: true
model: combined-rule
benchmark:
  id: demo.linux.iteration001.automated.combined-rule
  title: SCAP-NG Iteration 001 Linux Automated Benchmark (combined-rule)
  version: '001'
  status: research-prototype
  platform: linux
  rule_count: 7
  rules:
  - NG-DEMO-LNX-001
  - NG-DEMO-LNX-002
  - NG-DEMO-LNX-003
  - NG-DEMO-LNX-004
  - NG-DEMO-LNX-005
  - NG-DEMO-LNX-006
  - NG-DEMO-LNX-MANUAL-001
  notes: Illustrative content only; not an official security baseline.
profile:
  id: demo.linux.full
  title: Full prototype profile
  select:
  - NG-DEMO-LNX-001
  - NG-DEMO-LNX-002
  - NG-DEMO-LNX-003
  - NG-DEMO-LNX-004
  - NG-DEMO-LNX-005
  - NG-DEMO-LNX-006
  - NG-DEMO-LNX-MANUAL-001
rules:
- id: NG-DEMO-LNX-001
  title: Illustrative Linux files in the protected scope must have valid owners
  severity: medium
  references:
    source: illustrative SCAP-NG iteration 001 prototype
    cci:
    - CCI-DEMO-LNX-001
  discussion: This rule may evaluate millions of filesystem entries and is used to exercise bounded evidence and
    early termination.
  check: Examine files and directories beneath /usr. Every entry must resolve to a valid local or directory-service
    owner.
  fix: Assign a valid owner to each reported file or directory.
  provenance:
    classification: illustrative
    official_disa_content: false
  assessment:
    id: demo.linux.filesystem-valid-owner
    version: 1
    parameters:
      root:
        type: string
      max_evidence:
        type: integer
        minimum: 1
      stop_after:
        type: integer
        minimum: 1
    collect:
      protected_entries:
        capability: filesystem.entries
        root: $root
        recursive: true
        fields:
        - path
        - uid
        - owner_name
        - owner_resolves
    assert:
      every:
        item: $protected_entries
        condition:
          compare:
            subject: owner_resolves
            actual: $item.owner_resolves
            op: eq
            expected: true
    evidence:
      max_records: $max_evidence
    evaluation:
      stop_after_violations: $stop_after
    diagnostics:
      max_failure_causes: $max_evidence
- id: NG-DEMO-LNX-002
  title: Illustrative SSH daemon effective configuration must prohibit direct root login and password authentication
  severity: high
  references:
    source: illustrative SCAP-NG iteration 001 prototype
    cci:
    - CCI-DEMO-LNX-002
  discussion: The effective SSH configuration may be assembled from multiple files and Include directives; the scanner
    should return the effective values rather than require authors to reproduce parser precedence.
  check: Verify the effective sshd configuration sets PermitRootLogin to no and PasswordAuthentication to no.
  fix: Configure sshd so the effective settings prohibit direct root login and password authentication.
  provenance:
    classification: illustrative
    official_disa_content: false
  assessment:
    id: demo.linux.sshd-effective-baseline
    version: 1
    collect:
      sshd:
        capability: linux.sshd.effective-config
        fields:
        - permit_root_login
        - password_authentication
        include_resolution: true
    assert:
      all:
      - compare:
          subject: permit_root_login
          actual: $sshd.permit_root_login
          op: eq
          expected: 'no'
      - compare:
          subject: password_authentication
          actual: $sshd.password_authentication
          op: eq
          expected: 'no'
- id: NG-DEMO-LNX-003
  title: Illustrative OpenSSH server package must meet the minimum supported version
  severity: medium
  references:
    source: illustrative SCAP-NG iteration 001 prototype
    cci:
    - CCI-DEMO-LNX-003
  discussion: This rule demonstrates typed package-version comparison.
  check: Verify the installed OpenSSH server package version is at least 8.7.
  fix: Upgrade the OpenSSH server package to a supported version.
  provenance:
    classification: illustrative
    official_disa_content: false
  assessment:
    id: demo.linux.openssh-minimum-version
    version: 1
    collect:
      package:
        capability: package.inventory
        name: openssh-server
        fields:
        - installed
        - version
    assert:
      all:
      - compare:
          subject: package_installed
          actual: $package.installed
          op: eq
          expected: true
      - compare:
          subject: package_version
          actual: $package.version
          op: version_ge
          expected: '8.7'
- id: NG-DEMO-LNX-004
  title: Illustrative IPv4 redirect acceptance must be disabled in all and default scopes
  severity: medium
  references:
    source: illustrative SCAP-NG iteration 001 prototype
    cci:
    - CCI-DEMO-LNX-004
  discussion: Both effective sysctl values must be disabled.
  check: Verify net.ipv4.conf.all.accept_redirects and net.ipv4.conf.default.accept_redirects are both 0.
  fix: Set both redirect-acceptance sysctl values to 0 and apply them.
  provenance:
    classification: illustrative
    official_disa_content: false
  assessment:
    id: demo.linux.ipv4-redirects-disabled
    version: 1
    collect:
      sysctl:
        capability: linux.sysctl.effective-values
        keys:
        - net.ipv4.conf.all.accept_redirects
        - net.ipv4.conf.default.accept_redirects
    assert:
      all:
      - compare:
          subject: all_accept_redirects
          actual: $sysctl.net.ipv4.conf.all.accept_redirects
          op: eq
          expected: 0
      - compare:
          subject: default_accept_redirects
          actual: $sysctl.net.ipv4.conf.default.accept_redirects
          op: eq
          expected: 0
    diagnostics:
      max_failure_causes: 2
- id: NG-DEMO-LNX-005
  title: Illustrative NFS export policy must be hardened when the NFS server is installed
  severity: medium
  references:
    source: illustrative SCAP-NG iteration 001 prototype
    cci:
    - CCI-DEMO-LNX-005
  discussion: The requirement only applies to systems providing NFS server functionality.
  check: If the NFS server package is installed, verify exports do not use the illustrative prohibited option.
  fix: Remove prohibited NFS export options.
  provenance:
    classification: illustrative
    official_disa_content: false
  applicability_text: Applicable only when the NFS server package is installed.
  assessment:
    id: demo.linux.nfs-export-policy
    version: 1
    collect:
      nfs_package:
        capability: package.inventory
        name: nfs-utils
        fields:
        - installed
      exports:
        capability: linux.nfs.effective-exports
        fields:
        - path
        - options
    applies_when:
      compare:
        actual: $nfs_package.installed
        op: eq
        expected: true
    assert:
      none:
        item: $exports
        condition:
          contains:
            actual: $item.options
            value: no_root_squash
- id: NG-DEMO-LNX-006
  title: Illustrative sudoers effective configuration must be parseable and meet the baseline
  severity: high
  references:
    source: illustrative SCAP-NG iteration 001 prototype
    cci:
    - CCI-DEMO-LNX-006
  discussion: This rule exists to demonstrate that a parser/collection error is distinct from noncompliance.
  check: Parse the effective sudoers configuration and verify the illustrative baseline requirement.
  fix: Correct sudoers syntax and configure the required baseline.
  provenance:
    classification: illustrative
    official_disa_content: false
  assessment:
    id: demo.linux.sudoers-baseline
    version: 1
    collect:
      sudoers:
        capability: linux.sudoers.effective-config
        resolve_includes: true
    assert:
      compare:
        subject: requiretty_disabled
        actual: $sudoers.defaults.requiretty
        op: eq
        expected: false
- id: NG-DEMO-LNX-MANUAL-001
  title: Illustrative Linux security configuration must be reviewed manually
  severity: medium
  references:
    source: illustrative SCAP-NG iteration 001 prototype
    cci:
    - CCI-DEMO-LNX-MANUAL
  discussion: This rule demonstrates policy-only assessment directly from Check Content.
  check: Review the organization-defined Linux security configuration and record the observed value and supporting
    evidence.
  fix: Configure the system to satisfy the organization-defined requirement.
  provenance:
    classification: illustrative
    official_disa_content: false
