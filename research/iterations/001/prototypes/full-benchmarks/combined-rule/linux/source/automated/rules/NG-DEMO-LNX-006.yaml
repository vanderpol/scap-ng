scap_ng: 0.1-prototype
prototype: true
model: combined-rule
rule:
  id: NG-DEMO-LNX-006
  title: Illustrative sudoers effective configuration must be parseable and meet the baseline
  severity: high
  references:
    source: illustrative Linux STIG-like policy
    cci: [CCI-DEMO-LNX-006]
  discussion: This rule exists to demonstrate that a parser/collection error is distinct from noncompliance.
  check: Parse the effective sudoers configuration and verify the illustrative baseline requirement.
  fix: Correct sudoers syntax and configure the required baseline.
  assessment:
    id: demo.linux.sudoers-baseline
    version: 1
    collect:
      sudoers: {capability: linux.sudoers.effective-config, resolve_includes: true}
    assert:
      compare: {subject: requiretty_disabled, actual: "$sudoers.defaults.requiretty", op: eq, expected: false}
