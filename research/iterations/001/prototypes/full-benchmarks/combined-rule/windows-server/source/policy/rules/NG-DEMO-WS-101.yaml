rule:
  id: NG-DEMO-WS-101
  title: Illustrative Windows server password policy must meet the server baseline
  severity: high
  references:
    source: illustrative Windows Server STIG-like policy
    cci: [CCI-DEMO-WS-101]
  discussion: The effective password policy must satisfy the server baseline.
  check: Verify the system is a member server and the effective minimum password length is at least 15 with password history of at least 24.
  fix: Configure the effective Windows server password policy.
