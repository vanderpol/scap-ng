scap_ng: 0.1-prototype
prototype: true
model: combined-rule
rule:
  id: NG-DEMO-WS-101
  title: Illustrative Windows server password policy must meet the server baseline
  severity: high
  references:
    source: illustrative Windows Server STIG-like policy
    cci: [CCI-DEMO-WS-101]
  discussion: The effective password policy must satisfy the server baseline.
  check: Verify the system is a member server and the effective minimum password length is at least 15 with password history of at least 24.
  fix: Configure the effective Windows server password policy.
  assessment:
    id: demo.windows.password-policy-by-role
    version: 1
    parameters:
      applicable_role: member_server
      minimum_length: 15
      history_count: 24
    collect:
      system_role: {capability: windows.system-role}
      password_policy: {capability: auth.password-policy, fields: [minimum_length, history_count]}
    assert:
      if:
        when:
          compare: {actual: "$system_role.role", op: eq, expected: member_server}
        then:
          all:
            - compare: {subject: minimum_password_length, actual: "$password_policy.minimum_length", op: ge, expected: 15}
            - compare: {subject: password_history, actual: "$password_policy.history_count", op: ge, expected: 24}
        else:
          outcome: not_applicable
