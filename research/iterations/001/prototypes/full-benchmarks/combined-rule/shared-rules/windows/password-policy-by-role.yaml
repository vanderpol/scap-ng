scap_ng: 0.1-prototype
prototype: true
model: combined-rule-overlay
shared_rule:
  id: demo.windows.shared.password-policy-by-role
  version: 1
  rule:
    title: Illustrative Windows password policy must meet the applicable role baseline
    severity: high
    discussion: The effective password policy must satisfy the baseline selected for the system role.
    check: Verify the applicable Windows role and its effective minimum password length and password history.
    fix: Configure the effective Windows password policy for the applicable role.
    assessment:
      id: demo.windows.password-policy-by-role
      version: 1
      parameter_schema:
        applicable_role: {type: string}
        minimum_length: {type: integer, minimum: 1}
        history_count: {type: integer, minimum: 0}
      collect:
        system_role: {capability: windows.system-role}
        password_policy: {capability: auth.password-policy, fields: [minimum_length, history_count]}
      assert:
        if:
          when:
            compare: {actual: "$system_role.role", op: eq, expected: "$applicable_role"}
          then:
            all:
              - compare: {subject: minimum_password_length, actual: "$password_policy.minimum_length", op: ge, expected: "$minimum_length"}
              - compare: {subject: password_history, actual: "$password_policy.history_count", op: ge, expected: "$history_count"}
          else:
            outcome: not_applicable
