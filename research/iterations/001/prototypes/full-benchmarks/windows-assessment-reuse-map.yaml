scap_ng_research: 0.1-prototype
iteration: "001"
purpose: demonstrate cross-benchmark assessment reuse
benchmarks:
  client: demo.windows-client.stig-like
  server: demo.windows-server.stig-like
reuse_groups:
  - assessment: demo.windows.password-policy-by-role
    reuse: parameterized
    mappings:
      - rule: NG-DEMO-WC-001
        parameters: {applicable_role: workstation, minimum_length: 14, history_count: 24}
      - rule: NG-DEMO-WS-101
        parameters: {applicable_role: member_server, minimum_length: 15, history_count: 24}
  - assessment: demo.windows.platform-security-posture
    reuse: exact
    mappings:
      - {rule: NG-DEMO-WC-002}
      - {rule: NG-DEMO-WS-102}
  - assessment: demo.windows.defender-realtime
    reuse: exact
    mappings:
      - {rule: NG-DEMO-WC-003}
      - {rule: NG-DEMO-WS-103}
  - assessment: demo.windows.remote-registry-disabled
    reuse: exact
    mappings:
      - {rule: NG-DEMO-WC-004}
      - {rule: NG-DEMO-WS-104}
  - assessment: demo.windows.trusted-publisher-store
    reuse: exact
    mappings:
      - {rule: NG-DEMO-WC-006}
      - {rule: NG-DEMO-WS-106}
benchmark_specific:
  - {rule: NG-DEMO-WC-005, assessment: demo.windows-client.credential-guard-when-vbs}
  - {rule: NG-DEMO-WS-105, assessment: demo.windows-server.smb-signing-required}
manual_only:
  - NG-DEMO-WC-MANUAL-001
  - NG-DEMO-WS-MANUAL-101
