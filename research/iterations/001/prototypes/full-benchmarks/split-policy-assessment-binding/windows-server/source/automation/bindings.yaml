scap_ng: 0.1-prototype
prototype: true
model: split-policy-assessment-binding
bindings:
  - rule: NG-DEMO-WS-101
    assessment: demo.windows.password-policy-by-role
    assessment_version: 1
    parameters:
      applicable_role: member_server
      minimum_length: 15
      history_count: 24
  - rule: NG-DEMO-WS-102
    assessment: demo.windows.platform-security-posture
    assessment_version: 1
  - rule: NG-DEMO-WS-103
    assessment: demo.windows.defender-realtime
    assessment_version: 1
  - rule: NG-DEMO-WS-104
    assessment: demo.windows.remote-registry-disabled
    assessment_version: 1
  - rule: NG-DEMO-WS-105
    assessment: demo.windows-server.smb-signing-required
    assessment_version: 1
  - rule: NG-DEMO-WS-106
    assessment: demo.windows.trusted-publisher-store
    assessment_version: 1
# NG-DEMO-WS-MANUAL-101 intentionally has no automated binding.
