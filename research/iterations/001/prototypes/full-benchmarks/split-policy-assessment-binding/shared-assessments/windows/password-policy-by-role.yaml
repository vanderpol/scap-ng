scap_ng: 0.1-prototype
prototype: true
model: split-policy-assessment-binding
assessment:
  id: demo.windows.password-policy-by-role
  version: 1
  description: Reusable role-aware effective password policy assessment.
  parameters:
    applicable_role:
      type: string
    minimum_length:
      type: integer
      minimum: 1
    history_count:
      type: integer
      minimum: 0
  collect:
    system_role:
      capability: windows.system-role
    password_policy:
      capability: auth.password-policy
      fields: [minimum_length, history_count]
  assert:
    if:
      when:
        compare:
          actual: "$system_role.role"
          op: eq
          expected: "$applicable_role"
      then:
        all:
          - compare:
              subject: minimum_password_length
              actual: "$password_policy.minimum_length"
              op: ge
              expected: "$minimum_length"
          - compare:
              subject: password_history
              actual: "$password_policy.history_count"
              op: ge
              expected: "$history_count"
      else:
        outcome: not_applicable
  diagnostics:
    max_failure_causes: 2
