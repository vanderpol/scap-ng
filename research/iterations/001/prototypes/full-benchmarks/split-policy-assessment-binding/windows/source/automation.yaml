scap_ng: 0.1-prototype
prototype: true
model: split-policy-assessment-binding
benchmark:
  id: demo.windows.iteration001.automated.split-policy-assessment-binding
  title: SCAP-NG Iteration 001 Windows Automated Benchmark (split-policy-assessment-binding)
  version: '001'
  status: research-prototype
  platform: windows
  rule_count: 7
  rules:
  - NG-DEMO-WIN-001
  - NG-DEMO-WIN-002
  - NG-DEMO-WIN-003
  - NG-DEMO-WIN-004
  - NG-DEMO-WIN-005
  - NG-DEMO-WIN-006
  - NG-DEMO-WIN-MANUAL-001
  notes: Illustrative content only; not an official security baseline.
assessments:
- id: demo.windows.role-specific-password-policy
  version: 1
  collect:
    system_role:
      capability: windows.system-role
    password_policy:
      capability: auth.password-policy
      fields:
      - minimum_length
      - history_count
  assert:
    if:
      when:
        compare:
          actual: $system_role.role
          op: eq
          expected: domain_controller
      then:
        all:
        - compare:
            subject: minimum_password_length
            actual: $password_policy.minimum_length
            op: ge
            expected: 15
        - compare:
            subject: password_history
            actual: $password_policy.history_count
            op: ge
            expected: 24
      elif:
      - when:
          compare:
            actual: $system_role.role
            op: eq
            expected: member_server
        then:
          all:
          - compare:
              subject: minimum_password_length
              actual: $password_policy.minimum_length
              op: ge
              expected: 14
          - compare:
              subject: password_history
              actual: $password_policy.history_count
              op: ge
              expected: 24
      else:
        outcome: not_applicable
  diagnostics:
    max_failure_causes: 3
- id: demo.windows.platform-security-posture
  version: 1
  collect:
    bitlocker:
      capability: windows.disk-encryption
    tpm:
      capability: windows.tpm
    virtualization_exception:
      capability: policy.exception-record
      id: virtualization-security-exception
    secure_boot:
      capability: windows.secure-boot
    credential_guard:
      capability: windows.credential-guard
    application_control:
      capability: windows.application-control
  assert:
    all:
    - compare:
        id: A
        subject: bitlocker_enabled
        actual: $bitlocker.enabled
        op: eq
        expected: true
    - any:
        id: BC
        children:
        - all:
            id: B
            children:
            - compare:
                subject: tpm_present
                actual: $tpm.present
                op: eq
                expected: true
            - compare:
                subject: tpm_version
                actual: $tpm.spec_version
                op: version_ge
                expected: '2.0'
            - compare:
                subject: tpm_ready
                actual: $tpm.ready
                op: eq
                expected: true
        - compare:
            id: C
            subject: approved_virtualization_exception
            actual: $virtualization_exception.approved
            op: eq
            expected: true
    - all:
        id: DEF
        children:
        - compare:
            id: D
            subject: secure_boot_enabled
            actual: $secure_boot.enabled
            op: eq
            expected: true
        - any:
            id: EF
            children:
            - compare:
                id: E
                subject: credential_guard_enabled
                actual: $credential_guard.enabled
                op: eq
                expected: true
            - compare:
                id: F
                subject: approved_application_control_enabled
                actual: $application_control.approved_policy_enabled
                op: eq
                expected: true
  diagnostics:
    max_failure_causes: 2
- id: demo.windows.defender-realtime
  version: 1
  collect:
    defender:
      capability: windows.defender.status
      fields:
      - realtime_protection_enabled
  assert:
    compare:
      subject: realtime_protection_enabled
      actual: $defender.realtime_protection_enabled
      op: eq
      expected: true
- id: demo.windows.remote-registry-disabled
  version: 1
  collect:
    service:
      capability: windows.service
      name: RemoteRegistry
      fields:
      - startup_type
      - running
  assert:
    all:
    - compare:
        subject: startup_type
        actual: $service.startup_type
        op: eq
        expected: disabled
    - compare:
        subject: running
        actual: $service.running
        op: eq
        expected: false
- id: demo.windows.smb-signing-when-server
  version: 1
  collect:
    smb_feature:
      capability: windows.feature
      name: SMB-Server
      fields:
      - installed
    smb_policy:
      capability: windows.smb.server-policy
      fields:
      - signing_required
  applies_when:
    compare:
      actual: $smb_feature.installed
      op: eq
      expected: true
  assert:
    compare:
      subject: smb_signing_required
      actual: $smb_policy.signing_required
      op: eq
      expected: true
- id: demo.windows.trusted-publisher-store
  version: 1
  collect:
    store:
      capability: windows.certificate-store
      scope: machine
      store: TrustedPublisher
  assert:
    exists:
      subject: illustrative_required_certificate
      in: $store.certificates
      where:
        field: subject
        op: eq
        value: CN=Illustrative Publisher
bindings:
- rule: NG-DEMO-WIN-001
  assessment: demo.windows.role-specific-password-policy
  assessment_version: 1
- rule: NG-DEMO-WIN-002
  assessment: demo.windows.platform-security-posture
  assessment_version: 1
- rule: NG-DEMO-WIN-003
  assessment: demo.windows.defender-realtime
  assessment_version: 1
- rule: NG-DEMO-WIN-004
  assessment: demo.windows.remote-registry-disabled
  assessment_version: 1
- rule: NG-DEMO-WIN-005
  assessment: demo.windows.smb-signing-when-server
  assessment_version: 1
- rule: NG-DEMO-WIN-006
  assessment: demo.windows.trusted-publisher-store
  assessment_version: 1
