scap_ng: 0.1-prototype
prototype: true
model: split-policy-assessment-binding
assessment:
  id: demo.windows-client.credential-guard-when-vbs
  version: 1
  collect:
    vbs:
      capability: windows.virtualization-based-security
      fields: [supported, enabled]
    credential_guard:
      capability: windows.credential-guard
      fields: [enabled]
  applies_when:
    all:
      - compare:
          actual: "$vbs.supported"
          op: eq
          expected: true
      - compare:
          actual: "$vbs.enabled"
          op: eq
          expected: true
  assert:
    compare:
      subject: credential_guard_enabled
      actual: "$credential_guard.enabled"
      op: eq
      expected: true
