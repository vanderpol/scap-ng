scap_ng: 0.1-prototype
prototype: true
model: split-policy-assessment-binding
bindings:
  - rule: NG-DEMO-WC-001
    assessment: demo.windows.password-policy-by-role
    assessment_version: 1
    parameters:
      applicable_role: workstation
      minimum_length: 14
      history_count: 24
  - rule: NG-DEMO-WC-002
    assessment: demo.windows.platform-security-posture
    assessment_version: 1
  - rule: NG-DEMO-WC-003
    assessment: demo.windows.defender-realtime
    assessment_version: 1
  - rule: NG-DEMO-WC-004
    assessment: demo.windows.remote-registry-disabled
    assessment_version: 1
  - rule: NG-DEMO-WC-005
    assessment: demo.windows-client.credential-guard-when-vbs
    assessment_version: 1
  - rule: NG-DEMO-WC-006
    assessment: demo.windows.trusted-publisher-store
    assessment_version: 1
# NG-DEMO-WC-MANUAL-001 intentionally has no automated binding.
