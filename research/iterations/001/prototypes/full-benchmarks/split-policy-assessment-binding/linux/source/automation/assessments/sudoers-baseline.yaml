scap_ng: 0.1-prototype
prototype: true
model: split-policy-assessment-binding
assessment:
  id: demo.linux.sudoers-baseline
  version: 1
  collect:
    sudoers:
      capability: linux.sudoers.effective-config
      resolve_includes: true
  assert:
    compare: {subject: requiretty_disabled, actual: "$sudoers.defaults.requiretty", op: eq, expected: false}
