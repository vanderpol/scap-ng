scap_ng: 0.1-prototype
prototype: true
model: split-policy-assessment-binding
benchmark:
  id: demo.linux.iteration001.automated.split-policy-assessment-binding
  title: SCAP-NG Iteration 001 Linux Automated Benchmark (split-policy-assessment-binding)
  version: '001'
  status: research-prototype
  platform: linux
  rule_count: 7
  rules:
  - NG-DEMO-LNX-001
  - NG-DEMO-LNX-002
  - NG-DEMO-LNX-003
  - NG-DEMO-LNX-004
  - NG-DEMO-LNX-005
  - NG-DEMO-LNX-006
  - NG-DEMO-LNX-MANUAL-001
  notes: Illustrative content only; not an official security baseline.
assessments:
- id: demo.linux.filesystem-valid-owner
  version: 1
  parameters:
    root:
      type: string
    max_evidence:
      type: integer
      minimum: 1
    stop_after:
      type: integer
      minimum: 1
  collect:
    protected_entries:
      capability: filesystem.entries
      root: $root
      recursive: true
      fields:
      - path
      - uid
      - owner_name
      - owner_resolves
  assert:
    every:
      item: $protected_entries
      condition:
        compare:
          subject: owner_resolves
          actual: $item.owner_resolves
          op: eq
          expected: true
  evidence:
    max_records: $max_evidence
  evaluation:
    stop_after_violations: $stop_after
  diagnostics:
    max_failure_causes: $max_evidence
- id: demo.linux.sshd-effective-baseline
  version: 1
  collect:
    sshd:
      capability: linux.sshd.effective-config
      fields:
      - permit_root_login
      - password_authentication
      include_resolution: true
  assert:
    all:
    - compare:
        subject: permit_root_login
        actual: $sshd.permit_root_login
        op: eq
        expected: 'no'
    - compare:
        subject: password_authentication
        actual: $sshd.password_authentication
        op: eq
        expected: 'no'
- id: demo.linux.openssh-minimum-version
  version: 1
  collect:
    package:
      capability: package.inventory
      name: openssh-server
      fields:
      - installed
      - version
  assert:
    all:
    - compare:
        subject: package_installed
        actual: $package.installed
        op: eq
        expected: true
    - compare:
        subject: package_version
        actual: $package.version
        op: version_ge
        expected: '8.7'
- id: demo.linux.ipv4-redirects-disabled
  version: 1
  collect:
    sysctl:
      capability: linux.sysctl.effective-values
      keys:
      - net.ipv4.conf.all.accept_redirects
      - net.ipv4.conf.default.accept_redirects
  assert:
    all:
    - compare:
        subject: all_accept_redirects
        actual: $sysctl.net.ipv4.conf.all.accept_redirects
        op: eq
        expected: 0
    - compare:
        subject: default_accept_redirects
        actual: $sysctl.net.ipv4.conf.default.accept_redirects
        op: eq
        expected: 0
  diagnostics:
    max_failure_causes: 2
- id: demo.linux.nfs-export-policy
  version: 1
  collect:
    nfs_package:
      capability: package.inventory
      name: nfs-utils
      fields:
      - installed
    exports:
      capability: linux.nfs.effective-exports
      fields:
      - path
      - options
  applies_when:
    compare:
      actual: $nfs_package.installed
      op: eq
      expected: true
  assert:
    none:
      item: $exports
      condition:
        contains:
          actual: $item.options
          value: no_root_squash
- id: demo.linux.sudoers-baseline
  version: 1
  collect:
    sudoers:
      capability: linux.sudoers.effective-config
      resolve_includes: true
  assert:
    compare:
      subject: requiretty_disabled
      actual: $sudoers.defaults.requiretty
      op: eq
      expected: false
bindings:
- rule: NG-DEMO-LNX-001
  assessment: demo.linux.filesystem-valid-owner
  assessment_version: 1
  parameters:
    root: /usr
    max_evidence: 50
    stop_after: 50
- rule: NG-DEMO-LNX-002
  assessment: demo.linux.sshd-effective-baseline
  assessment_version: 1
- rule: NG-DEMO-LNX-003
  assessment: demo.linux.openssh-minimum-version
  assessment_version: 1
- rule: NG-DEMO-LNX-004
  assessment: demo.linux.ipv4-redirects-disabled
  assessment_version: 1
- rule: NG-DEMO-LNX-005
  assessment: demo.linux.nfs-export-policy
  assessment_version: 1
- rule: NG-DEMO-LNX-006
  assessment: demo.linux.sudoers-baseline
  assessment_version: 1
