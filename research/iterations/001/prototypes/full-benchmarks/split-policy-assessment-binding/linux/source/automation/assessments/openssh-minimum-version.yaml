scap_ng: 0.1-prototype
prototype: true
model: split-policy-assessment-binding
assessment:
  id: demo.linux.openssh-minimum-version
  version: 1
  collect:
    package:
      capability: package.inventory
      name: openssh-server
      fields: [installed, version]
  assert:
    all:
      - compare: {subject: package_installed, actual: "$package.installed", op: eq, expected: true}
      - compare: {subject: package_version, actual: "$package.version", op: version_ge, expected: "8.7"}
