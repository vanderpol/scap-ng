scap_ng: 0.1-prototype
prototype: true
model: split-policy-assessment-binding
assessment:
  id: demo.linux.ipv4-redirects-disabled
  version: 1
  collect:
    sysctl:
      capability: linux.sysctl.effective-values
      keys: [net.ipv4.conf.all.accept_redirects, net.ipv4.conf.default.accept_redirects]
  assert:
    all:
      - compare: {subject: all_accept_redirects, actual: "$sysctl.net.ipv4.conf.all.accept_redirects", op: eq, expected: 0}
      - compare: {subject: default_accept_redirects, actual: "$sysctl.net.ipv4.conf.default.accept_redirects", op: eq, expected: 0}
  diagnostics:
    max_failure_causes: 2
