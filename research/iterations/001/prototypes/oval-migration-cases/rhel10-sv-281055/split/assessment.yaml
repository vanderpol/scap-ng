scap_ng: 0.1-prototype
prototype: true
assessment:
  id: migration.rhel10.audit-log-directory-mode
  version: 1
  description: Native semantic translation candidate for the SV-281055 OVAL definition.

  collect:
    auditd_directives:
      capability: linux.config.directives
      file: /etc/audit/auditd.conf
      names: [log_file, log_group]
      comments: shell
      ordering: source
    log_directory:
      capability: filesystem.metadata
      path: "$derived.log_directory"
      follow_symlinks: false
    configured_group:
      capability: identity.group
      name: "$derived.effective_log_group"

  derive:
    distinct_log_files:
      unique:
        select: "$auditd_directives.log_file.values"
    distinct_log_groups:
      unique:
        select: "$auditd_directives.log_group.values"
    configured_log_file:
      last: "$auditd_directives.log_file.values"
    configured_log_group:
      last_or_null: "$auditd_directives.log_group.values"
    effective_log_group:
      coalesce: ["$derived.configured_log_group", root]
    log_directory:
      path_dirname: "$derived.configured_log_file"

  assert:
    all:
      id: root
      children:
        - cardinality:
            id: one-log-file
            subject: "$derived.distinct_log_files"
            min: 1
            max: 1
        - cardinality:
            id: at-most-one-log-group
            subject: "$derived.distinct_log_groups"
            max: 1
        - compare:
            id: absolute-log-file
            subject: configured_log_file
            actual: "$derived.configured_log_file"
            op: path_is_absolute
            expected: true
        - compare:
            id: directory-exists
            subject: log_directory_exists
            actual: "$log_directory.exists"
            op: eq
            expected: true
        - if:
            id: group-policy
            when:
              compare:
                actual: "$derived.effective_log_group"
                op: eq
                expected: root
            then:
              all:
                id: root-mode
                children:
                  - bitmask_clear: {subject: log_directory_mode, actual: "$log_directory.mode", mask: "0077"}
                  - bitmask_clear: {subject: log_directory_special_bits, actual: "$log_directory.mode", mask: "7000"}
            else:
              all:
                id: alternate-group-mode
                children:
                  - cardinality: {subject: "$configured_group.matches", min: 1, max: 1}
                  - bitmask_clear: {subject: log_directory_mode, actual: "$log_directory.mode", mask: "0027"}
                  - bitmask_clear: {subject: log_directory_special_bits, actual: "$log_directory.mode", mask: "7000"}

  diagnostics:
    max_failure_causes: 4
