overlay:
  extends: migration.rhel10.shared.audit-syscall-coverage
  version: 1
  rule:
    id: SV-281125
    title: "RHEL 10 must generate audit records for successful and unsuccessful uses of the \"truncate\", \"ftruncate\", \"creat\", \"open\", \"openat\", and \"open_by_handle_at\" system calls."
    references: {stig: SV-281125}
    policy_metadata_status: incomplete_from_oval_only
  assessment_parameters:
    syscalls: [truncate, ftruncate, creat, open, openat, open_by_handle_at]
    subject_profiles: [interactive]
    failure_results: [EPERM, EACCES]
