scap_ng: 0.1-prototype
prototype: true
assessment:
  id: migration.rhel10.audit-syscall-coverage
  version: 1
  parameters:
    syscalls: {type: array, items: {type: string}, min_items: 1}
    subject_profiles:
      type: array
      items: {type: string, enum: [interactive, root]}
      min_items: 1
    failure_results:
      type: array
      items: {type: string}
      default: []
  collect:
    loaded_rules:
      capability: linux.audit.effective-rules
      source: runtime
      fields: [architecture, syscalls, auid_min, auid_unset_excluded, auid_exact, exit_filter]
  derive:
    required_cases:
      audit_coverage_matrix:
        architectures: [b32, b64]
        syscalls: "$syscalls"
        subjects: "$subject_profiles"
        failure_results: "$failure_results"
  assert:
    every:
      id: every-required-audit-case-covered
      item: "$derived.required_cases"
      condition:
        audit_rule_covered_by:
          requirement: "$item"
          rules: "$loaded_rules"
  diagnostics:
    max_failure_causes: 20
