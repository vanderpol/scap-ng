scap_ng: 0.1-prototype
prototype: true
rule:
  id: SV-281101
  title: RHEL 10 must allow only the information system security manager (ISSM) (or individuals or roles appointed by the ISSM) to select which auditable events are to be audited.
  references: {stig: SV-281101}
  policy_metadata_status: incomplete_from_oval_only
  assessment:
      id: migration.rhel10.audit-config-permissions
      version: 1
      collect:
        required_files:
          capability: filesystem.metadata
          paths: [/etc/audit/auditd.conf, /etc/audit/audit.rules]
          require_all_paths: true
        rules_directory:
          capability: filesystem.entries
          root: /etc/audit/rules.d
          recursive: false
          type: regular_file
          fields: [path, type, mode]
      derive:
        selected_entries:
          concat_collections:
            - "$required_files"
            - "$rules_directory"
      assert:
        every:
          item: "$derived.selected_entries"
          condition:
            all:
              - compare: {subject: regular_file, actual: "$item.type", op: eq, expected: regular_file}
              - bitmask_clear: {subject: mode_disallowed_bits, actual: "$item.mode", mask: "7137"}
      evidence:
        max_records: 25
    
