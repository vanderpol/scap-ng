scap_ng: 0.1-prototype
prototype: true
rule:
  id: SV-230385
  title: RHEL 8 must define default permissions for logon and non-logon shells.
  references: {stig: SV-230385}
  policy_metadata_status: incomplete_from_oval_only
  assessment:
      id: migration.rhel.umask-required-files
      version: 1
      collect:
        umask_directives:
          capability: linux.config.matching-lines
          files: [/etc/bashrc, /etc/csh.cshrc, /etc/profile]
          pattern: '(?i)^\\s*(?!#)\\s*umask\\s+.*$'
          group_by: file
      assert:
        every:
          item: "$umask_directives.by_file"
          condition:
            all:
              - cardinality:
                  subject: "$item.matches"
                  min: 1
              - every:
                  item: "$item.matches"
                  condition:
                    regex:
                      actual: "$item.text"
                      pattern: '(?i)^\\s*umask\\s+077(?:\\s*(?:#.*)?)?$'
      diagnostics:
        max_failure_causes: 6
    
