scap_ng: 0.1-prototype
prototype: true
shared_rule:
  id: migration.postgresql.shared.connection-audit-logging
  version: 1
  rule:
    title: PostgreSQL connection auditing must include required connection context.
    assessment:
        id: migration.postgresql.connection-audit-logging
        version: 1
        parameters:
          required_prefix_tokens:
            type: array
            items: {type: string}
            min_items: 1
        collect:
          instances:
            capability: postgresql.instances.running
            discovery:
              local_filesystems_only: true
              marker: postmaster.pid
            fields: [instance_id, pid, port, socket_directory]
          settings:
            capability: postgresql.settings
            for_each: "$instances"
            database: postgres
            execution_identity: postgres
            fields: [log_connections, log_line_prefix]
        assert:
          all:
            - cardinality:
                id: at-least-one-running-instance
                subject: "$instances"
                min: 1
            - every:
                id: every-instance-compliant
                item: "$settings"
                condition:
                  all:
                    - compare:
                        subject: log_connections
                        actual: "$item.log_connections"
                        op: eq
                        expected: on
                    - contains_all:
                        subject: log_line_prefix_tokens
                        actual: "$item.log_line_prefix"
                        expected: "$required_prefix_tokens"
        diagnostics:
          max_failure_causes: 10
      
