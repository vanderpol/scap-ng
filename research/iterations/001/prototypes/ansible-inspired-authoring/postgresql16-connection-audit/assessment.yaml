scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
runtime_dependency: none
source_assessment: research/iterations/001/prototypes/oval-migration-cases/postgresql16-connection-audit/split/assessment.yaml
assessment:
  id: migration.postgresql.connection-audit-logging
  version: 1
  parameters:
    required_prefix_tokens:
      type: array
      items:
        type: string
      min_items: 1
  name: migration.postgresql.connection-audit-logging
  steps:
  - name: Collect instances
    collect:
      capability: scapng.postgresql.instances.running
      discovery:
        local_filesystems_only: true
        marker: postmaster.pid
      fields:
      - instance_id
      - pid
      - port
      - socket_directory
    register: instances
  - name: Collect settings
    collect:
      capability: scapng.postgresql.settings
      for_each: instances
      database: postgres
      execution_identity: postgres
      fields:
      - log_connections
      - log_line_prefix
    register: settings
  assert:
    that:
      all:
      - cardinality:
          id: at-least-one-running-instance
          subject: instances
          min: 1
      - every:
          id: every-instance-compliant
          item: settings
          condition:
            all:
            - compare:
                subject: log_connections
                actual: item.log_connections
                op: eq
                expected: true
            - contains_all:
                subject: log_line_prefix_tokens
                actual: item.log_line_prefix
                expected: required_prefix_tokens
  diagnostics:
    max_failure_causes: 10
