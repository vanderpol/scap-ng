scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
runtime_dependency: none
source_assessment: research/iterations/001/prototypes/oval-migration-cases/rhel10-sv-281008/split/assessment.yaml
assessment:
  id: migration.rhel10.fips-system-crypto-policy
  version: 1
  name: migration.rhel10.fips-system-crypto-policy
  steps:
  - name: Collect crypto policy
    collect:
      capability: scapng.linux.crypto_policy.effective
      fields:
      - selected_policy
      - allowed_hashes
      - minimum_rsa_bits
    register: crypto_policy
  assert:
    that:
      all:
      - compare:
          subject: selected_policy
          actual: crypto_policy.selected_policy
          op: eq
          expected: FIPS
      - contains_all:
          subject: allowed_hashes
          actual: crypto_policy.allowed_hashes
          expected:
          - SHA2-224
          - SHA2-256
          - SHA2-384
          - SHA2-512
          - SHA3-256
          - SHA3-384
          - SHA3-512
          - SHAKE-256
      - contains_none:
          subject: prohibited_hashes
          actual: crypto_policy.allowed_hashes
          expected:
          - SHA1
          - MD2
          - MD4
          - MD5
      - compare:
          subject: minimum_rsa_bits
          actual: crypto_policy.minimum_rsa_bits
          op: ge
          expected: 2048
