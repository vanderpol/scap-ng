scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
runtime_dependency: none
source_assessment: research/iterations/001/prototypes/oval-migration-cases/rhel10-sv-281050/split/assessment.yaml
assessment:
  id: migration.rhel10.audit-log-group-owner.sv-281050
  version: 1
  description: Candidate native translation of the audit log group ownership dataflow.
  name: Candidate native translation of the audit log group ownership dataflow.
  steps:
  - name: Collect auditd directives
    collect:
      capability: scapng.linux.config.directives
      file: /etc/audit/auditd.conf
      names:
      - log_file
      - log_group
      comments: shell
      ordering: source
    register: auditd_directives
  - name: Collect audit log file
    collect:
      capability: scapng.filesystem.metadata
      path: configured_log_file
    register: audit_log_file
  - name: Collect audit log directory
    collect:
      capability: scapng.filesystem.metadata
      path: log_directory
    register: audit_log_directory
  - name: Collect configured group
    collect:
      capability: scapng.identity.group
      name: effective_log_group
    register: configured_group
  - name: Derive distinct log files
    derive:
      unique:
        select: auditd_directives.log_file.values
    register: distinct_log_files
  - name: Derive distinct log groups
    derive:
      unique:
        select: auditd_directives.log_group.values
    register: distinct_log_groups
  - name: Derive configured log file
    derive:
      last: auditd_directives.log_file.values
    register: configured_log_file
  - name: Derive configured log group
    derive:
      last_or_null: auditd_directives.log_group.values
    register: configured_log_group
  - name: Derive effective log group
    derive:
      coalesce:
      - configured_log_group
      - root
    register: effective_log_group
  - name: Derive log directory
    derive:
      path_dirname: configured_log_file
    register: log_directory
  - name: Derive expected gid
    derive:
      if:
        when:
          compare:
            actual: effective_log_group
            op: eq
            expected: root
        then: 0
        else: configured_group.gid
    register: expected_gid
  assert:
    that:
      all:
        id: root
        children:
        - cardinality:
            id: one-log-file
            subject: distinct_log_files
            min: 1
            max: 1
        - cardinality:
            id: at-most-one-log-group
            subject: distinct_log_groups
            max: 1
        - compare:
            id: absolute-path
            subject: configured_log_file
            actual: configured_log_file
            op: path_is_absolute
            expected: true
        - compare:
            id: log-file-exists
            subject: audit_log_file_exists
            actual: audit_log_file.exists
            op: eq
            expected: true
        - compare:
            id: directory-exists
            subject: log_directory_exists
            actual: audit_log_directory.exists
            op: eq
            expected: true
        - if:
            id: group-resolution
            when:
              compare:
                actual: effective_log_group
                op: ne
                expected: root
            then:
              cardinality:
                subject: configured_group.matches
                min: 1
                max: 1
            else:
              literal: true
        - compare:
            id: group-owner
            subject: audit_log_group_id
            actual: audit_log_file.group_id
            op: eq
            expected: expected_gid
  diagnostics:
    max_failure_causes: 4
