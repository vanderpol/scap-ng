scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
runtime_dependency: none
source_assessment: research/iterations/001/prototypes/oval-migration-cases/rhel10-sv-281101/split/assessment.yaml
assessment:
  id: migration.rhel10.audit-config-permissions
  version: 1
  name: migration.rhel10.audit-config-permissions
  steps:
  - name: Collect required files
    collect:
      capability: scapng.filesystem.metadata
      paths:
      - /etc/audit/auditd.conf
      - /etc/audit/audit.rules
      require_all_paths: true
    register: required_files
  - name: Collect rules directory
    collect:
      capability: scapng.filesystem.entries
      root: /etc/audit/rules.d
      recursive: false
      type: regular_file
      fields:
      - path
      - type
      - mode
    register: rules_directory
  - name: Derive selected entries
    derive:
      concat_collections:
      - required_files
      - rules_directory
    register: selected_entries
  assert:
    that:
      every:
        item: selected_entries
        condition:
          all:
          - compare:
              subject: regular_file
              actual: item.type
              op: eq
              expected: regular_file
          - bitmask_clear:
              subject: mode_disallowed_bits
              actual: item.mode
              mask: '7137'
  evidence:
    max_records: 25
