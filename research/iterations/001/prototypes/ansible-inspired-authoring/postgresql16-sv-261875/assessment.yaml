scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
runtime_dependency: none
source_assessment: research/iterations/001/prototypes/oval-migration-cases/postgresql16-sv-261875/split/assessment.yaml
assessment:
  id: migration.postgresql.audit-log-file-permissions
  version: 1
  parameters:
    audit_log_paths:
      type: array
      items:
        type: string
        format: absolute-path
      min_items: 1
  name: migration.postgresql.audit-log-file-permissions
  steps:
  - name: Collect log files
    collect:
      capability: scapng.filesystem.metadata
      paths: audit_log_paths
      require_all_paths: true
    register: log_files
  assert:
    that:
      every:
        item: log_files
        condition:
          all:
          - compare:
              subject: uread
              actual: item.permissions.uread
              op: eq
              expected: true
          - compare:
              subject: uwrite
              actual: item.permissions.uwrite
              op: eq
              expected: true
          - compare:
              subject: oread
              actual: item.permissions.oread
              op: eq
              expected: false
          - compare:
              subject: owrite
              actual: item.permissions.owrite
              op: eq
              expected: false
