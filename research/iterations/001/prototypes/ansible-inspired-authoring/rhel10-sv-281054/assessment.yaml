scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
runtime_dependency: none
source_assessment: research/iterations/001/prototypes/oval-migration-cases/rhel10-sv-281054/split/assessment.yaml
assessment:
  id: migration.rhel10.audit-log-file-modes
  version: 1
  name: migration.rhel10.audit-log-file-modes
  steps:
  - name: Collect auditd directives
    collect:
      capability: scapng.linux.config.directives
      file: /etc/audit/auditd.conf
      names:
      - log_file
      comments: shell
      ordering: source
    register: auditd_directives
  - name: Collect audit files
    collect:
      capability: scapng.filesystem.entries
      root: log_directory
      recursive: true
      type: regular_file
      fields:
      - path
      - type
      - mode
    register: audit_files
  - name: Derive distinct log files
    derive:
      unique:
        select: auditd_directives.log_file.values
    register: distinct_log_files
  - name: Derive configured log file
    derive:
      last: auditd_directives.log_file.values
    register: configured_log_file
  - name: Derive log directory
    derive:
      path_dirname: configured_log_file
    register: log_directory
  assert:
    that:
      all:
      - cardinality:
          subject: distinct_log_files
          min: 1
          max: 1
      - compare:
          actual: configured_log_file
          op: path_is_absolute
          expected: true
      - cardinality:
          subject: audit_files
          min: 1
      - every:
          id: every-audit-file-mode
          item: audit_files
          condition:
            all:
            - bitmask_clear:
                subject: disallowed_permission_bits
                actual: item.mode
                mask: '0177'
            - bitmask_clear:
                subject: special_bits
                actual: item.mode
                mask: '7000'
  evidence:
    max_records: 50
  evaluation:
    stop_after_violations: 50
