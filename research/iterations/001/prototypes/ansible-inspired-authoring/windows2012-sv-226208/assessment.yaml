scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
runtime_dependency: none
source_assessment: research/iterations/001/prototypes/oval-migration-cases/windows2012-sv-226208/split/assessment.yaml
assessment:
  id: migration.windows.store-disabled
  version: 1
  name: migration.windows.store-disabled
  steps:
  - name: Collect winstore
    collect:
      capability: scapng.filesystem.entry
      path: C:\\Windows\\WinStore
    register: winstore
  - name: Collect remove store policy
    collect:
      capability: scapng.windows.registry.value
      hive: HKEY_LOCAL_MACHINE
      key: SOFTWARE\\Policies\\Microsoft\\WindowsStore
      name: RemoveWindowsStore
    register: remove_store_policy
  applies_when:
    compare:
      subject: winstore_present
      actual: winstore.exists
      op: eq
      expected: true
  assert:
    that:
      all:
      - compare:
          subject: remove_windows_store_value_exists
          actual: remove_store_policy.exists
          op: eq
          expected: true
      - compare:
          subject: remove_windows_store
          actual: remove_store_policy.value
          op: eq
          expected: 1
