scap_ng: "0.1-prototype"
prototype: true
model: split-policy-assessment-binding

rule:
  id: NG-DEMO-LNX-001
  title: "Illustrative Linux files in the protected scope must have valid owners"
  severity: medium

  discussion: |
    Demonstrates a rule that may evaluate millions of filesystem entries.

  check: |
    Examine files and directories beneath the protected scope. Every entry
    must resolve to a valid local or directory-service owner.

  fix: |
    Assign a valid owner to each reported file or directory.
