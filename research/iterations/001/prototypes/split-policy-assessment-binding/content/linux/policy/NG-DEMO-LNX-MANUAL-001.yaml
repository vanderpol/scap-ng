scap_ng: "0.1-prototype"
prototype: true
model: split-policy-assessment-binding

rule:
  id: NG-DEMO-LNX-MANUAL-001
  title: "Illustrative Linux security configuration must be reviewed"
  severity: medium

  discussion: |
    Demonstrates a Linux policy-only rule that a manual-capable scanner can
    assess directly from existing Check Content.

  check: |
    Review the documented system security configuration and verify the
    organization-defined requirement is satisfied. Record the observed value,
    supporting evidence, and any not-applicable justification.

  fix: |
    Configure the system to satisfy the organization-defined requirement.

  manual_assessment:
    procedure: "$policy.check"

  provenance:
    classification: illustrative
    official_disa_content: false
