scap_ng: "0.1-prototype"
prototype: true
model: split-policy-assessment-binding

rule:
  id: NG-DEMO-WIN-002
  title: "Illustrative Windows platform security posture must satisfy required alternatives"
  severity: high

  discussion: |
    Demonstrates policy later bound to an automated assessment containing a
    complex OVAL-style Boolean criteria tree.

  check: |
    Verify BitLocker protection is enabled. Also verify either TPM 2.0 is
    present and ready or an approved virtualization exception exists. Finally,
    verify Secure Boot is enabled and either Credential Guard or approved
    application control is enabled.

  fix: |
    Correct the failed platform-security condition or document the applicable
    approved exception.
