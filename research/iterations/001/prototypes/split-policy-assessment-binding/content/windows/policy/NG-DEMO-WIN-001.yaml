scap_ng: "0.1-prototype"
prototype: true
model: split-policy-assessment-binding

rule:
  id: NG-DEMO-WIN-001
  title: "Illustrative Windows password policy must meet role-specific requirements"
  severity: high

  discussion: |
    Demonstrates a policy whose automated implementation uses native
    conditional logic.

  check: |
    Determine the Windows system role. If the system is a domain controller,
    verify the effective minimum password length is at least 15 characters
    and password history is at least 24. If the system is a member server,
    verify the effective minimum password length is at least 14 characters
    and password history is at least 24. Other roles are not applicable.

  fix: |
    Configure the effective password policy for the applicable system role.
