corpus_manifest: 0.2-prototype
iteration: "001"
scope_policy: separated_production_and_conformance_corpora
purpose: >
  Versioned public SCAP 1.4 corpora for iteration 001. Published content under
  the pinned NIWC Atlantic scap-content-library/Current tree is the authoritative
  production migration/conversion evidence source. OVAL Community Self-Assertion
  OVAL Test Content is a separate language-conformance corpus used to exercise
  OVAL 5.12.3 features and evaluator semantics; it is not migration evidence.
sources:
  - id: niwc-atlantic-scap-content-library-current
    type: git
    repository: niwc-atlantic/scap-content-library
    revision: 8c8e5dff860af6b1290ee9273a282db24278f8d5
    path: Current
    public: true
    status: ready
    observed_zip_count: 66
    observed_individual_benchmark_zip_count: 65
    consolidated_bundle:
      path: Current/Consolidated_Bundle_Q3_2026.zip

  - id: oval-community-scap-self-assertion-oval-test-content
    type: git
    repository: OVAL-Community/SCAP-Self-Assertion
    revision: e3538595c5083b9c34d937a81d319234df9bbfaa
    path: SCAP_1.4/OVAL_Test_Content
    public: true
    status: ready
    role: language_conformance
    schema_version: "OVAL 5.12.3"
    evidence_use: >
      Unit-test and semantic coverage evidence for OVAL language constructs.
      Keep separate from published STIG migration evidence.
    initial_focus:
      - agnostic/oval-def_object_component.xml
      - agnostic/oval-def_merge.xml
      - agnostic/oval-def_regex_capture_function.xml
      - agnostic/oval-def_arithmetic_function.xml
      - agnostic/oval-def_concat_function.xml
      - agnostic/oval-def_split_function.xml
      - agnostic/oval-def_substring_function.xml
      - agnostic/oval-def_time_difference_function.xml
      - agnostic/oval-def_globtoregex_test.xml
      - agnostic/oval_check_enumeration_entity.xml
      - agnostic/oval_check_enumeration_object_state.xml
      - agnostic/oval_check_enumeration_variable_values.xml
      - agnostic/oval_existence_enumeration.xml

priority_targets:
  - id: rhel9
    platform: Red Hat Enterprise Linux 9
    published_artifact: Current/U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-signed.zip
    priority: 1
    role: linux_reference
    rationale: current Linux anchor for complex OVAL migration and capability design

  - id: oracle-linux9
    platform: Oracle Linux 9
    published_artifact: Current/U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-signed.zip
    priority: 1
    role: linux_reuse_comparison
    rationale: quantify real reusable policy and assessment semantics against RHEL 9

  - id: windows11
    platform: Microsoft Windows 11
    published_artifact: Current/U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip
    priority: 1
    role: windows_client_reference
    rationale: current Windows client anchor and cross-policy reuse candidate

  - id: windows-server-2025
    platform: Microsoft Windows Server 2025
    published_artifact: Current/U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip
    priority: 1
    role: windows_server_reference
    rationale: current Windows server anchor and cross-policy reuse candidate

cross_platform_reuse_experiments:
  - id: rhel9-vs-oracle-linux9
    left: rhel9
    right: oracle-linux9
    measurements:
      - shared_cci_sets
      - shared_normalized_titles
      - shared_check_semantics
      - shared_oval_semantic_fingerprints
      - parameterizable_assessment_candidates
    note: >
      Do not assume overlap percentage. Measure it from the pinned published
      packages, and distinguish policy similarity from proven automation equivalence.

coverage_targets:
  first_depth_pass: [rhel9, oracle-linux9, windows11, windows-server-2025]
  final_gate: all_individual_benchmarks_in_pinned_Current
  consolidated_bundle_role: packaging_and_duplicate_coverage_cross_check

evidence_policy:
  published_migration_case_source_must_match_manifest: true
  production_migration_evidence_source: niwc-atlantic-scap-content-library-current
  language_conformance_evidence_source: oval-community-scap-self-assertion-oval-test-content
  conformance_content_is_not_migration_evidence: true
  development_repository_content_is_not_conversion_evidence: true
  experimental_content_is_not_conversion_evidence: true
