corpus_manifest: 0.1-prototype
iteration: "001"
purpose: >
  Versioned public corpus against which SCAP 1.4 forward-conversion coverage
  will be measured. Inclusion here is a reproducibility boundary, not a claim
  that these are the only public SCAP sources.
sources:
  - id: niwc-atlantic-scap-content-library-current
    type: git
    repository: niwc-atlantic/scap-content-library
    revision: 8c8e5dff860af6b1290ee9273a282db24278f8d5
    path: Current
    public: true
    role: primary_cross_platform_conversion_corpus
    status: ready

  - id: disa-stig-downloads
    type: public-download-catalog
    publisher: DISA
    public: true
    role: authoritative_stig_publication_corpus
    status: acquisition_manifest_required
    note: >
      Before a formal conversion run, enumerate every in-scope SCAP 1.4
      download with publication/version identifiers and SHA-256 digests.

  - id: additional-public-scap14-sources
    type: extensible
    public: true
    status: discovery_required
    note: >
      Add additional authoritative/public SCAP 1.4 repositories or downloads
      discovered during corpus research. Each must be pinned by revision or
      digest before it contributes to a published conversion claim.
