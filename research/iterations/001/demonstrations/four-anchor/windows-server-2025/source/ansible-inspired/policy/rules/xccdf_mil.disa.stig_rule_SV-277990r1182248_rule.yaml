scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Determine if manually managed application/service accounts exist. If none exist, this is not applicable. If passwords
    for manually managed application/service accounts are not changed at least annually or when an administrator with knowledge
    of the password leaves the organization, this is a finding. Identify manually managed application/service accounts. To
    determine the date a password was last changed for domain controllers: Open PowerShell. Enter "Get-AdUser -Identity [application
    account name] -Properties PasswordLastSet | FT Name, PasswordLastSet", where [application account name] is the name of
    the manually managed application/service account. If the "PasswordLastSet" date is more than one year old, this is a finding.
    For member servers and stand-alone or nondomain-joined systems: Open command prompt. Enter ''Net User [application account
    name] | Find /i "Password Last Set"'', where [application account name] is the name of the manually managed application/service
    account. If the "Password Last Set" date is more than one year old, this is a finding.'
  checks:
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-277990r1182248_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-277990r1182248_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>Setting application account passwords to expire may cause applications to stop functioning.
    However, not changing them on a regular basis exposes them to attack. If managed service accounts are used, this alleviates
    the need to manually change application account passwords.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
