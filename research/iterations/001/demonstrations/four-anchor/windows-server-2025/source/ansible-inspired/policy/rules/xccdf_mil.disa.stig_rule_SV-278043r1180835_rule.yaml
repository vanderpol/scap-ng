rule:
  abstract: false
  check: 'Navigate to the Application event log file. The default location is the "%SystemRoot%\System32\winevt\Logs" folder.
    However, the logs may have been moved to another folder. If the permissions for the "Application.evtx" file are not as
    restrictive as the default permissions listed below, this is a finding: Eventlog - Full Control SYSTEM - Full Control
    Administrators - Full Control'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-278043r1180835_rule
