  id: ng.manual.xccdf_mil.disa.stig_rule_SV-277990r1182248_rule
  version: 1
  description: Windows Server 2025 manually managed application account passwords must be changed at least annually or when
    a system administrator with knowledge of the password leaves the organization.
  name: Windows Server 2025 manually managed application account passwords must be changed at least annually or when a system
