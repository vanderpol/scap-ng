        name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:11101
      exports: []
      inline_content: 'Verify the effective setting in Local Group Policy Editor. Run gpedit.msc. Navigate to Local Computer
        Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Account Policies >> Password Policy.
        If the value for "Password must meet complexity requirements" is not set to "Enabled", this is a finding. For server
        core installations, run the following command: Secedit /Export /Areas SecurityPolicy /CFG C:\Path\FileName.Txt If
        "PasswordComplexity" equals "0" in the file, this is a finding. Note: If an external password filter is in use that
        enforces all four character types and requires this setting to be set to "Disabled", this would not be considered
        a finding. If this setting does not affect the use of an external password filter, it must be enabled for fallback
        purposes.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:11101
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify the effective setting in Local Group Policy Editor.


            Run gpedit.msc.


            Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Account
            Policies >> Password Policy.


            If the value for "Password must meet complexity requirements" is not set to "Enabled", this is a finding.


            For server core installations, run the following command:


            Secedit /Export /Areas SecurityPolicy /CFG C:\Path\FileName.Txt


            If "PasswordComplexity" equals "0" in the file, this is a finding.


            Note: If an external password filter is in use that enforces all four character types and requires this setting
            to be set to "Disabled", this would not be considered a finding. If this setting does not affect the use of an
            external password filter, it must be enabled for fallback purposes.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
