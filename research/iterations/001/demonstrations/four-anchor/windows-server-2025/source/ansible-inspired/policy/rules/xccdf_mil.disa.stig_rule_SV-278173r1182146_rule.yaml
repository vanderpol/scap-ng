  extends: null
  fix: Configure the policy value for Computer Configuration >> Administrative Template >> System >> KDC >> Allow name-based
    strong mappings for certificates to "Enabled". The policy must contain exactly one certificate thumbprint per rule, with
    each rule represented as a tuple. Thumbprints must be unique and cannot be repeated in multiple rules. The sections of
    each tuple that are separated by semi-colons must be in the stated order, while the fields separated by commas can be
    in any order. The rules themselves are separated by new lines.
