scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: This applies to domain controllers. This is not applicable for member servers. Verify the effective setting in Local
    Group Policy Editor. Run gpedit.msc. Navigate to Local Computer Policy >> Computer Configuration >> Administrative Template
    >> System >> KDC >> Allow name-based strong mappings for certificates. If "Allow name-based strong mappings for certificates"
    is not "Enabled", this is a finding.
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>Weak mappings give rise to security vulnerabilities and demand hardening measures. Certificate
    names must be correctly mapped to the intended user account in Active Directory. A lack of strong name-based mappings
    allows certain weak certificate mappings, such as Issuer/Subject AltSecID and User Principal Names (UPN) mappings, to
    be treated as strong mappings.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
