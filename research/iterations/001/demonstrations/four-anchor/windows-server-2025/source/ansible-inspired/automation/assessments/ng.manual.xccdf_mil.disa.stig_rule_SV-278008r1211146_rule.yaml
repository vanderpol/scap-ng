      exports: []
      inline_content: Search all drives for *.p12 and *.pfx files. If any files with these extensions exist, this is a finding.
        This does not apply to server-based applications that have a requirement for .p12 or .pfx certificate files. Some
        applications create files with extensions of .p12 or .pfx that are not certificate installation files. Removal of
        noncertificate installation files from systems is not required. These must be documented with the information system
        security officer (ISSO).
