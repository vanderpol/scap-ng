  cluster_id: null
  conflicts: []
  default_check: default
  description: '<VulnDiscussion>This setting determines the maximum amount of time (in minutes) that a granted session ticket
    can be used to access a particular service. Session tickets are used only to authenticate new connections with servers.
    Ongoing operations are not interrupted if the session ticket used to authenticate the connection expires during the connection.
    Satisfies: SRG-OS-000112-GPOS-00057, SRG-OS-000113-GPOS-00058</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
