    - content_refs:
      - href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
        name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:40501
      exports: []
      inline_content: 'This applies to member servers and stand-alone or nondomain-joined systems. A separate version applies
        to domain controllers. Verify the effective setting in Local Group Policy Editor. Run gpedit.msc. Navigate to Local
        Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights
        Assignment. If the following accounts or groups are not defined for the "Deny log on through Remote Desktop Services"
        user right, this is a finding: Domain Systems Only: - Enterprise Admins group. - Domain Admins group. - Local account
        (see Note below). All Systems: - Guests group. For server core installations, run the following command: Secedit /Export
        /Areas User_Rights /cfg c:\path\filename.txt Review the text file. If the following SIDs are not defined for the "SeDenyRemoteInteractiveLogonRight"
        user right, this is a finding. Domain Systems Only: S-1-5-root domain-519 (Enterprise Admins) S-1-5-domain-512 (Domain
        Admins) S-1-5-113 ("Local account") All Systems: S-1-5-32-546 (Guests) Note: "Local account" refers to the Windows
        built-in security group.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:40501
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'This applies to member servers and stand-alone or nondomain-joined systems. A separate version applies to
            domain controllers.


            Verify the effective setting in Local Group Policy Editor.


            Run gpedit.msc.


            Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local
            Policies >> User Rights Assignment.


            If the following accounts or groups are not defined for the "Deny log on through Remote Desktop Services" user
            right, this is a finding:


            Domain Systems Only:

            - Enterprise Admins group.

            - Domain Admins group.

            - Local account (see Note below).


            All Systems:

            - Guests group.


            For server core installations, run the following command:


            Secedit /Export /Areas User_Rights /cfg c:\path\filename.txt


            Review the text file.


            If the following SIDs are not defined for the "SeDenyRemoteInteractiveLogonRight" user right, this is a finding.


            Domain Systems Only:

            S-1-5-root domain-519 (Enterprise Admins)

            S-1-5-domain-512 (Domain Admins)

            S-1-5-113 ("Local account")


            All Systems:

            S-1-5-32-546 (Guests)


            Note: "Local account" refers to the Windows built-in security group.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
