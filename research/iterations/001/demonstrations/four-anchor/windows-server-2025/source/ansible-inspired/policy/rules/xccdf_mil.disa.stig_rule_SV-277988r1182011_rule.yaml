rule:
  abstract: false
  check: If no accounts are members of the Backup Operators group, this is not applicable. Verify users with accounts in the
    Backup Operators group have a separate user account for backup functions and for performing normal user tasks. If users
    with accounts in the Backup Operators group do not have separate accounts for backup functions and standard user functions,
    this is a finding.
  checks:
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-277988r1182011_rule
    assessment_version: 1
