      exports: []
      inline_content: 'This applies to domain controllers. It is not applicable for other systems. Run "Regedit". Navigate
        to "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\NTDS\Parameters". Note the directory locations in the values
        for: Database log files path DSA Database file By default, they will be \Windows\NTDS. If the locations are different,
        run the following for each: Open "command prompt (Admin)". Navigate to the NTDS directory (\Windows\NTDS by default).
        Run "icacls *.*". If the permissions on each file are not as restrictive as the following, this is a finding: NT AUTHORITY\SYSTEM:(I)(F)
        BUILTIN\Administrators:(I)(F) (I) - permission inherited from parent container (F) - full access'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:30701
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'This applies to domain controllers. It is not applicable for other systems.


            Run "Regedit".


            Navigate to "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\NTDS\Parameters".


            Note the directory locations in the values for:


            Database log files path

            DSA Database file


            By default, they will be \Windows\NTDS.


            If the locations are different, run the following for each:


            Open "command prompt (Admin)".


            Navigate to the NTDS directory (\Windows\NTDS by default).


            Run "icacls *.*".


            If the permissions on each file are not as restrictive as the following, this is a finding:


            NT AUTHORITY\SYSTEM:(I)(F)

            BUILTIN\Administrators:(I)(F)


            (I) - permission inherited from parent container

            (F) - full access'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
