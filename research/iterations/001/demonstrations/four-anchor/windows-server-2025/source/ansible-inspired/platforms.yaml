      comment: null
      query:
      - kind: element
        name: namespace
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#windows
        value: root\cimv2
      - kind: element
        name: wql
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#windows
        value: SELECT DomainRole FROM win32_computersystem
      source_namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#windows
      source_object_id: oval:mil.disa.stig.win:obj:10000100
      source_type: wmi57_object
      version: '1'
    register: oval:mil.disa.stig.win:obj:10000100
  - name: Collect oval:mil.disa.stig.win:obj:10000600
    collect:
      capability: scapng.collect.windows.registry
      comment: null
      query:
      - attributes:
          datatype: string
        kind: element
        name: hive
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#windows
        value: HKEY_LOCAL_MACHINE
      - attributes:
          datatype: string
        kind: element
        name: key
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#windows
        value: SOFTWARE\Microsoft\Windows NT\CurrentVersion
      - attributes:
          datatype: string
        kind: element
        name: name
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#windows
        value: InstallationType
      source_namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#windows
      source_object_id: oval:mil.disa.stig.win:obj:10000600
      source_type: registry_object
      version: '1'
    register: oval:mil.disa.stig.win:obj:10000600
  - name: Collect oval:mil.disa.stig.win:obj:10002500
    collect:
      capability: scapng.collect.windows.registry
      comment: null
      query:
      - attributes:
          datatype: string
          operation: case insensitive equals
        kind: element
        name: hive
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#windows
        value: HKEY_LOCAL_MACHINE
      - attributes:
          datatype: string
          operation: pattern match
        kind: element
        name: key
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#windows
        value: ^(?i)SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Component\sBased\sServicing\\Packages\\OpenSSH-Server-Package~.+$
      - attributes:
          nil: 'true'
        kind: element
        name: name
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#windows
      source_namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#windows
      source_object_id: oval:mil.disa.stig.win:obj:10002500
      source_type: registry_object
      version: '1'
    register: oval:mil.disa.stig.win:obj:10002500
  - name: Collect oval:navy.navwar.niwcatlantic.scc.windows:obj:101
    collect:
      capability: scapng.collect.windows.wmi57
      comment: null
      query:
      - kind: element
        name: namespace
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#windows
