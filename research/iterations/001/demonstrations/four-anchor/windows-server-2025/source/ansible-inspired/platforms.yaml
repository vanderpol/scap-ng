  - name: Collect oval:navy.navwar.niwcatlantic.scc.windows:obj:201
    collect:
      capability: scapng.collect.windows.cmdlet
      comment: Check if FTP is installed
      query:
      - kind: element
        name: module_name
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#windows
        value: ServerManager
      - attributes:
          nil: 'true'
        kind: element
        name: module_id
