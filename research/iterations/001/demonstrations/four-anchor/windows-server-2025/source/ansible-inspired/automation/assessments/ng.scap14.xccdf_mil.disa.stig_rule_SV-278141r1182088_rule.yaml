  id: ng.scap14.xccdf_mil.disa.stig_rule_SV-278141r1182088_rule
  version: 1
  description: Windows Server 2025 Active Directory Domain Controllers Organizational Unit (OU) object must have the proper
    access control permissions.
  semantic_model: scap-ng-generic-assessment-graph-0.1
  name: Windows Server 2025 Active Directory Domain Controllers Organizational Unit (OU) object must have the proper access
    control permissions.
  steps:
  - name: Collect oval:navy.navwar.niwcatlantic.scc.windows:obj:27814101
    collect:
      capability: scapng.collect.independent.shellcommand
      comment: Analyze the Domain Controllers OU permissions and return details on any failures
      query:
      - attributes:
          error_if_stderr_exists: 'true'
        kind: element
        name: behaviors
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
      - kind: element
        name: shell
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
        value: powershell
      - kind: element
        name: command
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
        value: Import-Module GroupPolicy; Import-Module ActiveDirectory; if (-not (Get-PSDrive -Name AD -ErrorAction SilentlyContinue))
          { New-PSDrive -Name AD -PSProvider ActiveDirectory -Root "" -ErrorAction SilentlyContinue | Out-Null }; $dn = ([ADSI]"").distinguishedName;
          $AdminGroupRegex = 'SYSTEM|Domain Admins|Enterprise Admins|Builtin\\Administrators|Administrators|CREATOR OWNER|SELF|Key
          Admins|Enterprise Key Admins|Exchange Enterprise Servers|Exchange Servers|Exchange Windows Permissions|Exchange
          Trusted Subsystem'; $ModRightsRegex = 'Write|CreateChild|DeleteChild|GenericAll|GenericWrite|Delete'; $f = Get-Acl
          -Path "AD:OU=Domain Controllers,$dn" | Select-Object -ExpandProperty Access | Where-Object { $_.AccessControlType
          -eq 'Allow' -and $_.IdentityReference -notmatch $AdminGroupRegex -and $_.ActiveDirectoryRights.ToString() -match
          $ModRightsRegex } | Select-Object @{Name='IdentityReference';Expression={$_.IdentityReference.ToString()}}, @{Name='ActiveDirectoryRights';Expression={$_.ActiveDirectoryRights.ToString()}}
          -Unique | ForEach-Object { [PSCustomObject]@{ GPO = 'Domain Controllers OU'; Status = 'FAIL'; Reason = "Unauthorized
          Trustee '$($_.IdentityReference)' holds '$($_.ActiveDirectoryRights)' modification rights." } }; if ($f) { $f |
          Format-Table -AutoSize | Out-String -Width 4096 } else { [PSCustomObject]@{ GPO = 'Domain Controllers OU'; Status
          = 'PASS'; Reason = 'Delegation securely restricted to authorized administrative groups on Domain Controllers OU.'
          } | Format-Table -AutoSize | Out-String -Width 4096 }
      - kind: element
        name: pattern
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
        value: .+
      source_namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
