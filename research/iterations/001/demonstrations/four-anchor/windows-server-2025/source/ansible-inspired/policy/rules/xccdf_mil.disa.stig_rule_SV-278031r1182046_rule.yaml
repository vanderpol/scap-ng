rule:
  abstract: false
  check: Devices that have UEFI firmware must run in UEFI mode. Verify the system firmware is configured to run in UEFI mode,
    not Legacy BIOS. Run "System Information". Under "System Summary", if "BIOS Mode" does not display "UEFI", this is a finding.
