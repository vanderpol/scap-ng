scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: Different methods are available to disable SMBv1 on Windows Server 2025. This is the preferred method, however if
    WN25-00-000390 and WN25-00-000400 are configured, this is not applicable. Open Windows PowerShell with elevated privileges
    (run as administrator). Enter "Get-WindowsFeature -Name FS-SMB1". If "Installed State" is "Installed", this is a finding.
    An Installed State of "Available" or "Removed" is not a finding.
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-278023r1182034_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-278023r1182034_rule
    assessment_version: 1
    selector: automated
    source_selector: automated
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-278023r1182034_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>SMBv1 is a legacy protocol that uses the MD5 algorithm as part of SMB. MD5 is known to be vulnerable
    to a number of attacks such as collision and preimage attacks and is not FIPS compliant.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
  effective_platform_refs:
  - cpe:/o:microsoft:windows_server_2025:-::~~~~x64~
  effective_platforms:
  - kind: cpe_name
    name: cpe:/o:microsoft:windows_server_2025:-::~~~~x64~
    ref: cpe:/o:microsoft:windows_server_2025:-::~~~~x64~
  extends: null
  fix: 'Uninstall the SMBv1 protocol. Open Windows PowerShell with elevated privileges (run as administrator). Enter "Uninstall-WindowsFeature
    -Name FS-SMB1 -Restart". (Omit the Restart parameter if an immediate restart of the system cannot be done.) Alternately:
    Start Server Manager. Select the server with the feature. Scroll down to "ROLES AND FEATURES" in the right pane. Select
    "Remove Roles and Features" from the drop-down "TASKS" list. Select the appropriate server on the "Server Selection" page
    and click "Next". Deselect "SMB 1.0/CIFS File Sharing Support" on the "Features" page. Click "Next" and "Remove" as prompted.'
