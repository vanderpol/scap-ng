          - attributes:
              family: windows
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Microsoft Windows Server 2025
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "Allowing unsecure RPC communication exposes the system to man-in-the-middle attacks and data disclosure\
              \ attacks. A man-in-the-middle attack occurs when an intruder captures packets between a client and server and\
              \ modifies them before allowing the packets to be exchanged. Usually, the attacker will modify the information\
              \ in the packets in an attempt to cause either the client or server to reveal sensitive information.\n\n  Satisfies:\
              \ SRG-OS-000033-GPOS-00014, SRG-OS-000250-GPOS-00093"
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
        source_definition_id: oval:mil.disa.stig.windows2025:def:278115
        version: '1'
