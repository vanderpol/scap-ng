      exports: []
      inline_content: 'Verify an antivirus solution is installed on the system. The antivirus solution may be bundled with
        an approved host-based security solution. If there is no antivirus solution installed on the system, this is a finding.
        Verify if Microsoft Defender antivirus is in use or enabled: Open PowerShell. Enter "get-service | where {$_.DisplayName
        -Like "*Defender*"} | Select Status,DisplayName" Verify if third-party antivirus is in use or enabled: Open PowerShell.
        Enter "get-service | where {$_.DisplayName -Like "*mcafee*"} | Select Status,DisplayName Enter "get-service | where
        {$_.DisplayName -Like "*symantec*"} | Select Status,DisplayName'
