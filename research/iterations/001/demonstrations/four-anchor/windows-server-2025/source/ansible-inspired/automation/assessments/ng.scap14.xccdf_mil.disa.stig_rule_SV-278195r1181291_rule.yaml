        name: shell
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
        value: powershell
      - kind: element
        name: command
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
        value: $( if((Get-CimInstance Win32_OperatingSystem).ProductType -eq 2){ Get-ADUser -Filter * -Properties SID | Where-Object
          {$_.SID -match "^S-1-5-[0-9-]+-501$"} | Select-Object Name,Enabled -First 1 | Format-List } else { Get-Localuser
          | Where-Object {$_.SID -match '^S-1-5-[0-9-]+-501$'} } ) | Format-List
