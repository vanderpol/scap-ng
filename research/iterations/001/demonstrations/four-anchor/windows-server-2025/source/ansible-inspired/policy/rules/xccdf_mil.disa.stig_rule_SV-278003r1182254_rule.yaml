            \ 35.00:00:00\".\n\nThis will return accounts that have not been logged on to for 35 days, along with various\
            \ attributes such as the Enabled status and LastLogonDate.\n\nMember servers and stand-alone or nondomain-joined\
            \ systems:\n\nCopy or enter the lines below to the PowerShell window and enter. (Entering twice may be required.) \n\
            \n([ADSI]('WinNT://{0}' -f $env:COMPUTERNAME)).Children | Where { $_.SchemaClassName -eq 'user' } | ForEach {\n\
            \ $user = ([ADSI]$_.Path)\n $lastLogin = $user.Properties.LastLogin.Value\n $enabled = ($user.Properties.UserFlags.Value\
            \ -band 0x2) -ne 0x2\n if ($lastLogin -eq $null) {\n $lastLogin = 'Never'\n }\n Write-Host $user.Name $lastLogin\
            \ $enabled \n}\n\nThis will return a list of local accounts with the account name, last logon, and if the account\
            \ is enabled (True/False).\nFor example: User1 10/31/2015 5:49:56 AM True\n\nReview the list of accounts returned\
            \ by the above queries to determine the finding validity for each account reported.\n\nExclude the following accounts:\n\
            - Built-in administrator account (Renamed, SID ending in 500).\n- Built-in guest account (Renamed, Disabled, SID\
            \ ending in 501).\n- Application accounts.\n\nIf any enabled accounts have not been logged on to within the past\
