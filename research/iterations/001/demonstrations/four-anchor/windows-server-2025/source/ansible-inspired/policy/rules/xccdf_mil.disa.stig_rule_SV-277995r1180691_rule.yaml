scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify an antivirus solution is installed on the system. The antivirus solution may be bundled with an approved
    host-based security solution. If there is no antivirus solution installed on the system, this is a finding. Verify if
    Microsoft Defender antivirus is in use or enabled: Open PowerShell. Enter "get-service | where {$_.DisplayName -Like "*Defender*"}
    | Select Status,DisplayName" Verify if third-party antivirus is in use or enabled: Open PowerShell. Enter "get-service
    | where {$_.DisplayName -Like "*mcafee*"} | Select Status,DisplayName Enter "get-service | where {$_.DisplayName -Like
    "*symantec*"} | Select Status,DisplayName'
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>Malicious software can establish a base on individual desktops and servers. Employing an automated
    mechanism to detect this type of software will aid in elimination of the software from the operating system.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
