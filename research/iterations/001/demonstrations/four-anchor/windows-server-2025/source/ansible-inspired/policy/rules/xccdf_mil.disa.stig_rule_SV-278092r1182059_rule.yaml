rule:
  abstract: false
  check: 'This is not applicable for Domain Controllers. If the following registry value does not exist or is not configured
    as specified, this is a finding: Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows\Group
    Policy\{35378EAC-683F-11D2-A89A-00C04FBBCFA2}\ Value Name: NoGPOListChanges Type: REG_DWORD Value: 0x00000000 (0)'
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>Registry entries for group policy settings can potentially be changed from the required configuration.
    This could occur as part of troubleshooting or by a malicious process on a compromised system. Enabling this setting and
    then selecting the "Process even if the Group Policy objects have not changed" option ensures the policies will be reprocessed
    even if none have been changed. This way, any unauthorized changes are forced to match the domain-based group policy settings
    again.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
