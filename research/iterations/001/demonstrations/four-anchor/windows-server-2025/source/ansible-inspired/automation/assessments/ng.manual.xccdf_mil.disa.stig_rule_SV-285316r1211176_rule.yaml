        name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:56701
      exports: []
      inline_content: 'If OpenSSH is not installed on the system, this requirement is not applicable. Verify system remote
        access using OpenSSH prevents logging on with a blank password with the following command: C:\ > Get-Content "$env:ProgramData\ssh\sshd_config"
        | Select-String -Pattern ''^\s*PermitEmptyPasswords'' PermitEmptyPasswords no If the "PermitEmptyPasswords" keyword
        is set to "yes", is missing, or is commented out, this is a finding.'
      multi_check: null
      negate: null
