        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify the operating system employs a deny-all, permit-by-exception policy to allow the execution of authorized\
            \ software programs.\n\nIf an application allowlisting program is not in use on the system, this is a finding.\n\
            \nConfiguration of allowlisting applications will vary by the program.\n\nAppLocker is a allowlisting application\
            \ built in to Windows Server. A deny-by-default implementation is initiated by enabling any AppLocker rules within\
            \ a category, only allowing what is specified by defined rules.\n\nIf AppLocker is used, perform the following\
            \ to view the configuration of AppLocker:\n\nOpen PowerShell.\n\nIf the AppLocker PowerShell module has not been\
            \ imported previously, execute the following first:\n\nImport-Module AppLocker\n\nExecute the following command,\
            \ substituting c:\\temp\\file.xml with a location and file name appropriate for the system:\n\nGet-AppLockerPolicy\
            \ -Effective -XML > c:\\temp\\file.xml\n\nThis will produce an XML file with the effective settings that can be\
            \ viewed in a browser or opened in a program such as Excel for review.\n\nImplementation guidance for AppLocker\
            \ is available in the NSA paper \"Application Whitelisting using Microsoft AppLocker\" at the following link:\
            \ \nhttps://www.iad.gov/iad/library/ia-guidance/tech-briefs/application-whitelisting-using-microsoft-applocker.cfm"
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
