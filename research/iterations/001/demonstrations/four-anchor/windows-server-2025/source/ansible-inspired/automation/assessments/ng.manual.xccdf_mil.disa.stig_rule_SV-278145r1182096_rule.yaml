  id: ng.manual.xccdf_mil.disa.stig_rule_SV-278145r1182096_rule
  version: 1
  description: Windows Server 2025 must use separate, NSA-approved (Type 1) cryptography to protect the directory data in
    transit for directory service implementations at a classified confidentiality level when replication data traverses a
    network cleared to a lower level than the data.
  name: Windows Server 2025 must use separate, NSA-approved (Type 1) cryptography to protect the directory data in transit
