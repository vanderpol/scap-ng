        name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:32101
      exports: []
      inline_content: This applies to domain controllers. It is not applicable for other systems. Review the organization
        network diagram(s) or documentation to determine the level of classification for the network(s) over which replication
        data is transmitted. Determine the classification level of the Windows domain controller. If the classification level
        of the Windows domain controller is higher than the level of the networks, review the organization network diagram(s)
        and directory implementation documentation to determine if NSA-approved encryption is used to protect the replication
        network traffic. If the classification level of the Windows domain controller is higher than the level of the network
        traversed and NSA-approved encryption is not used, this is a finding.
      multi_check: null
      negate: null
