        name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:9901
      exports: []
      inline_content: 'Verify the effective setting in Local Group Policy Editor. Run gpedit.msc. Navigate to Local Computer
        Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Account Policies >> Account Lockout Policy.
        If the "Account lockout duration" is less than "15" minutes (excluding "0"), this is a finding. For server core installations,
        run the following command: Secedit /Export /Areas SecurityPolicy /CFG C:\Path\FileName.Txt If "LockoutDuration" is
        less than "15" (excluding "0") in the file, this is a finding. Configuring this to "0", requiring an administrator
        to unlock the account, is more restrictive and is not a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:9901
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify the effective setting in Local Group Policy Editor.


            Run gpedit.msc.


            Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Account
            Policies >> Account Lockout Policy.


            If the "Account lockout duration" is less than "15" minutes (excluding "0"), this is a finding.


            For server core installations, run the following command:


            Secedit /Export /Areas SecurityPolicy /CFG C:\Path\FileName.Txt


            If "LockoutDuration" is less than "15" (excluding "0") in the file, this is a finding.


            Configuring this to "0", requiring an administrator to unlock the account, is more restrictive and is not a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
