rule:
  abstract: false
  check: 'If the following registry value does not exist or is not configured as specified, this is a finding: Registry Hive:
    HKEY_LOCAL_MACHINE Registry Path: \SYSTEM\CurrentControlSet\Control\Lsa\FIPSAlgorithmPolicy\ Value Name: Enabled Value
    Type: REG_DWORD Value: 0x00000001 (1) Clients with this setting enabled will not be able to communicate via digitally
    encrypted or signed protocols with servers that do not support these algorithms. Both the browser and web server must
    be configured to use TLS; otherwise, the browser will not be able to connect to a secure site.'
