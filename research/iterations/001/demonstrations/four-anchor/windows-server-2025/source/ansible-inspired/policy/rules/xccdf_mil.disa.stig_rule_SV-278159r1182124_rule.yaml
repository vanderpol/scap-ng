scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: This applies to domain controllers. It is not applicable for other systems. Run "MMC". Select "Add/Remove Snap-in"
    from the "File" menu. Select "Certificates" in the left pane, and then click "Add >". Select "Computer Account", and then
    click "Next". Select the appropriate option for "Select the computer you want this snap-in to manage", and then click
    "Finish". Click "OK". Select and expand the "Certificates (Local Computer)" entry in the left pane. Select and expand
    the "Personal" entry in the left pane. Select the "Certificates" entry in the left pane. If no certificate for the domain
    controller exists in the right pane, this is a finding.
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-278159r1182124_rule
    assessment_version: 1
