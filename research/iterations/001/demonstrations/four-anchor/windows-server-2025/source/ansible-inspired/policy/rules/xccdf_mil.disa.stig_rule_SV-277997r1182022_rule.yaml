rule:
  abstract: false
  check: Open "Computer Management". Select "Disk Management" under "Storage". For each local volume, if the file system does
    not indicate "NTFS", this is a finding. "ReFS" (Resilient File System) is also acceptable and would not be a finding.
    "CSVFS" (Cluster Shared Volumes File Systems) is also acceptable and would not be a finding. This does not apply to system
    partitions such the Recovery and EFI System Partition.
