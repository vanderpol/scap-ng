scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: This applies to domain controllers. It is not applicable for other systems. Review the organization network diagram(s)
    or documentation to determine the level of classification for the network(s) over which replication data is transmitted.
    Determine the classification level of the Windows domain controller. If the classification level of the Windows domain
    controller is higher than the level of the networks, review the organization network diagram(s) and directory implementation
    documentation to determine if NSA-approved encryption is used to protect the replication network traffic. If the classification
    level of the Windows domain controller is higher than the level of the network traversed and NSA-approved encryption is
    not used, this is a finding.
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>Directory data that is not appropriately encrypted is subject to compromise. Commercial-grade
    encryption does not provide adequate protection when the classification level of directory data in transit is higher than
    the level of the network.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
