        metadata:
          children:
          - name: title
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: WN25-SH-000060 - Windows Server 2025 OpenSSH must be configured so that all network connections associated
              with SSH traffic terminate after becoming unresponsive.
          - attributes:
              family: windows
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Microsoft Windows Server 2025
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'Terminating an unresponsive SSH session within a short time period reduces the window of opportunity for
              unauthorized personnel to take control of a management session enabled on the console or console port that has
              been left unattended. Quickly terminating an idle SSH session will also free up resources committed by the managed
              network element.


              Terminating network connections associated with communications sessions includes, for example, deallocating
              associated TCP/IP address/port pairs at the operating system level and deallocating networking assignments at
              the application level if multiple application sessions are using a single operating system-level network connection.
              This does not mean the operating system terminates all sessions or network access; it only ends the unresponsive
              session and releases the resources associated with that session.


              Windows Server 2025 uses $env:ProgramData/ssh/sshd_config for configurations of OpenSSH. Within the sshd_config,
              the product of the values of "ClientAliveInterval" and "ClientAliveCountMax" are used to establish the inactivity
              threshold. The "ClientAliveInterval" is a timeout interval in seconds, after which if no data has been received
              from the client, sshd will send a message through the encrypted channel to request a response from the client.
              The "ClientAliveCountMax" is the number of client alive messages that may be sent without sshd receiving any
              messages back from the client. If this threshold is met, sshd will disconnect the client. For more information
              on these settings and others, refer to the sshd_config man pages.


              Satisfies: SRG-OS-000163-GPOS-00072, SRG-OS-000279-GPOS-00110'
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
        source_definition_id: oval:mil.disa.stig.windows2025:def:285318
