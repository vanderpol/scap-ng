scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'If OpenSSH is not installed on the system, this requirement is not applicable. Verify system remote access using
    OpenSSH prevents logging on with a blank password with the following command: C:\ > Get-Content "$env:ProgramData\ssh\sshd_config"
    | Select-String -Pattern ''^\s*PermitEmptyPasswords'' PermitEmptyPasswords no If the "PermitEmptyPasswords" keyword is
    set to "yes", is missing, or is commented out, this is a finding.'
  cluster_id: null
  conflicts: []
  description: '<VulnDiscussion>If an account has an empty password, anyone could log on and run commands with the privileges
    of that account. Accounts with empty passwords must never be used in operational environments. Satisfies: SRG-OS-000106-GPOS-00053,
    SRG-OS-000480-GPOS-00229, SRG-OS-000480-GPOS-00228</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
