rule:
  abstract: false
  check: 'This applies to domain controllers. It is not applicable for other systems. If the following registry value does
    not exist or is not configured as specified, this is a finding: Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SYSTEM\CurrentControlSet\Services\NTDS\Parameters\
    Value Name: LDAPServerIntegrity Value Type: REG_DWORD Value: 0x00000002 (2)'
