  cluster_id: null
  conflicts: []
  default_check: default
  description: '<VulnDiscussion>Unsigned network traffic is susceptible to man-in-the-middle attacks, where an intruder captures
    packets between the server and the client and modifies them before forwarding them to the client. In the case of an LDAP
    server, this means that an attacker could cause a client to make decisions based on false records from the LDAP directory.
    The risk of an attacker pulling this off can be decreased by implementing strong physical security measures to protect
    the network infrastructure. Furthermore, implementing Internet Protocol security (IPsec) authentication header (AH) mode,
    which performs mutual authentication and packet integrity for IP traffic, can make all types of man-in-the-middle attacks
    extremely difficult. Satisfies: SRG-OS-000423-GPOS-00187, SRG-OS-000424-GPOS-00188</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
