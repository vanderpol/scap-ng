rule:
  abstract: false
  check: 'If the following registry value does not exist or is not configured as specified, this is a finding: Registry Hive:
    HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\ Value Name: InactivityTimeoutSecs
    Value Type: REG_DWORD Value: 0x00000384 (900) (or less, excluding "0" which is effectively disabled)'
  cluster_id: null
  conflicts: []
  description: '<VulnDiscussion>Unattended systems are susceptible to unauthorized use and must be locked when unattended.
    The screen saver must be set at a maximum of 15 minutes and be password protected. This protects critical and sensitive
    data from exposure to unauthorized personnel with physical access to the computer. Satisfies: SRG-OS-000028-GPOS-00009,
    SRG-OS-000029-GPOS-00010, SRG-OS-000031-GPOS-00012</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
