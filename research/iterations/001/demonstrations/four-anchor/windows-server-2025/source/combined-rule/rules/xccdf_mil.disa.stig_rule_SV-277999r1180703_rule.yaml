        than "Read & execute" permissions. Individual accounts must not be used to assign permissions. If permissions are
        not as restrictive as the default permissions listed below, this is a finding. Viewing in File Explorer: For each
        folder, view the Properties. Select the "Security" tab, and then click "Advanced". Default permissions: \Program Files
