  fix: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >>
    User Rights Assignment >> Create symbolic links to include only the following accounts or groups: - Administrators. Systems
    that have the Hyper-V role will also have "Virtual Machines" given this user right. To add this manually, enter it as
    "NT Virtual Machine\Virtual Machines".'
