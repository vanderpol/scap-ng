rule:
  id: xccdf_mil.disa.stig_rule_SV-278160r1256718_rule
  title: Windows Server 2025 domain Controller PKI certificates must be issued by the DoW PKI or an approved External Certificate
    Authority (ECA).
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-278160
  description: <VulnDiscussion>A PKI implementation depends on the practices established by the Certificate Authority (CA)
    to ensure the implementation is secure. Without proper practices, the certificates issued by a CA have limited value in
    authentication functions. The use of multiple CAs from separate PKI implementations results in interoperability issues.
    If servers and clients do not have a common set of root CA certificates, they are not able to authenticate each other.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
  platforms: []
  effective_platform_refs:
