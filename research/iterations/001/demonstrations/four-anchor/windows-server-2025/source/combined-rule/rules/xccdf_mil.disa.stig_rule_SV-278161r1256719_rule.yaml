rule:
  id: xccdf_mil.disa.stig_rule_SV-278161r1256719_rule
  title: Windows Server 2025 PKI certificates associated with user accounts must be issued by a DoW PKI or an approved External
    Certificate Authority (ECA).
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
