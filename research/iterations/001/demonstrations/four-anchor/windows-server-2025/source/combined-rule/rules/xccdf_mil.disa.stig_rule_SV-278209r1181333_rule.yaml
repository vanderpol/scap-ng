rule:
  id: xccdf_mil.disa.stig_rule_SV-278209r1181333_rule
  title: The Windows Server 2025 Smart Card removal option must be configured to Force Logoff or Lock Workstation.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
