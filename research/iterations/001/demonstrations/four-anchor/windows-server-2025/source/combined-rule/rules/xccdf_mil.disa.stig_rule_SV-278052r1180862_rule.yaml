            text: "Security Option \"Audit: Force audit policy subcategory settings (Windows 7 or later) to override audit\
              \ policy category settings\" must be set to \"Enabled\" (WN25-SO-000050) for the detailed auditing subcategories\
              \ to be effective. \n\nUse the \"AuditPol\" tool to review the current Audit Policy configuration.\n\nOpen PowerShell\
              \ or a command prompt with elevated privileges (\"Run as administrator\").\n\nEnter \"AuditPol /get /category:*\"\
              \n\nCompare the \"AuditPol\" settings with the following.\n\nIf the system does not audit the following, this\
