  group_path:
  - xccdf_mil.disa.stig_group_V-277993
  description: <VulnDiscussion>Credential Guard uses virtualization-based security to protect data that could be used in credential
    theft attacks if compromised. A number of system requirements must be met for Credential Guard to be configured and enabled
    properly. Without a TPM enabled and ready for use, Credential Guard keys are stored in a less secure method using software.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
