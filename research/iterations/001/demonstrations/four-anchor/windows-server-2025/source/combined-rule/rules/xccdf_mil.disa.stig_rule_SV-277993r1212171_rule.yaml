rule:
  id: xccdf_mil.disa.stig_rule_SV-277993r1212171_rule
  title: Windows Server 2025 systems must have a Trusted Platform Module (TPM) enabled and ready for use.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
