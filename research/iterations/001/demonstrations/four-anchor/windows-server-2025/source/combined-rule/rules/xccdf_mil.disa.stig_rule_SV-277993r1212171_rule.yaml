            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Credential Guard uses virtualization-based security to protect data that could be used in credential theft
                attacks if compromised. A number of system requirements must be met for Credential Guard to be configured
                and enabled properly. Without a TPM enabled and ready for use, Credential Guard keys are stored in a less
                secure method using software.
