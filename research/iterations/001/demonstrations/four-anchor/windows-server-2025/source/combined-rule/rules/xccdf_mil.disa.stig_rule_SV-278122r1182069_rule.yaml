  fix: The default behavior is for Internet Explorer to warn users and select whether to allow or refuse installation when
    a web-based program attempts to install software on the system. To correct this, configure the policy value for Computer
    Configuration >> Administrative Templates >> Windows Components >> Windows Installer >> Prevent Internet Explorer security
    prompt for Windows Installer scripts to "Not Configured" or "Disabled".
