  assessment: &id001
    id: ng.scap14.xccdf_mil.disa.stig_rule_SV-277998r1180700_rule
    version: 1
    description: Windows Server 2025 permissions for the system drive root directory (usually C:\) must conform to minimum
      requirements.
    semantic_model: scap-ng-generic-assessment-graph-0.1
    collect:
      oval:navy.navwar.niwcatlantic.scc.windows:obj:27799802:
        capability: scapng.collect.independent.shellcommand
        source_object_id: oval:navy.navwar.niwcatlantic.scc.windows:obj:27799802
        source_type: shellcommand_object
        source_namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
        version: '1'
        comment: Run Icacls command against system drive root directory
        query:
        - kind: element
          name: shell
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
          value: powershell
        - kind: element
          name: command
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
          value: icacls($env:SystemDrive + '\')
        - kind: element
          name: pattern
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
          value: ':'
      oval:navy.navwar.niwcatlantic.scc.windows:obj:27799801:
        capability: scapng.collect.windows.registry
        source_object_id: oval:navy.navwar.niwcatlantic.scc.windows:obj:27799801
        source_type: registry_object
        source_namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#windows
        version: '1'
        comment: everyoneincludesanonymous must be configured
        query:
        - kind: element
          name: hive
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#windows
          value: HKEY_LOCAL_MACHINE
        - kind: element
          name: key
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#windows
          value: SYSTEM\CurrentControlSet\Control\Lsa
        - kind: element
          name: name
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#windows
          value: everyoneincludesanonymous
    derive:
      oval:navy.navwar.niwcatlantic.scc.windows:var:27799801:
