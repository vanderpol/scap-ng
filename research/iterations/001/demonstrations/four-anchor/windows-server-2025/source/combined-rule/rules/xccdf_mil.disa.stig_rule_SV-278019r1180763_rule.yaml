  fix: Uninstall the "Peer Name Resolution Protocol" feature. Start Server Manager. Select the server with the feature. Scroll
    down to "ROLES AND FEATURES" in the right pane. Select "Remove Roles and Features" from the drop-down "TASKS" list. Select
    the appropriate server on the "Server Selection" page and click "Next". Deselect "Peer Name Resolution Protocol" on the
    "Features" page. Click "Next" and "Remove" as prompted.
