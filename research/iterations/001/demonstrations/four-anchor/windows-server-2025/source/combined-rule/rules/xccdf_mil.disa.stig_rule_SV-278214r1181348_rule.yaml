rule:
  id: xccdf_mil.disa.stig_rule_SV-278214r1181348_rule
  title: 'The Windows Server 2025 setting Microsoft network server: Digitally sign communications (if client agrees) must
    be configured to Enabled.'
  severity: medium
  weight: '10.0'
  role: null
