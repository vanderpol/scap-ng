          name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:40901
        exports: []
        inline_content: 'For domain controllers and stand-alone or nondomain-joined systems, this is not applicable. Open
          PowerShell with elevated privileges (run as administrator). Enter the following: "Get-CimInstance -ClassName Win32_DeviceGuard
          -Namespace root\Microsoft\Windows\DeviceGuard" If "SecurityServicesRunning" does not include a value of "1" (e.g.,
          "{1, 2}"), this is a finding. Alternately: Run "System Information". Under "System Summary", verify the following:
          If "Device Guard Security Services Running" does not list "Credential Guard", this is a finding. The policy settings
          referenced in the Fix section will configure the following registry value. However, due to hardware requirements,
          the registry value alone does not ensure proper function. Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\
          Value Name: LsaCfgFlags Value Type: REG_DWORD Value: 0x00000001 (1) (Enabled with UEFI lock) A Microsoft article
          on Credential Guard system requirements can be found at the following link: https://docs.microsoft.com/en-us/windows/security/identity-protection/credential-guard/credential-guard-requirements'
        multi_check: null
        negate: null
        selector: manual
        source_tree:
          attributes:
            selector: manual
            system: http://scap.nist.gov/schema/ocil/2
          children:
          - attributes:
              href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
              name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:40901
            name: check-content-ref
            namespace: http://checklists.nist.gov/xccdf/1.2
          - name: check-content
            namespace: http://checklists.nist.gov/xccdf/1.2
            text: 'For domain controllers and stand-alone or nondomain-joined systems, this is not applicable.


              Open PowerShell with elevated privileges (run as administrator).


              Enter the following:


              "Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard"


              If "SecurityServicesRunning" does not include a value of "1" (e.g., "{1, 2}"), this is a finding.


              Alternately:


              Run "System Information".


              Under "System Summary", verify the following:


              If "Device Guard Security Services Running" does not list "Credential Guard", this is a finding.


              The policy settings referenced in the Fix section will configure the following registry value. However, due
              to hardware requirements, the registry value alone does not ensure proper function.


              Registry Hive: HKEY_LOCAL_MACHINE

              Registry Path: \SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\


              Value Name: LsaCfgFlags

              Value Type: REG_DWORD

              Value: 0x00000001 (1) (Enabled with UEFI lock)


              A Microsoft article on Credential Guard system requirements can be found at the following link:


              https://docs.microsoft.com/en-us/windows/security/identity-protection/credential-guard/credential-guard-requirements'
          name: check
          namespace: http://checklists.nist.gov/xccdf/1.2
        system: http://scap.nist.gov/schema/ocil/2
      kind: check_candidates
