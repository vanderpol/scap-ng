  fix: 'Configure the policy value for Computer Configuration >> Administrative Templates >> System >> Device Guard >> Turn
    On Virtualization Based Security to "Enabled" with "Enabled with UEFI lock" selected for "Credential Guard Configuration".
    A Microsoft article on Credential Guard system requirements can be found at the following link: https://docs.microsoft.com/en-us/windows/security/identity-protection/credential-guard/credential-guard-requirements
    Severity Override Guidance: The AO can allow the severity override if they have reviewed the overall protection provided
    to the affected servers that are not capable of complying with the Credential Guard requirement. Items that must be reviewed/considered
    for compliance or mitigation for non-Credential Guard compliance are: - The use of Microsoft Local Administrator Password
    Solution (LAPS) or similar products to control different local administrative passwords for all affected servers. This
    is to include a strict password change requirement (60 days or less). - Strict separation of roles and duties. Server
    administrator credentials cannot be used on Windows desktop to administer it. Documentation of all exceptions must be
    supplied. - Use of a Privileged Access Workstation (PAW) and adherence to the Clean Source principle for administering
    affected servers. - Boundary Protection that is currently in place to protect from vulnerabilities in the network/servers.
    - Windows Defender rule block credential stealing from LSASS.exe is applied. This rule can only be applied if Windows
    Defender is in use. - The overall number of vulnerabilities that are unmitigated on the network/servers.'
