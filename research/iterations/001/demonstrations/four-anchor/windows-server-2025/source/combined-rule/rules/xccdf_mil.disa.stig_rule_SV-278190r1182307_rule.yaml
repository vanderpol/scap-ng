rule:
  id: xccdf_mil.disa.stig_rule_SV-278190r1182307_rule
  title: Windows Server 2025 must be running Credential Guard on domain-joined member servers.
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
