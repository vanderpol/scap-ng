              text: Windows Server 2025 must be running Credential Guard on domain-joined member servers.
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Credential Guard uses virtualization-based security to protect data that could be used in credential theft
                attacks if compromised. This authentication information, which was stored in the Local Security Authority
                (LSA) in previous versions of Windows, is isolated from the rest of operating system and can only be accessed
                by privileged system software.
            name: metadata
