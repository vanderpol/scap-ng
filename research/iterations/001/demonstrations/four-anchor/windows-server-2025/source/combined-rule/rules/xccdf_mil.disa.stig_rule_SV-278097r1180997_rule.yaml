  group_path:
  - xccdf_mil.disa.stig_group_V-278097
  description: <VulnDiscussion>A system that does not require authentication when resuming from sleep may provide access to
    unauthorized users. Authentication must always be required when accessing a system. This setting ensures users are prompted
    for a password when the system wakes from sleep (plugged in).</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
