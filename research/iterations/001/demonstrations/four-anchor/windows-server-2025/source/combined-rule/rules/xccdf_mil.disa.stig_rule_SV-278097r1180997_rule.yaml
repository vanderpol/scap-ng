rule:
  id: xccdf_mil.disa.stig_rule_SV-278097r1180997_rule
  title: Windows Server 2025 users must be prompted to authenticate when the system wakes from sleep (plugged in).
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
