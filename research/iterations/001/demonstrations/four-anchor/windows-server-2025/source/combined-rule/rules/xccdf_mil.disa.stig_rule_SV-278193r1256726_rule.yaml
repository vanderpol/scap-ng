            children:
            - name: title
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: WN25-PK-000020 - Windows Server 2025 must have the DoW Interoperability Root Certificate Authority (CA)
                cross-certificates installed in the Untrusted Certificates Store on unclassified systems.
            - attributes:
                family: windows
              children:
              - name: platform
                namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
                text: Microsoft Windows Server 2025
              name: affected
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: "To ensure users do not experience denial of service when performing certificate-based authentication\
                \ to DoW websites due to the system chaining to a root other than DoW Root CAs, the DoW Interoperability Root\
                \ CA cross-certificates must be installed in the Untrusted Certificate Store. This requirement only applies\
                \ to unclassified systems.\n\n  Satisfies: SRG-OS-000066-GPOS-00034, SRG-OS-000403-GPOS-00182"
            name: metadata
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
