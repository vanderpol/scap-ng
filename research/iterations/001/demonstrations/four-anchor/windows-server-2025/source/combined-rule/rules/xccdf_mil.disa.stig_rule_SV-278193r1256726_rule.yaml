          - name: check-content
            namespace: http://checklists.nist.gov/xccdf/1.2
            text: "This is applicable to unclassified systems. It is not applicable for others.\n\nOpen \"PowerShell\" as\
              \ an administrator.\n\nExecute the following command:\n\nGet-ChildItem -Path Cert:Localmachine\\disallowed |\
              \ Where {$_.Issuer -Like \"*DOD Interoperability*\" -and $_.Subject -Like \"*DOD*\"} | FL Subject, NotAfter\n\
              \nIf valid DoW Interoperability cross-certificates (such as those below) are not listed, this is a finding.\
              \ \n\nSubject: CN=DoD Interoperability Root CA 2, OU=PKI, OU=DoD, O=U.S. Government, C=US\nNotAfter: 11/24/2030\
              \ \n\nAlternately, use the Certificates MMC snap-in:\n\nRun \"MMC\".\n\nSelect \"File\", \"Add/Remove Snap-in\"\
              .\n\nSelect \"Certificates\" and click \"Add\".\n\nSelect \"Computer account\" and click \"Next\".\n\nSelect\
              \ \"Local computer: (the computer this console is running on)\" and click \"Finish\".\n\nClick \"OK\".\n\nExpand\
              \ \"Certificates\" and navigate to Untrusted Certificates >> Certificates.\n\nFor each DoW Interoperability\
              \ Root CA certificate displayed:\n\nRight-click the certificate and select \"Open\".\n\nSelect the \"Details\"\
              \ tab.\n\nVerify that the Expiration Date is a future date.\n\nScroll to the bottom and select \"Subject\".\n\
              \nIf any of the certificates listed do not include \"DoD Interoperability Root CA\" in the Subject name or are\
              \ expired, this is a finding.\n\nNote: The list below should not be relied upon as a complete set of possible\
              \ DoW Interoperability Root CA certificates.\n\nDOD Interoperability Root CA 2\n\nNote: Interoperability cross-certificates\
              \ will have a different value (such as \"...Root CA 6\") in the 'Issued To'  field than in the 'Subject' and\
              \ 'Issuer' fields."
          name: check
          namespace: http://checklists.nist.gov/xccdf/1.2
        system: http://scap.nist.gov/schema/ocil/2
      kind: check_candidates
