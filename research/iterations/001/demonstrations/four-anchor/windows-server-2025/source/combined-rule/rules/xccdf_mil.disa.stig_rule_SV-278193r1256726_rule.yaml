          name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:41301
        exports: []
        inline_content: 'This is applicable to unclassified systems. It is not applicable for others. Open "PowerShell" as
          an administrator. Execute the following command: Get-ChildItem -Path Cert:Localmachine\disallowed | Where {$_.Issuer
          -Like "*DOD Interoperability*" -and $_.Subject -Like "*DOD*"} | FL Subject, NotAfter If valid DoW Interoperability
          cross-certificates (such as those below) are not listed, this is a finding. Subject: CN=DoD Interoperability Root
          CA 2, OU=PKI, OU=DoD, O=U.S. Government, C=US NotAfter: 11/24/2030 Alternately, use the Certificates MMC snap-in:
          Run "MMC". Select "File", "Add/Remove Snap-in". Select "Certificates" and click "Add". Select "Computer account"
          and click "Next". Select "Local computer: (the computer this console is running on)" and click "Finish". Click "OK".
          Expand "Certificates" and navigate to Untrusted Certificates >> Certificates. For each DoW Interoperability Root
          CA certificate displayed: Right-click the certificate and select "Open". Select the "Details" tab. Verify that the
          Expiration Date is a future date. Scroll to the bottom and select "Subject". If any of the certificates listed do
          not include "DoD Interoperability Root CA" in the Subject name or are expired, this is a finding. Note: The list
          below should not be relied upon as a complete set of possible DoW Interoperability Root CA certificates. DOD Interoperability
          Root CA 2 Note: Interoperability cross-certificates will have a different value (such as "...Root CA 6") in the
          ''Issued To'' field than in the ''Subject'' and ''Issuer'' fields.'
        multi_check: null
        negate: null
        selector: manual
        source_tree:
          attributes:
            selector: manual
            system: http://scap.nist.gov/schema/ocil/2
          children:
          - attributes:
              href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
