  group_path:
  - xccdf_mil.disa.stig_group_V-278068
  description: '<VulnDiscussion>Maintaining an audit trail of system activity logs can help identify configuration errors,
    troubleshoot service disruptions, and analyze compromises that have occurred, as well as detect attacks. Audit logs are
    necessary to provide a trail of evidence in case the system or network is compromised. Collecting this data is essential
    for analyzing the security of information assets and detecting signs of suspicious and unexpected behavior. Authentication
    Policy Change records events related to changes in authentication policy, including Kerberos policy and Trust changes.
    Satisfies: SRG-OS-000327-GPOS-00127, SRG-OS-000064-GPOS-00033, SRG-OS-000462-GPOS-00206, SRG-OS-000466-GPOS-00210</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
