  fix: The default behavior is for Early Launch Antimalware - Boot-Start Driver Initialization policy to enforce "Good, unknown
    and bad but critical" (preventing "bad"). To correct this, or if a more secure setting is desired, configure the policy
    value for Computer Configuration >> Administrative Templates >> System >> Early Launch Antimalware >> Boot-Start Driver
    Initialization Policy to "Not Configured" or "Enabled" with any option other than "All" selected.
