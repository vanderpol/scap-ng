  check: If the server has the role of an FTP server, this is not applicable. Open PowerShell. Enter "Get-WindowsFeature |
    Where Name -eq Web-Ftp-Service". If "Installed State" is "Installed", this is a finding. An Installed State of "Available"
    or "Removed" is not a finding. If the system has the role of an FTP server, this must be documented with the information
    system security officer (ISSO).
