  check: 'If OpenSSH is not installed on the system, this requirement is not applicable. If the system administrator demonstrates
    the use of an approved alternate multifactor authentication method, this requirement is not applicable. Verify the system
    accepts public key encryption with the following command: C:\ > Get-Content "$env:ProgramData\ssh\sshd_config" | Select-String
    -Pattern ''^\s*PubkeyAuthentication'' PubkeyAuthentication yes If "PubkeyAuthentication" is set to "no", the line is commented
    out, or the line is missing, this is a finding.'
