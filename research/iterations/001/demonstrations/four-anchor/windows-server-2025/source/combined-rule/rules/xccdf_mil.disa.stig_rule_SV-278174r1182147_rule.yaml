rule:
  id: xccdf_mil.disa.stig_rule_SV-278174r1182147_rule
  title: The Windows Server 2025 "Deny log on through Remote Desktop Services" user right on domain controllers must be configured
    to prevent unauthenticated access.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-278174
  description: <VulnDiscussion>Inappropriately granting user rights provides system, administrative, and other high-level
    capabilities. The "Deny log on through Remote Desktop Services" user right defines the accounts that are prevented from
    logging on using Remote Desktop Services. The Guests group must be assigned this right to prevent unauthenticated access.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
