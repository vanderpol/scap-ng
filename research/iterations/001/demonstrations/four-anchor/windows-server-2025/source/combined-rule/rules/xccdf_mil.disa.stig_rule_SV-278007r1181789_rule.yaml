  check: If only system-created shares such as "ADMIN$", "C$", and "IPC$" exist on the system, this is not applicable. (System-created
    shares will display a message that it has been shared for administrative purposes when "Properties" is selected.) Run
    "Computer Management". Navigate to System Tools >> Shared Folders >> Shares. Right-click any nonsystem-created shares.
    Select "Properties". Select the "Share Permissions" tab. If the file shares have not been configured to restrict permissions
    to the specific groups or accounts that require access, this is a finding. Select the "Security" tab. If the permissions
    have not been configured to restrict permissions to the specific groups or accounts that require access, this is a finding.
