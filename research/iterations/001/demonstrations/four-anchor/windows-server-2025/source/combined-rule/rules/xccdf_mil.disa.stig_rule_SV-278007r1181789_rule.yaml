rule:
  id: xccdf_mil.disa.stig_rule_SV-278007r1181789_rule
  title: Windows Server 2025 nonsystem-created file shares must limit access to groups that require it.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
