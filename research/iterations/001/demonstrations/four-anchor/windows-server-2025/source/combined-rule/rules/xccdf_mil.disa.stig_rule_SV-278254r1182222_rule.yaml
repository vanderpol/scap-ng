rule:
  id: xccdf_mil.disa.stig_rule_SV-278254r1182222_rule
  title: The Windows Server 2025 "Increase scheduling priority" user right must only be assigned to the Administrators group.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-278254
  description: <VulnDiscussion>Inappropriately granting user rights provides system, administrative, and other high-level
    capabilities. Accounts with the "Increase scheduling priority" user right can change a scheduling priority, causing performance
    issues or a denial of service.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
  platforms: []
  effective_platform_refs:
