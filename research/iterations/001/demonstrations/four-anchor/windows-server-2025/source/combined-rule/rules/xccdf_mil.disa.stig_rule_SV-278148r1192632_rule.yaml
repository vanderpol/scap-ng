  check: 'This applies to domain controllers. It is not applicable for other systems. Review the auditing configuration for
    all GPOs. Open "Group Policy Management" (available from various menus or run "gpmc.msc"). Navigate to "Group Policy Objects"
    in the domain being reviewed (Forest >> Domains >> Domain). For each GPO: Select the GPO item in the left pane. Select
    the "Delegation" tab in the right pane. Select "Advanced". Select "Advanced", and then select the "Auditing" tab. If the
    audit settings for any GPO are not at least as inclusive as those below, this is a finding: Type - Fail Principal - Everyone
    Access - Full Control Applies to - This object and all descendant objects or Descendant groupPolicyContainer objects The
    three Success types listed below are defaults inherited from the Parent Object. Where Special is listed in the summary
    screens for Access, detailed Permissions are provided for reference. Type - Success Principal - Everyone Access - Special
    (Permissions: Write all properties, Modify permissions; Properties: all "Write" type selected) Inherited from - Parent
    Object Applies to - Descendant groupPolicyContainer objects Two instances with the following summary information will
    be listed: Type - Success Principal - Everyone Access - blank (Permissions: none selected; Properties: one instance -
    Write gPLink, one instance - Write gPOptions) Inherited from - Parent Object Applies to - Descendant Organization Unit
    Objects'
