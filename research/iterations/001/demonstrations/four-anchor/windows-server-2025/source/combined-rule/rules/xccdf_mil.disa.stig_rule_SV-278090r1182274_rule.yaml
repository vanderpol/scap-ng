  description: <VulnDiscussion>Virtualization Based Security (VBS) provides the platform for the additional security features
    Credential Guard and virtualization-based protection of code integrity. Secure Boot is the minimum security level, with
    DMA protection providing additional memory protection. DMA Protection requires a CPU that supports input/output memory
    management unit (IOMMU).</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
