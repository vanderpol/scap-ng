rule:
  id: xccdf_mil.disa.stig_rule_SV-278090r1182274_rule
  title: Windows Server 2025 virtualization-based security must be enabled with the platform security level configured to
    Secure Boot or Secure Boot with DMA Protection.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
