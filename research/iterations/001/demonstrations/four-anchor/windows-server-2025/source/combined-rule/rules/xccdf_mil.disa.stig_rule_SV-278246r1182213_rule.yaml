        inline_content: 'Verify the effective setting in Local Group Policy Editor. Run gpedit.msc. Navigate to Local Computer
          Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment.
          If any accounts or groups are granted the "Create a token object" user right, this is a finding. For server core
          installations, run the following command: Secedit /Export /Areas User_Rights /cfg c:\path\filename.txt Review the
          text file. If any SIDs are granted the "SeCreateTokenPrivilege" user right, this is a finding. If an application
          requires this user right, this is not a finding. Vendor documentation must support the requirement for having the
          user right. The requirement must be documented with the information system security officer (ISSO). The application
          account must meet requirements for application account passwords, such as length (WN25-00-000050) and required frequency
          of changes (WN25-00-000060). Passwords for application accounts with this user right must be protected as highly
