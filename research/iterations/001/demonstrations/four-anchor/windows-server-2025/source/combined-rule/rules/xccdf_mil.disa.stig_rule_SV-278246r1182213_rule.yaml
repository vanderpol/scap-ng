rule:
  id: xccdf_mil.disa.stig_rule_SV-278246r1182213_rule
  title: The Windows Server 2025 "Create a token object" user right must not be assigned to any groups or accounts.
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-278246
  description: <VulnDiscussion>Inappropriately granting user rights provides system, administrative, and other high-level
    capabilities. The "Create a token object" user right allows a process to create an access token. This could be used to
    provide elevated rights and compromise a system.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
  platforms: []
  effective_platform_refs:
  - cpe:/o:microsoft:windows_server_2025:-::~~~~x64~
  effective_platforms:
  - kind: cpe_name
    name: cpe:/o:microsoft:windows_server_2025:-::~~~~x64~
    ref: cpe:/o:microsoft:windows_server_2025:-::~~~~x64~
  references:
  - href: null
    text: DPMS Target Microsoft Windows Server 2025 DISA DPMS Target Microsoft Windows Server 2025 5719
  idents:
  - system: http://cyber.mil/cci
    value: CCI-002235
  requires: []
  conflicts: []
  check: 'Verify the effective setting in Local Group Policy Editor. Run gpedit.msc. Navigate to Local Computer Policy >>
    Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment. If any accounts
    or groups are granted the "Create a token object" user right, this is a finding. For server core installations, run the
    following command: Secedit /Export /Areas User_Rights /cfg c:\path\filename.txt Review the text file. If any SIDs are
    granted the "SeCreateTokenPrivilege" user right, this is a finding. If an application requires this user right, this is
    not a finding. Vendor documentation must support the requirement for having the user right. The requirement must be documented
    with the information system security officer (ISSO). The application account must meet requirements for application account
    passwords, such as length (WN25-00-000050) and required frequency of changes (WN25-00-000060). Passwords for application
    accounts with this user right must be protected as highly privileged accounts.'
