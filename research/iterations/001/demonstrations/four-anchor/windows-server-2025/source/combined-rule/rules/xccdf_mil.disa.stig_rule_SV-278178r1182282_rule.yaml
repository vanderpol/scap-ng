  check: 'This applies to member servers. For domain controllers and stand-alone or nondomain-joined systems, this is not
    applicable. If the following registry value does not exist or is not configured as specified, this is a finding: Registry
    HiveHKEY_LOCAL_MACHINE Registry Path\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System Value NameLocalAccountTokenFilterPolicy
    TypeREG_DWORD Value: 0x00000000 (0) This setting may cause issues with some network scanning tools if local administrative
    accounts are used remotely. Scans must use domain accounts where possible. If a local administrative account must be used,
    temporarily enabling the privileged token by configuring the registry value to "1" may be required.'
