        comment: Analyze the permissions on the Group Policy Objects and report details on any non-compliant permission found.
        query:
        - attributes:
            error_if_stderr_exists: 'true'
          kind: element
          name: behaviors
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
        - kind: element
