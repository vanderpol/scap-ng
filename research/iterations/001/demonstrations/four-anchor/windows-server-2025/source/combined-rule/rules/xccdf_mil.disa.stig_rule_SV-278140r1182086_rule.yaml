            namespace: http://checklists.nist.gov/xccdf/1.2
            text: "This applies to domain controllers. It is not applicable for other systems.\n\nReview the permissions on\
              \ GPOs.\n\nOpen \"Group Policy Management\" (available from various menus or run \"gpmc.msc\").\n\nNavigate\
              \ to \"Group Policy Objects\" in the domain being reviewed (Forest >> Domains >> Domain).\n\nFor each GPO:\n\
              \nSelect the GPO item in the left pane.\n\nSelect the \"Delegation\" tab in the right pane.\n\nSelect \"Advanced\"\
              .\n\nSelect each Group or user name.\n\nView the permissions.\n\nIf any standard user accounts or groups have\
              \ \"Allow\" permissions greater than \"Read\" and \"Apply group policy\", this is a finding.\n\nOther access\
              \ permissions that allow the objects to be updated are considered findings unless specifically documented by\
              \ the information system security officer (ISSO).\n\nThe default permissions noted below satisfy this requirement.\
              \ \n\nThe permissions shown are at the summary level. More detailed permissions can be viewed by selecting the\
              \ next \"Advanced\" button, the desired Permission entry, and the \"Edit\" button.\n\nAuthenticated Users -\
              \ Read, Apply group policy, Special permissions\n\nThe special permissions for Authenticated Users are for Read-type\
              \ Properties. If detailed permissions include any Create, Delete, Modify, or Write Permissions, or Properties,\
              \ this is a finding.\n\nThe special permissions for the following default groups are not the focus of this requirement\
              \ and may include a wide range of permissions and properties:\n\nCREATOR OWNER - Special permissions\nSYSTEM\
              \ - Read, Write, Create all child objects, Delete all child objects, Special permissions\nDomain Admins - Read,\
              \ Write, Create all child objects, Delete all child objects, Special permissions\nEnterprise Admins - Read,\
              \ Write, Create all child objects, Delete all child objects, Special permissions\nENTERPRISE DOMAIN CONTROLLERS\
              \ - Read, Special permissions\n\nThe Domain Admins and Enterprise Admins will not have the \"Delete all child\
              \ objects\" permission on the two default Group Policy objects: Default Domain Policy and Default Domain Controllers\
              \ Policy. They will have this permission on organization created Group Policy objects."
          name: check
          namespace: http://checklists.nist.gov/xccdf/1.2
        system: http://scap.nist.gov/schema/ocil/2
