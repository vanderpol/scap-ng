rule:
  id: xccdf_mil.disa.stig_rule_SV-278173r1182146_rule
  title: Windows Server 2025 must be configured for name-based strong mappings for certificates.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
