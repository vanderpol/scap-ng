  fix: Configure all user accounts, including administrator accounts, in AD to enable the option "Smart card is required for
    interactive logon". Run "Active Directory Users and Computers" (available from various menus or run "dsa.msc"). Select
    the OU where the user accounts are located. (By default, this is the Users node; however, accounts may be under other
    organization-defined OUs.) Right-click the user account and select "Properties". Select the "Account" tab. Check "Smart
    card is required for interactive logon" in the "Account Options" area.
