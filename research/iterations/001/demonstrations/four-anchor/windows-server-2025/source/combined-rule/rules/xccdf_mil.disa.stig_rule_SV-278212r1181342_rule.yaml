rule:
  id: xccdf_mil.disa.stig_rule_SV-278212r1181342_rule
  title: Windows Server 2025 unencrypted passwords must not be sent to third-party Server Message Block (SMB) servers.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
