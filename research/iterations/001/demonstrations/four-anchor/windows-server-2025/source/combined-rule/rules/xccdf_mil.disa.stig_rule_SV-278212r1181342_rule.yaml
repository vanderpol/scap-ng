  group_path:
  - xccdf_mil.disa.stig_group_V-278212
  description: <VulnDiscussion>Some non-Microsoft SMB servers only support unencrypted (plain-text) password authentication.
    Sending plain-text passwords across the network when authenticating to an SMB server reduces the overall security of the
    environment. Check with the vendor of the SMB server to determine if there is a way to support encrypted password authentication.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
