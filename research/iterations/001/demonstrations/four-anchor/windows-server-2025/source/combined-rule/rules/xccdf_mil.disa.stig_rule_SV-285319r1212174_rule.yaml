        inline_content: 'If OpenSSH is not installed on the system, this requirement is not applicable. Verify the "ClientAliveInterval"
          variable is set to a value of "600" or less by performing the following command: C:\ > Get-Content "$env:ProgramData\ssh\sshd_config"
          | Select-String -Pattern ''^\s*ClientAliveInterval'' ClientAliveInterval 600 If "ClientAliveInterval" does not exist,
