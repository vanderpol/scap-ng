rule:
  id: xccdf_mil.disa.stig_rule_SV-277997r1182022_rule
  title: Windows Server 2025 local volumes must use a format that supports New Technology File System (NTFS) attributes.
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
