  description: <VulnDiscussion>The ability to set access permissions and auditing is critical to maintaining the security
    and proper access controls of a system. To support this, volumes must be formatted using a file system that supports NTFS
    attributes.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
