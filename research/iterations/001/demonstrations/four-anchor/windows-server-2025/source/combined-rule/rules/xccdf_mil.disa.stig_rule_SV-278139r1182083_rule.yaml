rule:
  id: xccdf_mil.disa.stig_rule_SV-278139r1182083_rule
  title: Windows Server 2025 Active Directory SYSVOL directory must have the proper access control permissions.
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
