  requires: []
  conflicts: []
  check: 'This applies to domain controllers. It is not applicable for other systems. Open a command prompt. Run "net share".
    Make note of the directory location of the SYSVOL share. By default, this will be \Windows\SYSVOL\sysvol. For this requirement,
    permissions will be verified at the first SYSVOL directory level. If any standard user accounts or groups have greater
    than "Read & execute" permissions, this is a finding. The default permissions noted below meet this requirement: Open
    command prompt. Run "icacls c:\Windows\SYSVOL". The following results must be displayed: NT AUTHORITY\Authenticated Users:(RX)
    NT AUTHORITY\Authenticated Users:(OI)(CI)(IO)(GR,GE) BUILTIN\Server Operators:(RX) BUILTIN\Server Operators:(OI)(CI)(IO)(GR,GE)
    BUILTIN\Administrators:(M,WDAC,WO) BUILTIN\Administrators:(OI)(CI)(IO)(F) NT AUTHORITY\SYSTEM:(F) NT AUTHORITY\SYSTEM:(OI)(CI)(IO)(F)
    CREATOR OWNER:(OI)(CI)(IO)(F) (RX) - Read & execute Run "icacls /help" to view definitions of other permission codes.'
