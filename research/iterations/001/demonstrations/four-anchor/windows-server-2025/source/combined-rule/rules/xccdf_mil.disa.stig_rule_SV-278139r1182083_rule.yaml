  fix: 'Maintain the permissions on the SYSVOL directory. Do not allow greater than "Read & execute" permissions for standard
    user accounts or groups. The defaults below meet this requirement: C:\Windows\SYSVOL Type - "Allow" for all Inherited
    from - "None" for all Principal - Access - Applies to Authenticated Users - Read & execute - This folder, subfolder, and
    files Server Operators - Read & execute- This folder, subfolder, and files Administrators - Special - This folder only
    (Special = Basic Permissions: all selected except Full control) CREATOR OWNER - Full control - Subfolders and files only
    Administrators - Full control - Subfolders and files only SYSTEM - Full control - This folder, subfolders, and files'
