rule:
  id: xccdf_mil.disa.stig_rule_SV-278033r1180805_rule
  title: Windows Server 2025 account lockout duration must be configured to 15 minutes or greater.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-278033
  description: <VulnDiscussion>When enabled, the account lockout feature prevents brute-force password attacks on the system.
    This parameter specifies the period of time that an account will remain locked after the specified number of failed logon
    attempts.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
  platforms: []
  effective_platform_refs:
  - cpe:/o:microsoft:windows_server_2025:-::~~~~x64~
  effective_platforms:
