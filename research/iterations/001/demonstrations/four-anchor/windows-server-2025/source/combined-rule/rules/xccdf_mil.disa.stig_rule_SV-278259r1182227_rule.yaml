    text: DPMS Target Microsoft Windows Server 2025 DISA DPMS Target Microsoft Windows Server 2025 5719
  idents:
  - system: http://cyber.mil/cci
    value: CCI-002235
  requires: []
  conflicts: []
  check: 'Verify the effective setting in Local Group Policy Editor. Run gpedit.msc. Navigate to Local Computer Policy >>
    Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment. If any accounts
    or groups other than the following are granted the "Perform volume maintenance tasks" user right, this is a finding: -
    Administrators. For server core installations, run the following command: Secedit /Export /Areas User_Rights /cfg c:\path\filename.txt
    Review the text file. If any SIDs other than the following are granted the "SeManageVolumePrivilege" user right, this
    is a finding: S-1-5-32-544 (Administrators)'
