assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-278118r1182067_rule
  version: 1
  description: Windows Server 2025 must disable Basic authentication for RSS feeds over HTTP.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:26701
    exports: []
    inline_content: 'The default behavior is for the Windows RSS platform to not use Basic authentication over HTTP connections.
      If the registry value name below does not exist, this is not a finding. If it exists and is configured with a value
      of "0", this is not a finding. If it exists and is configured with a value of "1", this is a finding. Registry Hive:
      HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Internet Explorer\Feeds\ Value Name: AllowBasicAuthInClear
      Value Type: REG_DWORD Value: 0x00000000 (0) (or if the Value Name does not exist)'
    multi_check: null
    negate: null
