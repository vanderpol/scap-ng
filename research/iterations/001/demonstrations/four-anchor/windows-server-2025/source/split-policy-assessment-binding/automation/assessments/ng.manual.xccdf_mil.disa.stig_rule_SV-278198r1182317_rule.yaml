assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-278198r1182317_rule
  version: 1
  description: The Windows Server 2025 built-in guest account must be renamed.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:42301
    exports: []
    inline_content: 'This applies to member servers and stand-alone or nondomain-joined systems; it is not applicable for
      domain controllers. Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer
      Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> Security Options. If
      the value for "Accounts: Rename guest account" is not set to a value other than "Guest", this is a finding. For server
      core installations, run the following command: Secedit /Export /Areas SecurityPolicy /CFG C:\Path\FileName.Txt If "NewGuestName"
      is not something other than "Guest" in the file, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
