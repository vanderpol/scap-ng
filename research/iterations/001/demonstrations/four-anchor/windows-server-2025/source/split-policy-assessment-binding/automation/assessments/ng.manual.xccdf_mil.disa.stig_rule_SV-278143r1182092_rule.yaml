assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-278143r1182092_rule
  version: 1
  description: Windows Server 2025 data files owned by users must be on a different logical partition from the directory server
    data files.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:31701
    exports: []
    inline_content: This applies to domain controllers. It is not applicable for other systems. Run "Regedit". Navigate to
      "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\NTDS\Parameters". Note the directory locations in the values for
      "DSA Database file". Open a command prompt. Enter "net share". Note the logical drive(s) or file system partition for
      any organization-created data shares. Ignore system shares (e.g., NETLOGON, SYSVOL, and administrative shares ending
      in $). User shares that are hidden (ending with $) must not be ignored. If user shares are located on the same logical
      partition as the directory server data files, this is a finding.
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
      children:
      - attributes:
          href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
          name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:31701
        name: check-content-ref
        namespace: http://checklists.nist.gov/xccdf/1.2
      - name: check-content
        namespace: http://checklists.nist.gov/xccdf/1.2
        text: 'This applies to domain controllers. It is not applicable for other systems.


          Run "Regedit".


          Navigate to "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\NTDS\Parameters".


          Note the directory locations in the values for "DSA Database file".


          Open a command prompt.


          Enter "net share".


          Note the logical drive(s) or file system partition for any organization-created data shares.


          Ignore system shares (e.g., NETLOGON, SYSVOL, and administrative shares ending in $). User shares that are hidden
          (ending with $) must not be ignored.


          If user shares are located on the same logical partition as the directory server data files, this is a finding.'
      name: check
      namespace: http://checklists.nist.gov/xccdf/1.2
    system: http://scap.nist.gov/schema/ocil/2
