  fix: The default behavior is for Windows to mark file attachments with their zone information. To correct this, configure
    the policy value for User Configuration >> Administrative Templates >> Windows Components >> Attachment Manager >> Do
    not preserve zone information in file attachments to "Not Configured" or "Disabled".
