  check: Determine whether any shared accounts exist. If no shared accounts exist, this is not applicable. Shared accounts,
    such as required by an application, may be approved by the organization. This must be documented with the information
    system security officer (ISSO). Documentation must include the reason for the account, who has access to the account,
    and how the risk of using the shared account is mitigated to include monitoring account activity. If unapproved shared
    accounts exist, this is a finding.
