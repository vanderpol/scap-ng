assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-278162r1211161_rule
  version: 1
  description: Windows Server 2025 Active Directory (AD) user accounts, including administrators, must be configured to require
    the use of a common access card (CAC), Personal Identity Verification (PIV)-compliant hardware token, or Alternate Logon
    Token (ALT) for user authentication.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:35501
    exports: []
    inline_content: 'This applies to domain controllers. It is not applicable for other systems. Open PowerShell. Enter the
      following: "Get-ADUser -Filter {(Enabled -eq $True) -and (SmartcardLogonRequired -eq $False)} | FT Name" ("DistinguishedName"
      may be substituted for "Name" for more detailed output.) If any user accounts, including administrators, are listed,
      this is a finding. Alternately: To view sample accounts in "Active Directory Users and Computers" (available from various
      menus or run "dsa.msc"): Select the Organizational Unit (OU) where the user accounts are located. (By default, this
      is the Users node; however, accounts may be under other organization-defined OUs.) Right-click the sample user account
      and select "Properties". Select the "Account" tab. If any user accounts, including administrators, do not have "Smart
      card is required for interactive logon" checked in the "Account Options" area, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
      children:
      - attributes:
          href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
          name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:35501
        name: check-content-ref
        namespace: http://checklists.nist.gov/xccdf/1.2
      - name: check-content
        namespace: http://checklists.nist.gov/xccdf/1.2
        text: 'This applies to domain controllers. It is not applicable for other systems.


          Open PowerShell.


          Enter the following:


          "Get-ADUser -Filter {(Enabled -eq $True) -and (SmartcardLogonRequired -eq $False)} | FT Name"

          ("DistinguishedName" may be substituted for "Name" for more detailed output.)


          If any user accounts, including administrators, are listed, this is a finding.


          Alternately:


          To view sample accounts in "Active Directory Users and Computers" (available from various menus or run "dsa.msc"):


          Select the Organizational Unit (OU) where the user accounts are located. (By default, this is the Users node; however,
          accounts may be under other organization-defined OUs.)


          Right-click the sample user account and select "Properties".


          Select the "Account" tab.


          If any user accounts, including administrators, do not have "Smart card is required for interactive logon" checked
          in the "Account Options" area, this is a finding.'
      name: check
      namespace: http://checklists.nist.gov/xccdf/1.2
    system: http://scap.nist.gov/schema/ocil/2
