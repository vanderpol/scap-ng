      name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:9101
    exports: []
    inline_content: 'Review the Windows time service configuration. Open an elevated command prompt (run as administrator).
      Enter "W32tm /query /configuration". Domain-joined systems (excluding the domain controller with the PDC emulator role):
      If the value for "Type" under "NTP Client" is not "NT5DS", this is a finding. Other systems: If systems are configured
      with a "Type" of "NTP", including stand-alone or nondomain-joined systems and the domain controller with the PDC Emulator
      role, and do not have a DoW time server defined for "NTPServer", this is a finding. To determine the domain controller
      with the PDC Emulator role: Open PowerShell. Enter "Get-ADDomain | FT PDCEmulator".'
    multi_check: null
    negate: null
    selector: manual
