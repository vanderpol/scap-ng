scap_ng: 0.1-prototype
prototype: true
rule:
  id: xccdf_mil.disa.stig_rule_SV-278135r1182075_rule
  title: Windows Server 2025 Kerberos user ticket lifetime must be limited to 10 hours or less.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-278135
  description: '<VulnDiscussion>In Kerberos, there are two types of tickets: Ticket Granting Tickets (TGTs) and Service Tickets.
    Kerberos tickets have a limited lifetime so the time an attacker has to implement an attack is limited. This policy controls
    how long TGTs can be renewed. With Kerberos, the user''s initial authentication to the domain controller results in a
    TGT, which is then used to request Service Tickets to resources. Upon startup, each computer gets a TGT before requesting
    a service ticket to the domain controller and any other computers it needs to access. For services that start up under
    a specified user account, users must always get a TGT first and then get Service Tickets to all computers and services
    accessed. Satisfies: SRG-OS-000112-GPOS-00057, SRG-OS-000113-GPOS-00058</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
  discussion: null
