assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-285314r1256731_rule
  version: 1
  description: Windows Server 2025 OpenSSH must display the Standard Mandatory DoW Notice and Consent Banner before granting
    remote access to the system via an OpenSSH logon.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:56301
    exports: []
    inline_content: 'If OpenSSH is not installed on the system, this requirement is not applicable. Verify any SSH connection
      to the system displays the Standard Mandatory DoW Notice and Consent Banner before granting access to the system. Check
      for the location of the banner file being used with the following command: C:\ > Get-Content "$env:ProgramData\ssh\sshd_config"
      | Select-String -Pattern ''^\s*Banner'' Banner C:\ProgramData\ssh\Banner.txt If "Banner" is set to "none", the line
      is commented out, or the line is missing, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
