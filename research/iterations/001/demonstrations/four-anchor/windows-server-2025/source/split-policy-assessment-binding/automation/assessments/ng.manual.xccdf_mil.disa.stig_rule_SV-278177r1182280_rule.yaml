      name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:38301
    exports: []
    inline_content: This applies to member servers and stand-alone or nondomain-joined systems. A separate version applies
      to domain controllers. Open "Computer Management". Navigate to "Groups" under "Local Users and Groups". Review the local
      "Administrators" group. Only administrator groups or accounts responsible for administration of the system may be members
      of the group. For domain-joined member servers, the Domain Admins group must be replaced by a domain member server administrator
      group. Standard user accounts must not be members of the local Administrator group. If accounts that do not have responsibility
      for administration of the system are members of the local Administrators group, this is a finding. If the built-in Administrator
      account or other required administrative accounts are found on the system, this is not a finding.
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
      children:
      - attributes:
          href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
          name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:38301
        name: check-content-ref
        namespace: http://checklists.nist.gov/xccdf/1.2
      - name: check-content
        namespace: http://checklists.nist.gov/xccdf/1.2
        text: 'This applies to member servers and stand-alone or nondomain-joined systems. A separate version applies to domain
          controllers.


          Open "Computer Management".


          Navigate to "Groups" under "Local Users and Groups".


          Review the local "Administrators" group.


          Only administrator groups or accounts responsible for administration of the system may be members of the group.


          For domain-joined member servers, the Domain Admins group must be replaced by a domain member server administrator
          group.


          Standard user accounts must not be members of the local Administrator group.


          If accounts that do not have responsibility for administration of the system are members of the local Administrators
          group, this is a finding.


          If the built-in Administrator account or other required administrative accounts are found on the system, this is
          not a finding.'
      name: check
      namespace: http://checklists.nist.gov/xccdf/1.2
    system: http://scap.nist.gov/schema/ocil/2
