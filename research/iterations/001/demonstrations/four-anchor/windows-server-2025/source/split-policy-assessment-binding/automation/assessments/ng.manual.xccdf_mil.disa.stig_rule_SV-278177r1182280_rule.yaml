  id: ng.manual.xccdf_mil.disa.stig_rule_SV-278177r1182280_rule
  version: 1
  description: Windows Server 2025 must only allow administrators responsible for the member server or stand-alone or nondomain-joined
    system to have Administrator rights on the system.
  method: manual_or_external_check
  source_checks:
