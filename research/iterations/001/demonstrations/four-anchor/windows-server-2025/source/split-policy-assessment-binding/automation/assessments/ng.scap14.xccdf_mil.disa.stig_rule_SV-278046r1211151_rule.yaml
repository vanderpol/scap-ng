          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "Protecting audit information also includes identifying and protecting the tools used to view and manipulate\
              \ log data. Therefore, protecting audit tools is necessary to prevent unauthorized operation on audit information.\n\
              \n  Operating systems providing tools to interface with audit information will leverage user permissions and\
              \ roles identifying the user accessing the tools and the corresponding rights the user enjoys to make access\
              \ decisions regarding the modification or deletion of audit tools.\n\n  Satisfies: SRG-OS-000257-GPOS-00098,\
              \ SRG-OS-000258-GPOS-00099"
