  description: Windows Server 2025 Active Directory (AD) AdminSDHolder object must be configured with proper audit settings.
  semantic_model: scap-ng-generic-assessment-graph-0.1
  collect:
    oval:navy.navwar.niwcatlantic.scc.windows:obj:27815201:
      capability: scapng.collect.independent.shellcommand
      source_object_id: oval:navy.navwar.niwcatlantic.scc.windows:obj:27815201
      source_type: shellcommand_object
      source_namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
      version: '1'
      comment: Query both Fail and Success auditing settings for AdminSDHolder
      query:
      - attributes:
          error_if_stderr_exists: 'true'
        kind: element
        name: behaviors
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
      - kind: element
        name: shell
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
        value: powershell
      - kind: element
        name: command
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
        value: '$p=''AD:\CN=AdminSDHolder,CN=System,''+(Get-ADDomain).DistinguishedName;$a=(Get-Acl $p -Audit).Audit;$f=[bool]($a|Where-Object{$_.IdentityReference
          -match ''Everyone|S-1-1-0'' -and $_.AuditFlags -eq ''Failure'' -and ($_.ActiveDirectoryRights -match ''GenericAll|FullControl|All'')
          -and $_.InheritanceType -eq ''None''});$s=[bool]($a|Where-Object{$_.IdentityReference -match ''Everyone|S-1-1-0''
          -and $_.AuditFlags -eq ''Success'' -and ($_.ActiveDirectoryRights -match ''ExtendedRight|WriteProperty'') -and $_.InheritanceType
          -eq ''None''});if(-not $f -or -not $s){$r=@();if(-not $f){$r+=''MISSING/INVALID: Everyone [Failure] GenericAll/FullControl
          (Must be This object only)''};if(-not $s){$r+=''MISSING/INVALID: Everyone [Success] ExtendedRight/WriteProperty
          (Must be This object only)''};''Target_Object={0} | IdentityReference=Everyone (S-1-1-0) | Status=FAIL | Details={1}''
          -f $p.Replace(''AD:\'',''''),($r -join '' / '')}else{''Target_Object={0} | IdentityReference=Everyone (S-1-1-0)
          | Status=PASS | Details=All mandatory Failure and Success audit policies are correctly configured per the STIG.''
          -f $p.Replace(''AD:\'','''')}'
      - kind: element
        name: pattern
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
        value: .+
