rule:
  id: xccdf_mil.disa.stig_rule_SV-278039r1180823_rule
  title: Windows Server 2025 must have the built-in Windows password complexity policy enabled.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-278039
  description: '<VulnDiscussion>The use of complex passwords increases their strength against attack. The built-in Windows
    password complexity policy requires passwords to contain at least three of the four types of characters (numbers, uppercase
    and lowercase letters, and special characters) and prevents the inclusion of user names or parts of user names. Satisfies:
    SRG-OS-000069-GPOS-00037, SRG-OS-000070-GPOS-00038, SRG-OS-000071-GPOS-00039, SRG-OS-000266-GPOS-00101</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
  discussion: null
  platforms: []
  effective_platform_refs:
  - cpe:/o:microsoft:windows_server_2025:-::~~~~x64~
  effective_platforms:
  - kind: cpe_name
    name: cpe:/o:microsoft:windows_server_2025:-::~~~~x64~
    ref: cpe:/o:microsoft:windows_server_2025:-::~~~~x64~
  references:
  - href: null
    text: DPMS Target Microsoft Windows Server 2025 DISA DPMS Target Microsoft Windows Server 2025 5719
  idents:
  - system: http://cyber.mil/cci
    value: CCI-004066
  requires: []
  conflicts: []
  check: 'Verify the effective setting in Local Group Policy Editor. Run gpedit.msc. Navigate to Local Computer Policy >>
    Computer Configuration >> Windows Settings >> Security Settings >> Account Policies >> Password Policy. If the value for
    "Password must meet complexity requirements" is not set to "Enabled", this is a finding. For server core installations,
    run the following command: Secedit /Export /Areas SecurityPolicy /CFG C:\Path\FileName.Txt If "PasswordComplexity" equals
    "0" in the file, this is a finding. Note: If an external password filter is in use that enforces all four character types
    and requires this setting to be set to "Disabled", this would not be considered a finding. If this setting does not affect
    the use of an external password filter, it must be enabled for fallback purposes.'
