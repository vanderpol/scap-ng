      name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:49301
    exports: []
    inline_content: 'UAC requirements are not applicable for Server Core installations (this is the default installation option
      for Windows Server 2025 versus Server with Desktop Experience). If the following registry value does not exist or is
      not configured as specified, this is a finding: Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\
      Value Name: ConsentPromptBehaviorAdmin Value Type: REG_DWORD Value: 0x00000002 (2) (Prompt for consent on the secure
      desktop) 0x00000001 (1) (Prompt for credentials on the secure desktop)'
    multi_check: null
    negate: null
