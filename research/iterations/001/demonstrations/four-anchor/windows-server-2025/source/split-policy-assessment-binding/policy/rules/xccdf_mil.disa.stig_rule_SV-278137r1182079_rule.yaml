  group_path:
  - xccdf_mil.disa.stig_group_V-278137
  description: '<VulnDiscussion>This setting determines the maximum time difference (in minutes) that Kerberos will tolerate
    between the time on a client''s clock and the time on a server''s clock while still considering the two clocks synchronous.
    To prevent replay attacks, Kerberos uses timestamps as part of its protocol definition. For timestamps to work properly,
    the clocks of the client and the server must be in sync as much as possible. Satisfies: SRG-OS-000112-GPOS-00057, SRG-OS-000113-GPOS-00058</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
