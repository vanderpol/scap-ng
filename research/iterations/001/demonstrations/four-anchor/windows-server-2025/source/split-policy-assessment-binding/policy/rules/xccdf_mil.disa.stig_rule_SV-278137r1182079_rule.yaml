rule:
  id: xccdf_mil.disa.stig_rule_SV-278137r1182079_rule
  title: Windows Server 2025 computer clock synchronization tolerance must be limited to five minutes or less.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
