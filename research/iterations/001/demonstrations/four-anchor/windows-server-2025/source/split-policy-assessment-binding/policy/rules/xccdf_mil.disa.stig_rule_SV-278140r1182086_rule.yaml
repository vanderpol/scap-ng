rule:
  id: xccdf_mil.disa.stig_rule_SV-278140r1182086_rule
  title: Windows Server 2025 Active Directory (AD) Group Policy Objects (GPOs) must have proper access control permissions.
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-278140
  description: <VulnDiscussion>When directory service database objects do not have appropriate access control permissions,
    it may be possible for malicious users to create, read, update, or delete the objects and degrade or destroy the integrity
    of the data. When the directory service is used for identification, authentication, or authorization functions, a compromise
    of the database objects could lead to a compromise of all systems relying on the directory service. For AD, the GPOs require
    special attention. In a distributed administration model (i.e., help desk), GPOs are more likely to have access permissions
    changed from the secure defaults. If inappropriate access permissions are defined for GPOs, this could allow an intruder
    to change the security policy applied to all domain client computers (workstations and servers).</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
  platforms:
  - '#xccdf_mil.disa.stig_platform_Windows_DomainController'
  effective_platform_refs:
  - '#xccdf_mil.disa.stig_platform_Windows_DomainController'
