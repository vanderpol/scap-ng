          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: Virtualization-based security (VBS) provides the platform for the additional security features Credential
              Guard and virtualization-based protection of code integrity. Secure Boot is the minimum security level, with
              DMA protection providing additional memory protection. DMA Protection requires a CPU that supports input/output
              memory management unit (IOMMU).
