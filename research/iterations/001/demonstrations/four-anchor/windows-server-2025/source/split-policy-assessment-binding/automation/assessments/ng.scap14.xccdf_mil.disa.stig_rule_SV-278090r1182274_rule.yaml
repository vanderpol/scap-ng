        name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:21101
      exports: []
      inline_content: 'For stand-alone or nondomain-joined systems, this is not applicable. Open PowerShell with elevated
        privileges (run as administrator). Enter the following: "Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard"
        If "RequiredSecurityProperties" does not include a value of "2" indicating "Secure Boot" (e.g., "{1, 2}"), this is
        a finding. If "Secure Boot and DMA Protection" is configured, "3" will also be displayed in the results (e.g., "{1,
        2, 3}"). If "VirtualizationBasedSecurityStatus" is not a value of "2" indicating "Running", this is a finding. Alternately:
        Run "System Information". Under "System Summary", verify the following: If "Device Guard Virtualization based security"
        does not display "Running", this is a finding. If "Device Guard Required Security Properties" does not display "Base
        Virtualization Support, Secure Boot", this is a finding. If "Secure Boot and DMA Protection" is configured, "DMA Protection"
        will also be displayed (e.g., "Base Virtualization Support, Secure Boot, DMA Protection"). The policy settings referenced
        in the Fix section will configure the following registry values; however, due to hardware requirements, the registry
        values alone do not ensure proper function. Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\
        Value Name: EnableVirtualizationBasedSecurity Value Type: REG_DWORD Value: 0x00000001 (1) Value Name: RequirePlatformSecurityFeatures
        Value Type: REG_DWORD Value: 0x00000001 (1) (Secure Boot only) or 0x00000003 (3) (Secure Boot and DMA Protection)
        A Microsoft TechNet article on Credential Guard, including system requirement details, can be found at the following
        link: https://technet.microsoft.com/itpro/windows/keep-secure/credential-guard'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:21101
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'For stand-alone or nondomain-joined systems, this is not applicable.


            Open PowerShell with elevated privileges (run as administrator).


            Enter the following:


            "Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard"


            If "RequiredSecurityProperties" does not include a value of "2" indicating "Secure Boot" (e.g., "{1, 2}"), this
            is a finding.


            If "Secure Boot and DMA Protection" is configured, "3" will also be displayed in the results (e.g., "{1, 2, 3}").


            If "VirtualizationBasedSecurityStatus" is not a value of "2" indicating "Running", this is a finding.


            Alternately:


            Run "System Information".


            Under "System Summary", verify the following:


            If "Device Guard Virtualization based security" does not display "Running", this is a finding.


            If "Device Guard Required Security Properties" does not display "Base Virtualization Support, Secure Boot", this
            is a finding.


            If "Secure Boot and DMA Protection" is configured, "DMA Protection" will also be displayed (e.g., "Base Virtualization
            Support, Secure Boot, DMA Protection").


            The policy settings referenced in the Fix section will configure the following registry values; however, due to
            hardware requirements, the registry values alone do not ensure proper function.


            Registry Hive: HKEY_LOCAL_MACHINE

            Registry Path: \SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\


            Value Name: EnableVirtualizationBasedSecurity

            Value Type: REG_DWORD

            Value: 0x00000001 (1)


            Value Name: RequirePlatformSecurityFeatures

            Value Type: REG_DWORD

            Value: 0x00000001 (1) (Secure Boot only) or 0x00000003 (3) (Secure Boot and DMA Protection)


            A Microsoft TechNet article on Credential Guard, including system requirement details, can be found at the following
            link:

            https://technet.microsoft.com/itpro/windows/keep-secure/credential-guard'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
