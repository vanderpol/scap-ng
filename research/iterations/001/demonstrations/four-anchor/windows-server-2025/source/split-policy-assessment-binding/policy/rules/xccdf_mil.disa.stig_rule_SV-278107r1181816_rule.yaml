  id: xccdf_mil.disa.stig_rule_SV-278107r1181816_rule
  title: Windows Server 2025 System event log size must be configured to 32768 KB or greater.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
