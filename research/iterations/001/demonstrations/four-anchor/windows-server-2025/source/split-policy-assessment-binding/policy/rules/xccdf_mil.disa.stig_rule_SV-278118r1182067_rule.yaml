  check: 'The default behavior is for the Windows RSS platform to not use Basic authentication over HTTP connections. If the
    registry value name below does not exist, this is not a finding. If it exists and is configured with a value of "0", this
    is not a finding. If it exists and is configured with a value of "1", this is a finding. Registry Hive: HKEY_LOCAL_MACHINE
    Registry Path: \SOFTWARE\Policies\Microsoft\Internet Explorer\Feeds\ Value Name: AllowBasicAuthInClear Value Type: REG_DWORD
    Value: 0x00000000 (0) (or if the Value Name does not exist)'
