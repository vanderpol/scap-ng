rule:
  id: xccdf_mil.disa.stig_rule_SV-278142r1182090_rule
  title: Windows Server 2025 organization created Active Directory Organizational Unit (OU) objects must have proper access
    control permissions.
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-278142
  description: <VulnDiscussion>When directory service database objects do not have appropriate access control permissions,
    it may be possible for malicious users to create, read, update, or delete the objects and degrade or destroy the integrity
    of the data. When the directory service is used for identification, authentication, or authorization functions, a compromise
    of the database objects could lead to a compromise of all systems that rely on the directory service. For Active Directory,
    the OU objects require special attention. In a distributed administration model (i.e., help desk), OU objects are more
    likely to have access permissions changed from the secure defaults. If inappropriate access permissions are defined for
    OU objects, it could allow an intruder to add or delete users in the OU. This could result in unauthorized access to data
    or a denial of service (DoS) to authorized users.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
  platforms:
  - '#xccdf_mil.disa.stig_platform_Windows_DomainController'
  effective_platform_refs:
