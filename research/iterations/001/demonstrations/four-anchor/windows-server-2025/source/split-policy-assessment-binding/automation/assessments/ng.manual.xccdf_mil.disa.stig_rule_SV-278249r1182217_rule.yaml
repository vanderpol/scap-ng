assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-278249r1182217_rule
  version: 1
  description: The Windows Server 2025 "Create symbolic links" user right must only be assigned to the Administrators group.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:52301
    exports: []
    inline_content: 'Verify the effective setting in Local Group Policy Editor. Run gpedit.msc. Navigate to Local Computer
      Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment.
      If any accounts or groups other than the following are granted the "Create symbolic links" user right, this is a finding:
      - Administrators. For server core installations, run the following command: Secedit /Export /Areas User_Rights /cfg
      c:\path\filename.txt Review the text file. If any SIDs other than the following are granted the "SeCreateSymbolicLinkPrivilege"
      user right, this is a finding: S-1-5-32-544 (Administrators) Systems that have the Hyper-V role will also have "Virtual
      Machines" given this user right (this may be displayed as "NT Virtual Machine\Virtual Machines", SID S-1-5-83-0). This
      is not a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
