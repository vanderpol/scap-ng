  id: ng.manual.xccdf_mil.disa.stig_rule_SV-278173r1182146_rule
  version: 1
  description: Windows Server 2025 must be configured for name-based strong mappings for certificates.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:37501
    exports: []
    inline_content: This applies to domain controllers. This is not applicable for member servers. Verify the effective setting
      in Local Group Policy Editor. Run gpedit.msc. Navigate to Local Computer Policy >> Computer Configuration >> Administrative
      Template >> System >> KDC >> Allow name-based strong mappings for certificates. If "Allow name-based strong mappings
      for certificates" is not "Enabled", this is a finding.
