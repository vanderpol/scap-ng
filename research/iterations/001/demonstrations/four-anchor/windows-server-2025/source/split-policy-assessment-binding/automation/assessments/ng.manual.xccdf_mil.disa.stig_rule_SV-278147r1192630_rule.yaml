        namespace: http://checklists.nist.gov/xccdf/1.2
        text: "This applies to domain controllers. It is not applicable for other systems.\n\nOpen an elevated command prompt\
          \ (run as administrator).\n\nEnter \"ntdsutil\".\n\nAt the \"ntdsutil:\" prompt, enter \"LDAP policies\".\n\nAt\
          \ the \"ldap policy:\" prompt, enter \"connections\".\n\nAt the \"server connections:\" prompt, enter \"connect\
          \ to server [host-name]\"\n(where [host-name] is the computer name of the domain controller).\n\nAt the \"server\
          \ connections:\" prompt, enter \"q\".\n\nAt the \"ldap policy:\" prompt, enter \"show values\". \n\nIf the value\
          \ for MaxConnIdleTime is greater than \"300\" (5 minutes) or is not specified, this is a finding.\n\nEnter \"q\"\
          \ at the \"ldap policy:\" and \"ntdsutil:\" prompts to exit.\n\nAlternately, Dsquery can be used to display MaxConnIdleTime:\n\
          \nOpen \"command prompt (Admin)\".\n\nEnter the following command (on a single line).\n\ndsquery * \"cn=Default\
          \ Query Policy,cn=Query-Policies,cn=Directory Service, cn=Windows NT,cn=Services,cn=Configuration,dc=[forest-name]\"\
          \ -attr LDAPAdminLimits \n\nThe quotes are required and dc=[forest-name] is the fully qualified LDAP name of the\
          \ domain being reviewed (e.g., dc=disaost,dc=mil).\n\nIf the results do not specify a \"MaxConnIdleTime\" or it\
          \ has a value greater than \"300\" (5 minutes), this is a finding."
      name: check
