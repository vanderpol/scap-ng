rule:
  id: xccdf_mil.disa.stig_rule_SV-278132r1181102_rule
  title: Windows Server 2025 must only allow administrators responsible for the domain controller to have Administrator rights
    on the system.
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
