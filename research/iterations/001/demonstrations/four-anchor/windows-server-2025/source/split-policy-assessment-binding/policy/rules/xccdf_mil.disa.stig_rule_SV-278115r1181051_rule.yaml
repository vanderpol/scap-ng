rule:
  id: xccdf_mil.disa.stig_rule_SV-278115r1181051_rule
  title: Windows Server 2025 Remote Desktop Services must require secure Remote Procedure Call (RPC) communications.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-278115
  description: '<VulnDiscussion>Allowing unsecure RPC communication exposes the system to man-in-the-middle attacks and data
    disclosure attacks. A man-in-the-middle attack occurs when an intruder captures packets between a client and server and
    modifies them before allowing the packets to be exchanged. Usually, the attacker will modify the information in the packets
    in an attempt to cause either the client or server to reveal sensitive information. Satisfies: SRG-OS-000033-GPOS-00014,
    SRG-OS-000250-GPOS-00093</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
