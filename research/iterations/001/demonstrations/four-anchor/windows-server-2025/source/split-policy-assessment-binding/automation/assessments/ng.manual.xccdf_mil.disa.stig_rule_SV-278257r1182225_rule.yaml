assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-278257r1182225_rule
  version: 1
  description: The Windows Server 2025 "Manage auditing and security log" user right must only be assigned to the Administrators
    group.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:53901
    exports: []
    inline_content: 'Verify the effective setting in Local Group Policy Editor. Run gpedit.msc. Navigate to Local Computer
      Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment.
      If any accounts or groups other than the following are granted the "Manage auditing and security log" user right, this
      is a finding: - Administrators. For server core installations, run the following command: Secedit /Export /Areas User_Rights
      /cfg c:\path\filename.txt Review the text file. If any SIDs other than the following are granted the "SeSecurityPrivilege"
      user right, this is a finding: S-1-5-32-544 (Administrators) If the organization has an Auditors group, the assignment
      of this group the assignment of this group to the user right is not a finding. If an application requires this user
      right, this is not a finding. Vendor documentation must support the requirement for having the user right. The requirement
      must be documented with the information system security officer (ISSO). The application account must meet requirements
      for application account passwords, such as length (WN25-00-000050) and required frequency of changes (WN25-00-000060).'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
      children:
      - attributes:
          href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
