assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-278063r1180895_rule
  version: 1
  description: Windows Server 2025 must be configured to audit Object Access - Other Object Access Events failures.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:15901
    exports: []
    inline_content: 'Security Option "Audit: Force audit policy subcategory settings (Windows 7 or later) to override audit
      policy category settings" must be set to "Enabled" (WN25-SO-000050) for the detailed auditing subcategories to be effective.
      Use the "AuditPol" tool to review the current Audit Policy configuration. Open PowerShell or a command prompt with elevated
      privileges ("Run as administrator"). Enter "AuditPol /get /category:*" Compare the "AuditPol" settings with the following.
      If the system does not audit the following, this is a finding: Object Access >> Other Object Access Events - Failure'
    multi_check: null
    negate: null
    selector: manual
