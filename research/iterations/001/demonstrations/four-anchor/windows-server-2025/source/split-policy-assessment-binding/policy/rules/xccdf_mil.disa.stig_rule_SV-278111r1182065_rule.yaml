  requires: []
  conflicts: []
  check: 'The default behavior is for shell protected mode to be turned on for File Explorer. If the registry value name below
    does not exist, this is not a finding. If it exists and is configured with a value of "0", this is not a finding. If it
    exists and is configured with a value of "1", this is a finding. Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\
    Value Name: PreXPSP2ShellProtocolBehavior Value Type: REG_DWORD Value: 0x00000000 (0) (or if the Value Name does not exist)'
