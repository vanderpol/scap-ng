  id: xccdf_mil.disa.stig_rule_SV-278111r1182065_rule
  title: Windows Server 2025 File Explorer shell protocol must run in protected mode.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
