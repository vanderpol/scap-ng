      exports: []
      inline_content: 'Security Option "Audit: Force audit policy subcategory settings (Windows 7 or later) to override audit
        policy category settings" must be set to "Enabled" (WN25-SO-000050) for the detailed auditing subcategories to be
        effective. Use the "AuditPol" tool to review the current Audit Policy configuration. Open PowerShell or a command
        prompt with elevated privileges ("Run as administrator"). Enter "AuditPol /get /category:*" Compare the "AuditPol"
        settings with the following. If the system does not audit the following, this is a finding: Account Management >>
        Other Account Management Events - Success'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:13101
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Security Option \"Audit: Force audit policy subcategory settings (Windows 7 or later) to override audit policy\
            \ category settings\" must be set to \"Enabled\" (WN25-SO-000050) for the detailed auditing subcategories to be\
            \ effective. \n\nUse the \"AuditPol\" tool to review the current Audit Policy configuration.\n\nOpen PowerShell\
            \ or a command prompt with elevated privileges (\"Run as administrator\").\n\nEnter \"AuditPol /get /category:*\"\
            \n\nCompare the \"AuditPol\" settings with the following.\n\nIf the system does not audit the following, this\
            \ is a finding:\n\nAccount Management >> Other Account Management Events - Success"
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
