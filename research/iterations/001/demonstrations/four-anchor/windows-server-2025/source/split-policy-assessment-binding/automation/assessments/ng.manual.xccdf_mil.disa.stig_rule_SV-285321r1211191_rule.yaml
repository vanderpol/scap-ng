  id: ng.manual.xccdf_mil.disa.stig_rule_SV-285321r1211191_rule
  version: 1
  description: Windows Server 2025 OpenSSH private host key files must conform to minimum requirements.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:57701
    exports: []
    inline_content: 'If OpenSSH is not installed on the system, this requirement is not applicable. Verify the SSH private
      host key files permissions with the following command: C:\ > Get-ChildItem -Path "C:\ProgramData\ssh" -Filter "*_key"
      -File | ForEach-Object { icacls.exe $_.FullName } C:\ProgramData\ssh\ssh_host_ecdsa_key BUILTIN\Administrators:(F) NT
      AUTHORITY\SYSTEM:(F) Successfully processed 1 files; Failed processing 0 files C:\ProgramData\ssh\ssh_host_ed25519_key
      BUILTIN\Administrators:(F) NT AUTHORITY\SYSTEM:(F) Successfully processed 1 files; Failed processing 0 files C:\ProgramData\ssh\ssh_host_rsa_key
      BUILTIN\Administrators:(F) NT AUTHORITY\SYSTEM:(F) Successfully processed 1 files; Failed processing 0 files If any
      private host key file does not have the default permission as in the example output, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
