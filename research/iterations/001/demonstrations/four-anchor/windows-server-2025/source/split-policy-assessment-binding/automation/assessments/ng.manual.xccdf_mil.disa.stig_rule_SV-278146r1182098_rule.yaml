assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-278146r1182098_rule
  version: 1
  description: Windows Server 2025 directory data (outside the root DSE) of a nonpublic directory must be configured to prevent
    anonymous access.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:32301
    exports: []
    inline_content: 'This applies to domain controllers. It is not applicable for other systems. Open command prompt (not
      elevated). Run "ldp.exe". From the "Connection menu", select "Bind". Clear the User, Password, and Domain fields. Select
      "Simple bind" for the Bind type, and then click "OK". Confirmation of anonymous access will be displayed at the end:
      res = ldap_simple_bind_s Authenticated as: ''NT AUTHORITY\ANONYMOUS LOGON'' From the "Browse" menu, select "Search".
      In the Search dialog, enter the DN of the domain naming context (e.g., "dc=disaost,dc=mil") in the Base DN field. Clear
      the Attributes field and select "Run". Error messages must display related to Bind and user not authenticated. If attribute
      data is displayed, anonymous access is enabled to the domain naming context and this is a finding. The following network
      controls allow the finding severity to be downgraded to a CAT II since these measures lower the risk associated with
      anonymous access. Network hardware ports at the site are subject to 802.1x authentication or MAC address restrictions.
      Premise firewall or host restrictions prevent access to ports 389, 636, 3268, and 3269 from client hosts not explicitly
      identified by domain (.mil) or IP address.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
      children:
      - attributes:
          href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
          name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:32301
        name: check-content-ref
        namespace: http://checklists.nist.gov/xccdf/1.2
      - name: check-content
        namespace: http://checklists.nist.gov/xccdf/1.2
        text: "This applies to domain controllers. It is not applicable for other systems.\n\nOpen command prompt (not elevated).\n\
          \nRun \"ldp.exe\".\n\nFrom the \"Connection menu\", select \"Bind\".\n\nClear the User, Password, and Domain fields.\n\
          \nSelect \"Simple bind\" for the Bind type, and then click \"OK\".\n\nConfirmation of anonymous access will be displayed\
          \ at the end:\n\nres = ldap_simple_bind_s\nAuthenticated as: 'NT AUTHORITY\\ANONYMOUS LOGON'\n\nFrom the \"Browse\"\
          \ menu, select \"Search\".\n\nIn the Search dialog, enter the DN of the domain naming context (e.g., \"dc=disaost,dc=mil\"\
          ) in the Base DN field.\n\nClear the Attributes field and select \"Run\".\n\nError messages must display related\
          \ to Bind and user not authenticated.\n\nIf attribute data is displayed, anonymous access is enabled to the domain\
          \ naming context and this is a finding.\n\nThe following network controls allow the finding severity to be downgraded\
          \ to a CAT II since these measures lower the risk associated with anonymous access.\n\nNetwork hardware ports at\
          \ the site are subject to 802.1x authentication or MAC address restrictions. \n\nPremise firewall or host restrictions\
          \ prevent access to ports 389, 636, 3268, and 3269 from client hosts not explicitly identified by domain (.mil)\
          \ or IP address."
      name: check
      namespace: http://checklists.nist.gov/xccdf/1.2
    system: http://scap.nist.gov/schema/ocil/2
