  check: 'Verify the effective setting in Local Group Policy Editor. Run gpedit.msc. Navigate to Local Computer Policy >>
    Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment. If any accounts
    or groups other than the following are granted the "Manage auditing and security log" user right, this is a finding: -
    Administrators. For server core installations, run the following command: Secedit /Export /Areas User_Rights /cfg c:\path\filename.txt
    Review the text file. If any SIDs other than the following are granted the "SeSecurityPrivilege" user right, this is a
    finding: S-1-5-32-544 (Administrators) If the organization has an Auditors group, the assignment of this group the assignment
    of this group to the user right is not a finding. If an application requires this user right, this is not a finding. Vendor
    documentation must support the requirement for having the user right. The requirement must be documented with the information
    system security officer (ISSO). The application account must meet requirements for application account passwords, such
    as length (WN25-00-000050) and required frequency of changes (WN25-00-000060).'
