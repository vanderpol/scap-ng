rule:
  id: xccdf_mil.disa.stig_rule_SV-278257r1182225_rule
  title: The Windows Server 2025 "Manage auditing and security log" user right must only be assigned to the Administrators
    group.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
