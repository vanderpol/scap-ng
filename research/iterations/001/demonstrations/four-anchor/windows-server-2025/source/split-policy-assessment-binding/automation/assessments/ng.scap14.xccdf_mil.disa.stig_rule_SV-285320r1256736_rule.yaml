      inline_content: 'If OpenSSH is not installed on the system, this requirement is not applicable. Verify the permissions
        of the "$env:ProgramData/ssh/sshd_config" file with the following command: C:\ > icacls $env:ProgramData/ssh/sshd_config
        C:\ProgramData\ssh\sshd_config NT AUTHORITY\SYSTEM:(F) BUILTIN\Administrators:(F) NT AUTHORITY\Authenticated Users:(RX)
