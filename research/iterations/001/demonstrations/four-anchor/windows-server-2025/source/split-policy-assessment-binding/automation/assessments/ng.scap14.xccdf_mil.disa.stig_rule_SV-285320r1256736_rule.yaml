          text: "If OpenSSH is not installed on the system, this requirement is not applicable.\n\nVerify the permissions\
            \ of the \"$env:ProgramData/ssh/sshd_config\" file with the following command:\n\nC:\\ > icacls $env:ProgramData/ssh/sshd_config\n\
