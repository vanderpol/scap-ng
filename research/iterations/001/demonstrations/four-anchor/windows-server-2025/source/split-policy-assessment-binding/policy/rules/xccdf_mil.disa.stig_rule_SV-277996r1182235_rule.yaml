  description: <VulnDiscussion>A properly configured host-based intrusion detection system (HIDS) or host-based intrusion
    prevention system (HIPS) provides another level of defense against unauthorized access to critical servers. With proper
    configuration and logging enabled, such a system can stop and/or alert for many attempts to gain unauthorized access to
    resources.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
