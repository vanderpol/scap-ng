  check: Determine whether there is a host based intrusion detection and prevention service on each server. This requirement
    is not applicable on a system that has the role as the IDPS. However, this exception must be documented with the information
    system security officer (ISSO). If a host-based IDPS is not installed on the system, this is a finding.
