rule:
  id: xccdf_mil.disa.stig_rule_SV-278162r1211161_rule
  title: Windows Server 2025 Active Directory (AD) user accounts, including administrators, must be configured to require
    the use of a common access card (CAC), Personal Identity Verification (PIV)-compliant hardware token, or Alternate Logon
    Token (ALT) for user authentication.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
