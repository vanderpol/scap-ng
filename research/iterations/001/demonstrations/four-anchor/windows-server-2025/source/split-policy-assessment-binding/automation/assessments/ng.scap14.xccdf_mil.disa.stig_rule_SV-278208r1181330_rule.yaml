      exports: []
      inline_content: 'If the following registry value does not exist or is not configured as specified, this is a finding:
        Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\ Value
        Name: LegalNoticeCaption Value Type: REG_SZ Value: See message title options below "DOD Notice and Consent Banner",
        "US Department of Defense Warning Statement", or an organization-defined equivalent. If an organization-defined title
        is used, it can in no case contravene or modify the language of the banner text required in WN25-SO-000150. Automated
        tools may only search for the titles defined above. If an organization-defined title is used, a manual review will
        be required.'
