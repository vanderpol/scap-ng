rule:
  id: xccdf_mil.disa.stig_rule_SV-285314r1256731_rule
  title: Windows Server 2025 OpenSSH must display the Standard Mandatory DoW Notice and Consent Banner before granting remote
    access to the system via an OpenSSH logon.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
