    value: CCI-000366
  requires: []
  conflicts: []
  check: 'If the following registry value does not exist or is not configured as specified, this is a finding: Registry Hive:
    HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\ Value Name: scremoveoption Value
    Type: REG_SZ Value: 1 (Lock Workstation) or 2 (Force Logoff) If configuring this on servers causes issues, such as terminating
    users'' remote sessions, and the organization has a policy in place that any other sessions on the servers, such as administrative
    console logons, are manually locked or logged off when unattended or not in use, this would be acceptable. This must be
    documented with the information system security officer (ISSO).'
