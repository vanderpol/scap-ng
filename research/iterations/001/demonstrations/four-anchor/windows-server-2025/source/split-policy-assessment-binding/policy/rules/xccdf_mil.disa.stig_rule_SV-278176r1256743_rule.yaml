  fix: 'Reset the password for the krbtgt account at least every 180 days. The password must be changed twice to effectively
    remove the password history. Changing once, waiting for replication to complete, and changing again reduces the risk of
    issues. Changing twice in rapid succession forces clients to reauthenticate (including application services) but is desired
    if a compromise is suspected. PowerShell scripts are available to accomplish this such as at the following link: https://gallery.technet.microsoft.com/Reset-the-krbtgt-account-581a9e51
    Open "Active Directory Users and Computers" (available from various menus or run "dsa.msc"). Select "Advanced Features"
    in the "View" menu if not previously selected. Select the "Users" node. Right-click on the krbtgt account and select "Reset
    password". Enter a password that meets password complexity requirements. Clear the "User must change password at next
    logon" check box. The system will automatically change this to a system-generated complex password.'
