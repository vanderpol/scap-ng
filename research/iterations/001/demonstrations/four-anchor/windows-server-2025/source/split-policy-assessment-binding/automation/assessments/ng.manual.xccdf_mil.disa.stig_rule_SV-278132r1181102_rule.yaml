      name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:29501
    exports: []
    inline_content: This applies to domain controllers. A separate version applies to other systems. Review the Administrators
      group. Only the appropriate administrator groups or accounts responsible for administration of the system may be members
      of the group. Standard user accounts must not be members of the local administrator group. If prohibited accounts are
      members of the local administrators group, this is a finding. If the built-in Administrator account or other required
      administrative accounts are found on the system, this is not a finding.
    multi_check: null
    negate: null
