        name: check-content-ref
        namespace: http://checklists.nist.gov/xccdf/1.2
      - name: check-content
        namespace: http://checklists.nist.gov/xccdf/1.2
        text: 'This applies to domain controllers. A separate version applies to other systems.


          Review the Administrators group. Only the appropriate administrator groups or accounts responsible for administration
          of the system may be members of the group.


          Standard user accounts must not be members of the local administrator group.


          If prohibited accounts are members of the local administrators group, this is a finding.


          If the built-in Administrator account or other required administrative accounts are found on the system, this is
          not a finding.'
      name: check
      namespace: http://checklists.nist.gov/xccdf/1.2
    system: http://scap.nist.gov/schema/ocil/2
