assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-285323r1211197_rule
  version: 1
  description: Windows Server 2025 OpenSSH must not allow GSSAPI authentication.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:58101
    exports: []
    inline_content: 'If OpenSSH is not installed on the system, this requirement is not applicable. Verify the system does
      not allow GSSAPI authentication with the following command: C:\ > Get-Content "$env:ProgramData\ssh\sshd_config" | Select-String
      -Pattern ''^\s*GSSAPIAuthentication'' GSSAPIAuthentication no If the value is returned as "yes", the returned line is
      commented out, or no output is returned, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
