  description: <VulnDiscussion>The lack of password protection enables anyone to gain access to the information system, which
    opens a backdoor opportunity for intruders to compromise the system as well as other resources. Accounts on a system must
    require passwords.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
