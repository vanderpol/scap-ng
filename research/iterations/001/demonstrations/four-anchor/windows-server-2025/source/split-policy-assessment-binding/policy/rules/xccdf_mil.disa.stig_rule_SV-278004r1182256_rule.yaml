rule:
  id: xccdf_mil.disa.stig_rule_SV-278004r1182256_rule
  title: Windows Server 2025 accounts must require passwords.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
