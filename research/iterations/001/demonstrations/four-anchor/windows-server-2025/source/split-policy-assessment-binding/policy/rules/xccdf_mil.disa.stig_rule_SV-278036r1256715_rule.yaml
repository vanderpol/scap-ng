  - href: null
    text: DPMS Target Microsoft Windows Server 2025 DISA DPMS Target Microsoft Windows Server 2025 5719
  idents:
  - system: http://cyber.mil/cci
    value: CCI-004061
  requires: []
  conflicts: []
  check: 'Verify the effective setting in Local Group Policy Editor. Run gpedit.msc. Navigate to Local Computer Policy >>
    Computer Configuration >> Windows Settings >> Security Settings >> Account Policies >> Password Policy. If the value for
    "Enforce password history" is less than "24" passwords remembered, this is a finding. For server core installations, run
    the following command: Secedit /Export /Areas SecurityPolicy /CFG C:\Path\FileName.Txt If "PasswordHistorySize" is less
    than "24" in the file, this is a finding.'
