rule:
  id: xccdf_mil.disa.stig_rule_SV-278036r1256715_rule
  title: Windows Server 2025 password history must be configured to 24 passwords remembered.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-278036
  description: <VulnDiscussion>A system is more vulnerable to unauthorized access when system users recycle the same password
    several times without being required to change to a unique password on a regularly scheduled basis. This enables users
    to effectively negate the purpose of mandating periodic password changes. The default value is "24" for Windows domain
    systems. DoW has decided this is the appropriate value for all Windows systems.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
  platforms: []
  effective_platform_refs:
