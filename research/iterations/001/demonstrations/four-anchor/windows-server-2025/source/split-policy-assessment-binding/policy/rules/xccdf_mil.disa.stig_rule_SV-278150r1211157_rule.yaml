      name: fixtext
      namespace: http://checklists.nist.gov/xccdf/1.2
      text: 'Open "Active Directory Users and Computers" (available from various menus or run "dsa.msc").


        Select "Advanced Features" in the "View" menu.


        Select the domain being reviewed in the left pane.


        Right-click the "Infrastructure" object in the right pane and select "Properties".


        Select the "Security" tab.


        Select "Advanced", and then select the "Auditing" tab.


        Configure the audit settings for the Infrastructure object to include the following:


        Type - Fail

        Principal - Everyone

        Access - Full Control

        Inherited from - None


        The success types listed below are defaults. Where Special is listed in the summary screens for Access, detailed Permissions
        are provided for reference. Various Properties selections may also exist by default.


        Type - Success

        Principal - Everyone

        Access - Special

        Inherited from - None

        (Access - Special = Permissions: Write all properties, All extended rights, Change infrastructure master)


        Two instances with the following summary information will be listed:


        Type - Success

        Principal - Everyone

        Access - (blank)

        Inherited from - (CN of domain)


        Note: If only one success instance is listed (matching the values above), enter a second (identical) audit entry for
        the object.'
