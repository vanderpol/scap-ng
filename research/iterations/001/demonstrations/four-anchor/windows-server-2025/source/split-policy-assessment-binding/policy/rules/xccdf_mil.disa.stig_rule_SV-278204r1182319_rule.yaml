rule:
  id: xccdf_mil.disa.stig_rule_SV-278204r1182319_rule
  title: Windows Server 2025 maximum age for machine account passwords must be configured to 30 days or less.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
