  description: <VulnDiscussion>Computer account passwords are changed automatically on a regular basis. This setting controls
    the maximum password age that a machine account may have. This must be set to no more than 30 days, ensuring the machine
    changes its password monthly.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
