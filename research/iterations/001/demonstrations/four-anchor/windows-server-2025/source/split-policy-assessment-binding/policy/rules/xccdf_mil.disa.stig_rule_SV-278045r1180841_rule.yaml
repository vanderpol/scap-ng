rule:
  id: xccdf_mil.disa.stig_rule_SV-278045r1180841_rule
  title: Windows Server 2025 permissions for the System event log must prevent access by nonprivileged accounts.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
