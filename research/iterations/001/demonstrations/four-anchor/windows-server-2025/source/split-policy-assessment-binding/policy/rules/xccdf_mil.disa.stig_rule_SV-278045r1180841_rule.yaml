  - system: http://cyber.mil/cci
    value: CCI-000164
  requires: []
  conflicts: []
  check: 'Navigate to the System event log file. The default location is the "%SystemRoot%\System32\winevt\Logs" folder. However,
    the logs may have been moved to another folder. If the permissions for the "System.evtx" file are not as restrictive as
    the default permissions listed below, this is a finding: Eventlog - Full Control SYSTEM - Full Control Administrators
    - Full Control'
