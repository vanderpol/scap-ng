rule:
  id: xccdf_mil.disa.stig_rule_SV-278167r1182140_rule
  title: The Windows Server 2025 "Allow log on through Remote Desktop Services" user right must only be assigned to the Administrators
    group on domain controllers.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
