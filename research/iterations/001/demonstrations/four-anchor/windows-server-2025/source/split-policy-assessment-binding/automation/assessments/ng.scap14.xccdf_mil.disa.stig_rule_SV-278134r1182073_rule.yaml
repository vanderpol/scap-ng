          text: "This applies to domain controllers. It is not applicable for other systems.\n\nVerify the following is configured\
            \ in the Default Domain Policy:\n\nOpen \"Group Policy Management\".\n\nNavigate to \"Group Policy Objects\" in\
            \ the Domain being reviewed (Forest >> Domains >> Domain). \n\nRight-click the \"Default Domain Policy\".\n\n\
