      exports: []
      inline_content: 'This applies to domain controllers. It is not applicable for other systems. Verify the following is
        configured in the Default Domain Policy: Open "Group Policy Management". Navigate to "Group Policy Objects" in the
        Domain being reviewed (Forest >> Domains >> Domain). Right-click the "Default Domain Policy". Select "Edit". Navigate
        to Computer Configuration >> Policies >> Windows Settings >> Security Settings >> Account Policies >> Kerberos Policy.
        If the value for "Maximum lifetime for service ticket" is "0" or greater than "600" minutes, this is a finding.'
      multi_check: null
      negate: null
