  id: ng.scap14.xccdf_mil.disa.stig_rule_SV-278151r1182108_rule
  version: 1
  description: Windows Server 2025 Active Directory (AD) Domain Controllers Organizational Unit (OU) object must be configured
    with proper audit settings.
  semantic_model: scap-ng-generic-assessment-graph-0.1
  collect:
    oval:navy.navwar.niwcatlantic.scc.windows:obj:27815101:
      capability: scapng.collect.independent.shellcommand
      source_object_id: oval:navy.navwar.niwcatlantic.scc.windows:obj:27815101
      source_type: shellcommand_object
      source_namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
      version: '1'
      comment: Query both Fail and Success auditing settings for Domain Controllers Organizational Unit (OU)
      query:
      - attributes:
          error_if_stderr_exists: 'true'
        kind: element
        name: behaviors
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
      - kind: element
        name: shell
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
        value: powershell
      - kind: element
        name: command
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
        value: '$domain = Get-ADDomain; $path = ''AD:\'' + $domain.DomainControllersContainer; $aud = (Get-Acl $path -Audit).Audit;
          $hasFail = [bool]($aud | Where-Object {$_.IdentityReference -match ''Everyone|S-1-1-0'' -and $_.AuditFlags -eq ''Failure''
          -and ($_.ActiveDirectoryRights -match ''GenericAll|FullControl|All'') -and $_.InheritanceType -eq ''All'' -and $_.IsInherited
          -eq $false}); $hasSuccSelf = [bool]($aud | Where-Object {$_.IdentityReference -match ''Everyone|S-1-1-0'' -and $_.AuditFlags
          -eq ''Success'' -and $_.InheritanceType -eq ''None'' -and $_.IsInherited -eq $false}); $hasSuccDesc = [bool]($aud
          | Where-Object {$_.IdentityReference -match ''Everyone|S-1-1-0'' -and $_.AuditFlags -eq ''Success'' -and ($_.ActiveDirectoryRights
          -match ''WriteProperty|WriteAllProperties'') -and $_.InheritanceType -eq ''All'' -and $_.IsInherited -eq $false});
          . { $t = $path.Replace(''AD:\'',''''); if (-not $hasFail -or -not $hasSuccSelf -or -not $hasSuccDesc) { $reasons
          = @(); if (-not $hasFail) { $reasons += ''MISSING: Explicit Everyone : Failure : FullControl [Applies to: All Descendant
          Objects]'' }; if (-not $hasSuccSelf) { $reasons += ''MISSING: Explicit Everyone : Success : Special [Applies to:
          This Object Only]'' }; if (-not $hasSuccDesc) { $reasons += ''MISSING: Explicit Everyone : Success : Write all properties
          [Applies to: All Descendant Objects]'' }; ''Target_Object='' + $t + '' | IdentityReference=Everyone (S-1-1-0) |
          Status=FAIL | Details='' + ($reasons -join '' ; '') } else { ''Target_Object='' + $t + '' | IdentityReference=Everyone
          (S-1-1-0) | Status=PASS | Details=All mandatory Failure and Success audit entries and scopes are correctly configured
          per SV-254404r958732.'' } }'
      - kind: element
        name: pattern
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
        value: .+
