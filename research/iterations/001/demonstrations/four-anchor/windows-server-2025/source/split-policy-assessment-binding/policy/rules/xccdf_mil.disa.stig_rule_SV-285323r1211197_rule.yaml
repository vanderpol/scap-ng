  check: 'If OpenSSH is not installed on the system, this requirement is not applicable. Verify the system does not allow
    GSSAPI authentication with the following command: C:\ > Get-Content "$env:ProgramData\ssh\sshd_config" | Select-String
    -Pattern ''^\s*GSSAPIAuthentication'' GSSAPIAuthentication no If the value is returned as "yes", the returned line is
    commented out, or no output is returned, this is a finding.'
