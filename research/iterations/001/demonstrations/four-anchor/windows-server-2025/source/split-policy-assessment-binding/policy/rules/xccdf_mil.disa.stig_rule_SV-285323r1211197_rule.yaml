  group_path:
  - xccdf_mil.disa.stig_group_V-285323
  description: '<VulnDiscussion>Generic Security Service Application Program Interface (GSSAPI) authentication is used to
    provide additional authentication mechanisms to applications. Allowing GSSAPI authentication through SSH exposes the system''s
    GSSAPI to remote hosts, increasing the attack surface of the system. Satisfies: SRG-OS-000364-GPOS-00151, SRG-OS-000480-GPOS-00228</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
