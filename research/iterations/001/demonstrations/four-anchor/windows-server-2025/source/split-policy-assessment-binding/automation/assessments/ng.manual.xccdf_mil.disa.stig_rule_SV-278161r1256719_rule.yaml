  id: ng.manual.xccdf_mil.disa.stig_rule_SV-278161r1256719_rule
  version: 1
  description: Windows Server 2025 PKI certificates associated with user accounts must be issued by a DoW PKI or an approved
    External Certificate Authority (ECA).
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
