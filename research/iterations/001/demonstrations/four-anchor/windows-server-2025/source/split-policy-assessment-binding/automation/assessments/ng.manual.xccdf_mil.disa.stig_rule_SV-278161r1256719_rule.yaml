  - content_refs:
    - href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:35301
    exports: []
    inline_content: 'This applies to domain controllers. It is not applicable for other systems. Review user account mappings
      to PKI certificates. Open PowerShell. Enter "Get-ADUser -Filter * | FT Name, UserPrincipalName, Enabled". Exclude disabled
      accounts (e.g., DefaultAccount, Guest) and the krbtgt account. If the User Principal Name (UPN) is not in the format
      of an individual''s identifier for the certificate type and for the appropriate domain suffix, this is a finding. For
      standard NIPRNet certificates, the individual''s identifier is in the format of an Electronic Data Interchange - Personnel
      Identifier (EDI-PI). Alt Tokens and other certificates may use a different UPN format than the EDI-PI, which vary by
      organization. Verified these with the organization. NIPRNet example: Name - User Principal Name User1 - 1234567890@mil
      Refer to the PKE documentation for other network domain suffixes. If the mappings are to certificates issued by a CA
      authorized by the Component''s CIO, this is a CAT II finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
      children:
      - attributes:
          href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
