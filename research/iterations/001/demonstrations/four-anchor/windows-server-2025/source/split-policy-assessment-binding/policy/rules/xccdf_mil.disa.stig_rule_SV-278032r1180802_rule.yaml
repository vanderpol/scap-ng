  group_path:
  - xccdf_mil.disa.stig_group_V-278032
  description: <VulnDiscussion>Secure Boot is a standard that ensures systems boot only to a trusted operating system. Secure
    Boot is required to support additional security features in Windows, including Virtualization Based Security and Credential
    Guard. If Secure Boot is turned off, these security features will not function.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
