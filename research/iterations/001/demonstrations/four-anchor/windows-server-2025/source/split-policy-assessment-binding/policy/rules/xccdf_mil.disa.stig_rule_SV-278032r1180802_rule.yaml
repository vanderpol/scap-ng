rule:
  id: xccdf_mil.disa.stig_rule_SV-278032r1180802_rule
  title: Windows Server 2025 must have Secure Boot enabled.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
