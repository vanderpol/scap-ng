rule:
  id: xccdf_mil.disa.stig_rule_SV-278170r1182143_rule
  title: The Windows Server 2025 "Deny log on as a service" user right must be configured to include no accounts or groups
    (blank) on domain controllers.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
