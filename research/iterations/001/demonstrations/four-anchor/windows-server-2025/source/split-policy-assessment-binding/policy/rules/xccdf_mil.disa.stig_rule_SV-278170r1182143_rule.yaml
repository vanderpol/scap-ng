  description: <VulnDiscussion>Inappropriately granting user rights provides system, administrative, and other high-level
    capabilities. The "Deny log on as a service" user right defines accounts that are denied logon as a service. Incorrect
    configurations could prevent services from starting and result in a denial of service.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
