      name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:5901
    exports: []
    inline_content: 'Review temporary user accounts for expiration dates. Determine if temporary user accounts are used and
      identify any that exist. If none exist, this is not applicable. Domain Controllers: Open PowerShell. Enter "Search-ADAccount
      -AccountExpiring | FT Name, AccountExpirationDate". If "AccountExpirationDate" has not been defined within 72 hours
      for any temporary user account, this is a finding. Member servers and stand-alone or nondomain-joined systems: Open
      command prompt. Run "Net user [username]", where [username] is the name of the temporary user account. If "Account expires"
      has not been defined within 72 hours for any temporary user account, this is a finding.'
    multi_check: null
    negate: null
