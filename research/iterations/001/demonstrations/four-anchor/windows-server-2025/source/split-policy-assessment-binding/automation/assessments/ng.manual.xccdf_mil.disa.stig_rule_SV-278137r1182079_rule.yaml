assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-278137r1182079_rule
  version: 1
  description: Windows Server 2025 computer clock synchronization tolerance must be limited to five minutes or less.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:30501
    exports: []
    inline_content: 'This applies to domain controllers. It is not applicable for other systems. Verify the following is configured
      in the Default Domain Policy: Open "Group Policy Management". Navigate to "Group Policy Objects" in the Domain being
      reviewed (Forest >> Domains >> Domain). Right-click the "Default Domain Policy". Select "Edit". Navigate to Computer
      Configuration >> Policies >> Windows Settings >> Security Settings >> Account Policies >> Kerberos Policy. If the "Maximum
      tolerance for computer clock synchronization" is greater than "5" minutes, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
