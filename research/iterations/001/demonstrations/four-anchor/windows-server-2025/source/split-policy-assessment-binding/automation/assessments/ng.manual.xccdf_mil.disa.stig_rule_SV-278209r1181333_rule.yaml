assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-278209r1181333_rule
  version: 1
  description: The Windows Server 2025 Smart Card removal option must be configured to Force Logoff or Lock Workstation.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:44501
    exports: []
    inline_content: 'If the following registry value does not exist or is not configured as specified, this is a finding:
      Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\ Value Name:
      scremoveoption Value Type: REG_SZ Value: 1 (Lock Workstation) or 2 (Force Logoff) If configuring this on servers causes
      issues, such as terminating users'' remote sessions, and the organization has a policy in place that any other sessions
      on the servers, such as administrative console logons, are manually locked or logged off when unattended or not in use,
      this would be acceptable. This must be documented with the information system security officer (ISSO).'
