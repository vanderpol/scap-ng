      Registry Path: \SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Attachments\ Value Name: SaveZoneInformation Value
      Type: REG_DWORD Value: 0x00000002 (2) (or if the Value Name does not exist)'
