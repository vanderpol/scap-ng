      - name: check-content
        namespace: http://checklists.nist.gov/xccdf/1.2
        text: "This applies to domain controllers. It is not applicable for other systems.\n\nRun \"MMC\".\n\nSelect \"Add/Remove\
          \ Snap-in\" from the \"File\" menu.\n\nSelect \"Certificates\" in the left pane, and then click \"Add >\".\n\nSelect\
          \ \"Computer Account\", and then click \"Next\".\n\nSelect the appropriate option for \"Select the computer you\
          \ want this snap-in to manage\", and then click \"Finish\".\n\nClick \"OK\".\n\nSelect and expand the \"Certificates\
          \ (Local Computer)\" entry in the left pane.\n\nSelect and expand the \"Personal\" entry in the left pane.\n\nSelect\
          \ the \"Certificates\" entry in the left pane.\n\nIn the right pane, examine the \"Issued By\" field for the certificate\
          \ to determine the issuing CA.\n\nIf the \"Issued By\" field of the PKI certificate being used by the domain controller\
          \ does not indicate the issuing CA is part of the DoW PKI or an approved ECA, this is a finding.\n\nIf the certificates\
          \ in use are issued by a CA authorized by the Component's CIO, this is a CAT II finding.\n\nThere are multiple sources\
          \ from which lists of valid DoW CAs and approved ECAs can be obtained: \n\nThe Global Directory Service (GDS) website\
          \ provides an online source. The address for this site is https://crl.gds.disa.mil.\n\nDoW Public Key Enablement\
          \ (PKE) Engineering Support maintains the InstallRoot utility to manage DoW supported root certificates on Windows\
          \ computers, which includes a list of authorized CAs. The utility package can be downloaded from the PKI and PKE\
          \ Tools page on Cyber Exchange:\nhttps://www.cyber.mil/pki-pke/tools-configuration-files"
      name: check
      namespace: http://checklists.nist.gov/xccdf/1.2
    system: http://scap.nist.gov/schema/ocil/2
