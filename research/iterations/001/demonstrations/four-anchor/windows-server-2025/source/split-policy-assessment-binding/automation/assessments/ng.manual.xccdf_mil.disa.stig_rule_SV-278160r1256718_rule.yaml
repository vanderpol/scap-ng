      name: ocil:navy.navwar.niwcatlantic.scc.windows2025:questionnaire:35101
    exports: []
    inline_content: 'This applies to domain controllers. It is not applicable for other systems. Run "MMC". Select "Add/Remove
      Snap-in" from the "File" menu. Select "Certificates" in the left pane, and then click "Add >". Select "Computer Account",
      and then click "Next". Select the appropriate option for "Select the computer you want this snap-in to manage", and
      then click "Finish". Click "OK". Select and expand the "Certificates (Local Computer)" entry in the left pane. Select
      and expand the "Personal" entry in the left pane. Select the "Certificates" entry in the left pane. In the right pane,
      examine the "Issued By" field for the certificate to determine the issuing CA. If the "Issued By" field of the PKI certificate
      being used by the domain controller does not indicate the issuing CA is part of the DoW PKI or an approved ECA, this
      is a finding. If the certificates in use are issued by a CA authorized by the Component''s CIO, this is a CAT II finding.
      There are multiple sources from which lists of valid DoW CAs and approved ECAs can be obtained: The Global Directory
      Service (GDS) website provides an online source. The address for this site is https://crl.gds.disa.mil. DoW Public Key
      Enablement (PKE) Engineering Support maintains the InstallRoot utility to manage DoW supported root certificates on
      Windows computers, which includes a list of authorized CAs. The utility package can be downloaded from the PKI and PKE
      Tools page on Cyber Exchange: https://www.cyber.mil/pki-pke/tools-configuration-files'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
