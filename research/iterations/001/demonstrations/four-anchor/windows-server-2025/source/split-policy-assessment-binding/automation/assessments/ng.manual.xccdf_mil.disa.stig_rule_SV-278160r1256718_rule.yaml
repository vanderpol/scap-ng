  id: ng.manual.xccdf_mil.disa.stig_rule_SV-278160r1256718_rule
  version: 1
  description: Windows Server 2025 domain Controller PKI certificates must be issued by the DoW PKI or an approved External
    Certificate Authority (ECA).
  method: manual_or_external_check
  source_checks:
