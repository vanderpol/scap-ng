  id: ng.manual.xccdf_mil.disa.stig_rule_SV-278014r1182263_rule
  version: 1
  description: Windows Server 2025 must automatically remove or disable emergency accounts after the crisis is resolved or
    within 72 hours.
  method: manual_or_external_check
  source_checks:
