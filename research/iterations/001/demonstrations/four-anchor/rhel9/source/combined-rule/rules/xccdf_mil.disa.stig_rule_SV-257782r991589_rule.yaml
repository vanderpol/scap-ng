rule:
  id: xccdf_mil.disa.stig_rule_SV-257782r991589_rule
  title: RHEL 9 must enable the hardware random number generator entropy gatherer service.
  severity: low
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-257782
  description: <VulnDiscussion>The most important characteristic of a random number generator is its randomness, namely its
    ability to deliver random numbers that are impossible to predict. Entropy in computer security is associated with the
    unpredictability of a source of randomness. The random source with high entropy tends to achieve a uniform distribution
    of random values. Random number generators are one of the most important building blocks of cryptosystems. The rngd service
    feeds random data from hardware device to kernel random device. Quality (nonpredictable) random number generation is important
    for several security functions (i.e., ciphers).</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
