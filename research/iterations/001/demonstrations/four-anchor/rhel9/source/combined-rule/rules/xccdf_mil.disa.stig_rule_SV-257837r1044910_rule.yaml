  fix: 'Document the requirement for a graphical user interface with the ISSO or remove all xorg packages with the following
    command: Warning: If you are accessing the system through the graphical user interface, change to the multi-user.target
    with the following command: $ sudo systemctl isolate multi-user.target Warning: Removal of the graphical user interface
    will immediately render it useless. The following commands must not be run from a virtual terminal emulator in the graphical
    interface. $ sudo dnf remove "xorg*" $ sudo systemctl set-default multi-user.target'
