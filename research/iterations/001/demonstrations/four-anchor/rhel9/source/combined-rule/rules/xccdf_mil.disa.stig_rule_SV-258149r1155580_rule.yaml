          the following: $ sudo grep -ir ''@@'' /etc/rsyslog.conf /etc/rsyslog.d/ To check for Rainer script syntax, perform
          the following: $ sudo grep -rq ''type="omfwd"'' /etc/rsyslog.conf /etc/rsyslog.d/ If a remote server is not configured,
