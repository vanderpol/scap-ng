rule:
  id: xccdf_mil.disa.stig_rule_SV-257832r1155653_rule
  title: RHEL 9 must not have the gssproxy package installed.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
