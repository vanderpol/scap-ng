        exports: []
        inline_content: 'Note: If the system administrator (SA) demonstrates the use of an approved alternate multifactor
          authentication method, this requirement is not applicable. Verify the operating system implements Online Certificate
          Status Protocol (OCSP) and is using the proper digest value on the system with the following command: $ sudo grep
          -sir certificate_verification /etc/sssd/sssd.conf /etc/sssd/conf.d/ | grep -v "^#" /etc/sssd/conf.d/certificate_verification:certificate_verification
          = ocsp_dgst=sha512 If the certificate_verification line is missing from the [sssd] section, or is missing "ocsp_dgst=sha512",
          ask the administrator to indicate what type of multifactor authentication is being used and how the system implements
          certificate status checking. If there is no evidence of certificate status checking being used, this is a finding.'
        multi_check: null
        negate: null
