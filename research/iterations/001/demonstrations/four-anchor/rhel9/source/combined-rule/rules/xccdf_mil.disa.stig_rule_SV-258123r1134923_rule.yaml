rule:
  id: xccdf_mil.disa.stig_rule_SV-258123r1134923_rule
  title: RHEL 9 must implement certificate status checking for multifactor authentication.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-258123
  description: '<VulnDiscussion>Using an authentication device, such as a DOD common access card (CAC) or token that is separate
    from the information system, ensures that even if the information system is compromised, credentials stored on the authentication
    device will not be affected. Multifactor solutions that require devices separate from information systems gaining access
    include, for example, hardware tokens providing time-based or challenge-response authenticators and smart cards such as
    the U.S. Government Personal Identity Verification (PIV) card and the DOD CAC. RHEL 9 includes multiple options for configuring
    certificate status checking, but for this requirement focuses on the System Security Services Daemon (SSSD). By default,
    SSSD performs Online Certificate Status Protocol (OCSP) checking and certificate verification using a sha256 digest function.
    Satisfies: SRG-OS-000375-GPOS-00160, SRG-OS-000377-GPOS-00162</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
