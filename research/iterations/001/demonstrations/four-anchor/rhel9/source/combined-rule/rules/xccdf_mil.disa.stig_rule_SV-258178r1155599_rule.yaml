              -a always,exit -F arch=b64 -S chown,fchown,lchown,fchownat -F auid>=1000 -F auid!=-1 -F key=perm_mod


              If both the "b32" and "b64" audit rules are not defined for the "chown", "fchown", "fchownat", and "lchown"
