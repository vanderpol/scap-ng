  description: <VulnDiscussion>An account has root authority if it has a user identifier (UID) of "0". Multiple accounts with
    a UID of "0" afford more opportunity for potential intruders to guess a password for a privileged account. Proper configuration
    of sudo is recommended to afford multiple system administrators access to root privileges in an accountable manner.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
