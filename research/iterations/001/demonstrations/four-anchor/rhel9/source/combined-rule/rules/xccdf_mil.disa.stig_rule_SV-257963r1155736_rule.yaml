    - name: description
      namespace: http://checklists.nist.gov/xccdf/1.2
      text: '<VulnDiscussion>ICMP redirect messages are used by routers to inform hosts that a more direct route exists for
        a particular destination. These messages modify the host''s route table and are unauthenticated. An illicit ICMP redirect
        message could result in a man-in-the-middle attack.


        This feature of the IPv4 protocol has few legitimate uses. It must be disabled unless absolutely required.


        The sysctl --system command will load settings from all system configuration files. All configuration files are sorted
        by their filename in lexicographical order, regardless of the directories in which they reside. If multiple files
        specify the same option, the entry in the file with the lexicographically latest name will take precedence. Files
        are read from directories in the following list from top to bottom. Once a file of a given filename is loaded, any
        file of the same name in subsequent directories is ignored.


        /etc/sysctl.d/*.conf

        /run/sysctl.d/*.conf

        /usr/local/lib/sysctl.d/*.conf

        /usr/lib/sysctl.d/*.conf

        /lib/sysctl.d/*.conf

        /etc/sysctl.conf</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
