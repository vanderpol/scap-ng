rule:
  id: xccdf_mil.disa.stig_rule_SV-257935r1044994_rule
  title: RHEL 9 must have the firewalld package installed.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
