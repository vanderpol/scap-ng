  fix: Configure RHEL 9 to not allow users to execute privileged actions without authenticating. Remove any occurrence of
    "!authenticate" found in "/etc/sudoers" file or files in the "/etc/sudoers.d" directory. $ sudo sed -i '/\!authenticate/
    s/^/# /g' /etc/sudoers /etc/sudoers.d/*
