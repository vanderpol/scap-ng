  fix: 'Configure the file integrity tool to run automatically on the system at least weekly and to notify designated personnel
    if baseline configurations are changed in an unauthorized manner. The AIDE tool can be configured to email designated
    personnel with the use of the cron system. The following example output is generic. It will set cron to run AIDE daily
    and to send email at the completion of the analysis $ sudo more /etc/cron.daily/aide #!/bin/bash /usr/sbin/aide --check
    | /bin/mail -s "$HOSTNAME - Daily aide integrity check run" root@sysname.mil'
