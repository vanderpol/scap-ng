rule:
  id: xccdf_mil.disa.stig_rule_SV-257874r958804_rule
  title: RHEL 9 must mount /var/log/audit with the noexec option.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
