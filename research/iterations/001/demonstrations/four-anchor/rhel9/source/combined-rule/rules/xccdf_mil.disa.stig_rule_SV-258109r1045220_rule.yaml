  fix: 'Configure RHEL 9 to enforce password complexity by requiring at least one special character be used by setting the
    "ocredit" option. Add or update the following line in the "/etc/security/pwquality.conf" file or a configuration file
    in the "/etc/security/pwquality.conf.d/" directory to contain the "ocredit" parameter: ocredit = -1'
