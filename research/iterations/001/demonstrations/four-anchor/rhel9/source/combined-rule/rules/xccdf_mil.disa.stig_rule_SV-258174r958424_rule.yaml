        exports: []
        inline_content: 'Verify that RHEL 9 is configured to notify the appropriate interactive users in the event of an audit
          processing failure. Find the alias maps that are being used with the following command: $ postconf alias_maps alias_maps
          = hash:/etc/aliases Query the Postfix alias maps for an alias for the root user with the following command: $ postmap
          -q root hash:/etc/aliases isso If an alias is not set, this is a finding.'
