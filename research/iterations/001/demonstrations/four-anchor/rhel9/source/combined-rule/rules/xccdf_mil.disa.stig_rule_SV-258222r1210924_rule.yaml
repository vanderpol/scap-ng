    that affect "/etc/passwd". Add or update the following file system rule to "/etc/audit/rules.d/audit.rules": -a always,exit
    -F arch=b32 -F path=/etc/passwd -F perm=wa -k identity -a always,exit -F arch=b64 -F path=/etc/passwd -F perm=wa -k identity
