        inline_content: 'Verify RHEL 9 generates audit records for all account creations, modifications, disabling, and termination
          events that affect "/etc/passwd" with the following command: $ sudo auditctl -l | egrep ''(/etc/passwd)'' -a always,exit
          -F arch=b32 -F path=/etc/passwd -F perm=wa -k identity -a always,exit -F arch=b64 -F path=/etc/passwd -F perm=wa
          -k identity If the command does not return a line, or the line is commented out, this is a finding.'
