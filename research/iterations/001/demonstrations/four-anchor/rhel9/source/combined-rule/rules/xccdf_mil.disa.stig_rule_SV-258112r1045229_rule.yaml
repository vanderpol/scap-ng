  check: Verify that RHEL 9 requires the change of at least eight of the total number of characters when passwords are changed.
    $ grep difok /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf difok = 8 If the value of "difok" is set
    to less than "8", or is commented out, this is a finding.
