  check: 'Note: This requirement assumes the use of the RHEL 9 default graphical user interface, the GNOME desktop environment.
    If the system does not have any graphical user interface installed, this requirement is Not Applicable. Verify that users
    cannot enable the Ctrl-Alt-Del sequence in the GNOME desktop with the following command: $ gsettings writable org.gnome.settings-daemon.plugins.media-keys
    logout false If "logout" is writable and the result is "true", this is a finding.'
