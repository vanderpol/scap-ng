model: combined-rule
rule:
  id: xccdf_mil.disa.stig_rule_SV-257826r1208770_rule
  title: RHEL 9 must not have a File Transfer Protocol (FTP) server package installed.
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-257826
  description: '<VulnDiscussion>The FTP service provides an unencrypted remote access that does not provide for the confidentiality
    and integrity of user passwords or the remote session. If a privileged user were to log on using this service, the privileged
    user password could be compromised. SSH or other encrypted file transfer methods must be used in place of this service.
    Removing the "vsftpd" package decreases the risk of accidental activation. If FTP is required for operational support
    (such as transmission of router configurations), its use must be documented with the information systems security manager
    (ISSM), restricted to only authorized personnel, and have access control rules established. Satisfies: SRG-OS-000074-GPOS-00042,
    SRG-OS-000095-GPOS-00049, SRG-OS-000480-GPOS-00227</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
