  requires: []
  conflicts: []
  check: 'Note: If kernel dumps are disabled in accordance with RHEL-09-213040, this requirement is not applicable. Verify
    RHEL 9 disables storing core dumps for all users by issuing the following command: $ grep -i storage /etc/systemd/coredump.conf
    Storage=none If the "Storage" item is missing or commented out, or the value is anything other than "none", and the need
    for core dumps is not documented with the information system security officer (ISSO) as an operational requirement for
    all domains that have the "core" item assigned, this is a finding.'
