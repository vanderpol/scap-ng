  fix: 'To configure the system to prevent SSH users from logging on directly as root add or modify the following line in
    "/etc/ssh/sshd_config" or in a file in "/etc/ssh/sshd_config.d". PermitRootLogin no Restart the SSH daemon for the settings
    to take effect: $ sudo systemctl restart sshd.service'
