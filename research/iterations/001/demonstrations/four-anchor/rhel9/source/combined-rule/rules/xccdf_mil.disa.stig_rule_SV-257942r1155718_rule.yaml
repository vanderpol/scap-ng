  id: xccdf_mil.disa.stig_rule_SV-257942r1155718_rule
  title: RHEL 9 must enable hardening for the Berkeley Packet Filter just-in-time compiler.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
