  description: '<VulnDiscussion>System calls are special routines in the Linux kernel, which userspace applications ask to
    do privileged tasks. Invoking a system call is an expensive operation because the processor must interrupt the currently
    executing task and switch context to kernel mode and then back to userspace after the system call completes. Virtual system
    calls map into user space a page that contains some variables and the implementation of some system calls. This allows
    the system calls System calls are special routines in the Linux kernel, which userspace applications ask to do privileged
    tasks. Invoking a system call is an expensive operation because the processor must interrupt the currently executing task
    and switch context to kernel mode and then back to userspace after the system call completes. Virtual system calls map
    into user space a page that contains some variables and the implementation of some system calls. This allows the system
    calls to be executed in user space to alleviate the context-switching expense. Virtual system calls provide an opportunity
    of attack for a user who has control of the return instruction pointer. Disabling virtual system calls help to prevent
    return-oriented programming attacks via buffer overflows and overruns. Satisfies: SRG-OS-000480-GPOS-00227, SRG-OS-000134-GPOS-00068</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
