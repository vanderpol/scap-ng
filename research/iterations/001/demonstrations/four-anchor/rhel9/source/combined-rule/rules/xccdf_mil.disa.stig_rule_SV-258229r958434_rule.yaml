rule:
  id: xccdf_mil.disa.stig_rule_SV-258229r958434_rule
  title: RHEL 9 audit system must protect auditing rules from unauthorized change.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-258229
  description: '<VulnDiscussion>Unauthorized disclosure of audit records can reveal system and configuration data to attackers,
    thus compromising its confidentiality. Audit information includes all information (e.g., audit records, audit settings,
    audit reports) needed to successfully audit RHEL 9 system activity. In immutable mode, unauthorized users cannot execute
    changes to the audit system to potentially hide malicious activity and then put the audit rules back. A system reboot
    would be noticeable, and a system administrator could then investigate the unauthorized changes. Satisfies: SRG-OS-000057-GPOS-00027,
    SRG-OS-000058-GPOS-00028, SRG-OS-000059-GPOS-00029</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
