  description: <VulnDiscussion>Enforcing a minimum password lifetime helps to prevent repeated password changes to defeat
    the password reuse or history enforcement requirement. If users are allowed to immediately and continually change their
    password, the password could be repeatedly changed in a short period of time to defeat the organization's policy regarding
    password reuse.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
