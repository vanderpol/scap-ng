rule:
  id: xccdf_mil.disa.stig_rule_SV-257784r1208766_rule
  title: The systemd Ctrl-Alt-Delete burst key sequence in RHEL 9 must be disabled.
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-257784
  description: '<VulnDiscussion>A locally logged-on user who presses Ctrl-Alt-Delete when at the console can reboot the system.
    If accidentally pressed, as could happen in the case of a mixed OS environment, this can create the risk of short-term
    loss of availability of systems due to unintentional reboot. In a graphical user environment, risk of unintentional reboot
    from the Ctrl-Alt-Delete sequence is reduced because the user will be prompted before any action is taken. Satisfies:
    SRG-OS-000324-GPOS-00125, SRG-OS-000480-GPOS-00227</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
