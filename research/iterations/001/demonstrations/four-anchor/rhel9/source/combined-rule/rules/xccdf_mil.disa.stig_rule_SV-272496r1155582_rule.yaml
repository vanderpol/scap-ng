rule:
  id: xccdf_mil.disa.stig_rule_SV-272496r1155582_rule
  title: RHEL 9 must elevate the SELinux context when an administrator calls the sudo command.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
