rule:
  id: xccdf_mil.disa.stig_rule_SV-258099r1045198_rule
  title: RHEL 9 password-auth must be configured to use a sufficient number of hashing rounds.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-258099
  description: '<VulnDiscussion>Passwords need to be protected at all times, and encryption is the standard method for protecting
    passwords. If passwords are not encrypted, they can be plainly read (i.e., clear text) and easily compromised. Passwords
    that are encrypted with a weak algorithm are no more protected than if they are kept in plain text. Using more hashing
    rounds makes password cracking attacks more difficult. Satisfies: SRG-OS-000073-GPOS-00041, SRG-OS-000120-GPOS-00061</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
