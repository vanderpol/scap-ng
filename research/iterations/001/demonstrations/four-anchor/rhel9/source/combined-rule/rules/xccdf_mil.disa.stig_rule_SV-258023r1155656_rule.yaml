rule:
  id: xccdf_mil.disa.stig_rule_SV-258023r1155656_rule
  title: RHEL 9 must automatically lock graphical user sessions after 10 minutes of inactivity.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
