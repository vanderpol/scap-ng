  check: 'Verify RHEL 9 authenticates the remote logging server for offloading audit logs with the following command: $ grep
    -i ''StreamDriver[\.]*AuthMode'' /etc/rsyslog.conf /etc/rsyslog.d/*.conf /etc/rsyslog.conf:$ActionSendStreamDriverAuthMode
    x509/name If the variable name "StreamDriverAuthMode" is present in an omfwd statement block, this is not a finding. However,
    if the "StreamDriverAuthMode" variable is in a module block, this is a finding. If the value of the "$ActionSendStreamDriverAuthMode
    or StreamDriver.AuthMode" option is not set to "x509/name" or the line is commented out, ask the system administrator
    (SA) to indicate how the audit logs are offloaded to a different system or media. If there is no evidence that the transfer
    of the audit logs being offloaded to another system or media is encrypted, this is a finding.'
