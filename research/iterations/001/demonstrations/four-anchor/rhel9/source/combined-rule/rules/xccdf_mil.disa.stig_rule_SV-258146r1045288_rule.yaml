rule:
  id: xccdf_mil.disa.stig_rule_SV-258146r1045288_rule
  title: RHEL 9 must authenticate the remote logging server for offloading audit logs via rsyslog.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
