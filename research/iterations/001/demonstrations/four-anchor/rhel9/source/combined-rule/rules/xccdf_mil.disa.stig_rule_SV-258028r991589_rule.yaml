rule:
  id: xccdf_mil.disa.stig_rule_SV-258028r991589_rule
  title: RHEL 9 effective dconf policy must match the policy keyfiles.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-258028
  description: <VulnDiscussion>Unlike text-based keyfiles, the binary database is impossible to check through most automated
    and all manual means; therefore, in order to evaluate dconf configuration, both have to be true at the same time - configuration
    files have to be compliant, and the database needs to be more recent than those keyfiles, which gives confidence that
    it reflects them.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
