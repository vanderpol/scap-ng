  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-257923
  description: <VulnDiscussion>If RHEL 9 allowed any user to make changes to software libraries, then those changes might
    be implemented without undergoing the appropriate testing and approvals that are part of a robust change management process.
    This requirement applies to RHEL 9 with software libraries that are accessible and configurable, as in the case of interpreted
    languages. Software libraries also include privileged programs that execute with escalated privileges.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
