rule:
  id: xccdf_mil.disa.stig_rule_SV-257923r1044991_rule
  title: RHEL 9 library directories must be group-owned by root or a system account.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
