    value: CCI-000140
  requires: []
  conflicts: []
  check: 'Verify that RHEL 9 takes the appropriate action when the audit files have reached maximum size with the following
    command: $ sudo grep max_log_file_action /etc/audit/auditd.conf max_log_file_action = ROTATE If the value of the "max_log_file_action"
    option is not "ROTATE", "SINGLE", or the line is commented out, ask the system administrator (SA)to indicate how the system
    takes appropriate action when an audit storage volume is full. If there is no evidence of appropriate action, this is
    a finding.'
