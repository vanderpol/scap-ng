rule:
  id: xccdf_mil.disa.stig_rule_SV-258160r1038966_rule
  title: RHEL 9 audit system must take appropriate action when the audit files have reached maximum size.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-258160
  description: <VulnDiscussion>It is critical that when the operating system is at risk of failing to process audit logs as
    required, it takes action to mitigate the failure. Audit processing failures include software/hardware errors; failures
    in the audit capturing mechanisms; and audit storage capacity being reached or exceeded. Responses to audit failure depend
    upon the nature of the failure mode.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
  platforms: []
