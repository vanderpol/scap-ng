rule:
  id: xccdf_mil.disa.stig_rule_SV-257778r1134892_rule
  title: RHEL 9 vendor packaged system security patches and updates must be installed and up to date.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
