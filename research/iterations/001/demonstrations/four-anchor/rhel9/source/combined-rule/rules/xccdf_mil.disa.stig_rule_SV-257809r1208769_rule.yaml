rule:
  id: xccdf_mil.disa.stig_rule_SV-257809r1208769_rule
  title: RHEL 9 must implement address space layout randomization (ASLR) to protect its memory from unauthorized code execution.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
