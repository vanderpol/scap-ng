  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-257809
  description: '<VulnDiscussion>Some adversaries launch attacks with the intent of executing code in nonexecutable regions
    of memory or in memory locations that are prohibited. Security safeguards employed to protect memory include, for example,
    data execution prevention and address space layout randomization. Data execution prevention safeguards can be either hardware-enforced
    or software-enforced with hardware providing the greater strength of mechanism. Examples of attacks are buffer overflow
    attacks. The sysctl --system command will load settings from all system configuration files. All configuration files are
    sorted by their filename in lexicographical order, regardless of the directories in which they reside. If multiple files
    specify the same option, the entry in the file with the lexicographically latest name will take precedence. Files are
    read from directories in the following list from top to bottom. Once a file of a given filename is loaded, any file of
    the same name in subsequent directories is ignored. /etc/sysctl.d/*.conf /run/sysctl.d/*.conf /usr/local/lib/sysctl.d/*.conf
    /usr/lib/sysctl.d/*.conf /lib/sysctl.d/*.conf /etc/sysctl.conf Satisfies: SRG-OS-000433-GPOS-00193, SRG-OS-000480-GPOS-00227</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
