rule:
  id: xccdf_mil.disa.stig_rule_SV-257949r1134947_rule
  title: RHEL 9 must configure a DNS processing mode in Network Manager.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-257949
  description: '<VulnDiscussion>To ensure that DNS resolver settings are respected, a DNS mode in Network Manager must be
    configured. The following are common DNS values in NetworkManager.conf [main]: - default: NetworkManager will update /etc/resolv.conf
    to reflect the nameservers provided by currently active connections. - none: NetworkManager will not modify /etc/resolv.conf.
    Used when DNS is managed manually or by another service. - systemd-resolved: Uses systemd-resolved to manage DNS. - dnsmasq:
    Enables the internal dnsmasq plugin.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
