  fix: 'Configure NetworkManager in RHEL 9 to use a DNS mode. In "/etc/NetworkManager/NetworkManager.conf", add the following
    line in the "[main]" section: dns = <dns processing mode> Where <dns processing mode> is default, none, or systemd-resolved.
    NetworkManager must be reloaded for the change to take effect. $ sudo systemctl reload NetworkManager'
