scap_ng: 0.1-prototype
prototype: true
model: combined-rule
rule:
  id: xccdf_mil.disa.stig_rule_SV-258169r991556_rule
  title: RHEL 9 must produce audit records containing information to establish the identity of any individual or process associated
    with the event.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-258169
  description: '<VulnDiscussion>Without establishing what type of events occurred, the source of events, where events occurred,
    and the outcome of events, it would be difficult to establish, correlate, and investigate the events leading up to an
    outage or attack. Audit record content that may be necessary to satisfy this requirement includes, for example, time stamps,
    source and destination addresses, user/process identifiers, event descriptions, success/fail indications, filenames involved,
    and access control or flow control rules invoked. Enriched logging aids in making sense of who, what, and when events
    occur on a system. Without this, determining root cause of an event will be much more difficult. Satisfies: SRG-OS-000255-GPOS-00096,
    SRG-OS-000480-GPOS-00227</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
  discussion: null
