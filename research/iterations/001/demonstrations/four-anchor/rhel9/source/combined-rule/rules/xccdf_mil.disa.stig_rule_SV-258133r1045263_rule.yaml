          name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:66901
        exports: []
        inline_content: 'Verify that the System Security Services Daemon (SSSD) prohibits the use of cached authentications
          after one day. Note: Cached authentication settings should be configured even if smart card authentication is not
          used on the system. Check that SSSD allows cached authentications with the following command: $ sudo grep -ir cache_credentials
          /etc/sssd/sssd.conf /etc/sssd/conf.d/ cache_credentials = true If "cache_credentials" is set to "false" or missing
          from the configuration file, this is not a finding and no further checks are required. If "cache_credentials" is
          set to "true", check that SSSD prohibits the use of cached authentications after one day with the following command:
          $ sudo grep -ir offline_credentials_expiration /etc/sssd/sssd.conf /etc/sssd/conf.d/ offline_credentials_expiration
          = 1 If "offline_credentials_expiration" is not set to a value of "1", this is a finding.'
        multi_check: null
        negate: null
        selector: manual
        source_tree:
          attributes:
            selector: manual
            system: http://scap.nist.gov/schema/ocil/2
          children:
          - attributes:
              href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
              name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:66901
            name: check-content-ref
            namespace: http://checklists.nist.gov/xccdf/1.2
          - name: check-content
            namespace: http://checklists.nist.gov/xccdf/1.2
            text: 'Verify that the System Security Services Daemon (SSSD) prohibits the use of cached authentications after
              one day.


              Note: Cached authentication settings should be configured even if smart card authentication is not used on the
              system.


              Check that SSSD allows cached authentications with the following command:


              $ sudo grep -ir cache_credentials /etc/sssd/sssd.conf /etc/sssd/conf.d/


              cache_credentials = true


              If "cache_credentials" is set to "false" or missing from the configuration file, this is not a finding and no
              further checks are required.


              If "cache_credentials" is set to "true", check that SSSD prohibits the use of cached authentications after one
              day with the following command:


              $ sudo grep -ir offline_credentials_expiration /etc/sssd/sssd.conf /etc/sssd/conf.d/


              offline_credentials_expiration = 1


              If "offline_credentials_expiration" is not set to a value of "1", this is a finding.'
          name: check
          namespace: http://checklists.nist.gov/xccdf/1.2
        system: http://scap.nist.gov/schema/ocil/2
      kind: check_candidates
