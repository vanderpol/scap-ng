  fix: 'Configure RHEL 9 to disable the use of user namespaces. Create the drop-in if it does not already exist: $ sudo vi
    /etc/sysctl.d/99-user_max_user_namespaces.conf Add the following line to the file: user.max_user_namespaces = 0 Reload
    settings from all system configuration files with the following command: $ sudo sysctl --system'
