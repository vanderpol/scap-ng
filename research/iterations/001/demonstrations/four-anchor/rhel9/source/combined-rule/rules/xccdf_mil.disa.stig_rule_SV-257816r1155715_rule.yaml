  check: 'Verify RHEL 9 disables the use of user namespaces. Check the status of the "user.max_user_namespaces" parameter
    with the following command: $ sudo sysctl user.max_user_namespaces user.max_user_namespaces = 0 If "user.max_user_namespaces"
    is not set to "0" or is missing, this is a finding. If the use of namespaces is operationally required and documented
    with the information system security manager (ISSM), it is not a finding.'
