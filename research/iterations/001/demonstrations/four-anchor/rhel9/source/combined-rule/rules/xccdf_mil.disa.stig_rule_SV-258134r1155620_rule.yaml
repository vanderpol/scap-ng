  description: '<VulnDiscussion>Without verification of the security functions, security functions may not operate correctly,
    and the failure may go unnoticed. Security function is defined as the hardware, software, and/or firmware of the information
    system responsible for enforcing the system security policy and supporting the isolation of code and data on which the
    protection is based. Security functionality includes, but is not limited to, establishing system accounts, configuring
    access authorizations (i.e., permissions, privileges), setting events to be audited, and setting intrusion detection parameters.
    Selection lines in the aide.conf file determine which files and directories AIDE will monitor for changes. They follow
    this format: <path> <rules> The <path> specifies a file, directory or wildcard pattern to monitor. The <rules>define which
    attributes (hashes, permissions, timestamps, etc.) to check. Satisfies: SRG-OS-000363-GPOS-00150, SRG-OS-000445-GPOS-00199</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
