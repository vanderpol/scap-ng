  fix: 'Configure the audit logs to have a mode of "0600" with the following command: Replace "[audit_log_file]" with the
    path to each audit log file. By default, these logs are located in "/var/log/audit/. $ sudo chmod 0600 /var/log/audit/[audit_log_file]
    Check the group that owns the system audit logs: $ sudo grep -iw log_group /etc/audit/auditd.conf If log_group is set
    to a user other than root, configure the permissions the following way: $ sudo chmod 0640 $log_file $ sudo chmod 0440
    $log_file.* Otherwise, configure the permissions the following way: $ sudo chmod 0600 $log_file $ sudo chmod 0400 $log_file.*'
