            text: "Verify the audit logs have a mode of \"0600\". \n\nDetermine where the audit logs are stored with the following\
              \ command:\n\n$ sudo grep \"^log_file\" /etc/audit/auditd.conf\n\nlog_file = /var/log/audit/audit.log\n\nUsing\
              \ the location of the audit log file, determine the mode of each audit log with the following command:\n\n$\
              \ sudo find /var/log/audit/ -type f -exec stat -c '%a %n' {} \\;\n\n600 /var/log/audit/audit.log\n\nIf the audit\
              \ logs have a mode more permissive than \"0600\", this is a finding."
