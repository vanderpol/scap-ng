rule:
  id: xccdf_mil.disa.stig_rule_SV-258167r1155630_rule
  title: RHEL 9 audit logs file must have mode 0600 or less permissive to prevent unauthorized access to the audit log.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
