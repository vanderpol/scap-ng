rule:
  id: xccdf_mil.disa.stig_rule_SV-257879r1045454_rule
  title: RHEL 9 local disk partitions must implement cryptographic mechanisms to prevent unauthorized disclosure or modification
    of all information that requires at rest protection.
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-257879
  description: '<VulnDiscussion>RHEL 9 systems handling data requiring "data at rest" protections must employ cryptographic
    mechanisms to prevent unauthorized disclosure and modification of the information at rest. Selection of a cryptographic
    mechanism is based on the need to protect the integrity of organizational information. The strength of the mechanism is
    commensurate with the security category and/or classification of the information. Organizations have the flexibility to
    either encrypt all information on storage devices (i.e., full disk encryption) or encrypt specific data structures (e.g.,
    files, records, or fields). Satisfies: SRG-OS-000405-GPOS-00184, SRG-OS-000185-GPOS-00079, SRG-OS-000404-GPOS-00183</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
