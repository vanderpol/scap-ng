        text: "Note: If there is a documented and approved reason for not having data-at-rest encryption at the operating\
          \ system level, such as encryption provided by a hypervisor or a disk storage array in a virtualized environment,\
          \ this requirement is Not Applicable.\n\nVerify RHEL 9 prevents unauthorized disclosure or modification of all information\
          \ requiring at-rest protection by using disk encryption. \n\nNote: If there is a documented and approved reason\
          \ for not having data-at-rest encryption, this requirement is Not Applicable.\n\nList all block devices in tree-like\
          \ format:\n\n$ sudo lsblk --tree\n\nNAME                       MAJ:MIN  RM   SIZE     RO    TYPE    MOUNTPOINTS\n\
          zram0                      252:0    0    8G       0     disk    [SWAP]\nnvme0n1                    259:0    0  \
          \  476.9G   0     disk\n|-nvme0n1p1                259:1    0    1G       0     part    /boot/efi\n|-nvme0n1p2 \
          \               259:2    0    1G       0     part    /boot\n|-nvme0n1p3                259:3    0    474.9G   0\
          \     part\n  |-luks-<encrypted_id>    253:0    0    474.9G   0     crypt\n    |-rhel-root            253:1    0\
          \    16G      0     lvm     /\n    |-rhel-varcache        253:2    0    8G       0     lvm     /var/cache\n    |-rhel-vartmp\
          \          253:3    0    4G       0     lvm     /var/tmp\n    |-rhel-varlog          253:4    0    4G       0  \
          \   lvm     /var/log\n    |-rhel-home            253:5    0    64G      0     lvm     /home\n    |-rhel-varlogaudit\
          \     253:6    0    4G       0     lvm     /var/log/audit\n\nVerify that the block device tree for each persistent\
          \ filesystem, excluding the /boot and /boot/efi filesystems, has at least one parent block device of type \"crypt\"\
          , and that the encryption type is LUKS:\n\n$ sudo cryptsetup status luks-b74f6910-2547-4399-86b2-8b0252d926d7\n\
          /dev/mapper/luks-b74f6910-2547-4399-86b2-8b0252d926d7 is active and is in use.\n  type:    LUKS2\n  cipher:  aes-xts-plain64\n\
          \  keysize: 512 bits\n  key location: keyring\n  device:  /dev/nvme0n1p3\n  sector size:  512\n  offset:  32768\
          \ sectors\n  size:    995986063 sectors\n  mode:    read/write\n\nIf there are persistent filesystems (other than\
          \ /boot or /boot/efi) whose block device trees do not have a crypt block device of type LUKS, ask the administrator\
          \ to indicate how persistent filesystems are encrypted. \n\nIf there is no evidence that persistent filesystems\
          \ are encrypted, this is a finding."
      name: check
      namespace: http://checklists.nist.gov/xccdf/1.2
