  fix: Configure RHEL 9 to prevent unauthorized modification of all information at rest by using disk encryption. Encrypting
    a partition in an already installed system is more difficult, because existing partitions will need to be resized and
    changed. To encrypt an entire partition, dedicate a partition for encryption in the partition layout.
