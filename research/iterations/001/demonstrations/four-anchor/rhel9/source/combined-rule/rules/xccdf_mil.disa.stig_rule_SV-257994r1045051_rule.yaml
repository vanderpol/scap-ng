rule:
  id: xccdf_mil.disa.stig_rule_SV-257994r1045051_rule
  title: RHEL 9 must force a frequent session key renegotiation for SSH connections to the server.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
