              text: RHEL-09-255090 - RHEL 9 must force a frequent session key renegotiation for SSH connections to the server.
            - attributes:
                family: unix
              children:
              - name: platform
                namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
                text: Red Hat Enterprise Linux 9
              name: affected
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: "Without protection of the transmitted information, confidentiality and integrity may be compromised because\
                \ unprotected communications can be intercepted and either read or altered. \n\nThis requirement applies to\
                \ both internal and external networks and all types of information system components from which information\
                \ can be transmitted (e.g., servers, mobile devices, notebook computers, printers, copiers, scanners, and\
                \ facsimile machines). Communication paths outside the physical protection of a controlled boundary are exposed\
                \ to the possibility of interception and modification. \n\nProtecting the confidentiality and integrity of\
                \ organizational information can be accomplished by physical means (e.g., employing physical distribution\
                \ systems) or by logical means (e.g., employing cryptographic techniques). If physical means of protection\
                \ are employed, then logical means (cryptography) do not have to be employed, and vice versa.\n\nSession key\
                \ regeneration limits the chances of a session key becoming compromised.\n\nSatisfies: SRG-OS-000423-GPOS-00187,\
                \ SRG-OS-000033-GPOS-00014, SRG-OS-000424-GPOS-00188"
            name: metadata
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
