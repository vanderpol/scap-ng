assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258020r1045094_rule
  version: 1
  description: RHEL 9 must prevent a user from overriding the disabling of the graphical user smart card removal action.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:46701
    exports: []
    inline_content: 'Note: This requirement assumes the use of the RHEL 9 default graphical user interface, the GNOME desktop
      environment. If the system does not have any graphical user interface installed, this requirement is Not Applicable.
      Verify RHEL 9 disables ability of the user to override the smart card removal action setting. $ gsettings writable org.gnome.settings-daemon.peripherals.smartcard
      removal-action false If "removal-action" is writable and the result is "true", this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
