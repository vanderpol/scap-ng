  check: 'Verify USBGuard is installed on the operating system with the following command: $ sudo dnf list installed usbguard
    Example output: Installed Packages usbguard.x86_64 1.0.0-10.el9_1.2 @rhel-9-for-x86_64-appstream-rpms If the USBGuard
    package is not installed, ask the SA to indicate how unauthorized peripherals are being blocked. If there is no evidence
    that unauthorized peripherals are being blocked before establishing a connection, this is a finding. If the system is
    virtual machine with no virtual or physical USB peripherals attached, this is not a finding.'
