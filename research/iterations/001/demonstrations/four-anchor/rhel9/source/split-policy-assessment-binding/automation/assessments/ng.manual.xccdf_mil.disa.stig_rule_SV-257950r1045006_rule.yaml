      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:33901
    exports: []
    inline_content: 'Verify that RHEL 9 does not have unauthorized IP tunnels configured. Determine if the "IPsec" service
      is active with the following command: $ systemctl is-active ipsec Inactive If the "IPsec" service is active, check for
      configured IPsec connections ("conn"), with the following command: $ sudo grep -rni conn /etc/ipsec.conf /etc/ipsec.d/
      Verify any returned results are documented with the ISSO. If the IPsec tunnels are active and not approved, this is
      a finding.'
    multi_check: null
    negate: null
