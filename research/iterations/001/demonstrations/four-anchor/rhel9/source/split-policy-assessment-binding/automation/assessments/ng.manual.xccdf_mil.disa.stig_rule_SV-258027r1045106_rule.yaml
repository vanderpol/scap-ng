  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258027r1045106_rule
  version: 1
  description: RHEL 9 must conceal, via the session lock, information previously visible on the display with a publicly viewable
    image.
  method: manual_or_external_check
  source_checks:
  - content_refs:
