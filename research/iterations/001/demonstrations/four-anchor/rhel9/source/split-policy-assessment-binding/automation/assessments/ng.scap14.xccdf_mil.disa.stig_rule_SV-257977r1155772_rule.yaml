            text: RHEL-09-254040 - RHEL 9 must not forward IPv6 source-routed packets by default.
          - attributes:
              family: unix
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Red Hat Enterprise Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'Source-routed packets allow the source of the packet to suggest that routers forward the packet along a
              different path than configured on the router, which can be used to bypass network security measures. This requirement
              applies only to the forwarding of source-routed traffic, such as when forwarding is enabled and the system is
              functioning as a router.


              Accepting source-routed packets in the IPv6 protocol has few legitimate uses. It must be disabled unless it
              is absolutely required.'
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
