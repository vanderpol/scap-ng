          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify that RHEL 9 disables the ability to load the Bluetooth kernel module with the following command:\n\
            \n$ sudo grep -r bluetooth /etc/modprobe.conf /etc/modprobe.d/* \n\ninstall bluetooth /bin/false\nblacklist bluetooth\n\
            \t\nIf the command does not return any output, or the lines are commented out, and use of Bluetooth is not documented\
            \ with the information system security officer (ISSO) as an operational requirement, this is a finding."
        name: check
