assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258039r1045131_rule
  version: 1
  description: RHEL 9 Bluetooth must be disabled.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:50501
    exports: []
    inline_content: 'Verify that RHEL 9 disables the ability to load the Bluetooth kernel module with the following command:
      $ sudo grep -r bluetooth /etc/modprobe.conf /etc/modprobe.d/* install bluetooth /bin/false blacklist bluetooth If the
      command does not return any output, or the lines are commented out, and use of Bluetooth is not documented with the
      information system security officer (ISSO) as an operational requirement, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
