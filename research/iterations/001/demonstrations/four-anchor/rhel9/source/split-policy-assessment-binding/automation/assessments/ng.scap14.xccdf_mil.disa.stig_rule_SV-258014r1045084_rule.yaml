        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:45501
      exports: []
      inline_content: 'Note: This requirement assumes the use of the RHEL 9 default graphical user interface, the GNOME desktop
        environment. If the system does not have any graphical user interface installed, this requirement is Not Applicable.
        Verify RHEL 9 disables the graphical user interface automount function with the following command: $ gsettings get
        org.gnome.desktop.media-handling automount-open false If "automount-open" is set to "true", and is not documented
        with the information system security officer (ISSO) as an operational requirement, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:45501
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Note: This requirement assumes the use of the RHEL 9 default graphical user interface, the GNOME desktop\
            \ environment. If the system does not have any graphical user interface installed, this requirement is Not Applicable.\n\
            \nVerify RHEL 9 disables the graphical user interface automount function with the following command:\n\n$ gsettings\
            \ get org.gnome.desktop.media-handling automount-open \n\nfalse\n\nIf \"automount-open\" is set to \"true\", and\
            \ is not documented with the information system security officer (ISSO) as an operational requirement, this is\
            \ a finding."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
