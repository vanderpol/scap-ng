  check: 'Verify the interactive user account passwords are using a strong password hash with the following command: $ sudo
    cut -d: -f1,2 /etc/shadow nsauser:$6$kcOnRq/5$NUEYPuyL.wghQwWssXRcLRFiiru7f5JPV6GaJhNC2aK5F3PZpE/BCCtwrxRc/AInKMNX3CdMw11m9STiql12f/
    Password hashes "!" or "*" indicate inactive accounts not available for logon and are not evaluated. If any interactive
    user password hash does not begin with "$6$", this is a finding.'
