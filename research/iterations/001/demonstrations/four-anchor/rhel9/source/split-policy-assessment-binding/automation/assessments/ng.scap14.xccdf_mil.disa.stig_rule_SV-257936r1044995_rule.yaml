              text: Red Hat Enterprise Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: '"Firewalld" provides an easy and effective way to block/limit remote access to the system via ports, services,
              and protocols.


              Remote access services, such as those providing remote access to network devices and information systems, which
              lack automated control capabilities, increase risk and make remote user access management difficult at best.


              Remote access is access to DOD nonpublic information systems by an authorized user (or an information system)
              communicating through an external, non-organization-controlled network. Remote access methods include, for example,
              dial-up, broadband, and wireless.


              RHEL 9 functionality (e.g., RDP) must be capable of taking enforcement action if the audit reveals unauthorized
              activity. Automated control of remote access sessions allows organizations to ensure ongoing compliance with
              remote access policies by enforcing connection rules of remote access applications on a variety of information
              system components (e.g., servers, workstations, notebook computers, smartphones, and tablets).


              Satisfies: SRG-OS-000096-GPOS-00050, SRG-OS-000297-GPOS-00115, SRG-OS-000480-GPOS-00227, SRG-OS-000480-GPOS-00232'
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
