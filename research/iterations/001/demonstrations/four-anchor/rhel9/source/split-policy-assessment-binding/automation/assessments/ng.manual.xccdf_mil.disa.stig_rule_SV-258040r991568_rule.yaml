      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:50701
    exports: []
    inline_content: 'Verify there are no wireless interfaces configured on the system with the following command: Note: This
      requirement is Not Applicable for systems that do not have physical wireless network radios. $ nmcli device status DEVICE
      TYPE STATE CONNECTION virbr0 bridge connected virbr0 wlp7s0 wifi connected wifiSSID enp6s0 ethernet disconnected --
      p2p-dev-wlp7s0 wifi-p2p disconnected -- lo loopback unmanaged -- virbr0-nic tun unmanaged -- If a wireless interface
      is configured and has not been documented and approved by the information system security officer (ISSO), this is a
      finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
      children:
      - attributes:
          href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
          name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:50701
        name: check-content-ref
        namespace: http://checklists.nist.gov/xccdf/1.2
      - name: check-content
        namespace: http://checklists.nist.gov/xccdf/1.2
        text: 'Verify there are no wireless interfaces configured on the system with the following command:


          Note: This requirement is Not Applicable for systems that do not have physical wireless network radios.


          $ nmcli device status


          DEVICE                    TYPE            STATE                    CONNECTION

          virbr0                      bridge         connected             virbr0

          wlp7s0                    wifi              connected            wifiSSID

          enp6s0                    ethernet     disconnected        --

          p2p-dev-wlp7s0     wifi-p2p     disconnected        --

          lo                             loopback    unmanaged           --

          virbr0-nic                tun              unmanaged          --


          If a wireless interface is configured and has not been documented and approved by the information system security
          officer (ISSO), this is a finding.'
      name: check
      namespace: http://checklists.nist.gov/xccdf/1.2
    system: http://scap.nist.gov/schema/ocil/2
