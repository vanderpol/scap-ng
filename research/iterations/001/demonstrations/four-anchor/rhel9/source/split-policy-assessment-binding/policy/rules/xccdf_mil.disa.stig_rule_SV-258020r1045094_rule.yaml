  fix: 'Add the following line to "/etc/dconf/db/local.d/locks/00-security-settings-lock" to prevent user override of the
    smart card removal action: /org/gnome/settings-daemon/peripherals/smartcard/removal-action Then update the dconf system
    databases: $ sudo dconf update'
