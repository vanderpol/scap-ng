rule:
  id: xccdf_mil.disa.stig_rule_SV-258020r1045094_rule
  title: RHEL 9 must prevent a user from overriding the disabling of the graphical user smart card removal action.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
