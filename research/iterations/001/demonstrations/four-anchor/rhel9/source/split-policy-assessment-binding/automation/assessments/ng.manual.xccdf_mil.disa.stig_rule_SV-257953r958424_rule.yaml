assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-257953r958424_rule
  version: 1
  description: RHEL 9 must forward mail from postmaster to the root account using a postfix alias.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:34301
    exports: []
    inline_content: Verify that the administrators are notified in the event of an audit processing failure. Check that the
      "/etc/aliases" file has a defined value for "root". $ sudo grep "postmaster:\s*root$" /etc/aliases If the command does
      not return a line, or the line is commented out, ask the system administrator to indicate how they and the information
      systems security officer (ISSO) are notified of an audit process failure. If there is no evidence of the proper personnel
      being notified of an audit processing failure, this is a finding.
    multi_check: null
    negate: null
