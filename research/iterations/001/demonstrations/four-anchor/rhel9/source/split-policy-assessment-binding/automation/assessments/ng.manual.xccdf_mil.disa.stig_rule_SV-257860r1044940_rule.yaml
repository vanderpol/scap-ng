  id: ng.manual.xccdf_mil.disa.stig_rule_SV-257860r1044940_rule
  version: 1
  description: RHEL 9 must mount /boot with the nodev option.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:16301
    exports: []
    inline_content: 'Verify that the "/boot" mount point has the "nodev" option with the following command: $ mount | grep
      ''\s/boot\s'' /dev/sda1 on /boot type xfs (rw,nodev,relatime,seclabel,attr2) If the "/boot" file system does not have
      the "nodev" option set, this is a finding.'
