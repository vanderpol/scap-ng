assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-257975r1155766_rule
  version: 1
  description: RHEL 9 must not accept router advertisements on all IPv6 interfaces by default.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:38701
    exports: []
    inline_content: 'Verify RHEL 9 does not accept router advertisements on all IPv6 interfaces by default, unless the system
      is a router. Note: If IPv6 is disabled on the system, this requirement is Not Applicable. Check the value of the "net.ipv6.conf.default.accept_ra"
      variable with the following command: $ sudo sysctl net.ipv6.conf.default.accept_ra net.ipv6.conf.default.accept_ra =
      0 If "net.ipv6.conf.default.accept_ra" is not set to "0" or is missing, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
      children:
