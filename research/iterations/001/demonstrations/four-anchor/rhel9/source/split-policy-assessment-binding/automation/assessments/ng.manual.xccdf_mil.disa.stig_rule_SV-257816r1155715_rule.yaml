assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-257816r1155715_rule
  version: 1
  description: RHEL 9 must disable the use of user namespaces.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:7701
    exports: []
    inline_content: 'Verify RHEL 9 disables the use of user namespaces. Check the status of the "user.max_user_namespaces"
      parameter with the following command: $ sudo sysctl user.max_user_namespaces user.max_user_namespaces = 0 If "user.max_user_namespaces"
      is not set to "0" or is missing, this is a finding. If the use of namespaces is operationally required and documented
      with the information system security manager (ISSM), it is not a finding.'
    multi_check: null
    negate: null
    selector: manual
