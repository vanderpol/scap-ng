  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258085r1045173_rule
  version: 1
  description: RHEL 9 must use the invoking user's password for privilege escalation when using "sudo".
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:58301
    exports: []
    inline_content: 'Verify that the sudoers security policy is configured to use the invoking user''s password for privilege
      escalation with the following command: $ sudo egrep -ir ''(!rootpw|!targetpw|!runaspw)'' /etc/sudoers /etc/sudoers.d/
      | grep -v ''#'' /etc/sudoers:Defaults !targetpw /etc/sudoers:Defaults !rootpw /etc/sudoers:Defaults !runaspw If no results
      are returned, this is a finding. If results are returned from more than one file location, this is a finding. If "Defaults
      !targetpw" is not defined, this is a finding. If "Defaults !rootpw" is not defined, this is a finding. If "Defaults
      !runaspw" is not defined, this is a finding.'
