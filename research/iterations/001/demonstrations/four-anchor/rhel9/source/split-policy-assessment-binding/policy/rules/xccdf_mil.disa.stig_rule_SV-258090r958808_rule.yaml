rule:
  id: xccdf_mil.disa.stig_rule_SV-258090r958808_rule
  title: RHEL 9 fapolicy module must be enabled.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
