  id: ng.manual.xccdf_mil.disa.stig_rule_SV-257844r1044918_rule
  version: 1
  description: RHEL 9 must use a separate file system for /tmp.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:13301
    exports: []
    inline_content: 'Verify that a separate file system/partition has been created for "/tmp" with the following command:
      $ mount | grep /tmp /dev/mapper/rhel-tmp on /tmp type xfs (rw,nodev,nosuid,noexec,seclabel) If a separate entry for
      "/tmp" is not in use, this is a finding.'
