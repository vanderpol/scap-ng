              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Red Hat Enterprise Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'Changes to any software components can have significant effects on the overall security of the operating
              system. This requirement ensures the software has not been tampered with and that it has been provided by a
              trusted vendor.


              Disabling kexec_load prevents an unsigned kernel image (that could be a windows kernel or modified vulnerable
              kernel) from being loaded. Kexec can be used subvert the entire secureboot process and should be avoided at
              all costs especially since it can load unsigned kernel images.


              Satisfies: SRG-OS-000480-GPOS-00227, SRG-OS-000366-GPOS-00153'
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
