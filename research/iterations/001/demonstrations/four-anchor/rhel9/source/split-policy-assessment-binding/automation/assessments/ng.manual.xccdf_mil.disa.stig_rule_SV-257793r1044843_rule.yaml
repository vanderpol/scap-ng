  id: ng.manual.xccdf_mil.disa.stig_rule_SV-257793r1044843_rule
  version: 1
  description: RHEL 9 must clear the page allocator to prevent use-after-free attacks.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:3101
    exports: []
    inline_content: 'Verify that GRUB 2 is configured to enable page poisoning to mitigate use-after-free vulnerabilities.
      Check that the current GRUB 2 configuration has page poisoning enabled with the following command: $ sudo grubby --info=ALL
      | grep args | grep -v ''page_poison=1'' If any output is returned, this is a finding. Check that page poisoning is enabled
      by default to persist in kernel updates with the following command: $ sudo grep page_poison /etc/default/grub GRUB_CMDLINE_LINUX="page_poison=1"
      If "page_poison" is not set to "1", is missing or commented out, this is a finding.'
