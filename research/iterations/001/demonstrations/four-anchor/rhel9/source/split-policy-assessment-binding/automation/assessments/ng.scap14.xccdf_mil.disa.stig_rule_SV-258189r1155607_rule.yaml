        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:77701
      exports: []
      inline_content: 'Verify RHEL 9 is configured to audit the execution of the "delete_module" system call with the following
        command: $ sudo auditctl -l | grep delete_module -a always,exit -F arch=b32 -S delete_module -F auid>=1000 -F auid!=-1
        -F key=module_chng -a always,exit -F arch=b64 -S delete_module -F auid>=1000 -F auid!=-1 -F key=module_chng If both
        the "b32" and "b64" audit rules are not defined for the "delete_module" system call, or any of the lines returned
        are commented out, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:77701
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify RHEL 9 is configured to audit the execution of the "delete_module" system call with the following
            command:


            $ sudo auditctl -l | grep delete_module


            -a always,exit -F arch=b32 -S delete_module -F auid>=1000 -F auid!=-1 -F key=module_chng

            -a always,exit -F arch=b64 -S delete_module -F auid>=1000 -F auid!=-1 -F key=module_chng


            If both the "b32" and "b64" audit rules are not defined for the "delete_module" system call, or any of the lines
            returned are commented out, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
