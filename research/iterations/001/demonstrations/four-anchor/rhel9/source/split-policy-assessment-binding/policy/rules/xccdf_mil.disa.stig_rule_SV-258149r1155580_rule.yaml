  fix: 'Configure RHEL 9 to off-load audit records onto a different system or media from the system being audited via TCP
    using rsyslog by specifying the remote logging server in "/etc/rsyslog.conf" or "/etc/rsyslog.d/[customfile].conf" with
    the name or IP address of the log aggregation server. The following are examples of the configuration for the legacy syntax
    and for the newer Rainer script. Only one should be used. Using legacy ''@host:port" syntax example: *.* @@[remoteloggingserver]:[port]
    Using Rainer script example: action( type="omfwd" target="logserver.example.com" port="514" protocol="tcp" action.resumeRetryCount="-1"
    queue.type="linkedList" que.size="10000" ) Note: The Rainer Script above does not contain the required encryption settings.'
