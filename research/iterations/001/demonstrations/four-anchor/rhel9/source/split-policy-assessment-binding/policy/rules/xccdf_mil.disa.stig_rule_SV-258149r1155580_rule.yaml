rule:
  id: xccdf_mil.disa.stig_rule_SV-258149r1155580_rule
  title: RHEL 9 must be configured to forward audit records via TCP to a different system or media from the system being audited
    via rsyslog.
  severity: medium
  weight: '10.0'
  role: null
