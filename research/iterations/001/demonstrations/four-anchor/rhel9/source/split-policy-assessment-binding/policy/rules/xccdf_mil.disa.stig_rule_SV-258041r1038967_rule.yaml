rule:
  id: xccdf_mil.disa.stig_rule_SV-258041r1038967_rule
  title: RHEL 9 user account passwords for new users or password changes must have a 60-day maximum password lifetime restriction
    in /etc/login.defs.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-258041
  description: <VulnDiscussion>Any password, no matter how complex, can eventually be cracked; therefore, passwords need to
    be changed periodically. If the operating system does not limit the lifetime of passwords and force users to change their
    passwords, there is the risk that the operating system passwords could be compromised. Setting the password maximum age
    ensures users are required to periodically change their passwords. Requiring shorter password lifetimes increases the
    risk of users writing down the password in a convenient location subject to physical compromise.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
