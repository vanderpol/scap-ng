  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258050r1045137_rule
  version: 1
  description: Executable search paths within the initialization files of all local interactive RHEL 9 users must only contain
    paths that resolve to the system default or the users home directory.
  method: manual_or_external_check
  source_checks:
