      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:52701
    exports: []
    inline_content: 'Verify that all local interactive user initialization file executable search path statements do not contain
      statements that will reference a working directory other than user home directories with the following commands: $ sudo
      find /home -maxdepth 2 -type f -name ".[^.]*" -exec grep -iH path= {} \; PATH="$HOME/.local/bin:$HOME/bin:$PATH" If
      any local interactive user initialization files have executable search path statements that include directories outside
      of their home directory, and this is not documented with the ISSO as an operational requirement, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
