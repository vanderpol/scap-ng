  description: '<VulnDiscussion>Changes to any software components can have significant effects on the overall security of
    the operating system. This requirement ensures the software has not been tampered with and that it has been provided by
    a trusted vendor. Disabling kexec_load prevents an unsigned kernel image (that could be a windows kernel or modified vulnerable
    kernel) from being loaded. Kexec can be used subvert the entire secureboot process and should be avoided at all costs
    especially since it can load unsigned kernel images. The sysctl --system command will load settings from all system configuration
    files. All configuration files are sorted by their filename in lexicographical order, regardless of the directories in
    which they reside. If multiple files specify the same option, the entry in the file with the lexicographically latest
    name will take precedence. Files are read from directories in the following list from top to bottom. Once a file of a
    given filename is loaded, any file of the same name in subsequent directories is ignored. /etc/sysctl.d/*.conf /run/sysctl.d/*.conf
    /usr/local/lib/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf /lib/sysctl.d/*.conf /etc/sysctl.conf Satisfies: SRG-OS-000480-GPOS-00227,
    SRG-OS-000366-GPOS-00153</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
