            text: RHEL-09-271060 - RHEL 9 must prevent a user from overriding the screensaver lock-enabled setting for the
              graphical user interface.
          - attributes:
              family: unix
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Red Hat Enterprise Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'A session time-out lock is a temporary action taken when a user stops work and moves away from the immediate
              physical vicinity of the information system but does not log out because of the temporary nature of the absence.
              Rather than relying on the user to manually lock their operating system session prior to vacating the vicinity,
              operating systems need to be able to identify when a user''s session has idled and take action to initiate the
              session lock.


              The session lock is implemented at the point where session activity can be determined and/or controlled.


              Implementing session settings will have little value if a user is able to manipulate these settings from the
              defaults prescribed in the other requirements of this implementation guide.


              Satisfies: SRG-OS-000028-GPOS-00009, SRG-OS-000030-GPOS-00011'
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
