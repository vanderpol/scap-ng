assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-257889r1184302_rule
  version: 1
  description: All RHEL 9 local initialization files must have mode 0740 or less permissive.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:22101
    exports: []
    inline_content: 'Verify all local initialization files have a mode of "0740" or less permissive with the following command:
      Note: The example will be for the "disauser" user, who has a home directory of "/home/disauser". $ sudo find /home /root
      -maxdepth 2 -type f -name ".*" -perm /037 -ls 755 /home/disauser/.somepermissivefile If any local initialization files
      are returned, this indicates a mode more permissive than "0740", and this is a finding.'
    multi_check: null
    negate: null
    selector: manual
