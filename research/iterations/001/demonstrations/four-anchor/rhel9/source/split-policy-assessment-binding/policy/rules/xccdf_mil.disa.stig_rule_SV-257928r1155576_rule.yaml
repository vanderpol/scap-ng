  group_path:
  - xccdf_mil.disa.stig_group_V-257928
  description: '<VulnDiscussion>If a world-writable directory is not owned by root, sys, bin, or an application user identifier
    (UID), unauthorized users may be able to modify files created by others. The only authorized public directories are those
    temporary directories supplied with the system or those designed to be temporary file repositories. The setting is normally
    reserved for directories used by the system and by users for temporary file storage, (e.g., /tmp), and for directories
    requiring global read/write access. Satisfies: SRG-OS-000480-GPOS-00227, SRG-OS-000138-GPOS-00069</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
