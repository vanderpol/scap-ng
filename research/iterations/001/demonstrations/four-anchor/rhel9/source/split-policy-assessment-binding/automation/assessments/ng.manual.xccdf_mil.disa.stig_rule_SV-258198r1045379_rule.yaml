assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258198r1045379_rule
  version: 1
  description: RHEL 9 must audit all uses of the passwd command.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:79501
    exports: []
    inline_content: 'Verify RHEL 9 generates audit records for all account creations, modifications, disabling, and termination
      events that affect "/etc/gshadow" with the following command: $ sudo auditctl -l | egrep ''(/usr/bin/passwd)'' -a always,exit
      -S all -F path=/usr/bin/passwd -F perm=x -F auid>=1000 -F auid!=-1 -F key=privileged-passwd If the command does not
      return a line, or the line is commented out, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
