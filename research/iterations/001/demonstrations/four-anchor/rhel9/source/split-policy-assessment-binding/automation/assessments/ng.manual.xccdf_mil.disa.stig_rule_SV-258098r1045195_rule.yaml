assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258098r1045195_rule
  version: 1
  description: RHEL 9 must ensure the password complexity module is enabled in the system-auth file.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:60501
    exports: []
    inline_content: 'Verify RHEL 9 uses "pwquality" to enforce the password complexity rules in the system-auth file with
      the following command: $ grep pam_pwquality /etc/pam.d/system-auth password required pam_pwquality.so If the command
      does not return a line containing the value "pam_pwquality.so", or the line is commented out, this is a finding. If
      the system administrator (SA) can demonstrate that the required configuration is contained in a PAM configuration file
      included or substacked from the system-auth file, this is not a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
