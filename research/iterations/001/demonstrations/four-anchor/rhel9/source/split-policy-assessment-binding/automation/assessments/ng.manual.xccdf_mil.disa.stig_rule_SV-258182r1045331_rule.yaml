  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258182r1045331_rule
  version: 1
  description: RHEL 9 must audit all uses of the setfacl command.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:76301
    exports: []
    inline_content: 'Verify that RHEL 9 is configured to audit the execution of the "setfacl" command with the following command:
      $ sudo auditctl -l | grep setfacl -a always,exit -S all -F path=/usr/bin/setfacl -F perm=x -F auid>=1000 -F auid!=-1
      -F key=perm_mod If the command does not return a line, or the line is commented out, this is a finding.'
    multi_check: null
    negate: null
