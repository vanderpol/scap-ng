rule:
  id: xccdf_mil.disa.stig_rule_SV-258104r1015104_rule
  title: RHEL 9 passwords for new users or password changes must have a 24 hours minimum password lifetime restriction in
    /etc/login.defs.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
