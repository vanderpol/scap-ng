assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-257861r1044941_rule
  version: 1
  description: RHEL 9 must prevent files with the setuid and setgid bit set from being executed on the /boot directory.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:16501
    exports: []
    inline_content: 'Verify the /boot directory is mounted with the "nosuid" option with the following command: $ mount |
      grep ''\s/boot\s'' /dev/sda1 on /boot type xfs (rw,nosuid,relatime,seclabe,attr2,inode64,noquota) If the /boot file
      system does not have the "nosuid" option set, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
