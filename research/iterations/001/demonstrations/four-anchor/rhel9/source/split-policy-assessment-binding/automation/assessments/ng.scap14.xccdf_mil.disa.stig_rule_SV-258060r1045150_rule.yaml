      exports: []
      inline_content: 'Verify the "/etc/security/faillock.conf" file is configured to use a nondefault faillock directory
        to ensure contents persist after reboot with the following command: $ sudo grep -w dir /etc/security/faillock.conf
        dir = /var/log/faillock If the "dir" option is not set to a nondefault documented tally log directory or is missing
        or commented out, this is a finding.'
