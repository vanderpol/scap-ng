    exports: []
    inline_content: 'Note: If the system administrator demonstrates the use of an approved alternate multifactor authentication
      method, this requirement is not applicable. Verify the SSH private key files have a passcode. For each private key stored
      on the system, use the following command: $ sudo ssh-keygen -y -f /path/to/file The expected output is a password prompt:
      "Enter passphrase:" If the password prompt is not displayed, and the contents of the key are displayed, this is a finding.'
