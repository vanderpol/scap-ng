rule:
  id: xccdf_mil.disa.stig_rule_SV-258055r1045140_rule
  title: RHEL 9 must automatically lock the root account until the root account is released by an administrator when three
    unsuccessful logon attempts occur during a 15-minute time period.
  severity: medium
  weight: '10.0'
  role: null
