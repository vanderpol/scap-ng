  fix: 'To configure RHEL 9 to lock out the "root" account after a number of incorrect logon attempts using "pam_faillock.so",
    first enable the feature using the following command: $ sudo authselect enable-feature with-faillock Edit the "/etc/security/faillock.conf"
    by uncommenting or adding the following line: even_deny_root'
