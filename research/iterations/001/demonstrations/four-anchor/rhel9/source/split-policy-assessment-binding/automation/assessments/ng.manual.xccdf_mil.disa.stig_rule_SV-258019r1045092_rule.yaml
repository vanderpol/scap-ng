assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258019r1045092_rule
  version: 1
  description: RHEL 9 must be able to initiate directly a session lock for all connection types using smart card when the
    smart card is removed.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:46501
    exports: []
    inline_content: 'Note: This requirement assumes the use of the RHEL 9 default graphical user interface, the GNOME desktop
      environment. If the system does not have any graphical user interface installed, this requirement is Not Applicable.
      Verify RHEL 9 enables a user''s session lock until that user reestablishes access using established identification and
      authentication procedures with the following command: $ gsettings get org.gnome.settings-daemon.peripherals.smartcard
      removal-action ''lock-screen'' If the result is not ''lock-screen'', this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
      children:
