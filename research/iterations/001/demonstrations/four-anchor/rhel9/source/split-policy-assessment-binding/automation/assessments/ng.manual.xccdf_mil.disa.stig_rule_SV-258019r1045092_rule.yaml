      - name: check-content
        namespace: http://checklists.nist.gov/xccdf/1.2
        text: "Note: This requirement assumes the use of the RHEL 9 default graphical user interface, the GNOME desktop environment.\
          \ If the system does not have any graphical user interface installed, this requirement is Not Applicable.\n\nVerify\
          \ RHEL 9 enables a user's session lock until that user reestablishes access using established identification and\
          \ authentication procedures with the following command:\n\n$ gsettings get org.gnome.settings-daemon.peripherals.smartcard\
          \ removal-action\n \n'lock-screen'\n \nIf the result is not 'lock-screen', this is a finding."
      name: check
      namespace: http://checklists.nist.gov/xccdf/1.2
    system: http://scap.nist.gov/schema/ocil/2
