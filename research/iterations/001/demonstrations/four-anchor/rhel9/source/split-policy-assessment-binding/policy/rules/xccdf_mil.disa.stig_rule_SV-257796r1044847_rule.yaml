  fix: 'Enable auditing of processes that start prior to the audit daemon with the following command: $ sudo grubby --update-kernel=ALL
    --args="audit=1" Add or modify the following line in "/etc/default/grub" to ensure the configuration survives kernel updates:
    GRUB_CMDLINE_LINUX="audit=1"'
