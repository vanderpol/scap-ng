rule:
  id: xccdf_mil.disa.stig_rule_SV-257983r1045024_rule
  title: RHEL 9 SSHD must accept public key authentication.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-257983
  description: '<VulnDiscussion>Without the use of multifactor authentication, the ease of access to privileged functions
    is greatly increased. Multifactor authentication requires using two or more factors to achieve authentication. A privileged
    account is defined as an information system account with authorizations of a privileged user. A DOD common access card
    (CAC) with DOD-approved PKI is an example of multifactor authentication. Satisfies: SRG-OS-000105-GPOS-00052, SRG-OS-000106-GPOS-00053,
    SRG-OS-000107-GPOS-00054, SRG-OS-000108-GPOS-00055</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
