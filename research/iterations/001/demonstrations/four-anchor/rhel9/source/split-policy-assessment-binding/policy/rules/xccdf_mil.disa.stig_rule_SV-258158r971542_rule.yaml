rule:
  id: xccdf_mil.disa.stig_rule_SV-258158r971542_rule
  title: RHEL 9 must take action when allocated audit record storage volume reaches 95 percent of the audit record storage
    capacity.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
