        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:44501
      exports: []
      inline_content: 'Verify the SSH daemon performs strict mode checking of home directory configuration files with the
        following command: $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' ''
        | xargs sudo grep -iH ''^\s*strictmodes'' StrictModes yes If the "StrictModes" keyword is set to "no", the returned
        line is commented out, or no output is returned, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:44501
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify the SSH daemon performs strict mode checking of home directory configuration files with the following
            command:


            $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo grep
            -iH ''^\s*strictmodes''


            StrictModes yes


            If the "StrictModes" keyword is set to "no", the returned line is commented out, or no output is returned, this
            is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
