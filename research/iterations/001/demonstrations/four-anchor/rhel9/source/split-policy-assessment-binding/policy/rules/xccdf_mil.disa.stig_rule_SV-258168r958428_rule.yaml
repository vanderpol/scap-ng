  check: 'Verify that audit system is configured to flush to disk after every 100 records with the following command: $ sudo
    grep freq /etc/audit/auditd.conf freq = 100 If "freq" isn''t set to a value between "1" and "100", the value is missing,
    or the line is commented out, this is a finding.'
