assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-257814r1156057_rule
  version: 1
  description: RHEL 9 must disable core dumps for all users.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:7301
    exports: []
    inline_content: 'Note: If kernel dumps are disabled in accordance with RHEL-09-213040, this requirement is not applicable.
      Verify RHEL 9 disables core dumps for all users by issuing the following command: $ grep -rs core /etc/security/limits.conf
      /etc/security/limits.d/*.conf /etc/security/limits.conf:* hard core 0 This can be set as a global domain (with the *
      wildcard) but may be set differently for multiple domains. If the "core" item is missing or commented out, or the value
      is anything other than "0", and the need for core dumps is not documented with the information system security officer
      (ISSO) as an operational requirement for all domains that have the "core" item assigned, this is a finding. If entries
      exist for users or groups with a value set to anything other than "0", this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
      children:
