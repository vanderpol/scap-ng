  fix: 'Configure RHEL 9 to prevent a user from overriding the picture-uri setting for graphical user interfaces. In the file
    "/etc/dconf/db/local.d/00-security-settings", add or update the following lines: [org/gnome/desktop/screensaver] picture-uri=''''
    Prevent user modification by adding the following line to "/etc/dconf/db/local.d/locks/00-security-settings-lock": /org/gnome/desktop/screensaver/picture-uri
    Update the dconf system databases: $ sudo dconf update'
