  group_path:
  - xccdf_mil.disa.stig_group_V-258143
  description: <VulnDiscussion>Unintentionally running a rsyslog server accepting remote messages puts the system at increased
    risk. Malicious rsyslog messages sent to the server could exploit vulnerabilities in the server software itself, could
    introduce misleading information into the system's logs, or could fill the system's storage leading to a denial of service.
    If the system is intended to be a log aggregation server, its use must be documented with the information system security
    officer (ISSO).</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
