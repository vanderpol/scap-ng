rule:
  id: xccdf_mil.disa.stig_rule_SV-258143r1184329_rule
  title: RHEL 9 must be configured so that the rsyslog daemon does not accept log messages from other servers unless the server
    is being used for log aggregation.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
