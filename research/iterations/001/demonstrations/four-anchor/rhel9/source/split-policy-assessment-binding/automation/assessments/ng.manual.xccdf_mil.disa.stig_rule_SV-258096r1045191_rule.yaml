      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:60101
    exports: []
    inline_content: 'Verify the pam_faillock.so module is present in the "/etc/pam.d/password-auth" file: $ grep pam_faillock.so
      /etc/pam.d/password-auth auth required pam_faillock.so preauth auth required pam_faillock.so authfail account required
      pam_faillock.so If the pam_faillock.so module is not present in the "/etc/pam.d/password-auth" file with the "preauth"
      line listed before pam_unix.so, this is a finding. If the system administrator (SA) can demonstrate that the required
      configuration is contained in a PAM configuration file included or substacked from the system-auth file, this is not
      a finding.'
    multi_check: null
    negate: null
