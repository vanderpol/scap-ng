  fix: 'Configure RHEL 9 to use 100000 hashing rounds for hashing passwords. Add or modify the following line in "/etc/pam.d/password-auth"
    and set "rounds" to "100000". password sufficient pam_unix.so sha512 rounds=100000 Note: Running authselect will overwrite
    this value unless a custom authselect policy is created.'
