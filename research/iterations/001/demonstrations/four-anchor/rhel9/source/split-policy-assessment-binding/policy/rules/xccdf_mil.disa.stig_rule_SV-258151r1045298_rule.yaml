  id: xccdf_mil.disa.stig_rule_SV-258151r1045298_rule
  title: RHEL 9 audit package must be installed.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
