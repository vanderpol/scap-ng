  fix: 'Configure the operating system to enable the blocking of unauthorized peripherals with the following command: Note:
    This command must be run from a root shell and will create an allow list for any usb devices currently connected to the
    system. # usbguard generate-policy --no-hash > /etc/usbguard/rules.conf Note: Enabling and starting usbguard without properly
    configuring it for an individual system will immediately prevent any access over a usb device such as a keyboard or mouse.'
