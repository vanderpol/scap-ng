          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify that RHEL 9 disables the ability to load the firewire-core kernel module with the following command:\n\
            \n$ grep -r firewire-core /etc/modprobe.conf /etc/modprobe.d/* \n\ninstall firewire-core /bin/false\nblacklist\
            \ firewire-core\n\nIf the command does not return any output, or the lines are commented out, and use of firewire-core\
            \ is not documented with the information system security officer (ISSO) as an operational requirement, this is\
            \ a finding."
        name: check
