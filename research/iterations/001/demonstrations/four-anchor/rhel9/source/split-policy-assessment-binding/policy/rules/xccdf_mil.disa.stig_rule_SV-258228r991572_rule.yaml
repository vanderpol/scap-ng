  check: 'Verify the audit system prevents unauthorized changes to logon UIDs with the following command: $ sudo grep -i immutable
    /etc/audit/audit.rules --loginuid-immutable If the "--loginuid-immutable" option is not returned in the "/etc/audit/audit.rules",
    or the line is commented out, this is a finding.'
