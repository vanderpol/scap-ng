        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:45101
      exports: []
      inline_content: 'Verify RHEL 9 displays the Standard Mandatory DOD Notice and Consent Banner before granting access
        to the operating system via a graphical user logon. Note: This requirement assumes the use of the RHEL 9 default graphical
        user interface, the GNOME desktop environment. If the system does not have any graphical user interface installed,
        this requirement is Not Applicable. Determine if the operating system displays a banner at the logon screen with the
        following command: $ gsettings get org.gnome.login-screen banner-message-enable true If the result is "false", this
        is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:45101
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify RHEL 9 displays the Standard Mandatory DOD Notice and Consent Banner before granting access to the
            operating system via a graphical user logon.


            Note: This requirement assumes the use of the RHEL 9 default graphical user interface, the GNOME desktop environment.
            If the system does not have any graphical user interface installed, this requirement is Not Applicable.


            Determine if the operating system displays a banner at the logon screen with the following command:


            $ gsettings get org.gnome.login-screen banner-message-enable


            true


            If the result is "false", this is a finding.'
        name: check
