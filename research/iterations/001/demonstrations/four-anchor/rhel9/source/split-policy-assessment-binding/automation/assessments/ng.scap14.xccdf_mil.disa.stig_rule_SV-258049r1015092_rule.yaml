              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Red Hat Enterprise Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'Inactive identifiers pose a risk to systems and applications because attackers may exploit an inactive
              identifier and potentially obtain undetected access to the system.


              Disabling inactive accounts ensures that accounts which may not have been responsibly removed are not available
              to attackers who may have compromised their credentials.


              Owners of inactive accounts will not notice if unauthorized access to their user account has been obtained.'
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
