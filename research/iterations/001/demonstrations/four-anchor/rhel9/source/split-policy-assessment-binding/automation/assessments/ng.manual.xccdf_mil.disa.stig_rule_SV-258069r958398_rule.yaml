assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258069r958398_rule
  version: 1
  description: RHEL 9 must limit the number of concurrent sessions to ten for all accounts and/or account types.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:55301
    exports: []
    inline_content: 'Verify RHEL 9 limits the number of concurrent sessions to "10" for all accounts and/or account types
      with the following command: $ grep -r -s maxlogins /etc/security/limits.conf /etc/security/limits.d/*.conf /etc/security/limits.conf:*
      hard maxlogins 10 This can be set as a global domain (with the * wildcard) but may be set differently for multiple domains.
      If the "maxlogins" item is missing, commented out, or the value is set greater than "10" and is not documented with
      the information system security officer (ISSO) as an operational requirement for all domains that have the "maxlogins"
      item assigned, this is a finding.'
    multi_check: null
    negate: null
