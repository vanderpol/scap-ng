          text: 'Verify RHEL 9 is configured to audit successful/unsuccessful attempts to use the "rename", "unlink", "rmdir",
            "renameat", and "unlinkat" system calls with the following command:


            $ sudo auditctl -l | grep ''rename\|unlink\|rmdir''


            -a always,exit -F arch=b32 -S unlink,rename,rmdir,unlinkat,renameat -F auid>=1000 -F auid!=-1 -F key=delete

            -a always,exit -F arch=b64 -S rename,rmdir,unlink,unlinkat,renameat -F auid>=1000 -F auid!=-1 -F key=delete


            If the command does not return an audit rule for "rename", "unlink", "rmdir", "renameat", and "unlinkat" or any
            of the lines returned are commented out, this is a finding.'
