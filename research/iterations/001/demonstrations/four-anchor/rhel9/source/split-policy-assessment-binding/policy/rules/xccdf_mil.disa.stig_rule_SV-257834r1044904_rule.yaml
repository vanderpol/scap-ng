rule:
  id: xccdf_mil.disa.stig_rule_SV-257834r1044904_rule
  title: RHEL 9 must not have the tuned package installed.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-257834
  description: '<VulnDiscussion>It is detrimental for operating systems to provide, or install by default, functionality exceeding
    requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore may
    remain unsecured. They increase the risk to the platform by providing additional attack vectors. Operating systems are
    capable of providing a wide variety of functions and services. Some of the functions and services, provided by default,
    may not be necessary to support essential organizational operations (e.g., key missions, functions). The tuned package
    contains a daemon that tunes the system settings dynamically. It does so by monitoring the usage of several system components
    periodically. Based on that information, components will then be put into lower or higher power savings modes to adapt
    to the current usage. The tuned package is not needed for normal OS operations. Satisfies: SRG-OS-000095-GPOS-00049, SRG-OS-000480-GPOS-00227</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
