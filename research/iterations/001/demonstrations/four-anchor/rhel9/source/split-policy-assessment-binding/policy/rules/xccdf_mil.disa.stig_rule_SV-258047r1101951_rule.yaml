rule:
  id: xccdf_mil.disa.stig_rule_SV-258047r1101951_rule
  title: RHEL 9 must automatically expire temporary accounts within 72 hours.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
