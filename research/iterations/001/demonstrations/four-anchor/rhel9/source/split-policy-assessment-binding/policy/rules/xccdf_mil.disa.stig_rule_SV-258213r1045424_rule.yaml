  fix: 'Configure the audit system to generate an audit event for any successful/unsuccessful uses of the "reboot" command
    by adding or updating the following rule in the "/etc/audit/rules.d/audit.rules" file: -a always,exit -F path=/usr/sbin/reboot
    -F perm=x -F auid>=1000 -F auid!=unset -k privileged-reboot To load the rules to the kernel immediately, use the following
    command: $ sudo augenrules --load'
