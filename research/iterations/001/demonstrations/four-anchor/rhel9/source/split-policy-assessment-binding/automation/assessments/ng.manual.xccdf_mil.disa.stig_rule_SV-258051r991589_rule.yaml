assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258051r991589_rule
  version: 1
  description: All RHEL 9 local interactive users must have a home directory assigned in the /etc/passwd file.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:52901
    exports: []
    inline_content: 'Verify that interactive users on the system have a home directory assigned with the following command:
      $ sudo awk -F: ''($3>=1000)&&($7 !~ /nologin/){print $1, $3, $6}'' /etc/passwd smithk:x:1000:1000:smithk:/home/smithk:/bin/bash
      scsaustin:x:1001:1001:scsaustin:/home/scsaustin:/bin/bash djohnson:x:1002:1002:djohnson:/home/djohnson:/bin/bash Inspect
      the output and verify that all interactive users (normally users with a user identifier (UID) greater that 1000) have
      a home directory defined. If users home directory is not defined, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
