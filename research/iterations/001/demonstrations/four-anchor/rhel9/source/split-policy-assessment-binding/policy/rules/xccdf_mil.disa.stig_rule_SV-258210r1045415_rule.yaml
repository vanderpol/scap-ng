rule:
  id: xccdf_mil.disa.stig_rule_SV-258210r1045415_rule
  title: RHEL 9 must audit all uses of the mount command.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-258210
  description: '<VulnDiscussion>Without generating audit records that are specific to the security and mission needs of the
    organization, it would be difficult to establish, correlate, and investigate the events relating to an incident or identify
    those responsible for one. Audit records can be generated from various components within the information system (e.g.,
    module or policy filter). When a user logs on, the auid is set to the uid of the account that is being authenticated.
    Daemons are not user sessions and have the loginuid set to -1. The auid representation is an unsigned 32-bit integer,
    which equals 4294967295. The audit system interprets -1, 4294967295, and "unset" in the same way. The system call rules
    are loaded into a matching engine that intercepts each system call made by all programs on the system. Therefore, it is
    very important to use system call rules only when absolutely necessary since these affect performance. The more rules,
    the bigger the performance hit. The performance can be helped, however, by combining system calls into one rule whenever
    possible. Satisfies: SRG-OS-000037-GPOS-00015, SRG-OS-000042-GPOS-00020, SRG-OS-000062-GPOS-00031, SRG-OS-000392-GPOS-00172,
    SRG-OS-000462-GPOS-00206, SRG-OS-000471-GPOS-00215</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
