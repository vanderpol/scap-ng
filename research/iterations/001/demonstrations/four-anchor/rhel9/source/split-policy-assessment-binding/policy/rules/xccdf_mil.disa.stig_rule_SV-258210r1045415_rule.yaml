  fix: 'Configure RHEL 9 to generate audit records upon successful/unsuccessful attempts to use the "mount" command by adding
    or updating the following rule in "/etc/audit/rules.d/audit.rules": -a always,exit -F path=/usr/bin/mount -F perm=x -F
    auid>=1000 -F auid!=unset -k privileged-mount To load the rules to the kernel immediately, use the following command:
    $ sudo augenrules --load'
