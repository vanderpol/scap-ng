assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258153r1038966_rule
  version: 1
  description: RHEL 9 audit system must take appropriate action when an error writing to the audit storage volume occurs.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:70701
    exports: []
    inline_content: 'Verify RHEL 9 takes the appropriate action when an audit processing failure occurs. Check that RHEL 9
      takes the appropriate action when an audit processing failure occurs with the following command: $ sudo grep disk_error_action
      /etc/audit/auditd.conf disk_error_action = HALT If the value of the "disk_error_action" option is not "SYSLOG", "SINGLE",
      or "HALT", or the line is commented out, ask the system administrator (SA) to indicate how the system takes appropriate
      action when an audit process failure occurs. If there is no evidence of appropriate action, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
