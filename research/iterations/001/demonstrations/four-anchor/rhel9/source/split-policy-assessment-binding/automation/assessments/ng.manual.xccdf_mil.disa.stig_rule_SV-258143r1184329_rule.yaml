assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258143r1184329_rule
  version: 1
  description: RHEL 9 must be configured so that the rsyslog daemon does not accept log messages from other servers unless
    the server is being used for log aggregation.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:68901
    exports: []
    inline_content: 'Note: If the system administrator (SA) can demonstrate that another tool (e.g., SPLUNK) is being used
      to manage log off-load and aggregation in lieu of rsyslog, this is not applicable. Verify RHEL 9 is not configured to
      receive remote logs using rsyslog with the following command: $ ss -tulnp | grep rsyslog If no output is returned, rsyslog
      is not listening for remote messages and is compliant. If output appears, check for configured ports (514 is the default
      for syslog). Check for remote logging configuration in rsyslog by examining the rsyslog configuration files: $ sudo
      grep -E ''InputTCPServerRun|UDPServerRun|RELPServerRun|imtcp|imudp|imrelp'' /etc/rsyslog.conf /etc/rsyslog.d/* If this
      command returns uncommented lines enabling network listeners, the system is accepting remote logs. If this system is
      not documented and authorized as a log aggregation server, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
      children:
