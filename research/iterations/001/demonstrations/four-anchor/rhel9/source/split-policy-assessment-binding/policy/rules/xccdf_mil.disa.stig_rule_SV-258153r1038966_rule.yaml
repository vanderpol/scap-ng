rule:
  id: xccdf_mil.disa.stig_rule_SV-258153r1038966_rule
  title: RHEL 9 audit system must take appropriate action when an error writing to the audit storage volume occurs.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
