  check: 'Verify that RHEL 9 disables the ability to load the cramfs kernel module with the following command: $ grep -r cramfs
    /etc/modprobe.conf /etc/modprobe.d/* install cramfs /bin/false blacklist cramfs If the command does not return any output
    or the lines are commented out, and use of cramfs is not documented with the information system security officer (ISSO)
    as an operational requirement, this is a finding.'
