rule:
  id: xccdf_mil.disa.stig_rule_SV-257880r1044951_rule
  title: RHEL 9 must disable mounting of cramfs.
  severity: low
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
