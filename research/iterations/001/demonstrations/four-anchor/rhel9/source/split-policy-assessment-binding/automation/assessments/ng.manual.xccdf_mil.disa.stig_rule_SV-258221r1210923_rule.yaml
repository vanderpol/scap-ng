  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258221r1210923_rule
  version: 1
  description: RHEL 9 must generate audit records for all account creations, modifications, disabling, and termination events
    that affect /etc/opasswd.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:84101
    exports: []
    inline_content: 'Verify RHEL 9 generates audit records for all account creations, modifications, disabling, and termination
      events that affect "/etc/security/opasswd" with the following command: $ sudo auditctl -l | egrep ''(/etc/security/opasswd)''
      -a always,exit -F arch=b32 -F path=/etc/security/opasswd -F perm=wa -k identity -a always,exit -F arch=b64 -F path=/etc/security/opasswd
      -F perm=wa -k identity If the command does not return a line, or the line is commented out, this is a finding.'
    multi_check: null
    negate: null
