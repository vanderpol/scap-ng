        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:75101
      exports: []
      inline_content: 'Verify RHEL 9 is configured to audit the execution of the "execve" system call with the following command:
        $ sudo auditctl -l | grep execve -a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -k execpriv -a always,exit
        -F arch=b64 -S execve -C uid!=euid -F euid=0 -k execpriv -a always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0
        -k execpriv -a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -k execpriv If the command does not return
        all lines, or the lines are commented out, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:75101
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify RHEL 9 is configured to audit the execution of the "execve" system call with the following command:


            $ sudo auditctl -l | grep execve


            -a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -k execpriv

            -a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -k execpriv

            -a always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0 -k execpriv

            -a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -k execpriv


            If the command does not return all lines, or the lines are commented out, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
