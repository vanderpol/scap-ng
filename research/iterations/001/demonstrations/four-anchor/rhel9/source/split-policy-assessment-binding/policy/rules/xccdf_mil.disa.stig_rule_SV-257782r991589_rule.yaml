  id: xccdf_mil.disa.stig_rule_SV-257782r991589_rule
  title: RHEL 9 must enable the hardware random number generator entropy gatherer service.
  severity: low
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
