  fix: 'If /proc/cpuinfo shows that one or more processors do not enable ExecShield (lack the "nx" feature flag), verify that
    the NX/XD feature is not disabled in the BIOS or UEFI. If it is disabled, enable it. If the noexec option is present on
    the kernel command line, update the GRUB 2 bootloader configuration to remove it by running the following command: $ sudo
    grubby --update-kernel=ALL --remove-args=noexec'
