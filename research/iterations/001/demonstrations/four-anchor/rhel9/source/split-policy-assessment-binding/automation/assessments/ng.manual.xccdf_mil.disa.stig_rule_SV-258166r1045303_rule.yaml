assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258166r1045303_rule
  version: 1
  description: RHEL 9 audit log directory must be owned by root to prevent unauthorized read access.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:73301
    exports: []
    inline_content: 'Verify the audit logs directory is owned by "root". Determine where the audit logs are stored with the
      following command: $ sudo grep -iw log_file /etc/audit/auditd.conf log_file = /var/log/audit/audit.log Using the location
      of the audit log file, determine if the audit log directory is owned by "root" using the following command: $ sudo stat
      -c ''%U %n'' /var/log/audit root /var/log/audit If the audit log directory is not owned by "root", this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
