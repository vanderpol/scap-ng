assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258004r1045067_rule
  version: 1
  description: RHEL 9 SSH daemon must not allow Kerberos authentication.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:43701
    exports: []
    inline_content: 'Verify the SSH daemon does not allow Kerberos authentication with the following command: $ sudo /usr/sbin/sshd
      -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo grep -iH ''^\s*kerberosauthentication''
      KerberosAuthentication no If the value is returned as "yes", the returned line is commented out, no output is returned,
      and the use of Kerberos authentication has not been documented with the information system security officer (ISSO),
      this is a finding.'
    multi_check: null
    negate: null
    selector: manual
