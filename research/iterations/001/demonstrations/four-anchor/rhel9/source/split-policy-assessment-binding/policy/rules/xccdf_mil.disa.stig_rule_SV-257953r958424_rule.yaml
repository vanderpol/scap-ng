rule:
  id: xccdf_mil.disa.stig_rule_SV-257953r958424_rule
  title: RHEL 9 must forward mail from postmaster to the root account using a postfix alias.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
