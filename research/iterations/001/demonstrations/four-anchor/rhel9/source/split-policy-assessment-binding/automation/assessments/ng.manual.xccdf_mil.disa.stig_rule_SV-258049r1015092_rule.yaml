    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:52501
    exports: []
    inline_content: 'Verify that RHEL 9 account identifiers (individuals, groups, roles, and devices) are disabled after 35
      days of inactivity with the following command: Check the account inactivity value by performing the following command:
      $ sudo grep -i inactive /etc/default/useradd INACTIVE=35 If "INACTIVE" is set to "-1", a value greater than "35", or
      is commented out, this is a finding.'
