rule:
  id: xccdf_mil.disa.stig_rule_SV-257855r1044936_rule
  title: RHEL 9 must prevent code from being executed on file systems that are imported via Network File System (NFS).
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
