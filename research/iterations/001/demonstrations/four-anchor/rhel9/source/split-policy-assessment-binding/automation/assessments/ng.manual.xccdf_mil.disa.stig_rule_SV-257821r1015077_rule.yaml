assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-257821r1015077_rule
  version: 1
  description: RHEL 9 must check the GPG signature of locally installed software packages before installation.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:8701
    exports: []
    inline_content: 'Verify that dnf always checks the GPG signature of locally installed software packages before installation:
      $ grep localpkg_gpgcheck /etc/dnf/dnf.conf localpkg_gpgcheck=1 If "localpkg_gpgcheck" is not set to "1", or if the option
      is missing or commented out, ask the system administrator how the GPG signatures of local software packages are being
      verified. If there is no process to verify GPG signatures that is approved by the organization, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
