  id: xccdf_mil.disa.stig_rule_SV-257794r1069362_rule
  title: RHEL 9 must clear memory when it is freed to prevent use-after-free attacks.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-257794
  description: '<VulnDiscussion>Some adversaries launch attacks with the intent of executing code in nonexecutable regions
    of memory or in memory locations that are prohibited. Security safeguards employed to protect memory include, for example,
    data execution prevention and address space layout randomization. Data execution prevention safeguards can be either hardware-enforced
    or software-enforced with hardware providing the greater strength of mechanism. Poisoning writes an arbitrary value to
    freed pages, so any modification or reference to that page after being freed or before being initialized will be detected
    and prevented. This prevents many types of use-after-free vulnerabilities at little performance cost. Also prevents leak
    of data and detection of corrupted memory. init_on_free is a Linux kernel boot parameter that enhances security by initializing
    memory regions when they are freed, preventing data leakage. This process ensures that stale data in freed memory cannot
    be accessed by malicious programs. SLUB canaries add a randomized value (canary) at the end of SLUB-allocated objects
    to detect memory corruption caused by buffer overflows or underflows. Redzoning adds padding (red zones) around SLUB-allocated
    objects to detect overflows or underflows by triggering a fault when adjacent memory is accessed. SLUB canaries are often
    more efficient and provide stronger detection against buffer overflows compared to redzoning. SLUB canaries are supported
    in hardened Linux kernels like the ones provided by Linux-hardened. SLAB objects are blocks of physically contiguous memory.
    SLUB is the unqueued SLAB allocator. Satisfies: SRG-OS-000433-GPOS-00192, SRG-OS-000134-GPOS-00068</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
