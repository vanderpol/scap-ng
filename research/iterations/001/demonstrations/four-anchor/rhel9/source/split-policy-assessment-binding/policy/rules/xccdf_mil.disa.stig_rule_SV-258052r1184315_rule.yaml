rule:
  id: xccdf_mil.disa.stig_rule_SV-258052r1184315_rule
  title: All RHEL 9 local interactive user home directories defined in the /etc/passwd file must exist.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
