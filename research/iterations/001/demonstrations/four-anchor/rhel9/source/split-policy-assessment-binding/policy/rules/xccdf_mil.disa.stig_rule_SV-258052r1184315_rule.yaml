  check: 'Verify the assigned home directories of all interactive users on the system exist with the following command: $
    sudo pwck -r The output should not return any interactive (human) users. Ask the system administrator (SA) if any users
    found without home directories are local interactive users. If the SA is unable to provide a response, check for users
    with a user identifier (UID) of 1000 or greater with the following command: $ awk -F: ''($3>=1000)&&($1!="nobody"){print
    $1 ":" $3}'' /etc/passwd If any interactive users do not have a home directory assigned, this is a finding.'
