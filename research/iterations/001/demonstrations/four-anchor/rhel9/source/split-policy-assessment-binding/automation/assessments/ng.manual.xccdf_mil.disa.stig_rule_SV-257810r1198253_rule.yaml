assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-257810r1198253_rule
  version: 1
  description: RHEL 9 must disable access to network bpf system call from nonprivileged processes.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:6501
    exports: []
    inline_content: 'Verify RHEL 9 prevents privilege escalation through the kernel by disabling access to the bpf system
      call. Check the status of the "kernel.unprivileged_bpf_disabled" kernel parameter with the following command: $ sysctl
      kernel.unprivileged_bpf_disabled kernel.unprivileged_bpf_disabled = 1 If "kernel.unprivileged_bpf_disabled" is not set
      to "1", or is missing, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
