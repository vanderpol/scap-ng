      text: '<VulnDiscussion>It is detrimental for operating systems to provide, or install by default, functionality exceeding
        requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore
        may remain unsecured. They increase the risk to the platform by providing additional attack vectors.


        Failing to disconnect unused protocols can result in a system compromise.


        The Transparent Inter Process Communication (TIPC) is a protocol that is specially designed for intra-cluster communication.
        It can be configured to transmit messages either on UDP or directly across Ethernet. Message delivery is sequence
        guaranteed, loss free and flow controlled. Disabling TIPC protects the system against exploitation of any flaws in
        its implementation.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
