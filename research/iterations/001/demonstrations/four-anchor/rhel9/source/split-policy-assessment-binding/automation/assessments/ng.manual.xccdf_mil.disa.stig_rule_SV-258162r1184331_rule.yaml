assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258162r1184331_rule
  version: 1
  description: RHEL 9 must take appropriate action when the internal event queue is full.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:72501
    exports: []
    inline_content: 'Verify that RHEL 9 audit system is configured to take an appropriate action when the internal event queue
      is full: $ sudo grep -i overflow_action /etc/audit/auditd.conf overflow_action = syslog If the value of the "overflow_action"
      option is not set to "syslog", "single", "halt" or the line is commented out, ask the system administrator (SA) to indicate
      how the audit logs are offloaded to a different system or media. If there is no evidence that the audit system is configured
      to off-load the audit logs to another system or media and if the overflow action is not set to take appropriate action
      if the internal event queue becomes full, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
