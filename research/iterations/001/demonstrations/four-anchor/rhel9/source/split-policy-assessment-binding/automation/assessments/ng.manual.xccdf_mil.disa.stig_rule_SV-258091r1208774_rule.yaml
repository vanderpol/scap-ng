  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258091r1208774_rule
  version: 1
  description: RHEL 9 must ensure the password complexity module in the system-auth file is configured for three retries or
    less.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:59501
    exports: []
    inline_content: 'Verify RHEL 9 is configured to limit the "pwquality" retry option to "3". Check for the use of the retry
      option in the security directory with the following command: $ grep -w retry /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
      retry = 3 If the value of "retry" is set to "0" or greater than "3", or is missing, this is a finding.'
    multi_check: null
    negate: null
