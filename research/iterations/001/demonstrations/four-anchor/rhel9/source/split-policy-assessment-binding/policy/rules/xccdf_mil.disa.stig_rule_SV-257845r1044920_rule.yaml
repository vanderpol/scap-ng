  id: xccdf_mil.disa.stig_rule_SV-257845r1044920_rule
  title: RHEL 9 must use a separate file system for /var.
  severity: low
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
