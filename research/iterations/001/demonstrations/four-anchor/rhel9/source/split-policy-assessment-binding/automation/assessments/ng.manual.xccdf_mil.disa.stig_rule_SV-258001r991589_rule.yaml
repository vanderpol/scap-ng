assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258001r991589_rule
  version: 1
  description: RHEL 9 SSH public host key files must have mode 0644 or less permissive.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:43301
    exports: []
    inline_content: 'Verify the SSH public host key files have a mode of "0644" or less permissive with the following command:
      Note: SSH public key files may be found in other directories on the system depending on the installation. $ sudo stat
      -c "%a %n" /etc/ssh/*.pub 644 /etc/ssh/ssh_host_dsa_key.pub 644 /etc/ssh/ssh_host_ecdsa_key.pub 644 /etc/ssh/ssh_host_ed25519_key.pub
      644 /etc/ssh/ssh_host_rsa_key.pub If any key.pub file has a mode more permissive than "0644", this is a finding.'
