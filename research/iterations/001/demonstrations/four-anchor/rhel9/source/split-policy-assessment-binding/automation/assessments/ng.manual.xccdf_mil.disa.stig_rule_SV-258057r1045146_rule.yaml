  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258057r1045146_rule
  version: 1
  description: RHEL 9 must maintain an account lock until the locked account is released by an administrator.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
