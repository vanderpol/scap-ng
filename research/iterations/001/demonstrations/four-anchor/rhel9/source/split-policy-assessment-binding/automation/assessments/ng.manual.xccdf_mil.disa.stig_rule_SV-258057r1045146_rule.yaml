    exports: []
    inline_content: 'Verify RHEL 9 is configured to lock an account until released by an administrator after three unsuccessful
      logon attempts with the command: $ sudo grep -w unlock_time /etc/security/faillock.conf unlock_time = 0 If the "unlock_time"
      option is not set to "0" or the line is missing or commented out, this is a finding.'
