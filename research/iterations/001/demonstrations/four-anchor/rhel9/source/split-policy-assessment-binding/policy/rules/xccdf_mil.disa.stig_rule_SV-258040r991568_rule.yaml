rule:
  id: xccdf_mil.disa.stig_rule_SV-258040r991568_rule
  title: RHEL 9 wireless network adapters must be disabled.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
