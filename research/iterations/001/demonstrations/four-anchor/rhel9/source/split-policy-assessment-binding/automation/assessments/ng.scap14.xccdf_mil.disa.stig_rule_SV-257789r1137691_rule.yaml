          text: "Verify the RHEL 9 boot loader superuser account has been set with the following command:\n\n$ sudo grep -A1\
            \ \"superusers\" /etc/grub2.cfg \n\nset superusers=\"<accountname>\"\nexport superusers\npassword_pbkdf2 <accountname>\
            \ ${GRUB2_PASSWORD}\n \nVerify <accountname> is not a common name such as root, admin, or administrator.\n\nIf\
