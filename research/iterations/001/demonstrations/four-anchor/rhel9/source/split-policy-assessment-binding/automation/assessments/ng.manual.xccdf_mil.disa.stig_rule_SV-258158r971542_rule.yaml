assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-258158r971542_rule
  version: 1
  description: RHEL 9 must take action when allocated audit record storage volume reaches 95 percent of the audit record storage
    capacity.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:71701
    exports: []
    inline_content: 'Verify RHEL 9 takes action when allocated audit record storage volume reaches 95 percent of the repository
      maximum audit record storage capacity with the following command: $ sudo grep -w admin_space_left /etc/audit/auditd.conf
      admin_space_left = 5% If the value of the "admin_space_left" keyword is not set to 5 percent of the storage volume allocated
      to audit logs, or if the line is commented out, ask the system administrator (SA) to indicate how the system is taking
      action if the allocated storage is about to reach capacity. If the "space_left" value is not configured to the correct
      value, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
      children:
