        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify the RHEL 9 SSHD is configured to allow for the UsePAM interface with the following command:


            $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo grep
