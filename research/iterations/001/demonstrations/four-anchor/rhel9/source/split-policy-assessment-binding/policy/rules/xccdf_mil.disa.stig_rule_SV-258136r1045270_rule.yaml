  description: <VulnDiscussion>RHEL 9 installation media ships with an optional file integrity tool called Advanced Intrusion
    Detection Environment (AIDE). AIDE is highly configurable at install time. This requirement assumes the "aide.conf" file
    is under the "/etc" directory. File integrity tools use cryptographic hashes for verifying file contents and directories
    have not been altered. These hashes must be FIPS 140-3-approved cryptographic hashes.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
