  id: xccdf_mil.disa.stig_rule_SV-258136r1045270_rule
  title: RHEL 9 must use a file integrity tool that is configured to use FIPS 140-3-approved cryptographic hashes for validating
    file contents and directories.
  severity: medium
  weight: '10.0'
  role: null
