  group_path:
  - xccdf_mil.disa.stig_group_V-258039
  description: '<VulnDiscussion>This requirement applies to wireless peripheral technologies (e.g., wireless mice, keyboards,
    displays, etc.) used with RHEL 9 systems. Wireless peripherals (e.g., Wi-Fi/Bluetooth/IR keyboards, mice and pointing
    devices, and near field communications [NFC]) present a unique challenge by creating an open, unsecured port on a computer.
    Wireless peripherals must meet DOD requirements for wireless data transmission and be approved for use by the Authorizing
    Official (AO). Even though some wireless peripherals, such as mice and pointing devices, do not ordinarily carry information
    that need to be protected, modification of communications with these wireless peripherals may be used to compromise the
    RHEL 9 operating system. Satisfies: SRG-OS-000095-GPOS-00049, SRG-OS-000300-GPOS-00118</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
