  check: 'Verify that RHEL 9 disables the ability to load the Bluetooth kernel module with the following command: $ sudo grep
    -r bluetooth /etc/modprobe.conf /etc/modprobe.d/* install bluetooth /bin/false blacklist bluetooth If the command does
    not return any output, or the lines are commented out, and use of Bluetooth is not documented with the information system
    security officer (ISSO) as an operational requirement, this is a finding.'
