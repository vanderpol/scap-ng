  fix: 'Configure RHEL 9 to disable the Bluetooth adapter when not in use. Create or modify the "/etc/modprobe.d/bluetooth.conf"
    file with the following lines: install bluetooth /bin/false blacklist bluetooth Reboot the system for the settings to
    take effect.'
