          - name: title
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: RHEL-09-213060 - RHEL 9 must disable the Stream Control Transmission Protocol (SCTP) kernel module.
          - attributes:
              family: unix
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Red Hat Enterprise Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements
              or mission objectives. These unnecessary capabilities or services are often overlooked and therefore may remain
              unsecured. They increase the risk to the platform by providing additional attack vectors.


              Failing to disconnect unused protocols can result in a system compromise.


              The Stream Control Transmission Protocol (SCTP) is a transport layer protocol, designed to support the idea
              of message-oriented communication, with several streams of messages within one connection. Disabling SCTP protects
              the system against exploitation of any flaws in its implementation.'
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
