      exports: []
      inline_content: 'Verify that RHEL 9 disables the ability to load the sctp kernel module with the following command:
        $ grep -r sctp /etc/modprobe.conf /etc/modprobe.d/* install sctp /bin/false blacklist sctp If the command does not
        return any output, or the lines are commented out, and use of sctp is not documented with the information system security
        officer (ISSO) as an operational requirement, this is a finding.'
