        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:49501
      exports: []
      inline_content: 'Verify that RHEL 9 disables the ability to load the USB Storage kernel module with the following command:
        $ grep -r usb-storage /etc/modprobe.conf /etc/modprobe.d/* install usb-storage /bin/false blacklist usb-storage If
        the command does not return any output, or either line is commented out, and use of USB Storage is not documented
        with the information system security officer (ISSO) as an operational requirement, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
