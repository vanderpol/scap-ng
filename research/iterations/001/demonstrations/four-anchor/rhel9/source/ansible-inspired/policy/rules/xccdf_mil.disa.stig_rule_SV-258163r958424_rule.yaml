  - kind: cpe_name
    name: cpe:/o:redhat:enterprise_linux:9.0
    ref: cpe:/o:redhat:enterprise_linux:9.0
  extends: null
  fix: 'Configure "auditd" service to notify the SA and ISSO in the event of an audit processing failure. Edit the following
    line in "/etc/audit/auditd.conf" to ensure that administrators are notified via email for those situations: action_mail_acct
    = root The audit daemon must be restarted for changes to take effect.'
