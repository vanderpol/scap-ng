  extends: null
  fix: Allocate enough storage capacity for at least one week of audit records when audit records are not immediately sent
    to a central audit record storage facility. If audit records are stored on a partition made specifically for audit records,
    resize the partition with sufficient space to contain one week of audit records. If audit records are not stored on a
    partition made specifically for audit records, a new partition with sufficient space will need be to be created.
