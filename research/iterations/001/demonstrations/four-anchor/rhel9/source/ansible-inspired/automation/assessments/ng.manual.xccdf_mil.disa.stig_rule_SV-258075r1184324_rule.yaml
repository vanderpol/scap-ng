      exports: []
      inline_content: 'Verify the "umask" setting is configured correctly in the "/etc/profile" file with the following command:
        Note: If the value of the "umask" parameter is set to "000" in the "/etc/profile" file, the Severity is raised to
        a CAT I. $ grep umask /etc/profile umask 077 If the value for the "umask" parameter is not "077", or the "umask" parameter
        is missing or is commented out, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
