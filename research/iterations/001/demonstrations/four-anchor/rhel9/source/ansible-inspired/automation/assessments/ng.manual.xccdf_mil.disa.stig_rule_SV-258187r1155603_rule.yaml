        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:77301
      exports: []
      inline_content: 'Verify RHEL 9 is configured to audit successful/unsuccessful attempts to use the "rename", "unlink",
        "rmdir", "renameat", and "unlinkat" system calls with the following command: $ sudo auditctl -l | grep ''rename\|unlink\|rmdir''
        -a always,exit -F arch=b32 -S unlink,rename,rmdir,unlinkat,renameat -F auid>=1000 -F auid!=-1 -F key=delete -a always,exit
        -F arch=b64 -S rename,rmdir,unlink,unlinkat,renameat -F auid>=1000 -F auid!=-1 -F key=delete If the command does not
        return an audit rule for "rename", "unlink", "rmdir", "renameat", and "unlinkat" or any of the lines returned are
        commented out, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:77301
