  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-257818r1044876_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>Kernel core dumps may contain the full contents of system memory at the time of the crash.
    Kernel core dumps consume a considerable amount of disk space and may result in denial of service by exhausting the available
    space on the target file system partition. Unless the system is used for kernel development or testing, there is little
    need to run the kdump service.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
