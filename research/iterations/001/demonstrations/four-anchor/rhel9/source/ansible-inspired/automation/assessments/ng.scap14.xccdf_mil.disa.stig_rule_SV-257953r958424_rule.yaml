      exports: []
      inline_content: Verify that the administrators are notified in the event of an audit processing failure. Check that
        the "/etc/aliases" file has a defined value for "root". $ sudo grep "postmaster:\s*root$" /etc/aliases If the command
        does not return a line, or the line is commented out, ask the system administrator to indicate how they and the information
        systems security officer (ISSO) are notified of an audit process failure. If there is no evidence of the proper personnel
        being notified of an audit processing failure, this is a finding.
      multi_check: null
      negate: null
