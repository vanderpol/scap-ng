            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:34301
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify that the administrators are notified in the event of an audit processing failure.


            Check that the "/etc/aliases" file has a defined value for "root".


            $ sudo grep "postmaster:\s*root$" /etc/aliases


            If the command does not return a line, or the line is commented out, ask the system administrator to indicate
            how they and the information systems security officer (ISSO) are notified of an audit process failure. If there
            is no evidence of the proper personnel being notified of an audit processing failure, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
