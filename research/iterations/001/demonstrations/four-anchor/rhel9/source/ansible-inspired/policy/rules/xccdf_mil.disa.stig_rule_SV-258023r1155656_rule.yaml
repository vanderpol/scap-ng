    ref: '#xccdf_navy.navwar.niwcatlantic.scc_platform_LinuxGnome'
  extends: null
  fix: 'Configure RHEL 9 to initiate a screensaver after a 10-minute period of inactivity for graphical user interfaces. Create
    a database to contain the systemwide screensaver settings (if it does not already exist) with the following command: $
    sudo touch /etc/dconf/db/local.d/00-screensaver Edit /etc/dconf/db/local.d/00-screensaver and add or update the following
    lines: [org/gnome/desktop/session] # Set the lock time out to 600 seconds before the session is considered idle idle-delay=uint32
    600 Update the system databases: $ sudo dconf update'
