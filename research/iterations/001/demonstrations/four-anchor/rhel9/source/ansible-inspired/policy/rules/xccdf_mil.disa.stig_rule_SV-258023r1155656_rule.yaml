scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify RHEL 9 initiates a session lock after a 10-minute period of inactivity for graphical user interfaces with
    the following command: Note: This requirement assumes the use of the RHEL 9 default graphical user interface, the GNOME
    desktop environment. If the system does not have any graphical user interface installed, this requirement is Not Applicable.
    $ sudo gsettings get org.gnome.desktop.session idle-delay uint32 600 If "idle-delay" is set to "0" or a value greater
    than "600", this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-258023r1155656_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-258023r1155656_rule
    assessment_version: 1
    selector: automated
    source_selector: automated
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-258023r1155656_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: '<VulnDiscussion>A session time-out lock is a temporary action taken when a user stops work and moves away
    from the immediate physical vicinity of the information system but does not logout because of the temporary nature of
    the absence. Rather than relying on the user to manually lock their operating system session prior to vacating the vicinity,
    the GNOME desktop can be configured to identify when a user''s session has idled and take action to initiate a session
    lock. Satisfies: SRG-OS-000029-GPOS-00010, SRG-OS-000031-GPOS-00012</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
