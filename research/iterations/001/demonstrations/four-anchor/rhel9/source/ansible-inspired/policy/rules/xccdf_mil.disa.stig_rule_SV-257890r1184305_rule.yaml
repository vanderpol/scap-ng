scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify the assigned home directory of all local interactive users has a mode of "0750" or less permissive with the
    following command: Note: This may miss interactive users that have been assigned a privileged user identifier (UID). Evidence
    of interactive use may be obtained from a number of log files containing system logon information. $ stat -L -c ''%a %n''
    $(awk -F: ''($3>=1000)&&($7 !~ /nologin/){print $6}'' /etc/passwd) 2>/dev/null 700 /home/disauser If home directories
    referenced in "/etc/passwd" do not have a mode of "0750" or less permissive, this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-257890r1184305_rule
