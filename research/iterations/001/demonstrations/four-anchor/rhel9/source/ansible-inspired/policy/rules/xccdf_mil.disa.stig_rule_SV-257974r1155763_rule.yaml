scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify RHEL 9 is not performing IPv6 packet forwarding, unless the system is a router. Note: If IPv6 is disabled
    on the system, this requirement is Not Applicable. Check the value of the "net.ipv6.conf.all.forwarding" variable with
    the following command: $ sudo sysctl net.ipv6.conf.all.forwarding net.ipv6.conf.all.forwarding = 0 If "net.ipv6.conf.all.forwarding"
    is not set to "0" or is missing, this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-257974r1155763_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-257974r1155763_rule
    assessment_version: 1
    selector: automated
    source_selector: automated
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-257974r1155763_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>Routing protocol daemons are typically used on routers to exchange network topology information
    with other routers. If this software is used when not required, system network information may be unnecessarily transmitted
    across the network. The sysctl --system command will load settings from all system configuration files. All configuration
    files are sorted by their filename in lexicographical order, regardless of the directories in which they reside. If multiple
    files specify the same option, the entry in the file with the lexicographically latest name will take precedence. Files
    are read from directories in the following list from top to bottom. Once a file of a given filename is loaded, any file
    of the same name in subsequent directories is ignored. /etc/sysctl.d/*.conf /run/sysctl.d/*.conf /usr/local/lib/sysctl.d/*.conf
    /usr/lib/sysctl.d/*.conf /lib/sysctl.d/*.conf /etc/sysctl.conf</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
