        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:47701
      exports: []
      inline_content: 'Verify RHEL 9 initiates a session lock for graphical user interfaces when the screensaver is activated
        with the following command: Note: This requirement assumes the use of the RHEL 9 default graphical user interface,
        the GNOME desktop environment. If the system does not have any graphical user interface installed, this requirement
        is Not Applicable. $ gsettings get org.gnome.desktop.screensaver lock-delay uint32 5 If the "uint32" setting is not
        set to "5" or less, or is missing, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
