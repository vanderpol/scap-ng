scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify RHEL 9 uses "pwquality" to enforce the password complexity rules in the system-auth file with the following
    command: $ grep pam_pwquality /etc/pam.d/system-auth password required pam_pwquality.so If the command does not return
    a line containing the value "pam_pwquality.so", or the line is commented out, this is a finding. If the system administrator
    (SA) can demonstrate that the required configuration is contained in a PAM configuration file included or substacked from
    the system-auth file, this is not a finding.'
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>Enabling PAM password complexity permits enforcement of strong passwords and consequently makes
    the system less prone to dictionary attacks.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
