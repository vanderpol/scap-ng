        "#auth    required    pam_wheel.so use_uid"


        $ sed ''/^[[:space:]]*#[[:space:]]*auth[[:space:]]\+required[[:space:]]\+pam_wheel\.so[[:space:]]\+use_uid$/s/^[[:space:]]*#//''
        -i /etc/pam.d/su


