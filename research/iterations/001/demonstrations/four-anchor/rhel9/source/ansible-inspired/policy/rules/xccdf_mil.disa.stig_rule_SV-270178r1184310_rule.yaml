scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify the SSH client is configured to use only MACs employing FIPS 140-3 approved algorithms. To verify the MACs
    in the systemwide SSH configuration file, use the following command: $ grep -i MACs /etc/crypto-policies/back-ends/openssh.config
    MACs hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,hmac-sha2-256,hmac-sha2-512 If the MACs entries in the
    "openssh.config" file have any hashes other than "hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,hmac-sha2-256,hmac-sha2-512",
    or they are missing or commented out, this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-270178r1184310_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-270178r1184310_rule
    assessment_version: 1
    selector: automated
    source_selector: automated
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-270178r1184310_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>Without cryptographic integrity protections, information can be altered by unauthorized users
    without detection. Remote access (e.g., RDP) is access to DOD nonpublic information systems by an authorized user (or
    an information system) communicating through an external, nonorganization-controlled network. Remote access methods include,
    for example, dial-up, broadband, and wireless. Cryptographic mechanisms used for protecting the integrity of information
    include, for example, signed hash functions using asymmetric cryptography, enabling distribution of the public key to
    verify the hash information while maintaining the confidentiality of the secret key used to generate the hash. RHEL 9
    incorporates systemwide crypto policies by default. The SSH configuration file has no effect on the ciphers, MACs, or
    algorithms unless specifically defined in the /etc/sysconfig/sshd file. The employed algorithms can be viewed in the /etc/crypto-policies/back-ends/openssh.config
    file.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
