        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:3101
      exports: []
      inline_content: 'Verify that GRUB 2 is configured to enable page poisoning to mitigate use-after-free vulnerabilities.
        Check that the current GRUB 2 configuration has page poisoning enabled with the following command: $ sudo grubby --info=ALL
        | grep args | grep -v ''page_poison=1'' If any output is returned, this is a finding. Check that page poisoning is
        enabled by default to persist in kernel updates with the following command: $ sudo grep page_poison /etc/default/grub
        GRUB_CMDLINE_LINUX="page_poison=1" If "page_poison" is not set to "1", is missing or commented out, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:3101
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify that GRUB 2 is configured to enable page poisoning to mitigate use-after-free vulnerabilities.\n\n\
            Check that the current GRUB 2 configuration has page poisoning enabled  with the following command:\n\n$ sudo\
            \ grubby --info=ALL | grep args | grep -v 'page_poison=1'\n\nIf any output is returned, this is a finding.\n\n\
            Check that page poisoning is enabled by default to persist in kernel updates with the following command: \n\n\
            $ sudo grep page_poison /etc/default/grub\n\nGRUB_CMDLINE_LINUX=\"page_poison=1\"\n\nIf \"page_poison\" is not\
            \ set to \"1\", is missing or commented out, this is a finding."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
