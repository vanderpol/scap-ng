        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:8301
      exports: []
      inline_content: 'Confirm Red Hat package-signing keys are installed on the system and verify their fingerprints match
        vendor values. Note: For RHEL 9 software packages, Red Hat uses GPG keys labeled "release key 2" and "auxiliary key
        3". The keys are defined in key file "/etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release" by default. List Red Hat GPG keys
        installed on the system: $ sudo rpm -q --queryformat "%{SUMMARY}\n" gpg-pubkey | grep -i "red hat" Red Hat, Inc. (release
        key 2) <security@redhat.com> public key Red Hat, Inc. (auxiliary key 3) <security@redhat.com> public key If Red Hat
        GPG keys "release key 2" and "auxiliary key 3" are not installed, this is a finding. List key fingerprints of installed
        Red Hat GPG keys: $ sudo gpg -q --keyid-format short --with-fingerprint /etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release
        If key file "/etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release" is missing, this is a finding. Example output: pub rsa4096/FD431D51
        2009-10-22 [SC] Key fingerprint = 567E 347A D004 4ADE 55BA 8A5F 199E 2F91 FD43 1D51 uid Red Hat, Inc. (release key
        2) <security@redhat.com> pub rsa4096/5A6340B3 2022-03-09 [SC] Key fingerprint = 7E46 2425 8C40 6535 D56D 6F13 5054
        E4A4 5A63 40B3 uid Red Hat, Inc. (auxiliary key 3) <security@redhat.com> Compare key fingerprints of installed Red
        Hat GPG keys with fingerprints listed for RHEL 9 on Red Hat "Product Signing Keys" webpage at https://access.redhat.com/security/team/key.
        If key fingerprints do not match, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:8301
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Confirm Red Hat package-signing keys are installed on the system and verify their fingerprints match vendor\
            \ values.\n\nNote: For RHEL 9 software packages, Red Hat uses GPG keys labeled \"release key 2\" and \"auxiliary\
            \ key 3\". The keys are defined in key file \"/etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release\" by default.\n\nList\
            \ Red Hat GPG keys installed on the system:\n\n$ sudo rpm -q --queryformat \"%{SUMMARY}\\n\" gpg-pubkey | grep\
            \ -i \"red hat\"\n\nRed Hat, Inc. (release key 2) <security@redhat.com> public key\nRed Hat, Inc. (auxiliary key\
            \ 3) <security@redhat.com> public key\n\nIf Red Hat GPG keys \"release key 2\" and \"auxiliary key 3\" are not\
            \ installed, this is a finding.\n\nList key fingerprints of installed Red Hat GPG keys:\n\n$ sudo gpg -q --keyid-format\
            \ short --with-fingerprint /etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release\n\nIf key file \"/etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release\"\
            \ is missing, this is a finding.\n\nExample output:\n\npub   rsa4096/FD431D51 2009-10-22 [SC]\n      Key fingerprint\
            \ = 567E 347A D004 4ADE 55BA  8A5F 199E 2F91 FD43 1D51\nuid                   Red Hat, Inc. (release key 2) <security@redhat.com>\n\
            pub   rsa4096/5A6340B3 2022-03-09 [SC]\n      Key fingerprint = 7E46 2425 8C40 6535 D56D  6F13 5054 E4A4 5A63\
            \ 40B3\nuid                   Red Hat, Inc. (auxiliary key 3) <security@redhat.com>\n\nCompare key fingerprints\
            \ of installed Red Hat GPG keys with fingerprints listed for RHEL 9 on Red Hat \"Product Signing Keys\" webpage\
            \ at https://access.redhat.com/security/team/key.\n\nIf key fingerprints do not match, this is a finding."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
