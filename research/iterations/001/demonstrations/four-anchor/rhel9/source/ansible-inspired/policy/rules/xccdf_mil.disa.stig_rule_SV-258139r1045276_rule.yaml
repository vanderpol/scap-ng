authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that AIDE is configured to verify extended attributes with the following command: $ sudo grep xattrs /etc/aide.conf
    All= p+i+n+u+g+s+m+S+sha512+acl+xattrs+selinux If the "xattrs" rule is not being used on all uncommented selection lines
    in the "/etc/aide.conf" file, or extended attributes are not being checked by another file integrity tool, this is a finding.'
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>RHEL 9 installation media ships with an optional file integrity tool called Advanced Intrusion
    Detection Environment (AIDE). AIDE is highly configurable at install time. This requirement assumes the "aide.conf" file
    is under the "/etc" directory. Extended attributes in file systems are used to contain arbitrary data and file metadata
    with security implications.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
