  - kind: cpe_name
    name: cpe:/o:redhat:enterprise_linux:9.0
    ref: cpe:/o:redhat:enterprise_linux:9.0
  extends: null
  fix: 'The repo package can be manually removed with the following command: $ sudo dnf remove epel-release Configure the
    operating system to disable use of the EPEL repository with the following command: $ sudo dnf config-manager --set-disabled
    epel'
