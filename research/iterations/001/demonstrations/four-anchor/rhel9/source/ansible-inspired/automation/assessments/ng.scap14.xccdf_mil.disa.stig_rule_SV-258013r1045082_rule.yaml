          text: "Note: This requirement assumes the use of the RHEL 9 default graphical user interface, the GNOME desktop\
            \ environment. If the system does not have any graphical user interface installed, this requirement is Not Applicable.\n\
            \nVerify RHEL 9 prevents a user from overriding settings for graphical user interfaces. \n\nDetermine if the org.gnome.login-screen\
            \ banner-message-enable key is writable with the following command:\n\t\n$ gsettings writable org.gnome.login-screen\
