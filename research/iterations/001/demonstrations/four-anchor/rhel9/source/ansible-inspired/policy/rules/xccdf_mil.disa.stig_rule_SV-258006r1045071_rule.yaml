rule:
  abstract: false
  check: 'Verify the SSH daemon does not allow known hosts authentication with the following command: $ sudo /usr/sbin/sshd
    -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo grep -iH ''^\s*ignoreuserknownhosts''
    IgnoreUserKnownHosts yes If the value is returned as "no", the returned line is commented out, or no output is returned,
    this is a finding.'
