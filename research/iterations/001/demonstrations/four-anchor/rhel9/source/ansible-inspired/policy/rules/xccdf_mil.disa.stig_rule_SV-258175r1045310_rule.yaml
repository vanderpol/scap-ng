rule:
  abstract: false
  check: 'Verify that RHEL 9 has the audispd-plugins package installed with the following command: $ dnf list --installed
    audispd-plugins Example output: audispd-plugins.x86_64 3.0.7-101.el9_0.2 If the "audispd-plugins" package is not installed,
    this is a finding.'
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>"audispd-plugins" provides plugins for the real-time interface to the audit subsystem, "audispd".
    These plugins can do things like relay events to remote machines or analyze events for suspicious behavior.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
