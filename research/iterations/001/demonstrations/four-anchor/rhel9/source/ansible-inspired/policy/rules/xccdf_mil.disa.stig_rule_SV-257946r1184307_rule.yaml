rule:
  abstract: false
  check: 'Note: If the server is serving as an NTP server, this is not applicable. Verify RHEL 9 disables the chrony daemon
    from acting as a server with the following command: $ grep -w port /etc/chrony.conf port 0 If the "port" option is not
    set to "0", is commented out, or is missing, this is a finding.'
  cluster_id: null
  conflicts: []
  description: '<VulnDiscussion>Minimizing the exposure of the server functionality of the chrony daemon diminishes the attack
