scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify the audit logs are group-owned by "root" or a restricted logging group. First determine if a group other
    than "root" has been assigned to the audit logs with the following command: $ sudo grep log_group /etc/audit/auditd.conf
    Then determine where the audit logs are stored with the following command: $ sudo grep -iw log_file /etc/audit/auditd.conf
    log_file = /var/log/audit/audit.log Then using the location of the audit log file, determine if the audit log is group-owned
    by "root" using the following command: $ sudo stat -c "%G %n" /var/log/audit/audit.log root /var/log/audit/audit.log If
    the audit log is not group-owned by "root" or the configured alternative logging group, this is a finding.'
  cluster_id: null
  conflicts: []
  description: '<VulnDiscussion>Unauthorized disclosure of audit records can reveal system and configuration data to attackers,
    thus compromising its confidentiality. Satisfies: SRG-OS-000057-GPOS-00027, SRG-OS-000058-GPOS-00028, SRG-OS-000059-GPOS-00029,
    SRG-OS-000206-GPOS-00084</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
  discussion: null
  effective_platform_refs:
