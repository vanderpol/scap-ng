  extends: null
  fix: 'Configure "nftables" to be the default "firewallbackend" for "firewalld" by adding or editing the following line in
    "/etc/firewalld/firewalld.conf": FirewallBackend=nftables Establish rate-limiting rules based on organization-defined
    types of DoS attacks on impacted network interfaces.'
