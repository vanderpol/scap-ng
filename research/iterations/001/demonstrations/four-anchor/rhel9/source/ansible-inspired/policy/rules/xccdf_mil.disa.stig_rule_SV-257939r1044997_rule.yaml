scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify "nftables" is configured to allow rate limits on any connection to the system with the following command:
    $ sudo grep -i firewallbackend /etc/firewalld/firewalld.conf # FirewallBackend FirewallBackend=nftables If the "nftables"
    is not set as the "FirewallBackend" default, this is a finding.'
  checks:
