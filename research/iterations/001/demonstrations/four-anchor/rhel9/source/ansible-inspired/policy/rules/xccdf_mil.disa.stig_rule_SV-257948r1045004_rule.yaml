scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Note: If the system is running in a cloud platform and the cloud provider gives a single, highly available IP address
    for DNS configuration, this control is Not Applicable. Verify the name servers used by the system with the following command:
    $ grep nameserver /etc/resolv.conf nameserver 192.168.1.2 nameserver 192.168.1.3 If fewer than two lines are returned
    that are not commented out, this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-257948r1045004_rule
    assessment_version: 1
    selector: default
    source_selector: ''
