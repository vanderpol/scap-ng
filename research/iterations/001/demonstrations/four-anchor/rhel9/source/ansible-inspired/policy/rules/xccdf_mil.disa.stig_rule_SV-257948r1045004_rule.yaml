  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-257948r1045004_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>To provide availability for name resolution services, multiple redundant name servers are mandated.
    A failure in name resolution could lead to the failure of security functions requiring name resolution, which may include
    time synchronization, centralized authentication, and remote system logging.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
  effective_platform_refs:
  - cpe:/o:almalinux:almalinux:9
  - cpe:/o:rocky:rocky:9
  - cpe:/o:redhat:enterprise_linux:9.0
  effective_platforms:
  - kind: cpe_name
    name: cpe:/o:almalinux:almalinux:9
    ref: cpe:/o:almalinux:almalinux:9
  - kind: cpe_name
    name: cpe:/o:rocky:rocky:9
    ref: cpe:/o:rocky:rocky:9
  - kind: cpe_name
    name: cpe:/o:redhat:enterprise_linux:9.0
    ref: cpe:/o:redhat:enterprise_linux:9.0
  extends: null
  fix: 'Configure the operating system to use two or more name servers for DNS resolution based on the DNS mode of the system.
    If the NetworkManager DNS mode is set to "none", add the following lines to "/etc/resolv.conf": nameserver [name server
    1] nameserver [name server 2] Replace [name server 1] and [name server 2] with the IPs of two different DNS resolvers.
    If the NetworkManager DNS mode is set to "default", add two DNS servers to a NetworkManager connection using the following
    command: $ nmcli connection modify [connection name] ipv4.dns [name server 1],[name server 2] Replace [name server 1]
    and [name server 2] with the IPs of two different DNS resolvers. Replace [connection name] with a valid NetworkManager
    connection name on the system. Replace ipv4 with ipv6 if IPv6 DNS servers are used.'
