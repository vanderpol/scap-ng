rule:
  abstract: false
  check: 'Verify that RHEL 9 is configured to allow sending email notifications. Note: The "s-nail" package provides the "mail"
    command that is used to send email messages. Verify that the "s-nail" package is installed on the system: $ dnf list --installed
    s-nail s-nail.x86_64 14.9.22-6.el9 If "s-nail" package is not installed, this is a finding.'
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>The "s-nail" package provides the mail command required to allow sending email notifications
    of unauthorized configuration changes to designated personnel.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
