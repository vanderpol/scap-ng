        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:48301
      exports: []
      inline_content: 'Check the last modification time of the local databases, comparing it to the last modification time
        of the related keyfiles. The following command will check every dconf database and compare its modification time to
        the related system keyfiles: Note: This requirement assumes the use of the RHEL 9 default graphical user interface,
        the GNOME desktop environment. If the system does not have any graphical user interface installed, this requirement
        is Not Applicable. $ function dconf_needs_update { for db in $(find /etc/dconf/db -maxdepth 1 -type f); do db_mtime=$(stat
        -c %Y "$db"); keyfile_mtime=$(stat -c %Y "$db".d/* | sort -n | tail -1); if [ -n "$db_mtime" ] && [ -n "$keyfile_mtime"
        ] && [ "$db_mtime" -lt "$keyfile_mtime" ]; then echo "$db needs update"; return 1; fi; done; }; dconf_needs_update
        If the command has any output, then a dconf database needs to be updated, and this is a finding.'
