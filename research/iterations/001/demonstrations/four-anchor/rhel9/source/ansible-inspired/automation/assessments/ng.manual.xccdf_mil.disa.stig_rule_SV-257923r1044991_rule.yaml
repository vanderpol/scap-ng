        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:28901
      exports: []
      inline_content: 'Verify the systemwide shared library directories are group-owned by "root" with the following command:
        $ sudo find /lib /lib64 /usr/lib /usr/lib64 ! -group root -type d -exec stat -c "%G %n" {} \; If any systemwide shared
        library directory is returned and is not group-owned by a required system account, this is a finding.'
      multi_check: null
