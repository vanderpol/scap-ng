        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Note: For systems that use BIOS, this is not applicable. \n\nVerify the /boot/efi directory is mounted with\
            \ the \"nosuid\" option with the following command:\n\n$ mount | grep '\\s/boot/efi\\s'\n\n/dev/sda1 on /boot/efi\
            \ type vfat (rw,nosuid,relatime,fmask=0077,dmask=0077,codepage=437,iocharset=ascii,shortname=winnt,errors=remount-ro)\n\
            \nIf the /boot/efi file system does not have the \"nosuid\" option set, this is a finding.\n\nNote: This control\
            \ is not applicable to vfat file systems."
