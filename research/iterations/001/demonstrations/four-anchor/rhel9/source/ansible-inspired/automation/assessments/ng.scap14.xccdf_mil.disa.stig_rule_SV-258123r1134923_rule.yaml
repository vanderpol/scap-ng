          children:
          - name: title
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: RHEL-09-611170 - RHEL 9 must implement certificate status checking for multifactor authentication.
          - attributes:
              family: unix
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Red Hat Enterprise Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'Using an authentication device, such as a DOD Common Access Card (CAC) or token that is separate from the
              information system, ensures that even if the information system is compromised, credentials stored on the authentication
              device will not be affected.


              Multifactor solutions that require devices separate from information systems gaining access include, for example,
              hardware tokens providing time-based or challenge-response authenticators and smart cards such as the U.S. Government
              Personal Identity Verification (PIV) card and the DOD CAC.


              RHEL 9 includes multiple options for configuring certificate status checking, but for this requirement focuses
              on the System Security Services Daemon (SSSD). By default, SSSD performs Online Certificate Status Protocol
              (OCSP) checking and certificate verification using a sha256 digest function.


              Satisfies: SRG-OS-000375-GPOS-00160, SRG-OS-000377-GPOS-00162'
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
        source_definition_id: oval:mil.disa.stig.rhel9os:def:258123
