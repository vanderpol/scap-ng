rule:
  abstract: false
  check: 'Verify the permissions of the "/etc/ssh/sshd_config" file with the following command: $ sudo rpm --verify openssh-server
    | awk ''! ($2 == "c" && $1 ~ /^.\..\.\.\.\..\./) {print $0}'' If the command returns any output, this is a finding.'
