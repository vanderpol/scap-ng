rule:
  abstract: false
  check: 'Run the following command to verify that the owner, group, and mode of cron configuration files and directories
    match the operating system defaults: $ rpm --verify cronie crontabs | awk ''! ($2 == "c" && $1 ~ /^.\..\.\.\.\..\./) {print
    $0}'' If the command returns any output, this is a finding.'
