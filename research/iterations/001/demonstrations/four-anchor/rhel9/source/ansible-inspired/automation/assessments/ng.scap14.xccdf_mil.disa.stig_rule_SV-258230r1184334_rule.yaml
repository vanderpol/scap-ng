          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'Use of weak or untested encryption algorithms undermines the purposes of utilizing encryption to protect
              data. The operating system must implement cryptographic modules adhering to the higher standards approved by
              the federal government since this provides assurance they have been tested and validated. This includes NIST
              FIPS-validated cryptography for the following: Provisioning digital signatures, generating cryptographic hashes,
              and to protect data requiring data-at-rest protections in accordance with applicable federal laws, Executive
              Orders, directives, policies, regulations, and standards.


