rule:
  abstract: false
  check: 'Verify RHEL 9 generates audit records for all account creations, modifications, disabling, and termination events
    that affect "/etc/gshadow" with the following command: $ sudo auditctl -l | egrep ''(/etc/gshadow)'' -a always,exit -F
    arch=b32 -F path=/etc/gshadow -F perm=wa -k identity -a always,exit -F arch=b64 -F path=/etc/gshadow -F perm=wa -k identity
    If the command does not return a line, or the line is commented out, this is a finding.'
