assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-257879r1045454_rule
  version: 1
  description: RHEL 9 local disk partitions must implement cryptographic mechanisms to prevent unauthorized disclosure or
    modification of all information that requires at rest protection.
  name: RHEL 9 local disk partitions must implement cryptographic mechanisms to prevent unauthorized disclosure or modification
    of all information that requires at rest protection.
  source_check_logic:
    checks:
    - content_refs:
