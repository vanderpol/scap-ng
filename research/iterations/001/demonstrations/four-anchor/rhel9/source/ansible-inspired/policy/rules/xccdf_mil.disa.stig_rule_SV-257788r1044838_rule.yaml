rule:
  abstract: false
  check: 'Verify that GRUB 2 is configured to disable interactive boot. Check that the current GRUB 2 configuration disables
    the ability of systemd to spawn an interactive boot process with the following command: $ sudo grubby --info=ALL | grep
    args | grep ''systemd.confirm_spawn'' If any output is returned, this is a finding.'
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>Using interactive or recovery boot, the console user could disable auditing, firewalls, or
    other services, weakening system security.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
