        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:2901
      exports: []
      inline_content: 'Verify the current GRUB 2 configuration disables virtual system calls with the following command: $
        sudo grubby --info=ALL | grep args | grep -v ''vsyscall=none'' If any output is returned, this is a finding. Check
        that virtual system calls are disabled by default to persist in kernel updates with the following command: $ sudo
        grep vsyscall /etc/default/grub GRUB_CMDLINE_LINUX="vsyscall=none" If "vsyscall" is not set to "none", is missing
        or commented out, and is not documented with the information system security officer (ISSO) as an operational requirement,
        this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
