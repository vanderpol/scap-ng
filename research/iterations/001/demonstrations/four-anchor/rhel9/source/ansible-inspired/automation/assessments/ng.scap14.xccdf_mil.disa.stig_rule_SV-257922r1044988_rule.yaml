            text: RHEL 9 library directories must be owned by root.
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "If the operating system were to allow any user to make changes to software libraries, then those changes\
              \ might be implemented without undergoing the appropriate testing and approvals that are part of a robust change\
              \ management process.  \n  \nThis requirement applies to operating systems with software libraries that are\
              \ accessible and configurable, as in the case of interpreted languages. Software libraries also include privileged\
