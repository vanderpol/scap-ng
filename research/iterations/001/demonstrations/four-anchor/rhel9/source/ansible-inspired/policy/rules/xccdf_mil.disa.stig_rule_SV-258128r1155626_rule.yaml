scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify RHEL 9 requires authentication for emergency mode with the following command: $ grep sulogin /usr/lib/systemd/system/emergency.service
    ExecStart=-/usr/lib/systemd/systemd-sulogin-shell emergency If the line is not returned from the default systemd file,
    use the following command to look for modifications to the emergency.service: $ grep sulogin /etc/systemd/system/emergency.service.d/*.conf
    If the line is not returned from either location this is a finding. Note: The configuration setting can only be in either
    the default location, or in the drop in file, not both locations.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-258128r1155626_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-258128r1155626_rule
    assessment_version: 1
    selector: automated
    source_selector: automated
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-258128r1155626_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>To mitigate the risk of unauthorized access to sensitive information by entities that have
    been issued certificates by DOD-approved PKIs, all DOD systems (e.g., web servers and web portals) must be properly configured
    to incorporate access control methods that do not rely solely on the possession of a certificate for access. Successful
    authentication must not automatically give an entity access to an asset or security boundary. Authorization procedures
    and controls must be implemented to ensure each authenticated entity also has a validated and current authorization. Authorization
    is the process of determining whether an entity, once authenticated, is permitted to access a specific asset. Information
    systems use access control policies and enforcement mechanisms to implement this requirement. This requirement prevents
    attackers with physical access from trivially bypassing security on the machine and gaining root access. Such accesses
    are further prevented by configuring the bootloader password.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
  effective_platform_refs:
  - cpe:/o:almalinux:almalinux:9
  - cpe:/o:rocky:rocky:9
  - cpe:/o:redhat:enterprise_linux:9.0
  effective_platforms:
  - kind: cpe_name
    name: cpe:/o:almalinux:almalinux:9
    ref: cpe:/o:almalinux:almalinux:9
  - kind: cpe_name
    name: cpe:/o:rocky:rocky:9
    ref: cpe:/o:rocky:rocky:9
  - kind: cpe_name
    name: cpe:/o:redhat:enterprise_linux:9.0
    ref: cpe:/o:redhat:enterprise_linux:9.0
  extends: null
  fix: 'Configure RHEL 9 to require authentication for emergency mode. Create a directory for supplementary configuration
    files: $ sudo mkdir /etc/systemd/system/emergency.service.d/ Copy the original file emergency.service file to the new
    directory with: $ sudo cp /usr/lib/systemd/system/emergency.service /etc/systemd/system/emergency.service.d/emergency.service.conf
    Open the new file: $ sudo vi /etc/systemd/system/emergency.service.d/emergency.service.conf Add or modify the following
    line in the new file: ExecStart=-/usr/lib/systemd/systemd-sulogin-shell emergency Comment out or remove the ExecStart
    and ExecStartPre lines in /usr/lib/systemd/system/emergency.service as they can only exist in one location. Apply changes
    to unit files without rebooting the system: $ sudo systemctl daemon-reload'
