        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:15501
      exports: []
      inline_content: 'Note: If no NFS mounts are configured, this requirement is Not Applicable. Verify RHEL 9 has the "nosuid"
        option configured for all NFS mounts with the following command: $ grep nfs /etc/fstab 192.168.22.2:/mnt/export /data
        nfs4 rw,nosuid,nodev,noexec,sync,soft,sec=krb5:krb5i:krb5p If the system is mounting file systems via NFS and the
        "nosuid" option is missing, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:15501
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Note: If no NFS mounts are configured, this requirement is Not Applicable.


            Verify RHEL 9 has the "nosuid" option configured for all NFS mounts with the following command:


            $ grep nfs /etc/fstab


            192.168.22.2:/mnt/export /data nfs4 rw,nosuid,nodev,noexec,sync,soft,sec=krb5:krb5i:krb5p


            If the system is mounting file systems via NFS and the "nosuid" option is missing, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
