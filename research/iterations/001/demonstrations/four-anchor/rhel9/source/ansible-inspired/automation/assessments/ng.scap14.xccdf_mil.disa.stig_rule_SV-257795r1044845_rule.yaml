        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:3501
      exports: []
      inline_content: 'Verify RHEL 9 enables kernel page-table isolation with the following command: $ sudo grubby --info=ALL
        | grep args | grep -v ''pti=on'' If any output is returned, this is a finding. Check that kernel page-table isolation
        is enabled by default to persist in kernel updates: $ grep pti /etc/default/grub GRUB_CMDLINE_LINUX="pti=on" If "pti"
        is not set to "on", is missing or commented out, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
