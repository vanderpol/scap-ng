            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:3501
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify RHEL 9 enables kernel page-table isolation with the following command:\n\n$ sudo grubby --info=ALL\
            \ | grep args | grep -v 'pti=on'\n\nIf any output is returned, this is a finding.\n\nCheck that kernel page-table\
            \ isolation is enabled by default to persist in kernel updates: \n\n$ grep pti /etc/default/grub\n\nGRUB_CMDLINE_LINUX=\"\
            pti=on\"\n\nIf \"pti\" is not set to \"on\", is missing or commented out, this is a finding."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
