        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:48901
      exports: []
      inline_content: 'Verify RHEL 9 is configured to ignore the Ctrl-Alt-Del sequence in the GNOME desktop with the following
        command: Note: This requirement assumes the use of the RHEL 9 default graphical user interface, the GNOME desktop
        environment. If the system does not have any graphical user interface installed, this requirement is not applicable.
        $ gsettings get org.gnome.settings-daemon.plugins.media-keys logout [''''] If the GNOME desktop is configured to shut
        down when Ctrl-Alt-Del is pressed, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:48901
