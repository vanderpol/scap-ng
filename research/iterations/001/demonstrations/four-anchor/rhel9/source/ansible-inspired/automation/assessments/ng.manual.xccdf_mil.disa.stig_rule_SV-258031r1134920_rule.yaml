        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify RHEL 9 is configured to ignore the Ctrl-Alt-Del sequence in the GNOME desktop with the following command:\n\
            \nNote: This requirement assumes the use of the RHEL 9 default graphical user interface, the GNOME desktop environment.\
            \ If the system does not have any graphical user interface installed, this requirement is not applicable.\n\n\
            $ gsettings get org.gnome.settings-daemon.plugins.media-keys logout \n\n['']\n\nIf the GNOME desktop is configured\
