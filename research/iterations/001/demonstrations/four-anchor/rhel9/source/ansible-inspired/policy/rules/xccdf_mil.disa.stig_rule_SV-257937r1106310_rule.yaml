scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify the RHEL 9 firewalld is configured to employ a deny-all, allow-by-exception policy for allowing connections
    to other systems with the following commands: Ensure firewalld is running: $ sudo firewall-cmd --state running Identify
    active zones: $ sudo firewall-cmd --get-active-zones drop interfaces: ens192 Check what rules are applied in that zone:
    $ sudo firewall-cmd --list-all --zone=$(firewall-cmd --get-default-zone) drop (active) target: DROP icmp-block-inversion:
    no interfaces: ens192 sources: services: ssh ports: protocols: forward: yes masquerade: no forward-ports: source-ports:
    icmp-blocks: rich rules: If no zones are active on the RHEL 9 interfaces or if runtime and permanent targets are set to
    a different option other than "DROP", this is a finding.'
  checks:
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-257937r1106310_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-257937r1106310_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>Failure to restrict network connectivity only to authorized systems permits inbound connections
    from malicious systems. It also permits outbound connections that may facilitate exfiltration of DOD data. RHEL 9 incorporates
    the "firewalld" daemon, which allows for many different configurations. One of these configurations is zones. Zones can
    be utilized to a deny-all, allow-by-exception approach. The default "drop" zone will drop all incoming network packets
    unless it is explicitly allowed by the configuration file or is related to an outgoing network connection.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
  effective_platform_refs:
  - cpe:/o:almalinux:almalinux:9
  - cpe:/o:rocky:rocky:9
  - cpe:/o:redhat:enterprise_linux:9.0
  effective_platforms:
  - kind: cpe_name
    name: cpe:/o:almalinux:almalinux:9
    ref: cpe:/o:almalinux:almalinux:9
  - kind: cpe_name
    name: cpe:/o:rocky:rocky:9
    ref: cpe:/o:rocky:rocky:9
  - kind: cpe_name
    name: cpe:/o:redhat:enterprise_linux:9.0
    ref: cpe:/o:redhat:enterprise_linux:9.0
  extends: null
  fix: 'Configure the "firewalld" daemon to employ a deny-all, allow-by-exception policy with the following commands: Start
    by adding the exceptions that are required for mission functionality to the "drop" zone. If SSH access on port 22 is needed,
    for example, run the following: "sudo firewall-cmd --permanent --add-service=ssh --zone=drop" Reload the firewall rules
    to update the runtime configuration from the "--permanent" changes made above: $ sudo firewall-cmd --reload Set the default
    zone to the drop zone: $ sudo firewall-cmd --set-default-zone=drop Note: This is a runtime and permanent change. Add any
    interfaces to the newly modified "drop" zone: $ sudo firewall-cmd --permanent --zone=drop --change-interface=ens192 Reload
    the firewall rules for changes to take effect: $ sudo firewall-cmd --reload'
