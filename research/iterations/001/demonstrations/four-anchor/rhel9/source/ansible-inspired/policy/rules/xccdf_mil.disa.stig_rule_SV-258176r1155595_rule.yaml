  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-258176r1155595_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: '<VulnDiscussion>Misuse of privileged functions, either intentionally or unintentionally by authorized users,
    or by unauthorized external entities that have compromised information system accounts, is a serious and ongoing concern
    and can have significant adverse impacts on organizations. Auditing the use of privileged functions is one way to detect
    such misuse and identify the risk from insider threats and the advanced persistent threat. Satisfies: SRG-OS-000326-GPOS-00126,
    SRG-OS-000327-GPOS-00127</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
  discussion: null
  effective_platform_refs:
  - cpe:/o:almalinux:almalinux:9
  - cpe:/o:rocky:rocky:9
  - cpe:/o:redhat:enterprise_linux:9.0
  effective_platforms:
  - kind: cpe_name
    name: cpe:/o:almalinux:almalinux:9
    ref: cpe:/o:almalinux:almalinux:9
  - kind: cpe_name
    name: cpe:/o:rocky:rocky:9
    ref: cpe:/o:rocky:rocky:9
  - kind: cpe_name
    name: cpe:/o:redhat:enterprise_linux:9.0
    ref: cpe:/o:redhat:enterprise_linux:9.0
  extends: null
  fix: 'Configure RHEL 9 to audit the execution of the "execve" system call. Add or update the following file system rules
    to "/etc/audit/rules.d/audit.rules": -a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -k execpriv -a always,exit
    -F arch=b64 -S execve -C uid!=euid -F euid=0 -k execpriv -a always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0 -k
    execpriv -a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -k execpriv To load the rules to the kernel immediately,
    use the following command: $ sudo augenrules --load'
