        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:66501
      exports: []
      inline_content: 'Note: If the system administrator demonstrates the use of an approved alternate multifactor authentication
        method, this requirement is not applicable. Verify RHEL 9 for PKI-based authentication has valid certificates by constructing
        a certification path (which includes status information) to an accepted trust anchor. Check that the system has a
        valid DOD root CA installed with the following command: $ sudo openssl x509 -text -in /etc/sssd/pki/sssd_auth_ca_db.pem
        Example output: Certificate: Data: Version: 3 (0x2) Serial Number: 1 (0x1) Signature Algorithm: sha256WithRSAEncryption
        Issuer: C = US, O = U.S. Government, OU = DoD, OU = PKI, CN = DoD Root CA 3 Validity Not Before: Mar 20 18:46:41 2012
        GMT Not After: Dec 30 18:46:41 2029 GMT Subject: C = US, O = U.S. Government, OU = DoD, OU = PKI, CN = DoD Root CA
        3 Subject Public Key Info: Public Key Algorithm: rsaEncryption If the root CA file is not a DOD-issued certificate
        with a valid date and installed in the "/etc/sssd/pki/sssd_auth_ca_db.pem" location, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:66501
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Note: If the system administrator demonstrates the use of an approved alternate multifactor authentication\
            \ method, this requirement is not applicable.\n\nVerify RHEL 9 for PKI-based authentication has valid certificates\
            \ by constructing a certification path (which includes status information) to an accepted trust anchor.\n\nCheck\
            \ that the system has a valid DOD root CA installed with the following command:\n\n$ sudo openssl x509 -text -in\
            \ /etc/sssd/pki/sssd_auth_ca_db.pem\n\nExample output:\n\nCertificate:\n    Data:\n        Version: 3 (0x2)\n\
            \        Serial Number: 1 (0x1)\n        Signature Algorithm: sha256WithRSAEncryption\n        Issuer: C = US,\
            \ O = U.S. Government, OU = DoD, OU = PKI, CN = DoD Root CA 3\n        Validity\n        Not Before: Mar 20 18:46:41\
            \ 2012 GMT\n        Not After: Dec 30 18:46:41 2029 GMT\n        Subject: C = US, O = U.S. Government, OU = DoD,\
            \ OU = PKI, CN = DoD Root CA 3\n        Subject Public Key Info:\n            Public Key Algorithm: rsaEncryption\n\
            \nIf the root CA file is not a DOD-issued certificate with a valid date and installed in the \"/etc/sssd/pki/sssd_auth_ca_db.pem\"\
            \ location, this is a finding."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
