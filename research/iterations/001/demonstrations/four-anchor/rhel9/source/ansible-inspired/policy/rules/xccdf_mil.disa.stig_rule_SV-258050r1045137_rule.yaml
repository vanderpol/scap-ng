scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that all local interactive user initialization file executable search path statements do not contain statements
    that will reference a working directory other than user home directories with the following commands: $ sudo find /home
    -maxdepth 2 -type f -name ".[^.]*" -exec grep -iH path= {} \; PATH="$HOME/.local/bin:$HOME/bin:$PATH" If any local interactive
    user initialization files have executable search path statements that include directories outside of their home directory,
    and this is not documented with the ISSO as an operational requirement, this is a finding.'
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>The executable search path (typically the PATH environment variable) contains a list of directories
    for the shell to search to find executables. If this path includes the current working directory (other than the users
    home directory), executables in these directories may be executed instead of system commands. This variable is formatted
    as a colon-separated list of directories. If there is an empty entry, such as a leading or trailing colon or two consecutive
    colons, this is interpreted as the current working directory. If deviations from the default system search path for the
    local interactive user are required, they must be documented with the information system security officer (ISSO).</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
