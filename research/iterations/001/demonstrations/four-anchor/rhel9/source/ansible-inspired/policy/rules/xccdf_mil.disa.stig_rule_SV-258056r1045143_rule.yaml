  extends: null
  fix: 'To configure RHEL 9 to lock out the "root" account after a number of incorrect logon attempts within 15 minutes using
    "pam_faillock.so", enable the feature using the following command: $ sudo authselect enable-feature with-faillock Then
    edit the "/etc/security/faillock.conf" file as follows: fail_interval = 900'
