        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:77901
      exports: []
      inline_content: 'Verify RHEL 9 is configured to audit the execution of the "init_module" and "finit_module" system calls
        with the following command: $ sudo auditctl -l | grep init_module -a always,exit -F arch=b32 -S init_module,finit_module
        -F auid>=1000 -F auid!=-1 -F key=module_chng -a always,exit -F arch=b64 -S init_module,finit_module -F auid>=1000
        -F auid!=-1 -F key=module_chng If both the "b32" and "b64" audit rules are not defined for the "init_module" system
        call, or any of the lines returned are commented out, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
