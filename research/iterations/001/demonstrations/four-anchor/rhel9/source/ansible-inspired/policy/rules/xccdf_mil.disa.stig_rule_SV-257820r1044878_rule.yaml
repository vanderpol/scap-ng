scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that dnf always checks the GPG signature of software packages originating from external software repositories
    before installation: $ grep -w gpgcheck /etc/dnf/dnf.conf gpgcheck=1 If "gpgcheck" is not set to "1", or if the option
    is missing or commented out, ask the system administrator how the GPG signatures of software packages are being verified.
    If there is no process to verify GPG signatures that is approved by the organization, this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-257820r1044878_rule
    assessment_version: 1
    selector: default
    source_selector: ''
