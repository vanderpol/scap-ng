scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify RHEL 9 takes action when allocated audit record storage volume reaches 75 percent of the repository maximum
    audit record storage capacity with the following command: $ sudo grep -w space_left /etc/audit/auditd.conf space_left
    = 25% If the value of the "space_left" keyword is not set to 25 percent or greater of the storage volume allocated to
    audit logs, or if the line is commented out, ask the system administrator (SA) to indicate how the system is providing
    real-time alerts to the SA and ISSO. If the "space_left" value is not configured to the value 25 percent or more, this
    is a finding.'
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>If security personnel are not notified immediately when storage volume reaches a maximum of
    75 percent utilization, they are unable to plan for audit record storage capacity expansion. The notification can be set
    to trigger at lower utilization thresholds at the information system security officer's (ISSO's) discretion.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
