  - kind: cpe_name
    name: cpe:/o:redhat:enterprise_linux:9.0
    ref: cpe:/o:redhat:enterprise_linux:9.0
  extends: null
  fix: 'If PAM is managed with authselect, use the following command to remove instances of "nullok": $ sudo authselect enable-feature
    without-nullok Otherwise, remove any instances of the "nullok" option in the "/etc/pam.d/password-auth" and "/etc/pam.d/system-auth"
    files to prevent logons with empty passwords. Note: Manual changes to the listed file may be overwritten by the "authselect"
    program.'
