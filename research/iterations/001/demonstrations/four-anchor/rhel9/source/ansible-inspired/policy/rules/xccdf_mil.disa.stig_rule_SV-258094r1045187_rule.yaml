rule:
  abstract: false
  check: 'Verify that null passwords cannot be used with the following command: $ sudo grep -i nullok /etc/pam.d/system-auth
    /etc/pam.d/password-auth If output is produced, this is a finding. If the system administrator (SA) can demonstrate that
    the required configuration is contained in a PAM configuration file included or substacked from the system-auth file,
    this is not a finding.'
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>If an account has an empty password, anyone could log in and run commands with the privileges
    of that account. Accounts with empty passwords should never be used in operational environments.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
