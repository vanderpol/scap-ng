scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'To verify that Linux Audit logging is enabled for the USBGuard daemon with the following command: $ sudo grep AuditBackend
    /etc/usbguard/usbguard-daemon.conf AuditBackend=LinuxAudit If "AuditBackend" is not set to "LinuxAudit", this is a finding.
    If the system is virtual machine with no virtual or physical USB peripherals attached, this is not a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-258037r1014863_rule
    assessment_version: 1
    selector: default
    source_selector: ''
