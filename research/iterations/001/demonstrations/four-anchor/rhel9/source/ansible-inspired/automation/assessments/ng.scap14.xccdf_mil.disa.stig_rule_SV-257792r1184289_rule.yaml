          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify the current GRUB 2 configuration disables virtual system calls with the following command:\n\n$ sudo\
            \ grubby --info=ALL | grep args | grep -v 'vsyscall=none'\n\nIf any output is returned, this is a finding.\n\n\
            Check that virtual system calls are disabled by default to persist in kernel updates with the following command:\
            \ \n\n$ sudo grep vsyscall /etc/default/grub\n\nGRUB_CMDLINE_LINUX=\"vsyscall=none\"\n\nIf \"vsyscall\" is not\
            \ set to \"none\", is missing or commented out, and is not documented with the information system security officer\
            \ (ISSO) as an operational requirement, this is a finding."
