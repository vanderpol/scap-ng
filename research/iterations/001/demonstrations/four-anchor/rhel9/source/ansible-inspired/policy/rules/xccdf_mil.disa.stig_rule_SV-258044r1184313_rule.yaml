scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that the default umask for all local interactive users is "077". Identify the locations of all local interactive
    user home directories by looking at the "/etc/passwd" file. Check all local interactive user initialization files for
    interactive users with the following command: Note: The example is for a system that is configured to create users home
    directories in the "/home" directory. $ sudo find /home -maxdepth 2 -type f -name ".[^.]*" -exec grep -iH -d skip --exclude=.bash_history
    umask {} \; /home/disauser/.bash_history:grep -i umask /etc/bashrc /etc/csh.cshrc /etc/profile /home/disauser/.bash_history:grep
    -i umask /etc/login.defs If any local interactive user initialization files are found to have a umask statement that sets
    a value less restrictive than "077", this is a finding.'
  checks:
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-258044r1184313_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-258044r1184313_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>The umask controls the default access mode assigned to newly created files. A umask of 077
    limits new files to mode 600 or less permissive. Although umask can be represented as a four-digit number, the first digit
    representing special access modes is typically ignored or required to be "0". This requirement applies to the globally
    configured system defaults and the local interactive user defaults for each account on the system.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
  effective_platform_refs:
  - cpe:/o:almalinux:almalinux:9
  - cpe:/o:rocky:rocky:9
  - cpe:/o:redhat:enterprise_linux:9.0
  effective_platforms:
  - kind: cpe_name
    name: cpe:/o:almalinux:almalinux:9
    ref: cpe:/o:almalinux:almalinux:9
  - kind: cpe_name
    name: cpe:/o:rocky:rocky:9
    ref: cpe:/o:rocky:rocky:9
  - kind: cpe_name
    name: cpe:/o:redhat:enterprise_linux:9.0
    ref: cpe:/o:redhat:enterprise_linux:9.0
  extends: null
  fix: Remove the umask statement from all local interactive user's initialization files. If the account is for an application,
    the requirement for a umask less restrictive than "077" can be documented with the information system security officer,
    but the user agreement for access to the account must specify that the local interactive user must log on to their account
    first and then switch the user to the application account with the correct option to gain the account's environment variables.
