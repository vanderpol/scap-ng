rule:
  abstract: false
  check: 'Verify the audit service is configured to panic on a critical error with the following command: $ sudo grep "\-f"
    /etc/audit/audit.rules -f 2 If the value for "-f" is not "2", and availability is not documented as an overriding concern,
    this is a finding.'
