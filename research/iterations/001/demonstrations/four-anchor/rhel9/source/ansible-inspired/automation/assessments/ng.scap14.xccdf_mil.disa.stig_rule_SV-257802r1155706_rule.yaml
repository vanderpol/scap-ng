              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Red Hat Enterprise Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'By enabling the fs.protected_symlinks kernel parameter, symbolic links are permitted to be followed only
              when outside a sticky world-writable directory, or when the user identifier (UID) of the link and follower match,
              or when the directory owner matches the symlink''s owner. Disallowing such symlinks helps mitigate vulnerabilities
              based on insecure file system accessed by privileged programs, avoiding an exploitation vector exploiting unsafe
              use of open() or creat().


              Satisfies: SRG-OS-000312-GPOS-00123, SRG-OS-000324-GPOS-00125'
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
        source_definition_id: oval:mil.disa.stig.rhel9os:def:257802
