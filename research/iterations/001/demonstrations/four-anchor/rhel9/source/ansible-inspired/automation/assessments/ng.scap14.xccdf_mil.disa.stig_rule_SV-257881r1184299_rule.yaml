          - name: title
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: RHEL-09-231200 - RHEL 9 must prevent special devices on non-root local partitions.
          - attributes:
              family: unix
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Red Hat Enterprise Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'The "nodev" mount option causes the system to not interpret character or block special devices. Executing
              character or block special devices from untrusted file systems increases the opportunity for nonprivileged users
              to attain unauthorized administrative access.


              The only legitimate location for device files is the "/dev" directory located on the root partition, with the
              exception of chroot jails if implemented.'
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
        source_definition_id: oval:mil.disa.stig.rhel9os:def:257881
