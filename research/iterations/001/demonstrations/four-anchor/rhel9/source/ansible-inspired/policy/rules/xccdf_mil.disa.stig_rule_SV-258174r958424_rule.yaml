    ref: cpe:/o:redhat:enterprise_linux:9.0
  extends: null
  fix: 'Edit the aliases map file (by default /etc/aliases) used by Postfix and configure a root alias (using the user ISSO
    as an example): root: ISSO and then update the aliases database with the command: $ sudo newaliases'
