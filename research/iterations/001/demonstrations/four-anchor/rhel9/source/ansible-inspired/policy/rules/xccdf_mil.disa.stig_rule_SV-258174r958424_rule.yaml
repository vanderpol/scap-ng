scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that RHEL 9 is configured to notify the appropriate interactive users in the event of an audit processing
    failure. Find the alias maps that are being used with the following command: $ postconf alias_maps alias_maps = hash:/etc/aliases
    Query the Postfix alias maps for an alias for the root user with the following command: $ postmap -q root hash:/etc/aliases
    isso If an alias is not set, this is a finding.'
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>It is critical for the appropriate personnel to be aware if a system is at risk of failing
    to process audit logs as required. Without this notification, the security personnel may be unaware of an impending failure
    of the audit capability, and system operation may be adversely affected. Audit processing failures include software/hardware
    errors, failures in the audit capturing mechanisms, and audit storage capacity being reached or exceeded. This requirement
    applies to each audit data storage repository (i.e., distinct information system component where audit records are stored),
    the centralized audit storage capacity of organizations (i.e., all audit data storage repositories combined), or both.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
