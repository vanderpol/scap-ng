rule:
  abstract: false
  check: 'Verify the maximum time period for existing passwords is restricted to 60 days with the following commands: $ sudo
    awk -F: ''$5 > 60 {printf "%s %d\n", $1, $5}'' /etc/shadow $ sudo awk -F: ''$5 <= 0 {printf "%s %d\n", $1, $5}'' /etc/shadow
    If any results are returned that are not associated with a system account, this is a finding.'
