            \ p+i+n+u+g+s+b+acl+xattrs+sha512\n/usr/sbin/ausearch p+i+n+u+g+s+b+acl+xattrs+sha512\n/usr/sbin/aureport p+i+n+u+g+s+b+acl+xattrs+sha512\n\
            /usr/sbin/autrace p+i+n+u+g+s+b+acl+xattrs+sha512\n/usr/sbin/augenrules p+i+n+u+g+s+b+acl+xattrs+sha512\n\nIf\
            \ AIDE is not installed, ask the system administrator (SA) how file integrity checks are performed on the system.\n\
            \nIf any of the audit tools listed above do not have a corresponding line, ask the SA to indicate what cryptographic\
            \ mechanisms are being used to protect the integrity of the audit tools.  \n\nIf there is no evidence of integrity\
            \ protection, this is a finding."
        name: check
