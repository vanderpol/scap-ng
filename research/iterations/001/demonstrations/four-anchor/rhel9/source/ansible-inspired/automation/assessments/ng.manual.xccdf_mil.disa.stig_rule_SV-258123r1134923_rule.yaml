    - content_refs:
      - href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:65101
      exports: []
      inline_content: 'Note: If the system administrator (SA) demonstrates the use of an approved alternate multifactor authentication
        method, this requirement is not applicable. Verify the operating system implements Online Certificate Status Protocol
        (OCSP) and is using the proper digest value on the system with the following command: $ sudo grep -sir certificate_verification
        /etc/sssd/sssd.conf /etc/sssd/conf.d/ | grep -v "^#" /etc/sssd/conf.d/certificate_verification:certificate_verification
        = ocsp_dgst=sha512 If the certificate_verification line is missing from the [sssd] section, or is missing "ocsp_dgst=sha512",
        ask the administrator to indicate what type of multifactor authentication is being used and how the system implements
        certificate status checking. If there is no evidence of certificate status checking being used, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:65101
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Note: If the system administrator (SA) demonstrates the use of an approved alternate multifactor authentication\
            \ method, this requirement is not applicable.\n\nVerify the operating system implements Online Certificate Status\
            \ Protocol (OCSP) and is using the proper digest value on the system with the following command:\n\n$ sudo grep\
            \ -sir certificate_verification /etc/sssd/sssd.conf /etc/sssd/conf.d/ | grep -v \"^#\"\n\n/etc/sssd/conf.d/certificate_verification:certificate_verification\
            \ = ocsp_dgst=sha512\n\nIf the certificate_verification line is missing from the [sssd] section, or is missing\
            \ \"ocsp_dgst=sha512\", ask the administrator to indicate what type of multifactor authentication is being used\
            \ and how the system implements certificate status checking. \n\nIf there is no evidence of certificate status\
            \ checking being used, this is a finding."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
