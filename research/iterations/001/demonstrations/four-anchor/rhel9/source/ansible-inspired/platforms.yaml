applicability_assessment:
  id: ng.scap14.applicability
  version: 1
  description: SCAP 1.4 CPE applicability checks
  semantic_model: scap-ng-generic-assessment-graph-0.1
  name: SCAP 1.4 CPE applicability checks
  steps:
  - name: Collect oval:mil.disa.stig.ind:obj:10001201
    collect:
      capability: scapng.collect.independent.textfilecontent54
      comment: /etc/sysctl.conf
      query:
      - kind: element
        name: filepath
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
        value: /etc/sysctl.conf
      - attributes:
          operation: pattern match
        kind: element
        name: pattern
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
        value: (?:^|\.*\n)\s*net\.ipv6\.conf\.all\.disable_ipv6\s*=\s*(\d+)\s*$
      - attributes:
          datatype: int
          operation: greater than or equal
        kind: element
        name: instance
        namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
        value: '1'
      source_namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5#independent
      source_object_id: oval:mil.disa.stig.ind:obj:10001201
      source_type: textfilecontent54_object
      version: '1'
    register: oval:mil.disa.stig.ind:obj:10001201
