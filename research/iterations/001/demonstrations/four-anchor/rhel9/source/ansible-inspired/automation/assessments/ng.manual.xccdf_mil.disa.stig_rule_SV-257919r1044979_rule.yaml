        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:28101
      exports: []
      inline_content: 'Verify the system commands contained in the following directories are group-owned by "root", or a required
        system account, with the following command: $ sudo find -L /bin /sbin /usr/bin /usr/sbin /usr/libexec /usr/local/bin
        /usr/local/sbin ! -group root -exec stat -L -c "%G %n" {} \; If any system commands are returned and are not group-owned
        by a required system account, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
