          text: "Verify that dnf always checks the GPG signature of locally installed software packages before installation:\n\
            \n$ grep localpkg_gpgcheck /etc/dnf/dnf.conf \n\nlocalpkg_gpgcheck=1 \n\nIf \"localpkg_gpgcheck\" is not set to\
