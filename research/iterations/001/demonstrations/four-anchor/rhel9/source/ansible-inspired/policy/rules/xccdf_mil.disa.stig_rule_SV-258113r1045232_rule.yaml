scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: Verify that RHEL 9 requires that passwords can have a maximum of four repeating characters of the same character
    class. $ grep maxclassrepeat /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf maxclassrepeat = 4 If
    the value of "maxclassrepeat" is set to "0", more than "4", or is commented out, this is a finding.
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-258113r1045232_rule
    assessment_version: 1
    selector: default
    source_selector: ''
