  extends: null
  fix: 'Configure RHEL 9 to require the change of the number of repeating characters of the same character class when passwords
    are changed by setting the "maxclassrepeat" option. Add or update the following line in the "/etc/security/pwquality.conf"
    file or a configuration file in the "/etc/security/pwquality.conf.d/" directory to contain the "maxclassrepeat" parameter:
    maxclassrepeat = 4'
