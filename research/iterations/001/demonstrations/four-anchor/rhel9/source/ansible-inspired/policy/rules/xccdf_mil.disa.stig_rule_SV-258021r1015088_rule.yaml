scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify RHEL 9 enables a user''s session lock until that user re-establishes access using established identification
    and authentication procedures with the following command: Note: This requirement assumes the use of the RHEL 9 default
    graphical user interface, the GNOME desktop environment. If the system does not have any graphical user interface installed,
    this requirement is Not Applicable. $ gsettings get org.gnome.desktop.screensaver lock-enabled true If the setting is
    "false", this is a finding.'
  cluster_id: null
  conflicts: []
  description: '<VulnDiscussion>A session lock is a temporary action taken when a user stops work and moves away from the
    immediate physical vicinity of the information system but does not want to log out because of the temporary nature of
    the absence. The session lock is implemented at the point where session activity can be determined. Regardless of where
    the session lock is determined and implemented, once invoked, the session lock must remain in place until the user reauthenticates.
    No other activity aside from reauthentication must unlock the system. Satisfies: SRG-OS-000028-GPOS-00009, SRG-OS-000030-GPOS-00011</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
  discussion: null
  effective_platform_refs:
  - cpe:/o:almalinux:almalinux:9
  - cpe:/o:rocky:rocky:9
  - cpe:/o:redhat:enterprise_linux:9.0
  effective_platforms:
  - kind: cpe_name
    name: cpe:/o:almalinux:almalinux:9
    ref: cpe:/o:almalinux:almalinux:9
  - kind: cpe_name
