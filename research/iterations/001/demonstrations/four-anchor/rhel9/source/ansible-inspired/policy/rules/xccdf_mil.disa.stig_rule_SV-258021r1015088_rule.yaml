  - kind: cpe_name
    name: cpe:/o:redhat:enterprise_linux:9.0
    ref: cpe:/o:redhat:enterprise_linux:9.0
  extends: null
  fix: 'Configure RHEL 9 to enable a user''s session lock until that user re-establishes access using established identification
    and authentication procedures. Create a database to contain the system-wide screensaver settings (if it does not already
    exist) with the following example: $ sudo vi /etc/dconf/db/local.d/00-screensaver Edit the "[org/gnome/desktop/screensaver]"
    section of the database file and add or update the following lines: # Set this to true to lock the screen when the screensaver
    activates lock-enabled=true Update the system databases: $ sudo dconf update'
