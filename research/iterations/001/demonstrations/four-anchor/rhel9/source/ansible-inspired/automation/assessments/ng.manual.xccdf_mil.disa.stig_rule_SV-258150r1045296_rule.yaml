        name: ocil:navy.navwar.niwcatlantic.scc.rhel9os:questionnaire:70101
      exports: []
      inline_content: 'Verify that "rsyslog" is configured to log cron events with the following command: Note: If another
        logging package is used, substitute the utility configuration file for "/etc/rsyslog.conf" or "/etc/rsyslog.d/*.conf"
        files. $ grep -s cron /etc/rsyslog.conf /etc/rsyslog.d/*.conf /etc/rsyslog.conf:*.info;mail.none;authpriv.none;cron.none
        /var/log/messages /etc/rsyslog.conf:cron.* /var/log/cron If the command does not return a response, check for cron
        logging all facilities with the following command: $ logger -p local0.info "Test message for all facilities." Check
        the logs for the test message with: $ sudo tail /var/log/messages If "rsyslog" is not logging messages for the cron
        facility or all facilities, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
