scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify ExecShield is enabled on 64-bit RHEL 9 systems. Run the following command: $ grep ^flags /proc/cpuinfo |
    grep -Ev ''([^[:alnum:]])(nx)([^[:alnum:]]|$)'' If any output is returned, this is a finding. Next, run the following
    command: $ sudo grubby --info=ALL | grep args | grep -E ''([^[:alnum:]])(noexec)([^[:alnum:]])'' If any output is returned,
    this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-257817r1069383_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-257817r1069383_rule
    assessment_version: 1
    selector: automated
    source_selector: automated
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-257817r1069383_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: '<VulnDiscussion>ExecShield uses the segmentation feature on all x86 systems to prevent execution in memory
    higher than a certain address. It writes an address as a limit in the code segment descriptor, to control where code can
    be executed, on a per-process basis. When the kernel places a process''s memory regions such as the stack and heap higher
    than this address, the hardware prevents execution in that address range. This is enabled by default on the latest Red
    Hat and Fedora systems if supported by the hardware. Checking dmesg will return a false-positive if the system has generated
    enough kernel messages that the "(Execute Disable) protection: active" line is no longer present in the output from dmesg(1).
    A better way to ensure that ExecShield is enabled is to first ensure all processors support the NX feature, and then to
    check that noexec was not passed to the kernel command line.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
  discussion: null
  effective_platform_refs:
  - cpe:/o:almalinux:almalinux:9
  - cpe:/o:rocky:rocky:9
  - cpe:/o:redhat:enterprise_linux:9.0
  effective_platforms:
  - kind: cpe_name
    name: cpe:/o:almalinux:almalinux:9
    ref: cpe:/o:almalinux:almalinux:9
  - kind: cpe_name
    name: cpe:/o:rocky:rocky:9
    ref: cpe:/o:rocky:rocky:9
  - kind: cpe_name
    name: cpe:/o:redhat:enterprise_linux:9.0
    ref: cpe:/o:redhat:enterprise_linux:9.0
  extends: null
  fix: 'If /proc/cpuinfo shows that one or more processors do not enable ExecShield (lack the "nx" feature flag), verify that
    the NX/XD feature is not disabled in the BIOS or UEFI. If it is disabled, enable it. If the noexec option is present on
    the kernel command line, update the GRUB 2 bootloader configuration to remove it by running the following command: $ sudo
    grubby --update-kernel=ALL --remove-args=noexec'
