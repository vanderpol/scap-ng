scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify the pam_faillock.so module is present in the "/etc/pam.d/system-auth" file: $ grep pam_faillock.so /etc/pam.d/system-auth
    auth required pam_faillock.so preauth auth required pam_faillock.so authfail account required pam_faillock.so If the pam_faillock.so
    module is not present in the "/etc/pam.d/system-auth" file with the "preauth" line listed before pam_unix.so, this is
    a finding. If the system administrator (SA) can demonstrate that the required configuration is contained in a PAM configuration
    file included or substacked from the system-auth file, this is not a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-258095r1045189_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-258095r1045189_rule
    assessment_version: 1
    selector: automated
    source_selector: automated
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-258095r1045189_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>If the pam_faillock.so module is not loaded, the system will not correctly lockout accounts
    to prevent password guessing attacks.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
  effective_platform_refs:
  - cpe:/o:almalinux:almalinux:9
  - cpe:/o:rocky:rocky:9
  - cpe:/o:redhat:enterprise_linux:9.0
  effective_platforms:
  - kind: cpe_name
    name: cpe:/o:almalinux:almalinux:9
    ref: cpe:/o:almalinux:almalinux:9
  - kind: cpe_name
    name: cpe:/o:rocky:rocky:9
    ref: cpe:/o:rocky:rocky:9
  - kind: cpe_name
    name: cpe:/o:redhat:enterprise_linux:9.0
    ref: cpe:/o:redhat:enterprise_linux:9.0
  extends: null
  fix: 'Configure RHEL 9 to include the use of the pam_faillock.so module in the /etc/pam.d/system-auth file. If PAM is managed
    with authselect, enable the feature with the following command: $ sudo authselect enable-feature with-faillock Otherwise,
    add/modify the appropriate sections of the "/etc/pam.d/system-auth" file to match the following lines: Note: The "preauth"
    line must be listed before pam_unix.so. auth required pam_faillock.so preauth auth required pam_faillock.so authfail account
    required pam_faillock.so'
