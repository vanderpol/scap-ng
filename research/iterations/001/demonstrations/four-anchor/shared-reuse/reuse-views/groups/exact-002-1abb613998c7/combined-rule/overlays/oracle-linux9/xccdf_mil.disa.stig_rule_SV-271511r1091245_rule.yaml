  benchmark: oracle-linux9
  policy:
    abstract: false
    check: 'Verify that OL 9 has enabled the hardware random number generator entropy gatherer service with the following
      command: $ systemctl is-active rngd active If the rngd service is not active, this is a finding.'
    cluster_id: null
    conflicts: []
    description: <VulnDiscussion>The most important characteristic of a random number generator is its randomness, namely
      its ability to deliver random numbers that are impossible to predict. Entropy in computer security is associated with
      the unpredictability of a source of randomness. The random source with high entropy tends to achieve a uniform distribution
      of random values. Random number generators are one of the most important building blocks of cryptosystems. The rngd
      service feeds random data from hardware device to kernel random device. Quality (nonpredictable) random number generation
      is important for several security functions (i.e., ciphers).</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
