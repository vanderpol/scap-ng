      exports: []
      inline_content: Verify firewall exceptions to inbound connections on domain workstations include only authorized remote
        management hosts. If allowed inbound exceptions are not limited to authorized remote management hosts, this is a finding.
        Review inbound firewall exceptions. Computer Configuration >> Windows Settings >> Security Settings >> Windows Defender
        Firewall with Advanced Security >> Windows Defender Firewall with Advanced Security >> Inbound Rules (this link will
        be in the right pane) For any inbound rules that allow connections view the Scope for Remote IP address. This may
        be defined as an IP address, subnet, or range. The rule must apply to all firewall profiles. If a third-party firewall
        is used, ensure comparable settings are in place.
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:5501
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify firewall exceptions to inbound connections on domain workstations include only authorized remote management
            hosts.


            If allowed inbound exceptions are not limited to authorized remote management hosts, this is a finding.


            Review inbound firewall exceptions.

            Computer Configuration >> Windows Settings >> Security Settings >> Windows Defender Firewall with Advanced Security
            >> Windows Defender Firewall with Advanced Security >> Inbound Rules (this link will be in the right pane)


            For any inbound rules that allow connections view the Scope for Remote IP address. This may be defined as an IP
            address, subnet, or range. The rule must apply to all firewall profiles.


            If a third-party firewall is used, ensure comparable settings are in place.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
