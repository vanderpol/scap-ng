        name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:16501
      exports: []
      inline_content: 'Verify the permissions on the Application event log (Application.evtx). Standard user accounts or groups
        must not have access. The default permissions listed below satisfy this requirement. Eventlog - Full Control SYSTEM
        - Full Control Administrators - Full Control The default location is the "%SystemRoot%\SYSTEM32\WINEVT\LOGS" directory.
        They may have been moved to another folder. If the permissions for these files are not as restrictive as the ACLs
        listed, this is a finding. Note: If "APPLICATION PACKAGE AUTHORITY\ALL APPLICATION PACKAGES" has Special Permissions,
        this would not be a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:16501
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify the permissions on the Application event log (Application.evtx). Standard user accounts or groups
            must not have access. The default permissions listed below satisfy this requirement.


            Eventlog - Full Control

            SYSTEM - Full Control

            Administrators - Full Control


            The default location is the "%SystemRoot%\SYSTEM32\WINEVT\LOGS" directory. They may have been moved to another
            folder.


            If the permissions for these files are not as restrictive as the ACLs listed, this is a finding.


            Note: If "APPLICATION PACKAGE AUTHORITY\ALL APPLICATION PACKAGES" has Special Permissions, this would not be a
            finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
