rule:
  abstract: false
  check: 'The default behavior is for File Explorer heap termination on corruption to be enabled. If it exists and is configured
    with a value of "1", this is a finding. Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows\Explorer\
    Value Name: NoHeapTerminationOnCorruption Value Type: REG_DWORD Value: 0x00000000 (0) (or if the Value Name does not exist)'
