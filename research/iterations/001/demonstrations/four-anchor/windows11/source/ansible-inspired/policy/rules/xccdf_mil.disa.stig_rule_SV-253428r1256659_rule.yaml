    name: cpe:/o:microsoft:windows_11
    ref: cpe:/o:microsoft:windows_11
  extends: null
  fix: Install valid (unexpired) ECA Root CA certificates on unclassified systems. The list below is not to be treated as
    exhaustive. The STIG should not be used as a definitive resource for the organizationally approved certificates for the
    systems. ECA Root CA 4 ECA Root CA 5 The InstallRoot tool is available on Cyber Exchange at https://cyber.mil/pki-pke/tools-configuration-files.
    Certificate bundles published by the PKI can be found at https://crl.gds.disa.mil/.
