          - attributes:
              family: windows
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Microsoft Windows 11
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'Maintaining an audit trail of system activity logs can help identify configuration errors, troubleshoot
              service disruptions, and analyze compromises that have occurred, as well as detect attacks. Audit logs are necessary
              to provide a trail of evidence in case the system or network is compromised. Collecting this data is essential
              for analyzing the security of information assets and detecting signs of suspicious and unexpected behavior.


              Enabling "Include command line data for process creation events" will record the command line information with
              the process creation events in the log. This can provide additional detail when malware has run on a system.'
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
