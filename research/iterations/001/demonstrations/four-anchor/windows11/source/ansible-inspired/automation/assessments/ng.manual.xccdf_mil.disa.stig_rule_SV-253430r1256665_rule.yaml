  description: The US DoW CCEB Interoperability Root CA cross-certificates must be installed in the Untrusted Certificates
    Store on unclassified systems.
  name: The US DoW CCEB Interoperability Root CA cross-certificates must be installed in the Untrusted Certificates Store
    on unclassified systems.
