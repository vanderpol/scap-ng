  conflicts: []
  default_check: default
  description: <VulnDiscussion>Use of weak or untested encryption algorithms undermines the purposes of utilizing encryption
    to protect data. By default Windows uses ECC curves with shorter key lengths first. Requiring ECC curves with longer key
    lengths to be prioritized first helps ensure more secure algorithms are used.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
