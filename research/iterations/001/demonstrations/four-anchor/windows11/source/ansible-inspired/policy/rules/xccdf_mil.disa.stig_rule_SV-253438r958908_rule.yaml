  check: 'If the following registry value does not exist or is not configured as specified, this is a finding: Registry Hive:
    HKEY_LOCAL_MACHINE Registry Path: \SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\ Value Name: RequireSignOrSeal
    Value Type: REG_DWORD Value: 1'
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>Requests sent on the secure channel are authenticated, and sensitive information (such as passwords)
    is encrypted, but not all information is encrypted. If this policy is enabled, outgoing secure channel traffic will be
    encrypted and signed.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
