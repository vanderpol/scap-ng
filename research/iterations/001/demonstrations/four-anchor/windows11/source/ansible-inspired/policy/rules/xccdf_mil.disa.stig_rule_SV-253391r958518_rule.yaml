  check: 'If the following registry value does not exist or is not configured as specified, this is a finding: Registry Hive:
    HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\CredUI\ Value Name: EnumerateAdministrators
    Value Type: REG_DWORD Value: 0'
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>Enumeration of administrator accounts when elevating can provide part of the logon information
