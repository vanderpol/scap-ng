        name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:18501
      exports: []
      inline_content: 'If the device or operating system does not have a camera installed, this requirement is not applicable.
        This requirement is not applicable to mobile devices (smartphones and tablets), where the use of the camera is a local
        authorizing official (AO) decision. This requirement is not applicable to dedicated VTC suites located in approved
        VTC locations that are centrally managed. For an external camera, if there is not a method for the operator to manually
        disconnect camera at the end of collaborative computing sessions, this is a finding. For a built-in camera, the camera
        must be protected by a camera cover (e.g. laptop camera cover slide) when not in use. If the built-in camera is not
        protected with a camera cover, or if the built-in camera is not disabled in the bios, this is a finding. If the camera
        is not disconnected or covered, the following registry entry is required: Registry Hive: HKEY_LOCAL_MACHINE RegistryPath\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\webcam
        Value Name: Value Value Data: Deny If "Value Name" is set to a value other than "Deny" and the collaborative computing
        device has not been authorized for use, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
