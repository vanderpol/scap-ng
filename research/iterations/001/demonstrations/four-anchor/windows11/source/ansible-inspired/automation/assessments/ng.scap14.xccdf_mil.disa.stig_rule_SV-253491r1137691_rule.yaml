        metadata:
          children:
          - name: title
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: WN11-UR-000070 - The "Deny access to this computer from the network" user right on workstations must be
              configured to prevent access from highly privileged domain accounts and local accounts on domain systems and
              unauthenticated access on all systems.
          - attributes:
              family: windows
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Microsoft Windows 11
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'Inappropriate granting of user rights can provide system, administrative, and other high-level capabilities.


              The "Deny access to this computer from the network" right defines the accounts that are prevented from logging
              on from the network.


              In an Active Directory Domain, denying logons to the Enterprise Admins and Domain Admins groups on lower trust
              systems helps mitigate the risk of privilege escalation from credential theft attacks, which could lead to the
              compromise of an entire domain.


              Local accounts on domain-joined systems must also be assigned this right to decrease the risk of lateral movement
              resulting from credential theft attacks.


              The Guests group must be assigned this right to prevent unauthenticated access.'
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
        source_definition_id: oval:mil.disa.stig.windows11:def:253491
        version: '2'
