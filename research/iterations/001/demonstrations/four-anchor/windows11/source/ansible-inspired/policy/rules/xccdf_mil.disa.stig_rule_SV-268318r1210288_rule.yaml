scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify the Windows 11 system is receiving policy from either group Policy or an MDM with the following steps: From
    a command line or PowerShell: gpresult /R OS Configuration: Member Workstation If the system OS Configuration is set to
    "Member Workstation", the system is being managed by GPO. If the system OS Configuration is set to "Standalone Workstation"
    and is not being managed by GPO, ask the administrator to indicate which MDM is managing the device. Issue to the following
    for Intune. Note: Intune must be running at time of command. From PowerShell: Get-Service -Name "IntuneManagementExtension"
    This should return the following result: Status = Running, Name = IntuneManagementExtension, DisplayName = Microsoft Intune
    Management Extension If Intune is not installed, the response will include "ObjectNotFound" and/or "NoServiceFoundForGivenName".
    If the Windows 11 system is not receiving policy from either group Policy or an MDM (that is running), this is a finding.'
