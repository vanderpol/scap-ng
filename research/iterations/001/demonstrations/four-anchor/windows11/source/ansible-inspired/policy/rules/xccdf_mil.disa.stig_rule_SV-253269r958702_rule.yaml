  effective_platforms:
  - kind: cpe_name
    name: cpe:/o:microsoft:windows_11
    ref: cpe:/o:microsoft:windows_11
  extends: null
  fix: Configure the system to include only administrator groups or accounts that are responsible for the system in the local
    Administrators group. For domain-joined workstations, the Domain Admins group must be replaced by a domain workstation
    administrator group. Remove any standard user accounts.
