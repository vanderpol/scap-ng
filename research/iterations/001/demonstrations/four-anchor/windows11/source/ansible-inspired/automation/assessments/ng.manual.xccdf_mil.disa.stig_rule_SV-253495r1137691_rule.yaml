  id: ng.manual.xccdf_mil.disa.stig_rule_SV-253495r1137691_rule
  version: 1
  description: The "Deny log on through Remote Desktop Services" user right on Windows 11 workstations must be configured
    to prevent access from highly privileged domain accounts and local accounts on domain systems and unauthenticated access
    on all systems.
