    ref: cpe:/o:microsoft:windows_11
  extends: null
  fix: Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Advanced Audit Policy
    Configuration >> System Audit Policies >> System >> "Audit Other System Events" with "Success" selected.
