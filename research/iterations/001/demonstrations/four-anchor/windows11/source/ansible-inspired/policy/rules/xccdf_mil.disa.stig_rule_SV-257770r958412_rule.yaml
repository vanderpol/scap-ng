rule:
  abstract: false
  check: 'Ensure Audit Process Creation auditing has been enabled: Computer Configuration >> Windows Settings >> Security
    Settings >> Advanced Audit Policy Configuration >> System Audit Policy >> Detailed Tracking >> Audit Process Creation.
    If "Audit Process Creation" is not set to "Failure", this is a finding.'
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>When this policy setting is enabled, the operating system generates audit events when a process
    fails to start and the name of the program or user that created it. These audit events can assist in understanding how
    a computer is being used and tracking user activity.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
