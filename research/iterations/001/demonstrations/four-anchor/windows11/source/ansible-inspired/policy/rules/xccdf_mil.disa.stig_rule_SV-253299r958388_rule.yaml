rule:
  abstract: false
  check: Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy >>
    Computer Configuration >> Windows Settings >> Security Settings >> Account Policies >> Account Lockout Policy. If the
    "Reset account lockout counter after" value is less than "15" minutes, this is a finding.
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>The account lockout feature, when enabled, prevents brute-force password attacks on the system.
    This parameter specifies the period of time that must pass after failed logon attempts before the counter is reset to
    0. The smaller this value is, the less effective the account lockout feature will be in protecting the local system.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
