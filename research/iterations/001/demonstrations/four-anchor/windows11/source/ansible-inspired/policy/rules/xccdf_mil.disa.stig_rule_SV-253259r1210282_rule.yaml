    ref: cpe:/o:microsoft:windows_11
  extends: null
  fix: 'Enable full disk encryption on all information systems (including SIPRNet) using BitLocker. BitLocker, included in
    Windows, can be enabled in the Control Panel under "BitLocker Drive Encryption" as well as other management tools. Note:
    An alternate encryption application may be used in lieu of BitLocker providing it is configured for full disk encryption
    and satisfies the pre-boot authentication requirements (WN11-00-000031 and WN11-00-000032).'
