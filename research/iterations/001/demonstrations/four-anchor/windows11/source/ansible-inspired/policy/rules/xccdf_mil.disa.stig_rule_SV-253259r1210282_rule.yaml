scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'For AVD implementations with no data at rest, this is NA. Verify all Windows 11 information systems (including SIPRNet)
    employ BitLocker for full disk encryption. If full disk encryption using BitLocker is not implemented, this is a finding.
    Verify BitLocker is turned on for the operating system drive and any fixed data drives. Open "BitLocker Drive Encryption"
    from the Control Panel. If the operating system drive or any fixed data drives have "Turn on BitLocker", this is a finding.
    Note: An alternate encryption application may be used in lieu of BitLocker providing it is configured for full disk encryption
    and satisfies the pre-boot authentication requirements (WN11-00-000031 and WN11-00-000032).'
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>If data at rest is unencrypted, it is vulnerable to disclosure. Even if the operating system
    enforces permissions on data access, an adversary can remove nonvolatile memory and read it directly, thereby circumventing
    operating system controls. Encrypting the data ensures that confidentiality is protected even when the operating system
    is not running.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
