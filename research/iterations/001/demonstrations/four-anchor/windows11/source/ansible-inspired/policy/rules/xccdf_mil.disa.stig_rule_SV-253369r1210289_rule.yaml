authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Confirm VBS is enabled and running with Secure Boot or Secure Boot and DMA Protection. If there are documented operational
    mission needs to disable VBS, this may be reduced to a CAT III finding. Run "PowerShell" with elevated privileges (run
    as administrator). Enter the following: "Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard"
    If "RequiredSecurityProperties" does not include a value of "2" indicating "Secure Boot" (e.g., "{1, 2}"), this is a finding.
    If "Secure Boot and DMA Protection" is configured, "3" will also be displayed in the results (e.g., "{1, 2, 3}"). If "VirtualizationBasedSecurityStatus"
    is not a value of "2" indicating "Running", this is a finding. Alternately: Run "System Information". Under "System Summary",
    verify the following: If "Device Guard virtualization-based security" does not display "Running", this is a finding. If
    "Device Guard Required Security Properties" does not display "Base Virtualization Support, Secure Boot", this is a finding.
    If "Secure Boot and DMA Protection" is configured, "DMA Protection" will also be displayed (e.g., "Base Virtualization
    Support, Secure Boot, DMA Protection"). The policy settings referenced in the Fix section will configure the following
    registry values. However, due to hardware requirements, the registry values alone do not ensure proper function. Registry
    Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\ Value Name: EnableVirtualizationBasedSecurity
    Value Type: REG_DWORD Value: 1 Value Name: RequirePlatformSecurityFeatures Value Type: REG_DWORD Value: 1 (Secure Boot
    only) or 3 (Secure Boot and DMA Protection) A Microsoft article on the Credential Guard system requirement can be found
    at the following link: https://technet.microsoft.com/en-us/itpro/windows/keep-secure/credential-guard-requirements'
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>VBS provides the platform for the additional security features, Credential Guard, and virtualization-based
    protection of code integrity. Secure Boot is the minimum security level, with DMA protection providing additional memory
    protection. DMA Protection requires a CPU that supports input/output memory management unit (IOMMU).</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
