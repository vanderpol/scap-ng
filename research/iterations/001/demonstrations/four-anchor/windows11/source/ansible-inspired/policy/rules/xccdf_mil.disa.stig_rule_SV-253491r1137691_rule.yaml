scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy >>
    Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment. If the following
    groups or accounts are not defined for the "Deny access to this computer from the network" right, this is a finding: Domain
    Systems Only: Enterprise Admins group Domain Admins group Local account (see Note below) All Systems: Guests group Privileged
    Access Workstations (PAWs) dedicated to the management of Active Directory are exempt from denying the Enterprise Admins
    and Domain Admins groups. (See the Windows Privileged Access Workstation STIG for PAW requirements.) Note: "Local account"
    is a built-in security group used to assign user rights and permissions to all local accounts.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-253491r1137691_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-253491r1137691_rule
    assessment_version: 1
    selector: automated
    source_selector: automated
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-253491r1137691_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>Inappropriate granting of user rights can provide system, administrative, and other high-level
    capabilities. The "Deny access to this computer from the network" right defines the accounts that are prevented from logging
    on from the network. In an Active Directory Domain, denying logons to the Enterprise Admins and Domain Admins groups on
    lower trust systems helps mitigate the risk of privilege escalation from credential theft attacks, which could lead to
    the compromise of an entire domain. Local accounts on domain-joined systems must also be assigned this right to decrease
    the risk of lateral movement resulting from credential theft attacks. The Guests group must be assigned this right to
    prevent unauthenticated access.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
  effective_platform_refs:
  - cpe:/o:microsoft:windows_11
  effective_platforms:
  - kind: cpe_name
    name: cpe:/o:microsoft:windows_11
    ref: cpe:/o:microsoft:windows_11
  extends: null
  fix: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >>
    User Rights Assignment >> "Deny access to this computer from the network" to include the following: Domain Systems Only:
    Enterprise Admins group Domain Admins group Local account (see Note below) All Systems: Guests group Privileged Access
    Workstations (PAWs) dedicated to the management of Active Directory are exempt from denying the Enterprise Admins and
    Domain Admins groups. (See the Windows Privileged Access Workstation STIG for PAW requirements.) Note: "Local account"
    is a built-in security group used to assign user rights and permissions to all local accounts.'
