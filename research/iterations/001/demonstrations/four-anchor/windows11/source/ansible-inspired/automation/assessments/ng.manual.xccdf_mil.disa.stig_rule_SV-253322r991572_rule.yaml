          text: 'Security Option "Audit: Force audit policy subcategory settings to override audit policy category settings"
            must be set to "Enabled" (WN11-SO-000030) for the detailed auditing subcategories to be effective.


            Use the AuditPol tool to review the current Audit Policy configuration:


