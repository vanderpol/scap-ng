rule:
  abstract: false
  check: Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer Policy >>
    Computer Configuration >> Windows Settings >> Security Settings >> Account Policies >> Password Policy. If the value for
    the "Maximum password age" is greater than "60" days, this is a finding. If the value is set to "0" (never expires), this
    is a finding.
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>The longer a password is in use, the greater the opportunity for someone to gain unauthorized
    knowledge of the passwords. Scheduled changing of passwords hinders the ability of unauthorized system users to crack
    passwords and gain access to a system.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
