rule:
  abstract: false
  check: 'If the following registry value does not exist or is not configured as specified, this is a finding: Registry Hive:
    HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows\DataCollection\ Value Name: AllowTelemetry Type:
    REG_DWORD Value: 0x00000000 (0) (Security) 0x00000001 (1) (Basic)'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-253393r1256676_rule
    assessment_version: 1
