  effective_platforms:
  - kind: cpe_name
    name: cpe:/o:microsoft:windows_11
    ref: cpe:/o:microsoft:windows_11
  extends: null
  fix: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components >> Data Collection
    and Preview Builds >> "Allow Diagnostic Data" to "Enabled" with "Send required diagnostic data" selected in "Options:".
