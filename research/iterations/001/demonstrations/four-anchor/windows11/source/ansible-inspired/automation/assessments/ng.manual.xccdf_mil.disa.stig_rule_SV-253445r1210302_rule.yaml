        name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:36701
      exports: []
      inline_content: 'If the following registry value does not exist or is not configured as specified, this is a finding:
        Note: If configuring this policy via a Policy Configuration Service Provider (CSP), additional steps are needed (see
        Fix Text). Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\
        Value Name: LegalNoticeText Value Type: REG_SZ Value: You are accessing a U.S. Government (USG) Information System
        (IS) that is provided for USG-authorized use only. By using this IS (which includes any device attached to this IS),
        you consent to the following conditions: -The USG routinely intercepts and monitors communications on this IS for
        purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and defense, personnel
        misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations. -At any time, the USG may inspect
        and seize data stored on this IS. -Communications using, or data stored on, this IS are not private, are subject to
        routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized purpose. -This IS
        includes security measures (e.g., authentication and access controls) to protect USG interests--not for your personal
        benefit or privacy. -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI investigative
        searching or monitoring of the content of privileged communications, or work product, related to personal representation
        or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work product
        are private and confidential. See User Agreement for details.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:36701
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "If the following registry value does not exist or is not configured as specified, this is a finding:\nNote:\
            \ If configuring this policy via a Policy Configuration Service Provider (CSP), additional steps are needed (see\
            \ Fix Text).\n \nRegistry Hive: HKEY_LOCAL_MACHINE\nRegistry Path: \\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\\
            Policies\\System\\\n\nValue Name: LegalNoticeText\n\nValue Type: REG_SZ\nValue: \nYou are accessing a U.S. Government\
            \ (USG) Information System (IS) that is provided for USG-authorized use only.\n\nBy using this IS (which includes\
            \ any device attached to this IS), you consent to the following conditions:\n\n-The USG routinely intercepts and\
            \ monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring,\
            \ network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI)\
            \ investigations.\n\n-At any time, the USG may inspect and seize data stored on this IS.\n\n-Communications using,\
            \ or data stored on, this IS are not private, are subject to routine monitoring, interception, and search, and\
            \ may be disclosed or used for any USG-authorized purpose.\n\n-This IS includes security measures (e.g., authentication\
            \ and access controls) to protect USG interests--not for your personal benefit or privacy.\n\n-Notwithstanding\
            \ the above, using this IS does not constitute consent to PM, LE or CI investigative searching or monitoring of\
            \ the content of privileged communications, or work product, related to personal representation or services by\
            \ attorneys, psychotherapists, or clergy, and their assistants. Such communications and work product are private\
            \ and confidential. See User Agreement for details."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
