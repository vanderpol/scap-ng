    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>It is detrimental for operating systems to provide, or install by default, functionality exceeding
    requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore, may
    remain unsecured. They increase the risk to the platform by providing additional attack vectors. Operating systems are
    capable of providing a wide variety of functions and services. Some of the functions and services, provided by default,
    may not be necessary to support essential organizational operations (e.g., key missions, functions). The Copilot Rewrite
    functionality within Notepad and Image Generation within Paint is dependent upon the use of AI credits from a Microsoft
    365 Personal or Family subscription. Organizational users must not use personal accounts to login to applications on enterprise
    machines.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
  effective_platform_refs:
  - cpe:/o:microsoft:windows_11
  effective_platforms:
  - kind: cpe_name
    name: cpe:/o:microsoft:windows_11
    ref: cpe:/o:microsoft:windows_11
  extends: null
  fix: 'Configure the following Group Policy: Computer Configuration >> Administrative Templates >> Windows Components >>
    Microsoft Account "block all consumer Microsoft account user authentication" to "Enabled". For systems managed by Intune,
    apply the DoW Windows 11 STIG Settings Catalog (or equivalent Intune policy) found in the Intune policy package available
    on cyber.mil. Steps to create an Intune policy: 1. Sign in to the Intune admin center >> Devices >> Configuration >> Create
    >> New Policy. 2. Platform: Windows 10 and later. Profile type: Settings Catalog, then click "Create". 3. Basics: Provide
    a Name and Description of the profile, then click "Next". 4. Configuration settings: Click "+ Add settings" and search
    for consumer under the Settings picker. Under the Administrative Templates\Windows Components\Microsoft account category,
    check the box next to "Block all consumer Microsoft account user authentication". Click the Enabled radio button, then
    click "Next". 5. Scope tags: (optional), then click "Next". 6. Assignments: Assign the policy to Entra security groups
    that contain the target users or devices, then click "Next". 7. Review + create: Review the deployment summary, then click
    "Create".'
