          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Search all drives for *.p12 and *.pfx files.


            If any files with these extensions exist, this is a finding.


            This does not apply to server-based applications that have a requirement for .p12 certificate files (e.g., Oracle
            Wallet Manager) or Adobe PreFlight certificate files. Some applications create files with extensions of .p12 that
            are not certificate installation files. Removal of non-certificate installation files from systems is not required.
            These must be documented with the ISSO.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
