      exports: []
      inline_content: 'If the following registry value does not exist or is not configured as specified, this is a finding:
        Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\ Value Name:
        SCRemoveOption Value Type: REG_SZ Value: 1 (Lock Workstation) or 2 (Force Logoff) This can be left not configured
        or set to "No action" on workstations with the following conditions. This must be documented with the ISSO. -The setting
        cannot be configured due to mission needs, or because it interferes with applications. -Policy must be in place that
        users manually lock workstations when leaving them unattended. -The screen saver is properly configured to lock as
        required.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:37301
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'If the following registry value does not exist or is not configured as specified, this is a finding:


            Registry Hive: HKEY_LOCAL_MACHINE

            Registry Path: \SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\


            Value Name: SCRemoveOption


            Value Type: REG_SZ

            Value: 1 (Lock Workstation) or 2 (Force Logoff)


            This can be left not configured or set to "No action" on workstations with the following conditions. This must
            be documented with the ISSO.

            -The setting cannot be configured due to mission needs, or because it interferes with applications.

            -Policy must be in place that users manually lock workstations when leaving them unattended.

            -The screen saver is properly configured to lock as required.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
