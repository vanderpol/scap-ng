        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
    - content_refs:
      - href: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-ocil.xml
        name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:2701
      exports: []
      inline_content: 'Run "PowerShell". Copy the lines below to the PowerShell window and enter. "([ADSI](''WinNT://{0}''
        -f $env:COMPUTERNAME)).Children | Where { $_.SchemaClassName -eq ''user'' } | ForEach { $user = ([ADSI]$_.Path) $lastLogin
        = $user.Properties.LastLogin.Value $enabled = ($user.Properties.UserFlags.Value -band 0x2) -ne 0x2 if ($lastLogin
        -eq $null) { $lastLogin = ''Never'' } Write-Host $user.Name $lastLogin $enabled }" This will return a list of local
        accounts with the account name, last logon, and if the account is enabled (True/False). For example: User1 10/31/2015
        5:49:56 AM True Review the list to determine the finding validity for each account reported. Exclude the following
        accounts: Built-in administrator account (Disabled, SID ending in 500) Built-in guest account (Disabled, SID ending
        in 501) Built-in DefaultAccount (Disabled, SID ending in 503) Local administrator account If any enabled accounts
        have not been logged on to within the past 35 days, this is a finding. Inactive accounts that have been reviewed and
        deemed to be required must be documented with the information system security officer (ISSO).'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:2701
          name: check-content-ref
