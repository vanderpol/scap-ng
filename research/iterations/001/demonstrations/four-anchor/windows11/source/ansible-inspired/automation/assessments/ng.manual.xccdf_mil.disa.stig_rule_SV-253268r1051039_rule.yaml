        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Run \"PowerShell\".\nCopy the lines below to the PowerShell window and enter.\n\n\"([ADSI]('WinNT://{0}'\
            \ -f $env:COMPUTERNAME)).Children | Where { $_.SchemaClassName -eq 'user' } | ForEach {\n  $user = ([ADSI]$_.Path)\n\
            \  $lastLogin = $user.Properties.LastLogin.Value\n  $enabled = ($user.Properties.UserFlags.Value -band 0x2) -ne\
            \ 0x2\n  if ($lastLogin -eq $null) {\n   $lastLogin = 'Never'\n  }\n  Write-Host $user.Name $lastLogin $enabled\
            \ \n}\"\n\nThis will return a list of local accounts with the account name, last logon, and if the account is\
            \ enabled (True/False).\nFor example: User1 10/31/2015 5:49:56 AM True\n\nReview the list to determine the finding\
            \ validity for each account reported.\n\nExclude the following accounts:\nBuilt-in administrator account (Disabled,\
            \ SID ending in 500)\nBuilt-in guest account (Disabled, SID ending in 501)\nBuilt-in DefaultAccount (Disabled,\
            \ SID ending in 503)\nLocal administrator account\n\nIf any enabled accounts have not been logged on to within\
            \ the past 35 days, this is a finding.\n\nInactive accounts that have been reviewed and deemed to be required\
            \ must be documented with the information system security officer (ISSO)."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
