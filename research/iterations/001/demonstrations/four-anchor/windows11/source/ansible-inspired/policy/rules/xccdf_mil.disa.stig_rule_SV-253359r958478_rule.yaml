    name: cpe:/o:microsoft:windows_11
    ref: cpe:/o:microsoft:windows_11
  extends: null
  fix: Configure the policy value for Computer Configuration >> Administrative Templates >> MS Security Guide >> "Remove "Run
    as Different User" from context menus" to "Enabled". This policy setting requires the installation of the SecGuide custom
    templates included with the STIG package. "SecGuide.admx" and "SecGuide.adml" must be copied to the \Windows\PolicyDefinitions
    and \Windows\PolicyDefinitions\en-US directories respectively.
