          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: The default behavior is for Early Launch Antimalware - Boot-Start Driver Initialization policy is to enforce
              "Good, unknown and bad but critical" (preventing "bad"). By being launched first by the kernel, ELAM ( Early
              Launch Antimalware) is ensured to be launched before any third-party software, and is therefore able to detect
