rule:
  id: xccdf_mil.disa.stig_rule_SV-253388r958804_rule
  title: Autoplay must be disabled for all drives.
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-253388
  description: <VulnDiscussion>Allowing autoplay to execute may introduce malicious code to a system. Autoplay begins reading
    from a drive as soon as media is inserted in the drive. As a result, the setup file of programs or music on audio media
    may start. By default, autoplay is disabled on removable drives, such as the floppy disk drive (but not the CD-ROM drive)
    and on network drives. If this policy is enabled, autoplay can be disabled on all drives.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
  platforms: []
  effective_platform_refs:
