  description: <VulnDiscussion>The account lockout feature, when enabled, prevents brute-force password attacks on the system.
    This parameter specifies the amount of time that an account will remain locked after the specified number of failed logon
    attempts.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
