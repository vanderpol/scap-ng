rule:
  id: xccdf_mil.disa.stig_rule_SV-253493r1137691_rule
  title: The "Deny log on as a service" user right on Windows 11 domain-joined workstations must be configured to prevent
    access from highly privileged domain accounts.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-253493
  description: <VulnDiscussion>Inappropriate granting of user rights can provide system, administrative, and other high-level
    capabilities. The "Deny log on as a service" right defines accounts that are denied log on as a service. In an Active
    Directory Domain, denying logons to the Enterprise Admins and Domain Admins groups on lower trust systems helps mitigate
    the risk of privilege escalation from credential theft attacks which could lead to the compromise of an entire domain.
    Incorrect configurations could prevent services from starting and result in a DoS.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
