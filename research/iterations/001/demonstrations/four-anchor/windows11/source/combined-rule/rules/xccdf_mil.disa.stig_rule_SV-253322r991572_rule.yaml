  idents:
  - system: http://cyber.mil/cci
    value: CCI-000172
  requires: []
  conflicts: []
  check: 'Security Option "Audit: Force audit policy subcategory settings to override audit policy category settings" must
    be set to "Enabled" (WN11-SO-000030) for the detailed auditing subcategories to be effective. Use the AuditPol tool to
    review the current Audit Policy configuration: Open PowerShell or a Command Prompt with elevated privileges ("Run as Administrator").
    Enter "AuditPol /get /category:*" Compare the AuditPol settings with the following: Object Access >> Other Object Access
    Events - Failure If the system does not audit the above, this is a finding.'
