            children:
            - name: title
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: WN11-00-000031 - Windows 11 systems must use a BitLocker PIN for pre-boot authentication.
            - attributes:
                family: windows
              children:
              - name: platform
                namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
                text: Microsoft Windows 11
              name: affected
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            - name: description
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: If data at rest is unencrypted, it is vulnerable to disclosure. Even if the operating system enforces
                permissions on data access, an adversary can remove non-volatile memory and read it directly, thereby circumventing
                operating system controls. Encrypting the data ensures that confidentiality is protected even when the operating
                system is not running. Pre-boot authentication prevents unauthorized users from accessing encrypted drives.
            name: metadata
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
