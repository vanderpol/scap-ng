rule:
  id: xccdf_mil.disa.stig_rule_SV-253260r1210283_rule
  title: Windows 11 systems must use a BitLocker PIN for pre-boot authentication.
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
