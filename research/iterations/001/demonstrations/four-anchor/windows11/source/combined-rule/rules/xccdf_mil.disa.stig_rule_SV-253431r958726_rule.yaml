        exports: []
        inline_content: Verify the default registry permissions for the keys note below of the HKEY_LOCAL_MACHINE hive. If
          any non-privileged groups such as Everyone, Users or Authenticated Users have greater than Read permission, this
          is a finding. Run "Regedit". Right click on the registry areas noted below. Select "Permissions..." and the "Advanced"
          button. HKEY_LOCAL_MACHINE\SECURITY Type - "Allow" for all Inherited from - "None" for all Principal - Access -
          Applies to SYSTEM - Full Control - This key and subkeys Administrators - Special - This key and subkeys HKEY_LOCAL_MACHINE\SOFTWARE
          Type - "Allow" for all Inherited from - "None" for all Principal - Access - Applies to Users - Read - This key and
          subkeys Administrators - Full Control - This key and subkeys SYSTEM - Full Control - This key and subkeys CREATOR
          OWNER - Full Control - This key and subkeys ALL APPLICATION PACKAGES - Read - This key and subkeys HKEY_LOCAL_MACHINE\SYSTEM
          Type - "Allow" for all Inherited from - "None" for all Principal - Access - Applies to Users - Read - This key and
          subkeys Administrators - Full Control - This key and subkeys SYSTEM - Full Control - This key and subkeys CREATOR
          OWNER - Full Control - This key and subkeys ALL APPLICATION PACKAGES - Read - This key and subkeys Other subkeys
          under the noted keys may also be sampled. There may be some instances where non-privileged groups have greater than
          read permission. Microsoft has given Read permission to the SOFTWARE and SYSTEM registry keys in later versions
          of Windows 11 to the following SID, this is currently not a finding. S-1-15-3-1024-1065365936-1281604716-3511738428-1654721687-432734479-3232135806-4053264122-3456934681
          If the defaults have not been changed, these are not a finding.
        multi_check: null
        negate: null
        selector: manual
        source_tree:
          attributes:
            selector: manual
            system: http://scap.nist.gov/schema/ocil/2
          children:
          - attributes:
              href: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-ocil.xml
              name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:34101
            name: check-content-ref
            namespace: http://checklists.nist.gov/xccdf/1.2
          - name: check-content
            namespace: http://checklists.nist.gov/xccdf/1.2
            text: 'Verify the default registry permissions for the keys note below of the HKEY_LOCAL_MACHINE hive.


              If any non-privileged groups such as Everyone, Users or Authenticated Users have greater than Read permission,
              this is a finding.


              Run "Regedit".

              Right click on the registry areas noted below.

              Select "Permissions..." and the "Advanced" button.


              HKEY_LOCAL_MACHINE\SECURITY

              Type - "Allow" for all

              Inherited from - "None" for all

              Principal - Access - Applies to

              SYSTEM - Full Control - This key and subkeys

              Administrators - Special - This key and subkeys


              HKEY_LOCAL_MACHINE\SOFTWARE

              Type - "Allow" for all

              Inherited from - "None" for all

              Principal - Access - Applies to

              Users - Read - This key and subkeys

              Administrators - Full Control - This key and subkeys

              SYSTEM - Full Control - This key and subkeys

              CREATOR OWNER - Full Control - This key and subkeys

              ALL APPLICATION PACKAGES - Read - This key and subkeys


              HKEY_LOCAL_MACHINE\SYSTEM

              Type - "Allow" for all

              Inherited from - "None" for all

              Principal - Access - Applies to

              Users - Read - This key and subkeys

              Administrators - Full Control - This key and subkeys

              SYSTEM - Full Control - This key and subkeys

              CREATOR OWNER - Full Control - This key and subkeys

              ALL APPLICATION PACKAGES - Read - This key and subkeys


              Other subkeys under the noted keys may also be sampled. There may be some instances where non-privileged groups
              have greater than read permission.


              Microsoft has given Read permission to the SOFTWARE and SYSTEM registry keys in later versions of Windows 11
              to the following SID, this is currently not a finding.


              S-1-15-3-1024-1065365936-1281604716-3511738428-1654721687-432734479-3232135806-4053264122-3456934681


              If the defaults have not been changed, these are not a finding.'
          name: check
          namespace: http://checklists.nist.gov/xccdf/1.2
        system: http://scap.nist.gov/schema/ocil/2
