rule:
  id: xccdf_mil.disa.stig_rule_SV-253320r991572_rule
  title: Windows 11 must be configured to audit Object Access - File Share successes.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
