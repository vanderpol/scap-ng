rule:
  id: xccdf_mil.disa.stig_rule_SV-253496r958726_rule
  title: The "Enable computer and user accounts to be trusted for delegation" user right must not be assigned to any groups
    or accounts.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
