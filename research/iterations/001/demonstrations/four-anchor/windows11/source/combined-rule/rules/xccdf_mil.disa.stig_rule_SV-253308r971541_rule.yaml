rule:
  id: xccdf_mil.disa.stig_rule_SV-253308r971541_rule
  title: The system must be configured to audit Account Management - Security Group Management successes.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-253308
  description: <VulnDiscussion>Maintaining an audit trail of system activity logs can help identify configuration errors,
    troubleshoot service disruptions, and analyze compromises that have occurred, as well as detect attacks. Audit logs are
    necessary to provide a trail of evidence in case the system or network is compromised. Collecting this data is essential
    for analyzing the security of information assets and detecting signs of suspicious and unexpected behavior. Security Group
    Management records events such as creating, deleting or changing of security groups, including changes in group members.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
