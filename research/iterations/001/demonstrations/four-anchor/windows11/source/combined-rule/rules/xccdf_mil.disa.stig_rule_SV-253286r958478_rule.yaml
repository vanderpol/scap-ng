rule:
  id: xccdf_mil.disa.stig_rule_SV-253286r958478_rule
  title: The Server Message Block (SMB) v1 protocol must be disabled on the system.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-253286
  description: <VulnDiscussion>SMBv1 is a legacy protocol that uses the MD5 algorithm as part of SMB. MD5 is known to be vulnerable
    to a number of attacks such as collision and preimage attacks as well as not being FIPS compliant. Disabling SMBv1 support
    may prevent access to file or print sharing resources with systems or devices that only support SMBv1. File shares and
    print services hosted on Windows Server 2003 are an example, however Windows Server 2003 is no longer a supported operating
    system. Some older Network Attached Storage (NAS) devices may only support SMBv1.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
  platforms: []
