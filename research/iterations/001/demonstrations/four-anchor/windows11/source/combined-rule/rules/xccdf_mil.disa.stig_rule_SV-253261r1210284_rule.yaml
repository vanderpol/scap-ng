rule:
  id: xccdf_mil.disa.stig_rule_SV-253261r1210284_rule
  title: Windows 11 systems must use a BitLocker PIN with a minimum length of six digits for pre-boot authentication.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-253261
  description: <VulnDiscussion>If data at rest is unencrypted, it is vulnerable to disclosure. Even if the operating system
    enforces permissions on data access, an adversary can remove nonvolatile memory and read it directly, thereby circumventing
    operating system controls. Encrypting the data ensures that confidentiality is protected even when the operating system
    is not running. Pre-boot authentication prevents unauthorized users from accessing encrypted drives. Increasing the pin
    length requires a greater number of guesses for an attacker.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
