rule:
  id: xccdf_mil.disa.stig_rule_SV-253269r958702_rule
  title: Only accounts responsible for the administration of a system must have Administrator rights on the system.
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-253269
  description: <VulnDiscussion>An account that does not have Administrator duties must not have Administrator rights. Such
    rights would allow the account to bypass or modify required security restrictions on that machine and make it vulnerable
    to attack. System administrators must log on to systems only using accounts with the minimum level of authority necessary.
    For domain-joined workstations, the Domain Admins group must be replaced by a domain workstation administrator group (see
    V-36434 in the Active Directory Domain STIG). Restricting highly privileged accounts from the local Administrators group
    helps mitigate the risk of privilege escalation resulting from credential theft attacks. Standard user accounts must not
    be members of the local administrators group.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
