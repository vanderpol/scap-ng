scap_ng: 0.1-prototype
prototype: true
model: combined-rule
rule:
  id: xccdf_mil.disa.stig_rule_SV-253338r1186375_rule
  title: The security event log size must be configured to a value that holds at least one week's worth of audit records.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-253338
  description: <VulnDiscussion>Inadequate log size will cause the log to fill up quickly. This may prevent audit events from
    being recorded properly and require frequent attention by administrative personnel. System Administrators (SAs) must monitor
    the volume of security event audit records and increase the registry value for the log size as needed.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
  platforms: []
  effective_platform_refs:
  - cpe:/o:microsoft:windows_11
  effective_platforms:
  - kind: cpe_name
    name: cpe:/o:microsoft:windows_11
    ref: cpe:/o:microsoft:windows_11
  references:
  - href: null
    text: DPMS Target Microsoft Windows 11 DISA DPMS Target Microsoft Windows 11 5471
  idents:
  - system: http://cyber.mil/cci
    value: CCI-001849
  requires: []
  conflicts: []
  check: 'If the system is configured to send audit records directly to an audit server, this requirement is not applicable.
    This must be documented with the information system security officer (ISSO). The registry configuration setting below
    must be set (at least) to a value equal to the size needed to contain one week''s worth of audit records in the security
    event log. The value used below is an example that assumes a typical week’s log size of 5GB. If the following registry
    value does not exist or is not configured as specified, this is a finding: NOTE: The following registry entry is an example;
    the value must equal at least one week''s worth of records. Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows\EventLog\Security\
    Value Name: MaxSize Value Type: REG_DWORD Value:0x49960800 (5120000) (or greater)'
