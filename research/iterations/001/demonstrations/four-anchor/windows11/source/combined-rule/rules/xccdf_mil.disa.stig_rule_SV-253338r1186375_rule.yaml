  fix: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components >> Event Log
    Service >> Security >> "Specify the maximum log file size (KB)" to "Enabled" with a "Maximum Log Size (KB)" of a value
    that will contain one week of audit records or greater. If the system is configured to send audit records directly to
    an audit server, this must be documented with the ISSO.
