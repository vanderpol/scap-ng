  description: <VulnDiscussion>The use of a Trusted Platform Module (TPM) to store keys for Windows Hello for Business provides
    additional security. Keys stored in the TPM may only be used on that system while keys stored using software are more
    susceptible to compromise and could be used on other systems.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
