        exports: []
        inline_content: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". Navigate to Local Computer
          Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment.
          If the following groups or accounts are not defined for the "Deny access to this computer from the network" right,
          this is a finding: Domain Systems Only: Enterprise Admins group Domain Admins group Local account (see Note below)
          All Systems: Guests group Privileged Access Workstations (PAWs) dedicated to the management of Active Directory
          are exempt from denying the Enterprise Admins and Domain Admins groups. (See the Windows Privileged Access Workstation
          STIG for PAW requirements.) Note: "Local account" is a built-in security group used to assign user rights and permissions
          to all local accounts.'
        multi_check: null
        negate: null
        selector: manual
        source_tree:
          attributes:
            selector: manual
            system: http://scap.nist.gov/schema/ocil/2
          children:
          - attributes:
              href: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-ocil.xml
              name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:45901
            name: check-content-ref
            namespace: http://checklists.nist.gov/xccdf/1.2
          - name: check-content
            namespace: http://checklists.nist.gov/xccdf/1.2
            text: 'Verify the effective setting in Local Group Policy Editor.


              Run "gpedit.msc".


              Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local
              Policies >> User Rights Assignment.


              If the following groups or accounts are not defined for the "Deny access to this computer from the network"
              right, this is a finding:


              Domain Systems Only:

              Enterprise Admins group

              Domain Admins group

              Local account (see Note below)


              All Systems:

              Guests group


              Privileged Access Workstations (PAWs) dedicated to the management of Active Directory are exempt from denying
              the Enterprise Admins and Domain Admins groups. (See the Windows Privileged Access Workstation STIG for PAW
              requirements.)


              Note: "Local account" is a built-in security group used to assign user rights and permissions to all local accounts.'
          name: check
          namespace: http://checklists.nist.gov/xccdf/1.2
        system: http://scap.nist.gov/schema/ocil/2
