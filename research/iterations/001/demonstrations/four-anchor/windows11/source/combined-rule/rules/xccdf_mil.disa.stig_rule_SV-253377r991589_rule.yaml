  fix: This requirement is applicable to domain-joined systems, for standalone systems this is NA. The default behavior for
    "Support device authentication using certificate" is "Automatic". To correct this, configured the policy value for Computer
    Configuration >> Administrative Templates >> System >> Kerberos >> "Support device authentication using certificate" to
    "Not Configured or "Enabled" with either option selected in "Device authentication behavior using certificate:".
