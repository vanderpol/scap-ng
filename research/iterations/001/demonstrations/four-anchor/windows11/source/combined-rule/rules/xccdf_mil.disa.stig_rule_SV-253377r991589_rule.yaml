  group_path:
  - xccdf_mil.disa.stig_group_V-253377
  description: <VulnDiscussion>Using certificates to authenticate devices to the domain provides increased security over passwords.
    By default systems will attempt to authenticate using certificates and fall back to passwords if the domain controller
    does not support certificates for devices. This may also be configured to always use certificates for device authentication.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
