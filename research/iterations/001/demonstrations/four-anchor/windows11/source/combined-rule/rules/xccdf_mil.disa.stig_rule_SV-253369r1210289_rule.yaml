  fix: Configure the policy value for Computer Configuration >> Administrative Templates >> System >> Device Guard >> "Turn
    On virtualization-based Security" to "Enabled" with "Secure Boot" or "Secure Boot and DMA Protection" selected for "Select
    Platform Security Level:". A Microsoft article on Credential Guard system requirement can be found at the following link.
    https://technet.microsoft.com/en-us/itpro/windows/keep-secure/credential-guard-requirements
