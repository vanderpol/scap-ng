rule:
  id: xccdf_mil.disa.stig_rule_SV-253364r958358_rule
  title: Simultaneous connections to the internet or a Windows domain must be limited.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-253364
  description: <VulnDiscussion>Multiple network connections can provide additional attack vectors to a system and must be
    limited. The "Minimize the number of simultaneous connections to the Internet or a Windows Domain" setting prevents systems
    from automatically establishing multiple connections. When both wired and wireless connections are available, for example,
    the less preferred connection (typically wireless) will be disconnected.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
