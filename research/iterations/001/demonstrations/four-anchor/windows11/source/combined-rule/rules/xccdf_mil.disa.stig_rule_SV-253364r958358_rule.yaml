  fix: The default behavior for "Minimize the number of simultaneous connections to the Internet or a Windows Domain" is "Enabled".
    If this needs to be corrected, configure the policy value for Computer Configuration >> Administrative Templates >> Network
    >> Windows Connection Manager >> "Minimize the number of simultaneous connections to the Internet or a Windows Domain"
    to "Enabled". Under "Options", set "Minimize Policy Options" to "3 = Prevent Wi-Fi When on Ethernet".
