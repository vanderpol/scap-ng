rule:
  id: xccdf_mil.disa.stig_rule_SV-253351r1106508_rule
  title: Windows 11 must cover or disable the built-in or attached camera when not in use.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-253351
  description: '<VulnDiscussion>It is detrimental for operating systems to provide, or install by default, functionality exceeding
    requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore may
    remain unsecured. They increase the risk to the platform by providing additional attack vectors. Failing to disconnect
    from collaborative computing devices (i.e. cameras) can result in subsequent compromises of organizational information.
    Providing easy methods to physically disconnect from such devices after a collaborative computing session helps to ensure
    that participants actually carry out the disconnect activity without having to go through complex and tedious procedures.
    Satisfies: SRG-OS-000095-GPOS-00049, SRG-OS-000370-GPOS-00155</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
  discussion: null
  platforms:
  - '#xccdf_navy.navwar.niwcatlantic.scc_platform_camerainstallation'
  effective_platform_refs:
  - '#xccdf_navy.navwar.niwcatlantic.scc_platform_camerainstallation'
  effective_platforms:
