rule:
  id: xccdf_mil.disa.stig_rule_SV-278930r1135308_rule
  title: Windows 11 must be configured to audit registry failures.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
