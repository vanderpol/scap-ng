  fix: 'Disable the convenience PIN sign-in. For GPO-managed systems: Configure the policy value for Computer Configuration
    >> Administrative Templates >> Windows Components >> Windows Ink Workspace >> Set "Allow Windows Ink Workspace" to "Enabled
    and set Options On, but disallow access above lock". For Intune-managed systems: Set the Windows Ink Workspace Policy
    to disallow access above lock.'
