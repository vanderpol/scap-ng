rule:
  id: xccdf_mil.disa.stig_rule_SV-253434r991589_rule
  title: Local accounts with blank passwords must be restricted to prevent access from the network.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
