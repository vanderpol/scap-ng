  group_path:
  - xccdf_mil.disa.stig_group_V-253434
  description: <VulnDiscussion>An account without a password can allow unauthorized access to a system as only the username
    would be required. Password policies must prevent accounts with blank passwords from existing on a system. However, if
    a local account with a blank password did exist, enabling this setting will prevent network access, limiting the account
    to local console logon only.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
