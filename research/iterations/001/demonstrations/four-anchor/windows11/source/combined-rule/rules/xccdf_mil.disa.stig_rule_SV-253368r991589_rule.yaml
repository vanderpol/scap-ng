  id: xccdf_mil.disa.stig_rule_SV-253368r991589_rule
  title: Windows 11 must be configured to enable Remote host allows delegation of non-exportable credentials.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
