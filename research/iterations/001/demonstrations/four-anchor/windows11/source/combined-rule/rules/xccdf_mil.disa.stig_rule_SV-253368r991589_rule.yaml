  group_path:
  - xccdf_mil.disa.stig_group_V-253368
  description: <VulnDiscussion>An exportable version of credentials is provided to remote hosts when using credential delegation
    which exposes them to theft on the remote host. Restricted Admin mode or Remote Credential Guard allow delegation of non-exportable
    credentials providing additional protection of the credentials. Enabling this configures the host to support Restricted
    Admin mode or Remote Credential Guard.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
