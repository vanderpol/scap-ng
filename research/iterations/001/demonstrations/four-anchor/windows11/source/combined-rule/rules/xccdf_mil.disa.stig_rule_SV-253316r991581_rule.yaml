rule:
  id: xccdf_mil.disa.stig_rule_SV-253316r991581_rule
  title: The system must be configured to audit Logon/Logoff - Logon failures.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-253316
  description: <VulnDiscussion>Maintaining an audit trail of system activity logs can help identify configuration errors,
    troubleshoot service disruptions, and analyze compromises that have occurred, as well as detect attacks. Audit logs are
    necessary to provide a trail of evidence in case the system or network is compromised. Collecting this data is essential
    for analyzing the security of information assets and detecting signs of suspicious and unexpected behavior. Logon records
    user logons. If this is an interactive logon, it is recorded on the local system. If it is to a network share, it is recorded
    on the system accessed.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
