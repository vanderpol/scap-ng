            namespace: http://checklists.nist.gov/xccdf/1.2
          - name: check-content
            namespace: http://checklists.nist.gov/xccdf/1.2
            text: "Verify the US DoW CCEB Interoperability Root CA cross-certificate is installed on unclassified systems\
              \ as an Untrusted Certificate.\n\nRun \"PowerShell\" as an administrator.\n\nExecute the following command:\n\
              \nGet-ChildItem -Path Cert:Localmachine\\disallowed | Where Issuer -Like \"*CCEB Interoperability*\" | FL Subject,\
              \ NotAfter\n\nIf valid US DoW CCEB Interoperability Root CA certificates (such as those below) are not displayed,\
              \ this is a finding. \n\nNote: The Common Names (CN) below are examples. Verify the \"CN\" displayed is a DoW\
              \ CCEB Interoperability Root CA and is not expired.\n\nSubject: CN= US DoD CCEB Interoperability Root CA 2,\
              \ OU=PKI, OU=DoD, O=U.S. Government, C=US\nNotAfter: 12/30/2030 \n\nAlternately, use the Certificates MMC snap-in:\n\
              \nRun \"MMC\".\n\nSelect \"File\", then click \"Add/Remove Snap-in\".\n\nSelect \"Certificates\", then click\
              \ \"Add\".\n\nSelect \"Computer account\", then click \"Next\".\n\nSelect \"Local computer: (the computer this\
              \ console is running on)\", then click \"Finish\".\n\nClick \"OK\".\n\nExpand \"Certificates\" and navigate\
              \ to Untrusted Certificates >> Certificates.\n\nFor each US DoW CCEB Interoperability Root CA certificate displayed:\n\
              \nRight-click on the certificate and select \"Open\".\n\nSelect the \"Details\" tab.\n\nScroll to the bottom\
              \ and select \"Subject\".\n\nIf any of the certificates listed do not include \"DoD Interoperability Root CA\"\
              \ in the name or are expired, this is a finding.\n\nUS DoD CCEB Interoperability Root CA 2                 \
              \                 \n\nNote: Interoperability cross certificates will have a different value (such as \"...Root\
              \ CA 6\") in the 'Issued To'  field than in the 'Subject' and 'Issuer' fields."
          name: check
          namespace: http://checklists.nist.gov/xccdf/1.2
        system: http://scap.nist.gov/schema/ocil/2
      kind: check_candidates
