rule:
  id: xccdf_mil.disa.stig_rule_SV-253430r1256665_rule
  title: The US DoW CCEB Interoperability Root CA cross-certificates must be installed in the Untrusted Certificates Store
    on unclassified systems.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-253430
  description: <VulnDiscussion>To ensure users do not experience denial of service when performing certificate-based authentication
    to DoW websites due to the system chaining to a root other than DoW Root CAs, the US DoW CCEB Interoperability Root CA
    cross-certificates must be installed in the Untrusted Certificate Store. This requirement only applies to unclassified
    systems.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
