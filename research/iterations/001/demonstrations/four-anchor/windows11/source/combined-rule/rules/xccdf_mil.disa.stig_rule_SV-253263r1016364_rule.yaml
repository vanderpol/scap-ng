  description: <VulnDiscussion>Windows 11 is maintained by Microsoft at servicing levels for specific periods of time to support
    Windows as a Service. Systems at unsupported servicing levels or releases will not receive security updates for new vulnerabilities
    which leaves them subject to exploitation. New versions with feature updates are planned to be released on a semi-annual
    basis with an estimated support timeframe of 18 to 30 months depending on the release. Support for previously released
    versions has been extended for Enterprise editions. A separate servicing branch intended for special purpose systems is
    the Long-Term Servicing Channel (LTSC, formerly Branch - LTSB) which will receive security updates for 10 years but excludes
    feature updates.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
