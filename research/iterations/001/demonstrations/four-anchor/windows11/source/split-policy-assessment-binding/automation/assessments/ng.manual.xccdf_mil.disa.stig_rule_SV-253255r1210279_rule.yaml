  id: ng.manual.xccdf_mil.disa.stig_rule_SV-253255r1210279_rule
  version: 1
  description: Windows 11 systems must have a Trusted Platform Module (TPM) enabled.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:301
    exports: []
    inline_content: Verify the system has a TPM and is ready for use. Run "tpm.msc". Review the sections in the center pane.
      "Status" must indicate it has been configured with a message such as "The TPM is ready for use" or "The TPM is on and
      ownership has been taken". TPM Manufacturer Information - Specific Version = 2.0 If a TPM is not found or is not ready
      for use, this is a finding.
    multi_check: null
    negate: null
