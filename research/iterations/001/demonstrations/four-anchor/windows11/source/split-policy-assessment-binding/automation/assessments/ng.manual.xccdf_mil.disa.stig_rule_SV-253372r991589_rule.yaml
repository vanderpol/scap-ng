  id: ng.manual.xccdf_mil.disa.stig_rule_SV-253372r991589_rule
  version: 1
  description: Early Launch Antimalware, Boot-Start Driver Initialization Policy must prevent boot drivers.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:22501
    exports: []
    inline_content: 'The default behavior is for Early Launch Antimalware - Boot-Start Driver Initialization policy is to
      enforce "Good, unknown and bad but critical" (preventing "bad"). If the registry value name below does not exist, this
      is a finding. If it exists and is configured with a value of "7", this is a finding. Registry Hive: HKEY_LOCAL_MACHINE
      Registry Path: \SYSTEM\CurrentControlSet\Policies\EarlyLaunch\ Value Name: DriverLoadPolicy Value Type: REG_DWORD Value:
      1, 3, or 8 Possible values for this setting are: 8 - Good only 1 - Good and unknown 3 - Good, unknown and bad but critical
      7 - All (which includes "Bad" and would be a finding)'
    multi_check: null
    negate: null
