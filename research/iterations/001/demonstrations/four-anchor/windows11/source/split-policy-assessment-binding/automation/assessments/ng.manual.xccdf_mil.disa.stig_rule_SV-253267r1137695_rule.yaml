      name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:2501
    exports: []
    inline_content: Non-system-created shares must not exist on workstations. If only system-created shares exist on the system,
      this is NA. Run "Computer Management". Navigate to System Tools >> Shared Folders >> Shares. If the only shares listed
      are "ADMIN$", "C$" and "IPC$", this is NA. (Selecting Properties for system-created shares will display a message that
      it has been shared for administrative purposes.) Right-click any non-system-created shares. Select "Properties". Select
      the "Share Permissions" tab. Verify the necessity of any shares found. If the file shares have not been reconfigured
      to restrict permissions to the specific groups or accounts that require access, this is a finding. Select the "Security"
      tab. If the NTFS permissions have not been reconfigured to restrict permissions to the specific groups or accounts that
      require access, this is a finding.
    multi_check: null
    negate: null
    selector: manual
