assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-253338r1186375_rule
  version: 1
  description: The security event log size must be configured to a value that holds at least one week's worth of audit records.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:16101
    exports: []
    inline_content: 'If the system is configured to send audit records directly to an audit server, this requirement is not
      applicable. This must be documented with the information system security officer (ISSO). The registry configuration
      setting below must be set (at least) to a value equal to the size needed to contain one week''s worth of audit records
      in the security event log. The value used below is an example that assumes a typical week’s log size of 5GB. If the
      following registry value does not exist or is not configured as specified, this is a finding: NOTE: The following registry
      entry is an example; the value must equal at least one week''s worth of records. Registry Hive: HKEY_LOCAL_MACHINE Registry
      Path: \SOFTWARE\Policies\Microsoft\Windows\EventLog\Security\ Value Name: MaxSize Value Type: REG_DWORD Value:0x49960800
      (5120000) (or greater)'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
      children:
      - attributes:
          href: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-ocil.xml
          name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:16101
        name: check-content-ref
        namespace: http://checklists.nist.gov/xccdf/1.2
      - name: check-content
        namespace: http://checklists.nist.gov/xccdf/1.2
        text: 'If the system is configured to send audit records directly to an audit server, this requirement is not applicable.
          This must be documented with the information system security officer (ISSO).


          The registry configuration setting below must be set (at least) to a value equal to the size needed to contain one
          week''s worth of audit records in the security event log. The value used below is an example that assumes a typical
          week’s log size of 5GB.


          If the following registry value does not exist or is not configured as specified, this is a finding:


          NOTE: The following registry entry is an example; the value must equal at least one week''s worth of records.


          Registry Hive: HKEY_LOCAL_MACHINE

          Registry Path: \SOFTWARE\Policies\Microsoft\Windows\EventLog\Security\


          Value Name: MaxSize


          Value Type: REG_DWORD

          Value:0x49960800 (5120000) (or greater)'
      name: check
      namespace: http://checklists.nist.gov/xccdf/1.2
    system: http://scap.nist.gov/schema/ocil/2
