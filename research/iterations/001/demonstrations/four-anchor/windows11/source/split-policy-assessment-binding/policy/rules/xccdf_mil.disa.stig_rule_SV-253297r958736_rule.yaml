rule:
  id: xccdf_mil.disa.stig_rule_SV-253297r958736_rule
  title: Windows 11 account lockout duration must be configured to 15 minutes or greater.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
