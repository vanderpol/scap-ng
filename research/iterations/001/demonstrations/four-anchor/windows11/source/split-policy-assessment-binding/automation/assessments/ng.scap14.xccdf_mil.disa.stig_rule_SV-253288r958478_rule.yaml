            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: WN11-00-000170 - The Server Message Block (SMB) v1 protocol must be disabled on the SMB client.
          - attributes:
              family: windows
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Microsoft Windows 11
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: 'SMBv1 is a legacy protocol that uses the MD5 algorithm as part of SMB. MD5 is known to be vulnerable to
              a number of attacks such as collision and preimage attacks as well as not being FIPS compliant.


              Disabling SMBv1 support may prevent access to file or print sharing resources with systems or devices that only
              support SMBv1. File shares and print services hosted on Windows Server 2003 are an example, however Windows
              Server 2003 is no longer a supported operating system. Some older network attached devices may only support
              SMBv1.'
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
