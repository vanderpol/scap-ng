assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-253427r1256656_rule
  version: 1
  description: The DoW Root CA certificates must be installed in the Trusted Root Store.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:33301
    exports: []
    inline_content: 'Verify the DoW Root CA certificates are installed as Trusted Root Certification Authorities. The certificates
      referenced below apply to unclassified systems; refer to PKE documentation for other networks. Run "PowerShell" as an
      administrator. Execute the following command: Get-ChildItem -Path Cert:Localmachine\root | Where Subject -Like "*DoD*"
      | FL Subject, NotAfter If valid DoW Root CA certificates (such as those below) are not displayed, this is a finding.
      Note: The Common Names (CN) below are examples. Verify the "CN" displayed is a DoW Root CA and is not expired. Subject:
      CN=DoD Root CA 3, OU=PKI, OU=DoD, O=U.S. Government, C=US NotAfter: 12/30/2029 Subject: CN=DoD Root CA 5, OU=PKI, OU=DoD,
      O=U.S. Government, C=US NotAfter: 6/14/2041 Subject: CN=DoD Root CA 6 OU=PKI, OU=DoD, O=U.S. Government, C=US NotAfter:
      1/24/2053 Alternately, use the Certificates MMC snap-in: Run "MMC". Select "File" and "Add/Remove Snap-in". Select "Certificates"
      and click "Add". Select "Computer account" and click "Next". Select "Local computer: (the computer this console is running
      on)" and click "Finish". Click "OK". Expand "Certificates" and navigate to Trusted Root Certification Authorities >>
      Certificates. For each of the DoW Root CA certificates listed: Right-click on the certificate and select "Open". Select
      the "Details" tab. Verify the Expiration Date is a future date. Scroll to the bottom and select "Subject". If valid
      (unexpired) DoW Root CA certificates (such as those below) are not listed, this is a finding. DoD Root CA 3 DoD Root
      CA 5 DoD Root CA 6'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
      children:
      - attributes:
          href: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-ocil.xml
          name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:33301
        name: check-content-ref
        namespace: http://checklists.nist.gov/xccdf/1.2
      - name: check-content
        namespace: http://checklists.nist.gov/xccdf/1.2
        text: "Verify the DoW Root CA certificates are installed as Trusted Root Certification Authorities.\n\nThe certificates\
          \ referenced below apply to unclassified systems; refer to PKE documentation for other networks.\n\nRun \"PowerShell\"\
          \ as an administrator.\n\nExecute the following command:\n\nGet-ChildItem -Path Cert:Localmachine\\root | Where\
          \ Subject -Like \"*DoD*\" | FL Subject, NotAfter\n\nIf valid DoW Root CA certificates (such as those below) are\
          \ not displayed, this is a finding. \n\nNote: The Common Names (CN) below are examples. Verify the \"CN\" displayed\
          \ is a DoW Root CA and is not expired. \n\nSubject: CN=DoD Root CA 3, OU=PKI, OU=DoD, O=U.S. Government, C=US\n\
          NotAfter: 12/30/2029\n\nSubject: CN=DoD Root CA 5, OU=PKI, OU=DoD, O=U.S. Government, C=US\nNotAfter: 6/14/2041\n\
          \nSubject: CN=DoD Root CA 6 OU=PKI, OU=DoD, O=U.S. Government, C=US\nNotAfter: 1/24/2053\n\nAlternately, use the\
          \ Certificates MMC snap-in:\n\nRun \"MMC\".\n\nSelect \"File\" and \"Add/Remove Snap-in\".\n\nSelect \"Certificates\"\
          \ and click \"Add\".\n\nSelect \"Computer account\" and click \"Next\".\n\nSelect \"Local computer: (the computer\
          \ this console is running on)\" and click \"Finish\".\n\nClick \"OK\".\n\nExpand \"Certificates\" and navigate to\
          \ Trusted Root Certification Authorities >> Certificates.\n\nFor each of the DoW Root CA certificates listed:\n\n\
          Right-click on the certificate and select \"Open\".\n\nSelect the \"Details\" tab.\n\nVerify the Expiration Date\
          \ is a future date.\n\nScroll to the bottom and select \"Subject\".\n\nIf valid (unexpired) DoW Root CA certificates\
          \ (such as those below) are not listed, this is a finding.\n\nDoD Root CA 3\nDoD Root CA 5 \nDoD Root CA 6"
      name: check
      namespace: http://checklists.nist.gov/xccdf/1.2
    system: http://scap.nist.gov/schema/ocil/2
