rule:
  id: xccdf_mil.disa.stig_rule_SV-253318r991578_rule
  title: The system must be configured to audit Logon/Logoff - Special Logon successes.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
