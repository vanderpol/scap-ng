rule:
  id: xccdf_mil.disa.stig_rule_SV-253448r991589_rule
  title: The Smart Card removal option must be configured to Force Logoff or Lock Workstation.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
