  group_path:
  - xccdf_mil.disa.stig_group_V-253448
  description: <VulnDiscussion>Unattended systems are susceptible to unauthorized use and must be locked. Configuring a system
    to lock when a smart card is removed will ensure the system is inaccessible when unattended.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
  platforms: []
  effective_platform_refs:
  - cpe:/o:microsoft:windows_11
  effective_platforms:
