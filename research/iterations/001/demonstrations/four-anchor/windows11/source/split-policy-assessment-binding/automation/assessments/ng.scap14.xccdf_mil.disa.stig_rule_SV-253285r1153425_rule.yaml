        name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:5901
      exports: []
      inline_content: 'For Windows 11 version 24H2 and newer, this requirement is Not Applicable. Run "Windows PowerShell"
        with elevated privileges (run as administrator). Enter the following: Get-WindowsOptionalFeature -Online | Where FeatureName
        -like *PowerShellv2* If either of the following have a "State" of "Enabled", this is a finding. FeatureName : MicrosoftWindowsPowerShellV2
        State : Enabled FeatureName : MicrosoftWindowsPowerShellV2Root State : Enabled Alternately: Search for "Features".
        Select "Turn Windows features on or off". If "Windows PowerShell 2.0" (whether the subcategory of "Windows PowerShell
        2.0 Engine" is selected or not) is selected, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:5901
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'For Windows 11 version 24H2 and newer, this requirement is Not Applicable.


            Run "Windows PowerShell" with elevated privileges (run as administrator).


            Enter the following:

            Get-WindowsOptionalFeature -Online | Where FeatureName -like *PowerShellv2*


            If either of the following have a "State" of "Enabled", this is a finding.


            FeatureName : MicrosoftWindowsPowerShellV2

            State : Enabled

            FeatureName : MicrosoftWindowsPowerShellV2Root

            State : Enabled


            Alternately:

            Search for "Features".


            Select "Turn Windows features on or off".


            If "Windows PowerShell 2.0" (whether the subcategory of "Windows PowerShell 2.0 Engine" is selected or not) is
            selected, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
