  fix: 'This is the default configuration for this setting (10 logons to cache). Configure the policy value for Computer Configuration
    >> Windows Settings >> Security Settings >> Local Policies >> Security Options >> "Interactive logon: Number of previous
    logons to cache (in case domain controller is not available)" to "10" logons or less. This setting only applies to domain-joined
    systems, however, it is configured by default on all systems.'
