rule:
  id: xccdf_mil.disa.stig_rule_SV-253462r991589_rule
  title: The LanMan authentication level must be set to send NTLMv2 response only, and to refuse LM and NTLM.
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
