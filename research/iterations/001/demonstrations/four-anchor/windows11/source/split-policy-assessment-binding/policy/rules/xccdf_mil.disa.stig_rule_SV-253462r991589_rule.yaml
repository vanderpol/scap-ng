  group_path:
  - xccdf_mil.disa.stig_group_V-253462
  description: <VulnDiscussion>The Kerberos v5 authentication protocol is the default for authentication of users who are
    logging on to domain accounts. NTLM, which is less secure, is retained in later Windows versions for compatibility with
    clients and servers that are running earlier versions of Windows or applications that still use it. It is also used to
    authenticate logons to stand-alone computers that are running later versions.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
