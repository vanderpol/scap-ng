      name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:2901
    exports: []
    inline_content: Run "Computer Management". Navigate to System Tools >> Local Users and Groups >> Groups. Review the members
      of the Administrators group. Only the appropriate administrator groups or accounts responsible for administration of
      the system may be members of the group. For domain-joined workstations, the Domain Admins group must be replaced by
      a domain workstation administrator group. Standard user accounts must not be members of the local administrator group.
      If prohibited accounts are members of the local administrators group, this is a finding. The built-in Administrator
      account or other required administrative accounts would not be a finding.
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
      children:
      - attributes:
          href: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-ocil.xml
          name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:2901
        name: check-content-ref
        namespace: http://checklists.nist.gov/xccdf/1.2
      - name: check-content
        namespace: http://checklists.nist.gov/xccdf/1.2
        text: 'Run "Computer Management".

          Navigate to System Tools >> Local Users and Groups >> Groups.

          Review the members of the Administrators group.

          Only the appropriate administrator groups or accounts responsible for administration of the system may be members
          of the group.


          For domain-joined workstations, the Domain Admins group must be replaced by a domain workstation administrator group.


          Standard user accounts must not be members of the local administrator group.


          If prohibited accounts are members of the local administrators group, this is a finding.


          The built-in Administrator account or other required administrative accounts would not be a finding.'
      name: check
      namespace: http://checklists.nist.gov/xccdf/1.2
    system: http://scap.nist.gov/schema/ocil/2
