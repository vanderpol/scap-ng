rule:
  id: xccdf_mil.disa.stig_rule_SV-253275r958478_rule
  title: Internet Information System (IIS) or its subcomponents must not be installed on a workstation.
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
