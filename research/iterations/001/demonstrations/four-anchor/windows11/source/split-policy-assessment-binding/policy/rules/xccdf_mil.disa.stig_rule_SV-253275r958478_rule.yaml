  group_path:
  - xccdf_mil.disa.stig_group_V-253275
  description: <VulnDiscussion>IIS is not installed by default. Installation of Internet Information System (IIS) may allow
    unauthorized internet services to be hosted. Websites must only be hosted on servers that have been designed for that
    purpose and can be adequately secured.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
