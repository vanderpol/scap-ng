  version: 1
  description: The system must be configured to audit Privilege Use - Sensitive Privilege Use failures.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:14101
    exports: []
    inline_content: 'Security Option "Audit: Force audit policy subcategory settings to override audit policy category settings"
      must be set to "Enabled" (WN11-SO-000030) for the detailed auditing subcategories to be effective. Use the AuditPol
      tool to review the current Audit Policy configuration: Open a Command Prompt with elevated privileges ("Run as Administrator").
      Enter "AuditPol /get /category:*". Compare the AuditPol settings with the following. If the system does not audit the
      following, this is a finding: Privilege Use >> Sensitive Privilege Use - Failure'
