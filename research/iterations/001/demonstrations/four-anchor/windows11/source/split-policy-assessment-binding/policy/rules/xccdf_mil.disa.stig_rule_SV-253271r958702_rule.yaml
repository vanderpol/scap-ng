  check: If a hosted hypervisor (Hyper-V, VMware Workstation, etc.) is installed on the system, verify only authorized user
    accounts are allowed to run virtual machines. For Hyper-V, run "Computer Management". Navigate to System Tools >> Local
    Users and Groups >> Groups. Double click on "Hyper-V Administrators". If any unauthorized groups or user accounts are
    listed in "Members:", this is a finding. For hosted hypervisors other than Hyper-V, verify only authorized user accounts
    have access to run the virtual machines. Restrictions may be enforced by access to the physical system, software restriction
    policies, or access restrictions built into the application. If any unauthorized groups or user accounts have access to
    create or run virtual machines, this is a finding. All users authorized to create or run virtual machines must be documented
    with the ISSM/ISSO. Accounts nested within group accounts must be documented as individual accounts and not the group
    accounts.
