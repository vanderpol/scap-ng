rule:
  id: xccdf_mil.disa.stig_rule_SV-253270r991589_rule
  title: Only accounts responsible for the backup operations must be members of the Backup Operators group.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-253270
  description: <VulnDiscussion>Backup Operators are able to read and write to any file in the system, regardless of the rights
    assigned to it. Backup and restore rights permit users to circumvent the file access restrictions present on NTFS disk
    drives for backup and restore purposes. Members of the Backup Operators group must have separate logon accounts for performing
    backup duties.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
