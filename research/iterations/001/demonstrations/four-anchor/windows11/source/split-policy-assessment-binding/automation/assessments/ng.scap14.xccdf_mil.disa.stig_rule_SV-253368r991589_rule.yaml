          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: An exportable version of credentials is provided to remote hosts when using credential delegation which
              exposes them to theft on the remote host. Restricted Admin mode or Remote Credential Guard allow delegation
              of non-exportable credentials providing additional protection of the credentials. Enabling this configures the
              host to support Restricted Admin mode or Remote Credential Guard.
