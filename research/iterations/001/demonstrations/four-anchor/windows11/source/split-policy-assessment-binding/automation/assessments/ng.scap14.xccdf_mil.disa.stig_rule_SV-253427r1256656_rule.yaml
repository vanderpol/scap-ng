        name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:33301
      exports: []
      inline_content: 'Verify the DoW Root CA certificates are installed as Trusted Root Certification Authorities. The certificates
        referenced below apply to unclassified systems; refer to PKE documentation for other networks. Run "PowerShell" as
        an administrator. Execute the following command: Get-ChildItem -Path Cert:Localmachine\root | Where Subject -Like
        "*DoD*" | FL Subject, NotAfter If valid DoW Root CA certificates (such as those below) are not displayed, this is
        a finding. Note: The Common Names (CN) below are examples. Verify the "CN" displayed is a DoW Root CA and is not expired.
        Subject: CN=DoD Root CA 3, OU=PKI, OU=DoD, O=U.S. Government, C=US NotAfter: 12/30/2029 Subject: CN=DoD Root CA 5,
