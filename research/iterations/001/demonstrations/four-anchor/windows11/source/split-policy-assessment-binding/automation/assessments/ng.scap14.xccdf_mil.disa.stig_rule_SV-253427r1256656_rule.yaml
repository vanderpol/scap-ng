          text: "Verify the DoW Root CA certificates are installed as Trusted Root Certification Authorities.\n\nThe certificates\
            \ referenced below apply to unclassified systems; refer to PKE documentation for other networks.\n\nRun \"PowerShell\"\
            \ as an administrator.\n\nExecute the following command:\n\nGet-ChildItem -Path Cert:Localmachine\\root | Where\
            \ Subject -Like \"*DoD*\" | FL Subject, NotAfter\n\nIf valid DoW Root CA certificates (such as those below) are\
            \ not displayed, this is a finding. \n\nNote: The Common Names (CN) below are examples. Verify the \"CN\" displayed\
            \ is a DoW Root CA and is not expired. \n\nSubject: CN=DoD Root CA 3, OU=PKI, OU=DoD, O=U.S. Government, C=US\n\
            NotAfter: 12/30/2029\n\nSubject: CN=DoD Root CA 5, OU=PKI, OU=DoD, O=U.S. Government, C=US\nNotAfter: 6/14/2041\n\
            \nSubject: CN=DoD Root CA 6 OU=PKI, OU=DoD, O=U.S. Government, C=US\nNotAfter: 1/24/2053\n\nAlternately, use the\
            \ Certificates MMC snap-in:\n\nRun \"MMC\".\n\nSelect \"File\" and \"Add/Remove Snap-in\".\n\nSelect \"Certificates\"\
            \ and click \"Add\".\n\nSelect \"Computer account\" and click \"Next\".\n\nSelect \"Local computer: (the computer\
            \ this console is running on)\" and click \"Finish\".\n\nClick \"OK\".\n\nExpand \"Certificates\" and navigate\
            \ to Trusted Root Certification Authorities >> Certificates.\n\nFor each of the DoW Root CA certificates listed:\n\
            \nRight-click on the certificate and select \"Open\".\n\nSelect the \"Details\" tab.\n\nVerify the Expiration\
            \ Date is a future date.\n\nScroll to the bottom and select \"Subject\".\n\nIf valid (unexpired) DoW Root CA certificates\
            \ (such as those below) are not listed, this is a finding.\n\nDoD Root CA 3\nDoD Root CA 5 \nDoD Root CA 6"
