rule:
  id: xccdf_mil.disa.stig_rule_SV-253348r958412_rule
  title: Windows 11 must be configured to audit MPSSVC Rule-Level Policy Change Successes.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
