rule:
  id: xccdf_mil.disa.stig_rule_SV-253272r1210286_rule
  title: Standard local user accounts must not exist on a system in a domain.
  severity: low
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
