  - xccdf_mil.disa.stig_group_V-253272
  description: <VulnDiscussion>To minimize potential points of attack, local user accounts, other than built-in accounts and
    local administrator accounts, must not exist on a workstation in a domain. Users must log on to workstations in a domain
    with their domain accounts.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
