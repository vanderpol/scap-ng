        name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:22301
      exports: []
      inline_content: 'Confirm virtualization-based protection of code integrity. If there are documented operational mission
        needs to disable code integrity, this may be reduced to a CAT II finding. Run "PowerShell" with elevated privileges
        (run as administrator). Enter the following: "Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard"
        If "SecurityServicesRunning" does not include a value of "2" (e.g., "{1, 2}"), this is a finding. Alternately: Run
        "System Information". Under "System Summary", verify the following: If "Virtualization-based Security Services Running"
        does not list "Hypervisor enforced Code Integrity", this is a finding. The policy settings referenced in the Fix section
        will configure the following registry value. However, due to hardware requirements, the registry value alone does
        not ensure proper function. Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\
        Value Name: HypervisorEnforcedCodeIntegrity Value Type: REG_DWORD Value: 0x00000001 (1) (Enabled with UEFI lock),
        or 0x00000002 (2) (Enabled without lock)'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:22301
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Confirm virtualization-based protection of code integrity.


            If there are documented operational mission needs to disable code integrity, this may be reduced to a CAT II finding.


            Run "PowerShell" with elevated privileges (run as administrator).


            Enter the following:


            "Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard"


            If "SecurityServicesRunning" does not include a value of "2" (e.g., "{1, 2}"), this is a finding.


            Alternately:


            Run "System Information".


            Under "System Summary", verify the following:


            If "Virtualization-based Security Services Running" does not list "Hypervisor enforced Code Integrity", this is
            a finding.


            The policy settings referenced in the Fix section will configure the following registry value. However, due to
            hardware requirements, the registry value alone does not ensure proper function.


            Registry Hive: HKEY_LOCAL_MACHINE

            Registry Path: \SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\


            Value Name: HypervisorEnforcedCodeIntegrity

            Value Type: REG_DWORD

            Value: 0x00000001 (1) (Enabled with UEFI lock), or 0x00000002 (2) (Enabled without lock)'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
