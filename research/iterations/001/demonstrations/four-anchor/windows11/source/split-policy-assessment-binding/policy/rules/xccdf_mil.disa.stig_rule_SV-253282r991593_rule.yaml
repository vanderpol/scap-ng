      text: 'Configure firewall exceptions to inbound connections on domain workstations to include only authorized remote
        management hosts.


        Configure only inbound connection exceptions for authorized remote management hosts.

        Computer Configuration >> Windows Settings >> Security Settings >> Windows Defender Firewall with Advanced Security
