        text: 'Verify firewall exceptions to inbound connections on domain workstations include only authorized remote management
          hosts.


          If allowed inbound exceptions are not limited to authorized remote management hosts, this is a finding.


          Review inbound firewall exceptions.

          Computer Configuration >> Windows Settings >> Security Settings >> Windows Defender Firewall with Advanced Security
          >> Windows Defender Firewall with Advanced Security >> Inbound Rules (this link will be in the right pane)


