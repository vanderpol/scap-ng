  fix: Configure firewall exceptions to inbound connections on domain workstations to include only authorized remote management
    hosts. Configure only inbound connection exceptions for authorized remote management hosts. Computer Configuration >>
    Windows Settings >> Security Settings >> Windows Defender Firewall with Advanced Security >> Windows Defender Firewall
    with Advanced Security >> Inbound Rules (this link will be in the right pane) For any inbound rules that allow connections,
    configure the Scope for Remote IP address to those of authorized remote management hosts. This may be defined as an IP
    address, subnet or range. Apply the rule to all firewall profiles. If a third-party firewall is used, configure inbound
    exceptions to only include authorized remote management hosts.
