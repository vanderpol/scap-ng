  description: <VulnDiscussion>Allowing inbound access to domain workstations from other systems may allow lateral movement
    across systems if credentials are compromised. Limiting inbound connections only from authorized remote management systems
    will help limit this exposure.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
