      exports: []
      inline_content: 'Verify the effective setting in Local Group Policy Editor. Run "gpedit.msc". For GPO-managed systems,
        navigate to: Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Account Policies
        >> Password Policy. Or For Intune-managed systems, navigate to: HKLM:\SOFTWARE\Microsoft\PolicyManager\current\device\DeviceLock!DevicePasswordHistory
        If the value for "Enforce password history" is less than "24" passwords remembered, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
