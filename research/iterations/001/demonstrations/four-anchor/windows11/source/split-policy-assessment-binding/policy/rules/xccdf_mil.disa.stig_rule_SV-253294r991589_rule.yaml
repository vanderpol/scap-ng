rule:
  id: xccdf_mil.disa.stig_rule_SV-253294r991589_rule
  title: Administrative accounts must not be used with applications that access the internet, such as web browsers, or with
    potential internet sources, such as email.
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-253294
  description: <VulnDiscussion>Using applications that access the internet or have potential internet sources using administrative
    privileges exposes a system to compromise. If a flaw in an application is exploited while running as a privileged user,
    the entire system could be compromised. Web browsers and email are common attack vectors for introducing malicious code
    and must not be run with an administrative account. Since administrative accounts may generally change or work around
    technical restrictions for running a web browser or other applications, it is essential that policy requires administrative
    accounts to not access the internet or use applications, such as email. The policy must define specific exceptions for
    local service administration. These exceptions may include HTTP(S)-based tools that are used for the administration of
    the local system, services, or attached devices. Technical means such as application allowlisting can be used to enforce
    the policy to ensure compliance.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
