  fix: Establish and enforce a policy that prohibits administrative accounts from using applications that access the internet,
    such as web browsers, or with potential internet sources, such as email. Define specific exceptions for local service
    administration. These exceptions may include HTTP(S)-based tools that are used for the administration of the local system,
    services, or attached devices. Implement technical measures where feasible such as removal of applications or use of application
    allowlisting to restrict the use of applications that can access the internet.
