  group_path:
  - xccdf_mil.disa.stig_group_V-253370
  description: <VulnDiscussion>Credential Guard uses virtualization-based security to protect information that could be used
    in credential theft attacks if compromised. This authentication information, which was stored in the Local Security Authority
    (LSA) in previous versions of Windows, is isolated from the rest of operating system and can only be accessed by privileged
    system software.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
  platforms: []
  effective_platform_refs:
  - cpe:/o:microsoft:windows_11
  effective_platforms:
