rule:
  id: xccdf_mil.disa.stig_rule_SV-253370r1210290_rule
  title: Credential Guard must be running on Windows 11 systems.
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
