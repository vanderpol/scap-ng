  fix: The default behavior is for data execution prevention to be turned on for file explorer. To correct this, configure
    the policy value for Computer Configuration >> Administrative Templates >> Windows Components >> File Explorer >> "Turn
    off Data Execution Prevention for Explorer" to "Not Configured" or "Disabled".
