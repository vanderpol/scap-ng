  description: <VulnDiscussion>Data Execution Prevention (DEP) provides additional protection by performing checks on memory
    to help prevent malicious code from running. This setting will prevent Data Execution Prevention from being turned off
    for File Explorer.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
