  group_path:
  - xccdf_mil.disa.stig_group_V-253466
  description: '<VulnDiscussion>This setting ensures the system uses algorithms that are FIPS compliant for encryption, hashing,
    and signing. FIPS-compliant algorithms meet specific standards established by the U.S. Government and must be the algorithms
    used for all OS encryption functions. Note: A different registry location is needed when systems are managed by Intune
    versus GPO.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
