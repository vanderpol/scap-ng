rule:
  id: xccdf_mil.disa.stig_rule_SV-253466r1210303_rule
  title: The system must be configured to use FIPS-compliant algorithms for encryption, hashing, and signing.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
