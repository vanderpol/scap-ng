  description: <VulnDiscussion>Inappropriate granting of user rights can provide system, administrative, and other high-level
    capabilities. Accounts with the "Create a pagefile" user right can change the size of a pagefile, which could affect system
    performance.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
