  group_path:
  - xccdf_mil.disa.stig_group_V-253444
  description: '<VulnDiscussion>Unattended systems are susceptible to unauthorized use and must be locked when unattended.
    The screen saver must be set at a maximum of 15 minutes and be password protected. This protects critical and sensitive
    data from exposure to unauthorized personnel with physical access to the computer. Satisfies: SRG-OS-000279-GPOS-00109,
    SRG-OS-000163-GPOS-00072</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
