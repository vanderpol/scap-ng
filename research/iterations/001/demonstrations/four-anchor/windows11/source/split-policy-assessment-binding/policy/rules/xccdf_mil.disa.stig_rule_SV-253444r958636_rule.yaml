rule:
  id: xccdf_mil.disa.stig_rule_SV-253444r958636_rule
  title: The machine inactivity limit must be set to 15 minutes, locking the system with the screensaver.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
