  id: ng.manual.xccdf_mil.disa.stig_rule_SV-253280r991589_rule
  version: 1
  description: Software certificate installation files must be removed from Windows 11.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.windows11:questionnaire:5101
    exports: []
    inline_content: Search all drives for *.p12 and *.pfx files. If any files with these extensions exist, this is a finding.
      This does not apply to server-based applications that have a requirement for .p12 certificate files (e.g., Oracle Wallet
      Manager) or Adobe PreFlight certificate files. Some applications create files with extensions of .p12 that are not certificate
      installation files. Removal of non-certificate installation files from systems is not required. These must be documented
      with the ISSO.
