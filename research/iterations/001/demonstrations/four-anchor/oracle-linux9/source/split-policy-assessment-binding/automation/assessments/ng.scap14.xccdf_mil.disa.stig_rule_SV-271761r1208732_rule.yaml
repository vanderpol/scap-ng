        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:64301
      exports: []
      inline_content: 'Verify that OL 9 is implementing ASLR with the following command: $ sysctl kernel.randomize_va_space
        kernel.randomize_va_space = 2 Check that the configuration files are present to enable this kernel parameter: $ sudo
        grep -rs kernel.randomize_va_space /run/sysctl.d/*.conf /usr/local/lib/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf /lib/sysctl.d/*.conf
        /etc/sysctl.conf /etc/sysctl.d/*.conf /etc/sysctl.d/99-kernel_randomize_va_space.conf:kernel.randomize_va_space =
        2 If "kernel.randomize_va_space" is not set to "2", or is missing, this is a finding. If conflicting results are returned,
        this is a finding.'
      multi_check: null
      negate: null
