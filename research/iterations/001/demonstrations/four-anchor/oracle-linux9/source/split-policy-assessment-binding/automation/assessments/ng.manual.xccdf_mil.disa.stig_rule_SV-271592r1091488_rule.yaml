  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271592r1091488_rule
  version: 1
  description: OL 9 must allocate an audit_backlog_limit of sufficient size to capture processes that start prior to the audit
    daemon.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:31301
    exports: []
    inline_content: 'Verify that OL 9 allocates a sufficient audit_backlog_limit to capture processes that start prior to
      the audit daemon with the following command: $ sudo grubby --info=ALL | grep args | grep -v ''audit_backlog_limit=8192''
      If the command returns any outputs, and audit_backlog_limit is less than "8192", this is a finding.'
