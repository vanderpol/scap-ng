  check: 'Verify that OL 9 is configured to restrict access to the kernel message buffer with the following commands: Check
    the status of the kernel.dmesg_restrict kernel parameter. $ sudo sysctl kernel.dmesg_restrict kernel.dmesg_restrict =
    1 If "kernel.dmesg_restrict" is not set to "1" or is missing, this is a finding.'
