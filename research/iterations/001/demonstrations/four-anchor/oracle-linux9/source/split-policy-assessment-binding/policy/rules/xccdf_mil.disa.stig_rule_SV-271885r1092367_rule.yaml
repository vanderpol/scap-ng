  fix: 'Configure OL 9 auditing to prevent modification of login UIDs once they are set by adding the following line to /etc/audit/rules.d/audit.rules:
    --loginuid-immutable The audit daemon must be restarted for the changes to take effect. $ sudo service auditd restart'
