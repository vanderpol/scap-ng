assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271705r1091827_rule
  version: 1
  description: OL 9 must force a frequent session key renegotiation for SSH connections to the server.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:53301
    exports: []
    inline_content: 'Verify that OL 9 SSH server is configured to force frequent session key renegotiation with the following
      command: $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo
      grep -iH ''^\s*rekeylimit'' RekeyLimit 1G 1h If "RekeyLimit" does not have a maximum data amount and maximum time defined,
      is missing or commented out, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
