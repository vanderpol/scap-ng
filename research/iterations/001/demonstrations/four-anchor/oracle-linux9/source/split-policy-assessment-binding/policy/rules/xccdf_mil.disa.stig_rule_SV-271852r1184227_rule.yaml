rule:
  id: xccdf_mil.disa.stig_rule_SV-271852r1184227_rule
  title: OL 9 must be configured to forward audit records via TCP to a different system or media from the system being audited
    via rsyslog.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
