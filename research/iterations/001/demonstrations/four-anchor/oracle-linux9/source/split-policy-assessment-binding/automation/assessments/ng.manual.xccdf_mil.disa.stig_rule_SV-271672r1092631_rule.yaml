    exports: []
    inline_content: 'This requirement assumes the use of the OL 9 default graphical user interface—the GNOME desktop environment.
      If the system does not have any graphical user interface installed, this requirement is Not Applicable. Verify that
      OL 9 disables the user logon list for graphical user interfaces with the following command: $ gsettings get org.gnome.login-screen
      disable-user-list true If the setting is "false", this is a finding.'
