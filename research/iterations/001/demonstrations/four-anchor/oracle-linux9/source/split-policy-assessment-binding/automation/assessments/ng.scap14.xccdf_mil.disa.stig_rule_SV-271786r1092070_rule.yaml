      exports: []
      inline_content: 'Verify that OL 9 system-wide shared library directories are group-owned by "root" with the following
        command: $ sudo find /lib /lib64 /usr/lib /usr/lib64 ! -group root -type d -exec stat -c "%n %G" ''{}'' \; If any
        system-wide shared library directory is returned and is not group-owned by a required system account, this is a finding.'
