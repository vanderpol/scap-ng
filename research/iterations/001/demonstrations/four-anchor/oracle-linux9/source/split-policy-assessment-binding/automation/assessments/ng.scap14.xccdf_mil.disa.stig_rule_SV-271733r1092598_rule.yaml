        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:58701
      exports: []
      inline_content: 'Verify that OL 9 kdump service is disabled or masked in system boot configuration with the following
        command: $ systemctl is-enabled kdump disabled (or masked) Verify that the kdump service is not active (i.e., not
        running) through current runtime configuration with the following command: $ systemctl is-active kdump inactive Verify
        that the kdump service is masked with the following command: $ systemctl show kdump | grep "LoadState\|UnitFileState"
        LoadState=masked UnitFileState=masked If the "kdump" service is loaded or active, and is not masked, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:58701
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify that OL 9 kdump service is disabled or masked in system boot configuration with the following command:\n\
            \n$ systemctl is-enabled  kdump  \ndisabled (or masked)\n\nVerify that the kdump service is not active (i.e.,\
            \ not running) through current runtime configuration with the following command:\n\n$ systemctl is-active kdump\
            \ \ninactive \n\nVerify that the kdump service is masked with the following command:\n\n$ systemctl show  kdump\
            \  | grep \"LoadState\\|UnitFileState\" \nLoadState=masked \nUnitFileState=masked \n\nIf the \"kdump\" service\
            \ is loaded or active, and is not masked, this is a finding."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
