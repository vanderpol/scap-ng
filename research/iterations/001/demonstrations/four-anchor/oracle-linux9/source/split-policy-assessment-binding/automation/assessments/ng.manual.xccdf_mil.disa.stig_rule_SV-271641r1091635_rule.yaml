  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271641r1091635_rule
  version: 1
  description: OL 9 must prevent special devices on file systems that are imported via Network File System (NFS).
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:40901
    exports: []
    inline_content: 'If no NFS mounts are configured, this requirement is Not Applicable. Verify that OL 9 has the "nodev"
      option configured for all NFS mounts with the following command: $ cat /etc/fstab | grep nfs 192.168.22.2:/mnt/export
      /data nfs4 rw,nosuid,nodev,noexec,sync,soft,sec=krb5:krb5i:krb5p If the system is mounting file systems via NFS and
      the "nodev" option is missing, this is a finding.'
