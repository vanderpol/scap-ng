assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271585r1091467_rule
  version: 1
  description: OL 9 audit logs file must have mode 0600 or less permissive to prevent unauthorized access to the audit log.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:29901
    exports: []
    inline_content: 'Verify that OL 9 audit logs have a mode of "0600". First determine where the audit logs are stored with
      the following command: $ sudo grep -iw log_file /etc/audit/auditd.conf log_file = /var/log/audit/audit.log Then using
      the location of the audit log file, determine if the audit log files as a mode of "0640" with the following command:
      $ sudo ls -la /var/log/audit/*.log rw-------. 2 root root 237923 Jun 11 11:56 /var/log/audit/audit.log If the audit
      logs have a mode more permissive than "0600", this is a finding.'
