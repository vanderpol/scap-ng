        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:86101
      exports: []
      inline_content: 'Verify that OL 9 does not respond to ICMP echoes sent to a broadcast address. Check the value of the
        "icmp_echo_ignore_broadcasts" variable with the following command: $ sysctl net.ipv4.icmp_echo_ignore_broadcasts net.ipv4.icmp_echo_ignore_broadcasts
        = 1 If the returned line does not have a value of "1", a line is not returned, or the retuned line is commented out,
        this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:86101
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify that OL 9 does not respond to ICMP echoes sent to a broadcast address.


            Check the value of the "icmp_echo_ignore_broadcasts" variable with the following command:


            $ sysctl net.ipv4.icmp_echo_ignore_broadcasts

            net.ipv4.icmp_echo_ignore_broadcasts = 1


            If the returned line does not have a value of "1", a line is not returned, or the retuned line is commented out,
            this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
