assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271573r1092564_rule
  version: 1
  description: OL 9 must be configured so that successful/unsuccessful uses of the init command generate an audit record.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:27501
    exports: []
    inline_content: 'Verify that OL 9 is configured to audit the execution of the init command with the following command:
      $ sudo auditctl -l | grep init -a always,exit -F path=/usr/sbin/init -F perm=x -F auid>=1000 -F auid!=unset -k privileged-init
      If the command does not return a line or the line is commented out, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
