      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:8301
    exports: []
    inline_content: 'Verify that OL 9 is configured to employ a deny-all, allow-by-exception policy for allowing connections
      to other systems with the following commands: $ sudo firewall-cmd --state running $ sudo firewall-cmd --get-active-zones
      public interfaces: ens33 $ sudo firewall-cmd --info-zone=public | grep target target: DROP $ sudo firewall-cmd --permanent
      --info-zone=public | grep target target: DROP If no zones are active on the OL 9 interfaces or if runtime and permanent
      targets are set to a different option other than "DROP", this is a finding.'
    multi_check: null
    negate: null
