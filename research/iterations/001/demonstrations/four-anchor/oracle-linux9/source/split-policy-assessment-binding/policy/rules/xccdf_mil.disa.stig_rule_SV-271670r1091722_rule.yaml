  fix: 'Configure the GNOME desktop to disable automated mounting of removable media. The dconf settings can be edited in
    the /etc/dconf/db/* location. Update the [org/gnome/desktop/media-handling] section of the "/etc/dconf/db/local.d/00-security-settings"
    database file and add or update the following lines: [org/gnome/desktop/media-handling] automount-open=false Update the
    dconf system databases: $ sudo dconf update'
