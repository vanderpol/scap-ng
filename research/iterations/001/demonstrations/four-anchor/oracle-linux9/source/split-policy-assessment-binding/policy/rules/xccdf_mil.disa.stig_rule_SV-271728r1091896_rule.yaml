  check: 'Verify that OL 9 disables storing core dumps with the following commands: $ sysctl kernel.core_pattern kernel.core_pattern
    = |/bin/false If the returned line does not have a value of "|/bin/false", or a line is not returned and the need for
    core dumps is not documented with the information system security officer (ISSO) as an operational requirement, this is
    a finding.'
