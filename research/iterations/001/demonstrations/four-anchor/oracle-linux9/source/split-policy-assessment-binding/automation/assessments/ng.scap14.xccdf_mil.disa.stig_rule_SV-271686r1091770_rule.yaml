        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:49701
      exports: []
      inline_content: 'This requirement assumes the use of the OL 9 default graphical user interface—the GNOME desktop environment.
        If the system does not have any graphical user interface installed, this requirement is Not Applicable. Verify that
        OL 9 prevents a user from overriding the disable-restart-buttons setting for graphical user interfaces. Determine
        which profile the system database is using with the following command: $ grep system-db /etc/dconf/profile/user system-db:local
        Check that graphical settings are locked from nonprivileged user modification with the following command: Note: The
        example below is using the database "local" for the system, so the path is "/etc/dconf/db/local.d". This path must
        be modified if a database other than "local" is being used. $ grep disable-restart-buttons /etc/dconf/db/local.d/locks/*
        /org/gnome/login-screen/disable-restart-buttons If the command does not return at least the example result, this is
        a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:49701
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "This requirement assumes the use of the OL 9 default graphical user interface—the GNOME desktop environment.\
            \ If the system does not have any graphical user interface installed, this requirement is Not Applicable.\n\n\
            Verify that OL 9 prevents a user from overriding the disable-restart-buttons setting for graphical user interfaces.\
            \ \n\nDetermine which profile the system database is using with the following command:\n\n$ grep system-db /etc/dconf/profile/user\n\
            system-db:local\n\nCheck that graphical settings are locked from nonprivileged user modification with the following\
            \ command:\n\nNote: The example below is using the database \"local\" for the system, so the path is \"/etc/dconf/db/local.d\"\
            . This path must be modified if a database other than \"local\" is being used.\n\n$ grep disable-restart-buttons\
            \ /etc/dconf/db/local.d/locks/* \n/org/gnome/login-screen/disable-restart-buttons\n\nIf the command does not return\
            \ at least the example result, this is a finding."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
