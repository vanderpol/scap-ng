rule:
  id: xccdf_mil.disa.stig_rule_SV-271507r1091233_rule
  title: OL 9 must enable the fapolicy module.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
