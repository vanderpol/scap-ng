rule:
  id: xccdf_mil.disa.stig_rule_SV-271782r1184213_rule
  title: OL 9 local initialization files must have mode 0740 or less permissive.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
