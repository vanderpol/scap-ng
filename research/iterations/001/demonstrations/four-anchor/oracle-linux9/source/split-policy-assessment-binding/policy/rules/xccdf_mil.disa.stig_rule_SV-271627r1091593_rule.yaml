  fix: 'Configure OL 9 to encrypt all stored passwords with a strong cryptographic hash. Edit/modify the following line in
    the "/etc/login.defs" file and set "SHA_CRYPT_MIN_ROUNDS" to a value no lower than "100000": SHA_CRYPT_MIN_ROUNDS 100000
    SHA_CRYPT_MAX_ROUNDS 100000'
