  id: xccdf_mil.disa.stig_rule_SV-271608r1091536_rule
  title: OL 9 must implement certificate status checking for multifactor authentication (MFA).
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
