  check: 'Verify that OL 9 implements Online Certificate Status Protocol (OCSP) and is using the proper digest value on the
    system with the following command: $ sudo grep certificate_verification /etc/sssd/sssd.conf /etc/sssd/conf.d/*.conf |
    grep -v "^#" certificate_verification = ocsp_dgst=sha512 If the certificate_verification line is missing from the [sssd]
    section, or is missing "ocsp_dgst=sha512", ask the administrator to indicate what type of multifactor authentication is
    being used and how the system implements certificate status checking. If there is no evidence of certificate status checking
    being used, this is a finding.'
