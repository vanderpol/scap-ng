        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:87901
      exports: []
      inline_content: 'Note: If IPv6 is disabled on the system, this requirement is Not Applicable. Verify that OL 9 will
        not accept IPv6 ICMP redirect messages. Check the value of the default "accept_redirects" variables with the following
        command: $ sysctl net.ipv6.conf.default.accept_redirects net.ipv6.conf.default.accept_redirects = 0 If the returned
        line does not have a value of "0", a line is not returned, or the line is commented out, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:87901
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Note: If IPv6 is disabled on the system, this requirement is Not Applicable.


            Verify that OL 9 will not accept IPv6 ICMP redirect messages.


            Check the value of the default "accept_redirects" variables with the following command:


            $ sysctl net.ipv6.conf.default.accept_redirects

            net.ipv6.conf.default.accept_redirects = 0


            If the returned line does not have a value of "0", a line is not returned, or the line is commented out, this
            is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
