  check: 'Verify that OL 9 Linux Audit logging is enabled for the USBGuard daemon with the following command: $ sudo grep
    AuditBackend /etc/usbguard/usbguard-daemon.conf AuditBackend=LinuxAudit If "AuditBackend" is not set to "LinuxAudit",
    this is a finding.'
