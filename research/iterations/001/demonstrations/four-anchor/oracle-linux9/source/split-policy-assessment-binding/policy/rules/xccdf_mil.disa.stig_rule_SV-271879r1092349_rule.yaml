rule:
  id: xccdf_mil.disa.stig_rule_SV-271879r1092349_rule
  title: OL 9 must not forward IPv6 source-routed packets.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
