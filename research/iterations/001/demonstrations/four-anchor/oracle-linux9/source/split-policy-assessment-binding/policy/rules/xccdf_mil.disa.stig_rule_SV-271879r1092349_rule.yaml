  group_path:
  - xccdf_mil.disa.stig_group_V-271879
  description: <VulnDiscussion>Source-routed packets allow the source of the packet to suggest that routers forward the packet
    along a different path than configured on the router, which can be used to bypass network security measures. This requirement
    applies only to the forwarding of source-routed traffic, such as when forwarding is enabled and the system is functioning
    as a router.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
