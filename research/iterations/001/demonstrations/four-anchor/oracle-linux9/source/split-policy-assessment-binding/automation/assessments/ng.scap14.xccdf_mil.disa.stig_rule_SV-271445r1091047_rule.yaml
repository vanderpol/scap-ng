        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:2901
      exports: []
      inline_content: 'Verify that OL 9 disables the ability to load the firewire-core kernel module with the following command:
        $ grep -r firewire-core /etc/modprobe.conf /etc/modprobe.d/* install firewire-core /bin/true blacklist firewire-core
        If the command does not return any output, or the line is commented out, and use of firewire-core is not documented
        with the information system security officer (ISSO) as an operational requirement, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
