            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:2901
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify that OL 9 disables the ability to load the firewire-core kernel module with the following command:\n\
            \n$ grep -r firewire-core /etc/modprobe.conf /etc/modprobe.d/* \ninstall firewire-core /bin/true\nblacklist firewire-core\n\
            \nIf the command does not return any output, or the line is commented out, and use of firewire-core is not documented\
            \ with the information system security officer (ISSO) as an operational requirement, this is a finding."
        name: check
