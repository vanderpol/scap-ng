      inline_content: 'Verify that OL 9 is configured to exit interactive command shell user sessions after 15 minutes of
        inactivity or less with the following command: $ grep -i tmout /etc/profile /etc/profile.d/*.sh /etc/profile.d/tmout.sh:declare
