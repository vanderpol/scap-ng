  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271632r1091608_rule
  version: 1
  description: OL 9 user account passwords must have a 60-day maximum password lifetime restriction.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:39301
    exports: []
    inline_content: 'Verify that OL 9 user account passwords have a 60-day maximum password lifetime restriction with the
      following commands: $ sudo awk -F: ''$5 > 60 {print $1 "" "" $5}'' /etc/shadow $ sudo awk -F: ''$5 <= 0 {print $1 ""
      "" $5}'' /etc/shadow If any results are returned that are not associated with a system account, this is a finding.'
