  check: 'Verify that OL 9 is configured to lock the root account after three unsuccessful logon attempts with the command:
    $ grep even_deny_root /etc/security/faillock.conf even_deny_root If the "even_deny_root" option is not set, is missing
    or commented out, this is a finding.'
