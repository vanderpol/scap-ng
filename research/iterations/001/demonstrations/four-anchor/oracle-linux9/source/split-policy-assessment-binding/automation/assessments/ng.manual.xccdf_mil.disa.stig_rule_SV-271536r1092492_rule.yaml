assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271536r1092492_rule
  version: 1
  description: OL 9 must audit all uses of the setxattr, fsetxattr, lsetxattr, removexattr, fremovexattr, and lremovexattr
    system calls.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:20101
    exports: []
    inline_content: 'Verify that OL 9 is configured to audit the execution of the setxattr, fsetxattr, lsetxattr, removexattr,
      fremovexattr, and lremovexattr system calls with the following command: $ sudo auditctl -l | grep xattr -a always,exit
      -F arch=b32 -S setxattr,fsetxattr,lsetxattr,removexattr,fremovexattr,lremovexattr -F auid>=1000 -F auid!=unset -k perm_mod
      -a always,exit -F arch=b64 -S setxattr,fsetxattr,lsetxattr,removexattr,fremovexattr,lremovexattr -F auid>=1000 -F auid!=unset
      -k perm_mod -a always,exit -F arch=b32 -S setxattr,fsetxattr,lsetxattr,removexattr,fremovexattr,lremovexattr -F auid=0
      -k perm_mod -a always,exit -F arch=b64 -S setxattr,fsetxattr,lsetxattr,removexattr,fremovexattr,lremovexattr -F auid=0
      -k perm_mod If both the "b32" and "b64" audit rules are not defined for the setxattr, fsetxattr, lsetxattr, removexattr,
      fremovexattr, and lremovexattr system calls, or any of the lines returned are commented out, this is a finding.'
