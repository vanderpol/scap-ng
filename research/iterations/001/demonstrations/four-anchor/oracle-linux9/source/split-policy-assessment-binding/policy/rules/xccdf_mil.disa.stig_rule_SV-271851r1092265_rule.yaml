  description: <VulnDiscussion>Logging remote access methods can be used to trace the decrease in the risks associated with
    remote user access management. It can also be used to spot cyberattacks and ensure ongoing compliance with organizational
    policies surrounding the use of remote access methods.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
