assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271678r1091746_rule
  version: 1
  description: OL 9 must prevent a user from overriding the disabling of the graphical user interface automount function.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:48101
    exports: []
    inline_content: 'This requirement assumes the use of the OL 9 default graphical user interface—the GNOME desktop environment.
      If the system does not have any graphical user interface installed, this requirement is Not Applicable. Verify that
      OL 9 disables ability of the user to override the graphical user interface automount setting. Determine which profile
      the system database is using with the following command: $ grep system-db /etc/dconf/profile/user system-db:local Check
      that the automount setting is locked from nonprivileged user modification with the following command: Note: The example
      below is using the database "local" for the system, so the path is "/etc/dconf/db/local.d". This path must be modified
      if a database other than "local" is being used. $ grep ''automount-open'' /etc/dconf/db/local.d/locks/* /org/gnome/desktop/media-handling/automount-open
      If the command does not return at least the example result, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
      children:
      - attributes:
          href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
