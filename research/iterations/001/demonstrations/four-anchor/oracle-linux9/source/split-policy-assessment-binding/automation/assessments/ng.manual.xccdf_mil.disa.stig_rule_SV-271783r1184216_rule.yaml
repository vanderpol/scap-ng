      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:68101
    exports: []
    inline_content: 'Verify OL 9 configures assigned home directories of all local interactive users to be group-owned by
      that user''s primary GID with the following command: Note: This may miss local interactive users that have been assigned
      a privileged user identifier (UID). Evidence of interactive use may be obtained from a number of log files containing
      system logon information. The returned directory "/home/disauser" is used as an example. $ sudo ls -ld $(awk -F: ''($3>=1000)&&($7
      !~ /nologin/){print $6}'' /etc/passwd) drwxr-x--- 2 disauser admin 4096 Jun 5 12:41 disauser Check the user''s primary
      group with the following command: $ sudo grep $(grep disauser /etc/passwd | awk -F: ''{print $4}'') /etc/group admin:x:250:disauser,doduser,nsauser
      If the user home directory referenced in "/etc/passwd" is not group-owned by that user''s primary GID, this is a finding.'
    multi_check: null
    negate: null
