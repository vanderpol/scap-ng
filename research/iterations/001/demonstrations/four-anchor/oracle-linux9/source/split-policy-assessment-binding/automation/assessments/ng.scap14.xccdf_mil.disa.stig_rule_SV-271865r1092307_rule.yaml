            text: OL09-00-006021 - OL 9 must not forward Internet Protocol version 4 (IPv4) source-routed packets.
          - attributes:
              family: unix
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Oracle Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "Source-routed packets allow the source of the packet to suggest routers forward the packet along a different\
              \ path than configured on the router, which can be used to bypass network security measures. This requirement\
              \ applies only to the forwarding of source-routed traffic, such as when IPv4 forwarding is enabled and the system\
              \ is functioning as a router.\n\n\tAccepting source-routed packets in the IPv4 protocol has few legitimate uses.\
              \ It must be disabled unless it is absolutely required."
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
