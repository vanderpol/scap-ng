  id: xccdf_mil.disa.stig_rule_SV-271699r1091809_rule
  title: OL 9 must securely compare internal information system clocks at least every 24 hours.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
