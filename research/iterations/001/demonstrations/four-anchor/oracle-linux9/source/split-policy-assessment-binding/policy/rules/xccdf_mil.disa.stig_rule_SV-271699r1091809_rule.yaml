  - xccdf_mil.disa.stig_group_V-271699
  description: '<VulnDiscussion>Inaccurate time stamps make it more difficult to correlate events and can lead to an inaccurate
    analysis. Determining the correct time a particular event occurred on a system is critical when conducting forensic analysis
    and investigating system events. Sources outside the configured acceptable allowance (drift) may be inaccurate. Synchronizing
    internal information system clocks provides uniformity of time stamps for information systems with multiple system clocks
    and systems connected over a network. Depending on the infrastructure being used the "pool" directive may not be supported.
    Authoritative time sources include the United States Naval Observatory (USNO) time servers, a time server designated for
    the appropriate DOD network (NIPRNet/SIPRNet), and/or the Global Positioning System (GPS). Satisfies: SRG-OS-000355-GPOS-00143,
    SRG-OS-000356-GPOS-00144, SRG-OS-000359-GPOS-00146</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
