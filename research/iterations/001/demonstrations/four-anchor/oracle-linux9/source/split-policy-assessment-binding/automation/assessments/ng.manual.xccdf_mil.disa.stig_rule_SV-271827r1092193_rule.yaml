assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271827r1092193_rule
  version: 1
  description: OL 9 cron configuration directories must have a mode of 0700 or less permissive.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:76901
    exports: []
    inline_content: 'Verify that OL 9 configures permissions of the cron directories with the following command: $ find /etc/cron*
      -type d | xargs stat -c "%a %n" 700 /etc/cron.d 700 /etc/cron.daily 700 /etc/cron.hourly 700 /etc/cron.monthly 700 /etc/cron.weekly
      If any cron configuration directory is more permissive than "700", this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
