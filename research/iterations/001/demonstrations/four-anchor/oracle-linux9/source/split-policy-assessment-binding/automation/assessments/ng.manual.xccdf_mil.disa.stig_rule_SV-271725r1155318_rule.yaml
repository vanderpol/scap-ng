  version: 1
  description: OL 9 must require users to provide a password for privilege escalation.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:57101
    exports: []
    inline_content: 'Verify OL 9 requires users to provide a password for privilege escalation. Verify "/etc/sudoers" has
      no occurrences of "NOPASSWD" with the following command: $ sudo grep -iR nopasswd /etc/sudoers /etc/sudoers.d/ If any
      occurrences of "NOPASSWD" are returned from the command and have not been documented with the information system security
      officer (ISSO) as an organizationally defined administrative group using multifactor authentication (MFA), this is a
      finding.'
    multi_check: null
    negate: null
