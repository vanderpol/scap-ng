assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271854r1092274_rule
  version: 1
  description: OL 9 must authenticate the remote logging server for offloading audit logs via rsyslog.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:82301
    exports: []
    inline_content: 'Verify that OL 9 authenticates the remote logging server for off-loading audit logs with the following
      command: $ grep -i ''$ActionSendStreamDriverAuthMode'' /etc/rsyslog.conf /etc/rsyslog.d/*.conf /etc/rsyslog.conf:$ActionSendStreamDriverAuthMode
      x509/name If the value of the "$ActionSendStreamDriverAuthMode" option is not set to "x509/name" or the line is commented
      out, ask the system administrator (SA) to indicate how the audit logs are offloaded to a different system or media.
      If there is no evidence that the transfer of the audit logs being offloaded to another system or media is encrypted,
      this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
