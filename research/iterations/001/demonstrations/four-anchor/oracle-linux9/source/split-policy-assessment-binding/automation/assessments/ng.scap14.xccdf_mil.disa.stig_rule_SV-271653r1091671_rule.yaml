      exports: []
      inline_content: 'Verify that OL 9 is configured to mount /tmp with the nodev option. Verify "/tmp" is mounted with the
        "nodev" option: $ mount | grep /tmp /dev/mapper/ol-tmp on /tmp type xfs (rw,nodev,nosuid,noexec,seclabel) If the "/tmp"
        file system is mounted without the "nodev" option, this is a finding.'
