  id: xccdf_mil.disa.stig_rule_SV-271886r1092370_rule
  title: OL 9 audit system must protect auditing rules from unauthorized change.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
