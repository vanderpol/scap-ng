assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271661r1091695_rule
  version: 1
  description: OL 9 must mount /var/log/audit with the noexec option.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:44901
    exports: []
    inline_content: 'Verify that OL 9 is configured to mount /var/log/audit with the noexec option. Verify "/var/log/audit"
      is mounted with the "noexec" option: $ mount | grep /var/log/audit /dev/mapper/ol-var-log-audit on /var/log/audit type
      xfs (rw,nodev,nosuid,noexec,seclabel) If the "/var/log/audit" file system is mounted without the "noexec" option, this
      is a finding.'
    multi_check: null
    negate: null
    selector: manual
