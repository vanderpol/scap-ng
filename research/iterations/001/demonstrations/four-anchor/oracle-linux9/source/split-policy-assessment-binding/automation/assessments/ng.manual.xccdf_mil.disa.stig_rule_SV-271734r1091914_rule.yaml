assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271734r1091914_rule
  version: 1
  description: OL 9 must clear SLUB/SLAB objects to prevent use-after-free attacks.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:58901
    exports: []
    inline_content: 'Verify that OL 9 GRUB 2 is configured to enable poisoning of SLUB/SLAB objects to mitigate use-after-free
      vulnerabilities with the following commands: Check that the current GRUB 2 configuration has poisoning of SLUB/SLAB
      objects enabled: $ sudo grubby --info=ALL | grep args | grep -v ''slub_debug=P'' If any output is returned, this is
      a finding. Check that poisoning of SLUB/SLAB objects is enabled by default to persist in kernel updates: $ sudo grep
      slub_debug /etc/default/grub GRUB_CMDLINE_LINUX="slub_debug=P" If "slub_debug" is not set to "P", is missing or commented
      out, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
