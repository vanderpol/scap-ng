        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify that OL 9 SSH private host key files have a mode of "0600" or less permissive with the following command:


            $ ls -l /etc/ssh/*_key

            600 /etc/ssh/ssh_host_dsa_key

            600 /etc/ssh/ssh_host_ecdsa_key

            600 /etc/ssh/ssh_host_ed25519_key

