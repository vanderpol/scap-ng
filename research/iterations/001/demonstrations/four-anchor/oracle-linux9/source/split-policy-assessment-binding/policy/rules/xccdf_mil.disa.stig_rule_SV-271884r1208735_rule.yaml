  check: 'Verify OL 9 is configured to use IPv4 TCP syncookies. Determine if syncookies are used with the following command:
    $ sysctl net.ipv4.tcp_syncookies net.ipv4.tcp_syncookies = 1 If the network parameter "ipv4.tcp_syncookies" is not equal
    to "1" or nothing is returned, this is a finding.'
