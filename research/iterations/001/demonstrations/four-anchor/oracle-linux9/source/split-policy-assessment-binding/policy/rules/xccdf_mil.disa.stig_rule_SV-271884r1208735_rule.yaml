  description: '<VulnDiscussion>Denial of service (DoS) is a condition when a resource is not available for legitimate users.
    When this occurs, the organization either cannot accomplish its mission or must operate at degraded capacity. Managing
    excess capacity ensures that sufficient capacity is available to counter flooding attacks. Employing increased capacity
    and service redundancy may reduce the susceptibility to some DoS attacks. Managing excess capacity may include, for example,
    establishing selected usage priorities, quotas, or partitioning. Satisfies: SRG-OS-000420-GPOS-00186, SRG-OS-000142-GPOS-00071</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
