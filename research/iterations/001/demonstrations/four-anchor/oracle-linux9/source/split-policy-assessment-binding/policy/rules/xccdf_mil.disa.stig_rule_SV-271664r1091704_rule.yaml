  check: 'Verify that OL 9 is configured to mount /var/tmp with the noexec option. Verify "/var/tmp" is mounted with the "noexec"
    option: $ mount | grep /var/tmp /dev/mapper/ol-var-tmp on /var/tmp type xfs (rw,nodev,nosuid,noexec,seclabel) If the "/var/tmp"
    file system is mounted without the "noexec" option, this is a finding.'
