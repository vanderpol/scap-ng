  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271677r1091743_rule
  version: 1
  description: OL 9 must disable the ability of a user to accidentally press Ctrl-Alt-Del and cause a system to shut down
    or reboot.
  method: manual_or_external_check
