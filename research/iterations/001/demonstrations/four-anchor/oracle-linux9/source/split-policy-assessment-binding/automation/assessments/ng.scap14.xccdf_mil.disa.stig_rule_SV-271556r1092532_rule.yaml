        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:24101
      exports: []
      inline_content: 'Verify that OL 9 is configured to audit the execution of the chown, fchown, fchownat, and lchown system
        calls with the following command: $ sudo auditctl -l | grep chown -a always,exit -F arch=b32 -S chown,fchown,fchownat,lchown
        -F auid>=1000 -F auid!=unset -k perm_mod -a always,exit -F arch=b64 -S chown,fchown,fchownat,lchown -F auid>=1000
        -F auid!=unset -k perm_mod If both the "b32" and "b64" audit rules are not defined for the chown, fchown, fchownat,
        and lchown system calls, this is a finding.'
      multi_check: null
      negate: null
