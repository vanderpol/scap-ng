assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271713r1091851_rule
  version: 1
  description: OL 9 SSH daemon must disable remote X connections for interactive users.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:54901
    exports: []
    inline_content: 'Verify that OL 9 SSH daemon does not allow X11Forwarding with the following command: $ sudo /usr/sbin/sshd
      -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo grep -iH ''^\s*x11forwarding''
      X11forwarding no If the value is returned as "yes", the returned line is commented out, or no output is returned, and
      X11 forwarding is not documented with the information system security officer (ISSO) as an operational requirement,
      this is a finding.'
    multi_check: null
    negate: null
    selector: manual
