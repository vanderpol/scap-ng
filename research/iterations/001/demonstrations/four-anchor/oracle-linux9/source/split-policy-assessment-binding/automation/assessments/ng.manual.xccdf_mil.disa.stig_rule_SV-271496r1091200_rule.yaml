assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271496r1091200_rule
  version: 1
  description: OL 9 must have the Advanced Intrusion Detection Environment (AIDE) package installed.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:12301
    exports: []
    inline_content: 'Verify that OL 9 has the package installed with the following command: $ dnf list --installed aide Installed
      Packages aide.x86_64 0.16-100.el9 @ol9_appstream If AIDE is not installed, ask the system administrator (SA) how file
      integrity checks are performed on the system. If there is no application installed to perform integrity checks, this
      is a finding. If AIDE is installed, check if it has been initialized with the following command: $ sudo /usr/sbin/aide
      --check If the output is "Couldn''t open file /var/lib/aide/aide.db.gz for reading", this is a finding.'
