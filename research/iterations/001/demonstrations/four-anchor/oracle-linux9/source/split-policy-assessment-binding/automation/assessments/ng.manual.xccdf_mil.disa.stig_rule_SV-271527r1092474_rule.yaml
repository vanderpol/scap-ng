      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:18301
    exports: []
    inline_content: 'Verify that OL 9 generates audit records for all account creations, modifications, disabling, and termination
      events that affect "/etc/sudoers" with the following command: $ sudo auditctl -l | grep /etc/sudoers -w /etc/sudoers
      -p wa -k identity -w /etc/sudoers.d -p wa -k identity If the command does not return a line or the line is commented
      out, this is a finding.'
