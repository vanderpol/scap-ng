  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271433r1091011_rule
  version: 1
  description: OL 9 must be configured so that a separate file system must be used for user home directories (such as /home
    or an equivalent).
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:501
    exports: []
    inline_content: 'Verify that OL 9 uses a separate file system for user home directories (such as /home or an equivalent)
      with the following command: $ mount | grep /home UUID=fba5000f-2ffa-4417-90eb-8c54ae74a32f on /home type ext4 (rw,nodev,nosuid,noexec,seclabel)
      If a separate entry for "/home" is not in use, this is a finding.'
