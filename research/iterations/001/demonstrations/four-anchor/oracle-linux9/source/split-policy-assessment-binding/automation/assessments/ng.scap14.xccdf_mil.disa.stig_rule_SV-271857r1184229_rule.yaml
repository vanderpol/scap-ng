        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:82901
      exports: []
      inline_content: 'Note: If the system administrator can demonstrate that another tool (e.g., SPLUNK) is being used to
        manage log offload and aggregation in lieu of rsyslog, this is not applicable. Verify OL 9 is not configured to receive
        remote logs using rsyslog with the following commands: $ ss -tulnp | grep rsyslog If no output is returned, rsyslog
        is not listening for remote messages and is compliant. If output appears, check for configured ports (514 is the default
        for syslog). Check for remote logging configuration in rsyslog by examining the rsyslog configuration files: $ sudo
        grep -E ''InputTCPServerRun|UDPServerRun|RELPServerRun|imtcp|imudp|imrelp'' /etc/rsyslog.conf /etc/rsyslog.d/* If
        this command returns uncommented lines enabling network listeners, the system is accepting remote logs. If this system
        is not documented and authorized as a log aggregation server, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:82901
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Note: If the system administrator can demonstrate that another tool (e.g., SPLUNK) is being used to manage
            log offload and aggregation in lieu of rsyslog, this is not applicable.


            Verify OL 9 is not configured to receive remote logs using rsyslog with the following commands:


            $ ss -tulnp | grep rsyslog


            If no output is returned, rsyslog is not listening for remote messages and is compliant.


            If output appears, check for configured ports (514 is the default for syslog).


            Check for remote logging configuration in rsyslog by examining the rsyslog configuration files:


            $ sudo grep -E ''InputTCPServerRun|UDPServerRun|RELPServerRun|imtcp|imudp|imrelp'' /etc/rsyslog.conf /etc/rsyslog.d/*


            If this command returns uncommented lines enabling network listeners, the system is accepting remote logs. If
            this system is not documented and authorized as a log aggregation server, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
