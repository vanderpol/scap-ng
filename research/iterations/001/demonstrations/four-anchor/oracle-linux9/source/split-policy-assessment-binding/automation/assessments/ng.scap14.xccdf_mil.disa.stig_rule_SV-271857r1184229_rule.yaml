          - attributes:
              family: unix
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Oracle Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "Unintentionally running a rsyslog server accepting remote messages puts the system at increased risk. Malicious\
              \ rsyslog messages sent to the server could exploit vulnerabilities in the server software itself, could introduce\
              \ misleading information into the system's logs, or could fill the system's storage leading to a denial of service.\n\
              \n\tIf the system is intended to be a log aggregation server, its use must be documented with the information\
              \ system security officer (ISSO)."
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
