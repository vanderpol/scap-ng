        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:29101
      exports: []
      inline_content: 'Verify that OL 9 takes the appropriate action when the audit files have reached maximum size with the
        following command: $ sudo grep max_log_file_action /etc/audit/auditd.conf max_log_file_action = ROTATE If the value
        of the "max_log_file_action" option is not "ROTATE", "SINGLE", or the line is commented out, ask the system administrator
        (SA)to indicate how the system takes appropriate action when an audit storage volume is full. If there is no evidence
        of appropriate action, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:29101
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify that OL 9 takes the appropriate action when the audit files have reached maximum size with the following
            command:


            $ sudo grep max_log_file_action /etc/audit/auditd.conf

            max_log_file_action = ROTATE


            If the value of the "max_log_file_action" option is not "ROTATE", "SINGLE", or the line is commented out, ask
            the system administrator (SA)to indicate how the system takes appropriate action when an audit storage volume
            is full. If there is no evidence of appropriate action, this is a finding.'
        name: check
