          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: It is critical that when the operating system is at risk of failing to process audit logs as required, it
              takes action to mitigate the failure. Audit processing failures include software/hardware errors; failures in
