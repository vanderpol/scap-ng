          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify that OL 9 disables the ability to load the USB Storage kernel module with the following command:\n\
            \n$ grep -r usb-storage /etc/modprobe.conf /etc/modprobe.d/* \ninstall usb-storage /bin/false\nblacklist usb-storage\n\
            \nIf the command does not return any output, or the line is commented out, and use of USB Storage is not documented\
            \ with the information system security officer (ISSO) as an operational requirement, this is a finding."
        name: check
