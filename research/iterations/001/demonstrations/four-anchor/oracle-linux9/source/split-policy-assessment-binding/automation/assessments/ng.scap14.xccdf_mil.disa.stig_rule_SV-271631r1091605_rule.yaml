          - name: title
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: OL09-00-001095 - OL 9 user account passwords for new users or password changes must have a 60-day maximum
              password lifetime restriction in /etc/login.defs.
          - attributes:
              family: unix
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Oracle Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "Any password, no matter how complex, can eventually be cracked; therefore, passwords need to be changed\
              \ periodically. If the operating system does not limit the lifetime of passwords and force users to change their\
              \ passwords, there is the risk that the operating system passwords could be compromised.\n\n\tSetting the password\
              \ maximum age ensures users are required to periodically change their passwords. Requiring shorter password\
              \ lifetimes increases the risk of users writing down the password in a convenient location subject to physical\
              \ compromise."
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
