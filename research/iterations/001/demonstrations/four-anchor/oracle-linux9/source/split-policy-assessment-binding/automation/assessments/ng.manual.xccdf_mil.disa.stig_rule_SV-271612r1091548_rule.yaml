assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271612r1091548_rule
  version: 1
  description: OL 9 must ensure the password complexity module in the system-auth file is configured for three retries or
    less.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:35301
    exports: []
    inline_content: 'Verify that OL 9 is configured to limit the "pwquality" retry option to "3". Check for the use of the
      "pwquality" retry option in the system-auth file with the following command: $ grep pam_pwquality /etc/pam.d/system-auth
      password required pam_pwquality.so retry=3 If the value of "retry" is set to "0" or greater than "3", or is missing,
      this is a finding.'
    multi_check: null
    negate: null
    selector: manual
