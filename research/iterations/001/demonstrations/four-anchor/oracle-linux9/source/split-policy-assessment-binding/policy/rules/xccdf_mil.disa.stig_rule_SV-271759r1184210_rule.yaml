  check: 'Note: If the "bind" package is not installed, this requirement is Not Applicable. Verify OL 9 BIND uses the system
    crypto policy with the following command: $ sudo grep include /etc/named.conf include "/etc/crypto-policies/back-ends/bind.config";''
    If BIND is installed and the BIND config file does not include the "/etc/crypto-policies/back-ends/bind.config" directive,
    or the line is commented out, this is a finding.'
