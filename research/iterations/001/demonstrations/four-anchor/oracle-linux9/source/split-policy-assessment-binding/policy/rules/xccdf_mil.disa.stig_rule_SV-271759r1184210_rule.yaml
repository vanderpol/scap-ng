rule:
  id: xccdf_mil.disa.stig_rule_SV-271759r1184210_rule
  title: OL 9 must implement DOD-approved encryption in the bind package.
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
