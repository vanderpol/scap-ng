  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271452r1091068_rule
  version: 1
  description: OL 9 must use a Linux Security Module configured to enforce limits on system services.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:4301
    exports: []
    inline_content: 'Verify that OL 9 enforces the correct operation of security functions through the use of SELinux with
      the following command: $ getenforce Enforcing If SELINUX is not set to "Enforcing", this is a finding. Verify that SELinux
      is configured to be enforcing at boot. $ grep "SELINUX=" /etc/selinux/config # SELINUX= can take one of these three
      values: # NOTE: In earlier Fedora kernel builds, SELINUX=disabled would also SELINUX=enforcing If SELINUX line is missing,
      commented out, or not set to "enforcing", this is a finding.'
