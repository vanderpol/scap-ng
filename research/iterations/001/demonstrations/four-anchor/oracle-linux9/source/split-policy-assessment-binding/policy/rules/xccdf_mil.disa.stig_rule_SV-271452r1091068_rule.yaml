  group_path:
  - xccdf_mil.disa.stig_group_V-271452
  description: '<VulnDiscussion>Without verification of the security functions, security functions may not operate correctly
    and the failure may go unnoticed. Security function is defined as the hardware, software, and/or firmware of the information
    system responsible for enforcing the system security policy and supporting the isolation of code and data on which the
    protection is based. Security functionality includes, but is not limited to, establishing system accounts, configuring
    access authorizations (i.e., permissions, privileges), setting events to be audited, and setting intrusion detection parameters.
    This requirement applies to operating systems performing security function verification/testing and/or systems and environments
    that require this functionality. Satisfies: SRG-OS-000445-GPOS-00199, SRG-OS-000134-GPOS-00068</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
  discussion: null
