  check: 'Verify that OL 9 configures permissions of the cron directories with the following command: $ find /etc/cron* -type
    d | xargs stat -c "%a %n" 700 /etc/cron.d 700 /etc/cron.daily 700 /etc/cron.hourly 700 /etc/cron.monthly 700 /etc/cron.weekly
    If any cron configuration directory is more permissive than "700", this is a finding.'
