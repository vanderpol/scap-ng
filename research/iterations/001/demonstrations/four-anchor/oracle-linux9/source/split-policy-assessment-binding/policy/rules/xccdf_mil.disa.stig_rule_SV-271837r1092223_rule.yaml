  check: 'Verify that OL 9 configures the pam_faillock.so module to exist in the "/etc/pam.d/system-auth" file with the following
    command: $ grep pam_faillock.so /etc/pam.d/system-auth auth required pam_faillock.so preauth auth required pam_faillock.so
    authfail account required pam_faillock.so If the pam_faillock.so module is not present in the "/etc/pam.d/system-auth"
    file with the "preauth" line listed before pam_unix.so, this is a finding.'
