  id: xccdf_mil.disa.stig_rule_SV-271669r1184200_rule
  title: OL 9 must prevent special devices on nonroot local partitions.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
