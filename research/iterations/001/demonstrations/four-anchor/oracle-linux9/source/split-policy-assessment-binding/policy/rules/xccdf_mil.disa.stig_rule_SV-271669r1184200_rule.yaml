  check: 'Verify OL 9 prevents special devices on nonroot local partitions. Verify all nonroot local partitions are mounted
    with the "nodev" option with the following command: $ mount | grep ''^/dev\S* on /\S'' | grep --invert-match ''nodev''
    If any output is produced, this is a finding.'
