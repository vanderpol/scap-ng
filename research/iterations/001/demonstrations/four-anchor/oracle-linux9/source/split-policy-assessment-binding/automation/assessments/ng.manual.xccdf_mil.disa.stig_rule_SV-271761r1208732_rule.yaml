  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271761r1208732_rule
  version: 1
  description: OL 9 must implement address space layout randomization (ASLR) to protect its memory from unauthorized code
    execution.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:64301
    exports: []
    inline_content: 'Verify that OL 9 is implementing ASLR with the following command: $ sysctl kernel.randomize_va_space
      kernel.randomize_va_space = 2 Check that the configuration files are present to enable this kernel parameter: $ sudo
      grep -rs kernel.randomize_va_space /run/sysctl.d/*.conf /usr/local/lib/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf /lib/sysctl.d/*.conf
      /etc/sysctl.conf /etc/sysctl.d/*.conf /etc/sysctl.d/99-kernel_randomize_va_space.conf:kernel.randomize_va_space = 2
      If "kernel.randomize_va_space" is not set to "2", or is missing, this is a finding. If conflicting results are returned,
      this is a finding.'
