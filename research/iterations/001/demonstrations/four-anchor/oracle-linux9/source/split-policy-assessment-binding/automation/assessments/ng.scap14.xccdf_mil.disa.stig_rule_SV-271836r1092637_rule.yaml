        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:78701
      exports: []
      inline_content: 'Note: If the system does not have SELinux enabled and enforcing a targeted policy, or if the pam_faillock
        module is not configured for use, this requirement is Not Applicable. Verify that OL 9 configures the SELinux context
        type to allow the use of a nondefault faillock tally directory. Verify the location of the nondefault tally directory
        for the pam_faillock module with the following command: $ grep ''dir ='' /etc/security/faillock.conf dir = /var/log/faillock
        Check the security context type of the nondefault tally directory with the following command: $ ls -Zd /var/log/faillock
        unconfined_u:object_r:faillog_t:s0 /var/log/faillock If the security context type of the nondefault tally directory
        is not "faillog_t", this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:78701
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Note: If the system does not have SELinux enabled and enforcing a targeted policy, or if the pam_faillock
            module is not configured for use, this requirement is Not Applicable.


            Verify that OL 9 configures the SELinux context type to allow the use of a nondefault faillock tally directory.


            Verify the location of the nondefault tally directory for the pam_faillock module with the following command:


            $ grep ''dir ='' /etc/security/faillock.conf

            dir = /var/log/faillock


            Check the security context type of the nondefault tally directory with the following command:


            $ ls -Zd /var/log/faillock

            unconfined_u:object_r:faillog_t:s0 /var/log/faillock


            If the security context type of the nondefault tally directory is not "faillog_t", this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
