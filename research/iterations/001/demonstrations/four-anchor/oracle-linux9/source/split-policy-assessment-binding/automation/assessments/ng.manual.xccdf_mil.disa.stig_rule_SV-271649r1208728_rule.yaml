assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271649r1208728_rule
  version: 1
  description: OL 9 must prevent files with the setuid and setgid bit set from being executed on the /boot/efi directory.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:42501
    exports: []
    inline_content: 'Note: For systems that use BIOS, this is not applicable. Verify OL 9 "/boot/efi directory" is mounted
      with the "nosuid" option with the following command: $ mount | grep ''\s/boot/efi\s'' /dev/sda1 on /boot/efi type vfat
      (rw,nosuid,relatime,fmask=0077,dmask=0077,codepage=437,iocharset=ascii,shortname=winnt,errors=remount-ro) If the "/boot/efi"
      file system does not have the "nosuid" option set, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
