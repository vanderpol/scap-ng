          text: 'Verify that OL 9 remote access using SSH prevents users from logging on directly as "root" with the following
            command:


            $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo grep
