      - name: check-content
        namespace: http://checklists.nist.gov/xccdf/1.2
        text: 'Verify that OL 9 does not accept IPv4 source-routed packets by default.


          Check the value of the accept source route variable with the following command:


          $ sysctl net.ipv4.conf.default.accept_source_route

          net.ipv4.conf.default.accept_source_route = 0


          If the returned line does not have a value of "0", a line is not returned, or the line is commented out, this is
          a finding.'
      name: check
      namespace: http://checklists.nist.gov/xccdf/1.2
