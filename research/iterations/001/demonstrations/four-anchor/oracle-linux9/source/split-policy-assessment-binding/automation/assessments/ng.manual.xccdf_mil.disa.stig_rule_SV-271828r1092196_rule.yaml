assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271828r1092196_rule
  version: 1
  description: OL 9 cron configuration files directory must be group-owned by root.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:77101
    exports: []
    inline_content: 'Verify that OL 9 configures group ownership of all cron configuration files with the following command:
      $ stat -c "%G %n" /etc/cron* root /etc/cron.d root /etc/cron.daily root /etc/cron.deny root /etc/cron.hourly root /etc/cron.monthly
      root /etc/crontab root /etc/cron.weekly If any crontab is not group owned by root, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
