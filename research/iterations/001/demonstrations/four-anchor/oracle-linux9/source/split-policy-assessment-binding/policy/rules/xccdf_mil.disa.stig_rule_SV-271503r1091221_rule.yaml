  check: 'Verify that OL 9 has USBGuard installed on the operating system with the following command: $ dnf list --installed
    usbguard Installed Packages usbguard.x86_64 1.0.0-15.el9 @ol9_appstream If the USBGuard package is not installed, ask
    the SA to indicate how unauthorized peripherals are being blocked. If there is no evidence that unauthorized peripherals
    are being blocked before establishing a connection, this is a finding.'
