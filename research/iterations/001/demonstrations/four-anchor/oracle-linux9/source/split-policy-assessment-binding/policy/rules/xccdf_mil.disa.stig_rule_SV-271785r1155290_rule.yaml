  fix: 'Configure all OL 9 public directories to be owned by root or a system account to prevent unauthorized and unintended
    information transferred via shared system resources. Use the following command template to set ownership of public directories
    to root or a system account: $ sudo chown [root or system account] [Public Directory]'
