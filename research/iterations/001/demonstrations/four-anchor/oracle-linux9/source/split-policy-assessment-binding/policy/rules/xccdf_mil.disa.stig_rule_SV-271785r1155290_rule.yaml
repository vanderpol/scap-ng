rule:
  id: xccdf_mil.disa.stig_rule_SV-271785r1155290_rule
  title: OL 9 world-writable directories must be owned by root, sys, bin, or an application user.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
