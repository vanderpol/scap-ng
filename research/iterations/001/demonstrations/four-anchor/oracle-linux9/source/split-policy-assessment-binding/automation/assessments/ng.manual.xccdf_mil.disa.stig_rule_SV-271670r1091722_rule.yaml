        namespace: http://checklists.nist.gov/xccdf/1.2
        text: "This requirement assumes the use of the OL 9 default graphical user interface—the GNOME desktop environment.\
          \ If the system does not have any graphical user interface installed, this requirement is Not Applicable.\n\nVerify\
          \ that OL 9 disables the graphical user interface automount function with the following command:\n\n$ gsettings\
          \ get org.gnome.desktop.media-handling automount-open \nfalse\n\nIf \"automount-open\" is set to \"true\", and is\
          \ not documented with the information system security officer (ISSO) as an operational requirement, this is a finding."
      name: check
      namespace: http://checklists.nist.gov/xccdf/1.2
    system: http://scap.nist.gov/schema/ocil/2
