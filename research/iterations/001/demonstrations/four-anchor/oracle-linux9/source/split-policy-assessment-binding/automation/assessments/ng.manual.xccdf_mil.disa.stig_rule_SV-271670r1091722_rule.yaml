assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271670r1091722_rule
  version: 1
  description: OL 9 must disable the graphical user interface automount function unless required.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:46701
    exports: []
    inline_content: 'This requirement assumes the use of the OL 9 default graphical user interface—the GNOME desktop environment.
      If the system does not have any graphical user interface installed, this requirement is Not Applicable. Verify that
      OL 9 disables the graphical user interface automount function with the following command: $ gsettings get org.gnome.desktop.media-handling
      automount-open false If "automount-open" is set to "true", and is not documented with the information system security
      officer (ISSO) as an operational requirement, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
