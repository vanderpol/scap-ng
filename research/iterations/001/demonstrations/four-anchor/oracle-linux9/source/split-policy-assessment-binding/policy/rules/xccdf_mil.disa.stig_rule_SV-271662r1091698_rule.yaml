  check: 'Verify that OL 9 is configured to mount /var/log/audit with the nosuid option. Verify "/var/log/audit" is mounted
    with the "nosuid" option: $ mount | grep /var/log/audit /dev/mapper/ol-var-log-audit on /var/log/audit type xfs (rw,nodev,nosuid,noexec,seclabel)
    If the "/var/log/audit" file system is mounted without the "nosuid" option, this is a finding.'
