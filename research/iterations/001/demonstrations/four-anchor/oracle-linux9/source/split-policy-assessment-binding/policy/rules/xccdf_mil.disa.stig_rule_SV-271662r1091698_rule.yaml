rule:
  id: xccdf_mil.disa.stig_rule_SV-271662r1091698_rule
  title: OL 9 must mount /var/log/audit with the nosuid option.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
