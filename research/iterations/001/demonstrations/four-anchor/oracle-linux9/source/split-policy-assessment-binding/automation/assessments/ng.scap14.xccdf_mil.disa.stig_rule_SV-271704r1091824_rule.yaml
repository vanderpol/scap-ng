        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:53101
      exports: []
      inline_content: 'Verify that OL 9 SSH daemon does not allow GSSAPI authentication with the following command: $ sudo
        /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo grep -iH ''^\s*gssapiauthentication''
        GSSAPIAuthentication no If the value is returned as "yes", the returned line is commented out, no output is returned,
        and the use of GSSAPI authentication has not been documented with the information system security officer (ISSO),
        this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
