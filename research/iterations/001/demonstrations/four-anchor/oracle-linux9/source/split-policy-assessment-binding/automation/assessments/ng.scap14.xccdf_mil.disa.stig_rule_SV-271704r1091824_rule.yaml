          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify that OL 9 SSH daemon does not allow GSSAPI authentication with the following command:


            $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo grep
            -iH ''^\s*gssapiauthentication''

            GSSAPIAuthentication no


            If the value is returned as "yes", the returned line is commented out, no output is returned, and the use of GSSAPI
            authentication has not been documented with the information system security officer (ISSO), this is a finding.'
