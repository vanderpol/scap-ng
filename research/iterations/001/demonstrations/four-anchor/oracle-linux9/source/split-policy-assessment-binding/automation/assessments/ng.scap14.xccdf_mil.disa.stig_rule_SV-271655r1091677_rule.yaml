        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:43701
      exports: []
      inline_content: 'Verify that OL 9 is configured to mount /tmp with the nosuid option. Verify "/tmp" is mounted with
        the "nosuid" option: $ mount | grep /tmp /dev/mapper/ol-tmp on /tmp type xfs (rw,nodev,nosuid,noexec,seclabel) If
        the "/tmp" file system is mounted without the "nosuid" option, this is a finding.'
      multi_check: null
      negate: null
