rule:
  id: xccdf_mil.disa.stig_rule_SV-271591r1092578_rule
  title: The OL 9 system administrator (SA) and/or information system security officer (ISSO) (at a minimum) must be alerted
    of an audit processing failure event.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-271591
  description: '<VulnDiscussion>It is critical for the appropriate personnel to be aware if a system is at risk of failing
    to process audit logs as required. Without this notification, the security personnel may be unaware of an impending failure
    of the audit capability, and system operation may be adversely affected. Audit processing failures include software/hardware
    errors, failures in the audit capturing mechanisms, and audit storage capacity being reached or exceeded. This requirement
    applies to each audit data storage repository (i.e., distinct information system component where audit records are stored),
    the centralized audit storage capacity of organizations (i.e., all audit data storage repositories combined), or both.
    Satisfies: SRG-OS-000046-GPOS-00022, SRG-OS-000343-GPOS-00134</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
  discussion: null
