rule:
  id: xccdf_mil.disa.stig_rule_SV-271589r1091479_rule
  title: OL 9 must forward mail from postmaster to the root account using a postfix alias.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
