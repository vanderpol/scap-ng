  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271487r1091173_rule
  version: 1
  description: OL 9 must display the Standard Mandatory DOD Notice and Consent Banner before granting local or remote access
    to the system via a SSH logon.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:10701
    exports: []
    inline_content: 'Verify that OL 9 displays the Standard Mandatory DOD Notice and Consent Banner before granting access
      to the system via SSH connections. Check for the location of the banner file currently being used with the following
      command: $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo
      grep -iH ''^\s*banner'' banner /etc/issue If the line is commented out or if the file is missing, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
