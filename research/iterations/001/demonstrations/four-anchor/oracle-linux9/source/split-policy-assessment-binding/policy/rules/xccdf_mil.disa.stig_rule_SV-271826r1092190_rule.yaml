rule:
  id: xccdf_mil.disa.stig_rule_SV-271826r1092190_rule
  title: OL 9 audit tools must have a mode of 0755 or less permissive.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
