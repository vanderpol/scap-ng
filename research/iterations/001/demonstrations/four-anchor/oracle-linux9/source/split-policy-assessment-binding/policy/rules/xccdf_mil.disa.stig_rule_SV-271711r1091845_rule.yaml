  check: 'Verify that OL 9 SSH daemon does not allow rhosts authentication with the following command: $ sudo /usr/sbin/sshd
    -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo grep -iH ''^\s*ignorerhosts'' IgnoreRhosts
    yes If the value is returned as "no", the returned line is commented out, or no output is returned, this is a finding.'
