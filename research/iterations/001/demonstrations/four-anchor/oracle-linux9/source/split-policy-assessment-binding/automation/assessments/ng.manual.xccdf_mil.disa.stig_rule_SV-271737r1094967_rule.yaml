  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271737r1094967_rule
  version: 1
  description: OL 9 must disable virtual system calls.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:59501
    exports: []
    inline_content: 'Verify that OL 9 disables virtual system calls. Check the current GRUB 2 configuration with the following
      command: $ sudo grubby --info=ALL | grep args | grep -v ''vsyscall=none'' If any output is returned, this is a finding.
      Check that virtual system calls are disabled by default to persist in kernel updates with the following command: $ grep
      vsyscall /etc/default/grub GRUB_CMDLINE_LINUX="vsyscall=none" If "vsyscall" is not set to "none", is missing or commented
      out, and is not documented with the information system security officer (ISSO) as an operational requirement, this is
      a finding.'
    multi_check: null
    negate: null
    selector: manual
