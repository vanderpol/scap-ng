  check: 'Verify that OL 9 routinely executes a file integrity scan for changes to the system baseline. The command used in
    the example will use a daily occurrence. Check the cron directories for scripts controlling the execution and notification
    of results of the file integrity application. For example, if Advanced Intrusion Detection Environment (AIDE) is installed
    on the system, use the following commands: $ ls -al /etc/cron.* | grep aide -rwxr-xr-x 1 root root 29 Nov 22 2015 aide
    $ sudo grep aide /etc/crontab /var/spool/cron/root /etc/crontab: 30 04 * * * root usr/sbin/aide /var/spool/cron/root:
    30 04 * * * root usr/sbin/aide $ more /etc/cron.daily/aide #!/bin/bash /usr/sbin/aide --check | /bin/mail -s "$HOSTNAME
    - Daily aide integrity check run" root@sysname.mil If the file integrity application does not exist, or a script file
    controlling the execution of the file integrity application does not exist, or the file integrity application does not
    notify designated personnel of changes, this is a finding.'
