rule:
  id: xccdf_mil.disa.stig_rule_SV-271497r1092471_rule
  title: OL 9 must routinely check the baseline configuration for unauthorized changes and notify the system administrator
    (SA) when anomalies in the operation of any security functions are discovered.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-271497
  description: '<VulnDiscussion>Unauthorized changes to the baseline configuration could make the system vulnerable to various
    attacks or allow unauthorized access to the operating system. Changes to operating system configurations can have unintended
    side effects, some of which may be relevant to security. Detecting such changes and providing an automated response can
    help avoid unintended, negative consequences that could ultimately affect the security state of the operating system.
    The operating system''s information management officer (IMO)/information system security officer (ISSO) and SAs must be
    notified via email and/or monitoring system trap when there is an unauthorized modification of a configuration item. Notifications
    provided by information systems include messages to local computer consoles, and/or hardware indications, such as lights.
    This capability must take into account operational requirements for availability for selecting an appropriate response.
    The organization may choose to shut down or restart the information system upon security function anomaly detection. Satisfies:
    SRG-OS-000363-GPOS-00150, SRG-OS-000446-GPOS-00200, SRG-OS-000447-GPOS-00201</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
