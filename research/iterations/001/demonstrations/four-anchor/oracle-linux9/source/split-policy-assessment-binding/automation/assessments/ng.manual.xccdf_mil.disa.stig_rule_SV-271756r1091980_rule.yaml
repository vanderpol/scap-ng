  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271756r1091980_rule
  version: 1
  description: OL 9 local disk partitions must implement cryptographic mechanisms to prevent unauthorized disclosure or modification
    of all information that requires at rest protection.
  method: manual_or_external_check
  source_checks:
