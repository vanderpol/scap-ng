  check: 'Verify that OL 9 does not allow interfaces to perform Internet Protocol version 4 (IPv4) ICMP redirects by default.
    Check the value of the "default send_redirects" variables with the following command: $ sysctl net.ipv4.conf.default.send_redirects
    net.ipv4.conf.default.send_redirects=0 If "net.ipv4.conf.default.send_redirects" is not set to "0" and is not documented
    with the information system security officer (ISSO) as an operational requirement or is missing, this is a finding.'
