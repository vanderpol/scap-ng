      text: 'Configure OL 9 so that the cryptographic hashes of system files match vendor values.


        Given output from the check command, identify the package that provides the output and reinstall it. The following
        trimmed example output shows a package that has failed verification, been identified, and been reinstalled:


        $ sudo rpm -Va --noconfig | awk ''$1 ~ /..5/ && $2 != "c"''

        S.5....T.    /usr/bin/znew


        $ sudo dnf provides /usr/bin/znew

        [...]

        gzip-1.10-8.el9.x86_64 : The GNU data compression program

        [...]


        $ sudo dnf -y reinstall gzip

        [...]


        $ sudo rpm -Va --noconfig | awk ''$1 ~ /..5/ && $2 != "c"''

        [no output]'
