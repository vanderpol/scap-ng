  check: 'Verify that OL 9 is configured so that the cryptographic hashes of system files match vendor values. List files
    on the system that have file hashes different from what is expected by the RPM database with the following command: $
    sudo rpm -Va --noconfig | awk ''$1 ~ /..5/ && $2 != "c"'' If there is output, this is a finding.'
