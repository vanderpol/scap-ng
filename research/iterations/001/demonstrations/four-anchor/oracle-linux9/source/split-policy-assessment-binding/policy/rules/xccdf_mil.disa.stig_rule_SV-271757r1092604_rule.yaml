  id: xccdf_mil.disa.stig_rule_SV-271757r1092604_rule
  title: OL 9 file systems must not contain shosts.equiv files.
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
