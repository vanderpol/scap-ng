  - xccdf_mil.disa.stig_group_V-271783
  description: <VulnDiscussion>If the Group Identifier (GID) of a local interactive user's home directory is not the same
    as the primary GID of the user, this would allow unauthorized access to the user's files, and users that share the same
    group may not be able to access files that they legitimately should.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
