rule:
  id: xccdf_mil.disa.stig_rule_SV-271783r1184216_rule
  title: OL 9 local interactive user home directories must be group-owned by the home directory owner's primary group.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
