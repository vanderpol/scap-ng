  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271867r1092313_rule
  version: 1
  description: OL 9 must log IPv4 packets with impossible addresses by default.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:84901
    exports: []
    inline_content: 'Verify that OL 9 logs IPv4 martian packets by default. Check the value of the accept source route variable
      with the following command: $ sysctl net.ipv4.conf.default.log_martians net.ipv4.conf.default.log_martians = 1 If the
      returned line does not have a value of "1", a line is not returned, or the line is commented out, this is a finding.'
