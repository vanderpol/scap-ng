assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271773r1155299_rule
  version: 1
  description: OL 9 system commands must be group-owned by root or a system account.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:66101
    exports: []
    inline_content: 'Verify OL 9 system commands contained in the following directories are group-owned by "root", or a required
      system account, with the following command: $ sudo find -L /bin /sbin /usr/bin /usr/sbin /usr/libexec /usr/local/bin
      /usr/local/sbin ! -group root -exec ls -l {} \; If any system commands are returned and is not group-owned by a required
      system account, this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
