  fix: 'Create home directories to all local interactive users that currently do not have a home directory assigned. Use the
    following commands to create the user home directory assigned in "/etc/ passwd": Note: The example will be for the user
    disauser, who has a home directory of "/home/disauser", a user identifier (UID) of "disauser", and a Group Identifier
    (GID) of "users assigned" in "/etc/passwd". $ sudo mkdir /home/disauser $ sudo chown disauser /home/disauser $ sudo chgrp
    users /home/disauser $ sudo chmod 0750 /home/disauser'
