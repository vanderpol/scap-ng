assessment:
  id: ng.manual.xccdf_mil.disa.stig_rule_SV-271591r1092578_rule
  version: 1
  description: The OL 9 system administrator (SA) and/or information system security officer (ISSO) (at a minimum) must be
    alerted of an audit processing failure event.
  method: manual_or_external_check
  source_checks:
  - content_refs:
    - href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
      name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:31101
    exports: []
    inline_content: 'Verify that OL 9 is configured to notify the SA and/or ISSO (at a minimum) in the event of an audit processing
      failure with the following command: $ sudo grep action_mail_acct /etc/audit/auditd.conf action_mail_acct = root If the
      value of the "action_mail_acct" keyword is not set to "root" and/or other accounts for security personnel, the "action_mail_acct"
      keyword is missing, or the retuned line is commented out, ask the SA to indicate how they and the ISSO are notified
      of an audit process failure. If there is no evidence of the proper personnel being notified of an audit processing failure,
      this is a finding.'
    multi_check: null
    negate: null
    selector: manual
    source_tree:
      attributes:
        selector: manual
        system: http://scap.nist.gov/schema/ocil/2
      children:
