  id: xccdf_mil.disa.stig_rule_SV-271641r1091635_rule
  title: OL 9 must prevent special devices on file systems that are imported via Network File System (NFS).
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
