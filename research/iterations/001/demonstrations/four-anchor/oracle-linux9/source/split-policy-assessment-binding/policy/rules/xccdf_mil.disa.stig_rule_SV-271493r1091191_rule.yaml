  group_path:
  - xccdf_mil.disa.stig_group_V-271493
  description: '<VulnDiscussion>Using an authentication device, such as a CAC or token that is separate from the information
    system, ensures that even if the information system is compromised, that compromise will not affect credentials stored
    on the authentication device. Multifactor solutions that require devices separate from information systems gaining access
    include, for example, hardware tokens providing time-based or challenge-response authenticators and smart cards such as
    the U.S. Government Personal Identity Verification card and the DOD Common Access Card. A privileged account is defined
    as an information system account with authorizations of a privileged user. Remote access is access to DOD nonpublic information
    systems by an authorized user (or an information system) communicating through an external, nonorganization-controlled
    network. Remote access methods include, for example, dial-up, broadband, and wireless. This requirement only applies to
    components where this is specific to the function of the device or has the concept of an organizational user (e.g., VPN,
    proxy capability). This does not apply to authentication for the purpose of configuring the device itself (management).
    Satisfies: SRG-OS-000705-GPOS-00150, SRG-OS-000105-GPOS-00052, SRG-OS-000106-GPOS-00053, SRG-OS-000107-GPOS-00054, SRG-OS-000108-GPOS-00055,
    SRG-OS-000375-GPOS-00160</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
