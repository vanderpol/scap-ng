  check: 'Verify that OL 9 uses a separate file system for user home directories (such as /home or an equivalent) with the
    following command: $ mount | grep /home UUID=fba5000f-2ffa-4417-90eb-8c54ae74a32f on /home type ext4 (rw,nodev,nosuid,noexec,seclabel)
    If a separate entry for "/home" is not in use, this is a finding.'
