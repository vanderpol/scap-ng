  description: <VulnDiscussion>OL 9 installation media ships with an optional file integrity tool called Advanced Intrusion
    Detection Environment (AIDE). AIDE is highly configurable at install time. This requirement assumes the "aide.conf" file
    is under the "/etc" directory. ACLs can provide permissions beyond those permitted through the file mode and must be verified
    by the file integrity tools.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
