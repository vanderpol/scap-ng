rule:
  id: xccdf_mil.disa.stig_rule_SV-271603r1092592_rule
  title: OL 9 must act when allocated audit record storage volume reaches 95 percent of the repository maximum audit record
    storage capacity.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
