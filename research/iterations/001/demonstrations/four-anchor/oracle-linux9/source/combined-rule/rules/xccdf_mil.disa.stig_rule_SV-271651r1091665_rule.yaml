  check: 'Verify that OL 9 is configured to mount /dev/shm with the noexec option. Verify "/dev/shm" is mounted with the "noexec"
    option with the following command: $ mount | grep /dev/shm tmpfs on /dev/shm type tmpfs (rw,nodev,nosuid,noexec,seclabel)
    If the /dev/shm file system is mounted without the "noexec" option, this is a finding.'
