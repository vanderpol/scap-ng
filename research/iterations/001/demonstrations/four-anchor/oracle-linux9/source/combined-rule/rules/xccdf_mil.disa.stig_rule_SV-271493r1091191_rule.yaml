rule:
  id: xccdf_mil.disa.stig_rule_SV-271493r1091191_rule
  title: OL 9 must have the SSSD package installed.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
