  check: 'Note: If the system does not have SELinux enabled and enforcing a targeted policy, or if the pam_faillock module
    is not configured for use, this requirement is Not Applicable. Verify that OL 9 configures the SELinux context type to
    allow the use of a nondefault faillock tally directory. Verify the location of the nondefault tally directory for the
    pam_faillock module with the following command: $ grep ''dir ='' /etc/security/faillock.conf dir = /var/log/faillock Check
    the security context type of the nondefault tally directory with the following command: $ ls -Zd /var/log/faillock unconfined_u:object_r:faillog_t:s0
    /var/log/faillock If the security context type of the nondefault tally directory is not "faillog_t", this is a finding.'
