  description: '<VulnDiscussion>The FTP service provides an unencrypted remote access that does not provide for the confidentiality
    and integrity of user passwords or the remote session. If a privileged user were to log on using this service, the privileged
    user password could be compromised. SSH or other encrypted file transfer methods must be used in place of this service.
    Removing the "vsftpd" package decreases the risk of accidental activation. Satisfies: SRG-OS-000074-GPOS-00042, SRG-OS-000095-GPOS-00049</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
