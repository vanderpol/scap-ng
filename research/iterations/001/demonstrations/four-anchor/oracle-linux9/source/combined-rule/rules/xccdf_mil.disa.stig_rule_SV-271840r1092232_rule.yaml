  fix: 'Configure OL 9 to lock out the "root" account after a number of incorrect login attempts using "pam_faillock.so",
    first enable the feature using the following command: $ sudo authselect enable-feature with-faillock Then edit the "/etc/security/faillock.conf"
    file as follows: add or uncomment the following line: even_deny_root'
