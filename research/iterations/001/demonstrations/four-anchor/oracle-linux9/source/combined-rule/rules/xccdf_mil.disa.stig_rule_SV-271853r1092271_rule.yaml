    value: CCI-000366
  requires: []
  conflicts: []
  check: 'Verify that OL 9 rsyslog is configured to log cron events with the following command: Note: If another logging package
    is used, substitute the utility configuration file for "/etc/rsyslog.conf" or "/etc/rsyslog.d/*.conf" files. $ grep -s
    cron /etc/rsyslog.conf /etc/rsyslog.d/*.conf /etc/rsyslog.conf:*.info;mail.none;authpriv.none;cron.none /var/log/messages
    /etc/rsyslog.conf:cron.* /var/log/cron If the command does not return a response, check for cron logging all facilities
    with the following command: $ grep -s /var/log/messages /etc/rsyslog.conf /etc/rsyslog.d/*.conf /etc/rsyslog.conf:*.info;mail.none;authpriv.none;cron.none
    /var/log/messages If "rsyslog" is not logging messages for the cron facility or all facilities, this is a finding.'
