rule:
  id: xccdf_mil.disa.stig_rule_SV-271668r1091716_rule
  title: OL 9 must prevent code from being executed on file systems that contain user home directories.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
