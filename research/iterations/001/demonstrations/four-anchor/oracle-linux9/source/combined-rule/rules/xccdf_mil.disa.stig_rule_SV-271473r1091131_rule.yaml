  fix: 'Configure the firewalld daemon to employ a deny-all, allow-by-exception with the following commands: Start by adding
    the exceptions that are required for mission functionality to the "drop" zone. If SSH access on port 22 is needed, for
    example, run the following: "sudo firewall-cmd --permanent --add-service=ssh --zone=drop" Reload the firewall rules to
    update the runtime configuration from the "--permanent" changes made above: $ sudo firewall-cmd --reload Set the default
    zone to the drop zone: $ sudo firewall-cmd --set-default-zone=drop Note: This is a runtime and permanent change. Add any
    interfaces to the newly modified "drop" zone: $ sudo firewall-cmd --permanent --zone=drop --change-interface=ens33 Reload
    the firewall rules for changes to take effect: $ sudo firewall-cmd --reload'
