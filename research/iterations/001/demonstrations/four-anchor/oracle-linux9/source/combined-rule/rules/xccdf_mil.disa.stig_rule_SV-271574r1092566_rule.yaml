  fix: 'Configure the audit system to generate an audit event for any successful/unsuccessful uses of the poweroff command
    by adding or updating the following rule in the "/etc/audit/rules.d/audit.rules" file: -a always,exit -F path=/usr/sbin/poweroff
    -F perm=x -F auid>=1000 -F auid!=unset -k privileged-poweroff The audit daemon must be restarted for the changes to take
    effect. Restart auditd: $ sudo service auditd restart'
