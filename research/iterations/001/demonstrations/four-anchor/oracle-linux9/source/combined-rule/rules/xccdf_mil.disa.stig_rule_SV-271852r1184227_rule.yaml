      text: '<VulnDiscussion>Information stored in one location is vulnerable to accidental or incidental deletion or alteration.


        Offloading is a common process in information systems with limited audit storage capacity.


        OL 9 installation media provides "rsyslogd", a system utility providing support for message logging. Support for both
        internet and Unix domain sockets enables this utility to support both local and remote logging. Coupling this utility
        with "gnutls" (a secure communications library implementing the SSL, TLS, and DTLS protocols) creates a method to
        securely encrypt and offload auditing.


        Rsyslog provides three ways to forward message: the traditional UDP transport, which is extremely lossy but standard;
        the plain TCP based transport, which loses messages only during certain situations but is widely available; and the
        RELP transport, which does not lose messages but is currently available only as part of the rsyslogd 3.15.0 and above.


        Examples of each configuration:

        UDP *.* @remotesystemname

        TCP *.* @@remotesystemname

        RELP *.* :omrelp:remotesystemname:2514

        Note that a port number was given as there is no standard port for RELP.


        Satisfies: SRG-OS-000479-GPOS-00224, SRG-OS-000342-GPOS-00133</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
