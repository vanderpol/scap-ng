  check: 'This requirement assumes the use of the OL 9 default graphical user interface—the GNOME desktop environment. If
    the system does not have any graphical user interface installed, this requirement is Not Applicable. Verify that OL 9
    disables the graphical user interface autorun function with the following command: $ gsettings get org.gnome.desktop.media-handling
    autorun-never true If "autorun-never" is set to "false", and is not documented with the information system security officer
    (ISSO) as an operational requirement, this is a finding.'
