  fix: 'Configure OL 9 to enable hardening for the BPF JIT compiler by adding the following line to a file, in the "/etc/sysctl.d"
    directory: net.core.bpf_jit_harden = 2 The system configuration files need to be reloaded for the changes to take effect.
    To reload the contents of the files, run the following command: $ sudo sysctl --system'
