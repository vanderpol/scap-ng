rule:
  id: xccdf_mil.disa.stig_rule_SV-271649r1208728_rule
  title: OL 9 must prevent files with the setuid and setgid bit set from being executed on the /boot/efi directory.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
