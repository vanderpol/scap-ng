rule:
  id: xccdf_mil.disa.stig_rule_SV-271883r1092361_rule
  title: OL 9 must not forward IPv6 source-routed packets by default.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-271883
  description: <VulnDiscussion>Source-routed packets allow the source of the packet to suggest that routers forward the packet
    along a different path than configured on the router, which can be used to bypass network security measures. This requirement
    applies only to the forwarding of source-routed traffic, such as when forwarding is enabled and the system is functioning
    as a router. Accepting source-routed packets in the IPv6 protocol has few legitimate uses. It must be disabled unless
    it is absolutely required.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
