  description: <VulnDiscussion>The presence of "martian" packets (which have impossible addresses) as well as spoofed packets,
    source-routed packets, and redirects could be a sign of nefarious network activity. Logging these packets enables this
    activity to be detected.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
