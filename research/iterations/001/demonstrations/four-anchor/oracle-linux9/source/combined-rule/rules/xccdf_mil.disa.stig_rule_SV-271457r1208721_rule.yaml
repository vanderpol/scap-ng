  check: 'Verify that OL 9 is not able to install packages from the EPEL with the following command: $ dnf repolist repo id
    repo name ol9_UEKR7 Oracle Linux 9 UEK Release 7 (x86_64) ol9_appstream Oracle Linux 9 Application Stream Packages (x86_64)
    ol9_baseos_latest Oracle Linux 9 BaseOS Latest (x86_64) ol9_oraclelinuxmanager210_client Oracle Linux Manager Client 2.10
    for Oracle Linux 9 (x86_64) If any repositories containing the word "epel" in the name exist, this is a finding.'
