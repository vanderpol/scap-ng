rule:
  id: xccdf_mil.disa.stig_rule_SV-271563r1092546_rule
  title: OL 9 must audit all uses of the rename, unlink, rmdir, renameat, and unlinkat system calls.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
