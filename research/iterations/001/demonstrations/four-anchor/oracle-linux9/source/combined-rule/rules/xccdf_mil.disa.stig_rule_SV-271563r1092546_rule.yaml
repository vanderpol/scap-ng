  fix: 'Configure OL 9 to generate an audit event for any successful/unsuccessful use of the rename, unlink, rmdir, renameat,
    and unlinkat system calls by adding or updating the following rules in the "/etc/audit/rules.d/audit.rules" file: -a always,exit
    -F arch=b32 -S rename,unlink,rmdir,renameat,unlinkat -F auid>=1000 -F auid!=unset -k delete -a always,exit -F arch=b64
    -S rename,unlink,rmdir,renameat,unlinkat -F auid>=1000 -F auid!=unset -k delete The audit daemon must be restarted for
    the changes to take effect. Restart auditd: $ sudo service auditd restart'
