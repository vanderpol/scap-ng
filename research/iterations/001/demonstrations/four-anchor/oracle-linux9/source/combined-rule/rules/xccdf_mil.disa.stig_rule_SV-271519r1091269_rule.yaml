rule:
  id: xccdf_mil.disa.stig_rule_SV-271519r1091269_rule
  title: OL 9 must have the audit package installed.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-271519
  description: '<VulnDiscussion>Without establishing what type of events occurred, the source of events, where events occurred,
    and the outcome of events, it would be difficult to establish, correlate, and investigate the events leading up to an
    outage or attack. Audit record content that may be necessary to satisfy this requirement includes, for example, time stamps,
    source and destination addresses, user/process identifiers, event descriptions, success/fail indications, filenames involved,
    and access control or flow control rules invoked. Associating event types with detected events in audit logs provides
    a means of investigating an attack, recognizing resource utilization or capacity thresholds, or identifying an improperly
    configured OL 9 system. Satisfies: SRG-OS-000062-GPOS-00031, SRG-OS-000037-GPOS-00015, SRG-OS-000038-GPOS-00016, SRG-OS-000039-GPOS-00017,
    SRG-OS-000040-GPOS-00018, SRG-OS-000041-GPOS-00019, SRG-OS-000042-GPOS-00021, SRG-OS-000051-GPOS-00024, SRG-OS-000054-GPOS-00025,
