rule:
  id: xccdf_mil.disa.stig_rule_SV-271722r1091878_rule
  title: OL 9 must require reauthentication when using the "sudo" command.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-271722
  description: <VulnDiscussion>Without reauthentication, users may access resources or perform tasks for which they do not
    have authorization. When operating systems provide the capability to escalate a functional capability, it is critical
    the organization requires the user to reauthenticate when using the "sudo" command. If the value is set to an integer
    less than "0", the user's time stamp will not expire and the user will not have to reauthenticate for privileged actions
    until the user's session is terminated.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
  platforms: []
  effective_platform_refs:
  - cpe:/o:oracle:linux:9:-
  effective_platforms:
  - kind: cpe_name
    name: cpe:/o:oracle:linux:9:-
    ref: cpe:/o:oracle:linux:9:-
  references:
  - href: null
    text: DPMS Target Oracle Linux 9 DISA DPMS Target Oracle Linux 9 5680
  idents:
  - system: http://cyber.mil/cci
    value: CCI-000366
  requires: []
  conflicts: []
  check: 'Verify that OL 9 requires reauthentication when using the "sudo" command to elevate privileges with the following
    command: $ sudo grep -i ''timestamp_timeout'' /etc/sudoers /etc/sudoers.d/* /etc/sudoers:Defaults timestamp_timeout=0
    If results are returned from more than one file location, this is a finding. If "timestamp_timeout" is set to a negative
    number, is commented out, or no results are returned, this is a finding.'
