  check: 'Verify that OL 9 audit logs are group-owned by "root" or a restricted logging group. First determine if a group
    other than "root" has been assigned to the audit logs with the following command: $ sudo grep log_group /etc/audit/auditd.conf
    log_group = root Then determine where the audit logs are stored with the following command: $ sudo grep -iw log_file /etc/audit/auditd.conf
    log_file = /var/log/audit/audit.log Then, using the location of the audit log file, determine if the audit log is group-owned
    by "root" using the following command: $ sudo stat -c "%G %n" /var/log/audit/audit.log root /var/log/audit/audit.log If
    the audit log is not group-owned by "root" or the configured alternative logging group, this is a finding.'
