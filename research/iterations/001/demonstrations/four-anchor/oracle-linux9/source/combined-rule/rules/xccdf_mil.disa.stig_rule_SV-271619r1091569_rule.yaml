  check: 'Verify that OL 9 requires the maximum number of repeating characters be limited to three when passwords are changed.
    Verify the value of the "maxrepeat" option in "/etc/security/pwquality.conf" with the following command: $ grep maxrepeat
    /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf maxrepeat = 3 If the value of "maxrepeat" is set to
    more than "3", or is commented out, this is a finding.'
