        exports: []
        inline_content: 'This requirement assumes the use of the OL 9 default graphical user interface—the GNOME desktop environment.
          If the system does not have any graphical user interface installed, this requirement is Not Applicable. Verify that
          OL 9 disables a user''s ability to restart the system with the following command: $ grep -R disable-restart-buttons
          /etc/dconf/db/* /etc/dconf/db/distro.d/20-authselect:disable-restart-buttons=''true'' If the "disable-restart-button"
          setting is not set to "true", is missing or commented out from the dconf database files, this is a finding.'
        multi_check: null
