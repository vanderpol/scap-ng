  fix: 'Configure OL 9 to disable a user''s ability to restart the system. Add or update the [org/gnome/settings-daemon/]
    section of the /etc/dconf/db/local.d/00-security-settings" database file and add or update the following lines: [org/gnome/settings-daemon/peripherals/smartcard]
    disable-restart-buttons=''true'' Then update the dconf system databases: $ sudo dconf update'
