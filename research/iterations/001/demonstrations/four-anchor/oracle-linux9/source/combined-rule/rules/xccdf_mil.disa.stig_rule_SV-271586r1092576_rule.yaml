  group_path:
  - xccdf_mil.disa.stig_group_V-271586
  description: <VulnDiscussion>Without establishing what type of events occurred, the source of events, where events occurred,
    and the outcome of events, it would be difficult to establish, correlate, and investigate the events leading up to an
    outage or attack. If option "local_events" isn't set to "yes" only events from network will be aggregated.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
