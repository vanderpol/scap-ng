rule:
  id: xccdf_mil.disa.stig_rule_SV-271458r1091086_rule
  title: OL 9 must not have the telnet-server package installed.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-271458
  description: <VulnDiscussion>It is detrimental for operating systems to provide, or install by default, functionality exceeding
    requirements or mission objectives. These unnecessary capabilities are often overlooked and therefore, may remain unsecure.
    They increase the risk to the platform by providing additional attack vectors. The telnet service provides an unencrypted
    remote access service, which does not provide for the confidentiality and integrity of user passwords or the remote session.
    If a privileged user were to login using this service, the privileged user password could be compromised. Removing the
    "telnet-server" package decreases the risk of accidental (or intentional) activation of the telnet service.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
