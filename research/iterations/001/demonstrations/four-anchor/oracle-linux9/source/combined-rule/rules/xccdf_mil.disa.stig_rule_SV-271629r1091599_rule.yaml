rule:
  id: xccdf_mil.disa.stig_rule_SV-271629r1091599_rule
  title: OL 9 passwords for new users or password changes must have a 24-hour minimum password lifetime restriction in /etc/login.defs.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-271629
  description: <VulnDiscussion>Enforcing a minimum password lifetime helps to prevent repeated password changes to defeat
    the password reuse or history enforcement requirement. If users are allowed to immediately and continually change their
    password, then the password could be repeatedly changed in a short period of time to defeat the organization's policy
    regarding password reuse. Setting the minimum password age protects against users cycling back to a favorite password
    after satisfying the password reuse requirement.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
