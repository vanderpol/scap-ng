  - xccdf_mil.disa.stig_group_V-271628
  description: '<VulnDiscussion>The system must use a strong hashing algorithm to store the password. Passwords need to be
    protected at all times, and encryption is the standard method for protecting passwords. If passwords are not encrypted,
    they can be plainly read (i.e., clear text) and easily compromised. Satisfies: SRG-OS-000073-GPOS-00041, SRG-OS-000120-GPOS-00061</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
