  check: 'Verify that OL 9 is configured to audit the execution of the usermod command with the following command: $ sudo
    auditctl -l | grep usermod -a always,exit -F path=/usr/sbin/usermod -F perm=x -F auid>=1000 -F auid!=unset -k privileged-usermod
    If the command does not return a line or the line is commented out, this is a finding.'
