  fix: 'Configure OL 9 to generate audit records upon successful/unsuccessful attempts to use the usermod command by adding
    or updating the following rule in "/etc/audit/rules.d/audit.rules": -a always,exit -F path=/usr/sbin/usermod -F perm=x
    -F auid>=1000 -F auid!=unset -k privileged-usermod The audit daemon must be restarted for the changes to take effect.
    Restart auditd: $ sudo service auditd restart'
