  fix: 'Configure OL 9 to generate audit records for all account creations, modifications, disabling, and termination events
    that affect /var/log/lastlog. Add or update the following file system rule to "/etc/audit/rules.d/audit.rules": -w /var/log/lastlog
    -p wa -k logins The audit daemon must be restarted for the changes to take effect. Restart auditd: $ sudo service auditd
    restart'
