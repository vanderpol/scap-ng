  check: 'Verify that OL 9 systemwide shared library files contained in the directories "/lib", "/lib64", "/usr/lib", and
    "/usr/lib64" are group owned by root with the following command: $ sudo find /lib /lib64 /usr/lib /usr/lib64 -type f -name
    ''*.so*'' ! -group root -exec stat -c "%n %G" {} + If any output is returned, this is a finding.'
