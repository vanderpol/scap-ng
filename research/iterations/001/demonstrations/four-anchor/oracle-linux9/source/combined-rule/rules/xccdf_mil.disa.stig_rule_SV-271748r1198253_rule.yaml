  fix: 'Configure OL 9 to prevent privilege escalation thru the kernel by disabling access to the bpf syscall by adding the
    following line to a file, in the "/etc/sysctl.d" directory: kernel.unprivileged_bpf_disabled = 1 The system configuration
    files need to be reloaded for the changes to take effect. To reload the contents of the files, run the following command:
    $ sudo sysctl --system'
