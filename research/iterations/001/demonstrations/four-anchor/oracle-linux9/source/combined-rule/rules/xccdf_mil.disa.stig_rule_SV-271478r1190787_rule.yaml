      text: "Configure OL 9 to use a modified FIPS-compliant systemwide crypto-policy.\n \nCreate subpolicies for enhancements\
        \ to the systemwide crypto-policy with the following commands:\n \nCreate or edit the SCOPES-AND-WILDCARDS policy\
        \ module in a text editor and insert options that modify the systemwide cryptographic policy as follows:\n\n$ sudo\
        \ vi /etc/crypto-policies/policies/modules/SCOPES-AND-WILDCARDS.pmod\n \nAdd the following lines to the policy:\n\n\
        # Disable CHACHA20-POLY1305 for the TLS protocol (OpenSSL, GnuTLS, NSS, and OpenJDK)\ncipher@TLS = -CHACHA20-POLY1305\n\
        \ \n# Disable all CBC mode ciphers for the SSH protocol (libssh and OpenSSH):\n\ncipher@SSH = -*-CBC\n \nCreate or\
        \ edit the OPENSSH-SUBPOLICY module in a text editor and insert options that modify the systemwide crypto-policy as\
        \ follows:\n\n$ sudo vi /etc/crypto-policies/policies/modules/OPENSSH-SUBPOLICY.pmod\n \nAdd the following lines to\
        \ the policy:\n\n# Define ciphers for OpenSSH\ncipher@SSH=AES-256-GCM AES-128-GCM AES-256-CTR AES-128-CTR\n \n# Define\
        \ MACs for OpenSSH\nmac@SSH=HMAC-SHA2-512 HMAC-SHA2-256\n \nCreate or edit the REQUIRE.pmod file and add the following\
        \ lines to include the subpolicies in the FIPS configuration with the following command:\n\n$ sudo vi /etc/crypto-policies/policies/modules/REQUIRE.pmod\n\
        \ \nAdd the following lines to REQUIRE.pmod:\n\n@OPENSSH-SUBPOLICY\n@SCOPES-AND-WILDCARDS\n \nApply the policy enhancements\
        \ to the FIPS systemwide cryptographic policy level with the following command:\n \n$ sudo update-crypto-policies\
        \ --set FIPS\n\nNote: If additional subpolicies are being employed, they must be added to the REQUIRE.pmod as well.\
        \ REQUIRE.pmod is included in the systemwide crypto-policy when it is set.\n \nTo make the cryptographic settings\
        \ effective for already running services and applications, restart the system:\n\n$ sudo reboot"
