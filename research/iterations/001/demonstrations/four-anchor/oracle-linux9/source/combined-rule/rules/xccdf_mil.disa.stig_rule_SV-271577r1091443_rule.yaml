rule:
  id: xccdf_mil.disa.stig_rule_SV-271577r1091443_rule
  title: OL 9 must enable auditing of processes that start prior to the audit daemon.
  severity: low
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
