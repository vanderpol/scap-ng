            text: "Verify that OL 9 is configured to enable auditing of processes that start prior to the audit daemon.\n\n\
              Check that the current GRUB 2 configuration enables auditing:\n\n$ sudo grubby --info=ALL | grep audit\nargs=\"\
              ro crashkernel=auto resume=/dev/mapper/ol-swap rd.lvm.lv=ol/root rd.lvm.lv=ol/swap rhgb quiet fips=1 audit=1\
              \ audit_backlog_limit=8192 pti=on \n\nIf \"audit\" is not set to \"1\" or is missing, this is a finding.\n\n\
              Check that auditing is enabled by default to persist through kernel updates: \n\n$ sudo grep audit /etc/default/grub\n\
              GRUB_CMDLINE_LINUX=\"audit=1\"\n\nIf \"audit\" is not set to \"1\", is missing, or is commented out, this is\
              \ a finding."
          name: check
