  requires: []
  conflicts: []
  check: 'Verify that OL 9 audit system configuration prevents unauthorized changes with the following command: $ sudo grep
    "^\s*[^#]" /etc/audit/audit.rules | tail -1 -e 2 If the audit system is not set to be immutable by adding the "-e 2" option
    to the end of "/etc/audit/audit.rules", this is a finding.'
