rule:
  id: xccdf_mil.disa.stig_rule_SV-271616r1091560_rule
  title: OL 9 must enforce password complexity by requiring that at least one numeric character be used.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
