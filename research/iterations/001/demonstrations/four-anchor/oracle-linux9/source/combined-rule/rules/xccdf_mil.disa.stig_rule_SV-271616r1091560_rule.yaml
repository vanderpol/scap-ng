  check: 'Verify that OL 9 enforces password complexity by requiring at least one numeric character. Check the value for "dcredit"
    with the following command: $ grep dcredit /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf /etc/security/pwquality.conf:dcredit
    = -1 If the value of "dcredit" is a positive number or is commented out, this is a finding.'
