    value: CCI-002165
  - system: http://cyber.mil/cci
    value: CCI-002235
  requires: []
  conflicts: []
  check: 'Verify that OL 9 is configured to enable DAC on symlinks. Check the status of the fs.protected_symlinks kernel parameter
    with the following command: $ sudo sysctl fs.protected_symlinks fs.protected_symlinks = 1 If "fs.protected_symlinks "
    is not set to "1" or is missing, this is a finding.'
