rule:
  id: xccdf_mil.disa.stig_rule_SV-271524r1091284_rule
  title: OL 9 must check the GPG signature of software packages originating from external software repositories before installation.
  severity: high
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-271524
  description: <VulnDiscussion>Changes to any software components can have significant effects on the overall security of
    the operating system. This requirement ensures the software has not been tampered with and that it has been provided by
    a trusted vendor. All software packages must be signed with a cryptographic key recognized and approved by the organization.
    Verifying the authenticity of software prior to installation validates the integrity of the software package received
    from a vendor. This verifies the software has not been tampered with and that it has been provided by a trusted vendor.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
