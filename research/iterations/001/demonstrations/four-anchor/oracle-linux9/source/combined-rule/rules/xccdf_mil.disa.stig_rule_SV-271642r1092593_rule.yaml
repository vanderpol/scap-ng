rule:
  id: xccdf_mil.disa.stig_rule_SV-271642r1092593_rule
  title: OL 9 must prevent code from being executed on file systems that are imported via Network File System (NFS).
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-271642
  description: <VulnDiscussion>The "noexec" mount option causes the system not to execute binary files. This option must be
    used for mounting any file system not containing approved binary as they may be incompatible. Executing files from untrusted
    file systems increases the opportunity for nonprivileged users to attain unauthorized administrative access.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
