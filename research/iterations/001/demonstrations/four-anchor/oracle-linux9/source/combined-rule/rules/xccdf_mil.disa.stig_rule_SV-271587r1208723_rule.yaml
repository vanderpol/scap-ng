  check: 'Verify that OL 9 sets files in directories "/etc/audit/rules.d/" and "/etc/audit/auditd.conf" files to have a mode
    of "0600" or less permissive with the following command: $ sudo stat -c "%a %n" /etc/audit/rules.d/*.rules $ sudo sh -c
    ''stat -c "%a %n" /etc/audit/rules.d/*.rules'' 600 /etc/audit/rules.d/audit.rules If the files in the "/etc/audit/rules.d/"
    directory or the "/etc/audit/auditd.conf" file have a mode more permissive than "0600", this is a finding.'
