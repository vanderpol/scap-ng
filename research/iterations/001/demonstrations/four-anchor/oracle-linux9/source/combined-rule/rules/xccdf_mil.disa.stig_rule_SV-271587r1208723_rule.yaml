rule:
  id: xccdf_mil.disa.stig_rule_SV-271587r1208723_rule
  title: OL 9 must allow only the information system security manager (ISSM) (or individuals or roles appointed by the ISSM)
    to select which auditable events are to be audited.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
