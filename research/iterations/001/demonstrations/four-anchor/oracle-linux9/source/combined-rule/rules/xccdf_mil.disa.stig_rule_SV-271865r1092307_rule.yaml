  idents:
  - system: http://cyber.mil/cci
    value: CCI-000366
  requires: []
  conflicts: []
  check: 'Verify that OL 9 will not accept IPv4 source-routed packets. Check the value of the all "accept_source_route" variables
    with the following command: $ sysctl net.ipv4.conf.all.accept_source_route net.ipv4.conf.all.accept_source_route = 0 If
    the returned line does not have a value of "0", a line is not returned, or the line is commented out, this is a finding.'
