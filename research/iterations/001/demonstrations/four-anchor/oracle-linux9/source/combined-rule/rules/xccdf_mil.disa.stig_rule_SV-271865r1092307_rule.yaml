rule:
  id: xccdf_mil.disa.stig_rule_SV-271865r1092307_rule
  title: OL 9 must not forward Internet Protocol version 4 (IPv4) source-routed packets.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-271865
  description: <VulnDiscussion>Source-routed packets allow the source of the packet to suggest routers forward the packet
    along a different path than configured on the router, which can be used to bypass network security measures. This requirement
    applies only to the forwarding of source-routed traffic, such as when IPv4 forwarding is enabled and the system is functioning
    as a router. Accepting source-routed packets in the IPv4 protocol has few legitimate uses. It must be disabled unless
    it is absolutely required.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
