rule:
  id: xccdf_mil.disa.stig_rule_SV-271854r1092274_rule
  title: OL 9 must authenticate the remote logging server for offloading audit logs via rsyslog.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-271854
  description: '<VulnDiscussion>Information stored in one location is vulnerable to accidental or incidental deletion or alteration.
    Offloading is a common process in information systems with limited audit storage capacity. OL 9 installation media provides
    "rsyslogd", a system utility providing support for message logging. Support for both internet and Unix domain sockets
    enables this utility to support both local and remote logging. Coupling this utility with "gnutls" (a secure communications
    library implementing the SSL, TLS, and DTLS protocols) creates a method to securely encrypt and offload auditing. "Rsyslog"
    supported authentication modes include: anon - anonymous authentication x509/fingerprint - certificate fingerprint authentication
    x509/certvalid - certificate validation only x509/name - certificate validation and subject name authentication Satisfies:
    SRG-OS-000342-GPOS-00133, SRG-OS-000479-GPOS-00224</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
  discussion: null
  platforms: []
  effective_platform_refs:
  - cpe:/o:oracle:linux:9:-
  effective_platforms:
  - kind: cpe_name
    name: cpe:/o:oracle:linux:9:-
    ref: cpe:/o:oracle:linux:9:-
  references:
