rule:
  id: xccdf_mil.disa.stig_rule_SV-271494r1091194_rule
  title: OL 9 must use the SSSD package for multifactor authentication services.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
