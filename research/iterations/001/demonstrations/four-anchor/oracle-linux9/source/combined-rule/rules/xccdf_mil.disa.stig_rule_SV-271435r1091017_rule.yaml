  group_path:
  - xccdf_mil.disa.stig_group_V-271435
  description: <VulnDiscussion>Ensuring that "/var" is mounted on its own partition enables the setting of more restrictive
    mount options. This helps protect system services such as daemons or other programs which use it. It is not uncommon for
    the "/var" directory to contain world-writable directories installed by other software packages.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
