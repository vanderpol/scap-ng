rule:
  id: xccdf_mil.disa.stig_rule_SV-271744r1091944_rule
  title: OL 9 must have mail aliases to notify the information system security officer (ISSO) and system administrator (SA)
    (at a minimum) in the event of an audit processing failure.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
