rule:
  id: xccdf_mil.disa.stig_rule_SV-271874r1092612_rule
  title: OL 9 must limit the number of bogus Internet Control Message Protocol (ICMP) response errors logs.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-271874
  description: <VulnDiscussion>Some routers will send responses to broadcast frames that violate RFC-1122, which fills up
    a log file system with many useless error messages. An attacker may take advantage of this and attempt to flood the logs
    with bogus error logs. Ignoring bogus ICMP error responses reduces log size, although some activity would not be logged.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
  platforms: []
  effective_platform_refs:
