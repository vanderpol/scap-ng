  fix: 'Configure OL 9 to not log bogus ICMP errors: Add or edit the following line in a single system configuration file
    in the "/etc/sysctl.d/" directory: net.ipv4.icmp_ignore_bogus_error_responses = 1 Load settings from all system configuration
    files with the following command: $ sudo sysctl --system'
