    name: cpe:/o:oracle:linux:9:-
    ref: cpe:/o:oracle:linux:9:-
  references:
  - href: null
    text: DPMS Target Oracle Linux 9 DISA DPMS Target Oracle Linux 9 5680
  idents:
  - system: http://cyber.mil/cci
    value: CCI-000366
  requires: []
  conflicts: []
  check: 'Verify that OL 9 limits the number of bogus ICMP response errors logs. The runtime status of the net.ipv4.icmp_ignore_bogus_error_responses
    kernel parameter can be queried by running the following command: $ sysctl net.ipv4.icmp_ignore_bogus_error_responses
    net.ipv4.icmp_ignore_bogus_error_responses = 1 If "net.ipv4.icmp_ignore_bogus_error_responses" is not set to "1", this
    is a finding.'
