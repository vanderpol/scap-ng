              \ is Not Applicable.\n\nVerify that OL 9 prevents unauthorized disclosure or modification of all information\
              \ requiring at rest protection by using disk encryption.\n\nDetermine the partition layout for the system with\
              \ the following command: \n \n$ sudo fdisk -l \n(..) \nDisk /dev/vda: 15 GiB, 16106127360 bytes, 31457280 sectors\
              \ \nUnits: sectors of 1 * 512 = 512 bytes \nSector size (logical/physical): 512 bytes / 512 bytes \nI/O size\
              \ (minimum/optimal): 512 bytes / 512 bytes \nDisklabel type: gpt \nDisk identifier: 83298450-B4E3-4B19-A9E4-7DF147A5FEFB\
              \ \n \nDevice       Start      End  Sectors Size Type \n/dev/vda1     2048     4095     2048   1M BIOS boot\
              \ \n/dev/vda2     4096  2101247  2097152   1G Linux filesystem \n/dev/vda3  2101248 31455231 29353984  14G Linux\
              \ filesystem \n(...) \n \nVerify that the system partitions are all encrypted with the following command: \n\
              \ \n$ sudo more /etc/crypttab \n \nEvery persistent disk partition present must have an entry in the file. \n\
              \ \nIf any partitions other than the boot partition or pseudo file systems (such as /proc or /sys) are not listed,\
              \ this is a finding."
