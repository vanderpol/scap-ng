rule:
  id: xccdf_mil.disa.stig_rule_SV-271788r1155305_rule
  title: OL 9 library directories must have mode 755 or less permissive.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
