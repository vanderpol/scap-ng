scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 is in FIPS mode with the following command: $ fips-mode-setup --check FIPS mode is enabled. If
    FIPS mode is not enabled, this is a finding.'
  cluster_id: null
  conflicts: []
  description: '<VulnDiscussion>Use of weak or untested encryption algorithms undermines the purposes of using encryption
    to protect data. The operating system must implement cryptographic modules adhering to the higher standards approved by
    the federal government since this provides assurance they have been tested and validated. This includes NIST FIPS-validated
    cryptography for the following: Provisioning digital signatures, generating cryptographic hashes, and to protect data
    requiring data-at-rest protections in accordance with applicable federal laws, Executive Orders, directives, policies,
    regulations, and standards. Satisfies: SRG-OS-000033-GPOS-00014, SRG-OS-000125-GPOS-00065, SRG-OS-000396-GPOS-00176, SRG-OS-000423-GPOS-00187,
    SRG-OS-000478-GPOS-00223</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
