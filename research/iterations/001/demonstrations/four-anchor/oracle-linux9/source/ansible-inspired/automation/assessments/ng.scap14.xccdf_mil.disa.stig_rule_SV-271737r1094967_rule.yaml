        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:59501
      exports: []
      inline_content: 'Verify that OL 9 disables virtual system calls. Check the current GRUB 2 configuration with the following
        command: $ sudo grubby --info=ALL | grep args | grep -v ''vsyscall=none'' If any output is returned, this is a finding.
        Check that virtual system calls are disabled by default to persist in kernel updates with the following command: $
        grep vsyscall /etc/default/grub GRUB_CMDLINE_LINUX="vsyscall=none" If "vsyscall" is not set to "none", is missing
        or commented out, and is not documented with the information system security officer (ISSO) as an operational requirement,
        this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:59501
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify that OL 9 disables virtual system calls. \n\nCheck the current GRUB 2 configuration with the following\
            \ command:\n\n$ sudo grubby --info=ALL | grep args | grep -v 'vsyscall=none'\n\nIf any output is returned, this\
            \ is a finding.\n\nCheck that virtual system calls are disabled by default to persist in kernel updates with the\
            \ following command: \n\n$ grep vsyscall /etc/default/grub\nGRUB_CMDLINE_LINUX=\"vsyscall=none\"\n\nIf \"vsyscall\"\
            \ is not set to \"none\", is missing or commented out, and is not documented with the information system security\
            \ officer (ISSO) as an operational requirement, this is a finding."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
