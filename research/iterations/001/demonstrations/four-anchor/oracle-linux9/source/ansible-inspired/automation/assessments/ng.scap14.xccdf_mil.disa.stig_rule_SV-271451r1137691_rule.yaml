        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:4101
      exports: []
      inline_content: 'Verify that OL 9 requires a unique username for the grub superuser account. Verify the boot loader
        superuser account has been set with the following command: $ sudo grep -A1 "superusers" /etc/grub2.cfg set superusers="<superusers-account>"
        export superusers password_pbkdf2 root ${GRUB2_PASSWORD} The <superusers-account> is the actual account name different
        from common names like root, admin, or administrator. If superusers contains easily guessable usernames, this is a
        finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:4101
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify that OL 9 requires a unique username for the grub superuser account.\n\nVerify the boot loader superuser\
            \ account has been set with the following command:\n\n$ sudo grep -A1 \"superusers\" /etc/grub2.cfg \n    set\
            \ superusers=\"<superusers-account>\"\n    export superusers\n    password_pbkdf2 root ${GRUB2_PASSWORD}\n \n\
            The <superusers-account> is the actual account name different from common names like root, admin, or administrator.\n\
            \nIf superusers contains easily guessable usernames, this is a finding."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
