scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 kdump service is disabled or masked in system boot configuration with the following command: $
    systemctl is-enabled kdump disabled (or masked) Verify that the kdump service is not active (i.e., not running) through
    current runtime configuration with the following command: $ systemctl is-active kdump inactive Verify that the kdump service
    is masked with the following command: $ systemctl show kdump | grep "LoadState\|UnitFileState" LoadState=masked UnitFileState=masked
    If the "kdump" service is loaded or active, and is not masked, this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271733r1092598_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271733r1092598_rule
    assessment_version: 1
    selector: automated
    source_selector: automated
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-271733r1092598_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>Kernel core dumps may contain the full contents of system memory at the time of the crash.
    Kernel core dumps consume a considerable amount of disk space and may result in denial of service by exhausting the available
    space on the target file system partition. Unless the system is used for kernel development or testing, there is little
    need to run the kdump service.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
