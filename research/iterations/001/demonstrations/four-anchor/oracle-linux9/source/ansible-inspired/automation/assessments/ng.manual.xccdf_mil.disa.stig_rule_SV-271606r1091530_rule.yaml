      exports: []
      inline_content: 'Verify that OL 9 maps the authenticated identity to the certificate of the user or group to the corresponding
        user or group in the "sssd.conf" file with the following command: $ sudo cat /etc/sssd/sssd.conf [certmap/testing.test/rule_name]
        matchrule =<SAN>.*EDIPI@mil maprule = (userCertificate;binary={cert!bin}) domains = testing.test If the certmap section
        does not exist, ask the system administrator (SA) to indicate how certificates are mapped to accounts. If there is
        no evidence of certificate mapping, this is a finding.'
