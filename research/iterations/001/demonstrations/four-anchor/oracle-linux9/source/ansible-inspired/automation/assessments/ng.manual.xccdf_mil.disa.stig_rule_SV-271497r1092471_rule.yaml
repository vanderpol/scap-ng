            $ sudo grep aide /etc/crontab /var/spool/cron/root

            /etc/crontab: 30 04 * * * root usr/sbin/aide

            /var/spool/cron/root: 30 04 * * * root usr/sbin/aide


            $ more /etc/cron.daily/aide

            #!/bin/bash

            /usr/sbin/aide --check | /bin/mail -s "$HOSTNAME - Daily aide integrity check run" root@sysname.mil


            If the file integrity application does not exist, or a script file controlling the execution of the file integrity
            application does not exist, or the file integrity application does not notify designated personnel of changes,
            this is a finding.'
