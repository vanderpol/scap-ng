scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 logs SSH connection attempts and failures to the server. Check what the SSH daemon''s "LogLevel"
    option is set to with the following command: $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r''
    | tr ''\n'' '' '' | xargs sudo grep -iH ''^\s*loglevel'' LogLevel VERBOSE If a value of "VERBOSE" is not returned, the
    line is commented out, or is missing, this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271703r1091821_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271703r1091821_rule
    assessment_version: 1
    selector: automated
    source_selector: automated
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-271703r1091821_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>SSH provides several logging levels with varying amounts of verbosity. "DEBUG" is specifically
    not recommended other than strictly for debugging SSH communications since it provides so much data that it is difficult
    to identify important security information. "INFO" or "VERBOSE" level is the basic level that only records login activity
    of SSH users. In many situations, such as Incident Response, it is important to determine when a particular user was active
    on a system. The logout record can eliminate those users who disconnected, which helps narrow the field.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
  effective_platform_refs:
