scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify OL 9 systemwide shared library directories have mode "755" or less permissive with the following command:
    $ sudo find -L /lib /lib64 /usr/lib /usr/lib64 -perm /022 -type d -exec ls -l {} \; If any systemwide shared library directory
    is found to be group-writable or world-writable, this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271788r1155305_rule
    assessment_version: 1
    selector: default
    source_selector: ''
