authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 is configured to mount /var/log/audit with the noexec option. Verify "/var/log/audit" is mounted
    with the "noexec" option: $ mount | grep /var/log/audit /dev/mapper/ol-var-log-audit on /var/log/audit type xfs (rw,nodev,nosuid,noexec,seclabel)
    If the "/var/log/audit" file system is mounted without the "noexec" option, this is a finding.'
  checks:
