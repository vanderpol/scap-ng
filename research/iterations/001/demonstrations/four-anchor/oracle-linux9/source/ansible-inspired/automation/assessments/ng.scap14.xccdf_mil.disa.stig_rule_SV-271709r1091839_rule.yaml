        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:54101
      exports: []
      inline_content: 'Verify that OL 9 is configured so that all network connections associated with SSH traffic terminate
        after becoming unresponsive. Verify that the "ClientAliveCountMax" is set to "1" by performing the following command:
        $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo grep
        -iH ''^\s*clientalivecountmax'' ClientAliveCountMax 1 If "ClientAliveCountMax" does not exist, is not set to a value
        of "1" in "/etc/ssh/sshd_config", or is commented out, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
