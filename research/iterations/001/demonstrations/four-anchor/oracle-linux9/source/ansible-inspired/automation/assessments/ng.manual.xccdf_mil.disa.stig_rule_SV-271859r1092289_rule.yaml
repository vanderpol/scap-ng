        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:83301
      exports: []
      inline_content: 'Note: For systems that do not have physical wireless network radios, this requirement is Not Applicable.
        Verify that OL 9 allows no wireless interfaces to be configured on the system with the following command: $ nmcli
        device status DEVICE TYPE STATE CONNECTION virbr0 bridge connected virbr0 wlp7s0 wifi connected wifiSSID enp6s0 ethernet
        disconnected -- p2p-dev-wlp7s0 wifi-p2p disconnected -- lo loopback unmanaged -- virbr0-nic tun unmanaged -- If a
        wireless interface is configured and has not been documented and approved by the information system security officer
        (ISSO), this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:83301
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Note: For systems that do not have physical wireless network radios, this requirement is Not Applicable.


            Verify that OL 9 allows no wireless interfaces to be configured on the system with the following command:


            $ nmcli device status

            DEVICE           TYPE       STATE         CONNECTION

            virbr0           bridge     connected     virbr0

            wlp7s0           wifi       connected     wifiSSID

            enp6s0           ethernet   disconnected  --

            p2p-dev-wlp7s0   wifi-p2p   disconnected  --

            lo               loopback   unmanaged     --

            virbr0-nic       tun        unmanaged     --


            If a wireless interface is configured and has not been documented and approved by the information system security
            officer (ISSO), this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
