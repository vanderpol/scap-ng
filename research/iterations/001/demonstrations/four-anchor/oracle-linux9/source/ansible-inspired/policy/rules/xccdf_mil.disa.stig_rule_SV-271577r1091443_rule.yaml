scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 is configured to enable auditing of processes that start prior to the audit daemon. Check that
    the current GRUB 2 configuration enables auditing: $ sudo grubby --info=ALL | grep audit args="ro crashkernel=auto resume=/dev/mapper/ol-swap
    rd.lvm.lv=ol/root rd.lvm.lv=ol/swap rhgb quiet fips=1 audit=1 audit_backlog_limit=8192 pti=on If "audit" is not set to
    "1" or is missing, this is a finding. Check that auditing is enabled by default to persist through kernel updates: $ sudo
    grep audit /etc/default/grub GRUB_CMDLINE_LINUX="audit=1" If "audit" is not set to "1", is missing, or is commented out,
    this is a finding.'
  cluster_id: null
  conflicts: []
  description: '<VulnDiscussion>Without the capability to generate audit records, it would be difficult to establish, correlate,
    and investigate the events relating to an incident or identify those responsible for one. If auditing is enabled late
    in the startup process, the actions of some startup processes may not be audited. Some audit systems also maintain state
    information only available if auditing is enabled before a given process is created. Satisfies: SRG-OS-000037-GPOS-00015,
    SRG-OS-000042-GPOS-00020, SRG-OS-000062-GPOS-00031, SRG-OS-000392-GPOS-00172, SRG-OS-000462-GPOS-00206, SRG-OS-000471-GPOS-00215,
    SRG-OS-000473-GPOS-00218, SRG-OS-000254-GPOS-00095</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
  discussion: null
  effective_platform_refs:
  - cpe:/o:oracle:linux:9:-
  effective_platforms:
  - kind: cpe_name
    name: cpe:/o:oracle:linux:9:-
    ref: cpe:/o:oracle:linux:9:-
  extends: null
  fix: 'Enable auditing of processes that start prior to the audit daemon with the following command: $ sudo grubby --update-kernel=ALL
    --args="audit=1" Add or modify the following line in "/etc/default/grub" to ensure the configuration survives kernel updates:
    GRUB_CMDLINE_LINUX="audit=1"'
