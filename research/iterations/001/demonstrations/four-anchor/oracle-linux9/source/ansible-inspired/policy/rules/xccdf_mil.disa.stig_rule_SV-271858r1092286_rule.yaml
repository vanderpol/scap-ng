scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 nftables is configured to allow rate limits on any connection to the system with the following
    command: $ sudo grep -i firewallbackend /etc/firewalld/firewalld.conf # FirewallBackend FirewallBackend=nftables If the
    "nftables" is not set as the "FirewallBackend" default, this is a finding.'
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>DoS is a condition when a resource is not available for legitimate users. When this occurs,
    the organization either cannot accomplish its mission or must operate at degraded capacity. This requirement addresses
    the configuration of OL 9 to mitigate the impact of DoS attacks that have occurred or are ongoing on system availability.
    For each system, known and potential DoS attacks must be identified and solutions for each type implemented. A variety
    of technologies exists to limit or, in some cases, eliminate the effects of DoS attacks (e.g., limiting processes or establishing
    memory partitions). Employing increased capacity and bandwidth, combined with service redundancy, may reduce the susceptibility
    to some DoS attacks.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
  effective_platform_refs:
  - cpe:/o:oracle:linux:9:-
  effective_platforms:
  - kind: cpe_name
    name: cpe:/o:oracle:linux:9:-
    ref: cpe:/o:oracle:linux:9:-
  extends: null
  fix: 'Configure "nftables" to be the default "firewallbackend" for "firewalld" by adding or editing the following line in
    "/etc/firewalld/firewalld.conf": FirewallBackend=nftables Establish rate-limiting rules based on organization-defined
    types of DoS attacks on impacted network interfaces.'
