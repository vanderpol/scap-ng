authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 disables the ability to load the CAN kernel module with the following command: $ grep -r can /etc/modprobe.conf
    /etc/modprobe.d/* install can /bin/false blacklist can If the command does not return any output, or the line is commented
    out, and use of CAN is not documented with the information system security officer (ISSO) as an operational requirement,
    this is a finding.'
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>Disabling CAN protects the system against exploitation of any flaws in its implementation.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
