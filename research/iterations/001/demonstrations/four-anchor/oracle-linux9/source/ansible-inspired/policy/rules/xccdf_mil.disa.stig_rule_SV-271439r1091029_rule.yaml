    name: cpe:/o:oracle:linux:9:-
    ref: cpe:/o:oracle:linux:9:-
  extends: null
  fix: 'Install OL 9 security patches and updates at the organizationally defined frequency. If system updates are installed
    via a centralized repository that is configured on the system, all updates can be installed with the following command:
    $ sudo dnf update -y'
