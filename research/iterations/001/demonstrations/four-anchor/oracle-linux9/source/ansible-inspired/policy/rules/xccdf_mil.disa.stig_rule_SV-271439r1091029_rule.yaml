scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 security patches and updates are installed and up to date. Updates are required to be applied with
    a frequency determined by organizational policy. Obtain the list of available package security updates from Oracle. The
    URL for updates is https://linux.oracle.com/errata/. It is important to note that updates provided by Oracle may not be
    present on the system if the underlying packages are not installed. Check that the available package security updates
    have been installed on the system with the following command: $ dnf history list | more ID | Command line | Date and time
    | Action(s) | Altered ------------------------------------------------------------------------------- 70 | install aide
    | 2023-03-05 10:58 | Install | 1 69 | update -y | 2023-03-04 14:34 | Update | 18 EE 68 | install vlc | 2023-02-21 17:12
    | Install | 21 67 | update -y | 2023-02-21 17:04 | Update | 7 EE Typical update frequency may be overridden by Information
    Assurance Vulnerability Alert (IAVA) notifications from CYBERCOM. If the system is in noncompliance with the organizational
    patching policy, this is a finding.'
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>Installing software updates is a fundamental mitigation against the exploitation of publicly
    known vulnerabilities. If the most recent security patches and updates are not installed, unauthorized users may take
    advantage of weaknesses in the unpatched software. The lack of prompt attention to patching could result in a system compromise.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
