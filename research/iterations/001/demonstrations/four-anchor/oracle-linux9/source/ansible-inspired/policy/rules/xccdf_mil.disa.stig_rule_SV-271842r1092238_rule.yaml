scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 ensures that account lockouts persist. Verify the "/etc/security/faillock.conf" file is configured
    use a nondefault faillock directory to ensure contents persist after reboot with the following command: $ grep ''dir =''
    /etc/security/faillock.conf dir = /var/log/faillock If the "dir" option is not set to a nondefault documented tally log
    directory, is missing or commented out, this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271842r1092238_rule
    assessment_version: 1
    selector: default
    source_selector: ''
