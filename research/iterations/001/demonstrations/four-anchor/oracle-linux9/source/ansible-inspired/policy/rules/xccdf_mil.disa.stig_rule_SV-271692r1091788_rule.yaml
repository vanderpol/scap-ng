scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'This requirement assumes the use of the OL 9 default graphical user interface—the GNOME desktop environment. If
    the system does not have any graphical user interface installed, this requirement is Not Applicable. Verify that OL 9
    effective dconf policy matches the policy keyfiles. Check the last modification time of the local databases, comparing
    it to the last modification time of the related keyfiles. The following command will check every dconf database and compare
    its modification time to the related system keyfiles: $ function dconf_needs_update { for db in $(find /etc/dconf/db -maxdepth
    1 -type f); do db_mtime=$(stat -c %Y "$db"); keyfile_mtime=$(stat -c %Y "$db".d/* | sort -n | tail -1); if [ -n "$db_mtime"
    ] && [ -n "$keyfile_mtime" ] && [ "$db_mtime" -lt "$keyfile_mtime" ]; then echo "$db needs update"; return 1; fi; done;
    }; dconf_needs_update If the command has any output, then a dconf database needs to be updated, and this is a finding.'
  checks:
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-271692r1091788_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-271692r1091788_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>Unlike text-based keyfiles, the binary database is impossible to check through most automated
    and all manual means; therefore, to evaluate dconf configuration, both have to be true at the same time - configuration
    files have to be compliant, and the database needs to be more recent than those keyfiles, which gives confidence that
    it reflects them.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
