        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Note: If postfix is not installed, this requirement is Not Applicable.\n\nVerify that OL 9 is configured\
            \ to prevent unrestricted mail relaying with the following command:\n\n$ postconf -n smtpd_client_restrictions\
            \ \nsmtpd_client_restrictions = permit_mynetworks,reject \n\nIf the \"smtpd_client_restrictions\" parameter contains\
            \ any entries other than \"permit_mynetworks\" and \"reject\", and the additional entries have not been documented\
