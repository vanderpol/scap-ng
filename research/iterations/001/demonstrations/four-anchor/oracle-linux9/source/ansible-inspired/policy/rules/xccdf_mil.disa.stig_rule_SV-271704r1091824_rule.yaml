  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>GSSAPI authentication is used to provide additional authentication mechanisms to applications.
    Allowing GSSAPI authentication through SSH exposes the system's GSSAPI to remote hosts, increasing the attack surface
    of the system.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
