rule:
  abstract: false
  check: 'Verify that OL 9 configures group ownership of the "/etc/shadow" file with the following command: $ stat -c "%G
    %n" /etc/shadow root /etc/shadow If "/etc/shadow" file does not have a group owner of "root", this is a finding.'
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>The "/etc/shadow" file stores password hashes. Protection of this file is critical for system
