authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 is configured to mask the debug-shell systemd service with the following command: $ systemctl status
    debug-shell.service debug-shell.service Loaded: masked (Reason: Unit debug-shell.service is masked.) Active: inactive
    (dead) If the "debug-shell.service" is loaded and not masked, this is a finding.'
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>The debug-shell requires no authentication and provides root privileges to anyone who has physical
    access to the machine. While this feature is disabled by default, masking it adds an additional layer of assurance that
    it will not be enabled via a dependency in systemd. This also prevents attackers with physical access from trivially bypassing
    security on the machine through valid troubleshooting configurations and gaining root access when the system is rebooted.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
