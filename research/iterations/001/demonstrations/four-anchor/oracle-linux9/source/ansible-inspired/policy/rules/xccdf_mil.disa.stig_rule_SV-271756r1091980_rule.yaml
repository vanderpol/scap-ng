scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Note: If there is a documented and approved reason for not having data-at-rest encryption, this requirement is Not
    Applicable. Verify that OL 9 prevents unauthorized disclosure or modification of all information requiring at-rest protection
    by using disk encryption. Verify all system partitions are encrypted with the following command: $ sudo blkid /dev/map
    per/ol-root: UUID="67b7d7fe-de60-6fd0-befb-e6748cf97743" TYPE="crypto_LUKS" Every persistent disk partition present must
    be of type "crypto_LUKS". If any partitions other than the boot partition or pseudo file systems (such as /proc or /sys)
    or temporary file systems (that are tmpfs) are not type "crypto_LUKS", ask the administrator to indicate how the partitions
    are encrypted. If there is no evidence that these partitions are encrypted, this is a finding.'
  checks:
