scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 does not have unauthorized IP tunnels configured. Determine if the IPsec service is active with
    the following command: $ systemctl status ipsec ipsec.service - Internet Key Exchange (IKE) Protocol Daemon for IPsec
    Loaded: loaded (/usr/lib/systemd/system/ipsec.service; disabled) Active: inactive (dead) If the IPsec service is active,
    check for configured IPsec connections ("conn"), with the following command: $ grep -rni conn /etc/ipsec.conf /etc/ipsec.d/
    Verify any returned results are documented with the ISSO. If the IPsec tunnels are active and not approved, this is a
    finding.'
  checks:
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-271863r1092639_rule
    assessment_version: 1
    selector: default
