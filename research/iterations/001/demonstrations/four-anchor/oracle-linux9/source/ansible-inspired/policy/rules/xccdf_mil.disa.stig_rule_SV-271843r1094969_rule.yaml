  effective_platforms:
  - kind: cpe_name
    name: cpe:/o:oracle:linux:9:-
    ref: cpe:/o:oracle:linux:9:-
  extends: null
  fix: 'Configure the operating system to expire temporary accounts after 72 hours with the following command: $ sudo chage
    -E $(date -d +3days +%Y-%m-%d) <temporary_account_name>'
