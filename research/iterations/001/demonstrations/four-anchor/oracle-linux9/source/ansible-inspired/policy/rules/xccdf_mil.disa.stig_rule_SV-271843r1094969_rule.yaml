scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 configures temporary accounts to be provisioned with an expiration date of 72 hours. For every
    existing temporary account, run the following command to obtain its account expiration information: $ chage -l <temporary_account_name>
    | grep -i "account expires" Verify each of these accounts has an expiration date set within 72 hours. If any temporary
    accounts have no expiration date set or do not expire within 72 hours, this is a finding.'
  checks:
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-271843r1094969_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-271843r1094969_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: '<VulnDiscussion>Temporary accounts are privileged or nonprivileged accounts that are established during pressing
    circumstances, such as new software or hardware configuration or an incident response, where the need for prompt account
    activation requires bypassing normal account authorization procedures. If any inactive temporary accounts are left enabled
    on the system and are not either manually removed or automatically expired within 72 hours, the security posture of the
    system will be degraded and exposed to exploitation by unauthorized users or insider threat actors. Temporary accounts
    are different from emergency accounts. Emergency accounts, also known as "last resort" or "break glass" accounts, are
    local logon accounts enabled on the system for emergency use by authorized system administrators to manage a system when
    standard logon methods are failing or not available. Emergency accounts are not subject to manual removal or scheduled
    expiration requirements. The automatic expiration of temporary accounts may be extended as needed by the circumstances,
    but it must not be extended indefinitely. A documented permanent account should be established for privileged users who
    need long-term maintenance accounts. Satisfies: SRG-OS-000123-GPOS-00064, SRG-OS-000002-GPOS-00002</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
  discussion: null
