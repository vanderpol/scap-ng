        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:50501
      exports: []
      inline_content: 'This requirement assumes the use of the OL 9 default graphical user interface—the GNOME desktop environment.
        If the system does not have any graphical user interface installed, this requirement is Not Applicable. Verify that
        OL 9 enables a user''s session lock until that user reestablishes access using established identification and authentication
        procedures with the following command: $ grep -R removal-action /etc/dconf/db/* /etc/dconf/db/distro.d/20-authselect:removal-action=''lock-screen''
        If the "removal-action=''lock-screen''" setting is missing or commented out from the dconf database files, this is
        a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
