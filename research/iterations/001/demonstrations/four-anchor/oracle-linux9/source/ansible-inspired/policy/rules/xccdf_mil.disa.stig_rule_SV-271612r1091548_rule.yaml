scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 is configured to limit the "pwquality" retry option to "3". Check for the use of the "pwquality"
    retry option in the system-auth file with the following command: $ grep pam_pwquality /etc/pam.d/system-auth password
    required pam_pwquality.so retry=3 If the value of "retry" is set to "0" or greater than "3", or is missing, this is a
    finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271612r1091548_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271612r1091548_rule
    assessment_version: 1
    selector: automated
    source_selector: automated
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-271612r1091548_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: '<VulnDiscussion>Use of a complex password helps to increase the time and resources required to compromise
    the password. Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts
    at guessing and brute-force attacks. "pwquality" enforces complex password construction configuration and has the ability
    to limit brute-force attacks on the system. OL 9 uses "pwquality" as a mechanism to enforce password complexity. This
    is set in both: /etc/pam.d/password-auth /etc/pam.d/system-auth By limiting the number of attempts to meet the pwquality
    module complexity requirements before returning with an error, the system will audit abnormal attempts at password changes.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
