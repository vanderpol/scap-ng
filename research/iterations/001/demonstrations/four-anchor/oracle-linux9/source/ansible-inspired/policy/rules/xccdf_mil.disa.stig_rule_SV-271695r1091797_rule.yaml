scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 "umask" setting is configured correctly in the "/etc/profile" file with the following command:
    Note: If the value of the "umask" parameter is set to "000" "/etc/profile" file, the severity of this requirement is raised
    to a CAT I. $ grep umask /etc/profile umask 077 If the value for the "umask" parameter is not "077", or the "umask" parameter
    is missing or is commented out, this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271695r1091797_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271695r1091797_rule
    assessment_version: 1
