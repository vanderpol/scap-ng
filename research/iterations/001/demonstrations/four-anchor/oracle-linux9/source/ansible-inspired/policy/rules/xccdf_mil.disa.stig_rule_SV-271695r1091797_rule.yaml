  effective_platforms:
  - kind: cpe_name
    name: cpe:/o:oracle:linux:9:-
    ref: cpe:/o:oracle:linux:9:-
  extends: null
  fix: 'Configure OL 9 to define default permissions for all authenticated users in such a way that the user can only read
    and modify their own files. Add or edit the lines for the "umask" parameter in the "/etc/profile" file to "077": umask
    077'
