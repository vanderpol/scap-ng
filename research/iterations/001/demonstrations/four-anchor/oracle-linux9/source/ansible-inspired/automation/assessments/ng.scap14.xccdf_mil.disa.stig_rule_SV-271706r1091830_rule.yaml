        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify that OL 9 remote access using SSH prevents logging on with a blank password with the following command:


            $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo grep
            -iH ''^\s*permitemptypasswords''

            PermitEmptyPasswords no


            If the "PermitEmptyPasswords" keyword is set to "yes", is missing, or is commented out, this is a finding.'
