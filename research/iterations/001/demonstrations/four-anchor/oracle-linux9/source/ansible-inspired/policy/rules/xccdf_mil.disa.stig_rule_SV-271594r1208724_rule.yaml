scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify OL 9 is configured to audit the execution of the "umount" command with the following command: $ sudo auditctl
    -l | grep umount -a always,exit -F arch=b32 -S umount -F auid>=1000 -F auid!=-1 -F key=privileged-umount If the command
    does not return an audit rule for "umount" or any of the lines returned are commented out, this is a finding.'
  cluster_id: null
  conflicts: []
  description: '<VulnDiscussion>The changing of file permissions could indicate that a user is attempting to gain access to
    information that would otherwise be disallowed. Auditing DAC modifications can facilitate the identification of patterns
    of abuse among both authorized and unauthorized users. Satisfies: SRG-OS-000037-GPOS-00015, SRG-OS-000062-GPOS-00031,
    SRG-OS-000392-GPOS-00172, SRG-OS-000462-GPOS-00206, SRG-OS-000471-GPOS-00215</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
  discussion: null
  effective_platform_refs:
  - cpe:/o:oracle:linux:9:-
  effective_platforms:
  - kind: cpe_name
    name: cpe:/o:oracle:linux:9:-
    ref: cpe:/o:oracle:linux:9:-
  extends: null
  fix: 'Configure the audit system to generate an audit event for any successful/unsuccessful use of the umount system call
    by adding or updating the following rules in "/etc/audit/audit.rules" and adding the following rules to "/etc/audit/rules.d/perm_mod.rules"
    or updating the existing rules in files in the "/etc/audit/rules.d/" directory: -a always,exit -F arch=b32 -S umount -F
    auid>=1000 -F auid!=unset -k perm_mod -a always,exit -F arch=b64 -S umount -F auid>=1000 -F auid!=unset -k perm_mod The
    audit daemon must be restarted for the changes to take effect. Restart auditd: $ sudo service auditd restart'
