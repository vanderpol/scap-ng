prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 is configured to audit the execution of the setfacl command with the following command: $ sudo
    auditctl -l | grep setfacl -a always,exit -F path=/usr/bin/setfacl -F perm=x -F auid>=1000 -F auid!=unset -k perm_mod
    If the command does not return a line or the line is commented out, this is a finding.'
  cluster_id: null
  conflicts: []
  description: '<VulnDiscussion>Without generating audit records specific to the security and mission needs of the organization,
    it would be difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible
    for one. Audit records can be generated from various components within the information system (e.g., module or policy
    filter). When a user logs on, the auid is set to the uid of the account being authenticated. Daemons are not user sessions
    and have the loginuid set to -1. The auid representation is an unsigned 32-bit integer, which equals 4294967295. The audit
    system interprets -1, 4294967295, and "unset" in the same way. The system call rules are loaded into a matching engine
    that intercepts each system call made by all programs on the system. Therefore, it is very important to use system call
    rules only when absolutely necessary since these affect performance. The more rules, the bigger the performance hit. The
    performance can be helped, however, by combining system calls into one rule whenever possible. Satisfies: SRG-OS-000037-GPOS-00015,
    SRG-OS-000042-GPOS-00020, SRG-OS-000062-GPOS-00031, SRG-OS-000392-GPOS-00172, SRG-OS-000462-GPOS-00206, SRG-OS-000471-GPOS-00215</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
  discussion: null
  effective_platform_refs:
  - cpe:/o:oracle:linux:9:-
  effective_platforms:
  - kind: cpe_name
    name: cpe:/o:oracle:linux:9:-
    ref: cpe:/o:oracle:linux:9:-
  extends: null
  fix: 'Configure OL 9 to generate audit records upon successful/unsuccessful attempts to use the setfacl command by adding
    or updating the following rule in "/etc/audit/rules.d/audit.rules": -a always,exit -F path=/usr/bin/setfacl -F perm=x
    -F auid>=1000 -F auid!=unset -k perm_mod The audit daemon must be restarted for the changes to take effect. Restart auditd:
    $ sudo service auditd restart'
