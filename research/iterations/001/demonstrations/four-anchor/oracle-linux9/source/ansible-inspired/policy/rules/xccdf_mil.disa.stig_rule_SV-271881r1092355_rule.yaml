scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Note: If IPv6 is disabled on the system, this requirement is Not Applicable. Verify that OL 9 does not accept router
    advertisements on all IPv6 interfaces by default unless the system is a router. Determine if router advertisements are
    not accepted by default by using the following command: $ sysctl net.ipv6.conf.default.accept_ra net.ipv6.conf.default.accept_ra
    = 0 If the "accept_ra" value is not "0" and is not documented with the information system security officer (ISSO) as an
    operational requirement, this is a finding.'
