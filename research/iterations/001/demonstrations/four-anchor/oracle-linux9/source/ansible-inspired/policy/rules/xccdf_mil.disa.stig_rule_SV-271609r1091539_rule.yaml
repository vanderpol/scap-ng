scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Note: If smart card authentication is not being used on the system, this requirement is Not Applicable. Verify that
    OL 9''s System Security Services Daemon (SSSD) prohibits the use of cached authentications after one day. Check that SSSD
    allows cached authentications with the following command: $ sudo grep cache_credentials /etc/sssd/sssd.conf cache_credentials
    = true If "cache_credentials" is set to "false" or missing from the configuration file, this is not a finding and no further
    checks are required. If "cache_credentials" is set to "true", check that SSSD prohibits the use of cached authentications
    after one day with the following command: $ sudo grep offline_credentials_expiration /etc/sssd/sssd.conf offline_credentials_expiration
    = 1 If "offline_credentials_expiration" is not set to a value of "1", this is a finding.'
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>If cached authentication information is out-of-date, the validity of the authentication information
    may be questionable.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
