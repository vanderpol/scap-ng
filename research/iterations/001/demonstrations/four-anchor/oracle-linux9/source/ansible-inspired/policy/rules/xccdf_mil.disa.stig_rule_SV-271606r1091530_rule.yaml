    name: cpe:/o:oracle:linux:9:-
    ref: cpe:/o:oracle:linux:9:-
  extends: null
  fix: 'Configure OL 9 to map the authenticated identity to the user or group account by adding or modifying the certmap section
    of the "/etc/sssd/sssd.conf" file based on the following example: [certmap/testing.test/rule_name] matchrule = .*EDIPI@mil
    maprule = (userCertificate;binary={cert!bin}) dmains = testing.test The "sssd" service must be restarted for the changes
    to take effect. To restart the "sssd" service, run the following command: $ sudo systemctl restart sssd.service'
