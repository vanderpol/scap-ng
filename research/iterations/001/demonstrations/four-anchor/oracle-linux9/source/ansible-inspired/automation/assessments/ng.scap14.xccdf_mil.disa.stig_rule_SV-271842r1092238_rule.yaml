        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:79901
      exports: []
      inline_content: 'Verify that OL 9 ensures that account lockouts persist. Verify the "/etc/security/faillock.conf" file
        is configured use a nondefault faillock directory to ensure contents persist after reboot with the following command:
        $ grep ''dir ='' /etc/security/faillock.conf dir = /var/log/faillock If the "dir" option is not set to a nondefault
        documented tally log directory, is missing or commented out, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:79901
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify that OL 9 ensures that account lockouts persist.


            Verify the "/etc/security/faillock.conf" file is configured use a nondefault faillock directory to ensure contents
            persist after reboot with the following command:


            $ grep ''dir ='' /etc/security/faillock.conf

            dir = /var/log/faillock


            If the "dir" option is not set to a nondefault documented tally log directory, is missing or commented out, this
            is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
