scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 prevents the use of dictionary words for passwords with the following command: $ grep dictcheck
    /etc/security/pwquality.conf /etc/pwquality.conf.d/*.conf /etc/security/pwquality.conf:dictcheck=1 If "dictcheck" does
    not have a value other than "0", or is commented out, this is a finding.'
  checks:
