scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 does not accept IPv4 source-routed packets by default. Check the value of the accept source route
    variable with the following command: $ sysctl net.ipv4.conf.default.accept_source_route net.ipv4.conf.default.accept_source_route
    = 0 If the returned line does not have a value of "0", a line is not returned, or the line is commented out, this is a
    finding.'
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>Source-routed packets allow the source of the packet to suggest routers forward the packet
    along a different path than configured on the router, which can be used to bypass network security measures. Accepting
    source-routed packets in the IPv4 protocol has few legitimate uses. It must be disabled unless it is absolutely required,
    such as when IPv4 forwarding is enabled and the system is legitimately functioning as a router.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
  effective_platform_refs:
  - cpe:/o:oracle:linux:9:-
  effective_platforms:
  - kind: cpe_name
    name: cpe:/o:oracle:linux:9:-
    ref: cpe:/o:oracle:linux:9:-
  extends: null
  fix: 'Configure OL 9 to not forward IPv4 source-routed packets by default. Add or edit the following line in a single system
    configuration file in the "/etc/sysctl.d/" directory: net.ipv4.conf.default.accept_source_route = 0 Load settings from
    all system configuration files with the following command: $ sudo sysctl --system'
