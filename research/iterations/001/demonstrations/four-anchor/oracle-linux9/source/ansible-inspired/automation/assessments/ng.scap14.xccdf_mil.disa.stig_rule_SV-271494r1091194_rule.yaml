        metadata:
          children:
          - name: title
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: OL09-00-000286 - OL 9 must use the SSSD package for multifactor authentication services.
          - attributes:
              family: unix
            children:
            - name: platform
              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Oracle Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "Using an authentication device, such as a CAC or token that is separate from the information system, ensures\
              \ that even if the information system is compromised, that compromise will not affect credentials stored on\
              \ the authentication device. \n\t \n\tMultifactor solutions that require devices separate from information systems\
              \ gaining access include, for example, hardware tokens providing time-based or challenge-response authenticators\
              \ and smart cards such as the U.S. Government Personal Identity Verification card and the DOD Common Access\
              \ Card. \n\t \n\tA privileged account is defined as an information system account with authorizations of a privileged\
              \ user. \n\t \n\tWithout the use of multifactor authentication, the ease of access to privileged functions is\
              \ greatly increased. \n\t \n\tMultifactor authentication requires using two or more factors to achieve authentication.\
              \ \n\t \n\tFactors include:  \n\t1) Something a user knows (e.g., password/PIN); \n\t2) Something a user has\
              \ (e.g., cryptographic identification device, token); and \n\t3) Something a user is (e.g., biometric). \n\t\
              \ \n\tA privileged account is defined as an information system account with authorizations of a privileged user.\
              \ \n\t \n\tNetwork access is defined as access to an information system by a user (or a process acting on behalf\
              \ of a user) communicating through a network (e.g., local area network, wide area network, or the internet).\
              \ \n\t \n\tThe DOD common access card (CAC) with DOD-approved PKI is an example of multifactor authentication.\n\
              \n\tSatisfies: SRG-OS-000705-GPOS-00150, SRG-OS-000105-GPOS-00052, SRG-OS-000106-GPOS-00053, SRG-OS-000107-GPOS-00054,\
              \ SRG-OS-000108-GPOS-00055, SRG-OS-000375-GPOS-00161"
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
        source_definition_id: oval:mil.disa.stig.ol9os:def:271494
        version: '1'
