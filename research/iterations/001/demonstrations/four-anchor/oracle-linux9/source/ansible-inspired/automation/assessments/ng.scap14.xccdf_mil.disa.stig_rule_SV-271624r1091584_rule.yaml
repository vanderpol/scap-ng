              namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
              text: Oracle Linux 9
            name: affected
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "Unapproved mechanisms that are used for authentication to the cryptographic module are not verified and\
              \ therefore, cannot be relied upon to provide confidentiality or integrity, and DOD data may be compromised.\n\
              \n\tOL 9 systems using encryption are required to use FIPS-compliant mechanisms for authenticating to cryptographic\
              \ modules. \n\n\tFIPS 140-3 is the current standard for validating that mechanisms used to access cryptographic\
              \ modules use authentication that meets DOD requirements. This allows for Security Levels 1, 2, 3, or 4 for\
              \ use on a general-purpose computing system."
          name: metadata
          namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
