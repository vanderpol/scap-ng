    source_selector: automated
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-271615r1091557_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>Use of a complex password helps to increase the time and resources required to compromise the
    password. Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing
    and brute-force attacks. Password complexity is one factor of several that determines how long it takes to crack a password.
    The more complex the password, the greater the number of possible combinations that need to be tested before the password
    is compromised. Requiring a minimum number of lowercase characters makes password guessing attacks more difficult by ensuring
    a larger search space.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
