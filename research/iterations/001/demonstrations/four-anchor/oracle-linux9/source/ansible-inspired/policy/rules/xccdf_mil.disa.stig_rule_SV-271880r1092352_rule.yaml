scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Note: If IPv6 is disabled on the system, this requirement is Not Applicable. Verify that OL 9 is not performing
    IPv6 packet forwarding, unless the system is a router. Check that IPv6 forwarding is disabled using the following commands:
    $ sysctl net.ipv6.conf.all.forwarding net.ipv6.conf.all.forwarding = 0 If the IPv6 forwarding value is not "0" and is
    not documented with the information system security officer (ISSO) as an operational requirement, this is a finding.'
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>IP forwarding permits the kernel to forward packets from one network interface to another.
    The ability to forward packets between two networks is only appropriate for systems acting as routers.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
