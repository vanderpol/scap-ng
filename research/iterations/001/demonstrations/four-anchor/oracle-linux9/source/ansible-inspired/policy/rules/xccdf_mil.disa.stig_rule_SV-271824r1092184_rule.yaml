    name: cpe:/o:oracle:linux:9:-
    ref: cpe:/o:oracle:linux:9:-
  extends: null
  fix: 'Configure the audit tools to be group-owned by "root" by running the following command: $ sudo chgrp root [audit_tool]
    Replace "[audit_tool]" with each audit tool not group-owned by "root".'
