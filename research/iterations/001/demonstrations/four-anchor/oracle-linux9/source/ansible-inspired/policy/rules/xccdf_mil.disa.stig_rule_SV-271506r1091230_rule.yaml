  check: 'Verify that OL 9 fapolicyd package is installed with the following command: $ dnf list --installed fapolicyd Installed
    Packages fapolicyd.x86_64 1.3.2-100.0.1.el9 @ol9_appstream If the fapolicyd package is not installed, this is a finding.'
