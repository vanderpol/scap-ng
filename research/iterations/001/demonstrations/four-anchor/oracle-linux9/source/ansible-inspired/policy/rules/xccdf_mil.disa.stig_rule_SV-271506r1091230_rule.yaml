    - name: description
      namespace: http://checklists.nist.gov/xccdf/1.2
      text: '<VulnDiscussion>The organization must identify authorized software programs and permit execution of authorized
        software. The process used to identify software programs that are authorized to execute on organizational information
        systems is commonly referred to as allowlisting.


        Using an allowlist provides a configuration management method for allowing the execution of only authorized software.
        Using only authorized software decreases risk by limiting the number of potential vulnerabilities. Verification of
        allowlisted software occurs prior to execution or at system startup.


        User home directories/folders may contain information of a sensitive nature. Nonprivileged users should coordinate
        any sharing of information with a system administrator (SA) through shared resources.


        OL 9 ships with many optional packages. One such package is a file access policy daemon called "fapolicyd". "fapolicyd"
        is a userspace daemon that determines access rights to files based on attributes of the process and file. It can be
        used to either blocklist or allowlist processes or file access.


        Proceed with caution with enforcing the use of this daemon. Improper configuration may render the system nonfunctional.
        The "fapolicyd" API is not namespace aware and can cause issues when launching or running containers.


        Satisfies: SRG-OS-000370-GPOS-00155, SRG-OS-000368-GPOS-00154</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
