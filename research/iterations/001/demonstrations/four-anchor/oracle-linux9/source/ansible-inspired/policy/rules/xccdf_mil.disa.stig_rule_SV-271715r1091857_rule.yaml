scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 SSH daemon provides users with feedback on when account accesses last occurred with the following
    command: $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo
    grep -iH ''^\s*printlastlog'' PrintLastLog yes If the "PrintLastLog" keyword is set to "no", the returned line is commented
    out, or no output is returned, this is a finding.'
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>Providing users feedback on when account accesses last occurred facilitates user recognition
    and reporting of unauthorized account use.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
