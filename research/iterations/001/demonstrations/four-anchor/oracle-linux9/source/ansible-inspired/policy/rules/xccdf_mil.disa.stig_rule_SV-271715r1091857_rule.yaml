    name: cpe:/o:oracle:linux:9:-
    ref: cpe:/o:oracle:linux:9:-
  extends: null
  fix: 'Configure the SSH daemon to provide users with feedback on when account accesses last occurred. Add the following
    line to "/etc/ssh/sshd_config" or to a file in "/etc/ssh/sshd_config.d" or uncomment the line and set the value to "yes":
    PrintLastLog yes The SSH service must be restarted for changes to take effect: $ sudo systemctl restart sshd.service'
