rule:
  abstract: false
  check: 'Verify that OL 9 is configured use the audisp-remote syslog service with the following command: $ sudo grep active
    /etc/audit/plugins.d/syslog.conf active = yes If the "active" keyword does not have a value of "yes", the line is commented
    out, or the line is missing, this is a finding.'
  cluster_id: null
  conflicts: []
  description: '<VulnDiscussion>The auditd service does not include the ability to send audit records to a centralized server
    for management directly. However, it can use a plug-in for audit event multiplexor (audispd) to pass audit records to
    the local syslog server. Satisfies: SRG-OS-000342-GPOS-00133, SRG-OS-000479-GPOS-00224</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
  discussion: null
  effective_platform_refs:
  - cpe:/o:oracle:linux:9:-
  effective_platforms:
  - kind: cpe_name
    name: cpe:/o:oracle:linux:9:-
    ref: cpe:/o:oracle:linux:9:-
  extends: null
  fix: 'Configure OL 9 to offload audit records onto a different system from the system being audited via syslog. Edit the
    /etc/audit/plugins.d/syslog.conf file and add or update the "active" option: active = yes The audit daemon must be restarted
    for changes to take effect. Restart auditd: $ sudo service auditd restart'
