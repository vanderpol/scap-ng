  effective_platforms:
  - kind: cpe_name
    name: cpe:/o:oracle:linux:9:-
    ref: cpe:/o:oracle:linux:9:-
  extends: null
  fix: 'Remove all xorg packages with the following command: Warning: If accessing the system through the graphical user interface,
    change to the multi-user.target with the following command: $ sudo systemctl isolate multi-user.target Warning: Removal
    of the graphical user interface will immediately render it useless. The following commands must not be run from a virtual
    terminal emulator in the graphical interface. $ sudo dnf remove "xorg*" $ sudo systemctl set-default multi-user.target
    If there is an operational requirement for a graphical user interface it must be documented with the ISSO.'
