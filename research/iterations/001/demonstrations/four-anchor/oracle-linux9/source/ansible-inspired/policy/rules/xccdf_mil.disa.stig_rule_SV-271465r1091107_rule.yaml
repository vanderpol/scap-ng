authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 does not have a graphical user interface installed with the following command: $ dnf list --installed
    "xorg*common" Error: No matching Packages to list If the "x11-server-common" package is installed, and the use of a graphical
    user interface has not been documented with the information system security officer (ISSO) as an operational requirement,
    this is a finding.'
  checks:
