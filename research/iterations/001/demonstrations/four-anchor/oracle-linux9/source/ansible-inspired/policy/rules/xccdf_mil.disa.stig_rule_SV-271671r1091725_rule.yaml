scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'This requirement assumes the use of the OL 9 default graphical user interface—the GNOME desktop environment. If
    the system does not have any graphical user interface installed, this requirement is Not Applicable. Verify that OL 9
    disables the graphical user interface autorun function with the following command: $ gsettings get org.gnome.desktop.media-handling
    autorun-never true If "autorun-never" is set to "false", and is not documented with the information system security officer
    (ISSO) as an operational requirement, this is a finding.'
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>Allowing autorun commands to execute may introduce malicious code to a system. Configuring
    this setting prevents autorun commands from executing.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
  effective_platform_refs:
  - cpe:/o:oracle:linux:9:-
  effective_platforms:
  - kind: cpe_name
    name: cpe:/o:oracle:linux:9:-
    ref: cpe:/o:oracle:linux:9:-
  extends: null
  fix: 'Configure the GNOME desktop to disable the autorun function on removable media. The dconf settings can be edited in
    the /etc/dconf/db/* location. Update the [org/gnome/desktop/media-handling] section of the "/etc/dconf/db/local.d/00-security-settings"
    database file and add or update the following lines: [org/gnome/desktop/media-handling] autorun-never=true Update the
    dconf system databases: $ sudo dconf update'
