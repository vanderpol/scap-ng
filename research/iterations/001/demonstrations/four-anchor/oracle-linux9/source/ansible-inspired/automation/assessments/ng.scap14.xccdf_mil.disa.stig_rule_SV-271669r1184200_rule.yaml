          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "The \"nodev\" mount option causes the system to not interpret character or block special devices. Executing\
              \ character or block special devices from untrusted file systems increases the opportunity for nonprivileged\
              \ users to attain unauthorized administrative access.\n\n\tThe only legitimate location for device files is\
