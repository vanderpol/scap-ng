          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: "Without the capability to generate audit records, it would be difficult to establish, correlate, and investigate\
              \ the events relating to an incident or identify those responsible for one.\n\n\tIf auditing is enabled late\
              \ in the startup process, the actions of some startup processes may not be audited. Some audit systems also\
              \ maintain state information only available if auditing is enabled before a given process is created.\n\n\t\
              Satisfies: SRG-OS-000037-GPOS-00015, SRG-OS-000042-GPOS-00020, SRG-OS-000062-GPOS-00031, SRG-OS-000392-GPOS-00172,\
