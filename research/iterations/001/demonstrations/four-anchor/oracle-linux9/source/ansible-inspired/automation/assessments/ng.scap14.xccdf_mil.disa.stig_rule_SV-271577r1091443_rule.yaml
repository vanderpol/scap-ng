        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:28301
      exports: []
      inline_content: 'Verify that OL 9 is configured to enable auditing of processes that start prior to the audit daemon.
        Check that the current GRUB 2 configuration enables auditing: $ sudo grubby --info=ALL | grep audit args="ro crashkernel=auto
        resume=/dev/mapper/ol-swap rd.lvm.lv=ol/root rd.lvm.lv=ol/swap rhgb quiet fips=1 audit=1 audit_backlog_limit=8192
        pti=on If "audit" is not set to "1" or is missing, this is a finding. Check that auditing is enabled by default to
        persist through kernel updates: $ sudo grep audit /etc/default/grub GRUB_CMDLINE_LINUX="audit=1" If "audit" is not
        set to "1", is missing, or is commented out, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:28301
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify that OL 9 is configured to enable auditing of processes that start prior to the audit daemon.\n\n\
            Check that the current GRUB 2 configuration enables auditing:\n\n$ sudo grubby --info=ALL | grep audit\nargs=\"\
            ro crashkernel=auto resume=/dev/mapper/ol-swap rd.lvm.lv=ol/root rd.lvm.lv=ol/swap rhgb quiet fips=1 audit=1 audit_backlog_limit=8192\
            \ pti=on \n\nIf \"audit\" is not set to \"1\" or is missing, this is a finding.\n\nCheck that auditing is enabled\
            \ by default to persist through kernel updates: \n\n$ sudo grep audit /etc/default/grub\nGRUB_CMDLINE_LINUX=\"\
            audit=1\"\n\nIf \"audit\" is not set to \"1\", is missing, or is commented out, this is a finding."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
