scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 TFTP daemon is configured to operate in secure mode. Check if a TFTP server is installed with the
    following command: $ sudo dnf list --installed tftp-server Installed Packages tftp-server.x86_64 5.2-38.el9 @ol9_appstream
    Note: If a TFTP server is not installed, this requirement is Not Applicable. If a TFTP server is installed, check for
    the server arguments with the following command: $ systemctl cat tftp | grep ExecStart ExecStart=/usr/sbin/in.tftpd -s
    /var/lib/tftpboot If the "ExecStart" line does not have a "-s" option, and a subdirectory is not assigned, this is a finding.'
  checks:
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-271764r1092004_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-271764r1092004_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>Restricting TFTP to a specific directory prevents remote users from copying, transferring,
    or overwriting system files. Using the "-s" option causes the TFTP service to only serve files from the given directory.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
  effective_platform_refs:
