  effective_platforms:
  - kind: cpe_name
    name: cpe:/o:oracle:linux:9:-
    ref: cpe:/o:oracle:linux:9:-
  extends: null
  fix: Configure the TFTP daemon to operate in secure mode. Find the path for the systemd service. $ sudo systemctl show tftp
    | grep FragmentPath= FragmentPath=/etc/systemd/system/tftp.service Edit the ExecStart line on that file to add the -s
    option with a subdirectory. ExecStart=/usr/sbin/in.tftpd -s /var/lib/tftpboot
