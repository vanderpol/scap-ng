rule:
  abstract: false
  check: 'Verify that OL 9 uses "pwquality" to enforce the password complexity rules in the password-auth file with the following
    command: $ grep pam_pwquality /etc/pam.d/password-auth | grep pam_pwquality password required pam_pwquality.so If the
    command does not return a line containing the value "pam_pwquality.so", or the line is commented out, this is a finding.'
