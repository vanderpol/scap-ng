scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 prohibits unauthorized interactive user accounts with the following command: $ less /etc/passwd
    root:x:0:0:root:/root:/bin/bash ... games:x:12:100:games:/usr/games:/sbin/nologin scsaustin:x:1001:1001:scsaustin:/home/scsaustin:/bin/bash
    djohnson:x:1002:1002:djohnson:/home/djohnson:/bin/bash Interactive user account, generally will have a user identifier
    (UID) of 1000 or greater, a home directory in a specific partition, and an interactive shell. Obtain the list of interactive
    user accounts authorized to be on the system from the system administrator or information system security officer (ISSO)
    and compare it to the list of local interactive user accounts on the system. If there are unauthorized local user accounts
    on the system, this is a finding.'
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>Accounts providing no operational purpose provide additional opportunities for system compromise.
    Unnecessary accounts include user accounts for individuals not requiring access to the system and application accounts
    for applications not installed on the system.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
