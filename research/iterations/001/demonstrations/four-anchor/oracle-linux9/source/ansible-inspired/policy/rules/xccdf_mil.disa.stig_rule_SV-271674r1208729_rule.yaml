      text: 'Configure OL 9 to initiate a screensaver after a 10-minute period of inactivity for graphical user interfaces.


        Create a database to contain the systemwide screensaver settings (if it does not already exist) with the following
        command:


        $ sudo touch /etc/dconf/db/local.d/00-screensaver


