scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'This requirement assumes the use of the OL 9 default graphical user interface—the GNOME desktop environment. If
    the system does not have any graphical user interface installed, this requirement is Not Applicable. Verify that OL 9
    disables a user''s ability to restart the system with the following command: $ grep -R disable-restart-buttons /etc/dconf/db/*
    /etc/dconf/db/distro.d/20-authselect:disable-restart-buttons=''true'' If the "disable-restart-button" setting is not set
    to "true", is missing or commented out from the dconf database files, this is a finding.'
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>A user who is at the console can reboot the system at the login screen. If restart or shutdown
    buttons are pressed at the login screen, this can create the risk of short-term loss of availability of systems due to
    reboot.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
