      exports: []
      inline_content: 'Verify that OL 9 configures ownership of all cron configuration files with the command: $ stat -c "%U
        %n" /etc/cron* root /etc/cron.d root /etc/cron.daily root /etc/cron.deny root /etc/cron.hourly root /etc/cron.monthly
        root /etc/crontab root /etc/cron.weekly If any crontab is not owned by root, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:77301
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify that OL 9 configures ownership of all cron configuration files with the command:


            $ stat -c "%U %n" /etc/cron*

            root /etc/cron.d

            root /etc/cron.daily

            root /etc/cron.deny

            root /etc/cron.hourly

            root /etc/cron.monthly

            root /etc/crontab

            root /etc/cron.weekly


            If any crontab is not owned by root, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
