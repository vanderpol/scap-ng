scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 disables the ability to load the Bluetooth kernel module with the following command: $ grep -r
    bluetooth /etc/modprobe.conf /etc/modprobe.d/* install bluetooth /bin/false blacklist bluetooth If the command does not
    return any output, or the line is commented out, and use of Bluetooth is not documented with the information system security
    officer (ISSO) as an operational requirement, this is a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271449r1091059_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271449r1091059_rule
    assessment_version: 1
    selector: automated
    source_selector: automated
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-271449r1091059_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: '<VulnDiscussion>This requirement applies to wireless peripheral technologies (e.g., wireless mice, keyboards,
    displays, etc.) used with OL 9 systems. Wireless peripherals (e.g., Wi-Fi/Bluetooth/IR keyboards, mice and pointing devices,
    and near field communications [NFC]) present a unique challenge by creating an open, unsecured port on a computer. Wireless
    peripherals must meet DOD requirements for wireless data transmission and be approved for use by the authorizing official
    (AO). Even though some wireless peripherals, such as mice and pointing devices, do not ordinarily carry information that
    need to be protected, modification of communications with these wireless peripherals may be used to compromise the OL
    9 operating system. Satisfies: SRG-OS-000095-GPOS-00049, SRG-OS-000300-GPOS-00118</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
