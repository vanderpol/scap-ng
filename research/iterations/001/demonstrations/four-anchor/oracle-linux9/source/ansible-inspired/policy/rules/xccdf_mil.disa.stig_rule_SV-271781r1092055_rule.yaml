rule:
  abstract: false
  check: 'Verify that OL 9 local files and directories on OL 9 have a valid owner with the following command: $ df --local
    -P | awk {''if (NR!=1) print $6''} | sudo xargs -I ''{}'' find ''{}'' -xdev -nouser If any files on the system do not
    have an assigned owner, this is a finding.'
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>Unowned files and directories may be unintentionally inherited if a user is assigned the same
    user identifier "UID" as the UID of the unowned files.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
  effective_platform_refs:
  - cpe:/o:oracle:linux:9:-
  effective_platforms:
  - kind: cpe_name
    name: cpe:/o:oracle:linux:9:-
    ref: cpe:/o:oracle:linux:9:-
  extends: null
  fix: 'Configure OL 9 local files and directories to have a valid owner. Either remove all files and directories from the
    system that do not have a valid user, or assign a valid user to all unowned files and directories on OL 9 with the "chown"
    command: $ sudo chown <user> <file>'
