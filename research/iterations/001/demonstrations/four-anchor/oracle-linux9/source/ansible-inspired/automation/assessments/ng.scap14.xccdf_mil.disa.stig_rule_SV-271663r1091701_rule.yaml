      exports: []
      inline_content: 'Verify that OL 9 is configured to mount /var/tmp with the nodev option. Verify "/var/tmp" is mounted
        with the "nodev" option: $ mount | grep /var/tmp /dev/mapper/ol-var-tmp on /var/tmp type xfs (rw,nodev,nosuid,noexec,seclabel)
        If the "/var/tmp" file system is mounted without the "nodev" option, this is a finding.'
