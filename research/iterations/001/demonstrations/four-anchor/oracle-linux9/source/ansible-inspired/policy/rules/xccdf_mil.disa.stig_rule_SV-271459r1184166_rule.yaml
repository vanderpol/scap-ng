scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Note: If NFS mounts are authorized and in use on the system, this is not applicable. Verify OL 9 does not have the
    gssproxy package installed with the following command: $ dnf list --installed gssproxy Error: No matching Packages to
    list If the "gssproxy" package is installed and is not documented with the information system security officer (ISSO)
    as an operational requirement, this is a finding.'
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>It is detrimental for operating systems to provide, or install by default, functionality exceeding
    requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore, may
    remain unsecured. They increase the risk to the platform by providing additional attack vectors. Operating systems are
    capable of providing a wide variety of functions and services. Some of the functions and services provided by default
    may not be necessary to support essential organizational operations (e.g., key missions, functions). The gssproxy package
    is a proxy for GSS API credential handling and could expose secrets on some networks. It is not needed for normal function
    of the OS.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
