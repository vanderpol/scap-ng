rule:
  abstract: false
  check: 'Verify that OL 9 has configured the minimum time period between password changes for each user account as 24 hours
    or greater with the following command: $ sudo awk -F: ''$4 < 1 {print $1 " " $4}'' /etc/shadow If any results are returned
    that are not associated with a system account, this is a finding.'
