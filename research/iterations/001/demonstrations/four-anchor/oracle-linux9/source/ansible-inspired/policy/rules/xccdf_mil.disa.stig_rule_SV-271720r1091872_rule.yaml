authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 does not allow users to override SSH environment variables. Verify that unattended or automatic
    logon via SSH is disabled with the following command: $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' |
    tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo grep -iH ''^\s*permituserenvironment'' PermitUserEnvironment no If "PermitUserEnvironment"
    is set to "yes", is missing completely, or is commented out, this is a finding.'
