scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify OL 9 requires users to provide a password for privilege escalation. Verify "/etc/sudoers" has no occurrences
    of "NOPASSWD" with the following command: $ sudo grep -iR nopasswd /etc/sudoers /etc/sudoers.d/ If any occurrences of
    "NOPASSWD" are returned from the command and have not been documented with the information system security officer (ISSO)
    as an organizationally defined administrative group using multifactor authentication (MFA), this is a finding.'
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>Without reauthentication, users may access resources or perform tasks for which they do not
    have authorization. When operating systems provide the capability to escalate a functional capability, it is critical
    that the user reauthenticate.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
