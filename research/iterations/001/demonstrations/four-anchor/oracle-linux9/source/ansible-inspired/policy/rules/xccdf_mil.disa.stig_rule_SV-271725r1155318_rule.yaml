    name: cpe:/o:oracle:linux:9:-
    ref: cpe:/o:oracle:linux:9:-
  extends: null
  fix: Configure OL 9 to not allow users to execute privileged actions without authenticating with a password. Remove any
    occurrence of "NOPASSWD" found in "/etc/sudoers" file or files in the "/etc/sudoers.d" directory. $ sudo sed -i '/NOPASSWD/
    s/^/# /g' /etc/sudoers /etc/sudoers.d/*
