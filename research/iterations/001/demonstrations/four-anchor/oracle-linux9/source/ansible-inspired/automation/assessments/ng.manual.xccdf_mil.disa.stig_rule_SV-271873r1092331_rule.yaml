        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:86101
      exports: []
      inline_content: 'Verify that OL 9 does not respond to ICMP echoes sent to a broadcast address. Check the value of the
        "icmp_echo_ignore_broadcasts" variable with the following command: $ sysctl net.ipv4.icmp_echo_ignore_broadcasts net.ipv4.icmp_echo_ignore_broadcasts
        = 1 If the returned line does not have a value of "1", a line is not returned, or the retuned line is commented out,
        this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
