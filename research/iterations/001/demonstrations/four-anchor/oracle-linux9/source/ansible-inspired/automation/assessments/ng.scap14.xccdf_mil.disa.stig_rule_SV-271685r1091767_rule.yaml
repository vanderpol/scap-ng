        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:49501
      exports: []
      inline_content: 'This requirement assumes the use of the OL 9 default graphical user interface—the GNOME desktop environment.
        If the system does not have any graphical user interface installed, this requirement is Not Applicable. Verify that
        OL 9 disables a user''s ability to restart the system with the following command: $ grep -R disable-restart-buttons
        /etc/dconf/db/* /etc/dconf/db/distro.d/20-authselect:disable-restart-buttons=''true'' If the "disable-restart-button"
        setting is not set to "true", is missing or commented out from the dconf database files, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:49501
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'This requirement assumes the use of the OL 9 default graphical user interface—the GNOME desktop environment.
            If the system does not have any graphical user interface installed, this requirement is Not Applicable.


            Verify that OL 9 disables a user''s ability to restart the system with the following command:


            $ grep -R disable-restart-buttons /etc/dconf/db/*

            /etc/dconf/db/distro.d/20-authselect:disable-restart-buttons=''true''


            If the "disable-restart-button" setting is not set to "true", is missing or commented out from the dconf database
            files, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
