authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 disables the ability to load the USB Storage kernel module with the following command: $ grep -r
    usb-storage /etc/modprobe.conf /etc/modprobe.d/* install usb-storage /bin/false blacklist usb-storage If the command does
    not return any output, or the line is commented out, and use of USB Storage is not documented with the information system
    security officer (ISSO) as an operational requirement, this is a finding.'
  cluster_id: null
  conflicts: []
  description: '<VulnDiscussion>USB mass storage permits easy introduction of unknown devices, thereby facilitating malicious
    activity. Satisfies: SRG-OS-000114-GPOS-00059, SRG-OS-000378-GPOS-00163</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
  discussion: null
