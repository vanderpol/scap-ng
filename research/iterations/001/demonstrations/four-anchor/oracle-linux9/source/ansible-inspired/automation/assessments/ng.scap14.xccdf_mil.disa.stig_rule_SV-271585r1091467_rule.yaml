        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:29901
      exports: []
      inline_content: 'Verify that OL 9 audit logs have a mode of "0600". First determine where the audit logs are stored
        with the following command: $ sudo grep -iw log_file /etc/audit/auditd.conf log_file = /var/log/audit/audit.log Then
        using the location of the audit log file, determine if the audit log files as a mode of "0640" with the following
        command: $ sudo ls -la /var/log/audit/*.log rw-------. 2 root root 237923 Jun 11 11:56 /var/log/audit/audit.log If
        the audit logs have a mode more permissive than "0600", this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:29901
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify that OL 9 audit logs have a mode of \"0600\". \n\nFirst determine where the audit logs are stored\
            \ with the following command:\n\n$ sudo grep -iw log_file /etc/audit/auditd.conf\nlog_file = /var/log/audit/audit.log\n\
            \nThen using the location of the audit log file, determine if the audit log files as a mode of \"0640\" with the\
            \ following command:\n\n$ sudo ls -la /var/log/audit/*.log\nrw-------. 2 root root 237923 Jun 11 11:56 /var/log/audit/audit.log\n\
            \nIf the audit logs have a mode more permissive than \"0600\", this is a finding."
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
