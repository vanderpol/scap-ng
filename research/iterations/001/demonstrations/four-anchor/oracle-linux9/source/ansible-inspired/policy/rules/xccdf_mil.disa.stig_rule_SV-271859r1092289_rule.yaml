scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Note: For systems that do not have physical wireless network radios, this requirement is Not Applicable. Verify
    that OL 9 allows no wireless interfaces to be configured on the system with the following command: $ nmcli device status
    DEVICE TYPE STATE CONNECTION virbr0 bridge connected virbr0 wlp7s0 wifi connected wifiSSID enp6s0 ethernet disconnected
    -- p2p-dev-wlp7s0 wifi-p2p disconnected -- lo loopback unmanaged -- virbr0-nic tun unmanaged -- If a wireless interface
    is configured and has not been documented and approved by the information system security officer (ISSO), this is a finding.'
  cluster_id: null
  conflicts: []
  description: '<VulnDiscussion>This requirement applies to wireless peripheral technologies (e.g., wireless mice, keyboards,
    displays, etc.) used with OL 9 systems. Wireless peripherals (e.g., Wi-Fi/Bluetooth/IR keyboards, mice and pointing devices,
    and near field communications [NFC]) present a unique challenge by creating an open, unsecured port on a computer. Wireless
    peripherals must meet DOD requirements for wireless data transmission and be approved for use by the authorizing official
    (AO). Even though some wireless peripherals, such as mice and pointing devices, do not ordinarily carry information that
    need to be protected, modification of communications with these wireless peripherals may be used to compromise the OL
    9 operating system. Satisfies: SRG-OS-000299-GPOS-00117, SRG-OS-000300-GPOS-00118, SRG-OS-000424-GPOS-00188, SRG-OS-000481-GPOS-00481</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
  discussion: null
  effective_platform_refs:
  - cpe:/o:oracle:linux:9:-
  effective_platforms:
  - kind: cpe_name
    name: cpe:/o:oracle:linux:9:-
    ref: cpe:/o:oracle:linux:9:-
  extends: null
  fix: 'Configure the system to disable all wireless network interfaces with the following command: $ sudo nmcli radio all
    off'
