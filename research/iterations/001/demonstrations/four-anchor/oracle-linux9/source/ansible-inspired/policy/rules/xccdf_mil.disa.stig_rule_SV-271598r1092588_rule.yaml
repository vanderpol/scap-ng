scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 audit system is configured to take an appropriate action when the internal event queue is full:
    $ sudo grep -i overflow_action /etc/audit/auditd.conf overflow_action = syslog If the value of the "overflow_action" option
    is not set to "syslog", "single", "halt" or the line is commented out, ask the system administrator (SA) to indicate how
    the audit logs are offloaded to a different system or media. If there is no evidence that the transfer of the audit logs
    being offloaded to another system or media takes appropriate action if the internal event queue becomes full, this is
    a finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271598r1092588_rule
    assessment_version: 1
    selector: default
    source_selector: ''
