    ref: cpe:/o:oracle:linux:9:-
  extends: null
  fix: 'Configure OL 9 to take appropriate action when the internal event queue is full. Edit the /etc/audit/auditd.conf file
    and add or update the "overflow_action" option: overflow_action = syslog The audit daemon must be restarted for changes
    to take effect. Restart auditd: $ sudo service auditd restart'
