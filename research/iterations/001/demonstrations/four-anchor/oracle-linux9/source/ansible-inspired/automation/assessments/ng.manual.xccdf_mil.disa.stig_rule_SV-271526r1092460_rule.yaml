          namespace: http://checklists.nist.gov/xccdf/1.2
          text: "Verify that OL 9 ensures cryptographic verification of vendor software packages by confirming that Oracle\
            \ package-signing keys are installed on the system, and verify their fingerprints match vendor values.\n\nNote:\
            \ For OL 9 software packages, Oracle uses GPG keys labeled \"release key 1\" and \"auxiliary key 1\". The keys\
            \ are defined in key file \"/etc/pki/rpm-gpg/RPM-GPG-KEY-oracle\" by default.\n\nList Oracle GPG keys installed\
            \ on the system:\n\n$ sudo rpm -q --queryformat \"%{SUMMARY}\\n\" gpg-pubkey | grep -i \"oracle\"\n\nOracle Linux\
            \ (release key 1) <secalert_us@oracle.com> public key\nOracle Linux (backup key 1) <secalert_us@oracle.com> public\
            \ key\n\nIf Oracle GPG keys \"release key 1\" and \"backup key 1\" are not installed, this is a finding.\n\nList\
            \ key fingerprints of installed Oracle GPG keys:\n\n$ sudo gpg -q --keyid-format short --with-fingerprint /etc/pki/rpm-gpg/RPM-GPG-KEY-oracle\n\
            \nIf key file \"/etc/pki/rpm-gpg/RPM-GPG-KEY-oracle\" is missing, this is a finding.\n\npub   rsa4096/8D8B756F\
            \ 2022-01-19 [SC] [expires: 2042-01-14]\n      Key fingerprint = 3E6D 826D 3FBA B389 C2F3  8E34 BC4D 06A0 8D8B\
            \ 756F\nuid                   Oracle Linux (release key 1) <secalert_us@oracle.com>\nsub   rsa4096/2E708C25 2022-01-19\
            \ [E] [expires: 2041-06-01]\npub   rsa4096/8B4EFBE6 2022-01-19 [SC] [expires: 2042-01-14]\n      Key fingerprint\
            \ = 9822 3175 9C74 6706 5D0C  E9B2 A7DD 0708 8B4E FBE6\nuid                   Oracle Linux (backup key 1) <secalert_us@oracle.com>\n\
            sub   rsa4096/DA900791 2022-01-19 [E] [expires: 2041-06-02]\n\nCompare key fingerprints of installed Oracle GPG\
            \ keys with fingerprints listed for OL 9 on Oracle verification webpage at https://linux.oracle.com/security/gpg/#gpg.\n\
            \nIf key fingerprints do not match, this is a finding."
