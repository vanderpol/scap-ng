rule:
  abstract: false
  check: 'Verify that OL 9 disables the ability to load the ATM kernel module with the following command: $ grep -r atm /etc/modprobe.conf
    /etc/modprobe.d/* install atm /bin/false blacklist atm If the command does not return any output, or the line is commented
    out, and use of ATM is not documented with the information system security officer (ISSO) as an operational requirement,
    this is a finding.'
