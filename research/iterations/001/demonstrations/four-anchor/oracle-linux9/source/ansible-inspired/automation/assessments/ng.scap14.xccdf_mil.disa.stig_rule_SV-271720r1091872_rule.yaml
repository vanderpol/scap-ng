        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:56101
      exports: []
      inline_content: 'Verify that OL 9 does not allow users to override SSH environment variables. Verify that unattended
        or automatic logon via SSH is disabled with the following command: $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/
        {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo grep -iH ''^\s*permituserenvironment'' PermitUserEnvironment
        no If "PermitUserEnvironment" is set to "yes", is missing completely, or is commented out, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:56101
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify that OL 9 does not allow users to override SSH environment variables.


            Verify that unattended or automatic logon via SSH is disabled with the following command:


            $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo grep
            -iH ''^\s*permituserenvironment''

            PermitUserEnvironment no


            If "PermitUserEnvironment" is set to "yes", is missing completely, or is commented out, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
