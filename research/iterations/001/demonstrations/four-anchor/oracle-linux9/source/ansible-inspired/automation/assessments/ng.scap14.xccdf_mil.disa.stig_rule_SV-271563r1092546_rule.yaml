        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:25501
      exports: []
      inline_content: 'Verify that OL 9 is configured to audit successful/unsuccessful attempts to use the rename, unlink,
        rmdir, renameat, and unlinkat system calls with the following command: $ sudo auditctl -l | grep ''rename\|unlink\|rmdir''
        -a always,exit -F arch=b32 -S rename,unlink,rmdir,renameat,unlinkat -F auid>=1000 -F auid!=unset -k delete -a always,exit
        -F arch=b64 -S rename,unlink,rmdir,renameat,unlinkat -F auid>=1000 -F auid!=unset -k delete If the command does not
        return an audit rule for rename, unlink, rmdir, renameat, and unlinkat or any of the lines returned are commented
        out, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
