          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify that OL 9 is configured to audit successful/unsuccessful attempts to use the rename, unlink, rmdir,
            renameat, and unlinkat system calls with the following command:


            $ sudo auditctl -l | grep ''rename\|unlink\|rmdir''

            -a always,exit -F arch=b32 -S rename,unlink,rmdir,renameat,unlinkat -F auid>=1000 -F auid!=unset -k delete

            -a always,exit -F arch=b64 -S rename,unlink,rmdir,renameat,unlinkat -F auid>=1000 -F auid!=unset -k delete


            If the command does not return an audit rule for rename, unlink, rmdir, renameat, and unlinkat or any of the lines
            returned are commented out, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
