        name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:85901
      exports: []
      inline_content: 'Verify that OL 9 is not performing IPv4 packet forwarding, unless the system is a router. Check that
        IPv4 forwarding is disabled using the following command: $ sysctl net.ipv4.conf.all.forwarding net.ipv4.conf.all.forwarding
        = 0 If the IPv4 forwarding value is not "0" and is not documented with the information system security officer (ISSO)
        as an operational requirement, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:85901
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Verify that OL 9 is not performing IPv4 packet forwarding, unless the system is a router.


            Check that IPv4 forwarding is disabled using the following command:


            $ sysctl net.ipv4.conf.all.forwarding

            net.ipv4.conf.all.forwarding = 0


            If the IPv4 forwarding value is not "0" and is not documented with the information system security officer (ISSO)
            as an operational requirement, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
      system: http://scap.nist.gov/schema/ocil/2
