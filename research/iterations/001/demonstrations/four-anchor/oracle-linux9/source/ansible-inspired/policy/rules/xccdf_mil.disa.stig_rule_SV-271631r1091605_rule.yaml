rule:
  abstract: false
  check: 'Verify that OL 9 enforces a 60-day maximum password lifetime for new user accounts by running the following command:
    $ grep -i pass_max_days /etc/login.defs PASS_MAX_DAYS 60 If the "PASS_MAX_DAYS" parameter value is greater than "60",
    or commented out, this is a finding.'
  checks:
