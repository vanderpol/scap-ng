          - name: description
            namespace: http://oval.mitre.org/XMLSchema/oval-definitions-5
            text: The "nosuid" mount option causes the system not to execute "setuid" and "setgid" files with owner privileges.
              This option must be used for mounting any file system not containing approved "setuid" and "setguid" files.
              Executing files from untrusted file systems increases the opportunity for nonprivileged users to attain unauthorized
              administrative access.
