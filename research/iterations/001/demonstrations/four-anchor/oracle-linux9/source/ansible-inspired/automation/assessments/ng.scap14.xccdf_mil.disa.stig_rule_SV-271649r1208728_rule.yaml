      exports: []
      inline_content: 'Note: For systems that use BIOS, this is not applicable. Verify OL 9 "/boot/efi directory" is mounted
        with the "nosuid" option with the following command: $ mount | grep ''\s/boot/efi\s'' /dev/sda1 on /boot/efi type
        vfat (rw,nosuid,relatime,fmask=0077,dmask=0077,codepage=437,iocharset=ascii,shortname=winnt,errors=remount-ro) If
        the "/boot/efi" file system does not have the "nosuid" option set, this is a finding.'
      multi_check: null
      negate: null
      selector: manual
      source_tree:
        attributes:
          selector: manual
          system: http://scap.nist.gov/schema/ocil/2
        children:
        - attributes:
            href: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-ocil.xml
            name: ocil:navy.navwar.niwcatlantic.scc.ol9os:questionnaire:42501
          name: check-content-ref
          namespace: http://checklists.nist.gov/xccdf/1.2
        - name: check-content
          namespace: http://checklists.nist.gov/xccdf/1.2
          text: 'Note: For systems that use BIOS, this is not applicable.


            Verify OL 9 "/boot/efi directory" is mounted with the "nosuid" option with the following command:


            $ mount | grep ''\s/boot/efi\s''

            /dev/sda1 on /boot/efi type vfat (rw,nosuid,relatime,fmask=0077,dmask=0077,codepage=437,iocharset=ascii,shortname=winnt,errors=remount-ro)


            If the "/boot/efi" file system does not have the "nosuid" option set, this is a finding.'
        name: check
        namespace: http://checklists.nist.gov/xccdf/1.2
