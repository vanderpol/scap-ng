scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 will not accept IPv4 ICMP redirect messages. Check the value of the default "accept_redirects"
    variables with the following command: $ sysctl net.ipv4.conf.default.accept_redirects net.ipv4.conf.default.accept_redirects
    = 0 If the returned line does not have a value of "0", a line is not returned, or the line is commented out, this is a
    finding.'
  checks:
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271869r1092319_rule
    assessment_version: 1
    selector: default
    source_selector: ''
  - assessment: ng.scap14.xccdf_mil.disa.stig_rule_SV-271869r1092319_rule
    assessment_version: 1
    selector: automated
    source_selector: automated
  - assessment: ng.manual.xccdf_mil.disa.stig_rule_SV-271869r1092319_rule
    assessment_version: 1
    selector: manual
    source_selector: manual
  cluster_id: null
  conflicts: []
  default_check: default
  description: <VulnDiscussion>ICMP redirect messages are used by routers to inform hosts that a more direct route exists
    for a particular destination. These messages modify the host's route table and are unauthenticated. An illicit ICMP redirect
    message could result in a man-in-the-middle attack. This feature of the IPv4 protocol has few legitimate uses. It must
    be disabled unless absolutely required.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
