  effective_platforms:
  - kind: cpe_name
    name: cpe:/o:oracle:linux:9:-
    ref: cpe:/o:oracle:linux:9:-
  extends: null
  fix: 'Configure OL 9 to prevent IPv4 ICMP redirect messages from being accepted. Add or edit the following line in a single
    system configuration file in the "/etc/sysctl.d/" directory: net.ipv4.conf.default.accept_redirects = 0 Load settings
    from all system configuration files with the following command: $ sudo sysctl --system'
