  effective_platforms:
  - kind: cpe_name
    name: cpe:/o:oracle:linux:9:-
    ref: cpe:/o:oracle:linux:9:-
  extends: null
  fix: 'Configure OL 9 to enforce password complexity by requiring at least one special character be used by setting the "ocredit"
    option. Add the following line to "/etc/security/pwquality.conf" (or modify the line to have the required value): ocredit
    = -1'
