authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 enforces password complexity by requiring at least one special character with the following command:
    $ sudo grep ocredit /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf ocredit = -1 If the value of "ocredit"
    is a positive number or is commented out, this is a finding.'
  cluster_id: null
  conflicts: []
  description: <VulnDiscussion>Use of a complex password helps to increase the time and resources required to compromise the
    password. Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing
    and brute-force attacks. Password complexity is one factor of several that determines how long it takes to crack a password.
    The more complex the password, the greater the number of possible combinations that need to be tested before the password
    is compromised. OL 9 uses "pwquality" as a mechanism to enforce password complexity. Note that to require special characters
    without degrading the "minlen" value, the credit value must be expressed as a negative number in "/etc/security/pwquality.conf".</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
