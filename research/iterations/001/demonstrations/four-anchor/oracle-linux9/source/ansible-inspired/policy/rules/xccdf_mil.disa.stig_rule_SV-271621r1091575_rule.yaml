authoring_style: ansible-inspired
rule:
  abstract: false
  check: 'Verify that OL 9 enforces password complexity rules for the root account. Check if root user is required to use
    complex passwords with the following command: $ grep enforce_for_root /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    /etc/security/pwquality.conf:enforce_for_root If "enforce_for_root" is commented or missing, this is a finding.'
  checks:
