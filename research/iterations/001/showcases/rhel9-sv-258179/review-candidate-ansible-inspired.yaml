scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
runtime_dependency: none
purpose: policy-intent-review-candidate-not-source-equivalent

assessment:
  id: NG-RHEL9-SV-258179
  version: 1
  name: >
    RHEL 9 must audit all uses of setxattr, fsetxattr, lsetxattr,
    removexattr, fremovexattr, and lremovexattr system calls.

  steps:
    - name: Read configured audit rules
      collect:
        capability: scapng.linux.audit.configured_rules
        source:
          type: audit_rules_file
          path: /etc/audit/audit.rules
      register: configured_audit_rules

    - name: Build required syscall audit coverage
      derive:
        matrix:
          syscall:
            - setxattr
            - fsetxattr
            - lsetxattr
            - removexattr
            - fremovexattr
            - lremovexattr
          architecture:
            - b32
            - b64
          subject:
            - name: interactive_users
              all:
                - field: auid
                  op: ge
                  value: 1000
                - field: auid
                  op: not_in
                  value:
                    - -1
                    - 4294967295
                    - unset
            - name: root
              field: auid
              op: eq
              value: 0
      register: required_coverage

  assert:
    that:
      every:
        item: required_coverage
        satisfies:
          covered_by_audit_rule:
            rules: configured_audit_rules
            required: item
            action:
              equivalent_to:
                - always,exit
                - exit,always

  evidence:
    max_records: 50

  migration:
    source_rule: xccdf_mil.disa.stig_rule_SV-258179r1155601_rule
    source_definition: oval:mil.disa.stig.rhel9os:def:258179
    status: requires_review
    normalization: >
      Review candidate only. The published OVAL enforces 22 unique conditions,
      duplicates two b32/root checks, and does not contain the lsetxattr/removexattr
      b64/root conditions represented here. Do not treat this file as a faithful
      SCAP 1.4 conversion.
