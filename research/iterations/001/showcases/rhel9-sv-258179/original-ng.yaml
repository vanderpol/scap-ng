scap_ng: 0.1-prototype
prototype: true

assessment:
  id: NG-RHEL9-SV-258179
  version: 1
  description: >
    RHEL 9 must audit all uses of setxattr, fsetxattr, lsetxattr,
    removexattr, fremovexattr, and lremovexattr system calls.

  collect:
    configured_audit_rules:
      capability: linux.audit.configured_rules
      source:
        type: audit_rules_file
        path: /etc/audit/audit.rules

  derive:
    required_coverage:
      matrix:
        syscall:
          - setxattr
          - fsetxattr
          - lsetxattr
          - removexattr
          - fremovexattr
          - lremovexattr
        architecture:
          - b32
          - b64
        subject:
          - name: interactive_users
            all:
              - field: auid
                op: ge
                value: 1000
              - field: auid
                op: not_in
                value:
                  - -1
                  - 4294967295
                  - unset
          - name: root
            field: auid
            op: eq
            value: 0

  assert:
    every:
      item: $derived.required_coverage
      satisfies:
        covered_by_audit_rule:
          rules: $configured_audit_rules
          required: $item
          action:
            equivalent_to:
              - always,exit
              - exit,always

  evidence:
    max_records: 50

  migration:
    source_rule: xccdf_mil.disa.stig_rule_SV-258179r1155601_rule
    source_definition: oval:mil.disa.stig.rhel9os:def:258179
    status: requires_review
    normalization: >
      Candidate semantic normalization of 24 regex-based OVAL checks into a
      6 x 2 x 2 audit-rule coverage matrix. Differential equivalence is required
      before promotion to exact_normalized.
