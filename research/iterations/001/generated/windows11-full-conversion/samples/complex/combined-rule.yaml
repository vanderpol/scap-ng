rule:
  id: xccdf_mil.disa.stig_rule_SV-253495r1137691_rule
  title: The "Deny log on through Remote Desktop Services" user right on Windows 11 workstations must be configured to prevent
    access from highly privileged domain accounts and local accounts on domain systems and unauthenticated access on all systems.
  severity: medium
  weight: '10.0'
  role: null
  selected: null
  selected_default: true
  cluster_id: null
  extends: null
  abstract: false
  hidden: false
  prohibit_changes: false
  multiple: false
  group_path:
  - xccdf_mil.disa.stig_group_V-253495
  description: <VulnDiscussion>Inappropriate granting of user rights can provide system, administrative, and other high-level
    capabilities. The "Deny log on through Remote Desktop Services" right defines the accounts that are prevented from logging
    on using Remote Desktop Services. If Remote Desktop Services is not used by the organization, the Everyone group must
    be assigned this right to prevent all access. In an Active Directory Domain, denying logons to the Enterprise Admins and
    Domain Admins groups on lower trust systems helps mitigate the risk of privilege escalation from credential theft attacks,
    which could lead to the compromise of an entire domain. Local accounts on domain-joined systems must also be assigned
    this right to decrease the risk of lateral movement resulting from credential theft attacks. The Guests group must be
    assigned this right to prevent unauthenticated access.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  discussion: null
  platforms: []
  effective_platform_refs:
  - cpe:/o:microsoft:windows_11
  effective_platforms:
