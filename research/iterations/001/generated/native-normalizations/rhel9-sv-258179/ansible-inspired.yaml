scap_ng: 0.1-prototype
prototype: true
authoring_style: ansible-inspired
runtime_dependency: none
assessment:
  id: NG-xccdf_mil.disa.stig_rule_SV-258179r1155601_rule
  name: RHEL 9 must audit all uses of the setxattr, fsetxattr, lsetxattr, removexattr, fremovexattr, and
    lremovexattr system calls.
  steps:
  - name: Read configured audit rules
    collect:
      capability: scapng.linux.audit.configured_rules
      source:
        path: /etc/audit/audit.rules
        type: audit_rules_file
    register: configured_audit_rules
  - name: Build required syscall audit coverage
    derive:
      matrix:
        cells:
        - architecture: b32
          subject: interactive_users
          syscall: fremovexattr
        - architecture: b32
          subject: root
          syscall: fremovexattr
        - architecture: b64
          subject: interactive_users
          syscall: fremovexattr
        - architecture: b64
          subject: root
          syscall: fremovexattr
        - architecture: b32
          subject: interactive_users
          syscall: fsetxattr
        - architecture: b32
          subject: root
          syscall: fsetxattr
        - architecture: b64
          subject: interactive_users
          syscall: fsetxattr
        - architecture: b64
          subject: root
          syscall: fsetxattr
        - architecture: b32
          subject: interactive_users
          syscall: lremovexattr
        - architecture: b32
          subject: root
          syscall: lremovexattr
        - architecture: b64
          subject: interactive_users
          syscall: lremovexattr
        - architecture: b64
          subject: root
          syscall: lremovexattr
        - architecture: b32
          subject: interactive_users
          syscall: lsetxattr
        - architecture: b32
          subject: root
          syscall: lsetxattr
        - architecture: b64
          subject: interactive_users
          syscall: lsetxattr
        - architecture: b32
          subject: interactive_users
          syscall: removexattr
        - architecture: b32
          subject: root
          syscall: removexattr
        - architecture: b64
          subject: interactive_users
          syscall: removexattr
        - architecture: b32
          subject: interactive_users
          syscall: setxattr
        - architecture: b32
          subject: root
          syscall: setxattr
        - architecture: b64
          subject: interactive_users
          syscall: setxattr
        - architecture: b64
          subject: root
          syscall: setxattr
        subjects:
        - all:
          - field: auid
            op: ge
            value: 1000
          - field: auid
            op: not_in
            value:
            - -1
            - 4294967295
            - unset
          name: interactive_users
        - field: auid
          name: root
          op: eq
          value: 0
    register: required_coverage
  assert:
    that:
      every:
        item: required_coverage
        satisfies:
          covered_by_audit_rule:
            rules: configured_audit_rules
            required: item
            action:
              equivalent_to:
              - always,exit
              - exit,always
  migration:
    source_rule: xccdf_mil.disa.stig_rule_SV-258179r1155601_rule
    source_definition: oval:mil.disa.stig.rhel9os:def:258179
    status: requires_review
    semantic_fingerprint_sha256: 0f34fddeace27334af90bf5bb9e3dc26fc1800847d86b5cde6a119f4329f9421
