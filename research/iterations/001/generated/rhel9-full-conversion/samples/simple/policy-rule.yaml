rule:
  id: xccdf_mil.disa.stig_rule_SV-257777r1155676_rule
  title: RHEL 9 must be a vendor-supported release.
  severity: high
  weight: '10.0'
  role: null
  description: '<VulnDiscussion>An operating system release is considered "supported" if the vendor continues to provide security
    patches for the product. With an unsupported release, it will not be possible to resolve security issues discovered in
    the system software. End Of Life dates for Red Hat Linux 9 releases are as follows: Current end of Full Support for Red
    Hat Linux 9 is 31 May 2027. Current end of Maintenance Support for Red Hat Linux 9 is 31 May 3032. Current end of Extended
    Life Cycle Support (ELS) for Red Hat Linux 9 is 31 May 2035.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
  discussion: null
  platforms: []
