scap_ng: 0.1-prototype
prototype: true
model: combined-rule
rule:
  id: xccdf_mil.disa.stig_rule_SV-258179r1155601_rule
  title: RHEL 9 must audit all uses of the setxattr, fsetxattr, lsetxattr, removexattr, fremovexattr, and lremovexattr system
    calls.
  severity: medium
  weight: '10.0'
  role: null
  description: '<VulnDiscussion>Without generating audit records specific to the security and mission needs of the organization,
    it would be difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible
    for one. Audit records can be generated from various components within the information system (e.g., module or policy
    filter). When a user logs on, the auid is set to the uid of the account being authenticated. Daemons are not user sessions
    and have the loginuid set to -1. The auid representation is an unsigned 32-bit integer, which equals 4294967295. The audit
    system interprets -1, 4294967295, and "unset" in the same way. The system call rules are loaded into a matching engine
    that intercepts each system call made by all programs on the system. Therefore, it is very important to use system call
    rules only when absolutely necessary since these affect performance. The more rules, the bigger the performance hit. The
    performance can be helped, however, by combining system calls into one rule whenever possible. Satisfies: SRG-OS-000037-GPOS-00015,
    SRG-OS-000042-GPOS-00020, SRG-OS-000062-GPOS-00031, SRG-OS-000392-GPOS-00172, SRG-OS-000458-GPOS-00203, SRG-OS-000462-GPOS-00206,
    SRG-OS-000463-GPOS-00207, SRG-OS-000471-GPOS-00215, SRG-OS-000474-GPOS-00219, SRG-OS-000466-GPOS-00210, SRG-OS-000064-GPOS-00033</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
  discussion: null
  platforms: []
  references:
  - href: null
    text: DPMS Target Red Hat Enterprise Linux 9 DISA DPMS Target Red Hat Enterprise Linux 9 5551
  idents:
  - system: http://cyber.mil/cci
    value: CCI-000130
  - system: http://cyber.mil/cci
    value: CCI-000135
  - system: http://cyber.mil/cci
    value: CCI-000169
  - system: http://cyber.mil/cci
    value: CCI-000172
  - system: http://cyber.mil/cci
    value: CCI-002884
  requires: []
  conflicts: []
  check: 'Verify RHEL 9 is configured to audit the execution of the "setxattr", "fsetxattr", "lsetxattr", "removexattr", "fremovexattr",
    and "lremovexattr" system calls with the following command: $ sudo auditctl -l | grep xattr -a always,exit -F arch=b32
    -S setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid>=1000 -F auid!=-1 -F key=perm_mod -a always,exit
    -F arch=b64 -S setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid>=1000 -F auid!=-1 -F key=perm_mod
    -a always,exit -F arch=b32 -S setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid=0 -F key=perm_mod
    -a always,exit -F arch=b64 -S setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid=0 -F key=perm_mod
    If both the "b32" and "b64" audit rules are not defined for the "setxattr", "fsetxattr", "lsetxattr", "removexattr", "fremovexattr",
    and "lremovexattr" system calls, or any of the lines returned are commented out, this is a finding.'
