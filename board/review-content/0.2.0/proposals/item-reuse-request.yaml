# PROPOSED run-time binding corresponding to the consumer Assessment.
# This is execution/request data, not reusable Assessment source.
assessment_request:
  item_bindings:
    configuration-file-items:
      result_artifact: prior-collection.result.json
      source_digest: sha256:<exact-result-artifact-digest>
      source_execution_id: <exact-source-execution-id>
      source_assessment:
        id: board.shared-file-collection
        version: 1
      source_object: configuration-files
      target_ref: <exact-target-reference>
      binding_set_id: <exact-nonempty-binding-set-id>
      item_refs:
      - source-item-1
      - source-item-2
      id_map:
        source-item-1: imported-config-1
        source-item-2: imported-config-2
