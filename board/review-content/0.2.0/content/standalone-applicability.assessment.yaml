assessment:
  id: board.standalone-applicability
  version: 1
  assessment_title: Determine whether the target is a UNIX-family system
  mode: automated
  class: miscellaneous
  purpose: applicability
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.2.0
  states:
    family-is-unix:
      state_title: System family is UNIX
      capability: independent.family
      state:
        field: family
        datatype: string
        operation: equal
        value: unix
        match: all
        existence: some
  tests:
    test-unix-family:
      test_title: Determine UNIX-family applicability
      capability: independent.family
      reported_elements: all
      states:
      - family-is-unix
      check_existence: some
      check: all
  evaluate:
    test: test-unix-family
