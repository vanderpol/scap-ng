assessment:
  id: board.constants
  version: 1
  assessment_title: A single integer equals 9 and every listed integer exceeds 7
  mode: automated
  class: miscellaneous
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.2.0
  variables:
    reference-integer:
      variable_title: One integer
      kind: constant
      datatype: integer
      value: 9
    candidate-integers:
      variable_title: Eight integers
      kind: constant
      datatype: integer
      value:
      - 15
      - 18
      - 20
      - 24
      - 30
      - 36
      - 40
      - 48
  states:
    equals-nine:
      state_title: Exactly 9
      capability: variable.value
      state:
        field: value
        datatype: integer
        operation: equal
        value: 9
        match: all
        existence: some
    greater-than-seven:
      state_title: Greater than 7
      capability: variable.value
      state:
        field: value
        datatype: integer
        operation: greater_than
        value: 7
        match: all
        existence: some
  tests:
    test-reference-integer:
      test_title: Compare the single value
      capability: variable.value
      reported_elements: all
      variable: reference-integer
      states:
      - equals-nine
      check_existence: some
      check: all
    test-candidate-integers:
      test_title: Compare every value
      capability: variable.value
      reported_elements: all
      variable: candidate-integers
      states:
      - greater-than-seven
      check_existence: some
      check: all
  evaluate:
    all:
    - test: test-reference-integer
    - test: test-candidate-integers
