# SCAP_1.4/OVAL_Test_Content/linux/unix-def_sysctl_test.xml
# Selected source Test: oval:navy.navwar.niwcatlantic.scc.unix.test:tst:1
assessment:
  id: board.sysctl
  version: 1
  assessment_title: Confirm the kernel hostname sysctl has a value
  mode: automated
  class: miscellaneous
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.2.0
  objects:
    kernel-hostname:
      object_title: kernel.hostname sysctl
      capability: unix.sysctl
      select:
        name:
          value: kernel.hostname
          operation: equal
          datatype: string
  states:
    expected-kernel-hostname:
      state_title: kernel.hostname is present and nonempty
      capability: unix.sysctl
      state:
        all:
        - field: name
          value: kernel.hostname
          operation: equal
          datatype: string
          match: all
          existence: some
        - field: value
          value: .+
          operation: match
          datatype: string
          match: all
          existence: some
  tests:
    test-kernel-hostname:
      test_title: Test kernel hostname sysctl
      capability: unix.sysctl
      object: kernel-hostname
      check_existence: some
      check: all
      states:
      - expected-kernel-hostname
      reported_elements: all
  evaluate:
    test: test-kernel-hostname
