assessment:
  id: board.registry
  version: 1
  assessment_title: Exactly one selected registry Item has the expected address
  mode: automated
  class: miscellaneous
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.2.0
  objects:
    windows-version-entry:
      capability: windows.registry
      select:
        hive: local_machine
        key:
          value: SOFTWARE\Microsoft\Windows NT\CurrentVersion
          operation: equal
          datatype: string
        name:
          value: CurrentVersion
          operation: equal
          datatype: string
      object_title: Windows version entry
  states:
    expected-version-address:
      state_title: Expected version address
      capability: windows.registry
      state:
        all:
        - field: hive
          value: local_machine
          operation: equal
          datatype: string
          match: all
          existence: some
        - field: key
          value: SOFTWARE\Microsoft\Windows NT\CurrentVersion
          operation: equal_ci
          datatype: string
          match: all
          existence: some
        - field: name
          value: CurrentVersion
          operation: equal
          datatype: string
          match: all
          existence: some
  tests:
    test-windows-version-address:
      test_title: Test windows version address
      capability: windows.registry
      reported_elements: all
      object: windows-version-entry
      check_existence: some
      check: one
      states:
      - expected-version-address
  evaluate:
    test: test-windows-version-address
