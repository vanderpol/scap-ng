assessment:
  id: board.unix-file
  version: 3
  assessment_title: Support build file exists at the specified path
  mode: automated
  class: miscellaneous
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.2.0
  objects:
    support-build-file:
      capability: unix.file
      select:
        full_path:
          value: /opt/support/txt/txtfile/build.win32.txt
          operation: equal
          datatype: string
      object_title: Support build file
      filesystem: any
  states:
    expected-build-file-path:
      state_title: Expected build file path
      capability: unix.file
      state:
        field: full_path
        value: /opt/support/txt/txtfile/build.win32.txt
        operation: equal
        datatype: string
        match: all
        existence: some
  tests:
    test-build-file-path:
      test_title: Test build file path
      capability: unix.file
      reported_elements: all
      object: support-build-file
      check_existence: some
      check: all
      states:
      - expected-build-file-path
  evaluate:
    test: test-build-file-path
