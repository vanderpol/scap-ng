assessment:
  id: board.symlink-resolution
  version: 1
  assessment_title: Resolve links and distinguish regular files and missing paths
  mode: automated
  class: miscellaneous
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.2.0
  objects:
    link-chain-object:
      capability: unix.symlink
      select:
        full_path:
          value: /opt/support/symlinks/symlinks_dir1/daisyChain2targetfile.txt
          operation: equal
          datatype: string
      object_title: Link chain object
    missing-link-object:
      capability: unix.symlink
      select:
        full_path:
          value: /tmp/fileDoesNotExist
          operation: equal
          datatype: string
      object_title: Missing link object
    regular-file-object:
      capability: unix.symlink
      select:
        full_path:
          value: /opt/support/symlinks/symlinks_dir1/targetfile.txt
          operation: equal
          datatype: string
      object_title: Regular file object
    working-link-object:
      capability: unix.symlink
      select:
        full_path:
          value: /opt/support/symlinks/symlinks_dir2/link2targetfile.txt
          operation: equal
          datatype: string
      object_title: Working link object
  states:
    canonical-target-state:
      state_title: Canonical target state
      capability: unix.symlink
      state:
        field: canonical_path
        value: /opt/support/symlinks/symlinks_dir1/targetfile.txt
        operation: equal
        datatype: string
        match: all
        existence: some
  tests:
    test-link-chain-exists:
      test_title: Test link chain exists
      capability: unix.symlink
      reported_elements: all
      object: link-chain-object
      check_existence: some
      check: all
    test-missing-link-exists:
      test_title: Test missing link exists
      capability: unix.symlink
      reported_elements: all
      object: missing-link-object
      check_existence: some
      check: all
    test-regular-file-is-link:
      test_title: Test regular file is link
      capability: unix.symlink
      reported_elements: all
      object: regular-file-object
      check_existence: some
      check: all
    test-working-link-target:
      test_title: Test working link target
      capability: unix.symlink
      reported_elements: all
      object: working-link-object
      check_existence: some
      check: all
      states:
      - canonical-target-state
  evaluate:
    all:
    - test: test-link-chain-exists
    - not:
        test: test-regular-file-is-link
    - not:
        test: test-missing-link-exists
    - test: test-working-link-target
