assessment:
  id: board.concat
  version: 1
  assessment_title: Compare all Cartesian concat values with the source expected set
  mode: automated
  class: miscellaneous
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.2.0
  variables:
    prefixes:
      variable_title: Two prefixes
      kind: constant
      datatype: string
      value:
      - abc
      - def
    suffixes:
      variable_title: Two suffixes
      kind: constant
      datatype: string
      value:
      - '123'
      - '456'
    combined-values:
      variable_title: Cartesian concatenation
      kind: local
      datatype: string
      expression:
        concat:
        - variable: prefixes
        - variable: suffixes
    expected-combinations:
      variable_title: Four expected strings
      kind: constant
      datatype: string
      value:
      - abc123
      - abc456
      - def123
      - def456
  states:
    matches-one-expected-value:
      state_title: Each produced value matches exactly one expected value
      capability: variable.value
      state:
        field: value
        datatype: string
        operation: equal
        value:
          variable: expected-combinations
        match: all
        existence: some
        variable_match: one
  tests:
    test-combined-values:
      test_title: Compare the produced Variable values
      capability: variable.value
      reported_elements: all
      variable: combined-values
      states:
      - matches-one-expected-value
      check_existence: some
      check: any
  evaluate:
    test: test-combined-values
