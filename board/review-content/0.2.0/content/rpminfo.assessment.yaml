# SCAP_1.4/OVAL_Test_Content/linux/linux-def_rpminfo_test.xml
# Selected source Test: oval:navy.navwar.niwcatlantic.scc.test:tst:1
assessment:
  id: board.rpminfo
  version: 1
  assessment_title: Confirm the gnome-session RPM information
  mode: automated
  class: miscellaneous
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.2.0
  objects:
    gnome-session-package:
      object_title: Installed gnome-session package
      capability: linux.rpminfo
      select:
        package_name:
          value: gnome-session
          operation: equal
          datatype: string
      collect:
        include_file_paths: false
  states:
    expected-gnome-session-package:
      state_title: Expected gnome-session package information
      capability: linux.rpminfo
      state:
        all:
        - field: package_name
          value: gnome-session
          operation: equal
          datatype: string
          match: all
          existence: some
        - field: architecture
          value: .+
          operation: match
          datatype: string
          match: all
          existence: some
        - field: epoch
          value: .+
          operation: match
          datatype: string
          match: all
          existence: some
        - field: release
          value: .+
          operation: match
          datatype: string
          match: all
          existence: some
  tests:
    test-gnome-session-package:
      test_title: Test gnome-session package information
      capability: linux.rpminfo
      object: gnome-session-package
      check_existence: some
      check: all
      states:
      - expected-gnome-session-package
      reported_elements: all
  evaluate:
    test: test-gnome-session-package
