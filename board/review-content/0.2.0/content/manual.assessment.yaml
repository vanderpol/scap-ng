assessment:
  id: board.manual-review
  version: 1
  assessment_title: Verify a requirement that requires human judgment
  mode: manual
  class: compliance
  purpose: assessment
  procedure: Review the system configuration and supporting evidence, then record the technical determination.
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: "true"
    - value: fail
      label: Fail
      outcome: "false"
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
