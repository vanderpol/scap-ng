assessment:
  id: board.family
  version: 1
  assessment_title: System family matches the source family expression
  mode: automated
  class: miscellaneous
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.2.0
  variables:
    family-pattern:
      kind: constant
      datatype: string
      variable_title: Family pattern
      value: (vmware_infrastructure|panos|aix|junos|aws|iosxe|ios|macos|unix|windows)
  states:
    family-matches-pattern:
      state_title: Family matches pattern
      capability: independent.family
      state:
        field: family
        value:
          variable: family-pattern
        operation: match
        datatype: string
        match: all
        variable_match: all
        existence: some
  tests:
    test-system-family:
      test_title: Test system family
      capability: independent.family
      reported_elements: all
      check_existence: some
      check: any
      states:
      - family-matches-pattern
  evaluate:
    test: test-system-family
