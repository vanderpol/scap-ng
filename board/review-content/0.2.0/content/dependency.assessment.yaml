assessment:
  id: board.dependency
  version: 1
  assessment_title: On UNIX, reuse the exact-file Assessment result
  mode: automated
  class: miscellaneous
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.2.0
  states:
    unix:
      state_title: The observed system family is UNIX
      capability: independent.family
      state:
        field: family
        datatype: string
        operation: equal
        value: unix
        match: all
        existence: some
  tests:
    test-unix:
      test_title: Establish target family before invoking the file check
      capability: independent.family
      states:
      - unix
      check_existence: some
      check: all
  evaluate:
    if:
      test: test-unix
    then:
      all:
      - assessment: file
      - assessment: file
    else:
      not_applicable:
        reason: This UNIX file example does not apply to the observed family
  dependencies:
    file:
      assessment: unix-file.assessment.yaml
      expected_id: board.unix-file
      expected_version: 3
