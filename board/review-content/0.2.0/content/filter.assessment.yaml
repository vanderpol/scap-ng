assessment:
  id: board.filter
  version: 1
  assessment_title: Chained observed Variables drive a filter before nested Set intersection
  mode: automated
  class: miscellaneous
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.2.0
  objects:
    primary-target-file:
      object_title: Primary target file
      capability: unix.file
      select:
        full_path:
          datatype: string
          operation: equal
          value: /fixture/a
      filesystem: local
    secondary-target-file:
      object_title: Secondary target file
      capability: unix.file
      select:
        full_path:
          datatype: string
          operation: equal
          value: /fixture/b
      filesystem: local
    extra-candidate-file:
      object_title: Additional candidate outside the target pair
      capability: unix.file
      select:
        full_path:
          datatype: string
          operation: equal
          value: /fixture/c
      filesystem: local
    candidate-files:
      object_title: Union of the three candidate file Objects
      capability: unix.file
      set:
        operator: union
        operands:
        - object: primary-target-file
          filters: []
        - object: secondary-target-file
          filters: []
        - object: extra-candidate-file
          filters: []
    filtered-target-files:
      object_title: Exclude matching owners, then intersect with the target-file pair
      capability: unix.file
      set:
        operator: intersection
        operands:
        - object: candidate-files
          filters:
          - action: exclude
            state: owner-in-excluded-band
        - set:
            operator: union
            operands:
            - object: primary-target-file
              filters: []
            - object: secondary-target-file
              filters: []
    owner-reference-file:
      object_title: Independent file supplying the reference owner UID
      capability: unix.file
      select:
        full_path:
          datatype: string
          operation: equal
          value: /fixture/reference
      filesystem: local
  variables:
    reference-uid:
      variable_title: Extract UID from the independent reference Object
      kind: local
      datatype: integer
      expression:
        values:
          object: owner-reference-file
          field: owner_uid
    uid-step:
      variable_title: One UID step
      kind: constant
      datatype: integer
      value: 1
    first-excluded-uid:
      variable_title: Reference UID plus one
      kind: local
      datatype: integer
      expression:
        arithmetic:
          operation: add
          operands:
          - variable: reference-uid
          - variable: uid-step
    uid-band-offsets:
      variable_title: Two positions in the exclusion band
      kind: constant
      datatype: integer
      value:
      - 0
      - 1
    excluded-owner-uids:
      variable_title: Cartesian addition of next UID and the two offsets
      kind: local
      datatype: integer
      expression:
        arithmetic:
          operation: add
          operands:
          - variable: first-excluded-uid
          - variable: uid-band-offsets
    filter-owner-uids:
      variable_title: Shared Variable-component view used for each filter comparison
      kind: local
      datatype: integer
      expression:
        variable: excluded-owner-uids
  states:
    owner-in-excluded-band:
      state_title: Owner matches any computed exclusion value
      capability: unix.file
      state:
        field: owner_uid
        datatype: integer
        operation: equal
        value:
          variable: filter-owner-uids
        variable_match: any
        match: all
        existence: some
  tests:
    test-one-filtered-file:
      test_title: Exactly one file survives
      capability: unix.file
      reported_elements: all
      object: filtered-target-files
      check_existence: one
      check: all
  evaluate:
    test: test-one-filtered-file
