assessment:
  id: board.family
  version: 1
  assessment_title: Evaluate to true if the ind-def:family_test is properly supported
  mode: automated
  class: miscellaneous
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.2.0
  variables:
    family-pattern:
      title: This variable contains a regular expression that matches the regular
        expression '(vmware_infrastructure|panos|aix|junos|aws|iosxe|ios|macos|unix|windows)'.
      kind: constant
      datatype: string
      expression:
        literal: (vmware_infrastructure|panos|aix|junos|aws|iosxe|ios|macos|unix|windows)
  states:
    family-matches-pattern:
      state_title: This variable_state represents any family that is in the EntityStateFamilyType
        (ios, macos, unix, windows).
      capability: independent.family
      state:
        field: family
        value:
          variable: family-pattern
        operation: match
        datatype: string
        match: all
        variable_match: all
        existence: some
  tests:
    test-system-family:
      test_title: Test that the family_object is supported.
      capability: independent.family
      reported_elements: all
      check_existence: some
      check: any
      states:
      - family-matches-pattern
  evaluate:
    test: test-system-family
