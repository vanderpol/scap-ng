assessment:
  id: board.directory-filter
  version: 1
  assessment_title: Evaluate to true if the oval-def:set construct is properly supported
  mode: automated
  class: miscellaneous
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.2.0
  objects:
    filtered-support-directory-object:
      capability: unix.file
      set:
        operator: union
        operands:
        - object: support-directory-object
          filters:
          - action: exclude
            state: excluded-directory-state
      object_title: This object represents a file_object that is the set {a,b,c} filtered
        by b and c which equals set {a}.
    support-directory-object:
      capability: unix.file
      select:
        directory:
          value: /opt/support/txt
          operation: equal
          datatype: string
        name: null
      object_title: This object represents a file_object with a path that matches
        the regular expression 'C:\\support\\txt.*'.
      filesystem: local
  variables:
    excluded-directories-variable:
      title: This constant_variable represents the string values 'C:\support\txt\txtfile'
        and 'C:\support\txt\txtfile\subtxtfile'.
      kind: constant
      datatype: string
      expression:
        literal:
        - /opt/support/txt/txtfile
        - /opt/support/txt/txtfile/subtxtfile
  states:
    excluded-directory-state:
      state_title: This file_state represents a file_object with a path that equals
        'C:\support\txt\txtfile' or 'C:\support\txt\txtfile\subtxtfile'.
      capability: unix.file
      state:
        field: directory
        value:
          variable: excluded-directories-variable
        operation: equal
        datatype: string
        match: all
        variable_match: one
        existence: some
    support-directory-state:
      state_title: This file_state represents a file_object with a path equal to 'C:\support\txt'.
      capability: unix.file
      state:
        field: directory
        value: /opt/support/txt
        operation: equal
        datatype: string
        match: all
        existence: some
  tests:
    test-filtered-support-directory:
      test_title: Test that the set object is supported with the filter element.
      capability: unix.file
      object: filtered-support-directory-object
      check_existence: one
      check: all
      states:
      - support-directory-state
      reported_elements: all
  evaluate:
    test: test-filtered-support-directory
