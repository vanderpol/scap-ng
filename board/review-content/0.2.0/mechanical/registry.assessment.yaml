assessment:
  id: board.registry
  version: 1
  assessment_title: Evaluate to true if the win-def:registry_test is properly supported.
  mode: automated
  class: miscellaneous
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.2.0
  objects:
    windows-version-entry:
      capability: windows.registry
      select:
        hive: local_machine
        key:
          value: SOFTWARE\Microsoft\Windows NT\CurrentVersion
          operation: equal
          datatype: string
        name:
          value: CurrentVersion
          operation: equal
          datatype: string
      object_title: Retrieve a registry_object with a hive equal to 'HKEY_LOCAL_MACHINE',
        key equal to 'SOFTWARE\Microsoft\Windows NT\CurrentVersion', and name equal
        to 'CurrentVersion'.
  states:
    expected-version-address:
      state_title: This registry_state represents a registry_object with a hive equal
        to 'HKEY_LOCAL_MACHINE', key equal to 'SOFTWARE\Microsoft\Windows NT\CurrentVersion',
        and name equal to 'CurrentVersion'.
      capability: windows.registry
      state:
        all:
        - field: hive
          value: local_machine
          operation: equal
          datatype: string
          match: all
          existence: some
        - field: key
          value: SOFTWARE\Microsoft\Windows NT\CurrentVersion
          operation: equal_ci
          datatype: string
          match: all
          existence: some
        - field: name
          value: CurrentVersion
          operation: equal
          datatype: string
          match: all
          existence: some
  tests:
    test-windows-version-address:
      test_title: Test if a registry_object with a hive, key, and name is supported.
      capability: windows.registry
      object: windows-version-entry
      check_existence: some
      check: one
      states:
      - expected-version-address
      reported_elements: all
  evaluate:
    test: test-windows-version-address
