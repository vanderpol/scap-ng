assessment:
  id: board.unix-file
  version: 3
  assessment_title: Evaluate to true if the unix-def:file_test is properly supported
  mode: automated
  class: miscellaneous
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.2.0
  objects:
    support-build-file:
      capability: unix.file
      select:
        full_path:
          value: /opt/support/txt/txtfile/build.win32.txt
          operation: equal
          datatype: string
      object_title: Retrieve a file_item with the filepath equal to '/opt/support/txt/txtfile/build.win32.txt'.
      filesystem: any
  states:
    expected-build-file-path:
      state_title: This state represents a file_item with the filepath equal to '/opt/support/txt/txtfile/build.win32.txt'.
      capability: unix.file
      state:
        field: full_path
        value: /opt/support/txt/txtfile/build.win32.txt
        operation: equal
        datatype: string
        match: all
        existence: some
  tests:
    test-build-file-path:
      test_title: Expect 'true' with 1 item. Test that the file_object is supported
        with filepath entity equal to some value.
      capability: unix.file
      reported_elements: all
      object: support-build-file
      check_existence: some
      check: all
      states:
      - expected-build-file-path
  evaluate:
    test: test-build-file-path
