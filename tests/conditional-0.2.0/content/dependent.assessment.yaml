# EXPERIMENTAL syntax; outcome fixtures are separate from authored source.
assessment:
  id: conditional.dependent
  version: 1
  assessment_title: 'Experimental conditional: dependent'
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.experimental.conditional
    version: proposal-01
  dependencies:
    role:
      assessment: role.assessment.yaml
      expected_id: conditional.role
      expected_version: 1
      purpose: applicability
  variables:
    then:
      variable_title: then
      kind: constant
      datatype: boolean
      value: true
    else:
      variable_title: else
      kind: constant
      datatype: boolean
      value: true
  states:
    is-true:
      state_title: Value is true
      capability: variable.value
      state:
        field: value
        datatype: boolean
        operation: equal
        value: true
        match: all
        existence: some
  tests:
    test-then:
      test_title: then
      capability: variable.value
      variable: then
      states:
      - is-true
      existence: some
      match: all
    test-else:
      test_title: else
      capability: variable.value
      variable: else
      states:
      - is-true
      existence: some
      match: all
  evaluate:
    if:
      assessment: role
    then:
      test: test-then
    else:
      test: test-else
