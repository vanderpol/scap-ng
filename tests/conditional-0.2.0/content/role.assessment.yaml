# EXPERIMENTAL syntax; outcome fixtures are separate from authored source.
assessment:
  id: conditional.role
  version: 1
  assessment_title: 'Experimental conditional: role'
  mode: automated
  class: compliance
  purpose: applicability
  specification:
    id: scap-ng.experimental.conditional
    version: proposal-01
  variables:
    role:
      variable_title: role
      kind: constant
      datatype: boolean
      value: true
  states:
    is-true:
      state_title: Value is true
      capability: variable.value
      state:
        field: value
        datatype: boolean
        operation: equal
        value: true
        match: all
        existence: some
  tests:
    test-role:
      test_title: role
      capability: variable.value
      reported_elements: all
      variable: role
      states:
      - is-true
      existence: some
      match: all
  evaluate:
    test: test-role
