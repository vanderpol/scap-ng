# EXPERIMENTAL syntax; outcome fixtures are separate from authored source.
assessment:
  id: conditional.branch-dependency
  version: 1
  assessment_title: 'Experimental conditional: branch-dependency'
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.experimental.conditional
    version: proposal-01
  dependencies:
    role:
      assessment: role.assessment.yaml
      expected_id: conditional.role
      expected_version: 1
      purpose: applicability
  variables:
    guard:
      variable_title: guard
      kind: constant
      datatype: boolean
      value: true
    else:
      variable_title: else
      kind: constant
      datatype: boolean
      value: true
  states:
    is-true:
      state_title: Value is true
      capability: variable.value
      reported_elements: all
      state:
        field: value
        datatype: boolean
        operation: equal
        value: true
        match: all
        existence: some
  tests:
    test-guard:
      test_title: guard
      capability: variable.value
      reported_elements: all
      variable: guard
      states:
      - is-true
      existence: some
      match: all
    test-else:
      test_title: else
      capability: variable.value
      reported_elements: all
      variable: else
      states:
      - is-true
      existence: some
      match: all
  evaluate:
    if:
      test: test-guard
    then:
      assessment: role
    else:
      test: test-else
