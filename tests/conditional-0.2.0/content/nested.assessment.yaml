# EXPERIMENTAL syntax; outcome fixtures are separate from authored source.
assessment:
  id: conditional.nested
  version: 1
  assessment_title: 'Experimental conditional: nested'
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.experimental.conditional
    version: proposal-01
  variables:
    guard:
      variable_title: guard
      kind: constant
      datatype: boolean
      value: true
    inner:
      variable_title: inner
      kind: constant
      datatype: boolean
      value: true
    then:
      variable_title: then
      kind: constant
      datatype: boolean
      value: true
    alternate:
      variable_title: alternate
      kind: constant
      datatype: boolean
      value: true
    else:
      variable_title: else
      kind: constant
      datatype: boolean
      value: true
  states:
    is-true:
      state_title: Value is true
      capability: variable.value
      state:
        field: value
        datatype: boolean
        operation: equal
        value: true
        match: all
        existence: some
  tests:
    test-guard:
      test_title: guard
      capability: variable.value
      reported_elements: all
      variable: guard
      states:
      - is-true
      existence: some
      match: all
    test-inner:
      test_title: inner
      capability: variable.value
      reported_elements: all
      variable: inner
      states:
      - is-true
      existence: some
      match: all
    test-then:
      test_title: then
      capability: variable.value
      reported_elements: all
      variable: then
      states:
      - is-true
      existence: some
      match: all
    test-alternate:
      test_title: alternate
      capability: variable.value
      reported_elements: all
      variable: alternate
      states:
      - is-true
      existence: some
      match: all
    test-else:
      test_title: else
      capability: variable.value
      reported_elements: all
      variable: else
      states:
      - is-true
      existence: some
      match: all
  evaluate:
    if:
      test: test-guard
    then:
      if:
        test: test-inner
      then:
        test: test-then
      else:
        test: test-alternate
    else:
      test: test-else
