assessment:
  id: foreach-home-files
  version: 1
  assessment_title: Collect initialization files from selected user home directories
  mode: automated
  class: compliance
  purpose: assessment

  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.3.0

  shared_objects:
    users-object:
      object_title: Selected local users
      capability: unix.password
      select:
        username:
          value: .+
          operation: pattern_match
          datatype: string

    initialization-files-object:
      object_title: Initialization files in selected user home directories
      capability: unix.file
      for_each:
        item: user
        in: users-object
      select:
        directory:
          from: user.home_dir
        name:
          value: '^\.[^\s\.]+'
          operation: pattern_match
          datatype: string
      filesystem: all

  tests:
    initialization-files-exist-test:
      test_title: Initialization files are collected as one target population
      reported_elements: compared
      capability: unix.file
      object: initialization-files-object
      existence: optional
      match: all

  evaluate:
    test: initialization-files-exist-test
