assessment:
  id: esx.fixture.acceptancelevel
  version: 1
  assessment_title: Synthetic ESXi host acceptancelevel check
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.2.0
  objects:
    selected:
      object_title: Acquire host-wide acceptancelevel observations
      capability: esx.host_acceptancelevel
      select: {}
  states:
    expected:
      state_title: Expected fixture value
      capability: esx.host_acceptancelevel
      state:
        field: acceptance_level
        datatype: string
        operation: equal
        value: VMwareCertified
        match: all
        existence: some
  tests:
    test-check:
      test_title: Compare host-wide acceptancelevel
      capability: esx.host_acceptancelevel
      object: selected
      states:
      - expected
      existence: some
      match: all
      reported_elements: compared
  evaluate:
    test: test-check
