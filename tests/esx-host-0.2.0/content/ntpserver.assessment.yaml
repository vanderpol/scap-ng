assessment:
  id: esx.fixture.ntpserver
  version: 1
  assessment_title: Synthetic ESXi host ntpserver check
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.2.0
  objects:
    selected:
      object_title: Acquire host-wide ntpserver observations
      capability: esx.host_ntpserver
      select: {}
  states:
    expected:
      state_title: Expected fixture value
      capability: esx.host_ntpserver
      state:
        field: ntp_server_name
        datatype: string
        operation: equal
        value: time.example.test
        match: all
        existence: some
  tests:
    test-check:
      test_title: Compare host-wide ntpserver
      capability: esx.host_ntpserver
      object: selected
      states:
      - expected
      existence: some
      match: all
      reported_elements: compared
  evaluate:
    test: test-check
