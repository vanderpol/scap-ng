assessment:
  id: results.conditional
  version: 1
  assessment_title: Invoke ownership only when the guard is true
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.2.0
  variables:
    guard:
      variable_title: guard
      kind: constant
      datatype: boolean
      value: true
  states:
    is-true:
      state_title: Value is true
      capability: variable.value
      state:
        field: value
        datatype: boolean
        operation: equal
        value: true
        match: all
        existence: some
  tests:
    test-guard:
      test_title: guard
      capability: variable.value
      reported_elements: all
      variable: guard
      states:
      - is-true
      existence: some
      match: all
  evaluate:
    if:
      test: test-guard
    then:
      all:
      - assessment: ownership
      - assessment: ownership
    else:
      not_applicable:
        reason: Ownership is outside this fixture scope
  dependencies:
    ownership:
      assessment: ownership.assessment.yaml
      expected_id: results.ownership
      expected_version: 1
