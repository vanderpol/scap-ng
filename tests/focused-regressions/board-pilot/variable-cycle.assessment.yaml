assessment:
  id: pilot.variable-cycle
  version: 1
  assessment_title: A single integer equals 9 and every listed integer exceeds 7
  mode: automated
  class: miscellaneous
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.2.0
  variables:
    left-cycle-value:
      variable_title: Left cycle value depends on right cycle value
      kind: local
      datatype: integer
      expression:
        variable: right-cycle-value
    right-cycle-value:
      variable_title: Right cycle value depends on left cycle value
      kind: local
      datatype: integer
      expression:
        variable: left-cycle-value
  states:
    equals-nine:
      state_title: Exactly 9
      capability: variable.value
      state:
        field: value
        datatype: integer
        operation: equal
        value: 9
        match: all
        existence: some
  tests:
    test-cycle:
      test_title: Invalid cycle source
      capability: variable.value
      variable: left-cycle-value
      states:
      - equals-nine
      check_existence: some
      check: all
  evaluate:
    test: test-cycle
