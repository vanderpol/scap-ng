format: scap-ng-existence-conformance-0.1
description: Base truth-table cases for first-class expected-state existence semantics.
cases:
  - id: expected-none-observed-zero
    expected_existence: none
    observed_count: 0
    expected_outcome: pass
    expected_reason: expected_absence
  - id: expected-none-observed-one
    expected_existence: none
    observed_count: 1
    expected_outcome: fail
    expected_reason: unexpected_existence
  - id: expected-none-observed-many
    expected_existence: none
    observed_count: 4
    expected_outcome: fail
    expected_reason: unexpected_existence
  - id: expected-one-or-more-observed-zero
    expected_existence: one_or_more
    observed_count: 0
    expected_outcome: fail
    expected_reason: required_item_missing
  - id: expected-one-or-more-observed-one
    expected_existence: one_or_more
    observed_count: 1
    expected_outcome: pass
    expected_reason: expected_existence
  - id: expected-one-or-more-observed-many
    expected_existence: one_or_more
    observed_count: 4
    expected_outcome: pass
    expected_reason: expected_existence
