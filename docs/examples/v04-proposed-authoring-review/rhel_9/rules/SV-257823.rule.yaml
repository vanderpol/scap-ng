rule:
  id: rhel-9-must-be-configured-so-that-the-cryptographic-hashes-of-system-f-a8410393-rule
  version: RHEL-09-214030
  title: RHEL 9 must be configured so that the cryptographic hashes of system files match vendor values.
  severity: medium
  role: full
  weight: 10.0
  discussion: '<VulnDiscussion>The hashes of important files such as system executables should match the information given by the RPM database. Executables with erroneous hashes could be a sign of nefarious activity on the system.

    If the Check Text command returns results from third-party software vendors, it is an indication that the vendor is not implementing their rpm packages correctly and this must be corrected by the software vendor.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
