rule:
  id: rhel-9-systems-using-domain-name-servers-dns-resolution-must-have-at-l-cfb05036-rule
  version: RHEL-09-252035
  title: RHEL 9 systems using Domain Name Servers (DNS) resolution must have at least two name servers configured.
  severity: medium
  role: full
  weight: 10.0
  discussion: <VulnDiscussion>To provide availability for name resolution services, multiple redundant name servers are mandated. A failure in name resolution could lead to the failure of security functions requiring name resolution, which may include time synchronization, centralized authentication, and remote system logging.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
