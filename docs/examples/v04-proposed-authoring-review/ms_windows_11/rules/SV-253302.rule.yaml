rule:
  id: the-minimum-password-age-must-be-configured-to-at-least-1-day-a287edf2-rule
  version: WN11-AC-000030
  title: The minimum password age must be configured to at least 1 day.
  severity: medium
  role: full
  weight: 10.0
  discussion: <VulnDiscussion>Permitting passwords to be changed in immediate succession within the same day allows users to cycle passwords through their history database. This enables users to effectively negate the purpose of mandating periodic password changes.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
