rule:
  id: the-number-of-allowed-bad-logon-attempts-must-be-configured-to-three-o-ba31d3e6-rule
  version: WN11-AC-000010
  title: The number of allowed bad logon attempts must be configured to three or less.
  severity: medium
  role: full
  weight: 10.0
  discussion: <VulnDiscussion>The account lockout feature, when enabled, prevents brute-force password attacks on the system. The higher this value is, the less effective the account lockout feature will be in protecting the local system. The number of bad logon attempts must be reasonably small to minimize the possibility of a successful password attack, while allowing for honest errors made during a normal user logon.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  rationale: null
