rule:
  id: the-access-credential-manager-as-a-trusted-caller-user-right-must-not-ac7d1897-rule
  version: WN11-UR-000005
  title: The "Access Credential Manager as a trusted caller" user right must not be assigned to any groups or accounts.
  severity: medium
  role: full
  weight: 10.0
  discussion: '<VulnDiscussion>Inappropriate granting of user rights can provide system, administrative, and other high-level capabilities.


