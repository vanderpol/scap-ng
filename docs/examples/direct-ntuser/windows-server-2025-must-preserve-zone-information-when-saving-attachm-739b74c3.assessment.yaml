assessment:
  id: windows-server-2025-must-preserve-zone-information-when-saving-attachm-739b74c3-assessment
  version: 1
  assessment_title: Windows Server 2025 must preserve zone information when saving attachments.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    do-not-preserve-zone-information-in-file-attachments-is-set-to-not-con-83bb83b2-test:
      test_title: '''Do not preserve zone information in file attachments'' is set to ''Not Configured'' or ''Disabled'''
      capability: windows.ntuser
      object:
        key: {equals: 'Software\Microsoft\Windows\CurrentVersion\Policies\Attachments'}
        name: {equals: SaveZoneInformation}
        include_default: false
        item_creation: key_and_name_exist
        filters:
        - exclude:
            enabled: {equals: false, datatype: boolean, values_found: one_or_more, values_matching: every}
        - exclude:
            days_since_modified: {greater_than: 35, datatype: integer, values_found: one_or_more, values_matching: every}
      require:
        items_found: may_be_absent
        items_satisfying: every
        and:
        - fields:
            type: {equals: dword, values_found: one_or_more, values_matching: every}
        - fields:
            value: {equals: 2, datatype: integer, values_found: one_or_more, values_matching: every}
      reported_elements: all
    for-the-current-user-do-not-preserve-zone-information-in-file-attachme-73357677-test:
      test_title: For the current user, 'Do not preserve zone information in file attachments' is set to 'Not Configured' or 'Disabled'
      capability: windows.registry
      object: {hive: {equals: current_user}, key: {equals: 'Software\Microsoft\Windows\CurrentVersion\Policies\Attachments'}, name: {equals: SaveZoneInformation}}
      require:
        items_found: may_be_absent
        items_satisfying: every
        and:
        - fields:
            type: {equals: dword, values_found: one_or_more, values_matching: every}
        - fields:
            value: {equals: 2, datatype: integer, values_found: one_or_more, values_matching: every}
      reported_elements: all
  evaluate:
    and:
    - test: do-not-preserve-zone-information-in-file-attachments-is-set-to-not-con-83bb83b2-test
    - test: for-the-current-user-do-not-preserve-zone-information-in-file-attachme-73357677-test
