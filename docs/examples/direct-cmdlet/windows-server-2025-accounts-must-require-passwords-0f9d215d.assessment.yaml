assessment:
  id: windows-server-2025-accounts-must-require-passwords-0f9d215d-assessment
  version: 1
  assessment_title: Windows Server 2025 accounts must require passwords.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  shared_objects:
    wmi57-namespace-equals-root-cimv2-wql-equals-select-domainrole-from-wi-abdfaa4d-object:
      capability: windows.wmi.query
      namespace: 'root\cimv2'
      query: SELECT DomainRole FROM win32_computersystem
      object_title: 'Wmi57: namespace equals ''root\\cimv2''; wql equals ''SELECT DomainRole FROM win32_computersystem'''
  tests:
    windows-server-accounts-must-require-passwords-a9bd8f67-test:
      test_title: Windows Server - Accounts must require passwords.
      capability: windows.cmdlet
      object:
        module_name: CimCmdlets
        module_id: null
        module_version: null
        verb: Get
        noun: CimInstance
        parameters:
          fields:
            class: {equals: Win32_Useraccount, selection_match: every}
            filter: {equals: PasswordRequired=False and LocalAccount=True and Disabled=false, selection_match: every}
        select:
          fields:
            first: {equals: '100', selection_match: every}
      require:
        items_found: none
      reported_elements: all
    the-system-is-a-windows-standalone-server-or-a-windows-domain-member-s-db3d4a1d-test:
      test_title: The system is a Windows Standalone Server or a Windows Domain Member Server
      capability: windows.wmi.query
      object: wmi57-namespace-equals-root-cimv2-wql-equals-select-domainrole-from-wi-abdfaa4d-object
      require:
        items_found: one_or_more
        items_satisfying: every
        or:
        - fields:
            result:
              record:
                records_found: one_or_more
                records_matching: every
                fields:
                  domainrole: {equals: '2', values_found: one_or_more, values_matching: every}
        - fields:
            result:
              record:
                records_found: one_or_more
                records_matching: every
                fields:
                  domainrole: {equals: '3', values_found: one_or_more, values_matching: every}
      reported_elements: all
    windows-domain-controller-accounts-must-require-passwords-6c8d656a-test:
      test_title: Windows Domain Controller - Accounts must require passwords.
      capability: windows.cmdlet
      object:
        module_name: ActiveDirectory
        module_id: null
        module_version: null
        verb: Get
        noun: ADUser
        parameters:
          fields:
            filter: {equals: (Enabled -eq $True) -and (PasswordNotRequired -eq $True), selection_match: every}
            properties: {equals: PasswordNotRequired, selection_match: every}
        select:
          fields:
            first: {equals: '100', selection_match: every}
      require:
        items_found: may_be_absent
        items_satisfying: every
        fields:
          value:
            record:
              records_found: one_or_more
              records_matching: none
              fields:
                passwordnotrequired: {case_insensitive_equals: 'true', values_found: one_or_more, values_matching: every}
                enabled: {case_insensitive_equals: 'true', values_found: one_or_more, values_matching: every}
      reported_elements: all
    the-system-is-a-windows-domain-controller-59b662b5-test:
      test_title: The system is a Windows Domain Controller
      capability: windows.wmi.query
      object: wmi57-namespace-equals-root-cimv2-wql-equals-select-domainrole-from-wi-abdfaa4d-object
      require:
        items_found: one_or_more
        items_satisfying: every
        or:
        - fields:
            result:
              record:
                records_found: one_or_more
                records_matching: every
                fields:
                  domainrole: {equals: '4', values_found: one_or_more, values_matching: every}
        - fields:
            result:
              record:
                records_found: one_or_more
                records_matching: every
                fields:
                  domainrole: {equals: '5', values_found: one_or_more, values_matching: every}
      reported_elements: all
  evaluate:
    or:
    - and:
      - test: windows-server-accounts-must-require-passwords-a9bd8f67-test
      - test: the-system-is-a-windows-standalone-server-or-a-windows-domain-member-s-db3d4a1d-test
    - and:
      - test: windows-domain-controller-accounts-must-require-passwords-6c8d656a-test
      - test: the-system-is-a-windows-domain-controller-59b662b5-test
