rule:
  id: rhel-9-must-use-a-separate-file-system-for-var-tmp-dbe22685-rule
  version: RHEL-09-231035
  title: RHEL 9 must use a separate file system for /var/tmp.
  severity: medium
  role: full
  weight: 10.0
  discussion: <VulnDiscussion>The "/var/tmp" partition is used as temporary storage by many programs. Placing "/var/tmp" in its own partition enables the setting of more restrictive mount options, which can help protect programs that use it.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
