rule:
  id: rhel-9-must-restrict-exposed-kernel-pointer-addresses-access-08161cd9-rule
  version: RHEL-09-213025
  title: RHEL 9 must restrict exposed kernel pointer addresses access.
  severity: medium
  role: full
  weight: 10.0
  discussion: '<VulnDiscussion>It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore may remain unsecured. They increase the risk to the platform by providing additional attack vectors.


    The sysctl --system command will load settings from all system configuration files. All configuration files are sorted by their filename in lexicographical order, regardless of the directories in which they reside. If multiple files specify the same option, the entry in the file with the lexicographically latest name will take precedence. Files are read from directories in the following list from top to bottom. Once a file of a given filename is loaded, any file of the same name in subsequent directories is ignored.


    /etc/sysctl.d/*.conf

    /run/sysctl.d/*.conf

    /usr/local/lib/sysctl.d/*.conf

    /usr/lib/sysctl.d/*.conf

    /lib/sysctl.d/*.conf

    /etc/sysctl.conf


    Satisfies: SRG-OS-000132-GPOS-00067, SRG-OS-000433-GPOS-00192, SRG-OS-000480-GPOS-00227</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
