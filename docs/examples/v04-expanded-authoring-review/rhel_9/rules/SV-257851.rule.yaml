rule:
  id: rhel-9-must-prevent-files-with-the-setuid-and-setgid-bit-set-from-bein-fd9ad733-rule
  version: RHEL-09-231050
  title: RHEL 9 must prevent files with the setuid and setgid bit set from being executed on file systems that contain user home directories.
  severity: medium
  role: full
  weight: 10.0
  discussion: '<VulnDiscussion>The "nosuid" mount option causes the system to not execute "setuid" and "setgid" files with owner privileges. This option must be used for mounting any file system not containing approved "setuid" and "setguid" files. Executing files from untrusted file systems increases the opportunity for nonprivileged users to attain unauthorized administrative access.


    Satisfies: SRG-OS-000368-GPOS-00154, SRG-OS-000480-GPOS-00227</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
