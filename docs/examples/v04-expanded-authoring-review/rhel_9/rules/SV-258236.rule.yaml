rule:
  id: rhel-9-cryptographic-policy-must-not-be-overridden-4af53d2d-rule
  version: RHEL-09-672020
  title: RHEL 9 cryptographic policy must not be overridden.
  severity: high
  role: full
  weight: 10.0
  discussion: '<VulnDiscussion>Centralized cryptographic policies simplify applying secure ciphers across an operating system and the applications that run on that operating system. Use of weak or untested encryption algorithms undermines the purposes of using encryption to protect data.


