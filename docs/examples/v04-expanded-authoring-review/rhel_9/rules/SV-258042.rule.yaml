rule:
  id: rhel-9-user-account-passwords-must-have-a-60-day-maximum-password-life-acf9336c-rule
  version: RHEL-09-411015
  title: RHEL 9 user account passwords must have a 60-day maximum password lifetime restriction.
  severity: medium
  role: full
  weight: 10.0
  discussion: <VulnDiscussion>Any password, no matter how complex, can eventually be cracked; therefore, passwords need to be changed periodically. If RHEL 9 does not limit the lifetime of passwords and force users to change their passwords, there is the risk that RHEL 9 passwords could be compromised.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
