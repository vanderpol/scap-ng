assessment:
  id: rhel-9-cryptographic-policy-must-not-be-overridden-4af53d2d-assessment
  version: 1
  assessment_title: RHEL 9 cryptographic policy must not be overridden.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    bind-1e3d3439-test:
      test_title: bind
      capability: unix.symlink
      object:
        full_path: {equals: /etc/crypto-policies/back-ends/bind.config}
      require:
        items_found: one_or_more
        items_satisfying: every
        fields:
          canonical_path: {equals: /usr/share/crypto-policies/FIPS/bind.txt, values_found: one_or_more, values_matching: every}
      reported_elements: all
    gnutls-4772fc31-test:
      test_title: gnutls
      capability: unix.symlink
      object:
        full_path: {equals: /etc/crypto-policies/back-ends/gnutls.config}
