rule:
  id: windows-11-account-lockout-duration-must-be-configured-to-15-minutes-o-72cc5076-rule
  version: WN11-AC-000005
  title: Windows 11 account lockout duration must be configured to 15 minutes or greater.
  severity: medium
  role: full
  weight: 10.0
