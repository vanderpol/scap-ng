rule:
  id: windows-11-permissions-for-the-application-event-log-must-prevent-acce-eebfb3d5-rule
  version: WN11-AU-000515
  title: Windows 11 permissions for the Application event log must prevent access by non-privileged accounts.
  severity: medium
  role: full
  weight: 10.0
  discussion: <VulnDiscussion>Maintaining an audit trail of system activity logs can help identify configuration errors, troubleshoot service disruptions, and analyze compromises that have occurred, as well as detect attacks. Audit logs are necessary to provide a trail of evidence in case the system or network is compromised. The Application event log may be susceptible to tampering if proper permissions are not applied.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>
  rationale: null
  extensions: {}
