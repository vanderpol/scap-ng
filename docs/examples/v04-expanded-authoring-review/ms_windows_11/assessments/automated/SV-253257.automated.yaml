assessment:
  id: secure-boot-must-be-enabled-on-windows-11-systems-f4e25803-assessment
  version: 1
  assessment_title: Secure Boot must be enabled on Windows 11 systems.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    run-a-powershell-command-to-determine-if-secure-boot-must-be-enabled-13adf184-test:
      test_title: Run a PowerShell command to determine if Secure Boot must be enabled.
      capability: independent.shellcommand
      object:
        shell: powershell
        command: Confirm-SecureBootUEFI
        pattern: ''
        error_if_exit_status_not_0: false
        error_if_stderr_exists: false
      require:
        items_found: one_or_more
        items_satisfying: every
        fields:
          stdout_line: {equals: 'True', values_found: one_or_more, values_matching: every}
      reported_elements: all
  evaluate:
    test: run-a-powershell-command-to-determine-if-secure-boot-must-be-enabled-13adf184-test
