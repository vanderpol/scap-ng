assessment:
  id: the-system-must-be-configured-to-audit-account-logon-credential-valida-21138192-assessment
  version: 1
  assessment_title: The system must be configured to audit Account Logon - Credential Validation failures.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    audit-credential-validation-is-set-to-failure-34e9ab02-test:
      test_title: '''Audit Credential Validation'' is set to ''Failure'''
      capability: windows.auditeventpolicysubcategories
      require:
        items_found: one_or_more
        items_satisfying: every
        fields:
          credential_validation: {equals: AUDIT_FAILURE, values_found: one_or_more, values_matching: every}
      reported_elements: all
    audit-credential-validation-is-set-to-success-and-failure-251fa97b-test:
      test_title: '''Audit Credential Validation'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      require:
        items_found: one_or_more
        items_satisfying: every
        fields:
          credential_validation: {equals: AUDIT_SUCCESS_FAILURE, values_found: one_or_more, values_matching: every}
      reported_elements: all
  evaluate:
    or:
    - test: audit-credential-validation-is-set-to-failure-34e9ab02-test
    - test: audit-credential-validation-is-set-to-success-and-failure-251fa97b-test
