# Candidate B: owner-review proposal only; not active 0.4 grammar.
# The source-equivalent full-path form is shown for migration review.
assessment:
  id: issue21-filesystem-selector-alternative-b
  version: 1
  assessment_title: Candidate B filesystem selector vocabulary
  mode: automated
  class: compliance
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    file-selector-test:
      test_title: Select one known Unix configuration file.
      capability: unix.file
      object:
        full_path: {equals: /etc/ssh/sshd_config}
      require:
        item_requirement: {items_found: one_or_more, items_satisfying: every}
        field_requirement: {values_found: one_or_more, values_matching: every}
        fields: {type: {equals: regular}}
      reported_elements: all
  evaluate:
    test: file-selector-test
