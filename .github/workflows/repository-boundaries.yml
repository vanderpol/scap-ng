name: Repository preservation and current/archive boundaries

on:
  push:
    branches: [main]
    paths:
      - docs/repository-policy.json
      - tools/audit_repository_layout.py
      - .github/workflows/**
  pull_request:
    paths:
      - docs/repository-policy.json
      - tools/audit_repository_layout.py
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python tools/audit_repository_layout.py --check
  preserve:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const policy = JSON.parse(fs.readFileSync('docs/repository-policy.json', 'utf8'));
            const ref = 'tags/pre-rebaseline-2026-10-02';
            let existing;
            try {
              existing = (await github.rest.git.getRef({...context.repo, ref})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (existing) {
              if (existing.object.sha !== policy.baseline_commit) {
                throw new Error('Preservation ref differs from audited baseline; never overwrite it.');
              }
            } else {
              await github.rest.git.createRef({...context.repo, ref: 'refs/' + ref, sha: policy.baseline_commit});
            }
            await core.summary.addRaw(`Preserved baseline: ${policy.baseline_commit} at ${ref}; no files removed.`).write();
