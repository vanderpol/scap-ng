name: 0.4 single human grammar source-lowering proof

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/research-04-one-grammar-proof.yml
      - tools/research_04_one_grammar_proof.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Get released 0.3 source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p work
          gh release download v0.3.0-six-stig-typed-operators-5796d016b12f \
            --pattern scap-ng-0.3-six-stig-authoring.zip --dir work
      - name: Test one grammar across all automated Linux/Win11/Win2025 Assessments
        run: |
          PYTHONPATH=tools python tools/research_04_one_grammar_proof.py \
            --authoring-zip work/scap-ng-0.3-six-stig-authoring.zip \
            --output work/one-grammar-04-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: three-stig-one-grammar-04-report
          path: work/one-grammar-04-report.json
          if-no-files-found: error
