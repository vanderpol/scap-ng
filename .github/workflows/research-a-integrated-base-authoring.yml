name: 0.4-A integrated base-authoring research package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-a-integrated-base-authoring.yml'
      - 'tools/v04_a_end_to_end_base_authoring.py'
      - 'tools/v04_a_lossless_ir.py'
      - 'tools/v04_a_dataflow_index.py'
      - 'tools/test_v04_a_dataflow_index.py'
      - 'tools/v04_a_dataflow_census.py'
      - 'tools/v04_a_compile_verified_ir.py'
      - 'tools/v04_a_truth_plan.py'
      - 'tools/test_v04_a_truth_plan.py'
      - 'tools/v04_a_truth_plan_census.py'
      - 'tools/test_v04_a_truth_plan_census.py'
      - 'tools/test_v04_a_compile_verified_ir.py'
      - 'tools/test_v04_a_dataflow_census.py'
      - 'tools/test_v04_a_lossless_ir.py'
      - 'research/assessment-simplification/compact-authoring-04/lossless-ir-envelope.schema.json'
      - 'tools/test_v04_a_end_to_end_base_authoring.py'
      - 'tools/v04_a_lower_scoped_to_base.py'
      - 'tools/v04_a_benchmark_spec_migration_preview.py'
      - 'tools/v04_a_deterministic_research_container.py'
      - 'schema/v0.4.0/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  six-stig-input-to-base-research-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install independent YAML parser and schema validator
        run: python -m pip install PyYAML==6.0.3 jsonschema==4.25.1
      - name: Run adversarial integrated packaging tests
        run: python -m unittest -v tools/test_v04_a_end_to_end_base_authoring.py
      - name: Verify collection/variable/set/filter graph regression cases
        run: python -m unittest -v tools/test_v04_a_dataflow_index.py
      - name: Test independent source-backed dataflow census
        run: python -m unittest -v tools/test_v04_a_dataflow_census.py
      - name: Verify adversarial lossless typed-IR source envelopes
        run: python -m unittest -v tools/test_v04_a_lossless_ir.py
      - name: Verify the single-command dual-format compiler gates
        run: python -m unittest -v tools/test_v04_a_compile_verified_ir.py
      - name: Check supplied-six-state evaluator against independently pinned OVAL truth tables
        run: python -m unittest -v tools/test_v04_a_truth_plan.py tools/test_v04_a_truth_plan_census.py
      - name: Fetch immutable 0.4-A r3 authoring sources
        run: |
          mkdir -p work/a-end-to-end
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            'https://github.com/vanderpol/scap-ng/releases/download/v0.4.0-joval-meeting-preview-20261015-r3/scap-ng-v0.4-joval-six-stig-json.zip' \
            --output work/a-end-to-end/json.zip
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            'https://github.com/vanderpol/scap-ng/releases/download/v0.4.0-joval-meeting-preview-20261015-r3/scap-ng-v0.4-joval-six-stig-yaml.zip' \
            --output work/a-end-to-end/yaml.zip
      - name: Independently parse both frozen formats and compile one checked A research IR
        run: |
          python tools/v04_a_compile_verified_ir.py \
            --json-archive work/a-end-to-end/json.zip \
            --yaml-archive work/a-end-to-end/yaml.zip \
            --out-ir "$RUNNER_TEMP/a-lossless-ir.json" \
            --out-base-zip "$RUNNER_TEMP/a-unsigned-base-research.zip" \
            --report-json "$RUNNER_TEMP/a-single-compiler.json" \
            --assert-six > "$RUNNER_TEMP/a-single-compiler.stdout"
          python - "$RUNNER_TEMP/a-single-compiler.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          assert r["status"]=="DUAL_FORMAT_VERIFIED_IR_RESEARCH_NOT_EXECUTABLE",r
          assert r["ir_stage"]=="RESEARCH_NOT_EXECUTABLE",r
          assert r["source_documents"]==4001,r
          assert r["automated_assessments"]==872,r
          assert r["automated_tests"]==1375,r
          assert r["rule_choice_links"]==2958,r
          assert r["native_capability_test_nodes_validated"]==1375,r
          assert r["base_schema"]=="ALL_AUTOMATED_ASSESSMENTS_VALIDATED",r
          assert r["full_source_preservation"]=="PASS",r
          assert r["yaml_json_base_byte_parity"]=="PASS",r
          assert r["yaml_json_ir_byte_parity"]=="PASS",r
          assert r["research_ir_schema"]=="PASS",r
          assert r["version_policy_approved"] is False,r
          assert r["signed_bundle"] is False,r
          assert r["scanner_executed"] is False,r
          assert r["native_executable_compiler_completed"] is False,r
          print("PASS: #240 one-command independently verified six-STIG research IR")
          print("IR SHA-256:",r["ir_sha256"])
          print("Unsigned authoring research ZIP SHA-256:",r["unsigned_base_archive_sha256"])
          PY
      - name: Independently audit source dataflow and actual six-STIG witnesses
        run: |
          python tools/v04_a_dataflow_census.py \
            --ir "$RUNNER_TEMP/a-lossless-ir.json" \
            --out-report "$RUNNER_TEMP/a-dataflow-census.json" \
            --assert-six > "$RUNNER_TEMP/a-dataflow-census.stdout"
          python - "$RUNNER_TEMP/a-dataflow-census.json" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1],encoding="utf-8"))
          c=report["counts"]
          assert report["status"]=="VERIFIED_SOURCE_STRUCTURE_NOT_EXECUTABLE",report
          assert c["automated_assessments"]==872,c
          assert c["named_test_nodes"]==1375,c
          assert c["edge_variable_value"]>0,c
          assert c["edge_object_acquisition"]>0,c
          print("PASS: #240 independent source-dataflow audit")
          print("Named Variables:",c.get("named_variable_nodes",0))
          print("Named Objects:",c.get("named_object_nodes",0))
          print("Variable edges:",c["edge_variable_value"])
          print("Acquisition edges:",c["edge_object_acquisition"])
          print("for_each sites:",c.get("site_for_each",0))
          print("Set sites:",c.get("site_set",0))
          print("Filter sites:",c.get("site_filter",0))
          print("Projection sites:",c.get("site_projection",0))
          for kind,entry in report["source_backed_examples"].items():
              print(kind,entry["assessment_id"],entry["source_path"])
          print("for_each source bindings:",len(report["foreach_source_bindings"]))
          for b in report["foreach_source_bindings"]:
              print("for_each",b["assessment_id"],b["source_object"],b["item_alias"],b["projections"])
          PY
      - name: Compile and verify six-STIG source expression plans
        run: |
          python tools/v04_a_truth_plan_census.py \
            --ir "$RUNNER_TEMP/a-lossless-ir.json" \
            --out "$RUNNER_TEMP/a-expression-plans.json" \
            --report "$RUNNER_TEMP/a-expression-plan-report.json" \
            --assert-six > "$RUNNER_TEMP/a-expression-plans.stdout"
          python - "$RUNNER_TEMP/a-expression-plan-report.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          c=d["counts"]
          assert d["verified"] is True,d
          assert c["automated_assessments_seen"]==872,c
          assert c["assessments_with_compiled_evaluate"]==872,c
          assert d["blocked_expression_count"]==0,d
          assert d["scanner_executed"] is False,d
          assert d["native_executable_compiler_complete"] is False,d
          assert d["synthetic_result_execution_only"] is True,d
          print("PASS: #229 / #232 full source expression census (supplied outcomes only)")
          print("Compiled evaluate roots:",c.get("assessments_with_compiled_evaluate",0))
          print("Unapproved expression blockers:",d["blocked_expression_count"])
          print("Expression plan instructions including leaf references:",sum(n for k,n in c.items() if k.startswith("opcode_")))
          print("Operator counts:",{k:v for k,v in c.items() if k.startswith("opcode_")})
          print("Synthetic leaf-status simulations:",c["synthetic_expression_executions"])
          print("Source plan SHA-256:",d["manifest_sha256"])
          for e in d["largest_source_expressions"]:
              print("Complex evaluate witness:",e["assessment_id"],e["source_path"],"instructions",e["instruction_count"],"operators",e["operators"])
          PY
      - name: Report exact capability limit without overstating compiler readiness
        if: always()
        run: |
          {
            echo '## #232/#239 — integrated 0.4-A base grammar authoring and research package'
            echo 'The independent YAML/JSON paths produce byte-identical, verified, UNSIGNED research ZIPs with all base-schema-valid Automated Assessments and exact Rule choices. The 0.4 language/migration approval and actual scanner executable .scapng compiler remain OUT OF SCOPE.'
            if test -s "$RUNNER_TEMP/a-dataflow-census.json"; then
              echo '### #240 typed source dataflow census — structural only'
              python - "$RUNNER_TEMP/a-dataflow-census.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          print("Counts:",json.dumps(r["counts"],sort_keys=True))
          print("Real witnesses:",json.dumps(r["source_backed_examples"],sort_keys=True))
          print("for_each bindings:",json.dumps(r["foreach_source_bindings"],sort_keys=True))
          print("Complexity examples:",json.dumps(r["largest_dataflow_examples"],sort_keys=True))
          PY
            fi
            if test -s "$RUNNER_TEMP/a-expression-plan-report.json"; then
              echo '### #229/#232 expression plan validation — supplied artificial six-state inputs only, NOT scanner'
              cat "$RUNNER_TEMP/a-expression-plan-report.json"
            fi
            if test -s "$RUNNER_TEMP/a-single-compiler.json"; then
              echo '### #240 independently parsed YAML+JSON to one checked research IR'
              cat "$RUNNER_TEMP/a-single-compiler.json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
