name: Six-STIG two-product release preview (#215)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/six-stig-two-product-preview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: six-stig-two-product-preview-${{ github.sha }}
  cancel-in-progress: false

jobs:
  create-and-verify:
    name: Compile independent scanning bundles and clean authoring sources
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 cryptography jsonschema==4.25.1
      - name: Download immutable verified modernized source preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p work/input
          gh release download v0.3.0-shared-layout-preview-722251735685 \
            --pattern 'scap-ng-0.3-shared-layout-preview.zip' --dir work/input
          unzip -q work/input/scap-ng-0.3-shared-layout-preview.zip -d work/source
          test -d work/source/shared-layout-preview/authoring
      - name: Validate six authoring subsets, compile and verify matching scanning packages
        run: |
          PYTHONPATH=tools python tools/publish_authoring_and_bundle_previews.py \
            --source work/source/shared-layout-preview/authoring \
            --output work/release \
            --build-revision "$GITHUB_SHA"
      - name: Recheck archive layouts and every published checksum
        run: |
          cd work/release
          sha256sum --check SHA256SUMS.txt
          for file in *.zip; do unzip -tq "$file" >/dev/null; done
          test "$(find . -maxdepth 1 -name '*.scapng' | wc -l)" -eq 6
          test "$(find . -maxdepth 1 -name '*-authoring.zip' | wc -l)" -eq 7
          ! unzip -Z1 scap-ng-0.3-six-stig-authoring.zip | grep -E '(faithful-authoring|candidate-authoring|CANDIDATE-STATUS)'
      - uses: actions/upload-artifact@v4
        with:
          name: six-stig-separate-authoring-scanning-preview
          path: work/release
          if-no-files-found: error
          retention-days: 90
      - name: Publish immutable prerelease without modifying root README
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v0.3.0-authoring-and-bundles-${GITHUB_SHA:0:12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Never overwrite a published preview asset."
            exit 1
          fi
          cat > work/release/RELEASE-NOTES.md <<'EOF'
          # Separate SCAP-NG authoring and compiled scanning-content previews

          Issue #215. Six real NIWC-enhanced DISA STIG conversions from the pinned
          0.3 grouped authoring source. Each STIG has a source-only authoring ZIP
          plus a directly downloadable, compiled .scapng bundle. One combined
          authoring ZIP is also available.

          Public authoring ZIPs contain only the modernized native source and
          required shared Assessments. No faithful/candidate duplicate trees.
          Faithful converter evidence is preserved separately in prior artifacts.

          Compiled .scapng files are unsigned experimental reference packages.
          Schema/semantic/manifest verification is not operational scanner
          conformance, verified execution equivalence, publisher trust or DISA
          authorization. Do not use as production compliance evidence.

          Historical 0.3 source ZIPs and root README are intentionally unchanged.
          EOF
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "SCAP-NG 0.3 — authoring sources and compiled scanning bundle previews" \
            --notes-file work/release/RELEASE-NOTES.md \
            --prerelease \
            work/release/*.zip work/release/*.scapng \
            work/release/DOWNLOADS.json work/release/SHA256SUMS.txt
          gh release view "$tag" --json url,assets --jq '{url:.url,assets:[.assets[].name]}'
          echo "DURABLE_TWO_PRODUCT_RELEASE=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag"
