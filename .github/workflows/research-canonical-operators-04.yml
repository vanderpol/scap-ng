name: Canonical comparison operators and six-STIG inversion (#235)
on:
  push:
    paths:
      - .github/workflows/research-canonical-operators-04.yml
      - tools/research_04_canonical_operators.py
      - tools/test_research_04_canonical_operators.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  six-stig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned YAML and schema libraries
        run: python -m pip install 'PyYAML==6.0.3' 'jsonschema==4.25.1'
      - name: Unit-test canonical comparator names and nested record semantics
        run: python tools/test_research_04_canonical_operators.py -v
      - name: Download pinned six-STIG reference from GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work
          gh release download v0.4.0-joval-meeting-preview-20261015-r3 \
            --repo vanderpol/scap-ng \
            --pattern scap-ng-v0.4-joval-six-stig-yaml.zip \
            --dir work
      - name: Source-exact canonical-operators proof
        run: |
          python tools/research_04_canonical_operators.py \
            --archive work/scap-ng-v0.4-joval-six-stig-yaml.zip \
            --base-schema research/assessment-simplification/english-first-04/fixed-require.editor.schema.json \
            --out work/proof
      - name: Check entire source corpus, legacy exceptions, and removal
        run: |
          python - <<'PY'
          import json
          p=json.load(open('work/proof/report.json'))
          c=p['counts']
          assert (c['assessments'],c['tests'])==(872,1375),c
          assert (c['exact_assessments'],c['exact_tests'])==(871,1374),p['failures']
          assert len(p['failures'])==1,p['failures']
          assert 'verify-boot-loader' in p['failures'][0]['path'],p['failures']
          assert c['operator_aliases_removed']>0,c
          assert c['invalid_wrapper_rejected']==871,c
          print('PASS: no new source loss and existing comparators recovered')
          PY
      - name: Publish proof and complete YAML files directly on GitHub.com
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,json,os,pathlib,subprocess
          repo='vanderpol/scap-ng'
          head=subprocess.run(['gh','api',f'repos/{repo}/commits/main','--jq','.sha'],
                     text=True,capture_output=True,check=True).stdout.strip()
          if head!=os.environ['GITHUB_SHA']:
              print('Main has advanced; avoid stale publication')
              raise SystemExit(0)
          folder='research/assessment-simplification/english-first-04/canonical-operators'
          for path in sorted(pathlib.Path('work/proof').glob('*')):
              if path.suffix not in ('.md','.json','.yaml'):continue
              remote=folder+'/'+path.name
              read=subprocess.run(['gh','api',f'repos/{repo}/contents/{remote}',
                  '--jq','.sha'],capture_output=True,text=True)
              if read.returncode not in (0,1):raise RuntimeError('Bad remote read '+remote)
              data={'branch':'main',
                    'message':'research(#235): publish canonical comparison-operator six-STIG proof',
                    'content':base64.b64encode(path.read_bytes()).decode('ascii')}
              if read.returncode==0:data['sha']=read.stdout.strip()
              subprocess.run(['gh','api','--method','PUT',f'repos/{repo}/contents/{remote}',
                               '--input','-'],input=json.dumps(data),text=True,check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-comparison-operators-proof
          path: work/proof/
          if-no-files-found: warn