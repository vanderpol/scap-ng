name: Commit issue reference

on:
  push:
  pull_request:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a real GitHub issue reference in every commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.error
          import urllib.request

          event = os.environ["EVENT_NAME"]
          head = os.environ["HEAD_SHA"]
          if event == "pull_request":
              base = os.environ["BASE_SHA"]
          else:
              before = os.environ.get("BEFORE_SHA", "")
              if before and set(before) != {"0"}:
                  base = before
              else:
                  base = subprocess.check_output(
                      ["git", "rev-parse", f"{head}^"], text=True
                  ).strip()

          raw = subprocess.check_output(
              ["git", "log", "--format=%H%x00%B%x00", f"{base}..{head}"],
              text=True,
          )
          parts = raw.split("\0")
          commits = []
          for i in range(0, len(parts) - 1, 2):
              sha = parts[i].strip()
              message = parts[i + 1].strip()
              if sha:
                  commits.append((sha, message))

          issue_re = re.compile(
              r"(?<![A-Za-z0-9_])#(\d+)\b|"
              r"https://github\.com/[^/]+/[^/]+/issues/(\d+)\b"
          )
          repo = os.environ["REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          failures = []

          def is_real_issue(number: str) -> bool:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/issues/{number}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      data = json.load(resp)
              except urllib.error.HTTPError:
                  return False
              return "pull_request" not in data

          for sha, message in commits:
              refs = []
              for match in issue_re.finditer(message):
                  refs.append(match.group(1) or match.group(2))
              if not refs or not any(is_real_issue(n) for n in sorted(set(refs))):
                  failures.append((sha, message.splitlines()[0] if message else ""))

          if failures:
              print("Every commit must reference at least one real GitHub issue.")
              print("Use a commit message such as: Rework review package (#182)")
              for sha, subject in failures:
                  print(f"- {sha[:12]} {subject}")
              raise SystemExit(1)

          print(f"Validated {len(commits)} commit(s): each references a GitHub issue.")
          PY
