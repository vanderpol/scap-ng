name: Native 0.4.1 conformance corpus

# Full native conformance corpus runs on the Codex VM.
# Keep an explicit hosted replay for funded independent verification.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Run the local conformance gate
        run: bash conformance/check.sh
