name: English-first six-STIG grammar census
on:
  push:
    paths:
      - .github/workflows/research-english-first-census-04.yml
      - tools/research_english_first_04_census.py
      - tools/research_english_first_04_shape_census.py
      - tools/research_english_first_04_presence.py
      - tools/research_english_first_04_objectless.py
      - tools/research_english_first_04_scalar.py
      - tools/research_english_first_04_full_corpus.py
      - tools/research_english_first_04_compact_layout.py
      - tools/research_english_first_04_auditor_candidate.py
      - tools/research_english_first_04_vocabulary_variants.py
      - tools/research_english_first_04_references.py
      - tools/research_english_first_04_publish.py
      - research/assessment-simplification/english-first-04/BEFORE-AFTER-REVIEW.md
      - tools/research_english_first_04_six_state.py
      - tools/research_english_first_04_none_exist_state_boundary.py
      - tools/research_english_first_04_scope_guards.py
      - tools/oval_result_truth_tables.py
      - tools/research_english_first_04_complex.py
      - tools/research_english_first_04_evaluate.py
      - tools/research_english_first_04.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-six-stig:
    name: Classify every unique automated Test fail-closed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research scripts from main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned parser
        run: python -m pip install 'PyYAML==6.0.3'

      - name: Fetch published immutable r3 YAML authoring ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work
          gh release download v0.4.0-joval-meeting-preview-20261015-r3 \
            --repo vanderpol/scap-ng \
            --pattern 'scap-ng-v0.4-joval-six-stig-yaml.zip' \
            --dir work

      - name: Audit Test-by-Test and reject unsupported shapes
        run: |
          python tools/research_english_first_04_census.py \
            --archive work/scap-ng-v0.4-joval-six-stig-yaml.zip \
            --output english-first-04-six-stig-census.json

      - name: Census collection, State, cardinality and dynamic-dependency shapes
        run: |
          python tools/research_english_first_04_shape_census.py \
            --archive work/scap-ng-v0.4-joval-six-stig-yaml.zip \
            --output english-first-04-shape-census.json

      - name: Prove presence-only authoring for native collected/selected Items
        run: |
          python tools/research_english_first_04_presence.py \
            --archive work/scap-ng-v0.4-joval-six-stig-yaml.zip \
            --output english-first-04-state-free-presence.json

      - name: Prove typed system-wide Objectless Test readably without inventing Objects
        run: |
          python tools/research_english_first_04_objectless.py \
            --archive work/scap-ng-v0.4-joval-six-stig-yaml.zip \
            --output english-first-04-objectless.json

      - name: Prove common scalar Test clauses with native acquisition across all six STIGs
        run: |
          python tools/research_english_first_04_scalar.py \
            --archive work/scap-ng-v0.4-joval-six-stig-yaml.zip \
            --output english-first-04-generic-scalar.json

      - name: Count exact complete Assessment source reconstruction across all six STIGs
        run: |
          python tools/research_english_first_04_full_corpus.py \
            --archive work/scap-ng-v0.4-joval-six-stig-yaml.zip \
            --output english-first-04-full-assessment-census.json

      - name: Verify collection-first YAML ordering and lossless full-source layout
        run: |
          python tools/research_english_first_04_compact_layout.py \
            --archive work/scap-ng-v0.4-joval-six-stig-yaml.zip \
            --output english-first-04-compact-layout-report.json \
            --examples-dir english-first-04-compact-layout-examples

      - name: Audit named source and variable references with cycle guards
        run: |
          python tools/research_english_first_04_references.py \
            --archive work/scap-ng-v0.4-joval-six-stig-yaml.zip \
            --output english-first-04-reference-graph-report.json

      - name: Cross-check six-state Item cardinalities with independent evaluator
        run: |
          python tools/research_english_first_04_six_state.py \
            --output english-first-04-six-state-cardinality.json

      - name: Isolate none_exist State source corner cases without guessing
        run: |
          python tools/research_english_first_04_none_exist_state_boundary.py \
            --archive work/scap-ng-v0.4-joval-six-stig-yaml.zip \
            --output english-first-04-none-exist-state-boundary.json

      - name: Guard variable, WMI, record and Set filter semantic scope
        run: |
          python tools/research_english_first_04_scope_guards.py \
            --output english-first-04-variable-record-set-boundaries.json

      - name: Verify vocabulary variants and source-exact minimal hybrid
        run: |
          python tools/research_english_first_04_vocabulary_variants.py \
            --archive work/scap-ng-v0.4-joval-six-stig-yaml.zip \
            --output english-first-04-vocabulary-variants.json \
            --examples-dir english-first-04-vocabulary-examples

      - name: Validate auditor-first requirement grammar against complete pinned source
        run: |
          python tools/research_english_first_04_auditor_candidate.py \
            --archive work/scap-ng-v0.4-joval-six-stig-yaml.zip \
            --output english-first-04-auditor-candidate.json \
            --examples-dir english-first-04-auditor-examples

      - name: Publish phone-friendly reports directly on github.com
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/research_english_first_04_publish.py

      - name: Upload full evidence ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-first-v04-six-stig-source-census
          path: |
            english-first-04-six-stig-census.json
            english-first-04-shape-census.json
            english-first-04-state-free-presence.json
            english-first-04-objectless.json
            english-first-04-generic-scalar.json
            english-first-04-full-assessment-census.json
            english-first-04-compact-layout-report.json
            english-first-04-vocabulary-variants.json
            english-first-04-auditor-candidate.json
            english-first-04-auditor-examples/
            english-first-04-vocabulary-examples/
            english-first-04-reference-graph-report.json
            english-first-04-six-state-cardinality.json
            english-first-04-none-exist-state-boundary.json
            english-first-04-variable-record-set-boundaries.json
            english-first-04-compact-layout-examples/
          if-no-files-found: warn
