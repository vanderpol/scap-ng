name: Frozen SCAP-NG 0.4 schema and documentation checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frozen-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify immutable 0.4 JSON family and references
        run: python -m unittest discover -s tests -v
      - name: Reject stale schema-derived and scanner documentation
        run: python tools/generate_docs.py --check

