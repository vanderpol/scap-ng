name: Frozen SCAP-NG 0.4 schema and documentation checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frozen-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify generated native selector pack
        run: python tools/generate_native_selector_schema.py --check
      - name: Verify immutable 0.4 JSON family and references
        run: python -m unittest discover -s tests -v
      - name: Reject stale schema-derived and scanner documentation
        run: python tools/generate_docs.py --check

      - name: Reject stale unix.file basic, advanced and parity references
        run: python tools/generate_unix_file_reference.py --check
      - name: Reject stale or regressed core/shared documentation inventory
        run: python tools/audit_schema_documentation.py --check

      - name: Verify bounded approved-annotation reference and offline help
        run: python tools/generate_approved_annotation_pilot.py --check

      - name: Verify Issue 43 coordinated review-only documentation pack
        run: python tools/generate_review_documentation_pack.py --check

      - name: Verify generalized schema-derived reference, editor help and coverage
        run: python tools/generate_documentation.py --check

      - name: Verify pinned-source documentation reconciliation and native destinations
        run: python tools/audit_documentation_fidelity.py --check
