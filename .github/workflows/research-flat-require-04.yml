name: Flat require and record-boolean elimination (#235)
on:
  push:
    paths:
      - .github/workflows/research-flat-require-04.yml
      - tools/research_04_flat_require.py
      - tools/test_research_04_flat_require.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  six-stig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned source parser and editor validator
        run: python -m pip install 'PyYAML==6.0.3' 'jsonschema==4.25.1'
      - name: Test 15 requirement modes, reserved-field guards, all record modes
        run: python tools/test_research_04_flat_require.py -v
      - name: Download pinned six-STIG r3 source YAML
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work
          gh release download v0.4.0-joval-meeting-preview-20261015-r3 \
            --repo vanderpol/scap-ng \
            --pattern scap-ng-v0.4-joval-six-stig-yaml.zip \
            --dir work
      - name: Full source reconstruction without condition or record true flags
        run: |
          python tools/research_04_flat_require.py \
            --archive work/scap-ng-v0.4-joval-six-stig-yaml.zip \
            --base-schema research/assessment-simplification/english-first-04/fixed-require.editor.schema.json \
            --out work/flat
      - name: Require source-exact six-STIG coverage and no new failures
        run: |
          python - <<'PY'
          import json
          doc=json.load(open('work/flat/report.json'))
          c=doc['counts']
          assert (c['assessments'],c['tests'])==(872,1375),c
          assert (c['exact_assessments'],c['exact_tests'])==(871,1374),c
          assert len(doc['failures'])==1,doc['failures'][:12]
          assert 'verify-boot-loader' in doc['failures'][0]['path'],doc['failures']
          assert not doc['collisions'],doc['collisions']
          assert c['redundant_record_true_removed']>0,c
          assert c['negative_guards']==871,c
          print('PASS: 871/872 complete Assessments source-exact, inline condition, no record boolean')
          PY
      - name: Publish github.com accessible complete proof and five samples
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,json,os,pathlib,subprocess
          repo='vanderpol/scap-ng'
          head=subprocess.run(['gh','api',f'repos/{repo}/commits/main','--jq','.sha'],
             capture_output=True,text=True,check=True).stdout.strip()
          if head!=os.environ['GITHUB_SHA']:
             print('main advanced: do not publish stale generated proof')
             raise SystemExit(0)
          root='research/assessment-simplification/english-first-04/flat-require-experiment'
          for f in sorted(pathlib.Path('work/flat').glob('*')):
             if f.suffix not in ('.json','.md','.yaml'):continue
             target=root+'/'+f.name
             prior=subprocess.run(['gh','api',f'repos/{repo}/contents/{target}','--jq','.sha'],
                capture_output=True,text=True)
             if prior.returncode not in (0,1):raise RuntimeError('Remote read failed '+target)
             payload={'branch':'main','message':'research(#235): publish flattened requirement source proof',
                'content':base64.b64encode(f.read_bytes()).decode('ascii')}
             if prior.returncode==0:payload['sha']=prior.stdout.strip()
             subprocess.run(['gh','api','--method','PUT',f'repos/{repo}/contents/{target}',
                '--input','-'],input=json.dumps(payload),text=True,check=True)
          PY
      - name: Save machine-readable research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flat-require-six-stig-research
          path: work/flat/
          if-no-files-found: warn