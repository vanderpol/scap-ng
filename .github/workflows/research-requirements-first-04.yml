name: Requirements-first auditor language research

on:
  push:
    paths:
      - 'research/requirements-first-language/**'
      - 'tools/research_requirements_first_04.py'
      - 'tools/test_research_requirements_first_04.py'
      - 'tools/research_requirements_first_evidence.py'
      - 'tools/test_research_requirements_first_evidence.py'
      - 'tools/research_provider_linux_mounts.py'
      - 'tools/test_research_provider_linux_mounts.py'
      - 'tools/research_windows_role_grouping.py'
      - 'tools/test_research_windows_role_grouping.py'
      - 'tools/research_linux_init_permissions.py'
      - 'tools/test_research_linux_init_permissions.py'
      - 'tools/research_provider_linux_account_files.py'
      - 'tools/test_research_provider_linux_account_files.py'
      - 'tools/research_provider_apache_directives.py'
      - 'tools/test_research_provider_apache_directives.py'
      - 'tools/test_research_apache_source_contract.py'
      - 'tools/test_research_dns_source_contract.py'
      - '.github/workflows/research-requirements-first-04.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorability-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Validate all requirements-first research Assessments
        run: python tools/research_requirements_first_04.py
      - name: Run adverse authoring grammar tests
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_requirements_first_04.py
      - name: Test partial, missing, cardinality and provider counterexamples
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_requirements_first_evidence.py
      - name: Test real Linux mounts provider parsing and CI host collection
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_provider_linux_mounts.py
      - name: Verify WMI whole-State records and source grouping counterexamples
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_windows_role_grouping.py
      - name: Prove source-pinned Linux init-file union/cardinality and permission bitmask counterexamples
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_linux_init_permissions.py
      - name: Test real temporary-home file collection, identity and incomplete coverage
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_provider_linux_account_files.py
      - name: Test Apache static include discovery and fail-closed evidence boundaries
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_provider_apache_directives.py
      - name: Pin original Apache four-probe source cardinality and optional fields
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_apache_source_contract.py
      - name: Pin original Windows DNS command Items, zone filters and distinct key States
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_dns_source_contract.py
