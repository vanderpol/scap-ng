name: Requirements-first auditor language research

on:
  push:
    paths:
      - 'research/requirements-first-language/**'
      - 'tools/research_requirements_first_04.py'
      - 'tools/test_research_requirements_first_04.py'
      - 'tools/research_requirements_first_evidence.py'
      - 'tools/test_research_requirements_first_evidence.py'
      - 'tools/research_provider_linux_mounts.py'
      - 'tools/test_research_provider_linux_mounts.py'
      - 'tools/research_windows_role_grouping.py'
      - 'tools/test_research_windows_role_grouping.py'
      - 'tools/research_linux_init_permissions.py'
      - 'tools/test_research_linux_init_permissions.py'
      - 'tools/research_provider_linux_account_files.py'
      - 'tools/test_research_provider_linux_account_files.py'
      - 'tools/research_provider_apache_directives.py'
      - 'tools/test_research_provider_apache_directives.py'
      - 'tools/research_provider_textfile_matches.py'
      - 'tools/test_research_provider_textfile_matches.py'
      - 'tools/research_provider_registry_snapshot.py'
      - 'tools/test_research_provider_registry_snapshot.py'
      - 'tools/test_research_apache_source_contract.py'
      - 'tools/test_research_dns_source_contract.py'
      - 'tools/research_dns_zone_key_evidence.py'
      - 'tools/test_research_dns_zone_key_evidence.py'
      - 'tools/research_native_contract_candidate.py'
      - 'tools/research_native_contract_evaluator.py'
      - 'tools/test_research_native_contract_candidate.py'
      - 'tools/test_research_native_provider_integration.py'
      - 'tools/research_native_auditor_explain.py'
      - 'tools/test_research_native_auditor_explain.py'
      - 'tools/test_research_common_ir_bridge.py'
      - 'tools/research_b_compiled_ir.py'
      - 'tools/test_research_b_compiled_ir.py'
      - 'tools/research_b_source_textfile_lowering.py'
      - 'tools/test_research_b_source_textfile_lowering.py'
      - 'tools/test_research_gemini_phase1_counterexamples.py'
      - '.github/workflows/research-requirements-first-04.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorability-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Validate all requirements-first research Assessments
        run: python tools/research_requirements_first_04.py
      - name: Run adverse authoring grammar tests
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_requirements_first_04.py
      - name: Test partial, missing, cardinality and provider counterexamples
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_requirements_first_evidence.py
      - name: Test real Linux mounts provider parsing and CI host collection
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_provider_linux_mounts.py
      - name: Verify WMI whole-State records and source grouping counterexamples
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_windows_role_grouping.py
      - name: Prove source-pinned Linux init-file union/cardinality and permission bitmask counterexamples
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_linux_init_permissions.py
      - name: Test real temporary-home file collection, identity and incomplete coverage
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_provider_linux_account_files.py
      - name: Verify read-only text file regex observations against source-backed Chrony check
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_provider_textfile_matches.py
      - name: Test Windows registry snapshot query, view, type and source parity boundaries
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_provider_registry_snapshot.py
      - name: Test Apache static include discovery and fail-closed evidence boundaries
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_provider_apache_directives.py
      - name: Pin original Apache four-probe source cardinality and optional fields
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_apache_source_contract.py
      - name: Pin original Windows DNS command Items, zone filters and distinct key States
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_dns_source_contract.py
      - name: Verify typed DNS zone-key structured fixtures and missing evidence boundaries
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_dns_zone_key_evidence.py
      - name: Compile native auditor examples to one AST
        env:
          PYTHONPATH: tools
        run: python tools/research_native_contract_candidate.py
      - name: Test native one-AST singleton/population and evidence semantic fixtures
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_native_contract_candidate.py
      - name: Cross-check native AST against real Linux mount and Apache fixture providers plus DNS normalized evidence
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_native_provider_integration.py
      - name: Validate deterministic auditor explanations from compiled native checks
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_native_auditor_explain.py
      - name: Test single internal evaluator with native AST and compiler-owned OVAL Test compatibility nodes
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_common_ir_bridge.py
      - name: Verify versioned B scanner-facing research JSON fixture IR and source compatibility boundaries
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_b_compiled_ir.py
      - name: Test source-shaped state-free textfile Test from actual collected Items
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_b_source_textfile_lowering.py
      - name: Test external reviewer policy paraphrase and new-authoring counterexamples
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_gemini_phase1_counterexamples.py
