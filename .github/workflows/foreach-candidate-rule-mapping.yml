name: Foreach candidate rule mapping

on:
  push:
    paths:
      - tools/map_oval_tests_to_xccdf_rules.py
      - .github/workflows/foreach-candidate-rule-mapping.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned packages
        run: |
          curl -fL --retry 3 "https://raw.githubusercontent.com/niwc-atlantic/scap-content-library/8c8e5dff860af6b1290ee9273a282db24278f8d5/Current/U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-signed.zip" -o rhel9.zip
          curl -fL --retry 3 "https://raw.githubusercontent.com/niwc-atlantic/scap-content-library/8c8e5dff860af6b1290ee9273a282db24278f8d5/Current/U_SOL_11_X86_V3R5_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip" -o solaris11.zip
      - name: Map RHEL foreach tests
        run: |
          python tools/map_oval_tests_to_xccdf_rules.py rhel9.zip             --test oval:mil.disa.stig.unix:tst:23032500             --test oval:mil.disa.stig.unix:tst:23032501             --test oval:mil.disa.stig.unix:tst:23036401             --test oval:mil.disa.stig.unix:tst:25789000             --output rhel-map.json
      - name: Map Solaris foreach test
        run: |
          python tools/map_oval_tests_to_xccdf_rules.py solaris11.zip             --test oval:mil.disa.fso.solaris11:tst:29700             --output solaris-map.json
      - name: Inspect Solaris foreach source nodes
        run: |
          python tools/extract_oval_nodes.py solaris11.zip             --id oval:mil.disa.fso.solaris11:obj:29700             --id oval:mil.disa.fso.solaris11:obj:29701             --id oval:mil.disa.fso.solaris11:tst:29700             --id oval:mil.disa.fso.solaris11:var:29700             --id oval:mil.disa.fso.solaris11:ste:29700             > solaris-29700.xml.txt

      - uses: actions/upload-artifact@v4
        with:
          name: foreach-candidate-rule-mapping
          path: |
            rhel-map.json
            solaris-map.json
