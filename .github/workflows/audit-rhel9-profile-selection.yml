name: Audit pinned RHEL9 XCCDF profile-selection parity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-rhel9-profile-selection.yml"
      - "tools/scap_upconvert_v003/audit_profile_selection.py"
      - "tools/scap_upconvert_v003/test_profile_selection_audit.py"
      - "tools/scap14_benchmark_ir.py"
      - "research/iterations/003/source/split-rule-assessment/rhel9-full/benchmark.yaml"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SCAP-NG
        uses: actions/checkout@v4
        with:
          path: scap-ng
      - name: Check out pinned NIWC SCAP 1.4 source
        uses: actions/checkout@v4
        with:
          repository: niwc-atlantic/scap-content-library
          ref: 8c8e5dff860af6b1290ee9273a282db24278f8d5
          path: niwc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: python -m pip install lxml pyyaml cryptography
      - name: Unit-test independent profile selection comparator
        run: python scap-ng/tools/scap_upconvert_v003/test_profile_selection_audit.py
      - name: Compare all RHEL9 source profiles against native selection
        run: |
          python scap-ng/tools/scap_upconvert_v003/audit_profile_selection.py \
            --source niwc/Current/U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-signed.zip \
            --native scap-ng/research/iterations/003/source/split-rule-assessment/rhel9-full/benchmark.yaml \
            --report work/rhel9-profile-selection-parity.json
      - name: Preserve failures and full profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-rhel9-xccdf-profile-parity
          path: work/rhel9-profile-selection-parity.json
