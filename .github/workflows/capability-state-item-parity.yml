name: Capability State Item parity
on:
  push:
    branches: [main]
    paths:
      - schema/v0.1.0/capability-mappings/**
      - schema/v0.3.0/capability-mappings/**
      - schema/v0.3.0/capability-common.schema.json
      - third_party/scap-1.4-schemas/oval_5.12.3/**
      - tools/audit_capability_state_item_parity.py
      - tools/audit_v03_polymorphic_datatypes.py
      - tools/audit_v03_item_cardinality.py
      - tools/audit_v03_deprecated_mappings.py
      - tools/validate_generated_capability_semantics.py
      - tools/test_registry_inline_datatype_semantics.py
      - tools/test_registry_type_coverage.py
      - tools/test_v03_state_item_casting_contract.py
      - tools/test_v03_ntuser_empty_type_state.py
      - tools/test_0_3_zero_existence_lowering.py
      - tools/test_0_3_literal_variable_match_normalization.py
      - tools/normalize_0_3_review_surface.py
      - tools/validate_v03_registry_collected_item.py
      - tools/test_v03_registry_collected_item.py
      - tools/test_nested_state_field_semantics.py
      - tools/test_audit_v03_item_cardinality.py
      - tools/research_expand_registry_authoring.py
      - tools/test_research_expand_registry_authoring.py
      - research/iterations/003/examples/stig-derived/SV-278217/readable-authoring.prototype.yaml
      - .github/workflows/capability-state-item-parity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validation dependency
        run: python -m pip install --disable-pip-version-check jsonschema pyyaml referencing
      - name: Audit Object subset and State Item parity
        id: audit
        continue-on-error: true
        run: |
          status=0
          python tools/audit_capability_state_item_parity.py --json > capability-state-item-parity.json || status=1
          python tools/audit_capability_state_item_parity.py --mapping-dir schema/v0.3.0/capability-mappings/supported --json > capability-state-item-parity-v03.json || status=1
          python - <<'PY'
          import json
          for filename in ("capability-state-item-parity.json", "capability-state-item-parity-v03.json"):
              report=json.load(open(filename, encoding="utf-8"))
              print(filename, "checked=",report.get("checked"),"failures=",report.get("failures"))
              for entry in report.get("results", []):
                  if not entry.get("ok"):
                      print("UNRESOLVED:", entry.get("capability"),entry.get("errors"))
          PY
          exit "$status"
      - name: Inventory v0.3 polymorphic state field datatypes
        id: polymorphic
        continue-on-error: true
        run: |
          python tools/audit_v03_polymorphic_datatypes.py --json > v03-polymorphic-fields.json || {
            python -c 'import json; x=json.load(open("v03-polymorphic-fields.json")); print("Polymorphic audit errors:", json.dumps(x.get("structural_errors",[])[:20],indent=2))'
            exit 1
          }
      - name: Inventory repeated OVAL Item fields in v0.3
        id: cardinality
        continue-on-error: true
        run: |
          python tools/audit_v03_item_cardinality.py --json > v03-item-cardinality.json || {
            python -c 'import json; x=json.load(open("v03-item-cardinality.json")); print("Cardinality audit errors:", json.dumps(x.get("failures",[])[:20],indent=2))'
            exit 1
          }
      - name: Reject deprecated OVAL mapping entities
        id: deprecated
        continue-on-error: true
        run: |
          python tools/audit_v03_deprecated_mappings.py --json > v03-deprecated-mappings.json || {
            python -c 'import json; x=json.load(open("v03-deprecated-mappings.json")); print("Deprecated mapping errors:", json.dumps(x.get("violations",[])[:20],indent=2))'
            exit 1
          }
      - name: Generate and meta-validate every reviewed capability schema
        id: schema_generation
        continue-on-error: true
        run: |
          PYTHONPATH=tools python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          from generate_capability_schema import generate

          root=Path('.').resolve()
          mapping_dirs=[root/'schema/v0.1.0/capability-mappings', root/'schema/v0.3.0/capability-mappings/supported']
          checked=0
          failures=[]
          for path in (p for directory in mapping_dirs for p in sorted(directory.glob('*.json'))):
              try:
                  mapping=json.loads(path.read_text(encoding='utf-8'))
                  schema=generate(mapping,root,schema_version=mapping.get('specification_version','0.1.0'))
                  Draft202012Validator.check_schema(schema)
                  checked += 1
              except Exception as exc:
                  failures.append({'mapping':path.name,'error':repr(exc)})
          report={'checked':checked,'failures':failures}
          Path('generated-capability-schema-validation.json').write_text(
              json.dumps(report,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(report,indent=2,sort_keys=True))
          if failures:
              raise SystemExit(1)
          PY
      - name: Regression test inline Registry type semantics and authored expansion
        id: regression
        if: always()
        run: |
          PYTHONPATH=tools python -m unittest -v tools/test_registry_inline_datatype_semantics.py tools/test_registry_type_coverage.py tools/test_v03_state_item_casting_contract.py tools/test_v03_ntuser_empty_type_state.py tools/test_0_3_zero_existence_lowering.py tools/test_0_3_literal_variable_match_normalization.py tools/test_v03_registry_collected_item.py tools/test_nested_state_field_semantics.py tools/test_audit_v03_item_cardinality.py tools/test_research_expand_registry_authoring.py
          PYTHONPATH=tools python tools/research_expand_registry_authoring.py research/iterations/003/examples/stig-derived/SV-278217/readable-authoring.prototype.yaml --output sv-278217.canonical.json --validate-v03
      - name: Summarize 0.3 fidelity audit
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files={
              "legacy_parity":"capability-state-item-parity.json",
              "v03_parity":"capability-state-item-parity-v03.json",
              "v03_polymorphic":"v03-polymorphic-fields.json",
              "v03_cardinality":"v03-item-cardinality.json",
              "v03_deprecated":"v03-deprecated-mappings.json",
              "capability_schemas":"generated-capability-schema-validation.json",
          }
          rows=[]
          for label,filename in files.items():
              path=Path(filename)
              if not path.exists():
                  rows.append(f"| {label} | MISSING | - |")
                  continue
              report=json.loads(path.read_text(encoding="utf-8"))
              count=report.get("checked",report.get("mapping_count",report.get("checked_source_items",report.get("mappings","-"))))
              failures=report.get("failures",report.get("structural_errors",report.get("violations",[])))
              failure_count=failures if isinstance(failures,int) else len(failures)
              status="PASS" if failure_count==0 else f"FAIL: {failure_count}"
              rows.append(f"| {label} | {status} | {count} |")
          summary="### SCAP-NG datatype and Item fidelity\n\n| Report | Status | Mappings or Items checked |\n|---|---|---|\n"+"\n".join(rows)+"\n"
          target=Path(__import__("os").environ["GITHUB_STEP_SUMMARY"])
          with target.open("a",encoding="utf-8") as file:
              file.write(summary)
          print(summary)
          PY
      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capability-state-item-parity
          path: |
            capability-state-item-parity.json
            capability-state-item-parity-v03.json
            v03-polymorphic-fields.json
            v03-item-cardinality.json
            v03-deprecated-mappings.json
            generated-capability-schema-validation.json
            sv-278217.canonical.json
      - name: Enforce all fidelity gates
        if: always()
        env:
          PARITY_OUTCOME: ${{ steps.audit.outcome }}
          POLYMORPHIC_OUTCOME: ${{ steps.polymorphic.outcome }}
          CARDINALITY_OUTCOME: ${{ steps.cardinality.outcome }}
          DEPRECATED_OUTCOME: ${{ steps.deprecated.outcome }}
          SCHEMA_OUTCOME: ${{ steps.schema_generation.outcome }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
        run: |
          status=0
          for outcome in "$PARITY_OUTCOME" "$POLYMORPHIC_OUTCOME" "$CARDINALITY_OUTCOME" "$DEPRECATED_OUTCOME" "$SCHEMA_OUTCOME" "$REGRESSION_OUTCOME"; do
            if [ "$outcome" != "success" ]; then
              echo "::error::Fidelity gate outcome: $outcome"
              status=1
            fi
          done
          exit "$status"

  announce-audit-run:
    name: Announce fidelity audit run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Expose run link before the parity tests finish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          {
            echo "<!-- scap-ng-v03-fidelity-ci-run -->"
            echo "### Latest automated SCAP-NG 0.3 datatype fidelity run"
            echo ""
            echo "- Result: **running**"
            echo "- Run: ${RUN_URL}"
            echo "- Source SHA: \`${SOURCE_SHA}\`"
          } > "${RUNNER_TEMP}/scap-ng-fidelity-ci-comment.md"
          gh issue comment 201 --edit-last --create-if-none --body-file "${RUNNER_TEMP}/scap-ng-fidelity-ci-comment.md"

  publish-audit-run:
    name: Publish audit run link
    needs: [parity]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Record reproducible CI run on issue 201
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PARITY_RESULT: ${{ needs.parity.result }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          {
            echo "<!-- scap-ng-v03-fidelity-ci-run -->"
            echo "### Latest automated SCAP-NG 0.3 datatype fidelity run"
            echo ""
            echo "- Result: **${PARITY_RESULT}**"
            echo "- Run: ${RUN_URL}"
            echo "- Source SHA: \`${SOURCE_SHA}\`"
            echo "- CI reports: run artifacts and job logs at the run link"
            echo ""
            echo "This automated result does not certify the full 65-benchmark corpus."
          } > "${RUNNER_TEMP}/scap-ng-fidelity-ci-comment.md"
          gh issue comment 201 --edit-last --create-if-none --body-file "${RUNNER_TEMP}/scap-ng-fidelity-ci-comment.md"
