name: Validate SCAP-NG 003 Self-Assertion variable semantics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v003-self-assertion.yml"
      - "tools/scap_upconvert_v003/**"

jobs:
  validate-self-assertion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml

      - name: Validate variable and expression semantics
        run: python tools/scap_upconvert_v003/check_self_assertion.py
