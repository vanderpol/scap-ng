name: Validate SCAP-NG 003 Self-Assertion semantics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v003-self-assertion.yml"
      - "tools/scap_upconvert_v003/**"
      - "tools/oval_semantic_ir.py"
      - "schema/**"
      - "third_party/scap-1.4-schemas/oval_5.12.3/**"
      - "tools/generate_*capability*.py"
      - "tools/validate_generated_capability_semantics.py"
      - "tools/test_generate_*capability*.py"
      - "tools/test_validate_generated_capability_semantics.py"
      - "tools/test_state_entity_roundtrip.py"
      - "tools/scap_ng_roundtrip_v003/roundtrip_corpus_v003.py"
      - "tools/scap_ng_roundtrip_v003/native_assessment_to_oval.py"
      - "tools/scap_ng_roundtrip_v003/compare_oval_semantics.py"
      - "tools/scap_ng_roundtrip_v003/compare_schematron_baseline.py"
      - "tools/scap_ng_roundtrip_v003/build_full_oval_omni.py"

concurrency:
  group: v003-self-assertion-main
  cancel-in-progress: true

env:
  SCAP_NG_OVAL_SCHEMA_ROOT: oval-language/oval-schemas

jobs:
  validate-self-assertion:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SCAP-NG
        uses: actions/checkout@v4
        with:
          path: scap-ng

      - name: Check out pinned SCAP 1.4 Self-Assertion corpus
        uses: actions/checkout@v4
        with:
          repository: OVAL-Community/SCAP-Self-Assertion
          ref: e3538595c5083b9c34d937a81d319234df9bbfaa
          path: self-assertion

      - name: Check out authoritative OVAL 5.12.3 schemas
        uses: actions/checkout@v4
        with:
          repository: OVAL-Community/OVAL
          ref: v5.12.3
          path: oval-language

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          python -m pip install pyyaml lxml

      - name: Inventory every Self-Assertion definition through v003 lowering
        run: |
          python scap-ng/tools/scap_upconvert_v003/check_self_assertion.py             --corpus self-assertion/SCAP_1.4/OVAL_Test_Content             --output self-assertion-v003-report.json             --inventory-only

      - name: Round-trip every Self-Assertion definition through native v003
        run: |
          python scap-ng/tools/scap_ng_roundtrip_v003/roundtrip_corpus_v003.py \
            --corpus self-assertion/SCAP_1.4/OVAL_Test_Content \
            --out roundtrip-out \
            --report self-assertion-v003-roundtrip.json \
            --inventory-only

      - name: Build aggregate OVAL 5.12.3 validation schema
        run: |
          python scap-ng/tools/scap_ng_roundtrip_v003/build_full_oval_omni.py \
            --schemas oval-language/oval-schemas \
            --output oval-language/oval-schemas/roundtrip-full-omni.xsd

      - name: Validate every regenerated OVAL document with XSD
        run: |
          set -uo pipefail
          : > xsd-validation.log
          failed=0
          for xml in roundtrip-out/*.oval.xml; do
            echo "XSD: $xml" | tee -a xsd-validation.log
            if ! xmllint --noout \
              --schema oval-language/oval-schemas/roundtrip-full-omni.xsd \
              "$xml" 2>&1 | tee -a xsd-validation.log; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then touch xsd-validation.failed; fi

      - name: Validate regenerated Schematron against source baseline
        run: |
          set -euo pipefail
          python scap-ng/tools/scap_ng_roundtrip_v003/compare_schematron_baseline.py \
            --schemas oval-language/oval-schemas \
            --corpus self-assertion/SCAP_1.4/OVAL_Test_Content \
            --report self-assertion-v003-roundtrip.json \
            --output schematron-baseline.json 2>&1 | tee schematron-validation.log

      - name: Upload full Self-Assertion reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-assertion-v003-reports
          path: |
            self-assertion-v003-report.json
            self-assertion-v003-roundtrip.json
            xsd-validation.log
            schematron-validation.log
            xsd-validation.failed
            schematron-baseline.json

      - name: Enforce only pinned deprecated or source-invalid blockers
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected_blockers = {
              ("ios/ios-def_version55_test.xml",
               "oval:navy.navwar.niwcatlantic.scc.ios:def:1"): {"deprecated_oval_test"},
              ("junos/junos-def_xml_config_test.xml",
               "oval:org.joval.junos.test:def:1"): {"deprecated_oval_test"},
              ("macos/ind-def_environmentvariable58_test_mac.xml",
               "oval:navy.navwar.niwcatlantic.scc.test:def:1"): {"var_ref_datatype_mismatch"},
              ("solaris/sol-def_package511_test.xml",
               "oval:navy.navwar.niwcatlantic.scc.test:def:1"): {
                  "var_ref_datatype_mismatch"
              },
              ("windows/win-def_wuaupdatesearcher_test.xml",
               "oval:navy.navwar.niwcatlantic.scc.windows.update:def:1"): {"var_ref_datatype_mismatch"},
          }

          conversion=json.loads(Path("self-assertion-v003-report.json").read_text())
          found={}
          unexpected=[]
          for row in conversion.get("failure_details",[]):
              features=[]
              for problem in row.get("problems",[]):
                  features.extend(problem.get("unsupported_features") or [])
              names={x.get("feature") for x in features}
              key=(row.get("file"),row.get("definition_id"))
              found[key]=names
              if key not in expected_blockers or names != expected_blockers[key]:
                  unexpected.append({"key":key,"features":sorted(names),"row":row})

          if unexpected or found != expected_blockers:
              print(json.dumps({
                  "unexpected_conversion_failures":unexpected,
                  "expected":{str(k):sorted(v) for k,v in expected_blockers.items()},
                  "found":{str(k):sorted(v) for k,v in found.items()},
              },indent=2))
              raise SystemExit(1)

          roundtrip=json.loads(Path("self-assertion-v003-roundtrip.json").read_text())
          found_roundtrip={}
          bad=[]
          for row in roundtrip.get("results",[]):
              if row.get("equal"):
                  continue
              features=row.get("unsupported_features") or []
              names={x.get("feature") for x in features}
              key=(row.get("file"),row.get("definition_id"))
              found_roundtrip[key]=names
              if key not in expected_blockers or names != expected_blockers[key]:
                  bad.append(row)

          if bad or found_roundtrip != expected_blockers:
              print(json.dumps({
                  "unexpected_roundtrip_failures":bad,
                  "expected":{str(k):sorted(v) for k,v in expected_blockers.items()},
                  "found":{str(k):sorted(v) for k,v in found_roundtrip.items()},
              },indent=2))
              raise SystemExit(1)

          expected_equal=roundtrip.get("definitions") - len(expected_blockers)
          if roundtrip.get("semantic_equal") != expected_equal:
              raise SystemExit(
                  f"semantic count mismatch: {roundtrip.get('semantic_equal')} "
                  f"of {roundtrip.get('definitions')}; expected {expected_equal}"
              )
          print(json.dumps({
              "definitions":roundtrip["definitions"],
              "semantic_equal":roundtrip["semantic_equal"],
              "expected_blockers":{
                  str(k):sorted(v) for k,v in expected_blockers.items()
              },
          },indent=2))
          PY

      - name: Enforce OVAL XSD validity
        run: |
          test ! -e xsd-validation.failed
