name: Shared Assessment layout review (#214)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/shared-assessment-layout-preview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-layout-preview-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate-and-publish:
    name: Compare six-STIG layouts and publish isolated preview
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 cryptography jsonschema==4.25.1
      - name: Test normalizer and both layout modes
        run: python tools/test_scap_ng_repo_normalizer.py -v
      - name: Download pinned successful six-STIG converter artifacts
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 38403969304
          github-token: ${{ github.token }}
          pattern: fast-conversion-*
          path: downloads
      # Six converter artifact keys are the native benchmark directory IDs.
      - name: Verify six conversions, compare layouts and compiled bundles
        run: |
          PYTHONPATH=tools python tools/build_shared_layout_preview.py \
            --downloads downloads \
            --work work \
            --source-run-id 38403969304 \
            --niwc-revision 8c8e5dff860af6b1290ee9273a282db24278f8d5 \
            --scap-ng-revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: issue-214-shared-layout-review
          if-no-files-found: error
          retention-days: 90
          path: |
            work/scap-ng-0.3-shared-layout-preview.zip
            work/SHA256SUMS.txt
            work/LAYOUT-COMPARISON.json
            work/grouped-schema.json
            work/grouped-semantics.json
            work/grouped-graph.json
            work/compiler.json
      - name: Publish distinct, immutable prerelease (root README unchanged)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v0.3.0-shared-layout-preview-${GITHUB_SHA:0:12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Never overwrite an existing commit-pinned preview release."
            exit 1
          fi
          cat > work/RELEASE-NOTES.md <<'EOF'
          Issue #214 separate SCAP-NG 0.3 shared Assessment layout review.
          The ZIP contains six real STIG authoring trees arranged by OS family
          and subject, with shortened filenames. The comparison manifest confirms
          Assessment logical IDs, content, and Rule/applicability bindings match
          the original flat format, and six bundles compiled and verified.
          This preview does not replace published six-STIG 0.3 source ZIPs.
          No SCAP-NG normative source-directory requirements have been added.
          The repository root README remains unchanged pending review.
          EOF
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "SCAP-NG 0.3 shared Assessment layout preview" \
            --notes-file work/RELEASE-NOTES.md \
            --prerelease \
            work/scap-ng-0.3-shared-layout-preview.zip \
            work/SHA256SUMS.txt \
            work/LAYOUT-COMPARISON.json
          echo "DURABLE_PREVIEW=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag"
