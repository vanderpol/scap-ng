name: Research 0.4 field-presence source inverse

on:
  push:
    paths:
      - 'research/assessment-simplification/english-first-04/field-presence-iteration/**'
      - 'research/assessment-simplification/english-first-04/canonical-operators/**'
      - 'tools/research_04_field_presence_iteration.py'
      - 'tools/research_04_auditor_preview.py'
      - 'tools/test_research_04_auditor_preview.py'
      - '.github/workflows/research-04-field-presence-iteration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research-inverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Verify five pinned source inverses, YAML syntax, IDs and evaluation paths
        run: python tools/research_04_field_presence_iteration.py --require-yaml
      - name: Guard inherited OVAL six-state truth-table behavior
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_oval_result_truth_tables.py
      - name: Test generated auditor-preview source graph completeness and negative refs
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_04_auditor_preview.py
      - name: Generate read-only auditor previews from the five parsed Assessments
        env:
          PYTHONPATH: tools
        run: python tools/research_04_auditor_preview.py
      - name: Check generated preview output is stable
        env:
          PYTHONPATH: tools
        run: python tools/research_04_auditor_preview.py --check
      - name: Publish generated research previews to GitHub main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        run: |
          git add research/assessment-simplification/english-first-04/field-presence-iteration/generated-previews/
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'docs(#235): publish source-derived auditor preview pages'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'Generated preview pages already current.'
          fi
