name: Windows Observation reuse research

on:
  push:
    paths:
      - tools/prove_windows_domainrole_observation.py
      - tools/test_prove_windows_domainrole_observation.py
      - .github/workflows/windows-observation-reuse-research.yml
      - research/assessment-simplification/shared-observation-17/**
  workflow_dispatch:

permissions:
  contents: read

env:
  NIWC_REVISION: 8c8e5dff860af6b1290ee9273a282db24278f8d5
  ARTIFACT: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: scap-ng
      - uses: actions/checkout@v4
        with:
          repository: niwc-atlantic/scap-content-library
          ref: ${{ env.NIWC_REVISION }}
          path: niwc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 lxml==6.1.1
      - name: Run focused Item-export tests
        run: |
          PYTHONPATH=scap-ng/tools python scap-ng/tools/test_prove_windows_domainrole_observation.py -v
      - name: Convert pinned Windows Server 2025 benchmark
        run: |
          python scap-ng/tools/generate_niwc_current_review.py "niwc/Current/$ARTIFACT" \
            --output work/windows-server-2025 \
            --split-root work/split-windows-server-2025 \
            --source-revision "$NIWC_REVISION" \
            --source-repository-path "Current/$ARTIFACT" \
            --schema scap-ng/third_party/scap-1.4-schemas/omni-schema.xsd \
            --summary work/windows-server-2025/source-generation.json
      - name: Prove shared DomainRole Item export
        run: |
          python scap-ng/tools/prove_windows_domainrole_observation.py work/windows-server-2025 \
            --output work/windows-domainrole-observation-proof.json \
            --artifact-dir work/observation-prototype
      - uses: actions/upload-artifact@v4
        with:
          name: windows-domainrole-observation-proof
          path: |
            work/windows-domainrole-observation-proof.json
            work/observation-prototype
          if-no-files-found: error
