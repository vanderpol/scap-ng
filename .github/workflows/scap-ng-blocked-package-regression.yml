name: Previously blocked NIWC package regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/scap14_rule_splitter.py
      - tools/generate_niwc_current_review.py
      - tools/scap_upconvert_v003/**
      - .github/workflows/scap-ng-blocked-package-regression.yml

permissions:
  contents: read

concurrency:
  group: previously-blocked-niwc-package-regression
  cancel-in-progress: true

env:
  NIWC_REVISION: 8c8e5dff860af6b1290ee9273a282db24278f8d5

jobs:
  blocked-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: scap-ng
      - uses: actions/checkout@v4
        with:
          repository: niwc-atlantic/scap-content-library
          ref: ${{ env.NIWC_REVISION }}
          path: niwc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 lxml==6.1.1
      - name: Generate all previously blocked packages
        run: |
          python - <<'PY'
          import json,re,shutil,subprocess,sys
          from pathlib import Path
          sys.path.insert(0, str(Path("scap-ng/tools").resolve()))
          from generate_niwc_current_review import native_artifact_base

          names=[
            "U_Apple_macOS_13_V1R5_STIG_SCAP_1-4_Benchmark-enhancedV7-signed.zip",
            "U_Apple_macOS_14_V2R3_STIG_SCAP_1-4_Benchmark-enhancedV7-signed.zip",
            "U_Apple_macOS_15_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV8-signed.zip",
            "U_Apple_macOS_26_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV5-signed.zip",
            "U_MS_SQL_Server_2016_Database_V3R4_STIG_SCAP_1-4_Benchmark-enhancedV13-signed.zip",
            "U_MS_IIS_8-5_Site_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-signed.zip",
            "U_MS_SQL_Server_2016_Instance_V3R6_STIG_SCAP_1-4_Benchmark-enhancedV14-signed.zip",
            "U_MS_SQL_Server_2022_Database_V1R2_STIG_SCAP_1-4_Benchmark-enhancedV8-signed.zip",
            "U_F5_NGINX_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip",
            "U_MS_IIS_10-0_Site_V2R14_STIG_SCAP_1-4_Benchmark-enhancedV19-signed.zip",
            "U_MS_SQL_Server_2022_Instance_V1R3_STIG_SCAP_1-4_Benchmark-enhancedV8-signed.zip",
            "U_MS_Windows_10_V3R7_STIG_SCAP_1-4_Benchmark-enhancedV17-signed.zip",
            "U_MS_Windows_Defender_Firewall_V2R3_STIG_SCAP_1-4_Benchmark-enhancedV14-signed.zip",
            "U_MS_IE11_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV17-signed.zip",
            "U_MS_Windows_Server_2016_V2R8_STIG_SCAP_1-4_Benchmark-enhancedV19-signed.zip",
            "U_RHEL_7_V3R15_STIG_SCAP_1-4_Benchmark-enhancedV19-signed.zip",
            "U_MS_Windows_2012_and_2012_R2_DC_V3R6_STIG_SCAP_1-4_Benchmark-enhancedV13-signed.zip",
            "U_Oracle_Linux_7_V3R3_STIG_SCAP_1-4_Benchmark-enhancedV16-signed.zip",
            "U_MS_Windows_2012_and_2012_R2_MS_V3R6_STIG_SCAP_1-4_Benchmark-enhancedV13-signed.zip",
          ]
          work=Path("work"); (work/"generated").mkdir(parents=True,exist_ok=True)
          rows=[]
          for name in names:
              source=Path("niwc/Current")/name
              key=native_artifact_base(source.stem)
              out=work/"generated"/key; split=work/f"split-{key}"
              shutil.rmtree(out,ignore_errors=True); shutil.rmtree(split,ignore_errors=True)
              cmd=[
                  sys.executable,"scap-ng/tools/generate_niwc_current_review.py",str(source),
                  "--output",str(out),"--split-root",str(split),
                  "--source-revision","8c8e5dff860af6b1290ee9273a282db24278f8d5",
                  "--source-repository-path",f"Current/{name}",
                  "--schema","scap-ng/third_party/scap-1.4-schemas/omni-schema.xsd",
                  "--summary",str(out/"source-generation.json"),
              ]
              p=subprocess.run(cmd,capture_output=True,text=True)
              text=p.stdout+"\n"+p.stderr
              status="generated"
              if p.returncode!=0:
                  status=(
                      "expected_deprecated_source"
                      if "unsupported deprecated OVAL" in text
                      else "blocked"
                  )
              rows.append({
                  "artifact":name,
                  "status":status,
                  "returncode":p.returncode,
                  "log_tail":"\n".join(text.splitlines()[-100:]),
              })
              shutil.rmtree(split,ignore_errors=True)
              print(name,rows[-1]["status"])
          expected_blockers={
              "U_MS_SQL_Server_2016_Database_V3R4_STIG_SCAP_1-4_Benchmark-enhancedV13-signed.zip":"nonstandard source capability independent.sqlext",
              "U_MS_SQL_Server_2016_Instance_V3R6_STIG_SCAP_1-4_Benchmark-enhancedV14-signed.zip":"nonstandard source capability independent.sqlext",
              "U_MS_SQL_Server_2022_Database_V1R2_STIG_SCAP_1-4_Benchmark-enhancedV8-signed.zip":"nonstandard source capability independent.sqlext",
              "U_MS_SQL_Server_2022_Instance_V1R3_STIG_SCAP_1-4_Benchmark-enhancedV8-signed.zip":"nonstandard source capability independent.sqlext",
              "U_MS_Windows_Server_2016_V2R8_STIG_SCAP_1-4_Benchmark-enhancedV19-signed.zip":"deprecated source capability windows.wmi",
              "U_F5_NGINX_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip":"collector input cannot use comparison semantics",
              "U_RHEL_7_V3R15_STIG_SCAP_1-4_Benchmark-enhancedV19-signed.zip":"collector input cannot use comparison semantics",
          }
          unexpected=[]
          for row in rows:
              marker=expected_blockers.get(row["artifact"])
              if row["status"]=="blocked":
                  if not marker or marker not in row["log_tail"]:
                      unexpected.append(row)
              elif marker:
                  unexpected.append({
                      "artifact":row["artifact"],
                      "status":row["status"],
                      "reason":"expected blocker disappeared; review before changing baseline",
                  })
          report={
              "packages":len(rows),
              "generated":sum(x["status"]=="generated" for x in rows),
              "expected_deprecated_source":sum(
                  x["status"]=="expected_deprecated_source" for x in rows
              ),
              "known_blocked":sum(
                  x["status"]=="blocked" and x["artifact"] in expected_blockers for x in rows
              ),
              "unexpected_blocked":len(unexpected),
              "expected_blockers":expected_blockers,
              "results":rows,
          }
          Path("work/blocked-package-regression.json").write_text(
              json.dumps(report,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps({k:v for k,v in report.items() if k!="results"},indent=2))
          if unexpected:
              print(json.dumps({"unexpected":unexpected},indent=2))
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blocked-package-regression
          path: work/blocked-package-regression.json
          if-no-files-found: error
