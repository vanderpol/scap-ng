name: 0.4 field-key and static array composition proof

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/research-04-field-key-static-arrays.yml
      - tools/test_research_04_field_key_static_array_composition.py
      - tools/research_04_field_key_authoring.py
      - tools/research_static_literal_collections.py
      - tools/research_04_quantifier_aliases.py
      - schema/v0.3.0/capability-common.schema.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator for actual 0.3 schema
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 jsonschema
      - name: Verify array-value vs entity/item cardinality and exact transform order
        run: PYTHONPATH=tools python tools/test_research_04_field_key_static_array_composition.py -v
