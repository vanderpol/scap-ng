name: Current RHEL9 full source review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/scap_upconvert_v003/convert_full_review.py
      - tools/scap_upconvert_v003/convert_collection_review.py
      - tools/scap_upconvert_v003/audit_full_review.py
      - tools/scap_upconvert_v003/audit_profile_selection.py
      - tools/scap_upconvert_v003/build_rhel9_review_slice.py
      - tools/scap_upconvert_v003/collection_graph.py
      - tools/scap_upconvert_v003/cleanliness.py
      - tools/scap_ng_roundtrip_v003/native_assessment_to_oval.py
      - tools/scap_ng_roundtrip_v003/roundtrip_corpus_v003.py
      - tools/check_current_authoring_contract.py
      - tools/test_full_review_contract.py
      - .github/workflows/scap-ng-current-full-review.yml

permissions:
  contents: read

concurrency:
  group: rhel9-current-full-review-main
  cancel-in-progress: true

jobs:
  full-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: scap-ng
      - uses: actions/checkout@v4
        with:
          repository: niwc-atlantic/scap-content-library
          ref: 8c8e5dff860af6b1290ee9273a282db24278f8d5
          path: niwc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3 lxml==6.1.1
      - name: Shared manual binding regressions
        run: python scap-ng/tools/test_full_review_contract.py
      - name: Full original-package generation and comparative audits
        run: >-
          python scap-ng/tools/scap_upconvert_v003/convert_full_review.py
          --input niwc/Current/U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-signed.zip
          --sha256 70aa6a16221df2c53b094b11b48b16aca1f6d7147c11123b655659ca7711dbb5
          --output work/rhel9-current-full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhel9-current-full-review
          path: work/rhel9-current-full
          if-no-files-found: error
