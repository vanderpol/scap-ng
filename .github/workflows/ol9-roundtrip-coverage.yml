name: Oracle Linux 9 round-trip coverage inventory

on:
  pull_request:
    paths:
      - 'tools/scap_ng_roundtrip_v003/**'
      - '.github/workflows/ol9-roundtrip-coverage.yml'
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SCAP-NG
        uses: actions/checkout@v4
        with:
          path: scap-ng

      - name: Check out pinned NIWC Oracle Linux 9 corpus
        uses: actions/checkout@v4
        with:
          repository: niwc-atlantic/scap-content-library
          ref: 8c8e5dff860af6b1290ee9273a282db24278f8d5
          path: niwc

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check lxml

      - name: Compile round-trip tools
        run: python -m py_compile scap-ng/tools/scap_ng_roundtrip_v003/*.py

      - name: Split the complete Oracle Linux 9 benchmark
        run: |
          mkdir -p work
          python scap-ng/tools/scap14_rule_splitter.py             niwc/Current/U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-signed.zip             --output-dir work/ol9-split             --schema scap-ng/third_party/scap-1.4-schemas/omni-schema.xsd             --source-revision 8c8e5dff860af6b1290ee9273a282db24278f8d5             --source-repository-path Current/U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-signed.zip             --benchmark-key ol9             --fail-on-unresolved

      - name: Inventory complete OVAL surface
        run: |
          python scap-ng/tools/scap_ng_roundtrip_v003/inventory_oval_surface.py             work/ol9-split             --output work/ol9-oval-surface.json

      - name: Summarize round-trip coverage target
        run: |
          python - <<'PY'
          import json
          p='work/ol9-oval-surface.json'
          d=json.load(open(p))
          print(f"Automated OVAL files: {d['file_count']}")
          for k in ('test_types','object_types','state_types','variable_types','functions',
                    'set_operator','filter_action','var_check','entity_check','operations','behaviors'):
              vals=d.get('totals',{}).get(k,{})
              print(f"\n{k}: {len(vals)} unique")
              for name,count in vals.items():
                  print(f"  {count:5}  {name}")
          PY

      - name: Run corpus-wide semantic round trip
        run: |
          python scap-ng/tools/scap_ng_roundtrip_v003/roundtrip_corpus.py             work/ol9-split             --out work/ol9-roundtrip             --strict

      - name: Summarize corpus-wide round trip
        run: |
          python - <<'PY'
          import json
          d=json.load(open('work/ol9-roundtrip/summary.json'))
          print(json.dumps({
              'source_file_count':d['source_file_count'],
              'counts':d['counts'],
              'all_pass':d['all_pass'],
          },indent=2))
          for row in d['rows']:
              if row['status']!='pass':
                  print(row['status'],row['source'],row.get('error',''))
          PY

      - name: Upload full benchmark round-trip evidence
        uses: actions/upload-artifact@v4
        with:
          name: ol9-oval-roundtrip-evidence
          path: |
            work/ol9-oval-surface.json
            work/ol9-roundtrip/summary.json
work/ol9-roundtrip/diffs/

