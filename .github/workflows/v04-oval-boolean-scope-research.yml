name: 0.4.0 OVAL Boolean operator scope analysis
on:
  push:
    branches: [main]
    paths:
      - 'tools/audit_v04_oval_boolean_scopes.py'
      - 'tools/research_v04_oval_logic_scopes.py'
      - 'tools/test_research_v04_oval_logic_scopes.py'
      - 'tools/test_v04_oval_logic_scope_xml_fixture.py'
      - 'tools/preview_v04_oval_operator_field_groups.py'
      - 'tools/test_preview_v04_oval_operator_field_groups.py'
      - 'tools/validate_v04_oval_5123.py'
      - 'tests/v04-oval-operator-scopes/oval-independent-operators.xml'
      - '.github/workflows/v04-oval-boolean-scope-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oval-5123-boolean-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout source-pinned original Self-Assertion content
        uses: actions/checkout@v4
        with:
          repository: OVAL-Community/SCAP-Self-Assertion
          ref: e3538595c5083b9c34d937a81d319234df9bbfaa
          path: source/self-assertion
          persist-credentials: false
      - name: Checkout pinned OVAL 5.12.3 for native operator XSD
        uses: actions/checkout@v4
        with:
          repository: OVAL-Community/OVAL
          ref: v5.12.3
          path: work/oval-5123
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lxml==6.0.2
      - name: Validate native 5.12.3 XML for State-level and Test-level OR ONE XOR
        env:
          PYTHONPATH: tools
        run: |
          python tools/test_v04_oval_logic_scope_xml_fixture.py -v
          python tools/validate_v04_oval_5123.py \
            --schema-dir work/oval-5123/oval-schemas --platform independent \
            --xml tests/v04-oval-operator-scopes/oval-independent-operators.xml \
            --report work/oval-operator-scope-xsd.json
      - name: Exhaustively check 12,432 OVAL six-state logical and quantifier combinations
        env:
          PYTHONPATH: tools
        run: python tools/test_research_v04_oval_logic_scopes.py -v
      - name: Independently prove six original Test/State field-group projections
        env:
          PYTHONPATH: tools
        run: |
          python tools/test_preview_v04_oval_operator_field_groups.py -v
          python tools/preview_v04_oval_operator_field_groups.py \
            --oval-xml tests/v04-oval-operator-scopes/oval-independent-operators.xml \
            --candidate work/oval-operator-field-groups-candidate.json \
            --ledger work/oval-operator-field-groups-source-inverse.json
      - name: Retrieve pinned original NIWC Windows 11 OVAL XML
        run: |
          mkdir -p work
          curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/niwc-atlantic/scap-content-library/main/Current/U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip \
            --output work/windows11-original.zip
      - name: Inventory raw original Test State and field operators
        run: |
          python tools/audit_v04_oval_boolean_scopes.py \
            --self-assertion-original source/self-assertion/SCAP_1.4/OVAL_Test_Content \
            --win11-original-zip work/windows11-original.zip \
            --output work/oval-boolean-scope-original-census.json
      - name: Record original OVAL scope and repeat-field examples without asserting NG parity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v04-oval-boolean-scope-original-audit
          path: |
            work/oval-boolean-scope-original-census.json
            work/oval-operator-scope-xsd.json
            work/oval-operator-field-groups-candidate.json
            work/oval-operator-field-groups-source-inverse.json
          if-no-files-found: ignore
