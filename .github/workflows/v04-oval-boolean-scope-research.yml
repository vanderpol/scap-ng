name: 0.4.0 OVAL Boolean operator scope analysis
on:
  push:
    branches: [main]
    paths:
      - 'tools/audit_v04_oval_boolean_scopes.py'
      - 'tools/research_v04_oval_logic_scopes.py'
      - 'tools/test_research_v04_oval_logic_scopes.py'
      - '.github/workflows/v04-oval-boolean-scope-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oval-5123-boolean-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout source-pinned original Self-Assertion content
        uses: actions/checkout@v4
        with:
          repository: OVAL-Community/SCAP-Self-Assertion
          ref: e3538595c5083b9c34d937a81d319234df9bbfaa
          path: source/self-assertion
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exhaustively check 12,432 OVAL six-state logical and quantifier combinations
        env:
          PYTHONPATH: tools
        run: python tools/test_research_v04_oval_logic_scopes.py -v
      - name: Retrieve pinned original NIWC Windows 11 OVAL XML
        run: |
          mkdir -p work
          curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/niwc-atlantic/scap-content-library/main/Current/U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip \
            --output work/windows11-original.zip
      - name: Inventory raw original Test State and field operators
        run: |
          python tools/audit_v04_oval_boolean_scopes.py \
            --self-assertion-original source/self-assertion/SCAP_1.4/OVAL_Test_Content \
            --win11-original-zip work/windows11-original.zip \
            --output work/oval-boolean-scope-original-census.json
      - name: Record original OVAL scope and repeat-field examples without asserting NG parity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v04-oval-boolean-scope-original-audit
          path: work/oval-boolean-scope-original-census.json
          if-no-files-found: ignore
