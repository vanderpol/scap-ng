name: Full 0.3 modernization census

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/full-0.3-modernization-census.yml
      - tools/measure_full_modernization_census.py
      - tools/test_measure_full_modernization_census.py
      - tools/research_inline_private_components.py
      - tools/research_static_literal_collections.py
      - tools/test_research_static_literal_collections.py
      - tools/aggregate_full_modernization_census.py
      - tools/scap_upconvert_v003/assessment_oval_vocabulary.py
      - tools/scap_upconvert_v003/test_assessment_oval_vocabulary.py
      - tools/scap_upconvert_v003/native_capability_mapping.py
      - tools/scap_upconvert_v003/test_native_capability_mapping.py
      - tools/scap_upconvert_v003/foreach_modernization.py
      - tools/scap_upconvert_v003/test_foreach_modernization.py
      - tools/scap_upconvert_v003/convert_collection_review.py
      - tools/scap_upconvert_v003/convert_full_review.py
      - tools/generate_niwc_current_review.py
      - tools/check_current_authoring_contract.py
      - tools/audit_v003_explicit_defaults.py

permissions:
  contents: read

concurrency:
  group: full-0.3-modernization-census
  cancel-in-progress: true

env:
  NIWC_REVISION: 8c8e5dff860af6b1290ee9273a282db24278f8d5

jobs:
  precheck:
    name: Validate census transforms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: scap-ng
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 lxml==6.1.1
      - name: Run focused census tests
        run: |
          PYTHONPATH=scap-ng/tools python scap-ng/tools/scap_upconvert_v003/test_assessment_oval_vocabulary.py -v
          PYTHONPATH=scap-ng/tools python scap-ng/tools/test_measure_full_modernization_census.py -v
          PYTHONPATH=scap-ng/tools python scap-ng/tools/test_research_inline_private_components.py -v
          PYTHONPATH=scap-ng/tools python scap-ng/tools/test_research_static_literal_collections.py -v

  census:
    name: Census fresh native batch ${{ matrix.batch }}
    needs: precheck
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        batch: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: scap-ng
      - uses: actions/checkout@v4
        with:
          repository: niwc-atlantic/scap-content-library
          ref: ${{ env.NIWC_REVISION }}
          path: niwc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 lxml==6.1.1

      - name: Generate and measure batch
        env:
          BATCH: ${{ matrix.batch }}
        run: |
          PYTHONPATH=scap-ng/tools python - <<'PY'
          import json
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("scap-ng/tools").resolve()))
          from generate_niwc_current_review import native_artifact_base

          batch = int(os.environ["BATCH"])
          revision = os.environ["NIWC_REVISION"]
          files = sorted(
              p for p in Path("niwc/Current").glob("*SCAP_1-4_Benchmark*.zip")
              if "Consolidated" not in p.name
          )
          if len(files) != 65:
              raise SystemExit(
                  f"Expected 65 pinned individual NIWC packages, found {len(files)}"
              )

          selected = [p for i, p in enumerate(files) if i % 4 == batch]
          base = Path("work/result")
          status_dir = base / "status"
          report_dir = base / "reports"
          log_dir = base / "logs"
          for d in (status_dir, report_dir, log_dir):
              d.mkdir(parents=True, exist_ok=True)

          for source in selected:
              artifact = source.name
              key = native_artifact_base(source.stem)
              out = Path("work/generated") / key
              split = Path("work") / f"split-{key}"
              shutil.rmtree(out, ignore_errors=True)
              shutil.rmtree(split, ignore_errors=True)

              cmd = [
                  sys.executable,
                  "scap-ng/tools/generate_niwc_current_review.py",
                  str(source),
                  "--output", str(out),
                  "--split-root", str(split),
                  "--source-revision", revision,
                  "--source-repository-path", f"Current/{artifact}",
                  "--schema", "scap-ng/third_party/scap-1.4-schemas/omni-schema.xsd",
                  "--summary", str(out / "source-generation.json"),
              ]
              proc = subprocess.run(cmd, capture_output=True, text=True)
              log = proc.stdout + "\n" + proc.stderr
              (log_dir / f"{key}.log").write_text(log, encoding="utf-8")

              status = {
                  "artifact": artifact,
                  "key": key,
                  "status": "generated" if proc.returncode == 0 else "blocked",
                  "returncode": proc.returncode,
                  "log_tail": "\n".join(log.splitlines()[-80:]),
              }

              if proc.returncode == 0:
                  report_path = report_dir / f"{key}.json"
                  measure = [
                      sys.executable,
                      "scap-ng/tools/measure_full_modernization_census.py",
                      str(out),
                      "--label", key,
                      "--source-artifact", artifact,
                      "--output", str(report_path),
                  ]
                  measured = subprocess.run(measure, capture_output=True, text=True)
                  (log_dir / f"{key}.census.log").write_text(
                      measured.stdout + "\n" + measured.stderr,
                      encoding="utf-8",
                  )
                  if measured.returncode != 0:
                      status["status"] = "census_failed"
                      status["census_returncode"] = measured.returncode
                      status["census_log_tail"] = "\n".join(
                          (measured.stdout + "\n" + measured.stderr).splitlines()[-80:]
                      )

              (status_dir / f"{key}.json").write_text(
                  json.dumps(status, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              shutil.rmtree(out, ignore_errors=True)
              shutil.rmtree(split, ignore_errors=True)
              print(json.dumps({
                  "artifact": artifact,
                  "key": key,
                  "status": status["status"],
              }))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: modernization-census-batch-${{ matrix.batch }}
          path: work/result
          if-no-files-found: error
          compression-level: 6

  aggregate:
    name: Aggregate 65-package census
    needs: census
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: scap-ng
      - uses: actions/download-artifact@v4
        with:
          pattern: modernization-census-batch-*
          path: downloads
      - name: Aggregate with full source accounting
        run: |
          python scap-ng/tools/aggregate_full_modernization_census.py downloads \
            --niwc-revision "$NIWC_REVISION" \
            --output work/full-modernization-census.json \
            --markdown work/full-modernization-census.md
      - uses: actions/upload-artifact@v4
        with:
          name: full-0.3-modernization-census
          path: |
            work/full-modernization-census.json
            work/full-modernization-census.md
            downloads
          if-no-files-found: error
          compression-level: 6
