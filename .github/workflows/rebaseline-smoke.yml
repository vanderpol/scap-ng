# Rebaseline safety net: broad read-only regression after repository cleanup.
# 0.2 is an archived schema checkpoint; no frozen Board content re-generation.
name: Rebaseline smoke regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tests/corpus-manifest.yaml
      - specification/migration/oval-test-support-overrides.json
      - tools/**
      - schema/**
      - specification/**
      - review/**
      - docs/repository-policy.json
      - docs/lossless-rebaseline.md
      - .github/workflows/rebaseline-smoke.yml

permissions:
  contents: read

concurrency:
  group: rebaseline-smoke-main
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 lxml==6.1.1 jsonschema==4.25.1 cryptography
      - name: Compile Python tooling
        run: python -m compileall -q tools
      - name: Verify repository rebaseline boundaries
        run: python tools/audit_repository_layout.py --check
      - name: Check out pinned original OVAL regression fixtures
        uses: actions/checkout@v4
        with:
          repository: OVAL-Community/SCAP-Self-Assertion
          ref: e3538595c5083b9c34d937a81d319234df9bbfaa
          path: pinned-self-assertion
          sparse-checkout: |
            SCAP_1.4/OVAL_Test_Content/agnostic/ind-def_family_test.xml
            SCAP_1.4/OVAL_Test_Content/agnostic/ind-def_variable_test.xml
            SCAP_1.4/OVAL_Test_Content/agnostic/oval-def_constant_variable.xml
            SCAP_1.4/OVAL_Test_Content/agnostic/oval_boolean_datatype.xml
            SCAP_1.4/OVAL_Test_Content/agnostic/oval_check_enumeration_variable_values.xml
            SCAP_1.4/OVAL_Test_Content/agnostic/oval_int_datatype.xml
            SCAP_1.4/OVAL_Test_Content/agnostic/oval_string_datatype.xml
            SCAP_1.4/OVAL_Test_Content/aix/aix-def_fileset_test.xml
            SCAP_1.4/OVAL_Test_Content/asa/asa-def_line_test.xml
            SCAP_1.4/OVAL_Test_Content/asa/asa-def_version_test.xml
            SCAP_1.4/OVAL_Test_Content/ios/ios-def_bgpneighbor_test.xml
            SCAP_1.4/OVAL_Test_Content/ios/ios-def_global_test.xml
            SCAP_1.4/OVAL_Test_Content/ios/ios-def_line_test.xml
            SCAP_1.4/OVAL_Test_Content/ios/ios-def_section_test.xml
            SCAP_1.4/OVAL_Test_Content/iosxe/iosxe-def_line_test.xml
            SCAP_1.4/OVAL_Test_Content/linux/ind-def_environmentvariable58_test_linux.xml
            SCAP_1.4/OVAL_Test_Content/linux/linux-def_apparmorstatus_test.xml
            SCAP_1.4/OVAL_Test_Content/macos/macos-def_filevault_test.xml
            SCAP_1.4/OVAL_Test_Content/macos/macos-def_firmwarepassword_test.xml
            SCAP_1.4/OVAL_Test_Content/macos/macos-def_gatekeeper_test.xml
            SCAP_1.4/OVAL_Test_Content/macos/macos-def_profiles_test.xml
            SCAP_1.4/OVAL_Test_Content/unix/unix-def_uname_test.xml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Bind vendored pinned OVAL XSD for positive and negative operator guards
        run: |
          mkdir -p work/oval-5123
          ln -s "$GITHUB_WORKSPACE/third_party/scap-1.4-schemas/oval_5.12.3" work/oval-5123/oval-schemas
      - name: Run maintained tool regressions
        env:
          PYTHONPATH: .:tools:tools/scap_upconvert_v003:tools/scap_ng_roundtrip_v003
          SCAP_NG_ENVIRONMENT58_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/linux/ind-def_environmentvariable58_test_linux.xml
          SCAP_NG_UNAME_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/unix/unix-def_uname_test.xml
          SCAP_NG_VARIABLE_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/agnostic/ind-def_variable_test.xml
          SCAP_NG_CONSTANT_VARIABLE_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/agnostic/oval-def_constant_variable.xml
          SCAP_NG_CHECK_ENUMERATION_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/agnostic/oval_check_enumeration_variable_values.xml
          SCAP_NG_BOOLEAN_DATATYPE_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/agnostic/oval_boolean_datatype.xml
          SCAP_NG_STRING_DATATYPE_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/agnostic/oval_string_datatype.xml
          SCAP_NG_INT_DATATYPE_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/agnostic/oval_int_datatype.xml
          SCAP_NG_APPARMOR_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/linux/linux-def_apparmorstatus_test.xml
          SCAP_NG_FAMILY_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/agnostic/ind-def_family_test.xml
          SCAP_NG_IOS_BGP_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/ios/ios-def_bgpneighbor_test.xml
          SCAP_NG_IOS_SECTION_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/ios/ios-def_section_test.xml
          SCAP_NG_ASA_LINE_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/asa/asa-def_line_test.xml
          SCAP_NG_AIX_FILESET_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/aix/aix-def_fileset_test.xml
          SCAP_NG_ASA_VERSION_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/asa/asa-def_version_test.xml
          SCAP_NG_IOS_GLOBAL_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/ios/ios-def_global_test.xml
          SCAP_NG_IOS_LINE_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/ios/ios-def_line_test.xml
          SCAP_NG_IOSXE_LINE_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/iosxe/iosxe-def_line_test.xml
          SCAP_NG_FILEVAULT_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/macos/macos-def_filevault_test.xml
          SCAP_NG_FIRMWAREPASSWORD_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/macos/macos-def_firmwarepassword_test.xml
          SCAP_NG_PROFILES_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/macos/macos-def_profiles_test.xml
          OVAL_GATEKEEPER_SOURCE: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/macos/macos-def_gatekeeper_test.xml
        run: python tools/run_current_tool_regressions.py --report work/current-regressions.json
      - name: Retain exact selection and actual regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-v04-regression-results
          path: work/current-regressions.json
          if-no-files-found: error
      - name: Check promoted current data inputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          json.loads(Path("specification/migration/oval-test-support-overrides.json").read_text())
          yaml.safe_load(Path("tests/corpus-manifest.yaml").read_text())
          print("promoted data inputs parse successfully")
          PY
      - name: Report iteration-003 cleanup candidate references
        run: |
          python - <<'PY'
          from pathlib import Path
          prefixes = (
              "research/iterations/003/source/",
              "research/iterations/003/packages/",
              "research/iterations/003/evidence/",
          )
          roots = [Path("tools"), Path(".github/workflows"), Path("schema"), Path("specification"), Path("review"), Path("docs")]
          hits = []
          for root in roots:
              if not root.exists():
                  continue
              for p in root.rglob("*"):
                  if not p.is_file():
                      continue
                  try:
                      text = p.read_text(encoding="utf-8")
                  except (UnicodeDecodeError, OSError):
                      continue
                  for prefix in prefixes:
                      if prefix in text:
                          hits.append((p.as_posix(), prefix))
          for path, prefix in hits:
              print(f"{path}: {prefix}")
          print(f"candidate_reference_count={len(hits)}")
          PY
      - name: Verify no current workflow publishes generated review trees
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden = (
              "research/iterations/003/review/rhel9-current-full",
              "research/iterations/003/review/windows11-current-full",
              "research/iterations/003/review/full-current-native-normalized",
          )
          problems=[]
          for p in Path(".github/workflows").glob("*.yml"):
              if p.name == "rebaseline-smoke.yml":
                  continue
              text=p.read_text()
              for needle in forbidden:
                  if needle in text:
                      problems.append(f"{p}: {needle}")
          if problems:
              raise SystemExit("Generated-review publication path still referenced:\n" + "\n".join(problems))
          print("no generated review publication paths remain in workflows")
          PY
