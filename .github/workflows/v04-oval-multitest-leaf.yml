name: 0.4.0 original OVAL multi-Test flat-Object pilot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v04-oval-multitest-leaf.yml'
      - 'tools/convert_v04_oval_multitest_leaf.py'
      - 'tools/export_v04_oval_ios_global_multitest.py'
      - 'tools/validate_v04_oval_5123.py'
      - 'tools/audit_v04_oval_xml_roundtrip.py'
      - 'tools/merge_v04_oval_test_content_coverage.py'
      - 'tools/audit_v04_oval_test_content_readiness.py'
      - 'tools/v04_flat_object_authoring.py'
      - 'schema/v0.4.0/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-oval-to-native-040:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: scap-ng
      - uses: actions/checkout@v4
        with:
          repository: OVAL-Community/SCAP-Self-Assertion
          ref: e3538595c5083b9c34d937a81d319234df9bbfaa
          path: original-oval
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OVAL-Community/OVAL
          ref: v5.12.3
          path: oval-language
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned original source and dependencies
        run: |
          test "$(git -C original-oval rev-parse HEAD)" = "e3538595c5083b9c34d937a81d319234df9bbfaa"
          python -m pip install PyYAML==6.0.3 jsonschema==4.25.1 lxml==6.0.2
      - name: Retrieve verified 167-Definition source compatibility evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p source-review
          gh run download 39344457603 --repo "$GH_REPO" \
            --name c-original-oval-compatibility-review-not-native-conversion \
            --dir source-review
          test -f source-review/c-review/manifest.json
          test -f source-review/c-native/conversion-manifest.json
      - name: Convert pinned multi-Test no-State graphs to canonical 0.4
        env:
          PYTHONPATH: scap-ng/tools
        run: |
          python scap-ng/tools/convert_v04_oval_multitest_leaf.py \
            --source-review source-review \
            --original-oval original-oval/SCAP_1.4/OVAL_Test_Content \
            --catalog scap-ng/schema/v0.4.0/capability-mappings/supported \
            --output work/native-040-multitest
      - name: Validate current native 0.4 JSON Schema and paired YAML/JSON
        env:
          PYTHONPATH: scap-ng/tools
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          from v04_canonical_source_ir import _schema_validators,validate_docs
          base=Path('work/native-040-multitest')
          report=json.loads((base/'manifest.json').read_text())
          valid=[row for row in report['cases']
                 if row['status']=='CURRENT_040_FLAT_OBJECT_SOURCE_MATCHED_SCHEMA_PENDING']
          assert len(report['cases'])==44
          assert len(valid)>=2
          assert len(valid)+report['not_yet_covered']==44
          validators=_schema_validators(Path('scap-ng/schema/v0.4.0'))
          docs={}
          for row in valid:
              expected=json.loads((base/row['assessment_json']).read_text())
              observed=yaml.safe_load((base/row['assessment_yaml']).read_text())
              assert observed==expected,row['definition_id']
              docs[row['assessment_json']]=expected
              a=expected['assessment']
              assert a['specification']['version']=='0.4.0'
              assert all('select' not in test['object']
                         and 'collect' not in test['object']
                         for test in a['tests'].values())
              p=json.loads((base/row['proof_file']).read_text())
              assert p['source_definition_id']==row['definition_id']
              assert p['source_test_count']==len(a['tests'])
          validate_docs(docs,validators)
          report['schema_status']='PASS_ALL_EMITTED_NATIVE_040'
          report['native_040_schema_validated_definitions']=len(docs)
          for row in valid:
              row['status']='CURRENT_040_SOURCE_XML_AND_SCHEMA_VALIDATED_NOT_RUNTIME'
              proof_file=base/row['proof_file']
              proof=json.loads(proof_file.read_text())
              proof['native_schema_validation']='PASS'
              proof_file.write_text(json.dumps(proof,indent=2)+'\n')
          (base/'manifest.json').write_text(json.dumps(report,indent=2)+'\n')
          print('PASS:',len(docs),'flat-Object multi-Test NG Assessments')
          PY
      - name: Reject mutated original OVAL selectors and Test checks
        env:
          PYTHONPATH: scap-ng/tools
        run: |
          python - <<'PY'
          from copy import deepcopy
          import json
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import xml.etree.ElementTree as ET
          from hashlib import sha256
          from convert_v04_oval_multitest_leaf import convert_one,load_catalog_renames,Unsupported
          review=json.loads(Path('source-review/c-review/manifest.json').read_text())
          rows={(r['file'],r['definition_id']):r for r in review['exported_views']}
          target=('ios/ios-def_global_test.xml','oval:navy.navwar.niwcatlantic.scc.ios:def:1')
          raw=json.loads((Path('source-review/c-review')/rows[target]['review_file']).read_text())
          source=Path('original-oval/SCAP_1.4/OVAL_Test_Content')/target[0]
          catalog=load_catalog_renames(Path('scap-ng/schema/v0.4.0/capability-mappings/supported'))
          converted,proof=convert_one(raw,source,catalog)
          assert len(converted['assessment']['tests'])==2
          bad=deepcopy(raw)
          test=next(iter(bad['A_source_compatibility_fallback']['tests'].values()))
          test['check']='only one'
          try: convert_one(bad,source,catalog)
          except Unsupported as e: assert 'TEST_QUANTIFIER' in str(e),str(e)
          else: raise AssertionError('Changed Test check passed')
          with TemporaryDirectory() as temp:
              copied=Path(temp)/'SCAP_1.4/OVAL_Test_Content'/target[0]
              copied.parent.mkdir(parents=True)
              root=ET.fromstring(source.read_bytes())
              object_node=next(n for n in root.iter() if n.tag.endswith('}global_object'))
              next(iter(object_node)).text='wrong-command'
              altered=ET.tostring(root)
              copied.write_bytes(altered)
              bad=deepcopy(raw)
              bad['source']['source_file_sha256']=sha256(altered).hexdigest()
              try: convert_one(bad,copied,catalog)
              except Unsupported as e: assert 'ORIGINAL_OVAL_SELECTOR' in str(e),str(e)
              else: raise AssertionError('Changed original OVAL selector passed')
          print('PASS: semantic mutations rejected')
          PY
      - name: Merge proven 0.4 subset with complete original 167-Definition source ledger
        env:
          PYTHONPATH: scap-ng/tools
        run: |
          python scap-ng/tools/audit_v04_oval_test_content_readiness.py \
            --input source-review --output work/source-universe
          python scap-ng/tools/merge_v04_oval_test_content_coverage.py \
            --baseline work/source-universe/release-readiness.json \
            --native-pilot work/native-040-multitest \
            --output work/native-040-multitest/cumulative-167-definition-readiness.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path(
              'work/native-040-multitest/cumulative-167-definition-readiness.json'
          ).read_text())
          assert len(data['records'])==167
          assert data['current_040_schema_and_original_source_validated']==2
          assert data['remaining_v003_compatible_without_current_040_proof']==160
          assert data['original_source_invalid_or_deprecated']==5
          assert data['scanner_result_parity_proven']==0
          print('PASS: 167 original Definitions fully accounted, 2 new canonical 0.4.0 source+schema proofs')
          PY
      - name: Independent canonical 0.4 Assessment to OVAL XML and exact graph differential
        env:
          PYTHONPATH: scap-ng/tools
        run: |
          python - <<'PY'
          from copy import deepcopy
          from hashlib import sha256
          import json,shutil
          from pathlib import Path
          from export_v04_oval_ios_global_multitest import emit
          from validate_v04_oval_5123 import check
          from audit_v04_oval_xml_roundtrip import audit,FORMAT
          from scap_ng_roundtrip_v003.compare_oval_semantics import compare
          work=Path('work/native-040-multitest')
          report=json.loads((work/'manifest.json').read_text())
          valid=[r for r in report['cases']
                 if r['status']=='CURRENT_040_SOURCE_XML_AND_SCHEMA_VALIDATED_NOT_RUNTIME']
          assert len(valid)==2
          cases=[]
          for row in valid:
              platform=row['file'].split('/')[0]
              assert platform in {'ios','iosxe'}
              native=work/row['assessment_json']
              document=json.loads(native.read_text())
              generated,did=emit(document)
              folder=work/'independent-oval-roundtrip'/platform
              folder.mkdir(parents=True,exist_ok=True)
              target=folder/'regenerated.xml'
              generated.write(target,encoding='utf-8',xml_declaration=True)
              original=folder/'pinned-original.xml'
              shutil.copyfile(
                  Path('original-oval/SCAP_1.4/OVAL_Test_Content')/row['file'],
                  original)
              schema=check(Path('oval-language/oval-schemas'),target,platform)
              (folder/'xsd-proof.json').write_text(json.dumps(schema,indent=2)+'\n')
              assert schema['status']=='PASS',schema['diagnostics']
              comparison=compare(original,target,
                  source_root=row['definition_id'],
                  regenerated_root=did,root_only=True)
              (folder/'oval-semantic-proof.json').write_text(
                  json.dumps(comparison,indent=2,default=str)+'\n')
              assert comparison['equal'],(row['file'],comparison)
              # A deliberately altered native selector MUST produce an unequal
              # OVAL Definition closure even though the XML still parses.
              bad=deepcopy(document)
              first=next(iter(bad['assessment']['tests'].values()))
              first['object']['global_command']={'equals':'intentionally-wrong-command'}
              mutated,_=emit(bad)
              bad_path=folder/'mutated-negative.xml'
              mutated.write(bad_path,encoding='utf-8',xml_declaration=True)
              result=compare(original,bad_path,
                  source_root=row['definition_id'],
                  regenerated_root=did,root_only=True)
              assert not result['equal'],"A mutated selector escaped OVAL graph comparison"
              (folder/'negative-mutation-proof.json').write_text(
                  json.dumps({'mutated_differs':True,
                              'native_expression_reused':True,
                              'source_consulted_by_exporter':False},indent=2)+'\n')
              digest=lambda p:sha256(p.read_bytes()).hexdigest()
              cases.append({
                  'case_id':row['file'],
                  'status':'converted',
                  'forward_profile':'0.4.0',
                  'reverse_profile':'0.4.0',
                  'original':str(original.relative_to(work)),
                  'original_sha256':digest(original),
                  'native_assessment':row['assessment_json'],
                  'native_assessment_sha256':digest(native),
                  'regenerated':str(target.relative_to(work)),
                  'regenerated_sha256':digest(target),
                  'source_definition':row['definition_id'],
                  'regenerated_definition':did,
              })
          manifest={'format':FORMAT,'profile':'0.4.0','cases':cases}
          root=work/'independent-oval-roundtrip'
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          proof=audit(manifest,work,expected=2)
          (root/'complete-semantic-proof.json').write_text(json.dumps(
              proof,indent=2,default=str)+'\n')
          assert proof['status']=='PASS' and proof['source_case_count']==2 and proof['outcome_counts']=={'EQUAL':2},proof
          report['original_oval_xml_semantics']='PASS_INDEPENDENT_OVAL_5123_EXPORT_2_DEFINITIONS'
          report['native_040_independent_oval_roundtrips']=2
          (work/'manifest.json').write_text(json.dumps(report,indent=2)+'\n')
          print('PASS: IOS and IOS-XE source XML -> canonical 0.4 -> independent OVAL XML 5.12.3 semantic graph and XSD; tampering rejected.')
          PY
      - name: Reviewer overview
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('work/native-040-multitest')
          report=json.loads((root/'manifest.json').read_text())
          accepted=[r for r in report['cases'] if 'SCHEMA_VALIDATED' in r['status']]
          lines=[
            '# OVAL Self-Assertion → canonical 0.4.0 multi-Test pilot',
            '',
            '**Narrow source-checked subset, not the complete 167-Definition release.**',
            '',
            f"Pinned original source: {report['pin']}",
            f"Previously unsupported multi-Test denominator: {report['source_multitest_denominator']}",
            f"New source-matched/native-schema-validated 0.4 Assessments: {len(accepted)}",
            f"Still unsupported in this pilot: {report['not_yet_covered']}",
            '',
            'Each success has a full JSON Assessment, hybrid YAML and source proof.',
            'The manifest accounts for all 44 candidates with explicit failure reasons.',
            'No independent XML re-export or scanner execution parity is yet claimed.',
            '',
            '## Converted original Definitions',''
          ]
          lines += [f"- {r['file']}: {r['assessment_yaml']}" for r in accepted]
          (root/'START-HERE.md').write_text('\n'.join(lines)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v04-original-oval-multitest-source-and-schema-validated-pilot
          path: work/native-040-multitest/
          if-no-files-found: ignore
