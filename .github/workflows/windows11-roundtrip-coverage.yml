name: Windows 11 round-trip coverage inventory

on:
  pull_request:
    paths:
      - 'tools/scap_ng_roundtrip_v003/**'
      - '.github/workflows/windows11-roundtrip-coverage.yml'
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SCAP-NG
        uses: actions/checkout@v4
        with:
          path: scap-ng

      - name: Check out pinned NIWC Windows 11 corpus
        uses: actions/checkout@v4
        with:
          repository: niwc-atlantic/scap-content-library
          ref: 8c8e5dff860af6b1290ee9273a282db24278f8d5
          path: niwc

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check lxml

      - name: Compile round-trip tools
        run: python -m py_compile scap-ng/tools/scap_ng_roundtrip_v003/*.py

      - name: Split the complete Windows 11 benchmark
        run: |
          mkdir -p work
          python scap-ng/tools/scap14_rule_splitter.py \
            niwc/Current/U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip \
            --output-dir work/windows11-split \
            --schema scap-ng/third_party/scap-1.4-schemas/omni-schema.xsd \
            --source-revision 8c8e5dff860af6b1290ee9273a282db24278f8d5 \
            --source-repository-path Current/U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip \
            --benchmark-key windows11 \
            --fail-on-unresolved

      - name: Inventory complete OVAL surface
        run: |
          python scap-ng/tools/scap_ng_roundtrip_v003/inventory_oval_surface.py \
            work/windows11-split \
            --output work/windows11-oval-surface.json

      - name: Summarize round-trip coverage target
        run: |
          python - <<'PY'
          import json
          d=json.load(open('work/windows11-oval-surface.json'))
          print(f"Automated OVAL files: {d['file_count']}")
          for k in ('test_types','object_types','state_types','variable_types','functions',
                    'set_operator','filter_action','var_check','entity_check','operations','behaviors'):
              vals=d.get('totals',{}).get(k,{})
              print(f"\n{k}: {len(vals)} unique")
              for name,count in vals.items():
                  print(f"  {count:5}  {name}")
          PY

      - name: Run corpus-wide semantic round trip
        run: |
          python scap-ng/tools/scap_ng_roundtrip_v003/roundtrip_corpus.py \
            work/windows11-split \
            --out work/windows11-roundtrip

      - name: Summarize corpus-wide round trip
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('work/windows11-roundtrip/summary.json')
          if not p.exists():
              print('No round-trip summary generated')
              raise SystemExit(0)
          d=json.load(open(p))
          print(json.dumps({
              'source_file_count':d['source_file_count'],
              'counts':d['counts'],
              'all_pass':d['all_pass'],
              'error_signatures':d.get('error_signatures',{}),
          },indent=2))
          PY

      - name: Upload Windows 11 round-trip evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows11-oval-roundtrip-evidence
          path: |
            work/windows11-oval-surface.json
            work/windows11-roundtrip/summary.json
work/windows11-roundtrip/diffs/

