name: 0.4 RHEL9 Win11 Server2025 shorthand comparison

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/research-04-three-benchmark-quantifier.yml
      - tools/research_04_three_benchmark_quantifier.py
      - tools/research_04_rhel9_compact_preview.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Verify normalized original RHEL9 field-none and new aliases
        run: |
          PYTHONPATH=tools python tools/test_research_04_rhel9_compact_preview.py -v
          PYTHONPATH=tools python tools/test_research_04_field_key_authoring.py -v
      - name: Retrieve immutable 0.3 six-STIG authoring source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p work
          gh release download v0.3.0-six-stig-typed-operators-5796d016b12f \
            --pattern scap-ng-0.3-six-stig-authoring.zip --dir work
      - name: Survey three STIGs; fail if any shared Assessment missing or source differs
        run: |
          PYTHONPATH=tools python tools/research_04_three_benchmark_quantifier.py \
            --authoring-zip work/scap-ng-0.3-six-stig-authoring.zip \
            --output work/three-benchmark-shortcuts.json \
            --markdown work/three-benchmark-shortcuts.md
      - name: Explain residual real Test/field semantics, source Rules and patterns
        run: |
          python - <<'PY'
          import collections,json
          from pathlib import Path
          result=json.loads(Path("work/three-benchmark-shortcuts.json").read_text())
          for name,benchmark in result["benchmarks"].items():
              sources=benchmark["residual_source_assessments"]
              patterns=collections.defaultdict(list)
              for a in sources:
                  for r in a["residuals"]:
                      label=(r["location"] if r["location"]=="test" else "field",
                             "/".join(r["pair"]),r["capability"])
                      patterns[label].append({
                          "rules":a["referenced_rule_ids"],
                          "assessment_id":a["assessment_id"],
                          "test":r["test"],
                          "file":a["file"],
                          "state_free":r.get("state_free"),
                          "states_count":r.get("states_count"),
                          "field":r.get("field"),
                          "states_match":r.get("states_match"),
                          "expression":str(r.get("state_predicate") or r.get("test_sample"))[:700],
                          "evaluate":str(a.get("evaluate"))[:500],
                      })
              print("=== BENCHMARK",name,"REMAINING",sum(map(len,patterns.values())),
                    "UNIQUE_ASSESSMENTS",len(sources))
              for key,occurrences in sorted(patterns.items(),key=lambda kv:(kv[0][0],kv[0][1],kv[0][2])):
                  print("PATTERN",str(key),"COUNT",len(occurrences))
                  for example in occurrences[:12 if name=="rhel_9" else 4]:
                      print("EXAMPLE",json.dumps(example,sort_keys=True,default=str))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rhel9-win11-server2025-quantifier-04
          path: |
            work/three-benchmark-shortcuts.json
            work/three-benchmark-shortcuts.md
          if-no-files-found: error
          retention-days: 90
