name: Research 0.4 quantifier-presets across six STIGs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/research-04-quantifier-aliases.yml
      - tools/research_04_quantifier_aliases.py
      - tools/test_research_04_quantifier_aliases.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quantify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Reject unsafe quantifier-preset expansions
        run: PYTHONPATH=tools python tools/test_research_04_quantifier_aliases.py -v
      - name: Download immutable six-STIG 0.3 release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p work
          gh release download v0.3.0-six-stig-typed-operators-5796d016b12f \
            --pattern scap-ng-0.3-six-stig-authoring.zip --dir work
      - name: Measure each exact existence/match pair and safe subset
        run: |
          python tools/research_04_quantifier_aliases.py \
            --authoring-zip work/scap-ng-0.3-six-stig-authoring.zip \
            --output work/quantifier-preset-census.json
      - uses: actions/upload-artifact@v4
        with:
          name: quantifier-preset-six-stig-research
          path: work/quantifier-preset-census.json
          if-no-files-found: error
