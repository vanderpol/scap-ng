name: Generate priority NIWC rule-level OVAL corpus

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-priority-niwc-rule-splits.yml"
      - "research/iterations/001/tools/scap14_rule_splitter.py"
      - "research/iterations/001/tools/oval_semantic_ir.py"
      - "research/iterations/001/public-corpus-manifest.yaml"
      - "third_party/scap-1.4-schemas/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split-and-parse:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SCAP-NG
        uses: actions/checkout@v4
        with:
          path: scap-ng

      - name: Check out pinned NIWC published corpus
        uses: actions/checkout@v4
        with:
          repository: niwc-atlantic/scap-content-library
          ref: 8c8e5dff860af6b1290ee9273a282db24278f8d5
          path: niwc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install XML dependency
        run: python -m pip install --disable-pip-version-check lxml

      - name: Validate vendored SCAP 1.4 schema set
        run: |
          python scap-ng/research/iterations/001/tools/validate_scap14_schema_bundle.py \
            scap-ng/third_party/scap-1.4-schemas

      - name: Split four priority published benchmarks
        shell: bash
        run: |
          set -euo pipefail
          splitter="scap-ng/research/iterations/001/tools/scap14_rule_splitter.py"
          schema="scap-ng/third_party/scap-1.4-schemas/omni-schema.xsd"
          out="scap-ng/research/iterations/001/generated/niwc-rule-splits"
          rev="8c8e5dff860af6b1290ee9273a282db24278f8d5"
          rm -rf "$out"
          mkdir -p "$out"

          python "$splitter"             niwc/Current/U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-signed.zip             --output-dir "$out/rhel9" --schema "$schema" --source-revision "$rev"             --source-repository-path Current/U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-signed.zip             --benchmark-key rhel9 --fail-on-unresolved

          python "$splitter"             niwc/Current/U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-signed.zip             --output-dir "$out/oracle-linux9" --schema "$schema" --source-revision "$rev"             --source-repository-path Current/U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-signed.zip             --benchmark-key oracle-linux9 --fail-on-unresolved

          python "$splitter"             niwc/Current/U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip             --output-dir "$out/windows11" --schema "$schema" --source-revision "$rev"             --source-repository-path Current/U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip             --benchmark-key windows11 --fail-on-unresolved

          python "$splitter"             niwc/Current/U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip             --output-dir "$out/windows-server-2025" --schema "$schema" --source-revision "$rev"             --source-repository-path Current/U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip             --benchmark-key windows-server-2025 --fail-on-unresolved

      - name: Build semantic IR for every generated OVAL rule
        shell: bash
        run: |
          set -euo pipefail
          parser="scap-ng/research/iterations/001/tools/oval_semantic_ir.py"
          while IFS= read -r -d '' oval; do
            python "$parser" "$oval" --output "$(dirname "$oval")/oval-ir.json" --fail-on-unresolved
          done < <(find scap-ng/research/iterations/001/generated/niwc-rule-splits -name oval.xml -print0 | sort -z)

      - name: Aggregate semantic coverage
        run: |
          python scap-ng/research/iterations/001/tools/analyze_oval_ir_corpus.py \
            scap-ng/research/iterations/001/generated/niwc-rule-splits \
            --output scap-ng/research/iterations/001/generated/niwc-rule-splits/corpus-semantic-inventory.json

      - name: Commit reproducible generated research corpus
        working-directory: scap-ng
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/iterations/001/generated/niwc-rule-splits
          if git diff --cached --quiet; then
            echo "Generated priority rule corpus already matches."
            exit 0
          fi
          git commit -m "Generate priority NIWC per-rule OVAL and semantic IR corpus"
          git push
