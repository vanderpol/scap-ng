name: 0.4 extra authoring shorthand census

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/research-04-authoring-macro-census.yml
      - tools/research_04_authoring_macro_candidates.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  survey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Retrieve pinned 0.3 source authoring
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p work
          gh release download v0.3.0-six-stig-typed-operators-5796d016b12f \
            --pattern scap-ng-0.3-six-stig-authoring.zip --dir work
      - name: Count repetition without altering source
        run: |
          python tools/research_04_authoring_macro_candidates.py \
            --authoring-zip work/scap-ng-0.3-six-stig-authoring.zip \
            --output work/authoring-macro-census.json
      - uses: actions/upload-artifact@v4
        with:
          name: authoring-macro-census
          path: work/authoring-macro-census.json
          if-no-files-found: error
