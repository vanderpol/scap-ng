name: 0.4.0 pinned OVAL Test Content converter coverage
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/audit_v04_oval_test_corpus.py'
      - 'tools/test_v04_oval_test_corpus.py'
      - 'tools/v04_direct_*.py'
      - 'tools/v04_direct_capabilities.json'
      - 'tools/v04_scalar_source_proof.py'
      - 'tests/fixtures/v04-scalar-proof-contracts.json'
      - 'tools/v04_expanded_source_proof.py'
      - 'tools/v04_source_package_semantics.py'
      - 'tools/generate_capability_schema_v04.py'
      - 'tools/v04_capability_native.py'
      - 'tools/v04_capability_source.py'
      - 'schema/v0.4.0/**'
      - 'tests/fixtures/v04-oval-corpus-pin.json'
      - '.github/workflows/v04-oval-test-corpus.yml'
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: scap-ng
      - uses: actions/checkout@v4
        with:
          repository: OVAL-Community/SCAP-Self-Assertion
          ref: e3538595c5083b9c34d937a81d319234df9bbfaa
          path: original-oval
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0 lxml==6.0.2
      - name: Inventory and measure without expanding support
        env:
          PYTHONPATH: scap-ng/tools
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          test "$(git -C original-oval rev-parse HEAD)" = e3538595c5083b9c34d937a81d319234df9bbfaa
          python -m unittest test_v04_oval_test_corpus -v
          python scap-ng/tools/audit_v04_oval_test_corpus.py \
            --source-root original-oval/SCAP_1.4/OVAL_Test_Content \
            --output evidence/coverage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v04-original-oval-test-corpus-coverage
          path: evidence/
          if-no-files-found: error
