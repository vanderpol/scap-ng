name: 0.4.0 original OVAL macOS softwareupdate Boolean State source roundtrip
on:
  push:
    branches: [main]
    paths:
      - 'tools/v04_source_proof_contract.py'
      - 'tools/test_v04_current_source_acceptance.py'
      - '.github/workflows/v04-oval-macos-softwareupdate-source.yml'
      - 'tools/prove_v04_oval_macos_softwareupdate_source.py'
      - 'tools/promote_v04_oval_macos_softwareupdate_source_proof.py'
      - 'tools/generate_capability_schema_v04.py'
      - 'tools/v04_capability_native.py'
      - 'tools/v04_capability_source.py'
      - 'tools/validate_v04_oval_5123.py'
      - 'schema/v0.4.0/assessment.schema.json'
      - 'schema/v0.4.0/assessment-language.schema.json'
      - 'schema/v0.4.0/capability-common.schema.json'
      - 'schema/v0.4.0/capability-mappings/supported/macos.softwareupdate.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  one-original-macos-softwareupdate-definition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: scap-ng
      - uses: actions/checkout@v4
        with:
          repository: OVAL-Community/SCAP-Self-Assertion
          ref: e3538595c5083b9c34d937a81d319234df9bbfaa
          path: original-oval
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OVAL-Community/OVAL
          ref: v5.12.3
          path: oval-language
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0 lxml==6.0.2
      - name: Pinned softwareupdate singleton and Boolean native/OVAL graph proof
        env:
          PYTHONPATH: scap-ng/tools
        run: |
          test "$(git -C original-oval rev-parse HEAD)" = 'e3538595c5083b9c34d937a81d319234df9bbfaa'
          python scap-ng/tools/prove_v04_oval_macos_softwareupdate_source.py \
            --source original-oval/SCAP_1.4/OVAL_Test_Content/macos/macos-def_softwareupdate_test.xml \
            --schema-root scap-ng/schema/v0.4.0 \
            --xsd-root oval-language/oval-schemas \
            --output work/original-oval-softwareupdate/macos-softwareupdate-one
      - name: Independently promote certified 45 to 46 original Definitions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONPATH: scap-ng/tools
        run: |
          mkdir -p work/previous-ledger
          gh run download 39778345417 --repo "$GH_REPO" \
            --name v04-oval-macos-three-statefree-singletons-45-of-167 \
            --dir work/previous-ledger
          test -f work/previous-ledger/cumulative-167-definition-readiness.json
          python scap-ng/tools/promote_v04_oval_macos_softwareupdate_source_proof.py \
            --previous-ledger work/previous-ledger/cumulative-167-definition-readiness.json \
            --proof-root work/original-oval-softwareupdate/macos-softwareupdate-one \
            --output work/original-oval-softwareupdate/cumulative-167-definition-readiness.json
          python - <<'PY'
          import json
          from copy import deepcopy
          from pathlib import Path
          from promote_v04_oval_macos_softwareupdate_source_proof import promote

          current=json.loads(Path('work/original-oval-softwareupdate/cumulative-167-definition-readiness.json').read_text())
          previous=json.loads(Path('work/previous-ledger/cumulative-167-definition-readiness.json').read_text())
          folder=Path('work/original-oval-softwareupdate/macos-softwareupdate-one')
          assert len(current['records']) == 167
          assert current['current_040_schema_and_original_source_validated'] == 46
          assert current['current_040_original_xml_roundtrip_exported'] == 46
          assert current['remaining_v003_compatible_without_current_040_proof'] == 116
          assert current['original_source_invalid_or_deprecated'] == 5
          assert current['scanner_result_parity_proven'] == 0
          try:
              promote(current, folder)
          except ValueError as exc:
              assert 'complete certified 45-of-167' in str(exc)
          else:
              raise AssertionError('accepted duplicate 46/167 promotion')
          corrupt=deepcopy(previous)
          next(r for r in corrupt['records'] if r['source_file']=='macos/macos-def_softwareupdate_test.xml')['original_source_file_sha256']='0'*64
          try:
              promote(corrupt, folder)
          except ValueError as exc:
              assert 'original source must be pinned' in str(exc)
          else:
              raise AssertionError('accepted falsified original softwareupdate source SHA')
          print('PASS: original macOS softwareupdate singleton, Boolean schedule State, 46/167; scanner parity 0')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v04-oval-macos-softwareupdate-boolean-state-46-of-167
          path: work/original-oval-softwareupdate/
          if-no-files-found: ignore
