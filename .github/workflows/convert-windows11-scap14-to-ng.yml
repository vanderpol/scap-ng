name: Convert Windows 11 SCAP 1.4 to SCAP-NG

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/convert-windows11-scap14-to-ng.yml"
      - "tools/oval_semantic_ir.py"
      - "tools/scap14_rule_splitter.py"
      - "tools/scap14_benchmark_ir.py"
      - "tools/test_xccdf_profile_resolution.py"
      - "tools/test_xccdf_applicability.py"
      - "tools/test_xccdf_complex_check.py"
      - "tools/test_xccdf_processing_plan.py"
      - "tools/scap14_to_scapng.py"
      - "tools/render_ansible_inspired_benchmark.py"
      - "tools/verify_scap14_to_scapng_conversion.py"
      - "tools/build_scapng_from_converted_source.py"
      - "tools/verify_scapng_prototype_bundle.py"
      - "tools/build_oval_schema_semantic_catalog.py"
      - "research/iterations/001/oval-test-support-overrides.json"
      - "third_party/scap-1.4-schemas/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: convert-windows11-scap14-to-ng-main
  cancel-in-progress: true

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SCAP-NG
        uses: actions/checkout@v4
        with:
          path: scap-ng

      - name: Check out pinned NIWC published corpus
        uses: actions/checkout@v4
        with:
          repository: niwc-atlantic/scap-content-library
          ref: 8c8e5dff860af6b1290ee9273a282db24278f8d5
          path: niwc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install converter dependencies
        run: python -m pip install --disable-pip-version-check lxml PyYAML cryptography

      - name: Build effective OVAL schema catalog
        run: |
          mkdir -p work
          python scap-ng/tools/build_oval_schema_semantic_catalog.py \
            scap-ng/third_party/scap-1.4-schemas/oval_5.12.3 \
            --parser scap-ng/tools/oval_semantic_ir.py \
            --support-overrides scap-ng/research/iterations/001/oval-test-support-overrides.json \
            --output work/oval-schema-semantic-catalog.json

      - name: Split Windows 11 rules from published SCAP 1.4
        run: |
          python scap-ng/tools/scap14_rule_splitter.py \
            niwc/Current/U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip \
            --output-dir work/windows11-split \
            --schema scap-ng/third_party/scap-1.4-schemas/omni-schema.xsd \
            --source-revision 8c8e5dff860af6b1290ee9273a282db24278f8d5 \
            --source-repository-path Current/U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip \
            --benchmark-key windows11 \
            --fail-on-unresolved

      - name: Build faithful OVAL IR for every automated rule
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' oval; do
            python scap-ng/tools/oval_semantic_ir.py "$oval" \
              --provenance "$(dirname "$oval")/provenance.json" \
              --output "$(dirname "$oval")/oval-ir.json" \
              --fail-on-unresolved
          done < <(find work/windows11-split -name oval.xml -print0 | sort -z)

      - name: Test XCCDF profile resolution semantics
        run: python scap-ng/tools/test_xccdf_profile_resolution.py

      - name: Test XCCDF CPE applicability semantics
        run: python scap-ng/tools/test_xccdf_applicability.py

      - name: Test XCCDF complex-check semantics
        run: python scap-ng/tools/test_xccdf_complex_check.py

      - name: Test XCCDF assessment processing plan
        run: python scap-ng/tools/test_xccdf_processing_plan.py

      - name: Build unified XCCDF plus OVAL benchmark IR
        run: |
          python scap-ng/tools/scap14_benchmark_ir.py \
            niwc/Current/U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip \
            --split-root work/windows11-split \
            --output work/windows11-benchmark-ir.json

      - name: Compile both SCAP-NG candidate layouts
        run: |
          python scap-ng/tools/scap14_to_scapng.py \
            work/windows11-benchmark-ir.json \
            --schema-catalog work/oval-schema-semantic-catalog.json \
            --output-dir work/windows11-scapng

      - name: Render Ansible-inspired benchmark
        run: |
          python scap-ng/tools/render_ansible_inspired_benchmark.py \
            work/windows11-scapng/canonical-benchmark.json \
            --output-dir work/windows11-scapng/ansible-inspired

      - name: Verify full conversion accounting and renderer equivalence
        run: |
          python scap-ng/tools/verify_scap14_to_scapng_conversion.py \
            work/windows11-scapng \
            --expected-rules 257 \
            --expected-automated 245 \
            --expected-manual 11 \
            --expected-blocked-rules 1 \
            --ansible-inspired-dir work/windows11-scapng/ansible-inspired

      - name: Build signed SCAP-NG prototype packages
        run: |
          python scap-ng/tools/build_scapng_from_converted_source.py \
            work/windows11-scapng \
            --output-dir work/windows11-packages \
            --artifact-prefix windows11-scap14-converted \
            --skip-automated-if-blocked
          for bundle in work/windows11-packages/*.scapng; do
            python scap-ng/tools/verify_scapng_prototype_bundle.py "$bundle"
          done

      - name: Build compact committed evidence
        shell: bash
        run: |
          set -euo pipefail
          dst="scap-ng/research/iterations/001/generated/windows11-full-conversion"
          rm -rf "$dst"
          mkdir -p "$dst/samples/simple" "$dst/samples/complex" "$dst/samples/blocked"

          cp work/windows11-scapng/conversion-summary.json "$dst/"
          cp work/windows11-scapng/conversion-blockers.json "$dst/"
          cp work/windows11-packages/package-metrics.json "$dst/"
          cp work/windows11-scapng/combined-rule/benchmark.yaml "$dst/combined-benchmark.yaml"
          cp work/windows11-scapng/split-policy-assessment-binding/benchmark.yaml "$dst/split-benchmark.yaml"
          cp work/windows11-scapng/ansible-inspired/benchmark.yaml "$dst/ansible-inspired-benchmark.yaml"
          cp work/windows11-scapng/combined-rule/profiles.yaml "$dst/profiles.yaml"
          cp work/windows11-scapng/combined-rule/platforms.yaml "$dst/platforms.yaml"
          cp work/windows11-scapng/combined-rule/processing.yaml "$dst/processing.yaml"
          cp work/windows11-scapng/combined-rule/applicability.yaml "$dst/applicability.yaml"

          simple="xccdf_mil.disa.stig_rule_SV-253273r1051040_rule"
          complex="xccdf_mil.disa.stig_rule_SV-253495r1137691_rule"
          blocked="xccdf_mil.disa.stig_rule_SV-253476r1210304_rule"
          cp "work/windows11-scapng/combined-rule/rules/$simple.yaml" "$dst/samples/simple/combined-rule.yaml"
          cp "work/windows11-scapng/split-policy-assessment-binding/policy/rules/$simple.yaml" "$dst/samples/simple/policy-rule.yaml"
          cp "work/windows11-scapng/split-policy-assessment-binding/automation/assessments/ng.scap14.$simple.yaml" "$dst/samples/simple/assessment.yaml"
          cp "work/windows11-scapng/ansible-inspired/automation/assessments/ng.scap14.$simple.yaml" "$dst/samples/simple/ansible-inspired-assessment.yaml"
          cp "work/windows11-scapng/combined-rule/rules/$complex.yaml" "$dst/samples/complex/combined-rule.yaml"
          cp "work/windows11-scapng/split-policy-assessment-binding/policy/rules/$complex.yaml" "$dst/samples/complex/policy-rule.yaml"
          cp "work/windows11-scapng/split-policy-assessment-binding/automation/assessments/ng.scap14.$complex.yaml" "$dst/samples/complex/assessment.yaml"
          cp "work/windows11-scapng/ansible-inspired/automation/assessments/ng.scap14.$complex.yaml" "$dst/samples/complex/ansible-inspired-assessment.yaml"
          cp "work/windows11-scapng/combined-rule/rules/$blocked.yaml" "$dst/samples/blocked/combined-rule.yaml"
          cp "work/windows11-scapng/split-policy-assessment-binding/policy/rules/$blocked.yaml" "$dst/samples/blocked/policy-rule.yaml"
          cp "work/windows11-scapng/ansible-inspired/policy/rules/$blocked.yaml" "$dst/samples/blocked/ansible-inspired-policy-rule.yaml"

          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("work/windows11-scapng")
          rows=[]
          for p in sorted(x for x in root.rglob("*") if x.is_file()):
              data=p.read_bytes()
              rows.append({
                  "path":p.relative_to(root).as_posix(),
                  "bytes":len(data),
                  "sha256":hashlib.sha256(data).hexdigest(),
              })
          out=Path("scap-ng/research/iterations/001/generated/windows11-full-conversion/conversion-file-manifest.json")
          out.write_text(json.dumps({
              "format":"scap-ng-windows11-full-conversion-file-manifest-0.1",
              "files":rows,
              "file_count":len(rows),
              "total_bytes":sum(x["bytes"] for x in rows),
          },indent=2,sort_keys=True)+"\n")
          PY

          cat > "$dst/README.md" <<'EOF'
          # Windows 11 full SCAP 1.4 -> SCAP-NG conversion evidence

          Generated from the pinned published NIWC Windows 11 SCAP 1.4 benchmark.

          This directory intentionally commits compact, reviewable evidence rather than
          duplicating the complete generated 257-rule source tree in Git. The workflow
          artifact contains the full converted output for all three YAML renderings:
          combined-rule, split policy/assessment/binding, and Ansible-inspired.

          Supported automated assessments are currently marked `legacy_compatible`:
          OVAL XML has been lowered to a structured SCAP-NG assessment graph, but native
          collector/capability mappings have not all been independently promoted to
          `exact_native` / `exact_normalized`.

          The published benchmark contains one rule using deprecated Windows
          `user_test`. That rule is preserved as an explicit source-remediation
          blocker and is intentionally not included in an automated package. Policy-only
          packages remain buildable; the package metrics record why automated packages
          were withheld.

          The simple and complex sample directories show the same source semantics
          rendered as combined-rule, split policy/assessment/binding, and
          Ansible-inspired YAML. The Ansible-inspired form is an authoring style only
          and has no Ansible runtime dependency.
          EOF

      - name: Archive full converted source tree
        run: tar -C work -czf work/windows11-scapng-converted-sources.tar.gz windows11-scapng

      - name: Upload full conversion artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows11-scap14-to-scapng-full-conversion
          path: |
            work/windows11-scapng-converted-sources.tar.gz
            work/windows11-packages/*.scapng
            work/windows11-packages/package-metrics.json
          if-no-files-found: error
          compression-level: 0

      - name: Commit reproducible conversion evidence
        working-directory: scap-ng
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/iterations/001/generated/windows11-full-conversion
          if git diff --cached --quiet; then
            echo "Windows 11 conversion evidence already matches."
            exit 0
          fi
          git commit -m "Generate full Windows 11 SCAP-NG conversion evidence"
          git pull --rebase origin main
          git push
