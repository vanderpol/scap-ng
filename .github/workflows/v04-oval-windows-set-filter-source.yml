name: 0.4.0 original OVAL Windows Set and Filter placement regression
on:
  push:
    branches: [main]
    paths:
      - 'tools/v04_source_proof_contract.py'
      - 'tools/test_v04_current_source_acceptance.py'
      - 'tools/v04_field_requirement.py'
      - 'tests/fixtures/v04-current-source-proofs/**'
      - '.github/workflows/v04-oval-windows-set-filter-source.yml'
      - 'tools/test_v04_oval_set_filter_source.py'
      - 'tools/test_generate_capability_schema_v04.py'
      - 'tools/generate_capability_schema_v04.py'
      - 'tools/v04_capability_native.py'
      - 'tools/v04_capability_source.py'
      - 'schema/v0.4.0/capability-common.schema.json'
      - 'schema/v0.4.0/assessment-language.schema.json'
      - 'schema/v0.4.0/capability-mappings/supported/windows.file.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-windows-seven-set-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: scap-ng
      - uses: actions/checkout@v4
        with:
          repository: OVAL-Community/SCAP-Self-Assertion
          ref: e3538595c5083b9c34d937a81d319234df9bbfaa
          path: original-oval
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OVAL-Community/OVAL
          ref: v5.12.3
          path: oval-language
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0 lxml==6.0.2
      - name: Original 5.12.3 XSD and seven native Set/Filter synthetic-Item cases
        env:
          PYTHONPATH: scap-ng/tools
        run: |
          test "$(git -C original-oval rev-parse HEAD)" = 'e3538595c5083b9c34d937a81d319234df9bbfaa'
          python scap-ng/tools/test_generate_capability_schema_v04.py
          python scap-ng/tools/test_v04_oval_set_filter_source.py \
            --source original-oval/SCAP_1.4/OVAL_Test_Content/windows/oval-def_set-windows.xml \
            --xsd-root oval-language/oval-schemas \
            --report work/original-oval-sets/set-filter-source-proof.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v04-original-oval-windows-seven-set-filter-source-regression
          path: work/original-oval-sets/
          if-no-files-found: ignore
