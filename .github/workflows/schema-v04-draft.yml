name: SCAP-NG 0.4 draft schema checks

on:
  push:
    paths:
      - 'schema/v0.4.0/**'
      - 'tools/test_v04_schema_draft.py'
      - 'tools/test_v04_field_requirement_schema.py'
      - 'tools/v04_field_requirement.py'
      - 'tools/test_v04_field_requirement_conversion.py'
      - 'tools/build_v04_canonical_six_stigs.py'
      - 'tools/v04_canonical_source_ir.py'
      - 'tools/v04_canonical_requirement_oracle.py'
      - 'tools/test_v04_object_selector_language.py'
      - '.github/workflows/schema-v04-draft.yml'
  pull_request:
    paths:
      - 'schema/v0.4.0/**'
      - 'tools/test_v04_schema_draft.py'
      - 'tools/test_v04_field_requirement_schema.py'
      - 'tools/v04_field_requirement.py'
      - 'tools/test_v04_field_requirement_conversion.py'
      - 'tools/build_v04_canonical_six_stigs.py'
      - 'tools/v04_canonical_source_ir.py'
      - 'tools/v04_canonical_requirement_oracle.py'
      - 'tools/test_v04_object_selector_language.py'
      - '.github/workflows/schema-v04-draft.yml'
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install jsonschema pyyaml lxml
      - name: Version-local metadata, schema, positive/negative fixtures
        run: |
          python tools/test_v04_schema_draft.py
          python tools/test_v04_field_requirement_schema.py
          python tools/test_v04_object_selector_language.py
      - name: Canonical converter, compiler and original OVAL source trace
        env:
          PYTHONPATH: tools:.
        run: |
          python tools/test_v04_field_requirement_conversion.py
          python tools/test_v04_canonical_source_ir.py
          python tools/test_v04_canonical_requirement_oracle.py
