name: Historical manual — 0.4 strict six-anchor authoring schema gate
# #251: dated replay only; current production checks remain in mandatory CI.
# Code/schema pin: 2de578c088291558f44d0c7a505ad149dea5fc76
on:
  workflow_dispatch:
    inputs:
      allow_historical:
        description: 'Explicitly replay dated research, not current production acceptance'
        required: true
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_historical }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2de578c088291558f44d0c7a505ad149dea5fc76
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 jsonschema==4.25.1
      - name: Download verified immutable six-STIG 0.3 source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p work
          gh release download v0.3.0-six-stig-typed-operators-5796d016b12f \
            --pattern scap-ng-0.3-six-stig-authoring.zip --dir work
      - name: Prove enumeration literals lower only through reviewed source mappings
        run: |
          PYTHONPATH=tools python tools/test_migrate_v04_enum_selectors.py -v
      - name: Compare all selected real Test content with generated version-local native schemas
        run: |
          PYTHONPATH=tools python tools/research_04_native_deep_content_census.py \
            --source-zip work/scap-ng-0.3-six-stig-authoring.zip \
            --six-anchor \
            --strict \
            --output work/deep-native-content-census.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-native-v04-six-anchor-audit
          path: work/deep-native-content-census.json
          if-no-files-found: warn
          retention-days: 90
