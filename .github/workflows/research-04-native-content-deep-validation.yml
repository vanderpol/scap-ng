name: 0.4 real Linux and Windows native schema deep audit

on:
  push:
    branches: [main]
    paths:
      - tools/research_04_native_deep_content_census.py
      - tools/generate_capability_schema_v04.py
      - tools/migrate_v04_enum_selectors.py
      - tools/test_migrate_v04_enum_selectors.py
      - .github/workflows/research-04-native-content-deep-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 jsonschema
      - name: Download verified immutable six-STIG 0.3 source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p work
          gh release download v0.3.0-six-stig-typed-operators-5796d016b12f \
            --pattern scap-ng-0.3-six-stig-authoring.zip --dir work
      - name: Prove enumeration literals lower only through reviewed source mappings
        run: |
          PYTHONPATH=tools python tools/test_migrate_v04_enum_selectors.py -v
      - name: Compare all selected real Test content with generated version-local native schemas
        run: |
          PYTHONPATH=tools python tools/research_04_native_deep_content_census.py \
            --source-zip work/scap-ng-0.3-six-stig-authoring.zip \
            --output work/deep-native-content-census.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-native-v04-rhel9-win11-server2025
          path: work/deep-native-content-census.json
          if-no-files-found: warn
          retention-days: 90
