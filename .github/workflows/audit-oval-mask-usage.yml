name: Audit source-explicit OVAL mask usage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-oval-mask-usage.yml"
      - "tools/census_oval_mask_usage.py"
      - "tools/test_census_oval_mask_usage.py"

jobs:
  mask-census:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SCAP-NG
        uses: actions/checkout@v4
        with:
          path: scap-ng

      - name: Check out pinned NIWC Current corpus
        uses: actions/checkout@v4
        with:
          repository: niwc-atlantic/scap-content-library
          ref: 8c8e5dff860af6b1290ee9273a282db24278f8d5
          path: niwc

      - name: Check out pinned SCAP 1.4 Self-Assertion corpus
        uses: actions/checkout@v4
        with:
          repository: OVAL-Community/SCAP-Self-Assertion
          ref: e3538595c5083b9c34d937a81d319234df9bbfaa
          path: self-assertion

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run focused census tests
        working-directory: scap-ng/tools
        run: python test_census_oval_mask_usage.py

      - name: Inventory source-explicit mask usage
        run: |
          mkdir -p work/mask-census
          python scap-ng/tools/census_oval_mask_usage.py             niwc/Current             self-assertion/SCAP_1.4/OVAL_Test_Content             --output work/mask-census/mask-census.json

      - name: Render concise Markdown evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=Path("work/mask-census/mask-census.json")
          d=json.loads(p.read_text())
          lines=[
              "# Source-explicit OVAL mask census",
              "",
              "Counts include only mask attributes physically present in pinned source XML.",
              "Inherited XSD default mask=false is excluded.",
              "",
              f"- files scanned: {d['files_scanned']}",
              f"- explicit mask occurrences: {d['occurrences']}",
              f"- parse failures: {len(d['failures'])}",
              f"- by value: {d['by_value']}",
              "",
              "## By capability",
              "",
              "| Capability | Value | Count |",
              "| --- | --- | ---: |",
          ]
          for row in d["by_capability"]:
              lines.append(f"| {row['capability']} | {row['value']} | {row['count']} |")
          lines += [
              "",
              "## By context",
              "",
              "| Context | Value | Count |",
              "| --- | --- | ---: |",
          ]
          for row in d["by_context"]:
              lines.append(f"| {row['context']} | {row['value']} | {row['count']} |")
          Path("work/mask-census/README.md").write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY

      - name: Upload census evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-explicit-oval-mask-census
          path: work/mask-census/

      - name: Enforce complete scan
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("work/mask-census/mask-census.json").read_text())
          if d["failures"]:
              raise SystemExit(f"mask census had {len(d['failures'])} parse failures")
          PY
