name: Read-only schema-doc regeneration receipt

on:
  pull_request:
    paths:
      - 'schema/**'
      - 'docs/generated/**'
      - 'tools/generate_docs.py'
      - '.github/workflows/schema-doc-review-receipt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reviewed-generated-bytes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Generate reference files locally without publishing or pushing
        run: |
          set -euo pipefail
          python tools/generate_docs.py
          python tools/generate_docs.py --check
          git diff --stat -- docs/generated/
      - name: Report exact active schema JSON hashes for independent pilot requalification
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          paths=sorted(Path('schema').rglob('*.json'))
          assert len(paths)==145, f'Unexpected active schema resource count: {len(paths)}'
          for path in paths:
              print(f'SCHEMAPIN::{path.as_posix()}::{sha256(path.read_bytes()).hexdigest()}')
          PY
      - name: Generate pinned active 0.4.1 unix.file pilot reference, read-only
        run: |
          set -euo pipefail
          python tools/generate_unix_file_reference.py
          python tools/generate_unix_file_reference.py --check
          for f in docs/pilots/unix-file/reference.md docs/pilots/unix-file/constraints.md docs/pilots/unix-file/PARITY-CHECKLIST.md; do
            printf 'PILOTBEGIN::%s::%s\n' "$f" "$(sha256sum "$f" | cut -d' ' -f1)"
            base64 -w 800 "$f" | awk -v file="$f" '{printf "PILOTCHUNK::%s::%06d::%s\n", file, NR, $0}'
            printf 'PILOTEND::%s\n' "$f"
          done
      - name: Emit chunked exact output for separately authorized GitHub review
        shell: bash
        run: |
          set -euo pipefail
          echo 'This CI run is a read-only generation receipt, not a release or publication.'
          for f in docs/generated/*; do
            test -f "$f" || continue
            printf 'GENBEGIN::%s::%s\n' "$f" "$(sha256sum "$f" | cut -d' ' -f1)"
            base64 -w 800 "$f" | awk -v file="$f" '{printf "GENCHUNK::%s::%06d::%s\n", file, NR, $0}'
            printf 'GENEND::%s\n' "$f"
          done

      - name: Emit exact proposed-doc regeneration deltas (read-only; temporary)
        shell: bash
        run: |
          set -euo pipefail
          python tools/generate_documentation.py
          python tools/audit_schema_documentation.py
          python tools/audit_documentation_fidelity.py
          python tools/check_documentation_examples.py
          python - <<'PY'
          from pathlib import Path
          import base64, difflib, hashlib, json, subprocess
          def sha(raw): return hashlib.sha256(raw).hexdigest()
          paths = subprocess.check_output([
              'git', 'diff', '--name-only', '--',
              'docs/reference/', 'docs/metadata/documentation-0.4.1/',
              'docs/fidelity/', 'docs/examples/'
          ], text=True).splitlines()
          print('DOCPATCHCOUNT::' + str(len(paths)))
          for path in sorted(paths):
              old = subprocess.check_output(['git','show','HEAD:'+path])
              new = Path(path).read_bytes()
              a = old.decode('utf-8').splitlines(keepends=True)
              b = new.decode('utf-8').splitlines(keepends=True)
              ops = difflib.SequenceMatcher(None,a,b,autojunk=False).get_opcodes()
              changes = [[i1,i2,''.join(b[j1:j2])] for tag,i1,i2,j1,j2 in ops if tag != 'equal']
              patch = json.dumps({'path':path,'before':sha(old),'after':sha(new),
                                  'changes':changes},ensure_ascii=False,separators=(',',':')).encode()
              print('DOCPATCHINFO::%s::%d::%d::%d::%d' % (path,len(old),len(new),len(changes),len(patch)))
              if len(patch) > 1800000:
                  print('DOCPATCHSKIP::' + path)
                  continue
              print('DOCPATCHBEGIN::'+path)
              b64 = base64.b64encode(patch).decode()
              for n in range(0,len(b64),800):
                  print('DOCPATCHCHUNK::%s::%06d::%s' %(path,n//800+1,b64[n:n+800]))
              print('DOCPATCHEND::'+path)
          PY
