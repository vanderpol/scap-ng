name: "[HISTORICAL] Validate SCAP-NG iteration 001 research YAML"

# Archived reproduction only. This workflow does not validate current native authoring.
on:
  workflow_dispatch:
    inputs:
      allow_historical:
        description: 'Explicitly reproduce archived research (not current NG output)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_historical }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Validate iteration 001 prototype YAML
        run: python research/iterations/001/tools/validate_migration_cases.py
