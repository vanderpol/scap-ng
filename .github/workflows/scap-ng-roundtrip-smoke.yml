name: SCAP-NG OVAL round-trip smoke test

on:
  push:
    paths:
      - 'research/iterations/003/examples/oval-ng-roundtrip-stress/**'
      - 'tools/scap_ng_roundtrip_v003/**'
      - '.github/workflows/scap-ng-roundtrip-smoke.yml'
  pull_request:
    paths:
      - 'research/iterations/003/examples/oval-ng-roundtrip-stress/**'
      - 'tools/scap_ng_roundtrip_v003/**'
      - '.github/workflows/scap-ng-roundtrip-smoke.yml'
  workflow_dispatch:

jobs:
  reverse-generate-and-xsd-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SCAP-NG
        uses: actions/checkout@v4
        with:
          path: scap-ng

      - name: Check out authoritative OVAL 5.12.3 schemas
        uses: actions/checkout@v4
        with:
          repository: OVAL-Community/OVAL
          ref: v5.12.3
          path: oval-language

      - name: Install XML validators
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          python -m pip install lxml

      - name: Reverse-generate OVAL stress fixtures
        run: |
          set -euo pipefail
          mkdir -p out
          for fixture in scap-ng/research/iterations/003/examples/oval-ng-roundtrip-stress/*.json; do
            base="$(basename "$fixture" .json)"
            python scap-ng/tools/scap_ng_roundtrip_v003/ng_to_oval.py "$fixture" -o "out/$base.xml"
          done

      - name: Validate regenerated OVAL against OVAL 5.12.3 schemas
        run: |
          set -euo pipefail
          cp scap-ng/tools/scap_ng_roundtrip_v003/oval-definitions-omni.xsd \
             oval-language/oval-schemas/roundtrip-omni.xsd
          schema="oval-language/oval-schemas/roundtrip-omni.xsd"
          for xml in out/*.xml; do
            echo "Validating $xml"
            xmllint --noout --schema "$schema" "$xml"
          done

      - name: Validate regenerated OVAL against embedded Schematron
        run: |
          set -euo pipefail
          python scap-ng/tools/scap_ng_roundtrip_v003/validate_embedded_schematron.py \
            --schemas oval-language/oval-schemas \
            out/*.xml

      - name: Generate XML round-trip diffs
        if: always()
        run: |
          set -euo pipefail
          mkdir -p roundtrip-diffs
          for fixture in scap-ng/research/iterations/003/examples/oval-ng-roundtrip-stress/*.json; do
            local_path="$(python - "$fixture" <<'PY'
import json,sys
d=json.load(open(sys.argv[1]))
print(d.get("source",{}).get("local_path",""))
PY
)"
            [ -n "$local_path" ] || continue
            base="$(basename "$fixture" .json)"
            mkdir -p "roundtrip-diffs/$base"
            python scap-ng/tools/scap_ng_roundtrip_v003/diff_oval_roundtrip.py               "scap-ng/$local_path" "out/$base.xml"               --out-dir "roundtrip-diffs/$base"
          done

      - name: Upload regenerated OVAL and diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-oval-and-diffs
          path: |
            out/*.xml
            roundtrip-diffs/**

      - name: Compare original and regenerated OVAL semantics
        if: always()
        run: |
          set -euo pipefail
          python scap-ng/tools/scap_ng_roundtrip_v003/run_roundtrip.py \
            --fixtures scap-ng/research/iterations/003/examples/oval-ng-roundtrip-stress \
            --repo-root scap-ng \
            --out semantic-out
