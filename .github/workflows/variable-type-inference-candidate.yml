name: Active 0.4.1 language and Result identity qualification
on:
  pull_request:
    paths:
      - 'schema/variable-expression.schema.json'
      - 'schema/assessment.schema.json'
      - 'schema/scan-result.schema.json'
      - 'examples/results/scan-siem-correlation.json'
      - 'tests/test_result_correlation_guids.py'
      - 'tests/test_issue48_variable_functions.py'
      - 'tests/test_variable_type_inference_contract.py'
      - '.github/workflows/variable-type-inference-candidate.yml'
      - 'docs/contracts/0.4-variable-datatype-inference.md'
permissions:
  contents: read
jobs:
  inference-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install single-version validation dependencies
        run: python -m pip install 'jsonschema>=4.20,<5' 'referencing>=0.34'
      - name: Validate active Variable schema and negative shapes
        run: |
          python -m unittest discover -s tests -p 'test_issue48_variable_functions.py' -v
          python -m unittest discover -s tests -p 'test_variable_type_inference_contract.py' -v
          python -m unittest discover -s tests -p 'test_result_correlation_guids.py' -v
