name: Candidate 0.4.0 Variable type inference qualification
on:
  pull_request:
    paths:
      - 'schema/variable-expression.schema.json'
      - 'tools/build_schema_v041.py'
      - 'schema/assessment.schema.json'
      - 'tests/test_issue48_variable_functions.py'
      - 'tests/test_variable_type_inference_contract.py'
      - '.github/workflows/variable-type-inference-candidate.yml'
      - 'docs/contracts/0.4-variable-datatype-inference.md'
permissions:
  contents: read
jobs:
  inference-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install candidate-only validation dependencies
        run: python -m pip install 'jsonschema>=4.20,<5' 'referencing>=0.34'
      - name: Generate isolated 0.4.1 family and verify byte-identical reproduction
        run: |
          python3 tools/build_schema_v041.py
          python3 tools/build_schema_v041.py --check
      - name: Validate candidate Variable schema and negative shapes
        run: |
          python -m unittest discover -s tests -p 'test_issue48_variable_functions.py' -v
          python -m unittest discover -s tests -p 'test_variable_type_inference_contract.py' -v
