name: RHEL 9 v003 deterministic regeneration

on:
  pull_request:
    paths:
      - 'tools/scap_upconvert_v003/**'
      - 'research/iterations/003/source/split-rule-assessment/rhel9-full/**'
      - '.github/workflows/rhel9-v003-regeneration.yml'
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SCAP-NG
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Regenerate complete RHEL 9 v003 source
        run: |
          python tools/scap_upconvert_v003/run_local.py rhel9 --mode full --fail-on-error

      - name: Show generated differences
        if: always()
        run: |
          git status --short
          git diff --stat
          git diff --             research/iterations/003/source/split-rule-assessment/rhel9-full             research/iterations/003/evidence/rhel9-full             research/iterations/003/packages/rhel9-full.manifest.json             tools/scap_upconvert_v003

      - name: Require deterministic generated source
        run: |
          git diff --exit-code --             research/iterations/003/source/split-rule-assessment/rhel9-full

      - name: Upload regenerated package and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rhel9-v003-regeneration
          path: |
            research/iterations/003/evidence/rhel9-full/**
            research/iterations/003/packages/rhel9-full.manifest.json
            research/iterations/003/packages/rhel9-full.scap-ng.zip
