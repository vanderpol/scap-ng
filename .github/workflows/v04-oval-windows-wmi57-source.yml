name: 0.4.0 original OVAL Windows WMI57 record and none-exist source roundtrip
on:
  push:
    branches: [main]
    paths:
      - 'tools/v04_source_proof_contract.py'
      - 'tools/test_v04_current_source_acceptance.py'
      - 'tools/v04_field_requirement.py'
      - 'tests/fixtures/v04-current-source-proofs/**'
      - '.github/workflows/v04-oval-windows-wmi57-source.yml'
      - 'tools/prove_v04_oval_windows_wmi57_source.py'
      - 'tools/promote_v04_oval_windows_wmi57_source_proof.py'
      - 'tools/generate_capability_schema_v04.py'
      - 'schema/v0.4.0/assessment.schema.json'
      - 'schema/v0.4.0/assessment-language.schema.json'
      - 'schema/v0.4.0/capability-common.schema.json'
      - 'schema/v0.4.0/capability-mappings/supported/windows.wmi.query.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  five-original-windows-wmi57-source-definitions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: scap-ng
      - uses: actions/checkout@v4
        with:
          repository: OVAL-Community/SCAP-Self-Assertion
          ref: e3538595c5083b9c34d937a81d319234df9bbfaa
          path: original-oval
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OVAL-Community/OVAL
          ref: v5.12.3
          path: oval-language
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0 lxml==6.0.2
      - name: Pinned original WMI57 native records, none-exist and 5.12.3 XML/XSD proof
        env:
          PYTHONPATH: scap-ng/tools
        run: |
          test "$(git -C original-oval rev-parse HEAD)" = 'e3538595c5083b9c34d937a81d319234df9bbfaa'
          python scap-ng/tools/prove_v04_oval_windows_wmi57_source.py \
            --source original-oval/SCAP_1.4/OVAL_Test_Content/windows/win-def_wmi57_object_test.xml \
            --schema-root scap-ng/schema/v0.4.0 \
            --xsd-root oval-language/oval-schemas \
            --output work/original-oval-wmi57/windows-wmi57-five
      - name: Independently certify original Definition ledger from 34 to 39
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONPATH: scap-ng/tools
        run: |
          mkdir -p work/previous-ledger
          gh run download 39769664002 --repo "$GH_REPO" \
            --name v04-oval-windows-cmdlet-variable-three-definitions-four-locals-34-of-167 \
            --dir work/previous-ledger
          test -f work/previous-ledger/cumulative-167-definition-readiness.json
          python scap-ng/tools/promote_v04_oval_windows_wmi57_source_proof.py \
            --previous-ledger work/previous-ledger/cumulative-167-definition-readiness.json \
            --proof-root work/original-oval-wmi57/windows-wmi57-five \
            --output work/original-oval-wmi57/cumulative-167-definition-readiness.json
          python - <<'PY'
          import json
          from copy import deepcopy
          from pathlib import Path
          from promote_v04_oval_windows_wmi57_source_proof import promote

          current=json.loads(Path('work/original-oval-wmi57/cumulative-167-definition-readiness.json').read_text())
          previous=json.loads(Path('work/previous-ledger/cumulative-167-definition-readiness.json').read_text())
          folder=Path('work/original-oval-wmi57/windows-wmi57-five')
          assert len(current['records']) == 167
          assert current['current_040_schema_and_original_source_validated'] == 39
          assert current['current_040_original_xml_roundtrip_exported'] == 39
          assert current['remaining_v003_compatible_without_current_040_proof'] == 123
          assert current['original_source_invalid_or_deprecated'] == 5
          assert current['scanner_result_parity_proven'] == 0
          try:
              promote(current, folder)
          except ValueError as exc:
              assert 'complete certified 34-of-167' in str(exc)
          else:
              raise AssertionError('accepted duplicate 39/167 proof promotion')
          corrupt=deepcopy(previous)
          next(r for r in corrupt['records'] if r['definition_id']=='oval:org.mitre.oval.test:def:10' and r['source_file']=='windows/win-def_wmi57_object_test.xml')['original_source_file_sha256']='0'*64
          try:
              promote(corrupt, folder)
          except ValueError as exc:
              assert 'unproved original source graph' in str(exc)
          else:
              raise AssertionError('accepted falsified WMI57 original source SHA')
          print('PASS: five pinned Windows WMI57 source roots, typed records, two state-free none-exist Tests; 39/167, scanner parity 0')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v04-oval-windows-wmi57-five-definitions-typed-record-39-of-167
          path: work/original-oval-wmi57/
          if-no-files-found: ignore
