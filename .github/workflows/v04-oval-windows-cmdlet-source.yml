name: 0.4.0 original OVAL Windows cmdlet record and only-one source roundtrip
on:
  push:
    branches: [main]
    paths:
      - 'tools/v04_source_proof_contract.py'
      - 'tools/test_v04_current_source_acceptance.py'
      - 'tools/v04_field_requirement.py'
      - 'tests/fixtures/v04-current-source-proofs/**'
      - '.github/workflows/v04-oval-windows-cmdlet-source.yml'
      - 'tools/prove_v04_oval_windows_cmdlet_source.py'
      - 'tools/promote_v04_oval_windows_cmdlet_source_proof.py'
      - 'tools/generate_capability_schema_v04.py'
      - 'tools/v04_capability_native.py'
      - 'tools/v04_capability_source.py'
      - 'schema/v0.4.0/assessment.schema.json'
      - 'schema/v0.4.0/assessment-language.schema.json'
      - 'schema/v0.4.0/capability-common.schema.json'
      - 'schema/v0.4.0/capability-mappings/supported/windows.cmdlet.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  three-original-windows-cmdlet-source-definitions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: scap-ng
      - uses: actions/checkout@v4
        with:
          repository: OVAL-Community/SCAP-Self-Assertion
          ref: e3538595c5083b9c34d937a81d319234df9bbfaa
          path: original-oval
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OVAL-Community/OVAL
          ref: v5.12.3
          path: oval-language
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0 lxml==6.0.2
      - name: Pinned variable-free original Windows cmdlet records/only-one native and XML proof
        env:
          PYTHONPATH: scap-ng/tools
        run: |
          test "$(git -C original-oval rev-parse HEAD)" = 'e3538595c5083b9c34d937a81d319234df9bbfaa'
          python scap-ng/tools/prove_v04_oval_windows_cmdlet_source.py \
            --source original-oval/SCAP_1.4/OVAL_Test_Content/windows/win-def_cmdlet_test.xml \
            --schema-root scap-ng/schema/v0.4.0 \
            --xsd-root oval-language/oval-schemas \
            --output work/original-oval-cmdlet/windows-cmdlet-three
      - name: Independently promote certified original source ledger from 28 to 31
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONPATH: scap-ng/tools
        run: |
          mkdir -p work/previous-ledger
          gh run download 39766826367 --repo "$GH_REPO" \
            --name v04-oval-windows-lockout-singleton-one-definition-28-of-167 \
            --dir work/previous-ledger
          test -f work/previous-ledger/cumulative-167-definition-readiness.json
          python scap-ng/tools/promote_v04_oval_windows_cmdlet_source_proof.py \
            --previous-ledger work/previous-ledger/cumulative-167-definition-readiness.json \
            --proof-root work/original-oval-cmdlet/windows-cmdlet-three \
            --output work/original-oval-cmdlet/cumulative-167-definition-readiness.json
          python - <<'PY'
          import json
          from copy import deepcopy
          from pathlib import Path
          from promote_v04_oval_windows_cmdlet_source_proof import promote

          current=json.loads(Path('work/original-oval-cmdlet/cumulative-167-definition-readiness.json').read_text())
          previous=json.loads(Path('work/previous-ledger/cumulative-167-definition-readiness.json').read_text())
          folder=Path('work/original-oval-cmdlet/windows-cmdlet-three')
          assert len(current['records']) == 167
          assert current['current_040_schema_and_original_source_validated'] == 31
          assert current['current_040_original_xml_roundtrip_exported'] == 31
          assert current['remaining_v003_compatible_without_current_040_proof'] == 131
          assert current['original_source_invalid_or_deprecated'] == 5
          assert current['scanner_result_parity_proven'] == 0
          try:
              promote(current, folder)
          except ValueError as exc:
              assert 'complete 28-of-167 certified' in str(exc)
          else:
              raise AssertionError('accepted duplicate 31/167 promotion')
          corrupt=deepcopy(previous)
          next(r for r in corrupt['records'] if r['definition_id']=='oval:navy.navwar.niwcatlantic.scc.test:def:222')['original_source_file_sha256']='0'*64
          try:
              promote(corrupt, folder)
          except ValueError as exc:
              assert 'unproved original variable-free' in str(exc)
          else:
              raise AssertionError('accepted forged original Windows cmdlet source SHA')
          print('PASS: three Windows cmdlet original XML roots with native records/only-one; 31/167 source graphs, 3 other cmdlet Variable Definitions unproved, scanner parity 0')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v04-oval-windows-cmdlet-three-definitions-three-tests-31-of-167
          path: work/original-oval-cmdlet/
          if-no-files-found: ignore
