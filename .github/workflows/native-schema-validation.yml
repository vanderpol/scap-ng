name: Native SCAP-NG schema validation

on:
  push:
    branches: [main]
    paths:
      - schema/v0.1.0/**
      - tools/validate_native_json_schemas.py
      - tools/test_schema_issue_regressions.py
      - research/iterations/003/source/split-policy-assessment/rhel9-full/**
      - research/iterations/003/examples/tailoring-all-options/**
      - research/iterations/003/examples/results-model-bakeoff/**
      - tools/fixtures/rhel9-tailoring/**
      - .github/workflows/native-schema-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-meta-validation:
    name: Validate JSON Schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jsonschema
      - name: Validate every v0.1.0 schema against Draft 2020-12
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          count=0
          for path in sorted(Path('schema/v0.1.0').glob('*.schema.json')):
              Draft202012Validator.check_schema(json.loads(path.read_text()))
              count += 1
              print('valid schema:', path)
          print('schemas_checked=', count)
          PY

  validator-unit-regression:
    name: Validate native schema harness behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jsonschema pyyaml
      - name: Regress redaction, manual mode, Profile and response-value contracts
        run: python tools/test_schema_issue_regressions.py
      - name: Exercise validator on minimal valid and invalid documents
        run: |
          python - <<'PY'
          import json, tempfile
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools')
          import validate_native_json_schemas as v
          schema_dir=Path('schema/v0.1.0')
          validators=v.build_validators(schema_dir)
          required={'benchmark.schema.json','rule.schema.json','assessment.schema.json'}
          missing=required-set(validators)
          if missing:
              raise SystemExit(f'missing validators: {sorted(missing)}')
          # Invalid content must produce diagnostics rather than being skipped.
          errors=list(validators['benchmark.schema.json'].iter_errors({'benchmark': {}}))
          if not errors:
              raise SystemExit('invalid minimal Benchmark unexpectedly validated')
          # Reusing one validator repeatedly must not mutate or exhaust its resolver.
          repeated=[len(list(validators['benchmark.schema.json'].iter_errors({'benchmark': {}}))) for _ in range(20)]
          if len(set(repeated)) != 1 or repeated[0] == 0:
              raise SystemExit(f'validator reuse changed diagnostics: {repeated}')
          print('validators_built=',len(validators))
          print('invalid_benchmark_diagnostics=',len(errors))
          print('repeated_validator_diagnostics=',repeated[0])
          PY

  historical-content-audit:
    name: Advisory audit (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: committed-rhel9-review
            root: research/iterations/003/source/split-policy-assessment/rhel9-full
          - name: tailoring-example
            root: research/iterations/003/examples/tailoring-all-options
          - name: results-example
            root: research/iterations/003/examples/results-model-bakeoff
          - name: rhel9-tailoring-fixture
            root: tools/fixtures/rhel9-tailoring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema pyyaml
      - name: Audit ${{ matrix.name }}
        id: validate
        continue-on-error: true
        run: |
          mkdir -p validation-reports
          python tools/validate_native_json_schemas.py \
            "${{ matrix.root }}" \
            --schema-dir schema/v0.1.0 \
            --report "validation-reports/${{ matrix.name }}.json"
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-schema-audit-${{ matrix.name }}
          path: validation-reports/${{ matrix.name }}.json
      - name: Report advisory status
        if: always()
        run: |
          if [ "${{ steps.validate.outcome }}" != "success" ]; then
            echo "::warning::${{ matrix.name }} contains known pre-alpha content/schema drift. See native-schema-validation-triage.md and the uploaded report."
          fi
