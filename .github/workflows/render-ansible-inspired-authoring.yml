name: Render Ansible-inspired SCAP-NG authoring experiment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/render-ansible-inspired-authoring.yml"
      - "research/iterations/001/prototypes/oval-migration-cases/**/split/**"
      - "research/iterations/001/tools/render_ansible_inspired.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Render alternate authoring syntax
        run: python research/iterations/001/tools/render_ansible_inspired.py
      - name: Validate generated YAML parses
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          root = Path("research/iterations/001/prototypes/ansible-inspired-authoring")
          files = list(root.rglob("*.yaml"))
          for path in files:
              yaml.safe_load(path.read_text())
          print(f"OK: parsed {len(files)} generated YAML files")
          PY
      - name: Commit generated comparison corpus
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/iterations/001/prototypes/ansible-inspired-authoring
          if git diff --cached --quiet; then
            echo "Generated alternate syntax already matches repository."
            exit 0
          fi
          git commit -m "Regenerate Ansible-inspired iteration 001 authoring corpus"
          git push
