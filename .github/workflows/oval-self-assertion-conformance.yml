name: OVAL 5.12.3 Self-Assertion conformance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oval-self-assertion-conformance.yml"
      - "AGENTS.md"
      - "research/iterations/001/public-corpus-manifest.yaml"
      - "research/iterations/001/oval-test-support-overrides.json"
      - "research/iterations/001/tools/oval_semantic_ir.py"
      - "research/iterations/001/tools/analyze_oval_self_assertion.py"
      - "research/iterations/001/tools/compare_self_assertion_schema_coverage.py"
      - "research/iterations/001/tools/verify_oval_self_assertion_static.py"
      - "research/iterations/001/tools/test_oval_dependency_graph.py"
      - "research/iterations/001/tools/test_oval_variable_evaluation_plans.py"
      - "research/iterations/001/tools/test_oval_static_variable_functions.py"
      - "research/iterations/001/tools/test_oval_set_filter_semantics.py"
      - "research/iterations/001/tools/test_oval_set_filter_algebra.py"
      - "research/iterations/001/tools/test_oval_result_algebra.py"
      - "research/iterations/001/tools/test_oval_synthetic_object_component.py"
      - "research/iterations/001/tools/test_oval_regex_capture.py"
      - "research/iterations/001/tools/test_oval_glob_and_natural_merge.py"
      - "research/iterations/001/tools/test_oval_time_difference.py"
      - "research/iterations/001/tools/test_oval_decimal_and_escape.py"
      - "research/iterations/001/tools/test_oval_self_assertion_sets.py"
      - "third_party/scap-1.4-schemas/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oval-self-assertion-conformance-main
  cancel-in-progress: true

jobs:
  agnostic-core-language:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SCAP-NG
        uses: actions/checkout@v4
        with:
          path: scap-ng

      - name: Check out pinned OVAL Self-Assertion corpus
        uses: actions/checkout@v4
        with:
          repository: OVAL-Community/SCAP-Self-Assertion
          ref: e3538595c5083b9c34d937a81d319234df9bbfaa
          path: self-assertion

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install importer dependencies
        run: python -m pip install --disable-pip-version-check lxml

      - name: Run semantic importer regression tests
        shell: bash
        run: |
          set -euo pipefail
          root="scap-ng/research/iterations/001/tools"
          python "$root/test_oval_dependency_graph.py"
          python "$root/test_oval_variable_evaluation_plans.py"
          python "$root/test_oval_static_variable_functions.py"
          python "$root/test_oval_set_filter_semantics.py"
          python "$root/test_oval_set_filter_algebra.py"
          python "$root/test_oval_result_algebra.py"
          python "$root/test_oval_synthetic_object_component.py"
          python "$root/test_oval_regex_capture.py"
          python "$root/test_oval_glob_and_natural_merge.py"
          python "$root/test_oval_time_difference.py"
          python "$root/test_oval_decimal_and_escape.py"
          python "$root/test_oval_self_assertion_sets.py" \
            self-assertion/SCAP_1.4/OVAL_Test_Content/unix/oval-def_set-unix.xml \
            self-assertion/SCAP_1.4/OVAL_Test_Content/windows/oval-def_set-windows.xml

      - name: Inventory agnostic OVAL language test content
        run: |
          python scap-ng/research/iterations/001/tools/analyze_oval_self_assertion.py \
            self-assertion/SCAP_1.4/OVAL_Test_Content/agnostic \
            --output scap-ng/research/iterations/001/generated/oval-self-assertion/agnostic-conformance-inventory.json || true

      - name: Verify statically reducible variable tests offline
        run: |
          python scap-ng/research/iterations/001/tools/verify_oval_self_assertion_static.py \
            self-assertion/SCAP_1.4/OVAL_Test_Content/agnostic \
            --output scap-ng/research/iterations/001/generated/oval-self-assertion/agnostic-static-verification.json || true

      - name: Inventory complete OVAL Self-Assertion corpus
        run: |
          python scap-ng/research/iterations/001/tools/analyze_oval_self_assertion.py \
            self-assertion/SCAP_1.4/OVAL_Test_Content \
            --output scap-ng/research/iterations/001/generated/oval-self-assertion/full-corpus-inventory.json || true

      - name: Compare corpus constructs to OVAL 5.12.3 schema catalog
        run: |
          python scap-ng/research/iterations/001/tools/compare_self_assertion_schema_coverage.py \
            scap-ng/research/iterations/001/generated/oval-self-assertion/full-corpus-inventory.json \
            scap-ng/research/iterations/001/generated/oval-schema-semantic-catalog.json \
            --output scap-ng/research/iterations/001/generated/oval-self-assertion/schema-coverage.json

      - name: Commit reproducible conformance inventory
        working-directory: scap-ng
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Generated reports are reproducible outputs. If main advanced while
          # this run was executing, carry the freshly generated directory over
          # the newest main rather than rebasing an old generated JSON commit
          # and creating a content conflict.
          tmpdir="$(mktemp -d)"
          cp -a research/iterations/001/generated/oval-self-assertion "$tmpdir/"
          git fetch origin main
          git reset --hard origin/main
          rm -rf research/iterations/001/generated/oval-self-assertion
          mkdir -p research/iterations/001/generated
          cp -a "$tmpdir/oval-self-assertion" research/iterations/001/generated/

          git add research/iterations/001/generated/oval-self-assertion
          if git diff --cached --quiet; then
            echo "Self-Assertion inventory already matches."
            exit 0
          fi
          git commit -m "Generate OVAL Self-Assertion conformance inventory"
          git push origin HEAD:main

      - name: Enforce offline definition gate
        working-directory: scap-ng
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/iterations/001/generated/oval-self-assertion/agnostic-static-verification.json")
          d=json.loads(p.read_text())
          mismatches=d.get("definition_mismatches",[])
          if mismatches:
              ids=", ".join(x["definition_id"] for x in mismatches)
              raise SystemExit(f"Offline Self-Assertion definition mismatches: {ids}")
          print("PASS: no fully evaluated Self-Assertion definition mismatches")
          PY

      - name: Enforce agnostic importer gate
        working-directory: scap-ng
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/iterations/001/generated/oval-self-assertion/agnostic-conformance-inventory.json")
          d=json.loads(p.read_text())
          failures=[]
          if d["parse_failure_count"]:
              failures.append(f'{d["parse_failure_count"]} parse failures')
          if d["unresolved_reference_file_count"]:
              failures.append(f'{d["unresolved_reference_file_count"]} files with unresolved references')
          if failures:
              raise SystemExit("OVAL Self-Assertion gate failed: " + ", ".join(failures))
          print("PASS: all agnostic Self-Assertion documents parsed with complete dependency closure")
          PY
