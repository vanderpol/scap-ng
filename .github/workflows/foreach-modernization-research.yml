name: Foreach modernization research

on:
  push:
    paths:
      - tools/analyze_oval_foreach_candidates.py
      - tools/foreach_equivalence.py
      - tools/test_foreach_equivalence.py
      - tools/test_foreach_unary_concat.py
      - tools/scap_upconvert_v003/foreach_modernization.py
      - tools/scap_upconvert_v003/test_foreach_modernization.py
      - tools/scap_upconvert_v003/foreach_modernization.py
      - tools/scap_upconvert_v003/test_foreach_modernization.py
      - tools/test_foreach_v03_integration.py
      - tools/test_schema_v03_independence.py
      - tools/generate_capability_schema.py
      - tools/validate_generated_capability_semantics.py
      - tools/validate_native_json_schemas.py
      - tools/validate_native_semantics.py
      - tools/capability_registry.py
      - tools/reported_elements.py
      - schema/v0.3.0/**
      - tests/foreach-0.3.0/**
      - tools/test_foreach_v03_integration.py
      - tools/test_schema_v03_independence.py
      - tools/generate_capability_schema.py
      - tools/validate_generated_capability_semantics.py
      - tools/validate_native_json_schemas.py
      - tools/validate_native_semantics.py
      - tools/capability_registry.py
      - tools/reported_elements.py
      - schema/v0.3.0/**
      - tests/foreach-0.3.0/**
      - tests/test_foreach_candidate_analyzer.py
      - research/assessment-simplification/foreach-07/**
      - .github/workflows/foreach-modernization-research.yml
  pull_request:
    paths:
      - tools/analyze_oval_foreach_candidates.py
      - tools/foreach_equivalence.py
      - tools/test_foreach_equivalence.py
      - tools/test_foreach_unary_concat.py
      - tests/test_foreach_candidate_analyzer.py
      - research/assessment-simplification/foreach-07/**
      - .github/workflows/foreach-modernization-research.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 jsonschema==4.25.1

      - name: Unit tests
        run: |
          python tests/test_foreach_candidate_analyzer.py
          python tests/test_foreach_selector_equivalence.py

      - name: Direct collection-expansion equivalence tests
        run: |
          python tools/test_foreach_equivalence.py
          PYTHONPATH=tools python tools/test_foreach_unary_concat.py
          PYTHONPATH=tools python tools/scap_upconvert_v003/test_foreach_modernization.py

      - name: SCAP-NG 0.3.0 foreach integration tests
        run: |
          python tools/test_foreach_v03_integration.py
          python tools/test_schema_v03_independence.py
          if ! python tools/validate_native_json_schemas.py tests/foreach-0.3.0/content \
            --schema-dir schema/v0.3.0 --report /tmp/foreach-v03-schema.json; then
            cat /tmp/foreach-v03-schema.json
            exit 1
          fi
          python tools/validate_native_semantics.py tests/foreach-0.3.0/content \
            --report /tmp/foreach-v03-semantics.json

      - name: Foreach v1 authoring prototype tests
        run: |
          python research/assessment-simplification/foreach-07/prototype/test_foreach_v1_schema.py
          python research/assessment-simplification/foreach-07/prototype/test_lower_foreach_v1.py
          python research/assessment-simplification/foreach-07/prototype/test_compile_foreach_v1.py

      - name: Probe RHEL collection-expansion counterexample
        run: |
          python tools/analyze_oval_foreach_candidates.py             research/assessment-simplification/evidence/rhel_9/SV-257889/source-oval.xml             --output /tmp/foreach-rhel.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/foreach-rhel.json').read_text())
          assert report['rewrite_performed'] is False
          assert report['safe_automatic_enabled'] is False
          candidates=[
              c for row in report['files'] for c in row.get('candidates',[])
              if c.get('candidate_family') == 'collection_expansion_at_least_one'
          ]
          assert len(candidates) >= 2, report
          assert 'home_dir' in {c['source']['item_field'] for c in candidates}
          assert all(c['classification'] == 'review_required' for c in candidates)
          print(json.dumps(report['summary'], indent=2, sort_keys=True))
          PY

      - name: Measure published RHEL 9 and Solaris 11 X86
        run: |
          mkdir -p /tmp/foreach-corpus
          curl -fL --retry 3             https://raw.githubusercontent.com/niwc-atlantic/scap-content-library/8c8e5dff860af6b1290ee9273a282db24278f8d5/Current/U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-signed.zip             -o /tmp/foreach-corpus/rhel9.zip
          curl -fL --retry 3             https://raw.githubusercontent.com/niwc-atlantic/scap-content-library/8c8e5dff860af6b1290ee9273a282db24278f8d5/Current/U_SOL_11_X86_V3R5_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip             -o /tmp/foreach-corpus/solaris11-x86.zip
          echo "901e0de43c967f20734f783eb06f6ee789ec56682c825c9ac12d1416c8fc8379dae6b19ba863c4092b9e5fc8c9419c864abb797ce5c7b2707d0f717af166f7b6  /tmp/foreach-corpus/rhel9.zip" | sha512sum -c -
          echo "3dd8cf77b62e36fcedc68b0e3f648df86c50783cd6fa2f659c0443315b32b2f624f70c24fb27c7d3ef2101866c43b0943ad6cc329952f803cac53a87025301b3  /tmp/foreach-corpus/solaris11-x86.zip" | sha512sum -c -
          python tools/analyze_oval_foreach_candidates.py /tmp/foreach-corpus/rhel9.zip             --output /tmp/foreach-rhel9-published.json
          python tools/analyze_oval_foreach_candidates.py /tmp/foreach-corpus/solaris11-x86.zip             --output /tmp/foreach-solaris11-x86-published.json
          python research/assessment-simplification/foreach-07/prototype/verify_production_candidates.py /tmp/foreach-rhel9-published.json --output /tmp/foreach-rhel9-v1-proof.json
          python research/assessment-simplification/foreach-07/prototype/verify_production_candidates.py /tmp/foreach-solaris11-x86-published.json --output /tmp/foreach-solaris11-x86-v1-proof.json
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('rhel9','solaris11-x86'):
              proof=json.loads(Path(f'/tmp/foreach-{name}-v1-proof.json').read_text())
              print(f'=== {name} v1 proof ===')
              print(json.dumps({
                  'eligible_candidates': proof['eligible_candidates'],
                  'equivalent_candidates': proof['equivalent_candidates'],
                  'failed_candidates': proof['failed_candidates'],
                  'all_equivalent': proof['all_equivalent'],
              }, sort_keys=True))
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('rhel9','solaris11-x86'):
              p=Path(f'/tmp/foreach-{name}-published.json')
              report=json.loads(p.read_text())
              print(f'=== {name} ===')
              print(json.dumps(report['summary'], indent=2, sort_keys=True))
              direct=[
                  c for row in report['files'] for c in row.get('candidates',[])
                  if c.get('candidate_family') == 'collection_expansion_at_least_one'
              ]
              for c in direct:
                  targets=[
                      {
                          'object_type': t['object_type'],
                          'entity': t['entity'],
                          'var_check': t['var_check'],
                          'tests': [
                              {
                                  'test_type': x['test_type'],
                                  'check': x['check'],
                                  'check_existence': x['check_existence'],
                              }
                              for x in t.get('tests',[])
                          ],
                      }
                      for t in c.get('targets',[])
                  ]
                  print(json.dumps({
                      'variable_id': c['variable_id'],
                      'source_object_type': c['source']['object_type'],
                      'item_field': c['source']['item_field'],
                      'record_field': c['source']['record_field'],
                      'source_sets': c['source']['object_features']['sets'],
                      'source_filters': c['source']['object_features']['filters'],
                      'targets': targets,
                      'first_proof_class': c.get('first_proof_class'),
                  }, sort_keys=True))
              assert report['rewrite_performed'] is False
              assert report['safe_automatic_enabled'] is False
          PY

      - name: Upload candidate reports
        uses: actions/upload-artifact@v4
        with:
          name: foreach-modernization-candidate-reports
          path: |
            /tmp/foreach-rhel.json
            /tmp/foreach-rhel9-published.json
            /tmp/foreach-solaris11-x86-published.json
            /tmp/foreach-rhel9-v1-proof.json
            /tmp/foreach-solaris11-x86-v1-proof.json
            /tmp/foreach-v03-schema.json
            /tmp/foreach-v03-semantics.json
