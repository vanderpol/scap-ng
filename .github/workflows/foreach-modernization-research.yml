name: Foreach modernization research

on:
  push:
    paths:
      - tools/analyze_oval_foreach_candidates.py
      - tests/test_foreach_candidate_analyzer.py
      - research/assessment-simplification/foreach-07/**
      - .github/workflows/foreach-modernization-research.yml
  pull_request:
    paths:
      - tools/analyze_oval_foreach_candidates.py
      - tests/test_foreach_candidate_analyzer.py
      - research/assessment-simplification/foreach-07/**
      - .github/workflows/foreach-modernization-research.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: python tests/test_foreach_candidate_analyzer.py

      - name: Probe RHEL collection-expansion counterexample
        run: |
          python tools/analyze_oval_foreach_candidates.py             research/assessment-simplification/evidence/rhel_9/SV-257889/source-oval.xml             --output /tmp/foreach-rhel.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/foreach-rhel.json').read_text())
          assert report['rewrite_performed'] is False
          assert report['safe_automatic_enabled'] is False
          candidates=[
              c
              for row in report['files']
              for c in row.get('candidates',[])
              if c.get('candidate_family') == 'collection_expansion'
          ]
          assert len(candidates) >= 2, report
          projected={c['source']['item_field'] for c in candidates}
          assert 'home_dir' in projected, projected
          assert all(c['classification'] == 'review_required' for c in candidates)
          print(json.dumps(report['summary'], indent=2, sort_keys=True))
          PY
