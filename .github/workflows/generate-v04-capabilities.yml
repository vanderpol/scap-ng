name: 0.4 native capability schema generation draft

on:
  push:
    branches: [main]
    paths:
      - tools/flatten_v04_object_schema.py
      - tools/audit_v04_flat_object_names.py
      - tools/test_flatten_v04_object_schema.py
      - tools/generate_capability_schema_v04.py
      - tools/test_generate_capability_schema_v04.py
      - tools/test_generate_capability_schema_v04_corpus.py
      - .github/workflows/generate-v04-capabilities.yml
      - schema/v0.4.0/capability-mappings/**
      - schema/v0.4.0/assessment-language.schema.json
      - schema/v0.4.0/capability-common.schema.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install draft JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Audit all 100 flat Object namespaces and schema transform
        run: |
          PYTHONPATH=tools python tools/audit_v04_flat_object_names.py --report work/v04-flat-object-collision-audit.json
          PYTHONPATH=tools python tools/test_flatten_v04_object_schema.py -v
      - name: Generate/validate Linux and Windows native 0.4 capability contracts
        run: |
          PYTHONPATH=tools python tools/test_generate_capability_schema_v04.py -v
      - name: Generate all 100 reviewed native 0.4 capability schemas
        run: |
          PYTHONPATH=tools python tools/test_generate_capability_schema_v04_corpus.py --output work/all-100-v04-generator-census.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: draft-v04-100-capability-census
          path: |
            work/all-100-v04-generator-census.json
            work/v04-flat-object-collision-audit.json
          if-no-files-found: warn
