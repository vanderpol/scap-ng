name: Audit pinned OVAL Test/Object/State pairings

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-oval-test-object-state-pairings.yml"
      - "tools/scap_ng_roundtrip_v003/audit_test_object_state_types.py"
      - "tools/test_variable_filter_dependencies.py"
      - "schema/v0.1.0/capability-mappings/**"
      - "third_party/scap-1.4-schemas/oval_5.12.3/**"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: scap-ng
      - uses: actions/checkout@v4
        with:
          repository: niwc-atlantic/scap-content-library
          ref: 8c8e5dff860af6b1290ee9273a282db24278f8d5
          path: niwc
      - uses: actions/checkout@v4
        with:
          repository: OVAL-Community/OVAL
          ref: v5.12.3
          path: oval-language
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser requirements
        run: python -m pip install lxml cryptography pyyaml
      - name: Regression for deep sets and complete filter dependencies
        run: python scap-ng/tools/test_variable_filter_dependencies.py
      - name: Audit two published benchmark datastreams and typed Schematron coverage
        run: |
          python scap-ng/tools/scap_ng_roundtrip_v003/audit_test_object_state_types.py \
            --schemas oval-language/oval-schemas \
            --source niwc/Current/U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-signed.zip \
            --source niwc/Current/U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip \
            --output work/test-object-state-types.json \
            --fail-on-mismatch
      - name: Upload detailed audit (even on mismatch)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oval-test-object-state-pairing-evidence
          path: work/test-object-state-types.json
