name: 0.4.0 original OVAL Linux AppArmor singleton native and XSD roundtrip
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v04-oval-linux-apparmor-source.yml'
      - 'tools/prove_v04_oval_apparmorstatus_source.py'
      - 'tools/promote_v04_oval_apparmorstatus_source_proof.py'
      - 'tools/validate_v04_oval_5123.py'
      - 'schema/v0.4.0/assessment.schema.json'
      - 'schema/v0.4.0/assessment-language.schema.json'
      - 'schema/v0.4.0/capability-mappings/supported/linux.apparmorstatus.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-oval-linux-apparmor-singleton:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: scap-ng
      - uses: actions/checkout@v4
        with:
          repository: OVAL-Community/SCAP-Self-Assertion
          ref: e3538595c5083b9c34d937a81d319234df9bbfaa
          path: original-oval
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OVAL-Community/OVAL
          ref: v5.12.3
          path: oval-language
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0 lxml==6.0.2
      - name: Source-pinned Linux AppArmor XML/native/singleton semantic proof
        env:
          PYTHONPATH: scap-ng/tools
        run: |
          test "$(git -C original-oval rev-parse HEAD)" = 'e3538595c5083b9c34d937a81d319234df9bbfaa'
          python scap-ng/tools/prove_v04_oval_apparmorstatus_source.py \
            --source original-oval/SCAP_1.4/OVAL_Test_Content/linux/linux-def_apparmorstatus_test.xml \
            --schema-root scap-ng/schema/v0.4.0 \
            --xsd-root oval-language/oval-schemas \
            --output work/original-oval-linux/linux-apparmorstatus
      - name: Independently promote cumulative original Definition ledger 26 to 27
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONPATH: scap-ng/tools
        run: |
          mkdir -p work/previous-ledger
          gh run download 39765226505 --repo "$GH_REPO" \
            --name v04-oval-criteria-nine-definitions-two-tests-26-of-167 \
            --dir work/previous-ledger
          test -f work/previous-ledger/cumulative-167-definition-readiness.json
          python scap-ng/tools/promote_v04_oval_apparmorstatus_source_proof.py \
            --previous-ledger work/previous-ledger/cumulative-167-definition-readiness.json \
            --proof-root work/original-oval-linux/linux-apparmorstatus \
            --output work/original-oval-linux/cumulative-167-definition-readiness.json
          python - <<'PY'
          import json
          from copy import deepcopy
          from pathlib import Path
          from promote_v04_oval_apparmorstatus_source_proof import promote

          current=json.loads(Path('work/original-oval-linux/cumulative-167-definition-readiness.json').read_text())
          previous=json.loads(Path('work/previous-ledger/cumulative-167-definition-readiness.json').read_text())
          folder=Path('work/original-oval-linux/linux-apparmorstatus')
          assert len(current['records']) == 167
          assert current['current_040_schema_and_original_source_validated'] == 27
          assert current['current_040_original_xml_roundtrip_exported'] == 27
          assert current['remaining_v003_compatible_without_current_040_proof'] == 135
          assert current['original_source_invalid_or_deprecated'] == 5
          assert current['scanner_result_parity_proven'] == 0
          try:
              promote(current, folder)
          except ValueError as exc:
              assert 'complete certified 26-of-167' in str(exc)
          else:
              raise AssertionError('accepted duplicate 27/167 promotion')
          corrupt=deepcopy(previous)
          next(r for r in corrupt['records'] if r['source_file']=='linux/linux-def_apparmorstatus_test.xml')['original_source_file_sha256']='0'*64
          try:
              promote(corrupt, folder)
          except ValueError as exc:
              assert 'not eligible' in str(exc)
          else:
              raise AssertionError('accepted forged AppArmor original source SHA')
          print('PASS: original OVAL Linux AppArmor singleton native 0.4/XML 5.12.3 semantic/XSD; 27/167; scanner parity 0')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v04-oval-linux-apparmor-singleton-one-definition-27-of-167
          path: work/original-oval-linux/
          if-no-files-found: ignore
