name: English-first 0.4 losslessness research
on:
  push:
    paths:
      - .github/workflows/research-english-first-04.yml
      - tools/research_english_first_04.py
      - tools/research_english_first_04_evaluate.py
      - tools/research_english_first_04_shell.py
      - tools/research_english_first_04_complex.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  narrow-source-inversion:
    name: Pinned source Test inversion, OVAL charts and complex evaluation trees
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SCAP-NG (trunk only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned unmodified STIG authoring fixtures
        uses: actions/checkout@v4
        with:
          repository: vanderpol/scap-ng-editor-sample-data
          ref: 99cbceae8d594c44cb509df95975ac1676a2b44a
          path: sample-data
          persist-credentials: false

      - name: Install YAML parsing
        run: python -m pip install 'PyYAML==6.0.3'

      - name: Compare source Tests and reference OVAL boundaries
        run: |
          python tools/research_english_first_04.py \
            --fixture-root sample-data \
            --report english-first-04-research-report.json

      - name: Prove exact named-Test composition of four complex STIG Assessments
        run: |
          python tools/research_english_first_04_evaluate.py \
            --fixture-root sample-data \
            --report english-first-04-evaluate-graph-report.json

      - name: Prove complete command/error collection in real DNS and Apache Tests
        run: |
          python tools/research_english_first_04_shell.py \
            --fixture-root sample-data \
            --report english-first-04-shell-tests.json

      - name: Reconstruct entire complex RHEL and Windows Assessments
        run: |
          python tools/research_english_first_04_complex.py \
            --fixture-root sample-data \
            --report english-first-04-complex-full-assessments.json \
            --examples-dir english-first-04-complete-examples

      - name: Upload source-backed report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-first-v04-complete-source-backed-research
          path: |
            english-first-04-research-report.json
            english-first-04-evaluate-graph-report.json
            english-first-04-shell-tests.json
            english-first-04-complex-full-assessments.json
            english-first-04-complete-examples/
          if-no-files-found: warn
