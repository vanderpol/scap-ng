name: Publish versioned Board yes/no proposals

on:
  push:
    branches: [main]
    paths:
      - board/proposals/**
      - .github/workflows/publish-board-proposals.yml
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

concurrency:
  group: publish-board-proposals
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish immutable proposal versions without duplicates
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const manifest = JSON.parse(fs.readFileSync('board/proposals/manifest.json', 'utf8'));
            const digest = s => crypto.createHash('sha256').update(s).digest('hex');
            const proposals = manifest.proposals.map(p => {
              const body = fs.readFileSync(p.path, 'utf8');
              if (digest(body) !== p.body_sha256 || !body.includes(p.marker)) {
                throw new Error('Proposal integrity failure: ' + p.id);
              }
              return {...p, body};
            });
            let cursor = null, repo, existing = [];
            do {
              const response = await github.graphql(`
                query($owner: String!, $name: String!, $cursor: String) {
                  repository(owner: $owner, name: $name) {
                    id
                    discussionCategories(first: 100) { nodes { id name isAnswerable } }
                    discussions(first: 100, after: $cursor) {
                      nodes { id title url body }
                      pageInfo { hasNextPage endCursor }
                    }
                  }
                }`, {...context.repo, name: context.repo.repo, cursor});
              repo = response.repository;
              existing.push(...repo.discussions.nodes);
              cursor = repo.discussions.pageInfo.hasNextPage ? repo.discussions.pageInfo.endCursor : null;
            } while (cursor);
            const categories = repo.discussionCategories.nodes;
            const category = categories.find(c => /^(voting|proposals)$/i.test(c.name))
              || categories.find(c => /^(general|ideas)$/i.test(c.name) && !c.isAnswerable);
            if (!category) throw new Error('No suitable Voting/Proposals/General/Ideas category; configure one before publication.');
            const published = [], failures = [];
            for (const proposal of proposals) {
              const matches = existing.filter(d => d.body?.includes(proposal.marker));
              if (matches.length > 1) {
                failures.push(proposal.id + ': duplicate published versions');
                continue;
              }
              let discussion = matches[0];
              if (discussion && discussion.body.trimEnd() !== proposal.body.trimEnd()) {
                failures.push(proposal.id + ': published voting text changed; do not overwrite reactions or text');
                continue;
              }
              if (!discussion) {
                const response = await github.graphql(`
                  mutation($repositoryId: ID!, $categoryId: ID!, $title: String!, $body: String!) {
                    createDiscussion(input: {repositoryId: $repositoryId, categoryId: $categoryId, title: $title, body: $body}) {
                      discussion { id title url body }
                    }
                  }`, {repositoryId: repo.id, categoryId: category.id, title: proposal.title, body: proposal.body});
                discussion = response.createDiscussion.discussion;
                existing.push(discussion);
                await new Promise(resolve => setTimeout(resolve, 1200));
              }
              published.push({id: proposal.id, version: proposal.version, title: proposal.title,
                url: discussion.url, discussion_id: discussion.id, source_path: proposal.path,
                body_sha256: proposal.body_sha256, status: 'published_proposal_not_ratified'});
            }
            fs.writeFileSync('board/discussion-index.json', JSON.stringify({source_commit: context.sha,
              evidence_commit: manifest.source_commit, category: category.name,
              published_at: new Date().toISOString(), proposals: published, failures,
              interpretation: 'Publication is not ratification. Reactions require an approved electorate/quorum/window/disposition. Never infer approval from public totals.'}, null, 2) + '\n');
            const links = ['# Published Board voting proposals', '',
              'React to each opening post: 👍 Yes, 👎 No. No ratification is inferred here.', '',
              '| ID | Decision | GitHub Discussion |', '| --- | --- | --- |'];
            for (const p of published) links.push(`| ${p.id} | ${p.title} | [Vote](${p.url}) |`);
            if (failures.length) links.push('', 'Publication failures:', ...failures.map(s => '- ' + s));
            fs.writeFileSync('board/VOTES.md', links.join('\n') + '\n');
            await core.summary.addRaw(links.join('\n')).write();
            if (failures.length) core.setFailed(failures.join('\n'));
      - name: Preserve publication index on main
        if: always()
        run: |
          if [ ! -f board/discussion-index.json ]; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add board/discussion-index.json board/VOTES.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record published versioned Board voting Discussions'
          git pull --rebase origin main
          git push
