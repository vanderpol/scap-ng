name: 0.4.0 direct UNIX password original-source acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/v04_direct_*.py'
      - 'tools/v04_direct_capabilities.json'
      - 'tools/v04_scalar_source_proof.py'
      - 'tests/fixtures/v04-scalar-proof-contracts.json'
      - 'tools/v04_expanded_source_proof.py'
      - 'tools/v04_source_package_semantics.py'
      - 'tools/verify_v04_unix_password.py'
      - 'tools/test_v04_direct_unix_password.py'
      - 'tools/oval_source_validation.py'
      - 'tools/generate_capability_schema_v04.py'
      - 'tools/v04_capability_native.py'
      - 'tools/v04_capability_source.py'
      - 'tests/fixtures/v04-direct-unix/**'
      - '.github/workflows/v04-direct-unix-password.yml'
permissions:
  contents: read
jobs:
  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: scap-ng
      - uses: actions/checkout@v4
        with:
          repository: niwc-atlantic/scap-content-library
          ref: 8c8e5dff860af6b1290ee9273a282db24278f8d5
          path: originals
          persist-credentials: false
          sparse-checkout: |
            Current/U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-signed.zip
            Current/U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-signed.zip
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0 lxml==6.0.2
      - name: Original XML, source proof, schema and compiled operands
        env:
          PYTHONPATH: scap-ng/tools
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest test_v04_direct_unix_password -v
          python scap-ng/tools/verify_v04_unix_password.py \
            --inputs originals/Current --output evidence/verified \
            --fixtures evidence/original-closures \
            --retention-floor scap-ng/tests/fixtures/v04-direct-unix/cases
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v04-direct-unix-password-source-proof
          path: evidence/
          if-no-files-found: error
