name: Win11 Bluetooth original OVAL source audit
on:
  push:
    branches: [main]
    paths:
      - 'tools/audit_v04_bluetooth_oval_source.py'
      - 'tools/test_audit_v04_bluetooth_oval_source.py'
      - 'tools/audit_v04_synthetic_filter_unions.py'
      - 'tools/audit_v04_filtered_union_oval_provenance.py'
      - 'tools/test_audit_v04_filtered_union_oval_provenance.py'
      - 'tools/test_audit_v04_synthetic_filter_unions.py'
      - '.github/workflows/v04-bluetooth-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Focused XML-source trace fixtures
        env:
          PYTHONPATH: tools
        run: python tools/test_audit_v04_bluetooth_oval_source.py
      - name: Download exact NIWC source SCAP ZIP and trace XML provenance
        run: |
          mkdir -p work
          curl --fail --silent --show-error --location --retry 3 \
            -o work/source-windows-11-scap.zip \
            'https://raw.githubusercontent.com/niwc-atlantic/scap-content-library/main/Current/U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip'
          python tools/audit_v04_bluetooth_oval_source.py \
            --source-zip work/source-windows-11-scap.zip \
            --report work/bluetooth-source-oval-audit.json
      - name: Review synthetic singleton filtered-Unions in published 0.4.0 samples
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONPATH: tools
        run: |
          python tools/test_audit_v04_synthetic_filter_unions.py
          gh release download v0.4.0-six-stig-authoring-approved-20261020 \
            --pattern scap-ng-0.4.0-six-stigs.json.zip --dir work
          echo '5037dc29085ad6a4487133962d9c07b1fbc09c2ce14198011c6bb8f7a7437dcb  work/scap-ng-0.4.0-six-stigs.json.zip' | sha256sum -c -
          python tools/audit_v04_synthetic_filter_unions.py \
            --archive work/scap-ng-0.4.0-six-stigs.json.zip \
            --report work/v04-synthetic-filter-union-census.json --assert-six
      - name: Classify every filtered-Union candidate against original six SCAP OVAL XML
        run: |
          PYTHONPATH=tools python tools/test_audit_v04_filtered_union_oval_provenance.py
          mkdir -p work/oval-source
          for name in             U_Apache_Server_2-4_UNIX_Server_V3R2_STIG_SCAP_1-4_Benchmark-enhancedV2-signed.zip             U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip             U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip             U_MS_Windows_Server_DNS_V2R3_STIG_SCAP_1-4_Benchmark-enhancedV8-signed.zip             U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-signed.zip             U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-signed.zip
          do
            curl --fail --silent --show-error --location --retry 3               "https://raw.githubusercontent.com/niwc-atlantic/scap-content-library/main/Current/$name"               --output "work/oval-source/$name"
          done
          PYTHONPATH=tools python tools/audit_v04_filtered_union_oval_provenance.py             --census work/v04-synthetic-filter-union-census.json             --source-dir work/oval-source             --report work/v04-filter-union-original-oval-classification.json --assert-six
      - uses: actions/upload-artifact@v4
        with:
          name: bluetooth-original-oval-source-audit
          path: |
            work/bluetooth-source-oval-audit.json
            work/v04-synthetic-filter-union-census.json
            work/v04-filter-union-original-oval-classification.json
          retention-days: 30
