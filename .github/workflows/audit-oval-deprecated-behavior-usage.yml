name: Audit deprecated OVAL behavior usage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-oval-deprecated-behavior-usage.yml"
      - "tools/census_oval_attribute_values.py"
      - "tools/test_census_oval_attribute_values.py"
      - "tools/build_oval_schema_semantic_catalog.py"
      - "tools/test_oval_schema_semantic_catalog.py"

jobs:
  deprecated-behavior-census:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SCAP-NG
        uses: actions/checkout@v4
        with:
          path: scap-ng

      - name: Check out pinned NIWC Current corpus
        uses: actions/checkout@v4
        with:
          repository: niwc-atlantic/scap-content-library
          ref: 8c8e5dff860af6b1290ee9273a282db24278f8d5
          path: niwc

      - name: Check out pinned SCAP 1.4 Self-Assertion corpus
        uses: actions/checkout@v4
        with:
          repository: OVAL-Community/SCAP-Self-Assertion
          ref: e3538595c5083b9c34d937a81d319234df9bbfaa
          path: self-assertion

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run focused census/catalog tests
        working-directory: scap-ng/tools
        run: |
          python test_census_oval_attribute_values.py
          python test_oval_schema_semantic_catalog.py

      - name: Census explicit unix.file behavior values
        run: |
          mkdir -p work/deprecated-behavior-census
          python scap-ng/tools/census_oval_attribute_values.py \
            niwc/Current \
            self-assertion/SCAP_1.4/OVAL_Test_Content \
            --namespace "http://oval.mitre.org/XMLSchema/oval-definitions-5#unix" \
            --element behaviors \
            --attribute recurse \
            --attribute recurse_direction \
            --attribute max_depth \
            --attribute recurse_file_system \
            --output work/deprecated-behavior-census/unix-file-behaviors.json

      - name: Summarize deprecated values
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("work/deprecated-behavior-census/unix-file-behaviors.json")
          d=json.loads(p.read_text())
          deprecated={
              ("recurse","none"),
              ("recurse","files"),
              ("recurse","files and directories"),
              ("recurse_direction","up"),
          }
          counts={(r["attribute"],r["value"]):r["count"] for r in d["counts"]}
          rows=[]
          for key in sorted(deprecated):
              rows.append({
                  "attribute":key[0],
                  "value":key[1],
                  "count":counts.get(key,0),
              })
          summary={
              "files_scanned":d["files_scanned"],
              "explicit_occurrences":d["occurrences"],
              "parse_failures":len(d["failures"]),
              "deprecated_values":rows,
              "deprecated_occurrences":sum(r["count"] for r in rows),
          }
          Path("work/deprecated-behavior-census/summary.json").write_text(
              json.dumps(summary,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(summary,indent=2,sort_keys=True))
          if d["failures"]:
              raise SystemExit(f"attribute census had {len(d['failures'])} parse failures")
          PY

      - name: Upload census evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deprecated-oval-behavior-census
          path: work/deprecated-behavior-census/
