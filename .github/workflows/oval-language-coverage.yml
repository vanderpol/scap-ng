name: OVAL 5.12.3 normative grammar inventory

# Normative OVAL inventory runs on the Codex VM; hosted replay is manual.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grammar-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canonical SCAP-NG
        uses: actions/checkout@v4
      - name: Checkout pinned official OVAL source
        uses: actions/checkout@v4
        with:
          repository: OVAL-Community/OVAL
          ref: 2f140ee5c5dd1ed9606fcd5afc301f6baeb48706
          path: upstream/oval
          persist-credentials: false
      - name: Run synthetic inventory tests
        run: python3 -m unittest discover -s tests -p 'test_audit_oval_language.py' -v
      - name: Run source-first inventory
        run: |
          python3 tools/audit_oval_language.py \
            --oval-dir upstream/oval/oval-schemas \
            --mapping-root schema/capability-mappings \
            --output coverage/oval-5.12.3-grammar.json | tee coverage-summary.txt
