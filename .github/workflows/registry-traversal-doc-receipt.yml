name: Temporary PR 77 deterministic documentation regeneration

on:
  pull_request:
    paths:
      - 'schema/native-selector.schema.json'
      - 'tools/generate_native_selector_schema.py'
      - '.github/workflows/registry-traversal-doc-receipt.yml'

permissions:
  contents: write

jobs:
  generate-reviewed-docs:
    if: ${{ github.event.pull_request.number == 77 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/registry-hierarchy-traversal-v041-20261118' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce all active 0.4.1 generated documents from reviewed source
        run: |
          python -m pip install -r requirements-dev.txt
          python tools/generate_native_selector_schema.py --check
          python tools/generate_docs.py
          python tools/generate_unix_file_reference.py
          python tools/generate_approved_annotation_pilot.py
          python tools/generate_review_documentation_pack.py
          python tools/generate_documentation.py
          python tools/audit_schema_documentation.py
          python tools/audit_documentation_fidelity.py
          python tools/check_documentation_examples.py
      - name: Commit generated bytes to only the named PR branch (never main)
        run: |
          set -euo pipefail
          test "${{ github.head_ref }}" = "fix/registry-hierarchy-traversal-v041-20261118"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/generated docs/pilots/unix-file docs/review-packs/issue43-phase-a docs/reference docs/metadata/documentation-0.4.1 docs/fidelity docs/examples
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No changed generated artifacts"
          else
            git commit -m "docs(0.4.1): regenerate pinned Registry traversal documentation artifacts"
            git push origin HEAD:refs/heads/fix/registry-hierarchy-traversal-v041-20261118
          fi
