name: PR 0.4.1 generated-document byte receipt

on:
  pull_request:
    paths:
      - schema/native-selector.schema.json
      - tools/generate_native_selector_schema.py
      - .github/workflows/registry-traversal-doc-receipt.yml

permissions:
  contents: read

jobs:
  generated-content-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce generated documentation from source
        run: |
          python tools/generate_native_selector_schema.py --check
          python tools/generate_docs.py
      - name: Export reviewed changed files as exact-byte base64 receipts
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          for name in ('docs/generated/developer-guide-windows-pilot.md',
                       'docs/generated/documentation-audit.json'):
              data = Path(name).read_bytes()
              print('GENERATED_START::' + name + '::' + str(len(data)))
              print(base64.b64encode(data).decode('ascii'))
              print('GENERATED_END::' + name)
          PY

      - name: Render all active 0.4.1 documentation derivatives and return exact changed bytes
        run: |
          python -m pip install -r requirements-dev.txt
          python tools/audit_schema_documentation.py
          python tools/generate_documentation.py
          python tools/audit_documentation_fidelity.py
          python tools/check_documentation_examples.py
          python - <<'PY'
          import base64
          from pathlib import Path
          import subprocess
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '--', 'docs/metadata', 'docs/reference', 'docs/examples'],
              text=True).splitlines()
          print('GENERATED_CHANGED_FILES::' + repr(changed))
          for name in changed:
              data = Path(name).read_bytes()
              print('GENERATED_START::' + name + '::' + str(len(data)))
              print(base64.b64encode(data).decode('ascii'))
              print('GENERATED_END::' + name)
          PY
