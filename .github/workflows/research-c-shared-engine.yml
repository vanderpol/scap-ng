# A single main-branch C checkpoint supersedes obsolete queued runs.
# Keep this gate limited to C; do not cancel other research workflows.
concurrency:
  group: research-c-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pinned-source-compatibility-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser for original Apache source fixture
        run: python -m pip install 'PyYAML>=6,<7' 'jsonschema>=4,<5'
      - name: Source-backed A collection identity and Apache Variable graph roundtrip
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_c_shared_engine.py tools/test_research_c_common_evaluation.py tools/test_research_c_fused_apache.py tools/test_research_c_require_language.py tools/test_research_c_fused_apache_loaded_files.py tools/test_research_c_wmi_source_compat.py tools/test_research_c_composed_assessment.py tools/test_research_c_permissions_macro.py tools/test_research_c_rhel_accounts_counterexamples.py tools/test_research_c_dns_shell.py tools/test_research_c_state_consumers.py tools/test_research_c_shared_observations.py tools/test_research_c_observation_bindings.py tools/test_research_c_apache_directive_observations.py tools/test_research_c_apache_directive_requirements.py tools/test_research_c_guided_projection.py tools/test_research_c_windows_shared_observations.py tools/test_research_c_windows_shared_native.py tools/test_research_c_same_record_evidence.py tools/test_research_c_guided_observations.py tools/test_research_c_one_frontend.py tools/test_research_c_rhel_account_observations.py tools/test_research_c_unified_compiler.py tools/test_research_c_objectless.py tools/test_research_c_unified_complex_windows.py tools/test_research_c_coverage_triage.py tools/test_research_c_external_observations.py tools/test_research_c_set_filter_variable_probe.py tools/test_research_c_private_value_sources.py tools/test_research_c_derived_values_compiler.py tools/test_research_c_variable_folding_safety.py tools/test_research_c_observation_values.py tools/test_research_type_evaluation_fixtures.py tools/test_research_c_oval_self_assertion_bridge.py tools/test_research_c_variable_roles.py tools/test_research_c_inline_source_constants.py tools/test_research_c_original_oval_to_authored_c.py tools/test_research_c_oval_singleton_source.py tools/test_research_c_oval_multicheck.py tools/test_research_c_hybrid_must_overlay.py
      - name: Summarize private Object-derived Apache values (read-only source audit)
        env:
          PYTHONPATH: tools
        run: |
          python - <<'PY'
          import json, yaml
          from pathlib import Path
          from research_c_private_value_sources import inspect_private_value_sources
          path = Path("research/requirements-first-language/contract-candidate/corpus/source-specimens/independent-shellcommand-1-3d964d126ca8.source.yaml")
          assessment = yaml.safe_load(path.read_text(encoding="utf-8"))["assessment"]
          result = inspect_private_value_sources(assessment)
          assert result["summary"]["named_variables"] == 19
          assert result["source_parity_proven"] is False
          assert result["automatic_migration_authorized"] is False
          print("Real Apache SV-214268 variable/Object source scope:")
          print(json.dumps(result["summary"], sort_keys=True))
          PY
      - name: Audit real Apache Variable consumers before splitting authored value roles
        env:
          PYTHONPATH: tools
        run: |
          python - <<'PY'
          import json
          import yaml
          from pathlib import Path
          from research_c_variable_roles import audit_value_roles
          source=Path("research/requirements-first-language/contract-candidate/corpus/source-specimens/independent-shellcommand-1-3d964d126ca8.source.yaml")
          assessment=yaml.safe_load(source.read_text(encoding="utf-8"))["assessment"]
          report=audit_value_roles(assessment)
          assert report["variable_count"]==19
          assert not report["C_language_decision_made"]
          print("Real original Apache 19-Variable usage contexts:")
          print(json.dumps(report["role_summary"],sort_keys=True))
          PY
      - name: Assert C proof is labelled research only
        run: |
          grep -q 'scanner_executed": False' tools/research_c_shared_engine.py
          grep -q 'original_source_parity_verified": False' tools/research_c_shared_engine.py
          echo 'C/A bounded structural + fixture-only proof, not scanner parity'
