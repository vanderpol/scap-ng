  push:
    paths:
      - 'tools/research_c_shared_engine.py'
      - 'tools/test_research_c_shared_engine.py'
      - 'tools/research_c_common_evaluation.py'
      - 'tools/test_research_c_common_evaluation.py'
      - 'tools/research_c_fused_apache.py'
      - 'tools/test_research_c_fused_apache.py'
      - 'tools/research_c_fused_apache_loaded_files.py'
      - 'tools/test_research_c_fused_apache_loaded_files.py'
      - 'tools/research_c_wmi_source_compat.py'
      - 'tools/test_research_c_wmi_source_compat.py'
      - 'tools/research_c_composed_assessment.py'
      - 'tools/test_research_c_composed_assessment.py'
      - 'tools/research_c_apache_directive_requirements.py'
      - 'tools/test_research_c_apache_directive_requirements.py'
