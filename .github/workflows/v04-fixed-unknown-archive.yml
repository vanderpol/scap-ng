name: Historical manual — October 21 fixed unknown archive compatibility
on:
  workflow_dispatch:
    inputs:
      allow_historical:
        description: Reproduce immutable October 21 authoring under its historical contract
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  fixed-result-unknown-source:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_historical }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5ff36c8e2c7d18068e0d89255e047132e8ac6f97
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0
      - name: Source-compatible fixed-result schema boundary and negative tests
        env:
          PYTHONPATH: tools
        run: python tools/test_v04_fixed_unknown_minimal.py
      - name: Fetch pinned published 4,001-document YAML authoring release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p work
          gh release download v0.4.0-six-stig-canonical-flat-authoring-20261021 \
            --pattern scap-ng-0.4.0-six-stigs.yaml.zip --dir work
          echo '8922a818c388aa88a40329aee678ad078a0abf4d5475742ad96e0352fd175ef4  work/scap-ng-0.4.0-six-stigs.yaml.zip' | sha256sum -c -
      - name: Validate all 4,001 unchanged published YAML documents under updated native schema
        env:
          PYTHONPATH: tools
        run: |
          python tools/test_v04_fixed_unknown_minimal.py \
            --published-yaml-zip work/scap-ng-0.4.0-six-stigs.yaml.zip
