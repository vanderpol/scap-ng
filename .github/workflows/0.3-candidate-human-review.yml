name: 0.3 Candidate human review build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/0.3-candidate-human-review.yml
      - tools/render_0_3_human_review_candidate.py
      - tools/normalize_0_3_review_surface.py
      - tools/test_normalize_0_3_review_surface.py
      - tools/test_component_naming_v03.py
      - tools/test_v03_vocabulary_contract.py
      - tools/test_foreach_v03_integration.py
      - tools/research_static_literal_collections.py
      - tools/test_research_static_literal_collections.py
      - tools/validate_generated_capability_semantics.py
      - schema/v0.3.0/**
      - tools/build_modernization_scorecard.py
      - tools/measure_full_modernization_census.py
      - tools/measure_post_modernization_residual_patterns.py
      - tools/research_inline_private_components.py
      - tools/scap_upconvert_v003/foreach_modernization.py
      - tools/prove_apache_observation.py
      - tools/prove_windows_domainrole_observation.py
      - tools/prove_rhel_dconf_observation.py

permissions:
  contents: read

concurrency:
  group: candidate-0.3-human-review
  cancel-in-progress: true

env:
  NIWC_REVISION: 8c8e5dff860af6b1290ee9273a282db24278f8d5

jobs:
  precheck:
    name: Validate candidate rendering transforms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: scap-ng
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 lxml==6.1.1 jsonschema
      - name: Run focused modernization tests
        run: |
          PYTHONPATH=scap-ng/tools python scap-ng/tools/test_research_inline_private_components.py -v
          PYTHONPATH=scap-ng/tools python scap-ng/tools/test_measure_full_modernization_census.py -v
          PYTHONPATH=scap-ng/tools python scap-ng/tools/test_measure_post_modernization_residual_patterns.py -v
          PYTHONPATH=scap-ng/tools python scap-ng/tools/test_normalize_0_3_review_surface.py -v
          PYTHONPATH=scap-ng/tools python scap-ng/tools/test_component_naming_v03.py -v
          PYTHONPATH=scap-ng/tools python scap-ng/tools/test_v03_vocabulary_contract.py -v
          PYTHONPATH=scap-ng/tools python scap-ng/tools/test_foreach_v03_integration.py -v
          PYTHONPATH=scap-ng/tools python scap-ng/tools/test_research_static_literal_collections.py -v

  render:
    name: Candidate review - ${{ matrix.label }}
    needs: precheck
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - key: rhel9
            label: RHEL 9
            artifact: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-signed.zip
          - key: oracle-linux9
            label: Oracle Linux 9
            artifact: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-signed.zip
          - key: windows11
            label: Windows 11
            artifact: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip
          - key: windows-server-2025
            label: Windows Server 2025
            artifact: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip
          - key: apache-unix-server
            label: Apache 2.4 UNIX Server
            artifact: U_Apache_Server_2-4_UNIX_Server_V3R2_STIG_SCAP_1-4_Benchmark-enhancedV2-signed.zip
          - key: windows-server-dns
            label: Windows Server DNS
            artifact: U_MS_Windows_Server_DNS_V2R3_STIG_SCAP_1-4_Benchmark-enhancedV8-signed.zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: scap-ng
      - uses: actions/checkout@v4
        with:
          repository: niwc-atlantic/scap-content-library
          ref: ${{ env.NIWC_REVISION }}
          path: niwc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 lxml==6.1.1

      - name: Fresh faithful conversion
        env:
          KEY: ${{ matrix.key }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          python scap-ng/tools/generate_niwc_current_review.py "niwc/Current/$ARTIFACT" \
            --output "work/source/$KEY" \
            --split-root "work/split-$KEY" \
            --source-revision "$NIWC_REVISION" \
            --source-repository-path "Current/$ARTIFACT" \
            --schema scap-ng/third_party/scap-1.4-schemas/omni-schema.xsd \
            --summary "work/source/$KEY/source-generation.json"

      - name: Measure final modernization view
        env:
          KEY: ${{ matrix.key }}
          LABEL: ${{ matrix.label }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          PYTHONPATH=scap-ng/tools python scap-ng/tools/measure_full_modernization_census.py \
            "work/source/$KEY" \
            --label "$LABEL" \
            --source-artifact "$ARTIFACT" \
            --output "work/evidence/$KEY/modernization-report.json"

      - name: Measure residual semantic patterns
        env:
          KEY: ${{ matrix.key }}
          LABEL: ${{ matrix.label }}
        run: |
          PYTHONPATH=scap-ng/tools python scap-ng/tools/measure_post_modernization_residual_patterns.py \
            "work/source/$KEY" \
            --label "$LABEL" \
            --output "work/evidence/$KEY/residual-patterns.json" \
            --top 100

      - name: Render complete 0.3 candidate authoring tree
        env:
          KEY: ${{ matrix.key }}
          LABEL: ${{ matrix.label }}
        run: |
          PYTHONPATH=scap-ng/tools python scap-ng/tools/render_0_3_human_review_candidate.py \
            "work/source/$KEY" \
            --output-root "work/review/$KEY/candidate-authoring" \
            --evidence-dir "work/evidence/$KEY" \
            --label "$LABEL"
          cp -R "work/source/$KEY" "work/review/$KEY/faithful-authoring"

          # Converter/audit/provenance JSON is engineering evidence, not
          # reviewer-facing native authoring. Preserve one copy separately.
          mkdir -p "work/evidence/$KEY/source-tree"
          find "work/source/$KEY" -type f -name '*.json' -print0 | while IFS= read -r -d '' file; do
            rel="${file#work/source/$KEY/}"
            mkdir -p "work/evidence/$KEY/source-tree/$(dirname "$rel")"
            cp "$file" "work/evidence/$KEY/source-tree/$rel"
          done
          find "work/review/$KEY/candidate-authoring" -type f -name '*.json' -delete
          find "work/review/$KEY/faithful-authoring" -type f -name '*.json' -delete

      - name: Build modernization scorecard
        env:
          KEY: ${{ matrix.key }}
          LABEL: ${{ matrix.label }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scap-ng/tools/build_modernization_scorecard.py \
            --modernization-report "work/evidence/$KEY/modernization-report.json" \
            --residual-report "work/evidence/$KEY/residual-patterns.json" \
            --label "$LABEL" \
            --source-revision "$NIWC_REVISION" \
            --workflow-url "$WORKFLOW_URL" \
            --output-json "work/evidence/$KEY/SCORECARD.json" \
            --output-markdown "work/review/$KEY/SCORECARD.md"

      - name: Verify candidate YAML parses
        env:
          KEY: ${{ matrix.key }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml
          root=Path("work/review")/os.environ["KEY"]/"candidate-authoring"
          files=list(root.rglob("*.yaml"))
          if not files:
              raise SystemExit("candidate tree has no YAML")
          for path in files:
              doc=yaml.safe_load(path.read_text(encoding="utf-8"))
              text=path.read_text(encoding="utf-8")
              if "check_existence:" in text:
                  raise SystemExit(f"legacy check_existence remains: {path}")
              if "filesystem: any" in text:
                  raise SystemExit(f"legacy filesystem any remains: {path}")
              if path.parent.name in {"automated","manual","applicability"} and path.name.startswith("benchmark."):
                  raise SystemExit(f"redundant benchmark Assessment filename remains: {path}")
          print(f"parsed and presentation-audited {len(files)} candidate YAML documents")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: candidate-review-${{ matrix.key }}
          path: work/review/${{ matrix.key }}
          if-no-files-found: error
          compression-level: 6

      - uses: actions/upload-artifact@v4
        with:
          name: candidate-evidence-${{ matrix.key }}
          path: work/evidence/${{ matrix.key }}
          if-no-files-found: error
          compression-level: 6

  assemble:
    name: Assemble six-benchmark human review package
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-review-*
          path: downloads/review
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-evidence-*
          path: downloads/evidence
      - name: Assemble and summarize
        env:
          NIWC_REVISION: ${{ env.NIWC_REVISION }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path

          expected={
              "rhel9":"RHEL 9",
              "oracle-linux9":"Oracle Linux 9",
              "windows11":"Windows 11",
              "windows-server-2025":"Windows Server 2025",
              "apache-unix-server":"Apache 2.4 UNIX Server",
              "windows-server-dns":"Windows Server DNS",
          }
          root=Path("work/scap-ng-0.3-human-review")
          (root/"benchmarks").mkdir(parents=True,exist_ok=True)
          rows=[]
          for key,label in expected.items():
              source=Path("downloads/review")/f"candidate-review-{key}"
              scorecard=Path("downloads/evidence")/f"candidate-evidence-{key}"/"SCORECARD.json"
              if not scorecard.is_file():
                  raise SystemExit(f"{key}: missing {scorecard}")
              target=root/"benchmarks"/key
              shutil.copytree(source,target)
              score=json.loads(scorecard.read_text())
              if score.get("benchmark")!=label:
                  raise SystemExit(f"{key}: label mismatch")
              cls=score.get("rule_classifications") or {}
              rows.append({
                  "key":key,
                  "label":label,
                  "rules":score["assessment_counts"]["rules"],
                  "objects":score["reduction_percent"]["objects"],
                  "states":score["reduction_percent"]["states"],
                  "variables":score["reduction_percent"]["variables"],
                  "local_simple":cls.get("local_simple",0),
                  "bounded":cls.get("bounded_dataflow",0),
                  "deferred_observation":score.get("deferred_observation_opportunities",{}).get("candidate_assessments",0),
                  "complex":cls.get("meaningfully_complex",0),
              })

          lines=[
              "# SCAP-NG 0.3 candidate human-review package",
              "",
              "**Research-only. This package is for owner readability/design review; it is not a released 0.3 schema or Board-approved format.**",
              "",
              "Start with `REVIEW-GUIDE.md`, then use each benchmark's `SCORECARD.md` and complete `candidate-authoring/` / `faithful-authoring/` trees as supporting evidence. The candidate applies only transformations that have passed the current exact/reversible research gates. Remaining complexity is deliberately preserved rather than hidden.",
              "",
              f"- Pinned NIWC revision: `{os.environ['NIWC_REVISION']}`",
              f"- Build workflow: {os.environ['WORKFLOW_URL']}",
              "",
              "## Benchmark scorecard summary",
              "",
              "| Benchmark | Rules | Object ↓ | State ↓ | Variable ↓ | Local/simple | foreach | Deferred Observation opportunities | Complex |",
              "| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |",
          ]
          for row in rows:
              lines.append(
                  f"| {row['label']} | {row['rules']} | {row['objects']}% | "
                  f"{row['states']}% | {row['variables']}% | {row['local_simple']} | "
                  f"{row['bounded']} | {row['deferred_observation']} | {row['complex']} |"
              )
          lines += [
              "",
              "## What to review",
              "",
              "- Can an experienced OVAL/STIG author understand an ordinary Rule without chasing named Objects, States, or single-use Variables?",
              "- Are the remaining named Variables clearly real shared/chained dataflow?",
              "- Are localized UNION/DIFFERENCE/Filter forms clearer while retaining obvious semantics?",
              "- Are deferred Observation opportunities clearly absent from accepted candidate syntax while their future value remains measurable?",
              "- Does explicit `evaluate` remain useful when genuine composition exists, and feel like unnecessary ceremony only in the single-Test case?",
              "- Are any candidate forms harder to review than the faithful conversion?",
              "",
              "Compiled `.scapng` packages are intentionally not included yet: the new authoring forms remain candidate semantics until human acceptance drives schema/compiler promotion.",
              "",
          ]
          (root/"README.md").write_text("\n".join(lines),encoding="utf-8")

          guide_lines=[
              "# SCAP-NG 0.3 modernization review guide",
              "",
              "Start here before browsing the complete benchmark trees. These examples were chosen to expose the main modernization decisions and the cases deliberately left explicit.",
              "",
              "## 1. Consumer-local Object, State, and simple Variable scope",
              "",
              "**RHEL 9 — SV-257923**",
              "",
              "- [Faithful](benchmarks/rhel9/faithful-authoring/assessments/automated/benchmark.rhel_9.SV-257923.automated.assessment.yaml)",
              "- [Candidate](benchmarks/rhel9/candidate-authoring/assessments/automated/SV-257923.automated.yaml)",
              "",
              "Review whether the candidate is easier to understand when the Object, constant Variable, and filter States are placed at their semantic consumers.",
              "",
              "## 2. Bounded collection iteration",
              "",
              "**RHEL 9 — SV-258029**",
              "",
              "- [Faithful](benchmarks/rhel9/faithful-authoring/assessments/automated/benchmark.rhel_9.SV-258029.automated.assessment.yaml)",
              "- [Candidate](benchmarks/rhel9/candidate-authoring/assessments/automated/SV-258029.automated.yaml)",
              "",
              "Review the explicit `for_each` collection expansion. It preserves one Test aggregation boundary rather than turning the source population into independent per-item Tests.",
              "",
              "## 3. Deferred Observation boundary",
              "",
              "Observation is deliberately **not** rendered into the 0.3 candidate tree. The scorecards may report proven future Observation opportunities, but accepted 0.3 authoring remains ordinary Assessment content.",
              "",
              "## 4. Set/Filter semantics intentionally retained",
              "",
              "**Oracle Linux 9 — SV-271608**",
              "",
              "- [Faithful](benchmarks/oracle-linux9/faithful-authoring/assessments/automated/benchmark.oracle_linux_9.SV-271608.automated.assessment.yaml)",
              "- [Candidate](benchmarks/oracle-linux9/candidate-authoring/assessments/automated/SV-271608.automated.yaml)",
              "",
              "This case is intentionally *not* replaced with a new generic construct. Review whether the localized UNION/Object form is understandable while keeping the set semantics explicit.",
              "",
              "## 5. Genuine multi-Test composition",
              "",
              "**Windows Server DNS — SV-259380**",
              "",
              "- [Faithful](benchmarks/windows-server-dns/faithful-authoring/assessments/automated/benchmark.ms_windows_server_dns.SV-259380.automated.assessment.yaml)",
              "- [Candidate](benchmarks/windows-server-dns/candidate-authoring/assessments/automated/SV-259380.automated.yaml)",
              "",
              "Use this case when reviewing whether an explicit `evaluate` tree remains useful for genuine composition.",
              "",
              "## 6. Simple single-Test evaluate",
              "",
              "Return to the candidate for **SV-271608** above. Its `evaluate` block only points at one Test. Compare that ceremony with the DNS composition case. This is the central readability question in issue #167; the package does not silently choose a new rule before human review.",
              "",
              "## Then browse the complete trees",
              "",
              "Each benchmark directory contains:",
              "",
              "- `SCORECARD.md` — structural summary;",
              "- `faithful-authoring/` — fidelity-first conversion;",
              "- `candidate-authoring/` — all currently proven exact/reversible modernizations.",
              "",
              "The full trees are there to verify that the representative examples are not special cases. Raw research evidence, residual dumps, and migration-audit JSON are intentionally excluded from this reviewer package.",
          ]
          (root/"REVIEW-GUIDE.md").write_text("\n".join(guide_lines)+"\n", encoding="utf-8")
          PY

      - name: Reject engineering evidence from human-review package
        run: |
          python - <<'PY'
          from pathlib import Path

          root=Path("work/scap-ng-0.3-human-review")
          forbidden_names={
              "SCORECARD.json",
              "RENDER-PROOF.json",
              "REVIEW-SURFACE.json",
              "RESIDUAL-PATTERNS.json",
              "REVIEW.json",
              "modernization-report.json",
              "residual-patterns.json",
              "render-report.json",
              "review-surface-normalization.json",
              "source-generation.json",
              "evidence.json",
              "applicability-evidence.json",
              "grouping-provenance.json",
              "profile-selection-audit.json",
              "profile-selection-provenance.json",
              "rule-source-audit.json",
              "validation.json",
          }
          leaks=[]
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              if path.name in forbidden_names:
                  leaks.append(str(path))
              if path.suffix==".json" and (
                  "candidate-authoring" in path.parts or
                  "faithful-authoring" in path.parts
              ):
                  leaks.append(str(path))
          if leaks:
              raise SystemExit(
                  "engineering evidence leaked into human-review artifact:\\n"
                  + "\\n".join(sorted(set(leaks)))
              )
          print("human-review artifact contains no raw engineering evidence files")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: scap-ng-0.3-human-review-candidate
          path: work/scap-ng-0.3-human-review
          if-no-files-found: error
          compression-level: 6
