name: 0.3 Candidate human review build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/0.3-candidate-human-review.yml
      - tools/render_0_3_human_review_candidate.py
      - tools/normalize_0_3_review_surface.py
      - tools/test_normalize_0_3_review_surface.py
      - tools/test_component_naming_v03.py
      - tools/test_v03_vocabulary_contract.py
      - tools/test_foreach_v03_integration.py
      - tools/research_static_literal_collections.py
      - tools/test_research_static_literal_collections.py
      - tools/validate_generated_capability_semantics.py
      - tools/validate_native_json_schemas.py
      - tools/validate_native_semantics.py
      - schema/v0.3.0/**
      - tools/build_modernization_scorecard.py
      - tools/measure_full_modernization_census.py
      - tools/measure_post_modernization_residual_patterns.py
      - tools/research_inline_private_components.py
      - tools/scap_upconvert_v003/assessment_oval_vocabulary.py
      - tools/scap_upconvert_v003/test_assessment_oval_vocabulary.py
      - tools/scap_upconvert_v003/native_capability_mapping.py
      - tools/scap_upconvert_v003/test_native_capability_mapping.py
      - tools/scap_upconvert_v003/convert_collection_review.py
      - tools/scap_upconvert_v003/convert_full_review.py
      - tools/check_current_authoring_contract.py
      - tools/audit_v003_explicit_defaults.py
      - tools/scap_ng_content_compiler.py
      - tools/scap_upconvert_v003/foreach_modernization.py
      - tools/prove_apache_observation.py
      - tools/prove_windows_domainrole_observation.py
      - tools/prove_rhel_dconf_observation.py

permissions:
  contents: read

concurrency:
  group: candidate-0.3-human-review
  cancel-in-progress: true

env:
  NIWC_REVISION: 8c8e5dff860af6b1290ee9273a282db24278f8d5

jobs:
  precheck:
    name: Validate candidate rendering transforms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: scap-ng
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 lxml==6.1.1 jsonschema
      - name: Run focused modernization tests
        run: |
          PYTHONPATH=scap-ng/tools python scap-ng/tools/scap_upconvert_v003/test_assessment_oval_vocabulary.py -v
          PYTHONPATH=scap-ng/tools python scap-ng/tools/test_research_inline_private_components.py -v
          PYTHONPATH=scap-ng/tools python scap-ng/tools/test_measure_full_modernization_census.py -v
          PYTHONPATH=scap-ng/tools python scap-ng/tools/test_measure_post_modernization_residual_patterns.py -v
          PYTHONPATH=scap-ng/tools python scap-ng/tools/test_normalize_0_3_review_surface.py -v
          PYTHONPATH=scap-ng/tools python scap-ng/tools/test_component_naming_v03.py -v
          PYTHONPATH=scap-ng/tools python scap-ng/tools/test_v03_vocabulary_contract.py -v
          PYTHONPATH=scap-ng/tools python scap-ng/tools/test_foreach_v03_integration.py -v
          PYTHONPATH=scap-ng/tools python scap-ng/tools/test_research_static_literal_collections.py -v

  render:
    name: Candidate review - ${{ matrix.label }}
    needs: precheck
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - key: rhel9
            label: RHEL 9
            artifact: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-signed.zip
          - key: oracle-linux9
            label: Oracle Linux 9
            artifact: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-signed.zip
          - key: windows11
            label: Windows 11
            artifact: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip
          - key: windows-server-2025
            label: Windows Server 2025
            artifact: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip
          - key: apache-unix-server
            label: Apache 2.4 UNIX Server
            artifact: U_Apache_Server_2-4_UNIX_Server_V3R2_STIG_SCAP_1-4_Benchmark-enhancedV2-signed.zip
          - key: windows-server-dns
            label: Windows Server DNS
            artifact: U_MS_Windows_Server_DNS_V2R3_STIG_SCAP_1-4_Benchmark-enhancedV8-signed.zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: scap-ng
      - uses: actions/checkout@v4
        with:
          repository: niwc-atlantic/scap-content-library
          ref: ${{ env.NIWC_REVISION }}
          path: niwc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 lxml==6.1.1 jsonschema

      - name: Fresh faithful conversion
        env:
          KEY: ${{ matrix.key }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          python scap-ng/tools/generate_niwc_current_review.py "niwc/Current/$ARTIFACT" \
            --output "work/source/$KEY" \
            --split-root "work/split-$KEY" \
            --source-revision "$NIWC_REVISION" \
            --source-repository-path "Current/$ARTIFACT" \
            --schema scap-ng/third_party/scap-1.4-schemas/omni-schema.xsd \
            --summary "work/source/$KEY/source-generation.json"

      - name: Measure final modernization view
        env:
          KEY: ${{ matrix.key }}
          LABEL: ${{ matrix.label }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          PYTHONPATH=scap-ng/tools python scap-ng/tools/measure_full_modernization_census.py \
            "work/source/$KEY" \
            --label "$LABEL" \
            --source-artifact "$ARTIFACT" \
            --output "work/evidence/$KEY/modernization-report.json"

      - name: Measure residual semantic patterns
        env:
          KEY: ${{ matrix.key }}
          LABEL: ${{ matrix.label }}
        run: |
          PYTHONPATH=scap-ng/tools python scap-ng/tools/measure_post_modernization_residual_patterns.py \
            "work/source/$KEY" \
            --label "$LABEL" \
            --output "work/evidence/$KEY/residual-patterns.json" \
            --top 100

      - name: Render complete 0.3 candidate authoring tree
        env:
          KEY: ${{ matrix.key }}
          LABEL: ${{ matrix.label }}
        run: |
          PYTHONPATH=scap-ng/tools python scap-ng/tools/render_0_3_human_review_candidate.py \
            "work/source/$KEY" \
            --output-root "work/review/$KEY/candidate-authoring" \
            --evidence-dir "work/evidence/$KEY" \
            --label "$LABEL"
          cp -R "work/source/$KEY" "work/review/$KEY/faithful-authoring"

          # Converter/audit/provenance JSON is engineering evidence, not
          # reviewer-facing native authoring. Preserve one copy separately.
          mkdir -p "work/evidence/$KEY/source-tree"
          find "work/source/$KEY" -type f -name '*.json' -print0 | while IFS= read -r -d '' file; do
            rel="${file#work/source/$KEY/}"
            mkdir -p "work/evidence/$KEY/source-tree/$(dirname "$rel")"
            cp "$file" "work/evidence/$KEY/source-tree/$rel"
          done
          find "work/review/$KEY/candidate-authoring" -type f -name '*.json' -delete
          find "work/review/$KEY/faithful-authoring" -type f -name '*.json' -delete

      - name: Validate rendered 0.3 candidate
        env:
          KEY: ${{ matrix.key }}
        run: |
          if ! PYTHONPATH=scap-ng/tools python scap-ng/tools/validate_native_json_schemas.py \
            "work/review/$KEY/candidate-authoring" \
            --schema-dir scap-ng/schema/v0.3.0 \
            --report "work/evidence/$KEY/candidate-schema-validation.json"; then
            echo "First 400 lines of candidate schema validation report:"
            python -m json.tool "work/evidence/$KEY/candidate-schema-validation.json" | sed -n '1,400p'
            exit 1
          fi
          if ! PYTHONPATH=scap-ng/tools python scap-ng/tools/validate_native_semantics.py \
            "work/review/$KEY/candidate-authoring" \
            --report "work/evidence/$KEY/candidate-semantic-validation.json"; then
            cat "work/evidence/$KEY/candidate-semantic-validation.json"
            exit 1
          fi

      - name: Build modernization scorecard
        env:
          KEY: ${{ matrix.key }}
          LABEL: ${{ matrix.label }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scap-ng/tools/build_modernization_scorecard.py \
            --modernization-report "work/evidence/$KEY/modernization-report.json" \
            --residual-report "work/evidence/$KEY/residual-patterns.json" \
            --label "$LABEL" \
            --source-revision "$NIWC_REVISION" \
            --workflow-url "$WORKFLOW_URL" \
            --output-json "work/evidence/$KEY/SCORECARD.json" \
            --output-markdown "work/review/$KEY/SCORECARD.md"

      - name: Verify candidate YAML parses
        env:
          KEY: ${{ matrix.key }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml
          root=Path("work/review")/os.environ["KEY"]/"candidate-authoring"
          files=list(root.rglob("*.yaml"))
          if not files:
              raise SystemExit("candidate tree has no YAML")
          for path in files:
              doc=yaml.safe_load(path.read_text(encoding="utf-8"))
              text=path.read_text(encoding="utf-8")
              if "check_existence:" in text:
                  raise SystemExit(f"legacy check_existence remains: {path}")
              if "filesystem: any" in text:
                  raise SystemExit(f"legacy filesystem any remains: {path}")
              if path.parent.name in {"automated","manual","applicability"} and path.name.startswith("benchmark."):
                  raise SystemExit(f"redundant benchmark Assessment filename remains: {path}")
          print(f"parsed and presentation-audited {len(files)} candidate YAML documents")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-review-${{ matrix.key }}
          path: work/review/${{ matrix.key }}
          if-no-files-found: warn
          compression-level: 6

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-evidence-${{ matrix.key }}
          path: work/evidence/${{ matrix.key }}
          if-no-files-found: warn
          compression-level: 6

  assemble:
    name: Assemble six-benchmark human review package
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-review-*
          path: downloads/review
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-evidence-*
          path: downloads/evidence
      - name: Assemble and summarize
        env:
          NIWC_REVISION: ${{ env.NIWC_REVISION }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path

          expected={
              "rhel9":"RHEL 9",
              "oracle-linux9":"Oracle Linux 9",
              "windows11":"Windows 11",
              "windows-server-2025":"Windows Server 2025",
              "apache-unix-server":"Apache 2.4 UNIX Server",
              "windows-server-dns":"Windows Server DNS",
          }
          root=Path("work/scap-ng-0.3-human-review")
          (root/"benchmarks").mkdir(parents=True,exist_ok=True)
          rows=[]
          for key,label in expected.items():
              source=Path("downloads/review")/f"candidate-review-{key}"
              scorecard=Path("downloads/evidence")/f"candidate-evidence-{key}"/"SCORECARD.json"
              if not scorecard.is_file():
                  raise SystemExit(f"{key}: missing {scorecard}")
              target=root/"benchmarks"/key
              shutil.copytree(source,target)
              score=json.loads(scorecard.read_text())
              if score.get("benchmark")!=label:
                  raise SystemExit(f"{key}: label mismatch")
              cls=score.get("rule_classifications") or {}
              rows.append({
                  "key":key,
                  "label":label,
                  "rules":score["assessment_counts"]["rules"],
                  "objects":score["reduction_percent"]["objects"],
                  "states":score["reduction_percent"]["states"],
                  "variables":score["reduction_percent"]["variables"],
                  "local_simple":cls.get("local_simple",0),
                  "static_variables":score.get("static_literals",{}).get("constant_variables_removed",0),
                  "foreach":score.get("foreach",{}).get("rewrites",0),
                  "deferred_observation":score.get("deferred_observation_opportunities",{}).get("candidate_assessments",0),
                  "complex":cls.get("meaningfully_complex",0),
              })

          lines=[
              "# SCAP-NG 0.3 candidate human-review package",
              "",
              "**Research-only. This package is for owner readability/design review; it is not a released 0.3 schema or Board-approved format.**",
              "",
              "Start with `REVIEW-GUIDE.md`, then use each benchmark's `SCORECARD.md` and complete `candidate-authoring/` / `faithful-authoring/` trees as supporting evidence. The candidate applies only transformations that have passed the current exact/reversible research gates. Remaining complexity is deliberately preserved rather than hidden.",
              "",
              f"- Pinned NIWC revision: `{os.environ['NIWC_REVISION']}`",
              f"- Build workflow: {os.environ['WORKFLOW_URL']}",
              "",
              "## Benchmark scorecard summary",
              "",
              "| Benchmark | Rules | Object ↓ | State ↓ | Variable ↓ | Local/simple | Static Variables folded | foreach rewrites | Deferred Observation opportunities | Complex |",
              "| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |",
          ]
          for row in rows:
              lines.append(
                  f"| {row['label']} | {row['rules']} | {row['objects']}% | "
                  f"{row['states']}% | {row['variables']}% | {row['local_simple']} | "
                  f"{row['static_variables']} | {row['foreach']} | "
                  f"{row['deferred_observation']} | {row['complex']} |"
              )
          lines += [
              "",
              "## What to review",
              "",
              "- Can an experienced OVAL/STIG author understand an ordinary Rule without chasing named Objects, States, or single-use Variables?",
              "- Are the remaining named Variables clearly real shared/chained dataflow?",
              "- Are localized UNION/DIFFERENCE/Filter forms clearer while retaining obvious semantics?",
              "- Are deferred Observation opportunities clearly absent from accepted candidate syntax while their future value remains measurable?",
              "- Does explicit `evaluate` remain useful when genuine composition exists, and feel like unnecessary ceremony only in the single-Test case?",
              "- Are any candidate forms harder to review than the faithful conversion?",
              "",
              "Compiled `.scapng` packages are intentionally not included in this owner authoring-review artifact. The accepted 0.3 authoring forms are schema-validated here; runtime/package review remains a separate release surface.",
              "",
          ]
          (root/"README.md").write_text("\n".join(lines),encoding="utf-8")

          guide_lines=[
              "# SCAP-NG 0.3 modernization review guide",
              "",
              "This is the primary owner/Board authoring review path. Every accepted 0.3 modernization is tied to real converted STIG content or, where automatic conversion must remain fail-closed, to a production-derived native-authoring example.",
              "",
              "## Modernization coverage",
              "",
              "| 0.3 decision | Production example | Review status |",
              "| --- | --- | --- |",
              "| Consumer-local Object/State | RHEL 9 SV-257923 | mechanically converted |",
              "| Assessment-scoped `shared_objects` | RHEL 9 SV-258029 | mechanically converted |",
              "| Typed static literal arrays | RHEL 9 SV-257923 | mechanically converted |",
              "| `variable.value` instead of legacy Variable Object plumbing | RHEL 9 SV-258045 | mechanically converted |",
              "| Simple collection `for_each` | RHEL 9 SV-258029 | mechanically converted |",
              "| Correlated nested `for_each` | Windows Server DNS SV-259388 | production-derived native authoring; legacy PowerShell loop intentionally not guessed by converter |",
              "| Localized Set/Filter structure | Oracle Linux 9 SV-271608 | mechanically converted |",
              "| Meaningful typed component IDs | all candidate trees; RHEL 9 SV-258029 is a compact example | mechanically converted/schema enforced |",
              "| Explicit multi-Test `evaluate` | Windows Server DNS SV-259388 | mechanically preserved |",
              "| Observation | measured in scorecards only | deferred beyond normative 0.3; no syntax emitted |",
              "",
              "## 1. Consumer-local components plus a genuinely shared Object",
              "",
              "**RHEL 9 — SV-258029**",
              "",
              "- [Faithful](benchmarks/rhel9/faithful-authoring/assessments/automated/benchmark.rhel_9.SV-258029.automated.assessment.yaml)",
              "- [Candidate](benchmarks/rhel9/candidate-authoring/assessments/automated/SV-258029.automated.yaml)",
              "",
              "The dconf database acquisition remains named as `dconf-database-directories-object` because another collection must reference it. The target text-file Object and State live directly at the Test because they are private to that consumer. This is the intended boundary: local by default, named when reuse/reference identity is real.",
              "",
              "## 2. Static typed values without Variable plumbing",
              "",
              "**RHEL 9 — SV-257923**",
              "",
              "- [Faithful](benchmarks/rhel9/faithful-authoring/assessments/automated/benchmark.rhel_9.SV-257923.automated.assessment.yaml)",
              "- [Candidate](benchmarks/rhel9/candidate-authoring/assessments/automated/SV-257923.automated.yaml)",
              "",
              "The fixed system-library directory list is emitted directly as a typed literal collection such as `[/lib, /lib64, /usr/lib, /usr/lib64]`. The source-equivalent `variable_match` remains explicit. Only compile-time constants are folded; genuine runtime/dataflow Variables remain named.",
              "",
              "## 3. Direct Variable evaluation without a legacy Variable Object",
              "",
              "**RHEL 9 — SV-258045**",
              "",
              "- [Faithful](benchmarks/rhel9/faithful-authoring/assessments/automated/benchmark.rhel_9.SV-258045.automated.assessment.yaml)",
              "- [Candidate](benchmarks/rhel9/candidate-authoring/assessments/automated/SV-258045.automated.yaml)",
              "",
              "This real UID-uniqueness check keeps its meaningful computed Variables but removes the OVAL Variable Object indirection. The Test uses capability `variable.value` directly against the named computed value.",
              "",
              "## 4. Runtime collection `for_each`",
              "",
              "**RHEL 9 — SV-258029**",
              "",
              "The same RHEL dconf example contains the proven automatic ObjectComponent → Variable → selector rewrite. The candidate expresses the actual intent directly:",
              "",
              "```yaml",
              "for_each:",
              "  item: item",
              "  in: dconf-database-directories-object",
              "select:",
              "  directory:",
              "    from: item.directory",
              "```",
              "",
              "This expands one collection. It does not create one Test per Item or alter Test/evaluate aggregation.",
              "",
              "## 5. Nested `for_each`: production DNS use case, fail-closed conversion",
              "",
              "**Windows Server DNS — SV-259388**",
              "",
              "- [Faithful](benchmarks/windows-server-dns/faithful-authoring/assessments/automated/benchmark.ms_windows_server_dns.SV-259388.automated.assessment.yaml)",
              "- [Candidate](benchmarks/windows-server-dns/candidate-authoring/assessments/automated/SV-259388.automated.yaml)",
              "",
              "The legacy content collects forward zones, then embeds another loop in PowerShell to enumerate A/AAAA hosts, construct FQDNs, resolve them, and count RRSIG records. That is the production pattern that justified correlated nested collection iteration.",
              "",
              "The native 0.3 authoring shape is:",
              "",
              "```yaml",
              "shared_objects:",
              "  forward-zones-object:",
              "    capability: windows.dns.zone",
              "    ...",
              "",
              "  hosts-object:",
              "    capability: windows.dns.record",
              "    for_each:",
              "      item: zone",
              "      in: forward-zones-object",
              "    select:",
              "      zone:",
              "        from: zone.name",
              "",
              "  rrsig-responses-object:",
              "    capability: windows.dns.query",
              "    for_each:",
              "      item: host",
              "      in: hosts-object",
              "    select:",
              "      name:",
              "        from: host.fqdn",
              "      zone:",
              "        from: zone.name",
              "```",
              "",
              "This excerpt demonstrates the accepted nested-`for_each` language requirement and its correlated outer lineage. It is deliberately **not** substituted into the converted candidate: the current converter cannot prove equivalence for arbitrary PowerShell bodies, so SV-259388 remains faithful shellcommand content. This is an example of fail-closed migration working as intended, not a missing feature.",
              "",
              "## 6. Set and Filter semantics remain explicit",
              "",
              "**Oracle Linux 9 — SV-271608**",
              "",
              "- [Faithful](benchmarks/oracle-linux9/faithful-authoring/assessments/automated/benchmark.oracle_linux_9.SV-271608.automated.assessment.yaml)",
              "- [Candidate](benchmarks/oracle-linux9/candidate-authoring/assessments/automated/SV-271608.automated.yaml)",
              "",
              "The candidate localizes the two SSSD text-file acquisitions into the Test but preserves their UNION/Object structure. SCAP-NG removes needless naming indirection; it does not hide meaningful Set or Filter semantics behind a generic shortcut.",
              "",
              "## 7. Explicit `evaluate` where composition is real",
              "",
              "**Windows Server DNS — SV-259388**",
              "",
              "The candidate retains an `any` tree containing two direct Tests and one nested `all` group. This is the kind of genuine decision structure for which explicit `evaluate` remains useful in 0.3.",
              "",
              "For contrast, SV-271608 has a one-Test `evaluate` root. 0.3 deliberately keeps one canonical composition model rather than introducing a second implicit execution form.",
              "",
              "## 8. Meaningful component IDs",
              "",
              "Use RHEL 9 SV-258029 and SV-258045 while reviewing naming. Named components use descriptive kebab-case IDs with the appropriate type suffix (`-object`, `-state`, `-variable`, `-test`, `-input`). Private inline components do not receive artificial IDs merely to satisfy the convention.",
              "",
              "## 9. Deferred Observation boundary",
              "",
              "Observation is deliberately **not** rendered into the 0.3 candidate tree. Scorecards report proven future reuse opportunities so the benefit stays measurable, but no second cross-Assessment execution interface is smuggled into the release.",
              "",
              "## Inherited core features",
              "",
              "Conditional evaluation, Organizational Input, explicit `reported_elements`, manual Assessments/results, profiles/tailoring, applicability, packaging, and compact results are part of the broader SCAP-NG design but are not new 0.3 modernization transformations. The repository examples tour covers those separately; this review package focuses on the 0.3 authoring changes applied to real benchmark content.",
              "",
              "## Then browse the complete trees",
              "",
              "Each benchmark directory contains:",
              "",
              "- `SCORECARD.md` — structural modernization counts;",
              "- `faithful-authoring/` — fidelity-first conversion;",
              "- `candidate-authoring/` — all currently proven exact/reversible automatic modernizations.",
              "",
              "The full trees verify that the examples above are not synthetic exceptions. Raw engineering evidence, residual dumps, and migration-audit JSON are intentionally excluded from this reviewer package.",
          ]
          (root/"REVIEW-GUIDE.md").write_text("\n".join(guide_lines)+"\n", encoding="utf-8")

          release_info=[
              "# SCAP-NG 0.3 Board-review candidate build",
              "",
              "- Schema version: \`0.3.0\`",
              f"- SCAP-NG source commit: \`{os.environ['GITHUB_SHA']}\`",
              f"- Pinned NIWC source revision: \`{os.environ['NIWC_REVISION']}\`",
              f"- Build workflow: {os.environ['WORKFLOW_URL']}",
              "- Deferred core design: Observation; evaluate redesign",
              "",
              "This metadata identifies the exact inputs for this review artifact.",
          ]
          (root/"BUILD-INFO.md").write_text("\n".join(release_info)+"\n",encoding="utf-8")
          PY

      - name: Build deterministic Board-review ZIP and SHA-256
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, zipfile

          source=Path("work/scap-ng-0.3-human-review")
          output=Path("work/scap-ng-0.3-board-review.zip")
          epoch=(1980,1,1,0,0,0)
          with zipfile.ZipFile(output,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=9) as zf:
              for path in sorted(p for p in source.rglob("*") if p.is_file()):
                  rel=(Path("scap-ng-0.3-human-review")/path.relative_to(source)).as_posix()
                  info=zipfile.ZipInfo(rel,date_time=epoch)
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=(0o100644 & 0xFFFF) << 16
                  zf.writestr(info,path.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          digest=hashlib.sha256(output.read_bytes()).hexdigest()
          Path("work/scap-ng-0.3-board-review.zip.sha256").write_text(
              f"{digest}  {output.name}\n",encoding="utf-8"
          )
          print(f"{output} sha256={digest}")
          PY

      - name: Reject engineering evidence from human-review package
        run: |
          python - <<'PY'
          from pathlib import Path

          root=Path("work/scap-ng-0.3-human-review")
          forbidden_names={
              "SCORECARD.json",
              "RENDER-PROOF.json",
              "REVIEW-SURFACE.json",
              "RESIDUAL-PATTERNS.json",
              "REVIEW.json",
              "modernization-report.json",
              "residual-patterns.json",
              "render-report.json",
              "review-surface-normalization.json",
              "source-generation.json",
              "evidence.json",
              "applicability-evidence.json",
              "grouping-provenance.json",
              "profile-selection-audit.json",
              "profile-selection-provenance.json",
              "rule-source-audit.json",
              "validation.json",
          }
          leaks=[]
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              if path.name in forbidden_names:
                  leaks.append(str(path))
              if path.suffix==".json" and (
                  "candidate-authoring" in path.parts or
                  "faithful-authoring" in path.parts
              ):
                  leaks.append(str(path))
          if leaks:
              raise SystemExit(
                  "engineering evidence leaked into human-review artifact:\\n"
                  + "\\n".join(sorted(set(leaks)))
              )
          print("human-review artifact contains no raw engineering evidence files")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: scap-ng-0.3-human-review-candidate
          path: |
            work/scap-ng-0.3-human-review
            work/scap-ng-0.3-board-review.zip
            work/scap-ng-0.3-board-review.zip.sha256
          if-no-files-found: error
          compression-level: 6
