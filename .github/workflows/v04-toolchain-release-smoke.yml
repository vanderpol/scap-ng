name: 0.4.0 toolchain clean-extract smoke

on:
  push:
    branches: [main]
    paths:
      - 'tools/build_versioned_toolchain.py'
      - 'tools/test_v04_toolchain_clean_extract.py'
      - 'tools/test_v04_public_cli_smoke.py'
      - 'tools/scap_converter_core.py'
      - 'tools/v04_source_verified_*.py'
      - 'tools/v04_native_bundle_compiler.py'
      - 'schema/v0.4.0/**'
      - '.github/workflows/v04-toolchain-release-smoke.yml'
  pull_request:
    paths:
      - 'tools/build_versioned_toolchain.py'
      - 'tools/test_v04_toolchain_clean_extract.py'
      - 'tools/test_v04_public_cli_smoke.py'
      - 'tools/scap_converter_core.py'
      - 'tools/v04_source_verified_*.py'
      - 'tools/v04_native_bundle_compiler.py'
      - 'schema/v0.4.0/**'
      - '.github/workflows/v04-toolchain-release-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: OVAL-Community/SCAP-Self-Assertion
          ref: e3538595c5083b9c34d937a81d319234df9bbfaa
          path: work/original-oval
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact smoke dependencies
        run: python -m pip install lxml==6.1.1 PyYAML==6.0.3 jsonschema==4.25.1
      - name: Build HEAD, verify, extract and exercise public tools
        run: |
          python tools/test_v04_toolchain_clean_extract.py \
            --self-assertion-root work/original-oval \
            --evidence-dir work/toolchain-clean-extract
      - name: Retain clean-extract evidence (candidate only; no release/tag)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v04-toolchain-clean-extract-${{ github.sha }}
          path: work/toolchain-clean-extract/
          if-no-files-found: error
