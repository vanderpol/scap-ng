name: 0.4-C source-backed Self-Assertion compatibility review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-c-self-assertion-compatibility.yml'
      - 'tools/research_c_oval_self_assertion_bridge.py'
      - 'tools/test_research_c_oval_self_assertion_bridge.py'
      - 'tools/research_c_original_oval_to_authored_c.py'
      - 'tools/research_c_oval_native_gap_report.py'
      - 'tools/test_research_c_oval_native_gap_report.py'
      - 'tools/research_c_constant_state_source.py'
      - 'tools/test_research_c_constant_state_source.py'
      - 'tools/research_c_oval_variable_usage_census.py'
      - 'tools/test_research_c_oval_variable_usage_census.py'
      - 'tools/research_c_oval_multicheck.py'
      - 'tools/research_c_hybrid_must_overlay.py'
      - 'tools/test_research_c_hybrid_must_overlay.py'
      - 'tools/research_c_hybrid_inline_expectations.py'
      - 'tools/test_research_c_hybrid_inline_expectations.py'
      - 'tools/research_c_oval_hybrid_provenance.py'
      - 'tools/test_research_c_oval_hybrid_provenance.py'
      - 'tools/research_c_source_identity_contract.py'
      - 'tools/test_research_c_source_identity_contract.py'
      - 'tools/verify_c_published_original_oval_examples.py'
      - 'research/assessment-simplification/compact-authoring-04/oval-self-assertion-c-review/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  SCAP_NG_OVAL_SCHEMA_ROOT: oval-language/oval-schemas

jobs:
  source-backed-c-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out current SCAP-NG main
        uses: actions/checkout@v4
        with:
          path: scap-ng
          persist-credentials: false
      - name: Check out pinned original OVAL 5.12.3 Self-Assertion
        uses: actions/checkout@v4
        with:
          repository: OVAL-Community/SCAP-Self-Assertion
          ref: e3538595c5083b9c34d937a81d319234df9bbfaa
          path: original-oval
          persist-credentials: false
      - name: Check out OVAL 5.12.3 schemas
        uses: actions/checkout@v4
        with:
          repository: OVAL-Community/OVAL
          ref: v5.12.3
          path: oval-language
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original source identity
        run: |
          set -euo pipefail
          test "$(git -C original-oval rev-parse HEAD)" = "e3538595c5083b9c34d937a81d319234df9bbfaa"
          test -d original-oval/SCAP_1.4/OVAL_Test_Content
      - name: Install parser prerequisites
        run: python -m pip install 'PyYAML>=6,<7' 'lxml>=5,<7' 'jsonschema>=4,<5'
      - name: Run pinned 0.3 source/OVAL semantic roundtrips (does not claim C parity)
        run: |
          python scap-ng/tools/scap_ng_roundtrip_v003/roundtrip_corpus_v003.py \
            --corpus original-oval/SCAP_1.4/OVAL_Test_Content \
            --out a-roundtrip \
            --report a-roundtrip.json \
            --inventory-only > a-roundtrip-summary.json
      - name: Build original-comment-preserving C review package and coverage manifest
        run: |
          python scap-ng/tools/research_c_oval_self_assertion_bridge.py \
            --corpus original-oval/SCAP_1.4/OVAL_Test_Content \
            --report a-roundtrip.json --native-out a-roundtrip \
            --output c-review > c-review-summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          source=json.loads(Path("a-roundtrip.json").read_text())
          output=json.loads(Path("c-review/manifest.json").read_text())
          assert source["definitions"]==output["source_definition_count"]
          assert (output["A_source_parity_review_definitions"]+
                  output["failed_A_roundtrip_or_unsupported_definitions"]==
                  output["source_definition_count"])
          assert output["native_0_4_C_converted_definitions"]==0
          assert output["scanner_execution_parity_proven"] is False
          print("Original-OVAL source Test count:", output["source_test_count"])
          print("Original-OVAL source accounting:", output["source_definition_count"],
                "definitions, A-compatible review",
                output["A_source_parity_review_definitions"],
                "unsupported/failed",output["failed_A_roundtrip_or_unsupported_definitions"])
          expected={
            ("ios/ios-def_version55_test.xml",
             "oval:navy.navwar.niwcatlantic.scc.ios:def:1"):"deprecated_oval_test",
            ("junos/junos-def_xml_config_test.xml",
             "oval:org.joval.junos.test:def:1"):"deprecated_oval_test",
            ("macos/ind-def_environmentvariable58_test_mac.xml",
             "oval:navy.navwar.niwcatlantic.scc.test:def:1"):"var_ref_datatype_mismatch",
            ("solaris/sol-def_package511_test.xml",
             "oval:navy.navwar.niwcatlantic.scc.test:def:1"):"var_ref_datatype_mismatch",
            ("windows/win-def_wuaupdatesearcher_test.xml",
             "oval:navy.navwar.niwcatlantic.scc.windows.update:def:1"):"var_ref_datatype_mismatch",
          }
          found={(r["file"],r["definition_id"]):r for r in output["blocked_definitions"]}
          if set(found)!=set(expected):
            raise ValueError("unexpected original OVAL Self-Assertion blockers "+
                             repr(sorted(set(found)^set(expected))))
          for key,kind in expected.items():
            features=found[key].get("unsupported_features") or []
            if {x.get("feature") for x in features}!={kind}:
              raise ValueError("source blocker meaning changed at "+repr(key))
          assert output["source_definition_count"]==167
          assert output["A_source_parity_review_definitions"]==162
          print("Pinned original OVAL source blockers exactly match five v003 baseline exceptions.")
          print("True native 0.4-C conversions: 0; this is a source-preserving A review.")
          PY
      - name: Prove 7-Test nested original OVAL Set/Filter/Variable hybrid C must overlay
        run: |
          mkdir -p c-hybrid
          PYTHONPATH=scap-ng/tools python - <<'PY'
          import json
          from pathlib import Path
          from copy import deepcopy
          import yaml
          from research_c_hybrid_must_overlay import (
              present_hybrid_must,compile_hybrid_must,prove_original_hybrid)
          from research_c_hybrid_inline_expectations import (
              present_inline_expectations,compile_inline_expectations,
              prove_inline_original)
          from research_c_oval_hybrid_provenance import (
              present_oval_set_provenance,compile_oval_set_provenance,
              prove_oval_set_provenance)
          reviews=[]
          for file in sorted(Path("c-review").glob("*.review.json")):
              raw=json.loads(file.read_text(encoding="utf-8"))
              if raw["source"]["file"]=="unix/oval-def_set-unix.xml":
                  reviews.append(raw)
          assert len(reviews)==1,"pinned Self-Assertion Set source absent/duplicated"
          review=reviews[0]
          assert review["source"]["definition_id"]=="oval:org.mitre.oval.test:def:276"
          native=review["A_source_compatibility_fallback"]
          assert len(native["tests"])==7
          assert len(native["objects"])==11
          assert len(native["variables"])==3
          assert sum("set" in obj for obj in native["objects"].values())==7
          assert any("filters" in obj["set"] for obj in native["objects"].values()
                     if "set" in obj)
          authored=present_hybrid_must(native)
          proof=prove_original_hybrid(native,authored)
          assert compile_hybrid_must(authored)==native
          assert proof["source_set_count"]==7
          assert proof["source_variable_count"]==3
          assert proof["OVAL_runtime_parity_proven"] is False
          changed=deepcopy(authored)
          changed["checks"]["complement"]["must"]["items_exist"]="one_or_more"
          try:
              prove_original_hybrid(native,changed)
          except ValueError:
              pass
          else:
              raise AssertionError("mutated source cardinality escaped parity gate")
          (Path("c-hybrid")/"nested-set-filter-must.research.yaml").write_text(
              "# Source-backed hybrid 0.4-C experiment; not normative or scanner-proven.\n"
              +"# Original original OVAL 5.12.3 source: unix/oval-def_set-unix.xml\n"
              +yaml.safe_dump(authored,sort_keys=False,allow_unicode=True),
              encoding="utf-8")
          (Path("c-hybrid")/"proof.json").write_text(
              json.dumps({"source":review["source"],"proof":proof},
                         indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print("Pinned original OVAL nested Set/Filter/Variable hybrid C proof:",
                json.dumps(proof,sort_keys=True))
          # Second, substantial authoring simplification: source constants
          # are now in expected-value declarations, not authored Variables.
          inlined=present_inline_expectations(native)
          inline_proof=prove_inline_original(native,inlined)
          assert compile_inline_expectations(inlined)==native
          assert inline_proof["authored_constant_variable_declarations"]==0
          assert inline_proof["compiler_rehydrated_source_variables"]==3
          assert inline_proof["authored_named_expected_values"]==4
          assert inlined["compatibility"]["states"]=={}
          assert inlined["compatibility"]["variables"]=={}
          for field in inlined["expected_values"].values():
              if "source_constant" in field:
                  assert field["value_match"]=="one"
          (Path("c-hybrid")/"nested-set-filter-inline-constants.research.yaml").write_text(
              "# Source-backed C hybrid: expected literals replace authored constant Variables.\n"
              +"# Original pinned OVAL XML: unix/oval-def_set-unix.xml\n"
              +yaml.safe_dump(inlined,sort_keys=False,allow_unicode=True),
              encoding="utf-8")
          (Path("c-hybrid")/"inline-proof.json").write_text(
              json.dumps({"source":review["source"],"proof":inline_proof},
                         indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print("Original 7-Test OVAL nested Set with inline authoring constants:",
                json.dumps(inline_proof,sort_keys=True))

          # Third C prototype: full author-editable named observation/State
          #/require Set expression plus mandatory typed source provenance.
          author,sidecar=present_oval_set_provenance(native)
          source_proof=prove_oval_set_provenance(native,author,sidecar)
          assert compile_oval_set_provenance(author,sidecar)==native
          assert source_proof["original_Test_count"]==7
          assert source_proof["original_Object_count"]==11
          assert source_proof["original_Set_count"]==7
          assert source_proof["original_State_count"]==4
          assert source_proof["original_Variable_count"]==3
          assert source_proof["legacy_source_object_ids_in_authoring"]==0
          assert source_proof["legacy_source_state_ids_in_authoring"]==0
          assert source_proof["legacy_source_test_ids_in_authoring"]==0
          author_path=Path("c-hybrid")/"oval-set-seven-tests-author-only.research.yaml"
          provenance_path=Path("c-hybrid")/"oval-set-seven-tests-provenance.research.yaml"
          author_path.write_text(
              "# Research-only 0.4-C source-backed Set authoring, not OVAL scanner parity.\n"
              +yaml.safe_dump(author,sort_keys=False,allow_unicode=True),
              encoding="utf-8")
          provenance_path.write_text(
              "# Research-only companion source identity/provenance; not a signature.\n"
              +yaml.safe_dump(sidecar,sort_keys=False,allow_unicode=True),
              encoding="utf-8")
          loaded_author=yaml.safe_load(author_path.read_text(encoding="utf-8"))
          loaded_prov=yaml.safe_load(provenance_path.read_text(encoding="utf-8"))
          assert compile_oval_set_provenance(loaded_author,loaded_prov)==native
          # All seven supplied Test results exercise the pinned OVAL 5.12.3
          # Boolean combiner through both original and C-produced criteria.
          # This is NOT Item collection/State evaluation or a scanner.
          from v04_a_truth_plan import compile_expression,execute_supplied_results
          original_plan=compile_expression(native)
          generated_plan=compile_expression(
              compile_oval_set_provenance(loaded_author,loaded_prov))
          assert original_plan["requires"]["tests"]==generated_plan["requires"]["tests"]
          cases=[
              ("all_true",["true"],"true"),
              ("all_na",["not_applicable"],"not_applicable"),
              ("false_over_error",["false","error"],"false"),
              ("error_over_unknown",["error","unknown"],"error"),
              ("unknown_over_ne",["unknown","not_evaluated"],"unknown"),
              ("ne_over_na",["not_evaluated","not_applicable"],"not_evaluated"),
              ("true_over_na",["true","not_applicable"],"true"),
          ]
          for name,statuses,expected in cases:
              tests={key:statuses[i%len(statuses)] for i,key in enumerate(
                  original_plan["requires"]["tests"])}
              actual=execute_supplied_results(original_plan,tests)
              lower=execute_supplied_results(generated_plan,tests)
              assert actual["outcome"]==lower["outcome"]==expected,(name,actual,lower)
              assert lower["scanner_executed"] is False
              assert lower["collections_evaluated"] is False
          from hashlib import sha256
          metrics={
              "original_inlined_bytes":len(
                  (Path("c-hybrid")/
                   "nested-set-filter-inline-constants.research.yaml").read_bytes()),
              "author_only_bytes":len(author_path.read_bytes()),
              "provenance_bytes":len(provenance_path.read_bytes()),
              "original_inlined_lines":len(
                  (Path("c-hybrid")/
                   "nested-set-filter-inline-constants.research.yaml").read_text().splitlines()),
              "author_only_lines":len(author_path.read_text().splitlines()),
              "provenance_lines":len(provenance_path.read_text().splitlines()),
              "source_original_sha256":sha256(
                  Path("original-oval/SCAP_1.4/OVAL_Test_Content/unix/oval-def_set-unix.xml"
                  ).read_bytes()).hexdigest(),
              "scanner_parity_proven":False,
              "original_oval_supplied_Test_truth_cases":len(cases),
          }
          (Path("c-hybrid")/"oval-set-seven-tests-provenance-proof.json").write_text(
              json.dumps({"proof":source_proof,"metrics":metrics},
                         indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print("Original OVAL 7-Test, 7-Set C authoring/provenance split:",
                json.dumps({"proof":source_proof,"metrics":metrics},sort_keys=True))

          PY
      - name: Compile independently authored C subset of every source-compatible original OVAL Definition
        run: |
          python scap-ng/tools/research_c_original_oval_to_authored_c.py \
            --a-review c-review --output c-native > c-native-summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path("c-native/conversion-manifest.json").read_text())
          assert summary["A_compatible_Definitions_seen"]==162
          assert summary["native_C_Definitions"]>=36, (
              "regression: fewer than 36 source-verified native C Definitions")
          assert summary["native_C_Definitions"]+summary[
              "source_compatible_not_yet_native_C"]==162
          print("Independently compiled original OVAL Definitions in native 0.4-C authoring:",
                summary["native_C_Definitions"])
          print("Fail-closed source-compatible A-only remainder:",
                summary["source_compatible_not_yet_native_C"])
          print("Scanner and full expression/Set/Filter/Variable runtime parity NOT asserted")
          PY
          python scap-ng/tools/research_c_oval_native_gap_report.py \
            --manifest c-native/conversion-manifest.json \
            --output c-native/first-rejection-gap-report.md --expected-total 162
          cat c-native/first-rejection-gap-report.md >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,32p' c-native/first-rejection-gap-report.md
      - name: Source-backed C fixed State constant reconstruction census
        run: |
          PYTHONPATH=scap-ng/tools python -m unittest -v scap-ng/tools/test_research_c_constant_state_source.py
          PYTHONPATH=scap-ng/tools python scap-ng/tools/research_c_constant_state_source.py \
            --review c-review --manifest c-native/conversion-manifest.json \
            --out c-native/fixed-state-constant-hybrid-census.json \
            --examples-dir c-native/fixed-state-authoring
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("c-native/fixed-state-constant-hybrid-census.json").read_text())
          assert r["variable_blocked_definitions"]==68
          assert r["hybrid_source_graph_proven_definitions"]>=8
          assert r["moved_constant_variables"]>=14
          idx=json.loads(Path("c-native/fixed-state-authoring/index.json").read_text())
          assert len(idx["source_definitions"])==r["hybrid_source_graph_proven_definitions"]
          assert idx["full_native_C_compilation_proven"] is False
          assert r["still_native_C_converted_definitions"]>=36
          assert r["scanner_parity_proven"] is False
          assert r["full_native_C_compilation_proven"] is False
          print("This is safe authoring of fixed Values, not a native C Definition conversion.")
          PY
      - name: Audit source Variable consumers for all 68 native-C Variable blockers
        run: |
          PYTHONPATH=scap-ng/tools python -m unittest -v scap-ng/tools/test_research_c_oval_variable_usage_census.py
          PYTHONPATH=scap-ng/tools python scap-ng/tools/research_c_oval_variable_usage_census.py \
            --review c-review --manifest c-native/conversion-manifest.json \
            --out c-native/original-oval-variable-usage-census.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("c-native/original-oval-variable-usage-census.json").read_text())
          assert x["blocked_source_definitions"]==68
          assert x["variable_declarations"]==245
          assert x["variable_roles"]["runtime_derived"]==126
          assert x["variable_roles"]["constant_collection_binding"]==84
          assert x["variable_roles"]["constant_single_state_expectation"]==17
          assert x["variable_roles"]["constant_shared_state_expectation"]==4
          assert x["variable_roles"]["constant_derived_dependency"]==14
          assert x["new_native_C_conversions_proven"]==0
          assert x["authoring_optimization_not_automatically_safe"] is True
          print("Pinned exact source Variables and collection/State/derived consumers accounted for.")
          PY
      - name: Verify published original family fixed-expected-value C authoring
        run: |
          PYTHONPATH=scap-ng/tools python - <<'PY'
          from pathlib import Path
          import json
          import yaml
          from research_c_constant_state_source import (
              present_fixed_state_expectations, compile_fixed_state_expectations,
              prove_fixed_state_source)
          matched=[]
          for p in sorted(Path("c-review").glob("*.review.json")):
              row=json.loads(p.read_text(encoding="utf-8"))
              src=row.get("source",{})
              if (src.get("file")=="agnostic/ind-def_family_test.xml" and
                  src.get("definition_id")=="oval:org.mitre.oval.test:def:95"):
                  matched.append(row)
          assert len(matched)==1, "missing original OVAL Definition or ambiguous source"
          source=matched[0]["A_source_compatibility_fallback"]
          author,sidecar=present_fixed_state_expectations(source)
          target=Path("scap-ng/research/assessment-simplification/compact-authoring-04/c-original-family-fixed-pattern.research.yaml")
          published=yaml.safe_load(target.read_text(encoding="utf-8"))
          assert published==author, "published 0.4-C expected values drifted from original OVAL"
          assert compile_fixed_state_expectations(published,sidecar)==source
          proof=prove_fixed_state_source(source,published,sidecar)
          assert proof["inlined_source_constants"]==1
          assert proof["OVAL_scanner_parity_proven"] is False
          Path("c-native/original-family-fixed-pattern.sidecar.json").write_text(
              json.dumps(sidecar,sort_keys=True,indent=2)+"\\n",encoding="utf-8")
          print("Original family fixed pattern authoring restores exact A source graph.")
          PY
      - name: Verify permanent GitHub sample files against generated original-source C
        run: |
          python scap-ng/tools/verify_c_published_original_oval_examples.py \
            --published scap-ng/research/assessment-simplification/compact-authoring-04/oval-self-assertion-c-review \
            --generated c-native --manifest c-native/conversion-manifest.json
      - name: Hash and archive review outputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path("c-review")
          with (root/"file-sha256.txt").open("w",encoding="utf-8") as fd:
              for p in sorted(root.rglob("*.json")):
                  fd.write(hashlib.sha256(p.read_bytes()).hexdigest()+"  "+p.relative_to(root).as_posix()+"\n")
          PY
          tar -czf c-review-source-backed.tar.gz c-review c-hybrid c-native a-roundtrip.json c-review-summary.json c-native-summary.json
          sha256sum c-review-source-backed.tar.gz > c-review-source-backed.sha256
      - name: Upload original-source-backed review (NOT native C conversion)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c-original-oval-compatibility-review-not-native-conversion
          path: |
            c-review/
            c-native/
            c-hybrid/
            c-native-summary.json
            c-review-summary.json
            c-review-source-backed.tar.gz
            c-review-source-backed.sha256
            a-roundtrip.json
          if-no-files-found: warn
          retention-days: 14
