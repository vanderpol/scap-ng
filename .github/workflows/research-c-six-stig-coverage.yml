name: 0.4-C pinned six-STIG source coverage triage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-c-six-stig-coverage.yml'
      - 'tools/research_c_coverage_triage.py'
      - 'tools/test_research_c_coverage_triage.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c-six-stig-source-triage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-six-stig-source-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned parser and validator
        run: python -m pip install PyYAML==6.0.3 jsonschema==4.25.1
      - name: Run focused C source triage regression locally on the runner
        run: python -m unittest -v tools/test_research_c_coverage_triage.py
      - name: Download version-pinned r3 dual-format research sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/c-six-stig
          base="https://github.com/vanderpol/scap-ng/releases/download/v0.4.0-joval-meeting-preview-20261015-r3"
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            "$base/scap-ng-v0.4-joval-six-stig-json.zip" -o work/c-six-stig/json.zip
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            "$base/scap-ng-v0.4-joval-six-stig-yaml.zip" -o work/c-six-stig/yaml.zip
          printf '%s  %s\n' \
            'a1837c03133021f4d13814516a91b372f83b03771519f8361398ff1663056fea' 'work/c-six-stig/json.zip' \
            '03d64157ee295b81defe6f96cf7a3123410010ef4422d76bf5b7bb3ddbf30c9d' 'work/c-six-stig/yaml.zip' \
            | sha256sum --check
      - name: Build independently verified source-preserving six-STIG A IR for C input
        run: |
          python tools/v04_a_compile_verified_ir.py \
            --json-archive work/c-six-stig/json.zip \
            --yaml-archive work/c-six-stig/yaml.zip \
            --out-ir "$RUNNER_TEMP/c-source-input-ir.json" \
            --report-json "$RUNNER_TEMP/c-source-ir-validation.json" \
            --assert-six > "$RUNNER_TEMP/c-source-validation.stdout"
      - name: Classify all source Assessments, retaining C non-proof labels
        run: |
          python tools/research_c_coverage_triage.py \
            --verified-ir "$RUNNER_TEMP/c-source-input-ir.json" \
            --output "$RUNNER_TEMP/c-source-triage.json" \
            --assert-six
      - name: Publish source-backed C triage counts in GitHub Actions summary
        shell: bash
        run: |
          python - "$RUNNER_TEMP/c-source-triage.json" "$RUNNER_TEMP/c-source-ir-validation.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text())
          v=json.loads(Path(sys.argv[2]).read_text())
          assert r["stage"]=="C_SOURCE_COMPLEXITY_TRIAGE_NOT_NATIVE_C_COVERAGE"
          assert (r["assessment_count"],r["named_test_count"])==(872,1375)
          assert r["C_converted_assessment_count_claimed"]==0
          assert v["full_source_preservation"]=="PASS"
          assert v["yaml_json_ir_byte_parity"]=="PASS"
          assert sum(r["tier_counts"].values())==872
          print("# 0.4-C six-STIG source complexity: verified corpus")
          print()
          print("**Pinned input:** v0.4.0-joval-meeting-preview-20261015-r3; SHA-256 checked for both JSON and YAML.")
          print(f"**Verified source envelope:** {v['source_documents']} documents; {r['assessment_count']} automated Assessments; {r['named_test_count']} named Tests.")
          print(f"**Source IR SHA-256:** `{v['ir_sha256']}`")
          print()
          print("| C source triage category | Automated Assessments |")
          print("|---|---:|")
          for tier,count in sorted(r["tier_counts"].items()):
              print(f"| {tier} | {count} |")
          print()
          print("## Non-exclusive source graph hazards")
          print("| Hazard | Assessments |")
          print("|---|---:|")
          for hazard,count in sorted(r["hazard_assessment_counts"].items()):
              print(f"| {hazard} | {count} |")
          print()
          print("## Source authoring groups")
          print("| Group | "+ " | ".join(sorted(r["tier_counts"])) + " |")
          print("|---|"+"---:|"*len(r["tier_counts"]))
          for group,counts in sorted(r["by_source_group"].items()):
              print("| "+group+" | "+ " | ".join(str(counts.get(tier,0)) for tier in sorted(r["tier_counts"]))+" |")
          print()
          print("**Important:** No automated C conversion or OVAL scanner parity is claimed.")
          print("These are source complexity planning buckets, not proven C-language capabilities.")
          print("Full JSON report is retained as a run artifact.")
          PY
      - name: Upload C research triage evidence
        uses: actions/upload-artifact@v4
        with:
          name: c-six-stig-source-triage
          path: |
            ${{ runner.temp }}/c-source-triage.json
            ${{ runner.temp }}/c-source-ir-validation.json
          if-no-files-found: error
          retention-days: 30
