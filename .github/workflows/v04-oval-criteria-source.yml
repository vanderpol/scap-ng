name: 0.4.0 original OVAL nine Definition Boolean criteria source roundtrip
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v04-oval-criteria-source.yml'
      - 'tools/prove_v04_oval_criteria_source.py'
      - 'tools/promote_v04_oval_criteria_source_proof.py'
      - 'schema/v0.4.0/assessment-language.schema.json'
      - 'schema/v0.4.0/assessment.schema.json'
      - 'schema/v0.4.0/expression.schema.json'
      - 'schema/v0.4.0/capability-mappings/supported/variable.value.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  nine-original-oval-criteria-definitions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: scap-ng
      - uses: actions/checkout@v4
        with:
          repository: OVAL-Community/SCAP-Self-Assertion
          ref: e3538595c5083b9c34d937a81d319234df9bbfaa
          path: original-oval
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OVAL-Community/OVAL
          ref: v5.12.3
          path: oval-language
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0 lxml==6.0.2
      - name: Prove source-backed nested AND OR ONE XOR negate and Definition references
        env:
          PYTHONPATH: scap-ng/tools
        run: |
          test "$(git -C original-oval rev-parse HEAD)" = 'e3538595c5083b9c34d937a81d319234df9bbfaa'
          python scap-ng/tools/prove_v04_oval_criteria_source.py \
            --source original-oval/SCAP_1.4/OVAL_Test_Content/agnostic/oval-def_criteria.xml \
            --schema-root scap-ng/schema/v0.4.0 \
            --xsd-root oval-language/oval-schemas \
            --output work/original-oval-criteria/criteria-nine
      - name: Independently promote cumulative original Definition ledger from 17 to 26
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONPATH: scap-ng/tools
        run: |
          mkdir -p work/previous-ledger
          gh run download 39763855061 --repo "$GH_REPO" \
            --name v04-oval-fixed-unknown-one-definition-one-test-17-of-167 \
            --dir work/previous-ledger
          test -f work/previous-ledger/cumulative-167-definition-readiness.json
          python scap-ng/tools/promote_v04_oval_criteria_source_proof.py \
            --previous-ledger work/previous-ledger/cumulative-167-definition-readiness.json \
            --proof-root work/original-oval-criteria/criteria-nine \
            --output work/original-oval-criteria/cumulative-167-definition-readiness.json
          python - <<'PY'
          import json
          from copy import deepcopy
          from pathlib import Path
          from promote_v04_oval_criteria_source_proof import promote

          next_ledger=json.loads(Path('work/original-oval-criteria/cumulative-167-definition-readiness.json').read_text())
          prior=json.loads(Path('work/previous-ledger/cumulative-167-definition-readiness.json').read_text())
          folder=Path('work/original-oval-criteria/criteria-nine')
          assert len(next_ledger['records']) == 167
          assert next_ledger['current_040_schema_and_original_source_validated'] == 26
          assert next_ledger['current_040_original_xml_roundtrip_exported'] == 26
          assert next_ledger['remaining_v003_compatible_without_current_040_proof'] == 136
          assert next_ledger['original_source_invalid_or_deprecated'] == 5
          assert next_ledger['scanner_result_parity_proven'] == 0
          try:
              promote(next_ledger, folder)
          except ValueError as exc:
              assert 'exact certified 17-of-167' in str(exc)
          else:
              raise AssertionError('accepted duplicate 26/167 promotion')
          corrupt=deepcopy(prior)
          next(r for r in corrupt['records'] if r['definition_id']=='oval:org.mitre.oval.test:def:142')['original_source_file_sha256']='0'*64
          try:
              promote(corrupt, folder)
          except ValueError as exc:
              assert 'unproven original source row' in str(exc)
          else:
              raise AssertionError('accepted falsified original OVAL Definition SHA')
          print('PASS: all nine original OVAL criteria Definitions, two shared source Tests, original XML/0.4 native/XSD/graph; ONE != XOR; 26/167; scanner parity 0')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v04-oval-criteria-nine-definitions-two-tests-26-of-167
          path: work/original-oval-criteria/
          if-no-files-found: ignore
