name: 0.4.0 original Windows 11 Bluetooth applicability current acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v04-published-bluetooth-source.yml'
      - 'tools/prove_v04_current_bluetooth_source.py'
      - 'tools/test_v04_current_source_acceptance.py'
      - 'tools/v04_source_proof_contract.py'
      - 'tools/v04_direct_*.py'
      - 'tools/v04_field_requirement.py'
      - 'tools/generate_capability_schema*.py'
      - 'tests/fixtures/v04-current-source-proofs/**'
      - 'schema/v0.4.0/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-bluetooth-current-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0 lxml==6.0.2
      - name: Prove original applicability, direct Filter, compiled operands and negative mutations
        env:
          PYTHONPATH: tools
        run: python tools/prove_v04_current_bluetooth_source.py --output work/current-bluetooth
      - name: Mandatory source, compiler and deprecated-WMI guards
        env:
          PYTHONPATH: tools
        run: python -m unittest test_v04_current_source_acceptance -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v04-current-bluetooth-original-source-proof
          path: work/current-bluetooth/
          if-no-files-found: error
