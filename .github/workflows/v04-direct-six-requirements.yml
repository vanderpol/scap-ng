name: 0.4.0 direct converter original six-STIG requirements
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/inventory_v04_six_source_requirements.py'
      - 'tools/test_v04_six_source_requirements.py'
      - 'tools/test_v04_direct_scalar_batch.py'
      - 'tools/test_v04_direct_scope.py'
      - 'tests/fixtures/v04-direct-scalars/**'
      - 'tests/fixtures/v04-six-primary-proof-floor.json'
      - 'tools/oval_source_validation.py'
      - 'tools/v04_direct_*.py'
      - 'tools/v04_direct_capabilities.json'
      - 'tools/v04_scalar_source_proof.py'
      - 'tools/v04_expanded_source_proof.py'
      - 'tools/v04_source_package_semantics.py'
      - 'tools/verify_v04_direct_scope.py'
      - 'tests/fixtures/v04-scalar-proof-contracts.json'
      - 'tests/fixtures/v04-direct-six-sources.json'
      - 'schema/v0.4.0/capability-mappings/**'
      - 'third_party/scap-1.4-schemas/oval_5.12.3/**'
      - '.github/workflows/v04-direct-six-requirements.yml'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: scap-ng
      - uses: actions/checkout@v4
        with:
          repository: niwc-atlantic/scap-content-library
          ref: 8c8e5dff860af6b1290ee9273a282db24278f8d5
          path: originals
          persist-credentials: false
          sparse-checkout: |
            Current/U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-signed.zip
            Current/U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-signed.zip
            Current/U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip
            Current/U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip
            Current/U_MS_Windows_Server_DNS_V2R3_STIG_SCAP_1-4_Benchmark-enhancedV8-signed.zip
            Current/U_Apache_Server_2-4_UNIX_Server_V3R2_STIG_SCAP_1-4_Benchmark-enhancedV2-signed.zip
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0 lxml==6.0.2
      - name: Complete requirements, source validity and exact blockers
        env:
          PYTHONPATH: scap-ng/tools
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          test "$(git -C originals rev-parse HEAD)" = 8c8e5dff860af6b1290ee9273a282db24278f8d5
          python -m unittest test_v04_six_source_requirements test_v04_direct_scalar_batch test_v04_direct_scope -v
          python scap-ng/tools/inventory_v04_six_source_requirements.py \
            --inputs originals/Current --output evidence/requirements
          python scap-ng/tools/verify_v04_direct_scope.py \
            --inputs originals/Current --output evidence/primary-acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v04-original-six-source-requirements
          path: evidence/
          if-no-files-found: error
