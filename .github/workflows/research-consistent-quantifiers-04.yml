name: Consistent quantifiers and structural groups (#235)
on:
  push:
    paths:
      - .github/workflows/research-consistent-quantifiers-04.yml
      - tools/research_04_consistent_quantifiers.py
      - tools/test_research_04_consistent_quantifiers.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  six-stig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned research dependencies
        run: python -m pip install 'PyYAML==6.0.3' 'jsonschema==4.25.1'
      - name: Check cardinality and nested group guards
        run: python tools/test_research_04_consistent_quantifiers.py -v
      - name: Download immutable r3 six-STIG YAML baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work
          gh release download v0.4.0-joval-meeting-preview-20261015-r3 \
            --repo vanderpol/scap-ng \
            --pattern scap-ng-v0.4-joval-six-stig-yaml.zip \
            --dir work
      - name: Compare full source-inverse for every automated Assessment
        run: |
          python tools/research_04_consistent_quantifiers.py \
            --archive work/scap-ng-v0.4-joval-six-stig-yaml.zip \
            --base-schema research/assessment-simplification/english-first-04/fixed-require.editor.schema.json \
            --out work/proof
      - name: Reject corpus drift, collisions, or new unsupported Assessments
        run: |
          python - <<'PY'
          import json
          p=json.load(open('work/proof/report.json'))
          c=p['counts']
          assert (c['assessments'],c['tests'])==(872,1375),c
          assert (c['exact_assessments'],c['exact_tests'])==(871,1374),p
          assert len(p['failures'])==1,p['failures']
          assert 'verify-boot-loader' in p['failures'][0]['path'],p['failures']
          assert len(p['collisions'])==0,p['collisions']
          assert c['negative_guards']==871,c
          assert c['scope_replaced_states']>0 and c['scope_replaced_fields']>0,c
          assert c['some_replaced']>0,c
          print('PASS: 871/872 source-exact; consistent quantifiers; no new semantic exceptions')
          PY
      - name: Publish GitHub.com readable report and examples
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,json,os,pathlib,subprocess
          repo='vanderpol/scap-ng'
          head=subprocess.run(['gh','api',f'repos/{repo}/commits/main','--jq','.sha'],
              text=True,capture_output=True,check=True).stdout.strip()
          if head!=os.environ['GITHUB_SHA']:
              print('Main advanced; do not publish stale research')
              raise SystemExit(0)
          folder='research/assessment-simplification/english-first-04/consistent-quantifiers'
          for path in sorted(pathlib.Path('work/proof').glob('*')):
              if path.suffix not in ('.md','.json','.yaml'):continue
              remote=folder+'/'+path.name
              read=subprocess.run(['gh','api',f'repos/{repo}/contents/{remote}',
                  '--jq','.sha'],capture_output=True,text=True)
              if read.returncode not in (0,1):raise RuntimeError('Could not read '+remote)
              payload={'branch':'main',
                       'message':'research(#235): publish source-exact consistent quantifier proof',
                       'content':base64.b64encode(path.read_bytes()).decode('ascii')}
              if read.returncode==0:payload['sha']=read.stdout.strip()
              subprocess.run(['gh','api','--method','PUT',f'repos/{repo}/contents/{remote}',
                               '--input','-'],input=json.dumps(payload),check=True,text=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consistent-quantifiers-six-stig-proof
          path: work/proof/
          if-no-files-found: warn