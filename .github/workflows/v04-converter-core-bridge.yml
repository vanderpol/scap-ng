name: 0.4 shared converter core regression

on:
  push:
    branches: [main]
    paths:
      - 'tools/scap_converter_core.py'
      - 'tools/v04_source_verified_object_presence.py'
      - 'tools/v04_source_verified_multitest_presence.py'
      - 'tools/v04_source_verified_multitest_states.py'
      - 'tools/v04_source_verified_constant_variable_matrix.py'
      - 'tools/test_scap_converter_core.py'
      - 'tools/test_scap_converter_core_object_presence.py'
      - 'tools/test_scap_converter_core_multitest.py'
      - 'tools/test_scap_converter_core_multistate.py'
      - 'tools/test_scap_converter_core_singleton_presence.py'
      - 'tools/test_v04_public_cli_smoke.py'
      - 'tools/test_scap_converter_core_constant_matrix.py'
      - 'tools/test_v04_source_verified_constant_datatypes.py'
      - 'tools/test_scap_converter_core_variable.py'
      - 'tools/test_scap_converter_core_family.py'
      - 'tools/audit_scap_converter_core_coverage.py'
      - 'tools/test_audit_scap_converter_core_coverage.py'
      - 'tools/convert_v04_oval_independent_variable_test.py'
      - 'tools/convert_v04_oval_constant_variable_matrix.py'
      - 'tools/convert_v04_oval_variable_datatype_suite.py'
      - 'tools/convert_v04_oval_family_constant_variable.py'
      - 'tools/export_v04_oval_family_constant_variable.py'
      - 'tools/audit_v04_original_oval_variable_test.py'
      - 'tools/export_v04_oval_independent_variable_test.py'
      - 'tools/oval_semantic_ir.py'
      - 'tools/scap_upconvert_v003/**'
      - 'tools/v04_flat_object_authoring.py'
      - 'tools/v04_field_requirement.py'
      - 'tools/v04_native_bundle_compiler.py'
      - 'tools/import_v04_oval_leaf_pilot.py'
      - 'schema/v0.4.0/**'
      - '.github/workflows/v04-converter-core-bridge.yml'
  workflow_dispatch:

jobs:
  converter-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Checkout immutable original OVAL variable source
        uses: actions/checkout@v4
        with:
          repository: OVAL-Community/SCAP-Self-Assertion
          ref: e3538595c5083b9c34d937a81d319234df9bbfaa
          path: pinned-self-assertion
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact converter regression dependencies
        run: python -m pip install lxml==6.1.1 PyYAML==6.0.3 jsonschema==4.25.1
      - name: Existing shared parser and new 0.4 lowering integration
        run: |
          python tools/test_oval_semantic_core_preservation.py -v
          python tools/test_scap_converter_core.py -v
          test -f "$SCAP_NG_IOS_BGP_SOURCE_XML"
          test -f "$SCAP_NG_IOS_SECTION_SOURCE_XML"
          test -f "$SCAP_NG_ASA_LINE_SOURCE_XML"
          test -f "$SCAP_NG_AIX_FILESET_SOURCE_XML"
          test -f "$SCAP_NG_ASA_VERSION_SOURCE_XML"
          python tools/test_scap_converter_core_object_presence.py -v
          test -f "$SCAP_NG_IOS_GLOBAL_SOURCE_XML"
          python tools/test_scap_converter_core_multitest.py -v
          test -f "$SCAP_NG_IOS_LINE_SOURCE_XML"
          test -f "$SCAP_NG_IOSXE_LINE_SOURCE_XML"
          python tools/test_scap_converter_core_multistate.py -v
          test -f "$SCAP_NG_FILEVAULT_SOURCE_XML"
          test -f "$SCAP_NG_FIRMWAREPASSWORD_SOURCE_XML"
          test -f "$SCAP_NG_PROFILES_SOURCE_XML"
          python tools/test_scap_converter_core_singleton_presence.py -v
          python tools/test_v04_public_cli_smoke.py -v
          test -f "$SCAP_NG_CONSTANT_VARIABLE_SOURCE_XML"
          test -f "$SCAP_NG_CHECK_ENUMERATION_SOURCE_XML"
          python tools/test_scap_converter_core_constant_matrix.py -v
          test -f "$SCAP_NG_BOOLEAN_DATATYPE_SOURCE_XML"
          test -f "$SCAP_NG_STRING_DATATYPE_SOURCE_XML"
          test -f "$SCAP_NG_INT_DATATYPE_SOURCE_XML"
          python tools/test_v04_source_verified_constant_datatypes.py -v
          test -f "$SCAP_NG_VARIABLE_SOURCE_XML"
          python tools/test_scap_converter_core_variable.py -v
          test -f "$SCAP_NG_FAMILY_SOURCE_XML"
          python tools/test_scap_converter_core_family.py -v
          python tools/test_audit_scap_converter_core_coverage.py -v
          python tools/test_import_v04_oval_leaf_pilot.py -v
        env:
          SCAP_NG_VARIABLE_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/agnostic/ind-def_variable_test.xml
          SCAP_NG_CONSTANT_VARIABLE_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/agnostic/oval-def_constant_variable.xml
          SCAP_NG_CHECK_ENUMERATION_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/agnostic/oval_check_enumeration_variable_values.xml
          SCAP_NG_BOOLEAN_DATATYPE_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/agnostic/oval_boolean_datatype.xml
          SCAP_NG_STRING_DATATYPE_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/agnostic/oval_string_datatype.xml
          SCAP_NG_INT_DATATYPE_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/agnostic/oval_int_datatype.xml
          SCAP_NG_FAMILY_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/agnostic/ind-def_family_test.xml
          SCAP_NG_IOS_BGP_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/ios/ios-def_bgpneighbor_test.xml
          SCAP_NG_IOS_SECTION_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/ios/ios-def_section_test.xml
          SCAP_NG_ASA_LINE_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/asa/asa-def_line_test.xml
          SCAP_NG_AIX_FILESET_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/aix/aix-def_fileset_test.xml
          SCAP_NG_ASA_VERSION_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/asa/asa-def_version_test.xml
          SCAP_NG_IOS_GLOBAL_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/ios/ios-def_global_test.xml
          SCAP_NG_IOS_LINE_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/ios/ios-def_line_test.xml
          SCAP_NG_IOSXE_LINE_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/iosxe/iosxe-def_line_test.xml
          SCAP_NG_FILEVAULT_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/macos/macos-def_filevault_test.xml
          SCAP_NG_FIRMWAREPASSWORD_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/macos/macos-def_firmwarepassword_test.xml
          SCAP_NG_PROFILES_SOURCE_XML: pinned-self-assertion/SCAP_1.4/OVAL_Test_Content/macos/macos-def_profiles_test.xml
