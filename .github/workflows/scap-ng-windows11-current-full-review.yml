name: Current Windows 11 full source review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/scap_upconvert_v003/convert_full_review.py
      - tools/scap_upconvert_v003/convert_collection_review.py
      - tools/scap_upconvert_v003/audit_full_review.py
      - tools/scap_upconvert_v003/audit_profile_selection.py
      - tools/scap_upconvert_v003/build_rhel9_review_slice.py
      - tools/scap_upconvert_v003/collection_graph.py
      - tools/scap_upconvert_v003/cleanliness.py
      - tools/scap_ng_roundtrip_v003/native_assessment_to_oval.py
      - tools/check_current_authoring_contract.py
      - tools/test_full_review_contract.py
      - .github/workflows/scap-ng-windows11-current-full-review.yml

permissions:
  contents: write

concurrency:
  group: windows11-current-full-review-main
  cancel-in-progress: true

jobs:
  full-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: scap-ng
      - uses: actions/checkout@v4
        with:
          repository: niwc-atlantic/scap-content-library
          ref: 8c8e5dff860af6b1290ee9273a282db24278f8d5
          path: niwc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3 lxml==6.1.1
      - name: Shared full-review regressions
        run: python scap-ng/tools/test_full_review_contract.py
      - name: Build component-resolved Windows 11 rule splits
        run: |
          python scap-ng/tools/scap14_rule_splitter.py             niwc/Current/U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip             --output-dir work/windows11-split             --schema scap-ng/third_party/scap-1.4-schemas/omni-schema.xsd             --source-revision 8c8e5dff860af6b1290ee9273a282db24278f8d5             --source-repository-path Current/U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip             --benchmark-key windows11             --fail-on-unresolved
      - name: Generate current Windows 11 review
        run: >-
          python scap-ng/tools/scap_upconvert_v003/convert_full_review.py
          --input niwc/Current/U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip
          --sha256 auto
          --benchmark-id windows11-stig-current-full
          --platform-id microsoft.windows-11
          --platform-title "Microsoft Windows 11"
          --split-root work/windows11-split
          --output work/windows11-current-full
      - name: Enforce review accounting and deprecated-test fallback
        run: |
          python - <<'PY'
          import json, yaml
          from pathlib import Path
          root=Path("work/windows11-current-full")
          benchmark=yaml.safe_load((root/"benchmark.yaml").read_text())["benchmark"]
          evidence=json.loads((root/"evidence.json").read_text())
          audit=json.loads((root/"rule-source-audit.json").read_text())
          if len(benchmark["rules"]) != 257:
              raise SystemExit(f"Expected 257 Rules, got {len(benchmark['rules'])}")
          if audit["issues"]:
              raise SystemExit(f"Rule source audit issues: {audit['issues']}")
          fallbacks=[r for r in evidence["rules"] if r.get("manual_fallbacks") or r.get("applicability_manual_fallback")]
          if not fallbacks:
              raise SystemExit("Expected at least one explicit deprecated-test manual fallback")
          blocked=evidence.get("blocked_applicability") or []
          if not blocked:
              raise SystemExit("Expected deprecated applicability to be recorded as blocked/manual")
          for row in fallbacks:
              rid=row["rule_id"]
              rule=yaml.safe_load((root/"rules"/f"{rid}.rule.yaml").read_text())["rule"]
              if "manual" not in rule["assessment_choices"]:
                  raise SystemExit(f"{rid}: manual fallback missing from native Rule")
              if any(a.get("status")=="representation_comparator_equal" and
                     any(x.get("feature")=="deprecated_oval_test" for x in a.get("unsupported",[]))
                     for a in row.get("assessments",[])):
                  raise SystemExit(f"{rid}: deprecated OVAL Test was emitted as automated")
          print(json.dumps({
              "rules":len(benchmark["rules"]),
              "profiles":len(benchmark["profiles"]),
              "manual_fallback_rules":[r["rule_id"] for r in fallbacks],
              "blocked_applicability":len(blocked),
              "source_sha256":evidence["source_sha256"],
          },indent=2))
          PY
      - name: Add reviewer README
        run: |
          cat > work/windows11-current-full/README.md <<'EOF'
          # Windows 11 current full SCAP-NG review

          Generated from the pinned NIWC Windows 11 V2R10 SCAP 1.4 package at
          repository revision `8c8e5dff860af6b1290ee9273a282db24278f8d5`.

          Start with `benchmark.yaml`, then follow a Rule in `rules/` through
          its explicit relative `assessment_choices` path to `assessments/`.
          Conversion/audit evidence is kept in the JSON files at this directory
          root.

          ## Deprecated OVAL handling

          Deprecated OVAL Tests are conversion errors for automated SCAP-NG
          Assessment content. They are not silently translated or reinstated.
          Where the published STIG also supplies a verified manual check, the
          affected Rule is emitted as manual-only for review and the skipped
          automated source is recorded in `evidence.json`.

          The published Windows 11 source includes a deprecated `windows.user_test`
          in one Rule and an associated applicability condition. Those automated
          paths are intentionally skipped; the source manual procedure remains
          available to determine the Rule result/applicability. No round-trip
          equivalence claim is made for the skipped deprecated paths.

          ## Review boundary

          This artifact is intended for native source/design review. Successful
          source comparison, reverse OVAL validation and semantic round-trip
          checks establish conversion/representation evidence for supported
          automated content; they do not by themselves prove target-runtime
          evaluator equivalence.
          EOF
      - name: Upload complete review artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows11-current-full-review
          path: work/windows11-current-full
          if-no-files-found: error
      - name: Publish review tree to main
        working-directory: scap-ng
        run: |
          set -euo pipefail
          dst="research/iterations/003/review/windows11-current-full"
          rm -rf "$dst"
          mkdir -p "$(dirname "$dst")"
          cp -R ../work/windows11-current-full "$dst"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dst"
          if git diff --cached --quiet; then
            echo "Windows 11 current review already matches."
            exit 0
          fi
          git commit -m "Publish current Windows 11 full review benchmark"
          git pull --rebase origin main
          git push
