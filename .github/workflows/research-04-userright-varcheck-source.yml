name: 0.4 original Windows user-right Variable source proof

on:
  push:
    branches: [main]
    paths:
      - tools/research_04_userright_varcheck_source.py
      - .github/workflows/research-04-userright-varcheck-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: scap-ng
      - uses: actions/checkout@v4
        with:
          repository: niwc-atlantic/scap-content-library
          ref: 8c8e5dff860af6b1290ee9273a282db24278f8d5
          path: niwc
          sparse-checkout: |
            Current/U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip
            Current/U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip
          sparse-checkout-cone-mode: false
      - name: Extract authoritative OVAL Object var_check from pinned sources
        run: |
          python scap-ng/tools/research_04_userright_varcheck_source.py \
            --mapping scap-ng/schema/v0.4.0/capability-mappings/supported/windows.userright.json \
            --xsd scap-ng/third_party/scap-1.4-schemas/oval_5.12.3/oval-definitions-schema.xsd \
            --output work/userright-source-varcheck.json \
            niwc/Current/U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip \
            niwc/Current/U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oval-userright-source-varcheck
          path: work/userright-source-varcheck.json
          if-no-files-found: warn
