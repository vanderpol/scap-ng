name: 0.4 original OVAL Variable migration queue
on:
  push:
    branches: [main]
    paths:
      - 'tools/audit_v04_oval_variable_migration_queue.py'
      - '.github/workflows/v04-oval-variable-migration-queue.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-variable-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve pinned original OVAL source-compatible graphs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p work/oval-source
          gh run download 39344457603 --repo "$GH_REPO" \
            --name c-original-oval-compatibility-review-not-native-conversion \
            --dir work/oval-source
          test -f work/oval-source/c-review/manifest.json
          test -f work/oval-source/c-native/conversion-manifest.json
      - name: Audit 68 original OVAL Variable dependency graphs
        run: |
          python tools/audit_v04_oval_variable_migration_queue.py \
            --source-review work/oval-source \
            --report work/results/variable-migration-queue.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('work/results/variable-migration-queue.json').read_text())
          assert len(report['records'])==68
          assert report['counts']['variables']==245
          assert report['counts']['constant_only_definitions']==42
          assert report['counts']['locally_derived_or_mixed_definitions']==26
          assert report['counts']['constant_only_existing_native_mapping_definitions']==40
          assert report['counts']['constant_only_alias_mapped_unvalidated_definitions']==29
          assert report['counts']['constant_only_missing_native_mapping_definitions']==2
          # The 29 constant-only cases are the first queue; mixed/local
          # Variable definitions may also use the same native alias.
          aliases=[r for r in report['records']
                   if r.get('native_source_capability_aliases')]
          first_queue=[r for r in aliases if r['migration_group']=='constant_only']
          assert len(first_queue)==29
          assert all(r['native_source_capability_aliases']=={
              'independent.variable':'variable.value'} for r in aliases)
          assert report['current_040_validated_conversions_from_this_audit']==0
          print('PASS: pinned original OVAL source Variable dependency census')
          PY
      - name: Negative tests reject unknown refs and cycles
        env:
          PYTHONPATH: tools
        run: |
          python - <<'PY'
          import json
          from copy import deepcopy
          from pathlib import Path
          from audit_v04_oval_variable_migration_queue import (
              inspect, references, variable_dependencies, native_identity
          )
          root=Path('work/oval-source')
          index=json.loads((root/'c-review/manifest.json').read_text())
          source=json.loads((root/'c-native/conversion-manifest.json').read_text())
          entries={(r['file'],r['definition_id']):r for r in index['exported_views']}
          blocker=next(r for r in source['unsupported']
                       if r['reason'].startswith('VARIABLE_SOURCE_GRAPH_NEEDS_COMPATIBILITY'))
          path=root/'c-review'/entries[(blocker['file'],blocker['definition_id'])]['review_file']
          base=json.loads(path.read_text())
          inspect(blocker,base)
          broken=deepcopy(base)
          variables=broken['A_source_compatibility_fallback']['variables']
          name=next(iter(variables))
          variables[name.replace('-variable','-altered-variable')]=variables.pop(name)
          try: inspect(blocker,broken)
          except ValueError as err: assert 'Dangling' in str(err),str(err)
          else: raise AssertionError('Source Variable missing reference not rejected')
          broken=deepcopy(base)
          variables=broken['A_source_compatibility_fallback']['variables']
          name=next(iter(variables))
          variables[name]['expression']={'variable':name}
          try: inspect(blocker,broken)
          except ValueError as err: assert 'Cyclic' in str(err),str(err)
          else: raise AssertionError('Source Variable cycle not rejected')
          # Typed/cardinality annotations on a Variable operand do not
          # change its reference identity or make it invisible to closure.
          typed={'select': {'equals': {'variable': 'source-variable',
                                       'datatype': 'string',
                                       'value_match': 'all'}}}
          assert list(references(typed)) == [
              (('select','equals'),'source-variable')
          ]
          assert not list(references({'variable': 99, 'datatype': 'string'}))
          declared={
              'source-variable': {'expression': {'literal': 'original'}},
              'derived-variable': {'expression': {
                  'variable': 'source-variable', 'datatype': 'string',
                  'value_match': 'all'
              }},
          }
          edges,order=variable_dependencies(declared)
          assert edges == {'derived-variable': ['source-variable'],
                           'source-variable': []}
          assert order == ['source-variable','derived-variable']
          declared['source-variable']['expression']={
              'variable': 'derived-variable', 'datatype': 'string',
              'value_match': 'one'
          }
          try: variable_dependencies(declared)
          except ValueError as err: assert 'Cyclic' in str(err),str(err)
          else: raise AssertionError('Annotated Variable cycle not rejected')
          mapping=Path('schema/v0.4.0/capability-mappings/supported')
          available={p.stem for p in mapping.glob('*.json')}
          assert len(available)==100
          assert native_identity('independent.variable',mapping,available)=='variable.value'
          assert native_identity('independent.filehash58',mapping,available) is None
          print('PASS: missing references, cycles and false missing native capability classification rejected')
          PY
      - name: Upload original-OVAL Variable conversion queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v04-original-oval-68-variable-graph-source-audit-not-conversion
          path: work/results/variable-migration-queue.json
          if-no-files-found: ignore
