name: 0.4 schema and converter contract synchronization

on:
  push:
    branches: [main]
    paths:
      - 'schema/v0.4.0/**'
      - 'third_party/scap-1.4-schemas/oval_5.12.3/**'
      - 'tools/generate_capability_schema_v04.py'
      - 'tools/v04_capability_native.py'
      - 'tools/v04_capability_source.py'
      - 'tools/v04_converter_contracts.py'
      - 'tools/test_v04_converter_contracts.py'
      - '.github/workflows/v04-converter-schema-sync.yml'
  pull_request:
    paths:
      - 'schema/v0.4.0/**'
      - 'third_party/scap-1.4-schemas/oval_5.12.3/**'
      - 'tools/generate_capability_schema_v04.py'
      - 'tools/v04_capability_native.py'
      - 'tools/v04_capability_source.py'
      - 'tools/v04_converter_contracts.py'
      - 'tools/test_v04_converter_contracts.py'
      - '.github/workflows/v04-converter-schema-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3 jsonschema==4.25.1 lxml==6.1.1 cryptography
      - name: Regenerate native schema data and check canonical source targets
        run: python tools/v04_converter_contracts.py --output work/v04-converter-contracts.json
      - name: Check refresh behavior and pinned source preservation
        run: python -m unittest -v test_v04_converter_contracts test_v04_direct_cmdlet test_v04_direct_remaining_primitives
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scap-ng-040-converter-contracts
          path: work/v04-converter-contracts.json
          if-no-files-found: error
