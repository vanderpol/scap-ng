name: Validate vendored SCAP 1.4 schemas

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vendor-scap14-schemas.yml"
      - "research/iterations/001/tools/validate_scap14_schema_bundle.py"
      - "third_party/scap-1.4-schemas/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check lxml
      - name: Validate hashes and compile Omni schema
        run: |
          python research/iterations/001/tools/validate_scap14_schema_bundle.py \
            third_party/scap-1.4-schemas
