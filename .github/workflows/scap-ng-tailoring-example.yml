name: Tailoring worked-example contracts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - research/iterations/003/examples/tailoring-all-options/**
      - research/iterations/003/review/rhel9-current-full/**
      - tools/resolve_tailoring_example.py
      - tools/test_tailoring_example.py
      - tools/check_current_authoring_contract.py
      - .github/workflows/scap-ng-tailoring-example.yml

permissions:
  contents: read

jobs:
  policy-example:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python tools/test_tailoring_example.py
      - run: python tools/check_current_authoring_contract.py research/iterations/003/examples/tailoring-all-options
