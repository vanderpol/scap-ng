name: 0.4.0 canonical authoring fast checks

on:
  push:
    branches: [main]
    paths:
      - 'tools/*v04*.py'
      - 'schema/v0.4.0/**'
      - '.github/workflows/v04-canonical-fast.yml'
      - '.github/workflows/v04-canonical-six-stig.yml'
  pull_request:
    paths:
      - 'tools/*v04*.py'
      - 'schema/v0.4.0/**'
      - '.github/workflows/v04-canonical-fast.yml'
      - '.github/workflows/v04-canonical-six-stig.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0 lxml==6.1.1 cryptography
      - name: Test 0.4 authoring, conversion, and source-version guards
        env:
          PYTHONPATH: tools
        run: |
          python tools/test_v04_restore_missing_applicability.py
          python tools/test_v04_all_items_schema.py
          python tools/test_v04_source_schema_registry.py
          python tools/test_v04_authoring_blocker_audit.py
          python tools/test_v04_flat_object_authoring.py
          python tools/test_v04_field_requirement_conversion.py
          python tools/test_v04_canonical_source_ir.py
          python tools/test_audit_v04_review_readiness.py
          python tools/test_v04_a_dataflow_index.py
          python tools/test_v04_canonical_version_preview.py
      - name: Test original-OVAL and structural regression guards
        env:
          PYTHONPATH: tools
        run: |
          python tools/test_guard_v04_filtered_union_migration.py
          python tools/test_migrate_v04_oval_proven_direct_filters.py
          python tools/test_migrate_v04_additional_source_filters.py
          python tools/test_guard_v04_additional_source_filters.py
          python tools/test_audit_v04_filtered_union_oval_provenance.py
          python tools/test_audit_v04_remaining_singletons_oval.py
          python tools/test_audit_v04_authoring_patterns.py
      - name: Test native 0.4 source IR, result plans, and unsigned/signed source package guards
        env:
          PYTHONPATH: tools
        run: |
          command -v openssl
          python tools/test_v04_canonical_result_plan.py
          python tools/test_v04_result_summaries.py
          python tools/test_v04_exception_source_oracle.py
          python tools/test_v04_canonical_requirement_oracle.py
          python tools/test_v04_canonical_unsigned_package.py
          python tools/test_v04_canonical_signed_source_package.py
          python tools/test_v04_native_bundle_compiler.py
          python tools/test_v04_native_bundle_signing.py
      - name: Download three pinned 0.4 source-only integration anchors
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p work/three-anchors
          gh release download v0.4.0-six-stig-canonical-flat-authoring-20261022-restored --pattern 'rhel_9.source-preview.zip' --pattern 'ms_windows_11.source-preview.zip' --pattern 'apache_server_2-4_unix_server.source-preview.zip' --dir work/three-anchors
      - name: Independently verify RHEL 9, Windows 11, and Apache 2.4 source graphs
        env:
          PYTHONPATH: tools
        run: |
          python - <<'PY'
          from pathlib import Path
          from v04_canonical_unsigned_package import verify_package

          root = Path('work/three-anchors')
          anchors = {
              'rhel_9': ('benchmark.rhel_9', 1498, 862,
                         '008c94ae1caa0d91bca064fa98a844e300688a22d7523f926735baa783fa79d3'),
              'ms_windows_11': ('benchmark.ms_windows_11', 1151, 502,
                                '1afb7d593e1c5497c4779d146e3274888bebd578123c7f539d66ac0b8be7eda8'),
              'apache_server_2-4_unix_server': (
                  'benchmark.apache_server_2-4_unix_server', 665, 67,
                  '6fac769fe37ab93f18dcca288820da1e3ae067db0e1ac4d8e32e8506d527e4ee'),
          }
          expected = {f'{name}.source-preview.zip' for name in anchors}
          actual = {p.name for p in root.glob('*.source-preview.zip')}
          if actual != expected:
              raise ValueError(f'three-anchor inventory mismatch: {actual ^ expected}')
          for name, (benchmark_id, documents, links, graph_sha) in anchors.items():
              checked = verify_package((root / (name + '.source-preview.zip')).read_bytes())
              if (checked['benchmark'], checked['documents'],
                      checked['rule_choice_links'], checked['source_graph_sha256']) != (
                      benchmark_id, documents, links, graph_sha):
                  raise ValueError(f'pinned canonical 0.4 source graph changed: {name}')
              if (checked['status'] != 'VALIDATED_UNSIGNED_SOURCE_PACKAGE_NOT_EXECUTABLE'
                      or checked['scanner_evaluated'] or checked['signature_verified']):
                  raise ValueError(f'source package status was misrepresented: {name}')
              print(f'PASS source-only: {name}, {documents} documents, {links} choices')
          PY
      - name: Compile and independently verify three native 0.4 .scapng bundles
        env:
          PYTHONPATH: tools
        run: |
          mkdir -p work/native-three
          for name in rhel_9 ms_windows_11 apache_server_2-4_unix_server; do
            python tools/v04_native_bundle_compiler.py \
              --source-package "work/three-anchors/${name}.source-preview.zip" \
              --output-dir work/native-three \
              --report "work/native-three/${name}-report.json"
          done
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path('work/native-three')
          bundles = list(root.glob('*.scapng'))
          assert len(bundles) == 3, bundles
          for path in bundles:
              result = json.loads((root / (path.stem + '-report.json')).read_text())[path.stem]
              assert result['programs'] > 0 and result['tests'] > 0
              assert result['status'] == 'NATIVE_040_COMPILED_CONTENT_BUNDLE_NOT_SCANNER_TESTED'
              assert result['scanner_evaluated'] is False
              print(f'PASS compiled: {path.name}; {result["programs"]} programs / {result["tests"]} tests')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scap-ng-040-compiled-three-STIG-smoke
          path: |
            work/native-three/*.scapng
            work/native-three/*-report.json
          if-no-files-found: error
