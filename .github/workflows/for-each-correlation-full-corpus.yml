name: Full current SCAP 1.4 scoped-iteration audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/for-each-audit-20261006
    paths:
      - ".github/workflows/for-each-correlation-full-corpus.yml"
      - "tools/audit_for_each_candidates.py"
      - "tools/audit_manual_correlation_candidates.py"
      - "tools/plan_for_each_migration.py"
      - "tools/plan_variable_normalization.py"

concurrency:
  group: for-each-correlation-full-corpus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.sources.outputs.matrix }}
    steps:
      - name: Check out pinned NIWC corpus
        uses: actions/checkout@v4
        with:
          repository: niwc-atlantic/scap-content-library
          ref: 8c8e5dff860af6b1290ee9273a282db24278f8d5
          path: niwc
      - id: sources
        name: Discover current SCAP 1.4 benchmark ZIPs
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          rows=[]
          for p in sorted(Path("niwc/Current").glob("*STIG_SCAP_1-4_Benchmark*-signed.zip")):
              rows.append({"key":p.stem.replace("-signed","")[:90],"source":p.relative_to("niwc").as_posix()})
          print("matrix="+json.dumps({"include":rows},separators=(",",":")))
          PY

  audit:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Check out SCAP-NG research branch
        uses: actions/checkout@v4
      - name: Check out pinned NIWC corpus
        uses: actions/checkout@v4
        with:
          repository: niwc-atlantic/scap-content-library
          ref: 8c8e5dff860af6b1290ee9273a282db24278f8d5
          path: niwc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install lxml
      - name: Split and audit
        shell: bash
        env:
          SOURCE: ${{ matrix.source }}
          KEY: ${{ matrix.key }}
        run: |
          mkdir -p work/audit
          set +e
          python tools/scap14_rule_splitter.py \
            "niwc/$SOURCE" \
            --output-dir work/split \
            --schema third_party/scap-1.4-schemas/omni-schema.xsd \
            --source-revision 8c8e5dff860af6b1290ee9273a282db24278f8d5 \
            --source-repository-path "$SOURCE" \
            --benchmark-key "$KEY" \
            --fail-on-unresolved
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            python - <<'PY'
          import json,os
          from pathlib import Path
          Path("work/audit/report.json").write_text(json.dumps({
            "label":os.environ["KEY"],"source":os.environ["SOURCE"],
            "audit_status":"split_failed"
          },indent=2)+"\n")
          PY
          else
            python tools/audit_for_each_candidates.py work/split --label "$KEY" --output work/audit/report.json
            python tools/audit_manual_correlation_candidates.py "niwc/$SOURCE" --label "$KEY" --output work/audit/manual.json
            python tools/plan_for_each_migration.py work/audit/report.json --manual-audit work/audit/manual.json --output work/audit/plan.json
            python tools/plan_variable_normalization.py work/audit/report.json --output work/audit/variables.json
            python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("work/audit/report.json"); d=json.loads(p.read_text())
          d["source"]=os.environ["SOURCE"]; d["audit_status"]="complete"
          p.write_text(json.dumps(d,indent=2)+"\n")
          PY
          fi
      - name: Upload package audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-corpus-${{ strategy.job-index }}
          path: |
            work/audit/report.json
            work/audit/manual.json
            work/audit/plan.json
            work/audit/variables.json

  aggregate:
    needs: audit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: full-corpus-*
          path: reports
      - name: Aggregate
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          rows=[]; plans=[]; manuals=[]; variable_plans=[]
          for p in Path("reports").rglob("report.json"):
              try: rows.append(json.loads(p.read_text()))
              except Exception: pass
          for p in Path("reports").rglob("plan.json"):
              try: plans.append(json.loads(p.read_text()))
              except Exception: pass
          for p in Path("reports").rglob("manual.json"):
              try: manuals.append(json.loads(p.read_text()))
              except Exception: pass
          for p in Path("reports").rglob("variables.json"):
              try: variable_plans.append(json.loads(p.read_text()))
              except Exception: pass
          complete=[r for r in rows if r.get("audit_status")=="complete"]
          failed=[r for r in rows if r.get("audit_status")!="complete"]
          dispositions=Counter()
          advisories=Counter()
          for plan in plans:
              dispositions.update(plan.get("summary",{}))
              for row in plan.get("oval_candidates",[]):
                  for advisory in row.get("advisories",[]):
                      advisories[advisory.get("code","unknown")]+=1
          variable_shapes=Counter()
          variable_root_operators=Counter()
          variable_usage_by_shape=Counter()
          variable_usage_by_root_operator=Counter()
          projection_usage=Counter()
          for row in complete:
              variable_shapes.update(row.get("unique_variable_shape_counts",{}))
              variable_root_operators.update(row.get("unique_variable_root_operator_counts",{}))
              variable_usage_by_shape.update(row.get("unique_variable_usage_by_shape",{}))
              variable_usage_by_root_operator.update(row.get("unique_variable_usage_by_root_operator",{}))
              projection_usage.update(row.get("unique_pure_projection_usage",{}))
          manual_confidence=Counter()
          for manual in manuals:
              manual_confidence.update(manual.get("confidence_counts",{}))
          variable_normalization=Counter()
          variable_normalization_single_use=Counter()
          variable_automatic_eligibility=Counter()
          for vp in variable_plans:
              variable_normalization.update(vp.get("summary",{}))
              variable_normalization_single_use.update(vp.get("single_use_by_shape",{}))
              variable_automatic_eligibility.update(vp.get("automatic_eligibility_summary",{}))
          agg={
            "source_revision":"8c8e5dff860af6b1290ee9273a282db24278f8d5",
            "packages_discovered":len(rows),
            "packages_complete":len(complete),
            "packages_failed":len(failed),
            "closure_files":sum(r.get("closure_files",0) for r in complete),
            "candidate_closures":sum(r.get("candidate_closures",0) for r in complete),
            "class_counts":dict(sum((Counter(r.get("class_counts",{})) for r in complete),Counter())),
            "migration_dispositions":dict(dispositions),
            "modernization_advisories":dict(advisories),
            "unique_variable_shape_counts_by_benchmark":dict(variable_shapes),
            "unique_variable_root_operator_counts_by_benchmark":dict(variable_root_operators),
            "unique_variable_usage_by_shape_by_benchmark":dict(variable_usage_by_shape),
            "unique_variable_usage_by_root_operator_by_benchmark":dict(variable_usage_by_root_operator),
            "unique_pure_projection_usage_by_benchmark":dict(projection_usage),
            "manual_correlation_candidates":sum(m.get("manual_correlation_candidates",0) for m in manuals),
            "manual_correlation_confidence_counts":dict(manual_confidence),
            "variable_normalization_dispositions":dict(variable_normalization),
            "variable_normalization_single_use_by_shape":dict(variable_normalization_single_use),
            "variable_automatic_eligibility":dict(variable_automatic_eligibility),
            "packages":sorted(rows,key=lambda r:r.get("source","")),
          }
          Path("full-corpus-for-each-audit.json").write_text(json.dumps(agg,indent=2)+"\n")
          print(json.dumps({k:agg[k] for k in ("packages_discovered","packages_complete","packages_failed","closure_files","candidate_closures","class_counts","migration_dispositions","modernization_advisories","unique_variable_shape_counts_by_benchmark","unique_variable_root_operator_counts_by_benchmark","unique_variable_usage_by_shape_by_benchmark","unique_variable_usage_by_root_operator_by_benchmark","unique_pure_projection_usage_by_benchmark","manual_correlation_candidates","manual_correlation_confidence_counts","variable_normalization_dispositions","variable_normalization_single_use_by_shape","variable_automatic_eligibility")},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: full-corpus-for-each-audit-summary
          path: full-corpus-for-each-audit.json
