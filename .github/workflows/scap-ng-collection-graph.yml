name: SCAP-NG Collection graph prototype

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/scap_upconvert_v003/collection_graph.py
      - tools/scap_upconvert_v003/convert_collection_review.py
      - tools/scap_upconvert_v003/build_rhel9_review_slice.py
      - tools/scap_ng_roundtrip_v003/native_assessment_to_oval.py
      - tools/test_named_collection_graph.py
      - tools/test_variable_filter_dependencies.py
      - .github/workflows/scap-ng-collection-graph.yml

permissions:
  contents: read

jobs:
  graph-and-local-cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3 lxml==6.1.1
      - name: Source graph, private Collection and local ZIP CLI regressions
        run: python tools/test_named_collection_graph.py
      - name: Retain original Variable depth and filter/set guards
        run: python tools/test_variable_filter_dependencies.py
