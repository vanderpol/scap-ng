name: Conditional modernization research

on:
  push:
    paths:
      - tools/scap_upconvert_v003/conditional_modernization.py
      - tools/scap_upconvert_v003/test_conditional_modernization.py
      - tools/scap_upconvert_v003/convert_collection_review.py
      - tools/assessment_expression.py
      - schema/v0.3.0/expression.schema.json
      - schema/v0.3.0/expression-result.schema.json
      - research/assessment-simplification/conditional-10/**
      - .github/workflows/conditional-modernization-research.yml
  pull_request:
    paths:
      - tools/scap_upconvert_v003/conditional_modernization.py
      - tools/scap_upconvert_v003/test_conditional_modernization.py
      - tools/scap_upconvert_v003/convert_collection_review.py
      - .github/workflows/conditional-modernization-research.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 lxml==6.1.1 jsonschema==4.25.1
      - name: Pattern matcher tests
        run: PYTHONPATH=tools python tools/scap_upconvert_v003/test_conditional_modernization.py -v
      - name: Existing conditional conformance
        run: |
          PYTHONPATH=tools python tools/test_conditional_conformance.py
          PYTHONPATH=tools python tools/test_conditional_integration.py
      - name: Ensure matcher is not Rule-ID driven
        run: |
          if grep -Eq 'SV-[0-9]+|RHEL|Windows Server|Windows 11' tools/scap_upconvert_v003/conditional_modernization.py; then
            echo "conditional modernizer contains product/Rule-specific matching"
            exit 1
          fi

  production:
    needs: focused
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: RHEL 9 SV-258004
            artifact: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-signed.zip
            rule: SV-258004
            expect_rewrite: "true"
          - label: Windows Server 2025 SV-278001
            artifact: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip
            rule: SV-278001
            expect_rewrite: "true"
          - label: RHEL 9 SV-257804 alternative paths
            artifact: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-signed.zip
            rule: SV-257804
            expect_rewrite: "false"
          - label: Windows Server 2025 SV-278004 paired role guards
            artifact: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip
            rule: SV-278004
            expect_rewrite: "true"
          - label: Windows Server 2025 SV-278187 paired domain guards
            artifact: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip
            rule: SV-278187
            expect_rewrite: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 lxml==6.1.1 jsonschema==4.25.1
      - name: Download pinned NIWC production package
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/niwc-atlantic/scap-content-library/8c8e5dff860af6b1290ee9273a282db24278f8d5/Current/$ARTIFACT" \
            -o source.zip
      - name: Convert with conditional modernization
        env:
          RULE: ${{ matrix.rule }}
          EXPECT_REWRITE: ${{ matrix.expect_rewrite }}
        run: |
          SHA256="$(sha256sum source.zip | awk '{print $1}')"
          python tools/scap_upconvert_v003/convert_collection_review.py \
            --input source.zip \
            --sha256 "$SHA256" \
            --output out \
            --rule "$RULE" \
            --target-ng-version 0.3.0 \
            --modernize-conditionals-v1
      - name: Assert pattern rewrite and 0.3 schema validity
        env:
          RULE: ${{ matrix.rule }}
          EXPECT_REWRITE: ${{ matrix.expect_rewrite }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import yaml

          evidence=json.loads(Path("out/evidence.json").read_text())
          rows=[
              a
              for rule in evidence["rules"]
              for a in rule.get("assessments",[])
              if a.get("conditional_modernization") is not None
          ]
          assert rows, evidence
          applied=[r for r in rows if r["conditional_modernization"].get("rewrite_performed")]
          expect=os.environ["EXPECT_REWRITE"] == "true"
          assert bool(applied) is expect, rows
          for row in rows:
              report=row["conditional_modernization"]
              assert report["pattern_based"] is True
              assert report["rule_id_allowlist"] is False
              assert report["semantic_class"] == "intent_preserving_not_six_state_parity"
          if applied:
              assert all(r["conditional_modernization"]["applied"] for r in applied)
          else:
              assert any(
                  r["conditional_modernization"].get("review_required")
                  for r in rows
              ), rows

          docs=[]
          for path in Path("out/assessments/automated").glob("*.yaml"):
              doc=yaml.safe_load(path.read_text())
              docs.append(doc)
          assert docs

          def has_if(node):
              if isinstance(node,dict):
                  if set(node)=={"if","then","else"}:
                      return True
                  return any(has_if(v) for v in node.values())
              if isinstance(node,list):
                  return any(has_if(v) for v in node)
              return False

          has_conditional=any(has_if(d["assessment"]["evaluate"]) for d in docs)
          assert has_conditional is expect, docs
          print(json.dumps({
              "rule":os.environ["RULE"],
              "expected_rewrite":expect,
              "rewrites":sum(len(r["conditional_modernization"]["applied"]) for r in applied),
          },indent=2))
          PY
          python tools/validate_native_json_schemas.py out/assessments/automated \
            --schema-dir schema/v0.3.0 \
            --report /tmp/conditional-schema.json
      - uses: actions/upload-artifact@v4
        with:
          name: conditional-modernization-${{ matrix.rule }}
          path: |
            out
            /tmp/conditional-schema.json
