name: Conditional modernization research

on:
  push:
    paths:
      - tools/scap_upconvert_v003/conditional_modernization.py
      - tools/scap_upconvert_v003/test_conditional_modernization.py
      - tools/scap_upconvert_v003/convert_collection_review.py
      - tools/scap_upconvert_v003/test_source_component_resolution.py
      - tools/assessment_expression.py
      - schema/v0.3.0/expression.schema.json
      - schema/v0.3.0/expression-result.schema.json
      - research/assessment-simplification/conditional-10/**
      - .github/workflows/conditional-modernization-research.yml
  pull_request:
    paths:
      - tools/scap_upconvert_v003/conditional_modernization.py
      - tools/scap_upconvert_v003/test_conditional_modernization.py
      - tools/scap_upconvert_v003/convert_collection_review.py
      - .github/workflows/conditional-modernization-research.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-preflight:
    name: Source package preflight (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows 11
            artifact: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip
          - label: Oracle Linux 9
            artifact: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-signed.zip
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned NIWC production package
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/niwc-atlantic/scap-content-library/8c8e5dff860af6b1290ee9273a282db24278f8d5/Current/$ARTIFACT" \
            -o source.zip
      - name: Inspect component-local identities and candidate Rules
        run: |
          python - <<'PY'
          import collections, hashlib, json, re, zipfile
          import xml.etree.ElementTree as ET

          def local(tag):
              return tag.rsplit("}",1)[-1]

          roots=[]
          with zipfile.ZipFile("source.zip") as z:
              for name in sorted(z.namelist()):
                  if name.lower().endswith(".xml"):
                      roots.append((name,ET.fromstring(z.read(name))))

          oval_roots=[]
          benchmarks=[]
          def walk(node,path):
              here=path+[{"tag":local(node.tag),"id":node.get("id")}]
              if local(node.tag)=="oval_definitions":
                  oval_roots.append((here,node))
              if local(node.tag)=="Benchmark":
                  benchmarks.append(node)
              for child in node:
                  walk(child,here)
          for name,root in roots:
              walk(root,[{"tag":"zip-entry","id":name}])

          global_ids=collections.defaultdict(list)
          for idx,(path,oval) in enumerate(oval_roots):
              context=" / ".join(
                  part["tag"]+(f"[{part['id']}]" if part["id"] else "")
                  for part in path[:-1]
              )
              for section in oval:
                  if local(section.tag) not in {"definitions","tests","objects","states","variables"}:
                      continue
                  for node in section:
                      ident=node.get("id")
                      if not ident:
                          continue
                      raw=ET.tostring(node,encoding="utf-8")
                      global_ids[ident].append({
                          "oval_root":idx,
                          "context":context,
                          "kind":local(node.tag),
                          "sha256":hashlib.sha256(raw).hexdigest(),
                      })

          conflicts={
              ident:rows for ident,rows in global_ids.items()
              if len({row["sha256"] for row in rows})>1
          }
          print("OVAL roots:",len(oval_roots))
          print("Conflicting repeated OVAL identities:",len(conflicts))
          for ident,rows in sorted(conflicts.items())[:30]:
              print(json.dumps({"identity":ident,"occurrences":rows},indent=2))

          candidates=[]
          for benchmark in benchmarks:
              for rule in benchmark.iter():
                  if local(rule.tag)!="Rule":
                      continue
                  rid=rule.get("id","")
                  title=""
                  for child in rule:
                      if local(child.tag)=="title":
                          title=" ".join("".join(child.itertext()).split())
                          break
                  body=" ".join("".join(rule.itertext()).split())
                  if (
                      rid in {"SV-253260","SV-253340","SV-253341","SV-253342","SV-253491","SV-253494","SV-271718"}
                      or re.search(r"kerberos|KerberosAuthentication",body,re.I)
                  ):
                      refs=[]
                      for node in rule.iter():
                          if local(node.tag)=="check-content-ref":
                              refs.append({"href":node.get("href"),"name":node.get("name")})
                      candidates.append({"id":rid,"title":title,"refs":refs})
          print("Candidate Rules:")
          print(json.dumps(candidates,indent=2))
          PY

  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 lxml==6.1.1 jsonschema==4.25.1
      - name: Pattern matcher tests
        run: PYTHONPATH=tools python tools/scap_upconvert_v003/test_conditional_modernization.py -v
      - name: Component-scoped OVAL resolution regression
        run: PYTHONPATH=tools python tools/scap_upconvert_v003/test_source_component_resolution.py -v
      - name: Existing conditional conformance
        run: |
          PYTHONPATH=tools python tools/test_conditional_conformance.py
          PYTHONPATH=tools python tools/test_conditional_integration.py
      - name: Ensure matcher is not Rule-ID driven
        run: |
          if grep -Eq 'SV-[0-9]+|RHEL|Windows Server|Windows 11' tools/scap_upconvert_v003/conditional_modernization.py; then
            echo "conditional modernizer contains product/Rule-specific matching"
            exit 1
          fi

  production:
    needs: focused
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: RHEL 9 SV-258004
            artifact: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-signed.zip
            rule: SV-258004
            expect_rewrite: "true"
            expect_schema_valid: "true"
          - label: Oracle Linux 9 SV-271718 KerberosAuthentication conditional
            artifact: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-signed.zip
            rule: SV-271718
            expect_rewrite: "either"
            expect_schema_valid: "either"
          - label: Windows 11 SV-253260 BitLocker conditional
            artifact: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip
            rule: SV-253260
            expect_rewrite: "either"
            expect_schema_valid: "either"
          - label: Windows 11 SV-253340 event log path conditional
            artifact: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip
            rule: SV-253340
            expect_rewrite: "either"
            expect_schema_valid: "either"
          - label: Windows 11 SV-253341 event log path conditional
            artifact: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip
            rule: SV-253341
            expect_rewrite: "either"
            expect_schema_valid: "either"
          - label: Windows 11 SV-253342 event log path conditional
            artifact: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip
            rule: SV-253342
            expect_rewrite: "either"
            expect_schema_valid: "either"
          - label: Windows 11 SV-253491 domain membership conditional
            artifact: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip
            rule: SV-253491
            expect_rewrite: "either"
            expect_schema_valid: "either"
          - label: Windows 11 SV-253494 domain membership conditional
            artifact: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip
            rule: SV-253494
            expect_rewrite: "either"
            expect_schema_valid: "either"
          - label: Windows Server DNS SV-259341 forwarder conditional
            artifact: U_MS_Windows_Server_DNS_V2R3_STIG_SCAP_1-4_Benchmark-enhancedV8-signed.zip
            rule: SV-259341
            expect_rewrite: "either"
            expect_schema_valid: "either"
          - label: Windows Server 2025 SV-278001
            artifact: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip
            rule: SV-278001
            expect_rewrite: "true"
            expect_schema_valid: "true"
          - label: RHEL 9 SV-257804 alternative paths
            artifact: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-signed.zip
            rule: SV-257804
            expect_rewrite: "false"
            expect_schema_valid: "true"
          - label: Windows Server 2025 SV-278004 paired role guards
            artifact: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip
            rule: SV-278004
            expect_rewrite: "true"
            expect_schema_valid: "true"
          - label: Windows Server 2025 SV-278187 paired domain guards
            artifact: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip
            rule: SV-278187
            expect_rewrite: "true"
            expect_schema_valid: "true"
          - label: Windows Server 2025 SV-278005 paired role guards
            artifact: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip
            rule: SV-278005
            expect_rewrite: "true"
            expect_schema_valid: "true"
          - label: Windows Server 2025 SV-278043 event log path conditional
            artifact: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip
            rule: SV-278043
            expect_rewrite: "true"
            expect_schema_valid: "false"
          - label: Windows Server 2025 SV-278044 event log path conditional
            artifact: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip
            rule: SV-278044
            expect_rewrite: "true"
            expect_schema_valid: "false"
          - label: Windows Server 2025 SV-278045 event log path conditional
            artifact: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip
            rule: SV-278045
            expect_rewrite: "true"
            expect_schema_valid: "false"
          - label: Windows Server 2025 SV-278184 paired domain guards
            artifact: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip
            rule: SV-278184
            expect_rewrite: "false"
            expect_schema_valid: "true"
          - label: Windows Server 2025 SV-278185 paired domain guards
            artifact: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip
            rule: SV-278185
            expect_rewrite: "false"
            expect_schema_valid: "true"
          - label: Windows Server 2025 SV-278188 paired domain guards
            artifact: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip
            rule: SV-278188
            expect_rewrite: "true"
            expect_schema_valid: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 lxml==6.1.1 jsonschema==4.25.1
      - name: Download pinned NIWC production package
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/niwc-atlantic/scap-content-library/8c8e5dff860af6b1290ee9273a282db24278f8d5/Current/$ARTIFACT" \
            -o source.zip
      - name: Convert with conditional modernization
        env:
          RULE: ${{ matrix.rule }}
          EXPECT_REWRITE: ${{ matrix.expect_rewrite }}
        run: |
          SHA256="$(sha256sum source.zip | awk '{print $1}')"
          python tools/scap_upconvert_v003/convert_collection_review.py \
            --input source.zip \
            --sha256 "$SHA256" \
            --output out \
            --rule "$RULE" \
            --target-ng-version 0.3.0 \
            --modernize-conditionals-v1
      - name: Assert pattern rewrite and 0.3 schema validity
        env:
          RULE: ${{ matrix.rule }}
          EXPECT_REWRITE: ${{ matrix.expect_rewrite }}
          EXPECT_SCHEMA_VALID: ${{ matrix.expect_schema_valid }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import yaml

          evidence=json.loads(Path("out/evidence.json").read_text())
          rows=[
              a
              for rule in evidence["rules"]
              for a in rule.get("assessments",[])
              if a.get("conditional_modernization") is not None
          ]
          assert rows, evidence
          applied=[r for r in rows if r["conditional_modernization"].get("rewrite_performed")]
          expect_mode=os.environ["EXPECT_REWRITE"]
          expect=(expect_mode == "true")
          if expect_mode != "either":
              assert bool(applied) is expect, rows
          for row in rows:
              report=row["conditional_modernization"]
              assert report["pattern_based"] is True
              assert report["rule_id_allowlist"] is False
              assert report["semantic_class"] == "intent_preserving_not_six_state_parity"
          if applied:
              assert all(r["conditional_modernization"]["applied"] for r in applied)
          else:
              assert any(
                  r["conditional_modernization"].get("review_required")
                  for r in rows
              ), rows

          docs=[]
          for path in Path("out/assessments/automated").glob("*.yaml"):
              doc=yaml.safe_load(path.read_text())
              docs.append(doc)
          assert docs

          def has_if(node):
              if isinstance(node,dict):
                  if set(node)=={"if","then","else"}:
                      return True
                  return any(has_if(v) for v in node.values())
              if isinstance(node,list):
                  return any(has_if(v) for v in node)
              return False

          has_conditional=any(has_if(d["assessment"]["evaluate"]) for d in docs)
          if expect_mode != "either":
              assert has_conditional is expect, docs
          print(json.dumps({
              "rule":os.environ["RULE"],
              "expected_rewrite":expect_mode,
              "rewrites":sum(len(r["conditional_modernization"]["applied"]) for r in applied),
          },indent=2))
          PY
          set +e
          python tools/validate_native_json_schemas.py out/assessments/automated \
            --schema-dir schema/v0.3.0 \
            --report /tmp/conditional-schema.json
          RC=$?
          set -e
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads(Path("/tmp/conditional-schema.json").read_text())
          expect_mode=os.environ["EXPECT_SCHEMA_VALID"]
          expect=(expect_mode == "true")
          valid=(report.get("invalid",0)==0)
          if expect_mode != "either":
              assert valid is expect, report
          if expect_mode == "false":
              messages=[
                  err.get("message","")
                  for row in report.get("results",[])
                  for err in row.get("errors",[])
              ]
              # Known independent conversion gap: these branch fixtures still
              # carry legacy Windows registry vocabulary because that capability
              # is not yet post-alignment-ready in 0.3. The conditional itself
              # must not be the schema failure.
              assert messages, report
              assert any(
                  ("operation': 'equals" in msg)
                  or ("operation': 'pattern match" in msg)
                  or ("check_existence" in str(report))
                  for msg in messages
              ), report
              assert not any(
                  ("if" in msg and "then" in msg and "else" in msg)
                  for msg in messages
              ), report
          PY
          if [ "$EXPECT_SCHEMA_VALID" = "true" ] && [ "$RC" -ne 0 ]; then
            cat /tmp/conditional-schema.json
            exit "$RC"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conditional-modernization-${{ matrix.rule }}
          path: |
            out
            /tmp/conditional-schema.json


  aggregate-stats:
    name: Aggregate conditional modernization stats
    needs: production
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: conditional-modernization-*
          path: reports
      - name: Aggregate modernization statistics
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          paths=sorted(Path("reports").rglob("modernization-stats.json"))
          totals=Counter()
          patterns=Counter()
          reasons=Counter()
          rows=[]
          for path in paths:
              doc=json.loads(path.read_text())
              stats=doc.get("conditional") or {}
              rows.append({
                  "artifact_path":str(path),
                  "stats":stats,
              })
              for key in (
                  "assessments_examined",
                  "assessments_rewritten",
                  "expression_nodes_examined",
                  "branch_like_nodes_examined",
                  "rewrite_candidates_proven",
                  "rewrites_applied",
                  "review_required_nodes",
              ):
                  totals[key]+=int(stats.get(key,0) or 0)
              patterns.update(stats.get("applied_pattern_counts") or {})
              reasons.update(stats.get("review_reason_counts") or {})

          branch=totals["branch_like_nodes_examined"]
          examined=totals["assessments_examined"]
          out={
              "format":"scap-ng-conditional-modernization-matrix-stats-0.1",
              "artifacts_examined":len(paths),
              "summary":{
                  **dict(totals),
                  "applied_pattern_counts":dict(patterns),
                  "review_reason_counts":dict(reasons),
                  "rewrite_rate_pct_of_branch_like":(
                      round(100*totals["rewrites_applied"]/branch,2) if branch else 0.0
                  ),
                  "assessment_rewrite_rate_pct":(
                      round(100*totals["assessments_rewritten"]/examined,2) if examined else 0.0
                  ),
              },
              "runs":rows,
          }
          Path("conditional-modernization-matrix-stats.json").write_text(
              json.dumps(out,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(out["summary"],indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: conditional-modernization-matrix-stats
          path: conditional-modernization-matrix-stats.json
