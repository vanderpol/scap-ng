name: Verify manual paste of Discussion 213 (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read
  discussions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check opening-post parity and preserve vote evidence
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const source=fs.readFileSync('board/discussions/ASSESSMENT-VOCABULARY-ABCD-SHARED.md','utf8');
            const marker='scap-ng-discussion-id: ASSESSMENT-VOCABULARY-ABCD-SHARED-20261009';
            const result=await github.graphql('query($owner:String!,$name:String!){repository(owner:$owner,name:$name){discussion(number:213){url body number comments(first:100){totalCount pageInfo{hasNextPage} nodes{body reactions(first:1){totalCount} replies(first:1){totalCount}}}}}}',{owner:context.repo.owner,name:context.repo.repo});
            const d=result.repository.discussion;
            if(!d||!d.body.includes(marker)||!source.includes(marker))throw Error('Unexpected Discussion #213 identity');
            if(d.comments.pageInfo.hasNextPage||d.comments.nodes.length!==d.comments.totalCount)throw Error('Cannot assess all comments');
            for(const key of ['A','B','C','D'])if(d.comments.nodes.filter(x=>x.body.includes('scap-ng-canonical-vote: '+key+'-20261009')).length!==1)throw Error('Missing/duplicate voting comment '+key);
            if(d.body===source){
              core.info('VERIFIED_DISCUSSION_213_MATCHES_SOURCE '+d.url);
            }else{
              core.warning('Discussion #213 is not yet updated. Copy the complete source from https://github.com/vanderpol/scap-ng/issues/220 into the opening-post Edit control. This workflow is READ ONLY; no vote comments or existing engagement are changed.');
            }
            core.info('VOTE_COMMENTS_PRESERVED '+d.comments.totalCount);
            core.info('COMMENT_REACTIONS '+d.comments.nodes.reduce((n,c)=>n+c.reactions.totalCount,0));
            core.info('REPLIES '+d.comments.nodes.reduce((n,c)=>n+c.replies.totalCount,0));
