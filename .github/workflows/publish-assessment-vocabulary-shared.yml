name: Audit canonical Discussion 213 terminology (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read
  discussions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check opening-post parity and preserve vote evidence
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const source=fs.readFileSync('board/discussions/ASSESSMENT-VOCABULARY-ABCD-SHARED.md','utf8').replace(/\r\n/g,'\n');
            const marker='scap-ng-discussion-id: ASSESSMENT-VOCABULARY-ABCD-SHARED-20261009';
            const result=await github.graphql('query($owner:String!,$name:String!){repository(owner:$owner,name:$name){discussion(number:213){url body number comments(first:100){totalCount pageInfo{hasNextPage} nodes{body reactions(first:1){totalCount} replies(first:1){totalCount}}}}}}',{owner:context.repo.owner,name:context.repo.repo});
            const d=result.repository.discussion;
            if(!d||!d.body.includes(marker)||!source.includes(marker))throw Error('Unexpected Discussion #213 identity');
            if(d.comments.pageInfo.hasNextPage||d.comments.nodes.length!==d.comments.totalCount)throw Error('Cannot assess all comments');
            for(const key of ['A','B','C','D'])if(d.comments.nodes.filter(x=>x.body.includes('scap-ng-canonical-vote: '+key+'-20261009')).length!==1)throw Error('Missing/duplicate voting comment '+key);
            if(d.body.replace(/\r\n/g,'\n')===source){
              core.info('VERIFIED_DISCUSSION_213_MATCHES_SOURCE '+d.url);
            }else{
              core.warning('Discussion #213 differs from repository reference text. Review differences deliberately; this audit never edits posts, replies or reactions.');
            }
            core.info('VOTE_COMMENTS_PRESERVED '+d.comments.totalCount);
            core.info('COMMENT_REACTIONS '+d.comments.nodes.reduce((n,c)=>n+c.reactions.totalCount,0));
            const post=d.body.replace(/\r\n/g,'\n');
            const cStart=post.indexOf('## C — Inspection-oriented');
            const next=post.indexOf('\n## ',cStart+4);
            if(cStart<0)throw Error('Missing Option C');
            const cText=post.slice(cStart,next>=0?next:undefined);
            core.info('DISCUSSION_213_OPTION_C_SECTION_START '+JSON.stringify(cText.slice(0,2200)));
            const code=cText.match(/```(?:yaml)?[^\n]*\n([\s\S]*?)```/);
            if(!code)throw Error('No Option C fenced YAML');
            const yaml=code[1];
            const columnChecks={
              item_match: /\n    items:\n      existence: one_or_more\n      match: all(?:\n|$)/.test(yaml),
              field_match: /\n        field_values:\n          existence: one_or_more\n          match: one_or_more(?:\n|$)/.test(yaml),
              no_satisfy_token: !/\bsatisfy\s*:/.test(yaml),
              b_named_checks: /## B — Ansible-inspired/.test(post) && /checks:\n  home-mounted-nosuid-option-check:/.test(post),
              b_explicit_evaluate: /evaluate:\n  any:\n    - all:/.test(post),
              shared_acquisition_preserved: /## Named shared acquisition/.test(post),
            };
            core.info('DISCUSSION_213_C_YAML_BEGIN\n'+yaml+'\nDISCUSSION_213_C_YAML_END');
            core.info('DISCUSSION_213_INSPECTION_AUDIT '+JSON.stringify(columnChecks));
            const glossary=post.split('\n').filter(x=>x.startsWith('| ') && (x.includes('Require Items')||x.includes('Require field instances')||x.includes('Choose / combine technical')));
            core.info('DISCUSSION_213_VOCABULARY_TABLE '+JSON.stringify(glossary));
            const stale=post.split('\n').filter(x=>/items\.satisfy|field_values\.satisfy/i.test(x));
            core.info('DISCUSSION_213_REMAINING_SATISFY_REFERENCES '+JSON.stringify(stale));
            if(!columnChecks.item_match||!columnChecks.field_match||!columnChecks.no_satisfy_token)
              core.warning('Option C changed incompletely: inspect item and field-value match keys');
            if(stale.length)core.warning('The prose or table still refers to satisfy; consider consistent documentation update');
            core.info('REPLIES '+d.comments.nodes.reduce((n,c)=>n+c.replies.totalCount,0));
