name: 0.4.0 real source-only CMS trust verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v04-source-cms-proof.yml'
      - 'tools/v04_canonical_signed_source_package.py'
      - 'tools/test_v04_canonical_signed_source_package.py'
      - 'tools/verify_v04_signed_source_corpus.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-ephemeral-source-signer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-only verification dependencies
        run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0 cryptography
      - name: Check real detached-CMS trust and tamper fixture tests
        env:
          PYTHONPATH: tools
        run: |
          command -v openssl
          python tools/test_v04_canonical_signed_source_package.py -v
      - name: Obtain immutable canonical six-STIG source-only packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p work/six-sources
          gh release download v0.4.0-six-stig-canonical-flat-authoring-20261021 \
            --pattern '*.source-preview.zip' --dir work/six-sources
          test "$(find work/six-sources -name '*.source-preview.zip' | wc -l)" = 6
      - name: Sign and independently verify real Linux/Windows source-only packages
        env:
          PYTHONPATH: tools
        run: |
          python tools/verify_v04_signed_source_corpus.py \
            --source-package-dir work/six-sources \
            --report work/v04-cms-real-source-proof.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('work/v04-cms-real-source-proof.json').read_text())
          assert report['status']=='REAL_040_SOURCE_ONLY_CMS_TEST_TRUST_PASS_NOT_EXECUTABLE'
          assert report['original_six_packages']==6
          assert report['real_signed_source_packages_verified']==2
          assert report['publisher_trust_proven'] is False
          assert report['private_keys_or_signed_test_packages_published'] is False
          assert report['executable_compiler_complete'] is False
          assert report['scanner_semantics_verified'] is False
          assert {r['platform'] for r in report['cases']}=={'rhel_9','ms_windows_11'}
          print('PASS: two authentic 0.4 source packages, ephemeral trust, no executable claim')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v04-real-six-source-cms-two-platform-ephemeral-trust-proof
          path: work/v04-cms-real-source-proof.json
          if-no-files-found: error
