name: Audit complete upstream OVAL 5.12.3 XSD semantics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-upstream-oval-xsd-defaults.yml"
      - "tools/scap_ng_roundtrip_v003/audit_oval_xsd_defaults.py"
      - "tools/scap_ng_roundtrip_v003/xsd_effective_defaults.py"
      - "tools/scap_ng_roundtrip_v003/verify_ir_defaults_against_xsd.py"
      - "tools/oval_semantic_ir.py"
      - "tools/scap_ng_roundtrip_v003/test_oval_xsd_audit.py"

jobs:
  xsd-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: scap-ng
      - uses: actions/checkout@v4
        with:
          repository: OVAL-Community/OVAL
          ref: v5.12.3
          path: oval-language
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parsing dependency
        run: python -m pip install lxml
      - name: Verify audit reference-resolution logic on synthetic schemas
        run: python scap-ng/tools/scap_ng_roundtrip_v003/test_oval_xsd_audit.py
      - name: Verify importer effective-attribute provenance
        run: python scap-ng/tools/test_oval_effective_attributes.py
      - name: Audit XSD defaults inheritance documentation and Schematron
        run: |
          python scap-ng/tools/scap_ng_roundtrip_v003/audit_oval_xsd_defaults.py \
            --schemas oval-language/oval-schemas \
            --out work/oval-xsd-5.12.3-audit
          cat work/oval-xsd-5.12.3-audit/summary.json
      - name: Assert importer defaults match seven generic XSD base types
        run: |
          python scap-ng/tools/scap_ng_roundtrip_v003/verify_ir_defaults_against_xsd.py \
            --schemas oval-language/oval-schemas \
            --importer scap-ng/tools/oval_semantic_ir.py \
            --output work/oval-xsd-5.12.3-audit/importer-default-crosswalk.json
      - name: Upload full XSD audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-oval-5.12.3-xsd-audit
          path: work/oval-xsd-5.12.3-audit/
