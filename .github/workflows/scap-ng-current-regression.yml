name: Current-design regression contracts
on:
  pull_request:
    paths:
      - tools/**
      - schema/v0.1.0/**
      - schema/v0.2.0/**
      - tests/conditional-0.2.0/**
      - tests/reported-elements-0.2.0/**
      - tests/assessment-results-0.2.0/**
      - tests/collected-items-0.2.0/**
      - .github/workflows/scap-ng-current-regression.yml
  push:
    branches: [main]
    paths:
      - tools/scap_upconvert_v003/**
      - tools/scap_ng_roundtrip_v003/**
      - tools/test_*.py
      - tools/conditional_conformance.py
      - tools/assessment_expression.py
      - tools/assessment_results_v02.py
      - tools/reported_elements.py
      - tests/conditional-0.2.0/**
      - tests/reported-elements-0.2.0/**
      - tests/assessment-results-0.2.0/**
      - tools/generate_capability_schema.py
      - tools/validate_generated_capability_semantics.py
      - tools/validate_native_package_graph.py
      - schema/v0.1.0/**
      - schema/v0.2.0/**
      - tests/collected-items-0.2.0/**
      - tools/collected_item_contract_v02.py
      - tools/scap_ng_repo_normalizer.py
      - tools/scap_ng_content_compiler.py
      - tools/check_current_authoring_contract.py
      - tools/resolve_tailoring_example.py
      - .github/workflows/scap-ng-current-regression.yml
  workflow_dispatch:
concurrency:
  group: current-design-regression-contracts
  cancel-in-progress: true

defaults:
  run:
    shell: bash
env:
  PYTHONPATH: tools
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3 lxml==6.1.1 cryptography jsonschema
      - name: Current source graph and actual corpus CLI
        run: |
          python tools/test_named_collection_graph.py
          python tools/scap_upconvert_v003/test_collection_capabilities.py
          python tools/scap_upconvert_v003/test_manual_response_contract.py
          python tools/scap_upconvert_v003/test_native_capability_mapping.py
          python tools/scap_upconvert_v003/test_assessment_oval_vocabulary.py
          python tools/scap_upconvert_v003/test_assessment_test_syntax.py
          python tools/scap_upconvert_v003/test_profile_selection_audit.py
          python tools/test_current_corpus_cli.py
          python tools/test_current_validation_names.py
          python tools/test_scap14_splitter_extended_component.py
          python tools/test_benchmark_result_instances.py
          python tools/test_project_results_jsonl.py
          python tools/test_result_messages.py
          python tools/test_result_schema_scope.py
          python tools/test_schema_issue_regressions.py
          python tools/test_conditional_conformance.py
          python tools/test_conditional_integration.py
          python tools/test_reported_elements.py
          python tools/test_assessment_results_v02.py
          python tools/assessment_results_v02.py --assessments tests/assessment-results-0.2.0/content --result-set tests/assessment-results-0.2.0/expected-results/conditional-ownership.result-set.json
          python tools/check_current_authoring_contract.py tests/assessment-results-0.2.0/content
          python tools/conditional_conformance.py --report work/conditional-results.json
          python tools/check_current_authoring_contract.py tests/conditional-0.2.0/content
          python tools/test_collected_item_contract_v02.py
          python tools/test_unknown_test_roundtrip.py
          python tools/test_assessment_optional_node_families.py
          python tools/test_generate_capability_schema.py
          python tools/test_generate_file_hash_capability_schema.py
          python tools/test_generate_windows_file_capability_schema.py
          python tools/test_generate_windows_registry_capability_schema.py
          python tools/test_generate_variable_value_capability_schema.py
          python tools/test_generate_windows_wmi_query_capability_schema.py
          python tools/test_generate_windows_cmdlet_capability_schema.py
          python tools/test_generate_windows_fileeffectiverights53_capability_schema.py
          python tools/test_generate_windows_ntuser_rights_capabilities.py
          python tools/test_generate_windows_wuaupdatesearcher_capability.py
          python tools/test_validate_generated_capability_semantics.py
          python tools/test_generate_textfilecontent54_capability_schema.py
      - name: Variables, defaults, State entities and explicit semantics
        run: |
          python tools/test_ng_existence_semantics.py
          python tools/test_variable_filter_dependencies.py
          python tools/test_oval_effective_attributes.py
          python tools/test_native_default_explicitness.py
          python tools/test_state_entity_roundtrip.py
          python tools/test_current_quantifier_roundtrip.py
          python tools/test_oval_result_truth_tables.py
          python tools/test_oval_result_truth_tables_exhaustive.py
          python tools/test_oval_schema_semantic_catalog.py
          python tools/scap_ng_roundtrip_v003/test_explicit_semantics.py
          python tools/scap_ng_roundtrip_v003/test_state_operator_roundtrip.py
          python tools/scap_ng_roundtrip_v003/test_summarize_niwc_census.py
      - name: Focused SCAP 1.4 XCCDF semantics
        run: |
          python tools/test_xccdf_applicability.py
          python tools/test_xccdf_check_selector_conversion.py
          python tools/test_xccdf_complex_check.py
          python tools/test_xccdf_processing_plan.py
          python tools/test_xccdf_profile_resolution.py
      - name: Authoring, Profiles, Tailoring and provenance
        run: |
          python tools/test_current_authoring_contract.py
          python tools/test_full_review_contract.py
          python tools/test_tailoring_example.py
      - name: Generate reviewed capability schema slice
        run: |
          mkdir -p work/generated-capability-schemas
          python tools/generate_capability_schema.py \
            --mapping schema/v0.1.0/capability-mappings/unix.file.json \
            --output work/generated-capability-schemas/unix.file.schema.json
          python -m json.tool work/generated-capability-schemas/unix.file.schema.json > /dev/null

      - name: Upload generated capability schema slice
        uses: actions/upload-artifact@v4
        with:
          name: generated-capability-schema-${{ matrix.os }}
          path: work/generated-capability-schemas/unix.file.schema.json

      - name: Upload experimental conditional known-result report
        uses: actions/upload-artifact@v4
        with:
          name: conditional-known-results-${{ matrix.os }}
          path: work/conditional-results.json

      - name: Repository normalization and content compiler
        run: |
          python tools/test_scap_ng_repo_normalizer.py
          python tools/test_scap_ng_content_compiler.py
          python tools/test_validate_native_package_graph.py
          python tools/test_package_manifest_schema.py
          python tools/scap_upconvert_v003/test_source_defect_quarantine.py
          python tools/scap_upconvert_v003/test_cpe_alias_resolution.py
          python tools/scap_upconvert_v003/test_xccdf_value_parameters.py
          python tools/scap_upconvert_v003/test_xccdf_check_resolution.py
          python tools/scap_upconvert_v003/test_xccdf_cluster_expansion.py
          python tools/scap_upconvert_v003/test_xccdf_role_mapping.py
