name: 0.4.0 proposed condition fields scope proof
on:
  push:
    branches: [main]
    paths:
      - 'tools/validate_v04_fields_condition_preview.py'
      - 'tools/test_validate_v04_fields_condition_preview.py'
      - 'tools/v04_restore_missing_applicability.py'
      - 'tools/v04_canonical_source_ir.py'
      - 'tools/test_v04_ci_integration.py'
      - 'tools/build_v04_and_or_fields_candidate.py'
      - 'tools/test_build_v04_and_or_fields_candidate.py'
      - 'tools/rename_v04_field_requirement_preview.py'
      - 'tools/test_rename_v04_field_requirement_preview.py'
      - 'tools/test_research_v04_oval_logic_scopes.py'
      - 'tools/hoist_v04_inherited_fields_requirement_preview.py'
      - 'tools/test_hoist_v04_inherited_fields_requirement_preview.py'
      - '.github/workflows/v04-fields-condition-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-reversible-fields-scope:
    runs-on: ubuntu-latest
    # Both raw and hoisted candidates validate strict canonical dependency views.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.25.1 PyYAML==6.0.3
      - name: Reject hidden field defaults and mixed logical scope
        env:
          PYTHONPATH: tools
        run: |
          python tools/test_v04_ci_integration.py -v
          python tools/test_validate_v04_fields_condition_preview.py -v
          python tools/test_build_v04_and_or_fields_candidate.py -v
          python tools/test_rename_v04_field_requirement_preview.py -v
          python tools/test_research_v04_oval_logic_scopes.py -v
      - name: Obtain immutable original shared Applicability dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p work/dependencies
          gh release download v0.3.0-six-stig-typed-operators-5796d016b12f \
            --pattern 'scap-ng-0.3-six-stig-authoring.zip' --dir work/dependencies
          echo '9b8d6e3528d52a7babc9d3fd0bdcad03664edfa9a754c65d49df5765f2b7473f  work/dependencies/scap-ng-0.3-six-stig-authoring.zip' | sha256sum -c -
      - name: Retrieve original-source-reversible field-group preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p work/fields
          gh run download 39593978798 --repo "$GH_REPO" \
            --name v04-and-or-fields-six-stig-candidate-research \
            --dir work/fields
          python - <<'PY'
          import json
          from pathlib import Path
          ledger=json.loads(Path('work/fields/field-layout-inverse-ledger.json').read_text())
          assert ledger['counts']=={
            'documents':4001,'whole_state_tests':123,
            'field_groups':231,'affected_documents':264
          }
          assert ledger['original_archive_sha256']==(
            '46bcb6cdf3a0d5c3eda06bbf827389eed2942afb477d65d97348f5b8aaa3a7d8')
          assert ledger['status']=='PREVIEW_ONLY_EXACT_SOURCE_GRAPH_INVERSE_NO_RUNTIME_PARITY'
          PY
      - name: Validate complete candidate with isolated proposal schema and field inheritance audit
        env:
          PYTHONPATH: tools
        run: |
          python tools/validate_v04_fields_condition_preview.py \
            --json-zip work/fields/and-or-fields-preview.json.zip \
            --yaml-zip work/fields/and-or-fields-preview.yaml.zip \
            --original-03 work/dependencies/scap-ng-0.3-six-stig-authoring.zip \
            --report work/fields/fields-group-schema-and-inheritance-proof.json
      - name: Prove lossless hoist of 44 inherited fields into 16 shared requirements
        env:
          PYTHONPATH: tools
        run: |
          python tools/test_hoist_v04_inherited_fields_requirement_preview.py -v
          python tools/hoist_v04_inherited_fields_requirement_preview.py \
            --source-json work/fields/and-or-fields-preview.json.zip \
            --candidate-json work/fields/hoisted-fields-0.4.json.zip \
            --candidate-yaml work/fields/hoisted-fields-0.4.yaml.zip \
            --proof work/fields/hoisted-requirements-source-inverse.json
          python tools/validate_v04_fields_condition_preview.py \
            --json-zip work/fields/hoisted-fields-0.4.json.zip \
            --yaml-zip work/fields/hoisted-fields-0.4.yaml.zip \
            --original-03 work/dependencies/scap-ng-0.3-six-stig-authoring.zip \
            --report work/fields/hoisted-fields-proposed-schema-proof.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("work/fields")
          a=json.loads((p/"hoisted-requirements-source-inverse.json").read_text())
          b=json.loads((p/"hoisted-fields-proposed-schema-proof.json").read_text())
          assert a["counts"]=={"documents":4001,"affected_documents":14,
                                "tests":16,"fields_children":44},a["counts"]
          assert b["new_condition_scopes"]=={"groups":231,"local":184,
                                                 "inherited":44,"each_field":3}
          assert b["status"]=="PROPOSED_FIELDS_SCOPE_SCHEMA_AND_SOURCE_IR_PASS_NOT_NORMATIVE"
          assert not a["schema_promoted"] and not a["scanner_semantics_proven"]
          print("PASS: all 44 inherited groups explicitly scoped by 16 shared AND/OR parent requirements")
          PY
      - name: Build reversible owner-approved field_requirement naming preview
        env:
          PYTHONPATH: tools
        run: |
          python tools/rename_v04_field_requirement_preview.py \
            --source-json work/fields/and-or-fields-preview.json.zip \
            --candidate-json work/fields/field-requirement-preview.json.zip \
            --candidate-yaml work/fields/field-requirement-preview.yaml.zip \
            --proof work/fields/field-requirement-rename-proof.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('work/fields/field-requirement-rename-proof.json').read_text())
          counts=p['counts']
          assert p['status']=='RESEARCH_ONLY_EXACT_TEST_SOURCE_INVERSE'
          assert counts['documents']==4001,counts
          assert counts.get('changed_tests',0)>0,counts
          assert counts.get('field_groups',0)>0,counts
          assert not p['native_schema_promoted'] and not p['scanner_semantics_proven']
          print('Source-invertible 0.4 field_requirement naming candidate:',counts)
          PY
      - name: Schema-check all renamed YAML and JSON under isolated proposed grammar
        env:
          PYTHONPATH: tools
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from v04_a_authoring_graph_index import read_authoring_archive
          from v04_canonical_source_ir import _schema_validators, validate_docs
          from validate_v04_fields_condition_preview import candidate_schema, native_schema_projection
          root=Path('work/fields')
          json_docs=read_authoring_archive(root/'field-requirement-preview.json.zip','json')
          yaml_docs=read_authoring_archive(root/'field-requirement-preview.yaml.zip','yaml')
          assert len(json_docs)==len(yaml_docs)==4001
          with TemporaryDirectory(prefix='field-requirement-approved-spelling-') as temp:
              validate=_schema_validators(candidate_schema(Path(temp)/'v0.4.0'))
              validate_docs(native_schema_projection(json_docs),validate)
              validate_docs(native_schema_projection(yaml_docs),validate)
          print('PASS: all 4,001 research naming preview JSON/YAML docs satisfy isolated schema')
          PY
      - name: Preserve reviewer-only condition naming evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v04-fields-condition-schema-preview
          path: |
            work/fields/fields-group-schema-and-inheritance-proof.json
            work/fields/hoisted-requirements-source-inverse.json
            work/fields/hoisted-fields-proposed-schema-proof.json
            work/fields/field-requirement-rename-proof.json
            work/fields/field-requirement-preview.json.zip
            work/fields/field-requirement-preview.yaml.zip
          if-no-files-found: ignore
