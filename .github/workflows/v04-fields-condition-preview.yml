name: 0.4.0 proposed condition fields scope proof
on:
  push:
    branches: [main]
    paths:
      - 'tools/validate_v04_fields_condition_preview.py'
      - 'tools/test_validate_v04_fields_condition_preview.py'
      - 'tools/build_v04_and_or_fields_candidate.py'
      - 'tools/test_build_v04_and_or_fields_candidate.py'
      - '.github/workflows/v04-fields-condition-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-reversible-fields-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.25.1 PyYAML==6.0.3
      - name: Reject hidden field defaults and mixed logical scope
        env:
          PYTHONPATH: tools
        run: |
          python tools/test_validate_v04_fields_condition_preview.py -v
          python tools/test_build_v04_and_or_fields_candidate.py -v
      - name: Retrieve original-source-reversible field-group preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p work/fields
          gh run download 39593978798 --repo "$GH_REPO" \
            --name v04-and-or-fields-six-stig-candidate-research \
            --dir work/fields
          python - <<'PY'
          import json
          from pathlib import Path
          ledger=json.loads(Path('work/fields/field-layout-inverse-ledger.json').read_text())
          assert ledger['counts']=={
            'documents':4001,'whole_state_tests':123,
            'field_groups':231,'affected_documents':264
          }
          assert ledger['original_archive_sha256']==(
            '46bcb6cdf3a0d5c3eda06bbf827389eed2942afb477d65d97348f5b8aaa3a7d8')
          assert ledger['status']=='PREVIEW_ONLY_EXACT_SOURCE_GRAPH_INVERSE_NO_RUNTIME_PARITY'
          PY
      - name: Validate complete candidate with isolated proposal schema and field inheritance audit
        env:
          PYTHONPATH: tools
        run: |
          python tools/validate_v04_fields_condition_preview.py \
            --json-zip work/fields/and-or-fields-preview.json.zip \
            --yaml-zip work/fields/and-or-fields-preview.yaml.zip \
            --report work/fields/fields-group-schema-and-inheritance-proof.json
      - name: Preserve reviewer-only condition naming evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v04-fields-condition-schema-preview
          path: work/fields/fields-group-schema-and-inheritance-proof.json
          if-no-files-found: ignore
