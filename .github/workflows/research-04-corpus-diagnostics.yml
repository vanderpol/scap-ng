name: 0.4 full corpus tally diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/research-04-corpus-diagnostics.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: full-corpus-shorthand-04-report
          run-id: 38716331301
          github-token: ${{ github.token }}
          path: work
      - name: Inspect the underlying 0.3 research vocabulary safely
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path("work/full-corpus-shorthand-04.json").read_text())
          print("BENCHMARKS",r["benchmarks_total"],r["benchmarks_generated"],
                r["benchmarks_expected_sql_blockers"])
          print("TOTALS",r["totals"])
          for scope in ("primary_structured","shell_command","macos_atypical"):
              m=r["categories"].get(scope,{})
              print("=== GROUP",scope)
              for prefix in ("items_pair:","field_pair:","capability:",
                             "selector_macro:","state_macro:"):
                  entries=sorted(((key,v) for key,v in m.items() if key.startswith(prefix)),
                                 key=lambda row:(-row[1],row[0]))
                  print(prefix,entries[:15])
          PY
