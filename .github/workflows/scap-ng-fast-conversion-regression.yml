name: Representative Board conversion regression

on:
  push:
    branches: [main]
    paths:
      - tools/**
      - schema/v0.3.0/**
      - .github/workflows/scap-ng-fast-conversion-regression.yml
      - .github/workflows/scap-ng-full-current-native-normalize-compile.yml
  pull_request:
    paths:
      - tools/**
      - schema/v0.3.0/**
      - .github/workflows/scap-ng-fast-conversion-regression.yml
      - .github/workflows/scap-ng-full-current-native-normalize-compile.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: representative-board-conversion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NIWC_REVISION: 8c8e5dff860af6b1290ee9273a282db24278f8d5

jobs:
  convert:
    name: Convert ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows Server DNS
            artifact: U_MS_Windows_Server_DNS_V2R3_STIG_SCAP_1-4_Benchmark-enhancedV8-signed.zip
            expected_status: generated
            expected_marker: ""
          - label: Windows 11
            artifact: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip
            expected_status: generated
            expected_marker: ""
          - label: Oracle Linux 9
            artifact: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-signed.zip
            expected_status: generated
            expected_marker: ""
          - label: Apache 2.4 UNIX Server
            artifact: U_Apache_Server_2-4_UNIX_Server_V3R2_STIG_SCAP_1-4_Benchmark-enhancedV2-signed.zip
            expected_status: generated
            expected_marker: ""
          - label: RHEL 9
            artifact: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-signed.zip
            expected_status: generated
            expected_marker: ""
          - label: Windows Server 2025
            artifact: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip
            expected_status: generated
            expected_marker: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: scap-ng
      - uses: actions/checkout@v4
        with:
          repository: niwc-atlantic/scap-content-library
          ref: ${{ env.NIWC_REVISION }}
          path: niwc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 lxml==6.1.1
      - name: Convert pinned benchmark
        env:
          ARTIFACT: ${{ matrix.artifact }}
          EXPECTED_STATUS: ${{ matrix.expected_status }}
          EXPECTED_MARKER: ${{ matrix.expected_marker }}
        run: |
          python - <<'PY'
          import json, os, shutil, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path("scap-ng/tools").resolve()))
          from generate_niwc_current_review import native_artifact_base

          artifact=os.environ["ARTIFACT"]
          expected=os.environ["EXPECTED_STATUS"]
          marker=os.environ.get("EXPECTED_MARKER","")
          source=Path("niwc/Current")/artifact
          key=native_artifact_base(source.stem)
          out=Path("work/result/generated")/key
          split=Path("work")/f"split-{key}"
          out.parent.mkdir(parents=True,exist_ok=True)
          shutil.rmtree(out,ignore_errors=True)
          shutil.rmtree(split,ignore_errors=True)
          cmd=[
              sys.executable,"scap-ng/tools/generate_niwc_current_review.py",str(source),
              "--output",str(out),"--split-root",str(split),
              "--source-revision",os.environ["NIWC_REVISION"],
              "--source-repository-path",f"Current/{artifact}",
              "--schema","scap-ng/third_party/scap-1.4-schemas/omni-schema.xsd",
              "--summary",str(out/"source-generation.json"),
          ]
          proc=subprocess.run(cmd,capture_output=True,text=True)
          log=proc.stdout+"\n"+proc.stderr
          status="generated" if proc.returncode==0 else "blocked"
          record={"artifact":artifact,"key":key,"status":status,"returncode":proc.returncode,
                  "expected_status":expected,"expected_marker":marker,
                  "log_tail":"\n".join(log.splitlines()[-120:])}
          Path("work/result/status").mkdir(parents=True,exist_ok=True)
          Path("work/result/status/result.json").write_text(json.dumps(record,indent=2,sort_keys=True)+"\n")
          Path("work/result/conversion.log").write_text(log)
          shutil.rmtree(split,ignore_errors=True)
          print(json.dumps({k:v for k,v in record.items() if k!="log_tail"},indent=2))
          if status != expected:
              raise SystemExit(f"{artifact}: expected {expected}, got {status}")
          if marker and marker not in log:
              raise SystemExit(f"{artifact}: expected blocker marker not found: {marker}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-conversion-${{ strategy.job-index }}
          path: work/result
          if-no-files-found: error
          compression-level: 6

  validate:
    name: Validate and compile successful fast-set conversions
    needs: convert
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: scap-ng
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 cryptography jsonschema==4.25.1
      - uses: actions/download-artifact@v4
        with:
          pattern: fast-conversion-*
          path: downloads
      - name: Assemble successful conversions
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          root=Path("work/representative"); root.mkdir(parents=True,exist_ok=True)
          statuses=[]
          for status_path in sorted(Path("downloads").rglob("status/result.json")):
              row=json.loads(status_path.read_text())
              statuses.append(row)
              if row["status"]!="generated":
                  continue
              source=status_path.parent.parent/"generated"/row["key"]
              target=root/row["key"]
              if target.exists():
                  raise SystemExit(f"duplicate generated key: {row['key']}")
              shutil.copytree(source,target)
          if len(statuses)!=6:
              raise SystemExit(f"expected 6 status records, found {len(statuses)}")
          generated=sum(row["status"]=="generated" for row in statuses)
          blocked=sum(row["status"]=="blocked" for row in statuses)
          if (generated,blocked)!=(6,0):
              raise SystemExit(f"unexpected representative-set status totals: generated={generated} blocked={blocked}")
          print(json.dumps({"packages":6,"generated":generated,"blocked":blocked},indent=2))
          PY
      - name: Render canonical 0.3 candidate authoring
        run: |
          PYTHONPATH=scap-ng/tools python - <<'PY'
          import subprocess, sys
          from pathlib import Path

          source_root=Path("work/representative")
          output_root=Path("work/candidate-source")
          evidence_root=Path("work/render-evidence")
          for source in sorted(p for p in source_root.iterdir() if p.is_dir()):
              target=output_root/source.name
              evidence=evidence_root/source.name
              cmd=[
                  sys.executable,
                  "scap-ng/tools/render_0_3_human_review_candidate.py",
                  str(source),
                  "--output-root",str(target),
                  "--evidence-dir",str(evidence),
                  "--label",source.name,
              ]
              subprocess.run(cmd,check=True)
          PY
      - name: Validate active v0.3.0 schema
        run: |
          python scap-ng/tools/validate_native_json_schemas.py work/candidate-source \
            --schema-dir scap-ng/schema/v0.3.0 \
            --report work/schema-validation.json
      - name: Validate native Assessment semantics
        run: |
          PYTHONPATH=scap-ng/tools python scap-ng/tools/validate_native_semantics.py work/candidate-source \
            --report work/semantic-validation.json
      - name: Validate package graph
        run: |
          python scap-ng/tools/validate_native_package_graph.py work/candidate-source \
            --report work/package-graph.json
      - name: Normalize exact duplicate Assessments for Board-readable source
        run: |
          python scap-ng/tools/scap_ng_repo_normalizer.py work/candidate-source \
            --rewrite \
            --output-root work/board-source \
            --report work/normalizer-report.json \
            --advisory none
      - name: Test platform-neutral cross-benchmark shared titles
        run: PYTHONPATH=scap-ng/tools python -m unittest -v scap-ng/tools/test_shared_assessment_titles.py
      - name: Validate normalized Board source
        run: |
          python scap-ng/tools/validate_native_json_schemas.py work/board-source \
            --schema-dir scap-ng/schema/v0.3.0 \
            --report work/board-schema-validation.json
          PYTHONPATH=scap-ng/tools python scap-ng/tools/validate_native_semantics.py work/board-source \
            --report work/board-semantic-validation.json
          python scap-ng/tools/validate_native_package_graph.py work/board-source \
            --report work/board-package-graph.json
      - name: Compile representative Board packages
        run: |
          python scap-ng/tools/scap_ng_content_compiler.py work/board-source \
            --output-dir work/board-packages \
            --metrics work/compiler-metrics.json \
            --source-revision ${{ env.NIWC_REVISION }} \
            --scap-ng-revision ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Stage compact Board review artifact
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path

          root=Path("work/board-review")
          shutil.rmtree(root,ignore_errors=True)
          root.mkdir(parents=True,exist_ok=True)
          shutil.copytree("work/board-source",root/"authoring")
          shutil.copytree("work/board-packages",root/"packages")
          shutil.copytree("scap-ng/specification/examples/0.3.0/results",root/"results"/"synthetic-fixtures")

          normalizer=json.loads(Path("work/normalizer-report.json").read_text())
          review={
              "artifact":"scap-ng-board-representative-review",
              "benchmarks":[
                  "RHEL 9",
                  "Oracle Linux 9",
                  "Windows 11",
                  "Windows Server 2025",
                  "Apache 2.4 UNIX Server",
                  "Windows Server DNS",
              ],
              "layout":{
                  "authoring":"Readable normalized native SCAP-NG authoring trees intended for ongoing editing/maintenance; exact duplicate Assessments are shared under shared/assessments with meaningful names.",
                  "packages":"Compiled .scapng packages from the same source trees.",
                  "results":"Explicitly synthetic 0.3 result schema fixtures; not observed target scan output.",
              },
              "feature_search_examples":{
                  "for_each:":"authoring/shared/assessments/all-local-interactive-user-home-directories-are-0750-or-less.assessment.yaml",
                  "shared_objects:":"authoring/apache_server_2-4_unix_server/assessments/automated/SV-214228.automated.yaml",
                  "value: [array]":"authoring/ms_windows_11/assessments/automated/SV-253274.automated.yaml",
                  "evaluate:":"authoring/ms_windows_server_2025/assessments/automated/SV-278001.automated.yaml",
                  "filters: / set:":"authoring/ms_windows_11/assessments/applicability/condition.bluetooth-installation.yaml",
                  "profiles: / groups:":"authoring/rhel_9/benchmark.yaml",
              },
              "shared_assessment_groups":normalizer["summary"]["exact_duplicate_groups"],
              "duplicate_assessment_definitions_avoided":normalizer["summary"]["duplicate_assessment_definitions_avoided"],
          }
          (root/"REVIEW.json").write_text(json.dumps(review,indent=2,sort_keys=True)+"\n")
          (root/"README.md").write_text(
              "# SCAP-NG representative OVAL Board review build\n\n"
              "Start with `authoring/` to review the maintainable native SCAP-NG source model, then inspect `packages/` for compiled distribution examples.\n\n"
              "Search native YAML keys (not PowerShell script text): `for_each:`, `shared_objects:`, `filters:`, `set:`, `evaluate:`, and list-valued `value:`. The `REVIEW.json` file identifies concrete example paths; see the repo's `specification/examples/README.md` for source-backed explanations.\n\n"
              "The `authoring/` tree demonstrates actual converted and normalized content. Native `if/then/else`, Organizational Input bindings and selective redaction are not demonstrated there; research proposals are not silently converted.\n\n"

              "The `results/synthetic-fixtures/` directory contains illustrative 0.3 Scan, Benchmark, automated/manual Assessment and bounded-evidence Results. These are not scanner output from the six STIGs.\n\n"
              "This intentionally small review set contains RHEL 9, Oracle Linux 9, Windows 11, Windows Server 2025, Apache 2.4 UNIX Server, and Windows Server DNS.\n"
              "The paired Linux and Windows operating-system benchmarks intentionally make cross-benchmark shared Assessment reuse visible; the DNS and Apache Server benchmarks demonstrate service-specific coverage alongside operating-system STIGs.\n"
              "The exhaustive 65-package corpus remains regression evidence and is not part of this human-review artifact.\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: representative-board-conversion-evidence
          path: |
            work/schema-validation.json
            work/semantic-validation.json
            work/package-graph.json
            work/normalizer-report.json
            work/board-schema-validation.json
            work/board-semantic-validation.json
            work/board-package-graph.json
            work/compiler-metrics.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: scap-ng-board-representative-review
          path: work/board-review
          if-no-files-found: error
          compression-level: 6

  announce-six-run:
    name: Announce representative run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Publish run ID on release gate issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          {
            echo "<!-- scap-ng-six-anchor-run -->"
            echo "### Latest six-anchor 0.3 conversion regression"
            echo ""
            echo "- Result: **running**"
            echo "- Run: ${RUN_URL}"
            echo "- Source SHA: \`${SOURCE_SHA}\`"
          } > "${RUNNER_TEMP}/six-run.md"
          gh issue comment 202 --edit-last --create-if-none --body-file "${RUNNER_TEMP}/six-run.md"

  publish-six-run:
    name: Report representative conversion and validation verdict
    needs: [convert, validate]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Post aggregate matrix outcome
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONVERSION_RESULT: ${{ needs.convert.result }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          {
            echo "<!-- scap-ng-six-anchor-run -->"
            echo "### Latest six-anchor 0.3 conversion regression"
            echo ""
            echo "- Source conversion (six-matrix): **${CONVERSION_RESULT}**"
            echo "- Schema/semantics/normalization/compilation: **${VALIDATION_RESULT}**"
            echo "- Run: ${RUN_URL}"
            echo "- Source SHA: \`${SOURCE_SHA}\`"
            echo "- Inspect each matrix job and downloadable evidence at the run link."
            echo ""
            echo "A green conversion matrix alone is not a green release gate. Neither static gate proves scanner/runtime equivalence."
          } > "${RUNNER_TEMP}/six-run.md"
          gh issue comment 202 --edit-last --create-if-none --body-file "${RUNNER_TEMP}/six-run.md"
