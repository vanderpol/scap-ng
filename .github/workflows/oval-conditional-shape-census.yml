name: OVAL conditional-shape census

on:
  push:
    paths:
      - tools/measure_oval_conditional_patterns.py
      - .github/workflows/oval-conditional-shape-census.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  NIWC_REVISION: 8c8e5dff860af6b1290ee9273a282db24278f8d5

jobs:
  measure:
    name: Measure ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: RHEL 9, key: rhel9, artifact: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-signed.zip}
          - {label: Oracle Linux 9, key: oracle9, artifact: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-signed.zip}
          - {label: Windows 11, key: windows11, artifact: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip}
          - {label: Windows Server 2025, key: windows2025, artifact: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip}
          - {label: Apache 2.4 UNIX Server, key: apache24, artifact: U_Apache_Server_2-4_UNIX_Server_V3R2_STIG_SCAP_1-4_Benchmark-enhancedV2-signed.zip}
          - {label: Solaris 11 x86, key: solaris11, artifact: U_SOL_11_X86_V3R5_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip}
          - {label: Windows Server DNS, key: dns, artifact: U_MS_Windows_Server_DNS_V2R3_STIG_SCAP_1-4_Benchmark-enhancedV8-signed.zip}
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned NIWC package
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/niwc-atlantic/scap-content-library/${NIWC_REVISION}/Current/${ARTIFACT}" \
            -o source.zip
      - name: Measure nested/conditional criteria
        env:
          PYTHONPATH: tools
        run: |
          python tools/measure_oval_conditional_patterns.py source.zip \
            --label "${{ matrix.label }}" \
            --output report.json
      - uses: actions/upload-artifact@v4
        with:
          name: oval-conditional-patterns-${{ matrix.key }}
          path: report.json

  aggregate:
    name: Aggregate conditional-shape census
    needs: measure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: oval-conditional-patterns-*
          path: reports
      - name: Aggregate
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          reports=[json.loads(p.read_text()) for p in sorted(Path("reports").rglob("report.json"))]
          counts=Counter()
          rows=[]
          examples=[]
          for r in reports:
              counts.update(r["counts"])
              row={"label":r["label"],"rules":r["automated_oval_rule_count"],**r["counts"]}
              rows.append(row)
              for x in r["rules"]:
                  if x["has_binary_guard_pattern"] or x["has_applicability_marker"]:
                      examples.append({
                          "label":r["label"],
                          "rule_id":x["rule_id"],
                          "title":x["title"],
                          "binary_guard":x["has_binary_guard_pattern"],
                          "applicability_marker":x["has_applicability_marker"],
                      })
          total=sum(r["automated_oval_rule_count"] for r in reports)
          pct=lambda n: round(100*n/total,1) if total else 0
          out={
              "format":"scap-ng-oval-conditional-shape-census-0.1",
              "packages":len(reports),
              "automated_oval_rules":total,
              "counts":dict(counts),
              "percent_of_rules":{k:pct(v) for k,v in counts.items()},
              "packages_summary":rows,
              "candidate_examples":examples,
              "generic_binary_guard_truth_comparison":reports[0]["generic_binary_guard_truth_comparison"] if reports else {},
          }
          Path("aggregate.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: oval-conditional-patterns-aggregate
          path: aggregate.json
