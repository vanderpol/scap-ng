name: Native Item existence research guards (#235)
on:
  push:
    paths:
      - tools/test_research_04_nonexistent_items_policy.py
      - tools/test_research_04_native_existing_item_profile.py
      - research/assessment-simplification/english-first-04/native-existing-item.profile.schema.json
      - tools/oval_result_truth_tables.py
      - .github/workflows/research-native-item-policy-04.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-existing-items:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trunk
        uses: actions/checkout@v4
      - name: Install experimental schema validator
        run: python -m pip install 'jsonschema==4.25.1'
      - name: Validate native existing-Item contract against missing/error cases
        run: python tools/test_research_04_native_existing_item_profile.py -v
      - name: Demonstrate six-state boundaries under no-phantom-Item proposal
        run: python tools/test_research_04_nonexistent_items_policy.py -v
