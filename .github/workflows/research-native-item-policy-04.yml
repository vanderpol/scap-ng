name: Native Item existence research guards (#235)
on:
  push:
    paths:
      - tools/test_research_04_nonexistent_items_policy.py
      - tools/test_research_04_rare_oval_removal_guards.py
      - tools/test_research_04_exactly_one_equivalence.py
      - tools/research_04_source_oval_origin.py
      - research/assessment-simplification/evidence/rhel_9/SV-257889/graph.json
      - research/iterations/003/evidence/roundtrip-source-oval/U_RHEL_10_SV-281037-oval.xml
      - tools/test_research_04_native_existing_item_profile.py
      - research/assessment-simplification/english-first-04/native-existing-item.profile.schema.json
      - tools/oval_result_truth_tables.py
      - .github/workflows/research-native-item-policy-04.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-existing-items:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trunk
        uses: actions/checkout@v4
      - name: Verify original DISA and NAVWAR element identifiers
        run: python tools/research_04_source_oval_origin.py --output /tmp/source-oval-attribution.md
      - name: Install experimental schema validator
        run: python -m pip install 'jsonschema==4.25.1'
      - name: Validate native existing-Item contract against missing/error cases
        run: python tools/test_research_04_native_existing_item_profile.py -v
      - name: Check exactly-one existence collapses two redundant match choices
        run: python tools/test_research_04_exactly_one_equivalence.py -v
      - name: Reject unsafe shorthand and rare-OVAL operator substitutions
        run: python tools/test_research_04_rare_oval_removal_guards.py -v
      - name: Demonstrate six-state boundaries under no-phantom-Item proposal
        run: python tools/test_research_04_nonexistent_items_policy.py -v
