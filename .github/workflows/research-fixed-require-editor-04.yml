name: Fixed item-condition editor pilot (#235)
on:
  push:
    paths:
      - .github/workflows/research-fixed-require-editor-04.yml
      - tools/research_04_fixed_require_editor.py
      - tools/test_research_04_scoped_condition_editor.py
      - tools/test_research_04_editor_field_suggestions.py
      - research/assessment-simplification/english-first-04/fixed-require.editor.schema.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  real-six-stig:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install research validators
        run: python -m pip install 'PyYAML==6.0.3' 'jsonschema==4.25.1'
      - name: Download pinned six-STIG r3 source YAML
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work
          gh release download v0.4.0-joval-meeting-preview-20261015-r3 \
            --repo vanderpol/scap-ng \
            --pattern scap-ng-v0.4-joval-six-stig-yaml.zip \
            --dir work
      - name: Validate capability-specific condition-field suggestions and typo rejection
        run: python tools/test_research_04_editor_field_suggestions.py -v
      - name: Reject wrong scopes and verify WMI mixed-record counterexample
        run: python tools/test_research_04_scoped_condition_editor.py -v
      - name: Complete fixed-grammar source reconstruction and autocomplete validation
        run: |
          python tools/research_04_fixed_require_editor.py \
            --archive work/scap-ng-v0.4-joval-six-stig-yaml.zip \
            --schema research/assessment-simplification/english-first-04/fixed-require.editor.schema.json \
            --json fixed-require-editor-pilot.json \
            --markdown fixed-require-editor-pilot.md \
            --samples preview
      - name: Assert 98 percent complete Assessment source-exact threshold
        run: |
          python - <<'PY'
          import json
          result=json.load(open("fixed-require-editor-pilot.json"))
          count=result["counts"]
          if count["exact_documents"] < 855:
              raise SystemExit(f"Only {count['exact_documents']}/872 exact Assessments; target >=98%")
          if count["source_tests"] != 1375 or count["assessments"] != 872:
              raise SystemExit("Corpus count changed")
          print("Threshold met:",count["exact_documents"],"/872")
          PY
      - name: Publish GitHub.com review report and complete sample YAML
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,json,os,pathlib,subprocess
          repo=os.environ["GITHUB_REPOSITORY"]
          if repo!="vanderpol/scap-ng": raise RuntimeError("Unexpected repository")
          head=subprocess.run(
              ["gh","api",f"repos/{repo}/commits/main","--jq",".sha"],
              capture_output=True,text=True,check=True).stdout.strip()
          if head!=os.environ["GITHUB_SHA"]:
              print("Main advanced: do not publish stale prototype evidence")
              raise SystemExit(0)
          root="research/assessment-simplification/english-first-04"
          paths={
            "fixed-require-editor-pilot.json":root+"/reports/fixed-require-editor-pilot.json",
            "fixed-require-editor-pilot.md":root+"/reports/fixed-require-editor-pilot.md",
          }
          for f in sorted(pathlib.Path("preview").glob("*.yaml")):
              paths[str(f)]=root+"/fixed-require-samples/"+f.name
          for local,remote in paths.items():
              result=subprocess.run(["gh","api",f"repos/{repo}/contents/{remote}",
                                    "--jq",".sha"],capture_output=True,text=True)
              if result.returncode not in (0,1):
                  raise RuntimeError("Remote read failed: "+remote)
              blob={"branch":"main","message":"research(#235): publish tested fixed requirement editor review",
                    "content":base64.b64encode(pathlib.Path(local).read_bytes()).decode("ascii")}
              if result.returncode==0: blob["sha"]=result.stdout.strip()
              subprocess.run(["gh","api","--method","PUT",f"repos/{repo}/contents/{remote}",
                              "--input","-"],input=json.dumps(blob),text=True,check=True)
          PY
      - name: Save non-authoritative research files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-require-editor-pilot
          path: |
            fixed-require-editor-pilot.json
            fixed-require-editor-pilot.md
            preview/*.yaml
          if-no-files-found: warn
