name: 0.4 canonical field-key record quantifier research

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/research-04-record-quantifier-canonical.yml
      - tools/research_04_record_aware_canonical.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record-quantifiers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Retrieve immutable six-STIG 0.3 authoring
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p work
          gh release download v0.3.0-six-stig-typed-operators-5796d016b12f \
            --pattern scap-ng-0.3-six-stig-authoring.zip --dir work
      - name: Audit native record predicates and exact 0.3 lowering
        run: |
          PYTHONPATH=tools python tools/research_04_record_aware_canonical.py \
            --authoring-zip work/scap-ng-0.3-six-stig-authoring.zip \
            --output work/record-aware-03-proofs.json
      - uses: actions/upload-artifact@v4
        with:
          name: three-stig-record-aware-04-proof
          path: work/record-aware-03-proofs.json
          if-no-files-found: error
