name: 0.4.0 Windows 11 original OVAL XML semantic pilot
on:
  push:
    branches: [main]
    paths:
      - 'tools/export_v04_oval_shellcommand_pilot.py'
      - 'tools/extract_v04_win11_bluetooth_oval.py'
      - 'tools/audit_v04_oval_xml_roundtrip.py'
      - 'tools/test_audit_v04_oval_xml_roundtrip.py'
      - 'tools/test_export_v04_shellcommand_pilot.py'
      - 'tools/export_v04_oval_registry_pilot.py'
      - 'tools/test_export_v04_registry_pilot.py'
      - 'tools/audit_v04_original_oval_forward.py'
      - 'tools/import_v04_oval_leaf_pilot.py'
      - 'tools/compare_v04_fresh_oval_import.py'
      - 'tools/test_import_v04_oval_leaf_pilot.py'
      - 'tools/run_v04_true_xml_native_xml_pilot.py'
      - 'tools/v04_flat_object_authoring.py'
      - 'tools/audit_v04_flat_object_names.py'
      - 'tools/test_audit_v04_original_oval_forward.py'
      - 'tools/check_v04_oval_xml_mutation_regressions.py'
      - 'tools/combine_v04_oval_xml_proofs.py'
      - 'tools/test_combine_v04_oval_xml_proofs.py'
      - 'tools/validate_v04_oval_5123.py'
      - '.github/workflows/v04-oval-bluetooth-xml-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  actual-v04-xml-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout pinned OVAL 5.12.3 schemas
        uses: actions/checkout@v4
        with:
          repository: OVAL-Community/OVAL
          ref: v5.12.3
          path: work/oval-5123
      - run: python -m pip install PyYAML==6.0.3 lxml==6.0.2
      - name: Negative Filter and source integrity fixture tests
        env:
          PYTHONPATH: tools
        run: |
          python tools/test_audit_v04_oval_xml_roundtrip.py -v
          python tools/test_export_v04_shellcommand_pilot.py -v
          python tools/test_export_v04_registry_pilot.py -v
          python tools/test_audit_v04_original_oval_forward.py -v
          python tools/test_import_v04_oval_leaf_pilot.py -v
          python tools/test_combine_v04_oval_xml_proofs.py -v
      - name: Obtain pinned original OVAL source XML and verified 0.4.0 authored output
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p work/source work/candidate work/compare
          curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/niwc-atlantic/scap-content-library/main/Current/U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip \
            --output work/source/windows11-stig.zip
          gh run download 39503111241 --repo "$GH_REPO" \
            --name scap-ng-040-six-stig-board-authoring \
            --dir work/candidate
          PYTHONPATH=tools python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          folder=Path('work/candidate')
          manifest=json.loads((folder/'json-manifest.json').read_text())
          archive=folder/'scap-ng-0.4.0-six-stigs.json.zip'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==manifest['output_sha256']
          assert manifest['counts']['source_proven_direct_filters']==28
          assert manifest['counts']['source_linked_additional_direct_filters']==19
          with zipfile.ZipFile(archive) as z:
              name='authoring/ms_windows_11/assessments/applicability/condition.bluetooth-installation.json'
              raw=z.read(name)
          native=json.loads(raw)['assessment']
          assert native['specification']['version']=='0.4.0'
          test=next(iter(native['tests'].values()))
          assert 'set' not in test['object'] and 'filters' in test['object']
          Path('work/compare/bluetooth-native-v04.json').write_bytes(raw)
          print('Verified actual 0.4.0 source-generated Bluetooth file', name)
          with zipfile.ZipFile(archive) as z:
              camera='authoring/ms_windows_11/assessments/applicability/condition.camera-installation.json'
              camera_raw=z.read(camera)
          actual=json.loads(camera_raw)['assessment']
          assert actual['specification']['version']=='0.4.0'
          camera_test=next(iter(actual['tests'].values()))
          assert 'set' not in camera_test['object'] and 'filters' in camera_test['object']
          Path('work/compare/camera-native-v04.json').write_bytes(camera_raw)
          print('Verified actual 0.4.0 source-generated Camera file',camera)
          for rule in ('SV-253291','SV-253350'):
              registry=f'authoring/ms_windows_11/assessments/automated/{rule}.automated.json'
              with zipfile.ZipFile(archive) as z:
                  registry_raw=z.read(registry)
              assessment=json.loads(registry_raw)['assessment']
              assert assessment['specification']['version']=='0.4.0'
              assert len(assessment['tests'])==1
              t=next(iter(assessment['tests'].values()))
              assert t['capability']=='windows.registry'
              Path(f'work/compare/{rule}-native-v04.json').write_bytes(registry_raw)
              print('Verified source-generated native registry Test',registry)
          PY
      - name: Independently export actual 0.4.0 Bluetooth Assessment to OVAL 5.12.3 XML
        env:
          PYTHONPATH: tools
        run: |
          python tools/extract_v04_win11_bluetooth_oval.py \
            --source-zip work/source/windows11-stig.zip \
            --output work/compare/source-oval.xml \
            --proof work/compare/source-proof.json
          # The October-20 source-pinned six-STIG baseline predates the
          # owner-approved flat Object syntax. Retain it unchanged for
          # original-source oracle checking, and source-invertibly project
          # only exporter inputs into the new 0.4 authoring grammar.
          python - <<'PY'
          from pathlib import Path
          from v04_flat_object_authoring import (
              load_catalog, flatten_document, restore_document)
          import json
          root=Path('work/compare')
          catalog=load_catalog(Path('schema/v0.4.0/capability-mappings/supported'))
          for name in ('bluetooth','camera','SV-253291','SV-253350'):
              source=root/(name+'-native-v04.json')
              prior=json.loads(source.read_text())
              flat,proof=flatten_document(prior,catalog)
              assert proof['edits'] and restore_document(flat,proof)==prior,name
              (root/(name+'-native-v04.flat.json')).write_text(
                  json.dumps(flat,indent=2)+'\\n')
              (root/(name+'-native-v04.flat-proof.json')).write_text(
                  json.dumps(proof,indent=2)+'\\n')
          print("PASS: all four source-pinned OVAL Tests mapped to flat Objects")
          PY
          python tools/export_v04_oval_shellcommand_pilot.py \
            --native work/compare/bluetooth-native-v04.json \
            --output work/compare/exported-oval.xml \
            --definition-id-output work/compare/exported-def-id.txt
          python tools/extract_v04_win11_bluetooth_oval.py \
            --source-zip work/source/windows11-stig.zip --device camera \
            --output work/compare/camera-source-oval.xml \
            --proof work/compare/camera-source-proof.json
          python tools/export_v04_oval_shellcommand_pilot.py \
            --native work/compare/camera-native-v04.json \
            --output work/compare/camera-exported-oval.xml \
            --definition-id-output work/compare/camera-exported-def-id.txt
          for rule in SV-253291 SV-253350; do
            python tools/export_v04_oval_registry_pilot.py \
              --native "work/compare/$rule-native-v04.json" \
              --output "work/compare/$rule-exported-oval.xml" \
              --definition-id-output "work/compare/$rule-exported-def-id.txt"
          done
      - name: Compare real original and independently regenerated OVAL Definition graphs
        env:
          PYTHONPATH: tools
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('work/compare')
          src=json.loads((root/'source-proof.json').read_text())
          cases=[]
          for device in ('bluetooth','camera'):
              prefix='' if device=='bluetooth' else 'camera-'
              proof=json.loads((root/(prefix+'source-proof.json')).read_text())
              row={'case_id':'Windows 11 original '+device+' source',
                  'status':'converted','forward_profile':'0.4.0',
                  'reverse_profile':'0.4.0',
                  'source_definition':proof['source_definition'],
                  'regenerated_definition':(
                      root/(prefix+'exported-def-id.txt')).read_text().strip()}
              for key,name in [('original',prefix+'source-oval.xml'),
                               ('native_assessment',device+'-native-v04.flat.json'),
                               ('regenerated',prefix+'exported-oval.xml')]:
                  file=root/name
                  row[key]=name
                  row[key+'_sha256']=hashlib.sha256(file.read_bytes()).hexdigest()
              cases.append(row)
          # The two other originals are distinct registry Definitions
          # inside the same pinned Windows 11 OVAL component.
          import xml.etree.ElementTree as ET
          oval=ET.parse(root/'source-oval.xml').getroot()
          ns='http://oval.mitre.org/XMLSchema/oval-definitions-5'
          by_id={e.get('id'):e for e in oval.iter() if e.get('id')}
          for rule in ('SV-253291','SV-253350'):
              suffix=rule.split('-')[1]
              srcdef=f'oval:navy.navwar.niwcatlantic.scc.windows:def:{suffix}'
              assert srcdef in by_id
              crit=[e for e in by_id[srcdef].iter()
                    if e.tag=='{'+ns+'}criterion']
              assert len(crit)==1
              src_test=by_id[crit[0].get('test_ref')]
              native=json.loads((root/(rule+'-native-v04.json')).read_text())['assessment']
              assert src_test.get('comment')==next(iter(native['tests'].values()))['test_title']
              assert src_test.get('check')=='only one'
              assert src_test.get('check_existence')=='at_least_one_exists'
              row={'case_id':'Windows 11 original '+rule+' registry',
                  'status':'converted','forward_profile':'0.4.0',
                  'reverse_profile':'0.4.0',
                  'source_definition':srcdef,
                  'regenerated_definition':(
                      root/(rule+'-exported-def-id.txt')).read_text().strip()}
              for key,name in [('original','source-oval.xml'),
                               ('native_assessment',rule+'-native-v04.flat.json'),
                               ('regenerated',rule+'-exported-oval.xml')]:
                  file=root/name
                  row[key]=name
                  row[key+'_sha256']=hashlib.sha256(file.read_bytes()).hexdigest()
              cases.append(row)
          (root/'roundtrip-manifest.json').write_text(json.dumps({
              'format':'scap-ng-v04-oval-xml-roundtrip-1',
              'profile':'0.4.0','cases':cases},indent=2)+'\n')
          PY
          python tools/audit_v04_oval_xml_roundtrip.py \
            --root work/compare \
            --manifest work/compare/roundtrip-manifest.json \
            --expected-cases 4 \
            --report work/compare/semantic-roundtrip-result.json
      - name: Independently compare original OVAL Test/Object/State to authored 0.4.0 fields
        env:
          PYTHONPATH: tools
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('work/compare')
          configs=[
              ('source-proof.json','bluetooth-native-v04.json'),
              ('camera-source-proof.json','camera-native-v04.json'),
          ]
          for proof,native in configs:
              metadata=json.loads((root/proof).read_text())
              print(proof,metadata['source_definition'])
          PY
          python tools/audit_v04_original_oval_forward.py \
            --source-xml work/compare/source-oval.xml \
            --native work/compare/bluetooth-native-v04.json \
            --definition-id oval:navy.navwar.niwcatlantic.scc.windows:def:102 \
            --report work/compare/bluetooth-original-forward.json
          python tools/audit_v04_original_oval_forward.py \
            --source-xml work/compare/source-oval.xml \
            --native work/compare/camera-native-v04.json \
            --definition-id oval:navy.navwar.niwcatlantic.scc.windows:def:201 \
            --report work/compare/camera-original-forward.json
          for rule in SV-253291 SV-253350; do
            suffix="${rule#SV-}"
            python tools/audit_v04_original_oval_forward.py \
              --source-xml work/compare/source-oval.xml \
              --native "work/compare/$rule-native-v04.json" \
              --definition-id "oval:navy.navwar.niwcatlantic.scc.windows:def:$suffix" \
              --report "work/compare/$rule-original-forward.json"
          done
      - name: Validate independently exported OVAL against pinned 5.12.3 XSD
        run: |
          python tools/validate_v04_oval_5123.py \
            --schema-dir work/oval-5123/oval-schemas \
            --xml work/compare/exported-oval.xml \
            --report work/compare/oval-export-xsd.json
          python tools/validate_v04_oval_5123.py \
            --schema-dir work/oval-5123/oval-schemas \
            --xml work/compare/camera-exported-oval.xml \
            --report work/compare/camera-export-xsd.json
          for rule in SV-253291 SV-253350; do
            python tools/validate_v04_oval_5123.py \
              --schema-dir work/oval-5123/oval-schemas --platform windows \
              --xml "work/compare/$rule-exported-oval.xml" \
              --report "work/compare/$rule-export-xsd.json"
          done
      - name: SHA-bind independent semantic and schema reports per Definition
        run: |
          python tools/combine_v04_oval_xml_proofs.py \
            --semantic work/compare/semantic-roundtrip-result.json \
            --xsd work/compare/oval-export-xsd.json \
            --xsd work/compare/camera-export-xsd.json \
            --xsd work/compare/SV-253291-export-xsd.json \
            --xsd work/compare/SV-253350-export-xsd.json \
            --report work/compare/final-roundtrip-evidence.json
      - name: Verify real exported OVAL semantic mutations are detected
        env:
          PYTHONPATH: tools
        run: |
          python tools/check_v04_oval_xml_mutation_regressions.py \
            --root work/compare \
            --manifest work/compare/roundtrip-manifest.json \
            --report work/compare/real-oval-mutation-regressions.json
      - name: Run original XML through a fresh, independent native 0.4 importer/exporter
        env:
          PYTHONPATH: tools
        run: |
          python tools/run_v04_true_xml_native_xml_pilot.py \
            --original-and-canonical-dir work/compare \
            --oval-schemas work/oval-5123/oval-schemas
          python tools/check_v04_oval_xml_mutation_regressions.py \
            --root work/compare \
            --manifest work/compare/fresh-oval-roundtrip-manifest.json \
            --report work/compare/fresh-oval-mutation-regressions.json
      - name: Publish proof and mismatch diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v04-oval-xml-bluetooth-differential
          path: work/compare/
          if-no-files-found: ignore
