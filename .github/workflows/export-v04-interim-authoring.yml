name: 0.4 interim current RHEL9 and Windows11 authoring

on:
  push:
    branches: [main]
    paths:
      - tools/export_v04_interim_authoring.py
      - .github/workflows/export-v04-interim-authoring.yml
      - tools/research_04_one_grammar_proof.py
      - tools/migrate_v04_enum_selectors.py
      - tools/research_04_native_deep_content_census.py
      - schema/v0.4.0/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 jsonschema
      - name: Download immutable six-STIG 0.3 authoring source
        env:
          GH_TOKEN: \${{ github.token }}
          GH_REPO: \${{ github.repository }}
        run: |
          mkdir -p work
          gh release download v0.3.0-six-stig-typed-operators-5796d016b12f \
            --pattern scap-ng-0.3-six-stig-authoring.zip --dir work
      - name: Write and strictly validate current 0.4 Assessment authoring YAML
        run: |
          PYTHONPATH=tools python tools/export_v04_interim_authoring.py \
            --source-zip work/scap-ng-0.3-six-stig-authoring.zip \
            --output-dir work/preview
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: scap-ng-0.4-current-rhel9-windows11-authoring-preview
          path: work/preview/*
          if-no-files-found: error
          retention-days: 90
