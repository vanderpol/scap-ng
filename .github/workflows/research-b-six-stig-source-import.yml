name: 0.4-B full six-STIG source-accounting gate

on:
  push:
    branches: [main]
    paths:
      - 'tools/research_b_full_corpus_import.py'
      - 'tools/test_research_b_full_corpus_import.py'
      - 'tools/research_b_full_corpus_features.py'
      - 'tools/test_research_b_full_corpus_features.py'
      - 'tools/research_b_source_specimens.py'
      - 'tools/test_research_b_source_specimens.py'
      - 'tools/research_b_six_stream_compiler.py'
      - 'tools/test_research_b_six_stream_compiler.py'
      - 'tools/research_b_source_textfile_lowering.py'
      - 'tools/research_b_source_partition_lowering.py'
      - 'tools/test_research_b_source_partition_lowering.py'
      - 'tools/research_b_source_textfile_state_lowering.py'
      - 'tools/research_b_source_state_evaluator.py'
      - 'tools/test_research_b_source_textfile_state.py'
      - 'tools/research_b_manual_lowering.py'
      - 'tools/research_b_manual_response.py'
      - 'tools/test_research_b_manual_lowering.py'
      - 'tools/research_b_conversion_backlog.py'
      - 'tools/test_research_b_conversion_backlog.py'
      - 'tools/research_b_compiled_ir.py'
      - 'tools/research_native_contract_evaluator.py'
      - '.github/workflows/research-b-six-stig-source-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned fixture parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Negative corpus integrity and shared-assessment reference tests
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_b_full_corpus_import.py
      - name: Validate B-only feature inventory and shared-reference counts
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_b_full_corpus_features.py
      - name: Validate source-backed specimen selection and nonconversion guards
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_b_source_specimens.py
      - name: Verify B conversion census refuses unsupported and manual Assessments
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_b_six_stream_compiler.py
      - name: Test B source-compatible Linux partition acquisition using collected Items
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_b_source_partition_lowering.py
      - name: Test B manual procedure and human-attested result provenance
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_b_manual_lowering.py
      - name: Test B six-STIG blocker census accounting
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_b_conversion_backlog.py
      - name: Test B source State evaluation from captured textfile Items
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_research_b_source_textfile_state.py
      - name: Retrieve immutable published six-STIG authoring source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p work/b-corpus
          gh release download v0.3.0-six-stig-typed-operators-5796d016b12f \
            --pattern scap-ng-0.3-six-stig-authoring.zip --dir work/b-corpus
      - name: Account for every Benchmark Rule and all Assessment choice references
        env:
          PYTHONPATH: tools
        run: |
          python tools/research_b_full_corpus_import.py \
            --authoring-zip work/b-corpus/scap-ng-0.3-six-stig-authoring.zip \
            --output research/requirements-first-language/contract-candidate/corpus/source-accounting.json \
            --markdown research/requirements-first-language/contract-candidate/corpus/source-accounting.md \
            --capsules-output work/b-corpus/nonexecutable-source-capsules.json
      - name: Build B-only source capability and operation inventory for all six streams
        env:
          PYTHONPATH: tools
        run: |
          python tools/research_b_full_corpus_features.py \
            --authoring-zip work/b-corpus/scap-ng-0.3-six-stig-authoring.zip \
            --output research/requirements-first-language/contract-candidate/corpus/feature-inventory.json \
            --markdown research/requirements-first-language/contract-candidate/corpus/feature-inventory.md
      - name: Publish bounded source-backed cases for next B compiler implementation
        env:
          PYTHONPATH: tools
        run: |
          python tools/research_b_source_specimens.py \
            --authoring-zip work/b-corpus/scap-ng-0.3-six-stig-authoring.zip \
            --output-dir research/requirements-first-language/contract-candidate/corpus/source-specimens
      - name: Attempt B conversion on every referenced Assessment in all six STIGs
        env:
          PYTHONPATH: tools
        run: |
          python tools/research_b_six_stream_compiler.py \
            --authoring-zip work/b-corpus/scap-ng-0.3-six-stig-authoring.zip \
            --output research/requirements-first-language/contract-candidate/corpus/conversion-progress.json \
            --markdown research/requirements-first-language/contract-candidate/corpus/conversion-progress.md \
            --research-zip work/b-corpus/scap-ng-0.4-B-research-not-scanner.zip
      - name: Classify unresolved automated Assessment capabilities and semantics
        env:
          PYTHONPATH: tools
        run: |
          python tools/research_b_conversion_backlog.py \
            --authoring-zip work/b-corpus/scap-ng-0.3-six-stig-authoring.zip \
            --output research/requirements-first-language/contract-candidate/corpus/conversion-blockers.json \
            --markdown research/requirements-first-language/contract-candidate/corpus/conversion-blockers.md
      - name: Preserve partial B fixture IR separately from scanner content
        uses: actions/upload-artifact@v4
        with:
          name: research-b-six-stig-partial-fixture-ir-not-scanner
          path: |
            work/b-corpus/scap-ng-0.4-B-research-not-scanner.zip
            research/requirements-first-language/contract-candidate/corpus/conversion-progress.json
            research/requirements-first-language/contract-candidate/corpus/conversion-progress.md
          retention-days: 30
      - name: Preserve full source capsules as temporary CI artifact, not scanner bundles
        uses: actions/upload-artifact@v4
        with:
          name: research-b-nonexecutable-source-capsules
          path: work/b-corpus/nonexecutable-source-capsules.json
          retention-days: 30
      - name: Publish stable corpus accounting pages on GitHub main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git add research/requirements-first-language/contract-candidate/corpus/source-accounting.json
          git add research/requirements-first-language/contract-candidate/corpus/conversion-progress.json
          git add research/requirements-first-language/contract-candidate/corpus/conversion-blockers.json
          git add research/requirements-first-language/contract-candidate/corpus/conversion-blockers.md
          git add research/requirements-first-language/contract-candidate/corpus/conversion-progress.md
          git add research/requirements-first-language/contract-candidate/corpus/source-accounting.md
          git add research/requirements-first-language/contract-candidate/corpus/feature-inventory.json
          git add research/requirements-first-language/contract-candidate/corpus/feature-inventory.md
          git add research/requirements-first-language/contract-candidate/corpus/source-specimens/
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'docs(#237): publish six-STIG B conversion readiness ledger'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
