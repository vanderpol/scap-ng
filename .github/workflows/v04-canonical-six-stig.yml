name: 0.4.0 canonical six-STIG Board authoring package
on:
  push:
    branches: [main]
    paths:
      - 'tools/build_v04_canonical_six_stigs.py'
      - 'tools/audit_v04_authoring_blockers.py'
      - 'tools/test_v04_authoring_blocker_audit.py'
      - 'tools/test_v04_source_schema_registry.py'
      - 'tools/build_v04_residual_review_ledger.py'
      - 'tools/audit_v04_full_schema.py'
      - 'tools/test_v04_all_items_schema.py'
      - 'tools/test_v04_canonical_authoring_guard.py'
      - 'tools/guard_v04_filtered_union_migration.py'
      - 'tools/migrate_v04_oval_proven_direct_filters.py'
      - 'tools/migrate_v04_additional_source_filters.py'
      - 'tools/test_migrate_v04_additional_source_filters.py'
      - 'tools/guard_v04_additional_source_filters.py'
      - 'tools/test_guard_v04_additional_source_filters.py'
      - 'tools/audit_v04_remaining_singletons_oval.py'
      - 'tools/test_audit_v04_remaining_singletons_oval.py'
      - 'tools/test_migrate_v04_oval_proven_direct_filters.py'
      - 'tools/audit_v04_filtered_union_oval_provenance.py'
      - 'tools/test_audit_v04_filtered_union_oval_provenance.py'
      - 'tools/test_guard_v04_filtered_union_migration.py'
      - 'tools/audit_v04_authoring_patterns.py'
      - 'tools/test_audit_v04_authoring_patterns.py'
      - 'tools/audit_v04_synthetic_filter_unions.py'
      - 'tools/v04_canonical_source_ir.py'
      - 'tools/v04_field_requirement.py'
      - 'tools/v04_a_dataflow_index.py'
      - 'tools/test_v04_a_dataflow_index.py'
      - 'tools/test_v04_canonical_source_ir.py'
      - 'tools/test_v04_field_requirement_conversion.py'
      - 'tools/test_v04_source_schema_registry.py'
      - 'tools/v04_canonical_requirement_oracle.py'
      - 'tools/v04_canonical_version_preview.py'
      - 'tools/test_v04_canonical_version_preview.py'
      - 'tools/v04_canonical_unsigned_package.py'
      - 'tools/v04_flat_object_authoring.py'
      - 'tools/test_v04_flat_object_authoring.py'
      - 'schema/v0.4.0/capability-mappings/supported/**'
      - 'tools/test_v04_canonical_unsigned_package.py'
      - 'tools/v04_canonical_signed_source_package.py'
      - 'tools/test_v04_canonical_signed_source_package.py'
      - 'tools/v04_canonical_result_plan.py'
      - 'tools/test_v04_canonical_result_plan.py'
      - 'tools/audit_v04_canonical_result_plans.py'
      - 'tools/verify_v04_signed_source_corpus.py'
      - 'tools/v04_exception_source_oracle.py'
      - 'tools/test_v04_exception_source_oracle.py'
      - 'tools/v04_canonical_requirement_oracle.py'
      - 'tools/test_v04_canonical_requirement_oracle.py'
      - 'schema/v0.4.0/assessment-language.schema.json'
      - 'schema/v0.4.0/assessment.schema.json'
      - 'schema/v0.4.0/capability-common.schema.json'
      - '.github/workflows/v04-canonical-six-stig.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  six-stigs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0 cryptography
      - name: Test 0.4 source Filter-preservation and synthetic-Set guards
        env:
          PYTHONPATH: tools
        run: python tools/test_guard_v04_filtered_union_migration.py
      - name: Test additional 0.4.0 structural anomaly classifications
        env:
          PYTHONPATH: tools
        run: python tools/test_audit_v04_authoring_patterns.py
      - name: Check canonical all-items schema positive and negative fixtures
        run: python tools/test_v04_all_items_schema.py
      - name: Check cross-schema field reference scopes and canonical audit fixtures
        env:
          PYTHONPATH: tools
        run: |
          python tools/test_v04_source_schema_registry.py
          python tools/test_v04_authoring_blocker_audit.py
      - name: Validate unsigned native-package format and tamper rejection fixtures
        env:
          PYTHONPATH: tools
        run: python tools/test_v04_canonical_unsigned_package.py
      - name: Test explicit-trust detached CMS signatures on 0.4 source-only packages
        env:
          PYTHONPATH: tools
        run: |
          command -v openssl
          python tools/test_v04_canonical_signed_source_package.py -v
      - name: Validate exceptional source-family truth model fixtures
        env:
          PYTHONPATH: tools
        run: python tools/test_v04_exception_source_oracle.py
      - name: Obtain immutable source YAML and JSON packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p work
          gh release download v0.4.0-joval-meeting-preview-20261015-r3 --pattern 'scap-ng-v0.4-joval-six-stig-*.zip' --dir work
          echo 'a1837c03133021f4d13814516a91b372f83b03771519f8361398ff1663056fea  work/scap-ng-v0.4-joval-six-stig-json.zip' | sha256sum -c -
          echo '03d64157ee295b81defe6f96cf7a3123410010ef4422d76bf5b7bb3ddbf30c9d  work/scap-ng-v0.4-joval-six-stig-yaml.zip' | sha256sum -c -
      - name: Audit pinned historical r3 JSON source and Rule/Assessment references
        env:
          PYTHONPATH: tools
        run: |
          # Archive is SHA-256 pinned above. Its old object.select/collect
          # source is NOT normative flat-Object 0.4.0 syntax; current native
          # schema is checked on regenerated output in the later strict gate.
          python tools/test_v04_json_authoring_readiness.py \
            --archived-source-only \
            --json-archive work/scap-ng-v0.4-joval-six-stig-json.zip \
            --report work/input-historical-source-report.json
      - name: Build original OVAL Filter provenance before any authoring rewrite
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONPATH: tools
        run: |
          python tools/test_migrate_v04_oval_proven_direct_filters.py
          python tools/test_migrate_v04_additional_source_filters.py
          python tools/test_guard_v04_additional_source_filters.py
          python tools/test_audit_v04_filtered_union_oval_provenance.py
          mkdir -p work/filter-baseline work/oval-source
          gh release download v0.4.0-six-stig-authoring-approved-20261020 \
            --pattern 'scap-ng-0.4.0-six-stigs.json.zip' --dir work/filter-baseline
          echo '5037dc29085ad6a4487133962d9c07b1fbc09c2ce14198011c6bb8f7a7437dcb  work/filter-baseline/scap-ng-0.4.0-six-stigs.json.zip' | sha256sum -c -
          python tools/audit_v04_synthetic_filter_unions.py \
            --archive work/filter-baseline/scap-ng-0.4.0-six-stigs.json.zip \
            --report work/v04-filter-source-census.json --assert-six
          for name in \
            U_Apache_Server_2-4_UNIX_Server_V3R2_STIG_SCAP_1-4_Benchmark-enhancedV2-signed.zip \
            U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip \
            U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip \
            U_MS_Windows_Server_DNS_V2R3_STIG_SCAP_1-4_Benchmark-enhancedV8-signed.zip \
            U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-signed.zip \
            U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-signed.zip
          do
            curl --fail --silent --show-error --location --retry 3 \
              "https://raw.githubusercontent.com/niwc-atlantic/scap-content-library/main/Current/$name" \
              --output "work/oval-source/$name"
          done
          python tools/audit_v04_filtered_union_oval_provenance.py \
            --census work/v04-filter-source-census.json \
            --source-dir work/oval-source \
            --report work/v04-filter-original-oval-proof.json --assert-six
      - name: Build canonical first-pass source for independent 50-Set OVAL provenance
        env:
          PYTHONPATH: tools
        run: |
          python tools/test_audit_v04_remaining_singletons_oval.py
          python tools/build_v04_canonical_six_stigs.py \
            --source work/scap-ng-v0.4-joval-six-stig-json.zip \
            --out work/stage-one.json.zip --manifest work/stage-one-manifest.json \
            --filter-proof work/v04-filter-original-oval-proof.json
          python tools/audit_v04_remaining_singletons_oval.py \
            --archive work/stage-one.json.zip --source-dir work/oval-source \
            --report work/v04-remaining-original-oval-proof.json --assert-six
      - name: Generate twice-source-proven 0.4 authoring and verify exact inverse
        env:
          PYTHONPATH: tools
        run: |
          python tools/build_v04_canonical_six_stigs.py \
            --source work/scap-ng-v0.4-joval-six-stig-json.zip \
            --out work/scap-ng-0.4.0-six-stigs.json.zip --manifest work/json-manifest.json \
            --filter-proof work/v04-filter-original-oval-proof.json \
            --additional-filter-proof work/v04-remaining-original-oval-proof.json
          python tools/build_v04_canonical_six_stigs.py \
            --source work/scap-ng-v0.4-joval-six-stig-yaml.zip \
            --out work/scap-ng-0.4.0-six-stigs.yaml.zip --manifest work/yaml-manifest.json \
            --filter-proof work/v04-filter-original-oval-proof.json \
            --additional-filter-proof work/v04-remaining-original-oval-proof.json
      - name: Independently require only 19 original Test Object Filter changes
        env:
          PYTHONPATH: tools
        run: |
          python tools/guard_v04_additional_source_filters.py \
            --prior work/stage-one.json.zip \
            --current work/scap-ng-0.4.0-six-stigs.json.zip \
            --source-proof work/v04-remaining-original-oval-proof.json \
            --report work/v04-additional-filter-inverse-json.json
          python tools/guard_v04_additional_source_filters.py \
            --prior work/stage-one.json.zip \
            --current work/scap-ng-0.4.0-six-stigs.yaml.zip \
            --source-proof work/v04-remaining-original-oval-proof.json \
            --report work/v04-additional-filter-inverse-yaml.json
      - name: Guard against missing Filters and new synthetic one-operand Sets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONPATH: tools
        run: |
          # Baseline was SHA-256 verified before source-proven conversion.
          python tools/guard_v04_filtered_union_migration.py \
            --baseline-archive work/filter-baseline/scap-ng-0.4.0-six-stigs.json.zip \
            --archive work/scap-ng-0.4.0-six-stigs.json.zip \
            --expected-baseline-candidates 36 \
            --report work/v04-filter-guard-json.json
          python tools/guard_v04_filtered_union_migration.py \
            --baseline-archive work/filter-baseline/scap-ng-0.4.0-six-stigs.json.zip \
            --archive work/scap-ng-0.4.0-six-stigs.yaml.zip \
            --expected-baseline-candidates 36 \
            --report work/v04-filter-guard-yaml.json
      - name: Census other odd authoring structures and reject new redundancies
        env:
          PYTHONPATH: tools
        run: |
          python tools/audit_v04_authoring_patterns.py \
            --baseline-archive work/filter-baseline/scap-ng-0.4.0-six-stigs.json.zip \
            --archive work/scap-ng-0.4.0-six-stigs.json.zip \
            --report work/v04-other-authoring-patterns-json.json --assert-six
          python tools/audit_v04_authoring_patterns.py \
            --baseline-archive work/filter-baseline/scap-ng-0.4.0-six-stigs.json.zip \
            --archive work/scap-ng-0.4.0-six-stigs.yaml.zip \
            --report work/v04-other-authoring-patterns-yaml.json --assert-six
      - name: Preserve other-structure audit even on failed regression
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 0.4-authoring-structure-audit
          path: work/v04-other-authoring-patterns-*.json
          if-no-files-found: ignore
      - name: Preserve Filter regression report even if checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 0.4-filter-migration-gate
          path: work/v04-filter-guard-*.json
          if-no-files-found: ignore
      - name: Apply approved flat-Object migration and prove source reconstruction
        env:
          PYTHONPATH: tools
        run: |
          python tools/test_v04_flat_object_authoring.py
          python tools/v04_flat_object_authoring.py \
            --source-json work/scap-ng-0.4.0-six-stigs.json.zip \
            --candidate-json work/flat-0.4.0-six-stigs.json.zip \
            --candidate-yaml work/flat-0.4.0-six-stigs.yaml.zip \
            --proof work/v04-flat-object-source-inverse.json
          python - <<'PY'
          import json
          from pathlib import Path
          from v04_a_authoring_graph_index import read_authoring_archive
          from v04_flat_object_authoring import restore_document
          root=Path('work')
          old_json=read_authoring_archive(root/'scap-ng-0.4.0-six-stigs.json.zip','json')
          old_yaml=read_authoring_archive(root/'scap-ng-0.4.0-six-stigs.yaml.zip','yaml')
          new_json=read_authoring_archive(root/'flat-0.4.0-six-stigs.json.zip','json')
          new_yaml=read_authoring_archive(root/'flat-0.4.0-six-stigs.yaml.zip','yaml')
          proof=json.loads((root/'v04-flat-object-source-inverse.json').read_text())
          assert len(old_json)==len(old_yaml)==len(new_json)==len(new_yaml)==4001
          assert proof['documents']==4001 and proof['catalog_size']==100
          assert proof['changed_objects']>0 and not proof['native_schema_promoted']
          for name,doc in old_json.items():
              yaml_name=name.removesuffix('.json')+'.yaml'
              assert old_yaml[yaml_name]==doc,('historical source YAML/JSON',name)
              assert new_json[name]==new_yaml[yaml_name],('flat YAML/JSON',name)
              restored=(restore_document(new_json[name],proof['source_inverse'][name])
                        if name in proof['source_inverse'] else new_json[name])
              assert restored==doc,('flat migration changed source',name)
          print('PASS: 4,001 original YAML/JSON and flat YAML/JSON graphs with exact inverse')
          PY
          mv work/flat-0.4.0-six-stigs.json.zip work/scap-ng-0.4.0-six-stigs.json.zip
          mv work/flat-0.4.0-six-stigs.yaml.zip work/scap-ng-0.4.0-six-stigs.yaml.zip
      # Keep source-proven output recoverable even when a downstream validator
      # fails; subsequent diagnostics should not repeat the long conversion.
      - name: Preserve source-proven authoring for failed-run diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: scap-ng-040-six-stig-diagnostic-source
          retention-days: 2
          path: |
            work/scap-ng-0.4.0-six-stigs.json.zip
            work/scap-ng-0.4.0-six-stigs.yaml.zip
            work/json-manifest.json
            work/yaml-manifest.json
          if-no-files-found: error
      - name: Inventory remaining canonical 0.4.0 authoring blockers
        run: |
          python tools/audit_v04_authoring_blockers.py --archive work/scap-ng-0.4.0-six-stigs.yaml.zip --report work/yaml-blocker-audit.json
          python tools/audit_v04_authoring_blockers.py --archive work/scap-ng-0.4.0-six-stigs.json.zip --report work/json-blocker-audit.json
      - name: Enforce canonical 0.4 source-only rejection guards
        run: |
          python tools/test_v04_canonical_authoring_guard.py --archive work/scap-ng-0.4.0-six-stigs.json.zip
          python tools/test_v04_canonical_authoring_guard.py --archive work/scap-ng-0.4.0-six-stigs.yaml.zip
      - name: Preserve full exceptional Test source for semantic differential review
        run: |
          python tools/build_v04_residual_review_ledger.py --archive work/scap-ng-0.4.0-six-stigs.json.zip --out work/residual-219-review-ledger.json
      - name: Verify nine exceptional source requirement families against OVAL generic results
        env:
          PYTHONPATH: tools
        run: |
          python tools/v04_exception_source_oracle.py \
            --ledger work/residual-219-review-ledger.json \
            --report work/v04-exception-source-oracle.json \
            --assert-six
      - name: Diagnose native schema validity across all source documents
        run: |
          python tools/audit_v04_full_schema.py --archive work/scap-ng-0.4.0-six-stigs.json.zip --out work/full-native-schema-audit.json --strict
          python tools/audit_v04_full_schema.py --archive work/scap-ng-0.4.0-six-stigs.yaml.zip --out work/full-native-yaml-schema-audit.json --strict
      - name: Verify canonical 0.4 typed source-IR independently from YAML and JSON
        env:
          PYTHONPATH: tools
        run: |
          python tools/test_v04_a_dataflow_index.py
          python tools/test_v04_canonical_source_ir.py
          python tools/test_v04_field_requirement_conversion.py
          python tools/test_v04_source_schema_registry.py
          python tools/v04_canonical_source_ir.py \
            --json-archive work/scap-ng-0.4.0-six-stigs.json.zip \
            --yaml-archive work/scap-ng-0.4.0-six-stigs.yaml.zip \
            --out-ir work/canonical-typed-source-ir.json \
            --report work/canonical-typed-source-ir-report.json \
            --assert-six
      - name: Compile all canonical 0.4 six-state result expressions without scanner claims
        env:
          PYTHONPATH: tools
        run: |
          python tools/test_v04_canonical_result_plan.py -v
          python tools/audit_v04_canonical_result_plans.py \
            --json-archive work/scap-ng-0.4.0-six-stigs.json.zip \
            --report work/v04-canonical-result-plan-census.json \
            --plans work/v04-canonical-result-plans.json --assert-six-stigs
      - name: Independently verify source-exact six-Benchmark version reconciliation preview
        env:
          PYTHONPATH: tools
        run: |
          python tools/test_v04_canonical_version_preview.py
          python tools/v04_canonical_version_preview.py \
            --json-archive work/scap-ng-0.4.0-six-stigs.json.zip \
            --yaml-archive work/scap-ng-0.4.0-six-stigs.yaml.zip \
            --report work/canonical-benchmark-version-preview.json \
            --assert-six
      - name: Build six deterministic unsigned 0.4.0 native-schema source packages
        env:
          PYTHONPATH: tools
        run: |
          python tools/v04_canonical_unsigned_package.py \
            --json-archive work/scap-ng-0.4.0-six-stigs.json.zip \
            --yaml-archive work/scap-ng-0.4.0-six-stigs.yaml.zip \
            --out-dir work/v04-native-source-packages \
            --report work/v04-native-source-package-report.json \
            --assert-six
      - name: Independently CMS-sign and verify real Windows/Linux 0.4 source packages
        env:
          PYTHONPATH: tools
        run: |
          python tools/verify_v04_signed_source_corpus.py \
            --source-package-dir work/v04-native-source-packages \
            --report work/v04-cms-real-source-proof.json
      - name: Prove source-exact canonical Test axes against pinned OVAL six-state results
        env:
          PYTHONPATH: tools
        run: |
          python tools/test_v04_canonical_requirement_oracle.py
          python tools/v04_canonical_requirement_oracle.py \
            --original-json work/scap-ng-v0.4-joval-six-stig-json.zip \
            --canonical-json work/scap-ng-0.4.0-six-stigs.json.zip \
            --report work/canonical-requirement-oval-oracle.json \
            --filter-proof work/v04-filter-original-oval-proof.json \
            --additional-filter-proof work/v04-remaining-original-oval-proof.json \
            --assert-six
      - name: Confirm equivalent YAML/JSON sources and exact scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('work/json-manifest.json').read_text())
          b=json.loads(Path('work/yaml-manifest.json').read_text())
          assert a['documents']==b['documents']==4001
          assert a['counts']==b['counts']
          assert {p.removesuffix('.json') for p in a['changed_paths']}=={p.removesuffix('.yaml') for p in b['changed_paths']}
          assert a['counts']['all_items_must']>0
          assert a['counts']['inline_capabilities_removed']>0
          assert a['counts']['source_proven_direct_filters']==28
          assert a['counts']['source_linked_additional_direct_filters']==19
          assert a['additional_filter_source_proof_sha256']==b['additional_filter_source_proof_sha256']
          assert a['counts']['source_review_required_unchanged']==8
          assert a['source_filter_proof_sha256']==b['source_filter_proof_sha256']
          assert a['benchmark_version_policy']==b['benchmark_version_policy']=='owner_approved_exact_reachable_0.4_only'
          assert a['counts']['benchmark_version_declarations_updated']==b['counts']['benchmark_version_declarations_updated']==6
          assert a['benchmark_version_changes']==b['benchmark_version_changes']
          print('PASS',a['counts'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scap-ng-040-six-stig-board-authoring
          path: |
            work/scap-ng-0.4.0-six-stigs.json.zip
            work/scap-ng-0.4.0-six-stigs.yaml.zip
            work/*manifest.json
            work/v04-flat-object-source-inverse.json
            work/input-historical-source-report.json
            work/*blocker-audit.json
            work/v04-filter-guard-*.json
            work/v04-other-authoring-patterns-*.json
            work/v04-filter-source-census.json
            work/v04-filter-original-oval-proof.json
            work/v04-remaining-original-oval-proof.json
            work/v04-additional-filter-inverse-*.json
            work/residual-219-review-ledger.json
            work/v04-exception-source-oracle.json
            work/full-native-schema-audit.json
            work/full-native-yaml-schema-audit.json
            work/canonical-typed-source-ir.json
            work/canonical-typed-source-ir-report.json
            work/v04-native-source-packages/*.source-preview.zip
            work/v04-native-source-package-report.json
            work/v04-cms-real-source-proof.json
            work/v04-canonical-result-plan-census.json
            work/v04-canonical-result-plans.json
            work/canonical-benchmark-version-preview.json
            work/canonical-requirement-oval-oracle.json
          if-no-files-found: error
      - name: Publish immutable canonical six-STIG source-only review release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The October 20 source preview predates normative flat Objects.
          # Preserve it byte-for-byte; the current revision receives a
          # separate clearly labeled snapshot only AFTER all CI gates pass.
          tag='v0.4.0-six-stig-canonical-flat-authoring-20261021'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Immutable canonical source preview already published: $tag"
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('work')
          ir=json.loads((root/'canonical-typed-source-ir-report.json').read_text())
          packages=json.loads((root/'v04-native-source-package-report.json').read_text())
          oracle=json.loads((root/'canonical-requirement-oval-oracle.json').read_text())
          assert ir['documents']==4001 and ir['tests']==1375
