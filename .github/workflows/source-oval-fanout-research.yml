name: Source OVAL fanout research

on:
  push:
    paths:
      - tools/measure_split_source_fanout.py
      - .github/workflows/source-oval-fanout-research.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  NIWC_REVISION: 8c8e5dff860af6b1290ee9273a282db24278f8d5

jobs:
  measure:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: rhel9
            label: RHEL 9
            artifact: U_RHEL_9_V2R9_STIG_SCAP_1-4_Benchmark-enhancedV13-signed.zip
          - key: oracle-linux9
            label: Oracle Linux 9
            artifact: U_Oracle_Linux_9_V1R4_STIG_SCAP_1-4_Benchmark-enhancedV5-signed.zip
          - key: windows11
            label: Windows 11
            artifact: U_MS_Windows_11_V2R10_STIG_SCAP_1-4_Benchmark-enhancedV18-signed.zip
          - key: windows-server-2025
            label: Windows Server 2025
            artifact: U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip
          - key: apache24
            label: Apache 2.4 UNIX Server
            artifact: U_Apache_Server_2-4_UNIX_Server_V3R2_STIG_SCAP_1-4_Benchmark-enhancedV2-signed.zip
          - key: tomcat9
            label: Apache Tomcat 9
            artifact: U_Apache_Tomcat_Application_Server_9_V3R4_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip
    steps:
      - uses: actions/checkout@v4
        with:
          path: scap-ng
      - uses: actions/checkout@v4
        with:
          repository: niwc-atlantic/scap-content-library
          ref: ${{ env.NIWC_REVISION }}
          path: niwc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check lxml==6.1.1
      - name: Split authoritative source
        env:
          ARTIFACT: ${{ matrix.artifact }}
          KEY: ${{ matrix.key }}
        run: |
          python scap-ng/tools/scap14_rule_splitter.py "niwc/Current/$ARTIFACT" \
            --output-dir "work/split-$KEY" \
            --schema scap-ng/third_party/scap-1.4-schemas/omni-schema.xsd \
            --source-revision "$NIWC_REVISION" \
            --source-repository-path "Current/$ARTIFACT" \
            --benchmark-key "$KEY" \
            --fail-on-unresolved
      - name: Measure source fanout
        env:
          KEY: ${{ matrix.key }}
          LABEL: ${{ matrix.label }}
        run: |
          python scap-ng/tools/measure_split_source_fanout.py "work/split-$KEY" \
            --output "work/$KEY.source-fanout.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("work")/(os.environ["KEY"]+".source-fanout.json")
          d=json.loads(p.read_text())
          d["label"]=os.environ["LABEL"]
          p.write_text(json.dumps(d,indent=2,sort_keys=True)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: source-oval-fanout-${{ matrix.key }}
          path: work/*.source-fanout.json
          if-no-files-found: error

  aggregate:
    needs: measure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: source-oval-fanout-*
          path: reports
      - name: Aggregate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          reports=[json.loads(p.read_text()) for p in sorted(Path("reports").rglob("*.source-fanout.json"))]
          out={
            "format":"scap-ng-source-oval-fanout-aggregate-0.1",
            "status":"research_only_not_accepted_design",
            "benchmarks":[],
            "totals":{
              "split_valid_rules":0,
              "objects_unique_source_ids":0,
              "objects_split_occurrences":0,
              "objects_shared_source_ids":0,
              "objects_split_duplicate_occurrences":0,
              "variables_unique_source_ids":0,
              "variables_split_occurrences":0,
              "variables_shared_source_ids":0,
              "variables_split_duplicate_occurrences":0,
            },
          }
          for r in reports:
            o=r["kinds"]["objects"]; v=r["kinds"]["variables"]
            row={
              "label":r["label"],
              "benchmark_key":r["benchmark_key"],
              "split_valid_rules":r["split_valid_rules"],
              "objects":{
                "unique_source_ids":o["unique_source_ids"],
                "split_occurrences":o["split_occurrences"],
                "shared_source_ids":o["same_source_ids_shared_across_rules"],
                "split_duplicate_occurrences":o["duplicate_occurrences_from_rule_splitting"],
                "max_rule_fanout":o["max_rule_fanout"],
              },
              "variables":{
                "unique_source_ids":v["unique_source_ids"],
                "split_occurrences":v["split_occurrences"],
                "shared_source_ids":v["same_source_ids_shared_across_rules"],
                "split_duplicate_occurrences":v["duplicate_occurrences_from_rule_splitting"],
                "max_rule_fanout":v["max_rule_fanout"],
              },
            }
            out["benchmarks"].append(row)
            t=out["totals"]
            t["split_valid_rules"]+=row["split_valid_rules"]
            for kind,data in (("objects",row["objects"]),("variables",row["variables"])):
              t[f"{kind}_unique_source_ids"]+=data["unique_source_ids"]
              t[f"{kind}_split_occurrences"]+=data["split_occurrences"]
              t[f"{kind}_shared_source_ids"]+=data["shared_source_ids"]
              t[f"{kind}_split_duplicate_occurrences"]+=data["split_duplicate_occurrences"]
          Path("source-oval-fanout-aggregate.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: source-oval-fanout-aggregate
          path: source-oval-fanout-aggregate.json
